# Overview article (ADR 0007). Mainstream facts only; this is the Aroer "before Rabbah" on the Ammonite border, not Aroer on the Arnon or Aroer in the Negev; the site is unknown and the doubt about a separate town is noted.
id: aroer-ammon
place: af74969
title:
  en: "Aroer near Rabbah"
  ru: "Ароер близ Раввы"
  uk: "Ароер біля Рабби"
  es: "Aroer cerca de Rabá"
  pt: "Aroer perto de Rabá"
  de: "Aroër bei Rabba"
  fr: "Aroër près de Rabba"
  it: "Aroer presso Rabba"
  pl: "Aroer koło Rabby"
  nl: "Aroër bij Rabba"
  cs: "Aroer u Rabby"
  sv: "Aroer vid Rabba"
  nb: "Aroer ved Rabba"
  tl: "Aroer malapit sa Rabba"
body:
  en:
    - "At least three places in the Bible are called Aroer: the town on the edge of the Arnon gorge that Mesha, king of Moab, rebuilt; a town in the Negev of Judah; and this one, in Gilead on the frontier of Ammon. Joshua gives it as the limit of Gad's inheritance: “Jazer, and all the cities of Gilead, and half the land of the children of Ammon, unto Aroer that is before Rabbah”. When Jephthah defeated the Ammonites he “smote them from Aroer, even till thou come to Minnith, even twenty cities”; since the war was with Ammon, many take that Aroer to be this one, though others think of the Arnon."
    - "Where it stood is not known. Rabbah is Amman, so the town is sought among ruins near it, such as Umm es-Sweiwineh to the south of the old citadel or Khirbet Udena to the west; nothing excavated bears the name. Today the ground is the suburbs of Amman."
  ru:
    - "Ароером в Библии зовутся по меньшей мере три места: город на краю ущелья Арнона, который отстроил Меса, царь Моавитский; город в Негеве Иудином; и этот, в Галааде на границе Аммона. Книга Иисуса Навина даёт его пределом удела Гада: «Иазер и все города Галаадские, и половина земли сынов Аммоновых до Ароера, что пред Раввою». Разбив Аммонитян, Иеффай поразил их «от Ароера до Минифа двадцать городов»; поскольку война шла с Аммоном, многие считают тот Ароер этим, хотя другие думают об арнонском."
    - "Где он стоял, неизвестно. Равва — это Амман, поэтому город ищут среди развалин поблизости, таких как Умм-эс-Сувейвине к югу от старой цитадели или Хирбет-Удена к западу; ничто раскопанное не носит этого имени. Сегодня эта земля — пригороды Аммана."
  uk:
    - "У Біблії щонайменше три місця називаються Ароер: місто на краю ущелини Арнону, яке відбудував Меша, цар Моава; місто в Негеві Юди; і це, в Гілеаді на кордоні Аммона. Ісус Навин подає його як межу спадщини Гада: «Язер і всї міста Галаадські, та половина землї Аммонїйської до Ароера, що стоїть на захід сонця від Рабби». Коли Єфтай переміг аммонітян, «побив він їх страшенно, від Ароера до Минита двайцять міст»; оскільки війна була з Аммоном, багато хто вважає, що це саме цей Ароер, хоч інші думають про Арнон."
    - "Де він стояв, невідомо. Равва — це Амман, тож місто шукають серед руїн поблизу, таких як Умм-ес-Сувейвіне на південь від старої цитаделі чи Хірбет-Удена на захід; ніщо розкопане не носить цієї назви. Нині ця місцевість — передмістя Аммана."
  es:
    - "Al menos tres lugares de la Biblia se llaman Aroer: la ciudad al borde de la garganta del Arnón que reconstruyó Mesa, rey de Moab; una ciudad en el Néguev de Judá; y esta, en Galaad, en la frontera de Amón. Josué la da como límite de la heredad de Gad: «Jacer, y todas las ciudades de Galaad, y la mitad de la tierra de los hijos de Ammón hasta Aroer, que está delante de Rabba». Cuando Jefté derrotó a los amonitas, «los hirió de grandísimo estrago desde Aroer hasta llegar á Minnith, veinte ciudades»; como la guerra era con Amón, muchos piensan que ese Aroer es este, aunque otros piensan en el Arnón."
    - "No se sabe dónde estuvo. Rabá es Amán, de modo que la ciudad se busca entre las ruinas cercanas, como Umm es-Sweiwineh, al sur de la antigua ciudadela, o Khirbet Udena, al oeste; nada de lo excavado lleva el nombre. Hoy el terreno son los suburbios de Amán."
  pt:
    - "Pelo menos três lugares na Bíblia se chamam Aroer: a cidade à beira do desfiladeiro do Arnom que Mesa, rei de Moabe, reconstruiu; uma cidade no Neguebe de Judá; e esta, em Gileade, na fronteira de Amom. Josué a dá como limite da herança de Gade: “Jazer, e todas as cidades de Gileade, e metade da terra dos filhos de Amom, até Aroer, que está perto de Rabá”. Quando Jefté derrotou os amonitas, “os feriu com grande matança, desde Aroer até chegar a Minite, num total de vinte cidades”; como a guerra era com Amom, muitos tomam essa Aroer por esta, embora outros pensem na do Arnom."
    - "Onde ficava não se sabe. Rabá é Amã, de modo que a cidade é procurada entre ruínas próximas, como Umm es-Sweiwineh, ao sul da antiga cidadela, ou Khirbet Udena, a oeste; nada do que foi escavado traz o nome. Hoje o terreno são os subúrbios de Amã."
  de:
    - "Mindestens drei Orte in der Bibel heißen Aroër: die Stadt am Rand der Arnonschlucht, die Mesa, der König von Moab, wieder aufbaute; eine Stadt im Negev von Juda; und diese hier, in Gilead an der Grenze zu Ammon. Josua nennt sie als Grenze von Gads Erbteil: „Jaser und alle Städte in Gilead und das halbe Land der Kinder Ammon bis gen Aroer, welches liegt vor Rabba“. Als Jeftah die Ammoniter besiegte, „schlug er sie von Aroer an, bis wo man kommt gen Minnith, zwanzig Städte“; da der Krieg mit Ammon war, nehmen viele dieses Aroër an, wenn auch andere an den Arnon denken."
    - "Wo es lag, ist nicht bekannt. Rabba ist Amman, daher wird die Stadt in Ruinen in ihrer Nähe gesucht, etwa Umm es-Sweiwine südlich der alten Zitadelle oder Chirbet Udena im Westen; nichts Ausgegrabenes trägt den Namen. Heute ist das Gelände Vorort von Amman."
  fr:
    - "Au moins trois lieux de la Bible s’appellent Aroër : la ville au bord de la gorge de l’Arnon que Mescha, roi de Moab, rebâtit ; une ville du Négev de Juda ; et celle-ci, en Galaad, à la frontière d’Ammon. Josué la donne comme limite de l’héritage de Gad : « Jaezer, toutes les villes de Galaad, la moitié du pays des enfants d’Ammon jusqu’à Aroër vis-à-vis de Rabba ». Quand Jephté battit les Ammonites, il leur fit éprouver une très grande défaite, « depuis Aroër jusque vers Minnith, espace qui renfermait vingt villes » ; la guerre étant contre Ammon, beaucoup tiennent cette Aroër pour celle-ci, quoique d’autres pensent à l’Arnon."
    - "On ignore où elle se trouvait. Rabba étant Amman, la ville est cherchée parmi les ruines voisines, comme Umm es-Sweiwineh au sud de l’ancienne citadelle ou Khirbet Udena à l’ouest ; rien de ce qui a été fouillé ne porte le nom. Aujourd’hui le terrain est la banlieue d’Amman."
  it:
    - "Almeno tre luoghi nella Bibbia si chiamano Aroer: la città sul margine della gola dell’Arnon che Mesa, re di Moab, ricostruì; una città nel Negheb di Giuda; e questa, in Galaad al confine di Ammon. Giosuè la dà come limite dell’eredità di Gad: «Iaezer, tutte le città di Galaad, la metà del paese dei figliuoli di Ammon fino ad Aroer che è dirimpetto a Rabba». Quando Iefte sconfisse gli Ammoniti «inflisse loro una grandissima sconfitta, da Aroer fin verso Minnith, prendendo loro venti città»; poiché la guerra era con Ammon, molti ritengono che quell’Aroer sia questa, benché altri pensino all’Arnon."
    - "Dove sorgesse non si sa. Rabba è Amman, così la città si cerca tra le rovine vicine, come Umm es-Sweiwineh a sud dell’antica cittadella o Khirbet Udena a ovest; nulla di ciò che è stato scavato porta il nome. Oggi il terreno è la periferia di Amman."
  pl:
    - "W Biblii są co najmniej trzy miejsca zwane Aroer: miasto na skraju wąwozu Arnonu, które odbudował Mesza, król Moabu; miasto w Negewie Judy; i to, w Gileadzie na pograniczu Ammonu. Jozue podaje je jako kres dziedzictwa Gada: „Jazer i wszystkie miasta Galaad, i połowa ziemi synów Ammonowych aż do Aroer, które jest przeciw Rabba”. Gdy Jefte pokonał Ammonitów, „poraził je od Aroer aż idąc do Menit, dwadzieścia miast”; ponieważ wojna toczyła się z Ammonem, wielu uważa Aroer z tego opowiadania za to, o którym tu mowa, choć inni myślą o Arnonie."
    - "Gdzie leżało, nie wiadomo. Rabba to Amman, więc miasta szuka się wśród pobliskich ruin, takich jak Umm es-Sweiwineh na południe od dawnej cytadeli lub Chirbet Udena na zachodzie; nic wykopanego nie nosi tej nazwy. Dziś teren to przedmieścia Ammanu."
  nl:
    - "Ten minste drie plaatsen in de Bijbel heten Aroër: de stad aan de rand van de Arnonkloof die Mesa, koning van Moab, herbouwde; een stad in de Negev van Juda; en deze, in Gilead aan de grens van Ammon. Jozua geeft haar als grens van Gads erfdeel: “Jaezer, en al de steden van Gilead, en het halve land der kinderen Ammons, tot Aroer toe, die voor aan Rabba is”. Toen Jefta de Ammonieten versloeg: “En hij sloeg hen van Aroer af tot daar gij komt te Minnith, twintig steden”; omdat de oorlog met Ammon was, houden velen dat Aroër voor deze, al denken anderen aan de Arnon."
    - "Waar zij stond, is niet bekend. Rabba is Amman, dus de stad wordt gezocht onder ruïnes in de buurt, zoals Umm es-Sweiwineh ten zuiden van de oude citadel of Khirbet Udena in het westen; niets wat is opgegraven draagt de naam. Het terrein is nu de buitenwijken van Amman."
  cs:
    - "V Bibli se jmenují nejméně tři místa Aroer: město na okraji soutěsky Arnonu, které přestavěl Meša, král Moábu; město v judském Negevu; a toto, v Gileadu na hranici Amónu. Jozue je uvádí jako hranici dědictví Gádova: „A bylo jejich pomezí Jazer i všecka města Galád, a polovice země synů Ammon až do Aroer, kteréž jest naproti Rabba“. Když Jiftách porazil Amónovce, „pobil je od Aroer, až kudy se jde do Mennit, dvadceti měst“; protože válka byla s Amónem, mnozí pokládají ten Aroer za tento, ač jiní myslí na Arnon."
    - "Kde stál, není známo. Rabba je Ammán, a proto se město hledá mezi blízkými zříceninami, jako Umm es-Sweiwineh jižně od staré citadely nebo Chirbet Udena na západě; nic vykopaného jméno nenese. Dnes je to půda předměstí Ammánu."
  sv:
    - "Minst tre platser i Bibeln kallas Aroer: staden vid kanten av Arnonklyftan som Mesha, Moabs kung, byggde upp; en stad i Judas Negev; och denna, i Gilead vid Ammons gräns. Josua anger den som gräns för Gads arvedel: ”Jaeser och alla städer i Gilead och hälften av Ammons barns land, ända till det Aroer som ligger gent emot Rabba”. När Jefta besegrade ammoniterna ”intog landet från Aroer ända till fram emot Minnit, tjugu städer”; eftersom kriget gällde Ammon anser många att det Aroer är detta, fastän andra tänker på Arnon."
    - "Var det låg är inte känt. Rabba är Amman, så staden söks bland ruiner i dess närhet, såsom Umm es-Sweiwineh söder om den gamla citadellen eller Khirbet Udena i väster; inget som grävts ut bär namnet. I dag är marken Ammans förorter."
  nb:
    - "Minst tre steder i Bibelen heter Aroer: byen i kanten av Arnon-kløften som Mesa, konge av Moab, gjenreiste; en by i Negev i Juda; og denne, i Gilead på grensen til Ammon. Josva oppgir den som grensen for Gads arv: «Jaser og alle byene i Gilead og halvdelen av Ammons barns land helt til Aroer, som ligger midt imot Rabba». Da Jefta beseiret ammonittene, «slo» han «dem og tok fra dem landet fra Aroer til bortimot Minnit, tyve byer»; siden krigen var med Ammon, regner mange den Aroer for å være denne, selv om andre tenker på Arnon."
    - "Hvor den lå, er ukjent. Rabba er Amman, så byen søkes blant ruiner i nærheten, som Umm es-Sweiwineh sør for det gamle citadellet eller Khirbet Udena mot vest; ingenting som er gravd ut, bærer navnet. I dag er stedet forsteder til Amman."
  tl:
    - "Hindi bababa sa tatlong lugar sa Biblia ang tinatawag na Aroer: ang bayan sa gilid ng bangin ng Arnon na muling itinayo ni Mesa, hari ng Moab; isang bayan sa Negev ng Juda; at ang isang ito, sa Gilead sa hangganan ng Ammon. Ibinibigay ito ni Josue bilang hangganan ng mana ni Gad: “ang Jacer, at ang lahat na bayan ng Galaad, at ang kalahati ng lupain ng mga anak ni Ammon hanggang sa Aroer na nasa tapat ng Rabba”. Nang talunin ni Jephte ang mga Ammonita, “sila'y sinaktan niya ng di kawasang pagpatay mula sa Aroer hanggang sa Minnith, na may dalawang pung bayan”; yamang kay Ammon ang digmaan, itinuturing ng marami na ito ang Aroer na iyon, bagaman iniisip ng iba ang Arnon."
    - "Hindi alam kung saan ito nakatayo. Ang Rabba ay Amman, kaya hinahanap ang bayan sa mga guho malapit dito, gaya ng Umm es-Sweiwineh sa timog ng lumang kuta o Khirbet Udena sa kanluran; walang nahukay na may ganitong pangalan. Ang lupa ay mga karatig-bayan ng Amman ngayon."
