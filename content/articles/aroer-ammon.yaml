body:
  en:
    - "Three places in the Bible are called Aroer: the town on the edge of the Arnon gorge that Mesha, king of Moab, rebuilt; a town in the Negev of Judah; and this one, in Gilead on the frontier of Ammon. Joshua gives it as the limit of Gad's inheritance: “Jazer, and all the cities of Gilead, and half the land of the children of Ammon, unto Aroer that is before Rabbah”. When Jephthah defeated the Ammonites he “smote them from Aroer, even till thou come to Minnith, even twenty cities”; since the war was with Ammon, most take that Aroer to be this one, though some think of the Arnon."
    - "Where it stood is not known. Rabbah is Amman, so the town is sought in the ruins west of the modern city, such as Umm es-Sweiwineh or Khirbet Udena; nothing excavated bears the name. Today the ground is the suburbs of Amman."
  ru:
    - "Ароером в Библии зовутся три места: город на краю ущелья Арнона, который отстроил Меса, царь Моавитский; город в Негеве Иудином; и этот, в Галааде на границе Аммона. Книга Иисуса Навина даёт его пределом удела Гада: «Иазер и все города Галаадские, и половина земли сынов Аммоновых до Ароера, что пред Раввою». Разбив Аммонитян, Иеффай поразил их «от Ароера до Минифа двадцать городов»; поскольку война шла с Аммоном, большинство считает тот Ароер этим, хотя некоторые думают об арнонском."
    - "Где он стоял, неизвестно. Равва — это Амман, поэтому город ищут в развалинах к западу от нынешней столицы, таких как Умм-эс-Сувейвине или Хирбет-Удена; ничто раскопанное не носит этого имени. Сегодня эта земля — пригороды Аммана."
  uk:
    - "У Біблії три місця називаються Ароер: місто на краю ущелини Арнону, яке відбудував Меша, цар Моава; місто в Негеві Юди; і це, в Гілеаді на кордоні Аммона. Ісус Навин подає його як межу спадщини Гада: «Язер і всї міста Галаадські, та половина землї Аммонїйської до Ароера, що стоїть на захід сонця від Рабби». Коли Єфтай переміг аммонітян, «побив він їх страшенно, від Ароера до Минита двайцять міст»; оскільки війна була з Аммоном, більшість вважає, що це саме цей Ароер, хоч дехто думає про Арнон."
    - "Де він стояв, невідомо. Равва — це Амман, тож місто шукають серед руїн на захід від сучасного міста, таких як Умм-ес-Сувейвіне чи Хірбет-Удена; ніщо розкопане не носить цієї назви. Нині ця місцевість — передмістя Аммана."
  es:
    - "Tres lugares de la Biblia se llaman Aroer: la ciudad al borde de la garganta del Arnón que reconstruyó Mesa, rey de Moab; una ciudad en el Néguev de Judá; y esta, en Galaad, en la frontera de Amón. Josué la da como límite de la heredad de Gad: «Jacer, y todas las ciudades de Galaad, y la mitad de la tierra de los hijos de Ammón hasta Aroer, que está delante de Rabba». Cuando Jefté derrotó a los amonitas, «los hirió de grandísimo estrago desde Aroer hasta llegar á Minnith, veinte ciudades»; como la guerra era con Amón, la mayoría piensa que ese Aroer es este, aunque algunos piensan en el Arnón."
    - "No se sabe dónde estuvo. Rabá es Amán, de modo que la ciudad se busca en las ruinas al oeste de la ciudad moderna, como Umm es-Sweiwineh o Khirbet Udena; nada de lo excavado lleva el nombre. Hoy el terreno son los suburbios de Amán."
  pt:
    - "Três lugares na Bíblia se chamam Aroer: a cidade à beira do desfiladeiro do Arnom que Mesa, rei de Moabe, reconstruiu; uma cidade no Neguebe de Judá; e esta, em Gileade, na fronteira de Amom. Josué a dá como limite da herança de Gade: “Jazer, e todas as cidades de Gileade, e metade da terra dos filhos de Amom, até Aroer, que está perto de Rabá”. Quando Jefté derrotou os amonitas, “os feriu com grande matança, desde Aroer até chegar a Minite, num total de vinte cidades”; como a guerra era com Amom, a maioria toma essa Aroer por esta, embora alguns pensem na do Arnom."
    - "Onde ficava não se sabe. Rabá é Amã, de modo que a cidade é procurada nas ruínas a oeste da cidade moderna, como Umm es-Sweiwineh ou Khirbet Udena; nada do que foi escavado traz o nome. Hoje o terreno são os subúrbios de Amã."
  de:
    - "Drei Orte in der Bibel heißen Aroër: die Stadt am Rand der Arnonschlucht, die Mesa, der König von Moab, wieder aufbaute; eine Stadt im Negev von Juda; und diese hier, in Gilead an der Grenze zu Ammon. Josua nennt sie als Grenze von Gads Erbteil: „Jaser und alle Städte in Gilead und das halbe Land der Kinder Ammon bis gen Aroer, welches liegt vor Rabba“. Als Jeftah die Ammoniter besiegte, „schlug er sie von Aroer an, bis wo man kommt gen Minnith, zwanzig Städte“; da der Krieg mit Ammon war, nehmen die meisten dieses Aroër an, wenn auch manche an den Arnon denken."
    - "Wo es lag, ist nicht bekannt. Rabba ist Amman, daher wird die Stadt in den Ruinen westlich der modernen Stadt gesucht, etwa Umm es-Sweiwine oder Chirbet Udena; nichts Ausgegrabenes trägt den Namen. Heute ist das Gelände Vorort von Amman."
  fr:
    - "Trois lieux de la Bible s’appellent Aroër : la ville au bord de la gorge de l’Arnon que Mescha, roi de Moab, rebâtit ; une ville du Négev de Juda ; et celle-ci, en Galaad, à la frontière d’Ammon. Josué la donne comme limite de l’héritage de Gad : « Jaezer, toutes les villes de Galaad, la moitié du pays des enfants d’Ammon jusqu’à Aroër vis-à-vis de Rabba ». Quand Jephté battit les Ammonites, il leur fit éprouver une très grande défaite, « depuis Aroër jusque vers Minnith, espace qui renfermait vingt villes » ; la guerre étant contre Ammon, la plupart tiennent cette Aroër pour celle-ci, quoique certains pensent à l’Arnon."
    - "On ignore où elle se trouvait. Rabba étant Amman, la ville est cherchée dans les ruines à l’ouest de la ville moderne, comme Umm es-Sweiwineh ou Khirbet Udena ; rien de ce qui a été fouillé ne porte le nom. Aujourd’hui le terrain est la banlieue d’Amman."
  it:
    - "Tre luoghi nella Bibbia si chiamano Aroer: la città sul margine della gola dell’Arnon che Mesa, re di Moab, ricostruì; una città nel Negheb di Giuda; e questa, in Galaad al confine di Ammon. Giosuè la dà come limite dell’eredità di Gad: «Iaezer, tutte le città di Galaad, la metà del paese dei figliuoli di Ammon fino ad Aroer che è dirimpetto a Rabba». Quando Iefte sconfisse gli Ammoniti «inflisse loro una grandissima sconfitta, da Aroer fin verso Minnith, prendendo loro venti città»; poiché la guerra era con Ammon, i più ritengono che quell’Aroer sia questa, benché alcuni pensino all’Arnon."
    - "Dove sorgesse non si sa. Rabba è Amman, così la città si cerca nelle rovine a ovest della città moderna, come Umm es-Sweiwineh o Khirbet Udena; nulla di ciò che è stato scavato porta il nome. Oggi il terreno è la periferia di Amman."
  pl:
    - "W Biblii są trzy miejsca zwane Aroer: miasto na skraju wąwozu Arnonu, które odbudował Mesza, król Moabu; miasto w Negewie Judy; i to, w Gileadzie na pograniczu Ammonu. Jozue podaje je jako kres dziedzictwa Gada: „Jazer i wszystkie miasta Galaad, i połowa ziemi synów Ammonowych aż do Aroer, które jest przeciw Rabba”. Gdy Jefte pokonał Ammonitów, „poraził je od Aroer aż idąc do Menit, dwadzieścia miast”; ponieważ wojna toczyła się z Ammonem, większość uważa Aroer z tego opowiadania za to, o którym tu mowa, choć niektórzy myślą o Arnonie."
    - "Gdzie leżało, nie wiadomo. Rabba to Amman, więc miasta szuka się w ruinach na zachód od współczesnego miasta, takich jak Umm es-Sweiwineh lub Chirbet Udena; nic wykopanego nie nosi tej nazwy. Dziś teren to przedmieścia Ammanu."
  nl:
    - "Drie plaatsen in de Bijbel heten Aroër: de stad aan de rand van de Arnonkloof die Mesa, koning van Moab, herbouwde; een stad in de Negev van Juda; en deze, in Gilead aan de grens van Ammon. Jozua geeft haar als grens van Gads erfdeel: “Jaezer, en al de steden van Gilead, en het halve land der kinderen Ammons, tot Aroer toe, die voor aan Rabba is”. Toen Jefta de Ammonieten versloeg: “En hij sloeg hen van Aroer af tot daar gij komt te Minnith, twintig steden”; omdat de oorlog met Ammon was, houden de meesten dat Aroër voor deze, al denken sommigen aan de Arnon."
    - "Waar zij stond, is niet bekend. Rabba is Amman, dus de stad wordt gezocht in de ruïnes ten westen van de moderne stad, zoals Umm es-Sweiwineh of Khirbet Udena; niets wat is opgegraven draagt de naam. Het terrein is nu de buitenwijken van Amman."
  cs:
    - "V Bibli se jmenují tři místa Aroer: město na okraji soutěsky Arnonu, které přestavěl Meša, král Moábu; město v judském Negevu; a toto, v Gileadu na hranici Amónu. Jozue je uvádí jako hranici dědictví Gádova: „A bylo jejich pomezí Jazer i všecka města Galád, a polovice země synů Ammon až do Aroer, kteréž jest naproti Rabba“. Když Jiftách porazil Amónovce, „pobil je od Aroer, až kudy se jde do Mennit, dvadceti měst“; protože válka byla s Amónem, většina pokládá ten Aroer za tento, ač někteří myslí na Arnon."
    - "Kde stál, není známo. Rabba je Ammán, a proto se město hledá v zříceninách západně od moderního města, jako Umm es-Sweiwineh nebo Chirbet Udena; nic vykopaného jméno nenese. Dnes je to půda předměstí Ammánu."
