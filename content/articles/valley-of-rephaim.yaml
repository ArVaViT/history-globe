# Overview article (ADR 0007). Mainstream facts only; the valley is the one south-west of Jerusalem by common consent; the identity of the "mulberry trees" is left open.
id: valley-of-rephaim
place: a7559e6
title:
  en: "Valley of Rephaim"
  ru: "Долина Рефаимов"
body:
  en:
    - "The Valley of Rephaim is the broad, shallow valley that opens south-west of Jerusalem, from the high ground beyond the valley of Hinnom down towards the road to Bethlehem and the hills; the modern Emek Refaim street runs along it through the German Colony to the old railway station. The border of Judah and Benjamin climbed from Hinnom “to the top of the mountain that lieth before the valley of Hinnom westward, which is at the end of the valley of the giants northward”: the King James Version translates Rephaim as giants, for the Rephaim were the giant peoples of old whom Chedorlaomer smote and whom Moab called Emims. The valley was corn land, and Isaiah pictures a thin remnant “as he that gathereth ears in the valley of Rephaim”."
    - "When the Philistines heard that David had been made king over all Israel they “came and spread themselves in the valley of Rephaim”. David asked the Lord, went up and broke them at Baal-perazim: “The LORD hath broken forth upon mine enemies before me, as the breach of waters”; the Philistines left their idols, and David's men burned them. They came up again and spread in the same valley; this time David was told to go round behind them and wait for “the sound of a going in the tops of the mulberry trees”, and he smote them “from Geba until thou come to Gazer”. The valley is also the setting of the story of the three mighty men: while “the troop of the Philistines pitched in the valley of Rephaim” and their garrison held Bethlehem, they broke through to draw David water from the well of Bethlehem, which he poured out to the Lord."
    - "Josephus retells David's two victories here. The valley's upper part was built over in the late nineteenth century: German Templers founded the German Colony in 1873, the Jaffa–Jerusalem railway reached the station at its head in 1892, and the Baka and Katamon quarters followed. Today the station is the First Station leisure centre, the German Colony a street of cafés, and the lower valley, Malha, holds the Jerusalem zoo and the city's stadium."
  ru:
    - "Долина Рефаимов — широкая пологая долина, открывающаяся к юго-западу от Иерусалима, от возвышенности за долиной Еннома вниз к дороге на Вифлеем и к холмам; нынешняя улица Эмек-Рефаим идёт по ней через Немецкую колонию к старому вокзалу. Граница Иуды и Вениамина поднималась от Еннома «на вершину горы, которая к западу против долины Енномовой, которая на краю долины Рефаимов к северу». Библия короля Иакова переводит «Рефаимы» как «исполины», ибо Рефаимы были древними народами великанов, которых поразил Кедорлаомер и которых Моавитяне звали Эмимами. Долина была хлебной, и Исаия рисует скудный остаток так: «когда соберут колосья в долине Рефаимской»."
    - "Когда Филистимляне услышали, что Давида помазали на царство над всем Израилем, они «пришли и расположились в долине Рефаим». Давид вопросил Господа, вышел и разбил их у Ваал-Перацима: «Господь разнес врагов моих предо мною, как разносит вода»; Филистимляне оставили своих истуканов, и люди Давида сожгли их. Они пришли опять и расположились в той же долине; на этот раз Давиду было велено зайти им с тыла и ждать «шум как бы идущего по вершинам тутовых дерев», и он поразил их «от Гаваи до Газера». Долина же — место рассказа о трёх храбрых: когда «толпы Филистимлян стояли в долине Рефаимов», а их отряд держал Вифлеем, трое пробились, чтобы принести Давиду воды из колодезя Вифлеемского, и он вылил её пред Господом."
    - "Иосиф Флавий пересказывает обе победы Давида здесь. Верхнюю часть долины застроили в конце XIX века: немецкие темплеры основали Немецкую колонию в 1873 году, железная дорога Яффа — Иерусалим дошла до вокзала в её верховье в 1892-м, затем выросли кварталы Бака и Катамон. Сегодня вокзал — центр досуга «Первая станция», Немецкая колония — улица кафе, а в нижней части долины, Малхе, стоят иерусалимский зоопарк и городской стадион."
