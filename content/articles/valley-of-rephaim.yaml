# Overview article (ADR 0007). Mainstream facts only; the valley is the one south-west of Jerusalem by common consent; the identity of the "mulberry trees" is left open.
id: valley-of-rephaim
place: a7559e6
title:
  en: "Valley of Rephaim"
  ru: "Долина Рефаимов"
  uk: "Долина Рефаїмів"
  es: "Valle de Refaim"
  pt: "Vale dos Refains"
  de: "Rafaitertal"
  fr: "Vallée des Rephaïm"
body:
  en:
    - "The Valley of Rephaim is the broad, shallow valley that opens south-west of Jerusalem, from the high ground beyond the valley of Hinnom down towards the road to Bethlehem and the hills; the modern Emek Refaim street runs along it through the German Colony to the old railway station. The border of Judah and Benjamin climbed from Hinnom “to the top of the mountain that lieth before the valley of Hinnom westward, which is at the end of the valley of the giants northward”: the King James Version translates Rephaim as giants, for the Rephaim were the giant peoples of old whom Chedorlaomer smote and whom Moab called Emims. The valley was corn land, and Isaiah pictures a thin remnant “as he that gathereth ears in the valley of Rephaim”."
    - "When the Philistines heard that David had been made king over all Israel they “came and spread themselves in the valley of Rephaim”. David asked the Lord, went up and broke them at Baal-perazim: “The LORD hath broken forth upon mine enemies before me, as the breach of waters”; the Philistines left their idols, and David's men burned them. They came up again and spread in the same valley; this time David was told to go round behind them and wait for “the sound of a going in the tops of the mulberry trees”, and he smote them “from Geba until thou come to Gazer”. The valley is also the setting of the story of the three mighty men: while “the troop of the Philistines pitched in the valley of Rephaim” and their garrison held Bethlehem, they broke through to draw David water from the well of Bethlehem, which he poured out to the Lord."
    - "Josephus retells David's two victories here. The valley's upper part was built over in the late nineteenth century: German Templers founded the German Colony in 1873, the Jaffa–Jerusalem railway reached the station at its head in 1892, and the Baka and Katamon quarters followed. Today the station is the First Station leisure centre, the German Colony a street of cafés, and the lower valley, Malha, holds the Jerusalem zoo and the city's stadium."
  ru:
    - "Долина Рефаимов — широкая пологая долина, открывающаяся к юго-западу от Иерусалима, от возвышенности за долиной Еннома вниз к дороге на Вифлеем и к холмам; нынешняя улица Эмек-Рефаим идёт по ней через Немецкую колонию к старому вокзалу. Граница Иуды и Вениамина поднималась от Еннома «на вершину горы, которая к западу против долины Енномовой, которая на краю долины Рефаимов к северу». Библия короля Иакова переводит «Рефаимы» как «исполины», ибо Рефаимы были древними народами великанов, которых поразил Кедорлаомер и которых Моавитяне звали Эмимами. Долина была хлебной, и Исаия рисует скудный остаток так: «когда соберут колосья в долине Рефаимской»."
    - "Когда Филистимляне услышали, что Давида помазали на царство над всем Израилем, они «пришли и расположились в долине Рефаим». Давид вопросил Господа, вышел и разбил их у Ваал-Перацима: «Господь разнес врагов моих предо мною, как разносит вода»; Филистимляне оставили своих истуканов, и люди Давида сожгли их. Они пришли опять и расположились в той же долине; на этот раз Давиду было велено зайти им с тыла и ждать «шум как бы идущего по вершинам тутовых дерев», и он поразил их «от Гаваи до Газера». Долина же — место рассказа о трёх храбрых: когда «толпы Филистимлян стояли в долине Рефаимов», а их отряд держал Вифлеем, трое пробились, чтобы принести Давиду воды из колодезя Вифлеемского, и он вылил её пред Господом."
    - "Иосиф Флавий пересказывает обе победы Давида здесь. Верхнюю часть долины застроили в конце XIX века: немецкие темплеры основали Немецкую колонию в 1873 году, железная дорога Яффа — Иерусалим дошла до вокзала в её верховье в 1892-м, затем выросли кварталы Бака и Катамон. Сегодня вокзал — центр досуга «Первая станция», Немецкая колония — улица кафе, а в нижней части долины, Малхе, стоят иерусалимский зоопарк и городской стадион."
  uk:
    - "Долина Рефаїмів — широка мілка долина, що відкривається на південний захід від Єрусалима, від високого місця за долиною Гінном униз до дороги на Вифлеєм і пагорби; сучасна вулиця Емек-Рефаїм проходить уздовж неї крізь Німецьку колонію до старої залізничної станції. Межа Юди й Веніяміна здіймалася від Гінном «вгору на верх гори, що стоїть на захід сонця перед долиною Еннома і разом на північньому кінцї Рафаім-долини»: Біблія короля Якова перекладає «рефаїми» як «велетні», бо рефаїми були велетенськими народами давнини, яких побив Кедорлаомер і яких Моав називав емемами. Долина була хлібною землею, і Ісая змальовує мізерний залишок, «коли визбирають колоссє в Рефаїм-долинї»."
    - "Коли филистимляни почули, що Давида зроблено царем над усім Ізраїлем, вони «розложились по Рефаїм-долинї». Давид запитав Господа, вийшов і розбив їх у Ваал-Перацімі: «Господь порозносив моїх ворогів передо мною, як розтїкаєся вода!»; филистимляни залишили своїх ідолів, і люди Давида їх спалили. Вони знову прийшли й розсипалися в тій самій долині; цього разу Давидові веліли обійти їх ззаду й чекати на «такий шелест, наче хто йде по вершках дерев», і він побивав їх «від Габаа аж до Газеру». Долина також є місцем розповіді про трьох лицарів: поки «ватага Филистіїв стояла в долинї Рефаїмів», а їхня залога тримала Вифлеєм, вони пробилися, щоб набрати Давидові води з колодязя Вифлеєма, яку він вилив Господеві."
    - "Йосиф Флавій переказує дві перемоги Давида тут. Верхня частина долини була забудована наприкінці XIX століття: німецькі темплери заснували Німецьку колонію 1873 року, залізниця Яффа–Єрусалим дійшла до станції на її початку 1892 року, а за нею з’явилися квартали Бака й Катамон. Нині станція — розважальний центр «Перша станція», Німецька колонія — вулиця кав’ярень, а нижня долина, Мальха, вміщує єрусалимський зоопарк і міський стадіон."
  es:
    - "El Valle de Refaim es el valle ancho y poco profundo que se abre al suroeste de Jerusalén, desde las alturas más allá del valle de Hinnom hasta el camino de Belén y las colinas; la actual calle Emek Refaim lo recorre por la Colonia Alemana hasta la antigua estación de ferrocarril. La frontera de Judá y Benjamín subía desde Hinnom «por la cumbre del monte que está delante del valle de Hinnom hacia el occidente, el cual está al cabo del valle de los gigantes al norte»: la versión King James traduce Refaim como gigantes, pues los refaítas eran los pueblos gigantes de antaño a los que Quedorlaomer derrotó y a los que Moab llamaba emimeos. El valle era tierra de trigo, e Isaías pinta un resto escaso «como el que coge espigas en el valle de Rephaim»."
    - "Cuando los filisteos oyeron que David había sido hecho rey sobre todo Israel, «vinieron los Filisteos, y extendiéronse por el valle de Raphaim». David consultó al Señor, subió y los derrotó en Baal-perazim: «Rompió Jehová mis enemigos delante de mí, como quien rompe aguas»; los filisteos dejaron sus ídolos, y los hombres de David los quemaron. Volvieron a subir y se extendieron por el mismo valle; esta vez a David se le dijo que los rodeara por detrás y esperara «un estruendo que irá por las copas de los morales», e hirió a los filisteos «desde Gabaa hasta llegar á Gaza». El valle es también el escenario del relato de los tres valientes: mientras «el campo de los Filisteos estaba en el valle de Raphaim» y su guarnición ocupaba Belén, irrumpieron para sacar agua del pozo de Belén para David, que la derramó al Señor."
    - "Josefo vuelve a contar aquí las dos victorias de David. La parte alta del valle fue edificada a finales del siglo XIX: los templarios alemanes fundaron la Colonia Alemana en 1873, el ferrocarril Jaffa–Jerusalén llegó a la estación de su cabecera en 1892, y siguieron los barrios de Baka y Katamón. Hoy la estación es el centro de ocio First Station, la Colonia Alemana una calle de cafés, y el valle bajo, Malha, alberga el zoológico de Jerusalén y el estadio de la ciudad."
  pt:
    - "O Vale dos Refains é o amplo e raso vale que se abre a sudoeste de Jerusalém, do terreno alto além do vale de Hinom em direção à estrada de Belém e às colinas; a moderna rua Emek Refaim corre ao longo dele pela Colônia Alemã até a antiga estação ferroviária. A fronteira de Judá e Benjamim subia de Hinom “até o topo do monte que fica em frente ao vale de Hinom, a oeste, que está no extremo do vale dos refains, ao norte”: a versão King James traduz refains por gigantes, pois os refains eram os povos gigantes de outrora que Quedorlaomer derrotou e que Moabe chamava emins. O vale era terra de trigo, e Isaías retrata um magro remanescente “como quando alguém recolhe espigas no vale de Refaim”."
    - "Ao saberem que Davi fora feito rei sobre todo Israel, os filisteus vieram, e o texto diz que “haviam chegado e se espalhado no vale de Refaim”. Davi consultou o Senhor, subiu e os derrotou em Baal-Perazim: “O SENHOR rompeu os meus inimigos diante de mim, como o rompimento de águas”; os filisteus deixaram seus ídolos, e os homens de Davi os queimaram. Subiram de novo e se espalharam no mesmo vale; desta vez Davi foi mandado dar a volta por trás deles e esperar “o som de marcha nas copas das amoreiras”, e os feriu “desde Geba até Gezer”. O vale é também o cenário da história dos três valentes: enquanto “a tropa dos filisteus estava acampada no vale de Refaim” e sua guarnição ocupava Belém, eles abriram caminho para tirar água do poço de Belém para Davi, que a derramou ao Senhor."
    - "Josefo reconta as duas vitórias de Davi aqui. A parte alta do vale foi edificada no fim do século XIX: os templários alemães fundaram a Colônia Alemã em 1873, a ferrovia Jafa–Jerusalém chegou à estação em sua cabeceira em 1892, e os bairros de Baka e Katamon se seguiram. Hoje a estação é o centro de lazer Primeira Estação, a Colônia Alemã uma rua de cafés, e o baixo vale, Malha, abriga o zoológico de Jerusalém e o estádio da cidade."
  de:
    - "Das Rafaitertal ist das breite, flache Tal, das sich südwestlich von Jerusalem öffnet, von der Höhe jenseits des Hinnomtals hinab zur Straße nach Bethlehem und zu den Hügeln; die moderne Emek-Refaim-Straße verläuft darin durch die Deutsche Kolonie bis zum alten Bahnhof. Die Grenze zwischen Juda und Benjamin stieg vom Hinnom hinauf „an die Spitze des Berges, der vor dem Tal Hinnom liegt abendwärts, welcher stößt an die Ecke des Tals Rephaim gegen Mitternacht zu“; die Rephaim waren die Riesenvölker der Vorzeit, die Kedorlaomer schlug und die Moab Emiter nannte. Das Tal war Kornland, und Jesaja malt einen dünnen Rest, „als wenn einer Ähren läse im Tal Rephaim“."
    - "Als die Philister hörten, dass David zum König über ganz Israel gesalbt war, „kamen und ließen sich nieder im Grunde Rephaim“. David befragte den Herrn, zog hinauf und schlug sie bei Baal-Perazim: „Der HERR hat meine Feinde vor mir voneinander gerissen, wie die Wasser reißen“; die Philister ließen ihre Götzen zurück, und Davids Männer verbrannten sie. Sie zogen abermals herauf und ließen sich im selben Tal nieder; diesmal sollte David hinter sie herumgehen und auf „das Rauschen auf den Wipfeln der Maulbeerbäume“ warten, und er schlug sie „von Geba an, bis man kommt gen Geser“. Das Tal ist auch Schauplatz der Geschichte der drei Helden: Während die Rotte der Philister „im Grunde Rephaim“ lag und ihre Besatzung Bethlehem hielt, brachen sie durch, um David Wasser aus dem Brunnen von Bethlehem zu schöpfen, und er goss es dem Herrn aus."
    - "Josephus erzählt Davids beide Siege hier nach. Der obere Teil des Tals wurde im späten neunzehnten Jahrhundert bebaut: Deutsche Templer gründeten 1873 die Deutsche Kolonie, die Bahnlinie Jaffa–Jerusalem erreichte 1892 den Bahnhof an seinem Kopf, und die Viertel Baka und Katamon folgten. Heute ist der Bahnhof das Freizeitzentrum First Station, die Deutsche Kolonie eine Straße voller Cafés, und das untere Tal, Malha, beherbergt den Jerusalemer Zoo und das Stadion der Stadt."
  fr:
    - "La vallée des Rephaïm est la large vallée peu profonde qui s’ouvre au sud-ouest de Jérusalem, des hauteurs au-delà de la vallée de Hinnom vers la route de Bethléem et les collines ; la rue moderne Emek Refaim la longe à travers la Colonie allemande jusqu’à l’ancienne gare. La frontière de Juda et de Benjamin montait de Hinnom « jusqu’au sommet de la montagne, qui est devant la vallée de Hinnom à l’occident, et à l’extrémité de la vallée des Rephaïm au nord » : la King James traduit Rephaïm par géants, car les Rephaïm étaient les peuples géants d’autrefois que Kedorlaomer battit et que Moab appelait Émim. La vallée était une terre à blé, et Ésaïe y compare un maigre reste à ce qui se fait « quand on ramasse les épis, dans la vallée de Rephaïm »."
    - "Quand les Philistins apprirent que David avait été fait roi sur tout Israël, ils « se répandirent dans la vallée des Rephaïm ». David consulta l’Éternel, monta et les écrasa à Baal-Peratsim : « L’Éternel a dispersé mes ennemis devant moi, comme des eaux qui s’écoulent » ; les Philistins laissèrent là leurs idoles, et les gens de David les brûlèrent. Ils remontèrent et se répandirent dans la même vallée ; cette fois David reçut l’ordre de les tourner par derrière et d’attendre « un bruit de pas dans les cimes des mûriers », et il les battit « depuis Guéba jusqu’à Guézer ». La vallée est aussi le cadre de l’histoire des trois vaillants : tandis qu’« une troupe de Philistins était campée dans la vallée des Rephaïm » et que leur poste tenait Bethléem, ils se frayèrent un chemin pour puiser pour David de l’eau de la citerne de Bethléem, qu’il répandit devant l’Éternel."
    - "Josèphe y raconte à nouveau les deux victoires de David. La partie haute de la vallée fut bâtie à la fin du XIXe siècle : les Templiers allemands fondèrent la Colonie allemande en 1873, le chemin de fer Jaffa-Jérusalem atteignit en 1892 la gare à sa tête, et les quartiers de Baka et de Katamon suivirent. Aujourd’hui, la gare est le centre de loisirs First Station, la Colonie allemande une rue de cafés, et la basse vallée, Malha, abrite le zoo de Jérusalem et le stade de la ville."
