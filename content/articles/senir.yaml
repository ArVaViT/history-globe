body:
  en:
    - "Senir is the Amorite name of Mount Hermon, the snow-capped mountain at the north end of the land. Deuteronomy explains that “Hermon the Sidonians call Sirion; and the Amorites call it Shenir”. Elsewhere the name seems to mean part of the range rather than the whole: the half-tribe of Manasseh spread “from Bashan unto Baal-hermon and Senir, and unto mount Hermon”, as if these were three points, and the Song of Songs calls the bride to look “from the top of Shenir and Hermon, from the lions’ dens, from the mountains of the leopards”. Ezekiel, describing the ship that is Tyre, says “They have made all thy ship boards of fir trees of Senir”, with masts of Lebanon cedar; the tree is the Hebrew berosh, a juniper or cypress of the high slopes."
    - "The name is older than Israel's kings. Shalmaneser III of Assyria records that in 841 BC he fought Hazael of Damascus at Mount Saniru, a peak facing Lebanon, killed thousands of his men and chased him to Damascus. Arab geographers still called Jebel Sanir the part of the Anti-Lebanon between Damascus and Homs, which suggests that Senir once named the range and Hermon its great southern peak."
    - "Today Senir is the Hermon massif on the borders of Lebanon, Syria and the Israeli-held Golan, Jebel esh-Sheikh, described in the article on Mount Hermon."
  ru:
    - "Сенир — аморрейское имя горы Ермон, снежной горы на северном краю земли. Второзаконие поясняет: «Сидоняне Ермон называют Сирионом, а Аморреи называют его Сениром». В других местах имя, похоже, означает часть хребта, а не весь: полуколено Манассиино расселилось «от Васана до Ваал-Ермона и Сенира и до горы Ермона», словно это три разные точки, а Песнь песней зовёт невесту «с вершины Сенира и Ермона, от логовищ львиных, от гор барсовых». Иезекииль, описывая корабль-Тир, говорит: «из Сенирских кипарисов устроили все помосты твои», а мачты — из ливанского кедра; дерево это еврейский «берош», можжевельник или кипарис высоких склонов."
    - "Имя старше израильских царей. Салманасар III Ассирийский записывает, что в 841 г. до н. э. бился с Азаилом Дамасским у горы Санир, вершины напротив Ливана, перебил тысячи его людей и гнал его до Дамаска. Арабские географы всё ещё звали Джебель-Санир часть Антиливана между Дамаском и Хомсом, и это наводит на мысль, что Сенир когда-то называл весь хребет, а Ермон — его большую южную вершину."
    - "Сегодня Сенир — массив Ермона на границах Ливана, Сирии и занятых Израилем Голан, Джебель-эш-Шейх, о котором рассказывает статья о горе Ермон."
  uk:
    - "Сенір — аморейська назва гори Гермон, увінчаної снігом гори на північному кінці краю. Повторення Закону пояснює: «Зидонїї звуть Гермона Сирйон, Аморії ж звуть його Сенір». В інших місцях ця назва, здається, означає частину хребта, а не цілий масив: половина коліна Манасії розселилася «від Базана до Баал-Ермона й Сенира й до гори Ермона», наче то були три пункти, а Пісня над піснями кличе наречену дивитися «з верхівя Сенира й Єрмону, від леговищ левів, із гір, де рисї». Єзекіїль, описуючи корабель, що є Тіром, каже: «Із Сенирського кипарису будували вони стїни твої», а щогли — з ливанського кедра: «Ливанські кедри брали вони на щогли твої»; це дерево — івритське береш, яловець або кипарис високих схилів."
    - "Назва давніша за царів Ізраїля. Салманасар III Ассирійський записує, що 841 р. до н. е. він бився з Азаїлом Дамаським біля гори Саніру, піку навпроти Лівану, вбив тисячі його воїнів і гнав його до Дамаска. Арабські географи ще називали Джебель-Санір частину Антилівану між Дамаском і Хомсом, що вказує, що Сенір колись називав хребет, а Гермон — його велику південну вершину."
    - "Нині Сенір — це масив Гермону на межі Лівану, Сирії та контрольованого Ізраїлем Голану, Джебель-еш-Шейх, описаний у статті про гору Гермон."
  es:
    - "Senir es el nombre amorreo del monte Hermón, la montaña coronada de nieve en el extremo norte del país. El Deuteronomio explica: «Los Sidonios llaman á Hermón Sirión; y los Amorrheos, Senir». En otros pasajes el nombre parece designar una parte de la cordillera más que el conjunto: la media tribu de Manasés se extendió «desde Basán hasta Baal-Hermón, y Senir y el monte de Hermón», como si fueran tres puntos, y el Cantar de los Cantares llama a la esposa a mirar «desde la cumbre de Senir y de Hermón, desde las guaridas de los leones, desde los montes de los tigres». Ezequiel, al describir la nave que es Tiro, dice: «De hayas del monte Senir te fabricaron todas las tillas», con mástiles de cedro del Líbano; el árbol es el hebreo berosh, un enebro o ciprés de las laderas altas."
    - "El nombre es más antiguo que los reyes de Israel. Salmanasar III de Asiria registra que en 841 a. C. combatió a Hazael de Damasco en el monte Saniru, una cumbre frente al Líbano, mató a miles de sus hombres y lo persiguió hasta Damasco. Los geógrafos árabes aún llamaban Jebel Sanir a la parte del Antilíbano entre Damasco y Homs, lo que sugiere que Senir nombró en otro tiempo la cordillera y Hermón su gran cumbre meridional."
    - "Hoy Senir es el macizo del Hermón en las fronteras de Líbano, Siria y el Golán en poder de Israel, el Jebel esh-Sheikh, descrito en el artículo sobre el monte Hermón."
  pt:
    - "Senir é o nome amorreu do Monte Hermom, a montanha coberta de neve no extremo norte da terra. O Deuteronômio explica que “Os sidônios chamam Hermom de Siriom, e os amorreus o chamam de Senir”. Em outros lugares o nome parece designar parte da cordilheira e não o todo: a meia tribo de Manassés se multiplicou “desde Basã até Baal-Hermom, Senir e o monte Hermom”, como se fossem três pontos, e o Cântico dos Cânticos chama a noiva a olhar “do topo do Senir e do Hermom, das covas dos leões, dos montes dos leopardos”. Ezequiel, descrevendo o navio que é Tiro, diz: “Fizeram todas as suas tábuas de ciprestes de Senir”, com mastros de cedro do Líbano; a árvore é o hebraico berosh, um zimbro ou cipreste das encostas altas."
    - "O nome é mais antigo que os reis de Israel. Salmaneser III da Assíria registra que em 841 a.C. combateu Hazael de Damasco no Monte Saniru, um pico defronte do Líbano, matou milhares de seus homens e o perseguiu até Damasco. Geógrafos árabes ainda chamavam Jebel Sanir a parte do Anti-Líbano entre Damasco e Homs, o que sugere que Senir nomeou outrora a cordilheira e Hermom seu grande pico meridional."
    - "Hoje Senir é o maciço do Hermom nas fronteiras do Líbano, da Síria e do Golã sob controle israelense, o Jebel esh-Sheikh, descrito no artigo sobre o Monte Hermom."
  de:
    - "Senir ist der amoritische Name des Berges Hermon, des schneebedeckten Berges am Nordende des Landes. Das Deuteronomium erklärt vom Hermon: „welchen die Sidoniter Sirjon heißen, aber die Amoriter heißen ihn Senir“. Anderswo scheint der Name einen Teil des Gebirges statt des Ganzen zu meinen: Der halbe Stamm Manasse breitete sich aus „im Lande von Basan an bis gen Baal-Hermon und Senir und den Berg Hermon“, als wären das drei Punkte, und das Hohelied ruft die Braut, zu schauen „von der Höhe Senir und Hermon, von den Wohnungen der Löwen, von den Bergen der Leoparden“. Hesekiel sagt von dem Schiff, das Tyrus ist: „Sie haben all dein Tafelwerk aus Zypressenholz vom Senir gemacht“, mit Masten aus libanesischer Zeder; der Baum ist das hebräische berosch, ein Wacholder oder eine Zypresse der Hochhänge."
    - "Der Name ist älter als Israels Könige. Salmanassar III. von Assyrien verzeichnet, dass er 841 v. Chr. am Berg Saniru, einem Gipfel gegenüber dem Libanon, gegen Hasaël von Damaskus kämpfte, Tausende seiner Männer tötete und ihn bis Damaskus jagte. Arabische Geographen nannten noch den Teil des Antilibanon zwischen Damaskus und Homs Dschebel Sanir, was nahelegt, dass Senir einst das Gebirge bezeichnete und Hermon seinen großen Südgipfel."
    - "Heute ist Senir das Hermonmassiv an den Grenzen von Libanon, Syrien und dem von Israel gehaltenen Golan, Dschebel esch-Scheich, beschrieben im Artikel über den Berg Hermon."
  fr:
    - "Senir est le nom amoréen du mont Hermon, la montagne enneigée à l’extrémité nord du pays. Le Deutéronome explique que « les Sidoniens donnent à l’Hermon le nom de Sirion, et les Amoréens celui de Senir ». Ailleurs, le nom semble désigner une partie du massif plutôt que le tout : la demi-tribu de Manassé s’étendit « depuis Basan jusqu’à Baal-Hermon et à Senir, et à la montagne d’Hermon », comme s’il s’agissait de trois points, et le Cantique des cantiques appelle la fiancée à regarder « du sommet du Senir et de l’Hermon, des tanières des lions, des montagnes des léopards ». Ézéchiel, décrivant le navire qu’est Tyr, dit : « Avec des cyprès de Senir ils ont fait tous tes lambris », avec des mâts de cèdre du Liban ; l’arbre est l’hébreu berosh, un genévrier ou un cyprès des hautes pentes."
    - "Le nom est plus ancien que les rois d’Israël. Salmanasar III d’Assyrie consigne qu’en 841 av. J.-C. il combattit Hazaël de Damas au mont Saniru, un sommet face au Liban, tua des milliers de ses hommes et le poursuivit jusqu’à Damas. Les géographes arabes appelaient encore Djebel Sanir la partie de l’Anti-Liban entre Damas et Homs, ce qui suggère que Senir nomma jadis la chaîne et l’Hermon son grand sommet méridional."
    - "Aujourd’hui, Senir est le massif de l’Hermon aux confins du Liban, de la Syrie et du Golan tenu par Israël, le Djebel esh-Sheikh, décrit dans l’article sur le mont Hermon."
