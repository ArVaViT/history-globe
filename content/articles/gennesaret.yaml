body:
  en:
    - "Gennesaret is the small plain on the north-western shore of the Sea of Galilee, between Magdala and Capernaum, where the hills draw back from the water for about five kilometres and the streams from the Galilean uplands spread out before reaching the lake. Its name probably goes back to Chinnereth, the fortified town of Naphtali whose mound, Tel Kinrot, stands at the plain's northern end and which gave the lake its Old Testament name, the sea of Chinnereth; by the Maccabean age the plain was Gennesar, and the lake was called after it. Josephus, who commanded Galilee in AD 66, measured it at thirty stadia along the shore and twenty inland and could not praise it enough: walnuts, palms, figs and olives grew side by side, the air suited every kind of tree, grapes and figs ripened for ten months of the year, and a spring the people called Capharnaum watered it."
    - "The Gospels bring Jesus here once by name. After the feeding of the five thousand and the night walk on the water, “when they were gone over, they came into the land of Gennesaret”, and, as Mark adds, “drew to the shore”; the people recognised him, carried their sick on beds to wherever he was heard to be, and “besought him that they might only touch the hem of his garment: and as many as touched were made perfectly whole”. Luke calls the whole lake by the plain's name: it was “by the lake of Gennesaret” that the crowd pressed on Jesus, and he taught from Simon's boat before the great catch of fish and the call of the first disciples."
    - "The plain is farmed today by the kibbutz of Ginosar, which keeps its name, and by the villages around it, with bananas and mangoes under the lake-side heat; in 1986, in a year of drought, two of its members found in the mud off the shore a fishing boat of the first century BC or AD, now in the Yigal Allon Centre at the kibbutz. Tel Kinrot was excavated systematically from 1982 to 2008, and Magdala, with its first-century synagogue, is uncovered at the plain's southern edge."
  ru:
    - "Геннисарет — небольшая равнина на северо-западном берегу Галилейского моря, между Магдалой и Капернаумом, где горы отступают от воды примерно на пять километров, а потоки с галилейских возвышенностей растекаются, не доходя до озера. Имя её, вероятно, восходит к Хиннерефу, укреплённому городу Неффалима, чей холм, Тель-Киннерот, стоит у северного края равнины и дал озеру ветхозаветное имя — море Хиннереф; к маккавейскому времени равнина звалась Геннисар, и озеро называли по ней. Иосиф Флавий, командовавший в Галилее в 66 г. н. э., мерил её в тридцать стадий вдоль берега и двадцать вглубь и не мог нахвалиться: орехи, пальмы, смоковницы и маслины росли рядом, воздух подходил всякому дереву, виноград и смоквы зрели десять месяцев в году, а поил её источник, который жители звали Капернаумом."
    - "Евангелия приводят сюда Иисуса по имени один раз. После насыщения пяти тысяч и ночного хождения по воде, «переправившись, прибыли в землю Геннисаретскую», и, как добавляет Марк, «пристали к берегу»; жители узнали Его, на постелях приносили больных туда, где Он, как слышно было, находился, «и просили Его, чтобы только прикоснуться к краю одежды Его; и которые прикасались, исцелялись». Лука зовёт именем равнины всё озеро: именно «у озера Геннисаретского» народ теснился к Иисусу, и Он учил из лодки Симона перед великим уловом рыбы и призванием первых учеников."
    - "Сегодня равнину возделывают кибуц Гиносар, сохранивший её имя, и окрестные селения — бананы и манго в приозёрной жаре; в 1986 году, в засуху, двое его членов нашли в иле у берега рыбацкую лодку I века до н. э. или н. э., которая теперь стоит в центре имени Игаля Алона при кибуце. Тель-Киннерот систематически раскапывали с 1982 по 2008 год, а у южного края равнины открыта Магдала с синагогой I века."
  uk:
    - "Генісарет — мала рівнина на північно-західному березі Галілейського моря між Магдалою й Капернаумом, де пагорби відступають від води приблизно на п’ять кілометрів, а потоки з галілейських височин розливаються перед тим, як досягти озера. Її назва, ймовірно, сягає Кіннерета, укріпленого міста Нефталима, чиє городище Тель-Кінрот стоїть на північному краю рівнини й дало озеру його старозавітну назву — море Кіннерет; за Макавейської доби рівнину називали Геннесар, і озеро назвали за нею. Йосиф Флавій, який 66 р. н. е. командував Галілеєю, виміряв її у тридцять стадій уздовж берега й двадцять углиб і не міг нахвалитися: волоські горіхи, пальми, смоківниці й оливи росли поряд, повітря підходило для кожної породи дерев, виноград і смокви достигали десять місяців на рік, а зрошувало її джерело, яке люди називали Капарнаум."
    - "Євангелія приводять Ісуса сюди один раз за назвою. Після нагодування п’яти тисяч і ночі ходіння по воді Він і учні «перепливши, прибули в землю Генисарецьку», і, як додає Марк, «причалили»; люди впізнали Його, приносили своїх недужих на ліжках туди, де чули, що Він є, і «благали Його, щоб тільки приторкнутись їм до краю одежі Його; й скільки їх доторкувалось, одужували». Лука називає все озеро ім’ям рівнини: саме «коло озера Генисарецького» натовп тиснувся до Ісуса, і Він навчав із Симонового човна перед великим уловом риби й покликанням перших учнів."
    - "Сьогодні рівнину обробляє кібуц Гінносар, що зберігає її назву, та навколишні села, з бананами й манго під озерною спекою; 1986 року, в посушливий рік, двоє його членів знайшли в мулі біля берега рибальський човен I ст. до н. е. або н. е., який нині міститься в Центрі Ігала Аллона при кібуці. Тель-Кінрот систематично розкопували з 1982 по 2008 рік, а Магдалу з її синагогою I ст. розкрито на південному краю рівнини."
  es:
    - "Genesaret es la pequeña llanura de la orilla noroccidental del mar de Galilea, entre Magdala y Cafarnaúm, donde las colinas se retiran del agua unos cinco kilómetros y los arroyos de las tierras altas galileas se extienden antes de llegar al lago. Su nombre se remonta probablemente a Cineret, la ciudad fortificada de Neftalí cuyo montículo, Tel Kinrot, se alza en el extremo norte de la llanura y que dio al lago su nombre del Antiguo Testamento, el mar de Cineret; en la época macabea la llanura era Gennesar, y el lago se llamó con su nombre. Josefo, que mandó en Galilea en el 66 d. C., la midió en treinta estadios a lo largo de la orilla y veinte hacia el interior y no se cansaba de elogiarla: nogales, palmeras, higueras y olivos crecían juntos, el aire convenía a toda clase de árboles, uvas e higos maduraban diez meses al año, y la regaba una fuente que la gente llamaba Cafarnaúm."
    - "Los Evangelios traen aquí a Jesús una sola vez por su nombre. Tras la multiplicación de los cinco mil y el paseo nocturno sobre el agua, «llegando á la otra parte, vinieron á la tierra de Genezaret» y, como añade Marcos, «tomaron puerto»; la gente lo reconoció, llevó a sus enfermos en lechos adonde oían que estaba, y «le rogaban que solamente tocasen el borde de su manto; y todos los que tocaron, quedaron sanos». Lucas llama a todo el lago con el nombre de la llanura: fue «junto al lago de Genezaret» donde la multitud se agolpaba sobre Jesús, y él enseñó desde la barca de Simón antes de la gran pesca y de la llamada de los primeros discípulos."
    - "Hoy la llanura la cultivan el kibutz de Ginosar, que conserva su nombre, y las aldeas de alrededor, con bananos y mangos bajo el calor de la orilla; en 1986, en un año de sequía, dos de sus miembros encontraron en el fango frente a la orilla una barca de pesca del siglo I a. C. o d. C., que se conserva ahora en el Centro Yigal Alón del kibutz. Tel Kinrot se excavó sistemáticamente de 1982 a 2008, y Magdala, con su sinagoga del siglo I, ha salido a la luz en el borde meridional de la llanura."
  pt:
    - "Genesaré é a pequena planície na margem noroeste do mar da Galileia, entre Magdala e Cafarnaum, onde as colinas se afastam da água por cerca de cinco quilômetros e os riachos das terras altas da Galileia se espalham antes de chegar ao lago. Seu nome provavelmente remonta a Quinerete, a cidade fortificada de Naftali cujo monte, Tel Kinrot, fica no extremo norte da planície e que deu ao lago o seu nome do Antigo Testamento, o mar de Quinerete; na época macabaica a planície era Gennesar, e o lago passou a chamar-se por ela. Josefo, que comandou a Galileia em 66 d.C., mediu-a em trinta estádios ao longo da margem e vinte para o interior e não achava elogios bastantes: nogueiras, palmeiras, figueiras e oliveiras cresciam lado a lado, o ar convinha a toda árvore, uvas e figos amadureciam durante dez meses do ano, e uma fonte a que o povo chamava Cafarnaum a irrigava."
    - "Os Evangelhos trazem Jesus aqui uma só vez, pelo nome. Depois da multiplicação para os cinco mil e da caminhada noturna sobre a água, “Depois de atravessarem, chegaram à terra de Genesaré” e, como acrescenta Marcos, “atracaram na margem”; o povo o reconheceu, levou os seus doentes em macas para onde ouviam que ele estava e “imploravam-lhe que pudessem apenas tocar na orla do seu manto. E todos os que a tocaram ficaram curados”. Lucas chama o lago inteiro pelo nome da planície: foi “junto ao lago de Genesaré” que a multidão apertava Jesus, e ele ensinou do barco de Simão antes da grande pesca e do chamado dos primeiros discípulos."
    - "A planície é cultivada hoje pelo quibutz de Ginosar, que guarda o seu nome, e pelas aldeias ao redor, com bananas e mangas sob o calor da beira do lago; em 1986, num ano de seca, dois de seus membros encontraram na lama, perto da margem, um barco de pesca do século I a.C. ou d.C., hoje no Centro Yigal Allon, no quibutz. Tel Kinrot foi escavado sistematicamente de 1982 a 2008, e Magdala, com sua sinagoga do século I, vem à luz na margem sul da planície."
  de:
    - "Genezareth ist die kleine Ebene am nordwestlichen Ufer des Sees Genezareth zwischen Magdala und Kapernaum, wo die Hügel auf etwa fünf Kilometer vom Wasser zurücktreten und die Bäche des galiläischen Berglands sich ausbreiten, ehe sie den See erreichen. Ihr Name geht wahrscheinlich auf Kinneret zurück, die befestigte Stadt Naftalis, deren Hügel Tel Kinrot am Nordende der Ebene steht und die dem See seinen alttestamentlichen Namen gab, das Meer Kinneret; in makkabäischer Zeit hieß die Ebene Gennesar, und der See wurde nach ihr benannt. Josephus, der 66 n. Chr. Galiläa befehligte, maß sie mit dreißig Stadien am Ufer entlang und zwanzig landeinwärts und konnte sie nicht genug loben: Walnüsse, Palmen, Feigen und Oliven wuchsen nebeneinander, die Luft sagte jeder Baumart zu, Trauben und Feigen reiften zehn Monate im Jahr, und eine Quelle, die das Volk Kapharnaum nannte, wässerte sie."
    - "Die Evangelien führen Jesus hier einmal namentlich her. Nach der Speisung der Fünftausend und dem nächtlichen Gang auf dem Wasser heißt es: „Und sie schifften hinüber und kamen in das Land Genezareth“ und, wie Markus ergänzt, „fuhren an“; die Leute erkannten ihn, brachten ihre Kranken auf Betten dorthin, wo er, wie sie hörten, war, und „baten ihn, daß sie nur seines Kleides Saum anrührten. Und alle, die ihn anrührten, wurden gesund.“ Lukas nennt den ganzen See mit dem Namen der Ebene: „am See Genezareth“ drängte sich das Volk zu Jesus, und er lehrte aus Simons Schiff vor dem großen Fischzug und der Berufung der ersten Jünger."
    - "Die Ebene wird heute vom Kibbuz Ginosar, der ihren Namen bewahrt, und von den Dörfern ringsum bewirtschaftet, mit Bananen und Mangos in der Hitze am See; 1986, in einem Dürrejahr, fanden zwei seiner Mitglieder im Schlamm vor dem Ufer ein Fischerboot aus dem 1. Jahrhundert v. Chr. oder n. Chr., das jetzt im Yigal-Allon-Zentrum des Kibbuz steht. Tel Kinrot wurde von 1982 bis 2008 systematisch ausgegraben, und Magdala mit seiner Synagoge des 1. Jahrhunderts ist am Südrand der Ebene freigelegt."
  fr:
    - "Génésareth est la petite plaine de la rive nord-ouest de la mer de Galilée, entre Magdala et Capernaüm, où les collines s’écartent de l’eau sur environ cinq kilomètres et où les ruisseaux des hauteurs galiléennes s’étalent avant d’atteindre le lac. Son nom remonte probablement à Kinnéreth, ville fortifiée de Nephthali dont le tertre, Tel Kinrot, domine l’extrémité nord de la plaine et qui donna au lac son nom de l’Ancien Testament, la mer de Kinnéreth ; à l’époque maccabéenne, la plaine était Gennésar, et le lac en prit le nom. Josèphe, qui commandait la Galilée en 66 apr. J.-C., lui donnait trente stades le long du rivage et vingt vers l’intérieur : noyers, palmiers, figuiers et oliviers y poussaient côte à côte, l’air convenait à toutes les espèces d’arbres, raisins et figues mûrissaient dix mois par an, et une source que l’on nommait Capharnaüm l’arrosait."
    - "Les Évangiles y amènent Jésus une seule fois par son nom. Après la multiplication des pains pour les cinq mille et la marche nocturne sur les eaux, « Après avoir traversé la mer, ils vinrent dans le pays de Génésareth », et, comme Marc l’ajoute, « ils abordèrent » ; les gens reconnurent Jésus, apportèrent leurs malades sur des lits partout où l’on apprenait qu’il était, et « on le priait de leur permettre seulement de toucher le bord de son vêtement. Et tous ceux qui le touchaient étaient guéris ». Luc appelle le lac tout entier du nom de la plaine : c’est « auprès du lac de Génésareth » que la foule se pressait autour de Jésus, et il enseigna depuis la barque de Simon avant la pêche abondante et l’appel des premiers disciples."
    - "La plaine est cultivée aujourd’hui par le kibboutz de Guinosar, qui en garde le nom, et par les villages alentour, avec des bananes et des mangues sous la chaleur du lac ; en 1986, une année de sécheresse, deux de ses membres trouvèrent dans la vase, au large du rivage, une barque de pêche du Ier siècle av. ou apr. J.-C., aujourd’hui au Centre Yigal Allon du kibboutz. Tel Kinrot a été fouillé systématiquement de 1982 à 2008, et Magdala, avec sa synagogue du Ier siècle, est dégagée à la lisière sud de la plaine."
  pl:
    - "Genezaret to mała równina na północno-zachodnim brzegu Jeziora Galilejskiego, między Magdalą a Kafarnaum, gdzie wzgórza odsuwają się od wody na około pięć kilometrów, a strumienie z galilejskich wyżyn rozlewają się, zanim dotrą do jeziora. Jej nazwa sięga prawdopodobnie Kinneret, obwarowanego miasta Neftalego, którego pagórek, Tel Kinrot, stoi na północnym końcu równiny i które dało jezioru jego starotestamentową nazwę, morze Kinneret; w czasach machabejskich równina nazywała się Gennesar, a od niej nazwano jezioro. Józef Flawiusz, który w 66 r. n.e. dowodził w Galilei, mierzył ją na trzydzieści stadiów wzdłuż brzegu i dwadzieścia w głąb lądu i nie mógł się nachwalić: orzechy włoskie, palmy, figi i oliwki rosły obok siebie, powietrze służyło każdemu rodzajowi drzew, winogrona i figi dojrzewały przez dziesięć miesięcy w roku, a nawadniało ją źródło zwane przez mieszkańców Kafarnaum."
    - "Ewangelie przywodzą tu Jezusa raz z nazwy. Po nakarmieniu pięciu tysięcy i nocnym chodzeniu po wodzie: „I przeprawiwszy się, przyszli do ziemi Gienezaret”, a jak dodaje Marek, „przybili się do brzegu”; ludzie go poznali, nosili swoich chorych na łożach tam, gdzie słyszeli, że jest, i „prosili go, aby się tylko podołku szaty jego dotykali; a którzykolwiek się dotknęli, uzdrowieni są”. Łukasz nazywa całe jezioro nazwą równiny: to „podle jeziora Gienezaretskiego” tłum nalegał na Jezusa, a on nauczał z łodzi Szymona przed wielkim połowem ryb i powołaniem pierwszych uczniów."
    - "Równinę uprawia dziś kibuc Ginosar, który zachował jej nazwę, oraz otaczające wsie, z bananami i mango w upale nad jeziorem; w 1986 r., w roku suszy, dwóch jego członków znalazło w mule przy brzegu łódź rybacką z I w. p.n.e. lub n.e., którą można dziś oglądać w Centrum Jigala Allona w kibucu. Tel Kinrot był systematycznie badany w latach 1982–2008, a Magdala z synagogą z I w. została odsłonięta na południowym skraju równiny."
  it:
    - "Gennesaret è la piccola pianura sulla riva nord-occidentale del Lago di Tiberiade, fra Magdala e Cafarnao, dove le colline si ritraggono dall’acqua per circa cinque chilometri e i torrenti degli altopiani galilei si allargano prima del lago. Il suo nome risale probabilmente a Chinnerèt, la città fortificata di Neftali il cui tell, Tel Kinrot, sorge all’estremità settentrionale della pianura e che diede al lago il suo nome veterotestamentario, mare di Chinnerèt; in età maccabaica la pianura era Gennesar e il lago fu chiamato da essa. Giuseppe Flavio, che comandò la Galilea nel 66 d.C., la misurò in trenta stadi lungo la riva e venti verso l’interno e non la lodava abbastanza: noci, palme, fichi e olivi crescevano fianco a fianco, l’aria si adattava a ogni specie di albero, uva e fichi maturavano per dieci mesi all’anno, e una sorgente che la gente chiamava Cafarnao la irrigava."
    - "I Vangeli portano qui Gesù una volta per nome. Dopo la moltiplicazione dei cinquemila e il cammino notturno sulle acque, «passati all’altra riva, vennero nel paese di Gennezaret» e, come aggiunge Marco, «vi presero terra»; la gente lo riconobbe, portò i suoi malati sui lettucci dovunque sentiva dire che si trovasse, e «lo pregavano che lasciasse loro toccare non foss’altro che il lembo del suo vestito; e tutti quelli che lo toccarono furon completamente guariti». Luca chiama l’intero lago col nome della pianura: fu «sulla riva del lago di Gennesaret» che la folla si strinse attorno a Gesù, ed egli insegnò dalla barca di Simone prima della grande pesca e della chiamata dei primi discepoli."
    - "La pianura è coltivata oggi dal kibbutz di Ginosar, che ne conserva il nome, e dai villaggi circostanti, con banani e manghi sotto il caldo della riva; nel 1986, in un anno di siccità, due suoi membri trovarono nel fango presso la riva una barca da pesca del I secolo a.C. o d.C., ora nel Centro Yigal Allon del kibbutz. Tel Kinrot è stato scavato sistematicamente dal 1982 al 2008, e Magdala, con la sua sinagoga del I secolo, è stata portata alla luce al margine meridionale della pianura."
  nl:
    - "Gennesaret is de kleine vlakte aan de noordwestelijke oever van het Meer van Galilea, tussen Magdala en Kafarnaüm, waar de heuvels ongeveer vijf kilometer van het water terugwijken en de beken uit het Galilese bergland zich uitspreiden vóór het meer. De naam gaat waarschijnlijk terug op Kinneret, de versterkte stad van Naftali waarvan de heuvel, Tel Kinrot, aan het noordeinde van de vlakte staat en die het meer zijn oudtestamentische naam gaf: de zee van Kinneret; in de Makkabeïsche tijd heette de vlakte Gennesar, en het meer werd ernaar genoemd. Josephus, die in 66 n.Chr. Galilea beval, mat haar op dertig stadiën langs de oever, twintig landinwaarts en prees haar overvloedig: walnoten, palmen, vijgen en olijven groeiden naast elkaar, de lucht deugde voor elke boom, druiven en vijgen rijpten tien maanden van het jaar, en een bron die het volk Kafarnaüm noemde, bewaterde haar."
    - "De evangeliën brengen Jezus hier één keer bij naam. Na de spijziging van de vijfduizend en de nachtelijke wandeling over het water kwamen zij, “overgevaren zijnde”, “in het land Gennesaret”, en, zoals Marcus toevoegt, “havenden aldaar”; de mensen herkenden hem, brachten hun zieken op bedden naar waar zij hoorden dat hij was, en “baden Hem, dat zij alleenlijk den zoom Zijns kleeds zouden mogen aanraken; en zovelen als Hem aanraakten, werden gezond”. Lukas noemt het hele meer naar de vlakte: “bij het meer Gennesareth” drong de schare op Jezus aan, en hij onderwees vanuit het schip van Simon vóór de grote visvangst en de roeping van de eerste leerlingen."
    - "De vlakte wordt nu bewerkt door de kibboets Ginosar, die de naam behoudt, en door de dorpen eromheen, met bananen en mango’s in de hitte aan het meer; in 1986, in een jaar van droogte, vonden twee leden ervan in de modder voor de oever een vissersboot uit de 1e eeuw v.Chr. of n.Chr., nu in het Yigal Allon-centrum bij de kibboets. Tel Kinrot werd van 1982 tot 2008 systematisch opgegraven, en Magdala, met zijn synagoge uit de 1e eeuw, is blootgelegd aan de zuidrand van de vlakte."
  cs:
    - "Genezaret je malá rovina na severozápadním břehu Galilejského jezera, mezi Magdalou a Kafarnaem, kde ustupují kopce od vody asi na pět kilometrů a potoky z galilejské vysočiny se rozlévají, než dosáhnou jezera. Jeho jméno sahá pravděpodobně k Kineretu, opevněnému městu Neftalího, jehož pahorek Tel Kinrot stojí na severním konci roviny a které dalo jezeru jeho starozákonní jméno, moře Kineret; v době makabejské byla rovina Gennesar a jezero bylo pojmenováno podle ní. Josephus, který roku 66 n. l. velel v Galileji, naměřil ji třicet stadií podél břehu a dvacet do vnitrozemí a nemohl ji dost vychválit: vlašské ořechy, palmy, fíky a olivy rostly vedle sebe, ovzduší vyhovovalo každému druhu stromů, hrozny a fíky dozrávaly po deset měsíců v roce a zavlažoval ji pramen, kterému lidé říkali Kafarnaum."
    - "Evangelia přivádějí Ježíše sem jednou jménem. Po nasycení pěti tisíc a noční procházce po vodě „přeplavivše se, přišli do země Genezaretské“ a jak dodává Marek, „tu lodí přistavili“; lidé jej poznali, nosili své nemocné na ložích, kamkoli se doslechli, že je, a „prosili ho, aby se aspoň podolka roucha jeho dotkli. A kteřížkoli dotkli se, uzdraveni jsou“. Lukáš nazývá celé jezero jménem roviny: bylo to „podle jezera Genezaretského“, kde se zástup na Ježíše valil, a učil ze Šimonovy lodi před velkým rybolovem a povoláním prvních učedníků."
    - "Rovinu dnes obdělává kibuc Ginosar, který jméno zachovává, a vesnice kolem něj, s banány a mangy v horku u jezera; roku 1986, v suchém roce, našli dva jeho členové v bahně u břehu rybářskou loď z 1. stol. př. n. l. nebo n. l., nyní v Centru Jigala Alona v kibucu. Tel Kinrot byl soustavně vykopáván v letech 1982–2008 a Magdala s synagogou z 1. století je odkryta na jižním okraji roviny."
  sv:
    - "Gennesaret är den lilla slätten på nordvästra stranden av Galileiska sjön, mellan Magdala och Kafarnaum, där bergen drar sig tillbaka från vattnet omkring fem kilometer och bäckarna från Galileens högland breder ut sig innan de når sjön. Namnet går troligen tillbaka på Kinneret, Naftalis befästa stad vars kulle, Tel Kinrot, ligger vid slättens norra ände och som gav sjön dess gammaltestamentliga namn, Kinneretsjön; på mackabeernas tid hette slätten Gennesar, och sjön uppkallades efter den. Josefus, som ledde Galileen år 66 e.Kr., mätte den till trettio stadier längs stranden och tjugo inåt landet och kunde inte prisa den nog: valnötter, palmer, fikon och oliver växte sida vid sida, luften passade alla slags träd, druvor och fikon mognade tio månader om året, och en källa som folket kallade Kafarnaum vattnade den."
    - "Evangelierna för Jesus hit en gång vid namn. Efter mättandet av de fem tusen och gåendet på vattnet: ”När de hade farit över, kommo de till Gennesarets land”, och, som Markus tillägger, ”lade till”; folket kände igen honom, bar sina sjuka på bäddar dit där man hörde att han var, och ”bådo honom att åtminstone få röra vid hörntofsen på hans mantel; och alla som rörde vid den blevo hulpna”. Lukas kallar hela sjön vid slättens namn: det var ”vid Gennesarets sjö” som folket trängde sig inpå Jesus, och han undervisade från Simons båt före det stora fisket och kallelsen av de första lärjungarna."
    - "Slätten brukas i dag av kibbutzen Ginosar, som bevarar namnet, och av byarna runtomkring, med bananer och mango i hettan vid sjön; 1986, ett torrår, fann två av dess medlemmar i leran utanför stranden en fiskebåt från första århundradet f.Kr. eller e.Kr., nu i Yigal Allon-centret vid kibbutzen. Tel Kinrot undersöktes systematiskt 1982–2008, och Magdala, med sin synagoga från första århundradet, är frilagt vid slättens södra kant."
  nb:
    - "Gennesaret er den lille sletten på nordvestsiden av Galileasjøen, mellom Magdala og Kapernaum, der åsene trekker seg tilbake fra vannet i omtrent fem kilometer og bekkene fra det galileiske høylandet brer seg ut før de når innsjøen. Navnet går trolig tilbake til Kinneret, den befestede byen i Naftali hvis haug, Tel Kinrot, ligger i slettens nordende, og som ga innsjøen dens gammeltestamentlige navn, «Kinnerets sjø»; i makkabeertiden var sletten Gennesar, og innsjøen ble oppkalt etter den. Josefus, som ledet Galilea i 66 e.Kr., målte den til tretti stadier langs stranden og tjue innover i landet og kunne ikke prise den nok: valnøtter, palmer, fiken og oliven vokste side om side, luften passet for alle slags trær, druer og fiken modnet i ti måneder av året, og en kilde folk kalte Kafarnaum, vannet den."
    - "Evangeliene bringer Jesus hit én gang ved navn. Etter mettingen av de fem tusen og nattevandringen på vannet heter det at «da de var faret over, kom de til Gennesarets land», og, som Markus legger til, «la til der»; folket kjente ham igjen, bar sine syke på senger dit hvor de hørte at han var, og «bad ham at de måtte få røre, om det så bare var ved det ytterste av hans klædebon; og alle de som rørte ved ham, blev helbredet». Lukas kaller hele innsjøen med sletten navn: det var «ved Gennesaret-sjøen» at folket trengte seg inn på Jesus, og han lærte fra Simons båt før det store fiskefanget og kallelsen av de første disiplene."
    - "Sletten dyrkes i dag av kibbutzen Ginosar, som har bevart navnet, og av landsbyene rundt den, med bananer og mango i varmen ved innsjøen; i 1986, i et tørkeår, fant to av medlemmene i leren utenfor stranden en fiskebåt fra det første århundre f.Kr. eller e.Kr., nå i Yigal Allon-senteret ved kibbutzen. Tel Kinrot ble utgravd systematisk fra 1982 til 2008, og Magdala, med sin synagoge fra det første århundre, er avdekket i slettens sørkant."
  tl:
    - "Ang Genezaret ay maliit na kapatagan sa hilagang-kanlurang pampang ng Dagat ng Galilea, sa pagitan ng Magdala at Capernaum, kung saan umaatras ang mga burol nang limang kilometro at kumakalat ang mga batis ng kabundukan ng Galilea bago ang lawa. Marahil nagmula ang pangalan sa Cinereth, ang nakukutaang bayan ng Nephtali na ang gulod, ang Tel Kinrot, ay nasa hilagang dulo nito at nagbigay sa lawa ng pangalan nito sa Lumang Tipan, ang dagat ng Cinereth; sa panahon ng mga Macabeo, Gennesar na ang kapatagan, at ipinangalan dito ang lawa. Sinukat ito ni Josephus, na namuno sa Galilea noong 66 AD, nang tatlumpung estadio sa baybayin at dalawampu sa loob, at lubos na pinuri: magkatabing tumubo ang nogal, palma, igos at olibo, angkop sa bawat puno ang hangin, hinog ang ubas at igos sa sampung buwan ng taon, at dinidilig ito ng bukal na tinawag ng mga tao na Capharnaum."
    - "Minsan lamang dinadala rito ng mga Ebanghelyo si Jesus sa pangalan. Pagkatapos ng pagpapakain sa limang libo at ng paglakad sa tubig kinagabihan, “nang makatawid na sila, ay narating nila ang lupa ng Genezaret”, at, gaya ng idinagdag ni Marcos, “nagsisadsad sa daungan”; nakilala siya ng mga tao, dinala ang kanilang mga maysakit sa higaan saan man nila marinig na naroon siya, at “ipinamamanhik sa kaniya na ipahipo man lamang sa kanila ang laylayan ng kaniyang damit: at ang lahat ng nagsihipo sa kaniya ay pawang nagsigaling”. Ang buong lawa ay tinawag ni Lucas sa pangalan ng kapatagan: “sa tabi ng dagatdagatan ng Genezaret” sumiksik ang karamihan kay Jesus, at nagturo siya mula sa daong ni Simon bago ang malaking huli ng isda at ang pagtawag sa unang mga alagad."
    - "Ngayon ay sinasaka ang kapatagan ng kibbutz ng Ginosar, na nagpapanatili ng pangalan, at ng mga nayon sa paligid nito, na may mga saging at mangga sa init ng tabing-lawa; noong 1986, sa isang taon ng tagtuyot, may dalawa sa mga miyembro nito ang nakatagpo sa putik sa baybayin ng isang bangkang pangisda noong unang siglo BK o AD, na nasa Yigal Allon Centre na ngayon sa kibbutz. Sistematikong hinukay ang Tel Kinrot mula 1982 hanggang 2008, at ang Magdala, na may sinagoga noong unang siglo, ay nahuhukay sa katimugang gilid ng kapatagan."
  da:
    - "Genesaret er den lille slette på Genesaret Søs nordvestlige bred, mellem Magdala og Kapernaum, hvor bakkerne trækker sig tilbage fra vandet i omkring fem kilometer, og bækkene fra det galilæiske højland breder sig ud, før de når søen. Dens navn går sandsynligvis tilbage til Kinneret, Naftalis befæstede by, hvis høj, Tel Kinrot, ligger ved slettens nordende, og som gav søen dens gammeltestamentlige navn, Kinnerets hav; i makkabæertiden var sletten Gennesar, og søen blev kaldt efter den. Josefus, som i 66 e.Kr. havde kommandoen i Galilæa, målte den til tredive stadier langs kysten og tyve ind i landet og kunne ikke prise den nok: valnødder, palmer, figner og oliven voksede side om side, luften passede til alle slags træer, druer og figner modnedes ti måneder om året, og en kilde, folk kaldte Kapharnaum, vandede den."
    - "Evangelierne bringer Jesus hertil én gang ved navn. Efter bespisningen af de fem tusinde og natvandringen på vandet: »da de vare farne over, landede de i Genezareth«, og, som Markus tilføjer, »lagde til der«; folk genkendte ham, bar deres syge på senge derhen, hvor de hørte, at han var, og »bade ham, at de blot maatte røre ved Fligen af hans Klædebon; og alle de, som rørte derved, bleve helbredede«. Lukas kalder hele søen ved sletten navn: det var »ved Genezareths Sø«, at skaren trængte sig sammen om Jesus, og han lærte fra Simons båd før det store fiskedræt og kaldelsen af de første disciple."
    - "Sletten dyrkes i dag af kibbutzen Ginosar, som bevarer navnet, og af landsbyerne omkring den, med bananer og mango under søens hede; i 1986, i et tørkeår, fandt to af dens medlemmer i mudderet ud for kysten en fiskerbåd fra 1. århundrede f.Kr. eller e.Kr., nu i Yigal Allon-centret ved kibbutzen. Tel Kinrot blev udgravet systematisk fra 1982 til 2008, og Magdala med dens synagoge fra 1. århundrede er afdækket ved slettens sydlige kant."
  sr:
    - "Генисарет је мала равница на северозападној обали Галилејског мора, између Магдале и Капернаума, где се брда повлаче од воде око пет километара и потоци са галилејске узвисине разливају пре језера. Име вероватно потиче од Кинерета, утврђеног града Нефталимовог чија хумка, Тел Кинрот, стоји на северном крају равнице и који је језеру дао старозаветно име, море Кинерет; у макавејско доба равница је била Генисар, а језеро је названо по њој. Јосиф Флавије, који је 66. н. е. командовао Галилејом, мерио је равницу тридесет стадија дуж обале и двадесет у унутрашњости и није је могао довољно хвалити: ораси, палме, смокве и маслине расли су једни поред других, ваздух је одговарао свакој врсти дрвећа, грожђе и смокве зрели су десет месеци у години, а изворчић који народ зове Капернаум напајао ју је."
    - "Јеванђеља овде једном по имену доводе Исуса. После храњења пет хиљада и ноћног хода по води, „прешавши дођоше у земљу генисаретску“ и, како додаје Марко, „стадоше у крај“; народ га је познао, носио своје болеснике на одрима где год се чуло да је, и „мољаху Га да се само дотакну скута од Његове хаљине; и који се дотакоше оздравише“. Лука цело језеро назива именом равнице: „код језера генисаретског“ стајао је Исус кад је народ налегао на њега, и он је учио из Симонове лађе пре великог улова риба и позива првих ученика."
    - "Равницу данас обрађује кибуц Гиносар, који чува име, и села око њега, са бананама и мангом под језерском врућином; 1986, у години суше, двојица његових чланова нашла су у блату код обале рибарски чамац из првог века п. н. е. или н. е., који је сада у Центру Игал Алон у кибуцу. Тел Кинрот систематски је ископаван од 1982. до 2008, а Магдала, са синагогом из првог века, откривена је на јужном ободу равнице."
  hu:
    - "Genezáret a Galileai-tenger északnyugati partján fekvő kis síkság Magdala és Kapernaum között, ahol a dombok mintegy öt kilométerre hátrahúzódnak a víztől, és a galileai felföld patakjai szétterülnek, mielőtt a tóba érnek. Neve valószínűleg Kinneretre megy vissza, Naftáli megerősített városára, amelynek halma, a Tel Kinrot, a síkság északi végén áll, és amely az Ószövetségben a tónak a nevét adta, a Kinneret tengerét; a makkabeus korra a síkság Gennesar volt, és a tavat róla nevezték. Josephus, aki Kr. u. 66-ban Galilea parancsnoka volt, a part mentén harminc, a szárazföld felé húsz stádiumra mérte, és nem győzte dicsérni: diófa, pálma, füge és olajfa nőtt egymás mellett, a levegő mindenféle fának megfelelt, a szőlő és a füge az év tíz hónapján át érett, és a nép által Kafarnaumnak nevezett forrás öntözte."
    - "Az evangéliumok egyszer említik itt Jézust néven. Az ötezer megvendégelése és a vízen járás éjszakája után „általkelvén, eljutának Genezáret földére”, és ahogy Márk hozzáteszi, „kikötének”; a nép felismerte, ágyakon vitték betegeiket oda, ahol hallották, hogy van, és kérték őt, „hogy csak az ő ruhájának peremét illethessék. És a kik illeték vala, mindnyájan meggyógyulának.” Lukács az egész tavat a síkság nevén nevezi: a sokaság „a Genezáret tavánál” szorongatta Jézust, aki Simon hajójából tanított a nagy halfogás és az első tanítványok elhívása előtt."
    - "A síkságot ma a nevét őrző Ginoszár kibuc és a körülötte lévő falvak művelik, a tóparti hőségben banánnal és mangóval; 1986-ban, aszályos évben két tagja a part előtti iszapban egy Kr. e. vagy Kr. u. 1. századi halászhajót talált, amely ma a kibuc Yigal Allon Központjában áll. A Tel Kinrotot 1982 és 2008 között rendszeresen ásták, Magdalát pedig első századi zsinagógájával a síkság déli szélén tárják fel."
  fi:
    - "Gennesaret on pieni tasanko Galileanjärven luoteisrannalla Magdalan ja Kapernaumin välissä, missä kukkulat väistyvät vedestä noin viiden kilometrin matkalla ja Galilean ylängön purot levittäytyvät ennen järveä. Sen nimi juontuu luultavasti Kinnerethistä, Naftalin linnoitetusta kaupungista, jonka kumpu Tel Kinrot on tasangon pohjoispäässä ja joka antoi järvelle sen Vanhan testamentin nimen, Kinnerethin meri; makkabealaisella ajalla tasanko oli Gennesar, ja järvi sai nimensä sen mukaan. Josephus, joka johti Galileaa vuonna 66 jaa., mittasi sen kolmekymmentä stadionia rantaa pitkin ja kaksikymmentä sisämaahan eikä voinut kehua sitä tarpeeksi: saksanpähkinät, palmut, viikunat ja oliivit kasvoivat vierekkäin, ilma sopi kaikille puille, rypäleet ja viikunat kypsyivät kymmenen kuukautta vuodesta, ja lähde, jota väki kutsui Kapharnaumiksi, kasteli sitä."
    - "Evankeliumit tuovat Jeesuksen tänne kerran nimeltä. Viidentuhannen ruokkimisen ja yöllisen vedellä kävelemisen jälkeen ”kuljettuaan yli he tulivat maihin Gennesaretiin”, ja kuten Markus lisää, he ”laskivat maihin”; ihmiset tunnistivat hänet, kantoivat sairaansa vuoteilla sinne, missä hänen kuultiin olevan, ja ”he pyysivät häneltä, että vain saisivat koskea hänen vaippansa tupsuun; ja kaikki, jotka koskivat, paranivat”. Luukas kutsuu koko järveä tasangon nimellä: kansa tunkeutui Jeesuksen ympärille ”Gennesaretin järven rannalla”, ja hän opetti Simonin veneestä ennen suurta kalansaalista ja ensimmäisten opetuslasten kutsumista."
    - "Tasankoa viljelee nykyään Ginosarin kibbutsi, joka säilyttää nimen, sekä sitä ympäröivät kylät, ja rannan helteessä kasvaa banaaneja ja mangoja; vuonna 1986, kuivuusvuonna, kaksi kibbutsin jäsentä löysi rannan edustan mudasta eaa. tai jaa. 1. vuosisadan kalastusveneen, joka on nyt kibbutsin Yigal Allon -keskuksessa. Tel Kinrotia kaivettiin järjestelmällisesti vuosina 1982–2008, ja Magdala 1. vuosisadan synagogineen on paljastettu tasangon eteläreunalla."
  vi:
    - "Ghê-nê-xa-rết là đồng bằng nhỏ trên bờ tây bắc của Biển Ga-li-lê, giữa Ma-ga-đan và Ca-bê-na-um, nơi các đồi lùi khỏi mặt nước khoảng 5 km và các dòng suối từ cao nguyên Ga-li-lê tỏa ra trước khi đổ vào hồ. Tên của nó có lẽ bắt nguồn từ Ki-nê-rết, thành kiên cố của Nép-ta-li, có gò là Tel Kinrot nằm ở đầu bắc đồng bằng, và là thành đã cho hồ cái tên trong Cựu Ước, biển Ki-nê-rết; đến thời Maccabee, đồng bằng là Gennesar, và hồ được gọi theo tên ấy. Josephus, người chỉ huy Ga-li-lê năm 66, đo đồng bằng dài 30 stadia dọc bờ và 20 stadia vào trong đất liền và khen không hết lời: óc chó, cọ, vả và ô-liu mọc cạnh nhau, không khí hợp với mọi loại cây, nho và vả chín suốt mười tháng trong năm, và một con suối mà dân gọi là Capharnaum tưới nước cho đồng bằng."
    - "Các sách Phúc Âm đưa Giê-su đến đây một lần có nêu tên. Sau việc nuôi năm ngàn người và đêm đi trên mặt nước, “Khi qua biển rồi, Ngài và môn đồ đến xứ Ghê-nê-xa-rết”, và, như Mác thêm, “ghé thuyền vào bờ”; dân chúng nhận ra Ngài, khiêng người bệnh trên giường đến bất cứ nơi nào nghe Ngài ở, và “xin chỉ cho rờ đến viền áo mà thôi; vậy ai rờ đến cũng đều được lành bịnh cả”. Lu-ca gọi cả hồ bằng tên của đồng bằng: chính “trên bờ hồ Ghê-nê-xa-rết, đoàn dân đông chen lấn nhau xung quanh Ngài”, và Ngài giảng dạy từ thuyền của Si-môn trước mẻ cá lớn và việc kêu gọi các môn đồ đầu tiên."
    - "Ngày nay đồng bằng được canh tác bởi kibbutz Ginosar, vẫn giữ tên, và các làng quanh đó, với chuối và xoài dưới cái nóng ven hồ; năm 1986, trong một năm hạn hán, hai thành viên của kibbutz tìm thấy trong bùn ngoài bờ một chiếc thuyền đánh cá thuộc thế kỷ 1 TCN hoặc thế kỷ 1, nay đặt trong Trung tâm Yigal Allon ở kibbutz. Tel Kinrot được khai quật có hệ thống từ năm 1982 đến 2008, và Ma-ga-đan, với hội đường thế kỷ 1, được phát lộ ở rìa nam đồng bằng."
  ro:
    - "Ghenazaret este câmpia mică de pe țărmul nord-vestic al Mării Galileii, între Magdala și Capernaum, unde dealurile se retrag de la apă pe vreo cinci kilometri, iar pâraiele din înălțimile galileene se răsfiră înainte de a ajunge la lac. Numele ei se leagă probabil de Chineret, orașul întărit al lui Neftali, a cărui movilă, Tel Kinrot, se află la capătul de nord al câmpiei și care a dat lacului numele din Vechiul Testament, marea Chineret; în epoca macabeilor câmpia era Gennesar, iar lacul i-a luat numele. Iosif Flaviu, care a comandat Galileea în 66 d.Hr., a măsurat-o la treizeci de stadii de-a lungul țărmului și douăzeci spre interior și nu o putea lăuda îndeajuns: nuci, palmieri, smochini și măslini creșteau laolaltă, aerul se potrivea oricărui fel de pom, strugurii și smochinele se coceau zece luni pe an, iar un izvor numit de localnici Capharnaum o uda."
    - "Evangheliile îl aduc aici pe Isus o singură dată, pe nume. După înmulțirea pâinilor pentru cei cinci mii și umblarea pe apă în timpul nopții, „au venit în pământul Ghenisaretului”, iar, după cum adaugă Marcu, „au stătut la liman”; oamenii l-au recunoscut și au început „pre paturi a aduce bolnavii acolo unde auziau că este el”, iar „puneau la ulițe pre cei bolnavi și’l rugau pre el ca măcar de poalele veșmintelor lui să se atingă; și câți se atingeau de el, se mântuiau”. Luca numește tot lacul după numele câmpiei: era „lângă iezerul Ghenisaretului” când mulțimea îl îmbulzea pe Isus, iar el a învățat din corabia lui Simon înainte de marea pescuire și de chemarea primilor ucenici."
    - "Câmpia este lucrată astăzi de kibuțul Ghinosar, care îi păstrează numele, și de satele din jur, cu banani și manghieri sub căldura de lângă lac; în 1986, într-un an de secetă, doi dintre membrii lui au găsit în noroi, lângă țărm, o barcă de pescuit din secolul I î.Hr. sau d.Hr., aflată acum în Centrul Yigal Allon de la kibuț. Tel Kinrot a fost săpat sistematic din 1982 până în 2008, iar Magdala, cu sinagoga ei din secolul I, este dezvelită la marginea de sud a câmpiei."
  bg:
    - "Генисарет е малката равнина на северозападния бряг на Галилейското езеро, между Магдала и Капернаум, където хълмовете се отдръпват от водата на около пет километра, а потоците от галилейските възвишения се разливат, преди да стигнат езерото. Името ѝ вероятно води началото си от Кинерет, укрепения град на Нефталим, чиято могила, Тел Кинрот, стои в северния край на равнината и който даде на езерото старозаветното му име, море Кинерет; към епохата на Макавеите равнината се наричаше Генисар и езерото беше назовано по нея. Йосиф Флавий, който командваше Галилея през 66 г. н.е., я измери на тридесет стадия по брега и двадесет навътре и не можеше да ѝ се нахвали: орехи, палми, смокини и маслини растяха една до друга, въздухът подхождаше на всякакви дървета, гроздето и смокините зрееха десет месеца в годината, а извор, наричан от хората Капарнаум, я напояваше."
    - "Евангелията довеждат Исус тук веднъж по име. След нахранването на петте хиляди и нощното ходене по водата „преминаха та дойдоха в земята Генисаретска“ и, както добавя Марко, „се извезоха на пристанището“; хората го познаха, носеха болните си на одри навсякъде, където чуваха, че е, и „молеха го да се допрат само до полите на дрехите му; и колкото се допреха оздравяха“. Лука нарича цялото езеро с името на равнината: именно „при езерото Генисаретско“ народът притискаше Исус, а той поучаваше от ладията на Симон преди големия улов на риба и призоваването на първите ученици."
    - "Днес равнината се обработва от кибуца Гиносар, който пази името ѝ, и от околните села, с банани и манго в крайезерната жега; през 1986 г., в година на суша, двама от членовете му намериха в тинята край брега рибарска лодка от I в. пр.н.е. или н.е., днес в центъра „Игал Алон“ в кибуца. Тел Кинрот беше систематично разкопаван от 1982 до 2008 г., а Магдала със синагогата си от I в. е разкрита в южния край на равнината."
