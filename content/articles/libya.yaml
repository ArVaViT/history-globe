body:
  en:
    - "Libya, to the Greeks, was the whole of Africa west of Egypt, and in the narrower sense the coast between Egypt and Carthage with the green upland of Cyrenaica. The Hebrew Bible has no such name. Its Lehabim, among the sons of Mizraim, and Lubim, the Libyans who marched with Shishak and Zerah and fought for Thebes, are generally identified with the tribes of the western desert whom the Egyptians called Libu, and its Put is usually taken to be Libya too; the Greek translators, the King James Version and the Synodal Bible often write Libya or Libyans for these, so that in Ezekiel's oracle on Egypt “Ethiopia, and Libya, and Lydia” stands for Cush, Put and Lud. Nahum reminds Nineveh that Thebes fell though “Put and Lubim were thy helpers”, where the Synodal Bible has Copts and Libyans, and Daniel's king of the north has “the Libyans and the Ethiopians” at his steps."
    - "Libyan tribes pressed on the Delta from the thirteenth century BC; Merneptah and Rameses III beat them back, but their chiefs settled in Egypt, and from about 945 BC a Libyan house, the Twenty-second Dynasty of Shishak (Shoshenq I), ruled Egypt for two centuries. Greeks from Thera founded Cyrene about 631 BC, and Herodotus, who describes the Libyan tribes from Egypt to the Atlantic, treats Libya as one of the three parts of the world. Under the Ptolemies Jews settled in Cyrenaica in numbers; Rome made Cyrenaica a province in 74 BC and later joined it with Crete."
    - "In the New Testament Libya appears once, at Pentecost, among the homelands of the Jews who heard the apostles in their own tongues: “in Egypt, and in the parts of Libya about Cyrene”. Cyrenians are named with the synagogue of the Libertines in Jerusalem, Simon of Cyrene carried the cross, and men of Cyrene were among the first to preach to Greeks at Antioch. In 115–117 the Jews of Cyrenaica rose against Trajan and were crushed, and the Jewish communities of the region never recovered. Today Libya is a state of North Africa with its capital at Tripoli; the map's point for the region lies in Cyrenaica, where the ruins of Cyrene stand near Shahhat."
  ru:
    - "Ливия у греков — вся Африка к западу от Египта, а в более узком смысле берег между Египтом и Карфагеном с зелёным нагорьем Киренаики. В еврейской Библии такого имени нет. Её Легавим среди сынов Мицраима и лувим — Ливияне, шедшие с Сусакимом и Зараем и сражавшиеся за Фивы, — обычно отождествляются с племенами западной пустыни, которых египтяне звали либу, а её Фут, как правило, тоже понимают как Ливию; греческие переводчики, Библия короля Иакова и Синодальный перевод часто пишут в этих местах Ливия или Ливийцы, так что в пророчестве Иезекииля о Египте «Ефиопия, и Ливия, и Лидия» стоят за Хуш, Фут и Луд. Наум напоминает Ниневии, что Фивы пали, хотя «Копты и Ливийцы приходили на помощь тебе», а за царём севера у Даниила «Ливийцы и Ефиопляне последуют за ним»."
    - "Ливийские племена напирали на Дельту с XIII века до н. э.; Мернептах и Рамсес III отбивали их, но их вожди осели в Египте, и примерно с 945 г. до н. э. ливийский дом, XXII династия Сусакима (Шешонка I), два столетия правил Египтом. Греки с Феры основали Кирену около 631 г. до н. э., и Геродот, описавший ливийские племена от Египта до Атлантики, считает Ливию одной из трёх частей света. При Птолемеях в Киренаике во множестве поселились Иудеи; Рим сделал Киренаику провинцией в 74 г. до н. э., а позднее соединил её с Критом."
    - "В Новом Завете Ливия появляется однажды, в день Пятидесятницы, среди родных земель Иудеев, слышавших апостолов на своих языках: «Египта и частей Ливии, прилежащих к Киринее». Киринейцы названы вместе с синагогой Либертинцев в Иерусалиме, Симон Киринеянин нёс крест, а Киринейцы были среди первых, кто благовествовал Еллинам в Антиохии. В 115–117 годах Иудеи Киренаики восстали против Траяна и были разгромлены, и иудейские общины края так и не оправились. Сегодня Ливия — государство Северной Африки со столицей в Триполи; точка на карте для этой области лежит в Киренаике, где у Шаххата стоят развалины Кирены."
  uk:
    - "Лівія для греків була цілою Африкою на захід від Єгипту, а у вужчому значенні — узбережжям між Єгиптом і Карфагеном із зеленим нагір’ям Киренаїки. У староєврейській Біблії такої назви немає. Її легавім, серед синів Міцраїма, і лубім, ліві, що ходили з Сусакімом і Зерахом і билися за Но, — їх зазвичай ототожнюють із племенами західної пустелі, яких єгиптяни звали лібу, а її Фут зазвичай також уважають Лівією; грецькі перекладачі, Біблія короля Якова та Синодальний переклад часто пишуть Лівія чи ліві для цих назв, тож у пророцтві Єзекіїля про Єгипет «Етіопія й Ливія й Лидия» стоять замість Куша, Фута й Луда. Наум нагадує Ніневії, що Но впало, хоча йому «Копти та Либії помагають йому», і в Даниїла за царем півночі «Ливії і Етіопії пійдуть за ним»."
    - "Лівійські племена тиснули на Дельту від XIII ст. до н. е.; Мернептах і Рамсес III відбили їх, але їхні вожді оселилися в Єгипті, і приблизно від 945 р. до н. е. лівійський дім, XXII династія Сусакіма (Шешонка I), правив Єгиптом два століття. Греки з Тери заснували Кирену близько 631 р. до н. е., а Геродот, який описує лівійські племена від Єгипту до Атлантики, трактує Лівію як одну з трьох частин світу. За Птолемеїв євреї оселилися в Киренаїці у значній кількості; Рим зробив Киренаїку провінцією 74 р. до н. е., а пізніше поєднав її з Критом."
    - "У Новому Завіті Лівія з’являється один раз, на П’ятидесятницю, серед батьківщин євреїв, які чули апостолів своїми мовами: «Єгиптї, і в сторонах Ливийських, що коло Киринеї». Киренейців згадано разом із синагогою лібертинців в Єрусалимі, Симон Киренеянин ніс хрест, а люди з Кирени були серед перших, хто проповідував еллінам в Антіохії. У 115–117 рр. євреї Киренаїки повстали проти Траяна й були розгромлені, і єврейські громади краю так і не оговтались. Сьогодні Лівія — держава Північної Африки зі столицею в Тріполі; точка мапи для цього краю лежить у Киренаїці, де руїни Кирени стоять поблизу Шаххата."
  es:
    - "Libia era para los griegos toda el África al oeste de Egipto y, en sentido más estricto, la costa entre Egipto y Cartago con la verde meseta de la Cirenaica. La Biblia hebrea no tiene tal nombre. Sus Lehabim, entre los hijos de Mizraim, y los Lubim, los libios que marcharon con Sisac y Zera y combatieron por Tebas, se identifican por lo general con las tribus del desierto occidental a las que los egipcios llamaban Libu, y su Fut suele entenderse también como Libia; los traductores griegos, la versión del rey Jacobo y la Biblia sinodal escriben a menudo Libia o libios para ellos, de modo que en el oráculo de Ezequiel sobre Egipto «Etiopía, y Libia, y Lidia» representa a Cus, Fut y Lud. Nahum recuerda a Nínive que Tebas cayó aunque «Put y Libia fueron en tu ayuda», donde la Biblia sinodal tiene coptos y libios, y el rey del norte de Daniel tiene a los libios y a los etíopes a sus pasos."
    - "Las tribus libias presionaron sobre el Delta desde el siglo XIII a. C.; Meneptah y Ramesés III las rechazaron, pero sus jefes se establecieron en Egipto, y desde alrededor de 945 a. C. una casa libia, la dinastía XXII de Sisac (Shoshenq I), gobernó Egipto durante dos siglos. Griegos de Tera fundaron Cirene hacia 631 a. C., y Heródoto, que describe las tribus libias desde Egipto hasta el Atlántico, trata a Libia como una de las tres partes del mundo. Bajo los Ptolomeos, los judíos se establecieron en gran número en la Cirenaica; Roma hizo de la Cirenaica una provincia en 74 a. C. y más tarde la unió con Creta."
    - "En el Nuevo Testamento Libia aparece una vez (la Reina-Valera la llama «Africa»), en Pentecostés, entre las patrias de los judíos que oyeron a los apóstoles en sus propias lenguas: «en Egipto y en las partes de Africa que está de la otra parte de Cirene». Los cireneos se nombran junto con la sinagoga de los Libertinos en Jerusalén, Simón de Cirene llevó la cruz, y hombres de Cirene estuvieron entre los primeros en predicar a los griegos en Antioquía. En 115–117 los judíos de la Cirenaica se alzaron contra Trajano y fueron aplastados, y las comunidades judías de la región nunca se recuperaron. Hoy Libia es un Estado del norte de África con su capital en Trípoli; el punto del mapa para la región está en la Cirenaica, donde se alzan las ruinas de Cirene, cerca de Shahhat."
  pt:
    - "A Líbia, para os gregos, era toda a África a oeste do Egito e, em sentido mais estreito, a costa entre o Egito e Cartago com o verde planalto da Cirenaica. A Bíblia hebraica não tem tal nome. Seus Leabim, entre os filhos de Mizraim, e os Lubim, os líbios que marcharam com Sisaque e Zera e lutaram por Tebas, são geralmente identificados com as tribos do deserto ocidental a quem os egípcios chamavam líbus, e seu Pute é geralmente tomado também por Líbia; os tradutores gregos, a King James Version e a Bíblia Sinodal escrevem com frequência Líbia ou líbios para esses nomes, de modo que, no oráculo de Ezequiel sobre o Egito, a Etiópia, a Líbia e a Lídia correspondem a Cuxe, Pute e Lude. Naum lembra a Nínive que Tebas caiu embora “Pute e a Líbia eram os seus ajudadores”, onde a Bíblia Sinodal traz coptas e líbios, e o rei do norte de Daniel tem “Os líbios e os etíopes” seguindo os seus passos."
    - "Tribos líbias pressionaram o Delta a partir do século XIII a.C.; Merneptá e Ramessés III as repeliram, mas seus chefes se estabeleceram no Egito, e desde cerca de 945 a.C. uma casa líbia, a XXII Dinastia de Sisaque (Sheshonq I), governou o Egito por dois séculos. Gregos de Tera fundaram Cirene por volta de 631 a.C., e Heródoto, que descreve as tribos líbias do Egito ao Atlântico, trata a Líbia como uma das três partes do mundo. Sob os Ptolomeus, judeus se estabeleceram na Cirenaica em grande número; Roma fez da Cirenaica uma província em 74 a.C. e mais tarde a uniu a Creta."
    - "No Novo Testamento a Líbia aparece uma vez, em Pentecostes, entre as terras de origem dos judeus que ouviram os apóstolos em suas próprias línguas: “Egito, as partes da Líbia próximas a Cirene”. Os cireneus são nomeados com a sinagoga dos Libertos em Jerusalém, Simão de Cirene levou a cruz, e homens de Cirene estavam entre os primeiros a pregar aos gregos em Antioquia. Em 115–117 os judeus da Cirenaica se levantaram contra Trajano e foram esmagados, e as comunidades judaicas da região nunca se recuperaram. Hoje a Líbia é um Estado do Norte da África com capital em Trípoli; o ponto do mapa para a região fica na Cirenaica, onde as ruínas de Cirene se erguem perto de Shahhat."
  de:
    - "Libyen war für die Griechen ganz Afrika westlich von Ägypten, im engeren Sinn die Küste zwischen Ägypten und Karthago mit dem grünen Hochland der Kyrenaika. Die hebräische Bibel kennt keinen solchen Namen. Ihre Lehabiter unter den Söhnen Mizraims und die Libyer (Lubim), die mit Schischak und Serach zogen und für Theben kämpften, werden allgemein mit den Stämmen der westlichen Wüste gleichgesetzt, die die Ägypter Libu nannten, und auch ihr Put gilt meist als Libyen; die griechischen Übersetzer, die King-James-Version und die Synodalbibel schreiben dafür oft Libyen oder Libyer, sodass im Spruch Hesekiels über Ägypten „Mohrenland und Libyen und Lud“ für Kusch, Put und Lud steht. Nahum erinnert Ninive, dass Theben fiel, obwohl „Put und Libyen waren ihre Hilfe“ (die Synodalbibel hat dort Kopten und Libyer), und Daniels König des Nordens hat „Libyer und Mohren“ in seinem Zuge."
    - "Libysche Stämme drängten ab dem 13. Jahrhundert v. Chr. auf das Delta; Merenptah und Ramses III. schlugen sie zurück, doch ihre Häuptlinge siedelten in Ägypten, und ab etwa 945 v. Chr. herrschte ein libysches Haus, die 22. Dynastie des Schischak (Scheschonq I.), zwei Jahrhunderte über Ägypten. Griechen von Thera gründeten um 631 v. Chr. Kyrene, und Herodot, der die libyschen Stämme von Ägypten bis zum Atlantik beschreibt, behandelt Libyen als einen der drei Teile der Welt. Unter den Ptolemäern siedelten Juden in großer Zahl in der Kyrenaika; Rom machte die Kyrenaika 74 v. Chr. zur Provinz und vereinigte sie später mit Kreta."
    - "Im Neuen Testament erscheint Libyen einmal, an Pfingsten, unter den Heimatländern der Juden, die die Apostel in ihrer eigenen Sprache hörten: „Ägypten und an den Enden von Lybien bei Kyrene“. Kyrenäer werden mit der Synagoge der Libertiner in Jerusalem genannt, Simon von Kyrene trug das Kreuz, und Männer aus Kyrene gehörten zu den Ersten, die in Antiochia Griechen predigten. In den Jahren 115–117 erhoben sich die Juden der Kyrenaika gegen Trajan und wurden niedergeschlagen, und die jüdischen Gemeinden der Region erholten sich nie. Heute ist Libyen ein Staat Nordafrikas mit der Hauptstadt Tripolis; der Punkt der Karte für die Region liegt in der Kyrenaika, wo die Ruinen von Kyrene bei Schahhat stehen."
  fr:
    - "La Libye, pour les Grecs, était toute l’Afrique à l’ouest de l’Égypte et, plus étroitement, la côte entre l’Égypte et Carthage avec le haut pays vert de la Cyrénaïque. La Bible hébraïque n’a pas ce nom. Ses Lehabim, parmi les fils de Mitsraïm, et ses Lubim, Libyens qui marchèrent avec Schischak et Zérach et combattirent pour Thèbes, sont en général identifiés aux tribus du désert occidental, les Libou des Égyptiens, et son Puth passe aussi pour la Libye ; les traducteurs grecs, la version du roi Jacques et la Bible synodale écrivent souvent Libye ou Libyens, si bien que, dans l’oracle d’Ézéchiel sur l’Égypte, l’Éthiopie, la Libye et la Lydie rendent Cusch, Puth et Lud. Nahum rappelle à Ninive la chute de Thèbes, bien que « Puth et les Libyens étaient ses auxiliaires », où la Bible synodale a Coptes et Libyens, et le roi du nord de Daniel a « les Libyens et les Éthiopiens » à sa suite."
    - "Des tribus libyennes pressèrent le Delta à partir du XIIIe siècle av. J.-C. ; Merenptah et Ramsès III les repoussèrent, mais leurs chefs s’établirent en Égypte, et à partir d’environ 945 av. J.-C. une maison libyenne, la XXIIe dynastie de Schischak (Sheshonq Ier), régna sur l’Égypte pendant deux siècles. Des Grecs de Théra fondèrent Cyrène vers 631 av. J.-C., et Hérodote, qui décrit les tribus libyennes de l’Égypte à l’Atlantique, traite la Libye comme l’une des trois parties du monde. Sous les Ptolémées, des Juifs s’installèrent en nombre en Cyrénaïque ; Rome fit de la Cyrénaïque une province en 74 av. J.-C. et l’unit plus tard à la Crète."
    - "Dans le Nouveau Testament, la Libye apparaît une fois, à la Pentecôte, parmi les patries des Juifs qui entendirent les apôtres dans leurs propres langues : « l’Égypte, le territoire de la Libye voisine de Cyrène ». Des Cyrénéens sont nommés avec la synagogue des Affranchis à Jérusalem, Simon de Cyrène porta la croix, et des hommes de Cyrène furent parmi les premiers à prêcher aux Grecs à Antioche. En 115–117, les Juifs de la Cyrénaïque se soulevèrent contre Trajan et furent écrasés, et les communautés juives de la région ne s’en relevèrent jamais. Aujourd’hui, la Libye est un État d’Afrique du Nord dont la capitale est Tripoli ; le point de la carte pour la région se trouve en Cyrénaïque, où se dressent les ruines de Cyrène près de Chahhat."
  it:
    - "Libia, per i Greci, era l’intera Africa a ovest dell’Egitto e, in senso più stretto, la costa tra l’Egitto e Cartagine con l’altopiano verde della Cirenaica. La Bibbia ebraica non ha un tale nome. I suoi Lehabim, tra i figli di Mizraim, e i Lubim, i Libi che marciarono con Sisak e Zerach e combatterono per Tebe, sono generalmente identificati con le tribù del deserto occidentale che gli Egiziani chiamavano Libu, e il suo Put è di solito inteso come Libia anch’esso; i traduttori greci, la King James Version e la Bibbia sinodale scrivono spesso Libia o Libi per questi nomi, così che nell’oracolo di Ezechiele sull’Egitto «Etiopia, Libia e Lidia» della King James Version stanno per Cus, Put e Lud. Naum ricorda a Ninive che Tebe cadde benché «Put ed i Libi erano i suoi ausiliari», dove la Bibbia sinodale ha Copti e Libi, e il re del nord di Daniele ha «i Libi e gli Etiopi» al suo séguito."
    - "Tribù libiche premettero sul Delta dal XIII secolo a.C.; Merenptah e Ramses III le respinsero, ma i loro capi si stabilirono in Egitto, e dal 945 a.C. circa una casa libica, la XXII dinastia di Sisak (Sheshonq I), governò l’Egitto per due secoli. Greci di Tera fondarono Cirene verso il 631 a.C., ed Erodoto, che descrive le tribù libiche dall’Egitto all’Atlantico, tratta la Libia come una delle tre parti del mondo. Sotto i Tolomei gli ebrei si stabilirono in gran numero nella Cirenaica; Roma fece della Cirenaica una provincia nel 74 a.C. e più tardi la unì a Creta."
    - "Nel Nuovo Testamento la Libia compare una sola volta, a Pentecoste, tra le patrie degli ebrei che udirono gli apostoli nelle proprie lingue: «dell’Egitto e delle parti della Libia Cirenaica». I Cirenei sono nominati insieme alla sinagoga dei Liberti a Gerusalemme, Simone di Cirene portò la croce, e uomini di Cirene furono tra i primi a predicare ai Greci ad Antiochia. Nel 115–117 gli ebrei della Cirenaica si sollevarono contro Traiano e furono schiacciati, e le comunità ebraiche della regione non si ripresero mai. Oggi la Libia è uno stato dell’Africa settentrionale con capitale Tripoli; il punto della mappa per la regione si trova nella Cirenaica, dove le rovine di Cirene sorgono presso Shahhat."
  pl:
    - "Libia była dla Greków całą Afryką na zachód od Egiptu, a w węższym znaczeniu wybrzeżem między Egiptem a Kartaginą z zieloną wyżyną Cyrenajki. Biblia hebrajska nie zna takiej nazwy. Jej Lehabim, wśród synów Misraima, i Lubim, Libijczycy, którzy szli z Sziszakiem i Zerachem i walczyli za Teby, są na ogół utożsamiani z plemionami pustyni zachodniej, które Egipcjanie nazywali Libu, a jej Put zwykle również uchodzi za Libię; greccy tłumacze, Biblia Króla Jakuba i Biblia synodalna często piszą w tych miejscach Libia lub Libijczycy, tak że w wyroczni Ezechiela o Egipcie Etiopia, Libia i Lidia (tak w Biblii Króla Jakuba) oznaczają Kusz, Put i Lud. Nahum przypomina Niniwie, że Teby upadły, choć „Putczycy i Lubimczycy, były mu na pomocy”, gdzie Biblia synodalna ma Koptów i Libijczyków, a za królem północy w Księdze Daniela pójdą Libijczycy i Etiopczycy (Dn 11,43)."
    - "Plemiona libijskie napierały na Deltę od XIII w. p.n.e.; Merenptah i Ramzes III odparli je, ale ich wodzowie osiedlili się w Egipcie, a od około 945 r. p.n.e. libijski ród, XXII dynastia Sziszaka (Szeszonka I), rządził Egiptem przez dwa stulecia. Grecy z Tery założyli Cyrenę około 631 r. p.n.e., a Herodot, który opisuje plemiona libijskie od Egiptu po Atlantyk, traktuje Libię jako jedną z trzech części świata. Za Ptolemeuszów Żydzi osiedlali się w Cyrenajce licznie; Rzym uczynił z Cyrenajki prowincję w 74 r. p.n.e., a później połączył ją z Kretą."
    - "W Nowym Testamencie Libia pojawia się raz, w dniu Pięćdziesiątnicy, wśród ojczyzn Żydów, którzy słyszeli apostołów w swoich językach: „w Egipcie, i w stronach Libii, która jest podle Cyreny”. Cyrenejczycy są wymienieni wraz z synagogą libertynów w Jerozolimie, Szymon z Cyreny niósł krzyż, a ludzie z Cyreny byli wśród pierwszych, którzy głosili Grekom w Antiochii. W latach 115–117 Żydzi Cyrenajki powstali przeciw Trajanowi i zostali zmiażdżeni, a gminy żydowskie tego regionu nigdy się nie podniosły. Dziś Libia jest państwem Afryki Północnej ze stolicą w Trypolisie; punkt mapy dla tego regionu leży w Cyrenajce, gdzie ruiny Cyreny stoją koło Szahhat."
  nl:
    - "Libië was voor de Grieken heel Afrika ten westen van Egypte, en in engere zin de kust tussen Egypte en Carthago met het groene bergland van Cyrenaica. De Hebreeuwse Bijbel kent zo'n naam niet. Zijn Lehabim, onder de zonen van Misraïm, en Lubim, de Libiërs die met Sisak en Zerach optrokken en voor Thebe streden, worden doorgaans vereenzelvigd met de stammen van de westelijke woestijn die de Egyptenaren Libu noemden, en zijn Put geldt meestal ook als Libië; de Griekse vertalers, de King James Version en de Synodale Bijbel schrijven hiervoor vaak Libië of Libiërs, zodat in Ezechiëls godsspraak over Egypte Ethiopië, Libië en Lydië staan voor Kus, Put en Lud. Nahum herinnert Nineve eraan dat Thebe viel, hoewel “Put en Lybea waren tot uw hulp”, waar de Synodale Bijbel Kopten en Libiërs heeft, en bij Daniëls koning van het noorden: “die van Libye, en de Moren zullen in zijn gangen wezen”."
    - "Libische stammen drongen vanaf de dertiende eeuw v.Chr. op de Delta aan; Merenptah en Ramses III sloegen hen terug, maar hun leiders vestigden zich in Egypte, en vanaf ongeveer 945 v.Chr. regeerde een Libisch huis, de tweeëntwintigste dynastie van Sisak (Sjosjenq I), twee eeuwen over Egypte. Grieken van Thera stichtten omstreeks 631 v.Chr. Cyrene, en Herodotus, die de Libische stammen van Egypte tot de Atlantische Oceaan beschrijft, behandelt Libië als een van de drie delen van de wereld. Onder de Ptolemaeën vestigden joden zich in groten getale in Cyrenaica; Rome maakte van Cyrenaica in 74 v.Chr. een provincie en voegde het later samen met Kreta."
    - "In het Nieuwe Testament komt Libië één keer voor, met Pinksteren, onder de vaderlanden van de joden die de apostelen in hun eigen taal hoorden: “Egypte, en de delen van Libye, hetwelk bij Cyrene ligt”. Cyreneeërs worden genoemd met de synagoge der Libertijnen in Jeruzalem, Simon van Cyrene droeg het kruis, en mannen uit Cyrene behoorden tot de eersten die in Antiochië aan Grieken predikten. In 115–117 kwamen de joden van Cyrenaica in opstand tegen Trajanus en werden verpletterd, en de joodse gemeenschappen van de streek herstelden zich nooit. Tegenwoordig is Libië een staat in Noord-Afrika met als hoofdstad Tripoli; het punt van de kaart voor de regio ligt in Cyrenaica, waar de ruïnes van Cyrene bij Shahhat staan."
  cs:
    - "Libye byla pro Řeky celá Afrika západně od Egypta a v užším smyslu pobřeží mezi Egyptem a Kartágem se zelenou vysočinou Kyrenaiky. Hebrejská Bible takové jméno nezná. Její Lehabim mezi syny Mizrajimovými a Lubim, Libyjci, kteří táhli se Šíšakem a Zerachem a bojovali za Théby, se obecně ztotožňují s kmeny západní pouště, které Egypťané nazývali Libu, a její Put se obvykle pokládá rovněž za Libyi; řečtí překladatelé, anglická Bible krále Jakuba i synodální Bible často píší pro tyto kmeny Libye nebo Libyjci, takže v Ezechielově proroctví o Egyptu stojí Etiopie, Libye a Lýdie za Kúš, Put a Lud. Nachum připomíná Ninive, že Théby padly, ač „Putští a Lubimští, byli jemu na pomoc“, kde synodální Bible má Kopty a Libyjce, a o Danielově králi severu se praví: „Lubimští také a Mouřenínové za ním půjdou“."
    - "Libyjské kmeny tlačily na Deltu od 13. století př. n. l.; Merneptah a Ramesse III. je zahnali, ale jejich náčelníci se usadili v Egyptě a od asi roku 945 př. n. l. vládl Egyptu dvě století libyjský rod, dvaadvacátá dynastie Šíšaka (Šošenka I.). Řekové z Thery založili kolem roku 631 př. n. l. Kyrénu a Hérodotos, který popisuje libyjské kmeny od Egypta k Atlantiku, pokládá Libyi za jednu ze tří částí světa. Za Ptolemaiovců se Židé v Kyrenaice usazovali ve velkém počtu; Řím učinil z Kyrenaiky roku 74 př. n. l. provincii a později ji spojil s Krétou."
    - "V Novém zákoně se Libye objevuje jednou, o Letnicích, mezi domovy Židů, kteří slyšeli apoštoly ve svých jazycích: „v Egyptě a v krajinách Libye, kteráž jest vedle Cyrénu“. Kyréňané jsou jmenováni spolu se synagogou libertinů v Jeruzalémě, Šimon Kyrénský nesl kříž a muži z Kyrény byli mezi prvními, kdo kázali Řekům v Antiochii. V letech 115–117 se Židé v Kyrenaice vzbouřili proti Traianovi a byli rozdrceni a židovské obce v oblasti se už nikdy nevzpamatovaly. Dnes je Libye stát v severní Africe s hlavním městem Tripolisem; bod mapy pro oblast leží v Kyrenaice, kde u Shahhatu stojí zříceniny Kyrény."
  sv:
    - "Libyen var för grekerna hela Afrika väster om Egypten, och i snävare mening kusten mellan Egypten och Kartago med Cyrenaikas gröna högland. Den hebreiska Bibeln har inget sådant namn. Dess Lehabim, bland Misraims söner, och Lubim, libyerna som tågade med Shishak och Serach och stred för Thebe, identifieras vanligen med västöknens stammar som egyptierna kallade Libu, och dess Put anses vanligen också vara Libyen; de grekiska översättarna, King James Version och Synodalbibeln skriver ofta Libyen eller libyer för dessa, så att i Hesekiels utsaga om Egypten orden Etiopien, Libyen och Lydien står för Kush, Put och Lud. Nahum påminner Nineve om att Thebe föll fastän ”putéer och libyer voro dig till hjälp”, där Synodalbibeln har kopter och libyer, och Daniels konung i norr har ”libyer och etiopier” i sitt följe."
    - "Libyska stammar trängde på Deltat från 1200-talet f.Kr.; Merneptah och Ramses III slog dem tillbaka, men deras hövdingar bosatte sig i Egypten, och från omkring 945 f.Kr. styrde ett libyskt hus, den tjugoandra dynastin under Shishak (Shoshenq I), Egypten i två århundraden. Greker från Thera grundade Kyrene omkring 631 f.Kr., och Herodotos, som beskriver de libyska stammarna från Egypten till Atlanten, räknar Libyen som en av världens tre delar. Under ptolemaierna bosatte sig judar i Cyrenaika i stort antal; Rom gjorde Cyrenaika till provins 74 f.Kr. och förenade den senare med Kreta."
    - "I Nya testamentet förekommer Libyen en gång, vid pingsten, bland hemländerna för de judar som hörde apostlarna tala på sina egna tungomål: ”i Egypten eller i Libyens bygder, åt Cyrene till”. Kyrenéer nämns med libertinernas synagoga i Jerusalem, Simon från Kyrene bar korset, och män från Kyrene var bland de första som predikade för greker i Antiochia. Åren 115–117 reste sig judarna i Cyrenaika mot Trajanus och krossades, och regionens judiska samfund återhämtade sig aldrig. I dag är Libyen en stat i Nordafrika med huvudstad i Tripoli; kartans punkt för regionen ligger i Cyrenaika, där ruinerna av Kyrene står nära Shahhat."
  nb:
    - "Libya var for grekerne hele Afrika vest for Egypt, og i snevrere forstand kysten mellom Egypt og Kartago med det grønne høylandet Kyrenaika. Den hebraiske Bibelen har ikke noe slikt navn. Dens Lehabim, blant Misraims sønner, og Lubim, libyerne som marsjerte med Sjisjak og Serah og kjempet for Teben, identifiseres vanligvis med stammene i den vestlige ørkenen som egypterne kalte Libu, og dens Put regnes vanligvis også for Libya; de greske oversetterne, King James-oversettelsen og den russiske synodalbibelen skriver ofte Libya eller libyere for disse, slik at «Etiopia, Libya og Lydia» i Esekiels orakel mot Egypt står for Kusj, Put og Lud. Nahum minner Ninive om at Teben falt selv om «puteere og libyere var dets hjelp», der den russiske synodalbibelen har koptere og libyere, og Daniels nordens konge har «libyere og etiopere» i sitt følge."
    - "Libyske stammer presset på Deltaet fra 1200-tallet f.Kr.; Merneptah og Ramses III slo dem tilbake, men deres høvdinger bosatte seg i Egypt, og fra omkring 945 f.Kr. styrte et libysk hus, Sjisjaks (Shoshenq I) 22. dynasti, Egypt i to århundrer. Grekere fra Thera grunnla Kyrene omkring 631 f.Kr., og Herodot, som beskriver de libyske stammene fra Egypt til Atlanterhavet, behandler Libya som en av verdens tre deler. Under ptolemeerne bosatte jøder seg i stort antall i Kyrenaika; Roma gjorde Kyrenaika til provins i 74 f.Kr. og forente den senere med Kreta."
    - "I Det nye testamente forekommer Libya én gang, ved pinse, blant hjemlandene til jødene som hørte apostlene tale på sine egne tungemål: «Egypten og landskapene i Libya ved Kyrene». Kyreneerne nevnes i Jerusalem sammen med synagogen som kalles «de frigittes og kyreneernes og aleksandrinernes», Simon fra Kyrene bar korset, og menn fra Kyrene var blant de første som forkynte for grekerne i Antiokia. I 115–117 reiste jødene i Kyrenaika seg mot Trajan og ble knust, og de jødiske samfunnene i området kom aldri til hektene igjen. I dag er Libya en stat i Nord-Afrika med hovedstad i Tripoli; kartets punkt for regionen ligger i Kyrenaika, der ruinene av Kyrene ligger nær Shahhat."
  tl:
    - "Libia, sa mga Griyego, ang buong Aprika sa kanluran ng Egipto, at sa makitid na kahulugan ang baybayin sa pagitan ng Egipto at Cartago kasama ang luntiang kabundukan ng Cirenaica. Walang gayong pangalan ang Hebreong Biblia. Ang Lehabim nito, sa mga anak ni Mizraim, at ang Lubim, mga Libiong sumama kay Sisac at Zera at lumaban para sa Thebes, ay karaniwang itinutumbas sa tribo ng kanlurang disyerto, ang Libu ng Egipcio, at karaniwang Libia rin ang Phut; madalas Libia o Libio ang isinusulat dito ng salin sa Griyego, King James at Synodal, kaya sa orakulo ni Ezekiel sa Egipto, ang Etiopia, Libia at Lidia ay Cush, Phut at Lud. Paalala ni Nahum sa Ninive: bumagsak ang Thebes bagaman “Phut at Lubim ang iyong mga naging katulong” (Copto at Libio sa Synodal), at sa hari ng hilaga ni Daniel, “ang mga taga Libia at ang mga taga Etiopia” ay nasa mga hakbang niya."
    - "Binagabag ng mga tribong Libio ang Delta mula sa ika-13 siglo BK; pinaatras sila nina Merneptah at Rameses III, ngunit nanirahan sa Egipto ang kanilang mga pinuno, at mula mga 945 BK, isang angkang Libio, ang Ika-22 Dinastiya ni Sisac (Shoshenq I), ay namuno sa Egipto nang dalawang siglo. Itinatag ng mga Griyego mula sa Thera ang Cirene mga 631 BK, at si Herodotus, na naglalarawan sa mga tribong Libio mula Egipto hanggang Atlantiko, ay itinuturing ang Libia na isa sa tatlong bahagi ng daigdig. Sa ilalim ng mga Ptolemeo, nanirahan nang marami ang mga Judio sa Cirenaica; ginawang lalawigan ng Roma ang Cirenaica noong 74 BK at kalaunan ay isinama sa Creta."
    - "Sa Bagong Tipan, minsan lamang lumilitaw ang Libia, sa Pentecostes, sa mga sinilangang lupain ng mga Judiong nakarinig sa mga apostol sa kani-kanilang wika: “sa Egipto at sa mga sakop ng Libia na karatig ng Cirene”. Pinangangalanan ang mga taga-Cirene kasama ng sinagoga ng mga Libertino sa Jerusalem, dinala ni Simon na taga-Cirene ang krus, at ang mga lalaki ng Cirene ay kabilang sa mga unang nangaral sa mga Griyego sa Antioquia. Noong 115–117, nag-alsa ang mga Judio ng Cirenaica laban kay Trajano at dinurog, at hindi na nakabawi ang mga pamayanang Judio ng rehiyon. Ngayon ang Libia ay estado ng Hilagang Aprika na may kabisera sa Tripoli; ang punto ng mapa para sa rehiyon ay nasa Cirenaica, kung saan nakatayo ang mga guho ng Cirene malapit sa Shahhat."
  da:
    - "Libyen var for grækerne hele Afrika vest for Egypten, og i snævrere forstand kysten mellem Egypten og Karthago med Kyrenaikas grønne højland. Den hebraiske bibel har ikke noget sådant navn. Dens Lehabim, blandt Mizrajims sønner, og Lubim, libyerne, der drog med Sjisjak og Zerah og kæmpede for Theben, identificeres almindeligvis med stammerne i den vestlige ørken, som egypterne kaldte Libu, og dens Put tages sædvanligvis også for Libyen; de græske oversættere, King James-oversættelsen og synodalbibelen skriver ofte Libyen eller libyere for disse, så Etiopien, Libyen og Lydien i King James-oversættelsens Ezekiel-udsagn om Egypten står for Kusj, Put og Lud. Nahum minder Nineve om, at Theben faldt, selv om »de af Put og Lybia vare din Hjælp«, hvor synodalbibelen har kopterne og libyerne, og Daniels konge i nord får følge: »Lybier og Morianer skulle følge ham«."
    - "Libyske stammer pressede på Deltaet fra 1200-tallet f.Kr.; Merneptah og Ramses III slog dem tilbage, men deres høvdinge bosatte sig i Egypten, og fra omkring 945 f.Kr. herskede et libysk hus, Sjisjaks (Shoshenq I) 22. dynasti, over Egypten i to århundreder. Grækere fra Thera grundlagde Kyrene omkring 631 f.Kr., og Herodot, der beskriver de libyske stammer fra Egypten til Atlanterhavet, behandler Libyen som en af verdens tre dele. Under ptolemæerne bosatte jøder sig i stort tal i Kyrenaika; Rom gjorde Kyrenaika til provins i 74 f.Kr. og forenede den senere med Kreta."
    - "I Det Nye Testamente optræder Libyen én gang, ved pinse, blandt hjemlandene for de jøder, der hørte apostlene tale på deres egne tungemål: »Ægypten og Libyens Egne ved Kyrene«. Kyrenæere nævnes med de frigivnes synagoge i Jerusalem, Simon fra Kyrene bar korset, og mænd fra Kyrene var blandt de første til at prædike for grækere i Antiokia. I 115–117 rejste jøderne i Kyrenaika sig mod Trajan og blev knust, og de jødiske samfund i regionen kom sig aldrig. I dag er Libyen en stat i Nordafrika med hovedstad i Tripoli; kortets punkt for regionen ligger i Kyrenaika, hvor ruinerne af Kyrene står nær Shahhat."
  sr:
    - "Либија је за Грке била читава Африка западно од Египта, а у ужем смислу обала између Египта и Картагине са зеленом горском земљом Киренајке. Хебрејска Библија нема такво име. Њени Лавеји, међу синовима Месраимовим, и Лувеји, Либијци који су ишли са Сисаком и Заром и борили се за Но, углавном се поистовећују с племенима западне пустиње која су Египћани звали Либу, а њен Фут се обично такође узима за Либију; грчки преводиоци, Библија краља Џејмса и Синодална Библија често за њих пишу Либија или Либијци, тако да у Језекиљевом пророштву о Египту Етиопија, Либија и Лидија стоје за Хус, Фут и Луд. Наум подсећа Ниниву да је Но пао иако „Футеји и Ливеји беху ти помоћници“, где Синодална Библија има Копте и Либијце, а за Даниловим царем севера „Ливијани и Етиопљани ићи ће за њим“."
    - "Либијска племена притискала су Делту од XIII века п. н. е.; Мернептах и Рамзес III одбили су их, али су се њихове вође настаниле у Египту, и од око 945. п. н. е. либијска кућа, Двадесет друга династија Сисака (Шошенка I), владала је Египтом два века. Грци са Тере основали су Кирену око 631. п. н. е., а Херодот, који описује либијска племена од Египта до Атлантика, сматра Либију једним од три дела света. Под Птолемејевићима су се Јевреји у великом броју настанили у Киренајци; Рим је 74. п. н. е. од Киренајке начинио провинцију и касније је спојио с Критом."
    - "У Новом завету Либија се јавља једном, о Педесетници, међу завичајима Јевреја који су чули апостоле на својим језицима: „из Мисира и крајева ливијских код Кирине“. Киринци се помињу уз зборницу „ливерћанску“ у Јерусалиму, Симон из Кирене носио је крст, а људи из Кирене били су међу првима који су проповедали Грцима у Антиохији. Јевреји Киренајке дигли су се 115–117. против Трајана и били сломљени, а јеврејске заједнице те области никад се нису опоравиле. Данас је Либија држава у северној Африци с престоницом у Триполију; тачка на мапи за ту област лежи у Киренајци, где рушевине Кирене стоје близу Шахата."
  hu:
    - "Líbia a görögöknek Afrika egész Egyiptomtól nyugatra eső része volt, szűkebb értelemben az Egyiptom és Karthágó közötti part Kürenaika zöld fennsíkjával. A héber Biblia nem ismer ilyen nevet. Lehábim, Micrájim fiai között, és Lubim, a líbiaiak, akik Sisakkal és Zerahhal vonultak, és Thébáért harcoltak, általában a nyugati sivatag törzsei, akiket az egyiptomiak Libunak neveztek, Pútot pedig általában szintén Líbiának veszik; a görög fordítók, a King James-fordítás és a szinodális Biblia gyakran Líbiát vagy líbiaiakat írnak ezek helyett, így Ezékiel Egyiptom elleni jövendölésében „A szerecsenek s a libiaiak s a lidiaiak” Kúst, Pútot és Lúdot jelenti. Náhum emlékezteti Ninivét, hogy Théba elesett, noha „Puth és Libia is segítőid voltak”, ahol a szinodális Biblia koptokat és líbiaiakat ír, Dániel északi királyának lépései nyomán pedig „libiabeliek és szerecsenek” járnak."
    - "Líbiai törzsek a Kr. e. 13. századtól nyomultak a Deltára; Merenptah és III. Ramszesz visszaverte őket, de főnökeik Egyiptomban telepedtek le, és Kr. e. 945 körül egy líbiai ház, a Sisak (I. Sosenk) XXII. dinasztiája két évszázadig uralkodott Egyiptom fölött. Théráról érkező görögök Kr. e. 631 körül alapították Cirenét, Hérodotosz, aki a líbiai törzseket Egyiptomtól az Atlanti-óceánig leírja, Líbiát a világ három része egyikének tekinti. A Ptolemaiosok alatt zsidók nagy számban telepedtek le Kürenaikában; Róma Kr. e. 74-ben tartománnyá tette, később Krétával egyesítette."
    - "Az Újszövetségben Líbia egyszer fordul elő, pünkösdkor, azon zsidók hazái között, akik az apostolokat saját nyelvükön hallották: „Égyiptomban és Libiának tartományiban, mely Cziréne mellett van”. A cireneiek a libertinusok jeruzsálemi zsinagógájával együtt szerepelnek, a cirenei Simon vitte a keresztet, és cireneiek voltak az elsők között, akik Antiókhiában görögöknek prédikáltak. 115–117-ben a kürenaikai zsidók fellázadtak Traianus ellen, és leverték őket, a térség zsidó közösségei soha nem épültek fel. Ma Líbia Észak-Afrika állama, fővárosa Tripoli; a térkép pontja a térségre Kürenaikában van, ahol Cirene romjai állnak Shahhat közelében."
  fi:
    - "Libya oli kreikkalaisille koko Afrikka Egyptin länsipuolella ja suppeammin Egyptin ja Karthagon välinen rannikko Kyrenaikan vihreine ylänköineen. Heprealaisessa Raamatussa ei ole tuota nimeä. Sen lehabilaiset, Misraimin poikien joukossa, ja lubim, libyalaiset, jotka kulkivat Sisakin ja Serahin mukana ja taistelivat Teebaa varten, tunnistetaan yleensä läntisen aavikon Libu-heimoiksi, ja Putinkin katsotaan yleensä tarkoittavan Libyaa; kreikkalaiset kääntäjät, King James -käännös ja Synodaalinen Raamattu kirjoittavat usein näiden kohdalla Libya tai libyalaiset, joten Hesekielin Egypti-ennustuksessa Etiopia, Libya ja Lyydia vastaavat Kusia, Putia ja Luudia. Nahum muistuttaa Niinivelle, että Teeba kaatui, vaikka ”Auttajinasi olivat Puut ja liibyalaiset” (Synodaalisessa: koptit ja libyalaiset), ja Danielin pohjoisen kuninkaan askelissa ovat ”liibyalaiset ja etiopialaiset”."
    - "Libyalaisheimot painostivat Niilin suistoa 1200-luvulta eaa. alkaen; Merneptah ja Ramses III löivät ne takaisin, mutta niiden päälliköt asettuivat Egyptiin, ja noin vuodesta 945 eaa. libyalainen suku, Sisakin (Sosenq I) 22. dynastia, hallitsi Egyptiä kaksi vuosisataa. Theran kreikkalaiset perustivat Kyrenen noin 631 eaa., ja Herodotos, joka kuvaa libyalaisheimot Egyptistä Atlantille, pitää Libyaa yhtenä maailman kolmesta osasta. Ptolemaiosten aikana juutalaisia asettui Kyrenaikaan suurin joukoin; Rooma teki Kyrenaikasta provinssin vuonna 74 eaa. ja liitti sen myöhemmin Kreetaan."
    - "Uudessa testamentissa Libya esiintyy kerran, helluntaina, apostolien puhetta omilla kielillään kuulleiden juutalaisten kotimaiden joukossa: ”Egyptissä ja Kyrenen puoleisen Liibyan alueilla”. Kyreniläiset mainitaan Jerusalemin libertiinien synagoogan yhteydessä, Simon Kyreneläinen kantoi ristiä, ja kyreniläiset miehet olivat ensimmäisiä, jotka saarnasivat kreikkalaisille Antiokiassa. Vuosina 115–117 Kyrenaikan juutalaiset nousivat Trajanusta vastaan ja musertuivat, eivätkä alueen juutalaisyhteisöt koskaan toipuneet. Nykyään Libya on Pohjois-Afrikan valtio, jonka pääkaupunki on Tripoli; kartan piste alueelle sijaitsee Kyrenaikassa, missä Kyrenen rauniot ovat lähellä Shahhatia."
  vi:
    - "Li-by, đối với người Hy Lạp, là toàn bộ châu Phi phía tây Ai Cập, và theo nghĩa hẹp hơn là bờ biển giữa Ai Cập và Carthage cùng cao nguyên xanh Cyrenaica. Kinh Thánh Hê-bơ-rơ không có tên như vậy. Lê-ha-bim, trong các con của Mích-ra-im, và Li-by, những người Li-by đã hành quân cùng Si-sắc và Xê-rách và chiến đấu bảo vệ Nô, thường được đồng nhất với các bộ tộc ở sa mạc phía tây mà người Ai Cập gọi là Libu, và Phút thường được hiểu cũng là Li-by; các dịch giả Hy Lạp, bản King James và bản Synodal thường viết Libya hay người Libya cho những tên này, nên trong lời sấm của Ê-xê-chi-ên về Ai Cập, Ethiopia, Libya và Lydia chỉ Cút, Phút và Lút. Na-hum nhắc Ni-ni-ve rằng Nô đã sụp đổ dù “Phút và Li-by là kẻ cứu giúp ngươi”, nơi bản Synodal có người Copt và người Libya, và về vua phương bắc của Đa-ni-ên có chép: “Dân Li-by và dân Ê-thi-ô-bi sẽ theo sau người”."
    - "Các bộ tộc Li-by ép vào châu thổ sông Nin từ thế kỷ 13 TCN; Merneptah và Ramesses III đánh lui họ, nhưng các tù trưởng định cư ở Ai Cập, và từ khoảng năm 945 TCN một nhà Li-by, Vương triều thứ 22 của Si-sắc (Shoshenq I), cai trị Ai Cập hai thế kỷ. Người Hy Lạp từ Thera lập Sy-ren khoảng năm 631 TCN, và Herodotus, người mô tả các bộ tộc Li-by từ Ai Cập đến Đại Tây Dương, coi Li-by là một trong ba phần của thế giới. Dưới các vua Ptolemy, người Do Thái định cư đông ở Cyrenaica; La Mã lập Cyrenaica thành tỉnh năm 74 TCN và sau đó nhập với Cơ-rết."
    - "Trong Tân Ước, Li-by xuất hiện một lần, vào lễ Ngũ Tuần, trong số quê hương của những người Do Thái nghe các sứ đồ nói tiếng mình: “Ê-díp-tô, đất Li-by gần Sy-ren”. Người Sy-ren được nêu cùng nhà hội của những người được tự do ở Giê-ru-sa-lem, Si-môn người Sy-ren vác thập tự, và người Sy-ren nằm trong số những người đầu tiên giảng cho người Hy Lạp ở An-ti-ốt. Năm 115–117, người Do Thái ở Cyrenaica nổi dậy chống Trajan và bị dẹp tan, và các cộng đồng Do Thái trong vùng không bao giờ hồi phục. Ngày nay Li-by là một quốc gia Bắc Phi với thủ đô Tripoli; điểm của bản đồ cho vùng này nằm ở Cyrenaica, nơi tàn tích Sy-ren đứng gần Shahhat."
  ro:
    - "Libia, pentru greci, era întreaga Africă de la vest de Egipt, iar în sens mai îngust coasta dintre Egipt și Cartagina, cu platoul verde al Cirenaicii. Biblia ebraică nu are un astfel de nume. Lehabim, printre fiii lui Mițraim, și Lubim, libienii care au mărșăluit cu Șișac și cu Zerah și au luptat pentru Teba, sunt în general identificați cu triburile deșertului vestic pe care egiptenii le numeau Libu, iar Put este de obicei socotit tot Libia; traducătorii greci, King James Version și Biblia sinodală scriu adesea Libia sau libieni pentru acestea, așa că în oracolul lui Ezechiel despre Egipt, Etiopia, Libia și Lidia stau pentru Cuș, Put și Lud. Naum îi amintește Ninivei că Teba a căzut deși „Livienii s’au făcut ajutor ei”, unde Biblia sinodală are copți și libieni, iar regele de miazănoapte din Daniel are libienii și etiopienii în urma pașilor săi."
    - "Triburile libiene au apăsat asupra Deltei din secolul al XIII-lea î.Hr.; Merneptah și Ramses al III-lea le-au respins, dar căpeteniile lor s-au așezat în Egipt, iar din jurul anului 945 î.Hr. o casă libiană, a XXII-a dinastie a lui Șișac (Shoshenq I), a condus Egiptul două secole. Grecii din Thera au întemeiat Cirene în jurul anului 631 î.Hr., iar Herodot, care descrie triburile libiene din Egipt până la Atlantic, tratează Libia ca una dintre cele trei părți ale lumii. Sub Ptolemei, iudeii s-au așezat în număr mare în Cirenaica; Roma a făcut din Cirenaica provincie în 74 î.Hr. și a unit-o mai târziu cu Creta."
    - "În Noul Testament Libia apare o singură dată, la Cincizecime, printre țările de baștină ale iudeilor care i-au auzit pe apostoli în limbile lor: „în Eghipet, și în părțile Liviei cele de lângă Chirini”. Cirenienii sunt numiți alături de sinagoga libertinilor din Ierusalim, Simon din Cirene a purtat crucea, iar oameni din Cirene au fost printre primii care au predicat grecilor la Antiohia. În 115–117, iudeii din Cirenaica s-au răsculat împotriva lui Traian și au fost zdrobiți, iar comunitățile iudaice din regiune nu și-au revenit niciodată. Astăzi Libia este un stat din Africa de Nord cu capitala la Tripoli; punctul hărții pentru regiune se află în Cirenaica, unde ruinele Cirenei stau lângă Shahhat."
  bg:
    - "За гърците Либия е била цяла Африка на запад от Египет, а в по-тесен смисъл — брегът между Египет и Картаген със зеленото плато на Киренайка. Еврейската Библия няма такова име. Нейните лехавимци, сред синовете на Мицраим, и лувимци — либийците, които вървели със Сусаким и Зерах и воювали за Тива, — обикновено се отъждествяват с племената от западната пустиня, които египтяните наричали либу, а Фут също обикновено се смята за Либия; гръцките преводачи, King James Version и Синодалната Библия често пишат за тях Либия или либийци, така че в пророчеството на Йезекиил за Египет „Етиопяни, и Левийци, и Лидийци“ стоят на мястото на Куш, Фут и Луд. Наум напомня на Ниневия, че Тива паднала, макар че „Фут и Ливийците бяха твои помощници“, където Синодалната Библия има копти и либийци, а северният цар у Даниил има „Ливияните и Етиопяните“ подир стъпките си."
    - "Либийски племена притискат Делтата от XIII в. пр.н.е.; Мернептах и Рамзес III ги отблъскват, но вождовете им се заселват в Египет и от около 945 г. пр.н.е. либийски дом, Двадесет и втората династия на Сусаким (Шешонк I), управлява Египет два века. Гърци от Тера основават Кириния около 631 г. пр.н.е., а Херодот, който описва либийските племена от Египет до Атлантика, разглежда Либия като една от трите части на света. При Птолемеите юдеи се заселват в голям брой в Киренайка; Рим превръща Киренайка в провинция през 74 г. пр.н.е. и по-късно я обединява с Крит."
    - "В Новия завет Либия се появява веднъж, на Петдесетница, сред родините на юдеите, които чули апостолите на собствените си езици: „Египет и Ливийските страни които са около Киринея“. Киринейци са назовани заедно със синагогата на либертинците в Йерусалим, Симон Киринеец понесе кръста, а мъже от Кириния бяха сред първите, които проповядваха на гърците в Антиохия. През 115–117 г. юдеите от Киренайка въстават срещу Траян и са смазани, а юдейските общности в региона така и не се възстановяват. Днес Либия е държава в Северна Африка със столица Триполи; точката на картата за региона е в Киренайка, където развалините на Кириния стоят близо до Шахат."
