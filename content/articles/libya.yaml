# Overview article (ADR 0007). Mainstream facts only; the record holds the verses the map files under Libya (Put in Ezekiel, Lubim in Nahum, Libya in Acts), and the article does not restate the Put article.
id: libya
place: ac12af9
title:
  en: "Libya"
  ru: "Ливия"
  uk: "Лівія"
  es: "Libia"
  pt: "Líbia"
  de: "Libyen"
  fr: "Libye"
body:
  en:
    - "Libya, to the Greeks, was the whole of Africa west of Egypt, and in the narrower sense the coast between Egypt and Carthage with the green upland of Cyrenaica. The Hebrew Bible has no such name. Its Lehabim, among the sons of Mizraim, and Lubim, the Libyans who marched with Shishak and Zerah and fought for Thebes, are the tribes of the western desert whom the Egyptians called Libu, and its Put is usually taken to be Libya too; the Greek translators, the King James Version and the Synodal Bible often write Libya or Libyans for these, so that in Ezekiel's oracle on Egypt “Ethiopia, and Libya, and Lydia” stands for Cush, Put and Lud. Nahum reminds Nineveh that Thebes fell though “Put and Lubim were thy helpers”, where the Synodal Bible has Copts and Libyans, and Daniel's king of the north has “the Libyans and the Ethiopians” at his steps."
    - "Libyan tribes pressed on the Delta from the thirteenth century BC; Merneptah and Rameses III beat them back, but their chiefs settled in Egypt, and from about 945 BC a Libyan house, the Twenty-second Dynasty of Shishak (Shoshenq I), ruled Egypt for two centuries. Greeks from Thera founded Cyrene about 631 BC, and Herodotus, who describes the Libyan tribes from Egypt to the Atlantic, treats Libya as one of the three parts of the world. Under the Ptolemies Jews settled in Cyrenaica in numbers; Rome made Cyrenaica a province in 74 BC and in 67 BC joined it with Crete."
    - "In the New Testament Libya appears once, at Pentecost, among the homelands of the Jews who heard the apostles in their own tongues: “in Egypt, and in the parts of Libya about Cyrene”. The Cyrenian Jews had a synagogue of their own in Jerusalem, Simon of Cyrene carried the cross, and men of Cyrene were among the first to preach to Greeks at Antioch. In 115–117 the Jews of Cyrenaica rose against Trajan and were crushed, and the Jewish communities of the region never recovered. Today Libya is a state of North Africa with its capital at Tripoli; the map's point for the region lies in Cyrenaica, where the ruins of Cyrene stand near Shahhat."
  ru:
    - "Ливия у греков — вся Африка к западу от Египта, а в более узком смысле берег между Египтом и Карфагеном с зелёным нагорьем Киренаики. В еврейской Библии такого имени нет. Её Легавим среди сынов Мицраима и лувим — Ливияне, шедшие с Сусакимом и Зараем и сражавшиеся за Фивы, — это племена западной пустыни, которых египтяне звали либу, а её Фут обычно тоже понимают как Ливию; греческие переводчики, Библия короля Иакова и Синодальный перевод часто пишут в этих местах Ливия или Ливийцы, так что в пророчестве Иезекииля о Египте «Ефиопия, и Ливия, и Лидия» стоят за Хуш, Фут и Луд. Наум напоминает Ниневии, что Фивы пали, хотя «Копты и Ливийцы приходили на помощь тебе», а за царём севера у Даниила «Ливийцы и Ефиопляне последуют за ним»."
    - "Ливийские племена напирали на Дельту с XIII века до н. э.; Мернептах и Рамсес III отбивали их, но их вожди осели в Египте, и примерно с 945 г. до н. э. ливийский дом, XXII династия Сусакима (Шешонка I), два столетия правил Египтом. Греки с Феры основали Кирену около 631 г. до н. э., и Геродот, описавший ливийские племена от Египта до Атлантики, считает Ливию одной из трёх частей света. При Птолемеях в Киренаике во множестве поселились Иудеи; Рим сделал Киренаику провинцией в 74 г. до н. э., а в 67 г. до н. э. соединил её с Критом."
    - "В Новом Завете Ливия появляется однажды, в день Пятидесятницы, среди родных земель Иудеев, слышавших апостолов на своих языках: «Египта и частей Ливии, прилежащих к Киринее». У Иудеев из Кирены была своя синагога в Иерусалиме, Симон Киринеянин нёс крест, а Киринейцы были среди первых, кто благовествовал Еллинам в Антиохии. В 115–117 годах Иудеи Киренаики восстали против Траяна и были разгромлены, и иудейские общины края так и не оправились. Сегодня Ливия — государство Северной Африки со столицей в Триполи; точка на карте для этой области лежит в Киренаике, где у Шаххата стоят развалины Кирены."
  uk:
    - "Лівія для греків була цілою Африкою на захід від Єгипту, а у вужчому значенні — узбережжям між Єгиптом і Карфагеном із зеленим нагір’ям Киренаїки. У староєврейській Біблії такої назви немає. Її легавім, серед синів Міцраїма, і лубім, ліві, що ходили з Сусакімом і Зерахом і билися за Но, — це племена західної пустелі, яких єгиптяни звали лібу, а її Фут зазвичай також уважають Лівією; грецькі перекладачі, Біблія короля Якова та Синодальний переклад часто пишуть Лівія чи ліві для цих назв, тож у пророцтві Єзекіїля про Єгипет «Етіопія й Ливія й Лидия» стоять замість Куша, Фута й Луда. Наум нагадує Ніневії, що Но впало, хоча йому «Копти та Либії помагають йому», і в Даниїла за царем півночі «Ливії і Етіопії пійдуть за ним»."
    - "Лівійські племена тиснули на Дельту від XIII ст. до н. е.; Мернептах і Рамсес III відбили їх, але їхні вожді оселилися в Єгипті, і приблизно від 945 р. до н. е. лівійський дім, XXII династія Сусакіма (Шешонка I), правив Єгиптом два століття. Греки з Тери заснували Кирену близько 631 р. до н. е., а Геродот, який описує лівійські племена від Єгипту до Атлантики, трактує Лівію як одну з трьох частин світу. За Птолемеїв євреї оселилися в Киренаїці у значній кількості; Рим зробив Киренаїку провінцією 74 р. до н. е., а 67 р. до н. е. поєднав її з Критом."
    - "У Новому Завіті Лівія з’являється один раз, на П’ятидесятницю, серед батьківщин євреїв, які чули апостолів своїми мовами: «Єгиптї, і в сторонах Ливийських, що коло Киринеї». Киренейські євреї мали в Єрусалимі власну синагогу, Симон Киренеянин ніс хрест, а люди з Кирени були серед перших, хто проповідував еллінам в Антіохії. У 115–117 рр. євреї Киренаїки повстали проти Траяна й були розгромлені, і єврейські громади краю так і не оговтались. Сьогодні Лівія — держава Північної Африки зі столицею в Тріполі; точка мапи для цього краю лежить у Киренаїці, де руїни Кирени стоять поблизу Шаххата."
  es:
    - "Libia era para los griegos toda el África al oeste de Egipto y, en sentido más estricto, la costa entre Egipto y Cartago con la verde meseta de la Cirenaica. La Biblia hebrea no tiene tal nombre. Sus Lehabim, entre los hijos de Mizraim, y los Lubim, los libios que marcharon con Sisac y Zera y combatieron por Tebas, son las tribus del desierto occidental a las que los egipcios llamaban Libu, y su Fut suele entenderse también como Libia; los traductores griegos, la versión del rey Jacobo y la Biblia sinodal escriben a menudo Libia o libios para estos pueblos, de modo que en el oráculo de Ezequiel sobre Egipto «Etiopía, y Libia, y Lidia» representa a Cus, Fut y Lud. Nahum recuerda a Nínive que Tebas cayó aunque «Put y Libia fueron en tu ayuda», donde la Biblia sinodal tiene coptos y libios, y el rey del norte de Daniel tiene a los libios y a los etíopes a sus pasos."
    - "Las tribus libias presionaron sobre el Delta desde el siglo XIII a. C.; Meneptah y Ramesés III las rechazaron, pero sus jefes se establecieron en Egipto, y desde alrededor de 945 a. C. una casa libia, la dinastía XXII de Sisac (Shoshenq I), gobernó Egipto durante dos siglos. Griegos de Tera fundaron Cirene hacia 631 a. C., y Heródoto, que describe las tribus libias desde Egipto hasta el Atlántico, trata a Libia como una de las tres partes del mundo. Bajo los Ptolomeos, los judíos se establecieron en gran número en la Cirenaica; Roma hizo de la Cirenaica una provincia en 74 a. C. y en 67 a. C. la unió con Creta."
    - "En el Nuevo Testamento Libia aparece una vez (la Reina-Valera la llama «Africa»), en Pentecostés, entre las patrias de los judíos que oyeron a los apóstoles en sus propias lenguas: «en Egipto y en las partes de Africa que está de la otra parte de Cirene». Los judíos cireneos tenían en Jerusalén una sinagoga propia, Simón de Cirene llevó la cruz, y hombres de Cirene estuvieron entre los primeros en predicar a los griegos en Antioquía. En 115–117 los judíos de la Cirenaica se alzaron contra Trajano y fueron aplastados, y las comunidades judías de la región nunca se recuperaron. Hoy Libia es un Estado del norte de África con su capital en Trípoli; el punto del mapa para la región está en la Cirenaica, donde se alzan las ruinas de Cirene, cerca de Shahhat."
  pt:
    - "A Líbia, para os gregos, era toda a África a oeste do Egito e, em sentido mais estreito, a costa entre o Egito e Cartago com o verde planalto da Cirenaica. A Bíblia hebraica não tem tal nome. Seus Leabim, entre os filhos de Mizraim, e os Lubim, os líbios que marcharam com Sisaque e Zera e lutaram por Tebas, são as tribos do deserto ocidental a quem os egípcios chamavam líbus, e seu Pute é geralmente tomado também por Líbia; os tradutores gregos, a King James Version e a Bíblia Sinodal escrevem com frequência Líbia ou líbios para esses nomes, de modo que, no oráculo de Ezequiel sobre o Egito, a Etiópia, a Líbia e a Lídia correspondem a Cuxe, Pute e Lude. Naum lembra a Nínive que Tebas caiu embora “Pute e a Líbia eram os seus ajudadores”, onde a Bíblia Sinodal traz coptas e líbios, e o rei do norte de Daniel tem “Os líbios e os etíopes” seguindo os seus passos."
    - "Tribos líbias pressionaram o Delta a partir do século XIII a.C.; Merneptá e Ramessés III as repeliram, mas seus chefes se estabeleceram no Egito, e desde cerca de 945 a.C. uma casa líbia, a XXII Dinastia de Sisaque (Sheshonq I), governou o Egito por dois séculos. Gregos de Tera fundaram Cirene por volta de 631 a.C., e Heródoto, que descreve as tribos líbias do Egito ao Atlântico, trata a Líbia como uma das três partes do mundo. Sob os Ptolomeus, judeus se estabeleceram na Cirenaica em grande número; Roma fez da Cirenaica uma província em 74 a.C. e em 67 a.C. a uniu a Creta."
    - "No Novo Testamento a Líbia aparece uma vez, em Pentecostes, entre as terras de origem dos judeus que ouviram os apóstolos em suas próprias línguas: “Egito, as partes da Líbia próximas a Cirene”. Os judeus cireneus tinham sinagoga própria em Jerusalém, Simão de Cirene levou a cruz, e homens de Cirene estavam entre os primeiros a pregar aos gregos em Antioquia. Em 115–117 os judeus da Cirenaica se levantaram contra Trajano e foram esmagados, e as comunidades judaicas da região nunca se recuperaram. Hoje a Líbia é um Estado do Norte da África com capital em Trípoli; o ponto do mapa para a região fica na Cirenaica, onde as ruínas de Cirene se erguem perto de Shahhat."
  de:
    - "Libyen war für die Griechen ganz Afrika westlich von Ägypten, im engeren Sinn die Küste zwischen Ägypten und Karthago mit dem grünen Hochland der Kyrenaika. Die hebräische Bibel kennt keinen solchen Namen. Ihre Lehabiter unter den Söhnen Mizraims und die Libyer (Lubim), die mit Schischak und Serach zogen und für Theben kämpften, sind die Stämme der westlichen Wüste, die die Ägypter Libu nannten, und auch ihr Put gilt meist als Libyen; die griechischen Übersetzer, die King-James-Version und die Synodalbibel schreiben dafür oft Libyen oder Libyer, sodass im Spruch Hesekiels über Ägypten „Mohrenland und Libyen und Lud“ für Kusch, Put und Lud steht. Nahum erinnert Ninive, dass Theben fiel, obwohl „Put und Libyen waren ihre Hilfe“ (die Synodalbibel hat dort Kopten und Libyer), und Daniels König des Nordens hat „Libyer und Mohren“ in seinem Zuge."
    - "Libysche Stämme drängten ab dem 13. Jahrhundert v. Chr. auf das Delta; Merenptah und Ramses III. schlugen sie zurück, doch ihre Häuptlinge siedelten in Ägypten, und ab etwa 945 v. Chr. herrschte ein libysches Haus, die 22. Dynastie des Schischak (Scheschonq I.), zwei Jahrhunderte über Ägypten. Griechen von Thera gründeten um 631 v. Chr. Kyrene, und Herodot, der die libyschen Stämme von Ägypten bis zum Atlantik beschreibt, behandelt Libyen als einen der drei Teile der Welt. Unter den Ptolemäern siedelten Juden in großer Zahl in der Kyrenaika; Rom machte die Kyrenaika 74 v. Chr. zur Provinz und vereinigte sie 67 v. Chr. mit Kreta."
    - "Im Neuen Testament erscheint Libyen einmal, an Pfingsten, unter den Heimatländern der Juden, die die Apostel in ihrer eigenen Sprache hörten: „Ägypten und an den Enden von Lybien bei Kyrene“. Die kyrenäischen Juden hatten in Jerusalem eine eigene Synagoge, Simon von Kyrene trug das Kreuz, und Männer aus Kyrene gehörten zu den Ersten, die in Antiochia Griechen predigten. In den Jahren 115–117 erhoben sich die Juden der Kyrenaika gegen Trajan und wurden niedergeschlagen, und die jüdischen Gemeinden der Region erholten sich nie. Heute ist Libyen ein Staat Nordafrikas mit der Hauptstadt Tripolis; der Punkt der Karte für die Region liegt in der Kyrenaika, wo die Ruinen von Kyrene bei Schahhat stehen."
  fr:
    - "La Libye, pour les Grecs, était toute l’Afrique à l’ouest de l’Égypte et, plus étroitement, la côte entre l’Égypte et Carthage avec le haut pays verdoyant de la Cyrénaïque. La Bible hébraïque n’a pas ce nom. Ses Lehabim, parmi les fils de Mitsraïm, et ses Lubim, Libyens qui marchèrent avec Schischak et Zérach et combattirent pour Thèbes, sont les tribus du désert occidental, les Libou des Égyptiens, et son Puth passe aussi pour la Libye ; les traducteurs grecs, la version du roi Jacques et la Bible synodale écrivent souvent Libye ou Libyens, si bien que, dans l’oracle d’Ézéchiel sur l’Égypte, l’Éthiopie, la Libye et la Lydie rendent Cusch, Puth et Lud. Nahum rappelle à Ninive la chute de Thèbes, bien que « Puth et les Libyens étaient ses auxiliaires », où la Bible synodale a Coptes et Libyens, et le roi du nord de Daniel a « les Libyens et les Éthiopiens » à sa suite."
    - "Des tribus libyennes pressèrent le Delta à partir du XIIIe siècle av. J.-C. ; Merenptah et Ramsès III les repoussèrent, mais leurs chefs s’établirent en Égypte, et à partir d’environ 945 av. J.-C. une maison libyenne, la XXIIe dynastie de Schischak (Sheshonq Ier), régna sur l’Égypte pendant deux siècles. Des Grecs de Théra fondèrent Cyrène vers 631 av. J.-C., et Hérodote, qui décrit les tribus libyennes de l’Égypte à l’Atlantique, traite la Libye comme l’une des trois parties du monde. Sous les Ptolémées, des Juifs s’installèrent en nombre en Cyrénaïque ; Rome fit de la Cyrénaïque une province en 74 av. J.-C. et l’unit à la Crète en 67 av. J.-C."
    - "Dans le Nouveau Testament, la Libye apparaît une fois, à la Pentecôte, parmi les patries des Juifs qui entendirent les apôtres dans leurs propres langues : « l’Égypte, le territoire de la Libye voisine de Cyrène ». Les Juifs cyrénéens avaient leur propre synagogue à Jérusalem, Simon de Cyrène porta la croix, et des hommes de Cyrène furent parmi les premiers à prêcher aux Grecs à Antioche. En 115–117, les Juifs de la Cyrénaïque se soulevèrent contre Trajan et furent écrasés, et les communautés juives de la région ne s’en relevèrent jamais. Aujourd’hui, la Libye est un État d’Afrique du Nord dont la capitale est Tripoli ; le point de la carte pour la région se trouve en Cyrénaïque, où se dressent les ruines de Cyrène près de Chahhat."
