body:
  en:
    - "The Valley of Salt was the scene of two victories over Edom. It is usually sought in the salt flats (es-Sebkha) at the southern end of the Dead Sea, where the Arabah opens into a plain of salt and mud south of the sea, on the road from Judah into Edom; the Hebrew ge-melah, “valley of salt”, suits the place. The main alternative is Wadi el-Milh, “the salt wadi”, east of Beersheba, which keeps the name but lies far from Edom; the Arabah south of the Sebkha has also been named. The exact spot cannot be fixed."
    - "“David gat him a name when he returned from smiting of the Syrians in the valley of salt, being eighteen thousand men”: so the text of Samuel, but Chronicles and the title of Psalm 60 say Edomites, and the Hebrew letters of Aram and Edom are easily confused. Chronicles credits the blow to Abishai, the psalm title to Joab with twelve thousand slain; after it David “put garrisons in Edom”. Some two centuries later Amaziah of Judah “slew of Edom in the valley of salt ten thousand, and took Selah by war, and called the name of it Joktheel”; Chronicles adds that ten thousand captives were thrown from the top of the rock."
    - "Edom had already broken free under Jehoram, and in the days of Ahaz it struck Judah again; the valley is not mentioned after Amaziah. Today the southern basin of the Dead Sea, divided between Israel and Jordan, has dried out as the sea retreated and is largely taken up by the evaporation ponds of the potash works on both sides."
  ru:
    - "Долина Соляная — место двух побед над Едомом. Её обычно ищут в солончаках (Эс-Себха) у южной оконечности Мёртвого моря, где Арава переходит в равнину соли и ила южнее моря, на дороге из Иудеи в Едом; еврейское ге-мелах, «долина соли», подходит к этому месту. Главная альтернатива — Вади-эль-Мильх, «соляное вади», к востоку от Вирсавии, которое сохранило имя, но лежит далеко от Едома; называли и Араву южнее Себхи. Точное место установить нельзя."
    - "«И сделал Давид себе имя, возвращаясь с поражения восемнадцати тысяч Сирийцев в долине Соленой», — так в книге Царств, но Паралипоменон и надписание псалма 59 говорят об Идумеях, а еврейские буквы в словах Арам и Едом легко спутать. Паралипоменон приписывает удар Авессе, надписание псалма — Иоаву, с двенадцатью тысячами убитых; после этого «поставил он охранные войска в Идумее». Примерно два века спустя Амасия, царь Иудейский, «поразил десять тысяч Идумеян на долине Соляной, и взял Селу войною, и дал ей имя Иокфеил»; Паралипоменон добавляет, что десять тысяч пленных сбросили с вершины скалы."
    - "Едом отложился от Иудеи ещё при Иораме, а во дни Ахаза снова напал на неё; после Амасии долина больше не упоминается. Сегодня южный бассейн Мёртвого моря, поделённый между Израилем и Иорданией, обмелел с отступлением моря и по большей части занят испарительными прудами калийных заводов по обе стороны границы."
  uk:
    - "Соляна долина була місцем двох перемог над Едомом. Її зазвичай шукають на соляних рівнинах (ес-Себха) на південному краю Мертвого моря, де Арава відкривається в рівнину солі й багнюки на південь від моря, на дорозі з Юди в Едом; староєврейське ге-мелах, «долина солі», пасує до місця. Головна альтернатива — Вади-ель-Мільх, «соляний вади», на схід від Беер-Шеви, що зберігає назву, але лежить далеко від Едому; називали також Араву на південь від Себхи. Точного місця закріпити не можна."
    - "«причинив собі Давид слави, вертаючи з побою вісїмнайцяти тисячей Сирийцїв в Долинї соляних Жуп»: так у тексті Самуїла, але Хроніки й напис Псалма 60 кажуть едомитян, а староєврейські літери Арам і Едом легко сплутати. Хроніки приписують удар Авішаю, напис псалма — Йоавові з дванадцятьма тисячами вбитих; після нього Давид «осадив він Ідумею військом». Близько двох століть пізніше Амасія Юдейський «побив десять тисяч Ідуміїв на Солоній долинї й завоював Селу, й назвав її Йоктеїл аж по сей день»; Хроніки додають, що десять тисяч полонених скинули з верху скелі."
    - "Едом уже звільнився під Йорамом, а за днів Ахаза знову вдарив по Юді; після Амасії долина не згадується. Нині південний басейн Мертвого моря, поділений між Ізраїлем та Йорданією, висох, коли море відступило, і здебільшого зайнятий випарними ставками калійних заводів по обидва боки."
  es:
    - "El Valle de la Sal fue el escenario de dos victorias sobre Edom. Suele buscarse en las salinas (es-Sebkha) del extremo sur del mar Muerto, donde el Arabá se abre en una llanura de sal y barro al sur del mar, en el camino de Judá a Edom; el hebreo ge-melah, «valle de la sal», conviene al lugar. La principal alternativa es el Wadi el-Milh, «el wadi de la sal», al este de Beerseba, que conserva el nombre pero queda lejos de Edom; también se ha nombrado el Arabá al sur de la Sebkha. El lugar exacto no puede fijarse."
    - "«Y ganó David fama cuando, volviendo de la rota de los Siros, hirió diez y ocho mil hombres en el valle de la sal»: así el texto de Samuel, pero Crónicas y el título del Salmo 60 dicen edomitas, y las letras hebreas de Aram y Edom se confunden fácilmente. Crónicas atribuye el golpe a Abisai, el título del salmo a Joab con doce mil muertos; después de él David «puso guarnición en Edom». Unos dos siglos más tarde, Amasías de Judá «hirió asimismo diez mil Idumeos en el valle de las Salinas, y tomó á Sela por guerra, y llamóla Jocteel»; Crónicas añade que diez mil cautivos fueron arrojados desde lo alto de la peña."
    - "Edom ya se había liberado bajo Joram, y en los días de Acaz golpeó de nuevo a Judá; el valle no se menciona después de Amasías. Hoy la cuenca meridional del mar Muerto, dividida entre Israel y Jordania, se ha secado al retirarse el mar y está ocupada en gran parte por las balsas de evaporación de las plantas de potasa de ambos lados."
  pt:
    - "O Vale do Sal foi o cenário de duas vitórias sobre Edom. Costuma ser procurado nas salinas (es-Sebkha) da extremidade sul do Mar Morto, onde a Arabá se abre numa planície de sal e lama ao sul do mar, na estrada de Judá para Edom; o hebraico ge-melah, “vale do sal”, convém ao lugar. A principal alternativa é o Wadi el-Milh, “o uádi do sal”, a leste de Berseba, que conserva o nome mas fica longe de Edom; a Arabá ao sul da Sebkha também foi nomeada. O ponto exato não pode ser fixado."
    - "“Davi ganhou fama quando voltou, depois de derrotar dezoito mil homens dos sírios no Vale do Sal”: assim o texto de Samuel, mas Crônicas e o título do Salmo 60 dizem edomitas, e as letras hebraicas de Arã e Edom se confundem com facilidade. Crônicas atribui o golpe a Abisai, o título do salmo a Joabe, com doze mil mortos; depois dele Davi “colocou guarnições em Edom”. Cerca de dois séculos depois, Amazias de Judá “matou dez mil edomitas no Vale do Sal, tomou Sela na guerra, e a chamou de Jocteel”; Crônicas acrescenta que dez mil cativos foram atirados do alto da rocha."
    - "Edom já se havia libertado sob Jeorão e, nos dias de Acaz, atacou Judá de novo; o vale não é mencionado depois de Amazias. Hoje a bacia sul do Mar Morto, dividida entre Israel e Jordânia, secou com o recuo do mar e é ocupada em grande parte pelos tanques de evaporação das fábricas de potássio de ambos os lados."
  de:
    - "Das Salztal war Schauplatz zweier Siege über Edom. Man sucht es meist in den Salzflächen (es-Sebkha) am Südende des Toten Meeres, wo sich die Araba südlich des Meeres zu einer Salz- und Schlammebene öffnet, an der Straße von Juda nach Edom; das hebräische ge-melach, „Salztal“, passt zu dem Ort. Die wichtigste Alternative ist das Wadi el-Milh, „das Salzwadi“, östlich von Beerscheba, das den Namen bewahrt, aber weit von Edom liegt; auch die Araba südlich der Sebkha wurde genannt. Die genaue Stelle lässt sich nicht festlegen."
    - "„Auch machte sich David einen Namen da er wiederkam von der Syrer Schlacht und schlug im Salztal achtzehntausend Mann“: so der Text Samuels, doch die Chronik und die Überschrift von Psalm 60 sagen Edomiter, und die hebräischen Buchstaben von Aram und Edom sind leicht zu verwechseln. Die Chronik schreibt den Schlag Abisai zu, die Psalmüberschrift Joab mit zwölftausend Erschlagenen; danach legte David „Volk in ganz Edom“. Etwa zwei Jahrhunderte später schlug Amazja von Juda „die Edomiter im Salztal zehntausend und gewann die Stadt Sela mit Streit und hieß sie Joktheel bis auf diesen Tag“; die Chronik fügt hinzu, zehntausend Gefangene seien von der Spitze des Felsens gestürzt worden."
    - "Edom hatte sich schon unter Joram losgerissen und schlug zur Zeit des Ahas Juda erneut; das Tal wird nach Amazja nicht mehr erwähnt. Heute ist das südliche Becken des Toten Meeres, zwischen Israel und Jordanien geteilt, ausgetrocknet, als das Meer zurückwich, und wird großenteils von den Verdunstungsbecken der Kaliwerke auf beiden Seiten eingenommen."
  fr:
    - "La vallée du Sel fut le théâtre de deux victoires sur Édom. On la cherche d’ordinaire dans les salines (es-Sebkha) à l’extrémité sud de la mer Morte, là où l’Araba s’ouvre sur une plaine de sel et de boue au sud de la mer, sur la route de Juda vers Édom ; l’hébreu ge-melah, « vallée du sel », convient au lieu. La principale solution de rechange est le Wadi el-Milh, « l’oued salé », à l’est de Beer-Schéba, qui garde le nom mais se trouve loin d’Édom ; l’Araba au sud de la Sebkha a aussi été nommée. L’endroit exact ne peut être fixé."
    - "David se fit un nom en revenant d’avoir battu les Syriens dans la vallée du sel, dix-huit mille hommes : ainsi le texte hébreu de Samuel, mais les Chroniques et le titre du psaume 60 disent Édomites, et les lettres hébraïques d’Aram et d’Édom se confondent aisément. Les Chroniques attribuent le coup à Abischaï, le titre du psaume à Joab avec douze mille morts ; après cela, David « mit des garnisons dans Édom ». Quelque deux siècles plus tard, Amatsia de Juda « battit dix mille Édomites dans la vallée du sel ; et durant la guerre, il prit Séla, et l’appela Joktheel » ; les Chroniques ajoutent que dix mille captifs furent précipités du haut du rocher."
    - "Édom s’était déjà libéré sous Joram, et du temps d’Achaz il frappa de nouveau Juda ; la vallée n’est plus mentionnée après Amatsia. Aujourd’hui, le bassin sud de la mer Morte, partagé entre Israël et la Jordanie, s’est asséché avec le recul de la mer et est en grande partie occupé par les bassins d’évaporation des usines de potasse des deux côtés."
  pl:
    - "Dolina Soli była sceną dwóch zwycięstw nad Edomem. Szuka się jej zwykle na solnych równinach (es-Sebcha) na południowym krańcu Morza Martwego, gdzie Araba otwiera się w równinę soli i błota na południe od morza, na drodze z Judy do Edomu; hebrajskie ge-melach, „dolina soli”, pasuje do miejsca. Głównym alternatywnym kandydatem jest Wadi el-Milh, „solne wadi”, na wschód od Beer-Szeby, które zachowuje nazwę, lecz leży daleko od Edomu; wymieniano też Arabę na południe od Sebchy. Dokładnego miejsca nie da się ustalić."
    - "„A tak uczynił sobie Dawid imię, gdy się wrócił poraziwszy Syryjczyki w dolinie solnej, gdzie pobił ośmnaście tysięcy ludu”: tak brzmi tekst Księgi Samuela, ale Kroniki i tytuł Psalmu 60 mówią o Edomitach, a hebrajskie litery Aramu i Edomu łatwo pomylić. Kroniki przypisują cios Abiszajowi, tytuł psalmu Joabowi z dwunastoma tysiącami zabitych; po nim Dawid „Postanowił też straż w Edom”. Dwa stulecia później Amazjasz z Judy „poraził Edomczyków dziesięć tysięcy w dolinie solnej, i wziął mocą Selę, a nazwał imię jej Jokteel”; Kroniki dodają, że dziesięć tysięcy jeńców zrzucono z wierzchu skały."
    - "Edom wyrwał się już wcześniej pod Joramem, a za dni Achaza znowu uderzył na Judę; dolina nie jest wspomniana po Amazjaszu. Dziś południowy basen Morza Martwego, podzielony między Izrael i Jordanię, wysechł, gdy morze się cofało, i jest w dużej mierze zajęty przez baseny odparowujące zakładów potażu po obu stronach."
  it:
    - "La Valle del Sale fu teatro di due vittorie su Edom. La si cerca di solito nelle distese saline (es-Sebkha) all’estremità meridionale del Mar Morto, dove l’Araba si apre in una piana di sale e fango a sud del mare, sulla strada da Giuda a Edom; l’ebraico ge-melah, «valle del sale», si adatta al luogo. La principale alternativa è il Wadi el-Milh, «l’uadi del sale», a est di Bersabea, che conserva il nome ma sta lontano da Edom; è stata nominata anche l’Araba a sud della Sebkha. Il punto esatto non si può fissare."
    - "Davide si fece un nome quando tornò dall’aver sconfitto i Siri nella valle del Sale, diciottomila uomini: così il testo di Samuele; ma le Cronache e il titolo del Salmo 60 dicono Edomiti, e le lettere ebraiche di Aram e di Edom si confondono facilmente. Le Cronache attribuiscono il colpo ad Abisai, il titolo del salmo a Ioab con dodicimila uccisi; dopo di esso Davide «pose delle guarnigioni in Idumea». Circa due secoli dopo Amazia di Giuda «uccise diecimila Idumei nella valle del Sale; e in questa guerra prese Sela e le dette il nome di Joktheel»; le Cronache aggiungono che diecimila prigionieri furono gettati dall’alto della rupe."
    - "Edom si era già liberata sotto Ioram, e ai giorni di Acaz colpì di nuovo Giuda; la valle non è menzionata dopo Amazia. Oggi il bacino meridionale del Mar Morto, diviso fra Israele e Giordania, si è prosciugato con il ritiro del mare ed è in gran parte occupato dalle vasche di evaporazione degli stabilimenti di potassa su entrambi i lati."
  nl:
    - "Het Zoutdal was het toneel van twee overwinningen op Edom. Het wordt gewoonlijk gezocht in de zoutvlakten (es-Sebkha) aan het zuidelijke einde van de Dode Zee, waar de Araba uitloopt in een vlakte van zout en modder ten zuiden van de zee, aan de weg van Juda naar Edom; het Hebreeuwse ge-melah, “zoutdal”, past bij de plek. Het belangrijkste alternatief is Wadi el-Milh, “de zoutwadi”, ten oosten van Berseba, die de naam bewaart maar ver van Edom ligt; de Araba ten zuiden van de Sebkha is ook genoemd. De precieze plek kan niet worden vastgesteld."
    - "“Ook maakte zich David een naam, als hij wederkwam, nadat hij de Syriers geslagen had, in het Zoutdal, achttien duizend”: zo de tekst van Samuël, maar Kronieken en het opschrift van Psalm 60 zeggen Edomieten, en de Hebreeuwse letters van Aram en Edom zijn gemakkelijk te verwarren. Kronieken schrijft de slag toe aan Abisai, het opschrift van de psalm aan Joab met twaalfduizend gedoden; daarna: “En hij leide bezettingen in Edom”. Zo’n twee eeuwen later deed Amazia van Juda hetzelfde: “Hij sloeg de Edomieten in het Zoutdal tien duizend, en nam Sela in met krijg, en noemde haar naam Jokteel”; Kronieken voegt toe dat tienduizend gevangenen van de top van de rots werden gestoten."
    - "Edom had zich onder Joram al losgemaakt, en in de dagen van Achaz sloeg het Juda opnieuw; het dal wordt na Amazia niet meer genoemd. Tegenwoordig is het zuidelijke bekken van de Dode Zee, verdeeld tussen Israël en Jordanië, drooggevallen doordat de zee zich terugtrok, en wordt het grotendeels in beslag genomen door de verdampingsvijvers van de potasfabrieken aan beide zijden."
  cs:
    - "Solné údolí bylo dějištěm dvou vítězství nad Edómem. Hledá se obvykle v solných pláních (es-Sebcha) na jižním konci Mrtvého moře, kde se Araba otevírá do roviny soli a bahna jižně od moře, na cestě z Judy do Edómu; hebrejské ge-melach, „údolí soli“, na místo sedí. Hlavní alternativou je Wádí el-Milh, „solné vádí“, východně od Beer-šeby, které jméno zachovává, ale leží daleko od Edómu; jmenována byla i Araba jižně od Sebchy. Přesné místo nelze určit."
    - "„Zvelebil také David své jméno, když se navracoval od pobití osmnácti tisíců Syrských v údolí solnatém“: tak text Samuelův, ale Kroniky i nadpis žalmu 60 říkají Edómci a hebrejská písmena Aramu a Edómu se snadno zaměňují. Kroniky připisují úder Abišajovi, nadpis žalmu Joábovi s dvanácti tisíci pobitými; poté David „nad Idumejskými stráž postavil“. Asi o dvě století později Amacjáš Judský „porazil Idumejských v údolí solnatém deset tisíců, a dobyl Sela bojem. I nazval jméno jeho Jektehel“; Kroniky dodávají, že deset tisíc zajatců bylo svrženo z vrcholu skály."
    - "Edóm se už byl osvobodil za Jehorama a za dnů Achazových znovu udeřil na Judu; údolí se po Amacjášovi už nezmiňuje. Dnes jižní pánev Mrtvého moře, rozdělená mezi Izrael a Jordánsko, vyschla, jak moře ustupovalo, a z velké části ji zabírají odpařovací nádrže potašových závodů na obou stranách."
  sv:
    - "Saltdalen var skådeplats för två segrar över Edom. Den söks vanligen i saltslätterna (es-Sebkha) vid Döda havets södra ände, där Arava öppnar sig mot en slätt av salt och lera söder om havet, på vägen från Juda in i Edom; det hebreiska ge-melah, ”saltdal”, passar platsen. Det främsta alternativet är Wadi el-Milh, ”saltvadit”, öster om Beer Sheva, som bevarar namnet men ligger långt från Edom; Arava söder om Sebkha har också nämnts. Den exakta platsen kan inte fastställas."
    - "”Och när David kom tillbaka från sin seger över araméerna, gjorde han sig ytterligare ett namn i Saltdalen, där han slog aderton tusen man”: så lyder Samuelsböckernas text, men Krönikeboken och rubriken till Psalm 60 säger edoméer, och de hebreiska bokstäverna för Aram och Edom förväxlas lätt. Krönikeboken tillskriver slaget Avishaj, psalmrubriken Joav med tolv tusen slagna; därefter ”insatte han fogdar i Edom”. Omkring två sekler senare ”slog” Amasja av Juda ”edoméerna i Saltdalen, tio tusen man, och intog Sela med strid och gav det namnet Jokteel”; Krönikeboken tillägger att tio tusen fångar kastades ned från klippans topp."
    - "Edom hade redan gjort sig fritt under Joram, och på Achas tid slog det Juda igen; dalen nämns inte efter Amasja. I dag har Döda havets södra bassäng, delad mellan Israel och Jordanien, torkat ut när havet drog sig tillbaka och upptas till stor del av kaliverkens förångningsdammar på båda sidor."
  nb:
    - "Saltdalen var åstedet for to seire over Edom. Den søkes vanligvis i saltsletten (es-Sebkha) i den sørlige enden av Dødehavet, der Arava åpner seg mot en slette av salt og leire sør for havet, ved veien fra Juda inn i Edom; det hebraiske ge-melah, «saltdal», passer til stedet. Det viktigste alternativet er Wadi el-Milh, «saltwadien», øst for Beer-Sjeba, som bevarer navnet men ligger langt fra Edom; Arava sør for Sebkha er også nevnt. Det nøyaktige stedet kan ikke fastlegges."
    - "«Og da David vendte tilbake efter å ha slått syrerne, vant han sig et navn i Salt-dalen ved å slå atten tusen mann»: slik lyder Samuels tekst, men Krønikebøkene og overskriften til Salme 60 sier edomitter, og de hebraiske bokstavene i Aram og Edom forveksles lett. Krønikebøkene tilskriver slaget Abisjai, salmeoverskriften Joab med tolv tusen drepte; etter det «la han krigsmannskap i Edom». Omkring to århundrer senere «slo» Amasja av Juda «Edom i Saltdalen, ti tusen mann, og inntok Sela og kalte det Jokte'el»; Krønikebøkene tilføyer at ti tusen fanger ble styrtet ned fra toppen av klippen."
    - "Edom hadde allerede brutt løs under Joram, og i Ahas' dager slo det Juda igjen; dalen er ikke nevnt etter Amasja. I dag har det sørlige bassenget i Dødehavet, delt mellom Israel og Jordan, tørket ut etter hvert som havet trakk seg tilbake, og det opptas for det meste av fordampningsdammene til kaliverkene på begge sider."
  tl:
    - "Ang Libis ng Asin ang tagpuan ng dalawang tagumpay laban sa Edom. Karaniwan itong hinahanap sa mga kapatagan ng asin (es-Sebkha) sa timugang dulo ng Dagat na Patay, kung saan bumubukas ang Araba sa kapatagan ng asin at putik sa timog ng dagat, sa daan mula Juda patungong Edom; bagay sa lugar ang Hebreong ge-melah, “libis ng asin”. Ang pangunahing alternatibo ay ang Wadi el-Milh, “ang wadi ng asin”, sa silangan ng Beer-seba, na nagpapanatili ng pangalan ngunit malayo sa Edom; pinangalanan din ang Araba sa timog ng Sebkha. Hindi matiyak ang eksaktong pook."
    - "“nabantog si David nang siya'y bumalik na mula sa pagsakit sa mga taga Siria sa Libis na Alat, sa makatuwid baga'y sa labing walong libong lalake”: gayon ang teksto ng Samuel, ngunit Idumeo ang sabi ng Mga Cronica at ng pamagat ng Awit 60, at madaling malito ang mga titik Hebreo ng Aram at Edom. Iniuugnay ng Mga Cronica ang dagok kay Abisai, ang pamagat ng awit kay Joab na may labindalawang libong napatay; pagkatapos nito ay sinabi tungkol kay David na “naglagay siya ng mga pulutong sa Edom”. Halos dalawang siglo pagkaraan, si Amasias ng Juda ay “pumatay sa mga Idumeo ng sangpung libo sa Libis ng Asin, at sinakop ang Sela sa pakikipagdigma, at pinanganlang Jocteel”; idinadagdag ng Mga Cronica na sampung libong bihag ang inihagis mula sa tuktok ng bato."
    - "Nakawala na ang Edom noong panahon ni Joram, at nang kaarawan ni Achaz ay muli nitong sinaktan ang Juda; hindi na binanggit ang libis pagkatapos ni Amasias. Ngayon ang timugang palanggana ng Dagat na Patay, na hinati ng Israel at Jordan, ay natuyo nang umurong ang dagat at higit na inookupahan ng mga lawa ng pagsingaw ng mga pagawaan ng potasa sa magkabilang panig."
  da:
    - "Saltdalen var skueplads for to sejre over Edom. Den søges sædvanligvis i saltsletterne (es-Sebkha) i Dødehavets sydlige ende, hvor Araba åbner sig i en slette af salt og mudder syd for havet, på vejen fra Juda ind i Edom; det hebraiske ge-melah, »saltdal«, passer til stedet. Det vigtigste alternativ er Wadi el-Milh, »saltwadien«, øst for Beersheba, som bevarer navnet, men ligger langt fra Edom; Araba syd for Sebkha er også blevet nævnt. Det nøjagtige sted kan ikke fastlægges."
    - "»David gjorde sig navnkundig, der han kom tilbage, efter at han havde slaget Syrerne, og (slog af Edomiterne) udi Saltdalen atten Tusinde«: således lyder teksten i Samuel, men Krønikebøgerne og overskriften til Salme 60 siger edomitter, og de hebraiske bogstaver i Aram og Edom forveksles let. Krønikebøgerne tilskriver slaget Abisjaj, salmeoverskriften Joab med tolv tusind dræbte; derefter lagde David »Besætning udi Edom«. Omkring to århundreder senere »slog« Amazja af Juda »ti Tusinde af Edom i Saltdalen og indtog Sela i samme Krig og kaldte dens Navn Jokthel indtil denne Dag«; Krønikebøgerne tilføjer, at ti tusind fanger blev kastet ned fra klippens top."
    - "Edom havde allerede gjort sig fri under Joram, og i Akaz' dage slog det Juda igen; dalen nævnes ikke efter Amazja. I dag er Dødehavets sydlige bassin, delt mellem Israel og Jordan, tørret ud, efterhånden som havet har trukket sig tilbage, og er for en stor del optaget af fordampningsbassinerne ved kaliværkerne på begge sider."
  sr:
    - "Долина слана била је поприште двеју победа над Едомом. Обично се тражи у сланим равницама (ес Себка) на јужном крају Мртвог мора, где се Арава отвара у равницу соли и блата јужно од мора, на путу из Јуде у Едом; хебрејско ге-мелах, „слана долина“, одговара месту. Главна алтернатива је Вади ел Милх, „слани вади“, источно од Вирсавеје, који чува име, али лежи далеко од Едома; именована је и Арава јужно од Себке. Тачно место не може се утврдити."
    - "„Давид стече име кад се врати побивши Сирце, осамнаест хиљада у сланој долини“: тако текст Самуилов, али Летописи и наслов Псалма 60 кажу Едомци, а хебрејска слова Арама и Едома лако се мешају. Летописи заслугу за ударац приписују Ависају, наслов псалма Јоаву са дванаест хиљада побијених; после њега Давид „намести војску по Идумеји“. Око два века касније Амасија Јудин „поби десет хиљада Едомаца у сланој долини, и узе Селу ратом, и прозва је Јоктеил“; Летописи додају да је десет хиљада заробљеника бачено са врха стене."
    - "Едом се већ био ослободио под Јорамом, а у Ахазово доба поново је ударио на Јуду; долина се не помиње после Амасије. Данас је јужни басен Мртвог мора, подељен између Израела и Јордана, исушен како се море повлачило и великим делом заузет испаривачким базенима рудника поташе на обе стране."
  hu:
    - "A Sóvölgy két edomi győzelem színhelye volt. Általában a Holt-tenger déli végén lévő sósmocsarakban (esz-Szebkha) keresik, ahol az Arábá a tengertől délre sós és sáros síkságba nyílik, a Júdából Edomba vezető úton; a héber gé-melah, „sóvölgy” illik a helyhez. A fő alternatíva a Vádi el-Milh, „a sós vádi”, Beérsebától keletre, amely megőrizte a nevet, de messze fekszik Edomtól; a Szebkhától délre fekvő Arábát is megnevezték. A pontos hely nem rögzíthető."
    - "„És hírnevet szerze Dávid, a mikor visszatért, miután a Siriabelieket leverte a sós völgyben, tizennyolczezeret”: így szól a Sámuel-könyv szövege, de a Krónikák és a 60. zsoltár felirata edomitákat mond, és az Arám és Edom héber betűit könnyű összekeverni. A Krónikák a csapást Abisainak tulajdonítja, a zsoltár felirata Joábnak tizenkétezer megöltével; ezután Dávid „egész Idumeába állandó sereget rendele”. Mintegy két évszázaddal később Amácja, Júda királya „megvert az Edomiták közül tízezeret a sós völgyben; és bevette Sélát ostrommal, és ezt nevezé Jokteélnek mind e mai napig”; a Krónikák hozzáteszi, hogy tízezer foglyot a szikla tetejéről löktek le."
    - "Edom Jórám alatt már kiszabadult, és Áház napjaiban ismét megütötte Júdát; a völgyet Amácja után nem említik. Ma a Holt-tenger déli medencéje, Izrael és Jordánia között megosztva, kiszáradt, ahogy a tenger visszahúzódott, és nagyrészt mindkét oldal kálisó-művei elpárologtató medencéi foglalják el."
  fi:
    - "Suolalaakso oli kahden Edomin yli saadun voiton näyttämö. Sitä etsitään yleensä Kuolleenmeren eteläpään suolatasangoilta (es-Sebkha), missä Araba aukeaa suolan ja mudan tasangoksi meren eteläpuolella, Juudasta Edomiin johtavan tien varrella; heprean ge-melah, ”suolalaakso”, sopii paikkaan. Pääasiallinen vaihtoehto on Wadi el-Milh, ”suolawadi”, Beersebasta itään, joka säilyttää nimen mutta on kaukana Edomista; myös Sebkhan eteläpuolista Arabaa on mainittu. Tarkkaa paikkaa ei voida määrittää."
    - "Daavid sai nimensä kuuluisaksi palatessaan voitettuaan Suolalaaksossa kahdeksantoista tuhatta miestä: näin sanoo Samuelin kirjan teksti, jossa he ovat aramilaisia (syyrialaisia), mutta Aikakirjat ja Psalmin 60 otsikko sanovat edomilaisia, ja heprean kirjaimet Aram ja Edom sekoittuvat helposti. Aikakirjat lukevat iskun Abisaille, psalmin otsikko Joabille, jolle kaatui kaksitoista tuhatta; sen jälkeen Daavid pani Edomiin varuskuntia. Noin kaksi vuosisataa myöhemmin Amasja Juudasta ”voitti edomilaiset Suolalaaksossa, kymmenentuhatta miestä, ja valloitti Seelan asevoimalla ja antoi sille nimen Jokteel”; Aikakirjat lisäävät, että kymmenentuhatta vankia syöstiin kallion laelta alas."
    - "Edom oli jo vapautunut Joramin aikana, ja Ahaan päivinä se iski Juudaa uudelleen; laaksoa ei mainita Amasjan jälkeen. Nykyisin Kuolleenmeren eteläallas, jonka Israel ja Jordania jakavat, on kuivunut meren vetäytyessä, ja suuren osan siitä täyttävät potaskatehtaiden haihdutusaltaat molemmin puolin."
  vi:
    - "Trũng Muối là nơi diễn ra hai chiến thắng trước Ê-đôm. Nó thường được tìm ở các bãi muối (es-Sebkha) ở đầu nam Biển Chết, nơi A-ra-ba mở ra thành đồng bằng muối và bùn phía nam biển, trên đường từ Giu-đa vào Ê-đôm; từ Hê-bơ-rơ ge-melah, “trũng muối”, hợp với nơi này. Phương án chính khác là Wadi el-Milh, “wadi muối”, phía đông Bê-e-Sê-ba, còn giữ tên nhưng nằm xa Ê-đôm; A-ra-ba phía nam Sebkha cũng đã được nêu. Không thể xác định chính xác chỗ."
    - "Theo bản văn Hê-bơ-rơ của sách Sa-mu-ên, Đa-vít nổi danh khi trở về sau khi đánh dân Sy-ri, mười tám nghìn người, trong trũng muối; nhưng Sử Ký và tựa đề Thi thiên 60 nói là dân Ê-đôm, vì các chữ cái Hê-bơ-rơ của A-ram và Ê-đôm dễ lẫn. Sử Ký ghi công cho A-bi-sai, tựa đề thi thiên cho Giô-áp với mười hai nghìn người bị giết; sau đó Đa-vít “lập đồn trong khắp xứ Ê-đôm”. Khoảng hai thế kỷ sau, A-ma-xia của Giu-đa “giết một muôn quân Ê-đôm tại trong trũng Muối, hãm lấy thành Sê-la, và đặt tên là Giốc-then”; Sử Ký thêm rằng mười nghìn tù binh bị ném xuống từ đỉnh vách đá."
    - "Ê-đôm đã thoát ách dưới thời Giô-ram, và vào đời A-cha nó lại đánh Giu-đa; thung lũng không được nêu sau A-ma-xia. Ngày nay lưu vực nam Biển Chết, chia giữa Israel và Jordan, đã khô cạn khi biển thoái lui và phần lớn bị các ao bay hơi của nhà máy kali ở cả hai bên chiếm."
  ro:
    - "Valea Sării a fost scena a două victorii asupra Edomului. Este căutată de obicei în câmpurile sărate (es-Sebkha) de la capătul sudic al Mării Moarte, unde Araba se deschide într-o câmpie de sare și nămol la sud de mare, pe drumul din Iuda spre Edom; ebraicul ge-melah, „valea sării”, se potrivește locului. Principala alternativă este Wadi el-Milh, „uadiul sării”, la est de Beer-Șeba, care păstrează numele, dar se află departe de Edom; a fost numită și Araba la sud de Sebkha. Locul exact nu poate fi fixat."
    - "David și-a făcut nume când s-a întors după ce i-a lovit pe sirieni în valea sării, optsprezece mii de oameni: așa spune textul din Samuel, dar Cronicile și titlul Psalmului 60 spun edomiți, iar literele ebraice ale lui Aram și Edom se confundă ușor. Cronicile atribuie lovitura lui Abișai, titlul psalmului lui Ioab, cu douăsprezece mii de morți; după ea David „a pus în Idumeia streji”. Cam două secole mai târziu, Amația al lui Iuda „a bătut zece mii de Edomiți în valea Sării, și a luat întăritura în răsboiul acela, și a chemat numele ei Ietoil până în ziua aceasta”; Cronicile adaugă că zece mii de prizonieri au fost aruncați din vârful stâncii."
    - "Edomul se eliberase deja sub Ioram, iar în zilele lui Ahaz a lovit din nou Iuda; valea nu mai este pomenită după Amația. Astăzi bazinul sudic al Mării Moarte, împărțit între Israel și Iordania, s-a uscat pe măsură ce marea s-a retras și este în mare parte ocupat de bazinele de evaporare ale uzinelor de potasiu de pe ambele maluri."
  bg:
    - "Солната долина била мястото на две победи над Едом. Обикновено се търси в солените равнини (ес-Себха) в южния край на Мъртво море, където Арава се отваря в равнина от сол и кал южно от морето, по пътя от Юда към Едом; еврейското ге-мелах, „долина на солта“, подхожда на мястото. Главната алтернатива е Уади ел-Милх, „соленото уади“, източно от Вирсавия, което пази името, но лежи далеч от Едом; посочвана е и Арава южно от Себха. Точното място не може да се установи."
    - "„И придоби Давид име когато се връщаше от поражението на осемнадесетте тисящи Сирийци в дола на солта“: така гласи текстът на 2 Царе, но Летописи и надписът на Пс. 60 казват едомци, а еврейските букви на Арам и Едом лесно се объркват. Летописи приписват удара на Авеса, надписът на псалома — на Йоав, с дванадесет хиляди убити; след това Давид „тури стражи в Едом“. Около два века по-късно юдейският цар Амасия „порази от Едома десет тисящи в дола на солта, и превзе града Села с бой, и нарече името му Иоктеил“; Летописи добавят, че десет хиляди пленници били хвърлени от върха на скалата."
    - "Едом се бил отделил още при Йорам, а в дните на Ахаз отново нанесъл удар на Юда; долината не се споменава след Амасия. Днес южният басейн на Мъртво море, разделен между Израел и Йордания, е пресъхнал с отдръпването на морето и е зает до голяма степен от изпарителните басейни на калиевите заводи от двете страни."
