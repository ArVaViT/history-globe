body:
  en:
    - "Jazer was a town of Gilead east of the Jordan, in the hills between Heshbon and the Jabbok, in country good for cattle and vines. Where exactly it stood is not known. Eusebius put it ten Roman miles west of Philadelphia (Amman) and fifteen from Heshbon, at the source of a great stream that falls into the Jordan. Scholars have looked for it at Khirbet Jazzir, near es-Salt by the springs of the Wadi Shu'eib, which suits Eusebius' stream; at Khirbet es-Sar (Sara) west of Amman, which suits his distances; and at Khirbet es-Sireh and Yajuz nearby. None of these has been excavated enough to settle the question."
    - "In Numbers Moses “sent to spy out Jaazer”, and Israel took its villages and drove out the Amorites. The tribes of Reuben and Gad, who “had a very great multitude of cattle”, saw “the land of Jazer, and the land of Gilead, that, behold, the place was a place for cattle”, and asked Moses for it; Gad rebuilt Jazer among its fenced cities. Joshua makes it the first point of Gad's border and a Levitical town of the sons of Merari. When Joab counted the people for David he crossed the Jordan and went “toward Jazer”; in David's fortieth year, Chronicles says, valiant men of the Levites were found “at Jazer of Gilead”."
    - "By the time of Isaiah and Jeremiah the town was Moab's, and both prophets mourn its vineyards: the vine of Sibmah, whose branches “are come even unto Jazer”, and “the weeping of Jazer”. Jeremiah's “sea of Jazer” may be a pool or a slip of the text. In 1 Maccabees Judas Maccabeus took Jazer and its villages from the Ammonites about 163 BC. Today the candidate sites lie in the hills of the Balqa, west of Amman in Jordan."
  ru:
    - "Иазер — город Галаада к востоку от Иордана, в холмах между Есевоном и Иавоком, в краю, пригодном для скота и виноградников. Где именно он стоял, неизвестно. Евсевий помещал его в десяти римских милях к западу от Филадельфии (Аммана) и в пятнадцати от Есевона, у истока большого потока, впадающего в Иордан. Его искали в Хирбет-Джаззире близ Эс-Салта у источников Вади-Шуэйб, что отвечает потоку Евсевия; в Хирбет-эс-Саре (Хирбет-Сара) к западу от Аммана, что отвечает его расстояниям; а также в соседних Хирбет-эс-Сире и Яджузе. Ни одно из этих мест не раскопано настолько, чтобы решить вопрос."
    - "В книге Чисел «послал Моисей высмотреть Иазер», и Израиль взял его селения и прогнал Аморреев. Колена Рувима и Гада, у которых «стад было весьма много», увидели, «что земля Иазер и земля Галаад есть место годное для стад», и просили её у Моисея; Гад отстроил Иазер среди своих укреплённых городов. У Иисуса Навина он — первая точка предела Гадова и левитский город сынов Мерари. Когда Иоав считал народ для Давида, он перешёл Иордан и направился «к Иазеру»; в сороковой год Давида, по книге Паралипоменон, были найдены «люди мужественные в Иазере Галаадском» из левитов."
    - "Ко времени Исаии и Иеремии город был моавитским, и оба пророка оплакивают его виноградники: лозу Севамскую, побеги которой «достигали до Иазера», и плачет о ней «плачем Иазера». Озеро Иазера у Иеремии («достигали до озера Иазера») — быть может, пруд или описка в тексте. По Первой книге Маккавейской Иуда Маккавей около 163 г. до н. э. взял Иазер и его селения у Аммонитян. Сегодня места-кандидаты лежат в холмах Балки, к западу от Аммана в Иордании."
  uk:
    - "Язер було містом Гілеаду на схід від Йордану, в пагорбах між Гесбоном і Яббоком, у краї, добрім для худоби й винограду. Де саме воно стояло, невідомо. Євсевій поміщав його за десять римських миль на захід від Філадельфії (Амман) і за п’ятнадцять від Гесбона, біля витоку великого потоку, що впадає в Йордан. Дослідники шукали його в Хірбет-Джаззірі, поблизу ес-Сальта біля джерел Ваді-Шуейб, що пасує до Євсевієвого потоку; в Хірбет-ес-Сарі (Сара) на захід від Амману, що пасує до його відстаней; і в Хірбет-ес-Сіре та Яджузі поблизу. Жодне з них не досліджене достатньо, щоб розв’язати питання."
    - "У Книзі Чисел Мойсей «післав ... на провідки в город Язер», і Ізраїль узяв його села та вигнав аморейців. Коліна Рувима й Гада, які мали «буйної скотини багато, велика тьма», побачили, що «Язер земля і Гілеад земля як раз годяться про скотину», і попросили її в Мойсея; Гад відбудував Язер серед своїх укріплених міст. Книга Ісуса Навина робить його першою точкою межі Гада й левітським містом синів Мерарі. Коли Йоав перелічував народ для Давида, він перейшов Йордан і пішов «по дорозї Язеру»; сорокового року Давида, кажуть Хроніки, знайшлися мужні люди з левітів «в Язері Галаадському»."
    - "За Ісаї та Єремії місто було моавським, і обидва пророки оплакують його виноградники: лозу Сівми, чиї пагони «сягали аж до Язеру», і плач, «як плакав над Язером». «Озеро Язерське» Єремії може бути ставом або помилкою тексту. У Першій книзі Макавеїв Юда Макавей узяв Язер і його села в аммонітян близько 163 р. до н. е. Сьогодні місця-кандидати лежать у пагорбах Балки, на захід від Амману в Йорданії."
  es:
    - "Jazer era una población de Galaad al este del Jordán, en las colinas entre Hesbón y el Jaboc, en un país bueno para el ganado y las vides. Dónde estuvo exactamente no se sabe. Eusebio la situó a diez millas romanas al oeste de Filadelfia (Amán) y a quince de Hesbón, en la fuente de una gran corriente que cae al Jordán. Los estudiosos la han buscado en Khirbet Jazzir, cerca de es-Salt, junto a los manantiales del Wadi Shu'eib, que concuerda con la corriente de Eusebio; en Khirbet es-Sar (Sara), al oeste de Amán, que concuerda con sus distancias; y en Khirbet es-Sireh y Yajuz, cercanos. Ninguno ha sido excavado lo bastante para resolver la cuestión."
    - "En Números, «envió Moisés á reconocer á Jazer», e Israel tomó sus aldeas y expulsó a los amorreos. Las tribus de Rubén y de Gad, que «tenían una muy grande muchedumbre de ganado», vieron «la tierra de Jazer y de Galaad, parecióles el país lugar de ganado», y la pidieron a Moisés; Gad reedificó Jazer entre sus ciudades fortificadas. Josué la hace el primer punto de la frontera de Gad y una ciudad levítica de los hijos de Merari. Cuando Joab censó al pueblo para David, cruzó el Jordán y se detuvo «junto á Jazer»; en el año cuarenta de David, dice Crónicas, se hallaron hombres valientes de los levitas «en Jazer de Galaad»."
    - "En tiempos de Isaías y Jeremías la población era de Moab, y ambos profetas lloran sus viñas: la vid de Sibma, cuyos sarmientos «habían llegado hasta Jazer», y el «lloro de Jazer». El «mar de Jazer» de Jeremías puede ser un estanque o un desliz del texto. En 1 Macabeos, Judas Macabeo tomó Jazer y sus aldeas a los amonitas hacia el 163 a. C. Hoy los sitios candidatos se hallan en las colinas del Balqa, al oeste de Amán, en Jordania."
  pt:
    - "Jazer era uma cidade de Gileade a leste do Jordão, nas colinas entre Hesbom e o Jaboque, em terra boa para gado e vinhas. Onde exatamente ficava não se sabe. Eusébio a pôs a dez milhas romanas a oeste de Filadélfia (Amã) e a quinze de Hesbom, na nascente de um grande riacho que deságua no Jordão. Estudiosos a procuraram em Khirbet Jazzir, perto de es-Salt, junto às fontes do uádi Shu’eib, que combina com o riacho de Eusébio; em Khirbet es-Sar (Sara), a oeste de Amã, que combina com suas distâncias; e em Khirbet es-Sireh e Yajuz, ali perto. Nenhum desses foi escavado o bastante para resolver a questão."
    - "Em Números, Moisés “mandou espiar Jazer”, e Israel tomou suas aldeias e expulsou os amorreus. As tribos de Rúben e Gade, que “tinham uma quantidade muito grande de gado”, viram “a terra de Jazer e a terra de Gileade. Eis que o lugar era um lugar para gado”, e a pediram a Moisés; Gade reconstruiu Jazer entre suas cidades fortificadas. Josué faz dela o primeiro ponto da fronteira de Gade e uma cidade levítica dos filhos de Merari. Quando Joabe recenseou o povo para Davi, atravessou o Jordão e “seguiram para Jazer”; no quadragésimo ano de Davi, diz Crônicas, homens valentes dos levitas foram achados “em Jazer de Gileade”."
    - "No tempo de Isaías e Jeremias a cidade era de Moabe, e ambos os profetas lamentam suas vinhas: a videira de Sibma, cujos ramos “chegavam até Jazer”, e “o choro de Jazer”. O “mar de Jazer” de Jeremias pode ser um tanque ou um deslize do texto. Em 1 Macabeus, Judas Macabeu tomou Jazer e suas aldeias dos amonitas por volta de 163 a.C. Hoje os sítios candidatos ficam nas colinas de Balqa, a oeste de Amã, na Jordânia."
  de:
    - "Jaser war eine Stadt Gileads östlich des Jordan, im Bergland zwischen Heschbon und dem Jabbok, in Land, das für Vieh und Wein gut war. Wo genau sie stand, ist nicht bekannt. Eusebius setzte sie zehn römische Meilen westlich von Philadelphia (Amman) und fünfzehn von Heschbon an, an der Quelle eines großen Baches, der in den Jordan fällt. Gelehrte haben sie bei Chirbet Jazzir nahe es-Salt an den Quellen des Wadi Schu'eib gesucht, was zu Eusebius' Bach passt; bei Chirbet es-Sar (Sara) westlich von Amman, was zu seinen Entfernungen passt; und bei Chirbet es-Sireh und Jajus in der Nähe. Keine dieser Stätten ist genug ausgegraben, um die Frage zu entscheiden."
    - "Im vierten Buch Mose „sandte“ Mose „aus Kundschafter gen Jaser“, und Israel gewann seine Ortschaften und nahm die Amoriter ein. Die Stämme Ruben und Gad, die „sehr viel Vieh“ hatten, „sahen das Land Jaser und Gilead an als gute Stätte für ihr Vieh“ und baten Mose darum; Gad baute Jaser unter seinen befestigten Städten wieder auf. Josua macht es zum ersten Punkt von Gads Grenze und zu einer Levitenstadt der Söhne Merari. Als Joab für David das Volk zählte, überschritt er den Jordan und zog „gen Jaser“; im vierzigsten Jahr Davids, sagt die Chronik, wurden tüchtige Männer der Leviten „zu Jaser in Gilead“ gefunden."
    - "Zur Zeit Jesajas und Jeremias gehörte die Stadt Moab, und beide Propheten betrauern ihre Weinberge: den Weinstock zu Sibma, dessen Reben „reichten bis gen Jaser“, und „darum weine ich um Jaser“. Jeremias „Meer Jaser“ mag ein Teich oder ein Textfehler sein. Im ersten Makkabäerbuch nahm Judas Makkabäus Jaser und seine Dörfer um 163 v. Chr. den Ammonitern ab. Heute liegen die Kandidatenstätten im Bergland der Balqa, westlich von Amman in Jordanien."
  fr:
    - "Jaezer était une ville de Galaad à l’est du Jourdain, dans les collines entre Hesbon et le Jabbok, en pays propre au bétail et à la vigne. On ignore où elle se trouvait exactement. Eusèbe la mettait à dix milles romains à l’ouest de Philadelphie (Amman) et à quinze de Hesbon, à la source d’un grand cours d’eau qui se jette dans le Jourdain. Les spécialistes l’ont cherchée à Khirbet Jazzir, près d’es-Salt, aux sources de l’oued Shu’eib, ce qui convient au cours d’eau d’Eusèbe ; à Khirbet es-Sar (Sara), à l’ouest d’Amman, ce qui convient à ses distances ; et à Khirbet es-Sireh et Yajuz tout près. Aucun n’a été assez fouillé pour trancher."
    - "Dans les Nombres, Moïse « envoya reconnaître Jaezer », et Israël prit ses villes et chassa les Amoréens. Les tribus de Ruben et de Gad, qui « avaient une quantité considérable de troupeaux », virent que « le pays de Jaezer et le pays de Galaad étaient un lieu propre pour des troupeaux », et le demandèrent à Moïse ; Gad rebâtit Jaezer parmi ses villes fortes. Josué en fait le premier point de la frontière de Gad et une ville lévitique des fils de Merari. Quand Joab dénombra le peuple pour David, il passa le Jourdain et campa « près de Jaezer » ; la quarantième année de David, disent les Chroniques, on trouva de vaillants hommes des Lévites « à Jaezer en Galaad »."
    - "À l’époque d’Ésaïe et de Jérémie, la ville était à Moab, et les deux prophètes pleurent ses vignobles : la vigne de Sibma, dont les rameaux « s’étendaient jusqu’à Jaezer », et « je pleure sur la vigne de Sibma, comme sur Jaezer ». La « mer de Jaezer » de Jérémie peut être un bassin ou une faute du texte. Dans 1 Maccabées, Judas Maccabée prit Jaezer et ses villages aux Ammonites vers 163 av. J.-C. Aujourd’hui, les sites candidats se trouvent dans les collines de la Balqa, à l’ouest d’Amman, en Jordanie."
  pl:
    - "Jazer było miastem Gileadu na wschód od Jordanu, we wzgórzach między Cheszbonem a Jabbokiem, w kraju dobrym dla bydła i winorośli. Gdzie dokładnie stało, nie wiadomo. Euzebiusz umieścił je dziesięć mil rzymskich na zachód od Filadelfii (Ammanu) i piętnaście od Cheszbonu, u źródła wielkiego strumienia wpadającego do Jordanu. Uczeni szukali go w Chirbet Dżazzir, koło as-Salt przy źródłach Wadi Szu'ajb, co pasuje do strumienia Euzebiusza; w Chirbet es-Sar (Sara) na zachód od Ammanu, co pasuje do jego odległości; oraz w Chirbet es-Sireh i Jadżuz w pobliżu. Żadne z nich nie zostało dostatecznie zbadane, by sprawę rozstrzygnąć."
    - "W Księdze Liczb czytamy: „posłał Mojżesz na szpiegi do Jazer”, a Izrael zajął jego wsie i wypędził Amorytów. Pokolenia Rubena i Gada, które miały „bydła bardzo wiele”, zobaczyły „ziemię Jazer i ziemię Galaad, że miejsce ono było sposobne dla bydła”, i poprosiły o nią Mojżesza; Gad odbudował Jazer wśród swoich miast obwarowanych. Jozue czyni je pierwszym punktem granicy Gada i lewickim miastem synów Merariego. Gdy Joab liczył lud dla Dawida, przeprawił się przez Jordan i obozował także „przy Jazer”; w czterdziestym roku Dawida, mówią Księgi Kronik, znaleziono dzielnych mężów lewickich „w Jazer Galaadskiem”."
    - "Za Izajasza i Jeremiasza miasto było już moabskie i obaj prorocy opłakują jego winnice: winną macicę Sibmy, której latorośle „aż do Jazer sięgały”, i „Bardziej niż płakano Jazerczyków”. Wyrażenie „aż do morza Jazer” u Jeremiasza może być sadzawką lub pomyłką w tekście. W 1 Księdze Machabejskiej Juda Machabeusz zdobył Jazer i jego wsie od Ammonitów około 163 r. p.n.e. Dziś miejsca-kandydaci leżą we wzgórzach Balki, na zachód od Ammanu w Jordanii."
  it:
    - "Iazer era una città di Galaad a est del Giordano, sulle colline fra Chesbon e lo Iabbok, in una zona buona per il bestiame e le viti. Dove sorgesse esattamente non è noto. Eusebio la pose a dieci miglia romane a ovest di Filadelfia (Amman) e a quindici da Chesbon, alla sorgente di un grande torrente che si getta nel Giordano. Gli studiosi l’hanno cercata a Khirbet Jazzir, presso es-Salt, alle sorgenti del Wadi Shu’eib, che si accorda con il torrente di Eusebio; a Khirbet es-Sar (Sara) a ovest di Amman, che si accorda con le sue distanze; e a Khirbet es-Sireh e Yajuz vicino. Nessuno di questi è stato scavato abbastanza da risolvere la questione."
    - "Nei Numeri Mosè «mandò a esplorare Jaezer», e Israele prese le città del suo territorio e ne cacciò gli Amorrei. Le tribù di Ruben e di Gad, che «aveano del bestiame in grandissimo numero», videro che «il paese di Iazer e il paese di Galaad erano luoghi da bestiame», e lo chiesero a Mosè; Gad ricostruì Iazer fra le sue città fortificate. Giosuè ne fa il primo punto del confine di Gad e una città levitica dei figli di Merari. Quando Ioab contò il popolo per Davide, passò il Giordano e si accampò «presso Jazer»; nel quarantesimo anno di Davide, dicono le Cronache, si trovarono uomini forti e valorosi dei Leviti «a Jaezer in Galaad»."
    - "Al tempo di Isaia e di Geremia la città era di Moab, ed entrambi i profeti piangono i suoi vigneti: la vite di Sibma, i cui tralci «arrivavano fino a Jazer», e «come piange Jazer». Il «mare di Jazer» di Geremia può essere una vasca o un errore del testo. In 1 Maccabei Giuda Maccabeo prese Iazer e i suoi villaggi agli Ammoniti verso il 163 a.C. Oggi i siti candidati si trovano sulle colline del Balqa, a ovest di Amman in Giordania."
  nl:
    - "Jaëzer was een stad in Gilead ten oosten van de Jordaan, in de heuvels tussen Chesbon en de Jabbok, in land dat goed was voor vee en wijnstokken. Waar het precies stond, is niet bekend. Eusebius plaatste het tien Romeinse mijlen ten westen van Filadelfia (Amman) en vijftien van Chesbon, bij de bron van een grote stroom die in de Jordaan valt. Geleerden hebben het gezocht bij Khirbet Jazzir, bij es-Salt aan de bronnen van de Wadi Shu’eib, wat past bij Eusebius’ stroom; bij Khirbet es-Sar (Sara) ten westen van Amman, wat past bij zijn afstanden; en bij Khirbet es-Sireh en Yajuz in de buurt. Geen van deze is genoeg opgegraven om de kwestie te beslissen."
    - "In Numeri “zond Mozes om Jaezer te verspieden”, en Israël nam de dorpen in en dreef de Amorieten uit. De kinderen van Ruben “hadden veel vee, en de kinderen van Gad hadden machtig veel”, en zij zagen “het land Jaezer, en het land van Gilead, en ziet, deze plaats was een plaats voor vee”, en vroegen het aan Mozes; Gad herbouwde Jaëzer onder zijn versterkte steden. Jozua maakt het het eerste punt van Gads grens en een Levietenstad van de zonen van Merari. Toen Joab het volk telde voor David, stak hij de Jordaan over en legerde zich bij Aroer en “aan Jaezer”; in Davids veertigste jaar, zegt Kronieken, werden “kloeke helden in Jaezer in Gilead” gevonden."
    - "In de tijd van Jesaja en Jeremia was de stad van Moab, en beide profeten bewenen haar wijngaarden: de wijnstok van Sibma, wiens twijgen “reiken tot Jaezer toe”, en “het geween van Jaezer”. Jeremia’s “zee van Jaezer” is misschien een poel of een tekstfout. In 1 Makkabeeën nam Judas Makkabeüs omstreeks 163 v.Chr. Jaëzer en zijn dorpen van de Ammonieten. Nu liggen de kandidaat-plaatsen in de heuvels van de Balqa, ten westen van Amman in Jordanië."
  cs:
    - "Jazer bylo město v Gileadu východně od Jordánu, v pahorcích mezi Chešbónem a Jabokem, v kraji dobrém pro dobytek a révu. Kde přesně stálo, není známo. Eusebios je kladl deset římských mil západně od Filadelfie (Ammánu) a patnáct od Chešbónu, u pramene velkého potoka, který se vlévá do Jordánu. Učenci je hledali v Chirbet Jazzir, poblíž es-Saltu u pramenů Wádí Shu'eib, což odpovídá Eusebiovu potoku; v Chirbet es-Sar (Sara) západně od Ammánu, což odpovídá jeho vzdálenostem; a v Chirbet es-Sireh a Yajuz poblíž. Žádné z nich nebylo vykopáno dost, aby otázku rozhodlo."
    - "V Numeri „poslal Mojžíš, aby shlédli Jazer“ a Izrael vzal jeho vsi a vyhnal Amorejské. Kmeny Rúbenův a Gádův, kteří „dobytka velmi mnoho“ měli, uzřeli „zemi Jazer a zemi Galád, ano místo to místo příhodné pro dobytek“ a požádali o ni Mojžíše; Gád Jazer znovu vystavěl mezi svými opevněnými městy. Jozue z něj činí první bod hranice Gádovy a levitské město synů Merariho. Když Joáb sčítal lid pro Davida, přešel Jordán a šel k Jazeru; ve čtyřicátém roce Davidovy vlády, praví Letopisy, byli mezi levity nalezeni udatní muži „v Jazar Galádské“."
    - "V době Izajáše a Jeremjáše bylo město moábské a oba proroci oplakávají jeho vinice: révu Sibmy, jejíž réví „až do Jazer dosahalo“, a „pláč Jazerských“. Jeremjášovo „moře Jazerské“ může být rybník nebo chyba v textu. V První knize Makabejské Juda Makabejský vzal Jazer a jeho vsi Amónským kolem roku 163 př. n. l. Dnes kandidátská místa leží v pahorcích Balky, západně od Ammánu v Jordánsku."
  sv:
    - "Jaser var en stad i Gilead öster om Jordan, i bergen mellan Heshbon och Jabbok, i ett land gott för boskap och vin. Var den exakt stod är inte känt. Eusebios förlade den tio romerska mil väster om Filadelfia (Amman) och femton från Heshbon, vid källan till en stor å som faller i Jordan. Forskare har sökt den vid Khirbet Jazzir, nära es-Salt vid källorna i Wadi Shu'eib, vilket passar Eusebios å; vid Khirbet es-Sar (Sara) väster om Amman, vilket passar hans avstånd; och vid Khirbet es-Sireh och Yajuz i närheten. Ingen av dessa har grävts ut tillräckligt för att avgöra frågan."
    - "I Fjärde Moseboken står det att ”Mose sände ut och lät bespeja Jaeser”, och Israel intog dess underlydande orter och fördrev amoréerna. Rubens och Gads stammar, som ”hade stora och mycket talrika boskapshjordar”, såg ”Jaesers land och Gileads land”, och ”funno de att detta var en trakt för boskap”, och bad Mose om det; Gad byggde upp Jaser bland sina befästa städer. Josua gör det till första punkten på Gads gräns och till en levitstad för Meraris söner. När Joav räknade folket åt David gick han över Jordan och lägrade sig ”åt Jaeser till”; i Davids fyrtionde år fanns, säger Krönikeboken, dugande män av leviterna ”i Jaeser i Gilead”."
    - "På Jesajas och Jeremias tid var staden Moabs, och båda profeterna sörjer dess vingårdar: Sibmas vinträd, vars rankor ”nådde till Jaeser”, och gråten ”såsom Jaeser gråter”. Jeremias ”Jaesers hav” kan vara en damm eller ett fel i texten. I Första Mackabeerboken tog Judas mackabeen Jaser och dess byar från ammoniterna omkring 163 f.Kr. I dag ligger kandidatplatserna i Balqas berg, väster om Amman i Jordanien."
  nb:
    - "Jaser var en by i Gilead øst for Jordan, i åsene mellom Hesjbon og Jabbok, i land som var godt for fe og vin. Hvor nøyaktig den sto, er ikke kjent. Eusebius satte den ti romerske mil vest for Filadelfia (Amman) og femten fra Hesjbon, ved kilden til en stor bekk som faller ut i Jordan. Forskere har lett etter den ved Khirbet Jazzir, nær es-Salt ved kildene i Wadi Shu'eib, som passer med Eusebius' bekk; ved Khirbet es-Sar (Sara) vest for Amman, som passer med hans avstander; og ved Khirbet es-Sireh og Yajuz i nærheten. Ingen av disse er gravd ut nok til å avgjøre spørsmålet."
    - "I Fjerde Mosebok sendte Moses «folk for å utspeide Jaser», og Israel tok dens landsbyer og drev ut amorittene. Stammene Ruben og Gad, som «hadde en mengde fe, en svær mengde», så at «Jasers land og Gileads land var vel skikket for feavl», og ba Moses om det; Gad bygde Jaser opp igjen blant sine befestede byer. Josva gjør den til første punkt på Gads grense og til en levittby for Meraris sønner. Da Joab telte folket for David, gikk han over Jordan og dro «bortimot Jaser»; i Davids førtiende år, sier Krønikebøkene, fantes det dyktige krigsmenn blant levittene «i Jaser i Gilead»."
    - "På Jesajas og Jeremias tid var byen Moabs, og begge profetene sørger over dens vingårder: Sibmas vinranker, som «nådde like til Jaser», og «Som Jaser gråter, gråter jeg over dig». Jeremias «Jasers hav» kan være en dam eller en feil i teksten. I Første Makkabeerbok tok Judas Makkabeus Jaser og dens landsbyer fra ammonittene omkring 163 f.Kr. I dag ligger kandidatstedene i åsene i Balqa, vest for Amman i Jordan."
  tl:
    - "Ang Jazer ay isang bayan ng Gilead sa silangan ng Jordan, sa mga burol sa pagitan ng Hesbon at Jaboc, sa lupaing mabuti para sa baka at ubas. Hindi alam kung saan eksaktong nakatayo ito. Inilagay ito ni Eusebio sampung milyang Romano sa kanluran ng Filadelfia (Amman) at labinlima mula sa Hesbon, sa pinagmumulan ng isang malaking batis na bumabagsak sa Jordan. Hinanap ito ng mga iskolar sa Khirbet Jazzir, malapit sa es-Salt sa tabi ng mga bukal ng Wadi Shu'eib, na umaangkop sa batis ni Eusebio; sa Khirbet es-Sar (Sara) sa kanluran ng Amman, na umaangkop sa kaniyang mga distansya; at sa Khirbet es-Sireh at Yajuz sa malapit. Wala sa mga ito ang sapat na nahukay upang malutas ang tanong."
    - "Sa Mga Bilang, si Moises ay “nagsugo upang tumiktik sa Jazer, at kanilang sinakop ang mga bayan niyaon at pinalayas nila ang mga Amorrheo na nandoon”. Ang mga lipi ni Ruben at Gad, na “mayroong napakaraming hayop”, ay nakakita ng “lupain ng Jazer, at ang lupain ng Galaad, na, narito, ang dako ay minagaling nilang dako sa hayop”, at hiningi ito kay Moises; itinayong muli ng Gad ang Jazer sa mga nakukutaan nilang lungsod. Ginagawa itong unang punto ng hangganan ni Gad ni Josue at isang bayan ng mga Levita ng mga anak ni Merari. Nang bilangin ni Joab ang bayan para kay David ay tumawid siya sa Jordan at nagsihantong “sa Jazer”; sa ikaapat na pung taon ni David, sabi ng Mga Cronica, may nasumpungang makapangyarihang lalaking matapang ng mga Levita “sa Jazer ng Galaad”."
    - "Pagsapit ng panahon nina Isaias at Jeremias, ang bayan ay sa Moab na, at tinatangisan ng parehong propeta ang mga ubasan nito: ang puno ng ubas ng Sibma, na ang mga sanga ay “nagsisapit hanggang sa Jazer”, at ang “pagtangis ng Jazer”. Ang “dagat ng Jazer” ni Jeremias ay maaaring isang tangke o sirang teksto. Sa 1 Macabeo, kinuha ni Judas Macabeo ang Jazer at mga nayon nito mula sa mga Ammonita mga 163 BK. Ang mga lugar na kandidato ay nasa ngayon sa mga burol ng Balqa, sa kanluran ng Amman sa Jordan."
  da:
    - "Jazer var en by i Gilead øst for Jordan, i bjergene mellem Hesjbon og Jabbok, i land, der var godt til kvæg og vin. Hvor præcis den stod, er ikke kendt. Eusebios satte den ti romerske mil vest for Filadelfia (Amman) og femten fra Hesjbon, ved kilden til en stor strøm, der falder i Jordan. Forskere har søgt den ved Khirbet Jazzir, nær es-Salt ved kilderne i Wadi Shu'eib, hvilket passer til Eusebios' strøm; ved Khirbet es-Sar (Sara) vest for Amman, hvilket passer til hans afstande; og ved Khirbet es-Sireh og Yajuz i nærheden. Ingen af disse er udgravet nok til at afgøre spørgsmålet."
    - "I Fjerde Mosebog hedder det: »Mose sendte ud at bespejde Jaeser«, og Israel indtog dens byer og fordrev amoritterne. Rubens og Gads stammer, der »havde meget og saare talrigt Kvæg«, så »det Land Jaeser og det Land Gilead«, og at »det Sted var et bekvemt Sted til Kvæg«, og bad Moses om det; Gad genopbyggede Jazer blandt sine befæstede byer. Josva gør den til det første punkt på Gads grænse og til en levitisk by for Meraris sønner. Da Joab talte folket for David, krydsede han Jordan og kom til Aroer og Jazer. I Davids fyrretyvende år, siger Krønikebøgerne, blev der fundet vældige helte blandt leviterne »i Jaeser i Gilead«."
    - "På Esajas' og Jeremias' tid var byen Moabs, og begge profeter sørger over dens vingårde: vintræet i Sibma, hvis ranker »naaede til Jaeser«, og »Jaesers Graad«. Jeremias' »Jaesers Hav« kan være en dam eller en fejl i teksten. I Første Makkabæerbog tog Judas Makkabæus Jazer og dens landsbyer fra ammonitterne omkring 163 f.Kr. I dag ligger kandidatstederne i Balqas bjerge, vest for Amman i Jordan."
  sr:
    - "Јазир је био град Галада источно од Јордана, у брдима између Есевона и Јавока, у крају доброг за стоку и винову лозу. Где је тачно стајао, није познато. Јевсевије га је ставио десет римских миља западно од Филаделфије (Амана) и петнаест од Есевона, на извору велике реке која се улива у Јордан. Научници су га тражили у Хирбет Џазиру, близу Ес-Салта код извора Вади Шуајб, што одговара Јевсевијевом потоку; у Хирбет ес-Сару (Сара) западно од Амана, што одговара његовим удаљеностима; и у Хирбет ес-Сири и Јајузу у близини. Ни једно од њих није довољно ископавано да реши питање."
    - "У Бројевима „посла Мојсије да уходе Јазир“, и Израиљ је узео његова села и истерао Аморејце. Племена Рувимово и Гадово, која „имаху врло много стоке“, видела су „земљу јазирску и земљу галадску да је добра за стоку“ и затражила је од Мојсија; Гад је обновио Јазир међу својим тврдим градовима. Исус га чини првом тачком границе Гада и левитским градом Мераријевих синова. Кад је Јоав бројао народ за Давида, прешао је Јордан и стао у логор „код Јазира“; у Давидовој четрдесетој години, кажу Летописи, нађени су храбри јунаци Левита „у Јазиру галадском“."
    - "У доба Исаије и Јеремије град је био моавски, и оба пророка жале његове винограде: чокот Сивме: „красне лозе његове, које досезаху до Јазира“, и „плачем јазирским“. Јеремијино „мора јазирског“ можда је базен или омашка у тексту. У Првој књизи о Макавејцима Јуда Макавејац узео је Јазир и његова села од Амонаца око 163. п. н. е. Данас кандидатска налазишта леже у брдима Балке, западно од Амана у Јордану."
  hu:
    - "Jázér a Jordántól keletre fekvő Gileád városa volt, a Hesbon és a Jabbók közötti dombokon, marhatartásra és szőlőre alkalmas vidéken. Hogy pontosan hol állt, nem tudjuk. Eusebius a Filadelfiától (Ammántól) tíz római mérföldre nyugatra, Hesbontól tizenötre helyezte, egy nagy patak forrásánál, amely a Jordánba ömlik. A kutatók Hirbet Dzsazzírnál keresték, Es-Szalt közelében, a Vádi Su'ejb forrásainál, amely Eusebius patakjához illik; Hirbet es-Szarnál (Szára), Ammántól nyugatra, amely távolságaihoz illik; és a közeli Hirbet es-Szirénél és Jadzsúznál. Egyiket sem ásták ki eléggé a kérdés eldöntéséhez."
    - "A Számok könyvében „elkülde Mózes, hogy megkémleljék Jázert”, Izráel pedig bevette városait, és kiűzte az emóreusokat. Rúben és Gád törzse, amelyeknek „igen sok barmok vala”, látták „a Jázér földét és a Gileád földét, hogy ímé az a hely marhatartani való hely”, és kérték Mózestől; Gád újjáépítette Jázért megerősített városai között. Józsué Gád határának első pontjává és a Merári fiainak lévita városává teszi. Amikor Joáb megszámlálta a népet Dávidnak, átkelt a Jordánon, és „Jáser mellett” tábort járt; Dávid negyvenedik évében a Krónikák szerint bátor lévita férfiakat találtak „Gileád-Jaézerben”."
    - "Ézsaiás és Jeremiás idejére a város Moábé volt, és mindkét próféta siratja szőlőit: Szibma szőlejét, amelynek hajtásai „Jáézerig értek”, és „Jáézer siralmát”. Jeremiás „Jaézer tengere” talán tó, vagy szövegbe csúszott hiba. Az 1Makkabeusokban Júdás Makkabeus Kr. e. 163 körül elfoglalta Jázért és falvait az ammonitáktól. A jelölt helyek ma Jordániában, a Balka dombjai között, Ammántól nyugatra fekszenek."
  fi:
    - "Jaser oli Gileadin kaupunki Jordanin itäpuolella, kukkuloilla Hesbonin ja Jabbokin välissä, karjalle ja viiniköynnöksille hyvällä maalla. Missä tarkalleen se sijaitsi, ei tiedetä. Eusebios sijoitti sen kymmenen roomalaisen mailin päähän Filadelfiasta (Amman) länteen ja viidentoista päähän Hesbonista, suuren Jordaniin laskevan puron lähteelle. Tutkijat ovat etsineet sitä Khirbet Jazzirista, es-Saltin lähellä Wadi Shu'eibin lähteiden luona, mikä sopii Eusebioksen puroon; Khirbet es-Sarista (Sara) Ammanista länteen, mikä sopii hänen etäisyyksiinsä; sekä läheltä Khirbet es-Sirehista ja Yajuzista. Mitään niistä ei ole kaivettu riittävästi kysymyksen ratkaisemiseksi."
    - "Mooseksen neljännessä kirjassa Mooses ”lähetti vakoilemaan Jaeseria”, ja Israel valtasi sen kylät ja karkotti amorilaiset. Ruubenin ja Gadin heimot, joilla oli ”paljon, ylen runsaasti, karjaa”, näkivät ”Jaeserin maata ja Gileadin maata, niin he huomasivat, että seutu oli karjanhoitoon sopiva”, ja pyysivät sitä Moosekselta; Gad rakensi Jaserin uudelleen muurien ympäröimien kaupunkiensa joukkoon. Joosua tekee siitä Gadin rajan ensimmäisen kohdan ja Merarin poikien leeviläiskaupungin. Kun Joab laski kansan Daavidille, hän ylitti Jordanin ja meni ”Gaadiin ja Jaeseriin päin”; Daavidin neljäntenäkymmenentenä vuotena, kertovat Aikakirjat, löydettiin leeviläisten urhoollisia miehiä ”Gileadin Jaeserissa”."
    - "Jesajan ja Jeremian aikaan kaupunki oli Moabin, ja kumpikin profeetta suree sen viinitarhoja: Sibman viiniköynnöstä, jonka oksat ”ulottuivat Jaeseriin asti”, ja ”minä itken Jaeserin kanssa”. Jeremian ”Jaeserin meri” voi olla lammikko tai tekstin lipsahdus. Ensimmäisessä makkabilaiskirjassa Juudas Makkabeus valloitti Jaserin ja sen kylät ammonilaisilta noin vuonna 163 eaa. Nykyään ehdokaspaikat sijaitsevat Balqan kukkuloilla Ammanista länteen Jordaniassa."
  vi:
    - "Gia-ê-xe là một thành của Ga-la-át phía đông sông Giô-đanh, trong các đồi giữa Hết-bôn và Gia-bốc, trong xứ tốt cho gia súc và nho. Thành đứng chính xác ở đâu thì không biết. Eusebius đặt nó cách Phi-la-đen-phi (Amman) mười dặm La Mã về phía tây và cách Hết-bôn mười lăm, ở nguồn một con suối lớn đổ vào sông Giô-đanh. Các học giả đã tìm ở Khirbet Jazzir, gần es-Salt bên các suối của Wadi Shu'eib, khớp với con suối của Eusebius; ở Khirbet es-Sar (Sara) phía tây Amman, khớp với các khoảng cách của ông; và ở Khirbet es-Sireh và Yajuz gần đó. Chưa nơi nào được khai quật đủ để giải quyết vấn đề."
    - "Trong Dân Số Ký, “Môi-se sai đi do thám Gia-ê-xe, chiếm các thành bổn hạt và đuổi dân A-mô-rít ở tại đó”. Các chi phái Ru-bên và Gát, những người “có bầy súc vật rất nhiều”, thấy “xứ Gia-ê-xe và xứ Ga-la-át là đất tiện hiệp nuôi bầy súc vật”, và xin Môi-se; Gát xây lại Gia-ê-xe trong các thành kiên cố của mình. Giô-suê coi đó là điểm đầu tiên của ranh Gát và một thành Lê-vi của con cháu Mê-ra-ri. Khi Giô-áp kiểm tra dân cho Đa-vít, ông qua sông Giô-đanh và hạ trại tại Gia-ê-xe; vào năm thứ bốn mươi của Đa-vít, sách Sử Ký nói, những người dõng sĩ trong người Lê-vi được tìm thấy “tại Gia-ê-xe trong xứ Ga-la-át”."
    - "Vào thời Ê-sai và Giê-rê-mi, thành thuộc Mô-áp, và cả hai nhà tiên tri than khóc vườn nho của nó: cây nho của Síp-ma, mà ngày trước “giàng ra tới Gia-ê-xe”, và “ta vì cây nho của Síp-ma mà khóc lóc như Gia-ê-xe”. “Biển Gia-ê-xe” của Giê-rê-mi có thể là một hồ nước hay một chỗ sai của văn bản. Trong 1 Ma-ca-bê, Giu-đa Maccabee chiếm Gia-ê-xe và các làng của nó từ người Am-môn khoảng năm 163 TCN. Ngày nay các địa điểm ứng viên nằm trong các đồi Balqa, phía tây Amman ở Jordan."
  ro:
    - "Iazer era un oraș al Galaadului, la est de Iordan, în dealurile dintre Hesbon și Iaboc, într-un ținut bun pentru vite și vii. Unde anume se afla nu se știe. Eusebiu îl punea la zece mile romane spre vest de Filadelfia (Amman) și la cincisprezece de Hesbon, la izvorul unui mare pârâu care se varsă în Iordan. Cercetătorii l-au căutat la Khirbet Jazzir, lângă es-Salt, la izvoarele din Wadi Shu'eib, care se potrivește pârâului lui Eusebiu; la Khirbet es-Sar (Sara), la vest de Amman, care se potrivește distanțelor lui; și la Khirbet es-Sireh și Yajuz din apropiere. Niciunul nu a fost săpat destul pentru a lămuri chestiunea."
    - "În Numeri, „a trimis Moisì ca să iscodească pre Iazir, și o a luat pre ea și satele ei, și a scos pre Amoreul care erà acolo”. Triburile lui Ruben și Gad, care aveau o foarte mare mulțime de vite, au văzut țara Iazerului și țara Galaadului, că locul era bun pentru vite, și au cerut-o de la Moise; Gad a zidit din nou Iazerul printre cetățile lui întărite. Iosua îl face primul punct al hotarului lui Gad și oraș levitic al fiilor lui Merari. Când Ioab a numărat poporul pentru David, a trecut Iordanul și a mers spre Iazer; în anul al patruzecilea al lui David, spun Cronicile, s-au găsit între leviți oameni viteji „în Iasirul Galaaditeni”."
    - "Pe vremea lui Isaia și Ieremia, orașul era al Moabului, iar ambii profeți îi plâng viile: via din Sibma, ale cărei ramuri ajungeau până la Iazer, și „plângerea Iazirului”. „Marea Iazerului” a lui Ieremia poate fi un iaz sau o greșeală de text. În 1 Macabei, Iuda Macabeul a luat Iazerul și satele lui de la amoniți în jurul anului 163 î.Hr. Astăzi locurile candidate se află în dealurile Balqa, la vest de Amman, în Iordania."
  bg:
    - "Язер беше град в Галаад на изток от Йордан, в хълмовете между Есевон и Явок, в земя, добра за добитък и лозя. Къде точно е стоял, не е известно. Евсевий го поставя на десет римски мили западно от Филаделфия (Аман) и на петнадесет от Есевон, при извора на голям поток, който се влива в Йордан. Учените са го търсили в Хирбет Джазир, близо до ес-Салт при изворите на Уади Шуейб, което отговаря на потока на Евсевий; в Хирбет ес-Сар (Сара) западно от Аман, което отговаря на разстоянията му; и в близките Хирбет ес-Сире и Яджуз. Никое от тези места не е разкопано достатъчно, за да реши въпроса."
    - "В Числа Мойсей „проводи... да съгледателствуват Язир“, а Израил превзе селата му и изгони аморейците. Племената на Рувим и Гад, които „имаха твърде много добитък“, „видяха земята Язир и Галаадската земя, и, ето, мястото беше място за добитък“, и я поискаха от Мойсей; Гад съгради Язер сред укрепените си градове. Книгата на Иисус Навин го прави първата точка на границата на Гад и левитски град на синовете на Мерари. Когато Йоав преброяваше народа за Давид, той премина Йордан и отиде „към Язир“; в четиридесетата година на Давид, казва Летописи, сред левитите бяха намерени храбри мъже „в Язир Галаад“."
    - "По времето на Исаия и Йеремия градът беше на Моав и двамата пророци оплакват лозята му: лозата на Сивма, чиито леторасли „стигаха до Язир“, и „плача на Язир“. „Морето на Язир“ у Йеремия може да е езерце или грешка в текста. Според 1 Макавейска книга Юда Макавей превзе Язер и селата му от амонците около 163 г. пр.н.е. Днес възможните места лежат в хълмовете на Балка, западно от Аман в Йордания."
