# Overview article (ADR 0007). Mainstream facts only; disputed points (the authorship of 2 Thessalonians) are named as such.
id: thessalonica
place: afa9d8e
title:
  en: "Thessalonica"
  ru: "Фессалоника"
  uk: "Солунь"
  es: "Tesalónica"
  pt: "Tessalônica"
  de: "Thessalonich"
