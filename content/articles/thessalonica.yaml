body:
  en:
    - "Thessalonica, today's Thessaloniki, stands at the head of the Thermaic Gulf in Macedonia, where the routes from the Balkan interior reach the sea. About 315 BC Cassander, who then ruled Macedonia, founded it by gathering into one city the people of some twenty-six small towns around the gulf, and named it after his wife Thessalonike, a daughter of Philip II. Strabo says the place had earlier been called Therma."
    - 'After Rome defeated the last Macedonian king, Perseus, in 168 BC and made Macedonia a province in 146 BC, Thessalonica became the seat of its governors and a station on the Via Egnatia, the Roman road across the Balkans. Pliny calls it a free city. It kept its own magistrates, whom inscriptions call politarchs, the title Acts gives to the "rulers of the city".'
    - 'Paul and Silas came here from Philippi and for three sabbaths reasoned in the synagogue; some Jews, a great multitude of God-fearing Greeks and not a few leading women believed. Their opponents gathered a crowd, attacked the house of Jason, and dragged him before the rulers, crying that those who "have turned the world upside down are come hither also"; the brethren sent Paul and Silas away by night to Berea, where Jews of Thessalonica followed to stir up the people. While Paul was in the city, the church at Philippi sent him help more than once. From Athens Paul sent Timothy back to strengthen the church, and he wrote to it; First Thessalonians is usually held to be the earliest of his letters, while the authorship of Second Thessalonians is disputed. Aristarchus and Secundus of Thessalonica later travelled with Paul, and Demas left him to go there.'
    - "About AD 300 the emperor Galerius made Thessalonica his residence and built a palace, a triumphal arch and the great round hall later known as the Rotunda. Tradition honours Demetrius as a martyr of this time, and a large church was later built in his name. In 380 Theodosius I was baptised here during an illness and from here issued the law that bound his subjects to the Nicene faith. In 390, after a riot in which the commander Butheric was killed, the emperor's troops massacred the townspeople; Theodoret reports that seven thousand died, and Ambrose of Milan made Theodosius do public penance."
  ru:
    - "Фессалоника, нынешние Салоники, стоит в глубине Фермейского залива в Македонии, там, где пути из глубин Балкан выходят к морю. Около 315 г. до н. э. её основал Кассандр, правивший тогда Македонией: он собрал в один город жителей примерно двадцати шести городков вокруг залива и назвал его в честь своей жены Фессалоники, дочери Филиппа II. Страбон сообщает, что прежде это место называлось Ферма."
    - "После того как Рим в 168 г. до н. э. разбил последнего македонского царя Персея, а в 146 г. до н. э. сделал Македонию провинцией, Фессалоника стала резиденцией её наместников и станцией на Эгнатиевой дороге, римском пути через Балканы. Плиний называет её свободным городом. В ней правили свои должностные лица; надписи называют их политархами — тем же словом Деяния называют «городских начальников»."
    - "Павел и Сила пришли сюда из Филипп и три субботы говорили в синагоге из Писаний; уверовали некоторые из Иудеев, великое множество чтущих Бога Еллинов и немало знатных женщин. Противники собрали толпу, приступили к дому Иасона и повлекли его к городским начальникам, крича, что «эти всесветные возмутители пришли и сюда»; братия ночью отправили Павла и Силу в Верию, но Фессалоникийские Иудеи пришли и туда возмущать народ. Пока Павел был в городе, церковь в Филиппах не раз посылала ему помощь. Из Афин Павел послал Тимофея утвердить церковь и писал ей; Первое послание к Фессалоникийцам обычно считают самым ранним из его посланий, а авторство Второго оспаривается. Позже Аристарх и Секунд из Фессалоники сопровождали Павла, а Димас оставил его и ушёл туда."
    - "Около 300 г. н. э. император Галерий сделал Фессалонику своей резиденцией и построил дворец, триумфальную арку и большой круглый зал, позднее известный как Ротонда. Предание чтит Димитрия как мученика того времени; позднее в его честь была построена большая церковь. В 380 г. Феодосий I крестился здесь во время болезни и отсюда издал закон, обязавший его подданных держаться никейской веры. В 390 г., после мятежа, в котором был убит военачальник Бутерих, войска императора устроили в городе резню; по словам Феодорита, погибло семь тысяч человек, и Амвросий Медиоланский заставил Феодосия принести публичное покаяние."
  uk:
    - "Солунь, нинішні Фессалоніки, стоять у верхів’ї Термейської затоки в Македонії, де шляхи з балканської глибинки виходять до моря. Близько 315 р. до н. е. Кассандр, який тоді правив Македонією, заснував їх, зібравши в одне місто мешканців близько двадцяти шести малих містечок навколо затоки, і назвав на честь своєї дружини Фессалоніки, доньки Пилипа II. Страбон каже, що місце раніше називалося Терма."
    - "Після того як Рим переміг останнього македонського царя Персея 168 р. до н. е. і 146 р. до н. е. зробив Македонію провінцією, Солунь стали резиденцією її намісників і станцією на Егнатієвій дорозі, римському шляху через Балкани. Пліній називає їх вільним містом. Вони зберігали власних магістратів, яких написи називають політархами — титул, що Дії дають «городській старшині»."
    - "Павло й Сила прийшли сюди з Філіпп і три суботи розмовляли в синагозі; увірували деякі юдеї, велике множество побожних еллінів і немало значних жінок. Їхні противники зібрали натовп, напали на дім Ясона й поволокли його до правителів, гукаючи, що «Ті, що заколотили вселенну, і сюди поприходили»; брати вночі відправили Павла й Силу у Верію, куди пішли за ними юдеї з Солуня підбурювати народ. Поки Павло був у місті, церква у Філіппах не раз надсилала йому допомогу. З Афін Павло послав Тимофія назад зміцнити церкву й написав їй листа; Перше послання до солунян зазвичай вважають найдавнішим із його листів, тоді як авторство Другого оспорюється. Аристарх і Секунд із Солуня згодом подорожували з Павлом, а Димас залишив його, щоб піти туди."
    - "Близько 300 року н. е. імператор Галерій зробив Солунь своєю резиденцією й збудував палац, тріумфальну арку та велику круглу залу, пізніше відому як Ротонда. Переказ шанує Димитрія як мученика цього часу, і на його ім’я згодом збудували велику церкву. У 380 році Феодосій I охрестився тут під час хвороби й звідси видав закон, що зобов’язував його підданих до нікейської віри. У 390 році, після бунту, в якому вбили воєначальника Бутериха, війська імператора вчинили різанину серед городян; Феодорит повідомляє, що загинуло сім тисяч, а Амвросій Медіоланський змусив Феодосія до публічного покаяння."
  es:
    - "Tesalónica, la actual Salónica, se alza en el fondo del golfo Termaico, en Macedonia, donde las rutas del interior balcánico llegan al mar. Hacia 315 a. C. Casandro, que entonces gobernaba Macedonia, la fundó reuniendo en una sola ciudad a la población de unas veintiséis pequeñas localidades de alrededor del golfo, y la llamó así por su esposa Tesalónice, hija de Filipo II. Estrabón dice que el lugar se había llamado antes Terma."
    - "Después de que Roma derrotó al último rey macedonio, Perseo, en 168 a. C. y convirtió Macedonia en provincia en 146 a. C., Tesalónica pasó a ser sede de sus gobernadores y una estación de la vía Egnatia, la calzada romana que cruzaba los Balcanes. Plinio la llama ciudad libre. Conservó sus propios magistrados, a quienes las inscripciones llaman politarcas, el título que los Hechos dan a los «gobernadores de la ciudad»."
    - "Pablo y Silas llegaron aquí desde Filipos y durante tres sábados disputaron en la sinagoga; algunos judíos, una gran multitud de griegos temerosos de Dios y no pocas mujeres principales creyeron. Sus adversarios reunieron una multitud, atacaron la casa de Jasón y lo arrastraron ante los gobernantes, gritando que los que «alborotan el mundo, también han venido acá»; los hermanos enviaron de noche a Pablo y a Silas a Berea, adonde siguieron judíos de Tesalónica para agitar al pueblo. Mientras Pablo estaba en la ciudad, la iglesia de Filipos le envió ayuda más de una vez. Desde Atenas, Pablo envió a Timoteo de vuelta para fortalecer a la iglesia, y le escribió; se tiene habitualmente la Primera a los Tesalonicenses por la más antigua de sus cartas, mientras que la autoría de la Segunda se discute. Aristarco y Segundo de Tesalónica viajaron después con Pablo, y Demas lo dejó para ir allá."
    - "Hacia el 300 d. C. el emperador Galerio hizo de Tesalónica su residencia y construyó un palacio, un arco de triunfo y la gran sala circular conocida después como la Rotonda. La tradición honra a Demetrio como mártir de esta época, y más tarde se erigió una gran iglesia en su nombre. En 380 Teodosio I fue bautizado aquí durante una enfermedad y desde aquí promulgó la ley que obligaba a sus súbditos a la fe nicena. En 390, tras un motín en que murió el comandante Buterico, las tropas del emperador masacraron a los habitantes; Teodoreto cuenta que murieron siete mil, y Ambrosio de Milán obligó a Teodosio a hacer penitencia pública."
  pt:
    - "Tessalônica, a atual Salônica, fica na cabeceira do golfo Termaico, na Macedônia, onde as rotas do interior dos Bálcãs chegam ao mar. Por volta de 315 a.C., Cassandro, que então governava a Macedônia, a fundou reunindo numa só cidade o povo de cerca de vinte e seis pequenas cidades em torno do golfo, e a chamou assim por sua esposa Tessalonice, filha de Filipe II. Estrabão diz que o lugar antes se chamava Terma."
    - "Depois que Roma derrotou o último rei macedônio, Perseu, em 168 a.C. e fez da Macedônia província em 146 a.C., Tessalônica tornou-se sede de seus governadores e estação da Via Egnácia, a estrada romana através dos Bálcãs. Plínio a chama de cidade livre. Mantinha seus próprios magistrados, que as inscrições chamam politarcas, título que Atos dá às “autoridades da cidade”."
    - "Paulo e Silas vieram aqui de Filipos e por três sábados argumentaram na sinagoga; alguns judeus, uma grande multidão de gregos tementes a Deus e não poucas mulheres de destaque creram. Seus opositores juntaram uma multidão, atacaram a casa de Jasão e o arrastaram diante das autoridades, clamando que “Estes que têm virado o mundo de cabeça para baixo chegaram também aqui”; os irmãos mandaram Paulo e Silas de noite para Bereia, para onde judeus de Tessalônica os seguiram para agitar o povo. Enquanto Paulo estava na cidade, a igreja de Filipos lhe enviou ajuda mais de uma vez. De Atenas, Paulo enviou Timóteo de volta para fortalecer a igreja, e lhe escreveu; 1 Tessalonicenses é geralmente tida como a mais antiga de suas cartas, e a autoria de 2 Tessalonicenses é discutida. Aristarco e Segundo, de Tessalônica, viajaram depois com Paulo, e Demas o deixou para ir para lá."
    - "Por volta de 300 d.C., o imperador Galério fez de Tessalônica sua residência e construiu um palácio, um arco triunfal e o grande salão circular depois conhecido como Rotunda. A tradição honra Demétrio como mártir dessa época, e uma grande igreja foi depois construída em seu nome. Em 380, Teodósio I foi batizado aqui durante uma doença e daqui promulgou a lei que obrigava seus súditos à fé nicena. Em 390, após um tumulto em que foi morto o comandante Buterico, as tropas do imperador massacraram os habitantes; Teodoreto relata que morreram sete mil, e Ambrósio de Milão fez Teodósio cumprir penitência pública."
  de:
    - "Thessalonich, das heutige Thessaloniki, liegt am Kopf des Thermaischen Golfs in Mazedonien, wo die Wege aus dem Inneren des Balkans das Meer erreichen. Um 315 v. Chr. gründete Kassander, der damals über Mazedonien herrschte, es, indem er die Bewohner von etwa sechsundzwanzig kleinen Städten rings um den Golf in einer Stadt versammelte, und benannte es nach seiner Frau Thessalonike, einer Tochter Philipps II. Strabon sagt, der Ort habe früher Therma geheißen."
    - "Nachdem Rom 168 v. Chr. den letzten mazedonischen König Perseus besiegt und Mazedonien 146 v. Chr. zur Provinz gemacht hatte, wurde Thessalonich Sitz der Statthalter und Station an der Via Egnatia, der römischen Straße durch den Balkan. Plinius nennt es eine freie Stadt. Es behielt seine eigenen Beamten, die Inschriften Politarchen nennen, den Titel, den die Apostelgeschichte den „Obersten der Stadt“ gibt."
    - "Paulus und Silas kamen von Philippi hierher und redeten drei Sabbate in der Synagoge; einige Juden, eine große Menge gottesfürchtiger Griechen und nicht wenige vornehme Frauen glaubten. Gegner sammelten eine Menge, griffen Jasons Haus an und schleiften ihn vor die Obersten der Stadt mit dem Geschrei: „Diese, die den ganzen Weltkreis erregen, sind auch hergekommen“; die Brüder schickten Paulus und Silas bei Nacht nach Beröa, wohin Juden aus Thessalonich folgten, um das Volk aufzuhetzen. Während Paulus dort war, sandte ihm die Gemeinde von Philippi mehrfach Hilfe. Von Athen schickte Paulus Timotheus zur Stärkung der Gemeinde zurück und schrieb ihr; der Erste Thessalonicherbrief gilt meist als sein frühester Brief, die Verfasserschaft des Zweiten ist umstritten. Aristarch und Sekundus aus Thessalonich reisten später mit Paulus, und Demas verließ ihn, um dorthin zu gehen."
    - "Um 300 n. Chr. machte Kaiser Galerius Thessalonich zu seiner Residenz und baute einen Palast, einen Triumphbogen und die große Rundhalle, später als Rotunde bekannt. Die Überlieferung ehrt Demetrius als Märtyrer dieser Zeit, und später wurde auf seinen Namen eine große Kirche gebaut. 380 wurde Theodosius I. hier während einer Krankheit getauft und erließ von hier das Gesetz, das seine Untertanen an den nicänischen Glauben band. 390 massakrierten die Truppen des Kaisers nach einem Aufruhr, bei dem der Befehlshaber Butherich getötet wurde, die Bewohner; Theodoret berichtet, siebentausend seien gestorben, und Ambrosius von Mailand ließ Theodosius öffentlich Buße tun."
  fr:
    - "Thessalonique, aujourd’hui Thessaloníki, se dresse au fond du golfe Thermaïque, en Macédoine, là où les routes de l’intérieur des Balkans rejoignent la mer. Vers 315 av. J.-C., Cassandre, qui gouvernait alors la Macédoine, la fonda en réunissant en une seule ville les habitants d’une vingtaine de petites villes autour du golfe, et la nomma d’après sa femme Thessalonicé, fille de Philippe II. Strabon dit que le lieu s’était appelé auparavant Therma."
    - "Après que Rome eut vaincu le dernier roi macédonien, Persée, en 168 av. J.-C., et fait de la Macédoine une province en 146 av. J.-C., Thessalonique devint le siège de ses gouverneurs et une étape de la Via Egnatia, la route romaine à travers les Balkans. Pline l’appelle ville libre. Elle garda ses propres magistrats, que les inscriptions appellent politarques, titre que les Actes donnent aux « magistrats de la ville »."
    - "Paul et Silas, venus de Philippes, discutèrent trois sabbats à la synagogue ; quelques Juifs, une grande multitude de Grecs craignant Dieu et beaucoup de femmes de qualité crurent. Leurs adversaires ameutèrent la foule, assaillirent la maison de Jason et le traînèrent devant les magistrats en criant que ceux « qui ont bouleversé le monde, sont aussi venus ici » ; les frères firent partir Paul et Silas de nuit pour Bérée, où des Juifs de Thessalonique vinrent agiter le peuple. Pendant le séjour de Paul, l’Église de Philippes lui envoya de l’aide à plusieurs reprises. D’Athènes, Paul renvoya Timothée affermir l’Église, et il lui écrivit ; 1 Thessaloniciens passe d’ordinaire pour la plus ancienne de ses lettres, l’authenticité de 2 Thessaloniciens étant discutée. Aristarque et Second de Thessalonique voyagèrent plus tard avec Paul, et Démas le quitta pour s’y rendre."
    - "Vers 300 apr. J.-C., l’empereur Galère fit de Thessalonique sa résidence et y bâtit un palais, un arc de triomphe et la grande salle ronde connue plus tard sous le nom de Rotonde. La tradition honore Démétrius comme martyr de cette époque, et une grande église fut plus tard bâtie en son nom. En 380, Théodose Ier y fut baptisé pendant une maladie et y promulgua la loi qui liait ses sujets à la foi de Nicée. En 390, après une émeute où le commandant Butheric fut tué, les troupes de l’empereur massacrèrent la population ; Théodoret rapporte que sept mille personnes périrent, et Ambroise de Milan fit faire à Théodose une pénitence publique."
  pl:
    - "Tesalonika, dzisiejsze Saloniki, leży w głębi Zatoki Termajskiej w Macedonii, gdzie drogi z wnętrza Bałkanów dochodzą do morza. Około 315 roku p.n.e. Kassander, który władał wówczas Macedonią, założył ją, łącząc w jedno miasto mieszkańców około dwudziestu sześciu małych miast wokół zatoki, i nazwał ją od swojej żony Tesaloniki, córki Filipa II. Strabon mówi, że miejsce to nazywało się wcześniej Terma."
    - "Gdy Rzym pokonał ostatniego króla Macedonii, Perseusza, w 168 roku p.n.e. i w 146 roku p.n.e. uczynił Macedonię prowincją, Tesalonika stała się siedzibą jej namiestników i stacją na Via Egnatia, rzymskiej drodze przez Bałkany. Pliniusz nazywa ją miastem wolnym. Zachowała własnych urzędników, których inskrypcje nazywają politarchami; Dzieje Apostolskie mówią o nich, że do „przełożonych miasta” ciągnięto Jazona."
    - "Paweł i Sylas przybyli tu z Filippi i przez trzy szabaty rozprawiali w synagodze; uwierzyli niektórzy Żydzi, wielkie mnóstwo bojących się Boga Greków i niemało przedniejszych kobiet. Ich przeciwnicy zebrali tłum, napadli na dom Jazona i wywlekli go przed władze, wołając: „Oto ci, którzy wszystek świat wzruszyli i tu też przyszli”; bracia wysłali Pawła i Sylasa nocą do Berei, dokąd pospieszyli Żydzi z Tesaloniki, by podburzyć lud. Gdy Paweł był w mieście, kościół w Filippi słał mu pomoc nie raz. Z Aten Paweł posłał Tymoteusza z powrotem, by umocnił kościół, i napisał do tego kościoła list; Pierwszy List do Tesaloniczan uchodzi zwykle za najwcześniejszy z jego listów, podczas gdy autorstwo Drugiego jest sporne. Arystarch i Sekundus z Tesaloniki podróżowali później z Pawłem, a Demas opuścił go, by tam pójść."
    - "Około 300 roku n.e. cesarz Galeriusz uczynił Tesalonikę swoją rezydencją i zbudował pałac, łuk triumfalny i wielką okrągłą salę, później zwaną Rotundą. Tradycja czci Demetriusza jako męczennika z tego czasu, a później wzniesiono pod jego wezwaniem wielki kościół. W 380 roku Teodozjusz I został tu ochrzczony podczas choroby i stąd wydał ustawę zobowiązującą jego poddanych do wiary nicejskiej. W 390 roku, po zamieszkach, w których zginął dowódca Butheryk, wojska cesarza dokonały masakry mieszkańców; Teodoret podaje, że zginęło siedem tysięcy, a Ambroży z Mediolanu zmusił Teodozjusza do publicznej pokuty."
  it:
    - "Tessalonica, l’odierna Salonicco, sorge in fondo al golfo Termaico in Macedonia, dove le vie dell’interno balcanico raggiungono il mare. Verso il 315 a.C. Cassandro, che allora governava la Macedonia, la fondò riunendo in un’unica città gli abitanti di circa ventisei piccoli centri attorno al golfo, e la chiamò come sua moglie Tessalonice, figlia di Filippo II. Strabone dice che il luogo si era chiamato in precedenza Terme."
    - "Dopo che Roma sconfisse l’ultimo re macedone, Perseo, nel 168 a.C. e fece della Macedonia una provincia nel 146 a.C., Tessalonica divenne la sede dei suoi governatori e una tappa della Via Egnazia, la strada romana attraverso i Balcani. Plinio la chiama città libera. Conservò propri magistrati, che le iscrizioni chiamano politarchi, il titolo che gli Atti danno ai «magistrati della città»."
    - "Paolo e Sila vi giunsero da Filippi e per tre sabati discussero nella sinagoga; alcuni Giudei, una gran moltitudine di Greci pii e non poche donne principali credettero. I loro avversari raccolsero una turba, assalirono la casa di Giasone e lo trascinarono davanti ai magistrati, gridando che «costoro che hanno messo sossopra il mondo, son venuti anche qua»; i fratelli fecero partire di notte Paolo e Sila per Berea, dove i Giudei di Tessalonica li seguirono per agitare il popolo. Mentre Paolo era in città, la chiesa di Filippi gli mandò più volte aiuti. Da Atene Paolo rimandò Timoteo a confermare la chiesa, e le scrisse; la Prima lettera ai Tessalonicesi è di solito ritenuta la più antica delle sue lettere, mentre la paternità della Seconda è discussa. Aristarco e Secondo di Tessalonica viaggiarono poi con Paolo, e Dema lo lasciò per andarvi."
    - "Verso il 300 d.C. l’imperatore Galerio fece di Tessalonica la sua residenza e vi costruì un palazzo, un arco trionfale e la grande sala circolare poi nota come Rotonda. La tradizione onora Demetrio come martire di questo tempo, e in seguito fu costruita a suo nome una grande chiesa. Nel 380 Teodosio I fu battezzato qui durante una malattia e di qui emanò la legge che vincolava i sudditi alla fede nicena. Nel 390, dopo una sommossa in cui fu ucciso il comandante Boterico, le truppe dell’imperatore massacrarono la popolazione; Teodoreto riferisce che morirono settemila persone, e Ambrogio di Milano costrinse Teodosio alla penitenza pubblica."
  nl:
    - "Tessalonica, het huidige Thessaloniki, ligt aan het binnenste uiteinde van de Thermaïsche Golf in Macedonië, waar de wegen uit het Balkanse binnenland de zee bereiken. Omstreeks 315 v.Chr. stichtte Kassander, die toen over Macedonië heerste, de stad door de bewoners van zo’n zesentwintig kleine steden rond de golf in één stad samen te brengen, en noemde haar naar zijn vrouw Thessalonike, een dochter van Filippus II. Strabo zegt dat de plaats eerder Therma werd genoemd."
    - "Nadat Rome in 168 v.Chr. de laatste Macedonische koning, Perseus, had verslagen en Macedonië in 146 v.Chr. tot provincie had gemaakt, werd Tessalonica de zetel van zijn gouverneurs en een station aan de Via Egnatia, de Romeinse weg over de Balkan. Plinius noemt het een vrije stad. Het behield zijn eigen magistraten, die in opschriften politarchen heten, de titel die Handelingen aan “de oversten der stad” geeft."
    - "Paulus en Silas kwamen hier vanuit Filippi en redeneerden drie sabbatten lang in de synagoge; sommige Joden, een grote menigte godsdienstige Grieken en niet weinige vooraanstaande vrouwen geloofden. Hun tegenstanders brachten een menigte bijeen, vielen het huis van Jason aan en sleepten hem voor de oversten, roepend dat zij “die de wereld in roer hebben gesteld, zijn ook hier gekomen”; de broeders stuurden Paulus en Silas bij nacht naar Berea, waar Joden uit Tessalonica volgden om het volk op te hitsen. Tijdens Paulus’ verblijf zond de gemeente van Filippi hem meer dan eens hulp. Vanuit Athene stuurde hij Timoteüs om de gemeente te versterken, en schreef haar; 1 Tessalonicenzen geldt als zijn vroegste brief, het auteurschap van 2 Tessalonicenzen wordt betwist. Aristarchus en Secundus uit Tessalonica reisden later met Paulus, en Demas verliet hem om daarheen te gaan."
    - "Omstreeks 300 n.Chr. maakte keizer Galerius Tessalonica tot zijn residentie en liet er een paleis, een triomfboog en de grote ronde zaal bouwen die later als de Rotunda bekend werd. De overlevering eert Demetrius als martelaar uit die tijd, en later werd een grote kerk op zijn naam gebouwd. In 380 werd Theodosius I hier tijdens een ziekte gedoopt en vaardigde hij van hieruit de wet uit die zijn onderdanen aan het geloof van Nicea bond. In 390, na een oproer waarin de bevelhebber Butherik werd gedood, richtten de troepen van de keizer een bloedbad aan onder de stadsbewoners; Theodoretus meldt dat zevenduizend stierven, en Ambrosius van Milaan liet Theodosius openbare boete doen."
  cs:
    - "Tesalonika, dnešní Soluň, leží na nejzazším konci Thermajského zálivu v Makedonii, kde se cesty z balkánského vnitrozemí setkávají s mořem. Kolem roku 315 př. n. l. ji založil Kassandros, který tehdy vládl Makedonii, shromážděním obyvatel asi dvaceti šesti malých měst kolem zálivu do jednoho města a pojmenoval ji po své ženě Thessalonike, dceři Filipa II. Strabón říká, že místo se dříve nazývalo Therma."
    - "Poté, co Řím porazil posledního makedonského krále Persea roku 168 př. n. l. a roku 146 př. n. l. učinil z Makedonie provincii, se Tesalonika stala sídlem jejích místodržitelů a stanicí na Via Egnatia, římské silnici přes Balkán. Plinius ji nazývá svobodným městem. Zachovala si vlastní úředníky, které nápisy nazývají politarchy, titul, který Skutky vyjadřují slovy „starší města“."
    - "Pavel a Silas sem přišli z Filip a po tři soboty v synagoze rozmlouvali; někteří Židé, veliké množství bohabojných Řeků a nemálo předních žen uvěřilo. Jejich protivníci shromáždili dav, napadli dům Jasónův a vlekli ho před představené, křičíce, že „tito, kteříž všecken svět bouří, ti sem také přišli“; bratři poslali Pavla a Silu v noci do Beroie, kam za nimi přišli Židé z Tesaloniky, aby pobouřili lid. Dokud byl Pavel ve městě, církev ve Filipech mu víc než jednou poslala pomoc. Z Atén poslal Pavel Timotea zpět, aby církev utvrdil, a napsal jí; První list Tesalonickým je obvykle pokládán za nejstarší z jeho listů, zatímco autorství Druhého listu Tesalonickým je sporné. Aristarchos a Sekundos z Tesaloniky později cestovali s Pavlem a Démas ho opustil, aby tam šel."
    - "Kolem roku 300 n. l. učinil císař Galerius z Tesaloniky své sídlo a postavil palác, vítězný oblouk a velký kruhový sál později známý jako Rotunda. Tradice ctí Démétria jako mučedníka této doby a velký kostel byl později postaven na jeho jméno. V roce 380 byl Theodosius I. zde během nemoci pokřtěn a odtud vydal zákon, který zavázal jeho poddané k nicejské víře. V roce 390, po nepokojích, při nichž byl zabit velitel Butherich, vojáci císaře povraždili obyvatele města; Theodóretos uvádí, že zemřelo sedm tisíc, a Ambrož Milánský přiměl Theodosia k veřejnému pokání."
  sv:
    - "Tessalonike, i dag Thessaloniki, ligger vid inre änden av Thermaiska viken i Makedonien, där vägarna från Balkans inland når havet. Omkring 315 f.Kr. grundade Kassandros, som då regerade Makedonien, staden genom att samla invånarna från omkring tjugosex små städer kring viken i en enda, och uppkallade den efter sin hustru Thessalonike, en dotter till Filippos II. Strabon säger att platsen tidigare hade kallats Therma."
    - "Sedan Rom 168 f.Kr. hade besegrat den siste makedonske kungen, Perseus, och 146 f.Kr. gjort Makedonien till provins, blev Tessalonike säte för dess ståthållare och en station på Via Egnatia, den romerska vägen över Balkan. Plinius kallar det en fri stad. Det behöll sina egna ämbetsmän, som inskrifter kallar politarker, den titel Apostlagärningarna ger ”stadens styresmän”."
    - "Paulus och Silas kom hit från Filippi och samtalade tre sabbater i synagogan; några judar, en stor skara gudfruktiga greker och inte få ledande kvinnor kom till tro. Motståndarna samlade en folkhop, angrep Jasons hus och släpade honom inför styresmännen och ropade: ”Dessa män, som hava uppviglat hela världen, hava nu också kommit hit”; bröderna sände Paulus och Silas bort om natten till Beroia, dit judar från Tessalonike följde efter för att egga upp folket. Medan Paulus var i staden sände församlingen i Filippi honom hjälp flera gånger. Från Aten sände Paulus Timoteus tillbaka för att styrka församlingen, och han skrev till den; Första Thessalonikerbrevet anses vanligen vara det tidigaste av hans brev, medan Andra Thessalonikerbrevets författare är omstridd. Aristarchos och Secundus från Tessalonike reste senare med Paulus, och Demas lämnade honom för att fara dit."
    - "Omkring 300 e.Kr. gjorde kejsar Galerius Tessalonike till sitt residens och lät bygga ett palats, en triumfbåge och den stora runda hallen som senare kallades Rotundan. Traditionen hedrar Demetrios som martyr från denna tid, och en stor kyrka byggdes senare i hans namn. År 380 döptes Theodosius I här under en sjukdom och utfärdade härifrån lagen som band hans undersåtar vid den nicenska tron. År 390, efter ett upplopp där befälhavaren Butherik dödades, massakrerade kejsarens trupper stadens invånare; Theodoretos uppger att sju tusen dog, och Ambrosius av Milano lät Theodosius göra offentlig bot."
