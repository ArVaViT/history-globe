# Overview article (ADR 0007). Mainstream facts only; the exact spot is unknown and the shrines are given as tradition; the dating of the olive trees is given as one study's result.
id: gethsemane
place: a42418f
title:
  en: "Gethsemane"
  ru: "Гефсимания"
  uk: "Гетсиманія"
  es: "Getsemaní"
  pt: "Getsêmani"
  de: "Gethsemane"
  fr: "Gethsémané"
body:
  en:
    - "Gethsemane is the place on the Mount of Olives where Jesus prayed on the night of his arrest. The name is usually explained as Aramaic for “oil press”. Only Matthew and Mark name it: “Then cometh Jesus with them unto a place called Gethsemane, and saith unto the disciples, Sit ye here, while I go and pray yonder.” Luke says only that he went “as he was wont, to the mount of Olives”, and John that he crossed “the brook Cedron, where was a garden”, a place Judas knew, “for Jesus ofttimes resorted thither with his disciples”. There Jesus prayed in anguish and there he was taken."
    - "The Gospels give no more than this, and the exact spot is not known. By the fourth century Christians prayed at the foot of the Mount of Olives across the Kidron from the Temple Mount: Eusebius places Gethsemane there, and the pilgrim Egeria describes a church on the site of the prayer. Today the Church of All Nations, built in 1919–1924 over the remains of a Byzantine church, stands beside a garden of old olive trees kept by the Franciscans; a study of 2015 dated three of the eight to the twelfth century. Nearby are the Grotto of Gethsemane and the Tomb of Mary, also shown by tradition."
  ru:
    - "Гефсимания — место на горе Елеонской, где Иисус молился в ночь, когда Его взяли. Имя обычно объясняют как арамейское «масличный пресс». Называют его только Матфей и Марк: «Потом приходит с ними Иисус на место, называемое Гефсимания, и говорит ученикам: посидите тут, пока Я пойду помолюсь там». Лука говорит лишь, что Он «пошел по обыкновению на гору Елеонскую», а Иоанн — что Он вышел «за поток Кедрон, где был сад», место, которое знал и Иуда, «потому что Иисус часто собирался там с учениками Своими». Там Иисус молился в смертельной скорби, и там Его взяли."
    - "Больше Евангелия не говорят, и точное место неизвестно. К IV веку христиане молились у подножия горы Елеонской, через Кедрон от Храмовой горы: Евсевий помещает Гефсиманию там, а паломница Эгерия описывает церковь на месте молитвы. Сегодня здесь стоит церковь Всех Наций, построенная в 1919–1924 годах на остатках византийской церкви, рядом с садом старых олив, который хранят францисканцы; исследование 2015 года датировало три из восьми XII веком. Поблизости — Гефсиманский грот и гробница Богородицы, также показываемые по преданию."
  uk:
    - "Гетсиманія — місце на Оливковій горі, де Ісус молився в ніч свого арешту. Назву зазвичай пояснюють як арамейське «олійниця». Лише Матвій і Марк називають її: «Тодї приходить з ними Ісус на врочище Гетсиман, і рече до учеників: Сидїть тут, поки, пійшовши, помолюсь оттам». Лука говорить лише, що Він пішов «по звичаю на гору Оливну», а Іван — що Він перейшов «потік Кедрон, де був сад», місце, яке знав Юда, «бо почасту збирались там Ісус і ученики Його». Там Ісус молився в тузі й там Його взяли."
    - "Євангелія не дають більше нічого, і точне місце невідоме. До IV ст. християни молилися біля підніжжя Оливкової гори навпроти Храмової гори, по той бік Кедрону: Євсевій розміщує Гетсиманію саме там, а прочанка Егерія описує церкву на місці молитви. Сьогодні Церква всіх народів, збудована 1919–1924 років над рештками візантійської церкви, стоїть поряд із садом старих оливкових дерев, який доглядають францисканці; дослідження 2015 року датувало три з восьми дерев XII ст. Поблизу — Гетсиманська печера та Гробниця Марії, які теж показує традиція."
  es:
    - "Getsemaní es el lugar del monte de los Olivos donde Jesús oró la noche de su arresto. El nombre se explica de ordinario como arameo para «prensa de aceite». Solo Mateo y Marcos lo nombran: «Entonces llegó Jesús con ellos á la aldea que se llama Gethsemaní, y dice á sus discípulos: Sentaos aquí, hasta que vaya allí y ore». Lucas dice solo que fue «como solía, al monte de las Olivas», y Juan que cruzó «el arroyo de Cedrón, donde estaba un huerto», lugar que Judas conocía, «porque muchas veces Jesús se juntaba allí con sus discípulos». Allí oró Jesús en angustia y allí fue apresado."
    - "Los Evangelios no dan más que esto, y el lugar exacto no se conoce. En el siglo IV los cristianos oraban al pie del monte de los Olivos, al otro lado del Cedrón desde el monte del Templo: Eusebio sitúa allí Getsemaní, y la peregrina Egeria describe una iglesia en el lugar de la oración. Hoy la Iglesia de Todas las Naciones, construida en 1919–1924 sobre los restos de una iglesia bizantina, se alza junto a un huerto de viejos olivos cuidado por los franciscanos; un estudio de 2015 fechó tres de los ocho en el siglo XII. Cerca están la Gruta de Getsemaní y la Tumba de María, que también muestra la tradición."
  pt:
    - "Getsêmani é o lugar no monte das Oliveiras onde Jesus orou na noite de sua prisão. O nome costuma ser explicado como aramaico para “lagar de azeite”. Só Mateus e Marcos o nomeiam: “Então Jesus foi com eles a um lugar chamado Getsêmani, e disse aos seus discípulos: ‘Sentem-se aqui, enquanto eu vou ali orar.’” Lucas diz apenas que ele foi “como era o seu costume, para o Monte das Oliveiras”, e João que atravessou o “ribeiro de Cedrom, onde havia um jardim”, lugar que Judas conhecia, “porque Jesus frequentemente se reunia ali com os seus discípulos”. Ali Jesus orou em angústia e ali foi preso."
    - "Os Evangelhos não dão mais do que isso, e o lugar exato não é conhecido. No século IV os cristãos oravam ao pé do monte das Oliveiras, do outro lado do Cedrom em relação ao monte do Templo: Eusébio situa ali Getsêmani, e a peregrina Egéria descreve uma igreja no local da oração. Hoje a Igreja de Todas as Nações, construída em 1919–1924 sobre os restos de uma igreja bizantina, ergue-se junto a um jardim de velhas oliveiras cuidado pelos franciscanos; um estudo de 2015 datou três das oito do século XII. Perto ficam a Gruta de Getsêmani e o Túmulo de Maria, também indicados pela tradição."
  de:
    - "Gethsemane ist der Ort am Ölberg, an dem Jesus in der Nacht seiner Verhaftung betete. Der Name wird gewöhnlich als aramäisch für „Ölpresse“ erklärt. Nur Matthäus und Markus nennen ihn: „Da kam Jesus mit ihnen zu einem Hofe, der hieß Gethsemane, und sprach zu seinen Jüngern: Setzet euch hier, bis daß ich dorthin gehe und bete.“ Lukas sagt nur, er sei „nach seiner Gewohnheit an den Ölberg“ gegangen, und Johannes, er sei „über den Bach Kidron“ gezogen; „da war ein Garten“, ein Ort, den Judas kannte, „denn Jesus versammelte sich oft daselbst mit seinen Jüngern“. Dort betete Jesus in Todesangst, und dort wurde er ergriffen."
    - "Die Evangelien geben nicht mehr her, und die genaue Stelle ist unbekannt. Im 4. Jahrhundert beteten Christen am Fuß des Ölbergs jenseits des Kidron vom Tempelberg aus: Eusebius setzt Gethsemane dorthin, und die Pilgerin Egeria beschreibt eine Kirche an der Stelle des Gebets. Heute steht die Kirche aller Nationen, 1919–1924 über den Resten einer byzantinischen Kirche erbaut, neben einem Garten alter Ölbäume, den die Franziskaner pflegen; eine Untersuchung von 2015 datierte drei der acht ins 12. Jahrhundert. In der Nähe liegen die Grotte von Gethsemane und das Grab Marias, die ebenfalls durch die Überlieferung gezeigt werden."
  fr:
    - "Gethsémané est le lieu du mont des Oliviers où Jésus pria la nuit de son arrestation. On explique d’ordinaire le nom comme de l’araméen pour « pressoir à huile ». Seuls Matthieu et Marc le nomment : « Jésus alla avec eux dans un lieu appelé Gethsémané, et il dit aux disciples : Asseyez-vous ici, pendant que je m’éloignerai pour prier. » Luc dit seulement qu’il alla « selon sa coutume, à la montagne des oliviers », et Jean qu’il passa « de l’autre côté du torrent du Cédron, où se trouvait un jardin », lieu que Judas connaissait, « parce que Jésus et ses disciples s’y étaient souvent réunis ». Là Jésus pria dans l’angoisse et là il fut arrêté."
    - "Les Évangiles n’en disent pas plus, et l’emplacement exact est inconnu. Dès le IVe siècle, les chrétiens priaient au pied du mont des Oliviers, de l’autre côté du Cédron par rapport au mont du Temple : Eusèbe y place Gethsémané, et la pèlerine Égérie décrit une église sur le lieu de la prière. Aujourd’hui, l’église de toutes les Nations, bâtie en 1919–1924 sur les restes d’une église byzantine, se dresse près d’un jardin de vieux oliviers entretenu par les franciscains ; une étude de 2015 a daté trois des huit du XIIe siècle. Tout près se trouvent la grotte de Gethsémané et le tombeau de Marie, également montrés par la tradition."
