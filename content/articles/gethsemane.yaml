body:
  en:
    - "Gethsemane is the place on the Mount of Olives where Jesus prayed on the night of his arrest. The name is usually explained as Aramaic for “oil press”. Only Matthew and Mark name it: “Then cometh Jesus with them unto a place called Gethsemane, and saith unto the disciples, Sit ye here, while I go and pray yonder.” Luke says only that he went “as he was wont, to the mount of Olives”, and John that he crossed “the brook Cedron, where was a garden”, a place Judas knew, “for Jesus ofttimes resorted thither with his disciples”. There Jesus prayed in anguish and there he was taken."
    - "The Gospels give no more than this, and the exact spot is not known. By the fourth century Christians prayed at the foot of the Mount of Olives across the Kidron from the Temple Mount: Eusebius places Gethsemane at the Mount of Olives, where the faithful came to pray, and the pilgrim Egeria describes a church on the site of the prayer. Today the Church of All Nations, built in 1919–1924 over the remains of a Byzantine church, stands beside a garden of old olive trees kept by the Franciscans; a study of 2015 dated three of the eight to the twelfth century. Nearby are the Grotto of Gethsemane and the Tomb of Mary, also shown by tradition."
  ru:
    - "Гефсимания — место на горе Елеонской, где Иисус молился в ночь, когда Его взяли. Имя обычно объясняют как арамейское «масличный пресс». Называют его только Матфей и Марк: «Потом приходит с ними Иисус на место, называемое Гефсимания, и говорит ученикам: посидите тут, пока Я пойду помолюсь там». Лука говорит лишь, что Он «пошел по обыкновению на гору Елеонскую», а Иоанн — что Он вышел «за поток Кедрон, где был сад», место, которое знал и Иуда, «потому что Иисус часто собирался там с учениками Своими». Там Иисус молился в смертельной скорби, и там Его взяли."
    - "Больше Евангелия не говорят, и точное место неизвестно. К IV веку христиане молились у подножия горы Елеонской, через Кедрон от Храмовой горы: Евсевий помещает Гефсиманию у горы Елеонской, куда верные приходили молиться, а паломница Эгерия описывает церковь на месте молитвы. Сегодня здесь стоит церковь Всех Наций, построенная в 1919–1924 годах на остатках византийской церкви, рядом с садом старых олив, который хранят францисканцы; исследование 2015 года датировало три из восьми XII веком. Поблизости — Гефсиманский грот и гробница Богородицы, также показываемые по преданию."
  uk:
    - "Гетсиманія — місце на Оливковій горі, де Ісус молився в ніч свого арешту. Назву зазвичай пояснюють як арамейське «олійниця». Лише Матвій і Марк називають її: «Тодї приходить з ними Ісус на врочище Гетсиман, і рече до учеників: Сидїть тут, поки, пійшовши, помолюсь оттам». Лука говорить лише, що Він пішов «по звичаю на гору Оливну», а Іван — що Він перейшов «потік Кедрон, де був сад», місце, яке знав Юда, «бо почасту збирались там Ісус і ученики Його». Там Ісус молився в тузі й там Його взяли."
    - "Євангелія не дають більше нічого, і точне місце невідоме. До IV ст. християни молилися біля підніжжя Оливкової гори навпроти Храмової гори, по той бік Кедрону: Євсевій розміщує Гетсиманію біля Оливкової гори, куди вірні приходили молитися, а прочанка Егерія описує церкву на місці молитви. Сьогодні Церква всіх народів, збудована 1919–1924 років над рештками візантійської церкви, стоїть поряд із садом старих оливкових дерев, який доглядають францисканці; дослідження 2015 року датувало три з восьми дерев XII ст. Поблизу — Гетсиманська печера та Гробниця Марії, які теж показує традиція."
  es:
    - "Getsemaní es el lugar del monte de los Olivos donde Jesús oró la noche de su arresto. El nombre se explica de ordinario como arameo para «prensa de aceite». Solo Mateo y Marcos lo nombran: «Entonces llegó Jesús con ellos á la aldea que se llama Gethsemaní, y dice á sus discípulos: Sentaos aquí, hasta que vaya allí y ore». Lucas dice solo que fue «como solía, al monte de las Olivas», y Juan que cruzó «el arroyo de Cedrón, donde estaba un huerto», lugar que Judas conocía, «porque muchas veces Jesús se juntaba allí con sus discípulos». Allí oró Jesús en angustia y allí fue apresado."
    - "Los Evangelios no dan más que esto, y el lugar exacto no se conoce. En el siglo IV los cristianos oraban al pie del monte de los Olivos, al otro lado del Cedrón desde el monte del Templo: Eusebio sitúa Getsemaní junto al monte de los Olivos, adonde los fieles acudían a orar, y la peregrina Egeria describe una iglesia en el lugar de la oración. Hoy la Iglesia de Todas las Naciones, construida en 1919–1924 sobre los restos de una iglesia bizantina, se alza junto a un huerto de viejos olivos cuidado por los franciscanos; un estudio de 2015 fechó tres de los ocho en el siglo XII. Cerca están la Gruta de Getsemaní y la Tumba de María, que también muestra la tradición."
  pt:
    - "Getsêmani é o lugar no monte das Oliveiras onde Jesus orou na noite de sua prisão. O nome costuma ser explicado como aramaico para “lagar de azeite”. Só Mateus e Marcos o nomeiam: “Então Jesus foi com eles a um lugar chamado Getsêmani, e disse aos seus discípulos: ‘Sentem-se aqui, enquanto eu vou ali orar.’” Lucas diz apenas que ele foi “como era o seu costume, para o Monte das Oliveiras”, e João que atravessou o “ribeiro de Cedrom, onde havia um jardim”, lugar que Judas conhecia, “porque Jesus frequentemente se reunia ali com os seus discípulos”. Ali Jesus orou em angústia e ali foi preso."
    - "Os Evangelhos não dão mais do que isso, e o lugar exato não é conhecido. No século IV os cristãos oravam ao pé do monte das Oliveiras, do outro lado do Cedrom em relação ao monte do Templo: Eusébio situa Getsêmani junto ao monte das Oliveiras, aonde os fiéis vinham orar, e a peregrina Egéria descreve uma igreja no local da oração. Hoje a Igreja de Todas as Nações, construída em 1919–1924 sobre os restos de uma igreja bizantina, ergue-se junto a um jardim de velhas oliveiras cuidado pelos franciscanos; um estudo de 2015 datou três das oito do século XII. Perto ficam a Gruta de Getsêmani e o Túmulo de Maria, também indicados pela tradição."
  de:
    - "Gethsemane ist der Ort am Ölberg, an dem Jesus in der Nacht seiner Verhaftung betete. Der Name wird gewöhnlich als aramäisch für „Ölpresse“ erklärt. Nur Matthäus und Markus nennen ihn: „Da kam Jesus mit ihnen zu einem Hofe, der hieß Gethsemane, und sprach zu seinen Jüngern: Setzet euch hier, bis daß ich dorthin gehe und bete.“ Lukas sagt nur, er sei „nach seiner Gewohnheit an den Ölberg“ gegangen, und Johannes, er sei „über den Bach Kidron“ gezogen; „da war ein Garten“, ein Ort, den Judas kannte, „denn Jesus versammelte sich oft daselbst mit seinen Jüngern“. Dort betete Jesus in Todesangst, und dort wurde er ergriffen."
    - "Die Evangelien geben nicht mehr her, und die genaue Stelle ist unbekannt. Im 4. Jahrhundert beteten Christen am Fuß des Ölbergs jenseits des Kidron vom Tempelberg aus: Eusebius setzt Gethsemane an den Ölberg, wohin die Gläubigen zum Beten kamen, und die Pilgerin Egeria beschreibt eine Kirche an der Stelle des Gebets. Heute steht die Kirche aller Nationen, 1919–1924 über den Resten einer byzantinischen Kirche erbaut, neben einem Garten alter Ölbäume, den die Franziskaner pflegen; eine Untersuchung von 2015 datierte drei der acht ins 12. Jahrhundert. In der Nähe liegen die Grotte von Gethsemane und das Grab Marias, die ebenfalls durch die Überlieferung gezeigt werden."
  fr:
    - "Gethsémané est le lieu du mont des Oliviers où Jésus pria la nuit de son arrestation. On explique d’ordinaire le nom comme de l’araméen pour « pressoir à huile ». Seuls Matthieu et Marc le nomment : « Jésus alla avec eux dans un lieu appelé Gethsémané, et il dit aux disciples : Asseyez-vous ici, pendant que je m’éloignerai pour prier. » Luc dit seulement qu’il alla « selon sa coutume, à la montagne des oliviers », et Jean qu’il passa « de l’autre côté du torrent du Cédron, où se trouvait un jardin », lieu que Judas connaissait, « parce que Jésus et ses disciples s’y étaient souvent réunis ». Là Jésus pria dans l’angoisse et là il fut arrêté."
    - "Les Évangiles n’en disent pas plus, et l’emplacement exact est inconnu. Dès le IVe siècle, les chrétiens priaient au pied du mont des Oliviers, de l’autre côté du Cédron par rapport au mont du Temple : Eusèbe place Gethsémané au mont des Oliviers, où les fidèles venaient prier, et la pèlerine Égérie décrit une église sur le lieu de la prière. Aujourd’hui, l’église de toutes les Nations, bâtie en 1919–1924 sur les restes d’une église byzantine, se dresse près d’un jardin de vieux oliviers entretenu par les franciscains ; une étude de 2015 a daté trois des huit du XIIe siècle. Tout près se trouvent la grotte de Gethsémané et le tombeau de Marie, également montrés par la tradition."
  pl:
    - "Getsemani to miejsce na Górze Oliwnej, gdzie Jezus modlił się w noc swojego pojmania. Nazwę tłumaczy się zwykle jako aramejskie „tłocznia oliwy”. Tylko Mateusz i Marek podają ją z nazwy: „Tedy przyszedł Jezus z nimi na miejsce, które zwano Gietsemane, i rzekł uczniom: Siądźcież tu, aż odszedłszy, będę się tam modlił”. Łukasz mówi tylko, że poszedł „według zwyczaju na górę Oliwną”, a Jan, że przeszedł „przez potok Cedron, gdzie był ogród”, miejsce, które znał Judasz, „bo się tam często schadzał Jezus z uczniami swoimi”. Tam Jezus modlił się w udręce i tam został pojmany."
    - "Ewangelie nie podają więcej, a dokładne miejsce nie jest znane. W IV w. chrześcijanie modlili się u stóp Góry Oliwnej, za Cedronem od Wzgórza Świątynnego: Euzebiusz umieszcza Getsemani przy Górze Oliwnej, dokąd wierni przychodzili się modlić, a pątniczka Egeria opisuje kościół w miejscu modlitwy. Dziś Kościół Wszystkich Narodów, zbudowany w latach 1919–1924 na szczątkach kościoła bizantyńskiego, stoi obok ogrodu starych oliwek, którym opiekują się franciszkanie; badanie z 2015 r. datowało trzy z ośmiu drzew na XII w. W pobliżu znajdują się Grota Getsemani i Grób Marii, również pokazywane przez tradycję."
  it:
    - "Getsemani è il luogo sul Monte degli Ulivi dove Gesù pregò la notte del suo arresto. Il nome è di solito spiegato come aramaico per «frantoio». Solo Matteo e Marco lo nominano: «Allora Gesù venne con loro in un podere detto Getsemani, e disse ai discepoli: Sedete qui finché io sia andato là ed abbia orato». Luca dice soltanto che andò «secondo il suo solito, al monte degli Ulivi», e Giovanni che passò «di là dal torrente Chedron, dov’era un orto», luogo che Giuda conosceva, «perché Gesù s’era molte volte ritrovato là coi suoi discepoli». Là Gesù pregò nell’angoscia e là fu preso."
    - "I Vangeli non dicono di più, e il luogo esatto non è noto. Nel IV secolo i cristiani pregavano ai piedi del Monte degli Ulivi, al di là del Cedron rispetto al Monte del Tempio: Eusebio colloca il Getsemani presso il Monte degli Ulivi, dove i fedeli venivano a pregare, e la pellegrina Egeria descrive una chiesa sul luogo della preghiera. Oggi la Chiesa di Tutte le Nazioni, costruita nel 1919–1924 sui resti di una chiesa bizantina, sorge accanto a un giardino di vecchi ulivi custodito dai francescani; uno studio del 2015 ha datato tre degli otto al XII secolo. Nelle vicinanze si trovano la Grotta del Getsemani e la Tomba di Maria, anch’esse indicate dalla tradizione."
  nl:
    - "Getsemane is de plaats op de Olijfberg waar Jezus bad in de nacht van zijn gevangenneming. De naam wordt gewoonlijk verklaard als Aramees voor “olijfpers”. Alleen Mattheüs en Marcus noemen haar: “Toen ging Jezus met hen in een plaats genaamd Gethsemane, en zeide tot de discipelen: Zit hier neder, totdat Ik heenga, en aldaar zal gebeden hebben.” Lukas zegt slechts dat hij ging “gelijk Hij gewoon was, naar den Olijfberg”, en Johannes dat hij over “de beek Kedron” ging, “waar een hof was”, een plaats die Judas kende, “dewijl Jezus aldaar dikwijls vergaderd was geweest met Zijn discipelen”. Daar bad Jezus in angst en daar werd hij gevangengenomen."
    - "Meer geven de evangeliën niet, en de precieze plaats is niet bekend. In de 4e eeuw baden christenen aan de voet van de Olijfberg, aan de overkant van de Kidron tegenover de Tempelberg: Eusebius plaatst Getsemane bij de Olijfberg, waar de gelovigen kwamen bidden, en de pelgrim Egeria beschrijft een kerk op de plaats van het gebed. Nu staat daar de Kerk van alle Naties, gebouwd in 1919–1924 boven de resten van een Byzantijnse kerk, naast een tuin van oude olijfbomen die door de Franciscanen wordt onderhouden; een onderzoek van 2015 dateerde drie van de acht in de 12e eeuw. In de buurt liggen de Grot van Getsemane en het Graf van Maria, die de overlevering eveneens aanwijst."
  cs:
    - "Getsemane je místo na Olivové hoře, kde se Ježíš modlil v noci svého zatčení. Jméno se obvykle vykládá jako aramejské „lis na olej“. Jmenují je jen Matouš a Marek: „Tedy přišel s nimi Ježíš na místo, kteréž sloulo Getsemany. I dí učedlníkům: Poseďtež tuto, ažť odejda, pomodlím se tamto.“ Lukáš říká jen, že šel „podle obyčeje svého, šel na horu Olivovou“, a Jan, že přešel „přes potok Cedron, kdež byla zahrada“, místo, které znal Juda, „nebo často chodíval tam Ježíš s učedlníky svými“. Tam se Ježíš v úzkosti modlil a tam byl zajat."
    - "Evangelia neříkají víc a přesné místo není známo. Ve 4. století se křesťané modlili na úpatí Olivové hory přes Kidron od Chrámové hory: Eusebios klade Getsemane k Olivové hoře, kam věřící přicházeli k modlitbě, a poutnice Egerie popisuje kostel na místě modlitby. Dnes stojí Kostel všech národů, vystavěný v letech 1919–1924 nad zbytky byzantského kostela, vedle zahrady starých olivovníků, kterou spravují františkáni; studie z roku 2015 datovala tři z osmi do 12. století. Poblíž jsou Getsemanská jeskyně a Hrob Marie, rovněž ukazované podle tradice."
  sv:
    - "Getsemane är platsen på Olivberget där Jesus bad natten då han greps. Namnet förklaras vanligen som arameiska för ”oljepress”. Bara Matteus och Markus nämner det: ”Därefter kom Jesus med dem till ett ställe som hette Getsemane. Och han sade till lärjungarna: »Bliven kvar här, medan jag går dit bort och beder.»” Lukas säger bara att han ”begav sig till Oljeberget, såsom hans sed var”, och Johannes att han gick ”över bäcken Kidron till andra sidan. Där var en örtagård”, ett ställe Judas kände till, ”ty där hade Jesus och hans lärjungar ofta kommit tillsammans”. Där bad Jesus i ångest och där greps han."
    - "Evangelierna ger inte mer än så, och den exakta platsen är inte känd. På 300-talet bad de kristna vid foten av Olivberget, tvärs över Kidron från Tempelberget: Eusebios förlägger Getsemane till Olivberget, dit de troende kom för att be, och pilgrimen Egeria beskriver en kyrka på bönens plats. I dag står Alla nationers kyrka, byggd 1919–1924 över lämningarna av en bysantinsk kyrka, intill en trädgård med gamla olivträd som sköts av franciskanerna; en undersökning från 2015 daterade tre av de åtta till 1100-talet. I närheten finns Getsemanegrottan och Marias grav, som också visas av traditionen."
  nb:
    - "Getsemane er stedet på Oljeberget der Jesus ba natten han ble arrestert. Navnet forklares vanligvis som arameisk for «oljepresse». Bare Matteus og Markus nevner det: «Da kom Jesus med dem til et sted som heter Getsemane, og han sa til disiplene: Sett eder her, mens jeg går der bort og beder!» Lukas sier bare at han gikk «efter sedvane til Oljeberget», og Johannes at han gikk ut «over bekken Kedron; der var en have», et sted Judas kjente, «for Jesus samledes ofte der med sine disipler». Der ba Jesus i angst, og der ble han grepet."
    - "Evangeliene gir ikke mer enn dette, og det nøyaktige stedet er ikke kjent. På 300-tallet ba kristne ved foten av Oljeberget, på den andre siden av Kedron fra Tempelberget: Eusebius plasserer Getsemane ved Oljeberget, der de troende kom for å be, og pilegrimen Egeria beskriver en kirke på stedet for bønnen. I dag står Alle nasjoners kirke, bygd i 1919–1924 over restene av en bysantinsk kirke, ved siden av en hage med gamle oliventrær som fransiskanerne holder; en undersøkelse fra 2015 daterte tre av de åtte til 1100-tallet. I nærheten ligger Getsemane-grotten og Marias grav, som også vises fram av tradisjonen."
  tl:
    - "Ang Getsemani ay ang lugar sa Bundok ng mga Olibo kung saan nanalangin si Jesus sa gabi ng kaniyang pagkaaresto. Karaniwang ipinaliliwanag ang pangalan bilang Arameo para sa “pisaan ng langis”. Sina Mateo at Marcos lamang ang nagpapangalan dito: “Nang magkagayo'y dumating si Jesus na kasama sila sa isang dako na tinatawag na Getsemani, at sinabi sa kaniyang mga alagad, Magsiupo kayo rito, samantalang ako'y pumaparoon doon at manalangin.” Sinasabi lamang ni Lucas na pumaroon siya “ayon sa kaniyang kaugalian, sa bundok ng mga Olivo”, at ni Juan na tumawid siya sa “batis ng Cedron, na doo'y may isang halamanan”, isang dakong alam ni Judas, “sapagka't madalas na si Jesus ay nakikipagkatipon sa kaniyang mga alagad doon”. Doon nanalangin si Jesus sa paghihirap at doon siya dinakip."
    - "Wala nang higit na ibinibigay ang mga Ebanghelyo, at hindi alam ang eksaktong lugar. Pagsapit ng ika-4 na siglo, nananalangin ang mga Kristiyano sa paanan ng Bundok ng mga Olibo sa kabila ng Cedron mula sa Bundok ng Templo: inilalagay ni Eusebio ang Getsemani sa Bundok ng mga Olibo, kung saan nagsisiparoon ang mga mananampalataya upang manalangin, at inilalarawan ng peregrinang si Egeria ang isang simbahan sa dako ng panalangin. Ngayon, ang Simbahan ng Lahat ng Bansa, na itinayo noong 1919–1924 sa ibabaw ng mga labi ng isang simbahang Byzantine, ay nakatayo sa tabi ng isang halamanan ng matatandang puno ng olibo na inaalagaan ng mga Franciscano; isang pag-aaral noong 2015 ang nagpetsa sa tatlo sa walo noong ika-12 siglo. Malapit dito ang Yungib ng Getsemani at ang Libingan ni Maria, na itinuturo rin ng tradisyon."
  da:
    - "Getsemane er stedet på Oliebjerget, hvor Jesus bad natten, han blev arresteret. Navnet forklares sædvanligvis som aramæisk for »olivenpresse«. Kun Mattæus og Markus nævner det: »Da kommer Jesus med dem til en Gaard, som kaldes Gethsemane, og han siger til Disciplene: ›Sætter eder her, medens jeg gaar derhen og beder.‹« Lukas siger blot, at han gik »efter sin Sædvane til Oliebjerget«, og Johannes, at han gik »over Kedrons Bæk, hvor der var en Have«, et sted som Judas kendte, »thi Jesus samledes ofte der med sine Disciple«. Der bad Jesus i angst, og der blev han grebet."
    - "Evangelierne giver ikke mere end dette, og det nøjagtige sted er ukendt. I 300-tallet bad kristne ved foden af Oliebjerget over for Tempelbjerget på den anden side af Kedron: Eusebios placerer Getsemane ved Oliebjerget, hvor de trofaste kom for at bede, og pilgrimmen Egeria beskriver en kirke på bedens sted. I dag står Alle Nationers Kirke, bygget 1919–1924 over resterne af en byzantinsk kirke, ved siden af en have med gamle oliventræer, som franciskanerne passer; en undersøgelse fra 2015 daterede tre af de otte til 1100-tallet. I nærheden er Getsemane-grotten og Marias grav, som også vises af traditionen."
  sr:
    - "Гетсимански врт је место на Маслинској гори где се Исус молио у ноћи свог хапшења. Име се обично тумачи као арамејско за „пресу за уље“. Само Матеј и Марко га именују: „Тада дође Исус с њима у село које се зове Гетсиманија, и рече ученицима: Седите ту док ја идем тамо да се помолим Богу.“ Лука каже само да је отишао „по обичају на гору маслинску“, а Јован да је прешао „преко потока Кедрона где беше врт“, на место које је Јуда знао, „јер се Исус често скупљаше онде с ученицима својим“. Ту се Исус у мукама молио и ту је био ухваћен."
    - "Јеванђеља не дају више од тога и тачно место није познато. Већ у четвртом веку хришћани су се молили у подножју Маслинске горе преко Кедрона од Храмовне горе: Јевсевије смешта Гетсиманију на Маслинску гору, где су верни долазили да се моле, а ходочасница Егерија описује цркву на месту молитве. Данас Црква свих народа, подигнута 1919–1924. над остацима византијске цркве, стоји поред врта старих маслина које чувају фрањевци; студија из 2015. датовала је три од осам у дванаести век. Близу су Гетсиманска пећина и Маријин гроб, које предање такође показује."
  hu:
    - "Gecsemáné az Olajfák hegyén az a hely, ahol Jézus a letartóztatása éjszakáján imádkozott. A nevet rendszerint az arámi „olajprés” szóval magyarázzák. Csak Máté és Márk nevezi meg: „Akkor elméne Jézus velök egy helyre, a melyet Gecsemánénak hívtak, és monda a tanítványoknak: Üljetek le itt, míg elmegyek és amott imádkozom.” Lukács csak annyit mond, hogy „az ő szokása szerint az Olajfák hegyére” ment, János pedig hogy átkelt „túl a Kedron patakán, a hol egy kert vala”, olyan helyen, amelyet Júdás ismert, „mivelhogy gyakorta ott gyűlt egybe Jézus az ő tanítványaival”. Ott imádkozott Jézus gyötrődve, és ott fogták el."
    - "Az evangéliumok ennél többet nem mondanak, és a pontos helyet nem ismerjük. A 4. századra a keresztények az Olajfák hegyének lábánál imádkoztak, a Templom-heggyel szemben a Kidron túloldalán: Eusebius Gecsemánét az Olajfák hegyére helyezi, ahová a hívők imádkozni jártak, Egeria zarándok pedig templomot ír le az imádság helyén. Ma az Összes Nemzetek temploma, amelyet 1919–1924-ben építettek egy bizánci templom maradványai fölé, a ferencesek gondozta ősi olajfák kertje mellett áll; egy 2015-ös vizsgálat a nyolc fából hármat a 12. századra keltezett. A közelben van a Gecsemáné-barlang és Mária sírja is, amelyeket szintén a hagyomány mutat."
  fi:
    - "Getsemane on paikka Öljymäellä, jossa Jeesus rukoili pidätyksensä yönä. Nimen selitetään yleensä olevan aramean ”öljypuristamo”. Vain Matteus ja Markus nimeävät sen: ”Sitten Jeesus tuli heidän kanssaan Getsemane nimiselle maatilalle; ja hän sanoi opetuslapsillensa: ’Istukaa tässä, sillä aikaa kuin minä menen ja rukoilen tuolla’.” Luukas sanoo vain, että hän lähti ”tapansa mukaan Öljymäelle”, ja Johannes, että hän meni ”Kedronin puron tuolle puolelle; siellä oli puutarha”, paikka, jonka Juudas tiesi, ”koska Jeesus ja hänen opetuslapsensa usein olivat kokoontuneet sinne”. Siellä Jeesus rukoili tuskassa, ja siellä hänet vangittiin."
    - "Evankeliumit eivät kerro enempää, eikä tarkkaa paikkaa tunneta. 300-luvulla kristityt rukoilivat Öljymäen juurella Kidronin toisella puolella Temppelivuoresta: Eusebios sijoittaa Getsemanen Öljymäelle, jonne uskovat tulivat rukoilemaan, ja pyhiinvaeltaja Egeria kuvaa kirkkoa rukouksen paikalla. Nykyään Kaikkien kansojen kirkko, rakennettu vuosina 1919–1924 bysanttilaisen kirkon jäänteiden päälle, seisoo fransiskaanien hoitaman vanhojen oliivipuiden puutarhan vieressä; vuoden 2015 tutkimus ajoitti kolme kahdeksasta 1100-luvulle. Lähellä ovat Getsemanen luola ja Marian hauta, joita myös perinne näyttää."
  vi:
    - "Ghết-sê-ma-nê là nơi trên Núi Ô-li-ve mà Giê-su cầu nguyện vào đêm Ngài bị bắt. Tên thường được giải thích là tiếng Aram nghĩa “bàn ép dầu”. Chỉ Ma-thi-ơ và Mác nêu tên: “Rồi Đức Chúa Jêsus cùng môn đồ đi đến một chỗ kêu là Ghết-sê-ma-nê. Ngài phán rằng: Hãy ngồi đây đợi ta đi cầu nguyện đằng kia”. Lu-ca chỉ nói rằng Ngài đi “lên núi Ô-li-ve theo như thói quen”, còn Giăng nói Ngài sang “bên kia khe Xết-rôn; tại đó có một cái vườn”, một nơi Giu-đa biết, “vì Đức Chúa Jêsus thường cùng môn đồ nhóm họp tại đó”. Tại đó Giê-su cầu nguyện trong thống khổ và tại đó Ngài bị bắt."
    - "Các sách Phúc Âm không cho nhiều hơn thế, và vị trí chính xác không được biết. Đến thế kỷ 4, các Cơ Đốc nhân cầu nguyện ở chân Núi Ô-li-ve bên kia Xết-rôn đối diện Núi Đền Thờ: Eusebius đặt Ghết-sê-ma-nê ở Núi Ô-li-ve, nơi các tín hữu đến cầu nguyện, và người hành hương Egeria mô tả một nhà thờ ở nơi cầu nguyện. Ngày nay Nhà thờ Vạn Quốc, xây năm 1919–1924 trên tàn tích một nhà thờ Byzantine, đứng cạnh một khu vườn ô-liu cổ do dòng Phanxicô trông coi; một nghiên cứu năm 2015 định niên đại ba trong tám cây vào thế kỷ 12. Gần đó là Hang Ghết-sê-ma-nê và Mộ Ma-ri, cũng được truyền thống chỉ ra."
  ro:
    - "Ghetsimani este locul de pe Muntele Măslinilor unde s-a rugat Isus în noaptea arestării. Numele se explică de obicei ca aramaicul pentru „teasc de ulei”. Numai Matei și Marcu îl numesc: „Atunci au venit Iisus împreună cu dânșii în satul ce se numește Ghetsimanì, și au zis ucenicilor: ședeți aici până voiu merge să mă rog acolo.” Luca spune doar că a mers „după obiceiu în muntele Maslinilor”, iar Ioan că a trecut „de ceea parte de pârîul Chedrilor unde erà o grădină”, un loc pe care îl știa Iuda, „căci de multe ori se adunà Iisus acolo cu ucenicii săi”. Acolo s-a rugat Isus în chinuri și acolo a fost prins."
    - "Evangheliile nu dau mai mult, iar locul exact nu se cunoaște. În secolul al IV-lea, creștinii se rugau deja la poalele Muntelui Măslinilor, peste Chedron față de Muntele Templului: Eusebiu așază Ghetsimani la Muntele Măslinilor, unde veneau credincioșii să se roage, iar pelerina Egeria descrie o biserică pe locul rugăciunii. Astăzi Biserica Națiunilor, construită în 1919–1924 peste rămășițele unei biserici bizantine, se află lângă o grădină de măslini bătrâni îngrijită de franciscani; un studiu din 2015 a datat trei dintre cei opt din secolul al XII-lea. În apropiere sunt Grota Ghetsimani și Mormântul Mariei, arătate și ele de tradiție."
  bg:
    - "Гетсимания е мястото на Елеонския хълм, където Исус се молеше в нощта на ареста си. Името обикновено се обяснява като арамейско „маслобойна“. Само Матей и Марко го назовават: „Тогаз идва с тех Исус на едно место което се казва Гетсимания; и казва на учениците: Седете тука, докле ида там да се помоля.“ Лука казва само, че той отиде „по обичай на гората Елеонска“, а Йоан — че премина „отвъд потока Кедрон дето имаше градина“, място, което Юда познаваше, „защото много пъти се събираше Исус там с учениците си“. Там Исус се молеше в скръб и там беше хванат."
    - "Евангелията не казват повече и точното място не е известно. Към IV в. християните се молеха в подножието на Елеонския хълм, отвъд Кедрон срещу Храмовия хълм: Евсевий поставя Гетсимания при Елеонския хълм, където вярващите идвали да се молят, а поклонничката Егерия описва църква на мястото на молитвата. Днес църквата „Всички народи“, построена през 1919–1924 г. върху останките на византийска църква, стои до градина със стари маслинови дървета, пазена от францисканците; изследване от 2015 г. датира три от осемте към XII в. Наблизо са Гетсиманската пещера и Гробът на Богородица, също показвани от преданието."
