# Overview article (ADR 0007). Mainstream facts only; Balaam's home town, usually equated with Assyrian Pitru; the variant reading “Ammon” is noted.
id: pethor
place: aa9e754
title:
  en: "Pethor"
  ru: "Пефор"
  uk: "Пефор"
  es: "Petor"
  pt: "Petor"
  de: "Petor"
  fr: "Pethor"
body:
  en:
    - "Pethor was the home of Balaam son of Beor, the seer whom Balak, king of Moab, sent for to curse Israel: he sent messengers “unto Balaam the son of Beor to Pethor, which is by the river of the land of the children of his people”, and Deuteronomy recalls that Moab “hired against thee Balaam the son of Beor of Pethor of Mesopotamia, to curse thee”. “The river” is the Euphrates, and the Synodal Bible says so outright. A few ancient versions read “the land of the children of Ammon”, which would put Balaam much nearer Moab."
    - "Pethor is usually identified with Pitru, a town on the Sajur near where it meets the Euphrates, south of Carchemish, which Shalmaneser III took in the ninth century BC; its exact site is not known, and the map's point stands at nearby Tell Ahmar, ancient Til Barsip. Balaam himself appears outside the Bible in a plaster inscription of about 800 BC found at Deir Alla in the Jordan valley in 1967."
  ru:
    - "Пефор — родина Валаама, сына Веорова, прорицателя, за которым Валак, царь Моавитский, послал, чтобы тот проклял Израиль: «послал он послов к Валааму, сыну Веорову, в Пефор, который на реке Евфрате, в земле сынов народа его», а Второзаконие напоминает, что Моавитяне «наняли против тебя Валаама, сына Веорова, из Пефора Месопотамского». В еврейском тексте сказано просто «на реке», но имеется в виду Евфрат. Несколько древних переводов читают «в земле сынов Аммона», что поместило бы Валаама гораздо ближе к Моаву."
    - "Пефор обычно отождествляют с Питру, городом на Саджуре близ его впадения в Евфрат, к югу от Кархемиша, который взял Салманасар III в IX веке до н. э.; точное место неизвестно, и точка на карте стоит у соседнего Телль-Ахмара, древнего Тиль-Барсипа. Сам Валаам упоминается вне Библии в надписи на штукатурке около 800 г. до н. э., найденной в Дейр-Алле в Иорданской долине в 1967 году."
  uk:
    - "Пефор був батьківщиною Валаама, сина Беора, віщуна, по якого Валак, цар Моаву, послав, щоб той прокляв Ізраїль: він послав посланців «до Білеама Беоренка в Петор, що над рікою Ефрат, в землї синів народа його», а Повторення Закону згадує, що Моав найняв Валаама: «наймали проти тебе Білеама Беоренка, із Пегора в Мезопотамії, щоб він прокляв тебе». «Ріка» — це Євфрат, і Синодальний переклад прямо так і каже. Кілька давніх перекладів читають: земля синів Аммона, що поставило б Валаама значно ближче до Моаву."
    - "Пефор зазвичай ототожнюють з Пітру — містом на Саджурі поблизу її впадіння в Євфрат, на південь від Каркемиша, яке в IX ст. до н. е. взяв Салманассар III; його точне місце невідоме, а точка на мапі стоїть у сусідньому Телль-Ахмарі, давньому Тіль-Барсіпі. Сам Валаам постає поза Біблією в написі на штукатурці близько 800 р. до н. е., знайденому в Дейр-Аллі в долині Йордану 1967 року."
  es:
    - "Petor era la patria de Balaam hijo de Beor, el vidente a quien Balac, rey de Moab, mandó llamar para maldecir a Israel: envió mensajeros «á Balaam hijo de Beor, á Pethor, que está junto al río en la tierra de los hijos de su pueblo», y el Deuteronomio recuerda que Moab «alquiló contra ti á Balaam hijo de Beor de Pethor de Mesopotamia de Siria, para que te maldijese». «El río» es el Éufrates, y la Biblia sinodal lo dice sin rodeos. Algunas versiones antiguas leen «la tierra de los hijos de Amón», lo que pondría a Balaam mucho más cerca de Moab."
    - "Petor se identifica por lo común con Pitru, una ciudad en el Sajur, cerca de donde se une al Éufrates, al sur de Carquemis, que tomó Salmanasar III en el siglo IX a. C.; su emplazamiento exacto no se conoce, y el punto del mapa está en la cercana Tell Ahmar, la antigua Til Barsip. El propio Balaam aparece fuera de la Biblia en una inscripción en yeso de hacia 800 a. C. hallada en Deir Alla, en el valle del Jordán, en 1967."
  pt:
    - "Petor era a terra de Balaão, filho de Beor, o vidente que Balaque, rei de Moabe, mandou chamar para amaldiçoar Israel: enviou mensageiros “a Balaão, filho de Beor, a Petor, que fica junto ao Rio, à terra dos filhos do seu povo”, e o Deuteronômio lembra que “contrataram contra você Balaão, filho de Beor, de Petor da Mesopotâmia, para amaldiçoá-lo”. “O Rio” é o Eufrates, e a Bíblia Sinodal o diz abertamente. Algumas versões antigas leem “a terra dos filhos de Amom”, o que poria Balaão muito mais perto de Moabe."
    - "Petor costuma ser identificada com Pitru, cidade no Sajur, perto de onde ele encontra o Eufrates, ao sul de Carquemis, que Salmaneser III tomou no século IX a.C.; seu local exato não é conhecido, e o ponto do mapa fica no vizinho Tell Ahmar, a antiga Til Barsip. O próprio Balaão aparece fora da Bíblia numa inscrição em gesso de cerca de 800 a.C. encontrada em Deir Alla, no vale do Jordão, em 1967."
  de:
    - "Petor war die Heimat Bileams, des Sohnes Beors, des Sehers, den Balak, der König von Moab, holen ließ, um Israel zu verfluchen: Er sandte Boten „zu Bileam, dem Sohn Beors, gen Pethor, der wohnte an dem Strom im Lande der Kinder seines Volks“, und im Deuteronomium heißt es von Moab: „vielmehr wider euch dingten den Bileam, den Sohn Beors von Pethor aus Mesopotamien, daß er dich verfluchen sollte“. „Der Strom“ ist der Euphrat, und die russische Synodalübersetzung sagt es ausdrücklich. Einige alte Übersetzungen lesen „das Land der Söhne Ammons“, was Bileam viel näher an Moab rücken würde."
    - "Petor wird meist mit Pitru gleichgesetzt, einer Stadt am Sadschur nahe seiner Mündung in den Euphrat, südlich von Karkemisch, die Salmanassar III. im 9. Jahrhundert v. Chr. einnahm; ihre genaue Lage ist unbekannt, und der Kartenpunkt steht beim nahen Tell Ahmar, dem antiken Til Barsip. Bileam selbst erscheint außerhalb der Bibel in einer Putzinschrift von etwa 800 v. Chr., die 1967 in Deir Alla im Jordantal gefunden wurde."
  fr:
    - "Pethor était la patrie de Balaam fils de Beor, le devin que Balak, roi de Moab, fit venir pour maudire Israël : il envoya des messagers « auprès de Balaam, fils de Beor, à Pethor sur le fleuve, dans le pays des fils de son peuple », et le Deutéronome rappelle qu’ils « ont fait venir contre toi à prix d’argent Balaam, fils de Beor, de Pethor en Mésopotamie, pour qu’il te maudisse ». « Le fleuve » est l’Euphrate, et la Bible synodale russe le dit expressément (Louis Segond ne le nomme pas). Quelques versions anciennes lisent « le pays des fils d’Ammon », ce qui placerait Balaam bien plus près de Moab."
    - "Pethor est d’ordinaire identifiée à Pitrou, ville sur le Sajour près de son confluent avec l’Euphrate, au sud de Carkemisch, que Salmanasar III prit au IXe siècle av. J.-C. ; son emplacement exact est inconnu, et le point de la carte est à Tell Ahmar, l’antique Til Barsip, tout près. Balaam apparaît lui-même hors de la Bible dans une inscription sur plâtre d’environ 800 av. J.-C. trouvée à Deir Alla, dans la vallée du Jourdain, en 1967."
