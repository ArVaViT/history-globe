body:
  en:
    - "Pethor was the home of Balaam son of Beor, the seer whom Balak, king of Moab, sent for to curse Israel: he sent messengers “unto Balaam the son of Beor to Pethor, which is by the river of the land of the children of his people”, and Deuteronomy recalls that Moab “hired against thee Balaam the son of Beor of Pethor of Mesopotamia, to curse thee”. “The river” is the Euphrates, and the Synodal Bible says so outright. A few ancient versions read “the land of the children of Ammon”, which would put Balaam much nearer Moab."
    - "Pethor is usually identified with Pitru, a town on the Sajur near where it meets the Euphrates, south of Carchemish, which Shalmaneser III took in the ninth century BC; its exact site is not known, and the map's point stands at nearby Tell Ahmar, ancient Til Barsip. Balaam himself appears outside the Bible in a plaster inscription of about 800 BC found at Deir Alla in the Jordan valley in 1967."
  ru:
    - "Пефор — родина Валаама, сына Веорова, прорицателя, за которым Валак, царь Моавитский, послал, чтобы тот проклял Израиль: «послал он послов к Валааму, сыну Веорову, в Пефор, который на реке Евфрате, в земле сынов народа его», а Второзаконие напоминает, что Моавитяне «наняли против тебя Валаама, сына Веорова, из Пефора Месопотамского». В еврейском тексте сказано просто «на реке», но имеется в виду Евфрат. Несколько древних переводов читают «в земле сынов Аммона», что поместило бы Валаама гораздо ближе к Моаву."
    - "Пефор обычно отождествляют с Питру, городом на Саджуре близ его впадения в Евфрат, к югу от Кархемиша, который взял Салманасар III в IX веке до н. э.; точное место неизвестно, и точка на карте стоит у соседнего Телль-Ахмара, древнего Тиль-Барсипа. Сам Валаам упоминается вне Библии в надписи на штукатурке около 800 г. до н. э., найденной в Дейр-Алле в Иорданской долине в 1967 году."
  uk:
    - "Пефор був батьківщиною Валаама, сина Беора, віщуна, по якого Валак, цар Моаву, послав, щоб той прокляв Ізраїль: він послав посланців «до Білеама Беоренка в Петор, що над рікою Ефрат, в землї синів народа його», а Повторення Закону згадує, що Моав найняв Валаама: «наймали проти тебе Білеама Беоренка, із Пегора в Мезопотамії, щоб він прокляв тебе». «Ріка» — це Євфрат, і Синодальний переклад прямо так і каже. Кілька давніх перекладів читають: земля синів Аммона, що поставило б Валаама значно ближче до Моаву."
    - "Пефор зазвичай ототожнюють з Пітру — містом на Саджурі поблизу її впадіння в Євфрат, на південь від Каркемиша, яке в IX ст. до н. е. взяв Салманассар III; його точне місце невідоме, а точка на мапі стоїть у сусідньому Телль-Ахмарі, давньому Тіль-Барсіпі. Сам Валаам постає поза Біблією в написі на штукатурці близько 800 р. до н. е., знайденому в Дейр-Аллі в долині Йордану 1967 року."
  es:
    - "Petor era la patria de Balaam hijo de Beor, el vidente a quien Balac, rey de Moab, mandó llamar para maldecir a Israel: envió mensajeros «á Balaam hijo de Beor, á Pethor, que está junto al río en la tierra de los hijos de su pueblo», y el Deuteronomio recuerda que Moab «alquiló contra ti á Balaam hijo de Beor de Pethor de Mesopotamia de Siria, para que te maldijese». «El río» es el Éufrates, y la Biblia sinodal lo dice sin rodeos. Algunas versiones antiguas leen «la tierra de los hijos de Amón», lo que pondría a Balaam mucho más cerca de Moab."
    - "Petor se identifica por lo común con Pitru, una ciudad en el Sajur, cerca de donde se une al Éufrates, al sur de Carquemis, que tomó Salmanasar III en el siglo IX a. C.; su emplazamiento exacto no se conoce, y el punto del mapa está en la cercana Tell Ahmar, la antigua Til Barsip. El propio Balaam aparece fuera de la Biblia en una inscripción en yeso de hacia 800 a. C. hallada en Deir Alla, en el valle del Jordán, en 1967."
  pt:
    - "Petor era a terra de Balaão, filho de Beor, o vidente que Balaque, rei de Moabe, mandou chamar para amaldiçoar Israel: enviou mensageiros “a Balaão, filho de Beor, a Petor, que fica junto ao Rio, à terra dos filhos do seu povo”, e o Deuteronômio lembra que “contrataram contra você Balaão, filho de Beor, de Petor da Mesopotâmia, para amaldiçoá-lo”. “O Rio” é o Eufrates, e a Bíblia Sinodal o diz abertamente. Algumas versões antigas leem “a terra dos filhos de Amom”, o que poria Balaão muito mais perto de Moabe."
    - "Petor costuma ser identificada com Pitru, cidade no Sajur, perto de onde ele encontra o Eufrates, ao sul de Carquemis, que Salmaneser III tomou no século IX a.C.; seu local exato não é conhecido, e o ponto do mapa fica no vizinho Tell Ahmar, a antiga Til Barsip. O próprio Balaão aparece fora da Bíblia numa inscrição em gesso de cerca de 800 a.C. encontrada em Deir Alla, no vale do Jordão, em 1967."
  de:
    - "Petor war die Heimat Bileams, des Sohnes Beors, des Sehers, den Balak, der König von Moab, holen ließ, um Israel zu verfluchen: Er sandte Boten „zu Bileam, dem Sohn Beors, gen Pethor, der wohnte an dem Strom im Lande der Kinder seines Volks“, und im Deuteronomium heißt es von Moab: „vielmehr wider euch dingten den Bileam, den Sohn Beors von Pethor aus Mesopotamien, daß er dich verfluchen sollte“. „Der Strom“ ist der Euphrat, und die russische Synodalübersetzung sagt es ausdrücklich. Einige alte Übersetzungen lesen „das Land der Söhne Ammons“, was Bileam viel näher an Moab rücken würde."
    - "Petor wird meist mit Pitru gleichgesetzt, einer Stadt am Sadschur nahe seiner Mündung in den Euphrat, südlich von Karkemisch, die Salmanassar III. im 9. Jahrhundert v. Chr. einnahm; ihre genaue Lage ist unbekannt, und der Kartenpunkt steht beim nahen Tell Ahmar, dem antiken Til Barsip. Bileam selbst erscheint außerhalb der Bibel in einer Putzinschrift von etwa 800 v. Chr., die 1967 in Deir Alla im Jordantal gefunden wurde."
  fr:
    - "Pethor était la patrie de Balaam fils de Beor, le devin que Balak, roi de Moab, fit venir pour maudire Israël : il envoya des messagers « auprès de Balaam, fils de Beor, à Pethor sur le fleuve, dans le pays des fils de son peuple », et le Deutéronome rappelle qu’ils « ont fait venir contre toi à prix d’argent Balaam, fils de Beor, de Pethor en Mésopotamie, pour qu’il te maudisse ». « Le fleuve » est l’Euphrate, et la Bible synodale russe le dit expressément (Louis Segond ne le nomme pas). Quelques versions anciennes lisent « le pays des fils d’Ammon », ce qui placerait Balaam bien plus près de Moab."
    - "Pethor est d’ordinaire identifiée à Pitrou, ville sur le Sajour près de son confluent avec l’Euphrate, au sud de Carkemisch, que Salmanasar III prit au IXe siècle av. J.-C. ; son emplacement exact est inconnu, et le point de la carte est à Tell Ahmar, l’antique Til Barsip, tout près. Balaam apparaît lui-même hors de la Bible dans une inscription sur plâtre d’environ 800 av. J.-C. trouvée à Deir Alla, dans la vallée du Jourdain, en 1967."
  it:
    - "Petor era la patria di Balaam figlio di Beor, il veggente che Balak, re di Moab, mandò a chiamare per maledire Israele: mandò ambasciatori «a Balaam, figliuolo di Beor, a Pethor che sta sul fiume, nel paese de’ figliuoli del suo popolo», e il Deuteronomio ricorda che Moab «salariarono a tuo danno, Balaam figliuolo di Beor, da Pethor in Mesopotamia, per maledirti». «Il fiume» è l’Eufrate, e la Bibbia sinodale lo dice esplicitamente. Alcune antiche versioni leggono il paese dei figli di Ammon, il che collocherebbe Balaam molto più vicino a Moab."
    - "Petor è di solito identificata con Pitru, una città sul Sajur vicino alla sua confluenza con l’Eufrate, a sud di Carchemis, che Salmanàssar III prese nel IX secolo a.C.; il suo sito esatto non è noto, e il punto sulla mappa sta nella vicina Tell Ahmar, l’antica Til Barsip. Lo stesso Balaam compare fuori della Bibbia in un’iscrizione su intonaco dell’800 a.C. circa trovata a Deir Alla nella valle del Giordano nel 1967."
  pl:
    - "Petor było domem Balaama, syna Beora, wieszcza, po którego Balak, król Moabu, posłał, by przeklął Izraela: wysłał posłów „do Balaama, syna Beorowego, do Pethoru miasta, które jest nad rzeką ziemi synów ludu jego”, a Księga Powtórzonego Prawa przypomina, że Moabici „najęli za zapłatę przeciw tobie Balaama, syna Beorowego, z Pethor Mesopotamii Syryjskiej, aby cię przeklinał”. „Rzeka” to Eufrat, co Biblia synodalna mówi wprost. Niektóre dawne przekłady czytają: ziemia synów Ammona, co umieściłoby Balaama znacznie bliżej Moabu."
    - "Petor utożsamia się zwykle z Pitru, miastem nad Sadżurem w pobliżu jego ujścia do Eufratu, na południe od Karkemisz, które zdobył w IX wieku p.n.e. Salmanasar III; jego dokładne położenie nie jest znane, a punkt na mapie stoi w pobliskim Tell Ahmar, dawnym Til Barsip. Sam Balaam pojawia się poza Biblią w gipsowym napisie z około 800 roku p.n.e., znalezionym w Dajr Alla w dolinie Jordanu w 1967 roku."
  cs:
    - "Petór byl domovem Bileáma syna Beórova, věštce, pro něhož Balak, král Moábu, poslal, aby proklel Izrael: poslal posly „k Balámovi, synu Beorovu, do města Petor, kteréž jest při řece v zemi vlasti jeho“, a Deuteronomium připomíná, že Moáb „ze mzdy najal proti tobě Baláma, syna Beor, z Petor Mezopotamie Syrské, aby zlořečil tobě“. „Řekou“ je Eufrat a synodální Bible to říká přímo. Několik starých překladů čte „země synů Amonových“, což by Bileáma kladlo mnohem blíže k Moábu."
    - "Petór se obvykle ztotožňuje s Pitru, městem na Sajúru poblíž jeho soutoku s Eufratem, jižně od Karkemíše, které ve 9. století př. n. l. dobyl Salmanasar III.; jeho přesné místo není známo a bod na mapě stojí u nedalekého Tell Ahmar, starověkého Til Barsipu. Sám Bileám se mimo Bibli objevuje v omítkovém nápisu z asi 800 př. n. l. nalezeném roku 1967 v Dér Alle v jordánském údolí."
  nl:
    - "Petor was de woonplaats van Bileam, zoon van Beor, de ziener die Balak, koning van Moab, liet halen om Israël te vervloeken: hij zond boden “aan Bileam, den zoon van Beor, te Pethor, hetwelk aan de rivier is, in het land der kinderen zijns volks”, en Deuteronomium herinnert dat Moab “gehuurd heeft Bileam, den zoon van Beor, van Pethor uit Mesopotamië, om u te vloeken”. “De rivier” is de Eufraat, en de Synodale Bijbel zegt dat zonder omwegen. Enkele oude vertalingen lezen “het land van de kinderen van Ammon”, wat Bileam veel dichter bij Moab zou plaatsen."
    - "Petor wordt meestal gelijkgesteld met Pitru, een stad aan de Sajur bij de plek waar die de Eufraat ontmoet, ten zuiden van Karkemis, die Salmaneser III in de 9e eeuw v.Chr. innam; de exacte plaats is onbekend, en het punt op de kaart staat bij het nabije Tell Ahmar, het oude Til Barsip. Bileam zelf komt buiten de Bijbel voor in een pleisteropschrift van omstreeks 800 v.Chr., in 1967 gevonden te Deir Alla in de Jordaanvallei."
  sv:
    - "Petor var hemorten för Bileam, Beors son, siaren som Balak, Moabs kung, sände efter för att förbanna Israel: han skickade sändebud ”till Bileam, Beors son, i Petor vid floden, i hans stamfränders land”, och Femte Mosebok påminner om att Moab ”mot dig lejde, Bileam, Beors son, från Petor i Aram-Naharaim, för att denne skulle förbanna dig”. ”Floden” är Eufrat, och den synodala bibeln säger det rakt ut. Några gamla översättningar läser ”Ammons barns land”, vilket skulle placera Bileam mycket närmare Moab."
    - "Petor identifieras vanligen med Pitru, en stad vid Sajur nära dess möte med Eufrat, söder om Karkemish, som Salmanassar III intog på 800-talet f.Kr.; dess exakta läge är okänt, och kartans punkt står vid närliggande Tell Ahmar, forntida Til Barsip. Bileam själv förekommer utanför Bibeln i en inskription i puts från omkring 800 f.Kr. som hittades vid Deir Alla i Jordandalen 1967."
  nb:
    - "Petor var hjemstedet til Bileam, Beors sønn, seeren som Balak, kongen av Moab, sendte bud etter for å forbanne Israel: han sendte bud «til Bileam, Beors sønn, i Petor, som ligger ved den store elv, til det land hvor han bodde blandt sitt folk», og 5. Mosebok minner om at Moab «leide Bileam, Beors sønn, fra Petor i Mesopotamia imot dig til å forbanne dig». «Elven» er Eufrat, og den synodale bibelen sier det rett ut. Noen gamle oversettelser leser «Ammons barns land», noe som ville satt Bileam mye nærmere Moab."
    - "Petor identifiseres vanligvis med Pitru, en by ved Sajur nær der den møter Eufrat, sør for Karkemisj, som Salmanassar III tok på 800-tallet f.Kr.; det nøyaktige stedet er ikke kjent, og kartpunktet står ved nærliggende Tell Ahmar, det gamle Til Barsip. Bileam selv opptrer utenfor Bibelen i en gipsinskripsjon fra omkring 800 f.Kr. funnet ved Deir Alla i Jordandalen i 1967."
  tl:
    - "Ang Pethor ay ang tahanan ni Balaam na anak ni Beor, ang tagakita na ipinatawag ni Balac, hari ng Moab, upang sumpain ang Israel: nagsugo siya ng mga sugo “kay Balaam na anak ni Beor, hanggang sa Pethor na nasa tabi ng ilog, hanggang sa lupain ng mga anak ng kaniyang bayan”, at ipinaaalala ng Deuteronomio na kanilang “inupahan laban sa iyo si Balaam na anak ni Beor mula sa Pethor ng Mesopotamia upang sumpain ka”. Ang “ilog” ay ang Eufrates, at tahasan itong sinasabi ng Bibliyang Sinodal. Ang ilang sinaunang salin ay bumabasa ng “lupain ng mga anak ni Ammon”, na maglalagay kay Balaam nang higit na malapit sa Moab."
    - "Karaniwang kinikilala ang Pethor sa Pitru, isang bayan sa Sajur malapit sa pagsasanib nito sa Eufrates, sa timog ng Carchemis, na kinuha ni Salmanasar III noong ika-9 na siglo BK; hindi alam ang eksaktong lugar nito, at ang punto ng mapa ay nasa karatig na Tell Ahmar, ang sinaunang Til Barsip. Lumilitaw si Balaam mismo sa labas ng Bibliya sa isang inskripsiyong plaster mula bandang 800 BK na natagpuan sa Deir Alla sa libis ng Jordan noong 1967."
  da:
    - "Petor var hjemstedet for Bileam, Beors søn, seeren som Balak, Moabs konge, sendte bud efter for at forbande Israel: han sendte bud »til Bileam, Beors Søn, til Pethor, som er ved Floden, til hans Folks Børns Land«, og 5. Mosebog erindrer, at Moab »lejede Bileam, Beors Søn, af Pethor i Mesopotamien, imod dig til at forbande dig«. »Floden« er Eufrat, og den synodale bibel siger det ligeud. Nogle få gamle oversættelser læser »Ammons Børns Land«, hvilket ville placere Bileam langt nærmere Moab."
    - "Petor identificeres sædvanligvis med Pitru, en by på Sajur nær dens sammenløb med Eufrat, syd for Karkemisj, som Salmanassar 3. indtog i 800-tallet f.Kr.; dens nøjagtige sted kendes ikke, og kortets punkt står ved det nærliggende Tell Ahmar, det gamle Til Barsip. Bileam selv optræder uden for Bibelen i en gipsindskrift fra omkring 800 f.Kr., fundet i Deir Alla i Jordandalen i 1967."
  sr:
    - "Фетор је био завичај Валама, сина Веоровог, гатара којег је Валак, цар моавски, позвао да прокуне Израиљ: послао је посланике „к Валаму, сину Веоровом у Фатуру, која је на реци у земљи народа његовог“, а Поновљени закон подсећа да је Моав „најмише за новце на вас Валама, сина Веоровог из Феторе у Месопотамији да те прокуне“. „Река“ је Еуфрат, и Синодална библија то изричито каже. Неколико старих превода чита „земља синова Амонових“, што би Валама сместило много ближе Моаву."
    - "Фетор се обично поистовећује са Питруом, градом на Сајуру близу места где се улива у Еуфрат, јужно од Хархемиса, који је Салманасар III заузео у 9. веку п. н. е.; његово тачно место није познато, а тачка на карти стоји код оближњег Тел Ахмара, древног Тил Барсипа. Сам Валам се појављује изван Библије у гипсаном натпису из око 800. п. н. е. нађеном у Дејр Али у долини Јордана 1967."
  hu:
    - "Petór Bálámnak, Beór fiának az otthona volt, a látónak, akit Bálák, Moáb királya hívatott, hogy megátkozza Izráelt: követeket küldött „Bálámhoz, a Beór fiához Péthorba, a mely vala a folyóvíz mellett, az ő népe fiainak földére”, az 5Móz pedig emlékeztet, hogy Moáb „felbérlette ellened Bálámot, a Beór fiát, a mesopotámiabeli Péthorból valót, hogy megátkozzon téged”. „A folyóvíz” az Eufrátesz, és a Szinodális Biblia ezt ki is mondja. Néhány ókori fordítás Ammon fiainak földjét olvassa, ami Bálámot sokkal közelebb helyezné Moábhoz."
    - "Petórt általában Pitruval azonosítják, a Szadzsúr folyó mellett, ott, ahol az az Eufráteszbe torkollik, Karkemistől délre, amelyet III. Salmanasszár a Kr. e. 9. században elfoglalt; pontos helye nem ismert, és a térkép pontja a közeli Tell Ahmarnál áll, az ókori Til Barszipnél. Bálám maga a Biblián kívül is megjelenik egy 1967-ben a Jordán-völgyi Deir Allában talált, Kr. e. 800 körüli vakolatfeliraton."
  fi:
    - "Petor oli Bileamin, Beorin pojan, kotipaikka; Bileam oli näkijä, jonka Balak, Moabin kuningas, kutsui kiroamaan Israelia: hän lähetti sanansaattajat ”Bileamin, Beorin pojan, tykö Petoriin, joka on Eufrat-virran varrella, heimolaistensa maahan”, ja 5. Mooseksen kirja muistuttaa, että Moab ”palkkasi sinua vastaan Bileamin, Beorin pojan, Mesopotamian Petorista, sinua kiroamaan”. ”Virta” on Eufrat, ja synodaalikäännös sanoo sen suoraan. Muutamat muinaiset käännökset lukevat ”ammonilaisten maahan”, mikä sijoittaisi Bileamin paljon lähemmäs Moabia."
    - "Petor tunnistetaan yleensä Pitruksi, Sajur-joen varrella olevaksi kaupungiksi lähellä sen yhtymistä Eufratiin, Karkemisin eteläpuolella, jonka Salmanassar III valtasi 800-luvulla eaa.; sen tarkkaa paikkaa ei tiedetä, ja kartan piste on lähellä olevassa Tell Ahmarissa, muinaisessa Til Barsipissa. Bileam itse esiintyy Raamatun ulkopuolella noin 800 eaa. ajoitetussa kipsikirjoituksessa, joka löydettiin Deir Allasta Jordanin laaksosta vuonna 1967."
  vi:
    - "Phê-thô-rơ là quê của Ba-la-am con Bê-ô, nhà tiên kiến mà Ba-lác, vua Mô-áp, cho mời đến để rủa Y-sơ-ra-ên: ông sai sứ giả đến “Ba-la-am, con trai Bê-ô, ở Phê-thô-rơ, tại trên mé sông, trong xứ của con cái dân sự mình”, và sách Phục Truyền nhắc rằng Mô-áp “có mướn Ba-la-am, con trai Bê-ô, ở Phê-thô-rơ tại Mê-sô-bô-ta-mi, đi đến rủa sả ngươi”. “Mé sông” là sông Ơ-phơ-rát, và bản Synodal nói thẳng như vậy. Một vài bản dịch cổ đọc là “xứ của con cái Am-môn”, điều này sẽ đặt Ba-la-am gần Mô-áp hơn nhiều."
    - "Phê-thô-rơ thường được đồng nhất với Pitru, một thị trấn trên sông Sajur gần chỗ nó hợp với sông Ơ-phơ-rát, phía nam Cạt-kê-mít, bị Sanh-ma-na-sa III chiếm vào thế kỷ 9 TCN; vị trí chính xác chưa được biết, và điểm trên bản đồ đặt tại Tell Ahmar gần đó, Til Barsip cổ. Chính Ba-la-am xuất hiện ngoài Kinh Thánh trong một bia ký thạch cao khoảng năm 800 TCN tìm thấy tại Deir Alla trong thung lũng Giô-đanh năm 1967."
  ro:
    - "Petor era locul de baștină al lui Balaam, fiul lui Beor, văzătorul pe care Balac, regele Moabului, l-a chemat să-l blesteme pe Israel: a trimis soli „la Valaam feciorul lui Veor în Fatura, care este la rîul pământului fiilor poporului său”, iar Deuteronomul amintește că Moab l-a tocmit împotriva lui Israel pe Balaam, fiul lui Beor, din Petor din Mesopotamia, ca să-l blesteme. Râul este Eufratul, iar Biblia sinodală spune aceasta pe față. Câteva versiuni vechi citesc țara fiilor lui Amon, ceea ce l-ar pune pe Balaam mult mai aproape de Moab."
    - "Petor este identificat de obicei cu Pitru, o cetate pe Sajur, lângă locul unde se varsă în Eufrat, la sud de Carchemiș, pe care Salmanasar al III-lea a luat-o în secolul al IX-lea î.Hr.; locul ei exact nu se cunoaște, iar punctul de pe hartă stă la apropiatul Tell Ahmar, vechiul Til Barsip. Balaam însuși apare în afara Bibliei într-o inscripție pe tencuială de pe la 800 î.Hr., găsită la Deir Alla, în valea Iordanului, în 1967."
  bg:
    - "Петор бил родното място на Валаам, сина на Веор, ясновидеца, когото моавският цар Валак повикал да прокълне Израил: той пратил посланици „до Валаама сина Веорова в Фатур, който беше при реката Евфрат, в земята на синовете на людете му“, а Второзаконие припомня, че Моав „цениха против тебе Валаама сина Веоров от Фатур Месопотамски за да те прокълне“. „Реката“ е Ефрат и Синодалната Библия го казва направо. Няколко древни превода четат „земята на синовете на Амон“, което би поставило Валаам много по-близо до Моав."
    - "Петор обикновено се отъждествява с Питру, град на Саджур близо до сливането му с Ефрат, южно от Кархемис, превзет от Салманасар III през IX в. пр.н.е.; точното му място не е известно и точката на картата стои при близкия Тел Ахмар, древния Тил Барсип. Самият Валаам се появява извън Библията в надпис върху мазилка от около 800 г. пр.н.е., намерен в Дейр Ала в Йорданската долина през 1967 г."
