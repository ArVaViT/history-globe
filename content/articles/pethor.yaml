# Overview article (ADR 0007). Mainstream facts only; Balaam's home town, usually equated with Assyrian Pitru; the variant reading “Ammon” is noted.
id: pethor
place: aa9e754
title:
  en: "Pethor"
  ru: "Пефор"
body:
  en:
    - "Pethor was the home of Balaam son of Beor, the seer whom Balak, king of Moab, sent for to curse Israel: he sent messengers “unto Balaam the son of Beor to Pethor, which is by the river of the land of the children of his people”, and Deuteronomy recalls that Moab “hired against thee Balaam the son of Beor of Pethor of Mesopotamia, to curse thee”. “The river” is the Euphrates, and the Synodal Bible says so outright. A few ancient versions read “the land of the children of Ammon”, which would put Balaam much nearer Moab."
    - "Pethor is usually identified with Pitru, a town on the Sajur near where it meets the Euphrates, south of Carchemish, which Shalmaneser III took in the ninth century BC; its exact site is not known, and the map's point stands at nearby Tell Ahmar, ancient Til Barsip. Balaam himself appears outside the Bible in a plaster inscription of about 800 BC found at Deir Alla in the Jordan valley in 1967."
  ru:
    - "Пефор — родина Валаама, сына Веорова, прорицателя, за которым Валак, царь Моавитский, послал, чтобы тот проклял Израиль: «послал он послов к Валааму, сыну Веорову, в Пефор, который на реке Евфрате, в земле сынов народа его», а Второзаконие напоминает, что Моавитяне «наняли против тебя Валаама, сына Веорова, из Пефора Месопотамского». В еврейском тексте сказано просто «на реке», но имеется в виду Евфрат. Несколько древних переводов читают «в земле сынов Аммона», что поместило бы Валаама гораздо ближе к Моаву."
    - "Пефор обычно отождествляют с Питру, городом на Саджуре близ его впадения в Евфрат, к югу от Кархемиша, который взял Салманасар III в IX веке до н. э.; точное место неизвестно, и точка на карте стоит у соседнего Телль-Ахмара, древнего Тиль-Барсипа. Сам Валаам упоминается вне Библии в надписи на штукатурке около 800 г. до н. э., найденной в Дейр-Алле в Иорданской долине в 1967 году."
scripture:
  - Num.22.5
  - Deut.23.4-Deut.23.5
sources:
