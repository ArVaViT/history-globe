body:
  en:
    - "Sin, “the strength of Egypt”, is usually taken to be Pelusium, the fortress town that guarded Egypt's north-eastern frontier at the mouth of the easternmost, Pelusiac branch of the Nile, on the road from Gaza; the Vulgate translates the name as Pelusium. Ezekiel's oracle against Egypt names it twice with Thebes (No) and Memphis (Noph): “I will pour my fury upon Sin, the strength of Egypt; and I will cut off the multitude of No”, and “Sin shall have great pain”."
    - "Because it was the gate of Egypt, armies met there. Herodotus places at Pelusium the repulse of Sennacherib's army in his tale of the mice and the defeat of the last Saite pharaoh by the Persian king Cambyses in 525 BC, and Pompey was murdered on the shore nearby in 48 BC. The site is Tell el-Farama in northern Sinai, east of Port Said, where Egyptian excavations have uncovered Roman and Byzantine fortifications, baths and a theatre."
    - "Strabo describes Pelusium as lying more than twenty stadia from the sea, ringed by marshes and muddy pools, with a wall twenty stadia round; its Greek name came from pelos, mud. Alexander marched from Gaza to Pelusium in seven days, found his fleet already there and left a garrison. In 55 BC Mark Antony, commanding the cavalry of the Roman general Gabinius, seized the narrow pass and took the city, and Plutarch says he stopped King Ptolemy from massacring its Egyptians. In Christian times Pelusium had bishops, among them Dorotheus at the Council of Nicaea, and the city became the metropolis of the province of Augustamnica. The monk Isidore of Pelusium lived on a mountain near the city and died by about 450; some two thousand of his letters survive."
  ru:
    - "Син, «крепость Египта», обычно отождествляют с Пелусием — городом-крепостью, охранявшим северо-восточную границу Египта у устья самого восточного, Пелусийского рукава Нила, на дороге из Газы; Вульгата так и переводит имя: Пелусий. Пророчество Иезекииля о Египте называет его дважды вместе с Фивами (Но) и Мемфисом: «И изолью ярость Мою на Син, крепость Египта, и истреблю многолюдие в Но» и «вострепещет Син»."
    - "Будучи воротами Египта, Пелусий видел много войск. Геродот помещает у Пелусия отражение войска Сеннахирима в своём рассказе о мышах и поражение последнего саисского фараона от персидского царя Камбиза в 525 г. до н. э., а на берегу неподалёку в 48 г. до н. э. был убит Помпей. Место — Телль-эль-Фарама на севере Синая, к востоку от Порт-Саида, где египетские раскопки открыли римские и византийские укрепления, бани и театр. Синодальное имя «Син» не надо путать с пустыней Син."
    - "Страбон описывает Пелусий как город более чем в двадцати стадиях от моря, окружённый болотами и илистыми прудами, со стеной в двадцать стадий по окружности; греческое имя он получил от слова пелос, «грязь». Александр дошёл от Газы до Пелусия за семь дней, застал там свой флот и оставил гарнизон. В 55 г. до н. э. Марк Антоний, командуя конницей римского полководца Габиния, занял узкий проход и взял город, и Плутарх пишет, что он не дал царю Птолемею перебить египтян. В христианскую эпоху у Пелусия были епископы, среди них Дорофей на Никейском соборе, а сам город стал митрополией провинции Августамника. Монах Исидор Пелусиот жил на горе близ города и умер не позднее 450 г.; сохранилось около двух тысяч его писем."
  uk:
    - "Сін, твердиню Єгипту, зазвичай ототожнюють із Пелусієм — містом-фортецею, що охороняло північно-східний кордон Єгипту біля гирла найсхіднішого, Пелусійського рукава Нілу, на дорозі від Гази; Вульгата так і передає назву: Пелусій. Пророцтво Єзекіїля проти Єгипту двічі називає його разом із Фівами (Но) та Мемфісом (Ноф): «І вилию гнїв мій на Син, твердиню Египецьку, й вигублю натовп людей в Но» і «задрожить Син»."
    - "Будучи брамою Єгипту, він бачив зустрічі армій. Геродот поміщає в Пелусії відбиття війська Сінаххеріба в своїй оповіді про мишей і поразку останнього фараона Саїської династії від перського царя Камбіза 525 р. до н. е., а на березі поблизу 48 р. до н. е. було вбито Помпея. Місце — Телль-ель-Фарама на півночі Синаю, на схід від Порт-Саїда, де єгипетські розкопки відкрили римські й візантійські укріплення, лазні та театр."
    - "Страбон описує Пелусій як місто більш ніж за двадцять стадій від моря, оточене болотами й мулистими ставами, з муром на двадцять стадій в обводі; грецьку назву воно дістало від слова пелос, «багно». Александр дійшов від Гази до Пелусія за сім днів, застав там свій флот і залишив залогу. 55 р. до н. е. Марк Антоній, командуючи кіннотою римського полководця Габінія, зайняв вузький прохід і взяв місто, і Плутарх пише, що він не дав цареві Птолемею вирізати єгиптян. У християнську добу Пелусій мав єпископів, серед них Доротея на Нікейському соборі, а саме місто стало митрополією провінції Августамніка. Монах Ісидор Пелусіот жив на горі поблизу міста й помер не пізніше 450 р.; збереглося близько двох тисяч його листів."
  es:
    - "Sin, «fortaleza de Egipto», se toma por lo común como Pelusio, la ciudad fortaleza que guardaba la frontera nororiental de Egipto en la desembocadura del brazo más oriental del Nilo, el pelusíaco, en el camino desde Gaza; la Vulgata traduce el nombre como Pelusium. El oráculo de Ezequiel contra Egipto la nombra dos veces con Tebas (No) y Menfis (Noph): «derramaré mi ira sobre Sin, fortaleza de Egipto, y talaré la multitud de No», y «Sin tendrá gran dolor»."
    - "Por ser la puerta de Egipto, allí se encontraron ejércitos. Heródoto sitúa en Pelusio el rechazo del ejército de Senaquerib en su relato de los ratones y la derrota del último faraón saíta por el rey persa Cambises en 525 a. C., y Pompeyo fue asesinado en la orilla cercana en 48 a. C. El lugar es Tell el-Farama, en el norte del Sinaí, al este de Port Said, donde excavaciones egipcias han sacado a la luz fortificaciones romanas y bizantinas, baños y un teatro."
    - "Estrabón describe Pelusio a más de veinte estadios del mar, rodeada de pantanos y charcas fangosas, con una muralla de veinte estadios de perímetro; su nombre griego venía de pelos, barro. Alejandro marchó de Gaza a Pelusio en siete días, encontró allí su flota y dejó una guarnición. En 55 a. C. Marco Antonio, al mando de la caballería del general romano Gabinio, ocupó el paso estrecho y tomó la ciudad, y Plutarco cuenta que impidió al rey Ptolomeo hacer una matanza de los egipcios de la ciudad. En época cristiana Pelusio tuvo obispos, entre ellos Doroteo en el concilio de Nicea, y llegó a ser la metrópoli de la provincia de Augustamnica. El monje Isidoro de Pelusio vivió en un monte cerca de la ciudad y murió hacia 450 a más tardar; se conservan unas dos mil cartas suyas."
  pt:
    - "Sim, “a fortaleza do Egito”, é geralmente tomada por Pelúsio, a cidade fortificada que guardava a fronteira nordeste do Egito na foz do braço mais oriental do Nilo, o pelusíaco, na estrada de Gaza; a Vulgata traduz o nome como Pelúsio. O oráculo de Ezequiel contra o Egito a nomeia duas vezes com Tebas (Nô) e Mênfis: “Eu derramarei a minha ira sobre Sim, a fortaleza do Egito. Eu eliminarei a multidão de Nô”, e “Sim estará em grande angústia”."
    - "Por ser a porta do Egito, exércitos se encontraram ali. Heródoto situa em Pelúsio a derrota do exército de Senaqueribe em sua história dos ratos e a do último faraó saíta pelo rei persa Cambises em 525 a.C., e Pompeu foi assassinado na praia vizinha em 48 a.C. O local é Tell el-Farama, no norte do Sinai, a leste de Porto Said, onde escavações egípcias trouxeram à luz fortificações romanas e bizantinas, banhos e um teatro."
    - "Estrabão descreve Pelúsio a mais de vinte estádios do mar, cercada de pântanos e poças lamacentas, com uma muralha de vinte estádios de perímetro; seu nome grego vinha de pelos, lama. Alexandre marchou de Gaza a Pelúsio em sete dias, encontrou ali sua frota e deixou uma guarnição. Em 55 a.C. Marco Antônio, no comando da cavalaria do general romano Gabínio, ocupou a passagem estreita e tomou a cidade, e Plutarco conta que ele impediu o rei Ptolomeu de massacrar os egípcios da cidade. Na época cristã Pelúsio teve bispos, entre eles Doroteu no concílio de Niceia, e tornou-se a metrópole da província de Augustâmnica. O monge Isidoro de Pelúsio viveu num monte perto da cidade e morreu por volta de 450, no mais tardar; conservam-se umas duas mil cartas suas."
  de:
    - "Sin, „die Festung Ägyptens“, gilt gewöhnlich als Pelusium, die Festungsstadt, die Ägyptens nordöstliche Grenze an der Mündung des östlichsten, pelusischen Nilarms an der Straße von Gaza bewachte; die Vulgata gibt den Namen mit Pelusium wieder. Hesekiels Spruch gegen Ägypten nennt es zweimal mit Theben (No) und Memphis (Noph): „und will meinen Grimm ausschütten über Sin, die Festung Ägyptens, und will die Menge zu No ausrotten“, und „Sin soll angst und bange werden“."
    - "Da es das Tor Ägyptens war, trafen dort Heere aufeinander. Herodot verlegt nach Pelusium die Abwehr von Sanheribs Heer in seiner Geschichte von den Mäusen und die Niederlage des letzten saitischen Pharaos gegen den Perserkönig Kambyses im Jahr 525 v. Chr., und Pompeius wurde 48 v. Chr. an der nahen Küste ermordet. Die Stätte ist Tell el-Farama im nördlichen Sinai, östlich von Port Said, wo ägyptische Grabungen römische und byzantinische Befestigungen, Bäder und ein Theater freigelegt haben."
    - "Strabon beschreibt Pelusium als mehr als zwanzig Stadien vom Meer entfernt, von Sümpfen und schlammigen Teichen umgeben, mit einer Mauer von zwanzig Stadien Umfang; der griechische Name kam von pelos, Schlamm. Alexander zog in sieben Tagen von Gaza nach Pelusium, fand dort seine Flotte vor und ließ eine Besatzung zurück. 55 v. Chr. besetzte Marcus Antonius als Befehlshaber der Reiterei des römischen Feldherrn Gabinius den engen Pass und nahm die Stadt, und Plutarch berichtet, er habe König Ptolemaios an einem Blutbad unter den Ägyptern gehindert. In christlicher Zeit hatte Pelusium Bischöfe, darunter Dorotheus auf dem Konzil von Nicäa, und wurde Metropole der Provinz Augustamnica. Der Mönch Isidor von Pelusium lebte auf einem Berg nahe der Stadt und starb spätestens um 450; rund zweitausend seiner Briefe sind erhalten."
  fr:
    - "Sin, « la forteresse de l’Égypte », est d’ordinaire identifiée à Péluse, la ville fortifiée qui gardait la frontière nord-est de l’Égypte à l’embouchure de la branche pélusiaque, la plus orientale du Nil, sur la route de Gaza ; la Vulgate traduit le nom par Pelusium. L’oracle d’Ézéchiel contre l’Égypte la nomme deux fois avec Thèbes (No) et Memphis (Noph) : « Je répandrai ma fureur sur Sin, la forteresse de l’Égypte, et j’exterminerai la multitude de No », et « Sin sera saisie d’angoisse »."
    - "Porte de l’Égypte, elle vit s’affronter des armées. Hérodote situe à Péluse la déroute de l’armée de Sanchérib dans son conte des souris et la défaite du dernier pharaon saïte par le roi perse Cambyse en 525 av. J.-C., et Pompée fut assassiné sur le rivage voisin en 48 av. J.-C. Le site est Tell el-Farama, dans le nord du Sinaï, à l’est de Port-Saïd, où des fouilles égyptiennes ont mis au jour des fortifications romaines et byzantines, des bains et un théâtre."
    - "Strabon décrit Péluse comme située à plus de vingt stades de la mer, entourée de marais et de mares boueuses, avec un rempart de vingt stades de tour ; son nom grec venait de pélos, la boue. Alexandre marcha de Gaza à Péluse en sept jours, y trouva sa flotte et y laissa une garnison. En 55 av. J.-C., Marc Antoine, qui commandait la cavalerie du général romain Gabinius, occupa le passage étroit et prit la ville, et Plutarque rapporte qu’il empêcha le roi Ptolémée de massacrer les Égyptiens. À l’époque chrétienne, Péluse eut des évêques, dont Dorothée au concile de Nicée, et devint la métropole de la province d’Augustamnique. Le moine Isidore de Péluse vécut sur une montagne près de la ville et mourut au plus tard vers 450 ; quelque deux mille de ses lettres subsistent."
  it:
    - "Sin, «la fortezza dell’Egitto», è di solito identificata con Pelusio, la città fortezza che custodiva la frontiera nord-orientale dell’Egitto alla foce del ramo più orientale del Nilo, il ramo pelusiaco, sulla strada da Gaza; la Vulgata traduce il nome con Pelusium. L’oracolo di Ezechiele contro l’Egitto la nomina due volte con Tebe (No) e Menfi (Nof): «riverserò il mio furore sopra Sin, la fortezza dell’Egitto, e sterminerò la moltitudine di No», e «Sin si torcerà dal dolore»."
    - "Essendo la porta dell’Egitto, vi si scontrarono eserciti. Erodoto colloca a Pelusio il respingimento dell’esercito di Sennacherib nel suo racconto dei topi e la sconfitta dell’ultimo faraone saita da parte del re persiano Cambise nel 525 a.C., e Pompeo fu assassinato sulla riva vicina nel 48 a.C. Il sito è Tell el-Farama, nel Sinai settentrionale, a est di Porto Said, dove scavi egiziani hanno portato alla luce fortificazioni romane e bizantine, bagni e un teatro."
    - "Strabone descrive Pelusio a più di venti stadi dal mare, circondata da paludi e stagni fangosi, con una cinta muraria di venti stadi; il nome greco veniva da pelos, fango. Alessandro marciò da Gaza a Pelusio in sette giorni, vi trovò la sua flotta e vi lasciò una guarnigione. Nel 55 a.C. Marco Antonio, al comando della cavalleria del generale romano Gabinio, occupò lo stretto passaggio e prese la città, e Plutarco racconta che impedì al re Tolomeo di massacrare gli Egiziani. In età cristiana Pelusio ebbe vescovi, tra cui Doroteo al concilio di Nicea, e divenne la metropoli della provincia di Augustamnica. Il monaco Isidoro di Pelusio visse su un monte vicino alla città e morì al più tardi verso il 450; restano circa duemila sue lettere."
  pl:
    - "Sin, „obronne miejsce Egipskie”, uchodzi zwykle za Peluzjum, twierdzę strzegącą północno-wschodniej granicy Egiptu u ujścia najbardziej wschodniego, peluzyjskiego ramienia Nilu, na drodze z Gazy; Wulgata tłumaczy tę nazwę jako Pelusium. Wyrocznia Ezechiela przeciw Egiptowi wymienia je dwa razy razem z No (Teby) i Nof (Memfis): „Wyleję też popędliwość moję na Syn, obronne miejsce Egipskie, a wytracę mnóstwo z No” oraz „Syn bolejąc boleć będzie”."
    - "Ponieważ było bramą Egiptu, spotykały się tam armie. Herodot umieszcza w Peluzjum odparcie armii Sennacheryba w opowieści o myszach oraz klęskę ostatniego faraona saickiego z rąk perskiego króla Kambyzesa w 525 roku p.n.e., a Pompejusz został zamordowany na pobliskim brzegu w 48 roku p.n.e. Stanowisko to Tell el-Farama w północnym Synaju, na wschód od Port Said, gdzie egipskie wykopaliska odsłoniły rzymskie i bizantyńskie fortyfikacje, łaźnie i teatr."
    - "Strabon opisuje Peluzjum jako położone ponad dwadzieścia stadiów od morza, otoczone bagnami i błotnistymi stawami, z murem o obwodzie dwudziestu stadiów; grecka nazwa pochodziła od słowa pelos, błoto. Aleksander przeszedł z Gazy do Peluzjum w siedem dni, zastał tam swoją flotę i zostawił załogę. W 55 roku p.n.e. Marek Antoniusz, dowodzący jazdą rzymskiego wodza Gabiniusza, zajął wąskie przejście i zdobył miasto, a Plutarch pisze, że powstrzymał króla Ptolemeusza od rzezi Egipcjan. W czasach chrześcijańskich Peluzjum miało biskupów, wśród nich Doroteusza na soborze nicejskim, i stało się metropolią prowincji Augustamnica. Mnich Izydor z Peluzjum żył na górze blisko miasta i zmarł najpóźniej około 450 roku; zachowało się około dwóch tysięcy jego listów."
  cs:
    - "Sín, jehož Ezechiel jmenuje „pevnost Egyptskou“, se obvykle ztotožňuje s Pelúsiem, pevnostním městem, které střežilo severovýchodní hranici Egypta u ústí nejvýchodnějšího, pelúsijského ramene Nilu, na cestě z Gazy; Vulgáta jméno překládá jako Pelusium. Ezechielova věštba proti Egyptu jej jmenuje dvakrát s Thébami (No) a Memfidou (Nof): „Vyleji prchlivost svou i na Sin, pevnost Egyptskou, a vypléním množství No“, a „velikou bolest bude míti Sin“."
    - "Protože byl branou Egypta, setkávala se tam vojska. Hérodotos klade k Pelúsiu odražení Senacheribova vojska v pověsti o myších i porážku posledního sajského faraona perským králem Kambýsem roku 525 př. n. l. a Pompeius byl zavražděn na nedalekém břehu roku 48 př. n. l. Místo je Tell el-Farama v severním Sinaji, východně od Port Saídu, kde egyptské vykopávky odkryly římské a byzantské opevnění, lázně a divadlo."
    - "Strabón popisuje Pelúsium jako město vzdálené víc než dvacet stadií od moře, obklopené bažinami a bahnitými tůněmi, s hradbou o obvodu dvaceti stadií; řecké jméno dostalo od slova pélos, bláto. Alexandr došel z Gazy do Pelúsia za sedm dní, zastihl tam své loďstvo a zanechal posádku. Roku 55 př. n. l. obsadil Marcus Antonius jako velitel jízdy římského vojevůdce Gabinia úzký průsmyk a dobyl město a Plútarchos píše, že zabránil králi Ptolemaiovi v masakru Egypťanů. V křesťanské době mělo Pelúsium biskupy, mezi nimi Dorothea na nicejském koncilu, a stalo se metropolí provincie Augustamnica. Mnich Isidor z Pelúsia žil na hoře nedaleko města a zemřel nejpozději kolem roku 450; dochovalo se asi dva tisíce jeho dopisů."
  nl:
    - "Sin, “de sterkte van Egypte”, wordt meestal gelijkgesteld met Pelusium, de vestingstad die Egyptes noordoostelijke grens bewaakte bij de monding van de oostelijkste, Pelusische arm van de Nijl, aan de weg vanuit Gaza; de Vulgaat vertaalt de naam als Pelusium. Ezechiëls godsspraak tegen Egypte noemt haar tweemaal met Thebe (No) en Memfis (Nof): “Ik zal Mijn grimmigheid uitgieten over Sin, de sterkte van Egypte; en Ik zal de menigte van No uitroeien”, en “Sin zal zeer grote pijn hebben”."
    - "Omdat het de poort van Egypte was, ontmoetten legers elkaar daar. Herodotus plaatst bij Pelusium de terugdrijving van Sanheribs leger in zijn verhaal van de muizen en de nederlaag van de laatste Saïtische farao tegen de Perzische koning Cambyses in 525 v.Chr., en Pompeius werd in 48 v.Chr. op de nabijgelegen oever vermoord. De plaats is Tell el-Farama in het noorden van de Sinaï, ten oosten van Port Said, waar Egyptische opgravingen Romeinse en Byzantijnse vestingwerken, baden en een theater hebben blootgelegd."
    - "Strabo beschrijft Pelusium als gelegen op meer dan twintig stadiën van zee, omringd door moerassen en modderige poelen, met een muur van twintig stadiën in omtrek; de Griekse naam kwam van pelos, modder. Alexander trok in zeven dagen van Gaza naar Pelusium, trof er zijn vloot aan en liet er een garnizoen achter. In 55 v.Chr. bezette Marcus Antonius, bevelhebber van de ruiterij van de Romeinse veldheer Gabinius, de smalle doorgang en nam de stad in, en Plutarchus vertelt dat hij koning Ptolemaeus belette de Egyptenaren af te slachten. In christelijke tijd had Pelusium bisschoppen, onder wie Dorotheus op het concilie van Nicea, en werd het de metropool van de provincie Augustamnica. De monnik Isidorus van Pelusium leefde op een berg bij de stad en stierf uiterlijk rond 450; er zijn zo'n tweeduizend brieven van hem bewaard."
  sv:
    - "Sin, ”Egyptens värn”, antas vanligen vara Pelusium, fästningsstaden som vaktade Egyptens nordöstra gräns vid mynningen av den östligaste, pelusiska grenen av Nilen, på vägen från Gaza; Vulgata översätter namnet som Pelusium. Hesekiels orakel mot Egypten nämner den två gånger tillsammans med Thebe (No) och Memfis (Nof): ”Och jag skall utgjuta min vrede över Sin, Egyptens värn, och utrota den larmande hopen i No”, och ”Sin skall gripas av ångest”."
    - "Eftersom det var Egyptens port möttes arméer där. Herodotos förlägger till Pelusium avvisandet av Sanheribs armé i sin berättelse om mössen och den siste saitiske faraons nederlag mot den persiske kungen Kambyses 525 f.Kr., och Pompejus mördades på stranden i närheten 48 f.Kr. Platsen är Tell el-Farama i norra Sinai, öster om Port Said, där egyptiska utgrävningar har frilagt romerska och bysantinska befästningar, bad och en teater."
    - "Strabon beskriver Pelusium som beläget mer än tjugo stadier från havet, omgivet av träsk och gyttjiga dammar, med en mur som var tjugo stadier runt; det grekiska namnet kom av pelos, gyttja. Alexander tågade från Gaza till Pelusium på sju dagar, fann sin flotta där och lämnade en garnison. År 55 f.Kr. besatte Marcus Antonius, som förde befälet över den romerske fältherren Gabinius rytteri, det smala passet och intog staden, och Plutarchos berättar att han hindrade kung Ptolemaios från att massakrera egyptierna. Under kristen tid hade Pelusium biskopar, bland dem Dorotheos vid konciliet i Nicaea, och blev metropol för provinsen Augustamnica. Munken Isidoros av Pelusium levde på ett berg nära staden och dog senast omkring 450; omkring tvåtusen av hans brev finns bevarade."
  nb:
    - "Sin, «Egyptens sterke vern», antas vanligvis å være Pelusium, festningsbyen som voktet Egypts nordøstlige grense ved munningen av den østligste, pelusiske armen av Nilen, på veien fra Gasa; Vulgata oversetter navnet som Pelusium. Esekiels orakel mot Egypt nevner det to ganger sammen med Teben (No) og Memfis (Nof): «Jeg vil utøse min harme over Sin, Egyptens sterke vern, og jeg vil utrydde den larmende hop i No», og «Sin skal skjelve og beve»."
    - "Fordi det var Egypts port, møttes hærer der. Herodot plasserer ved Pelusium avvisningen av Sankeribs hær i sin fortelling om musene og nederlaget til den siste saittiske faraoen mot den persiske kongen Kambyses i 525 f.Kr., og Pompeius ble myrdet på stranden i nærheten i 48 f.Kr. Stedet er Tell el-Farama i nordlige Sinai, øst for Port Said, der egyptiske utgravninger har avdekket romerske og bysantinske festningsverk, bad og et teater."
    - "Strabon beskriver Pelusium som liggende mer enn tjue stadier fra havet, omgitt av myrer og gjørmete dammer, med en mur på tjue stadier rundt; det greske navnet kom av pelos, gjørme. Aleksander marsjerte fra Gasa til Pelusium på sju dager, fant flåten sin der og etterlot en garnison. I 55 f.Kr. besatte Marcus Antonius, som førte rytteriet til den romerske hærføreren Gabinius, det smale passet og inntok byen, og Plutark forteller at han hindret kong Ptolemaios i å massakrere egypterne. I kristen tid hadde Pelusium biskoper, blant dem Dorotheos ved konsilet i Nikea, og ble metropol for provinsen Augustamnica. Munken Isidor av Pelusium levde på et fjell nær byen og døde senest rundt 450; rundt to tusen av brevene hans er bevart."
  tl:
    - "Ang Sin, “katibayan ng Egipto”, ay karaniwang itinuturing na Pelusium, ang bayang kuta na nagbabantay sa hilagang-silangang hangganan ng Egipto sa bunganga ng pinakasilangang sangang Pelusiaco ng Nilo, sa daan mula sa Gaza; isinasalin ng Vulgata ang pangalan bilang Pelusium. Pinangalanan ito ng orakulo ni Ezekiel laban sa Egipto nang dalawang ulit kasama ng Thebes (No) at Memfis (Noph): “aking ibubugso ang aking kapusukan sa Sin, na katibayan ng Egipto; at aking ihihiwalay ang karamihan ng mga taga No”, at “ang Sin ay malalagay sa malaking kadalamhatian”."
    - "Dahil ito ang pintuan ng Egipto, nagtagpo roon ang mga hukbo. Inilalagay ni Herodotus sa Pelusium ang pagtataboy sa hukbo ni Sennacherib sa kaniyang kuwento ng mga daga at ang pagkatalo ng huling faraon ng Saite sa haring Persiyano na si Cambises noong 525 BK, at pinatay si Pompeyo sa dalampasigan sa malapit noong 48 BK. Ang lugar ay ang Tell el-Farama sa hilagang Sinai, sa silangan ng Port Said, kung saan nahukay ng mga paghuhukay ng Egipto ang mga kutang Romano at Bisantino, paliguan at teatro."
    - "Ayon kay Strabo, ang Pelusium ay higit dalawampung estadyo mula sa dagat, napalilibutan ng latian at maputik na lawa, at may pader na dalawampung estadyo ang ikot; galing ang pangalang Griego nito sa pelos, putik. Mula Gaza, narating ni Alejandro ang Pelusium sa pitong araw, dinatnan doon ang kaniyang plota at nag-iwan ng himpilan ng kawal. Noong 55 BK, sinakop ni Marco Antonio, pinuno ng kabalyeriya ng Romanong heneral na si Gabinio, ang makitid na daanan at ang lungsod, at sinasabi ni Plutarco na pinigilan niya si haring Ptolomeo na patayin nang maramihan ang mga Egipcio. Sa panahong Kristiyano may mga obispo ang Pelusium, kabilang si Doroteo sa konsilyo ng Nicea, at naging metropoli ito ng lalawigan ng Augustamnica. Namuhay ang monghe na si Isidoro ng Pelusium sa bundok malapit sa lungsod at namatay nang hindi lalampas sa mga 450; mga dalawang libo sa kaniyang liham ang natitira."
  da:
    - "Sin, »Ægypternes Fæstning«, tages sædvanligvis for Pelusium, fæstningsbyen, der vogtede Egyptens nordøstlige grænse ved udmundingen af den østligste, pelusiske flodarm af Nilen, på vejen fra Gaza; Vulgata gengiver navnet som Pelusium. Ezekiels udsagn mod Egypten nævner den to gange sammen med Theben (No) og Memfis (Nof): »Og jeg vil udøse min Harme over Sin, Ægypternes Fæstning, og udrydde Mængden i No«, og »Sin skal vaande sig i Smerte«."
    - "Fordi den var Egyptens port, mødtes hære dér. Herodot placerer i Pelusium afvisningen af Sankeribs hær i sin fortælling om musene og den sidste saitiske farao Psamtiks nederlag til den persiske konge Kambyses i 525 f.Kr., og Pompejus blev myrdet på kysten i nærheden i 48 f.Kr. Stedet er Tell el-Farama i det nordlige Sinai, øst for Port Said, hvor egyptiske udgravninger har afdækket romerske og byzantinske befæstninger, bade og et teater."
    - "Strabon beskriver Pelusium som beliggende mere end tyve stadier fra havet, omgivet af sumpe og mudrede damme, med en mur på tyve stadier rundt; det græske navn kom af pelos, mudder. Alexander marcherede fra Gaza til Pelusium på syv dage, fandt sin flåde dér og efterlod en garnison. I 55 f.Kr. besatte Marcus Antonius, der førte rytteriet for den romerske hærfører Gabinius, det smalle pas og indtog byen, og Plutarch fortæller, at han forhindrede kong Ptolemaios i at massakrere egypterne. I kristen tid havde Pelusium biskopper, blandt dem Dorotheos ved koncilet i Nikæa, og blev metropol for provinsen Augustamnica. Munken Isidor af Pelusium levede på et bjerg nær byen og døde senest omkring 450; omkring to tusind af hans breve er bevaret."
  sr:
    - "Син, „град мисирски“, обично се узима за Пелусион, тврђавски град који је чувао североисточну границу Египта на ушћу најисточнијег, пелусијског крака Нила, на путу из Газе; Вулгата име и преводи као Пелусион. Језекиљево пророштво против Египта именује га двапут с Тебом (Но) и Мемфисом (Ноф): „И излићу гнев свој на Син, град мисирски, и истребићу људство у Нову“, и „љуто ће се узмучити Син“."
    - "Пошто је био врата Египта, ту су се сретале војске. Херодот код Пелусиона смешта одбијање Сенахиримове војске у својој причи о мишевима и пораз последњег сајског фараона од персијског цара Камбиза 525. п. н. е., а Помпеј је на обали у близини убијен 48. п. н. е. Место је Тел ел-Фарама у северном Синају, источно од Порт Саида, где су египатска ископавања открила римска и византијска утврђења, купатила и позориште."
    - "Страбон описује Пелусион као град удаљен више од двадесет стадија од мора, окружен мочварама и муљевитим барама, са зидом обима двадесет стадија; грчко име добио је од речи пелос, блато. Александар је из Газе стигао до Пелусиона за седам дана, затекао тамо своју флоту и оставио посаду. Године 55. п. н. е. Марко Антоније, као заповедник коњице римског војсковође Габинија, заузео је уски пролаз и освојио град, а Плутарх пише да је спречио цара Птолемеја да покоље Египћане. У хришћанско доба Пелусион је имао епископе, међу њима Доротеја на Никејском сабору, и постао је митрополија провинције Августамника. Монах Исидор Пелусиот живео је на гори близу града и умро најкасније око 450. године; сачувано је око две хиљаде његових писама."
  hu:
    - "Szín, Egyiptom erőssége, általában Pelusiummal azonosítják, azzal az erődvárossal, amely Egyiptom északkeleti határát őrizte a legkeletibb, pelusiumi Nílus-ág torkolatánál, a Gázából vezető úton; a Vulgata a nevet Pelusiumnak fordítja. Ezékiel Egyiptom elleni jövendölése kétszer említi Thébával (Nó) és Memphisszel (Nóf) együtt: „kiöntöm haragomat Sinre, Égyiptom erősségére, és kivágom a sokaságot Nóból”, valamint „kínok közt vergődik Sin”."
    - "Mivel Egyiptom kapuja volt, seregek találkoztak ott. Hérodotosz Pelusiumba helyezi Szanhérib seregének visszaverését az egerekről szóló történetében, valamint az utolsó szaiszi fáraó vereségét a perzsa király, Kambüszész ellen Kr. e. 525-ben, Pompeiust pedig Kr. e. 48-ban a közeli parton gyilkolták meg. A hely Tell el-Farama Észak-Szinájban, Port Saidtól keletre, ahol egyiptomi ásatások római és bizánci erődítményeket, fürdőket és színházat tártak fel."
    - "Sztrabón szerint Pelusium több mint húsz sztadionnyira fekszik a tengertől, mocsarak és iszapos tavak veszik körül, fala húsz sztadion kerületű; görög nevét a pélosz, azaz iszap szóról kapta. Nagy Sándor hét nap alatt vonult Gázából Pelusiumba, ott találta flottáját, és helyőrséget hagyott a városban. Kr. e. 55-ben Marcus Antonius, Gabinius római hadvezér lovasságának parancsnoka, elfoglalta a szűk átjárót és bevette a várost, Plutarkhosz pedig elmondja, hogy megakadályozta Ptolemaiosz királyt az egyiptomiak lemészárlásában. A keresztény korban Pelusiumnak püspökei voltak, köztük Dorotheosz a niceai zsinaton, és a város Augustamnica provincia metropolisza lett. Pelusiumi Izidor szerzetes a város közelében egy hegyen élt, és legkésőbb 450 körül halt meg; mintegy kétezer levele maradt fenn."
  fi:
    - "Sin, ”Egyptin linnoitus”, katsotaan yleensä Pelusiumiksi, linnoituskaupungiksi, joka vartioi Egyptin koillisrajaa Niilin itäisimmän, Pelusiumin haaran suulla Gazasta tulevan tien varrella; Vulgata kääntää nimen Pelusiumiksi. Hesekielin Egyptiä koskeva ennustus mainitsee sen kahdesti Teeban (Noo) ja Memfisin (Noof) kanssa: ”Minä vuodatan kiivauteni Siiniin, Egyptin linnoitukseen, hävitän Noon meluavat joukot”, ja ”Siin kierii tuskassa”."
    - "Koska se oli Egyptin portti, armeijat kohtasivat siellä. Herodotos sijoittaa Pelusiumiin Sanheribin armeijan torjumisen hiiritarinassaan ja viimeisen saislaisen faraon tappion Persian kuninkaalle Kambyseelle vuonna 525 eaa., ja Pompeius murhattiin läheisellä rannalla vuonna 48 eaa. Paikka on Tell el-Farama Pohjois-Siinailla Port Saidista itään, missä egyptiläiset kaivaukset ovat paljastaneet roomalaisen ja bysanttilaisen ajan linnoituksia, kylpylöitä ja teatterin."
    - "Strabon kuvaa Pelusiumin sijaitsevan yli kahdenkymmenen stadionin päässä merestä soiden ja mutaisten lampien ympäröimänä, ja sen muurin ympärysmitta oli kaksikymmentä stadionia; kreikkalainen nimi tuli sanasta pelos, muta. Aleksanteri marssi Gazasta Pelusiumiin seitsemässä päivässä, tapasi siellä laivastonsa ja jätti kaupunkiin varuskunnan. Vuonna 55 eaa. Marcus Antonius, roomalaisen sotapäällikön Gabiniuksen ratsuväen komentaja, valtasi kapean solan ja kaupungin, ja Plutarkhos kertoo hänen estäneen kuningas Ptolemaiosta surmaamasta egyptiläisiä joukoittain. Kristillisellä ajalla Pelusiumilla oli piispoja, heidän joukossaan Dorotheos Nikean kirkolliskokouksessa, ja siitä tuli Augustamnican provinssin metropoli. Munkki Isidoros Pelusiumilainen eli vuorella kaupungin lähellä ja kuoli viimeistään noin vuonna 450; hänen kirjeitään on säilynyt noin kaksituhatta."
  vi:
    - "Sin, “thành vững bền của Ê-díp-tô”, thường được cho là Pelusium, thị trấn pháo đài canh giữ biên giới đông bắc của Ê-díp-tô tại cửa nhánh cực đông của sông Ni-lơ, nhánh Pelusiac, trên đường từ Ga-xa; bản Vulgate dịch tên này là Pelusium. Lời sấm của Ê-xê-chi-ên nghịch cùng Ê-díp-tô nêu nó hai lần cùng Nô (Thebes) và Mem-phi (Nốp): “Ta sẽ đổ cơn giận ta trên Sin, là thành vững bền của Ê-díp-tô, và sẽ diệt dân chúng của Nô”, và “Sin sẽ bị đau đớn cả thể”."
    - "Vì là cổng của Ê-díp-tô, các đạo quân đã gặp nhau ở đó. Herodotus đặt tại Pelusium việc đẩy lui quân của San-chê-ríp trong chuyện chuột của ông và việc vua Ba Tư Cambyses đánh bại pharaô Saite cuối cùng năm 525 TCN, và Pompey bị giết trên bờ biển gần đó năm 48 TCN. Địa điểm là Tell el-Farama ở bắc Sinai, phía đông Port Said, nơi các cuộc khai quật của Ai Cập đã phát hiện công sự thời La Mã và Byzantine, nhà tắm và một nhà hát."
    - "Strabo mô tả Pelusium nằm cách biển hơn hai mươi stadia, bao quanh bởi đầm lầy và ao bùn, với tường thành chu vi hai mươi stadia; tên Hy Lạp của nó đến từ chữ pelos, nghĩa là bùn. Alexander hành quân từ Ga-xa đến Pelusium trong bảy ngày, gặp hạm đội của mình đã ở đó và để lại một đội đồn trú. Năm 55 TCN, Mark Antony, chỉ huy kỵ binh của tướng La Mã Gabinius, chiếm lối đi hẹp và lấy thành, và Plutarch kể rằng ông đã ngăn vua Ptolemy tàn sát người Ai Cập. Vào thời Cơ Đốc giáo, Pelusium có các giám mục, trong đó có Dorotheus tại công đồng Nicaea, và thành trở thành thủ phủ của tỉnh Augustamnica. Tu sĩ Isidore thành Pelusium sống trên một ngọn núi gần thành và qua đời muộn nhất vào khoảng năm 450; khoảng hai nghìn lá thư của ông còn được lưu giữ."
  ro:
    - "Sin, „tăria Egiptului”, este identificat de obicei cu Pelusiu, cetatea-fortăreață care păzea granița nord-estică a Egiptului la gura brațului celui mai estic al Nilului, brațul pelusiac, pe drumul dinspre Gaza; Vulgata traduce numele prin Pelusium. Oracolul lui Ezechiel împotriva Egiptului îl numește de două ori, alături de Teba (No) și Memfis (Nof): „Și voiu vărsa mâniea mea preste Sain tăriea Eghipetului, și voiu pierde mulțimea Memfii”, iar Sin va avea mare durere."
    - "Fiind poarta Egiptului, armatele se întâlneau acolo. Herodot așază la Pelusiu respingerea armatei lui Senaherib în povestea cu șoarecii și înfrângerea ultimului faraon saitic de către regele persan Cambise în 525 î.Hr., iar Pompei a fost ucis pe țărmul din apropiere în 48 î.Hr. Locul este Tell el-Farama din nordul Sinaiului, la est de Port Said, unde săpături egiptene au scos la iveală fortificații romane și bizantine, băi și un teatru."
    - "Strabon descrie Pelusiul ca aflându-se la peste douăzeci de stadii de mare, înconjurat de mlaștini și de bălți noroioase, cu un zid de douăzeci de stadii de jur împrejur; numele grecesc venea de la pelos, noroi. Alexandru a mers de la Gaza la Pelusiu în șapte zile, și-a găsit acolo flota și a lăsat o garnizoană. În 55 î.Hr. Marcus Antonius, comandantul cavaleriei generalului roman Gabinius, a ocupat trecătoarea îngustă și a cucerit orașul, iar Plutarh spune că l-a împiedicat pe regele Ptolemeu să-i măcelărească pe egipteni. În epoca creștină Pelusiul a avut episcopi, între ei Dorotei la sinodul de la Niceea, și a devenit mitropolia provinciei Augustamnica. Călugărul Isidor Pelusiotul a trăit pe un munte lângă oraș și a murit cel târziu pe la 450; s-au păstrat circa două mii de scrisori ale sale."
  bg:
    - "Син, „крепостта на Египет“, обикновено се смята за Пелузий — крепостния град, който пазел североизточната граница на Египет при устието на най-източния, Пелузийски ръкав на Нил, по пътя от Газа; Вулгата превежда името като Пелузий. Пророчеството на Йезекиил против Египет го назовава два пъти заедно с Тива (Но) и Мемфис (Ноф): „ще излея яростта си върх Син, крепостта на Египет, и ще изсека множеството на Но“ и „Син ще вземе голямо треперане“."
    - "Тъй като бил вратата на Египет, войски се срещали там. Херодот поставя при Пелузий отблъскването на войската на Сенахирим в разказа си за мишките и поражението на последния саиски фараон от персийския цар Камбиз през 525 г. пр.н.е., а Помпей бил убит на брега наблизо през 48 г. пр.н.е. Мястото е Тел ел-Фарама в Северен Синай, на изток от Порт Саид, където египетски разкопки са разкрили римски и византийски укрепления, бани и театър."
    - "Страбон описва Пелузий като град на повече от двадесет стадия от морето, обграден от блата и тинести езерца, със стена от двадесет стадия обиколка; гръцкото си име получил от думата пелос, кал. Александър стигнал от Газа до Пелузий за седем дни, заварил там флота си и оставил гарнизон. През 55 г. пр.н.е. Марк Антоний, начело на конницата на римския пълководец Габиний, завзел тесния проход и превзел града, а Плутарх разказва, че попречил на цар Птолемей да избие египтяните. В християнската епоха Пелузий имал епископи, сред тях Доротей на Никейския събор, и станал митрополия на провинция Августамника. Монахът Исидор Пелусиот живял на планина близо до града и починал най-късно към 450 г.; запазени са около две хиляди негови писма."
