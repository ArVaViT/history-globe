# Overview article (ADR 0007). Mainstream facts only; Sin of Ezekiel, the frontier fortress of Pelusium; mainstream facts only.
id: pelusium
place: aa32a17
title:
  en: "Pelusium"
  ru: "Син"
  uk: "Сін"
  es: "Pelusio"
  pt: "Pelúsio"
  de: "Pelusium"
  fr: "Péluse"
  it: "Pelusio"
  pl: "Peluzjum"
  cs: "Pelúsium"
  nl: "Pelusium"
body:
  en:
    - "Sin, “the strength of Egypt”, is usually taken to be Pelusium, the fortress town that guarded Egypt's north-eastern frontier at the mouth of the easternmost, Pelusiac branch of the Nile, on the road from Gaza; the Vulgate translates the name as Pelusium. Ezekiel's oracle against Egypt names it twice with Thebes (No) and Memphis (Noph): “I will pour my fury upon Sin, the strength of Egypt; and I will cut off the multitude of No”, and “Sin shall have great pain”."
    - "Because it was the gate of Egypt, armies met there. Herodotus places at Pelusium the repulse of Sennacherib's army in his tale of the mice and the defeat of the last Saite pharaoh by the Persian king Cambyses in 525 BC, and Pompey was murdered on the shore nearby in 48 BC. The site is Tell el-Farama in northern Sinai, east of Port Said, where Egyptian excavations have uncovered Roman and Byzantine fortifications, baths and a theatre."
  ru:
    - "Син, «крепость Египта», обычно отождествляют с Пелусием — городом-крепостью, охранявшим северо-восточную границу Египта у устья самого восточного, Пелусийского рукава Нила, на дороге из Газы; Вульгата так и переводит имя: Пелусий. Пророчество Иезекииля о Египте называет его дважды вместе с Фивами (Но) и Мемфисом: «И изолью ярость Мою на Син, крепость Египта, и истреблю многолюдие в Но» и «вострепещет Син»."
    - "Будучи воротами Египта, Пелусий видел много войск. Геродот помещает у Пелусия отражение войска Сеннахирима в своём рассказе о мышах и поражение последнего саисского фараона от персидского царя Камбиза в 525 г. до н. э., а на берегу неподалёку в 48 г. до н. э. был убит Помпей. Место — Телль-эль-Фарама на севере Синая, к востоку от Порт-Саида, где египетские раскопки открыли римские и византийские укрепления, бани и театр. Синодальное имя «Син» не надо путать с пустыней Син."
  uk:
    - "Сін, твердиню Єгипту, зазвичай ототожнюють із Пелусієм — містом-фортецею, що охороняло північно-східний кордон Єгипту біля гирла найсхіднішого, Пелусійського рукава Нілу, на дорозі від Гази; Вульгата так і передає назву: Пелусій. Пророцтво Єзекіїля проти Єгипту двічі називає його разом із Фівами (Но) та Мемфісом (Ноф): «І вилию гнїв мій на Син, твердиню Египецьку, й вигублю натовп людей в Но» і «задрожить Син»."
    - "Будучи брамою Єгипту, він бачив зустрічі армій. Геродот поміщає в Пелусії відбиття війська Сінаххеріба в своїй оповіді про мишей і поразку останнього фараона Саїської династії від перського царя Камбіза 525 р. до н. е., а на березі поблизу 48 р. до н. е. було вбито Помпея. Місце — Телль-ель-Фарама на півночі Синаю, на схід від Порт-Саїда, де єгипетські розкопки відкрили римські й візантійські укріплення, лазні та театр."
  es:
    - "Sin, «fortaleza de Egipto», se toma por lo común como Pelusio, la ciudad fortaleza que guardaba la frontera nororiental de Egipto en la desembocadura del brazo más oriental del Nilo, el pelusíaco, en el camino desde Gaza; la Vulgata traduce el nombre como Pelusium. El oráculo de Ezequiel contra Egipto la nombra dos veces con Tebas (No) y Menfis (Noph): «derramaré mi ira sobre Sin, fortaleza de Egipto, y talaré la multitud de No», y «Sin tendrá gran dolor»."
    - "Por ser la puerta de Egipto, allí se encontraron ejércitos. Heródoto sitúa en Pelusio el rechazo del ejército de Senaquerib en su relato de los ratones y la derrota del último faraón saíta por el rey persa Cambises en 525 a. C., y Pompeyo fue asesinado en la orilla cercana en 48 a. C. El lugar es Tell el-Farama, en el norte del Sinaí, al este de Port Said, donde excavaciones egipcias han sacado a la luz fortificaciones romanas y bizantinas, baños y un teatro."
  pt:
    - "Sim, “a fortaleza do Egito”, é geralmente tomada por Pelúsio, a cidade fortificada que guardava a fronteira nordeste do Egito na foz do braço mais oriental do Nilo, o pelusíaco, na estrada de Gaza; a Vulgata traduz o nome como Pelúsio. O oráculo de Ezequiel contra o Egito a nomeia duas vezes com Tebas (Nô) e Mênfis: “Eu derramarei a minha ira sobre Sim, a fortaleza do Egito. Eu eliminarei a multidão de Nô”, e “Sim estará em grande angústia”."
    - "Por ser a porta do Egito, exércitos se encontraram ali. Heródoto situa em Pelúsio a derrota do exército de Senaqueribe em sua história dos ratos e a do último faraó saíta pelo rei persa Cambises em 525 a.C., e Pompeu foi assassinado na praia vizinha em 48 a.C. O local é Tell el-Farama, no norte do Sinai, a leste de Porto Said, onde escavações egípcias trouxeram à luz fortificações romanas e bizantinas, banhos e um teatro."
  de:
    - "Sin, „die Festung Ägyptens“, gilt gewöhnlich als Pelusium, die Festungsstadt, die Ägyptens nordöstliche Grenze an der Mündung des östlichsten, pelusischen Nilarms an der Straße von Gaza bewachte; die Vulgata gibt den Namen mit Pelusium wieder. Hesekiels Spruch gegen Ägypten nennt es zweimal mit Theben (No) und Memphis (Noph): „und will meinen Grimm ausschütten über Sin, die Festung Ägyptens, und will die Menge zu No ausrotten“, und „Sin soll angst und bange werden“."
    - "Da es das Tor Ägyptens war, trafen dort Heere aufeinander. Herodot verlegt nach Pelusium die Abwehr von Sanheribs Heer in seiner Geschichte von den Mäusen und die Niederlage des letzten saitischen Pharaos gegen den Perserkönig Kambyses im Jahr 525 v. Chr., und Pompeius wurde 48 v. Chr. an der nahen Küste ermordet. Die Stätte ist Tell el-Farama im nördlichen Sinai, östlich von Port Said, wo ägyptische Grabungen römische und byzantinische Befestigungen, Bäder und ein Theater freigelegt haben."
  fr:
    - "Sin, « la forteresse de l’Égypte », est d’ordinaire identifiée à Péluse, la ville fortifiée qui gardait la frontière nord-est de l’Égypte à l’embouchure de la branche pélusiaque, la plus orientale du Nil, sur la route de Gaza ; la Vulgate traduit le nom par Pelusium. L’oracle d’Ézéchiel contre l’Égypte la nomme deux fois avec Thèbes (No) et Memphis (Noph) : « Je répandrai ma fureur sur Sin, la forteresse de l’Égypte, et j’exterminerai la multitude de No », et « Sin sera saisie d’angoisse »."
    - "Porte de l’Égypte, elle vit s’affronter des armées. Hérodote situe à Péluse la déroute de l’armée de Sanchérib dans son conte des souris et la défaite du dernier pharaon saïte par le roi perse Cambyse en 525 av. J.-C., et Pompée fut assassiné sur le rivage voisin en 48 av. J.-C. Le site est Tell el-Farama, dans le nord du Sinaï, à l’est de Port-Saïd, où des fouilles égyptiennes ont mis au jour des fortifications romaines et byzantines, des bains et un théâtre."
  it:
    - "Sin, «la fortezza dell’Egitto», è di solito identificata con Pelusio, la città fortezza che custodiva la frontiera nord-orientale dell’Egitto alla foce del ramo più orientale del Nilo, il ramo pelusiaco, sulla strada da Gaza; la Vulgata traduce il nome con Pelusium. L’oracolo di Ezechiele contro l’Egitto la nomina due volte con Tebe (No) e Menfi (Nof): «riverserò il mio furore sopra Sin, la fortezza dell’Egitto, e sterminerò la moltitudine di No», e «Sin si torcerà dal dolore»."
    - "Essendo la porta dell’Egitto, vi si scontrarono eserciti. Erodoto colloca a Pelusio il respingimento dell’esercito di Sennacherib nel suo racconto dei topi e la sconfitta dell’ultimo faraone saita da parte del re persiano Cambise nel 525 a.C., e Pompeo fu assassinato sulla riva vicina nel 48 a.C. Il sito è Tell el-Farama, nel Sinai settentrionale, a est di Porto Said, dove scavi egiziani hanno portato alla luce fortificazioni romane e bizantine, bagni e un teatro."
  pl:
    - "Sin, „obronne miejsce Egipskie”, uchodzi zwykle za Peluzjum, twierdzę strzegącą północno-wschodniej granicy Egiptu u ujścia najbardziej wschodniego, peluzyjskiego ramienia Nilu, na drodze z Gazy; Wulgata tłumaczy tę nazwę jako Pelusium. Wyrocznia Ezechiela przeciw Egiptowi wymienia je dwa razy razem z No (Teby) i Nof (Memfis): „Wyleję też popędliwość moję na Syn, obronne miejsce Egipskie, a wytracę mnóstwo z No” oraz „Syn bolejąc boleć będzie”."
    - "Ponieważ było bramą Egiptu, spotykały się tam armie. Herodot umieszcza w Peluzjum odparcie armii Sennacheryba w opowieści o myszach oraz klęskę ostatniego faraona saickiego z rąk perskiego króla Kambyzesa w 525 roku p.n.e., a Pompejusz został zamordowany na pobliskim brzegu w 48 roku p.n.e. Stanowisko to Tell el-Farama w północnym Synaju, na wschód od Port Said, gdzie egipskie wykopaliska odsłoniły rzymskie i bizantyńskie fortyfikacje, łaźnie i teatr."
  cs:
    - "Sín, jehož Ezechiel jmenuje „pevnost Egyptskou“, se obvykle ztotožňuje s Pelúsiem, pevnostním městem, které střežilo severovýchodní hranici Egypta u ústí nejvýchodnějšího, pelúsijského ramene Nilu, na cestě z Gazy; Vulgáta jméno překládá jako Pelusium. Ezechielova věštba proti Egyptu jej jmenuje dvakrát s Thébami (No) a Memfidou (Nof): „Vyleji prchlivost svou i na Sin, pevnost Egyptskou, a vypléním množství No“, a „velikou bolest bude míti Sin“."
    - "Protože byl branou Egypta, setkávala se tam vojska. Hérodotos klade k Pelúsiu odražení Senacheribova vojska v pověsti o myších i porážku posledního sajského faraona perským králem Kambýsem roku 525 př. n. l. a Pompeius byl zavražděn na nedalekém břehu roku 48 př. n. l. Místo je Tell el-Farama v severním Sinaji, východně od Port Saídu, kde egyptské vykopávky odkryly římské a byzantské opevnění, lázně a divadlo."
  nl:
    - "Sin, “de sterkte van Egypte”, wordt meestal gelijkgesteld met Pelusium, de vestingstad die Egyptes noordoostelijke grens bewaakte bij de monding van de oostelijkste, Pelusische arm van de Nijl, aan de weg vanuit Gaza; de Vulgaat vertaalt de naam als Pelusium. Ezechiëls godsspraak tegen Egypte noemt haar tweemaal met Thebe (No) en Memfis (Nof): “Ik zal Mijn grimmigheid uitgieten over Sin, de sterkte van Egypte; en Ik zal de menigte van No uitroeien”, en “Sin zal zeer grote pijn hebben”."
    - "Omdat het de poort van Egypte was, ontmoetten legers elkaar daar. Herodotus plaatst bij Pelusium de terugdrijving van Sanheribs leger in zijn verhaal van de muizen en de nederlaag van de laatste Saïtische farao tegen de Perzische koning Cambyses in 525 v.Chr., en Pompeius werd in 48 v.Chr. op de nabijgelegen oever vermoord. De plaats is Tell el-Farama in het noorden van de Sinaï, ten oosten van Port Said, waar Egyptische opgravingen Romeinse en Byzantijnse vestingwerken, baden en een theater hebben blootgelegd."
