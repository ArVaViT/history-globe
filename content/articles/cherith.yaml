# Overview article (ADR 0007). Mainstream facts only; the brook is unknown; the candidates on the map are given, with Wadi Qelt as the Byzantine tradition and Wadi al-Yabis as the Gilead view, without choosing.
id: cherith
place: aa7bee8
title:
  en: "Brook Cherith"
  ru: "Поток Хораф"
body:
  en:
    - "The brook Cherith is where Elijah hid at the start of the great drought, and it is known only from that story. After he told Ahab that there would be neither dew nor rain, the word of the LORD came: “Get thee hence, and turn thee eastward, and hide thyself by the brook Cherith, that is before Jordan. And it shall be, that thou shalt drink of the brook; and I have commanded the ravens to feed thee there.” So he did, “and the ravens brought him bread and flesh in the morning, and bread and flesh in the evening; and he drank of the brook. And it came to pass after a while, that the brook dried up, because there had been no rain in the land”, and Elijah was sent on to the widow of Zarephath."
    - "Where it was is uncertain. The words “before Jordan” mean facing the Jordan, but from which side is disputed. Many look east of the river to Elijah's own Gilead, to a stream such as Wadi al-Yabis, the valley of Jabesh-gilead, or Wadi Ajlun or Wadi Rajib nearby. An old tradition puts it west of the river in Wadi Qelt near Jericho, where the monastery of St George of Choziba, hanging on the cliff since the fifth or sixth century, keeps the memory of Elijah fed by the ravens; Wadi al-Fara and the springs at Fasayil have also been suggested. No candidate has any evidence beyond position, and the map shows them all."
  ru:
    - "Поток Хораф — место, где Илия скрывался в начале великой засухи, и известен он только по этому рассказу. После того как пророк сказал Ахаву, что не будет ни росы, ни дождя, было к нему слово Господне: «пойди отсюда и обратись на восток и скройся у потока Хорафа, что против Иордана; из этого потока ты будешь пить, а воронам Я повелел кормить тебя там». Так он и сделал, «и вороны приносили ему хлеб и мясо поутру, и хлеб и мясо по вечеру, а из потока он пил. По прошествии некоторого времени этот поток высох, ибо не было дождя на землю», и Илия был послан дальше, к вдове в Сарепте."
    - "Где он был, неясно. Слова «против Иордана» значат «лицом к Иордану», но с какой стороны — спорно. Многие ищут его к востоку от реки, в родном для Илии Галааде, в таком потоке, как Вади-эль-Ябис, долина Иависа Галаадского, или в соседних Вади-Аджлун и Вади-Раджиб. Древнее предание помещает его к западу от реки, в Вади-Кельт близ Иерихона, где монастырь святого Георгия Хозевита, прилепившийся к скале с V или VI века, хранит память о питаемом воронами Илии; предлагали также Вади-эль-Фара и источники у Фасаиля. Ни у одного из этих мест нет доводов, кроме положения, и карта показывает их все."
scripture:
  - 1Kgs.17.1-1Kgs.17.7
sources:
