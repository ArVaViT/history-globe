# Overview article (ADR 0007). Mainstream facts only; the brook is unknown; the candidates on the map are given, with Wadi Qelt as the Byzantine tradition and Wadi al-Yabis as the Gilead view, without choosing.
id: cherith
place: aa7bee8
title:
  en: "Brook Cherith"
  ru: "Поток Хораф"
  uk: "Потік Хораф"
  es: "Arroyo de Querit"
  pt: "Ribeiro de Querite"
  de: "Bach Krit"
  fr: "Torrent de Kerith"
body:
  en:
    - "The brook Cherith is where Elijah hid at the start of the great drought, and it is known only from that story. After he told Ahab that there would be neither dew nor rain, the word of the LORD came: “Get thee hence, and turn thee eastward, and hide thyself by the brook Cherith, that is before Jordan. And it shall be, that thou shalt drink of the brook; and I have commanded the ravens to feed thee there.” So he did, “and the ravens brought him bread and flesh in the morning, and bread and flesh in the evening; and he drank of the brook. And it came to pass after a while, that the brook dried up, because there had been no rain in the land”, and Elijah was sent on to the widow of Zarephath."
    - "Where it was is uncertain. The words “before Jordan” mean facing the Jordan, but from which side is disputed. Many look east of the river to Elijah's own Gilead, to a stream such as Wadi al-Yabis, the valley of Jabesh-gilead, or Wadi Ajlun or Wadi Rajib nearby. An old tradition puts it west of the river in Wadi Qelt near Jericho, where the monastery of St George of Choziba, hanging on the cliff since the fifth or sixth century, keeps the memory of Elijah fed by the ravens; Wadi al-Fara and the springs at Fasayil have also been suggested. No candidate has any evidence beyond position, and the map shows them all."
  ru:
    - "Поток Хораф — место, где Илия скрывался в начале великой засухи, и известен он только по этому рассказу. После того как пророк сказал Ахаву, что не будет ни росы, ни дождя, было к нему слово Господне: «пойди отсюда и обратись на восток и скройся у потока Хорафа, что против Иордана; из этого потока ты будешь пить, а воронам Я повелел кормить тебя там». Так он и сделал, «и вороны приносили ему хлеб и мясо поутру, и хлеб и мясо по вечеру, а из потока он пил. По прошествии некоторого времени этот поток высох, ибо не было дождя на землю», и Илия был послан дальше, к вдове в Сарепте."
    - "Где он был, неясно. Слова «против Иордана» значат «лицом к Иордану», но с какой стороны — спорно. Многие ищут его к востоку от реки, в родном для Илии Галааде, в таком потоке, как Вади-эль-Ябис, долина Иависа Галаадского, или в соседних Вади-Аджлун и Вади-Раджиб. Древнее предание помещает его к западу от реки, в Вади-Кельт близ Иерихона, где монастырь святого Георгия Хозевита, прилепившийся к скале с V или VI века, хранит память о питаемом воронами Илии; предлагали также Вади-эль-Фара и источники у Фасаиля. Ни у одного из этих мест нет доводов, кроме положения, и карта показывает их все."
  uk:
    - "Потік Хораф — місце, де сховався Елія на початку великої посухи, і відомий лише з тієї розповіді. Після того як він сказав Ахаву, що не буде ні роси, ні дощу, надійшло слово Господнє: «Ізійди звідсї й поверни на схід сонця, та й сховайсь, коло потока Хората, що навпроти Йорданї: З сього потока пити меш, а крукам повелїв я обмислювати тебе їдою там». Так він і зробив, «і приносили йому круки хлїба й мясива уранцї й хлїба й мясива ввечері, а з бурчака він пив. По якомуся ж часї висох потік, бо не було в землї дощу», і Елію було послано далі до вдови із Сарепти."
    - "Де це було, непевно. Слова «навпроти Йорданї» означають, що потік лежав напроти Йордану, але з якого боку, є спірним. Багато хто шукає на схід від річки, в рідному для Елії Гілеаді, у такому потоці, як ваді аль-Ябіс, долина Явіса Гілеадського, або ваді Аджлун чи ваді Раджиб поблизу. Давня традиція розміщує його на захід від річки у ваді-Кельт біля Єрихону, де монастир святого Юрія Хозевіта, що висить на скелі з V чи VI ст., береже пам'ять про Елію, якого годували круки; пропонували також ваді аль-Фара і джерела у Фасаїлі. Жоден кандидат не має жодного доказу, крім розташування, і мапа показує їх усіх."
  es:
    - "El arroyo de Querit es donde se escondió Elías al comienzo de la gran sequía, y solo se conoce por ese relato. Después de que dijera a Acab que no habría ni rocío ni lluvia, vino la palabra del Señor: «Apártate de aquí, y vuélvete al oriente, y escóndete en el arroyo de Cherith, que está delante del Jordán. Y beberás del arroyo; y yo he mandado á los cuervos que te den allí de comer.» Así lo hizo, «y los cuervos le traían pan y carne por la mañana, y pan y carne á la tarde; y bebía del arroyo. Pasados algunos días, secóse el arroyo; porque no había llovido sobre la tierra», y Elías fue enviado a la viuda de Sarepta."
    - "No se sabe con certeza dónde estaba. Las palabras «delante del Jordán» significan frente al Jordán, pero se discute desde qué lado. Muchos miran al este del río, al Galaad del propio Elías, a un torrente como el uadi al-Yabis, el valle de Jabes de Galaad, o el uadi Ajlun o el uadi Rajib, cercanos. Una antigua tradición lo sitúa al oeste del río, en el uadi Qelt, cerca de Jericó, donde el monasterio de San Jorge de Choziba, suspendido del acantilado desde el siglo V o VI, conserva la memoria de Elías alimentado por los cuervos; también se han sugerido el uadi al-Fara y las fuentes de Fasayil. Ningún candidato tiene más prueba que la posición, y el mapa los muestra todos."
  pt:
    - "O ribeiro de Querite é onde Elias se escondeu no início da grande seca, e só é conhecido por essa narrativa. Depois que ele disse a Acabe que não haveria orvalho nem chuva, veio a palavra do SENHOR: “Vá embora daqui, vire para o leste e esconda-se junto ao ribeiro de Querite, que está diante do Jordão. Você beberá do ribeiro. Eu ordenei aos corvos que o alimentem ali.” Assim ele fez, e “Os corvos lhe traziam pão e carne pela manhã, e pão e carne à tarde; e ele bebia do ribeiro. Depois de algum tempo, o ribeiro secou, porque não havia chuva na terra”, e Elias foi enviado à viúva de Sarepta."
    - "Onde ficava é incerto. As palavras “diante do Jordão” significam voltado para o Jordão, mas de que lado é disputado. Muitos olham a leste do rio, para a Gileade do próprio Elias, para uma corrente como o uádi al-Yabis, o vale de Jabes-Gileade, ou o uádi Ajlun ou o uádi Rajib, ali perto. Uma antiga tradição o põe a oeste do rio, no uádi Qelt, perto de Jericó, onde o mosteiro de São Jorge de Coziba, pendurado no penhasco desde o século V ou VI, guarda a memória de Elias alimentado pelos corvos; o uádi al-Fara e as nascentes de Fasayil também foram sugeridos. Nenhum candidato tem outra evidência além da posição, e o mapa mostra todos."
  de:
    - "Der Bach Krit ist der Ort, an dem sich Elia zu Beginn der großen Dürre verbarg, und er ist nur aus dieser Erzählung bekannt. Nachdem er Ahab gesagt hatte, dass weder Tau noch Regen kommen werde, erging das Wort des HERRN: „Gehe weg von hinnen und wende dich gegen Morgen und verbirg dich am Bach Krith, der gegen den Jordan fließt; und sollst vom Bach trinken; und ich habe den Raben geboten, daß sie dich daselbst sollen versorgen.“ So tat er es, „und die Raben brachten ihm das Brot und Fleisch des Morgens und des Abends, und er trank vom Bach. Und es geschah nach etlicher Zeit, daß der Bach vertrocknete; denn es war kein Regen im Lande“, und Elia wurde weiter zur Witwe von Sarepta gesandt."
    - "Wo er lag, ist ungewiss. Die Worte „gegen den Jordan“ bedeuten dem Jordan gegenüber, doch von welcher Seite, ist umstritten. Viele blicken östlich des Flusses auf Elias eigenes Gilead, auf einen Bach wie das Wadi al-Yabis, das Tal von Jabesch in Gilead, oder das Wadi Adschlun oder das Wadi Radschib in der Nähe. Eine alte Überlieferung setzt ihn westlich des Flusses im Wadi Qelt bei Jericho an, wo das Kloster des heiligen Georg von Choziba, das seit dem 5. oder 6. Jahrhundert an der Felswand hängt, das Gedächtnis an den von den Raben gespeisten Elia bewahrt; auch das Wadi al-Fara und die Quellen bei Fasayil wurden vorgeschlagen. Kein Kandidat hat einen Beleg außer der Lage, und die Karte zeigt sie alle."
  fr:
    - "Le torrent de Kerith est l’endroit où Élie se cacha au début de la grande sécheresse, et il n’est connu que par ce récit. Après qu’il eut dit à Achab qu’il n’y aurait ni rosée ni pluie, la parole de l’Éternel lui fut adressée : « Pars d’ici, dirige-toi vers l’orient, et cache-toi près du torrent de Kerith, qui est en face du Jourdain. Tu boiras de l’eau du torrent, et j’ai ordonné aux corbeaux de te nourrir là. » Il le fit, et « les corbeaux lui apportaient du pain et de la viande le matin, et du pain et de la viande le soir, et il buvait de l’eau du torrent. Mais au bout d’un certain temps le torrent fut à sec, car il n’était point tombé de pluie dans le pays », et Élie fut envoyé chez la veuve de Sarepta."
    - "On ne sait pas avec certitude où il se trouvait. Les mots « en face du Jourdain » signifient face au Jourdain, mais de quel côté, c’est discuté. Beaucoup cherchent à l’est du fleuve, dans le Galaad propre d’Élie, un cours d’eau tel que le Wadi al-Yabis, la vallée de Jabès en Galaad, ou le Wadi Ajlun ou le Wadi Rajib tout proches. Une vieille tradition le place à l’ouest du fleuve, dans le Wadi Qelt près de Jéricho, où le monastère Saint-Georges de Khozeva, accroché à la falaise depuis le Ve ou le VIe siècle, garde le souvenir d’Élie nourri par les corbeaux ; le Wadi al-Fara et les sources de Fasayil ont aussi été proposés. Aucun candidat n’a d’autre preuve que sa position, et la carte les montre tous."
scripture:
  - 1Kgs.17.1-1Kgs.17.7
sources:
  - "M. Cogan, 1 Kings (Anchor Bible 10, 2001)"
  - "A. F. Rainey and R. S. Notley, The Sacred Bridge: Carta's Atlas of the Biblical World (2006)"
  - "Y. Hirschfeld, The Judean Desert Monasteries in the Byzantine Period (1992)"
