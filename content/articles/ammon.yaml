body:
  en:
    - 'Ammon was the small kingdom east of the Jordan around its capital Rabbah, now Amman, on the upper Jabbok, with Gilead to the west and north, Moab to the south and the desert to the east. Genesis traces the Ammonites, "the children of Ammon", to Lot and his younger daughter. Their god was Milcom, "the abomination of the Ammonites", whom Solomon served in his old age. Their language, close to Hebrew and Moabite, is known from the Amman Citadel inscription of the ninth century BC, the Tell Siran bottle, seals and ostraca.'
    - 'Israel on its way to Canaan was told not to meddle with the Ammonites, since their land was given "unto the children of Lot for a possession". In the time of the judges the Ammonites oppressed Gilead until Jephthah defeated them, having argued that Israel had taken its land east of the Jordan from the Amorites, not from Ammon. Nahash the Ammonite besieged Jabesh-gilead and demanded the right eyes of its men, and Saul''s relief of the city made him king. Hanun, Nahash''s son, shamed David''s envoys; in the war that followed Uriah died before Rabbah, and David took the city and its king''s crown. Solomon''s Ammonite wife Naamah was the mother of Rehoboam.'
    - 'Assyrian records list Ammonite kings paying tribute: Sanipu to Tiglath-pileser III in the 730s BC, Pudu-ilu to Sennacherib and Esarhaddon, Amminadab to Ashurbanipal. Ammonite bands harried Judah under Jehoiakim; Baalis, king of the Ammonites, was said to have sent the murderer of Gedaliah, the governor whom Nebuchadnezzar had left in Judah. Amos condemned Ammon for ripping up "the women with child of Gilead", and Ezekiel for saying "Aha" over the ruined sanctuary; Jeremiah asked why "their king" had inherited Gad. Tobiah "the Ammonite" opposed Nehemiah, and the Tobiads remained a power east of the Jordan into the second century BC, with their palace at Iraq el-Amir.'
    - "In the third century BC Rabbah was refounded as Philadelphia after Ptolemy II, and it later counted among the cities of the Decapolis. Ammon passed into the Roman province of Arabia in AD 106; Justin Martyr, writing about 160, still speaks of a great multitude of Ammonites. After the Arab conquest the old name returned as Amman, since 1921 the capital of Jordan, a city of several million people whose Citadel, the hill of ancient Rabbah, overlooks the Roman theatre."
  ru:
    - "Аммон — небольшое царство к востоку от Иордана вокруг столицы Раввы, нынешнего Аммана, на верхнем Иавоке; на западе и севере лежал Галаад, на юге — Моав, а на востоке — пустыня. Книга Бытия возводит Аммонитян, «сынов Аммоновых», к Лоту и его младшей дочери. Их богом был Милхом; Соломон под старость стал служить «Милхому, мерзости Аммонитской». Их язык, близкий к еврейскому и моавитскому, известен по надписи из цитадели Аммана IX века до н. э., бутылке из Телль-Сирана, печатям и остраконам."
    - "Израилю на пути в Ханаан было велено не враждовать с Аммонитянами, ибо их земля отдана «во владение сынам Лотовым». Во времена судей Аммонитяне теснили Галаад, пока их не разбил Иеффай, доказывавший, что землю за Иорданом Израиль взял у Аморреев, а не у Аммона. Наас Аммонитянин осадил Иавис Галаадский и потребовал выколоть его жителям правый глаз; Саул, выручив город, утвердился на царстве. Аннон, сын Нааса, обесчестил послов Давида; в последовавшей войне под Раввой погиб Урия, а Давид взял город и венец его царя. Аммонитянка Наама, жена Соломона, была матерью Ровоама."
    - "Ассирийские записи перечисляют аммонитских царей, плативших дань: Санипу — Феглаффелласару III в 730-х годах до н. э., Пуду-илу — Сеннахириму и Асардану, Амминадаба — Ашшурбанапалу. Полчища Аммонитян тревожили Иудею при Иоакиме; Ваалис, царь сыновей Аммоновых, как говорили, подослал убийцу к Годолии, наместнику, которого Навуходоносор оставил в Иудее. Амос осуждал Аммон за то, что «они рассекали беременных в Галааде», а Иезекииль — за злорадство над поруганным святилищем; Иеремия спрашивал, почему Малхом завладел Гадом. Товия Аммонитянин противился Неемии, и Товиады оставались силой за Иорданом до II века до н. э.; их дворец стоит в Ирак-эль-Амире."
    - "В III веке до н. э. Равва была основана заново как Филадельфия в честь Птолемея II, а позже числилась среди городов Десятиградия. В 106 г. н. э. Аммон вошёл в римскую провинцию Аравия; Иустин Мученик около 160 г. ещё говорит о великом множестве Аммонитян. После арабского завоевания вернулось древнее имя — Амман, с 1921 года столица Иордании, город с населением в несколько миллионов, чья Цитадель, холм древней Раввы, возвышается над римским театром."
  uk:
    - "Аммон було невеликим царством на схід від Йордану навколо своєї столиці Равви, нині Амману, на верхньому Яббоці, з Гілеадом на заході й півночі, Моавом на півдні та пустелею на сході. Буття виводить аммонітян від Лота та його молодшої доньки. Їхнім богом був Мілком, якому Соломон на старість став служити: «Молохові, гидотї Аммонїйській». Їхню мову, близьку до івриту і моавитської, знають з напису з цитаделі Амману IX століття до н. е., пляшки з Телль-Сіран, печаток та остраконів."
    - "Ізраїлю на шляху до Ханаану було наказано не чіпати аммонітян, бо їхню землю віддано: «синам Лотовим я оддав її в державу». За часів суддів аммонітяни гнобили Гілеад, поки Єфтай не переміг їх, довівши, що Ізраїль узяв свою землю на схід від Йордану в аморіїв, а не в Аммона. Наас Аммонітянин облягав Явіс Гілеадський і вимагав праві очі його чоловіків, і порятунок міста Саулом зробив його царем. Аннон, син Наасів, осоромив посланців Давида; у війні, що настала, Урія загинув перед Раввою, а Давид узяв місто й вінець його царя. Аммонітянка Наама, дружина Соломона, була матір'ю Ровоама."
    - "Ассирійські записи називають аммонітських царів, що сплачували данину: Саніпу — Тіглатпаласару III у 730-х рр. до н. е., Пуду-ілу — Сінаххерібові й Асархаддонові, Амінадав — Ашшурбаніпалові. Аммонітські загони завдавали збитків Юді за Йоакима; Вааліс, цар аммонітян, як казали, послав убивцю Гедалії, намісника, якого Навуходоносор залишив у Юдеї. Амос засудив Аммон за те, що розтинали «жінок вагітних» у Гілеаді, а Єзекіїль — за те, що казав «Ага!» над зруйнованою святинею; Єремія питав, чому їхній цар успадкував Гад. Товія, «слуга Амманицький», противився Неемії, і Товіади лишалися силою на схід від Йордану до II століття до н. е. зі своїм палацом в Ірак-ель-Емірі."
    - "У III столітті до н. е. Равву заснували наново як Філадельфію на честь Птолемея II, і згодом вона належала до міст Десятимістя. Аммон ввійшов до римської провінції Аравія в 106 р. н. е.; Юстин Мученик, пишучи близько 160 року, ще говорить про велике множество аммонітян. Після арабського завоювання стара назва повернулася як Амман, від 1921 року столиця Йорданії, місто з кількома мільйонами мешканців, чия Цитадель, пагорб давньої Равви, височіє над римським театром."
  es:
    - "Amón era el pequeño reino al este del Jordán en torno a su capital Rabá, hoy Amán, en el alto Jaboc, con Galaad al oeste y al norte, Moab al sur y el desierto al este. El Génesis hace descender a los amonitas, «los hijos de Ammón», de Lot y de su hija menor. Su dios era Milcom, «abominación de los Ammonitas», a quien Salomón sirvió en su vejez. Su lengua, próxima al hebreo y al moabita, se conoce por la inscripción de la Ciudadela de Amán del siglo IX a. C., la botella de Tell Siran, sellos y óstraca."
    - "A Israel, camino de Canaán, se le dijo que no se metiera con los amonitas, pues, como dijo Dios, «á los hijos de Lot la he dado por heredad». En tiempo de los jueces los amonitas oprimieron a Galaad hasta que Jefté los derrotó, tras argumentar que Israel había tomado su tierra al este del Jordán de los amorreos, no de Amón. Nahas el amonita sitió Jabes de Galaad y exigió el ojo derecho de sus hombres, y el socorro de Saúl a la ciudad lo hizo rey. Hanún, hijo de Nahas, humilló a los enviados de David; en la guerra que siguió, Urías murió ante Rabá, y David tomó la ciudad y la corona de su rey. Naama, la esposa amonita de Salomón, fue la madre de Roboam."
    - "Los registros asirios enumeran reyes amonitas que pagaban tributo: Sanipu a Tiglat-pileser III en la década de 730 a. C., Pudu-ilu a Senaquerib y Esarhaddón, Aminadab a Asurbanipal. Bandas amonitas hostigaron a Judá bajo Joacim; Baalis, rey de los amonitas, según se decía, envió al asesino de Gedalías, el gobernador que Nabucodonosor había dejado en Judá. Amós condenó a Amón por abrir «las preñadas de Galaad», y Ezequiel por decir «¡Ea!» sobre el santuario en ruinas; Jeremías preguntó por qué «el rey de ellos» había tomado como por heredad a Gad. Tobías, «el siervo Ammonita», se opuso a Nehemías, y los tobíadas siguieron siendo una potencia al este del Jordán hasta el siglo II a. C., con su palacio en Iraq el-Amir."
    - "En el siglo III a. C. Rabá fue refundada como Filadelfia en honor de Ptolomeo II, y más tarde se contó entre las ciudades de la Decápolis. Amón pasó a la provincia romana de Arabia en 106 d. C.; Justino Mártir, escribiendo hacia 160, todavía habla de una gran multitud de amonitas. Tras la conquista árabe volvió el antiguo nombre como Amán, desde 1921 capital de Jordania, una ciudad de varios millones de habitantes cuya Ciudadela, la colina de la antigua Rabá, domina el teatro romano."
  pt:
    - "Amom era o pequeno reino a leste do Jordão em torno de sua capital Rabá, hoje Amã, no alto Jaboque, com Gileade a oeste e ao norte, Moabe ao sul e o deserto a leste. Gênesis faz remontar os amonitas, “os filhos de Amom”, a Ló e à sua filha mais nova. Seu deus era Milcom, “a abominação dos amonitas”, a quem Salomão serviu na velhice. Sua língua, próxima do hebraico e do moabita, é conhecida pela inscrição da Cidadela de Amã, do século IX a.C., pelo frasco de Tell Siran, por selos e óstracos."
    - "A Israel, a caminho de Canaã, foi dito que não se metesse com os amonitas, pois sua terra fora dada “aos filhos de Ló por possessão”. No tempo dos juízes, os amonitas oprimiram Gileade até que Jefté os derrotou, tendo argumentado que Israel tomara sua terra a leste do Jordão dos amorreus, e não de Amom. Naás, o amonita, sitiou Jabes-Gileade e exigiu o olho direito de seus homens, e o socorro de Saul à cidade o fez rei. Hanum, filho de Naás, humilhou os enviados de Davi; na guerra que se seguiu, Urias morreu diante de Rabá, e Davi tomou a cidade e a coroa de seu rei. Naamá, esposa amonita de Salomão, foi mãe de Roboão."
    - "Registros assírios listam reis amonitas pagando tributo: Sanipu a Tiglate-Pileser III na década de 730 a.C., Pudu-ilu a Senaqueribe e Esar-Hadom, Aminadabe a Assurbanípal. Bandos amonitas assolaram Judá sob Jeoaquim; Baalis, rei dos amonitas, segundo se dizia, enviou o assassino de Gedalias, o governador que Nabucodonosor deixara em Judá. Amós condenou Amom por rasgar o ventre das “mulheres grávidas de Gileade”, e Ezequiel por dizer “Ahá!” sobre o santuário arruinado; Jeremias perguntou por que Milcom “tomou posse de Gade”. Tobias, “o servo amonita”, opôs-se a Neemias, e os tobíadas continuaram sendo uma potência a leste do Jordão até o século II a.C., com seu palácio em Iraq el-Amir."
    - "No século III a.C., Rabá foi refundada como Filadélfia em honra de Ptolomeu II, e depois contou-se entre as cidades da Decápolis. Amom passou à província romana da Arábia em 106 d.C.; Justino Mártir, escrevendo por volta de 160, ainda fala de uma grande multidão de amonitas. Depois da conquista árabe o nome antigo voltou como Amã, desde 1921 a capital da Jordânia, cidade de vários milhões de habitantes cuja Cidadela, a colina da antiga Rabá, domina o teatro romano."
  de:
    - "Ammon war das kleine Königreich östlich des Jordan um seine Hauptstadt Rabba, das heutige Amman, am oberen Jabbok, mit Gilead im Westen und Norden, Moab im Süden und der Wüste im Osten. Das erste Buch Mose führt die Ammoniter, „die Kinder Ammon“, auf Lot und seine jüngere Tochter zurück. Ihr Gott war Milkom, „der Greuel der Ammoniter“, dem Salomo in seinem Alter diente. Ihre Sprache, dem Hebräischen und Moabitischen nahe, ist aus der Inschrift der Zitadelle von Amman aus dem 9. Jahrhundert v. Chr., der Flasche von Tell Siran, Siegeln und Ostraka bekannt."
    - "Auf dem Weg nach Kanaan wurde Israel geboten, sich nicht mit den Ammonitern einzulassen, denn ihr Land sei „den Kindern Lot zu besitzen gegeben“. In der Richterzeit unterdrückten die Ammoniter Gilead, bis Jeftah sie besiegte, nachdem er geltend gemacht hatte, Israel habe sein Land östlich des Jordan von den Amoritern genommen, nicht von Ammon. Nahas, der Ammoniter, belagerte Jabesch in Gilead und forderte das rechte Auge seiner Männer, und Sauls Entsatz der Stadt machte ihn zum König. Hanun, Nahas' Sohn, beschämte Davids Gesandte; im folgenden Krieg fiel Uria vor Rabba, und David nahm die Stadt und die Krone ihres Königs. Salomos ammonitische Frau Naama war die Mutter Rehabeams."
    - "Assyrische Aufzeichnungen nennen ammonitische Könige als Tributpflichtige: Sanipu unter Tiglat-Pileser III. in den 730er Jahren v. Chr., Pudu-ilu unter Sanherib und Asarhaddon, Amminadab unter Assurbanipal. Ammonitische Banden plagten Juda unter Jojakim; Baalis, der König der Ammoniter, sandte, wie es hieß, den Mörder Gedaljas, des Statthalters, den Nebukadnezar in Juda gelassen hatte. Amos verurteilte Ammon, weil es „die Schwangeren in Gilead zerrissen“ hatte, Hesekiel, weil es über das Heiligtum sprach: „Ha! es ist entheiligt!“; Jeremia fragte, warum „Milkom“ das Land Gad besitze. Tobija, „der ammonitische Knecht“, widersetzte sich Nehemia, und die Tobiaden blieben bis ins 2. Jahrhundert v. Chr. eine Macht östlich des Jordan, mit ihrem Palast in Araq el-Emir."
    - "Im 3. Jahrhundert v. Chr. wurde Rabba nach Ptolemaios II. als Philadelphia neu gegründet und zählte später zu den Städten der Dekapolis. Ammon ging 106 n. Chr. in die römische Provinz Arabien über; Justin der Märtyrer spricht um 160 noch von einer großen Menge Ammoniter. Nach der arabischen Eroberung kehrte der alte Name als Amman zurück, seit 1921 die Hauptstadt Jordaniens, eine Stadt mit mehreren Millionen Einwohnern, deren Zitadelle, der Hügel des antiken Rabba, über das römische Theater blickt."
  fr:
    - "Ammon était le petit royaume à l’est du Jourdain autour de sa capitale Rabba, aujourd’hui Amman, sur le haut Jabbok, avec Galaad à l’ouest et au nord, Moab au sud et le désert à l’est. La Genèse fait remonter les Ammonites, « les enfants d’Ammon », à Lot et à sa fille cadette. Leur dieu était Milcom, « l’abomination des Ammonites », que Salomon servit dans sa vieillesse. Leur langue, proche de l’hébreu et du moabite, est connue par l’inscription de la Citadelle d’Amman du IXe siècle av. J.-C., le flacon de Tell Siran, des sceaux et des ostraca."
    - "En route vers Canaan, Israël reçut l’ordre de ne pas attaquer les Ammonites, car leur pays était donné « aux enfants de Lot en propriété ». Au temps des juges, les Ammonites opprimèrent Galaad jusqu’à ce que Jephté les battît, après avoir soutenu qu’Israël avait pris son pays à l’est du Jourdain aux Amoréens, non à Ammon. Nachasch l’Ammonite assiégea Jabès en Galaad et exigea l’œil droit de ses hommes, et la délivrance de la ville par Saül le fit roi. Hanun, fils de Nachasch, outragea les envoyés de David ; dans la guerre qui suivit, Urie mourut devant Rabba, et David prit la ville et la couronne de son roi. Naama l’Ammonite, épouse de Salomon, fut la mère de Roboam."
    - "Les annales assyriennes citent des rois ammonites payant tribut : Sanipu à Tiglath-Piléser III dans les années 730 av. J.-C., Pudu-ilu à Sanchérib et à Esar-Haddon, Amminadab à Assurbanipal. Des bandes ammonites harcelèrent Juda sous Jojakim ; Baalis, roi des Ammonites, aurait envoyé l’assassin de Guedalia, le gouverneur que Nebucadnetsar avait laissé en Juda. Amos condamna Ammon pour avoir fendu le ventre des « femmes enceintes de Galaad », et Ézéchiel pour avoir dit « Ah ! Ah ! » sur le sanctuaire profané ; Jérémie demandait : « Pourquoi Malcom possède-t-il Gad ? ». Tobija, « le serviteur ammonite », s’opposa à Néhémie, et les Tobiades restèrent une puissance à l’est du Jourdain jusqu’au IIe siècle av. J.-C., avec leur palais d’Iraq el-Amir."
    - "Au IIIe siècle av. J.-C., Rabba fut refondée sous le nom de Philadelphie, d’après Ptolémée II, et compta plus tard parmi les villes de la Décapole. Ammon passa dans la province romaine d’Arabie en 106 apr. J.-C. ; Justin martyr, écrivant vers 160, parle encore d’une grande multitude d’Ammonites. Après la conquête arabe, l’ancien nom revint sous la forme Amman, capitale de la Jordanie depuis 1921, ville de plusieurs millions d’habitants dont la Citadelle, colline de l’antique Rabba, domine le théâtre romain."
  it:
    - "Ammon era il piccolo regno a est del Giordano intorno alla sua capitale Rabba, oggi Amman, sull’alto Iabbok, con Galaad a ovest e a nord, Moab a sud e il deserto a est. La Genesi fa risalire gli Ammoniti, «figliuoli di Ammon», a Lot e alla sua figlia minore. Il loro dio era Milcom, «l’abominazione degli Ammoniti», che Salomone servì nella vecchiaia. La loro lingua, vicina all’ebraico e al moabita, è nota dall’iscrizione della Cittadella di Amman del IX secolo a.C., dalla bottiglia di Tell Siran, da sigilli e ostraca."
    - "A Israele in cammino verso Canaan fu detto di non immischiarsi con gli Ammoniti, poiché la loro terra era data «ai figliuoli di Lot, come loro proprietà». Al tempo dei giudici gli Ammoniti oppressero Galaad finché Iefte li sconfisse, avendo sostenuto che Israele aveva preso la sua terra a est del Giordano dagli Amorei, non da Ammon. Naas l’Ammonita assediò Iabes di Galaad e pretese l’occhio destro dei suoi uomini, e il soccorso di Saul alla città lo fece re. Canun, figlio di Naas, svergognò gli inviati di Davide; nella guerra che seguì Uria morì davanti a Rabba, e Davide prese la città e la corona del suo re. La moglie ammonita di Salomone, Naama, fu la madre di Roboamo."
    - "Le cronache assire elencano re ammoniti che pagano tributo: Sanipu a Tiglat-Pilèser III negli anni 730 a.C., Pudu-ilu a Sennacherib e Assaraddon, Amminadab ad Assurbanipal. Bande ammonite devastarono Giuda sotto Ioiakim; Baalis, re degli Ammoniti, avrebbe mandato l’assassino di Godolia, il governatore che Nabucodonosor aveva lasciato in Giuda. Amos condannò Ammon per aver sventrato «le donne incinte di Galaad», ed Ezechiele per aver detto «Ah! Ah!» sul santuario profanato; Geremia chiese perché «Malcom prend’egli possesso di Gad». Tobia «l’Ammonita» si oppose a Neemia, e i Tobiadi restarono una potenza a est del Giordano fino al II secolo a.C., con il loro palazzo a Iraq el-Amir."
    - "Nel III secolo a.C. Rabba fu rifondata come Filadelfia in onore di Tolomeo II, e in seguito fu contata fra le città della Decapoli. Ammon passò alla provincia romana d’Arabia nel 106 d.C.; Giustino Martire, scrivendo intorno al 160, parla ancora di una grande moltitudine di Ammoniti. Dopo la conquista araba l’antico nome tornò come Amman, dal 1921 capitale della Giordania, una città di vari milioni di abitanti la cui Cittadella, la collina dell’antica Rabba, domina il teatro romano."
  pl:
    - "Ammon było małym królestwem na wschód od Jordanu wokół stolicy Rabba, dzisiejszego Ammanu, nad górnym Jabbokiem, z Gileadem na zachodzie i północy, Moabem na południu i pustynią na wschodzie. Księga Rodzaju wywodzi Ammonitów, „synów Ammonowych”, od Lota i jego młodszej córki. Ich bogiem był Milkom, któremu Salomon służył na starość: poszedł za „Molochem, obrzydliwością Ammonitów”. Ich język, bliski hebrajskiemu i moabickiemu, znamy z inskrypcji z cytadeli w Ammanie z IX wieku p.n.e., butelki z Tell Siran, pieczęci i ostraków."
    - "Izraelowi w drodze do Kanaanu zakazano zaczepiać Ammonitów, gdyż, jak mówi Pan, „synom Lotowym dałem ją w dziedzictwo”. W czasach sędziów Ammonici gnębili Gilead, aż pokonał ich Jefte, który dowodził, że Izrael zajął ziemię na wschód od Jordanu Amorejczykom, a nie Ammonowi. Nachasz Ammonita oblegał Jabesz-Gilead i zażądał prawych oczu jego mężów, a odsiecz Saula dla miasta uczyniła go królem. Chanun, syn Nachasza, zawstydził posłów Dawida; w wojnie, która potem nastąpiła, Uriasz zginął pod Rabbą, a Dawid zajął miasto i koronę jego króla. Ammonitka Naama, żona Salomona, była matką Roboama."
    - "Zapisy asyryjskie wymieniają królów ammonickich płacących daninę: Sanipu Tiglat-Pileserowi III w latach 730. p.n.e., Pudu-ilu Sennacherybowi i Asarhaddonowi, Aminadab Aszurbanipalowi. Oddziały ammonickie nękały Judę za Jojakima; Baalis, król Ammonitów, miał podobno posłać zabójcę Gedaliasza, namiestnika, którego Nabuchodonozor zostawił w Judzie. Amos potępił Ammon za to, że „rozcinali brzemienne w Galaad”, a Ezechiel za wołanie „Hej, hej!” nad zniszczoną świątnicą; Jeremiasz pytał, czemu „król ich dziedzicznie opanował Gad”. Tobiasz, „Ammonitczyk”, sprzeciwiał się Nehemiaszowi, a Tobiadzi pozostali potęgą na wschód od Jordanu do II wieku p.n.e., z pałacem w Iraq el-Amir."
    - "W III wieku p.n.e. Rabba została założona na nowo jako Filadelfia, od Ptolemeusza II, i później liczyła się wśród miast Dekapolu. Ammon wszedł w skład rzymskiej prowincji Arabia w 106 r. n.e.; Justyn Męczennik, pisząc około 160 roku, wciąż mówi o wielkiej rzeszy Ammonitów. Po podboju arabskim dawna nazwa wróciła jako Amman, od 1921 roku stolica Jordanii, miasto kilku milionów mieszkańców, którego Cytadela, wzgórze dawnej Rabby, góruje nad rzymskim teatrem."
  nl:
    - "Ammon was het kleine koninkrijk ten oosten van de Jordaan rond zijn hoofdstad Rabba, nu Amman, aan de bovenloop van de Jabbok, met Gilead in het westen en noorden, Moab in het zuiden en de woestijn in het oosten. Genesis voert de Ammonieten, “de kinderen Ammons”, terug op Lot en zijn jongste dochter. Hun god was Milchom, “het verfoeisel der Ammonieten”, die Salomo in zijn oude dag diende. Hun taal, verwant aan het Hebreeuws en het Moabitisch, is bekend uit het opschrift van de Citadel van Amman uit de negende eeuw v.Chr., de Tell Siran-fles, zegels en ostraca."
    - "Israël werd op weg naar Kanaän gezegd zich niet met de Ammonieten te bemoeien, daar hun land “aan Lots kinderen ter erfenis” was gegeven. In de tijd van de richters onderdrukten de Ammonieten Gilead tot Jefta hen versloeg, nadat hij had betoogd dat Israël zijn land ten oosten van de Jordaan van de Amorieten had genomen, niet van Ammon. De Ammoniet Nachas belegerde Jabes in Gilead en eiste het rechteroog van zijn mannen, en Sauls ontzet van de stad maakte hem koning. Chanun, Nachas’ zoon, hoonde Davids gezanten; in de oorlog die volgde stierf Uria voor Rabba, en David nam de stad en de kroon van haar koning. Salomo’s Ammonitische vrouw Naäma was de moeder van Rehabeam."
    - "Assyrische annalen noemen Ammonitische koningen die schatting betaalden: Sanipu aan Tiglat-Pileser III in de jaren 730 v.Chr., Pudu-ilu aan Sanherib en Esarhaddon, Amminadab aan Assurbanipal. Ammonitische bendes teisterden Juda onder Jojakim; Baälis, koning van de Ammonieten, zond naar verluidt de moordenaar van Gedalja, de landvoogd die Nebukadnessar in Juda had achtergelaten. Amos veroordeelde Ammon omdat het “de zwangere vrouwen van Gilead” opensneed, en Ezechiël omdat het “Heah!” riep over het ontheiligde heiligdom; Jeremia vroeg waarom hun koning Gad had geërfd. Tobia, “de Ammonietische knecht”, verzette zich tegen Nehemia, en de Tobiaden bleven tot in de tweede eeuw v.Chr. een macht ten oosten van de Jordaan, met hun paleis te Iraq el-Amir."
    - "In de derde eeuw v.Chr. werd Rabba hergesticht als Filadelfia, naar Ptolemaeus II, en het telde later onder de steden van de Dekapolis. Ammon ging in 106 n.Chr. op in de Romeinse provincie Arabië; Justinus de Martelaar, omstreeks 160 schrijvend, spreekt nog van een grote menigte Ammonieten. Na de Arabische verovering keerde de oude naam terug als Amman, sinds 1921 de hoofdstad van Jordanië, een stad van enkele miljoenen inwoners wier Citadel, de heuvel van het oude Rabba, uitkijkt over het Romeinse theater."
  cs:
    - "Amón bylo malé království východně od Jordánu kolem hlavního města Rabba, dnešního Ammánu, na horním toku Jabok, s Gileadem na západě a severu, Moábem na jihu a pouští na východě. Genesis vede původ Amónovců, „synů Ammon“, k Lotovi a jeho mladší dceři. Jejich bohem byl Milkom, „ohavnosti Ammonské“, jemuž Šalomoun sloužil ve stáří. Jejich jazyk, blízký hebrejštině a moábštině, známe z nápisu z ammánské citadely z 9. století př. n. l., z láhve z Tell Siran, z pečetí a ostrak."
    - "Izrael měl na cestě do Kanaánu příkaz nedráždit Amónovce, „poněvadž synům Lotovým dal jsem ji k vládařství“. Za soudců Amónovci utiskovali Gilead, dokud je Jiftách neporazil, když dokázal, že Izrael vzal svou zemi východně od Jordánu Amorejským, nikoli Amónu. Nachaš Amónský oblehl Jabeš gileadský a žádal pravé oko jeho mužů a Saulovo vysvobození města z něj učinilo krále. Chanún, Nachašův syn, zahanbil Davidovy posly; ve válce, která následovala, padl Urijáš před Rabbou a David dobyl město i korunu jeho krále. Šalomounova amónská žena Naama byla matkou Rechabeámovou."
    - "Asyrské záznamy uvádějí amónské krále platící tribut: Sanipu Tiglatpilesarovi III. ve 30. letech 8. století př. n. l., Pudu-ilu Senacheribovi a Asarhadónovi, Amínadab Aššurbanipalovi. Amónské tlupy sužovaly Judu za Jójakima; Baalis, král Amónovců, prý poslal vraha Gedaljáše, místodržícího, kterého Nebukadnesar nechal v Judsku. Amos odsoudil Amón za to, že roztínal „těhotné Galádské“, a Ezechiel za to, že řekl „To dobře to“ nad zpustošenou svatyní; Jeremjáš se ptal, proč „král jejich“ dědičně opanoval Gád. Tobijáš, „služebník Ammonitský“, se stavěl proti Nehemjášovi a Tobiovci zůstali mocností východně od Jordánu až do 2. století př. n. l., s palácem v Iraq el-Amir."
    - "Ve 3. století př. n. l. byla Rabba znovu založena jako Filadelfie podle Ptolemaia II. a později se počítala mezi města Dekapole. Amón přešel do římské provincie Arábie v roce 106 n. l.; Justin Mučedník, píšící kolem roku 160, mluví ještě o velkém množství Amónovců. Po arabském dobytí se vrátilo staré jméno jako Ammán, od roku 1921 hlavní město Jordánska, město o několika milionech obyvatel, jehož Citadela, pahorek starověké Rabby, shlíží na římské divadlo."
  sv:
    - "Ammon var det lilla kungariket öster om Jordan kring huvudstaden Rabba, nuvarande Amman, vid övre Jabbok, med Gilead i väster och norr, Moab i söder och öknen i öster. Första Mosebok för ammoniterna, ”Ammons barn”, tillbaka till Lot och hans yngre dotter. Deras gud var Milkom, ”ammoniternas styggelse”, som Salomo tjänade på sin ålderdom. Deras språk, nära hebreiskan och moabitiskan, är känt från Citadellinskriften från Amman från 800-talet f.Kr., Tell Siran-flaskan, sigill och ostraka."
    - "Israel på väg mot Kanaan fick höra att det inte skulle röra ammoniterna, eftersom deras land var givet ”åt Lots barn till besittning”. På domarnas tid förtryckte ammoniterna Gilead tills Jefta besegrade dem, sedan han hade framhållit att Israel hade tagit sitt land öster om Jordan från amoréerna, inte från Ammon. Nachash ammoniten belägrade Javesh-Gilead och krävde männens högra ögon, och Sauls undsättning av staden gjorde honom till kung. Hanun, Nachashs son, kränkte Davids sändebud; i kriget som följde dog Uria vid Rabba, och David intog staden och dess kungs krona. Salomos ammonitiska hustru Naama var Rehabeams moder."
    - "Assyriska källor räknar upp ammonitiska kungar som betalade tribut: Sanipu till Tiglat-Pileser III på 730-talet f.Kr., Pudu-ilu till Sanherib och Esarhaddon, Amminadav till Ashurbanipal. Ammonitiska band plundrade Juda under Jojakim; Baalis, ammoniternas kung, sades ha sänt Gedaljas mördare, den ståthållare som Nebukadnessar hade lämnat i Juda. Amos fördömde Ammon för att ha ”uppristat havande kvinnor i Gilead”, och Hesekiel för att ha ropat ”Rätt så!” över den ödelagda helgedomen; Jeremia frågade varför deras kung hade tagit arv efter Gad. Tobia, ”den ammonitiske tjänstemannen”, motarbetade Nehemja, och tobiaderna förblev en makt öster om Jordan in på 100-talet f.Kr., med sitt palats vid Iraq el-Amir."
    - "På 200-talet f.Kr. grundades Rabba på nytt som Filadelfia efter Ptolemaios II, och räknades senare bland Dekapolis städer. Ammon gick in i den romerska provinsen Arabien år 106 e.Kr.; Justinus Martyren talar omkring år 160 ännu om en stor mängd ammoniter. Efter den arabiska erövringen återkom det gamla namnet som Amman, sedan 1921 Jordaniens huvudstad, en stad med flera miljoner invånare vars citadell, den forna Rabbas kulle, blickar ned över den romerska teatern."
  nb:
    - "Ammon var det lille kongeriket øst for Jordan rundt hovedstaden Rabba, nå Amman, ved øvre Jabbok, med Gilead i vest og nord, Moab i sør og ørkenen i øst. 1. Mosebok fører ammonittene, «Ammons barn», tilbake til Lot og hans yngste datter. Guden deres var Milkom, «ammonittenes vederstyggelighet», som Salomo tjente da han ble gammel. Språket deres, nært hebraisk og moabittisk, er kjent fra Amman-Citadel-innskriften fra 800-tallet f.Kr., Tell Siran-flasken, segl og ostraka."
    - "Israel ble på vei til Kanaan bedt om ikke å legge seg opp i ammonittene, siden landet deres var «gitt Lots barn det til eiendom». I dommertiden undertrykte ammonittene Gilead til Jefta beseiret dem, etter å ha hevdet at Israel hadde tatt landet sitt øst for Jordan fra amorittene, ikke fra Ammon. Ammonitten Nahasj kringsatte Jabesj-Gilead og krevde det høyre øyet til mennene der, og Sauls undsetning av byen gjorde ham til konge. Hanun, Nahasjs sønn, vanæret Davids sendebud; i krigen som fulgte, døde Uria foran Rabba, og David inntok byen og tok kongens krone. Salomos ammonittiske hustru Naama var mor til Rehabeam."
    - "Assyriske opptegnelser nevner ammonittiske konger som betalte tributt: Sanipu til Tiglat-Pileser III på 730-tallet f.Kr., Pudu-ilu til Sankerib og Asarhaddon, Amminadab til Assurbanipal. Ammonittiske bander plaget Juda under Jojakim; Baalis, ammonittenes konge, skal ha sendt morderen av Gedalja, guvernøren som Nebukadnesar hadde latt bli igjen i Juda. Amos fordømte Ammon for å ha skåret opp «de fruktsommelige kvinner i Gilead», og Esekiel for å rope «Ha, ha!» over den vanhelligede helligdommen; Jeremia spurte hvorfor «deres konge» hadde «tatt Gad til eie». Tobia, «den ammonittiske tjener», motarbeidet Nehemja, og tobiadene forble en makt øst for Jordan inn i det andre århundre f.Kr., med palasset sitt ved Iraq el-Amir."
    - "På 200-tallet f.Kr. ble Rabba grunnlagt på nytt som Filadelfia etter Ptolemaios II, og den ble senere regnet blant byene i Dekapolis. Ammon gikk inn i den romerske provinsen Arabia i 106 e.Kr.; Justin Martyren, som skrev omkring 160, taler fortsatt om en stor mengde ammonitter. Etter den arabiske erobringen vendte det gamle navnet tilbake som Amman, siden 1921 hovedstad i Jordan, en by med flere millioner innbyggere, hvis Citadel, høyden i det gamle Rabba, ser ned på det romerske teateret."
  tl:
    - "Ang Ammon ay ang maliit na kaharian sa silangan ng Jordan sa palibot ng kabisera nitong Rabba, na ngayo'y Amman, sa itaas na Jaboc, na may Gilead sa kanluran at hilaga, Moab sa timog at ang disyerto sa silangan. Inuugat ng Genesis ang mga Ammonita, ang “mga anak ni Ammon”, kay Lot at sa bunso niyang anak na babae. Ang kanilang diyos ay si Milcom, ang “karumaldumal ng mga Ammonita”, na pinaglingkuran ni Salomon sa kaniyang pagtanda. Ang kanilang wika, malapit sa Hebreo at Moabita, ay kilala mula sa inskripsiyon ng Kutang Amman noong ika-9 na siglo BK, ang botelya ng Tell Siran, mga selyo at ostraca."
    - "Sa paglalakbay ng Israel patungong Canaan, sinabihan itong huwag makialam sa mga Ammonita, yamang ang kanilang lupain ay “aking ibinigay na pinakaari sa mga anak ni Lot”. Noong panahon ng mga hukom, pinighati ng mga Ammonita ang Gilead hanggang talunin sila ni Jephte, na nangatwiran na kinuha ng Israel ang lupain nito sa silangan ng Jordan sa mga Amorrheo, hindi sa Ammon. Kinubkob ni Naas na Ammonita ang Jabes-galaad at hiningi ang kanang mata ng mga lalaki nito, at ang pagtulong ni Saul sa lungsod ang nagpahari sa kaniya. Pinahiya ni Hanun, anak ni Naas, ang mga sugo ni David; sa sumunod na digmaan ay namatay si Urias sa harap ng Rabba, at sinakop ni David ang lungsod at ang korona ng hari nito. Ang asawang Ammonita ni Salomon na si Naama ang ina ni Roboam."
    - "Itinatala ng mga talaang Asirio ang mga haring Ammonita na nagbabayad ng tributo: si Sanipu kay Tiglath-pileser III noong dekada 730 BK, si Pudu-ilu kay Sennacherib at Esar-hadon, si Aminadab kay Ashurbanipal. Nilusob ng mga pulutong na Ammonita ang Juda sa ilalim ni Joacim; si Baalis, hari ng mga Ammonita, ay sinasabing nagsugo ng pumatay kay Gedalias, ang gobernador na iniwan ni Nabucodonosor sa Juda. Hinatulan ni Amos ang Ammon dahil sa pagpaluwa ng bituka ng “mga babaing nagdadalang tao sa Galaad”, at ni Ezekiel dahil sa pagsasabi ng “Aha” sa nasirang santuwaryo; nagtanong si Jeremias kung bakit “minamana ni Malcam ang Gad”. Kinalaban ni Tobias na “Ammonita” si Nehemias, at nanatiling kapangyarihan ang mga Tobiada sa silangan ng Jordan hanggang ika-2 siglo BK, na may palasyo sa Iraq el-Amir."
    - "Noong ika-3 siglo BK, muling itinatag ang Rabba bilang Filadelfia, na ipinangalan kay Ptolomeo II, at kalaunan ay ibinilang sa Decapolis. Napasailalim ang Ammon sa lalawigang Romano ng Arabia noong 106 AD; si Justino Martir, na sumulat noong mga 160, ay nagsasalita pa rin tungkol sa isang malaking karamihan ng mga Ammonita. Pagkatapos ng pananakop ng mga Arabe, bumalik ang lumang pangalan bilang Amman, mula 1921 ay kabisera ng Jordan, isang lungsod ng ilang milyong tao na ang Kuta, ang burol ng sinaunang Rabba, ay nakatanaw sa teatrong Romano."
  da:
    - "Ammon var det lille kongerige øst for Jordan omkring hovedstaden Rabba, nu Amman, ved øvre Jabbok, med Gilead mod vest og nord, Moab mod syd og ørkenen mod øst. Første Mosebog fører ammonitterne, »Ammons Børn«, tilbage til Lot og hans yngste datter. Deres gud var Milkom, »Ammoniternes Vederstyggelighed«, som Salomo tjente i sin alderdom. Deres sprog, nær beslægtet med hebraisk og moabitisk, er kendt fra Amman-citadellets indskrift fra 800-tallet f.Kr., Tell Siran-flasken, segl og ostraka."
    - "Israel fik på vej til Kana'an besked om ikke at blande sig med ammonitterne, da deres land var givet »Lots Børn ... til Ejendom«. I dommertiden undertrykte ammonitterne Gilead, indtil Jefta besejrede dem, efter at have argumenteret for, at Israel havde taget sit land øst for Jordan fra amoriterne, ikke fra Ammon. Ammoniteren Nahasj belejrede Jabesj i Gilead og krævede mændenes højre øje, og Sauls undsætning af byen gjorde ham til konge. Hanun, Nahasjs søn, ydmygede Davids sendebud; i den krig, der fulgte, døde Urias foran Rabba, og David indtog byen og dens konges krone. Salomos ammonitiske hustru Naama var Rehabeams moder."
    - "Assyriske optegnelser nævner ammonitiske konger, der betaler tribut: Sanipu til Tiglat-Pileser 3. i 730'erne f.Kr., Pudu-ilu til Sankerib og Esarhaddon, Amminadab til Assurbanipal. Ammonitiske bander plagede Juda under Jojakim; Ba'alis, ammonitternes konge, skulle have sendt Gedaljas morder, den guvernør, som Nebukadnezar havde efterladt i Juda. Amos dømte Ammon for at have sønderrevet »de frugtsommelige i Gilead«, og Ezekiel for at sige »Ha ha!« over den ødelagte helligdom; Jeremias spurgte, hvorfor »Malkom« havde taget Gad til eje. Tobija, »den ammonitiske Tjener«, modsatte sig Nehemias, og tobiaderne forblev en magt øst for Jordan ind i 100-tallet f.Kr., med deres palads ved Iraq el-Amir."
    - "I 200-tallet f.Kr. blev Rabba genstiftet som Filadelfia efter Ptolemaios 2., og den regnedes senere blandt Dekapolis' byer. Ammon gik ind i den romerske provins Arabien i 106 e.Kr.; Justin Martyr, der skrev omkring 160, taler stadig om en stor mængde ammonitter. Efter den arabiske erobring vendte det gamle navn tilbage som Amman, siden 1921 Jordans hovedstad, en by med flere millioner indbyggere, hvis Citadel, den gamle Rabbas høj, ser ned på det romerske teater."
  sr:
    - "Амон је било мало краљевство источно од Јордана око престонице Раве, данашњег Амана, на горњем Јавоку, с Галадом на западу и северу, Моавом на југу и пустињом на истоку. Постање води Амонце, „синове Амонове“, од Лота и његове млађе кћери. Њихов бог био је Мелхом, коме је Соломун у старости служио: „хођаше … и за Мелхомом, гадом амонским“. Њихов језик, близак хебрејском и моавском, познат је из натписа са цитаделе у Аману из 9. века п. н. е., боце из Тел Сирана, печата и острака."
    - "Израиљу на путу у Ханан речено је да не дира Амонце, јер је њихова земља дата „синовима Лотовим у наследство“. У доба судија Амонци су тлачили Галад док их Јефтај није победио, пошто је доказивао да је Израиљ земљу источно од Јордана узео од Аморејаца, а не од Амона. Нас Амонац опсео је Јавис Галадски и тражио десно око његових људи, а Саулово ослобођење града учинило га је царем. Анун, Насов син, осрамотио је Давидове посланике; у рату који је уследио Урија је погинуо пред Равом, а Давид је узео град и круну његовог цара. Соломунова амонска жена Нама била је мајка Ровоамова."
    - "Асирски записи наводе амонске цареве који плаћају данак: Санипу Теглат-Феласару III 730-их п. н. е., Паду-илу Сенахиримови и Есарадону, Аминадав Асурбанипалу. Амонске чете харале су Јуду под Јоакимом; Валис, цар Амонаца, према предању послао је убицу Годолије, управитеља кога је Навуходоносор оставио у Јуди. Амос је осудио Амона што је парао „трудне жене у Галаду“, а Језекиљ што је рекао „Аха“ над оскврњеном светињом; Јеремија је питао: „Зашто Малхом наследи земљу Гадову?“ Товија, „слуга Амонац“, противио се Немији, а Товијади су остали сила источно од Јордана до 2. века п. н. е., с палатом у Ирак ел-Амиру."
    - "У 3. веку п. н. е. Рава је обновљена као Филаделфија по Птолемеју II, а касније је убројана међу градове Декаполиса. Амон је 106. н. е. ушао у римску провинцију Арабију; Јустин Мученик, пишући око 160, још говори о великом мноштву Амонаца. После арапског освајања старо име вратило се као Аман, од 1921. престоница Јордана, град од неколико милиона људи чија Цитадела, брдо древне Раве, надвисује римско позориште."
