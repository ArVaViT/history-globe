body:
  en:
    - 'Ammon was the small kingdom east of the Jordan around its capital Rabbah, now Amman, on the upper Jabbok, with Gilead to the west and north, Moab to the south and the desert to the east. Genesis traces the Ammonites, "the children of Ammon", to Lot and his younger daughter. Their god was Milcom, "the abomination of the Ammonites", whom Solomon served in his old age. Their language, close to Hebrew and Moabite, is known from the Amman Citadel inscription of the ninth century BC, the Tell Siran bottle, seals and ostraca.'
    - 'Israel on its way to Canaan was told not to meddle with the Ammonites, since their land was given "unto the children of Lot for a possession". In the time of the judges the Ammonites oppressed Gilead until Jephthah defeated them, having argued that Israel had taken its land east of the Jordan from the Amorites, not from Ammon. Nahash the Ammonite besieged Jabesh-gilead and demanded the right eyes of its men, and Saul''s relief of the city made him king. Hanun, Nahash''s son, shamed David''s envoys; in the war that followed Uriah died before Rabbah, and David took the city and its king''s crown. Solomon''s Ammonite wife Naamah was the mother of Rehoboam.'
    - 'Assyrian records list Ammonite kings paying tribute: Sanipu to Tiglath-pileser III in the 730s BC, Pudu-ilu to Sennacherib and Esarhaddon, Amminadab to Ashurbanipal. Ammonite bands harried Judah under Jehoiakim; Baalis, king of the Ammonites, sent the murderer of Gedaliah, the governor whom Nebuchadnezzar had left in Judah. Amos condemned Ammon for ripping up "the women with child of Gilead", and Ezekiel for saying "Aha" over the ruined sanctuary; Jeremiah asked why "their king" had inherited Gad. Tobiah "the Ammonite" opposed Nehemiah, and the Tobiads remained a power east of the Jordan into the second century BC, with their palace at Iraq el-Amir.'
    - "In the third century BC Rabbah was refounded as Philadelphia after Ptolemy II, and it later counted among the cities of the Decapolis. Ammon passed into the Roman province of Arabia in AD 106; Justin Martyr, writing about 160, still speaks of a great multitude of Ammonites. After the Arab conquest the old name returned as Amman, since 1921 the capital of Jordan, a city of several million people whose Citadel, the hill of ancient Rabbah, overlooks the Roman theatre."
  ru:
    - "Аммон — небольшое царство к востоку от Иордана вокруг столицы Раввы, нынешнего Аммана, на верхнем Иавоке; на западе и севере лежал Галаад, на юге — Моав, а на востоке — пустыня. Книга Бытия возводит Аммонитян, «сынов Аммоновых», к Лоту и его младшей дочери. Их богом был Милхом; Соломон под старость стал служить «Милхому, мерзости Аммонитской». Их язык, близкий к еврейскому и моавитскому, известен по надписи из цитадели Аммана IX века до н. э., бутылке из Телль-Сирана, печатям и остраконам."
    - "Израилю на пути в Ханаан было велено не враждовать с Аммонитянами, ибо их земля отдана «во владение сынам Лотовым». Во времена судей Аммонитяне теснили Галаад, пока их не разбил Иеффай, доказывавший, что землю за Иорданом Израиль взял у Аморреев, а не у Аммона. Наас Аммонитянин осадил Иавис Галаадский и потребовал выколоть его жителям правый глаз; Саул, выручив город, утвердился на царстве. Аннон, сын Нааса, обесчестил послов Давида; в последовавшей войне под Раввой погиб Урия, а Давид взял город и венец его царя. Аммонитянка Наама, жена Соломона, была матерью Ровоама."
    - "Ассирийские записи перечисляют аммонитских царей, плативших дань: Санипу — Феглаффелласару III в 730-х годах до н. э., Пуду-илу — Сеннахириму и Асардану, Амминадаба — Ашшурбанапалу. Полчища Аммонитян тревожили Иудею при Иоакиме; Ваалис, царь сыновей Аммоновых, подослал убийцу к Годолии, наместнику, которого Навуходоносор оставил в Иудее. Амос осуждал Аммон за то, что «они рассекали беременных в Галааде», а Иезекииль — за злорадство над поруганным святилищем; Иеремия спрашивал, почему Малхом завладел Гадом. Товия Аммонитянин противился Неемии, и Товиады оставались силой за Иорданом до II века до н. э.; их дворец стоит в Ирак-эль-Амире."
    - "В III веке до н. э. Равва была основана заново как Филадельфия в честь Птолемея II, а позже числилась среди городов Десятиградия. В 106 г. н. э. Аммон вошёл в римскую провинцию Аравия; Иустин Мученик около 160 г. ещё говорит о великом множестве Аммонитян. После арабского завоевания вернулось древнее имя — Амман, с 1921 года столица Иордании, город с населением в несколько миллионов, чья Цитадель, холм древней Раввы, возвышается над римским театром."
  uk:
    - "Аммон було невеликим царством на схід від Йордану навколо своєї столиці Равви, нині Амману, на верхньому Яббоці, з Гілеадом на заході й півночі, Моавом на півдні та пустелею на сході. Буття виводить аммонітян від Лота та його молодшої доньки. Їхнім богом був Мілком, якому Соломон на старість став служити: «Молохові, гидотї Аммонїйській». Їхню мову, близьку до івриту і моавитської, знають з напису з цитаделі Амману IX століття до н. е., пляшки з Телль-Сіран, печаток та остраконів."
    - "Ізраїлю на шляху до Ханаану було наказано не чіпати аммонітян, бо їхню землю віддано: «синам Лотовим я оддав її в державу». За часів суддів аммонітяни гнобили Гілеад, поки Єфтай не переміг їх, довівши, що Ізраїль узяв свою землю на схід від Йордану в аморіїв, а не в Аммона. Наас Аммонітянин облягав Явіс Гілеадський і вимагав праві очі його чоловіків, і порятунок міста Саулом зробив його царем. Аннон, син Наасів, осоромив посланців Давида; у війні, що настала, Урія загинув перед Раввою, а Давид узяв місто й вінець його царя. Аммонітянка Наама, дружина Соломона, була матір'ю Ровоама."
    - "Ассирійські записи називають аммонітських царів, що сплачували данину: Саніпу — Тіглатпаласару III у 730-х рр. до н. е., Пуду-ілу — Сінаххерібові й Асархаддонові, Амінадав — Ашшурбаніпалові. Аммонітські загони завдавали збитків Юді за Йоакима; Вааліс, цар аммонітян, послав убивцю Гедалії, намісника, якого Навуходоносор залишив у Юдеї. Амос засудив Аммон за те, що розтинали «жінок вагітних» у Гілеаді, а Єзекіїль — за те, що казав «Ага!» над зруйнованою святинею; Єремія питав, чому їхній цар успадкував Гад. Товія, «слуга Амманицький», противився Неемії, і Товіади лишалися силою на схід від Йордану до II століття до н. е. зі своїм палацом в Ірак-ель-Емірі."
    - "У III столітті до н. е. Равву заснували наново як Філадельфію на честь Птолемея II, і згодом вона належала до міст Десятимістя. Аммон ввійшов до римської провінції Аравія в 106 р. н. е.; Юстин Мученик, пишучи близько 160 року, ще говорить про велике множество аммонітян. Після арабського завоювання стара назва повернулася як Амман, від 1921 року столиця Йорданії, місто з кількома мільйонами мешканців, чия Цитадель, пагорб давньої Равви, височіє над римським театром."
  es:
    - "Amón era el pequeño reino al este del Jordán en torno a su capital Rabá, hoy Amán, en el alto Jaboc, con Galaad al oeste y al norte, Moab al sur y el desierto al este. El Génesis hace descender a los amonitas, «los hijos de Ammón», de Lot y de su hija menor. Su dios era Milcom, «abominación de los Ammonitas», a quien Salomón sirvió en su vejez. Su lengua, próxima al hebreo y al moabita, se conoce por la inscripción de la Ciudadela de Amán del siglo IX a. C., la botella de Tell Siran, sellos y óstraca."
    - "A Israel, camino de Canaán, se le dijo que no se metiera con los amonitas, pues, como dijo Dios, «á los hijos de Lot la he dado por heredad». En tiempo de los jueces los amonitas oprimieron a Galaad hasta que Jefté los derrotó, tras argumentar que Israel había tomado su tierra al este del Jordán de los amorreos, no de Amón. Nahas el amonita sitió Jabes de Galaad y exigió el ojo derecho de sus hombres, y el socorro de Saúl a la ciudad lo hizo rey. Hanún, hijo de Nahas, humilló a los enviados de David; en la guerra que siguió, Urías murió ante Rabá, y David tomó la ciudad y la corona de su rey. Naama, la esposa amonita de Salomón, fue la madre de Roboam."
    - "Los registros asirios enumeran reyes amonitas que pagaban tributo: Sanipu a Tiglat-pileser III en la década de 730 a. C., Pudu-ilu a Senaquerib y Esarhaddón, Aminadab a Asurbanipal. Bandas amonitas hostigaron a Judá bajo Joacim; Baalis, rey de los amonitas, envió al asesino de Gedalías, el gobernador que Nabucodonosor había dejado en Judá. Amós condenó a Amón por abrir «las preñadas de Galaad», y Ezequiel por decir «¡Ea!» sobre el santuario en ruinas; Jeremías preguntó por qué «el rey de ellos» había tomado como por heredad a Gad. Tobías, «el siervo Ammonita», se opuso a Nehemías, y los tobíadas siguieron siendo una potencia al este del Jordán hasta el siglo II a. C., con su palacio en Iraq el-Amir."
    - "En el siglo III a. C. Rabá fue refundada como Filadelfia en honor de Ptolomeo II, y más tarde se contó entre las ciudades de la Decápolis. Amón pasó a la provincia romana de Arabia en 106 d. C.; Justino Mártir, escribiendo hacia 160, todavía habla de una gran multitud de amonitas. Tras la conquista árabe volvió el antiguo nombre como Amán, desde 1921 capital de Jordania, una ciudad de varios millones de habitantes cuya Ciudadela, la colina de la antigua Rabá, domina el teatro romano."
  pt:
    - "Amom era o pequeno reino a leste do Jordão em torno de sua capital Rabá, hoje Amã, no alto Jaboque, com Gileade a oeste e ao norte, Moabe ao sul e o deserto a leste. Gênesis faz remontar os amonitas, “os filhos de Amom”, a Ló e à sua filha mais nova. Seu deus era Milcom, “a abominação dos amonitas”, a quem Salomão serviu na velhice. Sua língua, próxima do hebraico e do moabita, é conhecida pela inscrição da Cidadela de Amã, do século IX a.C., pelo frasco de Tell Siran, por selos e óstracos."
    - "A Israel, a caminho de Canaã, foi dito que não se metesse com os amonitas, pois sua terra fora dada “aos filhos de Ló por possessão”. No tempo dos juízes, os amonitas oprimiram Gileade até que Jefté os derrotou, tendo argumentado que Israel tomara sua terra a leste do Jordão dos amorreus, e não de Amom. Naás, o amonita, sitiou Jabes-Gileade e exigiu o olho direito de seus homens, e o socorro de Saul à cidade o fez rei. Hanum, filho de Naás, humilhou os enviados de Davi; na guerra que se seguiu, Urias morreu diante de Rabá, e Davi tomou a cidade e a coroa de seu rei. Naamá, esposa amonita de Salomão, foi mãe de Roboão."
    - "Registros assírios listam reis amonitas pagando tributo: Sanipu a Tiglate-Pileser III na década de 730 a.C., Pudu-ilu a Senaqueribe e Esar-Hadom, Aminadabe a Assurbanípal. Bandos amonitas assolaram Judá sob Jeoaquim; Baalis, rei dos amonitas, enviou o assassino de Gedalias, o governador que Nabucodonosor deixara em Judá. Amós condenou Amom por rasgar o ventre das “mulheres grávidas de Gileade”, e Ezequiel por dizer “Ahá!” sobre o santuário arruinado; Jeremias perguntou por que Milcom “tomou posse de Gade”. Tobias, “o servo amonita”, opôs-se a Neemias, e os tobíadas continuaram sendo uma potência a leste do Jordão até o século II a.C., com seu palácio em Iraq el-Amir."
    - "No século III a.C., Rabá foi refundada como Filadélfia em honra de Ptolomeu II, e depois contou-se entre as cidades da Decápolis. Amom passou à província romana da Arábia em 106 d.C.; Justino Mártir, escrevendo por volta de 160, ainda fala de uma grande multidão de amonitas. Depois da conquista árabe o nome antigo voltou como Amã, desde 1921 a capital da Jordânia, cidade de vários milhões de habitantes cuja Cidadela, a colina da antiga Rabá, domina o teatro romano."
  de:
    - "Ammon war das kleine Königreich östlich des Jordan um seine Hauptstadt Rabba, das heutige Amman, am oberen Jabbok, mit Gilead im Westen und Norden, Moab im Süden und der Wüste im Osten. Das erste Buch Mose führt die Ammoniter, „die Kinder Ammon“, auf Lot und seine jüngere Tochter zurück. Ihr Gott war Milkom, „der Greuel der Ammoniter“, dem Salomo in seinem Alter diente. Ihre Sprache, dem Hebräischen und Moabitischen nahe, ist aus der Inschrift der Zitadelle von Amman aus dem 9. Jahrhundert v. Chr., der Flasche von Tell Siran, Siegeln und Ostraka bekannt."
    - "Auf dem Weg nach Kanaan wurde Israel geboten, sich nicht mit den Ammonitern einzulassen, denn ihr Land sei „den Kindern Lot zu besitzen gegeben“. In der Richterzeit unterdrückten die Ammoniter Gilead, bis Jeftah sie besiegte, nachdem er geltend gemacht hatte, Israel habe sein Land östlich des Jordan von den Amoritern genommen, nicht von Ammon. Nahas, der Ammoniter, belagerte Jabesch in Gilead und forderte das rechte Auge seiner Männer, und Sauls Entsatz der Stadt machte ihn zum König. Hanun, Nahas' Sohn, beschämte Davids Gesandte; im folgenden Krieg fiel Uria vor Rabba, und David nahm die Stadt und die Krone ihres Königs. Salomos ammonitische Frau Naama war die Mutter Rehabeams."
    - "Assyrische Aufzeichnungen nennen ammonitische Könige als Tributpflichtige: Sanipu unter Tiglat-Pileser III. in den 730er Jahren v. Chr., Pudu-ilu unter Sanherib und Asarhaddon, Amminadab unter Assurbanipal. Ammonitische Banden plagten Juda unter Jojakim; Baalis, der König der Ammoniter, sandte den Mörder Gedaljas, des Statthalters, den Nebukadnezar in Juda gelassen hatte. Amos verurteilte Ammon, weil es „die Schwangeren in Gilead zerrissen“ hatte, Hesekiel, weil es über das Heiligtum sprach: „Ha! es ist entheiligt!“; Jeremia fragte, warum „Milkom“ das Land Gad besitze. Tobija, „der ammonitische Knecht“, widersetzte sich Nehemia, und die Tobiaden blieben bis ins 2. Jahrhundert v. Chr. eine Macht östlich des Jordan, mit ihrem Palast in Araq el-Emir."
    - "Im 3. Jahrhundert v. Chr. wurde Rabba nach Ptolemaios II. als Philadelphia neu gegründet und zählte später zu den Städten der Dekapolis. Ammon ging 106 n. Chr. in die römische Provinz Arabien über; Justin der Märtyrer spricht um 160 noch von einer großen Menge Ammoniter. Nach der arabischen Eroberung kehrte der alte Name als Amman zurück, seit 1921 die Hauptstadt Jordaniens, eine Stadt mit mehreren Millionen Einwohnern, deren Zitadelle, der Hügel des antiken Rabba, über das römische Theater blickt."
  fr:
    - "Ammon était le petit royaume à l’est du Jourdain autour de sa capitale Rabba, aujourd’hui Amman, sur le haut Jabbok, avec Galaad à l’ouest et au nord, Moab au sud et le désert à l’est. La Genèse fait remonter les Ammonites, « les enfants d’Ammon », à Lot et à sa fille cadette. Leur dieu était Milcom, « l’abomination des Ammonites », que Salomon servit dans sa vieillesse. Leur langue, proche de l’hébreu et du moabite, est connue par l’inscription de la Citadelle d’Amman du IXe siècle av. J.-C., le flacon de Tell Siran, des sceaux et des ostraca."
    - "En route vers Canaan, Israël reçut l’ordre de ne pas attaquer les Ammonites, car leur pays était donné « aux enfants de Lot en propriété ». Au temps des juges, les Ammonites opprimèrent Galaad jusqu’à ce que Jephté les battît, après avoir soutenu qu’Israël avait pris son pays à l’est du Jourdain aux Amoréens, non à Ammon. Nachasch l’Ammonite assiégea Jabès en Galaad et exigea l’œil droit de ses hommes, et la délivrance de la ville par Saül le fit roi. Hanun, fils de Nachasch, outragea les envoyés de David ; dans la guerre qui suivit, Urie mourut devant Rabba, et David prit la ville et la couronne de son roi. Naama l’Ammonite, épouse de Salomon, fut la mère de Roboam."
    - "Les annales assyriennes citent des rois ammonites payant tribut : Sanipu à Tiglath-Piléser III dans les années 730 av. J.-C., Pudu-ilu à Sanchérib et à Esar-Haddon, Amminadab à Assurbanipal. Des bandes ammonites harcelèrent Juda sous Jojakim ; Baalis, roi des Ammonites, envoya l’assassin de Guedalia, le gouverneur que Nebucadnetsar avait laissé en Juda. Amos condamna Ammon pour avoir fendu le ventre des « femmes enceintes de Galaad », et Ézéchiel pour avoir dit « Ah ! Ah ! » sur le sanctuaire profané ; Jérémie demandait : « Pourquoi Malcom possède-t-il Gad ? ». Tobija, « le serviteur ammonite », s’opposa à Néhémie, et les Tobiades restèrent une puissance à l’est du Jourdain jusqu’au IIe siècle av. J.-C., avec leur palais d’Iraq el-Amir."
    - "Au IIIe siècle av. J.-C., Rabba fut refondée sous le nom de Philadelphie, d’après Ptolémée II, et compta plus tard parmi les villes de la Décapole. Ammon passa dans la province romaine d’Arabie en 106 apr. J.-C. ; Justin martyr, écrivant vers 160, parle encore d’une grande multitude d’Ammonites. Après la conquête arabe, l’ancien nom revint sous la forme Amman, capitale de la Jordanie depuis 1921, ville de plusieurs millions d’habitants dont la Citadelle, colline de l’antique Rabba, domine le théâtre romain."
