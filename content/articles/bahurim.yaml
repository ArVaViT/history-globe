body:
  en:
    - "Bahurim was a village of Benjamin just east of Jerusalem, on the road that drops from the Mount of Olives toward Jericho and the Jordan. It is known only from the story of David. When Abner brought Michal back to David, her husband Paltiel “went with her along weeping behind her to Bahurim”, until Abner sent him home. As David fled from Absalom and “came to Bahurim”, Shimei the son of Gera, of Saul's clan, came out cursing, “Come out, come out, thou bloody man”, and threw stones and dust at the king from the hillside opposite."
    - "Soon after, the priests' sons Jonathan and Ahimaaz, carrying news to David, hid in a well in a courtyard at Bahurim while the woman of the house spread a cloth over its mouth and scattered grain on it. Shimei of Bahurim hurried to meet the returning king at the Jordan, and David on his deathbed reminded Solomon of “a Benjamite of Bahurim, which cursed me with a grievous curse”. Azmaveth the Barhumite, one of David's thirty, came from the same village."
    - "The Targum rendered Bahurim as Almath, the priestly town Alemeth (Almit) north-east of Jerusalem, and some older scholars followed it. Most now place the village at Ras et-Tmim, a hilltop east of the Mount of Olives and Mount Scopus, above the ancient road to Jericho, about 2.5 km from the Temple Mount, which suits a road east out of the city and a slope above it from which Shimei could throw stones; a survey of the Israel Antiquities Authority in 2007–2008 collected pottery there mostly of the Iron Age and the Early Roman and Byzantine periods. Another site nearby is the second candidate on the map. Neither has been excavated, and beyond its general position nothing about Bahurim is certain."
    - "The ridge lies today at the eastern edge of Jerusalem, between the villages of al-Isawiya and et-Tur, below the Mount Scopus campus of the Hebrew University, above the highway that runs down to the Jordan valley."
  ru:
    - "Бахурим — селение Вениаминово сразу к востоку от Иерусалима, на дороге, спускающейся с Елеонской горы к Иерихону и Иордану. Оно известно только из истории Давида. Когда Авенир вёл Мелхолу обратно к Давиду, её муж Фалтий «с плачем провожал ее до Бахурима», пока Авенир не отослал его домой. Когда, бежа от Авессалома, «дошел царь Давид до Бахурима», Семей, сын Геры, из рода Саулова, вышел злословя: «уходи, уходи, убийца и беззаконник!», и бросал в царя камнями и пылью с противоположного склона."
    - "Вскоре сыновья священников Ионафан и Ахимаас, нёсшие весть Давиду, спрятались в колодце во дворе в Бахуриме, а хозяйка растянула над устьем покрывало и насыпала на него крупы. Семей из Бахурима поспешил встретить возвращающегося царя у Иордана, а Давид на смертном одре напомнил Соломону: «Вот еще у тебя Семей, сын Геры Вениамитянина из Бахурима; он злословил меня тяжким злословием». Азмавет Бархюмитянин, один из тридцати храбрых Давида, был родом из того же селения."
    - "Таргум передал Бахурим как Алмаф — священнический город Алемеф (Альмит) к северо-востоку от Иерусалима, и некоторые старые учёные шли за ним. Большинство теперь помещает селение в Рас-эт-Тмим, холм к востоку от Елеонской горы и горы Скопус, над древней дорогой в Иерихон, примерно в 2,5 км от Храмовой горы: это подходит и дороге на восток из города, и склону над ней, с которого Семей мог бросать камни; обследование Управления древностей Израиля в 2007–2008 годах собрало там керамику в основном железного века, раннеримского и византийского времени. Другое место рядом — второй кандидат на карте. Ни тот, ни другой не раскопаны, и, кроме общего положения, о Бахуриме ничего достоверно не известно."
    - "Сегодня этот гребень лежит на восточной окраине Иерусалима, между деревнями Эль-Исавия и Эт-Тур, ниже кампуса Еврейского университета на горе Скопус, над шоссе, спускающимся в Иорданскую долину."
  uk:
    - "Бахурім було селом Веніяміна трохи на схід від Єрусалима, на дорозі, що спускається від Оливкової гори до Єрихону та Йордану. Воно відоме лише з історії Давида. Коли Авенір повернув Давидові Мелхолу, її чоловік Фалтіїл «проводжав її плачучи до Багуриму», аж доки Авенір не відіслав його додому. Коли Давид утікав від Авесалома й «дойшов ... до Бахурима», Шимей, син Гери, з роду Саула, вийшов, проклинаючи: «Втїкай, втїкай, убийнику й безбожнику!», і метав у царя каміння та землю зі схилу навпроти."
    - "Невдовзі сини священників Йонатан та Ахімаас, несучи вісті Давидові, сховалися в колодязі на подвір'ї в Бахурімі, а жінка з дому накрила його гирло полотном і розсипала на ньому крупи. Шимей з Бахуріма поспішив зустріти царя, що повертався, на Йордані, а Давид на смертному одрі нагадав Соломонові про «Беняминїя з Бахуриму: сей проклинав мене тяжко». Азмавет Бархумянин, один з тридцяти Давида, походив із того самого села."
    - "Таргум передавав Бахурім як Алмат, священницьке місто Алемет (Алмит) на північний схід від Єрусалима, і деякі давніші вчені йшли за ним. Нині більшість розміщує село в Рас-ет-Тмімі, на вершині пагорба на схід від Оливкової гори та гори Скопус, над давньою дорогою до Єрихону, приблизно за 2,5 км від Храмової гори, що пасує дорозі на схід з міста та схилу над нею, з якого Шимей міг метати каміння; розвідка Управління старожитностей Ізраїлю 2007–2008 рр. зібрала там кераміку здебільшого залізної доби та раннього римського і візантійського періодів. Інше місце поблизу — другий кандидат на мапі. Жодне не розкопане, і крім загального розташування нічого про Бахурім не певне."
    - "Нині цей хребет лежить на східному краї Єрусалима, між селами аль-Ісавія та ет-Тур, під кампусом Єврейського університету на горі Скопус, над шосе, що спускається до Йорданської долини."
  es:
    - "Bahurim era una aldea de Benjamín justo al este de Jerusalén, en el camino que desciende del monte de los Olivos hacia Jericó y el Jordán. Se conoce solo por la historia de David. Cuando Abner devolvió a Mical a David, su marido Paltiel «fué con ella, siguiéndola y llorando hasta Bahurim», hasta que Abner lo mandó a casa. Cuando David huía de Absalón y «vino el rey David hasta Bahurim», Simei hijo de Gera, del clan de Saúl, salió maldiciendo: «Sal, sal, varón de sangres, y hombre de Belial», y arrojaba piedras y polvo al rey desde la ladera opuesta."
    - "Poco después, los hijos de los sacerdotes, Jonatán y Ahimaas, que llevaban noticias a David, se escondieron en un pozo en un patio de Bahurim mientras la mujer de la casa extendía un paño sobre su boca y esparcía grano sobre él. Simei de Bahurim se apresuró a salir al encuentro del rey que regresaba, en el Jordán, y David, en su lecho de muerte, recordó a Salomón a «Semei hijo de Gera, hijo de Benjamín, de Bahurim, el cual me maldijo con una maldición fuerte». Azmavet el barhumita, uno de los treinta de David, procedía de la misma aldea."
    - "El Targum tradujo Bahurim como Almath, la ciudad sacerdotal de Alamet (Almit), al nordeste de Jerusalén, y algunos estudiosos antiguos lo siguieron. La mayoría sitúa ahora la aldea en Ras et-Tmim, una cima al este del monte de los Olivos y del monte Scopus, sobre el antiguo camino de Jericó, a unos 2,5 km del monte del Templo, lo que cuadra con un camino que sale hacia el este de la ciudad y con una ladera sobre él desde la que Simei podía arrojar piedras; una prospección de la Autoridad de Antigüedades de Israel en 2007–2008 reunió allí cerámica sobre todo de la edad del Hierro y de los períodos romano antiguo y bizantino. Otro sitio cercano es el segundo candidato del mapa. Ninguno ha sido excavado, y más allá de su posición general nada sobre Bahurim es seguro."
    - "La cresta se halla hoy en el borde oriental de Jerusalén, entre las aldeas de al-Isawiya y et-Tur, bajo el campus del monte Scopus de la Universidad Hebrea, sobre la carretera que baja al valle del Jordán."
  pt:
    - "Baurim era uma aldeia de Benjamim logo a leste de Jerusalém, na estrada que desce do monte das Oliveiras rumo a Jericó e ao Jordão. É conhecida apenas pela história de Davi. Quando Abner trouxe Mical de volta a Davi, o marido dela, Paltiel, “foi com ela, chorando pelo caminho, e a seguiu até Baurim”, até que Abner o mandou voltar. Quando Davi fugia de Absalão e “chegou a Baurim”, Simei, filho de Gera, do clã de Saul, saiu amaldiçoando: “Vá embora, vá embora, homem sanguinário”, e atirava pedras e poeira no rei da encosta oposta."
    - "Pouco depois, os filhos dos sacerdotes, Jônatas e Aimaás, que levavam notícias a Davi, esconderam-se num poço no pátio de uma casa em Baurim, enquanto a mulher da casa estendia uma coberta sobre a boca dele e espalhava grãos sobre ela. Simei de Baurim apressou-se a ir ao encontro do rei que voltava, no Jordão, e Davi, em seu leito de morte, lembrou a Salomão “o benjamita de Baurim, que me amaldiçoou com uma terrível maldição”. Azmavete, o barumita, um dos trinta de Davi, era da mesma aldeia."
    - "O Targum traduziu Baurim por Almath, a cidade sacerdotal Alemete (Almit), a nordeste de Jerusalém, e alguns estudiosos antigos o seguiram. A maioria põe hoje a aldeia em Ras et-Tmim, um cume a leste do monte das Oliveiras e do monte Scopus, acima da antiga estrada para Jericó, a cerca de 2,5 km do monte do Templo, o que convém a uma estrada a leste da cidade e a uma encosta acima da qual Simei podia atirar pedras; um levantamento da Autoridade de Antiguidades de Israel em 2007–2008 recolheu ali cerâmica sobretudo da Idade do Ferro e dos períodos romano antigo e bizantino. Outro sítio próximo é o segundo candidato do mapa. Nenhum foi escavado e, além da posição geral, nada é certo sobre Baurim."
    - "A crista fica hoje na borda oriental de Jerusalém, entre as aldeias de al-Isawiya e et-Tur, abaixo do campus do monte Scopus da Universidade Hebraica, acima da rodovia que desce ao vale do Jordão."
  de:
    - "Bahurim war ein Dorf Benjamins unmittelbar östlich von Jerusalem, an der Straße, die vom Ölberg Richtung Jericho und Jordan abfällt. Es ist nur aus der Geschichte Davids bekannt. Als Abner Michal zu David zurückbrachte, „ging ihr Mann mit ihr und weinte hinter ihr bis gen Bahurim“, Paltiël, bis Abner ihn heimschickte. Als David vor Absalom floh und „bis gen Bahurim kam“, trat Schimi, der Sohn Geras, aus Sauls Sippe, fluchend heraus: „Heraus, heraus, du Bluthund, du heilloser Mann!“, und warf von dem gegenüberliegenden Hang Steine und Staub auf den König."
    - "Bald darauf versteckten sich die Priestersöhne Jonatan und Ahimaaz, die David Nachricht brachten, in Bahurim in einem Brunnen im Hof, während die Frau des Hauses ein Tuch über seine Öffnung breitete und Grütze darauf streute. Schimi von Bahurim eilte dem heimkehrenden König am Jordan entgegen, und David erinnerte Salomo auf dem Sterbebett an „den Benjaminiter von Bahurim, der mir schändlich fluchte“. Asmawet der Barhumiter, einer von Davids Dreißig, stammte aus demselben Dorf."
    - "Der Targum gab Bahurim als Almath wieder, die Priesterstadt Alemet (Almit) nordöstlich von Jerusalem, und einige ältere Gelehrte folgten ihm. Die meisten setzen das Dorf heute nach Ras et-Tmim, einer Anhöhe östlich des Ölbergs und des Skopusbergs über der alten Straße nach Jericho, etwa 2,5 km vom Tempelberg, was zu einer Straße aus der Stadt nach Osten und einem Hang darüber passt, von dem Schimi Steine werfen konnte; ein Survey der Israelischen Antikenbehörde 2007–2008 sammelte dort Keramik überwiegend der Eisenzeit und der frührömischen und byzantinischen Zeit. Eine andere Stätte in der Nähe ist der zweite Kandidat auf der Karte. Keine wurde ausgegraben, und über die ungefähre Lage hinaus ist über Bahurim nichts sicher."
    - "Der Höhenzug liegt heute am Ostrand Jerusalems, zwischen den Dörfern al-Isawiya und et-Tur, unterhalb des Skopusberg-Campus der Hebräischen Universität, über der Straße, die ins Jordantal hinabführt."
  fr:
    - "Bachurim était un village de Benjamin juste à l’est de Jérusalem, sur la route qui descend du mont des Oliviers vers Jéricho et le Jourdain. Il n’est connu que par l’histoire de David. Quand Abner ramena Mical à David, son mari Paltiel « la suivit en pleurant jusqu’à Bachurim », jusqu’à ce qu’Abner le renvoie chez lui. Quand David fuyait Absalom et « était arrivé jusqu’à Bachurim », Schimeï, fils de Guéra, du clan de Saül, sortit en le maudissant : « Va-t’en, va-t’en, homme de sang », et lui jeta pierres et poussière depuis le versant d’en face."
    - "Peu après, les fils des prêtres, Jonathan et Achimaats, portant des nouvelles à David, se cachèrent dans un puits dans une cour de Bachurim tandis que la femme de la maison étendait un drap sur son ouverture et y répandait du grain. Schimeï de Bachurim se hâta à la rencontre du roi qui revenait, au Jourdain, et David mourant rappela à Salomon « Schimeï, fils de Guéra, Benjamite, de Bachurim. Il a prononcé contre moi des malédictions violentes ». Azmaveth le Barhumite, l’un des trente de David, venait du même village."
    - "Le Targum rendait Bachurim par Almath, la ville sacerdotale Alémeth (Almit) au nord-est de Jérusalem, et certains savants anciens l’ont suivi. La plupart placent maintenant le village à Ras et-Tmim, colline à l’est du mont des Oliviers et du mont Scopus, au-dessus de l’ancienne route de Jéricho, à environ 2,5 km du mont du Temple, ce qui convient à une route sortant de la ville vers l’est et à une pente d’où Schimeï pouvait jeter des pierres ; une prospection de l’Autorité des antiquités d’Israël en 2007-2008 y a recueilli de la céramique surtout de l’âge du Fer et des époques romaine ancienne et byzantine. Un autre site proche est le deuxième candidat de la carte. Aucun n’a été fouillé, et hors sa position générale, rien de Bachurim n’est certain."
    - "La crête se trouve aujourd’hui à la lisière est de Jérusalem, entre les villages d’al-Isawiya et d’et-Tur, au-dessous du campus du mont Scopus de l’Université hébraïque, au-dessus de la route qui descend vers la vallée du Jourdain."
  it:
    - "Bacurim era un villaggio di Beniamino subito a est di Gerusalemme, sulla strada che scende dal Monte degli Ulivi verso Gerico e il Giordano. È noto soltanto dalla storia di Davide. Quando Abner riportò Mical a Davide, suo marito Paltiel «l’accompagnò piangendo, e la seguì fino a Bahurim», finché Abner lo rimandò a casa. Mentre Davide fuggiva da Assalonne e «fu giunto a Bahurim», Simei figlio di Gera, del clan di Saul, uscì maledicendo: «Vattene, vattene, uomo sanguinario, scellerato!», e gettò sassi e polvere contro il re dal pendio di fronte."
    - "Poco dopo, i figli dei sacerdoti Gionata e Achimaas, portando notizie a Davide, si nascosero in un pozzo nel cortile di una casa di Bacurim mentre la donna di casa stese un panno sulla sua bocca e vi sparse del grano. Simei di Bacurim si affrettò a incontrare il re di ritorno al Giordano, e Davide in punto di morte ricordò a Salomone «il Beniaminita, di Bahurim, il quale proferì contro di me una maledizione atroce». Azmàvet il Barhumita, uno dei trenta di Davide, veniva dallo stesso villaggio."
    - "Il Targum rese Bacurim come Almath, la città sacerdotale Alemet (Almit) a nord-est di Gerusalemme, e alcuni studiosi più antichi lo seguirono. La maggior parte oggi pone il villaggio a Ras et-Tmim, un’altura a est del Monte degli Ulivi e del Monte Scopus, sopra l’antica strada per Gerico, a circa 2,5 km dal Monte del Tempio, il che si accorda con una strada verso est fuori dalla città e un pendio sopra di essa da cui Simei poteva lanciare sassi; una ricognizione dell’Autorità israeliana per le antichità nel 2007–2008 vi ha raccolto ceramica per lo più dell’età del Ferro e dei periodi romano antico e bizantino. Un altro sito vicino è il secondo candidato sulla carta. Nessuno dei due è stato scavato, e oltre la sua posizione generale nulla su Bacurim è certo."
    - "La cresta si trova oggi al margine orientale di Gerusalemme, tra i villaggi di al-Isawiya e et-Tur, sotto il campus del Monte Scopus dell’Università ebraica, sopra l’autostrada che scende alla valle del Giordano."
  pl:
    - "Bachurim było wsią Beniamina tuż na wschód od Jerozolimy, przy drodze opadającej z Góry Oliwnej ku Jerychu i Jordanowi. Znane jest tylko z historii Dawida. Gdy Abner sprowadził Mikal z powrotem do Dawida, jej mąż Paltiel odprowadził ją: „szedł z nią mąż jej, a idąc za nią, płakał jej aż do Bachurym”, aż Abner kazał mu wrócić. Gdy Dawid uciekał przed Absalomem i „przyszedł król Dawid aż do Bahurym”, wyszedł Szimei, syn Gery, z rodu Saula, złorzecząc: „Wynijdź, wynijdź mężu krwi, i mężu niezbożny”, i rzucał kamienie i pył na króla ze zbocza naprzeciw."
    - "Wkrótce potem synowie kapłanów, Jonatan i Achimaas, niosący wieści Dawidowi, ukryli się w studni na dziedzińcu w Bachurim, a kobieta domu rozpostarła nad jej otworem tkaninę i rozsypała na niej ziarno. Szimei z Bachurim pospieszył na spotkanie wracającego króla nad Jordanem, a Dawid na łożu śmierci przypomniał Salomonowi Szimeiego, „syna Jemini, z Bahurym, który mi też złorzeczył złorzeczeniem wielkiem”. Azmawet Barhumita, jeden z trzydziestu Dawida, pochodził z tej samej wsi."
    - "Targum oddał Bachurim jako Almat, kapłańskie miasto Alemet (Almit) na północny wschód od Jerozolimy, i niektórzy dawniejsi uczeni poszli za nim. Większość umieszcza obecnie wieś w Ras et-Tmim, na wzgórzu na wschód od Góry Oliwnej i Góry Skopus, nad starożytną drogą do Jerycha, około 2,5 km od Wzgórza Świątynnego, co pasuje do drogi na wschód z miasta i do zbocza nad nią, z którego Szimei mógł rzucać kamienie; badanie powierzchniowe Izraelskiego Urzędu Starożytności w latach 2007–2008 zebrało tam ceramikę głównie z epoki żelaza oraz z wczesnego okresu rzymskiego i bizantyjskiego. Inne pobliskie stanowisko jest drugim kandydatem na mapie. Żadne nie było wykopywane i poza ogólnym położeniem nic o Bachurim nie jest pewne."
    - "Grzbiet leży dziś na wschodnim skraju Jerozolimy, między wsiami al-Isawiya i et-Tur, poniżej kampusu Uniwersytetu Hebrajskiego na Górze Skopus, nad szosą zbiegającą do Doliny Jordanu."
  nl:
    - "Bachurim was een dorp van Benjamin even ten oosten van Jeruzalem, aan de weg die van de Olijfberg afdaalt naar Jericho en de Jordaan. Het is alleen bekend uit het verhaal van David. Toen Abner Michal bij David terugbracht, “En haar man ging met haar, al gaande en wenende achter haar, tot Bahurim toe”, tot Abner hem naar huis zond. Toen David voor Absalom vluchtte en “tot aan Bahurim kwam”, kwam Simeï, de zoon van Gera, uit Sauls geslacht, onder vloeken naar buiten: “Ga uit, ga uit, gij, man des bloeds”, en wierp stenen en stof naar de koning vanaf de overliggende helling."
    - "Kort daarna verborgen de priesterzonen Jonatan en Achimaäs, die nieuws naar David brachten, zich in een put in een binnenplaats te Bachurim, terwijl de vrouw des huizes een doek over de opening spreidde en er graan op strooide. Simeï van Bachurim haastte zich de terugkerende koning bij de Jordaan tegemoet, en David herinnerde Salomo op zijn sterfbed aan “de zoon van Jemini, uit Bahurim, die mij vloekte met een geweldige vloek”. Azmaveth de Barchumiet, een van Davids dertig, kwam uit hetzelfde dorp."
    - "De Targoem gaf Bachurim weer als Almath, de priesterstad Alemet (Almit) ten noordoosten van Jeruzalem, en enkele oudere geleerden volgden dat. De meesten plaatsen het dorp nu op Ras et-Tmim, een heuveltop ten oosten van de Olijfberg en de Scopusberg, boven de oude weg naar Jericho, zo’n 2,5 km van de Tempelberg, wat past bij een weg uit de stad naar het oosten en een helling erboven vanwaar Simeï stenen kon gooien; een verkenning van de Israëlische Oudheidkundige Dienst in 2007–2008 verzamelde er aardewerk, meest uit de ijzertijd en de vroeg-Romeinse en Byzantijnse tijd. Een andere plaats in de buurt is de tweede kandidaat op de kaart. Geen van beide is opgegraven, en buiten zijn algemene ligging is niets over Bachurim zeker."
    - "De bergrug ligt nu aan de oostrand van Jeruzalem, tussen de dorpen al-Isawiya en et-Tur, onder de Scopusberg-campus van de Hebreeuwse Universiteit, boven de snelweg die afdaalt naar de Jordaanvallei."
  cs:
    - "Bachurím byla vesnice Benjamínova těsně východně od Jeruzaléma, na silnici klesající z Olivové hory k Jerichu a Jordánu. Je známa jen z Davidova příběhu. Když Abner přivedl Míkal zpět Davidovi, její manžel Paltiel „jda za ní až do Bahurim, plakal“, dokud ho Abner neposlal domů. Když David utíkal před Abšalomem a „bral se král David do Bahurim“, vyšel Šimei, syn Gerův, z Saulova rodu, a klel: „Vyjdi, vyjdi, vražedlníče a nešlechetníče“, a házel na krále kamení a prach ze svahu naproti."
    - "Brzy poté se synové kněží Jonatan a Achimaas, nesoucí zprávy Davidovi, ukryli ve studni na dvoře v Bachurímu, zatímco žena domu rozestřela na její ústí plachtu a nasypala na ni krupky. Šimei z Bachurímu pospíšil vstříc vracejícímu se králi k Jordánu a David na smrtelné posteli připomněl Šalomounovi „Semei syna Gery Beniaminského z Bahurim, kterýž mi zlořečil zlořečením velikým“. Azmavet Barchumský, jeden z Davidových třiceti, pocházel ze stejné vesnice."
    - "Targum překládal Bachurím jako Almat, kněžské město Alemet (Almit) severovýchodně od Jeruzaléma, a někteří starší badatelé jej následovali. Většina nyní klade vesnici na Ras et-Tmim, vrchol východně od Olivové hory a hory Scopus, nad starou silnicí do Jericha, asi 2,5 km od Chrámové hory, což se hodí k cestě na východ z města a ke svahu nad ní, z něhož mohl Šimei házet kamení; průzkum Izraelského úřadu pro starožitnosti v letech 2007–2008 tam shromáždil keramiku většinou z doby železné a z raně římského a byzantského období. Jiné místo nablízku je druhým kandidátem na mapě. Žádné z nich nebylo vykopáno a mimo svou obecnou polohu není o Bachurímu nic jisté."
    - "Hřeben leží dnes na východním okraji Jeruzaléma, mezi vesnicemi al-Isawiya a et-Tur, pod kampusem Hebrejské univerzity na hoře Scopus, nad silnicí, která sestupuje do Jordánského údolí."
  sv:
    - "Bahurim var en by i Benjamin strax öster om Jerusalem, vid vägen som sänker sig från Olivberget mot Jeriko och Jordan. Den är känd bara från berättelsen om David. När Avner förde Mikal tillbaka till David gick hennes man Paltiel ”med henne och följde henne under beständig gråt ända till Bahurim”, tills Avner skickade hem honom. När David flydde från Absalom och ”kommit till Bahurim”, trädde Shimi, Geras son, av Sauls släkt, ut med förbannelser: ”Bort, bort, du blodsman, du ogärningsman!”, och kastade stenar och grus på kungen från sluttningen mitt emot."
    - "Strax därefter gömde sig prästernas söner Jonatan och Achimaas, som bar bud till David, i en brunn på en gård i Bahurim medan kvinnan i huset bredde ett skynke över dess mynning och strödde gryn på det. Shimi från Bahurim skyndade för att möta den återvändande kungen vid Jordan, och David påminde på sin dödsbädd Salomo om ”benjaminiten från Bahurim, som for ut mot mig i gruvliga förbannelser”. Barhumiten Asmavet, en av Davids trettio, kom från samma by."
    - "Targum återgav Bahurim som Almath, prästernas stad Alemet (Almit) nordost om Jerusalem, och några äldre forskare följde det. De flesta förlägger nu byn till Ras et-Tmim, en bergstopp öster om Olivberget och Skopusberget, ovanför den forntida vägen till Jeriko, omkring 2,5 km från Tempelberget, vilket passar en väg österut ut ur staden och en sluttning ovanför den varifrån Shimi kunde kasta stenar; en undersökning av Israels fornminnesmyndighet 2007–2008 samlade där keramik mest från järnåldern och från tidig romersk och bysantinsk tid. En annan plats i närheten är den andra kandidaten på kartan. Ingen av dem har grävts ut, och utöver dess allmänna läge är ingenting om Bahurim säkert."
    - "Åsen ligger i dag vid Jerusalems östra kant, mellan byarna al-Isawiya och et-Tur, nedanför Hebreiska universitetets campus på Skopusberget, ovanför landsvägen som löper ned till Jordandalen."
