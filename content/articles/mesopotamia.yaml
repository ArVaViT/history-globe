body:
  en:
    - "Mesopotamia, Greek for “between the rivers”, is the land of the Euphrates and the Tigris. In the Old Testament the name, taken from the Septuagint, stands for the Hebrew Aram-naharaim, “Aram of the two rivers”: not Babylonia but the upper country around Haran, between the great bend of the Euphrates and the Khabur, in what is now south-eastern Turkey and north-eastern Syria. The Synodal Bible also renders Padan-aram, the home of Laban, as Mesopotamia. In the New Testament the word has its wider Greek sense: the “dwellers in Mesopotamia” at Pentecost are the Jews of Babylonia, and Stephen says that God appeared to Abraham “when he was in Mesopotamia, before he dwelt in Charran”, that is, at Ur."
    - "Abraham's servant “went to Mesopotamia, unto the city of Nahor” to find Rebekah, and Jacob was sent to the same house for his wives. Balaam, whom Balak hired, was “of Pethor of Mesopotamia”; Pethor is the Pitru on the river Sajur near Carchemish that Shalmaneser III names in his annals. In the days of the judges the Lord sold Israel “into the hand of Chushan-rishathaim king of Mesopotamia”, whom they served eight years until Othniel delivered them, and the Ammonites hired chariots against David “out of Mesopotamia”, a war remembered in the title of Psalm 60."
    - "In the wider sense Mesopotamia is the cradle of the cities, writing and empires of the Bible's world: Ur, Babel and Babylon on the Euphrates, Asshur, Calah and Nineveh on the Tigris. The Greeks gave the land its name in the age of Alexander; Trajan made it a Roman province in AD 116, given up by Hadrian a year later, and Septimius Severus again in the 190s. The Jews carried to Babylon stayed, and their schools produced the Babylonian Talmud; the Church of the East grew at Edessa and Nisibis and spread from there to India and China."
    - "Today the land between the rivers is Iraq, with the north-east of Syria and the south-east of Turkey. Haran is a village of beehive houses near Şanlıurfa; the rivers are dammed at Keban, Atatürk, Tabqa and Mosul, and the marshes of the lower Tigris and Euphrates, drained in the 1990s, have been partly restored."
  ru:
    - "Месопотамия, по-гречески «Междуречье», — земля Евфрата и Тигра. В Ветхом Завете это имя, взятое из Септуагинты, передаёт еврейское Арам-Нахараим, «Арам двух рек»: не Вавилонию, а верхнюю страну вокруг Харрана, между большой излучиной Евфрата и Хабуром, на нынешнем юго-востоке Турции и северо-востоке Сирии. Синодальный перевод называет Месопотамией и Паддан-Арам, родину Лавана. В Новом Завете слово имеет широкий греческий смысл: «жители Месопотамии» в день Пятидесятницы — это Иудеи Вавилонии, а Стефан говорит, что Бог явился Аврааму «в Месопотамии, прежде переселения его в Харран», то есть в Уре."
    - "Раб Авраама «пошел в Месопотамию, в город Нахора», чтобы найти Ревекку, и Иаков был послан в тот же дом за жёнами. Валаам, которого нанял Валак, был «из Пефора Месопотамского»; Пефор — это Питру на реке Саджур близ Кархемиса, который Салманасар III называет в своих анналах. Во дни судей Господь предал Израиль «в руки Хусарсафема, царя Месопотамского», которому они служили восемь лет, пока их не избавил Гофониил, а Аммонитяне наняли против Давида колесницы «из Сирии Месопотамской» — война, о которой помнит надписание 59-го псалма."
    - "В широком смысле Месопотамия — колыбель городов, письменности и империй библейского мира: Ур, Вавилон на Евфрате, Ассур, Калах и Ниневия на Тигре. Греки дали земле имя в эпоху Александра; Траян сделал её римской провинцией в 116 г. н. э., оставленной Адрианом через год, а Септимий Север — вновь в 190-х годах. Уведённые в Вавилон Иудеи остались там, и их школы создали Вавилонский Талмуд; Церковь Востока выросла в Едессе и Нисибине и распространилась оттуда до Индии и Китая."
    - "Сегодня земля между реками — это Ирак с северо-востоком Сирии и юго-востоком Турции. Харран — деревня с домами-ульями близ Шанлыурфы; реки перегорожены плотинами Кебан, Ататюрк, Табка и Мосул, а болота нижнего Тигра и Евфрата, осушенные в 1990-х годах, частично восстановлены."
  uk:
    - "Месопотамія, грецькою «межиріччя», — країна Євфрату й Тигру. У Старому Завіті ця назва, узята з Септуагінти, стоїть замість староєврейського Арам-Нагараїм, «Арам двох рік»: не Вавилонія, а верхній край навколо Харану, між великою дугою Євфрату й Хабуром, у нинішній південно-східній Туреччині та північно-східній Сирії. Синодальний переклад також передає Падан-Арам, дім Лавана, як Месопотамію. У Новому Завіті слово має ширше грецьке значення: «що домуємо в Мезопотамії» на П’ятидесятницю — це євреї Вавилонії, а Стефан каже, що Бог явився Авраамові, «як був у Мезопотамії, перш нїж оселив ся він у Харані», тобто в Урі."
    - "Слуга Авраама «пійшов у Месопотамію, у Нахорів город», щоб знайти Ревеку, а Якова послали до того самого дому по дружин. Валаам, якого найняв Валак, був «із Пегора в Мезопотамії»; Пефор — це Пітру на ріці Саджур поблизу Кархемиша, названий Салманассаром III у його анналах. За днів суддів Господь віддав Ізраїль «на поталу Хузанові Русатаїмові, цареві Мезопотамїї», якому вони служили вісім років, аж поки Отніїл не визволив їх, а аммонійці найняли колесниці проти Давида «із Сириї Месопотамської» — війна, що згадана в заголовку Псалма 60."
    - "У ширшому значенні Месопотамія — колиска міст, письма й імперій біблійного світу: Ур, Вавилон на Євфраті, Ассур, Калах і Ніневія на Тигрі. Греки дали краю назву за доби Александра; Траян зробив її 116 р. н. е. римською провінцією, яку Адріан покинув через рік, а Септимій Север — знову в 190-х рр. Євреї, виведені до Вавилона, залишилися там, і їхні школи створили Вавилонський Талмуд; Церква Сходу виросла в Едесі та Нісібіні й звідти поширилася до Індії та Китаю."
    - "Сьогодні межиріччя — це Ірак, а також північний схід Сирії та південний схід Туреччини. Харан — село з будинками-вуликами поблизу Шанлиурфи; ріки перегороджені греблями в Кебані, Ататюрку, Табці й Мосулі, а болота нижнього Тигру та Євфрату, осушені в 1990-х рр., частково відновлено."
  es:
    - "Mesopotamia, en griego «entre los ríos», es la tierra del Éufrates y del Tigris. En el Antiguo Testamento el nombre, tomado de la Septuaginta, corresponde al hebreo Aram-naharaim, «Aram de los dos ríos»: no Babilonia sino el país alto en torno a Harán, entre el gran meandro del Éufrates y el Jabur, en lo que hoy es el sudeste de Turquía y el nordeste de Siria. La Biblia sinodal traduce también Padan-aram, la patria de Labán, como Mesopotamia. En el Nuevo Testamento la palabra tiene su sentido griego más amplio: los «que habitamos en Mesopotamia» en Pentecostés son los judíos de Babilonia, y Esteban dice que Dios se apareció a Abraham «estando en Mesopotamia, antes que morase en Chârán», es decir, en Ur."
    - "El siervo de Abraham «llegó á Mesopotamia, á la ciudad de Nachôr» para buscar a Rebeca, y Jacob fue enviado a la misma casa para encontrar sus mujeres. Balaam, a quien contrató Balac, era «de Pethor de Mesopotamia»; Petor es el Pitru del río Sayur, cerca de Carquemis, que Salmanasar III nombra en sus anales. En los días de los jueces, el Señor vendió a Israel «en manos de Chusan-risathaim, rey de Mesopotamia», a quien sirvieron ocho años hasta que Otoniel los libró, y los amonitas contrataron carros contra David «de Siria de los ríos», una guerra recordada en el título del Salmo 60."
    - "En sentido más amplio, Mesopotamia es la cuna de las ciudades, la escritura y los imperios del mundo de la Biblia: Ur, Babel y Babilonia en el Éufrates, Asur, Cala y Nínive en el Tigris. Los griegos dieron nombre a la tierra en la época de Alejandro; Trajano la hizo provincia romana en 116 d. C., abandonada por Adriano un año después, y Septimio Severo de nuevo en los años 190. Los judíos llevados a Babilonia se quedaron, y sus escuelas produjeron el Talmud de Babilonia; la Iglesia de Oriente creció en Edesa y Nísibis y desde allí se extendió a la India y a China."
    - "Hoy la tierra entre los ríos es Irak, con el nordeste de Siria y el sudeste de Turquía. Harán es una aldea de casas en forma de colmena cerca de Şanlıurfa; los ríos están represados en Keban, Atatürk, Tabqa y Mosul, y las marismas del bajo Tigris y Éufrates, drenadas en los años noventa, han sido en parte restauradas."
  pt:
    - "Mesopotâmia, em grego “entre os rios”, é a terra do Eufrates e do Tigre. No Antigo Testamento o nome, tomado da Septuaginta, corresponde ao hebraico Arã-Naaraim, “Arã dos dois rios”: não a Babilônia, mas o país alto em torno de Harã, entre a grande curva do Eufrates e o Khabur, no que hoje é o sudeste da Turquia e o nordeste da Síria. A Bíblia Sinodal também traduz Padã-Arã, a terra de Labã, por Mesopotâmia. No Novo Testamento a palavra tem seu sentido grego mais amplo: os “habitantes da Mesopotâmia” no Pentecostes são os judeus da Babilônia, e Estêvão diz que Deus apareceu a Abraão “quando ele estava na Mesopotâmia, antes de morar em Harã”, isto é, em Ur."
    - "O servo de Abraão “foi para a Mesopotâmia, para a cidade de Naor” para buscar Rebeca, e Jacó foi enviado à mesma casa para obter suas mulheres. Balaão, a quem Balaque contratou, era “de Petor da Mesopotâmia”; Petor é o Pitru, no rio Sajur, perto de Carquemis, que Salmaneser III nomeia em seus anais. Nos dias dos juízes o Senhor vendeu Israel “para a mão de Cusã-Risataim, rei da Mesopotâmia”, a quem serviram oito anos até que Otniel os libertou, e os amonitas contrataram carros contra Davi “da Mesopotâmia”, guerra lembrada no título do Salmo 60."
    - "Em sentido amplo, a Mesopotâmia é o berço das cidades, da escrita e dos impérios do mundo da Bíblia: Ur, Babel e Babilônia no Eufrates, Assur, Calá e Nínive no Tigre. Os gregos deram à terra o seu nome na era de Alexandre; Trajano a fez província romana em 116 d.C., abandonada por Adriano um ano depois, e Sétimo Severo de novo na década de 190. Os judeus levados para a Babilônia ficaram, e suas escolas produziram o Talmude da Babilônia; a Igreja do Oriente cresceu em Edessa e Nísibis e daí se espalhou até a Índia e a China."
    - "Hoje a terra entre os rios é o Iraque, com o nordeste da Síria e o sudeste da Turquia. Harã é uma aldeia de casas em forma de colmeia perto de Şanlıurfa; os rios são represados em Keban, Atatürk, Tabqa e Mossul, e os pântanos do baixo Tigre e Eufrates, drenados na década de 1990, foram em parte restaurados."
  de:
    - "Mesopotamien, griechisch „zwischen den Flüssen“, ist das Land von Euphrat und Tigris. Im Alten Testament steht der Name, aus der Septuaginta übernommen, für das hebräische Aram-Naharajim, „Aram der zwei Flüsse“: nicht Babylonien, sondern das obere Land um Haran, zwischen der großen Biegung des Euphrat und dem Chabur, im heutigen Südosten der Türkei und Nordosten Syriens. Die Synodalbibel gibt auch Paddan-Aram, die Heimat Labans, mit Mesopotamien wieder. Im Neuen Testament hat das Wort seinen weiteren griechischen Sinn: Die, die an Pfingsten „in Mesopotamien“ wohnen, sind die Juden Babyloniens, und Stephanus sagt, Gott sei Abraham erschienen, „da er noch in Mesopotamien war, ehe er wohnte in Haran“, das heißt in Ur."
    - "Abrahams Knecht „zog nach Mesopotamien zu der Stadt Nahors“, um Rebekka zu finden, und Jakob wurde in dasselbe Haus um seine Frauen geschickt. Bileam, den Balak dingte, war „von Pethor aus Mesopotamien“; Petor ist das Pitru am Fluss Sadschur bei Karkemisch, das Salmanassar III. in seinen Annalen nennt. In den Tagen der Richter verkaufte der HERR Israel „unter die Hand Kusan-Risathaims, des Königs von Mesopotamien“, dem sie acht Jahre dienten, bis Otniël sie befreite, und die Ammoniter dingten Wagen gegen David „aus Mesopotamien“, ein Krieg, an den die Überschrift von Psalm 60 erinnert."
    - "Im weiteren Sinn ist Mesopotamien die Wiege der Städte, der Schrift und der Reiche der Welt der Bibel: Ur, Babel und Babylon am Euphrat, Assur, Kalach und Ninive am Tigris. Die Griechen gaben dem Land zur Zeit Alexanders seinen Namen; Trajan machte es 116 n. Chr. zur römischen Provinz, die Hadrian ein Jahr später aufgab, und Septimius Severus erneut in den 190er Jahren. Die nach Babylon verschleppten Juden blieben, und ihre Schulen brachten den Babylonischen Talmud hervor; die Kirche des Ostens wuchs in Edessa und Nisibis und breitete sich von dort bis Indien und China aus."
    - "Heute ist das Land zwischen den Flüssen der Irak, mit dem Nordosten Syriens und dem Südosten der Türkei. Haran ist ein Dorf mit Bienenkorbhäusern bei Şanlıurfa; die Flüsse sind bei Keban, Atatürk, Tabqa und Mossul gestaut, und die in den 1990er Jahren trockengelegten Sümpfe des unteren Tigris und Euphrat sind teilweise wiederhergestellt."
  fr:
    - "La Mésopotamie, en grec « entre les fleuves », est le pays de l’Euphrate et du Tigre. Dans l’Ancien Testament, le nom, repris de la Septante, rend l’hébreu Aram-Naharaïm, « Aram des deux fleuves » : non pas la Babylonie mais le haut pays autour de Haran, entre la grande boucle de l’Euphrate et le Khabour, dans ce qui est aujourd’hui le sud-est de la Turquie et le nord-est de la Syrie. La Bible synodale rend aussi par Mésopotamie Paddan-Aram, patrie de Laban. Dans le Nouveau Testament, le mot a son sens grec plus large : « ceux qui habitent la Mésopotamie » à la Pentecôte sont les Juifs de Babylonie, et Étienne dit que Dieu apparut à Abraham « lorsqu’il était en Mésopotamie, avant qu’il s’établît à Charran », c’est-à-dire à Ur."
    - "Le serviteur d’Abraham « alla en Mésopotamie, à la ville de Nachor » pour trouver Rebecca, et Jacob fut envoyé dans la même maison pour ses épouses. Balaam, que Balak engagea, était « de Pethor en Mésopotamie » ; Pethor est le Pitrou sur le fleuve Sadjour près de Carkemisch que Salmanasar III nomme dans ses annales. Aux jours des juges, l’Éternel « les vendit entre les mains de Cuschan-Rischeathaïm, roi de Mésopotamie », qu’ils servirent huit ans jusqu’à ce qu’Othniel les délivre, et les Ammonites engagèrent contre David des chars « chez les Syriens de Mésopotamie », guerre dont rappelle le titre du Psaume 60."
    - "Au sens large, la Mésopotamie est le berceau des villes, de l’écriture et des empires du monde de la Bible : Ur, Babel et Babylone sur l’Euphrate, Assur, Calach et Ninive sur le Tigre. Les Grecs donnèrent son nom au pays à l’époque d’Alexandre ; Trajan en fit une province romaine en 116 apr. J.-C., abandonnée par Hadrien un an plus tard, et Septime Sévère de nouveau dans les années 190. Les Juifs emmenés à Babylone y restèrent, et leurs écoles produisirent le Talmud de Babylone ; l’Église d’Orient grandit à Édesse et à Nisibe et s’étendit de là jusqu’en Inde et en Chine."
    - "Aujourd’hui, le pays entre les fleuves est l’Irak, avec le nord-est de la Syrie et le sud-est de la Turquie. Haran est un village de maisons en forme de ruche près de Şanlıurfa ; les fleuves sont barrés à Keban, Atatürk, Tabqa et Mossoul, et les marais du bas Tigre et du bas Euphrate, asséchés dans les années 1990, ont été en partie restaurés."
  it:
    - "Mesopotamia, in greco «tra i fiumi», è la terra dell’Eufrate e del Tigri. Nell’Antico Testamento il nome, ripreso dalla Settanta, rende l’ebraico Aram-Naharàim, «Aram dei due fiumi»: non la Babilonia ma il paese alto intorno a Carran, tra la grande ansa dell’Eufrate e il Khabur, nell’odierna Turchia sud-orientale e Siria nord-orientale. La Bibbia sinodale rende Mesopotamia anche Paddan-Aram, la patria di Laban. Nel Nuovo Testamento la parola ha il suo senso greco più ampio: gli «abitanti della Mesopotamia» a Pentecoste sono gli ebrei della Babilonia, e Stefano dice che Dio apparve ad Abramo «mentr’egli era in Mesopotamia, prima che abitasse in Carran», cioè a Ur."
    - "Il servo di Abramo «andò in Mesopotamia, alla città di Nahor» per trovare Rebecca, e Giacobbe fu mandato alla stessa casa per le sue mogli. Balaam, che Balak prese al soldo, era «da Pethor in Mesopotamia»; Petor è il Pitru sul fiume Sajur presso Carchemis che Salmanàssar III nomina nei suoi annali. Al tempo dei giudici il Signore vendette Israele: «li diede nelle mani di Cushan-Rishathaim, re di Mesopotamia», che essi servirono otto anni finché Otniel li liberò, e gli Ammoniti presero al soldo carri «presso i Siri di Mesopotamia» contro Davide, guerra ricordata nel titolo del Salmo 60."
    - "In senso più ampio la Mesopotamia è la culla delle città, della scrittura e degli imperi del mondo della Bibbia: Ur, Babele e Babilonia sull’Eufrate, Assur, Calach e Ninive sul Tigri. I Greci diedero alla terra il suo nome all’età di Alessandro; Traiano ne fece una provincia romana nel 116 d.C., abbandonata da Adriano un anno dopo, e Settimio Severo di nuovo negli anni 190. Gli ebrei deportati a Babilonia vi rimasero, e le loro scuole produssero il Talmud babilonese; la Chiesa d’Oriente crebbe a Edessa e a Nisibi e di là si diffuse in India e in Cina."
    - "Oggi la terra tra i fiumi è l’Iraq, con il nord-est della Siria e il sud-est della Turchia. Carran è un villaggio di case a forma di alveare presso Şanlıurfa; i fiumi sono sbarrati a Keban, Atatürk, Tabqa e Mosul, e le paludi del basso Tigri e dell’Eufrate, prosciugate negli anni Novanta, sono state in parte ripristinate."
  pl:
    - "Mezopotamia, po grecku „między rzekami”, to kraj Eufratu i Tygrysu. W Starym Testamencie nazwa, wzięta z Septuaginty, oddaje hebrajskie Aram Naharaim, „Aram dwóch rzek”: nie Babilonię, lecz górny kraj wokół Charanu, między wielkim zakolem Eufratu a Chaburem, w dzisiejszej południowo-wschodniej Turcji i północno-wschodniej Syrii. Biblia synodalna oddaje też Paddan-Aram, dom Labana, jako Mezopotamię. W Nowym Testamencie słowo ma szerszy sens grecki: ci, „którzy mieszkamy w Mezopotamii”, w dniu Pięćdziesiątnicy to Żydzi z Babilonii, a Szczepan mówi, że Bóg ukazał się Abrahamowi, „gdy był w Mezopotamii, przedtem niż mieszkał w Haranie”, to jest w Ur."
    - "Sługa Abrahama „puścił się do Aram Naharaim, do miasta Nachorowego”, by znaleźć Rebekę, a Jakub został posłany do tego samego domu po żony. Balaam, wynajęty przez Balaka, był „z Pethor Mesopotamii Syryjskiej”; Petor to Pitru nad rzeką Sajur koło Karkemisz, które Salmanasar III wymienia w swoich annałach. W dniach sędziów Pan sprzedał Izraela „w rękę Chusanrasataima, króla Syrskiego w Mezopotamii”, któremu służyli osiem lat, aż uwolnił ich Otniel, a Ammonici najęli rydwany przeciw Dawidowi „z Mezopotamii”, wojnę wspominaną w tytule Psalmu 60."
    - "W szerszym sensie Mezopotamia jest kolebką miast, pisma i imperiów świata Biblii: Ur, Babel i Babilon nad Eufratem, Aszur, Kalach i Niniwa nad Tygrysem. Grecy nadali krajowi nazwę w epoce Aleksandra; Trajan uczynił z niego rzymską prowincję w 116 r. n.e., porzuconą przez Hadriana rok później, a Septymiusz Sewer ponownie w latach dziewięćdziesiątych II w. Żydzi uprowadzeni do Babilonu pozostali, a ich szkoły wydały Talmud babiloński; Kościół Wschodu rozwinął się w Edessie i Nisibis i stamtąd rozprzestrzenił się do Indii i Chin."
    - "Dziś kraj między rzekami to Irak, z północnym wschodem Syrii i południowym wschodem Turcji. Charan jest wsią domów w kształcie ula koło Şanlıurfy; rzeki są spiętrzone w Keban, Atatürk, Tabka i Mosulu, a bagna dolnego Tygrysu i Eufratu, osuszone w latach dziewięćdziesiątych XX w., zostały częściowo odtworzone."
  nl:
    - "Mesopotamië, Grieks voor “tussen de rivieren”, is het land van de Eufraat en de Tigris. In het Oude Testament staat de naam, overgenomen uit de Septuaginta, voor het Hebreeuwse Aram-Naharaïm, “Aram van de twee rivieren”: niet Babylonië maar het bovenland rond Haran, tussen de grote bocht van de Eufraat en de Chabur, in wat nu het zuidoosten van Turkije en het noordoosten van Syrië is. De Synodale Bijbel geeft ook Paddan-Aram, het thuis van Laban, weer als Mesopotamië. In het Nieuwe Testament heeft het woord zijn bredere Griekse betekenis: de mensen die met Pinksteren “inwoners zijn van Mesopotamië” zijn de joden van Babylonië, en Stefanus zegt dat God aan Abraham verscheen “nog zijnde in Mesopotamië, eer hij woonde in Charran”, dat wil zeggen te Ur."
    - "Abrahams knecht “toog heen naar Mesopotamië, naar de stad van Nahor” om Rebekka te vinden, en Jakob werd naar hetzelfde huis gestuurd voor zijn vrouwen. Bileam, door Balak gehuurd, was “van Pethor uit Mesopotamië”; Petor is het Pitru aan de rivier Sajur bij Karkemis dat Salmaneser III in zijn annalen noemt. In de dagen van de richters verkocht de HEER Israël “in de hand van Cuschan Rischataim, koning van Mesopotamië”, die zij acht jaar dienden tot Otniël hen bevrijdde, en de Ammonieten huurden wagens tegen David “uit Mesopotamië”, een oorlog die in het opschrift van Psalm 60 wordt herdacht."
    - "In ruimere zin is Mesopotamië de wieg van de steden, het schrift en de rijken van de wereld van de Bijbel: Ur, Babel en Babylon aan de Eufraat, Assur, Kalach en Nineve aan de Tigris. De Grieken gaven het land zijn naam in de tijd van Alexander; Trajanus maakte het in 116 n.Chr. tot Romeinse provincie, die Hadrianus een jaar later opgaf, en Septimius Severus opnieuw in de jaren 190. De joden die naar Babylon waren weggevoerd bleven, en hun scholen brachten de Babylonische Talmoed voort; de Kerk van het Oosten groeide in Edessa en Nisibis en verspreidde zich van daar naar Indië en China."
    - "Tegenwoordig is het land tussen de rivieren Irak, met het noordoosten van Syrië en het zuidoosten van Turkije. Haran is een dorp van bijenkorfhuizen bij Şanlıurfa; de rivieren zijn gestuwd bij Keban, Atatürk, Tabqa en Mosul, en de moerassen van de benedenloop van Tigris en Eufraat, in de jaren negentig drooggelegd, zijn gedeeltelijk hersteld."
  cs:
    - "Mezopotámie, řecky „mezi řekami“, je země Eufratu a Tigridu. Ve Starém zákoně jméno, převzaté ze Septuaginty, stojí za hebrejské Aram-naharajim, „Aram dvou řek“: ne Babylonie, nýbrž horní kraj kolem Cháranu, mezi velkým ohybem Eufratu a Chaburem, v dnešním jihovýchodním Turecku a severovýchodní Sýrii. Synodální Bible také překládá Padan-aram, domov Labanův, jako Mezopotámii. V Novém zákoně má slovo svůj širší řecký smysl: ti, „kteříž přebýváme v Mezopotamii“, o Letnicích, jsou Židé z Babylonie, a Štěpán praví, že Bůh se ukázal Abrahamovi, „když byl v Mezopotamii, prve než bydlil v Cháran“, tedy v Uru."
    - "Abrahamův služebník „bral se k Aram Naharaim do města Náchor“, aby našel Rebeku, a Jákob byl poslán do téhož domu pro své ženy. Bileám, jehož najal Balak, byl „z Petor Mezopotamie Syrské“; Petór je Pitru na řece Sajuru poblíž Karkemíše, které jmenuje Salmanasar III. ve svých análech. Za soudců Hospodin vydal Izraele „v ruku Chusana Risataimského, krále Syrského v Mezopotamii“, jemuž sloužili osm let, než je vysvobodil Otniel, a Amónci najali proti Davidovi vozy „z Mezopotamie“, válka připomínaná v nadpisu Žalmu 60."
    - "V širším smyslu je Mezopotámie kolébkou měst, písma a říší biblického světa: Ur, Babel a Babylón na Eufratu, Aššúr, Kalach a Ninive na Tigridu. Řekové dali zemi jméno za Alexandra; Traianus z ní roku 116 n. l. učinil římskou provincii, které se Hadrianus o rok později vzdal a Septimius Severus znovu v 190. letech. Židé odvlečení do Babylóna zůstali a jejich školy vytvořily babylonský Talmud; Církev Východu vyrostla v Edesse a Nisibis a odtud se šířila do Indie a Číny."
    - "Dnes je země mezi řekami Irák se severovýchodem Sýrie a jihovýchodem Turecka. Cháran je vesnice úlových domů poblíž Şanlıurfy; řeky jsou přehrazeny u Kebanu, Atatürku, Tabqy a Mosulu a bažiny dolního Tigridu a Eufratu, vysušené v 90. letech, byly zčásti obnoveny."
  sv:
    - "Mesopotamien, grekiska för ”mellan floderna”, är Eufrats och Tigris land. I Gamla testamentet står namnet, hämtat från Septuaginta, för hebreiskans Aram-Naharajim, ”Aram av de två floderna”: inte Babylonien utan det övre landet kring Harran, mellan Eufrats stora krök och Khabur, i det som nu är sydöstra Turkiet och nordöstra Syrien. Synodalbibeln återger också Paddan-Aram, Labans hemland, som Mesopotamien. I Nya testamentet har ordet sin vidare grekiska betydelse: vid pingsten är de som ”hava vårt hem i Mesopotamien” judarna i Babylonien, och Stefanos säger att Gud uppenbarade sig för Abraham ”medan han ännu var i Mesopotamien, och förrän han bosatte sig i Karran”, det vill säga i Ur."
    - "Abrahams tjänare ”drog åstad till Nahors stad i Aram-Naharaim” för att finna Rebecka, och Jakob sändes till samma hus för sina hustrur. Bileam, som Balak lejde, var ”från Petor i Aram-Naharaim”; Petor är Pitru vid floden Sajur nära Karkemish som Salmanassar III nämner i sina annaler. På domarnas tid sålde Herren Israel ”i Kusan-Risataims hand, konungens i Aram-Naharaim”, som de tjänade åtta år tills Otniel befriade dem, och ammoniterna lejde vagnar mot David ”från Aram-Naharaim”, ett krig som erinras i rubriken till Psalm 60."
    - "I vidare mening är Mesopotamien vaggan för städerna, skriften och rikena i Bibelns värld: Ur, Babel och Babylon vid Eufrat, Assur, Kalach och Nineve vid Tigris. Grekerna gav landet dess namn på Alexanders tid; Trajanus gjorde det till romersk provins år 116 e.Kr., uppgivet av Hadrianus ett år senare, och Septimius Severus åter på 190-talet. De judar som fördes till Babylon blev kvar, och deras skolor frambringade den babyloniska Talmud; Österns kyrka växte vid Edessa och Nisibis och spred sig därifrån till Indien och Kina."
    - "I dag är landet mellan floderna Irak, med nordöstra Syrien och sydöstra Turkiet. Harran är en by med bikupeformade hus nära Şanlıurfa; floderna är uppdämda vid Keban, Atatürk, Tabqa och Mosul, och träsken vid nedre Tigris och Eufrat, som torrlades på 1990-talet, har delvis återställts."
  nb:
    - "Mesopotamia, gresk for «mellom elvene», er landet ved Eufrat og Tigris. I Det gamle testamente står navnet, hentet fra Septuaginta, for det hebraiske Aram-Naharajim, «Aram ved de to elver»: ikke Babylonia, men det øvre landet omkring Harran, mellom Eufrats store sving og Khabur, i det som nå er sørøstlige Tyrkia og nordøstlige Syria. Synodalbibelen gjengir også Padan-Aram, Labans hjem, som Mesopotamia. I Det nye testamente har ordet sin videre greske betydning: «vi som bor i Mesopotamia» ved pinse er jødene i Babylonia, og Stefanus sier at Gud åpenbarte seg for Abraham «mens han var i Mesopotamia, før han hadde bosatt sig i Karan», det vil si i Ur."
    - "Abrahams tjener «drog til Mesopotamia, til Nakors by» for å finne Rebekka, og Jakob ble sendt til det samme huset for å finne hustruer. Bileam, som Balak leide, var «fra Petor i Mesopotamia»; Petor er Pitru ved elven Sajur nær Karkemisj som Salmanassar III nevner i sine annaler. På dommernes tid solgte Herren Israel «i Kusan-Risata'ims hånd, som var konge i Mesopotamia», som de tjente i åtte år til Otniel fridde dem, og ammonittene leide vogner mot David «fra Mesopotamia», en krig som huskes i overskriften til Salme 60."
    - "I videre forstand er Mesopotamia vuggen for byene, skriften og imperiene i Bibelens verden: Ur, Babel og Babylon ved Eufrat, Assur, Kalah og Ninive ved Tigris. Grekerne ga landet dets navn i Aleksanders tid; Trajan gjorde det til romersk provins i 116 e.Kr., oppgitt av Hadrian ett år senere, og Septimius Severus igjen på 190-tallet. Jødene som ble ført til Babylon ble værende, og skolene deres frembrakte den babylonske Talmud; Østens kirke vokste i Edessa og Nisibis og spredte seg derfra til India og Kina."
    - "I dag er landet mellom elvene Irak, med det nordøstlige Syria og det sørøstlige Tyrkia. Harran er en landsby med bikubeformede hus nær Şanlıurfa; elvene er demmet opp ved Keban, Atatürk, Tabqa og Mosul, og myrene ved nedre Tigris og Eufrat, tørrlagt på 1990-tallet, er delvis gjenopprettet."
  tl:
    - "Ang Mesopotamia, sa Griyego ay “sa pagitan ng mga ilog”, ay lupain ng Eufrates at Tigris. Sa Lumang Tipan, ang pangalan, hango sa Septuaginta, ay katumbas ng Hebreong Aram-naharaim, “Aram ng dalawang ilog”: hindi ang Babilonia kundi ang itaas na bansa sa palibot ng Haran, sa pagitan ng malaking liko ng Eufrates at ng Khabur, sa kasalukuyang timog-silangang Turkey at hilagang-silangang Siria. Isinasalin din ng Synodal Bible na Mesopotamia ang Padan-aram, tahanan ni Laban. Sa Bagong Tipan, may mas malawak na kahulugang Griyego ang salita: ang “nangananahan sa Mesapotamia” sa Pentecostes ay ang mga Judio ng Babilonia, at sinasabi ni Esteban na napakita ang Diyos kay Abraham “nang siya'y nasa Mesapotamia, bago siya tumahan sa Haran”, ibig sabihin, sa Ur."
    - "Ang lingkod ni Abraham ay “napasa Mesopotamia, sa bayan ni Nachor” upang hanapin si Rebeca, at isinugo si Jacob sa gayon ding bahay para sa kaniyang mga asawa. Si Balaam, na inupahan ni Balac, ay “mula sa Pethor ng Mesopotamia”; ang Pethor ay ang Pitru sa ilog Sajur malapit sa Carchemis na pinangalanan ni Salmanasar III sa kaniyang mga annal. Sa mga araw ng mga hukom, ipinagbili ng Panginoon ang Israel “sa kamay ni Chusan-risathaim, na hari sa Mesopotamia”, na pinaglingkuran nila nang walong taon hanggang iligtas sila ni Othoniel, at umupa ang mga Ammonita ng mga karo laban kay David na “mula sa Mesopotamia”, isang digmaang naaalala sa pamagat ng Awit 60."
    - "Sa mas malawak na kahulugan, ang Mesopotamia ang duyan ng mga lungsod, sulat at imperyo ng daigdig ng Biblia: Ur, Babel at Babilonia sa Eufrates, Assur, Calah at Ninive sa Tigris. Ibinigay ng mga Griyego ang pangalan sa lupain noong panahon ni Alejandro; ginawa itong lalawigang Romano ni Trajano noong 116 AD, isinuko ni Adriano pagkaraan ng isang taon, at muling ginawa ni Septimio Severo noong 190s. Nanatili ang mga Judiong dinala sa Babilonia, at ang kanilang mga paaralan ang lumikha ng Talmud ng Babilonia; lumago ang Simbahan ng Silangan sa Edessa at Nisibis at mula roon ay kumalat sa India at Tsina."
    - "Ang lupain sa pagitan ng mga ilog ay ang Iraq ngayon, kasama ang hilagang-silangan ng Siria at timog-silangan ng Turkey. Ang Haran ay nayon ng mga bahay na hugis-pugad ng bubuyog malapit sa Şanlıurfa; hinaharangan ang mga ilog sa Keban, Atatürk, Tabqa at Mosul, at ang mga latian ng ibabang Tigris at Eufrates, na pinatuyo noong dekada 1990, ay bahagyang naibalik."
  da:
    - "Mesopotamien, græsk for »mellem floderne«, er landet ved Eufrat og Tigris. I Det Gamle Testamente står navnet, taget fra Septuaginta, for det hebraiske Aram-Naharajim, »Aram af de to floder«: ikke Babylonien, men det øvre land omkring Karan, mellem Eufrats store sving og Khabur, i det nuværende sydøstlige Tyrkiet og nordøstlige Syrien. Synodalbibelen gengiver også Paddan-Aram, Labans hjem, som Mesopotamien. I Det Nye Testamente har ordet sin videre græske betydning: de, »som høre hjemme i Mesopotamien« til pinse, er Babyloniens jøder, og Stefanus siger, at Gud viste sig for Abraham, »da han var i Mesopotamien, førend han tog Bolig i Karan«, det vil sige i Ur."
    - "Abrahams tjener »drog til Aram Naharaim, til Nakors Stad« for at finde Rebekka, og Jakob blev sendt til det samme hus efter sine hustruer. Bileam, som Balak lejede, var »af Pethor i Mesopotamien«; Petor er Pitru ved floden Sajur nær Karkemisj, som Salmanassar III nævner i sine annaler. I dommernes dage solgte Herren Israel »i Kusan-Risathaims Haand, som var Konge i Aram Naharaim«, som de tjente i otte år, til Otniel udfriede dem, og ammonitterne lejede vogne mod David »fra Mesopotamien«, en krig, der mindes i overskriften til Salme 60."
    - "I videre forstand er Mesopotamien vuggen for byerne, skriften og imperierne i Bibelens verden: Ur, Babel og Babylon ved Eufrat, Assur, Kala og Nineve ved Tigris. Grækerne gav landet dets navn i Alexanders tid; Trajan gjorde det til romersk provins i 116 e.Kr., opgivet af Hadrian et år senere, og Septimius Severus igen i 190'erne. De jøder, der blev ført til Babylon, blev, og deres skoler frembragte den babyloniske Talmud; Østens Kirke voksede ved Edessa og Nisibis og bredte sig derfra til Indien og Kina."
    - "I dag er landet mellem floderne Irak, med det nordøstlige Syrien og det sydøstlige Tyrkiet. Karan er en landsby med bikubehuse nær Şanlıurfa; floderne er opdæmmet ved Keban, Atatürk, Tabqa og Mosul, og moserne ved den nedre Tigris og Eufrat, drænet i 1990'erne, er delvis blevet genoprettet."
  sr:
    - "Месопотамија, на грчком „међуречје“, земља је Еуфрата и Тигра. У Старом завету име, преузето из Септуагинте, стоји за хебрејски Арам-Нахараим, „Арам двеју река“: не Вавилонија него горња земља око Харана, између великог лука Еуфрата и Хабура, у данашњој југоисточној Турској и североисточној Сирији. Синодална Библија такође Падан-Арам, дом Лаванов, преводи као Месопотамију. У Новом завету реч има шире грчко значење: „који смо из Месопотамије“ на Педесетницу су Јевреји Вавилоније, а Стефан каже да се Бог јавио Авраму „кад беше у Месопотамији, пре него се досели у Харан“, то јест у Уру."
    - "Аврамов слуга „дође у Месопотамију до града Нахоровог“ да нађе Ревеку, а Јаков је послат у исту кућу по жене. Валам, кога је Валак најмио, био је „из Феторе у Месопотамији“; Фетор је Питру на реци Саџур близу Хархемиса који Салманасар III помиње у својим аналима. У време судија Господ је продао Израиља „у руке Хусан-Рисатајиму цару месопотамском“, коме су служили осам година док их Готонило није избавио, а Амонци су најмили кола против Давида „из Месопотамије“, рат запамћен у наслову Псалма 60."
    - "У ширем смислу Месопотамија је колевка градова, писма и царстава библијског света: Ур, Вавилон на Еуфрату, Ашур, Халах и Нинива на Тигру. Грци су земљи дали име у доба Александра; Трајан ју је 116. н. е. учинио римском провинцијом, Хадријан ју је годину дана касније напустио, а Септимије Север је поново узео 190-их. Јевреји одведени у Вавилон остали су, и њихове школе дале су Вавилонски Талмуд; Црква Истока расла је у Едеси и Нисибису и одатле се раширила до Индије и Кине."
    - "Данас је земља између река Ирак, са североистоком Сирије и југоистоком Турске. Харан је село кућа у облику кошница близу Шанлурфе; реке су преграђене код Кебана, Ататурка, Табке и Мосула, а мочваре доњег Тигра и Еуфрата, исушене 1990-их, делимично су обновљене."
  hu:
    - "Mezopotámia, görögül „a folyók között”, az Eufrátesz és a Tigris földje. Az Ószövetségben a név, a Septuagintából véve, a héber Arám-Naharajimot jelenti, „a két folyó Arámját”: nem Babilóniát, hanem a Hárán körüli felső vidéket, az Eufrátesz nagy kanyarulata és a Habúr között, a mai Délkelet-Törökországban és Északkelet-Szíriában. A szinodális Biblia Padan-Arámot, Lábán otthonát is Mezopotámiának adja vissza. Az Újszövetségben a szó tágabb görög értelmét viseli: pünkösdkor a „kik lakozunk Mesopotámiában” a babiloni zsidók, István pedig azt mondja, hogy Isten megjelent Ábrahámnak, „mikor Mezopotámiában vala, minekelőtte Háránban lakott”, vagyis Urban."
    - "Ábrahám szolgája „elméne Mésopotámiába, a Nákhor városába”, hogy Rebekát megtalálja, és Jákóbot ugyanabba a házba küldték feleségekért. Bálám, akit Bálák felbérelt, „a mesopotámiabeli Péthorból valót”; Petór az a Pitru, a Karkemis közelében a Szadzsúr folyón, amelyet III. Salmanasszár évkönyvei megnevez. A bírák napjaiban az Úr „adá őket Kusán-Risathaimnak, Mesopotámia királyának kezébe”, nyolc évig szolgálták, míg Otniel meg nem szabadította őket, az ammóniak pedig Dávid ellen fogadtak „szekereket és lovagokat Mésopotámiából”, amely háborút a 60. zsoltár címe őriz."
    - "Tágabb értelemben Mezopotámia a Biblia világának városai, írása és birodalmai bölcsője: Ur, Bábel és Babilon az Eufráteszen, Asszúr, Kálah és Ninive a Tigrisen. A görögök Alexandrosz korában adták a földnek nevét; Traianus Kr. u. 116-ban római tartománnyá tette, Hadrianus egy évvel később feladta, Septimius Severus a 190-es években újra. A Babilonba hurcolt zsidók ott maradtak, és iskoláikból kerül ki a babiloni Talmud; a Keleti Egyház Edesszában és Nisibiszben nőtt fel, és onnan terjedt India és Kína felé."
    - "Ma a folyók közti föld Irak, Szíria északkeleti és Törökország délkeleti részével. Hárán méhkas alakú házak faluja Şanlıurfa közelében; a folyókat Kebannál, Atatürknél, Tabqánál és Moszulnál elgátolták, az alsó Tigris és Eufrátesz mocsarait, amelyeket az 1990-es években lecsapoltak, részben helyreállították."
  fi:
    - "Mesopotamia, kreikaksi ”jokien välissä”, on Eufratin ja Tigriksen maa. Vanhassa testamentissa nimi, joka on peräisin Septuagintasta, vastaa heprean sanaa Aram-Naharaim, ”kahden joen Aram”: ei Babylonia vaan Harranin ympärillä oleva yläpuolinen maa, Eufratin suuren mutkan ja Khaburin välissä, nykyisessä Kaakkois-Turkissa ja Koillis-Syyriassa. Synodaalinen Raamattu kääntää myös Padan-Aramin, Labanin kodin, Mesopotamiaksi. Uudessa testamentissa sanalla on laajempi kreikkalainen merkitys: helluntain ”jotka asumme Mesopotamiassa” ovat Babylonian juutalaisia, ja Stefanos sanoo Jumalan ilmestyneen Abrahamille ”hänen ollessaan Mesopotamiassa, ennenkuin hän oli asettunut asumaan Harraniin”, eli Uurissa."
    - "Abrahamin palvelija ”lähti Mesopotamiaan, Naahorin kaupunkiin” hakemaan Rebekkaa, ja Jaakob lähetettiin samaan taloon vaimojaan hakemaan. Bileam, jonka Balak palkkasi, oli ”Mesopotamian Petorista”; Petor on Pitru Sajur-joen varrella Karkemisin lähellä, jonka Salmanassar III mainitsee vuosikirjoissaan. Tuomarien aikana Herra möi Israelin ”Kuusan-Risataimin, Mesopotamian kuninkaan, käsiin”, jota se palveli kahdeksan vuotta, kunnes Otniel vapautti heidät, ja ammonilaiset palkkasivat sotavaunuja Daavidia vastaan ”Mesopotamiasta”, sotaa, jota muistetaan Ps. 60:n otsikossa."
    - "Laajemmassa merkityksessä Mesopotamia on Raamatun maailman kaupunkien, kirjoitustaidon ja valtakuntien kehto: Ur, Babel ja Babylon Eufratilla, Assur, Kalah ja Niinive Tigriksellä. Kreikkalaiset antoivat maalle nimen Aleksanterin aikaan; Trajanus teki siitä Rooman provinssin vuonna 116 jaa., Hadrianus luopui siitä vuotta myöhemmin, ja Septimius Severus teki siitä jälleen provinssin 190-luvulla. Babyloniaan viedyt juutalaiset jäivät, ja heidän koulunsa tuottivat Babylonian talmudin; Idän kirkko kasvoi Edessassa ja Nisibisissä ja levisi sieltä Intiaan ja Kiinaan."
    - "Nykyään jokien välinen maa on Irak sekä Syyrian koillisosa ja Turkin kaakkoisosa. Harran on mehiläispesätalojen kylä Şanlıurfan lähellä; joet on padottu Kebanissa, Atatürkissa, Tabqassa ja Mosulissa, ja Tigriksen ja Eufratin alajuoksun suot, jotka kuivattiin 1990-luvulla, on osittain ennallistettu."
  vi:
    - "Mê-sô-bô-ta-mi, tiếng Hy Lạp nghĩa là “giữa các sông”, là xứ của sông Ơ-phơ-rát và sông Hi-đê-ke. Trong Cựu Ước, tên này, lấy từ bản Septuagint, thay cho tiếng Hê-bơ-rơ A-ram Na-ha-ra-im, “A-ram của hai sông”: không phải Babylonia mà là xứ thượng quanh Cha-ran, giữa khúc quanh lớn của sông Ơ-phơ-rát và sông Khabur, nay là đông nam Thổ Nhĩ Kỳ và đông bắc Sy-ri. Bản Synodal cũng dịch Pha-đan-A-ram, quê của La-ban, là Mê-sô-bô-ta-mi. Trong Tân Ước, từ này có nghĩa Hy Lạp rộng hơn: “kẻ ở tại Mê-sô-bô-ta-mi” vào lễ Ngũ Tuần là người Do Thái ở Babylonia, và Ê-tiên nói Đức Chúa Trời hiện ra cùng Áp-ra-ham “khi người còn ở tại Mê-sô-bô-ta-mi, chưa đến ở tại Cha-ran”, tức là ở U-rơ."
    - "Đầy tớ của Áp-ra-ham “đi qua xứ Mê-sô-bô-ta-mi, đến thành của Na-cô” để tìm Rê-be-ca, và Gia-cốp được sai đến cùng nhà ấy để cưới vợ. Ba-la-am, người Ba-lác thuê, là “ở Phê-thô-rơ tại Mê-sô-bô-ta-mi”; Phê-thô-rơ là Pitru trên sông Sajur gần Cạt-kê-mít mà Sanh-ma-na-sa III nêu trong biên niên sử. Vào đời các quan xét, Đức Giê-hô-va bán Y-sơ-ra-ên “vào tay Cu-san-Ri-sa-tha-im, vua nước Mê-sô-bô-ta-mi”, mà họ phục dịch tám năm cho đến khi Ốt-ni-ên giải cứu, và người Am-môn, để thuê xe chống Đa-vít, đã sai người “đi đến Mê-sô-bô-ta-mi”, cuộc chiến được nhớ trong đề của Thi thiên 60."
    - "Theo nghĩa rộng, Mê-sô-bô-ta-mi là cái nôi của các thành, chữ viết và đế quốc của thế giới Kinh Thánh: U-rơ, Ba-bên và Ba-by-lôn bên sông Ơ-phơ-rát, A-su-rơ, Ca-lách và Ni-ni-ve bên sông Hi-đê-ke. Người Hy Lạp đặt tên cho xứ vào thời A-léc-xan-đơ; Trajan biến nó thành tỉnh La Mã năm 116, bị Hadrian bỏ một năm sau, và Septimius Severus lại chiếm vào thập niên 190. Người Do Thái bị đày sang Ba-by-lôn ở lại, và các trường học của họ làm ra Talmud Ba-by-lôn; Giáo hội Phương Đông lớn lên ở Edessa và Nisibis rồi lan từ đó sang Ấn Độ và Trung Quốc."
    - "Ngày nay xứ giữa các sông là Iraq, cùng đông bắc Sy-ri và đông nam Thổ Nhĩ Kỳ. Cha-ran là một làng nhà tổ ong gần Şanlıurfa; các con sông bị đắp đập ở Keban, Atatürk, Tabqa và Mosul, và các đầm lầy hạ lưu sông Hi-đê-ke và Ơ-phơ-rát, bị rút nước trong thập niên 1990, đã được phục hồi một phần."
  ro:
    - "Mesopotamia, în greacă „între râuri”, este țara Eufratului și a Tigrului. În Vechiul Testament numele, luat din Septuaginta, stă pentru ebraicul Aram-Naharaim, „Aramul celor două râuri”: nu Babilonia, ci ținutul de sus din jurul Haranului, între marea cotitură a Eufratului și Khabur, în ceea ce este acum sud-estul Turciei și nord-estul Siriei. Biblia sinodală redă prin Mesopotamia și Padan-Aram, patria lui Laban. În Noul Testament cuvântul are sensul grec mai larg: „cei ce locuesc în Mesopotamia” de la Cincizecime sunt iudeii din Babilonia, iar Ștefan spune că Dumnezeul slavei s-a arătat lui Avraam „când erà în Mesopotamia, mai înainte până a locuì el în Harran”, adică la Ur."
    - "Sluga lui Avraam „s’a dus în Mesopotamia cetatea lui Nahor” ca s-o găsească pe Rebeca, iar Iacov a fost trimis în aceeași casă după soții. Balaam, pe care l-a tocmit Balac, era din Petor din Mesopotamia; Petor este Pitru, pe râul Sajur, lângă Carchemiș, pe care îl numește Salmanasar al III-lea în analele sale. În zilele judecătorilor, Israel a fost dat „în mâinile lui Husarsatem împăratul Mesopotamiei Siriei”, căruia i-au slujit opt ani până când Otniel i-a izbăvit, iar amoniții au tocmit care împotriva lui David din Mesopotamia, un război amintit în titlul Psalmului 60."
    - "În sens larg, Mesopotamia este leagănul cetăților, al scrisului și al imperiilor din lumea Bibliei: Ur, Babel și Babilon pe Eufrat, Așur, Calah și Ninive pe Tigru. Grecii au dat țării numele în epoca lui Alexandru; Traian a făcut-o provincie romană în 116 d.Hr., Hadrian a părăsit-o un an mai târziu, iar Septimius Sever a reluat-o în anii 190. Iudeii duși la Babilon au rămas, iar școlile lor au dat Talmudul babilonian; Biserica Răsăritului a crescut la Edessa și Nisibis și s-a răspândit de acolo până în India și China."
    - "Astăzi țara dintre râuri este Irakul, împreună cu nord-estul Siriei și sud-estul Turciei. Haran este un sat cu case în formă de stup lângă Şanlıurfa; râurile sunt zăgăzuite la Keban, Atatürk, Tabqa și Mosul, iar mlaștinile cursului inferior al Tigrului și Eufratului, desecate în anii 1990, au fost în parte restaurate."
  bg:
    - "Месопотамия, на гръцки „между реките“, е земята на Ефрат и Тигър. В Стария завет името, взето от Септуагинта, стои вместо еврейското Арам-Нахараим, „Арам на двете реки“: не Вавилония, а горната област около Харан, между големия завой на Ефрат и Хабур, в днешна Югоизточна Турция и Североизточна Сирия. Синодалната Библия предава като Месопотамия и Падан-Арам, родината на Лаван. В Новия завет думата има по-широкия гръцки смисъл: онези, „които населяват Месопотамия“, на Петдесетница са юдеите от Вавилония, а Стефан казва, че Бог се яви на Авраам, „когато беше в Месопотамия, преди да се засели в Харан“, тоест в Ур."
    - "Слугата на Авраам „отиде в Месопотамия, в града Нахоров“, за да намери Ревека, а Яков бил изпратен в същия дом за жените си. Валаам, когото Валак наел, бил „от Фатур Месопотамски“; Петор е Питру на река Саджур близо до Кархемис, който Салманасар III назовава в аналите си. В дните на съдиите Господ продаде Израил „в ръката на Хусаирисатаима Месопотамския цар“, на когото те служиха осем години, докато Готониил не ги избави, а амонците наеха колесници срещу Давид „от Месопотамия“ — война, запомнена в надписа на Псалом 60."
    - "В по-широкия смисъл Месопотамия е люлката на градовете, писмеността и империите на библейския свят: Ур и Вавилон (Бабел от Битие) на Ефрат, Асур, Калах и Ниневия на Тигър. Гърците дават името на земята в епохата на Александър; Траян я превръща в римска провинция през 116 г. н.е., от която Адриан се отказва година по-късно, а Септимий Север отново я превръща в провинция през 190-те години. Отведените във Вавилон юдеи остават и техните школи създават Вавилонския Талмуд; Църквата на Изтока израства в Едеса и Низибис и оттам се разпространява до Индия и Китай."
    - "Днес земята между реките е Ирак, със североизтока на Сирия и югоизтока на Турция. Харан е село с куполовидни къщи близо до Шанлъурфа; реките са преградени с язовири при Кебан, Ататюрк, Табка и Мосул, а блатата на долните течения на Тигър и Ефрат, пресушени през 1990-те години, са частично възстановени."
