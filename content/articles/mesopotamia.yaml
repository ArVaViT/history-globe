# Overview article (ADR 0007). Mainstream facts only; the two senses of the name (Aram-naharaim in the Old Testament, the whole land between the rivers in Acts) are kept apart; the Synodal rendering of Padan-aram as Mesopotamia is noted.
id: mesopotamia
place: a43f60f
title:
  en: "Mesopotamia"
  ru: "Месопотамия"
  uk: "Месопотамія"
  es: "Mesopotamia"
  pt: "Mesopotâmia"
  de: "Mesopotamien"
  fr: "Mésopotamie"
body:
  en:
    - "Mesopotamia, Greek for “between the rivers”, is the land of the Euphrates and the Tigris. In the Old Testament the name, taken from the Septuagint, stands for the Hebrew Aram-naharaim, “Aram of the two rivers”: not Babylonia but the upper country around Haran, between the great bend of the Euphrates and the Khabur, in what is now south-eastern Turkey and north-eastern Syria. The Synodal Bible also renders Padan-aram, the home of Laban, as Mesopotamia. In the New Testament the word has its wider Greek sense: the “dwellers in Mesopotamia” at Pentecost are the Jews of Babylonia, and Stephen says that God appeared to Abraham “when he was in Mesopotamia, before he dwelt in Charran”, that is, at Ur."
    - "Abraham's servant “went to Mesopotamia, unto the city of Nahor” to find Rebekah, and Jacob was sent to the same house for his wives. Balaam, whom Balak hired, was “of Pethor of Mesopotamia”; Pethor is the Pitru on the river Sajur near Carchemish that Shalmaneser III names in his annals. In the days of the judges the Lord sold Israel “into the hand of Chushan-rishathaim king of Mesopotamia”, whom they served eight years until Othniel delivered them, and the Ammonites hired chariots against David “out of Mesopotamia”, a war remembered in the title of Psalm 60."
    - "In the wider sense Mesopotamia is the cradle of the cities, writing and empires of the Bible's world: Ur, Babel and Babylon on the Euphrates, Asshur, Calah and Nineveh on the Tigris. The Greeks gave the land its name in the age of Alexander; Trajan made it a Roman province for a few years in AD 115, and Septimius Severus again in the 190s. The Jews carried to Babylon stayed, and their schools produced the Babylonian Talmud; the Church of the East grew at Edessa and Nisibis and spread from there to India and China."
    - "Today the land between the rivers is Iraq, with the north-east of Syria and the south-east of Turkey. Haran is a village of beehive houses near Şanlıurfa; the rivers are dammed at Keban, Atatürk, Tabqa and Mosul, and the marshes of the lower Tigris and Euphrates, drained in the 1990s, have been partly restored."
  ru:
    - "Месопотамия, по-гречески «Междуречье», — земля Евфрата и Тигра. В Ветхом Завете это имя, взятое из Септуагинты, передаёт еврейское Арам-Нахараим, «Арам двух рек»: не Вавилонию, а верхнюю страну вокруг Харрана, между большой излучиной Евфрата и Хабуром, на нынешнем юго-востоке Турции и северо-востоке Сирии. Синодальный перевод называет Месопотамией и Паддан-Арам, родину Лавана. В Новом Завете слово имеет широкий греческий смысл: «жители Месопотамии» в день Пятидесятницы — это Иудеи Вавилонии, а Стефан говорит, что Бог явился Аврааму «в Месопотамии, прежде переселения его в Харран», то есть в Уре."
    - "Раб Авраама «пошел в Месопотамию, в город Нахора», чтобы найти Ревекку, и Иаков был послан в тот же дом за жёнами. Валаам, которого нанял Валак, был «из Пефора Месопотамского»; Пефор — это Питру на реке Саджур близ Кархемиса, который Салманасар III называет в своих анналах. Во дни судей Господь предал Израиль «в руки Хусарсафема, царя Месопотамского», которому они служили восемь лет, пока их не избавил Гофониил, а Аммонитяне наняли против Давида колесницы «из Сирии Месопотамской» — война, о которой помнит надписание 59-го псалма."
    - "В широком смысле Месопотамия — колыбель городов, письменности и империй библейского мира: Ур, Вавилон на Евфрате, Ассур, Калах и Ниневия на Тигре. Греки дали земле имя в эпоху Александра; Траян на несколько лет сделал её римской провинцией в 115 г. н. э., а Септимий Север — вновь в 190-х годах. Уведённые в Вавилон Иудеи остались там, и их школы создали Вавилонский Талмуд; Церковь Востока выросла в Едессе и Нисибине и распространилась оттуда до Индии и Китая."
    - "Сегодня земля между реками — это Ирак с северо-востоком Сирии и юго-востоком Турции. Харран — деревня с домами-ульями близ Шанлыурфы; реки перегорожены плотинами Кебан, Ататюрк, Табка и Мосул, а болота нижнего Тигра и Евфрата, осушенные в 1990-х годах, частично восстановлены."
  uk:
    - "Месопотамія, грецькою «межиріччя», — країна Євфрату й Тигру. У Старому Завіті ця назва, узята з Септуагінти, стоїть замість староєврейського Арам-Нагараїм, «Арам двох рік»: не Вавилонія, а верхній край навколо Харану, між великою дугою Євфрату й Хабуром, у нинішній південно-східній Туреччині та північно-східній Сирії. Синодальний переклад також передає Падан-Арам, дім Лавана, як Месопотамію. У Новому Завіті слово має ширше грецьке значення: «що домуємо в Мезопотамії» на П’ятидесятницю — це євреї Вавилонії, а Стефан каже, що Бог явився Авраамові, «як був у Мезопотамії, перш нїж оселив ся він у Харані», тобто в Урі."
    - "Слуга Авраама «пійшов у Месопотамію, у Нахорів город», щоб знайти Ревеку, а Якова послали до того самого дому по дружин. Валаам, якого найняв Валак, був «із Пегора в Мезопотамії»; Пефор — це Пітру на ріці Саджур поблизу Кархемиша, названий Салманассаром III у його анналах. За днів суддів Господь віддав Ізраїль «на поталу Хузанові Русатаїмові, цареві Мезопотамїї», якому вони служили вісім років, аж поки Отніїл не визволив їх, а аммонійці найняли колесниці проти Давида «із Сириї Месопотамської» — війна, що згадана в заголовку Псалма 60."
    - "У ширшому значенні Месопотамія — колиска міст, письма й імперій біблійного світу: Ур, Вавилон на Євфраті, Ассур, Калах і Ніневія на Тигрі. Греки дали краю назву за доби Александра; Траян зробив її римською провінцією на кілька років 115 р. н. е., а Септимій Север — знову в 190-х рр. Євреї, виведені до Вавилона, залишилися там, і їхні школи створили Вавилонський Талмуд; Церква Сходу виросла в Едесі та Нісібіні й звідти поширилася до Індії та Китаю."
    - "Сьогодні межиріччя — це Ірак, а також північний схід Сирії та південний схід Туреччини. Харан — село з будинками-вуликами поблизу Шанлиурфи; ріки перегороджені греблями в Кебані, Ататюрку, Табці й Мосулі, а болота нижнього Тигру та Євфрату, осушені в 1990-х рр., частково відновлено."
  es:
    - "Mesopotamia, en griego «entre los ríos», es la tierra del Éufrates y del Tigris. En el Antiguo Testamento el nombre, tomado de la Septuaginta, corresponde al hebreo Aram-naharaim, «Aram de los dos ríos»: no Babilonia sino el país alto en torno a Harán, entre el gran meandro del Éufrates y el Jabur, en lo que hoy es el sudeste de Turquía y el nordeste de Siria. La Biblia sinodal traduce también Padan-aram, la patria de Labán, como Mesopotamia. En el Nuevo Testamento la palabra tiene su sentido griego más amplio: los «que habitamos en Mesopotamia» en Pentecostés son los judíos de Babilonia, y Esteban dice que Dios se apareció a Abraham «estando en Mesopotamia, antes que morase en Chârán», es decir, en Ur."
    - "El siervo de Abraham «llegó á Mesopotamia, á la ciudad de Nachôr» para buscar a Rebeca, y Jacob fue enviado a la misma casa para encontrar sus mujeres. Balaam, a quien contrató Balac, era «de Pethor de Mesopotamia»; Petor es el Pitru del río Sayur, cerca de Carquemis, que Salmanasar III nombra en sus anales. En los días de los jueces, el Señor vendió a Israel «en manos de Chusan-risathaim, rey de Mesopotamia», a quien sirvieron ocho años hasta que Otoniel los libró, y los amonitas contrataron carros contra David «de Siria de los ríos», una guerra recordada en el título del Salmo 60."
    - "En sentido más amplio, Mesopotamia es la cuna de las ciudades, la escritura y los imperios del mundo de la Biblia: Ur, Babel y Babilonia en el Éufrates, Asur, Cala y Nínive en el Tigris. Los griegos dieron nombre a la tierra en la época de Alejandro; Trajano la hizo provincia romana por unos pocos años en 115 d. C., y Septimio Severo de nuevo en los años 190. Los judíos llevados a Babilonia se quedaron, y sus escuelas produjeron el Talmud de Babilonia; la Iglesia de Oriente creció en Edesa y Nísibis y desde allí se extendió a la India y a China."
    - "Hoy la tierra entre los ríos es Irak, con el nordeste de Siria y el sudeste de Turquía. Harán es una aldea de casas en forma de colmena cerca de Şanlıurfa; los ríos están represados en Keban, Atatürk, Tabqa y Mosul, y las marismas del bajo Tigris y Éufrates, drenadas en los años noventa, han sido en parte restauradas."
  pt:
    - "Mesopotâmia, em grego “entre os rios”, é a terra do Eufrates e do Tigre. No Antigo Testamento o nome, tomado da Septuaginta, corresponde ao hebraico Arã-Naaraim, “Arã dos dois rios”: não a Babilônia, mas o país alto em torno de Harã, entre a grande curva do Eufrates e o Khabur, no que hoje é o sudeste da Turquia e o nordeste da Síria. A Bíblia Sinodal também traduz Padã-Arã, a terra de Labã, por Mesopotâmia. No Novo Testamento a palavra tem seu sentido grego mais amplo: os “habitantes da Mesopotâmia” no Pentecostes são os judeus da Babilônia, e Estêvão diz que Deus apareceu a Abraão “quando ele estava na Mesopotâmia, antes de morar em Harã”, isto é, em Ur."
    - "O servo de Abraão “foi para a Mesopotâmia, para a cidade de Naor” para buscar Rebeca, e Jacó foi enviado à mesma casa para obter suas mulheres. Balaão, a quem Balaque contratou, era “de Petor da Mesopotâmia”; Petor é o Pitru, no rio Sajur, perto de Carquemis, que Salmaneser III nomeia em seus anais. Nos dias dos juízes o Senhor vendeu Israel “para a mão de Cusã-Risataim, rei da Mesopotâmia”, a quem serviram oito anos até que Otniel os libertou, e os amonitas contrataram carros contra Davi “da Mesopotâmia”, guerra lembrada no título do Salmo 60."
    - "Em sentido amplo, a Mesopotâmia é o berço das cidades, da escrita e dos impérios do mundo da Bíblia: Ur, Babel e Babilônia no Eufrates, Assur, Calá e Nínive no Tigre. Os gregos deram à terra o seu nome na era de Alexandre; Trajano a fez província romana por alguns anos em 115 d.C., e Sétimo Severo de novo na década de 190. Os judeus levados para a Babilônia ficaram, e suas escolas produziram o Talmude da Babilônia; a Igreja do Oriente cresceu em Edessa e Nísibis e daí se espalhou até a Índia e a China."
    - "Hoje a terra entre os rios é o Iraque, com o nordeste da Síria e o sudeste da Turquia. Harã é uma aldeia de casas em forma de colmeia perto de Şanlıurfa; os rios são represados em Keban, Atatürk, Tabqa e Mossul, e os pântanos do baixo Tigre e Eufrates, drenados na década de 1990, foram em parte restaurados."
  de:
    - "Mesopotamien, griechisch „zwischen den Flüssen“, ist das Land von Euphrat und Tigris. Im Alten Testament steht der Name, aus der Septuaginta übernommen, für das hebräische Aram-Naharajim, „Aram der zwei Flüsse“: nicht Babylonien, sondern das obere Land um Haran, zwischen der großen Biegung des Euphrat und dem Chabur, im heutigen Südosten der Türkei und Nordosten Syriens. Die Synodalbibel gibt auch Paddan-Aram, die Heimat Labans, mit Mesopotamien wieder. Im Neuen Testament hat das Wort seinen weiteren griechischen Sinn: Die, die an Pfingsten „in Mesopotamien“ wohnen, sind die Juden Babyloniens, und Stephanus sagt, Gott sei Abraham erschienen, „da er noch in Mesopotamien war, ehe er wohnte in Haran“, das heißt in Ur."
    - "Abrahams Knecht „zog nach Mesopotamien zu der Stadt Nahors“, um Rebekka zu finden, und Jakob wurde in dasselbe Haus um seine Frauen geschickt. Bileam, den Balak dingte, war „von Pethor aus Mesopotamien“; Petor ist das Pitru am Fluss Sadschur bei Karkemisch, das Salmanassar III. in seinen Annalen nennt. In den Tagen der Richter verkaufte der HERR Israel „unter die Hand Kusan-Risathaims, des Königs von Mesopotamien“, dem sie acht Jahre dienten, bis Otniël sie befreite, und die Ammoniter dingten Wagen gegen David „aus Mesopotamien“, ein Krieg, an den die Überschrift von Psalm 60 erinnert."
    - "Im weiteren Sinn ist Mesopotamien die Wiege der Städte, der Schrift und der Reiche der Welt der Bibel: Ur, Babel und Babylon am Euphrat, Assur, Kalach und Ninive am Tigris. Die Griechen gaben dem Land zur Zeit Alexanders seinen Namen; Trajan machte es 115 n. Chr. für einige Jahre zur römischen Provinz, und Septimius Severus erneut in den 190er Jahren. Die nach Babylon verschleppten Juden blieben, und ihre Schulen brachten den Babylonischen Talmud hervor; die Kirche des Ostens wuchs in Edessa und Nisibis und breitete sich von dort bis Indien und China aus."
    - "Heute ist das Land zwischen den Flüssen der Irak, mit dem Nordosten Syriens und dem Südosten der Türkei. Haran ist ein Dorf mit Bienenkorbhäusern bei Şanlıurfa; die Flüsse sind bei Keban, Atatürk, Tabqa und Mossul gestaut, und die in den 1990er Jahren trockengelegten Sümpfe des unteren Tigris und Euphrat sind teilweise wiederhergestellt."
  fr:
    - "La Mésopotamie, en grec « entre les fleuves », est le pays de l’Euphrate et du Tigre. Dans l’Ancien Testament, le nom, repris de la Septante, rend l’hébreu Aram-Naharaïm, « Aram des deux fleuves » : non pas la Babylonie mais le haut pays autour de Haran, entre la grande boucle de l’Euphrate et le Khabour, dans ce qui est aujourd’hui le sud-est de la Turquie et le nord-est de la Syrie. La Bible synodale rend aussi par Mésopotamie Paddan-Aram, patrie de Laban. Dans le Nouveau Testament, le mot a son sens grec plus large : « ceux qui habitent la Mésopotamie » à la Pentecôte sont les Juifs de Babylonie, et Étienne dit que Dieu apparut à Abraham « lorsqu’il était en Mésopotamie, avant qu’il s’établît à Charran », c’est-à-dire à Ur."
    - "Le serviteur d’Abraham « alla en Mésopotamie, à la ville de Nachor » pour trouver Rebecca, et Jacob fut envoyé dans la même maison pour ses épouses. Balaam, que Balak engagea, était « de Pethor en Mésopotamie » ; Pethor est le Pitrou sur le fleuve Sadjour près de Carkemisch que Salmanasar III nomme dans ses annales. Aux jours des juges, l’Éternel « les vendit entre les mains de Cuschan-Rischeathaïm, roi de Mésopotamie », qu’ils servirent huit ans jusqu’à ce qu’Othniel les délivre, et les Ammonites engagèrent contre David des chars « chez les Syriens de Mésopotamie », guerre dont rappelle le titre du Psaume 60."
    - "Au sens large, la Mésopotamie est le berceau des villes, de l’écriture et des empires du monde de la Bible : Ur, Babel et Babylone sur l’Euphrate, Assur, Calach et Ninive sur le Tigre. Les Grecs donnèrent son nom au pays à l’époque d’Alexandre ; Trajan en fit une province romaine pour quelques années en 115 apr. J.-C., et Septime Sévère de nouveau dans les années 190. Les Juifs emmenés à Babylone y restèrent, et leurs écoles produisirent le Talmud de Babylone ; l’Église d’Orient grandit à Édesse et à Nisibe et s’étendit de là jusqu’en Inde et en Chine."
    - "Aujourd’hui, le pays entre les fleuves est l’Irak, avec le nord-est de la Syrie et le sud-est de la Turquie. Haran est un village de maisons en forme de ruche près de Şanlıurfa ; les fleuves sont barrés à Keban, Atatürk, Tabqa et Mossoul, et les marais du bas Tigre et du bas Euphrate, asséchés dans les années 1990, ont été en partie restaurés."
