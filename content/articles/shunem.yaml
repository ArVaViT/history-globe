body:
  en:
    - "Shunem is identified with the village of Sulam, at the foot of the hill now called Givat HaMoreh on the north side of the Jezreel Valley, about 5 km north of Jezreel and facing Mount Gilboa across the plain. In the fourteenth century BC Biridiya, ruler of Megiddo, wrote to Pharaoh in one of the Amarna letters that he alone was cultivating at Shunama and furnishing men for the corvée; another letter recalls that Lab'ayu of Shechem had attacked Shunama. The town also appears in the lists of conquered places of Thutmose III and of Shishak at Karnak."
    - 'In the Book of Joshua Shunem lies on the border of Issachar. Before Saul''s last battle the Philistines "came and pitched in Shunem", while Saul gathered all Israel in Gilboa; Josephus places their camp near the city Shunem, in the plain. When King David was old, his servants sought a fair damsel throughout all Israel and found Abishag the Shunammite to minister to him. After David''s death Adonijah asked for Abishag to wife, and Solomon took the request as a claim to the kingdom and had him put to death.'
    - "Elisha, passing through, often ate at the house of a great woman of Shunem; she and her husband made him a little chamber on the wall with a bed, a table, a stool and a candlestick. Elisha promised her a son, and she bore one; when the child died, she rode to the prophet at Mount Carmel, and he came and raised him to life. Later, at Elisha's word, she sojourned seven years in the land of the Philistines during a famine, and on her return the king restored her house and her land. Some link the Shulamite of the Song of Solomon with Shunem, but this is uncertain."
    - "In the early fourth century Eusebius knew a village called Soulem five miles south of Mount Tabor. Small excavations in the village of Sulam have found pottery of the Bronze and Iron Ages and remains of the Roman and Byzantine periods."
  ru:
    - "Сонам отождествляют с селением Сулам у подножия холма, который сегодня называют Гиват-ха-Море, на северной стороне Изреельской долины, примерно в 5 км к северу от Изрееля, напротив горы Гелвуй по ту сторону равнины. В XIV веке до н. э. Биридия, правитель Мегиддо, писал фараону в одном из амарнских писем, что только он возделывает землю в Шунаме и поставляет людей на повинность; в другом письме вспоминается, что Лабайю из Сихема нападал на Шунаму. Город назван и в списках покорённых мест Тутмоса III и Сусакима в Карнаке."
    - "В книге Иисуса Навина Сонам лежит на границе Иссахара. Перед последней битвой Саула Филистимляне «пошли и стали станом в Сонаме», а Саул собрал весь народ Израильский на Гелвуе; Иосиф Флавий помещает их стан у города Сонама, на равнине. Когда царь Давид состарился, слуги искали красивой девицы во всех пределах Израильских и нашли Ависагу Сунамитянку, чтобы она прислуживала ему. После смерти Давида Адония просил Ависагу себе в жену, и Соломон счёл эту просьбу притязанием на царство и предал его смерти."
    - "Елисей, проходя мимо, часто ел хлеб в доме одной богатой женщины в Сонаме; она с мужем сделала ему небольшую горницу над стеною и поставила там постель, стол, седалище и светильник. Елисей обещал ей сына, и она родила его; когда ребёнок умер, она отправилась к пророку на гору Кармил, и он пришёл и воскресил его. Позже, по слову Елисея, она во время голода семь лет жила в земле Филистимской, а когда вернулась, царь возвратил ей дом и поле. Некоторые связывают Суламиту из Песни песней с Сонамом, но это не доказано."
    - "В начале IV века Евсевий знал селение Сулем в пяти милях к югу от горы Фавор. Небольшие раскопки в селении Сулам дали керамику бронзового и железного веков и остатки римского и византийского времени."
  uk:
    - "Сунем ототожнюють із селом Сулам, біля підніжжя пагорба, який нині зветься Гіват-га-Море, на північній стороні Їзреельської долини, приблизно за 5 км на північ від Їзреелю й навпроти гори Гільбоа через рівнину. У XIV ст. до н. е. Бірідія, володар Мегіддо, писав фараонові в одному з амарнських листів, що лише він обробляє землю в Шунамі та постачає людей на примусові роботи; в іншому листі нагадується, що Лабайу з Сихему напав на Шунаму. Місто також згадується в переліках підкорених місць Тутмоса III та Сусакіма в Карнаку."
    - "У книзі Ісуса Навина Сунем лежить на межі Іссахара. Перед останньою битвою Саула філістимляни «пійшли та й отаборились в Сонамі», тоді як Саул зібрав усього Ізраїля на Гільбоа; Йосиф Флавій розміщує їхній табір поблизу міста Сунем, на рівнині. Коли цар Давид постарів, його слуги шукали гарну дівчину по всьому Ізраїлю й знайшли Авісагу, сунамітянку, щоб вона йому прислужувала. Після смерті Давида Адонія попросив Авісагу собі за дружину, і Соломон сприйняв це прохання як претензію на царство та наказав його стратити."
    - "Єлисей, проходячи, часто їв у домі великої жінки з Сунема; вона з чоловіком зробила йому невелику кімнатку на стіні з ліжком, столом, стільцем і свічником. Єлисей пообіцяв їй сина, і вона його народила; коли дитина померла, вона поїхала до пророка на гору Кармель, і він прийшов і воскресив її. Пізніше, за словом Єлисея, вона сім років перебувала в країні філістимлян під час голоду, а після її повернення цар повернув їй дім і землю. Дехто пов'язує Суламіту з Пісні над піснями із Сунемом, але це непевно."
    - "На початку IV ст. Євсевій знав село Сулем за п'ять миль на південь від гори Фавор. Невеликі розкопки в селі Сулам виявили кераміку бронзового й залізного віків та залишки римської й візантійської доби."
  es:
    - "Sunem se identifica con la aldea de Sulam, al pie de la colina llamada hoy Givat HaMoré en el lado norte del valle de Jezreel, a unos 5 km al norte de Jezreel y frente al monte Gilboa al otro lado de la llanura. En el siglo XIV a. C. Biridiya, gobernante de Meguido, escribió al faraón en una de las cartas de Amarna que él solo cultivaba en Shunama y proporcionaba hombres para la corvea; otra carta recuerda que Lab'ayu de Siquem había atacado Shunama. La ciudad figura también en las listas de lugares conquistados de Tutmosis III y de Sisac en Karnak."
    - "En el libro de Josué Sunem está en la frontera de Isacar. Antes de la última batalla de Saúl los filisteos «vinieron y asentaron campo en Sunam», mientras Saúl reunía a todo Israel en Gilboa; Josefo sitúa su campamento cerca de la ciudad de Sunem, en la llanura. Cuando el rey David era viejo, sus siervos buscaron una moza hermosa por todo Israel y hallaron a Abisag la sunamita para que le sirviera. Tras la muerte de David, Adonías pidió a Abisag por mujer, y Salomón tomó la petición como una pretensión al reino y lo hizo ejecutar."
    - "Eliseo, de paso, comía a menudo en casa de una mujer principal de Sunem; ella y su marido le hicieron una pequeña cámara en la pared con cama, mesa, silla y candelero. Eliseo le prometió un hijo, y ella lo tuvo; cuando el niño murió, ella fue a caballo al profeta en el monte Carmelo, y él vino y lo devolvió a la vida. Más tarde, por palabra de Eliseo, ella residió siete años en la tierra de los filisteos durante una hambruna, y a su regreso el rey le devolvió su casa y su tierra. Algunos vinculan a la sulamita del Cantar de los Cantares con Sunem, pero esto es incierto."
    - "A principios del siglo IV Eusebio conocía una aldea llamada Soulem a cinco millas al sur del monte Tabor. Pequeñas excavaciones en la aldea de Sulam han hallado cerámica de las Edades del Bronce y del Hierro y restos de los períodos romano y bizantino."
  pt:
    - "Suném é identificada com a aldeia de Sulam, ao pé da colina hoje chamada Givat HaMoreh, no lado norte do vale de Jezreel, a cerca de 5 km ao norte de Jezreel e de frente para o Monte Gilboa, do outro lado da planície. No século XIV a.C., Biridiya, governante de Megido, escreveu ao faraó numa das cartas de Amarna que só ele cultivava em Shunama e fornecia homens para a corveia; outra carta recorda que Lab'ayu de Siquém atacara Shunama. A cidade aparece também nas listas de lugares conquistados por Tutmés III e por Sisaque em Karnak."
    - "No livro de Josué, Suném fica na fronteira de Issacar. Antes da última batalha de Saul, os filisteus “vieram e acamparam em Suném”, enquanto Saul reunia todo o Israel em Gilboa; Josefo põe o acampamento deles perto da cidade de Suném, na planície. Quando o rei Davi envelheceu, seus servos buscaram uma jovem bonita por todo o Israel e acharam Abisague, a sunamita, para servi-lo. Depois da morte de Davi, Adonias pediu Abisague por mulher, e Salomão tomou o pedido como reivindicação do reino e o mandou matar."
    - "Eliseu, de passagem, comia muitas vezes na casa de uma mulher importante de Suném; ela e o marido fizeram para ele um pequeno quarto no terraço, com cama, mesa, cadeira e candelabro. Eliseu lhe prometeu um filho, e ela o teve; quando o menino morreu, ela foi montada ao profeta no Monte Carmelo, e ele veio e o ressuscitou. Mais tarde, por palavra de Eliseu, ela viveu sete anos na terra dos filisteus durante uma fome, e na volta o rei lhe restituiu a casa e a terra. Alguns ligam a sulamita do Cântico dos Cânticos a Suném, mas isso é incerto."
    - "No início do século IV, Eusébio conhecia uma aldeia chamada Soulem a cinco milhas ao sul do Monte Tabor. Pequenas escavações na aldeia de Sulam acharam cerâmica das Idades do Bronze e do Ferro e restos dos períodos romano e bizantino."
  de:
    - "Schunem wird mit dem Dorf Sulam gleichgesetzt, am Fuß des heute Givat HaMore genannten Hügels an der Nordseite der Jesreel-Ebene, etwa 5 km nördlich von Jesreel und dem Gilboa über die Ebene hinweg gegenüber. Im 14. Jahrhundert v. Chr. schrieb Biridija, Herrscher von Megiddo, in einem der Amarna-Briefe an den Pharao, er allein bestelle in Schunama den Boden und stelle Männer für den Frondienst; ein anderer Brief erinnert, dass Lab'aju von Sichem Schunama angegriffen hatte. Die Stadt erscheint auch in den Listen eroberter Orte Tutmosis' III. und Schischaks in Karnak."
    - "Im Buch Josua liegt Schunem an der Grenze von Issachar. Vor Sauls letzter Schlacht „lagerten sich“ die Philister „zu Sunem“, während Saul ganz Israel „zu Gilboa“ versammelte; Josephus setzt ihr Lager nahe der Stadt Schunem in der Ebene an. Als König David alt war, suchten seine Diener „eine schöne Dirne im ganzen Gebiet Israels“ und fanden Abisag von Schunem, ihm zu dienen. Nach Davids Tod bat Adonija um Abisag zur Frau, und Salomo fasste die Bitte als Anspruch auf das Königtum auf und ließ ihn töten."
    - "Elisa kehrte auf seinen Wegen oft im Haus einer reichen Frau von Schunem ein und aß dort; sie und ihr Mann machten ihm eine kleine Kammer an der Mauer, mit „Bett, Tisch, Stuhl und Leuchter“. Elisa verhieß ihr einen Sohn, und sie gebar einen; als das Kind starb, ritt sie zum Propheten auf dem Karmel, und er kam und weckte es zum Leben. Später „wohnte“ sie auf Elisas Wort bei einer Hungersnot „in der Philister Land sieben Jahre“, und bei ihrer Rückkehr gab der König ihr Haus und Acker zurück. Manche verbinden die Schulammit des Hohelieds mit Schunem, doch das ist unsicher."
    - "Im frühen 4. Jahrhundert kannte Eusebius ein Dorf namens Soulem fünf Meilen südlich des Tabor. Kleine Grabungen im Dorf Sulam haben Keramik der Bronze- und Eisenzeit und Reste der römischen und byzantinischen Zeit gefunden."
  fr:
    - "Sunem est identifiée au village de Sulam, au pied de la colline appelée aujourd’hui Givat HaMoreh, sur le côté nord de la vallée de Jizreel, à environ 5 km au nord de Jizreel et face au mont Guilboa de l’autre côté de la plaine. Au XIVe siècle av. J.-C., Biridiya, souverain de Meguiddo, écrivit au pharaon dans l’une des lettres d’Amarna qu’il était seul à cultiver à Shunama et à fournir des hommes pour la corvée ; une autre lettre rappelle que Lab‘ayu de Sichem avait attaqué Shunama. La ville figure aussi dans les listes de lieux conquis de Thoutmosis III et de Schischak à Karnak."
    - "Dans le livre de Josué, Sunem se trouve sur la frontière d’Issacar. Avant la dernière bataille de Saül, les Philistins « vinrent camper à Sunem », tandis que Saül rassemblait tout Israël à Guilboa ; Flavius Josèphe place leur camp près de la ville de Sunem, dans la plaine. Quand le roi David fut vieux, ses serviteurs cherchèrent « dans tout le territoire d’Israël une fille jeune et belle » et trouvèrent Abischag, la Sunamite, pour le servir. Après la mort de David, Adonija demanda Abischag pour femme, et Salomon prit la demande pour une revendication du royaume et le fit mettre à mort."
    - "Élisée, de passage, mangeait souvent chez « une femme de distinction » de Sunem ; elle et son mari lui firent « une petite chambre haute avec des murs », avec « un lit, une table, un siège et un chandelier ». Élisée lui promit un fils, et elle en enfanta un ; quand l’enfant mourut, elle se rendit à cheval auprès du prophète au mont Carmel, et il vint et le ressuscita. Plus tard, sur la parole d’Élisée, elle « séjourna sept ans au pays des Philistins » pendant une famine, et à son retour le roi lui rendit sa maison et son champ. Certains rattachent la Sulamite du Cantique des cantiques à Sunem, mais c’est incertain."
    - "Au début du IVe siècle, Eusèbe connaissait un village appelé Soulem à cinq milles au sud du mont Thabor. De petites fouilles dans le village de Sulam ont trouvé de la céramique des âges du Bronze et du Fer et des vestiges des époques romaine et byzantine."
  it:
    - "Sunem è identificata con il villaggio di Sulam, ai piedi della collina oggi chiamata Givat HaMoreh sul lato nord della valle di Izreel, circa 5 km a nord di Izreel e di fronte al Monte Gelboe attraverso la pianura. Nel XIV secolo a.C. Biridiya, governante di Meghiddo, scrisse al faraone in una delle lettere di Amarna di essere l’unico a coltivare a Shunama e a fornire uomini per la corvée; un’altra lettera ricorda che Lab’ayu di Sichem aveva attaccato Shunama. La città compare anche negli elenchi di luoghi conquistati di Tutmosi III e di Sisak a Karnak."
    - "Nel libro di Giosuè Sunem si trova sul confine di Issacar. Prima dell’ultima battaglia di Saul i Filistei «vennero ad accamparsi a Sunem», mentre Saul radunava tutto Israele a Gelboe; Giuseppe Flavio pone il loro campo presso la città di Sunem, nella pianura. Quando il re Davide era vecchio, i suoi servi cercarono una bella fanciulla in tutto Israele e trovarono Abisag la Sunamita perché lo servisse. Dopo la morte di Davide, Adonia chiese Abisag in moglie, e Salomone prese la richiesta come una pretesa al regno e lo fece mettere a morte."
    - "Eliseo, passando, mangiava spesso nella casa di una donna importante di Sunem; lei e suo marito gli costruirono una piccola camera sul muro con un letto, un tavolo, una sedia e un candeliere. Eliseo le promise un figlio, ed ella ne partorì uno; quando il bambino morì, ella cavalcò fino al profeta sul Monte Carmelo, ed egli venne e lo riportò in vita. Più tardi, per parola di Eliseo, ella soggiornò sette anni nel paese dei Filistei durante una carestia, e al suo ritorno il re le restituì la casa e la terra. Alcuni collegano la Sulamita del Cantico dei Cantici con Sunem, ma ciò è incerto."
    - "All’inizio del IV secolo Eusebio conosceva un villaggio chiamato Sulem a cinque miglia a sud del Monte Tabor. Piccoli scavi nel villaggio di Sulam hanno trovato ceramica dell’età del Bronzo e del Ferro e resti di epoca romana e bizantina."
  pl:
    - "Szunem utożsamia się ze wsią Sulam, u stóp wzgórza zwanego dziś Giwat ha-More po północnej stronie doliny Jizreel, około 5 km na północ od Jizreel i naprzeciw Góry Gilboa po drugiej stronie równiny. W XIV wieku p.n.e. Biridija, władca Megiddo, pisał do faraona w jednym z listów z Amarny, że jedynie on uprawia ziemię w Szunama i dostarcza ludzi do robót przymusowych; inny list przypomina, że Labaju z Sychem zaatakował Szunamę. Miasto występuje też na listach zdobytych miejsc Totmesa III i Sziszaka w Karnaku."
    - "W Księdze Jozuego Szunem leży na granicy Issachara. Przed ostatnią bitwą Saula Filistyni „przyciągnęli, a położyli się obozem u Sunam”, podczas gdy Saul zgromadził całego Izraela w Gilboa; Józef Flawiusz umieszcza ich obóz koło miasta Szunem, na równinie. Gdy król Dawid zestarzał się, jego słudzy szukali pięknej panienki po całym Izraelu i znaleźli Abiszag Szunamitkę, by mu usługiwała. Po śmierci Dawida Adoniasz prosił o Abiszag za żonę, a Salomon uznał tę prośbę za roszczenie do królestwa i kazał go zabić."
    - "Elizeusz, przechodząc, często jadał w domu wielkiej niewiasty z Szunem; ona i jej mąż urządzili mu małą izbę na murze z łóżkiem, stołem, krzesłem i lichtarzem. Elizeusz obiecał jej syna i urodziła go; gdy dziecko umarło, pojechała do proroka na górze Karmel, a on przyszedł i przywrócił je do życia. Później na słowo Elizeusza przebywała siedem lat w ziemi Filistynów podczas głodu, a po powrocie król zwrócił jej dom i ziemię. Niektórzy łączą Szulamitkę z Pieśni nad Pieśniami z Szunem, lecz jest to niepewne."
    - "Na początku IV wieku Euzebiusz znał wieś zwaną Sulem pięć mil na południe od Góry Tabor. Niewielkie wykopaliska we wsi Sulam znalazły ceramikę z epoki brązu i żelaza oraz pozostałości z okresu rzymskiego i bizantyńskiego."
  cs:
    - "Šúnem se ztotožňuje s vesnicí Sulam, na úpatí pahorku dnes zvaného Giv'at ha-Móre na severní straně Jizreelského údolí, asi 5 km severně od Jizreelu a naproti hoře Gilboa přes rovinu. Ve 14. století př. n. l. napsal Biridija, vládce Megida, faraonovi v jednom z amarnských dopisů, že jen on obdělává půdu v Šunamě a dodává muže na robotu; jiný dopis připomíná, že Labaja ze Šekemu napadl Šunamu. Město se objevuje také v seznamech dobytých míst Thutmose III. a Šíšaka v Karnaku."
    - "V Knize Jozue leží Šúnem na hranici Isacharu. Před Saulovou poslední bitvou Pelištejci „přitáhli a položili se u Sunem“, zatímco Saul shromáždil všechen Izrael v Gilboa; Josephus klade jejich tábor poblíž města Šúnem, v rovině. Když byl král David starý, hledali jeho služebníci krásnou dívku po celém Izraeli a nalezli Abišag Šúnemskou, aby mu sloužila. Po Davidově smrti Adonijáš požádal o Abišag za ženu a Šalomoun v tom spatřil nárok na království a dal ho popravit."
    - "Elíša, procházející kolem, často jedl v domě velké ženy ze Šúnemu; ona a její muž mu zřídili malou komůrku na zdi s lůžkem, stolem, stoličkou a svícnem. Elíša jí slíbil syna a ona jednoho porodila; když dítě zemřelo, jela k prorokovi na horu Karmel a on přišel a vzkřísil je. Později, na Elíšovo slovo, pobývala sedm let v zemi Pelištejců za hladomoru a po návratu jí král vrátil dům i pole. Někteří spojují Šulamitku z Písně Šalomounovy se Šúnemem, ale to je nejisté."
    - "Na počátku 4. století znal Eusebius vesnici zvanou Soulem pět mil jižně od hory Tábor. Malé vykopávky ve vesnici Sulam nalezly keramiku z doby bronzové a železné a zbytky z doby římské a byzantské."
  nl:
    - "Sunem wordt gelijkgesteld met het dorp Sulam, aan de voet van de heuvel die nu Givat HaMoreh heet aan de noordkant van de vallei van Jizreël, zo’n 5 km ten noorden van Jizreël en met uitzicht op de Gilboa aan de overkant van de vlakte. In de 14e eeuw v.Chr. schreef Biridiya, heerser van Megiddo, aan de farao in een van de Amarnabrieven dat hij alleen te Shunama bebouwde en mannen leverde voor de herendienst; een andere brief herinnert eraan dat Lab’ayu van Sichem Shunama had aangevallen. De stad komt ook voor in de lijsten van veroverde plaatsen van Thoetmosis III en van Sisak te Karnak."
    - "In het boek Jozua ligt Sunem op de grens van Issaschar. Vóór Sauls laatste slag, toen de Filistijnen “kwamen en vergaderden zich, en zij legerden zich te Sunem”, verzamelde Saul heel Israël op de Gilboa; Josephus plaatst hun kamp bij de stad Sunem, in de vlakte. Toen koning David oud was, zochten zijn knechten door heel Israël een mooie jonge vrouw en vonden Abisag de Sunamitische om hem te dienen. Na Davids dood vroeg Adonia Abisag tot vrouw, en Salomo vatte het verzoek op als een aanspraak op het koninkrijk en liet hem ter dood brengen."
    - "Elisa at op doorreis vaak in het huis van een grote vrouw van Sunem; zij en haar man maakten hem een kamertje aan de muur met een bed, een tafel, een stoel en een kandelaar. Elisa beloofde haar een zoon, en zij baarde er een; toen het kind stierf, reed zij naar de profeet op de Karmel, en hij kwam en wekte hem tot leven. Later verbleef zij op Elisa’s woord zeven jaar in het land van de Filistijnen tijdens een hongersnood, en bij haar terugkeer gaf de koning haar huis en land terug. Sommigen brengen de Sulamitische van het Hooglied met Sunem in verband, maar dat is onzeker."
    - "Begin 4e eeuw kende Eusebius een dorp Soulem, vijf mijl ten zuiden van de Tabor. Kleine opgravingen in het dorp Sulam hebben aardewerk uit de brons- en ijzertijd en resten uit de Romeinse en Byzantijnse tijd gevonden."
  sv:
    - "Shunem identifieras med byn Sulam, vid foten av höjden som i dag kallas Givat HaMoreh på norra sidan av Jisreeldalen, omkring 5 km norr om Jisreel och mitt emot Gilboa över slätten. På 1300-talet f.Kr. skrev Biridiya, härskare i Megiddo, till farao i ett av Amarnabreven att han ensam odlade vid Shunama och ställde upp män till tvångsarbetet; ett annat brev erinrar om att Lab'ayu av Shekem hade angripit Shunama. Staden förekommer också i förteckningarna över erövrade platser hos Thutmosis III och Shishak i Karnak."
    - "I Josuaboken ligger Shunem vid Isaskars gräns. Före Sauls sista strid ”kommo och lägrade sig vid Sunem” filisteerna, medan Saul samlade hela Israel vid Gilboa; Josefus förlägger deras läger nära staden Shunem, på slätten. När kung David var gammal sökte hans tjänare en ung och vacker flicka i hela Israel och fann Avishag från Shunem för att tjäna honom. Efter Davids död bad Adonia att få Avishag till hustru, och Salomo tog begäran som ett anspråk på kungadömet och lät döda honom."
    - "Elisha, som drog förbi, åt ofta hos en förnäm kvinna i Shunem; hon och hennes man gjorde åt honom en liten kammare på muren med en säng, ett bord, en stol och en ljusstake. Elisha lovade henne en son, och hon födde en; när barnet dog red hon till profeten vid Karmel, och han kom och väckte det till liv. Senare, på Elishas ord, vistades hon sju år i filisteernas land under en hungersnöd, och vid hemkomsten gav kungen tillbaka hennes hus och hennes mark. Vissa förbinder sulamiten i Höga visan med Shunem, men det är osäkert."
    - "I början av 300-talet kände Eusebios en by kallad Soulem fem romerska mil söder om Tabor. Små utgrävningar i byn Sulam har funnit keramik från bronsåldern och järnåldern och lämningar från romersk och bysantinsk tid."
  nb:
    - "Sjunem identifiseres med landsbyen Sulam, ved foten av høyden som nå kalles Givat HaMoreh på nordsiden av Jisreeldalen, omkring 5 km nord for Jisreel og vendt mot Gilboa over sletten. På 1300-tallet f.Kr. skrev Biridiya, hersker over Megiddo, til farao i et av Amarna-brevene at han alene dyrket jorden ved Shunama og stilte mannskap til tvangsarbeidet; et annet brev minner om at Lab'ayu av Sikem hadde angrepet Shunama. Byen står også på listene over erobrede steder av Tutmosis III og av Sjisjak i Karnak."
    - "I Josvas bok ligger Sjunem i Issakars grenseland. Før Sauls siste slag, etter at filistrene hadde samlet seg, «trengte de frem til Sunem og leiret sig der», mens Saul samlet hele Israel på Gilboa; Josefus plasserer leiren deres nær byen Sjunem, på sletten. Da kong David var gammel, lette tjenerne hans over hele Israel etter en vakker ung pike og fant Abisjag fra Sjunem til å stelle for ham. Etter Davids død ba Adonja om å få Abisjag til hustru, og Salomo oppfattet bønnen som et krav på kongedømmet og lot ham drepe."
    - "Elisja, som kom forbi, spiste ofte hos en velstående kvinne i Sjunem; hun og mannen hennes gjorde i stand et lite kammer på taket med seng, bord, stol og lysestake. Elisja lovet henne en sønn, og hun fødte en; da gutten døde, red hun til profeten på Karmel, og han kom og vekket ham til live. Senere, etter Elisjas ord, bodde hun syv år i filistrenes land under en hungersnød, og da hun kom tilbake, ga kongen henne huset og jorden hennes tilbake. Noen knytter sulamitten i Høysangen til Sjunem, men dette er usikkert."
    - "Tidlig på 300-tallet kjente Eusebius en landsby kalt Soulem fem romerske mil sør for Tabor. Små utgravninger i landsbyen Sulam har funnet keramikk fra bronse- og jernalder og levninger fra romersk og bysantinsk tid."
  tl:
    - "Ang Sunem ay kinikilala sa nayon ng Sulam, sa paanan ng burol na tinatawag ngayong Givat HaMoreh sa hilagang panig ng Libis ng Jezreel, mga 5 km sa hilaga ng Jezreel at nakaharap sa Bundok Gilboa sa kabila ng kapatagan. Noong ika-14 na siglo BK, si Biridiya, pinuno ng Megiddo, ay sumulat kay Faraon sa isa sa mga sulat ng Amarna na siya lamang ang nagtatanim sa Shunama at nagbibigay ng mga tao para sa corvée; ipinaaalala ng isa pang sulat na sinalakay ni Lab'ayu ng Sichem ang Shunama. Lumilitaw rin ang bayan sa mga talaan ng mga nasakop na lugar nina Thutmose III at Sisac sa Karnak."
    - "Sa Aklat ni Josue, ang Sunem ay nasa hangganan ng Issachar. Bago ang huling labanan ni Saul, ang mga Filisteo ay “naparoon at humantong sa Sunam”, samantalang tinipon ni Saul ang buong Israel sa Gilboa; inilalagay ni Josefo ang kanilang kampamento malapit sa lunsod ng Sunem, sa kapatagan. Nang matanda na si Haring David, naghanap ang kaniyang mga lingkod ng isang magandang dalaga sa buong Israel at natagpuan si Abisag na Sunamita upang maglingkod sa kaniya. Pagkamatay ni David, hiniling ni Adonia si Abisag bilang asawa, at itinuring ni Salomon ang kahilingan bilang pag-angkin sa kaharian at ipinapatay siya."
    - "Si Eliseo, na dumaraan, ay madalas kumain sa bahay ng isang dakilang babae ng Sunem; siya at ang kaniyang asawa ay gumawa para sa kaniya ng isang maliit na silid sa pader na may higaan, mesa, upuan at kandelero. Nangako si Eliseo sa kaniya ng isang anak na lalake, at nanganak siya; nang mamatay ang bata, sumakay siya patungo sa propeta sa Bundok Carmelo, at siya ay dumating at binuhay ang bata. Pagkaraan, sa salita ni Eliseo, nakipamayan siya ng pitong taon sa lupain ng mga Filisteo noong taggutom, at pagbalik niya ay ibinalik ng hari ang kaniyang bahay at lupa. May iniuugnay ang ilan sa Sunem ang Sulamita ng Awit ni Salomon, ngunit hindi ito tiyak."
    - "Noong unang bahagi ng ika-4 na siglo, kilala ni Eusebio ang isang nayong tinatawag na Soulem, limang milya sa timog ng Bundok Tabor. Ang maliliit na paghuhukay sa nayon ng Sulam ay nakatagpo ng mga palayok mula sa Panahong Tanso at Bakal at mga labi ng panahong Romano at Bizantino."
  da:
    - "Sjunem identificeres med landsbyen Sulam ved foden af den bakke, der nu hedder Givat HaMoreh, på nordsiden af Jizre'el-dalen, omkring 5 km nord for Jizre'el og over for Gilboa-bjerget på den anden side af sletten. I 1300-tallet f.Kr. skrev Biridiya, hersker over Megiddo, til farao i et af Amarna-brevene, at han alene dyrkede jorden ved Shunama og stillede mænd til hoveripligt; et andet brev minder om, at Lab'ayu af Sikem havde angrebet Shunama. Byen optræder også i Thutmosis 3.s og Sjisjaks lister over erobrede steder i Karnak."
    - "I Josvas Bog ligger Sjunem på Issakars grænse. Før Sauls sidste slag hedder det, at filistrene »kom og lejrede sig i Sunem«, mens Saul samlede hele Israel i Gilboa; Josephus placerer deres lejr nær byen Sjunem på sletten. Da kong David var blevet gammel, ledte hans tjenere i hele Israel efter en smuk ung pige og fandt Abisjag fra Sjunem til at tjene ham. Efter Davids død bad Adonija om at få Abisjag til hustru, og Salomo opfattede anmodningen som et krav på kongedømmet og lod ham dræbe."
    - "Elisa spiste ofte, når han kom forbi, i huset hos en anset kvinde i Sjunem; hun og hendes mand indrettede ham et lille kammer på muren med en seng, et bord, en stol og en lysestage. Elisa lovede hende en søn, og hun fødte en; da barnet døde, red hun til profeten på Karmel, og han kom og vækkede det til live. Senere opholdt hun sig på Elisas ord i syv år i filistrenes land under en hungersnød, og da hun vendte tilbage, gav kongen hende hendes hus og hendes jord tilbage. Nogle sætter Sulamit i Højsangen i forbindelse med Sjunem, men det er usikkert."
    - "I begyndelsen af 300-tallet e.Kr. kendte Eusebius en landsby kaldet Soulem fem romerske mil syd for Tabor. Små udgravninger i landsbyen Sulam har fundet keramik fra bronze- og jernalderen og rester fra romersk og byzantinsk tid."
  sr:
    - "Сунам се поистовећује са селом Сулам, у подножју брда које се данас зове Гиват ха-Море на северној страни Језраелске долине, око 5 км северно од Језраела и наспрам горе Гелвује преко равнице. У 14. веку п. н. е. Бирдија, владар Мегида, писао је фараону у једном од амарнских писама да једини обрађује земљу у Шунами и даје људе за принудни рад; друго писмо подсећа да је Лабају из Сихема напао Шунаму. Град се јавља и у списковима освојених места Тутмоса III и Сисака у Карнаку."
    - "У Књизи Исусовој Сунам лежи на граници Исахаровој. Пред Саулову последњу битку Филистеји „дођоше и стадоше у логор код Сунима“, док је Саул скупио све Израиљце у Гелвуји; Јосиф Флавије њихов логор смешта близу града Сунама, у равници. Када је цар Давид остарео, слуге су по свем Израиљу тражиле лепу девојку и нашле Ависагу Сунамку да му служи. После Давидове смрти Адонија је затражио Ависагу за жену, а Соломун је то схватио као претензију на царство и дао га погубити."
    - "Јелисије је, пролазећи, често јео у кући велике жене у Сунаму; она и њен муж начинили су му малу собицу на зиду с постељом, столом, столицом и светиљком. Јелисије јој је обећао сина и она га је родила; када је дете умрло, одјахала је пророку на гору Кармил, а он је дошао и оживео га. Касније је по Јелисијевој речи седам година боравила у земљи филистејској за време глади, а по повратку јој је цар вратио кућу и земљу. Неки са Сунамом повезују Суламку из Песме над песмама, али то је несигурно."
    - "Почетком 4. века Јевсевије је знао село по имену Сулем пет миља јужно од горе Тавор. Мала ископавања у селу Сулам открила су керамику из бронзаног и гвозденог доба и остатке из римског и византијског периода."
