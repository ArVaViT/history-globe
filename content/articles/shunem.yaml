# Overview article (ADR 0007). Mainstream facts only; disputed readings are named as such.
id: shunem
place: ac86af5
title:
  en: "Shunem"
  ru: "Сонам"
  uk: "Сунем"
  es: "Sunem"
  pt: "Suném"
  de: "Schunem"
  fr: "Sunem"
body:
  en:
    - "Shunem is identified with the village of Sulam, at the foot of the hill now called Givat HaMoreh on the north side of the Jezreel Valley, about 5 km north of Jezreel and facing Mount Gilboa across the plain. In the fourteenth century BC Biridiya, ruler of Megiddo, wrote to Pharaoh in one of the Amarna letters that he alone was cultivating at Shunama and furnishing men for the corvée; another letter recalls that Lab'ayu of Shechem had attacked Shunama. The town also appears in the lists of conquered places of Thutmose III and of Shishak at Karnak."
    - 'In the Book of Joshua Shunem lies on the border of Issachar. Before Saul''s last battle the Philistines "came and pitched in Shunem", while Saul gathered all Israel in Gilboa; Josephus places their camp near the city Shunem, in the plain. When King David was old, his servants sought a fair damsel throughout all Israel and found Abishag the Shunammite to minister to him. After David''s death Adonijah asked for Abishag to wife, and Solomon took the request as a claim to the kingdom and had him put to death.'
    - "Elisha, passing through, often ate at the house of a great woman of Shunem; she and her husband made him a little chamber on the wall with a bed, a table, a stool and a candlestick. Elisha promised her a son, and she bore one; when the child died, she rode to the prophet at Mount Carmel, and he came and raised him to life. Later, at Elisha's word, she sojourned seven years in the land of the Philistines during a famine, and on her return the king restored her house and her land. Some link the Shulamite of the Song of Solomon with Shunem, but this is uncertain."
    - "In the early fourth century Eusebius knew a village called Soulem five miles south of Mount Tabor. Small excavations in the village of Sulam have found pottery of the Bronze and Iron Ages and remains of the Roman and Byzantine periods."
  ru:
    - "Сонам отождествляют с селением Сулам у подножия холма, который сегодня называют Гиват-ха-Море, на северной стороне Изреельской долины, примерно в 5 км к северу от Изрееля, напротив горы Гелвуй по ту сторону равнины. В XIV веке до н. э. Биридия, правитель Мегиддо, писал фараону в одном из амарнских писем, что только он возделывает землю в Шунаме и поставляет людей на повинность; в другом письме вспоминается, что Лабайю из Сихема нападал на Шунаму. Город назван и в списках покорённых мест Тутмоса III и Сусакима в Карнаке."
    - "В книге Иисуса Навина Сонам лежит на границе Иссахара. Перед последней битвой Саула Филистимляне «пошли и стали станом в Сонаме», а Саул собрал весь народ Израильский на Гелвуе; Иосиф Флавий помещает их стан у города Сонама, на равнине. Когда царь Давид состарился, слуги искали красивой девицы во всех пределах Израильских и нашли Ависагу Сунамитянку, чтобы она прислуживала ему. После смерти Давида Адония просил Ависагу себе в жену, и Соломон счёл эту просьбу притязанием на царство и предал его смерти."
    - "Елисей, проходя мимо, часто ел хлеб в доме одной богатой женщины в Сонаме; она с мужем сделала ему небольшую горницу над стеною и поставила там постель, стол, седалище и светильник. Елисей обещал ей сына, и она родила его; когда ребёнок умер, она отправилась к пророку на гору Кармил, и он пришёл и воскресил его. Позже, по слову Елисея, она во время голода семь лет жила в земле Филистимской, а когда вернулась, царь возвратил ей дом и поле. Некоторые связывают Суламиту из Песни песней с Сонамом, но это не доказано."
    - "В начале IV века Евсевий знал селение Сулем в пяти милях к югу от горы Фавор. Небольшие раскопки в селении Сулам дали керамику бронзового и железного веков и остатки римского и византийского времени."
  uk:
    - "Сунем ототожнюють із селом Сулам, біля підніжжя пагорба, який нині зветься Гіват-га-Море, на північній стороні Їзреельської долини, приблизно за 5 км на північ від Їзреелю й навпроти гори Гільбоа через рівнину. У XIV ст. до н. е. Бірідія, володар Мегіддо, писав фараонові в одному з амарнських листів, що лише він обробляє землю в Шунамі та постачає людей на примусові роботи; в іншому листі нагадується, що Лабайу з Сихему напав на Шунаму. Місто також згадується в переліках підкорених місць Тутмоса III та Сусакіма в Карнаку."
    - "У книзі Ісуса Навина Сунем лежить на межі Іссахара. Перед останньою битвою Саула філістимляни «пійшли та й отаборились в Сонамі», тоді як Саул зібрав усього Ізраїля на Гільбоа; Йосиф Флавій розміщує їхній табір поблизу міста Сунем, на рівнині. Коли цар Давид постарів, його слуги шукали гарну дівчину по всьому Ізраїлю й знайшли Авісагу, сунамітянку, щоб вона йому прислужувала. Після смерті Давида Адонія попросив Авісагу собі за дружину, і Соломон сприйняв це прохання як претензію на царство та наказав його стратити."
    - "Єлисей, проходячи, часто їв у домі великої жінки з Сунема; вона з чоловіком зробила йому невелику кімнатку на стіні з ліжком, столом, стільцем і свічником. Єлисей пообіцяв їй сина, і вона його народила; коли дитина померла, вона поїхала до пророка на гору Кармель, і він прийшов і воскресив її. Пізніше, за словом Єлисея, вона сім років перебувала в країні філістимлян під час голоду, а після її повернення цар повернув їй дім і землю. Дехто пов'язує Суламіту з Пісні над піснями із Сунемом, але це непевно."
    - "На початку IV ст. Євсевій знав село Сулем за п'ять миль на південь від гори Фавор. Невеликі розкопки в селі Сулам виявили кераміку бронзового й залізного віків та залишки римської й візантійської доби."
  es:
    - "Sunem se identifica con la aldea de Sulam, al pie de la colina llamada hoy Givat HaMoré en el lado norte del valle de Jezreel, a unos 5 km al norte de Jezreel y frente al monte Gilboa al otro lado de la llanura. En el siglo XIV a. C. Biridiya, gobernante de Meguido, escribió al faraón en una de las cartas de Amarna que él solo cultivaba en Shunama y proporcionaba hombres para la corvea; otra carta recuerda que Lab'ayu de Siquem había atacado Shunama. La ciudad figura también en las listas de lugares conquistados de Tutmosis III y de Sisac en Karnak."
    - "En el libro de Josué Sunem está en la frontera de Isacar. Antes de la última batalla de Saúl los filisteos «vinieron y asentaron campo en Sunam», mientras Saúl reunía a todo Israel en Gilboa; Josefo sitúa su campamento cerca de la ciudad de Sunem, en la llanura. Cuando el rey David era viejo, sus siervos buscaron una moza hermosa por todo Israel y hallaron a Abisag la sunamita para que le sirviera. Tras la muerte de David, Adonías pidió a Abisag por mujer, y Salomón tomó la petición como una pretensión al reino y lo hizo ejecutar."
    - "Eliseo, de paso, comía a menudo en casa de una mujer principal de Sunem; ella y su marido le hicieron una pequeña cámara en la pared con cama, mesa, silla y candelero. Eliseo le prometió un hijo, y ella lo tuvo; cuando el niño murió, ella fue a caballo al profeta en el monte Carmelo, y él vino y lo devolvió a la vida. Más tarde, por palabra de Eliseo, ella residió siete años en la tierra de los filisteos durante una hambruna, y a su regreso el rey le devolvió su casa y su tierra. Algunos vinculan a la sulamita del Cantar de los Cantares con Sunem, pero esto es incierto."
    - "A principios del siglo IV Eusebio conocía una aldea llamada Soulem a cinco millas al sur del monte Tabor. Pequeñas excavaciones en la aldea de Sulam han hallado cerámica de las Edades del Bronce y del Hierro y restos de los períodos romano y bizantino."
  pt:
    - "Suném é identificada com a aldeia de Sulam, ao pé da colina hoje chamada Givat HaMoreh, no lado norte do vale de Jezreel, a cerca de 5 km ao norte de Jezreel e de frente para o Monte Gilboa, do outro lado da planície. No século XIV a.C., Biridiya, governante de Megido, escreveu ao faraó numa das cartas de Amarna que só ele cultivava em Shunama e fornecia homens para a corveia; outra carta recorda que Lab'ayu de Siquém atacara Shunama. A cidade aparece também nas listas de lugares conquistados por Tutmés III e por Sisaque em Karnak."
    - "No livro de Josué, Suném fica na fronteira de Issacar. Antes da última batalha de Saul, os filisteus “vieram e acamparam em Suném”, enquanto Saul reunia todo o Israel em Gilboa; Josefo põe o acampamento deles perto da cidade de Suném, na planície. Quando o rei Davi envelheceu, seus servos buscaram uma jovem bonita por todo o Israel e acharam Abisague, a sunamita, para servi-lo. Depois da morte de Davi, Adonias pediu Abisague por mulher, e Salomão tomou o pedido como reivindicação do reino e o mandou matar."
    - "Eliseu, de passagem, comia muitas vezes na casa de uma mulher importante de Suném; ela e o marido fizeram para ele um pequeno quarto no terraço, com cama, mesa, cadeira e candelabro. Eliseu lhe prometeu um filho, e ela o teve; quando o menino morreu, ela foi montada ao profeta no Monte Carmelo, e ele veio e o ressuscitou. Mais tarde, por palavra de Eliseu, ela viveu sete anos na terra dos filisteus durante uma fome, e na volta o rei lhe restituiu a casa e a terra. Alguns ligam a sulamita do Cântico dos Cânticos a Suném, mas isso é incerto."
    - "No início do século IV, Eusébio conhecia uma aldeia chamada Soulem a cinco milhas ao sul do Monte Tabor. Pequenas escavações na aldeia de Sulam acharam cerâmica das Idades do Bronze e do Ferro e restos dos períodos romano e bizantino."
  de:
    - "Schunem wird mit dem Dorf Sulam gleichgesetzt, am Fuß des heute Givat HaMore genannten Hügels an der Nordseite der Jesreel-Ebene, etwa 5 km nördlich von Jesreel und dem Gilboa über die Ebene hinweg gegenüber. Im 14. Jahrhundert v. Chr. schrieb Biridija, Herrscher von Megiddo, in einem der Amarna-Briefe an den Pharao, er allein bestelle in Schunama den Boden und stelle Männer für den Frondienst; ein anderer Brief erinnert, dass Lab'aju von Sichem Schunama angegriffen hatte. Die Stadt erscheint auch in den Listen eroberter Orte Tutmosis' III. und Schischaks in Karnak."
    - "Im Buch Josua liegt Schunem an der Grenze von Issachar. Vor Sauls letzter Schlacht „lagerten sich“ die Philister „zu Sunem“, während Saul ganz Israel „zu Gilboa“ versammelte; Josephus setzt ihr Lager nahe der Stadt Schunem in der Ebene an. Als König David alt war, suchten seine Diener „eine schöne Dirne im ganzen Gebiet Israels“ und fanden Abisag von Schunem, ihm zu dienen. Nach Davids Tod bat Adonija um Abisag zur Frau, und Salomo fasste die Bitte als Anspruch auf das Königtum auf und ließ ihn töten."
    - "Elisa kehrte auf seinen Wegen oft im Haus einer reichen Frau von Schunem ein und aß dort; sie und ihr Mann machten ihm eine kleine Kammer an der Mauer, mit „Bett, Tisch, Stuhl und Leuchter“. Elisa verhieß ihr einen Sohn, und sie gebar einen; als das Kind starb, ritt sie zum Propheten auf dem Karmel, und er kam und weckte es zum Leben. Später „wohnte“ sie auf Elisas Wort bei einer Hungersnot „in der Philister Land sieben Jahre“, und bei ihrer Rückkehr gab der König ihr Haus und Acker zurück. Manche verbinden die Schulammit des Hohelieds mit Schunem, doch das ist unsicher."
    - "Im frühen 4. Jahrhundert kannte Eusebius ein Dorf namens Soulem fünf Meilen südlich des Tabor. Kleine Grabungen im Dorf Sulam haben Keramik der Bronze- und Eisenzeit und Reste der römischen und byzantinischen Zeit gefunden."
  fr:
    - "Sunem est identifiée au village de Sulam, au pied de la colline appelée aujourd’hui Givat HaMoreh, sur le côté nord de la vallée de Jizreel, à environ 5 km au nord de Jizreel et face au mont Guilboa de l’autre côté de la plaine. Au XIVe siècle av. J.-C., Biridiya, souverain de Meguiddo, écrivit au pharaon dans l’une des lettres d’Amarna qu’il était seul à cultiver à Shunama et à fournir des hommes pour la corvée ; une autre lettre rappelle que Lab‘ayu de Sichem avait attaqué Shunama. La ville figure aussi dans les listes de lieux conquis de Thoutmosis III et de Schischak à Karnak."
    - "Dans le livre de Josué, Sunem se trouve sur la frontière d’Issacar. Avant la dernière bataille de Saül, les Philistins « vinrent camper à Sunem », tandis que Saül rassemblait tout Israël à Guilboa ; Flavius Josèphe place leur camp près de la ville de Sunem, dans la plaine. Quand le roi David fut vieux, ses serviteurs cherchèrent « dans tout le territoire d’Israël une fille jeune et belle » et trouvèrent Abischag, la Sunamite, pour le servir. Après la mort de David, Adonija demanda Abischag pour femme, et Salomon prit la demande pour une revendication du royaume et le fit mettre à mort."
    - "Élisée, de passage, mangeait souvent chez « une femme de distinction » de Sunem ; elle et son mari lui firent « une petite chambre haute avec des murs », avec « un lit, une table, un siège et un chandelier ». Élisée lui promit un fils, et elle en enfanta un ; quand l’enfant mourut, elle se rendit à cheval auprès du prophète au mont Carmel, et il vint et le ressuscita. Plus tard, sur la parole d’Élisée, elle « séjourna sept ans au pays des Philistins » pendant une famine, et à son retour le roi lui rendit sa maison et son champ. Certains rattachent la Sulamite du Cantique des cantiques à Sunem, mais c’est incertain."
    - "Au début du IVe siècle, Eusèbe connaissait un village appelé Soulem à cinq milles au sud du mont Thabor. De petites fouilles dans le village de Sulam ont trouvé de la céramique des âges du Bronze et du Fer et des vestiges des époques romaine et byzantine."
