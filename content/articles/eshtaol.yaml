# Overview article (ADR 0007). Mainstream facts only; the site is given as unfixed, with the app's three candidates named; no absolute dates are given for Samson or the Danite migration.
id: eshtaol
place: a355b6e
title:
  en: "Eshtaol"
  ru: "Естаол"
body:
  en:
    - "Eshtaol was a town of the Shephelah, the low hills between the mountains of Judah and the Philistine plain, about 24 km west of Jerusalem, always named with Zorah, its neighbour across the Sorek valley. Joshua lists it among the lowland towns of Judah and again in the inheritance of Dan, and the Chronicler derives the Eshtaulites, with the Zorathites, from the families of Kiriath-jearim. The site is not fixed. The Arab village of Ishwa, abandoned in 1948, kept the name, and the moshav Eshtaol founded in 1949 stands beside it; the record here follows those who prefer Khirbet Deir Shubeib, a ruin some 3 km to the west, and others have proposed Artuf, the later Hartuv, to the south. Eusebius in the fourth century knew Esthaol as a village of Dan about ten miles north of Eleutheropolis, on the road to Nicopolis."
    - "Eshtaol belongs to the story of Samson. The Spirit of the LORD “began to move him at times in the camp of Dan between Zorah and Eshtaol”, and when he had pulled down the house of Dagon at Gaza his brothers “buried him between Zorah and Eshtaol in the buryingplace of Manoah his father”. From Zorah and Eshtaol the Danites, pressed by the Amorites and the Philistines, sent “five men from their coasts, men of valour”, who lodged with Micah in Mount Ephraim and found Laish in the far north; “six hundred men appointed with weapons of war” followed them, took Micah's priest and image on the way, and made Laish their city Dan. Their first camp, Mahaneh-dan, was remembered behind Kiriath-jearim."
    - "Little else is recorded, and the identification rests on the name and on Eusebius' distances; Ishwa itself has not been excavated. Today the ground, in Israel's Judean foothills between Beit Shemesh and the Jerusalem road, is covered by the Eshtaol forest, planted from the 1950s, and a modern memorial tomb of Samson and Manoah stands on the hill of Tel Tzora across the valley."
  ru:
    - "Естаол был городом Шефелы, низких холмов между горами Иудеи и Филистимской равниной, примерно в 24 км к западу от Иерусалима, и всегда называется вместе с Цорой, своей соседкой через долину Сорек. Книга Иисуса Навина числит его среди городов низменности Иуды и снова в уделе Дана, а летописец выводит Ештаолян вместе с Цорянами от племён Кириаф-Иарима. Место не установлено. Арабская деревня Ишва, покинутая в 1948 г., хранила имя, и рядом с ней стоит мошав Эштаоль, основанный в 1949 г.; запись здесь следует тем, кто предпочитает Хирбет-Дейр-Шубейб, развалины примерно в 3 км к западу, а другие предлагали Артуф, позднейший Хартув, к югу. Евсевий в IV веке знал Естаол как селение Дана примерно в десяти милях к северу от Елевферополя, по дороге в Никополь."
    - "Естаол принадлежит истории Самсона. Здесь «начал Дух Господень действовать в нем в стане Дановом, между Цорою и Естаолом», а когда он обрушил дом Дагона в Газе, братья «похоронили его между Цорою и Естаолом, во гробе Маноя, отца его». Из Цоры и Естаола сыны Дановы, теснимые Аморреями и Филистимлянами, послали «пять человек, мужей сильных», которые ночевали у Михи на горе Ефремовой и нашли Лаис на далёком севере; за ними пошли «шестьсот мужей, препоясавшись воинским оружием», забрали по пути священника и истукан Михи и сделали Лаис своим городом Даном. Их первый стан, Махане-Дан, помнили позади Кириаф-Иарима."
    - "Больше почти ничего не известно, и отождествление держится на имени и на расстояниях Евсевия; сама Ишва не раскапывалась. Сегодня эти места в предгорьях Иудеи в Израиле, между Бейт-Шемешем и дорогой на Иерусалим, покрыты Эштаольским лесом, высаженным с 1950-х годов, а на холме Тель-Цора через долину стоит современная памятная гробница Самсона и Маноя."
