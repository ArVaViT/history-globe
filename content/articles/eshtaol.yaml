body:
  en:
    - "Eshtaol was a town of the Shephelah, the low hills between the mountains of Judah and the Philistine plain, about 24 km west of Jerusalem, always named with Zorah, its neighbour across the Sorek valley. Joshua lists it among the lowland towns of Judah and again in the inheritance of Dan, and the Chronicler derives the Eshtaulites, with the Zorathites, from the families of Kiriath-jearim. The site is not fixed. The Arab village of Ishwa, abandoned in 1948, kept the name, and the moshav Eshtaol founded in 1949 stands beside it; the record here follows those who prefer Khirbet Deir Shubeib, a ruin some 3 km to the west, and others have proposed Artuf, the later Hartuv, to the south. Eusebius in the fourth century knew Esthaol as a village of Dan about ten miles north of Eleutheropolis, on the road to Nicopolis."
    - "Eshtaol belongs to the story of Samson. The Spirit of the LORD “began to move him at times in the camp of Dan between Zorah and Eshtaol”, and when he had pulled down the house of Dagon at Gaza his brothers “buried him between Zorah and Eshtaol in the buryingplace of Manoah his father”. From Zorah and Eshtaol the Danites, pressed by the Amorites, sent “five men from their coasts, men of valour”, who lodged with Micah in Mount Ephraim and found Laish in the far north; “six hundred men appointed with weapons of war” followed them, took Micah's priest and image on the way, and made Laish their city Dan. Their first camp, Mahaneh-dan, was remembered behind Kiriath-jearim."
    - "Little else is recorded, and the identification rests on the name and on Eusebius' distances; Ishwa itself has not been excavated. Today the ground, in Israel's Judean foothills between Beit Shemesh and the Jerusalem road, is covered by the Eshtaol forest, planted from the 1950s, and a modern memorial tomb of Samson and Manoah stands on the hill of Tel Tzora across the valley."
  ru:
    - "Естаол был городом Шефелы, низких холмов между горами Иудеи и Филистимской равниной, примерно в 24 км к западу от Иерусалима, и всегда называется вместе с Цорой, своей соседкой через долину Сорек. Книга Иисуса Навина числит его среди городов низменности Иуды и снова в уделе Дана, а летописец выводит Ештаолян вместе с Цорянами от племён Кириаф-Иарима. Место не установлено. Арабская деревня Ишва, покинутая в 1948 г., хранила имя, и рядом с ней стоит мошав Эштаоль, основанный в 1949 г.; запись здесь следует тем, кто предпочитает Хирбет-Дейр-Шубейб, развалины примерно в 3 км к западу, а другие предлагали Артуф, позднейший Хартув, к югу. Евсевий в IV веке знал Естаол как селение Дана примерно в десяти милях к северу от Елевферополя, по дороге в Никополь."
    - "Естаол принадлежит истории Самсона. Здесь «начал Дух Господень действовать в нем в стане Дановом, между Цорою и Естаолом», а когда он обрушил дом Дагона в Газе, братья «похоронили его между Цорою и Естаолом, во гробе Маноя, отца его». Из Цоры и Естаола сыны Дановы, теснимые Аморреями, послали «пять человек, мужей сильных», которые ночевали у Михи на горе Ефремовой и нашли Лаис на далёком севере; за ними пошли «шестьсот мужей, препоясавшись воинским оружием», забрали по пути священника и истукан Михи и сделали Лаис своим городом Даном. Их первый стан, Махане-Дан, помнили позади Кириаф-Иарима."
    - "Больше почти ничего не известно, и отождествление держится на имени и на расстояниях Евсевия; сама Ишва не раскапывалась. Сегодня эти места в предгорьях Иудеи в Израиле, между Бейт-Шемешем и дорогой на Иерусалим, покрыты Эштаольским лесом, высаженным с 1950-х годов, а на холме Тель-Цора через долину стоит современная памятная гробница Самсона и Маноя."
  uk:
    - "Ештаол був містом Шефели, низьких гір між горами Юди та филистимською рівниною, приблизно за 24 км на захід від Єрусалима, завжди названим разом із Цорою, його сусідом через долину Сорек. Ісус Навин перелічує його серед низинних міст Юди і знову в уділі Дана, а літописець виводить ештаолян разом із цорянами з родин Кіріят-Єарима. Місце не встановлено. Арабське село Ішва, покинуте в 1948 р., зберегло назву, а мошав Ештаол, заснований у 1949 р., стоїть поряд; тут за основу взято тих, хто віддає перевагу Хірбет-Дейр-Шубейбу, руїнам приблизно за 3 км на захід, а інші пропонували Артуф, пізніший Хартув, на півдні. Євсевій у IV ст. знав Естаол як село Дана приблизно за десять миль на північ від Елевтерополя, на дорозі до Нікополя."
    - "Ештаол належить до історії Самсона. Дух Господній «почав … бути в ньому в таборі Дановому між Зореагом і Естаолом», а коли він повалив дім Дагона в Газі, його брати «поховали між Зореагою й Естаолом в батьківському гробовищі його батька Маноя». З Цори й Ештаола данити, затиснуті аморіями, послали «пятьох зʼугадних мужів», які зупинилися в Міхи на горі Єфремовій і знайшли Лаіш на далекій півночі; за ними пішли «шість сотень узброєних людей», узяли дорогою священника й ідола Міхи і зробили Лаіш своїм містом Дан. Їхній перший табір, Стан Данів, пам'ятали за Кіріят-Єарімом."
    - "Більше мало що записано, і ототожнення спирається на назву та на відстані Євсевія; сама Ішва не розкопана. Сьогодні земля, в передгір'ях Юдеї в Ізраїлі між Бейт-Шемешем і єрусалимською дорогою, вкрита лісом Ештаол, насадженим із 1950-х рр., а сучасна пам'ятна гробниця Самсона й Маноя стоїть на пагорбі Телль-Цора за долиною."
  es:
    - "Estaol era una ciudad de la Sefelá, las colinas bajas entre las montañas de Judá y la llanura filistea, a unos 24 km al oeste de Jerusalén, nombrada siempre con Zora, su vecina al otro lado del valle de Sorec. Josué la enumera entre las ciudades de la llanura de Judá y de nuevo en la heredad de Dan, y el cronista hace derivar a los estaolitas, con los soratitas, de las familias de Quiriat-jearim. El sitio no está fijado. La aldea árabe de Ishwa, abandonada en 1948, conservó el nombre, y el moshav Eshtaol, fundado en 1949, se alza junto a ella; el registro sigue aquí a quienes prefieren Khirbet Deir Shubeib, una ruina a unos 3 km al oeste, y otros han propuesto Artuf, la posterior Hartuv, al sur. Eusebio, en el siglo IV, conocía Esthaol como una aldea de Dan a unas diez millas al norte de Eleuterópolis, en el camino a Nicópolis."
    - "Estaol pertenece a la historia de Sansón. El espíritu del Señor «comenzó á manifestarse en él en los campamentos de Dan, entre Sora y Esthaol», y cuando derribó la casa de Dagón en Gaza, sus hermanos «le sepultaron entre Sora y Esthaol, en el sepulcro de su padre Manoa». De Zora y Estaol los danitas, presionados por los amorreos, enviaron «cinco hombres de sus términos, hombres valientes», que se alojaron con Micaías en el monte de Efraín y hallaron Lais en el extremo norte; «seiscientos hombres armados de armas de guerra» los siguieron, se llevaron por el camino al sacerdote y la imagen de Micaías, e hicieron de Lais su ciudad, Dan. Su primer campamento, Mahane-dan, se recordaba detrás de Quiriat-jearim."
    - "Poco más se registra, y la identificación se apoya en el nombre y en las distancias de Eusebio; la propia Ishwa no ha sido excavada. Hoy el terreno, en las estribaciones judeas de Israel entre Bet-semes y la carretera de Jerusalén, está cubierto por el bosque de Eshtaol, plantado desde la década de 1950, y una tumba conmemorativa moderna de Sansón y Manoa se alza en la colina de Tel Tzora, al otro lado del valle."
  pt:
    - "Estaol era uma cidade da Sefelá, as colinas baixas entre as montanhas de Judá e a planície filisteia, cerca de 24 km a oeste de Jerusalém, sempre nomeada com Zorá, sua vizinha do outro lado do vale de Soreque. Josué a lista entre as cidades da baixada de Judá e de novo na herança de Dã, e o cronista deriva os estaoleus, com os zorateus, das famílias de Quiriate-Jearim. O local não está fixado. A aldeia árabe de Ishwa, abandonada em 1948, conservou o nome, e o moshav Eshtaol, fundado em 1949, fica junto a ela; o registro aqui segue os que preferem Khirbet Deir Shubeib, uma ruína a cerca de 3 km a oeste, e outros propuseram Artuf, a posterior Hartuv, ao sul. Eusébio, no século IV, conhecia Esthaol como uma aldeia de Dã a cerca de dez milhas ao norte de Eleuterópolis, na estrada para Nicópolis."
    - "Estaol pertence à história de Sansão. O Espírito do SENHOR “começou a movê-lo em Maané-Dã, entre Zorá e Estaol”, e depois que ele derrubou a casa de Dagom em Gaza, seus irmãos “o sepultaram entre Zorá e Estaol, no túmulo de Manoá, seu pai”. De Zorá e Estaol os danitas, pressionados pelos amorreus, enviaram “cinco homens da sua família, dentre todos eles, homens valentes”, que se hospedaram com Mica no Monte Efraim e descobriram Laís no extremo norte; “seiscentos homens armados com armas de guerra” os seguiram, tomaram no caminho o sacerdote e a imagem de Mica, e fizeram de Laís a sua cidade, Dã. Seu primeiro acampamento, Maané-Dã, foi lembrado atrás de Quiriate-Jearim."
    - "Pouco mais é registrado, e a identificação repousa no nome e nas distâncias de Eusébio; a própria Ishwa não foi escavada. Hoje o terreno, nas colinas baixas da Judeia em Israel, entre Bete-Semes e a estrada de Jerusalém, é coberto pela floresta de Eshtaol, plantada a partir da década de 1950, e um túmulo memorial moderno de Sansão e Manoá se ergue na colina de Tel Tzora, do outro lado do vale."
  de:
    - "Eschtaol war eine Stadt der Schefela, der niedrigen Hügel zwischen dem Bergland Judas und der philistäischen Ebene, etwa 24 km westlich von Jerusalem, immer mit Zora genannt, seinem Nachbarn jenseits des Sorek-Tals. Josua führt es unter den Städten des Tieflands Judas und wieder im Erbteil Dans auf, und der Chronist leitet die Eschtauliter zusammen mit den Zoratitern von den Familien Kirjat-Jearims ab. Der Ort ist nicht festgelegt. Das arabische Dorf Ishwa, 1948 verlassen, bewahrte den Namen, und der 1949 gegründete Moschaw Eschtaol steht daneben; die Karte folgt denen, die Khirbet Deir Shubeib bevorzugen, eine Ruine etwa 3 km westlich, und andere haben Artuf, das spätere Hartuv, im Süden vorgeschlagen. Eusebius kannte im 4. Jahrhundert Esthaol als Dorf Dans etwa zehn Meilen nördlich von Eleutheropolis an der Straße nach Nikopolis."
    - "Eschtaol gehört zur Geschichte Simsons. Der Geist des HERRN „fing an, ihn zu treiben im Lager Dan zwischen Zora und Esthaol“, und als er das Haus Dagons in Gaza niedergerissen hatte, kamen seine Brüder herab, hoben ihn auf, trugen ihn hinauf „und begruben ihn in seines Vaters Manoahs Grab, zwischen Zora und Esthaol“. Von Zora und Eschtaol sandten die Daniten, von Amoritern bedrängt, „von ihren Enden fünf streitbare Männer“, die bei Micha im Gebirge Ephraim einkehrten und Lais im äußersten Norden fanden; „sechshundert Mann, gerüstet mit ihren Waffen zum Streit“, folgten ihnen, nahmen unterwegs Michas Priester und Bild mit und machten Lais zu ihrer Stadt Dan. Ihr erstes Lager, Mahane-Dan, blieb hinter Kirjat-Jearim in Erinnerung."
    - "Sonst ist wenig verzeichnet, und die Gleichsetzung beruht auf dem Namen und auf den Entfernungsangaben des Eusebius; Ishwa selbst ist nicht ausgegraben. Heute ist das Gelände im israelischen Vorland Judäas zwischen Bet Schemesch und der Jerusalemer Straße vom Eschtaol-Wald bedeckt, ab den 1950er Jahren gepflanzt, und ein moderner Gedenkbau für das Grab von Simson und Manoach steht auf dem Hügel Tel Zora jenseits des Tals."
  fr:
    - "Eschthaol était une ville de la Shéphéla, les basses collines entre les montagnes de Juda et la plaine philistine, à environ 24 km à l’ouest de Jérusalem, toujours nommée avec Tsorea, sa voisine de l’autre côté de la vallée de Sorek. Josué la range parmi les villes de la plaine de Juda et de nouveau dans l’héritage de Dan, et le Chroniqueur fait descendre les Eschthaolites, avec les Tsoréathites, des familles de Kirjath-Jearim. Le site n’est pas fixé. Le village arabe d’Ishwa, abandonné en 1948, a gardé le nom, et le moshav Eshtaol, fondé en 1949, se trouve à côté ; la notice suit ceux qui préfèrent Khirbet Deir Shubeib, ruine à quelque 3 km à l’ouest, et d’autres ont proposé Artuf, le Hartuv ultérieur, au sud. Eusèbe, au IVe siècle, connaissait Esthaol comme un village de Dan à environ dix milles au nord d’Éleuthéropolis, sur la route de Nicopolis."
    - "Eschthaol appartient à l’histoire de Samson. L’Esprit de l’Éternel « commença à l’agiter à Machané-Dan, entre Tsorea et Eschthaol », et quand il eut abattu la maison de Dagon à Gaza, ses frères « l’enterrèrent entre Tsorea et Eschthaol dans le sépulcre de Manoach, son père ». Les Danites, pressés par les Amoréens, prirent « cinq hommes vaillants, qu’ils envoyèrent de Tsorea et d’Eschthaol » ; ceux-ci logèrent chez Michée dans la Montagne d’Éphraïm et trouvèrent Laïsch dans l’extrême nord ; « six cents hommes de la famille de Dan partirent de Tsorea et d’Eschthaol, munis de leurs armes de guerre » à leur suite, prirent en chemin le prêtre et l’image de Michée, et firent de Laïsch leur ville de Dan. Leur premier camp, Machané-Dan, resta dans le souvenir derrière Kirjath-Jearim."
    - "On ne sait guère autre chose, et l’identification repose sur le nom et sur les distances d’Eusèbe ; Ishwa même n’a pas été fouillée. Aujourd’hui, le terrain, dans les contreforts judéens d’Israël entre Beit Shemesh et la route de Jérusalem, est couvert par la forêt d’Eshtaol, plantée à partir des années 1950, et un tombeau commémoratif moderne de Samson et de Manoach se dresse sur la colline de Tel Tzora, de l’autre côté de la vallée."
  it:
    - "Estaol era una città della Sefela, le basse colline fra i monti di Giuda e la pianura filistea, a circa 24 km a ovest di Gerusalemme, sempre nominata con Zorea, sua vicina al di là della valle del Sorek. Giosuè la elenca fra le città della pianura di Giuda e di nuovo nell’eredità di Dan, e il Cronista fa derivare gli Estaoliti, con gli Zoratiti, dalle famiglie di Kiriat-Iearim. Il sito non è fissato. Il villaggio arabo di Ishwa, abbandonato nel 1948, ne conservò il nome, e il moshav Eshtaol fondato nel 1949 sorge accanto; qui si segue chi preferisce Khirbet Deir Shubeib, una rovina a circa 3 km a ovest, e altri hanno proposto Artuf, la successiva Hartuv, a sud. Eusebio nel IV secolo conosceva Esthaol come un villaggio di Dan a circa dieci miglia a nord di Eleuteropoli, sulla strada per Nicopoli."
    - "Estaol appartiene alla storia di Sansone. Lo spirito del Signore «cominciò ad agitarlo quand’esso era a Mahaneh-Dan, fra Tsorea ed Eshtaol», e quando ebbe abbattuto il tempio di Dagon a Gaza i suoi fratelli «lo seppellirono fra Tsorea ed Eshtaol nel sepolcro di Manoah suo padre». Da Zorea ed Estaol i Daniti, incalzati dagli Amorei, mandarono «cinque uomini della loro tribù, presi di fra loro tutti, uomini valorosi», che alloggiarono presso Michea nel Monte Efraim e trovarono Lais nell’estremo nord; «seicento uomini … muniti d’armi» li seguirono, presero per via il sacerdote e l’immagine di Michea e fecero di Lais la loro città Dan. Il loro primo accampamento, Macane-Dan, era ricordato dietro Kiriat-Iearim."
    - "Poco altro è registrato, e l’identificazione poggia sul nome e sulle distanze di Eusebio; la stessa Ishwa non è stata scavata. Oggi il terreno, nelle colline pedemontane giudaiche d’Israele fra Beit Shemesh e la strada di Gerusalemme, è coperto dalla foresta di Estaol, piantata dagli anni 1950, e una moderna tomba commemorativa di Sansone e Manoach sorge sulla collina di Tel Tzora al di là della valle."
  pl:
    - "Esztaol było miastem w Szefeli, niskich wzgórzach między górami Judy a równiną filistyńską, około 24 km na zachód od Jerozolimy, zawsze wymienianym z Sora, jego sąsiadem po drugiej stronie doliny Sorek. Jozue wymienia je wśród miast nizinnych Judy i znów w dziedzictwie Dana, a Kronikarz wywodzi Esztaolitów, wraz z Soratytami, z rodów Kiriat-Jearim. Miejsce nie jest ustalone. Arabska wieś Iszwa, opuszczona w 1948 r., zachowała nazwę, a moszaw Esztaol założony w 1949 r. stoi obok niej; ten zapis idzie za tymi, którzy wolą Chirbet Dejr Szubejb, ruinę około 3 km na zachód, a inni proponowali Artuf, późniejszy Chartuw, na południu. Euzebiusz w IV w. znał Esthaol jako wieś Dana około dziesięć mil na północ od Eleuteropolis, przy drodze do Nikopolis."
    - "Esztaol należy do opowieści o Samsonie. „I począł go Duch Pański umacniać w obozie Dan między Saraa i między Estaol”, a gdy zburzył dom Dagona w Gazie, jego bracia „pogrzebli go między Saraa, i między Estaol, w grobie Manue, ojca jego”. Z Sora i Esztaol Danici, uciskani przez Amorytów, wysłali „pięciu mężów z granic swoich, mężów walecznych”, którzy zatrzymali się u Miki w Górach Efraima i znaleźli Lajisz na dalekiej północy; „sześć set mężów gotowych do boju” poszło za nimi, zabrało po drodze kapłana i posąg Miki i uczyniło z Lajisz swoje miasto Dan. Ich pierwszy obóz, Machane-Dan, wspominano za Kiriat-Jearim."
    - "Niewiele więcej zapisano, a utożsamienie opiera się na nazwie i odległościach Euzebiusza; sama Iszwa nie była badana wykopaliskami. Dziś teren, w judzkim podgórzu Izraela między Bet Szemesz a drogą jerozolimską, pokrywa las Esztaol, sadzony od lat pięćdziesiątych XX w., a nowoczesny grobowiec pamięci Samsona i Manoacha stoi na wzgórzu Tel Cora po drugiej stronie doliny."
  nl:
    - "Estaol was een stad van de Sefela, de lage heuvels tussen het bergland van Juda en de Filistijnse vlakte, zo'n 24 km ten westen van Jeruzalem, altijd genoemd met Zora, zijn buur aan de overkant van het Sorekdal. Jozua noemt haar onder de steden van het laagland van Juda en opnieuw in het erfdeel van Dan, en de Kroniekschrijver leidt de Estaolieten, met de Zorieten, af van de families van Kirjat-Jearim. De plaats is niet vastgesteld. Het Arabische dorp Ishwa, in 1948 verlaten, bewaarde de naam, en de moshav Eshtaol, in 1949 gesticht, ligt ernaast; dit overzicht volgt wie Khirbet Deir Shubeib verkiezen, een ruïne zo'n 3 km westwaarts, en anderen stelden Artuf voor, het latere Hartuv, in het zuiden. Eusebius kende in de 4e eeuw Esthaol als een dorp van Dan ongeveer tien mijl ten noorden van Eleutheropolis, aan de weg naar Nicopolis."
    - "Estaol hoort bij het verhaal van Simson. De Geest van de HEER “begon hem bij wijlen te drijven in het leger van Dan, tussen Zora en tussen Esthaol”, en toen hij het huis van Dagon te Gaza had omgetrokken, namen zijn broers hem mee en “begroeven hem tussen Zora en tussen Esthaol, in het graf van zijn vader Manoach”. Uit Zora en Estaol zonden de Danieten, door de Amorieten bedreigd, “vijf mannen uit hun einden, mannen, die strijdbaar waren”, die bij Micha in het bergland van Efraïm overnachtten en Lais in het hoge noorden vonden; “zeshonderd man, aangegord met krijgswapenen” volgden hen, namen onderweg Micha's priester en beeld mee en maakten Lais tot hun stad Dan. Hun eerste kamp, Machane-Dan, werd herinnerd achter Kirjat-Jearim."
    - "Verder is weinig opgetekend, en de identificatie berust op de naam en op Eusebius' afstanden; Ishwa zelf is niet opgegraven. Tegenwoordig is de grond, in Israëls Judese voorheuvels tussen Beit Shemesh en de weg naar Jeruzalem, bedekt door het Eshtaolbos, vanaf de jaren 1950 aangeplant, en een modern gedenkgraf van Simson en Manoach staat op de heuvel Tel Tzora aan de overkant van het dal."
  cs:
    - "Eštaol bylo město v Šefele, nízkých pahorcích mezi judskými horami a pelištejskou rovinou, asi 24 km západně od Jeruzaléma, vždy jmenované s Coreou, jeho sousedem přes údolí Sorek. Jozue je uvádí mezi nížinná města Judy a znovu v dědictví Danově a Letopisec odvozuje Eštaolské s Coreatci z rodů Kirjat-jearímu. Místo není určeno. Arabská vesnice Ishwa, opuštěná roku 1948, zachovala jméno a vedle ní stojí mošav Eshtaol založený roku 1949; zdejší záznam následuje ty, kdo dávají přednost Khirbet Deir Shubeib, zřícenině asi 3 km na západ, a jiní navrhli Artuf, pozdější Chartuv, na jihu. Eusebios ve 4. století znal Esthaol jako vesnici Danovu asi deset mil severně od Eleutheropole na cestě do Nikopole."
    - "Eštaol patří k příběhu Samsonovu. O Samsonovi se praví: „I počal ho Duch Hospodinův ponoukati v Mahane Dan, mezi Zaraha a Estaol“, a když zbořil dům Dagonův v Gaze, jeho bratři „pochovali jej mezi Zaraha a Estaol v hrobě Manue otce jeho“. Z Corey a Eštaolu poslali Danité, stísněni Amorejci, „pět mužů z končin svých, mužů silných“, kteří se ubytovali u Micheáše v Efrajimském pohoří a našli Lajiš na dalekém severu; „šest set mužů oděných v odění válečné“ je následovalo, vzalo cestou Micheášova kněze a rytinu a učinilo z Lajiše své město Dan. Jejich první tábor, Machane-dan, se připomínal za Kirjat-jearímem."
    - "Jinak se zaznamenává málo a ztotožnění spočívá na jménu a na Eusebiových vzdálenostech; Ishwa sama nebyla vykopána. Dnes je půda, v izraelském judském podhůří mezi Beit Shemesh a jeruzalémskou silnicí, pokryta lesem Eshtaol, vysazeným od 50. let, a moderní památná hrobka Samsona a Manóacha stojí na pahorku Tel Tzora přes údolí."
  sv:
    - "Eshtaol var en stad i Shefela, de låga bergen mellan Judas berg och filisteerslätten, omkring 24 km väster om Jerusalem, alltid nämnd med Sora, dess granne på andra sidan Sorekdalen. Josua förtecknar den bland Judas lågländsstäder och åter i Dans arvedel, och Krönikeboken härleder estaoliterna, med sorgatiterna, från Kirjat-Jearims släkter. Platsen är inte fastlagd. Den arabiska byn Ishwa, övergiven 1948, bevarade namnet, och moshaven Eshtaol grundad 1949 ligger intill; uppteckningen här följer dem som föredrar Khirbet Deir Shubeib, en ruin omkring 3 km åt väster, och andra har föreslagit Artuf, senare Hartuv, åt söder. Eusebios kände på 300-talet Esthaol som en by i Dan omkring tio romerska mil norr om Eleutheropolis, vid vägen till Nikopolis."
    - "Eshtaol hör till berättelsen om Simson. HERRENS Ande ”begynte att verka på honom, medan han var i Dans läger, mellan Sorga och Estaol”, och när han hade rivit ner Dagons hus i Gaza ”begrovo” hans bröder honom ”mellan Sorga och Estaol, i hans fader Manoas grav”. Från Sora och Eshtaol sände daniterna, trängda av amoréerna, ”fem män, uttagna bland dem, tappra män”, som övernattade hos Mika i Efraims bergsbygd och fann Lajish långt i norr; ”sex hundra man av daniternas släkt, omgjordade med vapen” följde efter dem, tog Mikas präst och bild på vägen och gjorde Lajish till sin stad Dan. Deras första läger, Mahane-Dan, ihågkoms bakom Kirjat-Jearim."
    - "Litet mer är upptecknat, och identifieringen vilar på namnet och på Eusebios avstånd; Ishwa självt har inte grävts ut. I dag täcks marken, i Israels judeiska förberg mellan Beit Shemesh och Jerusalemvägen, av Eshtaolskogen, planterad från 1950-talet, och en modern minnesgrav över Simson och Manoach står på kullen Tel Tzora tvärs över dalen."
  nb:
    - "Esjtaol var en by i Sjefela, de lave åsene mellom Judas fjell og filistersletten, omtrent 24 km vest for Jerusalem, alltid nevnt sammen med Sora, dens nabo på den andre siden av Sorek-dalen. Josva fører den opp blant Judas lavlandsbyer og igjen i Dans arv, og Krønikeren utleder esjtaolittene, sammen med soratittene, fra Kirjat-Jearims slekter. Stedet er ikke fastlagt. Den arabiske landsbyen Ishwa, forlatt i 1948, bevarte navnet, og moshaven Esjtaol, grunnlagt i 1949, står ved siden av; oppføringen her følger dem som foretrekker Khirbet Deir Shubeib, en ruin omkring 3 km mot vest, og andre har foreslått Artuf, det senere Hartuv, mot sør. Eusebius kjente på 300-tallet Esthaol som en landsby i Dan omtrent ti romerske mil nord for Eleutheropolis, på veien til Nikopolis."
    - "Esjtaol hører til historien om Samson. Herrens Ånd «begynte å drive ham, mens han var i Dans leir mellem Sora og Estaol», og da han hadde revet ned Dagons hus i Gasa, hans brødre «førte ham hjem og la ham i Manoahs, hans fars grav mellem Sora og Estaol». Fra Sora og Esjtaol sendte danittene, trengt av amorittene, ut «fem menn av hele sin ætt, djerve menn», som overnattet hos Mika på Efraim-fjellet og fant Lajisj langt i nord; «seks hundre menn av danittenes ætt fullt væbnet» fulgte dem, tok Mikas prest og bilde på veien, og gjorde Lajisj til sin by Dan. Deres første leir, Mahane-Dan, ble husket bak Kirjat-Jearim."
    - "Lite annet er opptegnet, og identifiseringen hviler på navnet og på Eusebius' avstander; selve Ishwa er ikke gravd ut. I dag er området, i Israels judeiske forland mellom Beit Shemesh og Jerusalem-veien, dekket av Esjtaol-skogen, plantet fra 1950-tallet, og en moderne minnegrav for Samson og Manoah står på høyden Tel Tzora på den andre siden av dalen."
  tl:
    - "Ang Estaol ay isang bayan ng Sephela, ang mababang burol sa pagitan ng mga bundok ng Juda at ng kapatagang Filisteo, mga 24 km sa kanluran ng Jerusalem, laging kasama ng Sora, ang kapitbahay nito sa kabila ng libis ng Sorec. Inililista ito ni Josue sa mga bayan sa mababang lupain ng Juda at muli sa mana ni Dan, at hinahango ng Cronista ang mga Estaolita, kasama ang mga Soratita, sa mga pamilya ng Kiriath-jearim. Hindi natitiyak ang pook. Ang nayong Arabe na Ishwa, na iniwan noong 1948, ay nagpanatili ng pangalan, at ang moshav na Eshtaol na itinatag noong 1949 ay nasa tabi nito; sinusunod dito ang pumipili sa Khirbet Deir Shubeib, guho mga 3 km sa kanluran, at iminungkahi ng iba ang Artuf, ang huling Hartuv, sa timog. Noong ika-4 na siglo, kilala ni Eusebio ang Esthaol bilang nayon ni Dan mga sampung milya sa hilaga ng Eleutheropolis, sa daan patungong Nicopolis."
    - "Kabilang ang Estaol sa kuwento ni Samson. “Pinasimulang kinilos siya ng Espiritu ng Panginoon sa Mahanedan, sa pagitan ng Sora at Esthaol”, at nang ibagsak niya ang bahay ni Dagon sa Gaza, “inilibing siya sa pagitan ng Sora at Esthaol sa libingan ni Manoa na kaniyang ama” ng kaniyang mga kapatid. Mula Sora at Estaol, ang mga Danita, na pinipilit ng mga Amorreo, ay nagsugo ng “limang lalake ng kanilang angkan … ng mga lalaking may tapang”, na tumuloy kay Mikas sa Bundok Ephraim at nakatagpo ng Lais sa malayong hilaga; sumunod ang “anim na raang lalake na may sandata ng mga kasakbatan na pangdigma”, kinuha ang saserdote at larawan ni Mikas sa daan, at ginawang lungsod nilang Dan ang Lais. Ang una nilang kampo, ang Mahanedan, ay naaalala sa likod ng Kiriath-jearim."
    - "Kaunti pa ang nakatala, at nakasalalay ang pagkilala sa pangalan at sa mga layo ni Eusebio; hindi pa nahuhukay ang Ishwa mismo. Ngayon, ang lupain, sa mga paanan ng Judea ng Israel sa pagitan ng Beit Shemesh at ng daan ng Jerusalem, ay natatakpan ng kagubatan ng Eshtaol, na itinanim mula dekada 1950, at isang makabagong libingang pang-alaala nina Samson at Manoa ay nakatayo sa burol ng Tel Tzora sa kabila ng libis."
  da:
    - "Esjtaol var en by i Sjefela, de lave bakker mellem Judas bjerge og den filistæiske slette, cirka 24 km vest for Jerusalem, altid nævnt sammen med Zora, dens nabo på den anden side af Sorek-dalen. Josva opregner den blandt Judas lavlandsbyer og igen i Dans arv, og Krønikeren udleder esjtaolitterne, sammen med zoratitterne, af Kirjat-Jearims slægter. Stedet er ikke fastlagt. Den arabiske landsby Ishwa, forladt i 1948, bevarede navnet, og moshaven Esjtaol, grundlagt i 1949, ligger ved siden af; fremstillingen her følger dem, der foretrækker Khirbet Deir Shubeib, en ruin cirka 3 km mod vest, og andre har foreslået Artuf, det senere Hartuv, mod syd. Eusebios kendte i 300-tallet Esthaol som en landsby i Dan cirka ti romerske mil nord for Eleutheropolis, på vejen til Nikopolis."
    - "Esjtaol hører til Samsons historie. Herrens ånd »begyndte at drive ham i Dans Lejr imellem Zora og Esthaol«, og da han havde revet Dagons hus ned i Gaza, »begravede« hans brødre ham »imellem Zora og Esthaol, hans Fader Manoas Grav«. Fra Zora og Esthaol sendte daniterne, trængt af amoritterne, »fem Mænd af deres hele Tal, stridbare Mænd«, som overnattede hos Mika i Efraims Bjergland og fandt Laisj i det fjerne nord; »seks Hundrede Mænd omgjordede med Krigsvaaben« fulgte efter dem, tog Mikas præst og billede på vejen og gjorde Laisj til deres by Dan. Deres første lejr, Mahane-Dan, blev husket bag Kirjat-Jearim."
    - "Der er ellers lidt optegnet, og identifikationen hviler på navnet og på Eusebios' afstande; Ishwa selv er ikke udgravet. I dag er området, i Israels judæiske forbjerge mellem Beit Shemesh og Jerusalem-vejen, dækket af Esjtaol-skoven, plantet fra 1950'erne, og en moderne mindegrav for Samson og Manoa står på højen Tel Tzora på den anden side af dalen."
  sr:
    - "Естаол је био град Сефеле, ниских брда између планина Јудиних и филистејске равнице, око 24 км западно од Јерусалима, увек наведен са Сарајом, својим суседом преко долине Сорек. Исус Навин га наводи међу градовима низије Јудине и поново у наследству Данову, а Летописац изводи Естаољане, са Сараћанима, из породица Киријат-Јарима. Место није утврђено. Арапско село Ишва, напуштено 1948, сачувало је име, а мошав Естаол основан 1949. стоји поред њега; овде се следе они који дају предност Хирбет Дејр Шубејбу, рушевини неких 3 км западно, а други су предложили Артуф, каснији Хартув, на југу. Јевсевије је у 4. веку знао Естаол као село Данове око десет миља северно од Елевтерополиса, на путу за Никопољ."
    - "Естаол припада причи о Самсону. Дух Господњи „поче ходити с њим по логору Дановом, између Сараје и Естаола“, а када је срушио Дагонову кућу у Гази, његова браћа „погребоше га између Сараје и Естола у гробу Маноја оца његовог“. Из Сараје и Естаола Дановци, притешњавани од Амореја, послали су „пет људи између себе, храбре људе од Сараје и Естаола“, који су заноћили код Михе у гори Јефремовој и нашли Лаис далеко на северу; следило их је „шест стотина људи од породице Данове наоружаних“, узели су успут Михиног свештеника и лик и од Лаиса начинили свој град Дан. Њихов први логор, Дан-Маханије, памтио се иза Киријат-Јарима."
    - "Мало шта друго је забележено, а поистовећивање почива на имену и Јевсевијевим удаљеностима; сама Ишва није ископавана. Данас је тло, у израелском јудејском подгорју између Бет Шемеша и јерусалимског пута, покривено шумом Естаол, засађеном од 1950-их, а савремена спомен-гробница Самсона и Маноја стоји на брду Тел Цора преко долине."
  hu:
    - "Estaól a Sefélában, a júdai hegyek és a filiszteus síkság közötti alacsony dombokon fekvő város volt, Jeruzsálemtől mintegy 24 km-re nyugatra, mindig Corával együtt említve, a Szórek-völgy túloldali szomszédjával. Józsué a júdai alföldi városok között sorolja fel, és ismét Dán örökségében, a Krónikák írója pedig az estaóliakat, a coraiakkal együtt, Kirját-Jeárim családjaiból származtatja. A hely nem rögzített. A nevet az 1948-ban elhagyott arab Ishwa falu őrizte meg, mellette áll az 1949-ben alapított Estaól mosáv; a jelen feljegyzés azokat követi, akik a nyugatra mintegy 3 km-re lévő Khirbet Deir Shubeibet részesítik előnyben, mások a délre fekvő Artufot, a későbbi Hartuvot javasolták. Eusebius a 4. században Esthaolt Dán falujaként ismerte, Eleutheropolistól mintegy tíz mérföldre északra, a Nikopolisz felé vezető úton."
    - "Estaól Sámson történetéhez tartozik. Az Úr lelke „kezdé … indítani a Dán táborában, Czóra és Estháol között”, és amikor Gázában ledöntötte Dágon házát, testvérei „eltemették Czóra és Estháol között, atyjának, Manoahnak sírjába”. Córáról és Estaólból a danitak, az emoreusoktól szorongatva, „öt férfiút, vitéz férfiakat a magok határaikból” küldtek, akik Mikeásnál szálltak meg Efraim hegyvidékén, és megtalálták Laist messze északon; „hatszáz férfiú hadiszerszámokkal felkészülten” követte őket, útközben elvitték Mikeás papját és képét, és Laisból Dán városát csinálták. Első táboruk, Mahane-Dán, Kirját-Jeárim mögött maradt emlékezetben."
    - "Másról nemigen szól a feljegyzés, és az azonosítás a néven és Eusebius távolságain nyugszik; Ishwát magát nem ásták. A terület ma, Izrael júdeai dombvidékén Bét-Semes és a jeruzsálemi út között, az 1950-es évektől ültetett Estaól-erdővel borított, és Sámson és Mánoah modern emlékművű sírja a völgy túloldalán, a Tel Tzora dombon áll."
  fi:
    - "Estaol oli Sefelan kaupunki, matalilla kukkuloilla Juudan vuoriston ja filistealaisen tasangon välillä, noin 24 km Jerusalemista länteen, aina mainittu Soran kanssa, sen naapurin Sorekin laakson toisella puolella. Joosua luettelee sen Juudan alankokaupunkien joukossa ja uudelleen Danin perintöosassa, ja kronikoitsija johtaa estaolilaiset, soralaisten ohella, Kirjat-Jearimin suvuista. Paikkaa ei ole varmistettu. Arabikylä Ishwa, hylätty vuonna 1948, säilytti nimen, ja vuonna 1949 perustettu Eshtaolin moshav sijaitsee sen vieressä; tämä merkintä seuraa niitä, jotka pitävät parempana Khirbet Deir Shubeibia, noin 3 km länteen sijaitsevaa rauniota, ja toiset ovat ehdottaneet Artufia, myöhempää Hartuvia, etelässä. Eusebios tunsi 300-luvulla Esthaolin Danin kylänä noin kymmenen mailin päässä Eleutheropolisista pohjoiseen, Nikopolisiin johtavan tien varrella."
    - "Estaol kuuluu Simsonin tarinaan. Herran henki ”alkoi hänessä vaikuttaa Daanin leirissä, Soran ja Estaolin välillä”, ja kun hän oli kaatanut Dagonin temppelin Gazassa, hänen veljensä ”hautasivat hänet Soran ja Estaolin välille, hänen isänsä Maanoahin hautaan”. Soran ja Estaolin daanilaiset, amorilaisten ahdistamina, lähettivät ”viisi miestä, sotakuntoisia miehiä Sorasta ja Estaolista”, jotka yöpyivät Miikan luona Efraimin vuoristossa ja löysivät Laisin kaukaa pohjoisesta; ”kuusisataa sota-aseilla varustettua miestä” seurasi heitä, otti Miikan papin ja kuvan mukaansa matkalla ja teki Laisista kaupunkinsa Danin. Heidän ensimmäinen leirinsä, Mahane-Dan, muistettiin Kirjat-Jearimin takana."
    - "Muuta ei ole kirjattu, ja tunnistus perustuu nimeen ja Eusebioksen etäisyyksiin; Ishwaa itseään ei ole kaivettu. Nykyisin maa, Israelin Juudean kukkuloiden juurella Beit Shemeshin ja Jerusalemin tien välissä, on 1950-luvulta istutetun Estaolin metsän peitossa, ja Simsonin ja Maanoahin moderni muistohauta seisoo Tel Tzoran kukkulalla laakson toisella puolella."
  vi:
    - "Ê-ta-ôn là một thành của Sê-phê-la, các ngọn đồi thấp giữa núi Giu-đa và đồng bằng Phi-li-tin, cách Giê-ru-sa-lem khoảng 24 km về phía tây, luôn được nêu cùng Xô-rê-a, láng giềng của nó bên kia thung lũng Sorek. Giô-suê liệt kê nó trong các thành vùng thấp của Giu-đa và lần nữa trong cơ nghiệp của Đan, và sử gia sách Sử Ký cho người Ê-ta-ôn, cùng người Xô-rê-a, bắt nguồn từ các gia tộc của Ki-ri-át-Giê-a-rim. Địa điểm chưa được xác định. Làng Ả Rập Ishwa, bị bỏ năm 1948, giữ tên, và moshav Eshtaol lập năm 1949 đứng cạnh nó; ghi chép ở đây theo những người ưa Khirbet Deir Shubeib, một phế tích cách khoảng 3 km về phía tây, và những người khác đã đề nghị Artuf, Hartuv về sau, ở phía nam. Eusebius vào thế kỷ 4 biết Esthaol là một làng của Đan cách Eleutheropolis khoảng mười dặm về phía bắc, trên đường đến Nicopolis."
    - "Ê-ta-ôn thuộc về câu chuyện Sam-sôn. Thần Đức Giê-hô-va “khởi cảm động người tại trong dinh Đan, giữa khoảng Xô-rê-a và Ê-ta-ôn”, và khi ông kéo đổ đền Đa-gôn ở Ga-xa, anh em ông “chôn tại giữa Xô-rê-a và Ê-ta-ôn, trong mộ của Ma-nô-a, cha người”. Từ Xô-rê-a và Ê-ta-ôn, người Đan, bị người A-mô-rít ép, “chọn trong chi phái mình năm người mạnh dạn”, họ trọ nhà Mi-chê ở Núi Ép-ra-im và tìm thấy La-ít ở cực bắc; “sáu trăm người về dòng Đan cầm binh khí” theo sau, trên đường bắt thầy tế lễ và tượng của Mi-chê, và biến La-ít thành thành Đan của họ. Trại đầu tiên của họ, Trại Đan, được nhớ ở phía sau Ki-ri-át-Giê-a-rim."
    - "Ít được ghi chép thêm, và sự đồng nhất dựa vào tên và vào các khoảng cách của Eusebius; bản thân Ishwa chưa được khai quật. Ngày nay vùng đất, trong chân đồi Giu-đê của Israel giữa Beit Shemesh và con đường Giê-ru-sa-lem, được phủ bởi rừng Eshtaol, trồng từ những năm 1950, và một ngôi mộ tưởng niệm hiện đại của Sam-sôn và Ma-nô-a đứng trên đồi Tel Tzora bên kia thung lũng."
  ro:
    - "Eștaol era o cetate din Șefela, dealurile joase dintre munții lui Iuda și câmpia filisteană, la circa 24 km vest de Ierusalim, numită mereu împreună cu Țorea, vecina ei de peste valea Sorek. Iosua o înșiră printre cetățile din câmpie ale lui Iuda și din nou în moștenirea lui Dan, iar Cronicarul îi face pe eștaulieni, împreună cu țoreațiții, să coboare din familiile din Chiriat-Iearim. Locul nu este fixat. Satul arab Ishwa, părăsit în 1948, a păstrat numele, iar moșavul Eștaol, întemeiat în 1949, stă lângă el; înregistrarea de aici urmează pe cei care preferă Khirbet Deir Shubeib, o ruină la vreo 3 km spre vest, iar alții au propus Artuf, mai târziu Hartuv, la sud. Eusebiu, în secolul al IV-lea, cunoștea Esthaol ca pe un sat al lui Dan la circa zece mile nord de Eleuteropole, pe drumul spre Nicopole."
    - "Eștaol aparține istoriei lui Samson. Despre Samson se spune că „a început Duhul Domnului a petrece împreună cu el în tabăra lui Dan între Saraa și între Estaol”, iar când a dărâmat casa lui Dagon la Gaza, frații lui l-au îngropat între Țorea și Eștaol, în mormântul lui Manoah, tatăl lui. Din Țorea și Eștaol, daniții, strâmtorați de amoriți, au trimis „cinci bărbați despre partea lor foarte tari”, care au găzduit la Mica în Muntele lui Efraim și au găsit Laiș în îndepărtatul nord; „șase sute de bărbați încinși cu unelte de răsboiu” i-au urmat, au luat pe drum preotul și chipul lui Mica și au făcut din Laiș cetatea lor Dan. Prima lor tabără, Mahane-Dan, era pomenită în spatele Chiriat-Iearimului."
    - "Puțin altceva este consemnat, iar identificarea se sprijină pe nume și pe distanțele lui Eusebiu; Ishwa însuși nu a fost săpat. Astăzi terenul, în poalele iudeene ale Israelului dintre Beit Shemesh și drumul Ierusalimului, este acoperit de pădurea Eștaol, plantată din anii 1950, iar un mormânt memorial modern al lui Samson și Manoah stă pe dealul Tel Tzora de peste vale."
  bg:
    - "Ещаол бил град в Шефела, ниските хълмове между Юдейските планини и Филистимската равнина, на около 24 км западно от Йерусалим, винаги назоваван заедно с Цора, неговата съседка отвъд долината Сорек. Книгата Иисус Навин го изброява сред низинните градове на Юда и отново в наследието на Дан, а Летописецът извежда ещаолците заедно с цорейците от родовете на Кириат-Ярим. Мястото не е установено. Арабското село Ишва, изоставено през 1948 г., пазело името, а мошавът Ещаол, основан през 1949 г., стои до него; записът тук следва онези, които предпочитат Хирбет Дейр Шубейб, руина на около 3 км на запад, а други са предлагали Артуф, по-късния Хартув, на юг. Евсевий през IV в. познавал Естаол като село на Дан на около десет мили северно от Елевтеропол, по пътя за Никопол."
    - "Ещаол принадлежи на историята на Самсон. „Дух Господен начна да го подбужда в Дановия стан между Сарая и Естаол“, а когато съборил дома на Дагон в Газа, братята му го „погребаха между Сарая и Естаол, в гроба на отца му Маноя“. От Цора и Ещаол данците, притеснени от аморейците, изпратили „пет мъже от пределите си, силни мъже“, които пренощували у Миха в Ефремовата планина и намерили Лаиш на далечния север; „шестстотин мъже препасани с воински оръжия“ ги последвали, взели по пътя свещеника и истукана на Миха и направили Лаиш свой град Дан. Първият им стан, Стан Данов, се помнел зад Кириат-Ярим."
    - "Малко друго е записано, а отъждествяването почива на името и на разстоянията у Евсевий; самата Ишва не е разкопавана. Днес земята, в Юдейските предпланини в Израил между Бейт Шемеш и пътя за Йерусалим, е покрита от Ещаолската гора, засадена от 50-те години на XX в., а на хълма Тел Цора отвъд долината стои съвременна паметна гробница на Самсон и Маной."
