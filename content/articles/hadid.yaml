# Overview article (ADR 0007). Mainstream facts only; the Assyrian tablets are reported as their editors read them; Maccabean and Roman notices follow 1 Maccabees and Josephus.
id: hadid
place: a044272
title:
  en: "Hadid"
  ru: "Хадид"
  uk: "Хадід"
  es: "Hadid"
  pt: "Hadide"
  de: "Hadid"
  fr: "Hadid"
body:
  en:
    - "Hadid was a town at the edge of the coastal plain about 6 km east of Lod, on a hill beside the road that climbs from Lod toward Beth-horon and Jerusalem. The site is Tel Hadid, by the Arab village of el-Haditha that kept the name until 1948. The Bible knows it only after the exile. In the roll of those who returned from Babylon are “The children of Lod, Hadid, and Ono, seven hundred twenty and five”, 721 in Nehemiah's copy of the list, and among the places where the Benjaminites settled in Nehemiah's day are “Hadid, Zeboim, Neballat, Lod, and Ono, the valley of craftsmen”. Earlier books do not name the town, but two cuneiform tablets found at Tel Hadid, Assyrian deeds of sale of about 700 BC and after, bear Babylonian and Aramean names and show that the Assyrians settled deportees from Mesopotamia here, in the province of Samaria, as Kings says they did."
    - "In Greek the town is Adida. Simon Maccabeus built Adida in the Shephelah and fortified it with gates and bars against Tryphon about 143 BC, and camped there when Tryphon marched on Judea; in AD 68 Vespasian put a garrison at Adida, with Jericho, to close the roads to Jerusalem. The Mishnah counts Hadid among the towns walled since the days of Joshua, and Eusebius knew Adatha as a village east of Diospolis, that is Lod. Salvage excavations in 1995–1997 and the expedition of Tel Aviv University and the New Orleans Baptist Theological Seminary since 2018 have found remains from the Bronze Age to the Islamic period on the mound."
    - "Tel Hadid rises today on the edge of the Ben Shemen forest, beside the moshav of Hadid founded in 1949, with the plain of Lod and Ben Gurion airport spread out below it."
  ru:
    - "Хадид был городом на краю приморской равнины примерно в 6 км к востоку от Лода, на холме, где равнина встречает первые склоны гор, у дороги, поднимающейся от Лода к Вефорону и Иерусалиму. Это Тель-Хадид у арабской деревни Эль-Хадита, сохранявшей имя до 1948 года. Библия знает его только после плена. В перечне вернувшихся из Вавилона стоят «уроженцев Лидды, Хадида и Оно семьсот двадцать пять», в списке Неемии — семьсот двадцать один, а среди мест, где во дни Неемии жили Вениамитяне, названы «Хадиде, Цевоиме, Неваллате, Лоде, Оно, в долине Харашиме». В более ранних книгах город не назван, но две клинописные таблички, найденные на Тель-Хадиде, купчие на ассирийском языке около 700 г. до н. э. и позже, несут вавилонские и арамейские имена и показывают, что ассирийцы селили здесь, в провинции Самария, переселенцев из Месопотамии, как и говорит книга Царств."
    - "По-гречески город зовётся Адида. Симон Маккавей построил Адиду в Шефеле и укрепил её воротами и запорами против Трифона около 143 г. до н. э., и стоял там станом, когда Трифон шёл на Иудею; в 68 г. н. э. Веспасиан поставил в Адиде, как и в Иерихоне, гарнизон, чтобы закрыть дороги на Иерусалим. Мишна считает Хадид среди городов, обнесённых стеной со дней Иисуса Навина, а Евсевий знал Адафу как селение к востоку от Диосполя, то есть Лода. Охранные раскопки 1995–1997 годов и экспедиция Тель-Авивского университета и Баптистской богословской семинарии Нового Орлеана с 2018 года нашли на холме остатки от бронзового века до исламского времени."
    - "Тель-Хадид поднимается сегодня на краю леса Бен-Шемен, рядом с мошавом Хадид, основанным в 1949 году, а внизу расстилается равнина Лода с аэропортом Бен-Гурион."
  uk:
    - "Хадід було містом на краю прибережної рівнини приблизно за 6 км на схід від Лідди, на пагорбі біля дороги, що піднімається від Лідди до Бет-Хорона та Єрусалима. Місце — Тель-Хадід, поряд з арабським селом ель-Хадіта, що зберігало назву до 1948 року. Біблія знає його лише після вигнання. У переліку тих, хто повернувся з Вавилона, є «Що родом з Лидди, Хадида та Оно, сїмсот двайцять пять», а в списку Неемії — 721; серед місць, де за Неемії оселилися веніяминці: «Хадидї, Зевоїмі, Неваллатї, Лодї, Оно, в долинї Харашимі». Давніші книги міста не називають, але дві клинописні таблички, знайдені в Тель-Хадіді, — ассирійські купчі близько 700 р. до н. е. і пізніші, — мають вавилонські й арамейські імена й показують, що ассирійці оселяли тут депортованих із Месопотамії, в провінції Самарія, як і кажуть Книги Царів."
    - "Грецькою місто — Адіда. Симон Макавей збудував Адіду в Шефелі й укріпив її брамами та засувами проти Трифона близько 143 р. до н. е., і отаборився там, коли Трифон рушив на Юдею; 68 р. н. е. Веспасіан поставив в Адіді залогу, разом з Єрихоном, щоб перекрити дороги до Єрусалима. Мішна зараховує Хадід до міст, обнесених мурами від днів Ісуса Навина, а Євсевій знав Адату як село на схід від Діосполя, тобто Лідди. Рятівні розкопки 1995–1997 років та експедиція Тель-Авівського університету й Новоорлеанської баптистської богословської семінарії від 2018 року знайшли на городищі рештки від бронзового віку до ісламського періоду."
    - "Тель-Хадід здіймається нині на краю лісу Бен-Шемен, поряд з мошавом Хадід, заснованим 1949 року, а рівнина Лідди й аеропорт Бен-Гуріон розкинулися під ним."
  es:
    - "Hadid era una población en el borde de la llanura costera, a unos 6 km al este de Lida, sobre una colina junto al camino de Lida a Bet-horón y Jerusalén. El sitio es Tel Hadid, junto a la aldea árabe el-Haditha, que conservó el nombre hasta 1948. La Biblia la conoce solo después del destierro. Entre los que volvieron de Babilonia figuran «Los hijos de Lod, Hadid, y Ono, setecientos veinte y cinco», 721 en la copia de Nehemías, y entre los lugares donde habitaron los benjaminitas en tiempos de Nehemías están «Hadid, Seboim, Neballath; Lod, y Ono, valle de los artífices». Los libros anteriores no la nombran, pero dos tablillas cuneiformes de Tel Hadid, escrituras de venta asirias de hacia el 700 a. C. y posteriores, llevan nombres babilonios y arameos y muestran que los asirios asentaron aquí, en la provincia de Samaria, a deportados de Mesopotamia, como dice Reyes."
    - "En griego la población es Adida. Simón Macabeo edificó Adida en la Sefelá y la fortificó con puertas y cerrojos contra Trifón hacia el 143 a. C., y acampó allí cuando Trifón marchó sobre Judea; en el 68 d. C. Vespasiano puso una guarnición en Adida, con Jericó, para cerrar los caminos a Jerusalén. La Misná cuenta a Hadid entre las ciudades amuralladas desde los días de Josué, y Eusebio conoció Adatha como una aldea al este de Diospolis, es decir, Lida. Las excavaciones de salvamento de 1995–1997 y la expedición de la Universidad de Tel Aviv y el Seminario Teológico Bautista de Nueva Orleans desde 2018 han hallado en el montículo restos que van de la Edad del Bronce a la época islámica."
    - "Tel Hadid se alza hoy en el borde del bosque de Ben Shemen, junto al moshav de Hadid fundado en 1949, con la llanura de Lida y el aeropuerto Ben Gurión extendidos a sus pies."
  pt:
    - "Hadide era uma cidade na orla da planície costeira, a cerca de 6 km a leste de Lode, numa colina junto à estrada que sobe de Lode em direção a Bete-Horom e Jerusalém. O sítio é Tel Hadid, junto à aldeia árabe de el-Haditha, que guardou o nome até 1948. A Bíblia só a conhece depois do exílio. No rol dos que voltaram da Babilônia estão “Os filhos de Lode, Hadide e Ono, setecentos e vinte e cinco”, 721 na cópia da lista de Neemias, e entre os lugares dos benjamitas no tempo de Neemias estão “em Hadide, em Zeboim, em Nebalate, em Lode e em Ono, o vale dos artesãos”. Os livros anteriores não a nomeiam, mas duas tábuas cuneiformes achadas em Tel Hadid, escrituras assírias de venda de cerca de 700 a.C. e depois, trazem nomes babilônicos e arameus e mostram que os assírios estabeleceram ali deportados da Mesopotâmia, na província de Samaria, como diz Reis que fizeram."
    - "Em grego a cidade é Adida. Simão Macabeu construiu Adida na Sefelá e a fortificou com portas e ferrolhos contra Trifão por volta de 143 a.C., e acampou ali quando Trifão marchou sobre a Judeia; em 68 d.C., Vespasiano pôs uma guarnição em Adida, com Jericó, para fechar os caminhos para Jerusalém. A Mishná conta Hadide entre as cidades muradas desde os dias de Josué, e Eusébio conheceu Adata como uma aldeia a leste de Dióspolis, isto é, Lode. Escavações de salvamento em 1995–1997 e a expedição da Universidade de Tel Aviv e do Seminário Teológico Batista de Nova Orleans desde 2018 acharam no monte restos da Idade do Bronze ao período islâmico."
    - "Tel Hadid ergue-se hoje na orla da floresta de Ben Shemen, junto ao moshav de Hadid, fundado em 1949, com a planície de Lode e o aeroporto Ben Gurion estendidos abaixo dele."
  de:
    - "Hadid war eine Stadt am Rand der Küstenebene, etwa 6 km östlich von Lod, auf einem Hügel an der Straße, die von Lod Richtung Bet-Horon und Jerusalem ansteigt. Die Stätte ist Tel Hadid beim arabischen Dorf el-Haditha, das den Namen bis 1948 bewahrte. Die Bibel kennt sie erst nach dem Exil. In der Liste der Rückkehrer aus Babylon stehen „der Kinder von Lod, Hadid und Ono siebenhundert und fünfundzwanzig“, in Nehemias Abschrift 721, und unter den Orten, wo sich die Benjaminiter zu Nehemias Zeit niederließen: „Hadid, Zeboim, Neballat, Lod und Ono im Tal der Zimmerleute“. Frühere Bücher nennen sie nicht, doch zwei in Tel Hadid gefundene Keilschrifttafeln, assyrische Kaufurkunden von etwa 700 v. Chr. an, tragen babylonische und aramäische Namen und zeigen, dass die Assyrer hier in der Provinz Samaria Deportierte aus Mesopotamien ansiedelten, wie die Königsbücher sagen."
    - "Auf Griechisch heißt die Stadt Adida. Simon der Makkabäer baute Adida in der Schefela und befestigte es um 143 v. Chr. mit Toren und Riegeln gegen Tryphon und lagerte dort, als Tryphon gegen Judäa zog; im Jahr 68 n. Chr. legte Vespasian eine Besatzung nach Adida, wie nach Jericho, um die Straßen nach Jerusalem zu sperren. Die Mischna zählt Hadid zu den Städten, die seit den Tagen Josuas ummauert waren, und Eusebius kannte Adatha als Dorf östlich von Diospolis, das ist Lod. Rettungsgrabungen 1995–1997 und die Expedition der Universität Tel Aviv und des New Orleans Baptist Theological Seminary seit 2018 haben auf dem Hügel Reste von der Bronzezeit bis zur islamischen Zeit gefunden."
    - "Tel Hadid erhebt sich heute am Rand des Waldes von Ben Schemen, neben dem 1949 gegründeten Moschaw Hadid, mit der Ebene von Lod und dem Flughafen Ben Gurion zu seinen Füßen."
  fr:
    - "Hadid était une ville en bordure de la plaine côtière, à environ 6 km à l’est de Lydde, sur une colline au bord de la route de Lydde vers Beth-Horon et Jérusalem. Le site est Tel Hadid, près du village arabe d’el-Haditha, qui garda le nom jusqu’en 1948. La Bible ne la connaît qu’après l’exil. Parmi ceux qui revinrent de Babylone figurent « les fils de Lod, de Hadid et d’Ono, sept cent vingt-cinq », 721 chez Néhémie, et parmi les lieux des Benjamites du temps de Néhémie : « à Hadid, à Tseboïm, à Neballath, à Lod et à Ono, la vallée des ouvriers ». Les livres anciens l’ignorent, mais deux tablettes cunéiformes trouvées à Tel Hadid, actes de vente assyriens d’environ 700 av. J.-C. et après, portent des noms babyloniens et araméens et montrent que les Assyriens installèrent ici des déportés de Mésopotamie, dans la province de Samarie, comme le disent les Rois."
    - "En grec, la ville est Adida. Simon Maccabée bâtit Adida dans la Shéphéla et la fortifia de portes et de barres contre Tryphon vers 143 av. J.-C., et y campa quand Tryphon marcha sur la Judée ; en 68 apr. J.-C., Vespasien mit une garnison à Adida, avec Jéricho, pour fermer les routes de Jérusalem. La Michna compte Hadid parmi les villes fortifiées depuis les jours de Josué, et Eusèbe connaissait Adatha comme un village à l’est de Diospolis, c’est-à-dire Lydde. Des fouilles de sauvetage en 1995–1997 et l’expédition de l’Université de Tel-Aviv et du New Orleans Baptist Theological Seminary depuis 2018 ont trouvé sur le tertre des vestiges de l’âge du Bronze à l’époque islamique."
    - "Tel Hadid se dresse aujourd’hui en lisière de la forêt de Ben Shemen, près du moshav de Hadid fondé en 1949, avec la plaine de Lydde et l’aéroport Ben Gourion étalés à ses pieds."
