body:
  en:
    - "Hadid was a town at the edge of the coastal plain about 5 km east of Lod, on a hill beside the road that climbs from Lod toward Beth-horon and Jerusalem. The site is Tel Hadid, by the Arab village of el-Haditha that kept the name until 1948. The Bible knows it only after the exile. In the roll of those who returned from Babylon are “The children of Lod, Hadid, and Ono, seven hundred twenty and five”, 721 in Nehemiah's copy, and among the places where the Benjaminites settled in Nehemiah's day are “Hadid, Zeboim, Neballat, Lod, and Ono, the valley of craftsmen”. Earlier books do not name it, but two cuneiform tablets found at Tel Hadid, a land sale of 698 or 697 BC and a loan of 665 or 664 BC, bear Babylonian and Aramean names and, as their editors read them, show that the Assyrians settled deportees from Mesopotamia here, in the province of Samaria, as Kings says they did."
    - "In Greek the town is Adida. Simon Maccabeus built Adida in the Shephelah and fortified it with gates and bars about 143 BC, and camped there when Tryphon marched on Judea; in AD 68 Vespasian put a garrison at Adida, with Jericho, to close the roads to Jerusalem. The Mishnah counts Hadid among the towns walled since the days of Joshua, and Eusebius knew Adatha as a village east of Diospolis, that is Lod. Salvage excavations in 1995–1997 and the expedition of Tel Aviv University and the New Orleans Baptist Theological Seminary since 2018 have found remains from the Bronze Age to the Islamic period on the mound."
    - "Tel Hadid rises today on the edge of the Ben Shemen forest, beside the moshav of Hadid founded in 1949, with the plain of Lod and Ben Gurion airport spread out below it."
  ru:
    - "Хадид был городом на краю приморской равнины примерно в 5 км к востоку от Лода, на холме, где равнина встречает первые склоны гор, у дороги, поднимающейся от Лода к Вефорону и Иерусалиму. Это Тель-Хадид у арабской деревни Эль-Хадита, сохранявшей имя до 1948 года. Библия знает его только после плена. В перечне вернувшихся из Вавилона стоят «уроженцев Лидды, Хадида и Оно семьсот двадцать пять», в списке Неемии — 721, а среди мест, где во дни Неемии жили Вениамитяне, названы «Хадиде, Цевоиме, Неваллате, Лоде, Оно, в долине Харашиме». Ранние книги его не называют, но две клинописные таблички, найденные на Тель-Хадиде, купчая на землю 698 или 697 г. до н. э. и долговая расписка 665 или 664 г. до н. э., несут вавилонские и арамейские имена и, как их читают издатели, показывают, что ассирийцы селили здесь, в провинции Самария, переселенцев из Месопотамии, как и говорит книга Царств."
    - "По-гречески город зовётся Адида. Симон Маккавей построил Адиду в Шефеле и укрепил её воротами и запорами около 143 г. до н. э., и стоял там станом, когда Трифон шёл на Иудею; в 68 г. н. э. Веспасиан поставил в Адиде, как и в Иерихоне, гарнизон, чтобы закрыть дороги на Иерусалим. Мишна считает Хадид среди городов, обнесённых стеной со дней Иисуса Навина, а Евсевий знал Адафу как селение к востоку от Диосполя, то есть Лода. Охранные раскопки 1995–1997 годов и экспедиция Тель-Авивского университета и Баптистской богословской семинарии Нового Орлеана с 2018 года нашли на холме остатки от бронзового века до исламского времени."
    - "Тель-Хадид поднимается сегодня на краю леса Бен-Шемен, рядом с мошавом Хадид, основанным в 1949 году, а внизу расстилается равнина Лода с аэропортом Бен-Гурион."
  uk:
    - "Хадід було містом на краю прибережної рівнини приблизно за 5 км на схід від Лідди, на пагорбі біля дороги, що піднімається від Лідди до Бет-Хорона та Єрусалима. Місце — Тель-Хадід, поряд з арабським селом ель-Хадіта, що зберігало назву до 1948 року. Біблія знає його лише після вигнання. У переліку тих, хто повернувся з Вавилона, є «Що родом з Лидди, Хадида та Оно, сїмсот двайцять пять», а в списку Неемії — 721; серед місць, де за Неемії оселилися веніяминці: «Хадидї, Зевоїмі, Неваллатї, Лодї, Оно, в долинї Харашимі». Давніші книги міста не називають, але дві клинописні таблички, знайдені в Тель-Хадіді, — купча на землю 698 або 697 р. до н. е. і боргова розписка 665 або 664 р. до н. е., — мають вавилонські й арамейські імена й, як їх читають видавці, показують, що ассирійці оселяли тут депортованих із Месопотамії, в провінції Самарія, як і кажуть Книги Царів."
    - "Грецькою місто — Адіда. Симон Макавей збудував Адіду в Шефелі й укріпив її брамами та засувами близько 143 р. до н. е., і отаборився там, коли Трифон рушив на Юдею; 68 р. н. е. Веспасіан поставив в Адіді залогу, разом з Єрихоном, щоб перекрити дороги до Єрусалима. Мішна зараховує Хадід до міст, обнесених мурами від днів Ісуса Навина, а Євсевій знав Адату як село на схід від Діосполя, тобто Лідди. Рятівні розкопки 1995–1997 років та експедиція Тель-Авівського університету й Новоорлеанської баптистської богословської семінарії від 2018 року знайшли на городищі рештки від бронзового віку до ісламського періоду."
    - "Тель-Хадід здіймається нині на краю лісу Бен-Шемен, поряд з мошавом Хадід, заснованим 1949 року, а рівнина Лідди й аеропорт Бен-Гуріон розкинулися під ним."
  es:
    - "Hadid era una población en el borde de la llanura costera, a unos 5 km al este de Lida, sobre una colina junto al camino de Lida a Bet-horón y Jerusalén. El sitio es Tel Hadid, junto a la aldea árabe el-Haditha, que conservó el nombre hasta 1948. La Biblia la conoce solo después del destierro. Entre los que volvieron de Babilonia figuran «Los hijos de Lod, Hadid, y Ono, setecientos veinte y cinco», 721 en la copia de Nehemías, y entre los lugares de los benjaminitas en tiempos de Nehemías están «Hadid, Seboim, Neballath; Lod, y Ono, valle de los artífices». Los libros anteriores no la nombran, pero dos tablillas cuneiformes de Tel Hadid, una venta de tierras del 698 o 697 a. C. y un préstamo del 665 o 664 a. C., llevan nombres babilonios y arameos y, según sus editores, muestran que los asirios asentaron aquí, en la provincia de Samaria, a deportados de Mesopotamia, como dice Reyes."
    - "En griego la población es Adida. Simón Macabeo edificó Adida en la Sefelá y la fortificó con puertas y cerrojos hacia el 143 a. C., y acampó allí cuando Trifón marchó sobre Judea; en el 68 d. C. Vespasiano puso una guarnición en Adida, con Jericó, para cerrar los caminos a Jerusalén. La Misná cuenta a Hadid entre las ciudades amuralladas desde los días de Josué, y Eusebio conoció Adatha como una aldea al este de Diospolis, es decir, Lida. Las excavaciones de salvamento de 1995–1997 y la expedición de la Universidad de Tel Aviv y el Seminario Teológico Bautista de Nueva Orleans desde 2018 han hallado en el montículo restos que van de la Edad del Bronce a la época islámica."
    - "Tel Hadid se alza hoy en el borde del bosque de Ben Shemen, junto al moshav de Hadid fundado en 1949, con la llanura de Lida y el aeropuerto Ben Gurión extendidos a sus pies."
  pt:
    - "Hadide era uma cidade na orla da planície costeira, a cerca de 5 km a leste de Lode, numa colina junto à estrada que sobe de Lode em direção a Bete-Horom e Jerusalém. O sítio é Tel Hadid, junto à aldeia árabe de el-Haditha, que guardou o nome até 1948. A Bíblia só a conhece depois do exílio. No rol dos que voltaram da Babilônia estão “Os filhos de Lode, Hadide e Ono, setecentos e vinte e cinco”, 721 na cópia de Neemias, e entre os lugares dos benjamitas no tempo de Neemias estão “em Hadide, em Zeboim, em Nebalate, em Lode e em Ono, o vale dos artesãos”. Os livros anteriores não a nomeiam, mas duas tábuas cuneiformes achadas em Tel Hadid, uma venda de terras de 698 ou 697 a.C. e um empréstimo de 665 ou 664 a.C., trazem nomes babilônicos e arameus e, como os leem seus editores, mostram que os assírios estabeleceram ali deportados da Mesopotâmia, na província de Samaria, como diz Reis."
    - "Em grego a cidade é Adida. Simão Macabeu construiu Adida na Sefelá e a fortificou com portas e ferrolhos por volta de 143 a.C., e acampou ali quando Trifão marchou sobre a Judeia; em 68 d.C., Vespasiano pôs uma guarnição em Adida, com Jericó, para fechar os caminhos para Jerusalém. A Mishná conta Hadide entre as cidades muradas desde os dias de Josué, e Eusébio conheceu Adata como uma aldeia a leste de Dióspolis, isto é, Lode. Escavações de salvamento em 1995–1997 e a expedição da Universidade de Tel Aviv e do Seminário Teológico Batista de Nova Orleans desde 2018 acharam no monte restos da Idade do Bronze ao período islâmico."
    - "Tel Hadid ergue-se hoje na orla da floresta de Ben Shemen, junto ao moshav de Hadid, fundado em 1949, com a planície de Lode e o aeroporto Ben Gurion estendidos abaixo dele."
  de:
    - "Hadid war eine Stadt am Rand der Küstenebene, etwa 5 km östlich von Lod, auf einem Hügel an der Straße, die von Lod Richtung Bet-Horon und Jerusalem ansteigt. Die Stätte ist Tel Hadid beim arabischen Dorf el-Haditha, das den Namen bis 1948 bewahrte. Die Bibel kennt sie erst nach dem Exil. Unter den Rückkehrern aus Babylon stehen „der Kinder von Lod, Hadid und Ono siebenhundert und fünfundzwanzig“, in Nehemias Abschrift 721, und unter den Orten der Benjaminiter zu Nehemias Zeit: „Hadid, Zeboim, Neballat, Lod und Ono im Tal der Zimmerleute“. Frühere Bücher nennen sie nicht, doch zwei Keilschrifttafeln aus Tel Hadid, ein Landkauf von 698 oder 697 v. Chr. und ein Darlehen von 665 oder 664 v. Chr., tragen babylonische und aramäische Namen und zeigen nach ihren Herausgebern, dass die Assyrer hier in der Provinz Samaria Deportierte aus Mesopotamien ansiedelten, wie die Königsbücher sagen."
    - "Auf Griechisch heißt die Stadt Adida. Simon der Makkabäer baute Adida in der Schefela und befestigte es um 143 v. Chr. mit Toren und Riegeln und lagerte dort, als Tryphon gegen Judäa zog; im Jahr 68 n. Chr. legte Vespasian eine Besatzung nach Adida, wie nach Jericho, um die Straßen nach Jerusalem zu sperren. Die Mischna zählt Hadid zu den Städten, die seit den Tagen Josuas ummauert waren, und Eusebius kannte Adatha als Dorf östlich von Diospolis, das ist Lod. Rettungsgrabungen 1995–1997 und die Expedition der Universität Tel Aviv und des New Orleans Baptist Theological Seminary seit 2018 haben auf dem Hügel Reste von der Bronzezeit bis zur islamischen Zeit gefunden."
    - "Tel Hadid erhebt sich heute am Rand des Waldes von Ben Schemen, neben dem 1949 gegründeten Moschaw Hadid, mit der Ebene von Lod und dem Flughafen Ben Gurion zu seinen Füßen."
  fr:
    - "Hadid était une ville en bordure de la plaine côtière, à environ 5 km à l’est de Lydde, sur une colline au bord de la route de Lydde vers Beth-Horon et Jérusalem. Le site est Tel Hadid, près du village arabe d’el-Haditha, qui garda le nom jusqu’en 1948. La Bible ne la connaît qu’après l’exil. Parmi les rapatriés de Babylone figurent « les fils de Lod, de Hadid et d’Ono, sept cent vingt-cinq », 721 chez Néhémie, et parmi les lieux des Benjamites du temps de Néhémie : « à Hadid, à Tseboïm, à Neballath, à Lod et à Ono, la vallée des ouvriers ». Les livres anciens l’ignorent, mais deux tablettes cunéiformes de Tel Hadid, une vente de terre de 698 ou 697 av. J.-C. et un prêt de 665 ou 664 av. J.-C., portent des noms babyloniens et araméens et, selon leurs éditeurs, montrent que les Assyriens installèrent ici des déportés de Mésopotamie, dans la province de Samarie, comme le disent les Rois."
    - "En grec, la ville est Adida. Simon Maccabée bâtit Adida dans la Shéphéla et la fortifia de portes et de barres vers 143 av. J.-C., et y campa quand Tryphon marcha sur la Judée ; en 68 apr. J.-C., Vespasien mit une garnison à Adida, avec Jéricho, pour fermer les routes de Jérusalem. La Michna compte Hadid parmi les villes fortifiées depuis les jours de Josué, et Eusèbe connaissait Adatha comme un village à l’est de Diospolis, c’est-à-dire Lydde. Des fouilles de sauvetage en 1995–1997 et l’expédition de l’Université de Tel-Aviv et du New Orleans Baptist Theological Seminary depuis 2018 ont trouvé sur le tertre des vestiges de l’âge du Bronze à l’époque islamique."
    - "Tel Hadid se dresse aujourd’hui en lisière de la forêt de Ben Shemen, près du moshav de Hadid fondé en 1949, avec la plaine de Lydde et l’aéroport Ben Gourion étalés à ses pieds."
  pl:
    - "Chadid było miastem na skraju nizin nadmorskich około 5 km na wschód od Lod, na wzgórzu przy drodze wspinającej się od Lod ku Bet-Choron i Jerozolimie. Miejscem jest Tel Hadid, przy arabskiej wsi al-Hadita, która zachowała nazwę do 1948 r. Biblia zna je dopiero po wygnaniu. W spisie tych, którzy wrócili z Babilonu, jest: „Synów Lodowych, Hadydowych, i Onowych siedm set dwadzieścia i pięć”, 721 w kopii Nehemiasza, a wśród miejsc Beniaminitów za Nehemiasza: „W Hadyd, w Seboim, w Neballat. W Lod, i w Ono, i w dolinie rzemieślników”. Wcześniejsze księgi nie wymieniają miasta, lecz dwie tabliczki klinowe z Tel Hadid, akt sprzedaży ziemi z 698 lub 697 r. p.n.e. i umowa pożyczki z 665 lub 664 r. p.n.e., noszą imiona babilońskie i aramejskie i, według ich wydawców, pokazują, że Asyryjczycy osiedlili tu deportowanych z Mezopotamii, w prowincji Samaria, jak mówią Księgi Królewskie."
    - "Po grecku miasto to Adida. Szymon Machabeusz zbudował Adidę w Szefeli i obwarował ją bramami i zasuwami około 143 r. p.n.e., i obozował tam, gdy Tryfon maszerował na Judeę; w 68 r. n.e. Wespazjan umieścił w Adidzie załogę, wraz z Jerychem, by zamknąć drogi do Jerozolimy. Miszna zalicza Chadid do miast obwarowanych murami od dni Jozuego, a Euzebiusz znał Adathę jako wieś na wschód od Diospolis, czyli Lod. Ratownicze wykopaliska w latach 1995–1997 i ekspedycja Uniwersytetu Telawiwskiego i New Orleans Baptist Theological Seminary od 2018 r. znalazły na pagórku szczątki od epoki brązu po okres islamski."
    - "Tel Hadid wznosi się dziś na skraju lasu Ben Szemen, obok moszawu Chadid założonego w 1949 r., z równiną Lod i lotniskiem Ben Guriona rozciągającymi się poniżej."
  it:
    - "Adid era una città al margine della pianura costiera circa 5 km a est di Lidda, su una collina presso la strada che sale da Lidda verso Bet-Oron e Gerusalemme. Il sito è Tel Hadid, accanto al villaggio arabo di el-Haditha che ne conservò il nome fino al 1948. La Bibbia la conosce solo dopo l’esilio. Nell’elenco dei rimpatriati da Babilonia vi sono «I figliuoli di Lod, di Hadid e d’Ono, settecento venticinque», 721 nella copia di Neemia, e fra i luoghi dei Beniaminiti ai giorni di Neemia vi sono «Hadid, Tseboim, Neballath, Lod ed Ono, valle degli artigiani». I libri precedenti non la nominano, ma due tavolette cuneiformi di Tel Hadid, una vendita di terreno del 698 o 697 a.C. e un prestito del 665 o 664 a.C., recano nomi babilonesi e aramei e, secondo i loro editori, mostrano che gli Assiri vi insediarono deportati dalla Mesopotamia, nella provincia di Samaria, come dicono i Re."
    - "In greco la città è Adida. Simone Maccabeo costruì Adida nella Sefela e la fortificò con porte e sbarre verso il 143 a.C., e vi si accampò quando Trifone marciò sulla Giudea; nel 68 d.C. Vespasiano pose a Adida una guarnigione, con Gerico, per chiudere le strade verso Gerusalemme. La Mishnah annovera Adid fra le città cinte di mura dai giorni di Giosuè, ed Eusebio conosceva Adatha come un villaggio a est di Diospoli, cioè Lidda. Scavi di salvataggio nel 1995–1997 e la spedizione dell’Università di Tel Aviv e del New Orleans Baptist Theological Seminary dal 2018 hanno trovato sul tell resti dall’età del Bronzo al periodo islamico."
    - "Tel Hadid sorge oggi al margine della foresta di Ben Shemen, accanto al moshav di Hadid fondato nel 1949, con la pianura di Lidda e l’aeroporto Ben Gurion distesi sotto di esso."
  nl:
    - "Chadid was een stad aan de rand van de kustvlakte, ca. 5 km ten oosten van Lydda, op een heuvel naast de weg van Lydda omhoog naar Beth-Horon en Jeruzalem. De plaats is Tel Hadid, bij het Arabische dorp el-Haditha dat de naam tot 1948 droeg. De Bijbel kent haar pas na de ballingschap. In de lijst van de terugkeerders uit Babylon staan “de kinderen van Lod, Hadid en Ono, zevenhonderd vijf en twintig”, 721 in Nehemia’s kopie, en onder de plaatsen van de Benjaminieten in Nehemia’s dagen zijn “Hadid, Zeboim, Neballat, Lod, en Ono, in het dal der werkmeesters”. Eerdere boeken noemen haar niet, maar twee spijkerschrifttabletten uit Tel Hadid, een grondverkoop van 698 of 697 v.Chr. en een lening van 665 of 664 v.Chr., dragen Babylonische en Aramese namen en tonen volgens hun uitgevers dat Assyriërs hier, in de provincie Samaria, ontheemden uit Mesopotamië vestigden, zoals Koningen zegt."
    - "In het Grieks heet de stad Adida. Simon de Makkabeeër bouwde Adida in de Sefela en versterkte het met poorten en grendels omstreeks 143 v.Chr., en legerde zich er toen Tryfon tegen Judea optrok; in 68 n.Chr. legde Vespasianus een garnizoen in Adida, met Jericho, om de wegen naar Jeruzalem te sluiten. De Misjna rekent Chadid tot de steden die sinds Jozua ommuurd zijn, en Eusebius kende Adatha als een dorp ten oosten van Diospolis, dat is Lydda. Noodopgravingen in 1995–1997 en de expeditie van de Universiteit van Tel Aviv en het New Orleans Baptist Theological Seminary sinds 2018 vonden op de heuvel resten van de Bronstijd tot de islamitische tijd."
    - "Tel Hadid verrijst nu aan de rand van het bos van Ben Shemen, naast de in 1949 gestichte moshav Hadid, met de vlakte van Lydda en de luchthaven Ben-Goerion eronder uitgespreid."
  cs:
    - "Chadíd bylo město na okraji pobřežní roviny asi 5 km východně od Lodu, na pahorku u cesty, která stoupá z Lodu k Bét-choronu a Jeruzalému. Místem je Tel Hadid u arabské vesnice el-Haditha, která si jméno zachovala do roku 1948. Bible je zná jen po exilu. V soupisu těch, kdo se vrátili z Babylóna, je „Synů Lodových, Chadidových a Onových sedm set dvadceti pět“, v Nehemjášově opisu seznamu 721, a mezi místy, kde se za Nehemjášových dnů usadili Benjamínovci, je „V Chadid, v Seboim, v Neballat, V Lod, v Ono a v údolí řemeslníků“. Dřívější knihy město nejmenují, ale dvě klínopisné tabulky nalezené v Tel Hadid, prodej půdy z roku 698 nebo 697 př. n. l. a půjčka z roku 665 nebo 664 př. n. l., nesou babylonská a aramejská jména a, jak je čtou jejich vydavatelé, ukazují, že Asyřané zde, v provincii Samaří, usadili vyhnance z Mezopotámie, jak praví Královská."
    - "Řecky je město Adida. Šimon Makabejský vystavěl Adidu v Šefele a opevnil ji branami a závorami kolem roku 143 př. n. l. a utábořil se tam, když Tryfón táhl na Judsko; roku 68 n. l. umístil Vespasianus v Adidě posádku, spolu s Jerichem, aby uzavřel cesty do Jeruzaléma. Mišna počítá Chadíd mezi města obehnaná hradbou od dnů Jozueových a Eusebios znal Adathu jako vesnici východně od Diospole, tedy Lodu. Záchranné vykopávky v letech 1995–1997 a expedice Telavivské univerzity a Baptistického teologického semináře v New Orleansu od roku 2018 nalezly na pahorku pozůstatky od doby bronzové po islámské období."
    - "Tel Hadid se dnes zdvihá na okraji lesa Ben Šemen, vedle mošavu Hadid založeného roku 1949, s lodskou rovinou a letištěm Ben Guriona rozprostřenými pod ním."
  sv:
    - "Hadid var en stad i kanten av kustslätten omkring 5 km öster om Lod, på en kulle vid vägen som stiger från Lod mot Bet-Horon och Jerusalem. Platsen är Tel Hadid, vid den arabiska byn el-Haditha som behöll namnet till 1948. Bibeln känner den bara efter exilen. I förteckningen över dem som återvände från Babylon står ”Lods, Hadids och Onos barn: sju hundra tjugufem”, 721 i Nehemjas avskrift, och bland de platser där benjaminiterna bosatte sig på Nehemjas tid står ”Hadid, Seboim, Neballat, Lod, Ono, och Timmermansdalen”. Tidigare böcker nämner den inte, men två kilskriftstavlor funna i Tel Hadid, en jordförsäljning från 698 eller 697 f.Kr. och ett lån från 665 eller 664 f.Kr., bär babyloniska och arameiska namn och visar, som utgivarna läser dem, att assyrierna bosatte deporterade från Mesopotamien här, i provinsen Samaria, som Kungaboken säger att de gjorde."
    - "På grekiska heter staden Adida. Simon mackabeen byggde Adida i Shefela och befäste det med portar och bommar omkring 143 f.Kr., och slog läger där när Tryfon tågade mot Judeen; år 68 e.Kr. lade Vespasianus en garnison i Adida, tillsammans med Jeriko, för att stänga vägarna till Jerusalem. Mishnan räknar Hadid bland de städer som varit ringmurade sedan Josuas dagar, och Eusebios kände Adatha som en by öster om Diospolis, det vill säga Lod. Räddningsgrävningar 1995–1997 och expeditionen från Tel Avivs universitet och New Orleans Baptist Theological Seminary sedan 2018 har funnit lämningar från bronsåldern till den islamiska perioden på kullen."
    - "Tel Hadid reser sig i dag i kanten av Ben Shemen-skogen, vid moshaven Hadid grundad 1949, med Lodslätten och Ben Gurion-flygplatsen utbredda nedanför."
  nb:
    - "Hadid var en by i kanten av kystsletten omtrent 5 km øst for Lod, på en høyde ved veien som stiger fra Lod mot Bet-Horon og Jerusalem. Stedet er Tel Hadid, ved den arabiske landsbyen el-Haditha som bevarte navnet til 1948. Bibelen kjenner den bare etter eksilet. I listen over de som vendte tilbake fra Babylon står «Lods, Hadids og Onos barn, syv hundre og fem og tyve», 721 i Nehemjas kopi, og blant stedene der benjaminittene bosatte seg på Nehemjas tid er «Hadid, Sebo'im, Neballat, Lod, Ono og Tømmermannsdalen». Tidligere bøker nevner den ikke, men to kileskrifttavler funnet ved Tel Hadid, et landsalg fra 698 eller 697 f.Kr. og et lån fra 665 eller 664 f.Kr., bærer babylonske og arameiske navn og viser, slik utgiverne leser dem, at assyrerne bosatte deporterte fra Mesopotamia her, i provinsen Samaria, slik Kongebøkene sier at de gjorde."
    - "På gresk er byen Adida. Simon Makkabeus bygde Adida i Sjefela og befestet den med porter og bommer omkring 143 f.Kr., og slo leir der da Tryfon marsjerte mot Judea; i 68 e.Kr. la Vespasian en garnison i Adida, sammen med Jeriko, for å stenge veiene til Jerusalem. Mishnaen regner Hadid blant byene som har vært omgitt av murer siden Josvas dager, og Eusebius kjente Adatha som en landsby øst for Diospolis, det vil si Lod. Redningsutgravninger i 1995–1997 og ekspedisjonen fra Tel Aviv-universitetet og New Orleans Baptist Theological Seminary siden 2018 har funnet rester fra bronsealder til islamsk tid på haugen."
    - "Tel Hadid reiser seg i dag i kanten av Ben Shemen-skogen, ved moshaven Hadid grunnlagt i 1949, med Lod-sletten og Ben Gurion lufthavn utbredt nedenfor."
  tl:
    - "Ang Hadid ay bayan sa gilid ng kapatagang baybayin, mga 5 km sa silangan ng Lod, sa burol sa daang mula Lod paakyat sa Beth-horon at Jerusalem. Ito ang Tel Hadid, sa tabi ng nayong Arabe na el-Haditha (pangalang taglay hanggang 1948). Sa Biblia, lumilitaw lamang ito pagkatapos ng pagkatapon: sa talaan ng mga bumalik mula sa Babilonia, “Ang mga anak ni Lod, ni Hadid, at ni Ono, pitong daan at dalawang pu't lima”, 721 kay Nehemias, at sa mga tirahan ng mga Benjamita sa panahon ni Nehemias, “Sa Hadid, sa Seboim, sa Neballath; Sa Lod, at sa Ono, na libis ng mga manggagawa”. Dalawang tapyas na cuneiform sa Tel Hadid (bentahan ng lupa, 698 o 697 BK; pautang, 665 o 664 BK) na may mga pangalang Babilonio at Arameo ay, ayon sa mga naglathala, nagpapakitang pinatira rito ng mga Asirio ang mga itinapon mula sa Mesopotamia, sa lalawigan ng Samaria, gaya ng sabi ng Mga Hari."
    - "Sa Griyego ang bayan ay Adida. Itinayo ni Simon Macabeo ang Adida sa Sephela at pinatibay ng mga pintuan at halang noong mga 143 BK, at nagkampo roon nang lumusob si Trifon sa Judea; noong 68 AD ay naglagay si Vespasiano ng garison sa Adida, kasama ang Jerico, upang isara ang mga daan patungong Jerusalem. Binibilang ng Mishnah ang Hadid sa mga bayang may pader mula pa sa mga araw ni Josue, at kilala ni Eusebio ang Adatha bilang nayon sa silangan ng Diospolis, ibig sabihin ang Lod. Ang mga pagsagip na paghuhukay noong 1995–1997 at ang ekspedisyon ng Pamantasan ng Tel Aviv at ng New Orleans Baptist Theological Seminary mula 2018 ay nakatagpo sa burol ng mga labi mula sa Panahong Tanso hanggang sa panahong Islamiko."
    - "Ang Tel Hadid ay umaangat ngayon sa gilid ng gubat ng Ben Shemen, sa tabi ng moshav ng Hadid na itinatag noong 1949, at nakalatag sa ibaba nito ang kapatagan ng Lod at ang paliparang Ben Gurion."
  da:
    - "Hadid var en by i udkanten af kystsletten omkring 5 km øst for Lydda, på en høj ved vejen, der stiger fra Lydda mod Bet-Horon og Jerusalem. Stedet er Tel Hadid ved den arabiske landsby el-Haditha, der bevarede navnet til 1948. Bibelen kender den kun efter eksilet. Blandt dem, der vendte tilbage fra Babylon, er »Lods, Hadids og Onos Børn, syv Hundrede og fem og tyve«, 721 i Nehemias' afskrift, og blandt de steder, hvor benjaminitterne bosatte sig i Nehemias' dage, er »Hadid, Zeboim, Neballat, Lod og Ono i Tømmermandsdalen«. Tidligere bøger nævner den ikke, men to kileskriftstavler fra Tel Hadid, et jordsalg fra 698 eller 697 f.Kr. og et lån fra 665 eller 664 f.Kr., bærer babylonske og aramæiske navne og viser, som udgiverne læser dem, at assyrerne bosatte deporterede fra Mesopotamien her, i provinsen Samaria, som Kongebøgerne siger."
    - "På græsk er byen Adida. Simon Makkabæeren byggede Adida i Sjefela og befæstede den med porte og slåer omkring 143 f.Kr. og lejrede sig der, da Tryfon marcherede mod Judæa; i 68 e.Kr. lagde Vespasian en garnison i Adida, sammen med Jeriko, for at lukke vejene til Jerusalem. Mishnaen regner Hadid blandt byerne, der har været befæstet siden Josvas dage, og Eusebios kendte Adatha som en landsby øst for Diospolis, det vil sige Lydda. Redningsudgravninger i 1995–1997 og ekspeditionen fra Tel Aviv Universitet og New Orleans Baptist Theological Seminary siden 2018 har fundet levn fra bronzealderen til den islamiske periode på højen."
    - "Tel Hadid hæver sig i dag i udkanten af Ben Shemen-skoven, ved siden af moshaven Hadid, grundlagt i 1949, med Lydda-sletten og Ben Gurion-lufthavnen bredt ud nedenfor."
  sr:
    - "Хадид је био град на ободу приобалне равнице око 5 км источно од Лиде, на брду поред пута који се пење од Лиде према Вет-Орону и Јерусалиму. Налазиште је Тел Хадид, код арапског села Ел-Хадита које је чувало име до 1948. Библија га зна тек после изгнанства. У списку оних који су се вратили из Вавилона стоји: „синова лодских, адидских и ононских седам стотина и двадесет и пет“, у Немијином примерку 721, а Венијаминови су се у Немијино доба населили, између осталог, „у Адиду, у Севојиму, у Невалату, у Лоду, у Онону, и у долини дрводељској“. Раније књиге га не именују, али две клинасте плочице пронађене у Тел Хадиду, продаја земље из 698. или 697. п. н. е. и зајам из 665. или 664. п. н. е., носе вавилонска и арамејска имена и, како их читају њихови издавачи, показују да су Асирци овде, у покрајини Самарији, населили прогнанике из Месопотамије, као што Цареви кажу да јесу."
    - "На грчком град је Адида. Симон Макавејац сазидао је Адиду у Сефели и утврдио је капијама и преворницама око 143. п. н. е., и улогорио се ту кад је Трифон кренуо на Јудеју; 68. н. е. Веспазијан је ставио посаду у Адиду, као и у Јерихон, да затвори путеве ка Јерусалиму. Мишна убраја Хадид међу градове опасане зидом од Исусових дана, а Јевсевије је знао Адату као село источно од Диосполиса, то јест Лиде. Спасилачка ископавања 1995–1997. и експедиција Универзитета у Тел Авиву и Баптистичке богословије у Новом Орлеану од 2018. нашли су на хумци остатке од бронзаног до исламског доба."
    - "Тел Хадид се данас диже на ободу шуме Бен Шемен, поред мошава Хадид основаног 1949, док се испод њега простиру равница Лиде и аеродром Бен Гурион."
  hu:
    - "Hadid a tengerparti síkság szélén fekvő város volt, mintegy 5 km-re keletre Lódtól, egy dombon a Lódból Bét-Hóron és Jeruzsálem felé kapaszkodó út mellett. A lelőhely Tel Hadid, az el-Haditha arab falu mellett, amely 1948-ig megőrizte a nevet. A Biblia csak a száműzetés után ismeri. A Babilonból visszatérők jegyzékében „Lód, Hádid és Ónó fiai hétszázhuszonöt”, Nehémiás másolatában 721, és azon helyek között, ahol a benjámiták Nehémiás napjaiban letelepedtek: „Hádidban, Sebóimban, Neballátban, Lódban, Onóban, s a mesteremberek völgyében”. A korábbi könyvek nem említik, de a Tel Hadidon talált két ékírásos tábla, egy Kr. e. 698 vagy 697-es földeladás és egy Kr. e. 665 vagy 664-es kölcsön babiloni és arám neveket visel, és kiadóik szerint azt mutatja, hogy az asszírok itt, Szamária provinciában, mezopotámiai deportáltakat telepítettek le, ahogyan a Királyok mondja."
    - "Görögül a város Adida. Simon, a makkabeus Adidát a Sefélában kapukkal és zárakkal megerősítette Kr. e. 143 körül, és ott táborozott, amikor Tryphon Júdea ellen vonult; Kr. u. 68-ban Vespasianus helyőrséget helyezett Adidába, Jerikóval együtt, hogy elzárja a Jeruzsálembe vezető utakat. A Misna Hadidot azon városok között számolja, amelyek Józsué napjai óta falakkal vannak körülvéve, Eusebius pedig Adathát ismerte, Diospolistól, azaz Lódtól keletre fekvő faluként. Az 1995–1997-es leletmentő ásatások és a Tel-avivi Egyetem és az Új-Orleans-i Baptista Teológiai Szeminárium expedíciója 2018 óta a halmon a bronzkortól az iszlám korig terjedő maradványokat találtak."
    - "Tel Hadid ma a Ben Semen-erdő szélén emelkedik, az 1949-ben alapított Hadid mosáv mellett, alatta a Lód-síkság és a Ben Gurion repülőtér terül el."
  fi:
    - "Hadid oli kaupunki rannikkotasangon reunalla noin 5 km Lodista itään, kukkulalla Bet-Horoniin ja Jerusalemiin johtavan tien varrella. Paikka on Tel Hadid; viereinen el-Haditha-kylä säilytti nimen vuoteen 1948. Raamattu tuntee sen vasta pakkosiirtolaisuuden jälkeen: Babylonista palanneiden joukossa ovat ”loodilaisia, haadidilaisia ja oonolaisia seitsemänsataa kaksikymmentä viisi” (Nehemian kirjassa 721), ja Nehemian aikana benjaminilaiset asuivat ”Haadidissa, Seboimissa, Neballatissa, Loodissa, Oonossa, Seppäinlaaksossa”. Aiemmat kirjat vaikenevat siitä, mutta kaksi Tel Hadidin nuolenpääkirjoitustaulua, maakauppa (698 tai 697 eaa.) ja laina (665 tai 664 eaa.), joissa on babylonialaisia ja aramealaisia nimiä, osoittavat julkaisijoidensa tulkinnan mukaan, että assyrialaiset asuttivat tänne Mesopotamian pakkosiirtolaisia Samarian provinssissa, kuten Kuninkaiden kirjassa."
    - "Kreikaksi kaupunki on Adida. Simon makkabilainen rakensi Adidan Sefelaan ja linnoitti sen porteilla ja salvoilla noin vuonna 143 eaa. ja leiriytyi sinne Tryfonin marssiessa Juudeaa vastaan; vuonna 68 jaa. Vespasianus sijoitti Adidaan varuskunnan, Jerikon ohella, sulkemaan tiet Jerusalemiin. Mishna lukee Hadidin Joosuan päivistä muurien ympäröimien kaupunkien joukkoon, ja Eusebios tunsi Adathan kylänä Diospoliksesta eli Lodista itään. Pelastuskaivaukset vuosina 1995–1997 ja Tel Avivin yliopiston ja New Orleansin baptistiteologisen seminaarin retkikunta vuodesta 2018 ovat löytäneet kummulta jäänteitä pronssikaudelta islamilaiseen aikaan."
    - "Tel Hadid kohoaa nykyään Ben Shemenin metsän reunalla, vuonna 1949 perustetun Hadidin moshavin vieressä, ja sen alapuolella levittäytyvät Lodin tasanko ja Ben Gurionin lentokenttä."
  vi:
    - "Ha-đít là một thành ở rìa đồng bằng ven biển cách Ly-đa khoảng 5 km về phía đông, trên một ngọn đồi bên con đường đi lên từ Ly-đa hướng Bết-Hô-rôn và Giê-ru-sa-lem. Địa điểm là Tel Hadid, bên làng A-ráp el-Haditha giữ tên đến năm 1948. Kinh Thánh chỉ biết nơi này sau cuộc lưu đày. Danh sách người từ Ba-by-lôn trở về có “họ Lô-đơ, họ Ha-đít, và họ Ô-nô, bảy trăm hai mươi lăm”, 721 trong bản của Nê-hê-mi, và trong các nơi người Bên-gia-min ở thời Nê-hê-mi có “Ha-đít, Sê-bô-im, Nê-ba-lát, Lô-đơ, và Ô-nơ, tức là trũng của các thợ”. Sách trước không nêu tên, nhưng hai bảng chữ hình nêm ở Tel Hadid, một giao dịch bán đất năm 698 hoặc 697 TCN và một khoản vay năm 665 hoặc 664 TCN, mang tên Babylon và A-ram và, theo các nhà biên tập, cho thấy người A-si-ri đã cho dân bị đày từ Mê-sô-bô-ta-mi định cư ở đây, trong tỉnh Sa-ma-ri, như sách Các Vua nói họ đã làm."
    - "Trong tiếng Hy Lạp, thành là Adida. Si-môn Maccabee xây Adida ở Sê-phê-la và củng cố bằng cửa và then khoảng năm 143 TCN, và đóng trại ở đó khi Tryphon tiến vào Giu-đê; năm 68, Vespasian đặt một đồn lính ở Adida, cùng Giê-ri-cô, để chặn các đường đến Giê-ru-sa-lem. Mishnah kể Ha-đít trong các thành có tường bao từ thời Giô-suê, và Eusebius biết Adatha là một làng phía đông Diospolis, tức Ly-đa. Các cuộc khai quật cứu hộ năm 1995–1997 và đoàn khảo sát của Đại học Tel Aviv và Chủng viện Thần học Baptist New Orleans từ năm 2018 đã tìm thấy di tích từ thời Đồ Đồng đến thời Hồi giáo trên gò."
    - "Ngày nay Tel Hadid nằm ở rìa rừng Ben Shemen, cạnh moshav Hadid lập năm 1949, với đồng bằng Ly-đa và sân bay Ben Gurion trải ra bên dưới."
  ro:
    - "Hadid era un oraș la marginea câmpiei litorale, la circa 5 km spre est de Lida, pe un deal lângă drumul care urcă de la Lida spre Bet-Horon și Ierusalim. Locul este Tel Hadid, lângă satul arab el-Haditha, care a păstrat numele până în 1948. Biblia îl cunoaște doar după exil. În lista celor întorși din Babilon se află copiii din Lida, Hadid și Ono, 725, iar la Neemia 721, iar printre locurile unde s-au așezat beniamiții în zilele lui Neemia se numără Hadid, Țeboim, Neballat, Lida și Ono, valea meșteșugarilor. Cărțile mai vechi nu-l numesc, dar două tăblițe cuneiforme găsite la Tel Hadid, o vânzare de pământ din 698 sau 697 î.Hr. și un împrumut din 665 sau 664 î.Hr., poartă nume babiloniene și arameene și, după cum le citesc editorii lor, arată că asirienii au așezat aici deportați din Mesopotamia, în provincia Samaria, așa cum spune Cartea Regilor."
    - "În greacă orașul este Adida. Simon Macabeul a construit Adida în Șefela și a întărit-o cu porți și zăvoare în jurul anului 143 î.Hr. și a tăbărât acolo când Trifon a mărșăluit asupra Iudeei; în 68 d.Hr., Vespasian a pus o garnizoană la Adida, împreună cu Ierihon, pentru a închide drumurile spre Ierusalim. Mishna numără Hadid printre orașele cu ziduri încă din zilele lui Iosua, iar Eusebiu cunoștea Adatha ca pe un sat la est de Diospolis, adică Lida. Săpături de salvare din 1995–1997 și expediția Universității din Tel Aviv și a New Orleans Baptist Theological Seminary din 2018 încoace au găsit pe movilă rămășițe din Epoca Bronzului până în epoca islamică."
    - "Tel Hadid se înalță astăzi la marginea pădurii Ben Shemen, lângă moshavul Hadid întemeiat în 1949, cu câmpia Lidei și aeroportul Ben Gurion întinse dedesubt."
  bg:
    - "Хадид беше град на края на крайбрежната равнина на около 5 км източно от Лида, на хълм до пътя, изкачващ се от Лида към Бет-Орон и Йерусалим. Мястото е Тел Хадид, до арабското село ел-Хадита, което пазеше името до 1948 г. Библията го познава едва след изгнанието. В списъка на завърналите се от Вавилон са „синове на Лод, на Адид, и на Оно, седемстотин и двадесет и пет“, 721 в преписа на Неемия, а сред местата, където вениаминците се заселиха по времето на Неемия, са „в Адид, в Севоим, в Невалат, в Лод, и в Оно, в дола на дърводелците“. По-ранните книги не го назовават, но две клинописни плочки, намерени в Тел Хадид — продажба на земя от 698 или 697 г. пр.н.е. и заем от 665 или 664 г. пр.н.е., носят вавилонски и арамейски имена и, според прочита на издателите им, показват, че асирийците са заселили тук преселници от Месопотамия, в провинция Самария, както казва Царе."
    - "На гръцки градът е Адида. Симон Макавей съгради Адида в Шефела и я укрепи с порти и резета около 143 г. пр.н.е. и разположи стан там, когато Трифон настъпи към Юдея; през 68 г. н.е. Веспасиан постави гарнизон в Адида, заедно с Йерихон, за да затвори пътищата към Йерусалим. Мишна брои Хадид сред градовете, обградени със стени от дните на Иисус Навин, а Евсевий познаваше Адата като село източно от Диосполис, тоест Лида. Спасителните разкопки през 1995–1997 г. и експедицията на Телавивския университет и Баптистката богословска семинария в Ню Орлиънс от 2018 г. насам откриха на могилата останки от бронзовата епоха до ислямския период."
    - "Днес Тел Хадид се издига на края на гората Бен Шемен, до мошава Хадид, основан през 1949 г., а под него се простират равнината на Лида и летище „Бен Гурион“."
