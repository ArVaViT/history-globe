# Overview article (ADR 0007). Kadesh = Tell Nebi Mend is generally accepted; its presence in 2 Sam 24:6 rests on an emendation of the Hebrew, shown as such. Egyptian dates follow the usual chronology (Megiddo 1457, the battle 1274 BC).
id: kadesh
place: adc9b5a
