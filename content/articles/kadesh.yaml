body:
  en:
    - "Kadesh on the Orontes was a city of inland Syria, at Tell Nebi Mend, where a tributary joins the Orontes south-west of Homs near al-Qusayr. The Hellenistic city of Laodicea ad Libanum is thought to have stood on the same mound. Maurice Pézard excavated there for France in the early 1920s, and a team of the Institute of Archaeology of University College London under Peter Parr from 1975 to 1995."
    - "The Hebrew of the census of David reads that Joab's men “came to Gilead, and to the land of Tahtim-hodshi; and they came to Dan-jaan, and about to Zidon”. The odd name is generally thought corrupt. Thenius and Hitzig conjectured a reference to Kadesh, and the Lucianic Greek text reads “to the land of the Hittites, to Kadesh”; the Revised Standard Version adopted the reading “to Kadesh in the land of the Hittites”. Ewald and others read Hermon instead. If the emendation is right, Kadesh marks the far northern limit of the census."
    - "Kadesh led the coalition of Syrian and Canaanite kings that Thutmose III defeated at Megiddo in the fifteenth century BC (1457 BC in one common chronology); in the Amarna age its king Aitakkama wrote to Akhenaten. In May 1274 BC, in his fifth year, Ramesses II fought the Hittite king Muwatalli II near the city, probably the greatest chariot battle of antiquity; neither side won outright; the pharaoh withdrew to Egypt, and Kadesh stayed in the Hittite sphere."
  ru:
    - "Кадеш на Оронте — город внутренней Сирии на холме Телль-Неби-Менд, где приток впадает в Оронт, к юго-западу от Хомса, близ Эль-Кусейра. Считается, что на том же холме стоял эллинистический город Лаодикея Ливанская. Здесь копали французская экспедиция Мориса Пезара в начале 1920-х гг. и экспедиция Института археологии Университетского колледжа Лондона под руководством Питера Парра в 1975–1995 гг."
    - "В рассказе о переписи Давида еврейский текст говорит, что люди Иоава «пришли в Галаад и в землю Тахтим-Ходши; и пришли в Дан-Яан и обошли Сидон». Странное имя обычно считают испорченным. Тений и Гитциг предположили здесь Кадеш, и лукиановская редакция греческого текста читает «в землю хеттов, в Кадеш»; английский Revised Standard Version принял чтение «в Кадеш в земле хеттов». Эвальд и другие читают Ермон. Если поправка верна, Кадеш отмечает крайний северный предел переписи."
    - "Кадеш возглавлял союз сирийских и ханаанских царей, которых Тутмос III разбил при Мегиддоне в XV в. до н. э. (по одной из распространённых хронологий — в 1457 г. до н. э.); в амарнскую эпоху его царь Айтаккама писал Эхнатону. В мае 1274 г. до н. э., на пятом году правления, Рамсес II сразился с хеттским царём Муваталли II близ города — вероятно, в крупнейшей колесничной битве древности; ни одна сторона не одержала решительной победы; фараон ушёл в Египет, и Кадеш остался в хеттской сфере."
  uk:
    - "Кадес на Оронті був містом внутрішньої Сирії, в Телль-Неби-Менді, де притока впадає в Оронт на південний захід від Хомса біля аль-Кусайра. Вважають, що елліністичне місто Лаодікея-ад-Лібанум стояло на тому самому пагорбі. Моріс Пезар розкопував там для Франції на початку 1920-х рр., а група Інституту археології Університетського коледжу Лондона під керівництвом Пітера Парра — від 1975 до 1995 р."
    - "Єврейський текст перепису Давида повідомляє, що люди Йоава: «прибули в Галаад та й пройшли до землї Тахтим-Годші, й прибули в Дан-Яан і обійшли Сидон». Дивну назву зазвичай вважають спотвореною. Теніус і Гітціг припустили, що йдеться про Кадес, а лукіанівський грецький текст читає «до землі хеттів, до Кадеса»; Переглянутий стандартний переклад прийняв прочитання «до Кадеса в землі хеттів». Евальд та інші натомість читають Гермон. Якщо виправлення слушне, Кадес позначає далеку північну межу перепису."
    - "Кадес очолював коаліцію сирійських і ханаанських царів, яку Тутмос III розбив під Мегіддо в XV ст. до н. е. (за однією з поширених хронологій — 1457 р. до н. е.); в амарнську добу його цар Айтаккама писав до Ехнатона. У травні 1274 р. до н. е., на п'ятому році свого правління, Рамсес II бився з хеттським царем Муваталлі II поблизу міста — імовірно, у найбільшій колісничній битві давнини; жодна зі сторін не здобула цілковитої перемоги; фараон відступив до Єгипту, а Кадес лишився в хеттській сфері."
  es:
    - "Cades del Orontes era una ciudad del interior de Siria, en Tell Nebi Mend, donde un afluente desemboca en el Orontes al suroeste de Homs, cerca de al-Qusayr. Se cree que la ciudad helenística de Laodicea del Líbano se alzó en el mismo montículo. Maurice Pézard excavó allí para Francia a comienzos de la década de 1920, y un equipo del Instituto de Arqueología del University College de Londres bajo Peter Parr de 1975 a 1995."
    - "El hebreo del censo de David dice que los hombres de Joab llegaron a Galaad y a la tierra de Tahtim-hodsi, y que llegaron a Dan-jaán y rodearon hasta Sidón. El nombre extraño suele considerarse corrupto. Thenius y Hitzig conjeturaron una referencia a Cades, y el texto griego luciánico lee «a la tierra de los hititas, a Cades»; la Revised Standard Version adoptó la lectura «a Cades, en la tierra de los hititas». Ewald y otros leen Hermón en su lugar. Si la enmienda es correcta, Cades marca el límite septentrional extremo del censo."
    - "Cades encabezó la coalición de reyes sirios y cananeos que Tutmosis III derrotó en Meguido en el siglo XV a. C. (en 1457 a. C. según una cronología común); en la época de Amarna su rey Aitakkama escribió a Ajenatón. En mayo de 1274 a. C., en su año quinto, Ramsés II combatió al rey hitita Muwatalli II cerca de la ciudad, probablemente la mayor batalla de carros de la Antigüedad; ninguno de los dos bandos ganó claramente; el faraón se retiró a Egipto, y Cades quedó en la esfera hitita."
  de:
    - "Kadesch am Orontes war eine Stadt im Inneren Syriens, bei Tell Nebi Mend, wo ein Nebenfluss südwestlich von Homs nahe al-Qusair in den Orontes mündet. Die hellenistische Stadt Laodikeia am Libanon soll auf demselben Hügel gestanden haben. Maurice Pézard grub dort Anfang der 1920er Jahre für Frankreich, und ein Team des Institute of Archaeology des University College London unter Peter Parr von 1975 bis 1995."
    - "Im hebräischen Text der Volkszählung Davids kamen Joabs Männer „gen Gilead und ins Niederland Hodsi, und kamen gen Dan-Jaan und um Sidon her“. Der merkwürdige Name gilt allgemein als verderbt. Thenius und Hitzig vermuteten einen Hinweis auf Kadesch, und der lukianische griechische Text liest ins Land der Hethiter, nach Kadesch; die Revised Standard Version übernahm die Lesart nach Kadesch im Land der Hethiter. Ewald und andere lasen stattdessen Hermon. Ist die Verbesserung richtig, bezeichnet Kadesch die äußerste nördliche Grenze der Zählung."
    - "Kadesch führte die Koalition syrischer und kanaanäischer Könige an, die Thutmosis III. im fünfzehnten Jahrhundert v. Chr. (nach einer gängigen Chronologie 1457 v. Chr.) bei Megiddo besiegte; in der Amarna-Zeit schrieb sein König Aitakkama an Echnaton. Im Mai 1274 v. Chr., in seinem fünften Jahr, kämpfte Ramses II. nahe der Stadt gegen den hethitischen König Muwatalli II., wohl die größte Wagenschlacht der Antike; keine Seite siegte eindeutig, der Pharao zog sich nach Ägypten zurück, und Kadesch blieb im hethitischen Einflussbereich."
  fr:
    - "Qadesh sur l’Oronte était une ville de la Syrie intérieure, à Tell Nebi Mend, où un affluent rejoint l’Oronte au sud-ouest de Homs, près d’al-Qusayr. On pense que la cité hellénistique de Laodicée du Liban se dressait sur la même butte. Maurice Pézard y fouilla pour la France au début des années 1920, puis une équipe de l’Institute of Archaeology de l’University College de Londres sous la direction de Peter Parr de 1975 à 1995."
    - "L’hébreu du recensement de David porte que les hommes de Joab « allèrent en Galaad et dans le pays de Thachthim-Hodschi. Ils allèrent à Dan-Jaan, et aux environs de Sidon ». On tient généralement ce nom étrange pour corrompu. Thenius et Hitzig conjecturèrent une allusion à Qadesh, et le texte grec lucianique lit « au pays des Hittites, à Qadesh » ; la Revised Standard Version adopta la leçon « à Qadesh, au pays des Hittites ». Ewald et d’autres lisent plutôt Hermon. Si la correction est juste, Qadesh marque la limite nord extrême du recensement."
    - "Qadesh conduisit la coalition de rois syriens et cananéens que Thoutmosis III battit à Meguiddo au XVe siècle av. J.-C. (en 1457 av. J.-C. selon une chronologie courante) ; à l’époque d’Amarna, son roi Aitakkama écrivit à Akhénaton. En mai 1274 av. J.-C., la cinquième année de son règne, Ramsès II affronta le roi hittite Mouwatalli II près de la ville, probablement la plus grande bataille de chars de l’Antiquité ; aucun camp ne l’emporta nettement ; le pharaon se retira en Égypte, et Qadesh resta dans la sphère hittite."
  pt:
    - "Cades, no Orontes, era uma cidade do interior da Síria, em Tell Nebi Mend, onde um afluente se junta ao Orontes a sudoeste de Homs, perto de al-Qusayr. Pensa-se que a cidade helenística de Laodiceia do Líbano (Laodicea ad Libanum) ficava no mesmo montículo. Maurice Pézard escavou ali pela França no início da década de 1920, e uma equipe do Instituto de Arqueologia do University College London, sob Peter Parr, de 1975 a 1995."
    - "O hebraico do recenseamento de Davi diz que os homens de Joabe “chegaram a Gileade e à terra de Tatim-Hodsi; e chegaram a Dã-Jaã e contornaram até Sidom”. O nome estranho é geralmente tido como corrompido. Thenius e Hitzig conjecturaram uma referência a Cades, e o texto grego luciânico traz a terra dos hititas, Cades; a Revised Standard Version adotou a leitura Cades, na terra dos hititas. Ewald e outros leem Hermom em vez disso. Se a emenda está certa, Cades marca o limite extremo norte do recenseamento."
    - "Cades liderou a coalizão de reis sírios e cananeus que Tutmés III derrotou em Megido no século XV a.C. (em 1457 a.C., segundo uma cronologia comum); na época de Amarna, seu rei Aitakkama escreveu a Aquenaton. Em maio de 1274 a.C., em seu quinto ano, Ramsés II combateu o rei hitita Muwatalli II perto da cidade, provavelmente a maior batalha de carros da Antiguidade; nenhum dos lados venceu por completo; o faraó recuou para o Egito, e Cades permaneceu na esfera hitita."
  it:
    - "Kades sull’Oronte era una città della Siria interna, a Tell Nebi Mend, dove un affluente si unisce all’Oronte a sud-ovest di Homs, presso al-Qusayr. Si ritiene che la città ellenistica di Laodicea ad Libanum sorgesse sullo stesso tell. Maurice Pézard vi scavò per la Francia all’inizio degli anni Venti, e una squadra dell’Institute of Archaeology dell’University College London sotto Peter Parr dal 1975 al 1995."
    - "L’ebraico del censimento di Davide dice che gli uomini di Ioab «andarono in Galaad e nel paese di Tahtim-Hodshi; poi andarono Dan-Jaan e nei dintorni di Sidon». Lo strano nome è ritenuto in genere corrotto. Thenius e Hitzig congetturarono un riferimento a Kades, e il testo greco lucianeo legge «al paese degli Ittiti, a Kades»; la Revised Standard Version adottò la lettura «a Kades nel paese degli Ittiti». Ewald e altri leggono invece Ermon. Se l’emendamento è giusto, Kades segna il limite settentrionale estremo del censimento."
    - "Kades guidò la coalizione di re siriani e cananei che Tutmosi III sconfisse a Meghiddo nel XV secolo a.C. (nel 1457 a.C. secondo una cronologia comune); nell’età di Amarna il suo re Aitakkama scrisse ad Akhenaton. Nel maggio del 1274 a.C., nel suo quinto anno, Ramses II combatté il re ittita Muwatalli II presso la città, probabilmente la più grande battaglia di carri dell’antichità; nessuno dei due vinse nettamente; il faraone si ritirò in Egitto, e Kades rimase nella sfera ittita."
  nl:
    - "Kades aan de Orontes was een stad in het binnenland van Syrië, bij Tell Nebi Mend, waar een zijrivier in de Orontes uitmondt ten zuidwesten van Homs bij al-Qusayr. De hellenistische stad Laodicea ad Libanum zou op dezelfde heuvel hebben gestaan. Maurice Pézard groef er begin jaren twintig voor Frankrijk, en een team van het Institute of Archaeology van University College London onder Peter Parr van 1975 tot 1995."
    - "De Hebreeuwse tekst van de volkstelling onder David meldt dat Joabs mannen in Gilead kwamen en in het land Tahtim-Hodsji, en dat zij in Dan-Jaän kwamen en rondom naar Sidon. De vreemde naam wordt algemeen voor bedorven gehouden. Thenius en Hitzig vermoedden een verwijzing naar Kades, en de Lucianische Griekse tekst leest “naar het land van de Hettieten, naar Kades”; de Revised Standard Version nam de lezing “naar Kades in het land van de Hettieten” over. Ewald en anderen lazen in plaats daarvan Hermon. Als de emendatie juist is, markeert Kades de uiterste noordgrens van de volkstelling."
    - "Kades stond aan het hoofd van de coalitie van Syrische en Kanaänitische koningen die Thoetmosis III in de vijftiende eeuw v.Chr. (in 1457 v.Chr. volgens een gangbare chronologie) bij Megiddo versloeg; in de Amarnatijd schreef zijn koning Aitakkama aan Achnaton. In mei 1274 v.Chr., in zijn vijfde jaar, streed Ramses II tegen de Hettitische koning Muwatalli II bij de stad, waarschijnlijk de grootste wagenslag van de oudheid; geen van beide partijen won beslissend; de farao trok zich terug naar Egypte, en Kades bleef in de Hettitische invloedssfeer."
  pl:
    - "Kadesz nad Orontesem było miastem wewnętrznej Syrii, w Tell Nebi Mend, gdzie dopływ wpada do Orontesu na południowy zachód od Hims koło al-Kusajr. Uważa się, że hellenistyczne miasto Laodycea Libańska stało na tym samym wzgórzu. Maurice Pézard prowadził tam badania dla Francji na początku lat dwudziestych XX wieku, a zespół Institute of Archaeology University College London pod kierunkiem Petera Parra w latach 1975-1995."
    - "Hebrajski tekst spisu ludności Dawida mówi, że ludzie Joaba przyszli do Gileadu i do ziemi zwanej Tachtim-Chodszi, potem do Dan-Jaan i dookoła do Sydonu; tak ma Biblia Króla Jakuba. Ta dziwna nazwa jest powszechnie uważana za zepsutą. Thenius i Hitzig przypuszczali, że kryje się w niej Kadesz, a lucjański tekst grecki czyta „do ziemi Hetytów, do Kadesz”; Revised Standard Version przyjęła czytanie: do Kadesz w ziemi Hetytów. Ewald i inni czytają zamiast tego Hermon. Jeśli poprawka jest słuszna, Kadesz wyznacza daleką północną granicę spisu."
    - "Kadesz stało na czele koalicji królów syryjskich i kananejskich, którą Totmes III pokonał pod Megiddo w XV wieku p.n.e. (według jednej z powszechnie przyjętych chronologii w 1457 p.n.e.); w epoce amarneńskiej jego król Aitakkama pisał do Echnatona. W maju 1274 p.n.e., w piątym roku panowania, Ramzes II walczył z hetyckim królem Muwatallim II w pobliżu miasta, prawdopodobnie w największej bitwie rydwanów starożytności; żadna strona nie wygrała jednoznacznie, faraon wycofał się do Egiptu, a Kadesz pozostało w hetyckiej strefie wpływów."
  cs:
    - "Kádeš na Orontu bylo město vnitrozemské Sýrie, v Tell Nabí Mind, kde se přítok vlévá do Orontu jihozápadně od Homsu poblíž al-Kusajru. Má se za to, že helénistické město Laodikeia u Libanonu stálo na témže pahorku. Maurice Pézard tam kopal pro Francii na počátku 20. let 20. století a tým Institute of Archaeology při University College London pod vedením Petera Parra v letech 1975 až 1995."
    - "Hebrejský text zprávy o sčítání lidu za Davida říká, že Joábovi muži přišli do Gileadu a do země Tachtim-chodši a pak do Dan-jaanu a okolo k Sidonu. Podivné jméno se obecně pokládá za porušené. Thenius a Hitzig předpokládali odkaz na Kádeš a lukiánský řecký text čte „do země Chetitů, do Kádeše“; Revised Standard Version přijala čtení „do Kádeše v zemi Chetitů“. Ewald a jiní čtou místo toho Hermon. Je-li úprava správná, vyznačuje Kádeš nejzazší severní hranici sčítání."
    - "Kádeš vedl koalici syrských a kanaánských králů, kterou Thutmose III. porazil u Megida v patnáctém století př. n. l. (podle jedné běžné chronologie roku 1457 př. n. l.); v amarnské době psal jeho král Aitakkama Achnatonovi. V květnu 1274 př. n. l., ve svém pátém roce, bojoval Ramesse II. s chetitským králem Muwatallim II. nedaleko města, pravděpodobně v největší bitvě vozů starověku; žádná strana nezvítězila zcela, faraon se stáhl do Egypta a Kádeš zůstal v chetitské sféře vlivu."
  sv:
    - "Kadesh vid Orontes var en stad i Syriens inland, vid Tell Nebi Mend, där en biflod förenar sig med Orontes sydväst om Homs nära al-Qusayr. Den hellenistiska staden Laodikeia ad Libanum antas ha legat på samma kulle. Maurice Pézard grävde där för Frankrike i början av 1920-talet, och ett lag från Institute of Archaeology vid University College London under Peter Parr 1975–1995."
    - "Joavs män, heter det i den hebreiska texten i berättelsen om Davids folkräkning, drog genom landet: ”Därifrån kommo de till Gilead och Tatim-Hodsis land; sedan kommo de till Dan-Jaan och så runt omkring till Sidon”. Det besynnerliga namnet anses allmänt vara förvanskat. Thenius och Hitzig gissade att det avsåg Kadesh, och den lukianska grekiska texten har läsningen ”till hettiternas land, till Kadesh”; Revised Standard Version antog läsningen ”till Kadesh i hettiternas land”. Ewald och andra läser Hermon i stället. Om emendationen är riktig markerar Kadesh folkräkningens yttersta nordliga gräns."
    - "Kadesh ledde koalitionen av syriska och kanaaneiska konungar som Thutmosis III besegrade vid Megiddo på 1400-talet f.Kr. (1457 f.Kr. enligt en vanlig kronologi); under Amarnatiden skrev dess kung Aitakkama till Akhenaton. I maj 1274 f.Kr., i sitt femte regeringsår, stred Ramses II mot den hettitiske kungen Muwatalli II nära staden, sannolikt antikens största vagnsslag; ingen sida segrade klart; faraon drog sig tillbaka till Egypten, och Kadesh förblev i det hettitiska inflytandeområdet."
  nb:
    - "Kadesj ved Orontes var en by i det indre Syria, ved Tell Nebi Mend, der en sideelv løper sammen med Orontes sørvest for Homs nær al-Qusayr. Den hellenistiske byen Laodikea ad Libanum antas å ha ligget på den samme haugen. Maurice Pézard gravde ut stedet for Frankrike tidlig på 1920-tallet, og et lag fra Institute of Archaeology ved University College London under Peter Parr fra 1975 til 1995."
    - "Den hebraiske teksten i folketellingen under David lyder slik at Joabs menn kom til Gilead og til landet Tahtim-Hodsji, og at de kom til Dan-Ja'an og rundt omkring til Sidon. Det besynderlige navnet regnes alminnelig for å være ødelagt. Thenius og Hitzig gjettet på en henvisning til Kadesj, og den lukianske greske teksten har hettittenes land, Kadesj; Revised Standard Version tok i bruk lesemåten Kadesj i hettittenes land. Ewald og andre leser Hermon i stedet. Hvis rettelsen er riktig, markerer Kadesj den fjerne nordgrensen for folketellingen."
    - "Kadesj ledet koalisjonen av syriske og kanaanittiske konger som Thutmosis III beseiret ved Megiddo på 1400-tallet f.Kr. (1457 f.Kr. i én vanlig kronologi); i Amarna-tiden skrev kongen Aitakkama til Akhenaten. I mai 1274 f.Kr., i sitt femte regjeringsår, kjempet Ramses II mot den hettittiske kongen Muwatalli II i nærheten av byen, trolig oldtidens største stridsvognslag; ingen av sidene vant klart; farao trakk seg tilbake til Egypt, og Kadesj ble værende i hettittenes interessesfære."
scripture:
  - 2Sam.24.6
