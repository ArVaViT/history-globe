# Overview article (ADR 0007). Mainstream facts only; the Beqaa identification is the usual one, Baal-gad is left unlocated, and the alternative on the map is named.
id: valley-of-lebanon
place: ac2192b
title:
  en: "Valley of Lebanon"
  ru: "Долина Ливанская"
  uk: "Долина Ліванська"
  es: "Valle del Líbano"
  pt: "Vale do Líbano"
  de: "Libanontal"
  fr: "Vallée du Liban"
body:
  en:
    - "The valley of Lebanon is the northern limit of Joshua's conquests: he took the land “from the mount Halak, that goeth up to Seir, even unto Baal-gad in the valley of Lebanon under mount Hermon”, and the list of defeated kings repeats the phrase. The Hebrew biq'at ha-Lebanon, “the cleft of Lebanon”, is the long trough between the Lebanon and Anti-Lebanon ranges that the Greeks called Coele-Syria, “hollow Syria”, and that is today the Beqaa valley of Lebanon, some 120 km long and on average about 16 km wide, where the Orontes rises and flows north and the Litani south. Baal-gad, its town “under mount Hermon”, has not been located; the southern end of the valley near Hasbaya has been suggested, and the map keeps the upper Huleh valley as an alternative."
    - "The valley appears in no other biblical story, and the Bible knows it only as a boundary. In later ages it held the great sanctuary of Heliopolis, Baalbek, whose Roman temples of Jupiter and Bacchus still stand in part, and the Umayyad town of Anjar. Today the Beqaa is Lebanon's chief farming region, with Zahle its largest town and Baalbek its most visited ruin."
  ru:
    - "Долина Ливанская — северный предел завоеваний Иисуса Навина: он взял землю «от горы Халак, простирающейся к Сеиру, до Ваал-Гада в долине Ливанской, подле горы Ермона», и перечень побеждённых царей повторяет те же слова. Еврейское бикат ха-Леванон, «расселина Ливана», — длинная впадина между хребтами Ливан и Антиливан, которую греки звали Келесирией, «полой Сирией», а сегодня это долина Бекаа в Ливане, около 120 км в длину и в среднем около 16 км в ширину, где берёт начало Оронт, текущий на север, и Литани, текущая на юг. Ваал-Гад, её город «подле горы Ермона», не найден; предлагали южный конец долины близ Хасбайи, а карта хранит как альтернативу верхнюю часть долины Хула."
    - "Ни в одном другом библейском рассказе долина не участвует: Библия знает её только как границу. В позднейшие века здесь стояло великое святилище Гелиополя, Баальбека, чьи римские храмы Юпитера и Вакха отчасти стоят до сих пор, и омейядский город Анджар. Сегодня Бекаа — главная земледельческая область Ливана; самый большой её город — Захле, а самые посещаемые развалины — Баальбек."
  uk:
    - "Долина Ліванська — північна межа завоювань Ісуса Навина: він узяв землю «Від гори Халак, що тягнесь до Сеїру, аж до Баал-Гаду в Ливанській долинї під Ермоном», і перелік переможених царів повторює цю фразу. Староєврейське бік’ат га-Леванон, «розколина Лівану», — довге зниження між хребтами Лівану й Антиліван, яке греки називали Келесирією, «порожнистою Сирією», і яке нині є долиною Бекаа в Лівані, завдовжки близько 120 км і завширшки в середньому близько 16 км, де бере початок Оронт, що тече на північ, і Літані, що тече на південь. Ваал-Гад, її місто «під Ермоном», не локалізований; пропонували південний кінець долини поблизу Хасбеї, а мапа зберігає як альтернативу верхню долину Хула."
    - "Долина не з’являється в жодній іншій біблійній розповіді, і Біблія знає її лише як межу. У пізніші віки в ній було велике святилище Геліополя, Баальбек, чиї римські храми Юпітера й Бахуса частково стоять досі, та омеяддське місто Анджар. Нині Бекаа — головний землеробський район Лівану, з Захле як найбільшим містом і Баальбеком як найвідвідуванішою руїною."
  es:
    - "El valle del Líbano es el límite septentrional de las conquistas de Josué: tomó la tierra «Desde el monte de Halac, que sube hasta Seir, hasta Baal-gad en la llanura del Líbano, á las raíces del monte Hermón», y la lista de los reyes derrotados repite la frase. El hebreo biq'at ha-Lebanon, «la hendidura del Líbano», es la larga depresión entre las cordilleras del Líbano y del Antilíbano que los griegos llamaban Celesiria, «Siria hueca», y que es hoy el valle de la Beqaa, en el Líbano, de unos 120 km de largo y unos 16 km de ancho en promedio, donde nace el Orontes, que corre hacia el norte, y el Litani, hacia el sur. Baal-gad, su ciudad «á las raíces del monte Hermón», no ha sido localizada; se ha sugerido el extremo sur del valle cerca de Hasbaya, y el mapa conserva el valle superior del Hule como alternativa."
    - "El valle no aparece en ninguna otra historia bíblica, y la Biblia solo lo conoce como un límite. En épocas posteriores albergó el gran santuario de Heliópolis, Baalbek, cuyos templos romanos de Júpiter y de Baco aún se mantienen en parte, y la ciudad omeya de Anjar. Hoy la Beqaa es la principal región agrícola del Líbano, con Zahle como su mayor ciudad y Baalbek como su ruina más visitada."
  pt:
    - "O vale do Líbano é o limite norte das conquistas de Josué: ele tomou a terra “desde o monte Halaque, que sobe para Seir, até Baal-Gade, no vale do Líbano, ao pé do monte Hermom”, e a lista dos reis derrotados repete a expressão. O hebraico biq'at ha-Lebanon, “a fenda do Líbano”, é a longa depressão entre as cadeias do Líbano e do Antilíbano que os gregos chamavam Celessíria, “Síria oca”, e que é hoje o vale de Beqaa, no Líbano, com cerca de 120 km de comprimento e em média 16 km de largura, onde o Orontes nasce e corre para o norte e o Litani para o sul. Baal-Gade, sua cidade “ao pé do monte Hermom”, não foi localizada; sugeriu-se a extremidade sul do vale perto de Hasbaya, e o mapa mantém o alto vale de Hula como alternativa."
    - "O vale não aparece em nenhuma outra história bíblica, e a Bíblia só o conhece como fronteira. Em épocas posteriores abrigou o grande santuário de Heliópolis, Baalbek, cujos templos romanos de Júpiter e de Baco ainda estão em parte de pé, e a cidade omíada de Anjar. Hoje a Beqaa é a principal região agrícola do Líbano, com Zahle como maior cidade e Baalbek como a ruína mais visitada."
  de:
    - "Das Libanontal ist die Nordgrenze der Eroberungen Josuas: Er nahm das Land „von dem kahlen Gebirge an, das aufsteigt gen Seir, bis gen Baal-Gad in der Ebene beim Berge Libanon, unten am Berge Hermon“, und die Liste der besiegten Könige wiederholt die Wendung. Das hebräische biq'at ha-Levanon, „die Spalte des Libanon“, ist die lange Senke zwischen den Gebirgen Libanon und Antilibanon, die die Griechen Koilesyrien, „hohles Syrien“, nannten und die heute die Beqaa-Ebene im Libanon ist, rund 120 km lang und im Durchschnitt etwa 16 km breit, wo der Orontes entspringt und nach Norden und der Litani nach Süden fließt. Baal-Gad, ihre Stadt „unten am Berge Hermon“, ist nicht lokalisiert; das Südende des Tals bei Hasbaya wurde vorgeschlagen, und die Karte behält das obere Huletal als Alternative."
    - "Das Tal erscheint in keiner anderen biblischen Geschichte, und die Bibel kennt es nur als Grenze. In späteren Zeiten barg es das große Heiligtum von Heliopolis, Baalbek, dessen römische Tempel des Jupiter und des Bacchus teilweise noch stehen, und die umayyadische Stadt Anjar. Heute ist die Beqaa die wichtigste Landwirtschaftsregion des Libanon, mit Zahle als größter Stadt und Baalbek als meistbesuchter Ruine."
  fr:
    - "La vallée du Liban est la limite nord des conquêtes de Josué : il prit le pays « depuis la montagne nue qui s’élève vers Séir jusqu’à Baal-Gad, dans la vallée du Liban, au pied de la montagne d’Hermon », et la liste des rois vaincus répète l’expression. L’hébreu biq’at ha-Lebanon, « la fente du Liban », est la longue dépression entre le Liban et l’Anti-Liban que les Grecs appelaient Cœlé-Syrie, « Syrie creuse », et qui est aujourd’hui la vallée de la Beqaa, au Liban, longue d’environ 120 km et large en moyenne d’environ 16 km, où l’Oronte naît et coule vers le nord, et le Litani vers le sud. Baal-Gad, sa ville « au pied de la montagne d’Hermon », n’a pas été localisée ; l’extrémité sud de la vallée près de Hasbaya a été proposée, et la carte garde la haute vallée de la Houla comme variante."
    - "La vallée n’apparaît dans aucun autre récit biblique, et la Bible ne la connaît que comme une limite. Plus tard, elle abrita le grand sanctuaire d’Héliopolis, Baalbek, dont les temples romains de Jupiter et de Bacchus subsistent en partie, et la ville omeyyade d’Anjar. Aujourd’hui, la Beqaa est la principale région agricole du Liban, avec Zahlé pour plus grande ville et Baalbek pour ruine la plus visitée."
scripture:
  - Josh.11.16-Josh.11.17
  - Josh.12.7
sources:
