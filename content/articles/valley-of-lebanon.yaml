# Overview article (ADR 0007). Mainstream facts only; the Beqaa identification is the usual one, Baal-gad is left unlocated, and the alternative on the map is named.
id: valley-of-lebanon
place: ac2192b
title:
  en: "Valley of Lebanon"
  ru: "Долина Ливанская"
  uk: "Долина Ліванська"
  es: "Valle del Líbano"
  pt: "Vale do Líbano"
  de: "Libanontal"
  fr: "Vallée du Liban"
  pl: "Dolina Libanu"
  it: "Valle del Libano"
  nl: "Dal van de Libanon"
  cs: "Libanonské údolí"
  sv: "Libanondalen"
  nb: "Libanon-dalen"
  tl: "Libis ng Libano"
  da: "Libanons Dal"
  sr: "Долина Ливанска"
body:
  en:
    - "The valley of Lebanon is the northern limit of Joshua's conquests: he took the land “from the mount Halak, that goeth up to Seir, even unto Baal-gad in the valley of Lebanon under mount Hermon”, and the list of defeated kings repeats the phrase. The Hebrew biq'at ha-Lebanon, “the cleft of Lebanon”, is the long trough between the Lebanon and Anti-Lebanon ranges that the Greeks called Coele-Syria, “hollow Syria”, and that is today the Beqaa valley of Lebanon, some 120 km long and on average about 16 km wide, where the Orontes rises and flows north and the Litani south. Baal-gad, its town “under mount Hermon”, has not been located; the southern end of the valley near Hasbaya has been suggested, and the map keeps the upper Huleh valley as an alternative."
    - "The valley appears in no other biblical story, and the Bible knows it only as a boundary. In later ages it held the great sanctuary of Heliopolis, Baalbek, whose Roman temples of Jupiter and Bacchus still stand in part, and the Umayyad town of Anjar. Today the Beqaa is Lebanon's chief farming region, with Zahle its largest town and Baalbek its most visited ruin."
  ru:
    - "Долина Ливанская — северный предел завоеваний Иисуса Навина: он взял землю «от горы Халак, простирающейся к Сеиру, до Ваал-Гада в долине Ливанской, подле горы Ермона», и перечень побеждённых царей повторяет те же слова. Еврейское бикат ха-Леванон, «расселина Ливана», — длинная впадина между хребтами Ливан и Антиливан, которую греки звали Келесирией, «полой Сирией», а сегодня это долина Бекаа в Ливане, около 120 км в длину и в среднем около 16 км в ширину, где берёт начало Оронт, текущий на север, и Литани, текущая на юг. Ваал-Гад, её город «подле горы Ермона», не найден; предлагали южный конец долины близ Хасбайи, а карта хранит как альтернативу верхнюю часть долины Хула."
    - "Ни в одном другом библейском рассказе долина не участвует: Библия знает её только как границу. В позднейшие века здесь стояло великое святилище Гелиополя, Баальбека, чьи римские храмы Юпитера и Вакха отчасти стоят до сих пор, и омейядский город Анджар. Сегодня Бекаа — главная земледельческая область Ливана; самый большой её город — Захле, а самые посещаемые развалины — Баальбек."
  uk:
    - "Долина Ліванська — північна межа завоювань Ісуса Навина: він узяв землю «Від гори Халак, що тягнесь до Сеїру, аж до Баал-Гаду в Ливанській долинї під Ермоном», і перелік переможених царів повторює цю фразу. Староєврейське бік’ат га-Леванон, «розколина Лівану», — довге зниження між хребтами Лівану й Антиліван, яке греки називали Келесирією, «порожнистою Сирією», і яке нині є долиною Бекаа в Лівані, завдовжки близько 120 км і завширшки в середньому близько 16 км, де бере початок Оронт, що тече на північ, і Літані, що тече на південь. Ваал-Гад, її місто «під Ермоном», не локалізований; пропонували південний кінець долини поблизу Хасбеї, а мапа зберігає як альтернативу верхню долину Хула."
    - "Долина не з’являється в жодній іншій біблійній розповіді, і Біблія знає її лише як межу. У пізніші віки в ній було велике святилище Геліополя, Баальбек, чиї римські храми Юпітера й Бахуса частково стоять досі, та омеяддське місто Анджар. Нині Бекаа — головний землеробський район Лівану, з Захле як найбільшим містом і Баальбеком як найвідвідуванішою руїною."
  es:
    - "El valle del Líbano es el límite septentrional de las conquistas de Josué: tomó la tierra «Desde el monte de Halac, que sube hasta Seir, hasta Baal-gad en la llanura del Líbano, á las raíces del monte Hermón», y la lista de los reyes derrotados repite la frase. El hebreo biq'at ha-Lebanon, «la hendidura del Líbano», es la larga depresión entre las cordilleras del Líbano y del Antilíbano que los griegos llamaban Celesiria, «Siria hueca», y que es hoy el valle de la Beqaa, en el Líbano, de unos 120 km de largo y unos 16 km de ancho en promedio, donde nace el Orontes, que corre hacia el norte, y el Litani, hacia el sur. Baal-gad, su ciudad «á las raíces del monte Hermón», no ha sido localizada; se ha sugerido el extremo sur del valle cerca de Hasbaya, y el mapa conserva el valle superior del Hule como alternativa."
    - "El valle no aparece en ninguna otra historia bíblica, y la Biblia solo lo conoce como un límite. En épocas posteriores albergó el gran santuario de Heliópolis, Baalbek, cuyos templos romanos de Júpiter y de Baco aún se mantienen en parte, y la ciudad omeya de Anjar. Hoy la Beqaa es la principal región agrícola del Líbano, con Zahle como su mayor ciudad y Baalbek como su ruina más visitada."
  pt:
    - "O vale do Líbano é o limite norte das conquistas de Josué: ele tomou a terra “desde o monte Halaque, que sobe para Seir, até Baal-Gade, no vale do Líbano, ao pé do monte Hermom”, e a lista dos reis derrotados repete a expressão. O hebraico biq'at ha-Lebanon, “a fenda do Líbano”, é a longa depressão entre as cadeias do Líbano e do Antilíbano que os gregos chamavam Celessíria, “Síria oca”, e que é hoje o vale de Beqaa, no Líbano, com cerca de 120 km de comprimento e em média 16 km de largura, onde o Orontes nasce e corre para o norte e o Litani para o sul. Baal-Gade, sua cidade “ao pé do monte Hermom”, não foi localizada; sugeriu-se a extremidade sul do vale perto de Hasbaya, e o mapa mantém o alto vale de Hula como alternativa."
    - "O vale não aparece em nenhuma outra história bíblica, e a Bíblia só o conhece como fronteira. Em épocas posteriores abrigou o grande santuário de Heliópolis, Baalbek, cujos templos romanos de Júpiter e de Baco ainda estão em parte de pé, e a cidade omíada de Anjar. Hoje a Beqaa é a principal região agrícola do Líbano, com Zahle como maior cidade e Baalbek como a ruína mais visitada."
  de:
    - "Das Libanontal ist die Nordgrenze der Eroberungen Josuas: Er nahm das Land „von dem kahlen Gebirge an, das aufsteigt gen Seir, bis gen Baal-Gad in der Ebene beim Berge Libanon, unten am Berge Hermon“, und die Liste der besiegten Könige wiederholt die Wendung. Das hebräische biq'at ha-Levanon, „die Spalte des Libanon“, ist die lange Senke zwischen den Gebirgen Libanon und Antilibanon, die die Griechen Koilesyrien, „hohles Syrien“, nannten und die heute die Beqaa-Ebene im Libanon ist, rund 120 km lang und im Durchschnitt etwa 16 km breit, wo der Orontes entspringt und nach Norden und der Litani nach Süden fließt. Baal-Gad, ihre Stadt „unten am Berge Hermon“, ist nicht lokalisiert; das Südende des Tals bei Hasbaya wurde vorgeschlagen, und die Karte behält das obere Huletal als Alternative."
    - "Das Tal erscheint in keiner anderen biblischen Geschichte, und die Bibel kennt es nur als Grenze. In späteren Zeiten barg es das große Heiligtum von Heliopolis, Baalbek, dessen römische Tempel des Jupiter und des Bacchus teilweise noch stehen, und die umayyadische Stadt Anjar. Heute ist die Beqaa die wichtigste Landwirtschaftsregion des Libanon, mit Zahle als größter Stadt und Baalbek als meistbesuchter Ruine."
  fr:
    - "La vallée du Liban est la limite nord des conquêtes de Josué : il prit le pays « depuis la montagne nue qui s’élève vers Séir jusqu’à Baal-Gad, dans la vallée du Liban, au pied de la montagne d’Hermon », et la liste des rois vaincus répète l’expression. L’hébreu biq’at ha-Lebanon, « la fente du Liban », est la longue dépression entre le Liban et l’Anti-Liban que les Grecs appelaient Cœlé-Syrie, « Syrie creuse », et qui est aujourd’hui la vallée de la Beqaa, au Liban, longue d’environ 120 km et large en moyenne d’environ 16 km, où l’Oronte naît et coule vers le nord, et le Litani vers le sud. Baal-Gad, sa ville « au pied de la montagne d’Hermon », n’a pas été localisée ; l’extrémité sud de la vallée près de Hasbaya a été proposée, et la carte garde la haute vallée de la Houla comme variante."
    - "La vallée n’apparaît dans aucun autre récit biblique, et la Bible ne la connaît que comme une limite. Plus tard, elle abrita le grand sanctuaire d’Héliopolis, Baalbek, dont les temples romains de Jupiter et de Bacchus subsistent en partie, et la ville omeyyade d’Anjar. Aujourd’hui, la Beqaa est la principale région agricole du Liban, avec Zahlé pour plus grande ville et Baalbek pour ruine la plus visitée."
  pl:
    - "Dolina Libanu jest północną granicą podbojów Jozuego: zajął ziemię „Od góry Halak, która idzie ku Seir, aż do Baalgad, w równinie Libańskiej pod górą Hermon”, a lista pokonanych królów powtarza to sformułowanie. Hebrajskie bik'at ha-Lewanon, „rozpadlina Libanu”, to długie zagłębienie między pasmami Libanu i Antylibanu, które Grecy nazywali Celesyrią, „Syrią dolną”, a które jest dziś doliną Bekaa w Libanie, mającą około 120 km długości i przeciętnie około 16 km szerokości, gdzie Orontes bierze początek i płynie na północ, a Litani na południe. Baal-Gad, jej miasta „pod górą Hermon”, nie umiejscowiono; sugerowano południowy kraniec doliny koło Haszbai, a mapa zachowuje górną dolinę Chula jako alternatywę."
    - "Dolina nie występuje w żadnej innej opowieści biblijnej, a Biblia zna ją tylko jako granicę. W późniejszych wiekach mieściło się w niej wielkie sanktuarium Heliopolis, Baalbek, którego rzymskie świątynie Jowisza i Bachusa częściowo wciąż stoją, oraz umajjadzkie miasto Andżar. Dziś Bekaa jest głównym regionem rolniczym Libanu, z Zahlą jako największym miastem i Baalbekiem jako najczęściej odwiedzaną ruiną."
  it:
    - "La valle del Libano è il limite settentrionale delle conquiste di Giosuè: egli prese il paese «dalla montagna brulla che s’eleva verso Seir, fino a Baal-Gad nella valle del Libano appiè del monte Hermon», e l’elenco dei re sconfitti ripete la formula. L’ebraico biq’at ha-Lebanon, «la fenditura del Libano», è la lunga depressione fra le catene del Libano e dell’Antilibano che i Greci chiamavano Celesiria, «Siria cava», e che è oggi la valle della Beqa in Libano, lunga circa 120 km e larga in media circa 16 km, dove l’Oronte nasce e scorre a nord e il Litani a sud. Baal-Gad, la sua città «appiè del monte Hermon», non è stata localizzata; è stata proposta l’estremità meridionale della valle presso Hasbaya, e la mappa conserva come alternativa l’alta valle di Hula."
    - "La valle non compare in nessun altro racconto biblico, e la Bibbia la conosce solo come confine. In epoche posteriori ospitò il grande santuario di Eliopoli, Baalbek, i cui templi romani di Giove e di Bacco restano in parte in piedi, e la città omayyade di Anjar. Oggi la Beqa è la principale regione agricola del Libano, con Zahle come città maggiore e Baalbek come rovina più visitata."
  nl:
    - "Het dal van de Libanon is de noordgrens van de veroveringen van Jozua: hij nam het land in “van den kalen berg, die opwaarts naar Seir gaat, tot Baal-Gad toe, in het dal van den Libanon, onder aan den berg Hermon”, en de lijst van verslagen koningen herhaalt de uitdrukking. Het Hebreeuwse biq’at ha-Lebanon, “de kloof van de Libanon”, is de lange trog tussen de gebergten Libanon en Anti-Libanon die de Grieken Coele-Syrië noemden, “Holle Syrië”, en die tegenwoordig de Beqaa-vallei van Libanon is, zo’n 120 km lang en gemiddeld ongeveer 16 km breed, waar de Orontes ontspringt en naar het noorden stroomt en de Litani naar het zuiden. Baäl-Gad, haar stad “onder aan den berg Hermon”, is niet gelokaliseerd; het zuidelijke einde van de vallei bij Hasbaya is voorgesteld, en de kaart houdt de bovenste Huleh-vallei als alternatief."
    - "De vallei komt in geen ander Bijbels verhaal voor, en de Bijbel kent haar alleen als grens. In latere tijden herbergde ze het grote heiligdom van Heliopolis, Baalbek, waarvan de Romeinse tempels van Jupiter en Bacchus nog gedeeltelijk staan, en de Omajjadische stad Anjar. Tegenwoordig is de Beqaa het voornaamste landbouwgebied van Libanon, met Zahle als grootste stad en Baalbek als meest bezochte ruïne."
  cs:
    - "Libanonské údolí je severní hranicí Jozuových výbojů: vzal zemi „od hory Halak, kteráž se táhne do Seir, až k Balgad na rovině Libánské, pod horou Hermon“ a seznam poražených králů tento obrat opakuje. Hebrejské biq'at ha-Lebanon, „rozsedlina Libanonu“, je dlouhý žlab mezi pohořími Libanon a Antilibanon, který Řekové nazývali Koilé Syria, „dutá Sýrie“, a který je dnes libanonským údolím Bikáa, dlouhým asi 120 km a v průměru asi 16 km širokým, kde pramení Orontés a teče na sever a Lítání na jih. Báal-gad, jeho město „pod horou Hermon“, nebylo lokalizováno; navrhován byl jižní konec údolí poblíž Hasbajá a mapa ponechává horní údolí Chúla jako alternativu."
    - "Údolí se neobjevuje v žádném jiném biblickém příběhu a Bible je zná jen jako hranici. V pozdějších věcích v něm stála velká svatyně Héliopole, Baalbek, jehož římské chrámy Jupiterův a Bakchův dosud částečně stojí, a umajjovské město Andžar. Dnes je Bikáa hlavní zemědělskou oblastí Libanonu, se Zahlé jako největším městem a Baalbekem jako nejnavštěvovanější zříceninou."
  sv:
    - "Libanondalen är den norra gränsen för Josuas erövringar: han tog landet ”från Halakberget, som höjer sig mot Seir, ända till Baal-Gad i Libanonsdalen nedanför berget Hermon”, och förteckningen över besegrade kungar upprepar uttrycket. Det hebreiska biq'at ha-Lebanon, ”Libanons klyfta”, är det långa tråget mellan bergskedjorna Libanon och Anti-Libanon som grekerna kallade Koile Syria, ”det ihåliga Syrien”, och som i dag är Beqaadalen i Libanon, omkring 120 km lång och i genomsnitt omkring 16 km bred, där Orontes har sitt ursprung och flyter norrut och Litani söderut. Baal-Gad, dess stad ”nedanför berget Hermon”, har inte lokaliserats; dalens södra ände nära Hasbaya har föreslagits, och kartan behåller övre Huladalen som alternativ."
    - "Dalen förekommer i ingen annan bibelberättelse, och Bibeln känner den bara som en gräns. Under senare tider rymde den den stora helgedomen i Heliopolis, Baalbek, vars romerska tempel åt Jupiter och Bacchus delvis står kvar, och den umayyadiska staden Anjar. I dag är Beqaa Libanons främsta jordbruksregion, med Zahle som största stad och Baalbek som mest besökta ruin."
  nb:
    - "Libanon-dalen er den nordlige grensen for Josvas erobringer: han tok landet «fra det nakne fjell som strekker sig op imot Se'ir, til Ba'al-Gad i Libanon-dalen ved foten av Hermon-fjellet», og listen over de slåtte kongene gjentar uttrykket. Det hebraiske biq'at ha-Lebanon, «Libanons kløft», er det lange søkket mellom fjellkjedene Libanon og Anti-Libanon som grekerne kalte Koilesyria, «hule Syria», og som i dag er Bekaa-dalen i Libanon, omkring 120 km lang og i gjennomsnitt omkring 16 km bred, der Orontes har sitt utspring og renner nordover og Litani sørover. Baal-Gad, byen «ved foten av Hermon-fjellet», er ikke lokalisert; den sørlige enden av dalen nær Hasbaya er foreslått, og kartet beholder øvre Hula-dalen som et alternativ."
    - "Dalen forekommer ikke i noen annen bibelsk fortelling, og Bibelen kjenner den bare som en grense. I senere tider rommet den den store helligdommen i Heliopolis, Baalbek, hvis romerske templer for Jupiter og Bacchus delvis fortsatt står, og umayyadenes by Anjar. I dag er Bekaa Libanons viktigste jordbruksregion, med Zahle som største by og Baalbek som den mest besøkte ruinen."
  tl:
    - "Ang libis ng Libano ang hilagang hangganan ng mga pananakop ni Josue: kinuha niya ang lupain “Mula sa bundok ng Halac na paahon sa Seir, hanggang sa Baal-gad sa libis ng Libano sa ibaba ng bundok Hermon”, at inuulit ng talaan ng mga natalong hari ang pariralang iyon. Ang Hebreong biq'at ha-Levanon, “ang biyak ng Libano”, ay ang mahabang lambak sa pagitan ng mga hanay ng Libano at Anti-Libano na tinawag ng mga Griego na Coele-Siria, “guwang na Siria”, at na ngayon ay ang libis ng Beqaa ng Libano, mga 120 km ang haba at karaniwang mga 16 km ang luwang, kung saan nagmumula ang Orontes at dumadaloy pahilaga at ang Litani patimog. Ang Baal-gad, ang bayan nito “sa ibaba ng bundok Hermon”, ay hindi pa natutukoy; iminungkahi ang timugang dulo ng libis malapit sa Hasbaya, at pinananatili ng mapa ang itaas na libis ng Huleh bilang alternatibo."
    - "Ang libis ay hindi lumilitaw sa ibang kuwento sa Biblia, at kilala ito ng Biblia bilang hangganan lamang. Sa mga huling panahon, nasa loob nito ang dakilang santuwaryo ng Heliopolis, Baalbek, na ang mga templong Romano ni Jupiter at ni Baco ay bahagyang nakatayo pa, at ang bayang Umayyad ng Anjar. Ngayon ang Beqaa ang pangunahing rehiyong bukirin ng Libano, na ang Zahle ang pinakamalaking bayan at ang Baalbek ang pinakadinadalaw na guho."
  da:
    - "Libanons Dal er den nordlige grænse for Josvas erobringer: han tog landet »fra det slette Bjerg, som strækker sig op mod Sejr, og indtil Baal-Gad ved Libanons Dal neden for det Bjerg Hermon«, og listen over besejrede konger gentager vendingen. Det hebraiske biq'at ha-Levanon, »Libanons kløft«, er det lange trug mellem Libanon- og Anti-Libanon-bjergkæderne, som grækerne kaldte Koile-Syria, »det hule Syrien«, og som i dag er Bekaadalen i Libanon, omkring 120 km lang og i gennemsnit omkring 16 km bred, hvor Orontes udspringer og flyder nordpå og Litani sydpå. Ba'al-Gad, dens by »neden for Hermons Bjerg«, er ikke lokaliseret; dalens sydlige ende nær Hasbaya er blevet foreslået, og kortet beholder den øvre Huleh-dal som et alternativ."
    - "Dalen optræder i ingen anden bibelsk historie, og Bibelen kender den kun som en grænse. I senere tidsaldre rummede den den store helligdom Heliopolis, Baalbek, hvis romerske templer for Jupiter og Bacchus stadig delvist står, og umayyadernes by Anjar. I dag er Bekaa Libanons vigtigste landbrugsregion, med Zahle som største by og Baalbek som mest besøgte ruin."
  sr:
    - "Долина Ливанска је северна граница Исусових освајања: узео је земљу „од горе Алака, која се пружа к Сиру, до Вал-Гада у пољу ливанском, под гором Ермоном“, а списак поражених царева понавља ту формулу. Хебрејско бик’ат ха-Ливнан, „расцеп Ливана“, јесте дуго корито између гребена Ливана и Антиливана које су Грци звали Келесирија, „шупља Сирија“, и које је данас долина Бекаа у Ливану, дуга око 120 км и у просеку широка око 16 км, где Оронт извире и тече на север, а Литани на југ. Положај Вал-Гада, њеног града „под гором Ермоном“, није утврђен; предложен је јужни крај долине код Хасбеје, а карта као алтернативу чува горњу долину Хуле."
    - "Долина се не јавља ни у једној другој библијској причи, а Библија је зна само као границу. У каснијим добима носила је велико светилиште Хелиополиса, Баалбек, чији римски храмови Јупитера и Бахуса још делимично стоје, и омајадски град Анџар. Данас је Бекаа главни пољопривредни крај Ливана, са Захлеом као највећим градом и Баалбеком као најпосећенијом рушевином."
scripture:
  - Josh.11.16-Josh.11.17
  - Josh.12.7
sources:
  - "Y. Aharoni, The Land of the Bible: A Historical Geography (2nd ed., 1979)"
  - "A. F. Rainey and R. S. Notley, The Sacred Bridge: Carta's Atlas of the Biblical World (2006)"
  - "Z. Kallai, Historical Geography of the Bible: The Tribal Territories of Israel (1986)"
  - "'Baal-Gad', in D. N. Freedman (ed.), The Anchor Bible Dictionary (1992)"
