body:
  en:
    - "The valley of Lebanon is the northern limit of Joshua's conquests: he took the land “from the mount Halak, that goeth up to Seir, even unto Baal-gad in the valley of Lebanon under mount Hermon”, and the list of defeated kings repeats the phrase. The Hebrew biq'at ha-Lebanon, “the cleft of Lebanon”, is the long trough between the Lebanon and Anti-Lebanon ranges that the Greeks called Coele-Syria, “hollow Syria”, and that is today the Beqaa valley of Lebanon, some 120 km long and on average about 16 km wide, where the Orontes rises and flows north and the Litani south. Baal-gad, its town “under mount Hermon”, has not been located; the southern end of the valley near Hasbaya has been suggested, and the map keeps the upper Huleh valley as an alternative."
    - "The valley appears in no other biblical story, and the Bible knows it only as a boundary. In later ages it held the great sanctuary of Heliopolis, Baalbek, whose Roman temples of Jupiter and Bacchus still stand in part, and the Umayyad town of Anjar. Today the Beqaa is Lebanon's chief farming region, with Zahle its largest town and Baalbek its most visited ruin."
    - "Greek historians and geographers describe the valley in more detail. Polybius tells how Antiochus III entered the defile he calls Marsyas, a narrow passage between Libanus and Antilibanus broken by marshes and lakes, and failed to force it because Theodotus the Aetolian held its forts at Gerrha and Brochi. Strabo calls it the Massyas plain: farmers worked the valley floor, while Ituraeans and Arabians in the mountains lived by robbery, and Chalcis served as its acropolis. He adds that the Massyas belonged to Ptolemy son of Mennaeus, whom Josephus calls ruler of Chalcis under Mount Libanus. Eusebius writes that Constantine outlawed a custom of prostitution at Heliopolis, built a large church there and gave the city its first bishop and clergy."
  ru:
    - "Долина Ливанская — северный предел завоеваний Иисуса Навина: он взял землю «от горы Халак, простирающейся к Сеиру, до Ваал-Гада в долине Ливанской, подле горы Ермона», и перечень побеждённых царей повторяет те же слова. Еврейское бикат ха-Леванон, «расселина Ливана», — длинная впадина между хребтами Ливан и Антиливан, которую греки звали Келесирией, «полой Сирией», а сегодня это долина Бекаа в Ливане, около 120 км в длину и в среднем около 16 км в ширину, где берёт начало Оронт, текущий на север, и Литани, текущая на юг. Ваал-Гад, её город «подле горы Ермона», не найден; предлагали южный конец долины близ Хасбайи, а карта хранит как альтернативу верхнюю часть долины Хула."
    - "Ни в одном другом библейском рассказе долина не участвует: Библия знает её только как границу. В позднейшие века здесь стояло великое святилище Гелиополя, Баальбека, чьи римские храмы Юпитера и Вакха отчасти стоят до сих пор, и омейядский город Анджар. Сегодня Бекаа — главная земледельческая область Ливана; самый большой её город — Захле, а самые посещаемые развалины — Баальбек."
    - "Греческие историки и географы описывают долину подробнее. Полибий рассказывает, как Антиох III вошёл в теснину, которую он называет Марсием, — узкий проход между Ливаном и Антиливаном, перебиваемый болотами и озёрами, — но не смог прорваться, потому что Феодот Этолиец держал её крепости Герру и Брохи. Страбон называет её равниной Массиас: дно долины возделывали земледельцы, итурейцы же и арабы в горах жили разбоем, а Халкида служила ей как бы акрополем. Он добавляет, что Массиас принадлежал Птолемею, сыну Меннея, которого Иосиф Флавий называет правителем Халкиды под горой Ливаном. Евсевий пишет, что Константин запретил в Гелиополе обычай блуда, построил там большую церковь и дал городу первого епископа и клир."
  uk:
    - "Долина Ліванська — північна межа завоювань Ісуса Навина: він узяв землю «Від гори Халак, що тягнесь до Сеїру, аж до Баал-Гаду в Ливанській долинї під Ермоном», і перелік переможених царів повторює цю фразу. Староєврейське бік’ат га-Леванон, «розколина Лівану», — довге зниження між хребтами Лівану й Антиліван, яке греки називали Келесирією, «порожнистою Сирією», і яке нині є долиною Бекаа в Лівані, завдовжки близько 120 км і завширшки в середньому близько 16 км, де бере початок Оронт, що тече на північ, і Літані, що тече на південь. Ваал-Гад, її місто «під Ермоном», не локалізований; пропонували південний кінець долини поблизу Хасбеї, а мапа зберігає як альтернативу верхню долину Хула."
    - "Долина не з’являється в жодній іншій біблійній розповіді, і Біблія знає її лише як межу. У пізніші віки в ній було велике святилище Геліополя, Баальбек, чиї римські храми Юпітера й Бахуса частково стоять досі, та омеяддське місто Анджар. Нині Бекаа — головний землеробський район Лівану, з Захле як найбільшим містом і Баальбеком як найвідвідуванішою руїною."
    - "Грецькі історики й географи описують долину докладніше. Полібій розповідає, як Антіох III увійшов в ущелину, яку він називає Марсієм, — вузький прохід між Ліваном і Антиліваном, перерізаний болотами й озерами, — але не зміг прорватися, бо Теодот Етолієць тримав її фортеці Герру і Брохи. Страбон називає її рівниною Массіас: дно долини обробляли хлібороби, ітурейці ж і араби в горах жили розбоєм, а Халкіда була ніби її акрополем. Він додає, що Массіас належав Птолемею, синові Меннея, якого Йосип Флавій називає правителем Халкіди під горою Ліван. Євсевій пише, що Костянтин заборонив у Геліополі звичай розпусти, збудував там велику церкву й дав місту першого єпископа та клір."
  es:
    - "El valle del Líbano es el límite septentrional de las conquistas de Josué: tomó la tierra «Desde el monte de Halac, que sube hasta Seir, hasta Baal-gad en la llanura del Líbano, á las raíces del monte Hermón», y la lista de los reyes derrotados repite la frase. El hebreo biq'at ha-Lebanon, «la hendidura del Líbano», es la larga depresión entre las cordilleras del Líbano y del Antilíbano que los griegos llamaban Celesiria, «Siria hueca», y que es hoy el valle de la Beqaa, en el Líbano, de unos 120 km de largo y unos 16 km de ancho en promedio, donde nace el Orontes, que corre hacia el norte, y el Litani, hacia el sur. Baal-gad, su ciudad «á las raíces del monte Hermón», no ha sido localizada; se ha sugerido el extremo sur del valle cerca de Hasbaya, y el mapa conserva el valle superior del Hule como alternativa."
    - "El valle no aparece en ninguna otra historia bíblica, y la Biblia solo lo conoce como un límite. En épocas posteriores albergó el gran santuario de Heliópolis, Baalbek, cuyos templos romanos de Júpiter y de Baco aún se mantienen en parte, y la ciudad omeya de Anjar. Hoy la Beqaa es la principal región agrícola del Líbano, con Zahle como su mayor ciudad y Baalbek como su ruina más visitada."
    - "Historiadores y geógrafos griegos describen el valle con más detalle. Polibio cuenta cómo Antíoco III entró en el desfiladero que llama Marsias, un paso estrecho entre el Líbano y el Antilíbano cortado por pantanos y lagos, y no logró forzarlo porque Teódoto el etolio ocupaba sus fortalezas de Gerra y Brocos. Estrabón lo llama la llanura de Masias: los campesinos cultivaban el fondo del valle, mientras itureos y árabes vivían del bandidaje en las montañas, y Calcis era como su acrópolis. Añade que el Masias pertenecía a Ptolomeo, hijo de Meneo, a quien Josefo llama gobernante de Calcis bajo el monte Líbano. Eusebio escribe que Constantino prohibió en Heliópolis una costumbre de prostitución, construyó allí una gran iglesia y dio a la ciudad su primer obispo y su clero."
  pt:
    - "O vale do Líbano é o limite norte das conquistas de Josué: ele tomou a terra “desde o monte Halaque, que sobe para Seir, até Baal-Gade, no vale do Líbano, ao pé do monte Hermom”, e a lista dos reis derrotados repete a expressão. O hebraico biq'at ha-Lebanon, “a fenda do Líbano”, é a longa depressão entre as cadeias do Líbano e do Antilíbano que os gregos chamavam Celessíria, “Síria oca”, e que é hoje o vale de Beqaa, no Líbano, com cerca de 120 km de comprimento e em média 16 km de largura, onde o Orontes nasce e corre para o norte e o Litani para o sul. Baal-Gade, sua cidade “ao pé do monte Hermom”, não foi localizada; sugeriu-se a extremidade sul do vale perto de Hasbaya, e o mapa mantém o alto vale de Hula como alternativa."
    - "O vale não aparece em nenhuma outra história bíblica, e a Bíblia só o conhece como fronteira. Em épocas posteriores abrigou o grande santuário de Heliópolis, Baalbek, cujos templos romanos de Júpiter e de Baco ainda estão em parte de pé, e a cidade omíada de Anjar. Hoje a Beqaa é a principal região agrícola do Líbano, com Zahle como maior cidade e Baalbek como a ruína mais visitada."
    - "Historiadores e geógrafos gregos descrevem o vale com mais detalhe. Políbio conta como Antíoco III entrou no desfiladeiro que chama de Mársias, uma passagem estreita entre o Líbano e o Antilíbano cortada por pântanos e lagos, e não conseguiu forçá-la porque Teódoto, o etólio, ocupava suas fortalezas de Gerra e Brocos. Estrabão o chama de planície de Massias: lavradores cultivavam o fundo do vale, enquanto itureus e árabes viviam de saque nas montanhas, e Cálcis era como sua acrópole. Acrescenta que o Massias pertencia a Ptolomeu, filho de Meneu, que Josefo chama de governante de Cálcis sob o monte Líbano. Eusébio escreve que Constantino proibiu em Heliópolis um costume de prostituição, construiu ali uma grande igreja e deu à cidade seu primeiro bispo e seu clero."
  de:
    - "Das Libanontal ist die Nordgrenze der Eroberungen Josuas: Er nahm das Land „von dem kahlen Gebirge an, das aufsteigt gen Seir, bis gen Baal-Gad in der Ebene beim Berge Libanon, unten am Berge Hermon“, und die Liste der besiegten Könige wiederholt die Wendung. Das hebräische biq'at ha-Levanon, „die Spalte des Libanon“, ist die lange Senke zwischen den Gebirgen Libanon und Antilibanon, die die Griechen Koilesyrien, „hohles Syrien“, nannten und die heute die Beqaa-Ebene im Libanon ist, rund 120 km lang und im Durchschnitt etwa 16 km breit, wo der Orontes entspringt und nach Norden und der Litani nach Süden fließt. Baal-Gad, ihre Stadt „unten am Berge Hermon“, ist nicht lokalisiert; das Südende des Tals bei Hasbaya wurde vorgeschlagen, und die Karte behält das obere Huletal als Alternative."
    - "Das Tal erscheint in keiner anderen biblischen Geschichte, und die Bibel kennt es nur als Grenze. In späteren Zeiten barg es das große Heiligtum von Heliopolis, Baalbek, dessen römische Tempel des Jupiter und des Bacchus teilweise noch stehen, und die umayyadische Stadt Anjar. Heute ist die Beqaa die wichtigste Landwirtschaftsregion des Libanon, mit Zahle als größter Stadt und Baalbek als meistbesuchter Ruine."
    - "Griechische Historiker und Geographen beschreiben das Tal genauer. Polybios erzählt, wie Antiochos III. in den Engpass zog, den er Marsyas nennt, einen schmalen Durchgang zwischen Libanon und Antilibanon, der von Sümpfen und Seen unterbrochen wird, und ihn nicht erzwingen konnte, weil Theodotos der Aitoler die Festungen Gerrha und Brochoi hielt. Strabon nennt es die Ebene Massyas: Bauern bestellten den Talboden, während Ituräer und Araber in den Bergen von Raub lebten, und Chalkis diente gleichsam als ihre Akropolis. Er fügt hinzu, die Massyas habe Ptolemaios gehört, dem Sohn des Mennaios, den Josephus Herrscher von Chalkis unter dem Libanon nennt. Eusebius schreibt, Konstantin habe in Heliopolis einen Brauch der Prostitution verboten, dort eine große Kirche gebaut und der Stadt ihren ersten Bischof und Klerus gegeben."
  fr:
    - "La vallée du Liban est la limite nord des conquêtes de Josué : il prit le pays « depuis la montagne nue qui s’élève vers Séir jusqu’à Baal-Gad, dans la vallée du Liban, au pied de la montagne d’Hermon », et la liste des rois vaincus répète l’expression. L’hébreu biq’at ha-Lebanon, « la fente du Liban », est la longue dépression entre le Liban et l’Anti-Liban que les Grecs appelaient Cœlé-Syrie, « Syrie creuse », et qui est aujourd’hui la vallée de la Beqaa, au Liban, longue d’environ 120 km et large en moyenne d’environ 16 km, où l’Oronte naît et coule vers le nord, et le Litani vers le sud. Baal-Gad, sa ville « au pied de la montagne d’Hermon », n’a pas été localisée ; l’extrémité sud de la vallée près de Hasbaya a été proposée, et la carte garde la haute vallée de la Houla comme variante."
    - "La vallée n’apparaît dans aucun autre récit biblique, et la Bible ne la connaît que comme une limite. Plus tard, elle abrita le grand sanctuaire d’Héliopolis, Baalbek, dont les temples romains de Jupiter et de Bacchus subsistent en partie, et la ville omeyyade d’Anjar. Aujourd’hui, la Beqaa est la principale région agricole du Liban, avec Zahlé pour plus grande ville et Baalbek pour ruine la plus visitée."
    - "Historiens et géographes grecs décrivent la vallée plus en détail. Polybe raconte comment Antiochos III entra dans le défilé qu’il appelle Marsyas, un passage étroit entre le Liban et l’Anti-Liban coupé de marais et de lacs, et ne put le forcer parce que Théodote l’Étolien tenait ses forteresses de Gerrha et de Brochoi. Strabon l’appelle la plaine de Massyas : des paysans cultivaient le fond de la vallée, tandis que les Ituréens et les Arabes des montagnes vivaient de brigandage, et Chalcis en était comme l’acropole. Il ajoute que le Massyas appartenait à Ptolémée, fils de Mennaios, que Josèphe appelle le maître de Chalcis sous le mont Liban. Eusèbe écrit que Constantin interdit à Héliopolis une coutume de prostitution, y bâtit une grande église et donna à la ville son premier évêque et son clergé."
  pl:
    - "Dolina Libanu jest północną granicą podbojów Jozuego: zajął ziemię „Od góry Halak, która idzie ku Seir, aż do Baalgad, w równinie Libańskiej pod górą Hermon”, a lista pokonanych królów powtarza to sformułowanie. Hebrajskie bik'at ha-Lewanon, „rozpadlina Libanu”, to długie zagłębienie między pasmami Libanu i Antylibanu, które Grecy nazywali Celesyrią, „Syrią dolną”, a które jest dziś doliną Bekaa w Libanie, mającą około 120 km długości i przeciętnie około 16 km szerokości, gdzie Orontes bierze początek i płynie na północ, a Litani na południe. Baal-Gad, jej miasta „pod górą Hermon”, nie umiejscowiono; sugerowano południowy kraniec doliny koło Haszbai, a mapa zachowuje górną dolinę Chula jako alternatywę."
    - "Dolina nie występuje w żadnej innej opowieści biblijnej, a Biblia zna ją tylko jako granicę. W późniejszych wiekach mieściło się w niej wielkie sanktuarium Heliopolis, Baalbek, którego rzymskie świątynie Jowisza i Bachusa częściowo wciąż stoją, oraz umajjadzkie miasto Andżar. Dziś Bekaa jest głównym regionem rolniczym Libanu, z Zahlą jako największym miastem i Baalbekiem jako najczęściej odwiedzaną ruiną."
    - "Greccy historycy i geografowie opisują dolinę dokładniej. Polibiusz opowiada, jak Antioch III wkroczył do wąwozu, który nazywa Marsjas, wąskiego przejścia między Libanem a Antylibanem przerywanego bagnami i jeziorami, i nie zdołał go sforsować, bo Teodot Etolczyk trzymał jego twierdze Gerrę i Brochoi. Strabon nazywa ją równiną Massjas: rolnicy uprawiali dno doliny, podczas gdy Iturejczycy i Arabowie w górach żyli z rozboju, a Chalkis była niejako jej akropolem. Dodaje, że Massjas należał do Ptolemeusza, syna Mennajosa, którego Józef Flawiusz nazywa władcą Chalkis pod górą Liban. Euzebiusz pisze, że Konstantyn zakazał w Heliopolis zwyczaju nierządu, zbudował tam wielki kościół i dał miastu pierwszego biskupa i duchowieństwo."
  it:
    - "La valle del Libano è il limite settentrionale delle conquiste di Giosuè: egli prese il paese «dalla montagna brulla che s’eleva verso Seir, fino a Baal-Gad nella valle del Libano appiè del monte Hermon», e l’elenco dei re sconfitti ripete la formula. L’ebraico biq’at ha-Lebanon, «la fenditura del Libano», è la lunga depressione fra le catene del Libano e dell’Antilibano che i Greci chiamavano Celesiria, «Siria cava», e che è oggi la valle della Beqa in Libano, lunga circa 120 km e larga in media circa 16 km, dove l’Oronte nasce e scorre a nord e il Litani a sud. Baal-Gad, la sua città «appiè del monte Hermon», non è stata localizzata; è stata proposta l’estremità meridionale della valle presso Hasbaya, e la mappa conserva come alternativa l’alta valle di Hula."
    - "La valle non compare in nessun altro racconto biblico, e la Bibbia la conosce solo come confine. In epoche posteriori ospitò il grande santuario di Eliopoli, Baalbek, i cui templi romani di Giove e di Bacco restano in parte in piedi, e la città omayyade di Anjar. Oggi la Beqa è la principale regione agricola del Libano, con Zahle come città maggiore e Baalbek come rovina più visitata."
    - "Storici e geografi greci descrivono la valle più nei particolari. Polibio racconta come Antioco III entrò nella gola che chiama Marsia, uno stretto passaggio tra il Libano e l’Antilibano interrotto da paludi e laghi, e non riuscì a forzarlo perché Teodoto l’Etolo ne teneva le fortezze di Gerra e Brochi. Strabone la chiama la pianura di Massia: i contadini coltivavano il fondovalle, mentre Iturei e Arabi sui monti vivevano di brigantaggio, e Calcide ne era come l’acropoli. Aggiunge che il Massia apparteneva a Tolomeo figlio di Menneo, che Giuseppe Flavio chiama signore di Calcide sotto il monte Libano. Eusebio scrive che Costantino vietò a Eliopoli un costume di prostituzione, vi costruì una grande chiesa e diede alla città il suo primo vescovo e il clero."
  nl:
    - "Het dal van de Libanon is de noordgrens van de veroveringen van Jozua: hij nam het land in “van den kalen berg, die opwaarts naar Seir gaat, tot Baal-Gad toe, in het dal van den Libanon, onder aan den berg Hermon”, en de lijst van verslagen koningen herhaalt de uitdrukking. Het Hebreeuwse biq’at ha-Lebanon, “de kloof van de Libanon”, is de lange trog tussen de gebergten Libanon en Anti-Libanon die de Grieken Coele-Syrië noemden, “Holle Syrië”, en die tegenwoordig de Beqaa-vallei van Libanon is, zo’n 120 km lang en gemiddeld ongeveer 16 km breed, waar de Orontes ontspringt en naar het noorden stroomt en de Litani naar het zuiden. Baäl-Gad, haar stad “onder aan den berg Hermon”, is niet gelokaliseerd; het zuidelijke einde van de vallei bij Hasbaya is voorgesteld, en de kaart houdt de bovenste Huleh-vallei als alternatief."
    - "De vallei komt in geen ander Bijbels verhaal voor, en de Bijbel kent haar alleen als grens. In latere tijden herbergde ze het grote heiligdom van Heliopolis, Baalbek, waarvan de Romeinse tempels van Jupiter en Bacchus nog gedeeltelijk staan, en de Omajjadische stad Anjar. Tegenwoordig is de Beqaa het voornaamste landbouwgebied van Libanon, met Zahle als grootste stad en Baalbek als meest bezochte ruïne."
    - "Griekse geschiedschrijvers en geografen beschrijven de vallei uitvoeriger. Polybius vertelt hoe Antiochus III de engte binnentrok die hij Marsyas noemt, een smalle doorgang tussen de Libanon en de Anti-Libanon die door moerassen en meren wordt onderbroken, en er niet doorheen kon omdat Theodotus de Aetoliër de vestingen Gerrha en Brochi bezet hield. Strabo noemt haar de vlakte Massyas: boeren bewerkten de dalbodem, terwijl Ituraeërs en Arabieren in de bergen van roof leefden, en Chalcis diende als haar akropolis. Hij voegt eraan toe dat de Massyas toebehoorde aan Ptolemaeus, zoon van Mennaeus, die Josephus heerser van Chalcis onder de berg Libanon noemt. Eusebius schrijft dat Constantijn in Heliopolis een gewoonte van prostitutie verbood, er een grote kerk bouwde en de stad haar eerste bisschop en geestelijkheid gaf."
  cs:
    - "Libanonské údolí je severní hranicí Jozuových výbojů: vzal zemi „od hory Halak, kteráž se táhne do Seir, až k Balgad na rovině Libánské, pod horou Hermon“ a seznam poražených králů tento obrat opakuje. Hebrejské biq'at ha-Lebanon, „rozsedlina Libanonu“, je dlouhý žlab mezi pohořími Libanon a Antilibanon, který Řekové nazývali Koilé Syria, „dutá Sýrie“, a který je dnes libanonským údolím Bikáa, dlouhým asi 120 km a v průměru asi 16 km širokým, kde pramení Orontés a teče na sever a Lítání na jih. Báal-gad, jeho město „pod horou Hermon“, nebylo lokalizováno; navrhován byl jižní konec údolí poblíž Hasbajá a mapa ponechává horní údolí Chúla jako alternativu."
    - "Údolí se neobjevuje v žádném jiném biblickém příběhu a Bible je zná jen jako hranici. V pozdějších věcích v něm stála velká svatyně Héliopole, Baalbek, jehož římské chrámy Jupiterův a Bakchův dosud částečně stojí, a umajjovské město Andžar. Dnes je Bikáa hlavní zemědělskou oblastí Libanonu, se Zahlé jako největším městem a Baalbekem jako nejnavštěvovanější zříceninou."
    - "Řečtí dějepisci a zeměpisci popisují údolí podrobněji. Polybios vypráví, jak Antiochos III. vstoupil do soutěsky, kterou nazývá Marsyas, úzkého průchodu mezi Libanonem a Antilibanonem přerušovaného bažinami a jezery, a nedokázal jím proniknout, protože Theodotos Aitólský držel jeho pevnosti Gerrhu a Brochoi. Strabón ji nazývá rovinou Massyas: rolníci obdělávali dno údolí, kdežto Iturejci a Arabové v horách žili z loupeží a Chalkis byla jakoby její akropolí. Dodává, že Massyas patřila Ptolemaiovi, synu Mennaiovu, kterého Josephus nazývá vládcem Chalkidy pod horou Libanonem. Eusebios píše, že Konstantin zakázal v Héliopoli zvyk prostituce, postavil tam velký kostel a dal městu prvního biskupa a duchovenstvo."
  sv:
    - "Libanondalen är den norra gränsen för Josuas erövringar: han tog landet ”från Halakberget, som höjer sig mot Seir, ända till Baal-Gad i Libanonsdalen nedanför berget Hermon”, och förteckningen över besegrade kungar upprepar uttrycket. Det hebreiska biq'at ha-Lebanon, ”Libanons klyfta”, är det långa tråget mellan bergskedjorna Libanon och Anti-Libanon som grekerna kallade Koile Syria, ”det ihåliga Syrien”, och som i dag är Beqaadalen i Libanon, omkring 120 km lång och i genomsnitt omkring 16 km bred, där Orontes har sitt ursprung och flyter norrut och Litani söderut. Baal-Gad, dess stad ”nedanför berget Hermon”, har inte lokaliserats; dalens södra ände nära Hasbaya har föreslagits, och kartan behåller övre Huladalen som alternativ."
    - "Dalen förekommer i ingen annan bibelberättelse, och Bibeln känner den bara som en gräns. Under senare tider rymde den den stora helgedomen i Heliopolis, Baalbek, vars romerska tempel åt Jupiter och Bacchus delvis står kvar, och den umayyadiska staden Anjar. I dag är Beqaa Libanons främsta jordbruksregion, med Zahle som största stad och Baalbek som mest besökta ruin."
    - "Grekiska historiker och geografer beskriver dalen närmare. Polybios berättar hur Antiochos III gick in i passet som han kallar Marsyas, en smal genomfart mellan Libanon och Anti-Libanon som bryts av träsk och sjöar, och inte kunde ta sig igenom eftersom Theodotos från Aitolien höll dess fästen Gerrha och Brochoi. Strabon kallar den Massyasslätten: bönder brukade dalbotten, medan ituréer och araber i bergen levde av röveri, och Chalkis tjänade som dess akropolis. Han tillägger att Massyas tillhörde Ptolemaios, Mennaios son, som Josefus kallar härskare över Chalkis under berget Libanon. Eusebios skriver att Konstantin förbjöd en sed av prostitution i Heliopolis, byggde en stor kyrka där och gav staden dess första biskop och prästerskap."
  nb:
    - "Libanon-dalen er den nordlige grensen for Josvas erobringer: han tok landet «fra det nakne fjell som strekker sig op imot Se'ir, til Ba'al-Gad i Libanon-dalen ved foten av Hermon-fjellet», og listen over de slåtte kongene gjentar uttrykket. Det hebraiske biq'at ha-Lebanon, «Libanons kløft», er det lange søkket mellom fjellkjedene Libanon og Anti-Libanon som grekerne kalte Koilesyria, «hule Syria», og som i dag er Bekaa-dalen i Libanon, omkring 120 km lang og i gjennomsnitt omkring 16 km bred, der Orontes har sitt utspring og renner nordover og Litani sørover. Baal-Gad, byen «ved foten av Hermon-fjellet», er ikke lokalisert; den sørlige enden av dalen nær Hasbaya er foreslått, og kartet beholder øvre Hula-dalen som et alternativ."
    - "Dalen forekommer ikke i noen annen bibelsk fortelling, og Bibelen kjenner den bare som en grense. I senere tider rommet den den store helligdommen i Heliopolis, Baalbek, hvis romerske templer for Jupiter og Bacchus delvis fortsatt står, og umayyadenes by Anjar. I dag er Bekaa Libanons viktigste jordbruksregion, med Zahle som største by og Baalbek som den mest besøkte ruinen."
    - "Greske historikere og geografer beskriver dalen nærmere. Polybios forteller hvordan Antiokos III dro inn i passet han kaller Marsyas, en smal gjennomgang mellom Libanon og Anti-Libanon som brytes av myrer og innsjøer, og ikke kom gjennom fordi Theodotos fra Aitolia holdt festningene Gerrha og Brochoi. Strabon kaller den Massyas-sletten: bønder dyrket dalbunnen, mens ituraere og arabere i fjellene levde av røveri, og Chalkis tjente som dens akropolis. Han legger til at Massyas tilhørte Ptolemaios, sønn av Mennaios, som Josefus kaller hersker over Chalkis under Libanonfjellet. Eusebios skriver at Konstantin forbød en skikk med prostitusjon i Heliopolis, bygde en stor kirke der og ga byen dens første biskop og presteskap."
  tl:
    - "Ang libis ng Libano ang hilagang hangganan ng mga pananakop ni Josue: kinuha niya ang lupain “Mula sa bundok ng Halac na paahon sa Seir, hanggang sa Baal-gad sa libis ng Libano sa ibaba ng bundok Hermon”, at inuulit ng talaan ng mga natalong hari ang pariralang iyon. Ang Hebreong biq'at ha-Levanon, “ang biyak ng Libano”, ay ang mahabang lambak sa pagitan ng mga hanay ng Libano at Anti-Libano na tinawag ng mga Griego na Coele-Siria, “guwang na Siria”, at na ngayon ay ang libis ng Beqaa ng Libano, mga 120 km ang haba at karaniwang mga 16 km ang luwang, kung saan nagmumula ang Orontes at dumadaloy pahilaga at ang Litani patimog. Ang Baal-gad, ang bayan nito “sa ibaba ng bundok Hermon”, ay hindi pa natutukoy; iminungkahi ang timugang dulo ng libis malapit sa Hasbaya, at pinananatili ng mapa ang itaas na libis ng Huleh bilang alternatibo."
    - "Ang libis ay hindi lumilitaw sa ibang kuwento sa Biblia, at kilala ito ng Biblia bilang hangganan lamang. Sa mga huling panahon, nasa loob nito ang dakilang santuwaryo ng Heliopolis, Baalbek, na ang mga templong Romano ni Jupiter at ni Baco ay bahagyang nakatayo pa, at ang bayang Umayyad ng Anjar. Ngayon ang Beqaa ang pangunahing rehiyong bukirin ng Libano, na ang Zahle ang pinakamalaking bayan at ang Baalbek ang pinakadinadalaw na guho."
    - "Mas detalyadong inilalarawan ng mga Griegong historyador at heograpo ang libis. Isinasalaysay ni Polibio kung paano pumasok si Antioco III sa makitid na daanang tinatawag niyang Marsyas, sa pagitan ng Libano at Anti-Libano at hinahati ng mga latian at lawa, at hindi niya ito nalusutan dahil hawak ni Teodoto na taga-Etolia ang mga kuta nito sa Gerrha at Brochi. Tinatawag ito ni Strabo na kapatagan ng Massyas: binubungkal ng mga magsasaka ang lambak, habang nabubuhay sa pagnanakaw ang mga Itureo at Arabe sa kabundukan, at ang Chalcis ang tila akropolis nito. Idinagdag niyang pag-aari ang Massyas ni Ptolomeo na anak ni Mennaeus, na tinatawag ni Josephus na pinuno ng Chalcis sa paanan ng bundok Libano. Isinulat ni Eusebio na ipinagbawal ni Constantino sa Heliopolis ang isang kaugalian ng prostitusyon, nagtayo roon ng malaking simbahan at binigyan ang lungsod ng unang obispo at klero."
  da:
    - "Libanons Dal er den nordlige grænse for Josvas erobringer: han tog landet »fra det slette Bjerg, som strækker sig op mod Sejr, og indtil Baal-Gad ved Libanons Dal neden for det Bjerg Hermon«, og listen over besejrede konger gentager vendingen. Det hebraiske biq'at ha-Levanon, »Libanons kløft«, er det lange trug mellem Libanon- og Anti-Libanon-bjergkæderne, som grækerne kaldte Koile-Syria, »det hule Syrien«, og som i dag er Bekaadalen i Libanon, omkring 120 km lang og i gennemsnit omkring 16 km bred, hvor Orontes udspringer og flyder nordpå og Litani sydpå. Ba'al-Gad, dens by »neden for Hermons Bjerg«, er ikke lokaliseret; dalens sydlige ende nær Hasbaya er blevet foreslået, og kortet beholder den øvre Huleh-dal som et alternativ."
    - "Dalen optræder i ingen anden bibelsk historie, og Bibelen kender den kun som en grænse. I senere tidsaldre rummede den den store helligdom Heliopolis, Baalbek, hvis romerske templer for Jupiter og Bacchus stadig delvist står, og umayyadernes by Anjar. I dag er Bekaa Libanons vigtigste landbrugsregion, med Zahle som største by og Baalbek som mest besøgte ruin."
    - "Græske historikere og geografer beskriver dalen nærmere. Polybios fortæller, hvordan Antiochos III drog ind i passet, som han kalder Marsyas, en smal gennemgang mellem Libanon og Anti-Libanon, afbrudt af sumpe og søer, og ikke kunne trænge igennem, fordi Theodotos fra Aitolien holdt dets fæstninger Gerrha og Brochoi. Strabon kalder den Massyas-sletten: bønder dyrkede dalbunden, mens ituræere og arabere i bjergene levede af røveri, og Chalkis tjente som dens akropolis. Han tilføjer, at Massyas tilhørte Ptolemaios, søn af Mennaios, som Josefus kalder hersker over Chalkis under Libanonbjerget. Eusebios skriver, at Konstantin forbød en skik med prostitution i Heliopolis, byggede en stor kirke dér og gav byen dens første biskop og præsteskab."
  sr:
    - "Долина Ливанска је северна граница Исусових освајања: узео је земљу „од горе Алака, која се пружа к Сиру, до Вал-Гада у пољу ливанском, под гором Ермоном“, а списак поражених царева понавља ту формулу. Хебрејско бик’ат ха-Ливнан, „расцеп Ливана“, јесте дуго корито између гребена Ливана и Антиливана које су Грци звали Келесирија, „шупља Сирија“, и које је данас долина Бекаа у Ливану, дуга око 120 км и у просеку широка око 16 км, где Оронт извире и тече на север, а Литани на југ. Положај Вал-Гада, њеног града „под гором Ермоном“, није утврђен; предложен је јужни крај долине код Хасбеје, а карта као алтернативу чува горњу долину Хуле."
    - "Долина се не јавља ни у једној другој библијској причи, а Библија је зна само као границу. У каснијим добима носила је велико светилиште Хелиополиса, Баалбек, чији римски храмови Јупитера и Бахуса још делимично стоје, и омајадски град Анџар. Данас је Бекаа главни пољопривредни крај Ливана, са Захлеом као највећим градом и Баалбеком као најпосећенијом рушевином."
    - "Грчки историчари и географи описују долину подробније. Полибије прича како је Антиох III ушао у теснац који зове Марсија, уски пролаз између Ливана и Антиливана испресецан мочварама и језерима, и није успео да га пробије јер је Теодот Етолац држао његове тврђаве Геру и Брохе. Страбон је зове равницом Масија: земљорадници су обрађивали дно долине, док су Итурејци и Арапи у планинама живели од пљачке, а Халкида јој је била као акропољ. Он додаје да је Масија припадала Птолемеју, сину Менејевом, кога Јосиф Флавије назива владаром Халкиде под гором Ливаном. Јевсевије пише да је Константин у Хелиополису забранио обичај блуда, саградио тамо велику цркву и дао граду првог епископа и свештенство."
  hu:
    - "A Libanon-völgy Józsué hódításainak északi határa: elfoglalta a földet „a kopasz hegytől fogva, a mely Szeír felé emelkedik, egészen Baál-Gádig, a Libanon völgyében, a Hermon hegye alatt”, és a legyőzött királyok jegyzéke megismétli a kifejezést. A héber biqat ha-Levanon, „Libanon hasadéka”, a Libanon- és az Antilibanon-hegylánc közötti hosszú teknő, amelyet a görögök Koilé Szíriának, „üreges Szíriának” neveztek, és amely ma Libanon Bekáa-völgye, mintegy 120 km hosszú és átlagosan 16 km széles, ahol az Orontész ered és északra, a Litáni pedig délre folyik. Baál-Gád, a völgy városa „a Hermon hegye alatt”, nem lokalizálható; a völgy déli végét javasolták Hászbajá közelében, és a térkép alternatívaként megtartja a felső Hule-völgyet."
    - "A völgy semmilyen más bibliai történetben nem szerepel, és a Biblia csak határként ismeri. Későbbi korokban ott állt Héliopolisz, Baalbek nagy szentélye, amelynek római Jupiter- és Bacchus-templomai részben ma is állnak, és az omajjád Andzsar városa. Ma a Bekáa Libanon fő mezőgazdasági vidéke, legnagyobb városa Zahlé, leglátogatottabb romja Baalbek."
    - "Görög történetírók és földrajzírók részletesebben leírják a völgyet. Polübiosz elbeszéli, hogyan vonult be III. Antiokhosz a szorosba, amelyet Marszüasznak nevez, a Libanon és az Antilibanon közti, mocsaraktól és tavaktól megszakított keskeny átjáróba, és hogyan nem tudott áttörni rajta, mert az aitóliai Theodotosz tartotta Gerrha és Brokhoi erődjét. Sztrabón Masszüasz-síkságnak nevezi: a völgy alját földművesek művelték, a hegyekben élő itureusok és arabok viszont rablásból éltek, Khalkisz pedig mintegy a fellegvára volt. Hozzáteszi, hogy a Masszüasz Ptolemaioszé, Mennaiosz fiáé volt, akit Josephus a Libanon hegy alatti Khalkisz urának nevez. Euszebiosz azt írja, hogy Konstantin Héliopoliszban betiltotta a paráznaság egy szokását, nagy templomot épített ott, és első püspököt és papságot adott a városnak."
  fi:
    - "Libanonin laakso on Joosuan valloitusten pohjoisraja: hän valloitti maan ”Seiriin päin kohoavasta Sileästä vuoresta aina Baal-Gaadiin saakka, Libanonin laaksoon, Hermonin vuoren juurelle”, ja voitettujen kuninkaiden luettelo toistaa ilmauksen. Heprean biq'at ha-Lebanon, ”Libanonin halkeama”, on Libanonin ja Anti-Libanonin vuorijonojen välinen pitkä uoma, jota kreikkalaiset kutsuivat Koilesyyriaksi, ”ontoksi Syyriaksi”, ja joka on nykyisin Libanonin Bekaan laakso, noin 120 km pitkä ja keskimäärin noin 16 km leveä, missä Orontes virtaa pohjoiseen ja Litani etelään. Baal-Gadia, sen kaupunkia Hermonin vuoren juurella, ei ole paikannettu; laakson eteläpäätä Hasbayan lähellä on ehdotettu, ja kartta säilyttää Hulan ylälaakson vaihtoehtona."
    - "Laakso ei esiinny missään muussa Raamatun kertomuksessa, ja Raamattu tuntee sen vain rajana. Myöhempinä aikoina siellä oli Heliopoliksen, Baalbekin, suuri pyhäkkö, jonka Rooman ajan Jupiterin ja Bacchuksen temppelit seisovat osittain yhä, sekä umayyadien Anjarin kaupunki. Nykyisin Bekaa on Libanonin tärkein maatalousalue, jonka suurin kaupunki on Zahle ja vierailluin rauniokohde Baalbek."
    - "Kreikkalaiset historioitsijat ja maantieteilijät kuvaavat laaksoa tarkemmin. Polybios kertoo, miten Antiokhos III eteni solaan, jota hän kutsuu Marsyakseksi, kapeaan kulkuväylään Libanonin ja Anti-Libanonin välillä, jota suot ja järvet katkovat, eikä päässyt läpi, koska aitolialainen Theodotos piti sen linnoituksia Gerrhaa ja Brokhoita. Strabon kutsuu sitä Massyaan tasangoksi: talonpojat viljelivät laakson pohjaa, kun taas vuorilla asuvat iturealaiset ja arabit elivät ryöstöllä, ja Khalkis oli ikään kuin sen akropolis. Hän lisää, että Massyas kuului Mennaioksen pojalle Ptolemaiokselle, jota Josefus kutsuu Libanonin vuoren alla olevan Khalkiksen hallitsijaksi. Eusebios kirjoittaa, että Konstantinus kielsi Heliopoliksessa erään prostituutiotavan, rakennutti sinne suuren kirkon ja antoi kaupungille sen ensimmäisen piispan ja papiston."
  vi:
    - "Trũng Li-ban là giới hạn bắc của các cuộc chinh phục của Giô-suê: ông lấy xứ “từ phía núi trụi mọc lên phía Sê-i-rơ cho đến Ba-anh-Gát trong trũng Li-ban, tại chân núi Hẹt-môn”, và danh sách các vua bị đánh bại lặp lại cụm từ ấy. Từ Hê-bơ-rơ biq'at ha-Lebanon, “khe nứt Li-ban”, là máng dài giữa dãy Li-ban và Anti-Li-ban mà người Hy Lạp gọi là Coele-Syria, “Sy-ri trũng”, và ngày nay là thung lũng Beqaa của Li-ban, dài khoảng 120 km và rộng trung bình khoảng 16 km, nơi sông Orontes bắt nguồn và chảy về bắc còn Litani chảy về nam. Ba-anh-Gát, thành của nó “tại chân núi Hẹt-môn”, chưa xác định được; đầu nam của thung lũng gần Hasbaya đã được đề nghị, và bản đồ giữ thung lũng Huleh thượng làm phương án khác."
    - "Thung lũng không xuất hiện trong câu chuyện Kinh Thánh nào khác, và Kinh Thánh chỉ biết nó như một ranh giới. Ở các thời đại sau, nó có nơi thánh lớn Hê-li-ô-bô-li, Baalbek, mà các đền La Mã thờ Jupiter và Bacchus vẫn còn đứng một phần, và thị trấn Umayyad Anjar. Ngày nay Beqaa là vùng nông nghiệp chính của Li-ban, với Zahle là thị trấn lớn nhất và Baalbek là tàn tích được tham quan nhiều nhất."
    - "Các sử gia và nhà địa lý Hy Lạp mô tả thung lũng kỹ hơn. Polybius kể Antiochus III tiến vào hẻm núi mà ông gọi là Marsyas, một lối đi hẹp giữa Li-ban và Anti-Li-ban bị đầm lầy và hồ chia cắt, và không vượt qua được vì Theodotus người Aetolia giữ các đồn Gerrha và Brochi. Strabo gọi nó là đồng bằng Massyas: nông dân cày cấy đáy thung lũng, còn người Iturea và người Ả Rập trên núi sống bằng cướp bóc, và Chalcis như là vệ thành của nó. Ông nói thêm rằng Massyas thuộc về Ptolemy con của Mennaeus, người mà Josephus gọi là kẻ cai trị Chalcis dưới núi Li-ban. Eusebius viết rằng Constantine đã cấm một tục mại dâm ở Hê-li-ô-bô-li, xây tại đó một nhà thờ lớn và ban cho thành vị giám mục và hàng giáo sĩ đầu tiên."
  ro:
    - "Valea Libanului este limita nordică a cuceririlor lui Iosua: el a luat țara „Dela muntele Helha care se sue la Siir până la Valagad, și câmpul Livanului supt muntele Ermonului”, iar lista regilor învinși repetă fraza. Ebraicul biq'at ha-Lebanon, „despicătura Libanului”, este lungul jgheab dintre lanțurile Liban și Anti-Liban pe care grecii îl numeau Celesiria, „Siria scobită”, și care este astăzi Valea Beqaa din Liban, lungă de circa 120 km și lată în medie de circa 16 km, unde Orontul izvorăște și curge spre nord, iar Litani spre sud. Baal-Gad, orașul ei „supt muntele Ermonului”, nu a fost localizat; s-a sugerat capătul sudic al văii, lângă Hasbaya, iar harta păstrează ca alternativă valea superioară a Hulei."
    - "Valea nu apare în nicio altă povestire biblică, iar Biblia o cunoaște doar ca hotar. În epocile următoare ea a adăpostit marele sanctuar din Heliopolis, Baalbek, ale cărui temple romane ale lui Iupiter și Bacchus stau încă în parte în picioare, și orașul omeiad Anjar. Astăzi Beqaa este principala regiune agricolă a Libanului, cu Zahle drept cel mai mare oraș al ei și Baalbek drept cea mai vizitată ruină."
    - "Istoricii și geografii greci descriu valea mai amănunțit. Polibiu povestește cum Antioh al III-lea a intrat în defileul pe care îl numește Marsyas, o trecătoare îngustă între Liban și Anti-Liban, întreruptă de mlaștini și lacuri, și nu a reușit să o forțeze pentru că Theodotos etolianul îi ținea fortărețele Gerrha și Brochoi. Strabon o numește câmpia Massyas: țăranii lucrau fundul văii, în vreme ce itureenii și arabii din munți trăiau din tâlhărie, iar Chalcis îi era un fel de acropolă. El adaugă că Massyas aparținea lui Ptolemeu, fiul lui Mennaios, pe care Iosif Flaviu îl numește stăpânitorul Chalcisului de sub muntele Liban. Eusebiu scrie că Constantin a interzis la Heliopolis un obicei de prostituție, a zidit acolo o biserică mare și a dat orașului primul său episcop și cler."
  bg:
    - "Ливанската долина е северната граница на завоеванията на Иисус Навин: той превзел земята „от гората Алак която възходи към Сиир дори до Ваалгад в дола на Ливан, под гората Ермон“, а списъкът на победените царе повтаря израза. Еврейското бикат ха-Леванон, „цепнатината на Ливан“, е дългото корито между веригите Ливан и Антиливан, което гърците наричали Келесирия, „кухата Сирия“, и което днес е долината Бекаа в Ливан, дълга около 120 км и широка средно около 16 км, където извират Оронт, течащ на север, и Литани, течаща на юг. Ваал-Гад, нейният град „под гората Ермон“, не е локализиран; предлаган е южният край на долината близо до Хасбая, а картата запазва горната долина на Хула като алтернатива."
    - "Долината не се появява в друг библейски разказ и Библията я познава само като граница. В по-късни епохи в нея се намирали голямото светилище Хелиополис, Баалбек, чиито римски храмове на Юпитер и Бакхус още стоят отчасти, и омаядският град Анджар. Днес Бекаа е главният земеделски район на Ливан, със Захле като най-голям град и Баалбек като най-посещавана руина."
    - "Гръцките историци и географи описват долината по-подробно. Полибий разказва как Антиох III навлязъл в теснината, която нарича Марсиас, тесен проход между Ливан и Антиливан, пресечен от блата и езера, и не успял да я премине, защото Теодот Етолиец държал крепостите ѝ Гера и Брохи. Страбон я нарича равнината Масиас: земеделци обработвали дъното на долината, а итурейците и арабите в планините живеели от грабеж, и Халкида била като неин акропол. Той добавя, че Масиас принадлежал на Птолемей, син на Меней, когото Йосиф Флавий нарича владетел на Халкида под планината Ливан. Евсевий пише, че Константин забранил в Хелиополис обичай на блудство, построил там голяма църква и дал на града първия му епископ и духовенство."
