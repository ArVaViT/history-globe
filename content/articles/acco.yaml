# Overview article (ADR 0007). Mainstream facts only; written about the mound of Tel Akko and the Acco of Judges 1:31, without restating the Ptolemais article (Amarna, Sennacherib, the Hellenistic and Roman city), to which the later history belongs.
id: acco
place: a5f4dfc
title:
  en: "Acco"
  ru: "Акко"
