body:
  en:
    - "Acco, the Bronze and Iron Age town that became Ptolemais and later Acre, stood on Tel Akko, a mound of about 20 hectares just east of the old city of Acre, on the north bank of the Naaman, the ancient Belus, near its mouth on the bay that Mount Carmel closes on the south. Its Arabic name is Tell el-Fukhar, “the mound of the potsherds”; it is also called Napoleon's Hill, after Napoleon, whose army may have used it during his failed siege of Acre in 1799. The identification of the mound with Old Testament Acco is not disputed; the history of the later city on the peninsula is told under Ptolemais."
    - "Judges names Acco first among the coastal towns whose people the tribe of Asher did not dispossess: “Neither did Asher drive out the inhabitants of Accho, nor the inhabitants of Zidon, nor of Ahlab, nor of Achzib…”, so that “the Asherites dwelt among the Canaanites, the inhabitants of the land”. The Synodal text adds in brackets, from the Greek, that the people of Acco paid tribute to Asher, and names Dor as well. This is the only verse of the Hebrew Bible that plainly names the town."
    - "Excavations directed by Moshe Dothan from 1973 to 1989 showed that the mound was first settled in the Early Bronze Age and became a fortified city in the Middle Bronze Age, about 2000 BC, with a massive earthen rampart and a city wall; it was inhabited through the Late Bronze and Iron Ages and grew again in the Persian period, until in the Hellenistic age the city moved west to the peninsula and the mound was abandoned. Much of Dothan's work remained unpublished, and from 2010 a new expedition led by Ann Killebrew and Michal Artzy resumed excavation on the mound. Today the mound rises inside the city of Acre in northern Israel, with a statue of Napoleon on its top."
  ru:
    - "Акко — город бронзового и железного века, ставший потом Птолемаидой, а затем Акрой, — стоял на Телль-Акко, холме площадью около 20 га сразу к востоку от Старого города Акко, на северном берегу реки Наамана, древнего Бела, у её устья в заливе, который с юга замыкает Кармил. По-арабски холм называется Телль-эль-Фухар, «холм черепков»; его зовут также холмом Наполеона: войска Наполеона, возможно, использовали его при неудачной осаде Акры в 1799 г. Отождествление холма с ветхозаветным Акко бесспорно; история позднего города на полуострове рассказана в статье о Птолемаиде."
    - "Книга Судей называет Акко первым среди приморских городов, жителей которых колено Асирово не изгнало: «И Асир не изгнал жителей Акко которые платили ему дань, и жителей Дора и жителей Сидона и Ахлава, Ахзива…», так что «жил Асир среди Хананеев, жителей земли той». Слова о дани и о Доре Синодальный перевод взял в скобках из греческого текста. Это единственный стих Еврейской Библии, где город назван прямо."
    - "Раскопки под руководством Моше Дотана в 1973–1989 гг. показали, что холм был впервые заселён в раннем бронзовом веке и около 2000 г. до н. э., в среднем бронзовом веке, стал укреплённым городом с мощным земляным валом и стеной; жизнь на нём продолжалась в позднем бронзовом и железном веках и вновь оживилась в персидское время, пока в эллинистическую эпоху город не перешёл на запад, на полуостров, и холм не опустел. Многое из работ Дотана осталось неопубликованным, и с 2010 г. новая экспедиция во главе с Энн Киллебрю и Михаль Арци возобновила раскопки на холме. Сегодня холм возвышается в черте города Акко на севере Израиля, а на его вершине стоит статуя Наполеона."
  uk:
    - "Акко, місто бронзової та залізної доби, що стало Птолемаїдою, а згодом Акрою, стояло на Тель-Акко, пагорбі площею близько 20 гектарів просто на схід від старого міста Акра, на північному березі Нааману, давнього Белуса, біля його гирла на затоці, яку з півдня замикає гора Кармель. Його арабська назва — Телль-ель-Фухар, «пагорб черепків»; його також називають Пагорбом Наполеона на честь Наполеона, чия армія, можливо, користалася ним під час невдалої облоги Акри 1799 р. Ототожнення пагорба зі старозавітним Акко не заперечують; історію пізнішого міста на півострові розказано в статті «Птолемаїда»."
    - "Книга Суддів називає Акко першим серед прибережних міст, мешканців яких плем'я Асіра не вигнало: «І Ассер не повиганяв осадників Акковських і осадників Сидонських і Ахлавських, Ахзивських…», так що «жили Ассерії серед Канаанїїв, осадників тої землї». Синодальний текст додає в дужках, за грецьким, що мешканці Акко платили данину Асіру, і називає ще Дор. Це єдиний вірш єврейської Біблії, який виразно називає місто."
    - "Розкопки під керівництвом Моше Дотана 1973–1989 рр. показали, що пагорб уперше заселили в ранньому бронзовому віці, а в середньому бронзовому, близько 2000 р. до н. е., він став укріпленим містом із масивним земляним валом і міським муром; його населяли в пізньому бронзовому та залізному віках, і він знову розрісся в перський період, аж поки в елліністичну добу місто перемістилося на захід, на півострів, а пагорб покинули. Значна частина робіт Дотана лишилася неопублікованою, і від 2010 р. нова експедиція під керівництвом Енн Кіллебрю та Міхаль Артзі відновила розкопки на пагорбі. Нині пагорб здіймається всередині міста Акра на півночі Ізраїлю, а на його вершині стоїть статуя Наполеона."
  es:
    - "Aco, la ciudad de las edades del Bronce y del Hierro que llegó a ser Tolemaida y más tarde Acre, se alzaba sobre Tel Akko, un montículo de unas 20 hectáreas justo al este de la ciudad vieja de Acre, en la orilla norte del Naamán, el antiguo Belo, cerca de su desembocadura en la bahía que el monte Carmelo cierra por el sur. Su nombre árabe es Tell el-Fukhar, «el montículo de los tiestos»; se le llama también la Colina de Napoleón, por Napoleón, cuyo ejército pudo servirse de ella durante su fallido asedio de Acre en 1799. La identificación del montículo con la Aco del Antiguo Testamento no se discute; la historia de la ciudad posterior en la península se cuenta bajo Tolemaida."
    - "Jueces nombra a Aco la primera entre las ciudades costeras cuyos habitantes la tribu de Aser no desposeyó: «Tampoco Aser echó á los que habitaban en Achô, y á los que habitaban en Sidón, y en Ahlab, y en Achzib…», de modo que «moró Aser entre los Cananeos que habitaban en la tierra». El texto sinodal añade entre corchetes, a partir del griego, que los de Aco pagaban tributo a Aser, y nombra también a Dor. Es el único versículo de la Biblia hebrea que nombra claramente la ciudad."
    - "Las excavaciones dirigidas por Moshe Dothan de 1973 a 1989 mostraron que el montículo se pobló por primera vez en el Bronce Antiguo y se convirtió en ciudad fortificada en el Bronce Medio, hacia 2000 a. C., con una maciza muralla de tierra y un muro urbano; estuvo habitado durante el Bronce Final y la edad del Hierro y volvió a crecer en la época persa, hasta que en la época helenística la ciudad se trasladó al oeste, a la península, y el montículo fue abandonado. Gran parte de la obra de Dothan quedó inédita, y desde 2010 una nueva expedición dirigida por Ann Killebrew y Michal Artzy reanudó la excavación. Hoy el montículo se alza dentro de la ciudad de Acre, en el norte de Israel, con una estatua de Napoleón en su cima."
  pt:
    - "Aco, a cidade da Idade do Bronze e do Ferro que se tornou Ptolemaida e depois Acre, ficava em Tel Akko, um montículo de cerca de 20 hectares logo a leste da cidade velha de Acre, na margem norte do Naaman, o antigo Belo, perto de sua foz na baía que o monte Carmelo fecha ao sul. Seu nome árabe é Tell el-Fukhar, “o montículo dos cacos de cerâmica”; é chamado também Colina de Napoleão, por causa de Napoleão, cujo exército pode tê-lo usado durante o malsucedido cerco de Acre em 1799. A identificação do montículo com a Aco do Antigo Testamento não é contestada; a história da cidade posterior na península é contada em Ptolemaida."
    - "Juízes menciona Aco em primeiro lugar entre as cidades costeiras cujos habitantes a tribo de Aser não expulsou: “Aser não expulsou os habitantes de Aco, nem os habitantes de Sidom, nem de Ahlabe, nem de Aczibe…”, de modo que “os aseritas viveram entre os cananeus, os habitantes da terra”. O texto sinodal acrescenta entre colchetes, a partir do grego, que os habitantes de Aco pagavam tributo a Aser, e menciona também Dor. Este é o único versículo da Bíblia hebraica que menciona claramente a cidade."
    - "Escavações dirigidas por Moshe Dothan de 1973 a 1989 mostraram que o montículo foi habitado primeiro na Idade do Bronze Antigo e tornou-se uma cidade fortificada na Idade do Bronze Médio, por volta de 2000 a.C., com uma imensa muralha de terra e um muro de cidade; foi habitado durante o Bronze Final e a Idade do Ferro e voltou a crescer no período persa, até que, na época helenística, a cidade se mudou para oeste, para a península, e o montículo foi abandonado. Grande parte do trabalho de Dothan permaneceu inédita, e a partir de 2010 uma nova expedição, liderada por Ann Killebrew e Michal Artzy, retomou a escavação no montículo. Hoje o montículo se ergue dentro da cidade de Acre, no norte de Israel, com uma estátua de Napoleão no topo."
  de:
    - "Akko, die bronze- und eisenzeitliche Stadt, aus der Ptolemais und später Akkon wurde, lag auf dem Tel Akko, einem Hügel von etwa 20 Hektar unmittelbar östlich der Altstadt von Akkon, am Nordufer des Naaman, des antiken Belus, nahe seiner Mündung in die Bucht, die der Karmel im Süden abschließt. Sein arabischer Name ist Tell el-Fukhar, „Scherbenhügel“; er heißt auch Napoleonshügel, nach Napoleon, dessen Heer ihn bei der gescheiterten Belagerung von Akkon 1799 möglicherweise nutzte. Dass der Hügel mit dem alttestamentlichen Akko gleichzusetzen ist, wird nicht bestritten; die Geschichte der späteren Stadt auf der Halbinsel wird unter Ptolemais erzählt."
    - "Das Buch der Richter nennt Akko als Erstes unter den Küstenstädten, deren Einwohner der Stamm Asser nicht vertrieb: „Asser vertrieb die Einwohner zu Akko nicht noch die Einwohner zu Sidon, zu Ahelab, zu Achsib …“, sodass „die Asseriter wohnten unter den Kanaanitern, die im Lande wohnten“. Der Synodaltext fügt nach dem Griechischen in Klammern hinzu, dass die Leute von Akko Asser Tribut zahlten, und nennt auch Dor. Es ist der einzige Vers der hebräischen Bibel, der die Stadt eindeutig nennt."
    - "Grabungen unter Leitung von Moshe Dothan von 1973 bis 1989 zeigten, dass der Hügel erstmals in der Frühbronzezeit besiedelt wurde und in der Mittelbronzezeit, um 2000 v. Chr., zu einer befestigten Stadt mit einem mächtigen Erdwall und einer Stadtmauer wurde; er blieb in der Spätbronze- und Eisenzeit bewohnt und wuchs in persischer Zeit erneut, bis die Stadt in hellenistischer Zeit nach Westen auf die Halbinsel zog und der Hügel aufgegeben wurde. Vieles von Dothans Arbeit blieb unveröffentlicht, und ab 2010 nahm eine neue Expedition unter Ann Killebrew und Michal Artzy die Grabung auf dem Hügel wieder auf. Heute erhebt sich der Hügel innerhalb der Stadt Akkon im Norden Israels, mit einer Napoleonstatue auf seiner Spitze."
  fr:
    - "Acco, la ville des âges du Bronze et du Fer devenue Ptolémaïs puis Acre, se dressait sur Tel Akko, une butte d’environ 20 hectares juste à l’est de la vieille ville d’Acre, sur la rive nord du Naaman, l’ancien Bélos, près de son embouchure dans la baie que ferme au sud le mont Carmel. Son nom arabe est Tell el-Fukhar, « la butte des tessons » ; on l’appelle aussi la colline de Napoléon, dont l’armée l’utilisa peut-être lors de son siège manqué d’Acre en 1799. L’identification de la butte avec l’Acco de l’Ancien Testament n’est pas contestée ; l’histoire de la ville postérieure, sur la presqu’île, est racontée à Ptolémaïs."
    - "Les Juges nomment Acco en premier parmi les villes côtières dont la tribu d’Aser ne chassa pas les habitants : « Aser ne chassa point les habitants d’Acco, ni les habitants de Sidon, ni ceux d’Achlal, d’Aczib… », de sorte que « les Asérites habitèrent au milieu des Cananéens, habitants du pays ». Le texte synodal ajoute entre crochets, d’après le grec, que les gens d’Acco payaient tribut à Aser, et nomme aussi Dor. C’est le seul verset de la Bible hébraïque qui nomme clairement la ville."
    - "Les fouilles dirigées par Moshe Dothan de 1973 à 1989 ont montré que la butte fut habitée dès le Bronze ancien et devint une ville fortifiée au Bronze moyen, vers 2000 av. J.-C., avec un massif rempart de terre et une muraille ; elle resta habitée au Bronze récent et au Fer et prospéra de nouveau à l’époque perse, jusqu’à ce que, à l’époque hellénistique, la ville se déplace à l’ouest, sur la presqu’île, et que la butte soit abandonnée. Une grande partie du travail de Dothan est restée inédite, et depuis 2010 une nouvelle expédition dirigée par Ann Killebrew et Michal Artzy a repris les fouilles. Aujourd’hui la butte s’élève dans la ville d’Acre, dans le nord d’Israël, une statue de Napoléon à son sommet."
  it:
    - "Acco, la città dell’età del Bronzo e del Ferro divenuta poi Tolemaide e più tardi Acri, sorgeva su Tel Akko, un tell di circa 20 ettari subito a est della città vecchia di Acri, sulla riva nord del Naaman, l’antico Belo, vicino alla sua foce nella baia che il monte Carmelo chiude a sud. Il suo nome arabo è Tell el-Fukhar, «il tell dei cocci»; è detto anche Collina di Napoleone, da Napoleone, il cui esercito può averlo usato durante il fallito assedio di Acri nel 1799. L’identificazione del tell con l’Acco dell’Antico Testamento non è contestata; la storia della città successiva sulla penisola è narrata alla voce Tolemaide."
    - "Il libro dei Giudici nomina Acco per prima tra le città costiere i cui abitanti la tribù di Aser non cacciò: «Ascer non cacciò gli abitanti di Acco, né gli abitanti di Sidone, né quelli di Ahlab, di Aczib…», così che «i figliuoli di Ascer si stabilirono in mezzo ai Cananei che abitavano il paese». Il testo sinodale aggiunge tra parentesi, dal greco, che gli abitanti di Acco pagavano tributo ad Aser, e nomina anche Dor. È l’unico versetto della Bibbia ebraica che nomina chiaramente la città."
    - "Gli scavi diretti da Moshe Dothan dal 1973 al 1989 mostrarono che il tell fu abitato per la prima volta nell’antica età del Bronzo e divenne una città fortificata nella media età del Bronzo, verso il 2000 a.C., con un massiccio bastione di terra e una cinta muraria; fu abitato per tutta la tarda età del Bronzo e dell’età del Ferro e conobbe una nuova crescita in epoca persiana, finché in età ellenistica la città si spostò a ovest, sulla penisola, e il tell fu abbandonato. Gran parte del lavoro di Dothan rimase inedita e dal 2010 una nuova spedizione guidata da Ann Killebrew e Michal Artzy ha ripreso gli scavi sul tell. Oggi il tell si leva all’interno della città di Acri, nel nord di Israele, con una statua di Napoleone in cima."
  nl:
    - "Akko, de stad uit de bronstijd en ijzertijd die Ptolemaïs en later Akko (Acre) werd, lag op Tel Akko, een heuvel van ongeveer 20 hectare net ten oosten van de oude stad Akko, aan de noordoever van de Naäman, het antieke Belus, vlak bij de monding in de baai die de Karmel in het zuiden afsluit. De Arabische naam is Tell el-Fukhar, ‘de heuvel van de potscherven’; hij heet ook Napoleons Heuvel, naar Napoleon, wiens leger hem mogelijk gebruikte tijdens zijn mislukte beleg van Akko in 1799. De gelijkstelling van de heuvel met het Akko van het Oude Testament wordt niet betwist; de geschiedenis van de latere stad op het schiereiland wordt verteld onder Ptolemaïs."
    - "Richteren noemt Akko als eerste van de kuststeden wier bewoners de stam Aser niet verdreef: “Aser verdreef de inwoners van Acco niet, noch de inwoners van Sidon, noch Achlab, noch Achsib…”, zodat “de Aserieten woonden in het midden der Kanaänieten, die in het land woonden”. De Synodale tekst voegt naar het Grieks tussen haken toe dat de inwoners van Akko Aser schatting betaalden, en noemt ook Dor. Dit is het enige vers van de Hebreeuwse Bijbel dat de stad duidelijk noemt."
    - "Opgravingen onder leiding van Moshe Dothan van 1973 tot 1989 toonden aan dat de heuvel voor het eerst in de vroege bronstijd werd bewoond en in de midden-bronstijd, omstreeks 2000 v.Chr., een versterkte stad werd met een massieve aarden wal en een stadsmuur; hij bleef bewoond in de late bronstijd en de ijzertijd en groeide in de Perzische tijd opnieuw, tot de stad in de hellenistische tijd naar het westelijke schiereiland verhuisde en de heuvel werd verlaten. Veel van Dothans werk bleef onuitgegeven, en vanaf 2010 hervatte een nieuwe expeditie onder leiding van Ann Killebrew en Michal Artzy de opgravingen op de heuvel. Tegenwoordig verrijst de heuvel binnen de stad Akko in het noorden van Israël, met een standbeeld van Napoleon op de top."
  pl:
    - "Akko, miasto epoki brązu i żelaza, które stało się Ptolemaidą, a później Akką, leżało na Tel Akko, wzgórzu o powierzchni około 20 hektarów tuż na wschód od starego miasta Akka, na północnym brzegu rzeki Naaman, starożytnego Belusa, niedaleko jej ujścia do zatoki, którą od południa zamyka Karmel. Jego arabska nazwa to Tell el-Fukhar, „wzgórze skorup”; zwane jest też Wzgórzem Napoleona, od Napoleona, którego wojsko mogło z niego korzystać podczas nieudanego oblężenia Akki w 1799 roku. Utożsamienie wzgórza ze starotestamentowym Akko nie budzi wątpliwości; dzieje późniejszego miasta na półwyspie opisano w haśle Ptolemaida."
    - "Księga Sędziów wymienia Akko na pierwszym miejscu wśród nadmorskich miast, których mieszkańców pokolenie Aser nie wypędziło: „Aser też nie wypędził mieszkających w Acho, i mieszkających w Sydonie, i w Ahalab, i w Achsyb…”, tak że „mieszkał Aser w pośrodku Chananejczyka, mieszkającego w onej ziemi”. Tekst synodalny dodaje w nawiasie, za Septuagintą, że mieszkańcy Akko płacili Aserowi daninę, i wymienia także Dor. Jest to jedyny werset Biblii hebrajskiej, który wyraźnie nazywa to miasto."
    - "Wykopaliska prowadzone przez Moshe Dothana w latach 1973-1989 wykazały, że wzgórze zasiedlono po raz pierwszy we wczesnym brązie, a około 2000 p.n.e., w średnim brązie, stało się warownym miastem z potężnym wałem ziemnym i murem miejskim; było zamieszkane w późnym brązie i epoce żelaza i znów rozrosło się w okresie perskim, aż w epoce hellenistycznej miasto przeniosło się na zachód, na półwysep, a wzgórze opuszczono. Znaczna część prac Dothana pozostała niepublikowana, a od 2010 roku nowa wyprawa pod kierunkiem Ann Killebrew i Michal Artzy wznowiła badania na wzgórzu. Dziś wzgórze wznosi się w obrębie miasta Akka w północnym Izraelu, a na jego szczycie stoi pomnik Napoleona."
  cs:
    - "Akko, město z doby bronzové a železné, které se stalo Ptolemaidou a později Akkonem, stálo na Tel Akko, pahorku o rozloze asi 20 hektarů těsně východně od starého města Akka, na severním břehu řeky Na'aman, starověkého Belu, poblíž jejího ústí do zálivu, který na jihu uzavírá hora Karmel. Jeho arabské jméno je Tell el-Fuchár, „pahorek střepů“; říká se mu také Napoleonův pahorek, podle Napoleona, jehož vojsko ho mohlo využít při nezdařeném obléhání Akkonu roku 1799. Ztotožnění pahorku se starozákonním Akkem je nesporné; dějiny pozdějšího města na poloostrově jsou vyprávěny pod heslem Ptolemais."
    - "Kniha Soudců jmenuje Akko jako první z pobřežních měst, jejichž obyvatele pokolení Ašer nevyhnalo: „Asser také nevyhnal obyvatelů Acho a obyvatelů Sidonu, ani Ahalab, ani Achzib…“, takže „bydlil Asser mezi Kananejskými obyvateli země té“. Synodální text v závorce podle řečtiny dodává, že obyvatelé Akka platili Ašerovi daň, a jmenuje také Dór. Je to jediný verš hebrejské Bible, který město jasně jmenuje."
    - "Vykopávky vedené Moše Dotanem v letech 1973 až 1989 ukázaly, že pahorek byl poprvé osídlen v raném bronzu; ve střední době bronzové, kolem roku 2000 př. n. l., se stal opevněným městem s mohutným zemním valem a hradbou; byl obydlen v pozdní době bronzové i železné a v perském období znovu vzkvétal, až se v helénistické době město přesunulo na západ na poloostrov a pahorek byl opuštěn. Velká část Dotanovy práce zůstala nepublikována a od roku 2010 obnovila vykopávky na pahorku nová expedice vedená Ann Killebrew a Michal Artzy. Dnes se pahorek tyčí uvnitř města Akko v severním Izraeli a na jeho vrcholu stojí socha Napoleona."
  sv:
    - "Acko, brons- och järnålderns stad som blev Ptolemais och senare Akko, låg på Tel Akko, en kulle på omkring 20 hektar strax öster om Akkos gamla stad, på norra stranden av Naaman, det antika Belus, nära dess mynning i den bukt som Karmel stänger i söder. Dess arabiska namn är Tell el-Fukhar, ”kruskärvornas kulle”; den kallas också Napoleons kulle, efter Napoleon, vars armé kan ha använt den under hans misslyckade belägring av Akko 1799. Att kullen är det gammaltestamentliga Acko är obestridt; den senare stadens historia på halvön berättas under Ptolemais."
    - "Domarboken nämner Acko först bland de kuststäder vars folk Ashers stam inte fördrev: ”Aser fördrev icke invånarna i Acko eller invånarna i Sidon, ej heller dem i Alab, Aksib …”, och ”alltså bodde aseriterna bland kananéerna, landets gamla inbyggare”. Synodalbibelns text tillägger inom hakparentes, efter grekiskan, att Ackos folk betalade skatt till Asher, och nämner även Dor. Det är den enda versen i den hebreiska Bibeln som tydligt nämner staden."
    - "Utgrävningar under ledning av Moshe Dothan 1973–1989 visade att kullen först bosattes under äldre bronsåldern och blev en befäst stad under mellersta bronsåldern, omkring 2000 f.Kr., med en massiv jordvall och en stadsmur; den var bebodd under senare bronsåldern och järnåldern och växte åter under den persiska tiden, tills staden under den hellenistiska epoken flyttade västerut till halvön och kullen övergavs. Mycket av Dothans arbete förblev opublicerat, och från 2010 återupptog en ny expedition under ledning av Ann Killebrew och Michal Artzy utgrävningen på kullen. I dag reser sig kullen inne i staden Akko i norra Israel, med en staty av Napoleon på toppen."
  nb:
    - "Akko, byen fra bronse- og jernalderen som ble til Ptolemais og senere Acre, lå på Tel Akko, en tell på omtrent 20 hektar like øst for gamlebyen i Acre, på nordbredden av Naaman, det gamle Belus, nær munningen i bukta som Karmel lukker mot sør. Det arabiske navnet er Tell el-Fukhar, «krukkeskjærenes tell»; den kalles også Napoleons høyde, etter Napoleon, hvis hær kan ha brukt den under hans mislykte beleiring av Acre i 1799. At tellen er det gammeltestamentlige Akko, er ikke omstridt; historien til den senere byen på halvøya fortelles under Ptolemais."
    - "Dommerboken nevner Akko først blant kystbyene hvis folk Asjers stamme ikke drev bort: «Aser drev ikke bort innbyggerne i Akko og innbyggerne i Sidon og Ahlab og Aksib …», slik at «aserittene bosatte sig midt iblandt kana'anittene som bodde i landet». Synodalteksten tilføyer i klammer, etter den greske teksten, at folket i Akko betalte skatt til Asjer, og nevner også Dor. Dette er det eneste verset i den hebraiske bibelen som klart nevner byen."
    - "Utgravninger ledet av Moshe Dotan fra 1973 til 1989 viste at tellen først ble bosatt i eldre bronsealder og ble en befestet by i mellombronsealder, omkring 2000 f.Kr., med en massiv jordvoll og en bymur; den var bebodd gjennom senbronsealder og jernalder og vokste igjen i persisk tid, til byen i hellenistisk tid flyttet vestover til halvøya og tellen ble forlatt. Mye av Dotans arbeid forble upublisert, og fra 2010 tok en ny ekspedisjon ledet av Ann Killebrew og Michal Artzy opp igjen utgravningen på tellen. I dag hever tellen seg inne i byen Acre i Nord-Israel, med en statue av Napoleon på toppen."
  tl:
    - "Ang Acho, ang bayan ng Panahon ng Tanso at Panahon ng Bakal na naging Tolemaida at kalaunan ay Acre, ay nakatayo sa Tel Akko, isang burol na may humigit-kumulang 20 ektarya sa silangan lamang ng lumang lungsod ng Acre, sa hilagang pampang ng Naaman, ang sinaunang Belus, malapit sa bukana nito sa look na isinasara ng Bundok Carmelo sa timog. Ang pangalan nitong Arabe ay Tell el-Fukhar, “ang burol ng mga piraso ng palayok”; tinatawag din itong Burol ni Napoleon, na ipinangalan kay Napoleon, na ang hukbo ay maaaring gumamit dito sa nabigong pagkubkob niya sa Acre noong 1799. Hindi pinagtatalunan ang pagkakatukoy ng burol sa Acho ng Lumang Tipan; isinasalaysay ang kasaysayan ng mas huling lungsod sa tangway sa ilalim ng Tolemaida."
    - "Pinangalanan ng Mga Hukom ang Acho na una sa mga bayan sa baybayin na ang mga tao ay hindi pinalayas ng lipi ni Aser: “Hindi pinalayas ng Aser ang mga taga Acho, ni ang mga taga Sidon, ni ang taga Ahlab, ni ang taga Achzib…”, kundi “ang mga Aserita ay nagsitahang kasama ng mga Cananeo, na mga taga lupaing yaon”. Idinaragdag ng tekstong Sinodal sa loob ng mga bracket, mula sa Griyego, na ang mga taga-Acho ay nagbayad ng tributo kay Aser, at pinangalanan din ang Dor. Ito lamang ang talata ng Bibliyang Hebreo na malinaw na nagpapangalan sa bayan."
    - "Ipinakita ng mga paghuhukay sa pamumuno ni Moshe Dothan mula 1973 hanggang 1989 na unang tinirahan ang burol noong Maagang Panahon ng Tanso at naging kutang lungsod noong Gitnang Panahon ng Tanso, mga 2000 BK, na may malaking tambak-lupang pananggalang at pader ng lungsod; tinirahan ito sa buong Huling Panahon ng Tanso at Panahon ng Bakal at lumago muli sa panahong Persiano, hanggang sa panahong Helenistiko ay lumipat ang lungsod sa kanluran sa tangway at pinabayaan ang burol. Marami sa gawa ni Dothan ang nanatiling hindi nalathala, at mula 2010 ay ipinagpatuloy ng isang bagong ekspedisyon sa pamumuno nina Ann Killebrew at Michal Artzy ang paghuhukay sa burol. Ngayon, ang burol ay nakaangat sa loob ng lungsod ng Acre sa hilagang Israel, na may estatwa ni Napoleon sa tuktok nito."
  da:
    - "Akko, bronze- og jernalderbyen, der blev til Ptolemais og senere Acre, lå på Tel Akko, en tell på omkring 20 hektar lige øst for Acres gamle by, på nordbredden af Na'aman, det gamle Belus, nær dens munding i den bugt, som Karmel lukker mod syd. Dens arabiske navn er Tell el-Fukhar, »potteskårenes tell«; den kaldes også Napoleonshøjen efter Napoleon, hvis hær muligvis brugte den under hans mislykkede belejring af Acre i 1799. At tellen er det gammeltestamentlige Akko, er ubestridt; den senere bys historie på halvøen fortælles under Ptolemais."
    - "Dommerbogen nævner Akko først blandt de kystbyer, hvis folk Aser stamme ikke fordrev: »Aser fordrev ikke Indbyggerne i Akko eller Indbyggerne i Zidon og Alab og Aksib ...«, så »Aseriterne boede iblandt Kananiterne, Landets Indbyggere«. Synodalteksten tilføjer i klammer, fra græsk, at Akkos folk betalte Aser tribut, og nævner også Dor. Det er det eneste vers i den hebraiske bibel, der tydeligt nævner byen."
    - "Udgravninger under ledelse af Moshe Dothan fra 1973 til 1989 viste, at tellen først blev bosat i tidlig bronzealder og blev en befæstet by i mellembronzealderen, omkring 2000 f.Kr., med en massiv jordvold og en bymur; den var beboet gennem senbronzealder og jernalder og voksede igen i den persiske periode, indtil byen i den hellenistiske tid flyttede vest på halvøen, og tellen blev forladt. Meget af Dothans arbejde forblev upubliceret, og fra 2010 genoptog en ny ekspedition under Ann Killebrew og Michal Artzy udgravningen på tellen. I dag rejser tellen sig inde i byen Acre i det nordlige Israel, med en statue af Napoleon på toppen."
  sr:
    - "Ако, град бронзаног и гвозденог доба који је постао Птолемаида, а касније Акра, стајао је на Тел Ако, хумци од око 20 хектара одмах источно од старог града Акре, на северној обали реке Наман, античког Бела, близу њеног ушћа у залив који Кармил затвара на југу. Његово арапско име је Тел ел-Фухар, „хумка црепова“; зове се и Наполеонов брег, по Наполеону, чија је војска можда користила хумку током његове неуспешне опсаде Акре 1799. Поистовећивање хумке са старозаветним Акоом није спорно; историја каснијег града на полуострву изложена је под Птолемаидом."
    - "Књига о Судијама именује Ако прво међу приобалним градовима чије становнике племе Асирово није истерало: „Асир не изагна становнике из Акона, ни становнике из Сидона ни из Алава, ни из Ахазива…“, тако да „Асир живљаше међу Хананејима, становницима оне земље“. Синодални текст у заградама, према грчком, додаје да су становници Акоа плаћали данак Асиру, и именује и Дор. То је једини стих хебрејске Библије који град јасно именује."
    - "Ископавања која је од 1973. до 1989. водио Моше Дотан показала су да је хумка први пут насељена у раном бронзаном добу, а да је постала утврђен град у средњем бронзаном добу, око 2000. п. н. е., с огромним земљаним бедемом и градским зидом; била је настањена кроз касно бронзано и гвоздено доба и поново је порасла у персијском периоду, док се у хеленистичко доба град није преселио на запад, на полуострво, а хумка је напуштена. Велики део Дотановог рада остао је необјављен, а од 2010. нова експедиција коју воде Ен Килбру и Михал Арци наставила је ископавања на хумци. Данас се хумка уздиже унутар града Акре у северном Израелу, са Наполеоновим кипом на врху."
  hu:
    - "Akkó, a bronz- és vaskori város, amelyből Ptolemais, majd Akka lett, a Tel Akkón állt, egy mintegy 20 hektáros halmon Akka óvárosától keletre, a Naamán (az ókori Belus) északi partján, a torkolata közelében, abban az öbölben, amelyet délen a Kármel-hegy zár le. Arab neve Tell el-Fukhar, „a cseréptörmelék halma”; Napóleon-dombnak is hívják Napóleon után, akinek serege 1799-ben, Akka sikertelen ostroma idején feltehetően használta. A halom azonosítása az ószövetségi Akkóval nem vitatott; a félszigeten álló későbbi város történetét a Ptolemais címszó mondja el."
    - "A Bírák könyve Akkót nevezi meg elsőként azon tengerparti városok között, amelyeknek lakóit Áser törzse nem űzte ki: „Áser sem űzte el sem Akkó, sem Sidon, sem Akhláb, sem Akzib… lakóit”, úgyhogy „ott lakott Áser a Kananeusok, a föld lakói között”. A szinodális szöveg zárójelben a görögből hozzáteszi, hogy az akkóiak adót fizettek Ásernek, és Dórt is megnevezi. Ez a héber Biblia egyetlen verse, amely egyértelműen megnevezi a várost."
    - "Moshe Dothan 1973 és 1989 között vezetett ásatásai kimutatták, hogy a halmon a korai bronzkorban telepedtek meg először, a középső bronzkorban, Kr. e. 2000 körül pedig megerősített várossá vált hatalmas földsánccal és városfallal; lakott volt a késő bronzkorban és a vaskorban, a perzsa korban pedig újra növekedett, míg a hellenisztikus korban a város nyugatra, a félszigetre költözött, a halmot pedig elhagyták. Dothan munkájának nagy része kiadatlan maradt, 2010-től pedig Ann Killebrew és Michal Artzy vezetésével új expedíció folytatja az ásatást a halmon. A halom ma Akka városán belül emelkedik Izráel északi részén, tetején Napóleon szobrával."
  fi:
    - "Akko, pronssi- ja rautakauden kaupunki, josta tuli Ptolemais ja myöhemmin Acre, sijaitsi Tel Akkolla, noin 20 hehtaarin kumpareella Acren vanhan kaupungin välittömästi itäpuolella, Naamanin, muinaisen Beluksen, pohjoisrannalla lähellä sen suuta lahdella, jonka Karmelvuori sulkee etelässä. Sen arabialainen nimi on Tell el-Fukhar, ”saviruukunsirujen kumpu”; sitä kutsutaan myös Napoleonin kukkulaksi Napoleonin mukaan, jonka armeija saattoi käyttää sitä hänen epäonnistuneen Acren piirityksensä aikana vuonna 1799. Kumpareen samaistamista Vanhan testamentin Akkoon ei kiistetä; myöhemmän niemimaalla sijainneen kaupungin historia kerrotaan artikkelissa Ptolemais."
    - "Tuomarien kirja mainitsee Akkon ensimmäisenä niistä rannikkokaupungeista, joiden asukkaita Asserin sukukunta ei karkoittanut: ”Asser ei karkoittanut Akkon asukkaita eikä Siidonin asukkaita eikä myöskään Ahlabin, Aksibin …”, niin että ”asserilaiset joutuivat asumaan maan asukkaiden, kanaanilaisten, keskeen”. Synodaalinen teksti lisää kreikan mukaan hakasulkeissa, että Akkon asukkaat maksoivat veroa Asserille, ja mainitsee myös Dorin. Tämä on ainoa heprealaisen Raamatun jae, joka nimeää kaupungin selvästi."
    - "Moshe Dothanin johtamat kaivaukset vuosina 1973–1989 osoittivat, että kumpu asutettiin ensimmäisen kerran varhaispronssikaudella ja siitä tuli linnoitettu kaupunki keskipronssikaudella, noin 2000 eaa., massiivisine multavalleineen ja kaupunginmuureineen; se oli asuttu myöhäispronssi- ja rautakauden läpi ja kasvoi uudelleen persialaisella kaudella, kunnes hellenistisenä aikana kaupunki siirtyi länteen niemimaalle ja kumpu hylättiin. Suuri osa Dothanin työstä jäi julkaisematta, ja vuodesta 2010 Ann Killebrewin ja Michal Artzyn johtama uusi retkikunta jatkoi kaivauksia kumpareella. Nykyisin kumpu kohoaa Acren kaupungin sisällä Pohjois-Israelissa, ja sen huipulla on Napoleonin patsas."
  vi:
    - "A-cô, thị trấn thời Đồ Đồng và Đồ Sắt về sau trở thành Bê-tô-lê-mai và rồi Acre, nằm trên Tel Akko, một gò khoảng 20 héc-ta ngay phía đông khu thành cổ Acre, trên bờ bắc sông Na-a-man, tức sông Belus thời cổ, gần cửa sông trên vịnh mà núi Cạt-mên khép lại ở phía nam. Tên Ả Rập của gò là Tell el-Fukhar, “gò của những mảnh gốm vỡ”; gò còn được gọi là Đồi Napoléon, theo tên Napoléon, vì quân đội của ông có thể đã dùng gò này trong cuộc vây hãm Acre bất thành năm 1799. Việc đồng nhất gò này với A-cô trong Cựu Ước không bị tranh cãi; lịch sử của thành phố sau này trên bán đảo được kể ở mục Bê-tô-lê-mai."
    - "Sách Các Quan Xét nêu A-cô đầu tiên trong số các thành ven biển mà chi phái A-se không đuổi dân cư: “Người A-se cũng chẳng đuổi dân ở A-cô, hoặc dân ở Si-đôn, dân ở Ách-láp, dân ở Ạc-xíp…”, đến nỗi “Người A-se lập sản nghiệp ở giữa dân Ca-na-an, là dân bổn xứ”. Bản văn Synodal thêm trong ngoặc, theo tiếng Hy Lạp, rằng dân A-cô nộp cống cho A-se, và còn nêu cả Đô-rơ. Đây là câu duy nhất trong Kinh Thánh Hê-bơ-rơ nêu tên thành một cách rõ ràng."
    - "Các cuộc khai quật do Moshe Dothan chỉ đạo từ năm 1973 đến 1989 cho thấy gò này được định cư lần đầu từ đầu thời Đồ Đồng và trở thành một thành kiên cố vào thời Đồ Đồng Giữa, khoảng năm 2000 TCN, với một thành lũy đất đồ sộ và một bức tường thành; nó có người ở suốt thời Đồ Đồng Muộn và Đồ Sắt và lại phát triển vào thời Ba Tư, cho đến thời Hy Lạp hóa thì thành dời về phía tây đến bán đảo và gò bị bỏ hoang. Phần lớn công trình của Dothan vẫn chưa được công bố, và từ năm 2010 một đoàn thám hiểm mới do Ann Killebrew và Michal Artzy dẫn đầu đã tiếp tục khai quật trên gò. Ngày nay gò nằm trong thành phố Acre ở miền bắc Israel, với một bức tượng Napoléon trên đỉnh."
  ro:
    - "Aco, cetatea din epoca bronzului și a fierului care a devenit Ptolemaida și, mai târziu, Acra, se afla pe Tel Akko, un tell de aproximativ 20 de hectare chiar la est de orașul vechi Acra, pe malul de nord al râului Naaman, vechiul Belus, aproape de vărsarea lui în golful pe care muntele Carmel îl închide la sud. Numele său arab este Tell el-Fukhar, „movila cioburilor”; se mai numește și Dealul lui Napoleon, după Napoleon, a cărui armată l-a folosit probabil în timpul asediului eșuat al Acrei din 1799. Identificarea tellului cu Aco din Vechiul Testament nu este contestată; istoria cetății de mai târziu de pe peninsulă este povestită la Ptolemaida."
    - "Cartea Judecătorilor îl numește pe Aco primul dintre orașele de coastă ai căror locuitori nu au fost izgoniți de seminția lui Așer: Așer nu i-a alungat pe locuitorii din Aco, nici pe cei din Sidon, din Ahlab sau din Aczib, așa încât așeriții au locuit printre canaaniți, locuitorii țării. Textul sinodal adaugă între paranteze, după Septuaginta, că locuitorii din Aco plăteau tribut lui Așer, și îl numește și pe Dor. Acesta este singurul verset al Bibliei ebraice care numește limpede cetatea."
    - "Săpăturile conduse de Moshe Dothan între 1973 și 1989 au arătat că tellul a fost locuit prima dată în epoca bronzului timpuriu și a devenit o cetate întărită în epoca bronzului mijlociu, în jurul anului 2000 î.Hr., cu un val de pământ masiv și un zid de cetate; a fost locuit în epoca bronzului târziu și a fierului și a crescut din nou în perioada persană, până când, în epoca elenistică, cetatea s-a mutat spre vest, pe peninsulă, iar tellul a fost părăsit. O mare parte din lucrările lui Dothan au rămas nepublicate, iar din 2010 o nouă expediție condusă de Ann Killebrew și Michal Artzy a reluat săpăturile pe tell. Astăzi tellul se ridică în interiorul orașului Acra, în nordul Israelului, cu o statuie a lui Napoleon pe vârf."
  bg:
    - "Акон, градът от бронзовата и желязната епоха, който станал Птолемаида и по-късно Акре, стоял на Тел Акко — могила от около 20 хектара точно на изток от стария град Акре, на северния бряг на Нааман, древния Белус, близо до устието му в залива, затворен на юг от Кармил. Арабското му име е Тел ел-Фухар, „хълмът на черепките“; нарича се още Хълмът на Наполеон, по Наполеон, чиято войска може да го е използвала при неуспешната му обсада на Акре през 1799 г. Отъждествяването на могилата с Акон от Стария завет не се оспорва; историята на по-късния град на полуострова е разказана в статията за Птолемаида."
    - "Съдии назовава Акон пръв сред крайбрежните градове, чиито жители Асировото племе не изгонило: „Нито Асир изгони жителите на Акхо, нито жителите на Сидон, нито на Ахлав, нито на Ахзив…“, тъй че „Асир имаше населението си между Ханаанците жителите на местото“. Синодалният текст добавя в скоби, по гръцкия, че жителите на Акон плащали данък на Асир, и назовава и Дор. Това е единственият стих на еврейската Библия, който ясно назовава града."
    - "Разкопките, ръководени от Моше Дотан от 1973 до 1989 г., показаха, че могилата била заселена за първи път в ранната бронзова епоха и станала укрепен град в средната бронзова епоха, около 2000 г. пр.н.е., с масивен земен вал и градска стена; била обитавана през късната бронзова и желязната епоха и отново се разраснала през персийския период, докато през елинистическата епоха градът се преместил на запад, на полуострова, а могилата била изоставена. Голяма част от работата на Дотан остана непубликувана, а от 2010 г. нова експедиция начело с Ан Килбрю и Михал Арци поднови разкопките на могилата. Днес могилата се издига в рамките на град Акре в северен Израил, със статуя на Наполеон на върха."
scripture:
