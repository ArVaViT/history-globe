body:
  en:
    - "Abronah (Ebronah in the King James Version) is a station of Israel's wanderings known only from the itinerary of Numbers 33: “they removed from Jotbathah, and encamped at Ebronah. And they departed from Ebronah, and encamped at Ezion-gaber”. The name is from the root “to cross”, and may mean a passage or a ford. Since Ezion-geber lay at or near the head of the Gulf of Aqaba, Abronah must be sought on the last stretch of the road down to it, in the southern Arabah or in the hills that close the gulf on the west."
    - "No site is known. Proposals put it near Elath itself, at the modern Eilat, or at the spring of Ain Defiyeh (Ein Evrona) in the Arabah to the north; each rests on nothing more than the order of the stations, and no ancient name survives on the ground. This is all that can be said. The country is today the southern tip of Israel and the corner of Egypt and Jordan around the Gulf of Aqaba."
  ru:
    - "Аврон — стан странствий Израиля, известный только по перечню станов в 33-й главе книги Чисел: «И отправились от Иотвафы и расположились станом в Авроне. И отправились из Аврона и расположились станом в Ецион-Гавере». Имя образовано от корня «переходить» и может означать проход или переправу. Поскольку Ецион-Гавер лежал у вершины залива Акаба или близ неё, Аврон следует искать на последнем отрезке дороги к нему — в южной Араве или в горах, замыкающих залив с запада."
    - "Место неизвестно. Его помещали рядом с самим Елафом, у нынешнего Эйлата, или у источника Айн-Дефие (Эйн-Эврона) в Араве к северу от него; каждое предположение опирается лишь на порядок станов, и древнее имя на земле не сохранилось. Это всё, что можно сказать. Край этот сегодня — южная оконечность Израиля и стык Египта и Иордании вокруг залива Акаба."
  uk:
    - "Аврона (Еврона в Біблії короля Якова) — стоянка мандрівки Ізраїлю, відома лише з переліку станів у Числах 33: «рушили з Йотбата та й отаборились ув Абронї. І рушили з Аброна та й отаборились у Езйон-Гебер». Назва походить від кореня «переходити» і може означати прохід або брід. Оскільки Еціон-Гевер лежав на вершині Акабської затоки або поблизу неї, Авроні слід шукати на останньому відтинку шляху до нього — у південній Араві або в пагорбах, що замикають затоку із заходу."
    - "Місце невідоме. Її пропонують шукати поблизу самого Елата, у сучасному Ейлаті, або біля джерела Айн-Дефія (Ейн-Евруна) в Араві на північ; кожна спирається лише на послідовність станів, і жодна давня назва на місцевості не збереглася. Це все, що можна сказати. Ця місцевість нині — південний край Ізраїлю та куток Єгипту й Йорданії навколо Акабської затоки."
  es:
    - "Abrona (Ebrona en la versión del rey Jacobo) es una estación de las peregrinaciones de Israel conocida solo por el itinerario de Números 33: «partidos de Jotbatha, asentaron en Abrona. Y partidos de Abrona, asentaron en Esion-geber». El nombre procede de la raíz «cruzar» y puede significar un paso o un vado. Como Ezión-geber estaba en la cabecera del golfo de Áqaba o cerca de ella, Abrona debe buscarse en el último tramo del camino que desciende hasta ella, en el sur del Arabá o en las colinas que cierran el golfo por el oeste."
    - "No se conoce el sitio. Las propuestas la sitúan cerca de la propia Elat, en la actual Eilat, o en el manantial de Ain Defiyeh (Ein Evrona), en el Arabá al norte; cada una se apoya en nada más que el orden de las estaciones, y no sobrevive ningún nombre antiguo sobre el terreno. Esto es todo lo que puede decirse. El país es hoy la punta meridional de Israel y el rincón de Egipto y Jordania en torno al golfo de Áqaba."
  pt:
    - "Abrona (Ebrona na versão King James) é uma estação das peregrinações de Israel conhecida apenas pelo itinerário de Números 33: “Partiram de Jotbatá e acamparam em Abroná. Partiram de Abroná e acamparam em Eziom-Geber”. O nome vem da raiz “atravessar” e pode significar passagem ou vau. Como Eziom-Geber ficava na cabeceira do golfo de Aqaba ou perto dela, Abrona deve ser procurada no último trecho do caminho que desce até ele, no sul da Arabá ou nas colinas que fecham o golfo a oeste."
    - "Não se conhece o sítio. As propostas a situam junto à própria Elate, na atual Eilat, ou na fonte de Ain Defiyeh (Ein Evrona), na Arabá, ao norte; cada uma se apoia apenas na ordem das estações, e nenhum nome antigo sobrevive no terreno. Isso é tudo o que se pode dizer. A região é hoje a ponta sul de Israel e o canto do Egito e da Jordânia ao redor do golfo de Aqaba."
  de:
    - "Abrona (Ebrona in der King-James-Bibel) ist eine Station der Wanderung Israels, die nur aus dem Wegverzeichnis von 4. Mose 33 bekannt ist: „Von Jotbatha zogen sie aus und lagerten sich in Abrona. Von Abrona zogen sie aus und lagerten sich in Ezeon-Geber.“ Der Name stammt von der Wurzel „hinübergehen“ und kann einen Übergang oder eine Furt bedeuten. Da Ezjon-Geber am Kopf des Golfs von Akaba oder in seiner Nähe lag, muss Abrona auf dem letzten Wegstück dorthin gesucht werden, in der südlichen Araba oder in den Bergen, die den Golf im Westen abschließen."
    - "Kein Ort ist bekannt. Vorgeschlagen wurden die Nähe von Elat selbst, das heutige Eilat, oder die Quelle Ain Defiye (Ein Evrona) in der Araba weiter nördlich; beides beruht auf nichts anderem als der Reihenfolge der Stationen, und kein antiker Name hat sich im Gelände erhalten. Mehr lässt sich nicht sagen. Das Land ist heute die Südspitze Israels und die Ecke Ägyptens und Jordaniens rund um den Golf von Akaba."
  fr:
    - "Abrona (Ébrona dans la version King James) est une étape des pérégrinations d’Israël connue seulement par l’itinéraire de Nombres 33 : « Ils partirent de Jothbatha, et campèrent à Abrona. Ils partirent d’Abrona, et campèrent à Étsjon-Guéber ». Le nom vient de la racine « traverser » et peut signifier un passage ou un gué. Étsjon-Guéber se trouvant à la pointe du golfe d’Aqaba ou près d’elle, Abrona doit être cherchée sur le dernier tronçon de la route qui y descend, dans le sud de l’Araba ou dans les collines qui ferment le golfe à l’ouest."
    - "Aucun site n’est connu. On l’a placée près d’Élath même, à l’actuelle Eilat, ou à la source d’Ain Defiyeh (Ein Evrona) dans l’Araba, plus au nord ; chaque proposition ne repose que sur l’ordre des étapes, et aucun nom ancien ne survit sur le terrain. C’est tout ce qu’on peut en dire. Le pays est aujourd’hui la pointe sud d’Israël et l’angle de l’Égypte et de la Jordanie autour du golfe d’Aqaba."
  it:
    - "Abrona (Ebronah nella King James Version) è una tappa del cammino d’Israele nota solo dall’itinerario di Numeri 33: «Partirono da Jotbathah e si accamparono a Abrona. Partirono da Abrona e si accamparono a Etsion-Gheber». Il nome deriva dalla radice «attraversare» e può significare un passaggio o un guado. Poiché Ezion-Gheber si trovava all’estremità del golfo di Aqaba o nei suoi pressi, Abrona va cercata nell’ultimo tratto della strada che vi scende, nell’Araba meridionale o sulle colline che chiudono il golfo a ovest."
    - "Non se ne conosce il sito. Le proposte la collocano presso la stessa Elat, nell’odierna Eilat, o alla sorgente di Ain Defiyeh (Ein Evrona) nell’Araba più a nord; ciascuna poggia soltanto sull’ordine delle tappe, e sul terreno non sopravvive alcun nome antico. Questo è tutto ciò che si può dire. La regione è oggi la punta meridionale di Israele e l’angolo di Egitto e Giordania intorno al golfo di Aqaba."
  pl:
    - "Abrona (Ebrona w Biblii króla Jakuba) to stacja wędrówki Izraela znana tylko z wykazu w Lb 33: „A ruszywszy się z Jotbata, położyli się obozem w Habrona. A ruszywszy się z Habrona, położyli się obozem w Asyjongaber”. Nazwa pochodzi od rdzenia „przechodzić” i może oznaczać przejście lub bród. Skoro Esjon-Geber leżało u wylotu Zatoki Akaba lub w jego pobliżu, Abronę należy szukać na ostatnim odcinku drogi do niego, w południowej Arabie albo we wzgórzach zamykających zatokę od zachodu."
    - "Miejsce nie jest znane. Proponowano okolice samego Elat, dzisiejszego Ejlatu, albo źródło Ain Defiyeh (Ein Evrona) w Arabie na północy; każda z tych propozycji opiera się tylko na kolejności stacji, a żadna dawna nazwa nie przetrwała w terenie. Tyle można powiedzieć. Kraj ten to dziś południowy kraniec Izraela oraz narożniki Egiptu i Jordanii wokół Zatoki Akaba."
  nl:
    - "Abrona (Ebrona in de King James Version) is een halte van Israëls omzwervingen die alleen bekend is uit het reisverslag van Numeri 33: “En zij verreisden van Jotbatha, en legerden zich in Abrona. En zij verreisden van Abrona, en legerden zich in Ezeon-Geber”. De naam komt van de wortel “oversteken” en kan een doorgang of een voorde betekenen. Omdat Ezeon-Geber aan of bij het hoofd van de Golf van Akaba lag, moet Abrona worden gezocht op het laatste stuk van de weg ernaartoe, in de zuidelijke Araba of in de heuvels die de golf in het westen afsluiten."
    - "Er is geen plaats bekend. Voorstellen zoeken haar bij Elat zelf, het huidige Eilat, of bij de bron Ain Defiyeh (Ein Evrona) in de Araba, verder naar het noorden; elk berust op niets meer dan de volgorde van de standplaatsen, en er is ter plekke geen oude naam bewaard. Meer valt er niet te zeggen. Het gebied is tegenwoordig de zuidpunt van Israël en de hoek van Egypte en Jordanië rond de Golf van Akaba."
  cs:
    - "Abrona (v Bibli krále Jakuba Ebronah) je stanice izraelského putování známá jen z itineráře v Numeri 33: „Když se pak hnuli z Jotbata, položili se v Habrona. A z Habrona hnuvše se, položili se v Aziongaber.“ Jméno je z kořene „přejít“ a může znamenat průchod nebo brod. Protože Ecjon-geber ležel na konci Akabského zálivu nebo poblíž něj, je třeba hledat Abronu na posledním úseku cesty k němu, v jižní Arabě nebo v pahorcích, které záliv uzavírají na západě."
    - "Místo není známo. Návrhy je kladou poblíž samotného Élatu, na dnešní Ejlat, nebo k prameni Ain Defiyeh (Ein Evrona) v Arabě na severu; každý z nich se opírá jen o pořadí stanic a na zemi se nezachovalo žádné starověké jméno. Víc říci nelze. Země je dnes jižním cípem Izraele a rohem Egypta a Jordánska kolem Akabského zálivu."
  sv:
    - "Avrona (Ebrona i King James-översättningen) är en station på Israels vandring som bara är känd från vandringsförteckningen i Fjärde Mosebok 33: ”bröto upp från Jotbata och lägrade sig i Abrona … bröto upp från Abrona och lägrade sig i Esjon-Geber”. Namnet kommer av roten ”att gå över” och kan betyda en övergång eller ett vadställe. Eftersom Esjon-Geber låg vid eller nära Akabavikens inre ända måste Avrona sökas på den sista delen av vägen ditned, i södra Arava eller i bergen som stänger viken i väster."
    - "Ingen plats är känd. Förslagen placerar den nära själva Elat, vid nuvarande Eilat, eller vid källan Ajin Defiyeh (Ein Evrona) i Arava längre norrut; vart och ett vilar på ingenting annat än stationernas ordning, och inget antikt namn har överlevt i terrängen. Mer kan inte sägas. Trakten är i dag Israels sydspets och hörnet av Egypten och Jordanien kring Akabaviken."
  nb:
    - "Abrona (Ebrona i King James-oversettelsen) er en stasjon på Israels vandring som bare er kjent fra reiseruten i 4. Mosebok 33: «Og de drog fra Jotbata og leiret sig i Abrona. Og de drog fra Abrona og leiret sig i Esjon-Geber». Navnet kommer av roten «å krysse» og kan bety en overgang eller et vadested. Siden Esjon-Geber lå ved eller nær den innerste delen av Akababukta, må Abrona søkes på den siste delen av veien ned dit, i sørlige Arava eller i åsene som lukker bukta mot vest."
    - "Ingen lokalitet er kjent. Forslagene plasserer den nær selve Elat, ved dagens Eilat, eller ved kilden Ajin Defiyeh (Ein Evrona) i Arava lenger nord; hvert av dem hviler på ikke mer enn rekkefølgen av stasjonene, og intet gammelt navn har overlevd på stedet. Mer kan ikke sies. Området er i dag den sørlige spissen av Israel og hjørnet av Egypt og Jordan rundt Akababukta."
  tl:
    - "Ang Abrona (Ebronah sa King James Version) ay isang himpilan sa mga paglalakbay ng Israel na kilala lamang mula sa talaan ng paglalakbay sa Mga Bilang 33: “At sila'y naglakbay mula sa Jotbatha, at humantong sa Abrona. At sila'y naglakbay mula sa Abrona, at humantong sa Esion-geber.” Ang pangalan ay mula sa ugat na “tumawid”, at maaaring nangangahulugang daanan o tawiran. Yamang ang Esion-geber ay nasa dulo ng Golpo ng Aqaba o malapit dito, ang Abrona ay dapat hanapin sa huling bahagi ng daang pababa rito, sa timog na Araba o sa mga burol na sumasara sa golpo sa kanluran."
    - "Walang kilalang lugar. Inilalagay ito ng mga mungkahi malapit mismo sa Elath, sa makabagong Eilat, o sa bukal ng Ain Defiyeh (Ein Evrona) sa Araba sa hilaga; bawat isa ay nakasalig lamang sa pagkakasunod-sunod ng mga himpilan, at walang sinaunang pangalang nananatili sa lupa. Iyan na ang lahat ng masasabi. Ang lupain ay ngayon ang katimugang dulo ng Israel at ang sulok ng Egipto at Jordan sa palibot ng Golpo ng Aqaba."
  da:
    - "Abrona (Ebronah i King James Version) er en station på Israels vandring, kendt alene fra rejseberetningen i 4 Mosebog 33: »de rejste fra Jothbata, og de lejrede sig i Abrona. Og de rejste fra Abrona, og de lejrede sig i Eziongeber«. Navnet er af roden »at gå over« og kan betyde en overgang eller et vadested. Da Esjon-Geber lå ved eller nær spidsen af Akababugten, må Abrona søges på det sidste stykke af vejen derned, i det sydlige Araba eller i de bjerge, der lukker bugten mod vest."
    - "Intet sted er kendt. Forslagene placerer det nær selve Elat, ved nutidens Eilat, eller ved kilden Ain Defiyeh (Ein Evrona) i Araba mod nord; hvert af dem hviler på intet andet end stationernes rækkefølge, og intet gammelt navn lever på stedet. Mere kan ikke siges. Egnen er i dag Israels sydspids og det hjørne af Egypten og Jordan, som ligger omkring Akababugten."
  sr:
    - "Аврона (Еброна у Библији краља Џејмса) јесте станица Израиљевог лутања позната само из путописа у Књизи Бројева 33: „А из Етавате отишавши стадоше у логор и Еврону. А из Еврона отишавши стадоше у логор у Гесион-Гаверу.“ Име потиче од корена „прећи“ и може значити прелаз или газ. Пошто је Есион-Гавер лежао на северном, унутрашњем крају Акабског залива или близу њега, Аврону треба тражити на последњем делу пута до њега, у јужној Арави или у брдима која залив затварају на западу."
    - "Налазиште није познато. Предлози је смештају близу самог Елата, код данашњег Ејлата, или код извора Аин Дефије (Ејн Еврона) у Арави на северу; сваки се ослања само на редослед станица, а никакво древно име на терену није сачувано. То је све што се може рећи. Предео је данас јужни врх Израиља и угао Египта и Јордана око Акабског залива."
scripture:
