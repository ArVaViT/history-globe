# Overview article (ADR 0007). Mainstream facts only; a station of the wilderness itinerary with no known site: the candidates are given as guesses, none chosen.
id: abronah
place: a7560c2
title:
  en: "Abronah"
  ru: "Аврон"
body:
  en:
    - "Abronah (Ebronah in the King James Version) is a station of Israel's wanderings known only from the itinerary of Numbers 33: “they removed from Jotbathah, and encamped at Ebronah. And they departed from Ebronah, and encamped at Ezion-gaber”. The name is from the root “to cross”, and may mean a passage or a ford. Since Ezion-geber lay at the head of the Gulf of Aqaba, Abronah must be sought on the last stretch of the road down to it, in the southern Arabah or in the hills that close the gulf on the west."
    - "No site is known. Proposals put it near Elath itself, at the modern Eilat, or at the spring of Ain Defiyeh (Ein Evrona) in the Arabah to the north; each rests on nothing more than the order of the stations, and no ancient name survives on the ground. This is all that can be said. The country is today the southern tip of Israel and the corner of Egypt and Jordan around the Gulf of Aqaba."
  ru:
    - "Аврон — стан странствий Израиля, известный только по перечню станов в 33-й главе книги Чисел: «И отправились от Иотвафы и расположились станом в Авроне. И отправились из Аврона и расположились станом в Ецион-Гавере». Имя образовано от корня «переходить» и может означать проход или переправу. Поскольку Ецион-Гавер лежал у вершины залива Акаба, Аврон следует искать на последнем отрезке дороги к нему — в южной Араве или в горах, замыкающих залив с запада."
    - "Место неизвестно. Его помещали рядом с самим Елафом, у нынешнего Эйлата, или у источника Айн-Дефие (Эйн-Эврона) в Араве к северу от него; каждое предположение опирается лишь на порядок станов, и древнее имя на земле не сохранилось. Это всё, что можно сказать. Край этот сегодня — южная оконечность Израиля и стык Египта и Иордании вокруг залива Акаба."
scripture:
  - Num.33.34-Num.33.35
  - Deut.2.8
sources:
  - "G. I. Davies, The Way of the Wilderness: A Geographical Study of the Wilderness Itineraries in the Old Testament (1979)"
  - "J. Milgrom, Numbers (JPS Torah Commentary, 1990)"
  - "Y. Aharoni, The Land of the Bible: A Historical Geography (rev. ed., 1979)"
