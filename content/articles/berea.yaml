body:
  en:
    - "Berea, ancient Beroea and today's Veria, lies on the eastern slope of Mount Bermion in Macedonia, above the plain west of Thessalonica, where a road over the mountain to upper Macedonia meets the road along the edge of the plain. The oldest graves found in the town date from the Early Iron Age. Thucydides tells of an Athenian army going to Beroea in 432 BC, though whether he meant this town is disputed. In 288 BC Pyrrhus of Epirus took Beroea, and the Macedonians of King Demetrius deserted to him there."
    - "Beroea was one of the chief towns of the Macedonian kingdom. After Rome defeated King Perseus at Pydna in 168 BC, it was the first city to surrender, and when the Romans divided Macedonia into four districts it was placed in the third. Under the emperors it became the seat of the Koinon, the league of the Macedonian cities that kept the cult of the emperors; third-century inscriptions call it a metropolis and temple-warden, neokoros, of the imperial cult."
    - 'Paul and Silas were sent here by night from Thessalonica and went into the synagogue. Acts says the Jews of Berea "were more noble than those in Thessalonica", because they received the word readily and "searched the scriptures daily, whether those things were so". Many of them believed, with Greek women of standing and not a few men. When Jews from Thessalonica came to stir up the people, the brethren sent Paul away toward the sea and on to Athens, while Silas and Timothy stayed behind. Later Sopater of Berea went with Paul to Asia.'
    - "In the third century AD part of the town wall was rebuilt in haste with reused altars, statues and inscribed stones, probably against the Goths or Heruli who were raiding the Balkans. Paved Roman streets have been found under the modern town, whose main roads still follow the ancient lines. In the Hellenistic age Beroea was the second city of Macedonia after Pella, and in late antiquity it was second only to Thessalonica."
  ru:
    - "Верия (греч. Βέροια), сегодня одноимённый греческий город, лежит на восточном склоне горы Вермион в Македонии, над равниной к западу от Фессалоники, там, где дорога через гору в Верхнюю Македонию встречается с дорогой по краю равнины. Древнейшие погребения, найденные в городе, относятся к раннему железному веку. Фукидид рассказывает о походе афинского войска к Верии в 432 г. до н. э., но этот ли город он имел в виду, оспаривается. В 288 г. до н. э. Пирр Эпирский взял Верию, и македоняне царя Деметрия перешли здесь на его сторону."
    - "Верия была одним из главных городов Македонского царства. После того как Рим в 168 г. до н. э. разбил царя Персея при Пидне, она первой из городов сдалась, а когда римляне разделили Македонию на четыре округа, её отнесли к третьему. При императорах она стала местом собраний Койнона — союза македонских городов, совершавшего культ императоров; надписи III века называют её митрополией и неокором, хранительницей храма императорского культа."
    - "Павла и Силу ночью отправили сюда из Фессалоники, и они пошли в синагогу. Книга Деяний говорит, что здешние иудеи «были благомысленнее Фессалоникских», потому что приняли слово со всем усердием, «ежедневно разбирая Писания, точно ли это так». Многие из них уверовали, а также немало знатных еллинских женщин и мужчин. Когда Фессалоникийские Иудеи пришли возмущать народ, братия отпустили Павла к морю, и его проводили до Афин, а Сила и Тимофей остались здесь. Позже Сосипатр из Верии сопровождал Павла до Асии."
    - "В III веке н. э. часть городской стены поспешно перестроили, вкладывая в неё алтари, статуи и камни с надписями, вероятно, против готов или герулов, разорявших Балканы. Под современным городом найдены мощёные римские улицы, и главные улицы города до сих пор идут по древним линиям. В эллинистическую эпоху Верия была вторым городом Македонии после Пеллы, а в поздней античности уступала лишь Фессалонике."
  uk:
    - "Верія, давня Бероя і нинішня Веріа, лежить на східному схилі гори Бермій у Македонії, над рівниною на захід від Солуня, де дорога через гору до верхньої Македонії зустрічається з дорогою вздовж краю рівнини. Найдавніші могили, знайдені в місті, належать до ранньої залізної доби. Фукідід розповідає про афінське військо, що пішло до Берої у 432 р. до н. е., хоча чи мав він на увазі це місто, спірне. У 288 р. до н. е. Пірр Епірський узяв Верію, і македонці царя Димитрія перейшли до нього там."
    - "Верія була одним із головних міст Македонського царства. Після того як Рим розбив царя Персея при Підні в 168 р. до н. е., вона була першим містом, що здалося, і коли римляни поділили Македонію на чотири округи, її віднесли до третього. За імператорів вона стала осередком Койнону, союзу македонських міст, що підтримував культ імператорів; написи III століття називають її метрополією і храмоохоронцем, неокором, імператорського культу."
    - "Павла і Силу відправили сюди вночі із Солуня, і вони пішли до синагоги. Дії кажуть, що юдеї Верії «були благороднїщі від тих, що в Солунї», бо прийняли слово з охотою і «що-дня розбираючи писаннє, чи так воно є». Багато з них увірували, разом із поважними грецькими жінками та немалою кількістю чоловіків. Коли юдеї з Солуня прийшли бунтувати народ, брати відіслали Павла до моря і далі до Афін, а Сила й Тимофій лишилися. Пізніше Сосипатр з Верії пішов з Павлом до Азії."
    - "У III столітті н. е. частину міського муру відбудували нашвидку з повторно використаних жертовників, статуй і написаних каменів, імовірно, проти готів чи герулів, що грабували Балкани. Вимощені римські вулиці знайдено під сучасним містом, чиї головні дороги й досі йдуть давніми лініями. В елліністичну добу Верія була другим містом Македонії після Пелли, а в пізній античності поступалася лише Солуню."
  es:
    - "Berea, la antigua Beroea y la actual Veria, se halla en la ladera oriental del monte Bermión, en Macedonia, sobre la llanura al oeste de Tesalónica, donde un camino sobre la montaña hacia la alta Macedonia se encuentra con el camino que bordea la llanura. Las tumbas más antiguas halladas en la ciudad datan de la edad del Hierro antigua. Tucídides cuenta que un ejército ateniense fue a Beroea en 432 a. C., aunque se discute si se refería a esta ciudad. En 288 a. C. Pirro del Epiro tomó Beroea, y los macedonios del rey Demetrio desertaron allí a su favor."
    - "Beroea fue una de las ciudades principales del reino macedonio. Después de que Roma derrotara al rey Perseo en Pidna en 168 a. C., fue la primera ciudad en rendirse, y cuando los romanos dividieron Macedonia en cuatro distritos fue puesta en el tercero. Bajo los emperadores se convirtió en sede del Koinon, la liga de las ciudades macedonias que mantenía el culto a los emperadores; inscripciones del siglo III la llaman metrópolis y guardiana del templo, neokoros, del culto imperial."
    - "Pablo y Silas fueron enviados aquí de noche desde Tesalónica y entraron en la sinagoga. Los Hechos dicen de los judíos de Berea: «fueron éstos más nobles que los que estaban en Tesalónica, pues recibieron la palabra con toda solicitud, escudriñando cada día las Escrituras, si estas cosas eran así». Muchos de ellos creyeron, con mujeres griegas de distinción y no pocos hombres. Cuando judíos de Tesalónica vinieron a agitar al pueblo, los hermanos enviaron a Pablo hacia el mar y luego a Atenas, mientras Silas y Timoteo se quedaban. Más tarde Sópater de Berea acompañó a Pablo a Asia."
    - "En el siglo III d. C. parte de la muralla de la ciudad fue reconstruida apresuradamente con altares, estatuas y piedras inscritas reutilizados, probablemente contra los godos o hérulos que asolaban los Balcanes. Bajo la ciudad moderna, cuyas calles principales siguen aún los trazados antiguos, se han hallado calles romanas pavimentadas. En la época helenística Beroea fue la segunda ciudad de Macedonia, tras Pela, y en la Antigüedad tardía ocupó el segundo lugar tras Tesalónica."
  pt:
    - "Bereia, a antiga Beroia e atual Veria, fica na encosta oriental do monte Bermion, na Macedônia, acima da planície a oeste de Tessalônica, onde uma estrada que atravessa a montanha rumo à alta Macedônia encontra a que margeia a planície. Os túmulos mais antigos achados na cidade datam do início da Idade do Ferro. Tucídides conta que um exército ateniense foi a Beroia em 432 a.C., embora se discuta se ele se referia a esta cidade. Em 288 a.C. Pirro do Epiro tomou Beroia, e os macedônios do rei Demétrio passaram para ele ali."
    - "Beroia foi uma das principais cidades do reino macedônio. Depois que Roma derrotou o rei Perseu em Pidna, em 168 a.C., foi a primeira cidade a se render, e quando os romanos dividiram a Macedônia em quatro distritos foi incluída no terceiro. Sob os imperadores tornou-se sede do Koinon, a liga das cidades macedônias que mantinha o culto aos imperadores; inscrições do século III a chamam metrópole e guardiã do templo, neokoros, do culto imperial."
    - "Paulo e Silas foram enviados para cá de noite desde Tessalônica e entraram na sinagoga. Atos diz que os judeus de Bereia foram “mais nobres do que os de Tessalônica”, porque receberam a palavra de bom grado e estavam “examinando as Escrituras diariamente para ver se estas coisas eram assim”. Muitos deles creram, com mulheres gregas de destaque e não poucos homens. Quando judeus de Tessalônica vieram agitar o povo, os irmãos enviaram Paulo em direção ao mar e depois a Atenas, enquanto Silas e Timóteo ficaram. Mais tarde Sópatro de Bereia acompanhou Paulo até a Ásia."
    - "No século III d.C., parte da muralha da cidade foi reconstruída às pressas com altares, estátuas e pedras inscritas reaproveitados, provavelmente contra os godos ou hérulos que assolavam os Bálcãs. Ruas romanas pavimentadas foram achadas sob a cidade moderna, cujas vias principais ainda seguem as linhas antigas. Na época helenística, Beroia foi a segunda cidade da Macedônia, depois de Pela, e na Antiguidade tardia ficou em segundo lugar, depois de Tessalônica."
  de:
    - "Beröa, das antike Beroia und heutige Veria, liegt am Osthang des Bermion in Mazedonien, über der Ebene westlich von Thessalonich, wo eine Straße über das Gebirge nach Obermazedonien auf die Straße am Rand der Ebene trifft. Die ältesten in der Stadt gefundenen Gräber stammen aus der frühen Eisenzeit. Thukydides erzählt von einem athenischen Heer, das 432 v. Chr. nach Beroia zog, doch ist umstritten, ob er diese Stadt meinte. 288 v. Chr. nahm Pyrrhos von Epirus Beroia, und die Mazedonier König Demetrios' liefen dort zu ihm über."
    - "Beroia war eine der Hauptstädte des mazedonischen Königreichs. Nachdem Rom 168 v. Chr. König Perseus bei Pydna besiegt hatte, war es die erste Stadt, die sich ergab, und als die Römer Mazedonien in vier Bezirke teilten, wurde es dem dritten zugeordnet. Unter den Kaisern wurde es Sitz des Koinon, des Bundes der mazedonischen Städte, der den Kaiserkult pflegte; Inschriften des 3. Jahrhunderts nennen es Metropolis und Tempelhüterin, Neokoros, des Kaiserkults."
    - "Paulus und Silas wurden bei Nacht von Thessalonich hierher geschickt und gingen in die Synagoge. Die Apostelgeschichte sagt, die Juden von Beröa „waren edler denn die zu Thessalonich“, denn sie nahmen das Wort willig auf und „forschten täglich in der Schrift, ob sich's also verhielte“. Viele von ihnen glaubten, dazu vornehme griechische Frauen und nicht wenige Männer. Als Juden aus Thessalonich kamen, um das Volk aufzuwiegeln, schickten die Brüder Paulus zum Meer und weiter nach Athen, während Silas und Timotheus zurückblieben. Später ging Sopater von Beröa mit Paulus nach Asien."
    - "Im 3. Jahrhundert n. Chr. wurde ein Teil der Stadtmauer eilig mit wiederverwendeten Altären, Statuen und Inschriftensteinen erneuert, wohl gegen die Goten oder Heruler, die den Balkan heimsuchten. Gepflasterte römische Straßen fanden sich unter der heutigen Stadt, deren Hauptstraßen noch den antiken Linien folgen. In hellenistischer Zeit war Beroia nach Pella die zweite Stadt Mazedoniens, und in der Spätantike stand es gleich nach Thessalonike."
  fr:
    - "Bérée, l’antique Béroia et l’actuelle Véria, se trouve sur le versant oriental du mont Bermion, en Macédoine, au-dessus de la plaine à l’ouest de Thessalonique, là où une route par la montagne vers la haute Macédoine rejoint la route longeant la plaine. Les plus anciennes tombes trouvées dans la ville datent du début de l’âge du Fer. Thucydide parle d’une armée athénienne allant à Béroia en 432 av. J.-C., mais on discute s’il visait cette ville. En 288 av. J.-C., Pyrrhus d’Épire prit Béroia, et les Macédoniens du roi Démétrios y désertèrent pour lui."
    - "Béroia était l’une des principales villes du royaume de Macédoine. Après que Rome eut vaincu le roi Persée à Pydna en 168 av. J.-C., elle fut la première cité à se rendre, et quand les Romains divisèrent la Macédoine en quatre districts, elle fut placée dans le troisième. Sous les empereurs, elle devint le siège du Koinon, la ligue des cités macédoniennes qui entretenait le culte des empereurs ; des inscriptions du IIIe siècle l’appellent métropole et gardienne du temple, néocore, du culte impérial."
    - "Paul et Silas y furent envoyés de nuit depuis Thessalonique et entrèrent dans la synagogue. Les Actes disent que les Juifs de Bérée « avaient des sentiments plus nobles que ceux de Thessalonique », car ils reçurent la parole avec empressement et « examinaient chaque jour les Écritures, pour voir si ce qu’on leur disait était exact ». Beaucoup d’entre eux crurent, avec des Grecques de condition et des hommes en nombre. Quand des Juifs de Thessalonique vinrent soulever le peuple, les frères firent partir Paul vers la mer puis vers Athènes, tandis que Silas et Timothée restaient. Plus tard, Sopater de Bérée accompagna Paul en Asie."
    - "Au IIIe siècle apr. J.-C., une partie du rempart fut rebâtie à la hâte avec des autels, statues et pierres inscrites remployés, probablement contre les Goths ou les Hérules qui ravageaient les Balkans. Des rues romaines dallées ont été trouvées sous la ville moderne, dont les grandes routes suivent encore les anciens tracés. À l’époque hellénistique, Béroia fut la deuxième ville de Macédoine après Pella, et dans l’Antiquité tardive elle vint au second rang après Thessalonique."
  it:
    - "Berea, l’antica Beroea e odierna Veria, sorge sul pendio orientale del monte Bermio in Macedonia, sopra la pianura a ovest di Tessalonica, dove una strada che valica la montagna verso l’alta Macedonia incontra la strada lungo il margine della pianura. Le più antiche tombe trovate in città risalgono all’inizio dell’età del Ferro. Tucidide racconta di un esercito ateniese che andò a Beroea nel 432 a.C., benché sia discusso se intendesse questa città. Nel 288 a.C. Pirro d’Epiro prese Beroea, e i Macedoni del re Demetrio disertarono a suo favore lì."
    - "Beroea era una delle principali città del regno macedone. Dopo che Roma sconfisse il re Perseo a Pidna nel 168 a.C., fu la prima città ad arrendersi, e quando i Romani divisero la Macedonia in quattro distretti fu posta nel terzo. Sotto gli imperatori divenne la sede del Koinon, la lega delle città macedoni che custodiva il culto degli imperatori; iscrizioni del III secolo la chiamano metropoli e custode del tempio, neokoros, del culto imperiale."
    - "Paolo e Sila furono mandati qui di notte da Tessalonica ed entrarono nella sinagoga. Gli Atti dicono che i Giudei di Berea «furono più generosi di quelli di Tessalonica», perché ricevettero la parola con premura, «esaminando tutti i giorni le Scritture per vedere se le cose stavan così». Molti di loro credettero, con nobildonne greche e non pochi uomini. Quando giunsero Giudei da Tessalonica ad agitare il popolo, i fratelli fecero partire Paolo verso il mare e poi ad Atene, mentre Sila e Timoteo rimasero. Più tardi Sòpatro di Berea andò con Paolo in Asia."
    - "Nel III secolo d.C. parte delle mura cittadine fu ricostruita in fretta con altari, statue e pietre iscritte riutilizzati, probabilmente contro i Goti o gli Eruli che razziavano i Balcani. Strade romane lastricate sono state trovate sotto la città moderna, le cui strade principali seguono ancora le linee antiche. In età ellenistica Beroea fu la seconda città della Macedonia dopo Pella, e nella tarda antichità fu seconda soltanto a Tessalonica."
  pl:
    - "Berea, starożytna Beroea i dzisiejsza Veria, leży na wschodnim stoku góry Bermion w Macedonii, nad równiną na zachód od Tesaloniki, tam gdzie droga przez góry do górnej Macedonii spotyka się z drogą wzdłuż skraju równiny. Najstarsze groby znalezione w mieście pochodzą z wczesnej epoki żelaza. Tukidydes opowiada o armii ateńskiej udającej się do Berei w 432 r. p.n.e., choć czy miał na myśli to miasto, jest sporne. W 288 r. p.n.e. Pyrrus z Epiru zajął Bereę, a Macedończycy króla Demetriusza przeszli tam na jego stronę."
    - "Berea była jednym z głównych miast królestwa macedońskiego. Gdy Rzym pokonał króla Perseusza pod Pydną w 168 r. p.n.e., była pierwszym miastem, które się poddało, a gdy Rzymianie podzielili Macedonię na cztery okręgi, włączono ją do trzeciego. Za cesarzy stała się siedzibą Koinonu, związku miast macedońskich, który pielęgnował kult cesarzy; napisy z III wieku nazywają ją metropolią i strażnikiem świątyni, neokoros, kultu cesarskiego."
    - "Paweł i Sylas zostali tu wysłani nocą z Tesaloniki i weszli do synagogi. Dzieje mówią, że Żydzi z Berei „byli zacniejsi nad one, co byli w Tesalonice”, bo przyjęli słowo ochoczo i „na każdy dzień rozsądzając Pisma, jeźliby się tak miało”. Wielu z nich uwierzyło, wraz z greckimi kobietami z dobrych rodów i niemałą liczbą mężczyzn. Gdy Żydzi z Tesaloniki przybyli podburzać lud, bracia wysłali Pawła ku morzu i dalej do Aten, a Sylas i Tymoteusz zostali. Później Sopater z Berei towarzyszył Pawłowi do Azji."
    - "W III wieku n.e. część muru miejskiego odbudowano pospiesznie z ponownie użytych ołtarzy, posągów i kamieni z napisami, prawdopodobnie przeciw Gotom lub Herulom, którzy łupili Bałkany. Pod współczesnym miastem, którego główne drogi wciąż podążają dawnymi liniami, znaleziono brukowane rzymskie ulice. W epoce hellenistycznej Berea była drugim miastem Macedonii po Pelli, a w późnej starożytności ustępowała jedynie Tesalonice."
  nl:
    - "Berea, het oude Beroea en het huidige Veria, ligt op de oosthelling van de Bermion in Macedonië, boven de vlakte ten westen van Tessalonica, waar een weg over de berg naar Boven-Macedonië de weg langs de rand van de vlakte ontmoet. De oudste graven die in de stad zijn gevonden, dateren uit de vroege ijzertijd. Thucydides vertelt van een Atheens leger dat in 432 v.Chr. naar Beroea trok, al is omstreden of hij deze stad bedoelde. In 288 v.Chr. nam Pyrrhus van Epirus Beroea in, en de Macedoniërs van koning Demetrius liepen daar naar hem over."
    - "Beroea was een van de voornaamste steden van het Macedonische koninkrijk. Nadat Rome koning Perseus in 168 v.Chr. bij Pydna had verslagen, was het de eerste stad die zich overgaf, en toen de Romeinen Macedonië in vier districten verdeelden, kwam het in het derde. Onder de keizers werd het de zetel van het Koinon, de bond van de Macedonische steden die de keizerscultus onderhield; inscripties uit de derde eeuw noemen het een metropolis en tempelwachter, neokoros, van de keizerscultus."
    - "Paulus en Silas werden hierheen gezonden bij nacht uit Tessalonica en gingen de synagoge in. Handelingen zegt dat de Joden van Berea “edeler” waren “dan die te Thessalonica waren”, omdat zij het woord met bereidheid ontvingen en “onderzoekende dagelijks de Schriften, of deze dingen alzo waren”. Velen van hen geloofden, met Griekse vrouwen van aanzien en niet weinig mannen. Toen Joden uit Tessalonica kwamen om het volk op te hitsen, zonden de broeders Paulus weg naar de zee en verder naar Athene, terwijl Silas en Timoteüs achterbleven. Later ging Sopater van Berea met Paulus naar Azië."
    - "In de derde eeuw n.Chr. werd een deel van de stadsmuur haastig herbouwd met hergebruikte altaren, beelden en beschreven stenen, waarschijnlijk tegen de Goten of Heruliërs die de Balkan plunderden. Geplaveide Romeinse straten zijn onder de moderne stad gevonden, waarvan de hoofdwegen nog de oude lijnen volgen. In de hellenistische tijd was Beroea na Pella de tweede stad van Macedonië, en in de late oudheid nam het de tweede plaats in na Tessalonica."
  cs:
    - "Beroia, dnešní Veria, leží na východním svahu hory Bermion v Makedonii, nad pláněmi západně od Tesaloniky, kde se cesta přes horu do horní Makedonie stýká s cestou podél okraje pláně. Nejstarší hroby nalezené ve městě pocházejí z rané doby železné. Thúkydidés vypráví o athénském vojsku, které roku 432 př. n. l. táhlo do Beroie, ač je sporné, zda měl na mysli toto město. Roku 288 př. n. l. dobyl Beroiu Pyrrhos Epeirský a makedonští vojáci krále Démétria k němu tam přeběhli."
    - "Beroia byla jedním z hlavních měst makedonského království. Poté, co Řím porazil krále Persea u Pydny roku 168 př. n. l., bylo prvním městem, které se vzdalo, a když Římané rozdělili Makedonii na čtyři okresy, bylo zařazeno do třetího. Za císařů se stala sídlem Koinonu, spolku makedonských měst, který udržoval kult císařů; nápisy ze 3. století je nazývají metropolí a strážkyní chrámu, neokoros, císařského kultu."
    - "Pavel a Silas sem byli posláni v noci z Tesaloniky a vešli do synagogy. Skutky praví o Židech z Beroie: „A ti byli udatnější nežli Tessalonitští“, protože přijali slovo „se vší chtivostí, na každý den rozvažujíce Písma, tak-li by ty věci byly“. Mnozí z nich uvěřili, s řeckými ženami z předních kruhů i s nemálo muži. Když přišli Židé z Tesaloniky podněcovat lid, bratří poslali Pavla k moři a dál do Atén, zatímco Silas a Timoteus zůstali. Později šel Sopatros z Beroie s Pavlem do Asie."
    - "Ve 3. století n. l. byla část městské hradby narychlo přestavěna z druhotně použitých oltářů, soch a nápisových kamenů, pravděpodobně proti Gótům nebo Herulům, kteří vpadali na Balkán. Dlážděné římské ulice byly nalezeny pod moderním městem, jehož hlavní silnice stále sledují starověké linie. V helénistické době byla Beroia druhým městem Makedonie po Pelle a v pozdní antice byla druhá hned po Tesalonice."
  sv:
    - "Beroia, det antika Beroea och dagens Veria, ligger på östra sluttningen av berget Bermion i Makedonien, ovanför slätten väster om Tessalonike, där en väg över berget till övre Makedonien möter vägen längs slättens kant. De äldsta gravarna som hittats i staden härrör från äldre järnåldern. Thukydides berättar om en atensk armé som gick till Beroea år 432 f.Kr., fastän det är omstritt om han menade denna stad. År 288 f.Kr. intog Pyrrhos av Epirus Beroea, och kung Demetrios’ makedonier gick över till honom där."
    - "Beroea var en av det makedonska rikets främsta städer. Sedan Rom besegrat kung Perseus vid Pydna år 168 f.Kr. var den den första staden som gav upp, och när romarna delade Makedonien i fyra distrikt placerades den i det tredje. Under kejsarna blev den säte för Koinon, förbundet av de makedonska städerna som vårdade kejsarkulten; inskrifter från 200-talet e.Kr. kallar den metropolis och tempelvårdare, neokoros, för kejsarkulten."
    - "Paulus och Silas sändes hit om natten från Tessalonike och gick in i synagogan. Apostlagärningarna säger att judarna i Beroia var ”ädlare till sinnes än judarna i Tessalonika”, eftersom de ”togo emot ordet med all villighet och rannsakade var dag skrifterna, för att se om det förhölle sig såsom nu sades”. Många av dem kom till tro, liksom ansedda grekiska kvinnor och inte så få män. När judar från Tessalonike kom för att uppvigla folket sände bröderna Paulus ned mot havet och vidare till Aten, medan Silas och Timoteus stannade kvar. Senare följde Sopatros från Beroia med Paulus till Asien."
    - "På 200-talet e.Kr. byggdes en del av stadsmuren upp i hast med återanvända altaren, statyer och inskrivna stenar, sannolikt mot goterna eller herulerna som härjade på Balkan. Stenlagda romerska gator har hittats under den moderna staden, vars huvudvägar fortfarande följer de antika linjerna. Under den hellenistiska tiden var Beroea Makedoniens näst största stad efter Pella, och under senantiken kom den näst efter Tessalonike."
  nb:
    - "Berøa, det gamle Beroia og dagens Veria, ligger på østskråningen av Bermion-fjellet i Makedonia, over sletten vest for Tessalonika, der en vei over fjellet til øvre Makedonia møter veien langs kanten av sletten. De eldste gravene funnet i byen er fra tidlig jernalder. Tukydid forteller om en athensk hær som dro til Beroia i 432 f.Kr., men om han mente denne byen, er omstridt. I 288 f.Kr. inntok Pyrrhos av Epiros Beroia, og kong Demetrios' makedonere gikk over til ham der."
    - "Beroia var en av det makedonske rikets hovedbyer. Etter at Roma hadde beseiret kong Perseus ved Pydna i 168 f.Kr., var den den første byen som overga seg, og da romerne delte Makedonia i fire distrikter, ble den plassert i det tredje. Under keiserne ble den sete for Koinon, forbundet av makedonske byer som holdt keiserkulten; innskrifter fra 200-tallet kaller den en metropolis og tempelvokter, neokoros, for keiserkulten."
    - "Paulus og Silas ble sendt hit om natten fra Tessalonika og «gikk bort i jødenes synagoge». Apostlenes gjerninger sier at de var «av et edlere sinn enn de i Tessalonika», fordi de «tok imot ordet med all godvilje, og gransket daglig i skriftene om det var således som det blev sagt dem». Mange av dem kom til troen, med greske kvinner av rang og ikke få menn. Da jøder fra Tessalonika kom for å egge folket opp, «sendte» brødrene «Paulus avsted på veien til havet» og videre til Aten, mens Silas og Timoteus ble igjen. Senere dro Sopater fra Berøa med Paulus til Asia."
    - "På 200-tallet e.Kr. ble en del av bymuren hastig gjenreist med gjenbrukte altre, statuer og innskrevne steiner, trolig mot goterne eller herulerne som herjet på Balkan. Brolagte romerske gater er funnet under den moderne byen, hvis hovedveier fortsatt følger de gamle linjene. I hellenistisk tid var Beroia Makedonias andre by etter Pella, og i senantikken kom den nest etter Tessalonika."
  tl:
    - "Ang Berea, ang sinaunang Beroea at Veria ngayon, ay nasa silangang dalisdis ng Bundok Bermion sa Macedonia, sa itaas ng kapatagan sa kanluran ng Tesalonica, kung saan nagtatagpo ang daan sa ibabaw ng bundok patungong itaas na Macedonia at ang daan sa gilid ng kapatagan. Ang pinakamatatandang libingang natagpuan sa bayan ay mula sa Maagang Panahon ng Bakal. Isinasalaysay ni Tucidides ang isang hukbong Ateniense na nagtungo sa Beroea noong 432 BK, bagaman pinagtatalunan kung ang bayang ito ang tinutukoy niya. Noong 288 BK, sinakop ni Pirro ng Epirus ang Beroea, at nilisan ng mga Macedonio ng Haring Demetrio ang kanilang panig upang sumama sa kaniya roon."
    - "Ang Beroea ay isa sa mga pangunahing bayan ng kahariang Macedonio. Matapos talunin ng Roma si Haring Perseus sa Pydna noong 168 BK, ito ang unang lungsod na sumuko, at nang hatiin ng mga Romano ang Macedonia sa apat na distrito, inilagay ito sa ikatlo. Sa ilalim ng mga emperador, naging luklukan ito ng Koinon, ang liga ng mga lungsod na Macedonio na nag-ingat ng kulto ng mga emperador; tinatawag ito ng mga inskripsiyon noong ika-3 siglo na metropolis at tagapag-ingat ng templo, neokoros, ng kultong imperyal."
    - "Isinugo rito sina Pablo at Silas sa gabi mula sa Tesalonica at pumasok sa sinagoga. Sinasabi ng Mga Gawa na ang mga Judio sa Berea ay “lalong naging mararangal ang mga ito kay sa mga taga Tesalonica”, sapagkat tinanggap nila ang salita nang buong pagsisikap at “sinisiyasat sa araw-araw ang mga kasulatan, kung tunay nga ang mga bagay na ito”. Marami sa kanila ang sumampalataya, kasama ang mga babaing Griyega ng mataas na kalagayan at hindi kakaunting lalaki. Nang dumating ang mga Judio mula sa Tesalonica upang pasiklabin ang mga tao, pinaalis ng mga kapatid si Pablo patungong dagat at pagkatapos ay sa Atenas, habang nanatili sina Silas at Timoteo. Kalaunan, sumama kay Pablo sa Asia si Sopatro ng Berea."
    - "Noong ika-3 siglo AD, bahagi ng pader ng bayan ang muling itinayo nang nagmamadali gamit ang muling ginamit na mga altar, estatwa at batong may inskripsiyon, marahil laban sa mga Goth o Heruli na sumasalakay sa Balkan. May natagpuang mga kalyeng Romano na nilatagan ng bato sa ilalim ng makabagong bayan, na ang mga pangunahing daan ay sumusunod pa rin sa mga sinaunang guhit. Sa panahong Helenistiko, ang Beroea ang ikalawang lungsod ng Macedonia pagkatapos ng Pella, at sa huling sinaunang panahon ay ikalawa lamang sa Tesalonica."
  da:
    - "Berøa, det antikke Beroia og nutidens Veria, ligger på østskråningen af Bermion-bjerget i Makedonien, over sletten vest for Thessalonika, hvor en vej over bjerget til Øvre Makedonien møder vejen langs slettens rand. De ældste grave fundet i byen stammer fra ældre jernalder. Thukydid fortæller om en athensk hær, der drog til Beroia i 432 f.Kr., skønt det er omstridt, om han mente denne by. I 288 f.Kr. indtog Pyrrhos af Epirus Beroia, og kong Demetrios' makedonere gik dér over til ham."
    - "Beroia var en af det makedonske kongeriges hovedbyer. Efter at Rom besejrede kong Perseus ved Pydna i 168 f.Kr., var den den første by, der overgav sig, og da romerne delte Makedonien i fire distrikter, blev den henlagt til det tredje. Under kejserne blev den sæde for Koinon, forbundet af makedonske byer, som varetog kejserkulten; indskrifter fra 200-tallet kalder den metropolis og tempelvogter, neokoros, for kejserkulten."
    - "Paulus og Silas blev sendt hertil om natten fra Thessalonika og gik ind i synagogen. Apostlenes Gerninger siger, at jøderne i Berøa var »mere velsindede end de i Thessalonika«, fordi de modtog Ordet med redebonhed og »ransagede daglig Skrifterne, om disse Ting forholdt sig saaledes«. Mange af dem troede, sammen med fornemme græske kvinder og ikke få mænd. Da jøder fra Thessalonika kom for at ophidse folket, sendte brødrene Paulus bort mod havet og videre til Athen, mens Silas og Timotheus blev tilbage. Senere rejste Sopater fra Berøa med Paulus til Asia."
    - "I 200-tallet e.Kr. blev en del af bymuren hastigt genopbygget med genbrugte altre, statuer og indskrevne sten, sandsynligvis mod goterne eller herulerne, der hærgede Balkan. Brolagte romerske gader er fundet under den moderne by, hvis hovedveje stadig følger de gamle linjer. I den hellenistiske tid var Beroia Makedoniens næststørste by efter Pella, og i sen oldtid kun overgået af Thessalonika."
  sr:
    - "Верија, античка Береја, данас Верија, лежи на источној падини горе Бермион у Македонији, изнад равнице западно од Солуна, где се пут преко планине ка горњој Македонији сусреће с путем уз руб равнице. Најстарији гробови нађени у граду датирају из раног гвозденог доба. Тукидид прича о атинској војсци која је 432. п. н. е. ишла у Верију, мада се спори да ли је мислио на овај град. Године 288. п. н. е. Пир Епирски заузео је Береју, а Македонци краља Димитрија су му ту прешли."
    - "Верија је била један од главних градова македонског краљевства. Пошто је Рим победио краља Персеја код Пидне 168. п. н. е., била је први град који се предао, а када су Римљани поделили Македонију на четири округа, стављена је у трећи. Под царевима постала је седиште Коинона, савеза македонских градова који је чувао култ царева; натписи из 3. века зову је метрополом и неокором, чуваром храма царског култа."
    - "Павле и Сила послати су овамо ноћу из Солуна и ушли су у синагогу. Дела за Јевреје Верије кажу: „беху племенитији од оних што живе у Солуну“, јер су примили реч радо и „сваки дан истраживаху по писму је ли то тако“. Многи од њих су поверовали, с поштеним грчким женама и не малим бројем људи. Када су Јевреји из Солуна дошли да подигну народ, браћа су Павла отпремила ка мору и даље у Атину, док су Сила и Тимотије остали. Касније је Сосипатар из Верије отишао с Павлом у Азију."
    - "У 3. веку н. е. део градског зида хитро је обновљен од поновно употребљених олтара, кипова и натписаног камења, вероватно против Гота или Херула који су харали Балканом. Поплочане римске улице нађене су испод савременог града, чије главне путеве и данас прате античке линије. У хеленистичко доба Верија је била други град Македоније после Пеле, а у касној антици само иза Солуна."
