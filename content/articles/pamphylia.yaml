# Overview article (ADR 0007). Mainstream facts only; the legend of the Greek settlement is given as Herodotus tells it; provincial arrangements follow the usual account.
id: pamphylia
place: aa95188
title:
  en: "Pamphylia"
  ru: "Памфилия"
body:
  en:
    - "Pamphylia is the crescent of coastal plain on the south of Asia Minor, about 120 km long, between Lycia on the west and Cilicia on the east, shut in by the Taurus mountains and open to the sea. Its cities were Perga, inland on the Cestrus; Attalia, the port founded by Attalus II of Pergamum about 150 BC; Aspendus, Side and Sillyum. Herodotus says the Pamphylians descended from the host scattered from Troy that followed Amphilochus and Calchas, and their dialect was indeed a strange Greek. The land passed from Persia to Alexander in 333 BC, to the Seleucids and Pergamum, and to Rome, which attached it to Galatia under Augustus and under Vespasian joined it with Lycia in one province."
    - "Jews of Pamphylia were in Jerusalem at Pentecost, and the book of Maccabees names the land among those to which Rome wrote on the Jews' behalf in 139 BC. On the first missionary journey Paul and Barnabas sailed from Paphos and “came to Perga in Pamphylia: and John departing from them returned to Jerusalem”; they went up to Antioch of Pisidia without preaching in Perga, and on the way back, “after they had passed throughout Pisidia, they came to Pamphylia. And when they had preached the word in Perga, they went down into Attalia” and took ship for Antioch. The desertion rankled: before the second journey Paul “thought not good to take him with them, who departed from them from Pamphylia”, and he and Barnabas parted over Mark. On the voyage to Rome the prisoner Paul “sailed over the sea of Cilicia and Pamphylia” to Myra."
    - "Today Pamphylia is the province of Antalya in Turkey, its plain covered with greenhouses and citrus and its coast with hotels; Antalya, the old Attalia, is a city of more than a million and the gate of Turkish tourism. The ruins of Perge, with its colonnaded street and stadium, the Roman theatre of Aspendos, still used for festivals, and the temples and harbour of Side are among the best preserved in Asia Minor."
  ru:
    - "Памфилия — полумесяц прибрежной равнины на юге Малой Азии, около 120 км в длину, между Ликией на западе и Киликией на востоке, запертый горами Тавра и открытый морю. Её города — Пергия в глубине суши на реке Кестр; Атталия, порт, основанный Атталом II Пергамским около 150 г. до н. э.; Аспенд, Сиде и Силлион. Геродот говорит, что памфилийцы происходят от людей, рассеянных после Трои и пришедших с Амфилохом и Калхантом, и их наречие действительно было странным греческим. Земля перешла от Персии к Александру в 333 г. до н. э., к Селевкидам и Пергаму, а затем к Риму, который при Августе присоединил её к Галатии, а при Веспасиане объединил с Ликией в одну провинцию."
    - "Иудеи из Памфилии были в Иерусалиме в день Пятидесятницы, а книга Маккавейская называет эту землю среди тех, куда Рим писал в защиту иудеев в 139 г. до н. э. В первом миссионерском путешествии Павел и Варнава отплыли из Пафа и «прибыли в Пергию, в Памфилии. Но Иоанн, отделившись от них, возвратился в Иерусалим»; они поднялись в Антиохию Писидийскую, не проповедуя в Пергии, а на обратном пути, «пройдя через Писидию, пришли в Памфилию и, проповедав слово Господне в Пергии, сошли в Атталию» и отплыли в Антиохию. Уход Марка не забылся: перед вторым путешествием Павел «полагал не брать отставшего от них в Памфилии», и они с Варнавой разошлись из-за Марка. На пути в Рим узник Павел, «переплыв море против Киликии и Памфилии», прибыл в Миры."
    - "Сегодня Памфилия — провинция Анталья в Турции; её равнина покрыта теплицами и цитрусовыми садами, а побережье — отелями; Анталья, древняя Атталия, — город с населением больше миллиона и ворота турецкого туризма. Развалины Перге с колоннадной улицей и стадионом, римский театр Аспендоса, где до сих пор проходят фестивали, и храмы с гаванью Сиде — среди лучше всего сохранившихся в Малой Азии."
