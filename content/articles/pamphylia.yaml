body:
  en:
    - "Pamphylia is the crescent of coastal plain on the south of Asia Minor, about 120 km long, between Lycia on the west and Cilicia on the east, shut in by the Taurus mountains and open to the sea. Its cities were Perga, inland on the Cestrus; Attalia, the port founded by Attalus II of Pergamum about 150 BC; Aspendus, Side and Sillyum. Herodotus says the Pamphylians descended from the host scattered from Troy that followed Amphilochus and Calchas, and their dialect was indeed a strange Greek. The land passed from Persia to Alexander in 333 BC, to the Seleucids and Pergamum, and to Rome, which for a time seems to have governed it together with Galatia and under Vespasian joined it with Lycia in one province."
    - "Jews of Pamphylia were in Jerusalem at Pentecost, and the book of Maccabees names the land among those to which Rome wrote on the Jews' behalf in 139 BC. On the first missionary journey Paul and Barnabas sailed from Paphos and “came to Perga in Pamphylia: and John departing from them returned to Jerusalem”; they went up to Antioch of Pisidia without preaching in Perga, and on the way back, “after they had passed throughout Pisidia, they came to Pamphylia. And when they had preached the word in Perga, they went down into Attalia” and took ship for Antioch. The desertion rankled: before the second journey Paul “thought not good to take him with them, who departed from them from Pamphylia”, and he and Barnabas parted over Mark. On the voyage to Rome the prisoner Paul “sailed over the sea of Cilicia and Pamphylia” to Myra."
    - "Today Pamphylia lies in the province of Antalya in Turkey, its plain covered with greenhouses and citrus and its coast with hotels; Antalya, the old Attalia, is a city of more than a million and the gate of Turkish tourism. The ruins of Perge, with its colonnaded street and stadium, the Roman theatre of Aspendos, still used for festivals, and the temples and harbour of Side are among the best preserved in Asia Minor."
  ru:
    - "Памфилия — полумесяц прибрежной равнины на юге Малой Азии, около 120 км в длину, между Ликией на западе и Киликией на востоке, запертый горами Тавра и открытый морю. Её города — Пергия в глубине суши на реке Кестр; Атталия, порт, основанный Атталом II Пергамским около 150 г. до н. э.; Аспенд, Сиде и Силлион. Геродот говорит, что памфилийцы происходят от людей, рассеянных после Трои и пришедших с Амфилохом и Калхантом, и их наречие действительно было странным греческим. Земля перешла от Персии к Александру в 333 г. до н. э., к Селевкидам и Пергаму, а затем к Риму, который, по-видимому, некоторое время управлял ею вместе с Галатией, а при Веспасиане объединил с Ликией в одну провинцию."
    - "Иудеи из Памфилии были в Иерусалиме в день Пятидесятницы, а книга Маккавейская называет эту землю среди тех, куда Рим писал в защиту иудеев в 139 г. до н. э. В первом миссионерском путешествии Павел и Варнава отплыли из Пафа и «прибыли в Пергию, в Памфилии. Но Иоанн, отделившись от них, возвратился в Иерусалим»; они поднялись в Антиохию Писидийскую, не проповедуя в Пергии, а на обратном пути, «пройдя через Писидию, пришли в Памфилию и, проповедав слово Господне в Пергии, сошли в Атталию» и отплыли в Антиохию. Уход Марка не забылся: перед вторым путешествием Павел «полагал не брать отставшего от них в Памфилии», и они с Варнавой разошлись из-за Марка. На пути в Рим узник Павел, «переплыв море против Киликии и Памфилии», прибыл в Миры."
    - "Сегодня Памфилия лежит в провинции Анталья в Турции; её равнина покрыта теплицами и цитрусовыми садами, а побережье — отелями; Анталья, древняя Атталия, — город с населением больше миллиона и ворота турецкого туризма. Развалины Перге с колоннадной улицей и стадионом, римский театр Аспендоса, где до сих пор проходят фестивали, и храмы с гаванью Сиде — среди лучше всего сохранившихся в Малой Азии."
  uk:
    - "Памфілія — півмісяць прибережної рівнини на півдні Малої Азії завдовжки близько 120 км, між Лікією на заході та Кілікією на сході, затиснута горами Тавр і відкрита до моря. Її містами були Перге, у глибині країни на Кестрі; Атталія, порт, заснований Атталом II Пергамським близько 150 р. до н. е.; Аспенд, Сіде та Сілліон. Геродот каже, що памфілійці походили від війська, розсіяного після Трої, яке пішло за Амфілохом і Калхантом, і їхній діалект справді був дивною грецькою. Країна перейшла від Персії до Александра 333 р. до н. е., до Селевкідів і Пергаму та до Риму, який, схоже, якийсь час правив нею разом із Галатією, а за Веспасіана об’єднав із Лікією в одну провінцію."
    - "Євреї з Памфілії були в Єрусалимі на П’ятидесятницю, а Книга Макавеїв називає цю країну серед тих, до яких Рим писав на захист євреїв 139 р. до н. е. Під час першої місійної подорожі Павло й Варнава відпливли з Пафоса й «прийшли в Пергию Панфилську; Йоан же, відлучившись від них, вернувсь у Єрусалим»; вони піднялися до Антіохії Пісідійської, не проповідуючи в Перге, а дорогою назад, «перейшовши Писидию, прийшли в Памфилию. А глаголавши в Пергиї слово, прийшли в Аталию», і сіли на корабель до Антіохії. Це відступництво муляло: перед другою подорожжю Павло «не удостоїв брати з собою того, хто одлучивсь од них з Памфилиї», і вони з Варнавою розійшлися через Марка. Під час плавання до Рима в’язень Павло, «перепливши море, що проти Киликиї та Памфилиї», прибув у Мири Лікійські."
    - "Нині Памфілія лежить у провінції Анталія в Туреччині, її рівнина вкрита теплицями й цитрусовими, а узбережжя — готелями; Анталія, давня Атталія, — місто з понад мільйоном мешканців і брама турецького туризму. Руїни Перге з колонадною вулицею та стадіоном, римський театр Аспендоса, що досі використовується для фестивалів, і храми та гавань Сіде належать до найкраще збережених у Малій Азії."
  es:
    - "Panfilia es la media luna de llanura costera en el sur de Asia Menor, de unos 120 km de longitud, entre Licia al oeste y Cilicia al este, encerrada por los montes Tauro y abierta al mar. Sus ciudades eran Perge, tierra adentro sobre el Cestro; Atalia, el puerto fundado por Átalo II de Pérgamo hacia 150 a. C.; Aspendo, Side y Silión. Heródoto dice que los panfilios descendían de la hueste dispersa de Troya que siguió a Anfíloco y Calcante, y su dialecto era en efecto un griego extraño. El país pasó de Persia a Alejandro en 333 a. C., a los seléucidas y a Pérgamo, y a Roma, que durante un tiempo parece haberlo gobernado junto con Galacia y bajo Vespasiano lo juntó con Licia en una sola provincia."
    - "Había judíos de Panfilia en Jerusalén en Pentecostés, y el libro de los Macabeos nombra el país entre aquellos a los que Roma escribió en favor de los judíos en 139 a. C. En el primer viaje misionero, Pablo y Bernabé zarparon de Pafos y «arribaron á Perge de Pamphylia: entonces Juan, apartándose de ellos, se volvió á Jerusalem»; subieron a Antioquía de Pisidia sin predicar en Perge, y a la vuelta, «pasando por Pisidia vinieron á Pamphylia. Y habiendo predicado la palabra en Perge, descendieron á Atalia» y tomaron barco hacia Antioquía. La deserción dejó huella: antes del segundo viaje a Pablo «no le parecía bien llevar consigo al que se había apartado de ellos desde Pamphylia», y él y Bernabé se separaron por Marcos. En el viaje a Roma, el preso Pablo, «habiendo pasado la mar de Cilicia y Pamphylia», llegó a Mira."
    - "Hoy Panfilia se encuentra en la provincia turca de Antalya, con su llanura cubierta de invernaderos y cítricos y su costa de hoteles; Antalya, la antigua Atalia, es una ciudad de más de un millón de habitantes y la puerta del turismo turco. Las ruinas de Perge, con su calle de columnas y su estadio, el teatro romano de Aspendos, aún usado para festivales, y los templos y el puerto de Side están entre los mejor conservados de Asia Menor."
  pt:
    - "A Panfília é o crescente de planície costeira no sul da Ásia Menor, com cerca de 120 km de comprimento, entre a Lícia a oeste e a Cilícia a leste, fechada pelas montanhas do Tauro e aberta para o mar. Suas cidades eram Perge, no interior, sobre o Cestro; Atália, o porto fundado por Átalo II de Pérgamo por volta de 150 a.C.; Aspendos, Side e Sílion. Heródoto diz que os panfílios descendiam da hoste dispersa de Troia que seguiu Anfíloco e Calcas, e seu dialeto era de fato um grego estranho. A terra passou da Pérsia a Alexandre em 333 a.C., aos selêucidas e a Pérgamo, e a Roma, que por um tempo parece tê-la governado junto com a Galácia e, sob Vespasiano, a juntou à Lícia numa só província."
    - "Judeus da Panfília estavam em Jerusalém no Pentecostes, e o livro de Macabeus cita a terra entre aquelas a que Roma escreveu em favor dos judeus em 139 a.C. Na primeira viagem missionária, Paulo e Barnabé navegaram de Pafos e “chegaram a Perge, na Panfília. João separou-se deles e voltou para Jerusalém”; subiram a Antioquia da Pisídia sem pregar em Perge e, na volta, “passaram pela Pisídia e chegaram à Panfília. Quando haviam anunciado a palavra em Perge, desceram para Atália” e embarcaram para Antioquia. A deserção deixou mágoa: antes da segunda viagem Paulo “não considerava apropriado levar alguém que havia se afastado deles na Panfília”, e ele e Barnabé se separaram por causa de Marcos. Na viagem a Roma, o prisioneiro Paulo atravessou “o mar ao longo da Cilícia e da Panfília” até Mira."
    - "Hoje a Panfília fica na província de Antália, na Turquia, com a planície coberta de estufas e citros e a costa de hotéis; Antália, a antiga Atália, é uma cidade de mais de um milhão de habitantes e a porta do turismo turco. As ruínas de Perge, com sua rua de colunas e o estádio, o teatro romano de Aspendos, ainda usado em festivais, e os templos e o porto de Side estão entre as mais bem conservadas da Ásia Menor."
  de:
    - "Pamphylien ist der Halbmond der Küstenebene im Süden Kleinasiens, etwa 120 km lang, zwischen Lykien im Westen und Kilikien im Osten, vom Taurusgebirge eingeschlossen und zum Meer hin offen. Seine Städte waren Perge, landeinwärts am Kestros; Attalia, der Hafen, den Attalos II. von Pergamon um 150 v. Chr. gründete; Aspendos, Side und Sillyon. Herodot sagt, die Pamphylier stammten von dem aus Troja zerstreuten Heer ab, das Amphilochos und Kalchas folgte; ihr Dialekt war tatsächlich ein fremdartiges Griechisch. Das Land ging 333 v. Chr. von Persien an Alexander, dann an die Seleukiden und Pergamon und an Rom, das es eine Zeit lang offenbar zusammen mit Galatien verwaltete und unter Vespasian mit Lykien zu einer Provinz verband."
    - "Juden aus Pamphylien waren zu Pfingsten in Jerusalem, und das Makkabäerbuch nennt das Land unter denen, an die Rom 139 v. Chr. zugunsten der Juden schrieb. Auf der ersten Missionsreise fuhren Paulus und Barnabas von Paphos ab und „kamen sie gen Perge im Lande Pamphylien. Johannes aber wich von ihnen und zog wieder gen Jerusalem“; sie zogen ohne Predigt in Perge nach Antiochia in Pisidien, und auf dem Rückweg „zogen [sie] durch Pisidien und kamen nach Pamphylien und redeten das Wort zu Perge und zogen hinab gen Attalien“, dann zu Schiff nach Antiochia. Vor der zweiten Reise „achtete es billig“ Paulus, „daß sie nicht mit sich nähmen einen solchen, der von ihnen gewichen war in Pamphylien“, und er und Barnabas trennten sich wegen Markus. Auf der Fahrt nach Rom mit dem Gefangenen Paulus „schifften [sie] durch das Meer bei Zilizien und Pamphylien und kamen gen Myra in Lyzien“."
    - "Heute liegt Pamphylien in der türkischen Provinz Antalya, die Ebene voller Gewächshäuser und Zitrusplantagen, die Küste voller Hotels; Antalya, das alte Attalia, ist eine Millionenstadt und das Tor des türkischen Tourismus. Die Ruinen von Perge mit Säulenstraße und Stadion, das römische Theater von Aspendos, noch heute für Festspiele genutzt, und die Tempel und der Hafen von Side gehören zu den besterhaltenen Kleinasiens."
  fr:
    - "La Pamphylie est le croissant de plaine côtière du sud de l’Asie Mineure, long d’environ 120 km, entre la Lycie à l’ouest et la Cilicie à l’est, enserré par le Taurus et ouvert sur la mer. Ses villes étaient Perge, dans l’intérieur sur le Cestrus ; Attalie, le port fondé par Attale II de Pergame vers 150 av. J.-C. ; Aspendos, Side et Sillyon. Hérodote dit que les Pamphyliens descendaient de la troupe dispersée après Troie qui suivit Amphilochos et Calchas, et leur dialecte était en effet un grec étrange. Le pays passa de la Perse à Alexandre en 333 av. J.-C., aux Séleucides et à Pergame, puis à Rome, qui semble l’avoir un temps administré avec la Galatie et, sous Vespasien, l’unit à la Lycie en une seule province."
    - "Des Juifs de Pamphylie étaient à Jérusalem à la Pentecôte, et le livre des Maccabées nomme le pays parmi ceux auxquels Rome écrivit en faveur des Juifs en 139 av. J.-C. Lors du premier voyage missionnaire, Paul et Barnabas s’embarquèrent à Paphos et « se rendirent à Perge en Pamphylie. Jean se sépara d’eux, et retourna à Jérusalem » ; ils montèrent à Antioche de Pisidie sans prêcher à Perge, et au retour, « traversant ensuite la Pisidie, ils vinrent en Pamphylie, annoncèrent la parole à Perge, et descendirent à Attalie » pour s’embarquer vers Antioche. Ce départ pesa : avant le second voyage, Paul « jugea plus convenable de ne pas prendre avec eux celui qui les avait quittés depuis la Pamphylie », et lui et Barnabas se séparèrent à cause de Marc. Lors du voyage vers Rome, le prisonnier Paul, ayant « traversé la mer qui baigne la Cilicie et la Pamphylie », arriva à Myra."
    - "Aujourd’hui, la Pamphylie se trouve dans la province d’Antalya, en Turquie, sa plaine couverte de serres et d’agrumes et sa côte d’hôtels ; Antalya, l’ancienne Attalie, est une ville de plus d’un million d’habitants et la porte du tourisme turc. Les ruines de Perge, avec sa rue à colonnades et son stade, le théâtre romain d’Aspendos, encore utilisé pour des festivals, et les temples et le port de Side comptent parmi les mieux conservés d’Asie Mineure."
  it:
    - "La Panfilia è la mezzaluna di pianura costiera a sud dell’Asia Minore, lunga circa 120 km, tra la Licia a ovest e la Cilicia a est, chiusa dai monti del Tauro e aperta sul mare. Le sue città erano Perge, nell’entroterra sul Cestro; Attalia, il porto fondato da Attalo II di Pergamo verso il 150 a.C.; Aspendo, Side e Silleo. Erodoto dice che i Panfili discendevano dalla schiera dispersa da Troia che seguì Anfiloco e Calcante, e il loro dialetto era in effetti uno strano greco. La regione passò dalla Persia ad Alessandro nel 333 a.C., poi ai Seleucidi, a Pergamo e a Roma, che per un certo tempo sembra averla governata insieme alla Galazia e sotto Vespasiano la unì alla Licia in un’unica provincia."
    - "Ebrei della Panfilia erano a Gerusalemme alla Pentecoste, e il libro dei Maccabei nomina la regione tra quelle a cui Roma scrisse in favore degli Ebrei nel 139 a.C. Nel primo viaggio missionario Paolo e Barnaba salparono da Pafo e «arrivarono a Perga di Panfilia; ma Giovanni, separatosi da loro, ritornò a Gerusalemme»; salirono ad Antiochia di Pisidia senza predicare a Perge, e sulla via del ritorno, «traversata la Pisidia, vennero in Panfilia. E dopo aver annunziata la Parola in Perga, discesero ad Attalia» e s’imbarcarono per Antiochia. La diserzione bruciò: prima del secondo viaggio Paolo «giudicava che non dovessero prendere a compagno colui che si era separato da loro fin dalla Panfilia», ed egli e Barnaba si separarono per causa di Marco. Nel viaggio verso Roma il prigioniero Paolo, «passato il mar di Cilicia e di Panfilia», giunse a Mira."
    - "Oggi la Panfilia si trova nella provincia di Antalya in Turchia, con la pianura coperta di serre e agrumeti e la costa di alberghi; Antalya, l’antica Attalia, è una città di più di un milione di abitanti e la porta del turismo turco. Le rovine di Perge, con la sua via colonnata e lo stadio, il teatro romano di Aspendos, ancora usato per i festival, e i templi e il porto di Side sono tra i meglio conservati dell’Asia Minore."
  pl:
    - "Pamfilia to półksiężyc nadmorskiej równiny na południu Azji Mniejszej, długi na około 120 km, między Licją na zachodzie a Cylicją na wschodzie, zamknięty przez góry Taurus i otwarty na morze. Jej miastami były Perge, w głębi lądu nad Kestrosem; Attalia, port założony przez Attala II z Pergamonu około 150 roku p.n.e.; Aspendos, Side i Syllion. Herodot mówi, że Pamfilijczycy pochodzili z rozproszonego spod Troi wojska, które szło za Amfilochem i Kalchasem, a ich dialekt był istotnie dziwną odmianą greki. Kraj przeszedł od Persji do Aleksandra w 333 roku p.n.e., potem do Seleucydów i Pergamonu oraz do Rzymu, który przez pewien czas, jak się zdaje, zarządzał nim wraz z Galacją, a za Wespazjana połączył z Licją w jedną prowincję."
    - "Żydzi z Pamfilii byli w Jerozolimie w Pięćdziesiątnicę, a Księga Machabejska wymienia ten kraj wśród tych, do których Rzym pisał w obronie Żydów w 139 roku p.n.e. Podczas pierwszej podróży misyjnej Paweł i Barnaba odpłynęli z Pafos i „przyszli do Pergi Pamfiliejskiej. A Jan odszedłszy od nich, wrócił się do Jeruzalemu”; poszli do Antiochii Pizydyjskiej, nie głosząc w Perge, a w drodze powrotnej „A przeszedłszy Pisydyję, przyszli do Pamfilii. I opowiedziawszy słowo Boże w Pergi, poszli do Atalii” i odpłynęli do Antiochii. Zadra pozostała: przed drugą podróżą „Ale się to Pawłowi nie zdało brać tego z sobą, który był odszedł od nich z Pamfilii”, i on z Barnabą rozstali się z powodu Marka. W podróży do Rzymu więzień Paweł przepłynął „ono morze, które jest podle Cylicyi i Pamfilii” do Miry."
    - "Dziś Pamfilia leży w prowincji Antalya w Turcji, jej równina pokryta szklarniami i uprawami cytrusów, a wybrzeże hotelami; Antalya, dawna Attalia, jest miastem liczącym ponad milion mieszkańców i bramą tureckiej turystyki. Ruiny Perge, z ulicą kolumnadową i stadionem, rzymski teatr w Aspendos, wciąż używany podczas festiwali, oraz świątynie i port Side należą do najlepiej zachowanych w Azji Mniejszej."
  cs:
    - "Pamfylie je půlměsíc pobřežní roviny na jihu Malé Asie, dlouhý asi 120 km, mezi Lykií na západě a Kilikií na východě, uzavřený pohořím Taurus a otevřený k moři. Jejími městy byly Perge, ve vnitrozemí na Kestru; Attaleia, přístav, který založil Attalos II. Pergamský kolem roku 150 př. n. l.; Aspendos, Side a Sillyon. Hérodotos praví, že Pamfylové pocházejí z vojska rozptýleného po Tróji, které následovalo Amfilocha a Kalchanta, a jejich nářečí bylo skutečně podivnou řečtinou. Země přešla od Persie k Alexandrovi roku 333 př. n. l., k Seleukovcům a Pergamu a k Římu, který ji, jak se zdá, nějakou dobu spravoval spolu s Galacií a za Vespasiana spojil s Lykií v jednu provincii."
    - "Židé z Pamfylie byli o Letnicích v Jeruzalémě a Kniha Makabejských jmenuje zemi mezi těmi, jimž Řím roku 139 př. n. l. psal ve prospěch Židů. Na první misijní cestě Pavel a Barnabáš odplouli z Pafu a „přišli do města Pergen v krajině Pamfylii. Jan pak odšed od nich, vrátil se do Jeruzaléma“; vystoupili do Antiochie Pisidské, aniž v Perge kázali, a na zpáteční cestě, „A prošedše Pisidii, přišli do Pamfylie, A mluvivše slovo Boží v Pergen, šli do města Attalie“ a nalodili se do Antiochie. Opuštění bolelo: před druhou cestou se Pavlovi „nezdálo pojíti toho s sebou, kterýž byl odšel od nich z Pamfylie“, a s Barnabášem se kvůli Markovi rozešli. Na plavbě do Říma vězeň Pavel a jeho průvodci „přeplavivše se přes moře Cilické a Pamfylické“ dopluli do Myry."
    - "Dnes leží Pamfylie v provincii Antalya v Turecku, její rovina pokrytá skleníky a citrusy a její pobřeží hotely; Antalya, dávná Attaleia, je město s více než milionem obyvatel a brána tureckého cestovního ruchu. Zříceniny Perge s kolonádovou ulicí a stadionem, římské divadlo v Aspendu, dosud užívané k festivalům, a chrámy a přístav v Side patří k nejlépe zachovaným v Malé Asii."
  nl:
    - "Pamfylië is de halvemaan van kustvlakte in het zuiden van Klein-Azië, zo’n 120 km lang, tussen Lycië in het westen en Cilicië in het oosten, ingesloten door het Taurusgebergte en open naar de zee. De steden waren Perge, landinwaarts aan de Kestros; Attalia, de haven die Attalus II van Pergamon omstreeks 150 v.Chr. stichtte; Aspendos, Side en Sillyon. Herodotus zegt dat de Pamfyliërs afstamden van de uit Troje verspreide schare die Amphilochos en Kalchas volgde, en hun dialect was inderdaad een vreemd Grieks. Het land ging van Perzië over op Alexander in 333 v.Chr., op de Seleuciden en Pergamon, en op Rome, dat het een tijdlang kennelijk samen met Galatië bestuurde en onder Vespasianus met Lycië tot één provincie verenigde."
    - "Joden uit Pamfylië waren met Pinksteren in Jeruzalem, en het boek Makkabeeën noemt het land onder die waaraan Rome in 139 v.Chr. ten behoeve van de Joden schreef. Op de eerste zendingsreis voeren Paulus en Barnabas van Paffos en “kwamen te Perge, een stad in Pamfylië. Maar Johannes, van hen scheidende, keerde weder naar Jeruzalem”; zij trokken naar Antiochië in Pisidië zonder in Perge te prediken, en op de terugweg “Pisidië doorgereisd hebbende, kwamen zij in Pamfylië. En als zij te Perge het Woord gesproken hadden, kwamen zij af naar Attalië” en voeren naar Antiochië. Het knaagde: vóór de tweede reis “achtte” Paulus “billijk, dat men dien niet zoude medenemen, die van Pamfylië af van hen was afgeweken”, en hij en Barnabas scheidden over Marcus. Op de reis naar Rome voer de gevangene Paulus, “de zee, die langs Cilicië en Pamfylië is, doorgevaren zijnde”, naar Myra."
    - "Tegenwoordig ligt Pamfylië in de Turkse provincie Antalya, met een vlakte vol kassen en citrusbomen en een kust vol hotels; Antalya, het oude Attalia, is een stad van meer dan een miljoen inwoners en de poort van het Turkse toerisme. De ruïnes van Perge, met hun zuilenstraat en stadion, het Romeinse theater van Aspendos, dat nog voor festivals wordt gebruikt, en de tempels en haven van Side behoren tot de best bewaarde van Klein-Azië."
  sv:
    - "Pamfylien är den halvmåneformade kustslätten på Mindre Asiens södra sida, omkring 120 km lång, mellan Lykien i väster och Kilikien i öster, inestängd av Taurusbergen och öppen mot havet. Dess städer var Perge, inåt land vid Kestros; Attalia, hamnen som grundades av Attalos II av Pergamon omkring 150 f.Kr.; Aspendos, Side och Sillyon. Herodotos säger att pamfylierna härstammade från den skara som skingrades från Troja och följde Amfilochos och Kalchas, och deras dialekt var verkligen en märklig grekiska. Landet gick från Persien till Alexander 333 f.Kr., till seleukiderna och Pergamon och till Rom, som en tid tycks ha styrt det tillsammans med Galatien och under Vespasianus förenade det med Lykien i en provins."
    - "Judar från Pamfylien fanns i Jerusalem vid pingst, och Första Mackabeerboken nämner landet bland de länder som Rom skrev till till judarnas förmån 139 f.Kr. På den första missionsresan seglade Paulus och Barnabas från Pafos och ”foro till Perge i Pamfylien. Där skilde sig Johannes ifrån dem och vände tillbaka till Jerusalem”; de gick upp till Antiochia i Pisidien utan att predika i Perge, och på tillbakavägen ”färdades de vidare genom Pisidien och kommo till Pamfylien. Där förkunnade de ordet i Perge och foro sedan ned till Attalia” och tog skepp till Antiochia. Övergivandet sved: före den andra resan ”Paulus fann icke skäligt att taga med sig en man som hade övergivit dem i Pamfylien”, och han och Barnabas skildes åt över Markus. På resan till Rom kom fången Paulus, sedan man ”seglat över havet, utanför Cilicien och Pamfylien”, till Myra."
    - "I dag ligger Pamfylien i provinsen Antalya i Turkiet, med slätten täckt av växthus och citrusodlingar och kusten av hotell; Antalya, det gamla Attalia, är en stad med över en miljon invånare och porten till den turkiska turismen. Ruinerna av Perge, med sin kolonnförsedda gata och stadion, den romerska teatern i Aspendos, som ännu används för festivaler, och templen och hamnen i Side hör till de bäst bevarade i Mindre Asien."
