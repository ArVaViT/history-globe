# Overview article (ADR 0007). Mainstream facts only; the identification of Lud with Lydia is given as the usual view, with the African alternative named.
id: lud-lydia
place: a38776a
title:
  en: "Lud"
  ru: "Луд"
body:
  en:
    - "Lud is a distant people famed as archers and soldiers. In the last chapter of Isaiah the LORD will send survivors “unto the nations, to Tarshish, Pul, and Lud, that draw the bow, to Tubal, and Javan, to the isles afar off, that have not heard my fame”; in Ezekiel’s lament over Tyre, “They of Persia and of Lud and of Phut were in thine army, thy men of war: they hanged the shield and helmet in thee”. The table of nations names a Lud among the sons of Shem. Most scholars take this Lud to be Lydia in western Anatolia, the Luddu of Assyrian texts, whose king Gyges sent envoys to Ashurbanipal, and whose kings later ruled from Sardis until Cyrus took it in about 547 BC."
    - "The identification is not certain. In other verses Lud stands beside Cush and Put as Egypt’s allies, and the Ludim of Genesis are sons of Egypt, so some think of an African people; the map keeps those verses under a second Lud. In these two passages the company of Tarshish, Tubal and Javan, or of Persia and Put as hired soldiers, fits the Lydians of the west, but the Bible itself never explains the name. The heart of Lydia is today the Manisa province of Turkey, with the ruins of Sardis."
  ru:
    - "Луд — далёкий народ, славный лучниками и воинами. В последней главе Исаии Господь пошлёт спасённых «к народам: в Фарсис, к Пулу и Луду, к натягивающим лук, к Тубалу и Явану, на дальние острова, которые не слышали обо Мне»; в плаче Иезекииля о Тире сказано: «Перс и Лидиянин и Ливиец находились в войске твоем и были у тебя ратниками, вешали на тебе щит и шлем». Родословие народов называет Луда среди сынов Сима. Большинство учёных видит в этом Луде Лидию на западе Анатолии, Лудду ассирийских текстов, чей царь Гиг посылал послов к Ашшурбанапалу и чьи цари потом правили из Сардиса, пока около 547 г. до н. э. их не взял Кир."
    - "Это отождествление не бесспорно. В других стихах Луд стоит рядом с Ефиопией и Ливией среди союзников Египта, а Лудим книги Бытия — сыновья Мицраима, поэтому некоторые думают об африканском народе; на карте эти стихи отнесены ко второму Луду. В этих же двух местах соседство Фарсиса, Тубала и Явана или Персов и Ливийцев как наёмников лучше подходит к западным лидийцам, но сама Библия имени не объясняет. Сердце Лидии сегодня — провинция Маниса в Турции с развалинами Сардиса."
