body:
  en:
    - "Lud is a distant people famed as archers and soldiers. In the last chapter of Isaiah the LORD will send survivors “unto the nations, to Tarshish, Pul, and Lud, that draw the bow, to Tubal, and Javan, to the isles afar off, that have not heard my fame”; in Ezekiel’s lament over Tyre, “They of Persia and of Lud and of Phut were in thine army, thy men of war: they hanged the shield and helmet in thee”. The table of nations names a Lud among the sons of Shem. Most scholars take this Lud to be Lydia in western Anatolia, the Luddu of Assyrian texts, whose king Gyges sent envoys to Ashurbanipal, and whose kings later ruled from Sardis until Cyrus took it in about 547 BC."
    - "The identification is not certain. In other verses Lud stands beside Cush and Put as Egypt’s allies, and the Ludim of Genesis are sons of Egypt, so some think of an African people; the map keeps those verses under a second Lud. In these two passages the company of Tarshish, Tubal and Javan, or of Persia and Put as hired soldiers, fits the Lydians of the west, but the Bible itself never explains the name. The heart of Lydia is today the Manisa province of Turkey, with the ruins of Sardis."
  ru:
    - "Луд — далёкий народ, славный лучниками и воинами. В последней главе Исаии Господь пошлёт спасённых «к народам: в Фарсис, к Пулу и Луду, к натягивающим лук, к Тубалу и Явану, на дальние острова, которые не слышали обо Мне»; в плаче Иезекииля о Тире сказано: «Перс и Лидиянин и Ливиец находились в войске твоем и были у тебя ратниками, вешали на тебе щит и шлем». Родословие народов называет Луда среди сынов Сима. Большинство учёных видит в этом Луде Лидию на западе Анатолии, Лудду ассирийских текстов, чей царь Гиг посылал послов к Ашшурбанапалу и чьи цари потом правили из Сардиса, пока около 547 г. до н. э. их не взял Кир."
    - "Это отождествление не бесспорно. В других стихах Луд стоит рядом с Ефиопией и Ливией среди союзников Египта, а Лудим книги Бытия — сыновья Мицраима, поэтому некоторые думают об африканском народе; на карте эти стихи отнесены ко второму Луду. В этих же двух местах соседство Фарсиса, Тубала и Явана или Персов и Ливийцев как наёмников лучше подходит к западным лидийцам, но сама Библия имени не объясняет. Сердце Лидии сегодня — провинция Маниса в Турции с развалинами Сардиса."
  uk:
    - "Луд — далекий народ, славний лучниками та воїнами. В останньому розділі Ісаї Господь пошле врятованих «до народів: у Тарсис, у Пулу й Луду, до тих, що лука напинають; у Тубалу, Евану, й по далеких островах, що слави моєї не вбачали»; в плачі Єзекіїля над Тиром «Перські й Лидійські й Либійські люде служили затязцями в полках твоїх; вони вішали щити й шоломи на тобі». Таблиця народів називає Луда серед синів Сіма. Більшість учених вважає цього Луда Лідією на заході Анатолії, Лудду ассирійських текстів, чий цар Гіг посилав послів до Ашшурбаніпала, а чиї царі згодом правили з Сард, аж поки Кір не взяв їх близько 547 р. до н. е."
    - "Ототожнення не певне. В інших віршах Луд стоїть поряд із Кушем і Футом як союзники Єгипту, а лудім з Книги Буття — сини Єгипту, тож дехто думає про африканський народ; мапа тримає ці вірші під другим Лудом. У цих двох місцях сусідство Тарсису, Тувала й Явана або Персії та Фута як найманих воїнів пасує лідійцям заходу, але сама Біблія ніколи не пояснює назви. Серце Лідії сьогодні — провінція Маніса в Туреччині з руїнами Сард."
  es:
    - "Lud es un pueblo lejano famoso por sus arqueros y soldados. En el último capítulo de Isaías, Jehová enviará supervivientes «á las gentes, á Tarsis, á Pul y Lud, que disparan arco, á Tubal y á Javán, á las islas apartadas que no oyeron de mí»; en el lamento de Ezequiel sobre Tiro, «Persas y Lidios, y los de Phut, fueron en tu ejército tus hombres de guerra: escudos y capacetes colgaron en ti». La tabla de las naciones nombra un Lud entre los hijos de Sem. La mayoría de los estudiosos toman este Lud por Lidia, en el oeste de Anatolia, el Luddu de los textos asirios, cuyo rey Giges envió emisarios a Asurbanipal, y cuyos reyes gobernaron después desde Sardis hasta que Ciro la tomó hacia 547 a. C."
    - "La identificación no es segura. En otros versículos Lud aparece junto a Cus y Fut como aliado de Egipto, y los Ludim de Génesis son hijos de Egipto, por lo que algunos piensan en un pueblo africano; el mapa mantiene esos versículos bajo un segundo Lud. En estos dos pasajes, la compañía de Tarsis, Tubal y Javán, o de Persia y Fut como soldados a sueldo, conviene a los lidios del oeste, pero la Biblia misma nunca explica el nombre. El corazón de Lidia es hoy la provincia turca de Manisa, con las ruinas de Sardis."
  pt:
    - "Lude é um povo distante, famoso como arqueiros e soldados. No último capítulo de Isaías, o SENHOR enviará sobreviventes “às nações, a Társis, Pul e Lude, que atiram com o arco, a Tubal e Javã, às ilhas distantes, que não ouviram da minha fama”; no lamento de Ezequiel sobre Tiro, “A Pérsia, Lude e Pute estavam no seu exército, seus homens de guerra. Eles penduravam o escudo e o capacete em você”. A tabela das nações nomeia um Lude entre os filhos de Sem. A maioria dos estudiosos toma este Lude pela Lídia, no oeste da Anatólia, o Luddu dos textos assírios, cujo rei Giges enviou emissários a Assurbanípal e cujos reis depois governaram de Sardes até que Ciro a tomou por volta de 547 a.C."
    - "A identificação não é certa. Em outros versículos Lude aparece ao lado de Cuxe e Pute como aliado do Egito, e os Ludim de Gênesis são filhos do Egito, de modo que alguns pensam num povo africano; o mapa mantém esses versículos sob um segundo Lude. Nestas duas passagens, a companhia de Társis, Tubal e Javã, ou de Pérsia e Pute como soldados contratados, combina com os lídios do oeste, mas a própria Bíblia nunca explica o nome. O coração da Lídia é hoje a província de Manisa, na Turquia, com as ruínas de Sardes."
  de:
    - "Lud ist ein fernes Volk, berühmt als Bogenschützen und Soldaten. Im letzten Kapitel Jesajas sendet der HERR Gerettete „zu den Heiden, gen Tharsis, gen Phul und Lud zu den Bogenschützen, gen Thubal und Javan und in die Ferne zu den Inseln, da man nichts von mir gehört hat“; in Hesekiels Klage über Tyrus: „Die aus Persien, Lud und Lybien waren dein Kriegsvolk, die ihre Schilde und Helme in dir aufhingen“. Die Völkertafel nennt einen Lud unter den Söhnen Sems. Die meisten Gelehrten halten diesen Lud für Lydien in Westanatolien, das Luddu der assyrischen Texte, dessen König Gyges Gesandte zu Assurbanipal schickte und dessen Könige später von Sardes aus herrschten, bis Kyrus es um 547 v. Chr. einnahm."
    - "Die Gleichsetzung ist nicht sicher. In anderen Versen steht Lud neben Kusch und Put als Verbündete Ägyptens, und die Luditer der Genesis sind Söhne Ägyptens, sodass manche an ein afrikanisches Volk denken; die Karte führt diese Verse unter einem zweiten Lud. In diesen beiden Stellen passt die Gesellschaft von Tarsis, Tubal und Jawan oder von Persien und Put als Söldnern zu den Lydern des Westens, doch die Bibel selbst erklärt den Namen nirgends. Das Herz Lydiens ist heute die türkische Provinz Manisa, mit den Ruinen von Sardes."
  fr:
    - "Lud est un peuple lointain réputé pour ses archers et ses soldats. Au dernier chapitre d’Ésaïe, l’Éternel enverra des réchappés « vers les nations, à Tarsis, à Pul et à Lud, qui tirent de l’arc, à Tubal et à Javan, aux îles lointaines, qui jamais n’ont entendu parler de moi » ; dans la complainte d’Ézéchiel sur Tyr, « ceux de Perse, de Lud et de Puth, servaient dans ton armée, c’étaient des hommes de guerre ; ils suspendaient chez toi le bouclier et le casque ». La table des nations nomme un Lud parmi les fils de Sem. La plupart des savants voient dans ce Lud la Lydie, en Anatolie occidentale, le Luddu des textes assyriens, dont le roi Gygès envoya des émissaires à Assurbanipal, et dont les rois régnèrent ensuite depuis Sardes jusqu’à ce que Cyrus la prît vers 547 av. J.-C."
    - "L’identification n’est pas certaine. Dans d’autres versets, Lud figure à côté de Cusch et de Puth comme allié de l’Égypte, et les Ludim de la Genèse sont des fils de l’Égypte, si bien que certains pensent à un peuple africain ; la carte garde ces versets sous un second Lud. Dans ces deux passages, la compagnie de Tarsis, de Tubal et de Javan, ou de la Perse et de Puth comme soldats à gages, convient aux Lydiens de l’ouest, mais la Bible elle-même n’explique jamais le nom. Le cœur de la Lydie est aujourd’hui la province de Manisa, en Turquie, avec les ruines de Sardes."
