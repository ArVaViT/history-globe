body:
  en:
    - "Lud is a distant people famed as archers and soldiers. In the last chapter of Isaiah the LORD will send survivors “unto the nations, to Tarshish, Pul, and Lud, that draw the bow, to Tubal, and Javan, to the isles afar off, that have not heard my fame”; in Ezekiel’s lament over Tyre, “They of Persia and of Lud and of Phut were in thine army, thy men of war: they hanged the shield and helmet in thee”. The table of nations names a Lud among the sons of Shem. Most scholars take this Lud to be Lydia in western Anatolia, the Luddu of Assyrian texts, whose king Gyges sent envoys to Ashurbanipal, and whose kings later ruled from Sardis until Cyrus took it in about 547 BC."
    - "The identification is not certain. In other verses Lud stands beside Cush and Put as Egypt’s allies, and the Ludim of Genesis are sons of Egypt, so some think of an African people; the map keeps those verses under a second Lud. In these two passages the company of Tarshish, Tubal and Javan, or of Persia and Put as hired soldiers, fits the Lydians of the west, but the Bible itself never explains the name. The heart of Lydia is today the Manisa province of Turkey, with the ruins of Sardis."
  ru:
    - "Луд — далёкий народ, славный лучниками и воинами. В последней главе Исаии Господь пошлёт спасённых «к народам: в Фарсис, к Пулу и Луду, к натягивающим лук, к Тубалу и Явану, на дальние острова, которые не слышали обо Мне»; в плаче Иезекииля о Тире сказано: «Перс и Лидиянин и Ливиец находились в войске твоем и были у тебя ратниками, вешали на тебе щит и шлем». Родословие народов называет Луда среди сынов Сима. Большинство учёных видит в этом Луде Лидию на западе Анатолии, Лудду ассирийских текстов, чей царь Гиг посылал послов к Ашшурбанапалу и чьи цари потом правили из Сардиса, пока около 547 г. до н. э. их не взял Кир."
    - "Это отождествление не бесспорно. В других стихах Луд стоит рядом с Ефиопией и Ливией среди союзников Египта, а Лудим книги Бытия — сыновья Мицраима, поэтому некоторые думают об африканском народе; на карте эти стихи отнесены ко второму Луду. В этих же двух местах соседство Фарсиса, Тубала и Явана или Персов и Ливийцев как наёмников лучше подходит к западным лидийцам, но сама Библия имени не объясняет. Сердце Лидии сегодня — провинция Маниса в Турции с развалинами Сардиса."
  uk:
    - "Луд — далекий народ, славний лучниками та воїнами. В останньому розділі Ісаї Господь пошле врятованих «до народів: у Тарсис, у Пулу й Луду, до тих, що лука напинають; у Тубалу, Евану, й по далеких островах, що слави моєї не вбачали»; в плачі Єзекіїля над Тиром «Перські й Лидійські й Либійські люде служили затязцями в полках твоїх; вони вішали щити й шоломи на тобі». Таблиця народів називає Луда серед синів Сіма. Більшість учених вважає цього Луда Лідією на заході Анатолії, Лудду ассирійських текстів, чий цар Гіг посилав послів до Ашшурбаніпала, а чиї царі згодом правили з Сард, аж поки Кір не взяв їх близько 547 р. до н. е."
    - "Ототожнення не певне. В інших віршах Луд стоїть поряд із Кушем і Футом як союзники Єгипту, а лудім з Книги Буття — сини Єгипту, тож дехто думає про африканський народ; мапа тримає ці вірші під другим Лудом. У цих двох місцях сусідство Тарсису, Тувала й Явана або Персії та Фута як найманих воїнів пасує лідійцям заходу, але сама Біблія ніколи не пояснює назви. Серце Лідії сьогодні — провінція Маніса в Туреччині з руїнами Сард."
  es:
    - "Lud es un pueblo lejano famoso por sus arqueros y soldados. En el último capítulo de Isaías, Jehová enviará supervivientes «á las gentes, á Tarsis, á Pul y Lud, que disparan arco, á Tubal y á Javán, á las islas apartadas que no oyeron de mí»; en el lamento de Ezequiel sobre Tiro, «Persas y Lidios, y los de Phut, fueron en tu ejército tus hombres de guerra: escudos y capacetes colgaron en ti». La tabla de las naciones nombra un Lud entre los hijos de Sem. La mayoría de los estudiosos toman este Lud por Lidia, en el oeste de Anatolia, el Luddu de los textos asirios, cuyo rey Giges envió emisarios a Asurbanipal, y cuyos reyes gobernaron después desde Sardis hasta que Ciro la tomó hacia 547 a. C."
    - "La identificación no es segura. En otros versículos Lud aparece junto a Cus y Fut como aliado de Egipto, y los Ludim de Génesis son hijos de Egipto, por lo que algunos piensan en un pueblo africano; el mapa mantiene esos versículos bajo un segundo Lud. En estos dos pasajes, la compañía de Tarsis, Tubal y Javán, o de Persia y Fut como soldados a sueldo, conviene a los lidios del oeste, pero la Biblia misma nunca explica el nombre. El corazón de Lidia es hoy la provincia turca de Manisa, con las ruinas de Sardis."
  pt:
    - "Lude é um povo distante, famoso como arqueiros e soldados. No último capítulo de Isaías, o SENHOR enviará sobreviventes “às nações, a Társis, Pul e Lude, que atiram com o arco, a Tubal e Javã, às ilhas distantes, que não ouviram da minha fama”; no lamento de Ezequiel sobre Tiro, “A Pérsia, Lude e Pute estavam no seu exército, seus homens de guerra. Eles penduravam o escudo e o capacete em você”. A tabela das nações nomeia um Lude entre os filhos de Sem. A maioria dos estudiosos toma este Lude pela Lídia, no oeste da Anatólia, o Luddu dos textos assírios, cujo rei Giges enviou emissários a Assurbanípal e cujos reis depois governaram de Sardes até que Ciro a tomou por volta de 547 a.C."
    - "A identificação não é certa. Em outros versículos Lude aparece ao lado de Cuxe e Pute como aliado do Egito, e os Ludim de Gênesis são filhos do Egito, de modo que alguns pensam num povo africano; o mapa mantém esses versículos sob um segundo Lude. Nestas duas passagens, a companhia de Társis, Tubal e Javã, ou de Pérsia e Pute como soldados contratados, combina com os lídios do oeste, mas a própria Bíblia nunca explica o nome. O coração da Lídia é hoje a província de Manisa, na Turquia, com as ruínas de Sardes."
  de:
    - "Lud ist ein fernes Volk, berühmt als Bogenschützen und Soldaten. Im letzten Kapitel Jesajas sendet der HERR Gerettete „zu den Heiden, gen Tharsis, gen Phul und Lud zu den Bogenschützen, gen Thubal und Javan und in die Ferne zu den Inseln, da man nichts von mir gehört hat“; in Hesekiels Klage über Tyrus: „Die aus Persien, Lud und Lybien waren dein Kriegsvolk, die ihre Schilde und Helme in dir aufhingen“. Die Völkertafel nennt einen Lud unter den Söhnen Sems. Die meisten Gelehrten halten diesen Lud für Lydien in Westanatolien, das Luddu der assyrischen Texte, dessen König Gyges Gesandte zu Assurbanipal schickte und dessen Könige später von Sardes aus herrschten, bis Kyrus es um 547 v. Chr. einnahm."
    - "Die Gleichsetzung ist nicht sicher. In anderen Versen steht Lud neben Kusch und Put als Verbündete Ägyptens, und die Luditer der Genesis sind Söhne Ägyptens, sodass manche an ein afrikanisches Volk denken; die Karte führt diese Verse unter einem zweiten Lud. In diesen beiden Stellen passt die Gesellschaft von Tarsis, Tubal und Jawan oder von Persien und Put als Söldnern zu den Lydern des Westens, doch die Bibel selbst erklärt den Namen nirgends. Das Herz Lydiens ist heute die türkische Provinz Manisa, mit den Ruinen von Sardes."
  fr:
    - "Lud est un peuple lointain réputé pour ses archers et ses soldats. Au dernier chapitre d’Ésaïe, l’Éternel enverra des réchappés « vers les nations, à Tarsis, à Pul et à Lud, qui tirent de l’arc, à Tubal et à Javan, aux îles lointaines, qui jamais n’ont entendu parler de moi » ; dans la complainte d’Ézéchiel sur Tyr, « ceux de Perse, de Lud et de Puth, servaient dans ton armée, c’étaient des hommes de guerre ; ils suspendaient chez toi le bouclier et le casque ». La table des nations nomme un Lud parmi les fils de Sem. La plupart des savants voient dans ce Lud la Lydie, en Anatolie occidentale, le Luddu des textes assyriens, dont le roi Gygès envoya des émissaires à Assurbanipal, et dont les rois régnèrent ensuite depuis Sardes jusqu’à ce que Cyrus la prît vers 547 av. J.-C."
    - "L’identification n’est pas certaine. Dans d’autres versets, Lud figure à côté de Cusch et de Puth comme allié de l’Égypte, et les Ludim de la Genèse sont des fils de l’Égypte, si bien que certains pensent à un peuple africain ; la carte garde ces versets sous un second Lud. Dans ces deux passages, la compagnie de Tarsis, de Tubal et de Javan, ou de la Perse et de Puth comme soldats à gages, convient aux Lydiens de l’ouest, mais la Bible elle-même n’explique jamais le nom. Le cœur de la Lydie est aujourd’hui la province de Manisa, en Turquie, avec les ruines de Sardes."
  it:
    - "Lud è un popolo lontano famoso come arcieri e soldati. Nell’ultimo capitolo di Isaia l’Eterno manderà superstiti «alle nazioni, a Tarsis, a Pul e a Lud che tiran d’arco, a Tubal e a Javan, alle isole lontane che non han mai udito la mia fama»; nel lamento di Ezechiele su Tiro, «Dei Persiani, dei Lidi, dei Libi servono nel tuo esercito; son uomini di guerra, che sospendono in mezzo a te lo scudo e l’elmo». La tavola delle nazioni nomina un Lud tra i figli di Sem. La maggior parte degli studiosi ritiene che questo Lud sia la Lidia nell’Anatolia occidentale, il Luddu dei testi assiri, il cui re Gige mandò ambasciatori ad Assurbanipal, e i cui re governarono poi da Sardi fino a quando Ciro la prese verso il 547 a.C."
    - "L’identificazione non è certa. In altri versetti Lud sta accanto a Cus e Put come alleato dell’Egitto, e i Ludim della Genesi sono figli d’Egitto, così alcuni pensano a un popolo africano; la mappa tiene quei versetti sotto un secondo Lud. In questi due passi la compagnia di Tarsis, Tubal e Iavan, o di Persia e Put come soldati mercenari, si adatta ai Lidi dell’Occidente, ma la Bibbia stessa non spiega mai il nome. Il cuore della Lidia è oggi la provincia di Manisa in Turchia, con le rovine di Sardi."
  pl:
    - "Lud to daleki lud słynący jako łucznicy i żołnierze. W ostatnim rozdziale Izajasza Pan pośle ocalonych „do narodów przy morzu do Pul i Lud, którzy ciągną łuk do Tubala, i do Jawanu, na wyspy dalekie, które nic o mnie nie słyszały”; w lamencie Ezechiela nad Tyrem: „Persowie, i Ludczycy, i Putejczycy bywali w wojsku twojem, mężowie waleczni twoi; tarcz i przyłbicę zawieszali w tobie”. Tablica narodów wymienia Lud wśród synów Sema. Większość uczonych uważa, że ten Lud to Lidia w zachodniej Anatolii, Luddu tekstów asyryjskich, której król Gyges wysłał posłów do Aszurbanipala i której królowie rządzili później z Sardes, aż Cyrus zdobył je około 547 r. p.n.e."
    - "Utożsamienie nie jest pewne. W innych wersetach Lud stoi obok Kusz i Put jako sprzymierzeńcy Egiptu, a Ludim z Księgi Rodzaju są synami Egiptu, więc niektórzy myślą o ludzie afrykańskim; mapa zachowuje te wersety pod drugim Lud. W tych dwóch miejscach towarzystwo Tarszisz, Tubala i Jawana albo Persji i Put jako najemnych żołnierzy pasuje do Lidyjczyków z zachodu, ale sama Biblia nigdy nie wyjaśnia nazwy. Serce Lidii to dziś turecka prowincja Manisa, z ruinami Sardes."
  nl:
    - "Lud is een veraf wonend volk, vermaard als boogschutters en soldaten. In het laatste hoofdstuk van Jesaja zal de HEER overlevenden zenden “tot de heidenen naar Tarsis, Pul, en Lud, de boogschutters, naar Tubal en Javan, tot de ver gelegen eilanden, die Mijn gerucht niet gehoord, noch Mijn heerlijkheid gezien hebben”; in Ezechiëls klaaglied over Tyrus: “Perzen, en Lydiers, en Puteers waren in uw heir, uw krijgslieden; schild en helm hingen zij in u op”. De volkerentafel noemt een Lud onder de zonen van Sem. De meeste geleerden houden dit Lud voor Lydië in West-Anatolië, het Luddu van de Assyrische teksten, wiens koning Gyges gezanten naar Assurbanipal stuurde en wiens koningen later vanuit Sardes regeerden tot Cyrus het omstreeks 547 v.Chr. innam."
    - "De identificatie is niet zeker. In andere verzen staat Lud naast Kus en Put als bondgenoot van Egypte, en de Ludim van Genesis zijn zonen van Egypte, zodat sommigen aan een Afrikaans volk denken; de kaart houdt die verzen onder een tweede Lud. In deze twee passages past het gezelschap van Tarsis, Tubal en Javan, of van Perzië en Put als gehuurde soldaten, bij de Lydiërs van het westen, maar de Bijbel zelf verklaart de naam nergens. Het hart van Lydië is tegenwoordig de Turkse provincie Manisa, met de ruïnes van Sardes."
  cs:
    - "Lud je vzdálený národ, proslulý lučištníky a vojáky. V poslední kapitole Izajáše Hospodin pošle ty, kdo budou zachováni, „k národům do Tarsu, Pul a Lud, jenž natahují lučiště, do Tubal a Javan, na ostrovy daleké, kteříž neslýchali pověsti o mně“; v Ezechielově nářku nad Týrem: „Perští a Ludští i Putští bývali v vojště tvém bojovníci tvoji, pavézu a lebku zavěšovali v tobě“. Tabulka národů jmenuje Luda mezi syny Šémovými. Většina badatelů pokládá tohoto Luda za Lýdii v západní Anatolii, asyrské Luddu, jejíž král Gyges poslal posly k Aššurbanipalovi a jejíž králové později vládli ze Sard, dokud je Kýros nedobyl kolem roku 547 př. n. l."
    - "Určení není jisté. V jiných verších stojí Lud vedle Kúše a Putu jako spojenci Egypta a Ludim z Genesis jsou synové Egypta, takže někteří myslí na africký národ; mapa tyto verše ponechává u druhého Luda. V těchto dvou místech se společnost Taršíše, Túbala a Javana, nebo Persie a Putu jako najatých vojáků hodí na Lýdy na západě, ale Bible sama jméno nevysvětluje. Jádro Lýdie je dnes turecká provincie Manisa se zříceninami Sard."
  sv:
    - "Lud är ett avlägset folk berömt som bågskyttar och soldater. I Jesajas sista kapitel skall HERREN sända överlevande ”såsom budbärare till hednafolken, till Tarsis, till Pul och Lud, bågskyttfolken, till Tubal och Javan, till havsländerna i fjärran, som icke hava hört något om mig”; i Hesekiels klagosång över Tyros: ”Perser, ludéer och putéer funnos i din här och voro ditt krigsfolk. Sköldar och hjälmar hängde de upp i dig”. Folkens tavla nämner en Lud bland Sems söner. De flesta forskare anser att denna Lud är Lydien i västra Anatolien, assyriska texters Luddu, vars kung Gyges skickade sändebud till Assurbanipal, och vars kungar sedan styrde från Sardes tills Kyros intog det omkring 547 f.Kr."
    - "Identifieringen är inte säker. I andra verser står Lud bredvid Kush och Put som Egyptens allierade, och Ludim i Första Moseboken är Egyptens söner, så somliga tänker på ett afrikanskt folk; kartan håller dessa verser under en andra Lud. I dessa två ställen passar sällskapet Tarshish, Tubal och Javan, eller Persien och Put som hyrda soldater, lyderna i väster, men Bibeln själv förklarar aldrig namnet. Lydiens hjärta är i dag provinsen Manisa i Turkiet, med ruinerna av Sardes."
  nb:
    - "Lud er et fjernt folk, berømt som bueskyttere og soldater. I det siste kapitlet hos Jesaja vil Herren sende undkomne «til hedningefolkene, til Tarsis, Ful og Lud, bueskytterne, til Tubal og Javan, til de fjerne kyster som ikke har hørt tidenden om mig»; i Esekiels klagesang over Tyros: «Menn fra Persia og Lud og Put gjorde krigstjeneste i din hær; skjold og hjelm hengte de op i dig». Folketavlen nevner en Lud blant Sems sønner. De fleste forskere regner denne Lud for å være Lydia i det vestlige Anatolia, Luddu i assyriske tekster, hvis konge Gyges sendte sendebud til Assurbanipal, og hvis konger senere styrte fra Sardes til Kyros inntok den omkring 547 f.Kr."
    - "Identifikasjonen er ikke sikker. I andre vers står Lud ved siden av Kusj og Put som Egypts allierte, og Ludim i Første Mosebok er Egypts sønner, så noen tenker på et afrikansk folk; kartet holder disse versene under en annen Lud. I disse to avsnittene passer selskapet Tarsis, Tubal og Javan, eller Persia og Put som leiesoldater, til lydierne i vest, men Bibelen forklarer aldri navnet selv. Lydias hjerte er i dag Manisa-provinsen i Tyrkia, med ruinene av Sardes."
  tl:
    - "Ang Lud ay isang malayong bayan na tanyag bilang mga mamamana at kawal. Sa huling kabanata ni Isaias, magpapadala ang Panginoon ng mga nakaligtas “sa mga bansa, sa Tarsia, Pul, at Lud, na nagsisihawak ng busog, sa Tubal at Javan, sa mga pulong malayo na hindi nangakarinig ng aking kabantugan”; sa panaghoy ni Ezekiel para sa Tiro, “Ang Persia, ang Lud, at ang Phut ay nangasa iyong hukbo, na iyong mga lalaking mangdidigma: kanilang ibinitin ang kalasag at ang turbante sa iyo”. Pinangangalanan ng talaan ng mga bansa ang isang Lud sa mga anak ni Sem. Karamihan ng iskolar ay itinuturing na ang Lud na ito ay ang Lidia sa kanlurang Anatolia, ang Luddu ng mga tekstong Asirio, na ang haring si Giges ay nagsugo ng mga sugo kay Ashurbanipal, at na ang mga hari ay kalaunang namuno mula sa Sardis hanggang sakupin ito ni Ciro noong mga 547 BK."
    - "Hindi tiyak ang pagkakakilanlan. Sa ibang mga talata, ang Lud ay nasa tabi ng Cush at Phut bilang mga kakampi ng Egipto, at ang mga Ludim ng Genesis ay mga anak ng Egipto, kaya iniisip ng ilan ang isang bayang Aprikano; pinananatili ng mapa ang mga talatang iyon sa ilalim ng ikalawang Lud. Sa dalawang sipi na ito, akma sa mga Lidio sa kanluran ang pangkat ng Tharsis, Tubal at Javan, o ng Persia at Phut bilang mga upahang kawal, ngunit hindi kailanman ipinaliliwanag ng Biblia mismo ang pangalan. Ang puso ng Lidia ay ngayon ang lalawigan ng Manisa sa Turkey, na may mga guho ng Sardis."
