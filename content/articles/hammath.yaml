body:
  en:
    - "Hammath, “hot springs”, was a fortified town of Naphtali on the western shore of the Sea of Galilee. It is identified with Hammat Tiberias, the hot springs at the southern end of modern Tiberias, which still flow into the lake. In the Babylonian Talmud one opinion makes Hammath Tiberias, named for its hot springs, while Rabba takes Hammath to be the hot springs of Gerar and Rakkath, the next name in Joshua's list, to be Tiberias itself. Many scholars also take Hammoth-dor, a Levitical city of Naphtali in Joshua 21, and Hammon in 1 Chronicles 6 to be the same place. The remains excavated at the springs begin in the Hellenistic and Roman periods."
    - "In the allotment of Naphtali, Joshua lists its walled towns along the lake: “And the fenced cities are Ziddim, Zer, and Hammath, Rakkath, and Chinnereth”. Hammath, Rakkath and Chinnereth follow one another northwards along the shore, from the springs past the site of Tiberias towards the north-western end of the lake. Joshua 21 then gives Naphtali's cities for the Levites as “Kedesh in Galilee with her suburbs, to be a city of refuge for the slayer; and Hammoth-dor with her suburbs, and Kartan with her suburbs”."
    - "Josephus knew the springs as a village called Emmaus near Tiberias, and explains that the name “may be rendered A warm bath, for therein is a spring of warm water, useful for healing”; Vespasian camped there before Tiberias in AD 67. In 1921 Nahum Slouschz excavated a synagogue at the site, the first dig in the land carried out under Jewish auspices. In 1961–1963 Moshe Dothan uncovered a second synagogue, named after Severus, whose name recurs in its Greek inscriptions; its mosaic floor of the fourth century shows the zodiac round the sun god Helios, the four seasons and a Torah shrine flanked by menorahs. The springs and the synagogue are today the Hamat Tiberias National Park in Israel."
  ru:
    - "Хамаф, «горячие источники», — укреплённый город колена Неффалимова на западном берегу моря Галилейского. Его отождествляют с Хамат-Тверией, горячими источниками у южного края современной Тивериады, которые и сейчас стекают в озеро. В Вавилонском Талмуде, по одному мнению, Хамаф — это Тивериада, названная по её горячим источникам, тогда как Рабба считает Хамаф горячими источниками Герара, а Раккаф, следующее имя в списке Иисуса Навина, — самой Тивериадой. Многие учёные считают тем же местом и Хамоф-Дор, левитский город Неффалима в 21-й главе Книги Иисуса Навина, и Хаммон в 1 Паралипоменон 6. Раскопанные у источников остатки начинаются с эллинистического и римского времени."
    - "В уделе Неффалима Иисус Навин перечисляет его обнесённые стенами города вдоль озера: «Города укрепленные: Циддим, Цер, Хамаф, Раккаф и Хиннереф». Хамаф, Раккаф и Хиннереф идут друг за другом на север вдоль берега — от источников мимо места Тивериады к северо-западному краю озера. В 21-й главе города Неффалима для левитов названы так: «Кедес в Галилее и предместья его, Хамоф-Дор и предместья его, Карфан и предместья его»."
    - "Иосиф Флавий знал источники как селение Еммаус близ Тивериады и объясняет, что это имя значит «тёплая баня», потому что там есть тёплый источник, полезный для лечения; в 67 г. н. э. Веспасиан стоял там лагерем перед Тивериадой. В 1921 г. Нахум Слоуш раскопал на этом месте синагогу — первые раскопки в стране, проведённые под еврейским руководством. В 1961–1963 гг. Моше Дотан открыл вторую синагогу, названную по имени Севера, которое повторяется в её греческих надписях; её мозаичный пол IV в. изображает зодиак вокруг бога солнца Гелиоса, четыре времени года и ковчег Торы между семисвечниками. Источники и синагога сегодня составляют национальный парк Хамат-Тверия в Израиле."
  uk:
    - "Хамат, «гарячі джерела», був укріпленим містом Нефталима на західному березі Галілейського моря. Його ототожнюють із Хамат-Тіверіадою, гарячими джерелами на південному краю сучасної Тіверіади, які й досі впадають в озеро. У Вавилонському Талмуді одна думка робить Хамат Тіверіадою, названою за її гарячими джерелами, тоді як Рабба вважає, що Хамат — це гарячі джерела Герара, а Раккат, наступна назва в переліку Ісуса Навина, — сама Тіверіада. Багато вчених вважають також, що Хамот-Дор, левітське місто Нефталима в Ісусі Навині 21, і Хамон в 1 Хронік 6 — те саме місце. Рештки, розкопані біля джерел, починаються з елліністичного та римського періодів."
    - "У наділі Нефталима Ісус Навин перелічує його укріплені міста вздовж озера: «А утверджені міста були: Зиддим, Зер, Гаммат, Раккат і Хинерет». Хамат, Раккат і Кінерет ідуть один за одним на північ уздовж берега, від джерел повз місце Тіверіади до північно-західного краю озера. Ісус Навин 21 далі називає міста Нефталима для левитів: «охоронний город про убийця: Кедес у Галилеї вкупі з пасовищами його; Гаммот-Дор укупі з пасовищами його, та Картан укупі з пасовищами його»."
    - "Йосиф Флавій знав джерела як село під назвою Еммаус поблизу Тіверіади й пояснює, що це ім'я «можна передати як Тепла купіль, бо там є джерело теплої води, корисної для лікування»; Веспасіан отаборився там перед Тіверіадою 67 р. н. е. 1921 р. Нахум Слущ розкопав на місці синагогу — перші розкопки в країні, проведені під єврейським проводом. У 1961–1963 рр. Моше Дотан відкрив другу синагогу, названу на честь Севера, чиє ім'я повторюється в її грецьких написах; її мозаїчна підлога IV ст. показує зодіак навколо бога сонця Геліоса, чотири пори року й скриню Тори, обабіч якої стоять менори. Джерела й синагога нині — національний парк Хамат-Тіверіада в Ізраїлі."
  es:
    - "Hamat, «fuentes termales», era una ciudad fortificada de Neftalí en la orilla occidental del mar de Galilea. Se identifica con Hamat Tiberias, las fuentes termales del extremo sur de la actual Tiberias, que aún fluyen hacia el lago. En el Talmud de Babilonia, una opinión hace de Hamat a Tiberias, llamada así por sus fuentes termales, mientras que Rabá toma Hamat por las fuentes termales de Gerar y Racat, el nombre siguiente en la lista de Josué, por la propia Tiberias. Muchos estudiosos toman también Hamot-dor, ciudad levítica de Neftalí en Josué 21, y Hamón en 1 Crónicas 6 por el mismo lugar. Los restos excavados en las fuentes comienzan en las épocas helenística y romana."
    - "En el reparto de Neftalí, Josué enumera sus ciudades amuralladas a lo largo del lago: «Y las ciudades fuertes son Siddim, Ser, y Hamath, Raccath, y Cinneroth». Hamat, Racat y Cineret se suceden hacia el norte por la orilla, desde las fuentes, pasando por el emplazamiento de Tiberias, hacia el extremo noroeste del lago. Josué 21 da luego las ciudades de Neftalí para los levitas: «la villa de refugio para los homicidas, á Cedes en Galilea con sus ejidos, á Hammoth-dor con sus ejidos, y á Cartán con sus ejidos»."
    - "Josefo conocía las fuentes como una aldea llamada Emaús cerca de Tiberias, y explica que el nombre «puede traducirse baño caliente, pues allí hay una fuente de agua caliente, útil para curar»; Vespasiano acampó allí frente a Tiberias en 67 d. C. En 1921 Nahum Slouschz excavó una sinagoga en el lugar, la primera excavación en el país realizada bajo auspicios judíos. En 1961–1963 Moshe Dothan descubrió una segunda sinagoga, llamada de Severo, cuyo nombre se repite en sus inscripciones griegas; su pavimento de mosaico del siglo IV muestra el zodiaco en torno al dios solar Helios, las cuatro estaciones y un arca de la Torá flanqueada por menorás. Las fuentes y la sinagoga son hoy el Parque Nacional de Hamat Tiberias, en Israel."
  pt:
    - "Hamate, “fontes termais”, era uma cidade fortificada de Naftali na margem ocidental do mar da Galileia. É identificada com Hamat Tiberíades, as fontes termais no extremo sul da moderna Tiberíades, que ainda correm para o lago. No Talmude da Babilônia, uma opinião faz de Hamate a própria Tiberíades, assim chamada por suas fontes termais, enquanto Rabá considera Hamate as fontes termais de Gerar e Racate, o nome seguinte na lista de Josué, a própria Tiberíades. Muitos estudiosos tomam também Hamote-Dor, cidade levítica de Naftali em Josué 21, e Hamom, em 1 Crônicas 6, como o mesmo lugar. Os restos escavados nas fontes começam nos períodos helenístico e romano."
    - "Na distribuição de Naftali, Josué lista suas cidades muradas ao longo do lago: “As cidades fortificadas eram Zidim, Zer, Hamate, Racate, Quinerete”. Hamate, Racate e Quinerete se sucedem para o norte ao longo da margem, das fontes, passando pelo sítio de Tiberíades, em direção à extremidade noroeste do lago. Josué 21 dá depois as cidades de Naftali para os levitas: “Quedes, na Galileia, com suas pastagens, a cidade de refúgio para o homicida, Hamote-Dor com suas pastagens e Cartã com suas pastagens”."
    - "Josefo conhecia as fontes como uma aldeia chamada Emaús perto de Tiberíades, e explica que o nome “pode ser traduzido como banho quente, pois ali há uma fonte de água quente, útil para a cura”; Vespasiano acampou ali diante de Tiberíades em 67 d.C. Em 1921 Nahum Slouschz escavou uma sinagoga no local, a primeira escavação no país realizada sob auspícios judaicos. Em 1961–1963 Moshe Dothan descobriu uma segunda sinagoga, que leva o nome de Severo, cujo nome se repete em suas inscrições gregas; seu piso de mosaico do século IV mostra o zodíaco em volta do deus-sol Hélio, as quatro estações e uma arca da Torá ladeada por menorás. As fontes e a sinagoga são hoje o Parque Nacional Hamat Tiberíades, em Israel."
  de:
    - "Hammat, „heiße Quellen“, war eine befestigte Stadt Naftalis am Westufer des Sees Genezareth. Sie wird mit Hammat Tiberias gleichgesetzt, den heißen Quellen am Südende des modernen Tiberias, die noch heute in den See fließen. Im Babylonischen Talmud setzt eine Meinung Hammat mit Tiberias gleich, das nach seinen heißen Quellen benannt sei, während Rabba Hammat für die heißen Quellen von Gerar hält und Rakkat, den nächsten Namen in Josuas Liste, für Tiberias selbst. Viele Gelehrte halten auch Hammot-Dor, eine Levitenstadt Naftalis in Josua 21, und Hammon in 1. Chronik 6 für denselben Ort. Die an den Quellen ausgegrabenen Überreste beginnen in hellenistischer und römischer Zeit."
    - "Bei der Zuteilung an Naftali führt Josua seine befestigten Städte am See auf: „und feste Städte sind: Ziddim, Zer, Hammath, Rakkath, Kinnereth“. Hammat, Rakkat und Kinneret folgen am Ufer nach Norden aufeinander, von den Quellen an der Stätte von Tiberias vorbei gegen das nordwestliche Ende des Sees. Josua 21 nennt dann die Städte Naftalis für die Leviten: „die Freistadt für die Totschläger, Kedes in Galiläa, und seine Vorstädte, Hammoth-Dor und seine Vorstädte, Karthan und seine Vorstädte“."
    - "Josephus kannte die Quellen als Dorf namens Emmaus bei Tiberias und erklärt, der Name „lässt sich mit ‚warmes Bad‘ wiedergeben, denn dort ist eine Quelle warmen Wassers, die zur Heilung nützlich ist“; Vespasian lagerte dort im Jahr 67 n. Chr. vor Tiberias. 1921 grub Nahum Slouschz an der Stätte eine Synagoge aus, die erste Grabung im Land unter jüdischer Leitung. 1961–1963 legte Moshe Dothan eine zweite Synagoge frei, nach Severus benannt, dessen Name in ihren griechischen Inschriften wiederkehrt; ihr Mosaikboden aus dem vierten Jahrhundert zeigt den Tierkreis um den Sonnengott Helios, die vier Jahreszeiten und einen Toraschrein, flankiert von Menorot. Die Quellen und die Synagoge sind heute der Nationalpark Hamat Tiberias in Israel."
  fr:
    - "Hammath, « sources chaudes », était une ville fortifiée de Nephthali sur la rive occidentale de la mer de Galilée. On l’identifie avec Hammat Tibériade, les sources chaudes de l’extrémité sud de l’actuelle Tibériade, qui se jettent encore dans le lac. Dans le Talmud de Babylone, une opinion fait de Hammath Tibériade, nommée d’après ses sources chaudes, tandis que Rabba tient Hammath pour les sources chaudes de Guérar et Rakkath, nom suivant dans la liste de Josué, pour Tibériade elle-même. Beaucoup d’exégètes pensent aussi que Hammoth-Dor, ville lévitique de Nephthali en Josué 21, et Hammon en 1 Chroniques 6 sont le même lieu. Les vestiges fouillés aux sources commencent aux époques hellénistique et romaine."
    - "Dans le partage de Nephthali, Josué énumère ses villes fortes le long du lac : « Les villes fortes étaient : Tsiddim, Tser, Hammath, Rakkath, Kinnéreth ». Hammath, Rakkath et Kinnéreth se suivent vers le nord le long de la rive, depuis les sources, devant le site de Tibériade, jusqu’à l’extrémité nord-ouest du lac. Josué 21 donne ensuite les villes de Nephthali pour les Lévites : « la ville de refuge pour les meurtriers, Kédesch en Galilée et sa banlieue, Hammoth-Dor et sa banlieue, et Karthan et sa banlieue »."
    - "Josèphe connaissait les sources comme un village nommé Emmaüs près de Tibériade, et explique que le nom « se traduit Bain chaud, car il s’y trouve une source d’eau chaude, utile à la guérison » ; Vespasien y campa devant Tibériade en 67 apr. J.-C. En 1921, Nahum Slouschz y fouilla une synagogue, première fouille du pays conduite sous direction juive. En 1961–1963, Moshe Dothan en mit au jour une seconde, dite de Sévère, dont le nom revient dans ses inscriptions grecques ; son pavement de mosaïque du IVe siècle montre le zodiaque autour du dieu solaire Hélios, les quatre saisons et une arche de la Torah encadrée de ménorahs. Les sources et la synagogue forment aujourd’hui le parc national de Hammat Tibériade, en Israël."
  it:
    - "Cammat, «sorgenti calde», era una città fortificata di Neftali sulla sponda occidentale del mare di Galilea. È identificata con Hammat Tiberias, le sorgenti calde all’estremità meridionale della moderna Tiberiade, che sgorgano ancora nel lago. Nel Talmud babilonese un’opinione fa corrispondere Cammat a Tiberiade, così chiamata per le sue sorgenti calde, mentre Rabba intende Cammat come le sorgenti calde di Gerar e Rakkat, il nome seguente nell’elenco di Giosuè, come Tiberiade stessa. Molti studiosi ritengono inoltre che Cammot-Dor, città levitica di Neftali in Giosuè 21, e Cammon in 1 Cronache 6 siano lo stesso luogo. I resti scavati presso le sorgenti iniziano in epoca ellenistica e romana."
    - "Nell’assegnazione a Neftali, Giosuè elenca le sue città murate lungo il lago: «Le città forti erano: Tsiddim, Tser, Hammath, Rakkath, Kinnereth…». Cammat, Rakkat e Chinnerèt si susseguono verso nord lungo la riva, dalle sorgenti oltre il sito di Tiberiade verso l’estremità nord-occidentale del lago. Giosuè 21 dà poi le città di Neftali per i leviti: «la città di rifugio per l’omicida, Kedes in Galilea e il suo contado, Hammoth-Dor e il suo contado, e Kartan col suo contado»."
    - "Giuseppe Flavio conosceva le sorgenti come un villaggio chiamato Emmaus presso Tiberiade, e spiega che il nome «si può rendere bagno caldo, perché vi è una sorgente d’acqua calda, utile per la guarigione»; Vespasiano vi si accampò davanti a Tiberiade nel 67 d.C. Nel 1921 Nahum Slouschz scavò una sinagoga nel sito, il primo scavo nel paese condotto sotto auspici ebraici. Nel 1961–1963 Moshe Dothan portò alla luce una seconda sinagoga, detta di Severo, il cui nome ricorre nelle sue iscrizioni greche; il suo pavimento a mosaico del IV secolo mostra lo zodiaco attorno al dio sole Elio, le quattro stagioni e un’arca della Torah affiancata da menorah. Le sorgenti e la sinagoga sono oggi il Parco nazionale di Hamat Tiberias, in Israele."
  nl:
    - "Chammat, ‘warme bronnen’, was een versterkte stad van Naftali aan de westoever van het Meer van Galilea. Zij wordt vereenzelvigd met Hammat Tiberias, de warme bronnen aan het zuidelijke uiteinde van het moderne Tiberias, die nog steeds in het meer uitmonden. In de Babylonische Talmoed stelt één mening Chammat gelijk aan Tiberias, genoemd naar zijn warme bronnen, terwijl Rabba Chammat houdt voor de warme bronnen van Gerar en Rakkat, de volgende naam in Jozua's lijst, voor Tiberias zelf. Veel geleerden achten ook Chammot-Dor, een levitische stad van Naftali in Jozua 21, en Chammon in 1 Kronieken 6 dezelfde plaats. De bij de bronnen opgegraven resten beginnen in de hellenistische en Romeinse tijd."
    - "In de landverdeling van Naftali noemt Jozua zijn ommuurde steden langs het meer: “De vaste steden nu zijn: Ziddim, Zer en Hammath, Rakkath en Cinnereth”. Chammat, Rakkat en Kinneret volgen elkaar noordwaarts langs de oever op, van de bronnen langs de plaats van Tiberias naar het noordwestelijke einde van het meer. Jozua 21 geeft dan de steden van Naftali voor de levieten als “de vrijstad des doodslagers, Kedes in Galilea, en haar voorsteden, en Hammoth-Dor en haar voorsteden, en Karthan en haar voorsteden”."
    - "Josephus kende de bronnen als een dorp Emmaüs bij Tiberias, en legt uit dat de naam “kan worden weergegeven als Warm bad, want daar is een bron van warm water, nuttig voor genezing”; Vespasianus sloeg er in 67 n.Chr. zijn kamp op voor Tiberias. In 1921 groef Nahum Slouschz op de plaats een synagoge op, de eerste opgraving in het land onder Joodse leiding. In 1961–1963 legde Moshe Dothan een tweede synagoge bloot, genoemd naar Severus, wiens naam in de Griekse inscripties terugkeert; de mozaïekvloer uit de vierde eeuw toont de dierenriem rond de zonnegod Helios, de vier jaargetijden en een Torahkast tussen menora's. De bronnen en de synagoge vormen tegenwoordig het Hamat Tiberias National Park in Israël."
  pl:
    - "Chammat, „gorące źródła”, było warownym miastem Neftalego na zachodnim brzegu Jeziora Galilejskiego. Utożsamia się je z Hammat Tiberias, gorącymi źródłami na południowym krańcu współczesnej Tyberiady, które do dziś wpływają do jeziora. W Talmudzie babilońskim według jednej opinii Chammat to Tyberiada, nazwana od swoich gorących źródeł, podczas gdy Rabba uważa Chammat za gorące źródła Geraru, a Rakkat, następną nazwę z listy Jozuego, za samą Tyberiadę. Wielu uczonych uważa też za to samo miejsce Chammot-Dor, lewickie miasto Neftalego z Joz 21, i Chammon z 1 Kron 6. Szczątki odkopane przy źródłach zaczynają się w okresie hellenistycznym i rzymskim."
    - "W przydziale Neftalego Jozue wylicza jego miasta obronne nad jeziorem: „A miasta obronne są: Assedym Ser, i Emat, Rekat, i Cyneret”. Chammat, Rakkat i Kinneret następują po sobie na północ wzdłuż brzegu, od źródeł obok miejsca Tyberiady ku północno-zachodniemu krańcowi jeziora. Joz 21 podaje następnie miasta Neftalego dla lewitów: „miasto dla ucieczki mężobójcy, Kades w Galilei i przedmieścia jego; i Hamotdor i przedmieścia jego, także Kartan i przedmieścia jego”."
    - "Józef Flawiusz znał te źródła jako wieś zwaną Emaus koło Tyberiady i wyjaśnia, że nazwa „może być oddana jako ciepła kąpiel, albowiem jest tam źródło ciepłej wody, użyteczne do leczenia”; Wespazjan rozbił tam obóz przed Tyberiadą w 67 r. n.e. W 1921 roku Nahum Slouschz odkopał na tym stanowisku synagogę, pierwsze wykopaliska w tym kraju prowadzone pod żydowską egidą. W latach 1961-1963 Moshe Dothan odsłonił drugą synagogę, nazwaną od Sewera, którego imię powraca w jej greckich napisach; jej mozaikowa posadzka z IV wieku przedstawia zodiak wokół boga słońca Heliosa, cztery pory roku oraz arkę Tory flankowaną menorami. Źródła i synagoga tworzą dziś Park Narodowy Hamat Tiberias w Izraelu."
  cs:
    - "Chamat, „horké prameny“, bylo opevněné město Neftalího na západním břehu Galilejského jezera. Ztotožňuje se s Chamat Tiberias, horkými prameny na jižním konci dnešní Tiberiady, které dosud vtékají do jezera. V babylonském Talmudu jeden názor činí Chamat Tiberiadou, pojmenovanou podle jejích horkých pramenů, zatímco Rabba pokládá Chamat za horké prameny Geraru a Rakkat, další jméno v Jozueho seznamu, za samu Tiberiadu. Mnozí badatelé pokládají také Chamót-dór, levitské město Neftalího v Jozue 21, a Chammon v 1 Pa 6 za totéž místo. Zbytky vykopané u pramenů začínají v helénistickém a římském období."
    - "V rozdělení země Neftalího vyjmenovává Jozue jeho hrazená města podél jezera: „Města pak hrazená jsou: Assedim, Ser a Emat, Rechat a Ceneret“. Chamat, Rakkat a Kineret následují za sebou na sever podél břehu, od pramenů přes místo Tiberiady k severozápadnímu konci jezera. Jozue 21 pak uvádí města Neftalího pro levity: „Město útočišťné vražedlníku, Kedes v Galilei a předměstí jeho, a Hamotdor s předměstím jeho, a Kartam s předměstím jeho“."
    - "Josephus Flavius znal prameny jako vesnici zvanou Emauzy u Tiberiady a vysvětluje, že jméno „lze přeložit jako Teplá lázeň, neboť je tam pramen teplé vody, užitečné k léčení“; Vespasianus se tam utábořil před Tiberiadou roku 67 n. l. V roce 1921 vykopal Nahum Slouschz na místě synagogu, první vykopávku v zemi vedenou pod židovskou záštitou. V letech 1961–1963 odkryl Moše Dotan druhou synagogu, pojmenovanou po Severovi, jehož jméno se opakuje v jejích řeckých nápisech; její mozaiková podlaha ze čtvrtého století zobrazuje zvěrokruh kolem boha slunce Hélia, čtyři roční období a schránu na Tóru s menorami po obou stranách. Prameny a synagoga jsou dnes Národním parkem Chamat Tiberias v Izraeli."
  sv:
    - "Hammat, ”heta källor”, var en befäst stad i Naftali vid Galileiska sjöns västra strand. Den identifieras med Hammat Tiberias, de heta källorna i södra änden av dagens Tiberias, som fortfarande rinner ut i sjön. I Babyloniska Talmud menar en åsikt att Hammat är Tiberias, uppkallad efter sina heta källor, medan Rabba tar Hammat för de heta källorna i Gerar och Rackat, nästa namn i Josuas förteckning, för Tiberias självt. Många forskare tar också Hammot-Dor, en levitstad i Naftali i Josua 21, och Hammon i 1 Krön 6 för samma plats. Lämningarna som grävts ut vid källorna börjar i hellenistisk och romersk tid."
    - "I Naftalis lott räknar Josua upp dess befästa städer längs sjön: ”de befästa städerna Siddim, Ser och Hammat, Rackat och Kinneret”. Hammat, Rackat och Kinneret följer på varandra norrut längs stranden, från källorna förbi platsen för Tiberias mot sjöns nordvästra ände. Josua 21 anger sedan Naftalis städer åt leviterna som ”dråparfristaden Kedes i Galileen med dess utmarker, Hammot-Dor med dess utmarker och Kartan med dess utmarker”."
    - "Josefus kände källorna som en by kallad Emmaus nära Tiberias och förklarar att namnet ”kan återges ’ett varmt bad’, ty där finns en källa med varmt vatten, nyttigt för läkning”; Vespasianus slog läger där före Tiberias år 67 e.Kr. År 1921 grävde Nahum Slouschz ut en synagoga på platsen, den första utgrävningen i landet under judiskt beskydd. Åren 1961–1963 frilade Moshe Dothan en andra synagoga, uppkallad efter Severus, vars namn återkommer i dess grekiska inskrifter; dess mosaikgolv från 300-talet visar zodiaken kring solguden Helios, de fyra årstiderna och ett Toraskrin flankerat av menorot. Källorna och synagogan är i dag nationalparken Hamat Tiberias i Israel."
  nb:
    - "Hammat, «varme kilder», var en befestet by i Naftali på vestbredden av Galileasjøen. Den identifiseres med Hammat Tiberias, de varme kildene i den sørlige enden av dagens Tiberias, som fortsatt renner ut i innsjøen. I Den babylonske talmud gjør én mening Hammat til Tiberias, oppkalt etter sine varme kilder, mens Rabba tar Hammat for å være de varme kildene i Gerar og Rakkat, det neste navnet i Josvas liste, for å være Tiberias selv. Mange forskere tar også Hammot-Dor, en levittby i Naftali i Josva 21, og Hammon i Første Krønikebok 6 for å være samme sted. Restene som er gravd ut ved kildene begynner i hellenistisk og romersk tid."
    - "I fordelingen til Naftali oppfører Josva dens befestede byer langs innsjøen: «Av faste byer var der: Hassiddim, Ser og Hammat, Rakkat og Kinneret». Hammat, Rakkat og Kinneret følger hverandre nordover langs stranden, fra kildene forbi stedet for Tiberias mot innsjøens nordvestlige ende. Josva 21 gir deretter Naftalis byer til levittene som «Kedes i Galilea, som var tilfluktsstad for manndrapere, med tilhørende jorder, og Hammot-Dor med jorder og Kartan med jorder»."
    - "Josefus kjente kildene som en landsby kalt Emmaus nær Tiberias, og forklarer at navnet «kan gjengis Et varmt bad, for der er en kilde med varmt vann, nyttig til helbredelse»; Vespasian slo leir der foran Tiberias i 67 e.Kr. I 1921 gravde Nahum Slouschz ut en synagoge på stedet, den første utgravningen i landet gjennomført under jødisk ledelse. I 1961–1963 avdekket Moshe Dothan en annen synagoge, oppkalt etter Severus, hvis navn går igjen i dens greske innskrifter; dens mosaikkgulv fra 300-tallet viser dyrekretsen rundt solguden Helios, de fire årstidene og et toraskrin flankert av menoraer. Kildene og synagogen er i dag Hamat Tiberias nasjonalpark i Israel."
  tl:
    - "Ang Hamath, “mainit na bukal”, ay bayang nakukutaan ng Nephtali sa kanlurang baybayin ng Dagat ng Galilea. Kinikilala ito sa Hammat Tiberias, ang mga mainit na bukal sa katimugang dulo ng makabagong Tiberias, na umaagos pa rin sa lawa. Sa Talmud ng Babilonia, ginagawa ng isang opinyon na Hamath ang Tiberias, na pinangalanan dahil sa mga mainit na bukal nito, samantalang kinukuha ni Rabba ang Hamath bilang mga mainit na bukal ng Gerar at ang Raccath, ang kasunod na pangalan sa talaan ni Josue, bilang Tiberias mismo. Maraming iskolar din ang nag-aakalang ang Hammoth-dor, bayang Levita ng Nephtali sa Josue 21, at ang Hammon sa 1 Mga Cronica 6 ay iisang lugar. Ang mga labing hinukay sa mga bukal ay nagsisimula sa mga panahong Helenistiko at Romano."
    - "Sa bahagi ni Nephtali, inilista ni Josue ang mga bayan nitong may pader sa tabi ng lawa: “At ang mga bayang nakukutaan ay Siddim, Ser, at Hamath, Raccath, at Cinneret”. Ang Hamath, Raccath at Cinereth ay sunud-sunod patungong hilaga sa tabi ng baybayin, mula sa mga bukal, lampas sa pook ng Tiberias, tungo sa hilagang-kanlurang dulo ng lawa. Ibinibigay naman ng Josue 21 ang mga bayan ni Nephtali para sa mga Levita bilang “ang bayang ampunan na ukol sa nakamatay, ang Cedes sa Galilea pati ng mga nayon niyaon, at ang Hammoth-dor pati ng mga nayon niyaon, at ang Cartan pati ng mga nayon niyaon”."
    - "Kilala ni Josephus ang mga bukal bilang nayong tinatawag na Emaus malapit sa Tiberias, at ipinaliwanag niyang ang pangalan ay “maaaring isalin na Maligamgam na paliguan, sapagkat may bukal doon ng maligamgam na tubig, na kapaki-pakinabang sa paggagamot”; nagkampo roon si Vespasiano sa harap ng Tiberias noong 67 AD. Noong 1921, hinukay ni Nahum Slouschz ang isang sinagoga sa pook, ang unang paghuhukay sa lupain sa ilalim ng pangangasiwang Judio. Noong 1961–1963, nahukay ni Moshe Dothan ang ikalawang sinagoga, na ipinangalan kay Severus, na ang pangalan ay nasa mga inskripsiyong Griyego nito; ang sahig nitong mosaiko noong ika-4 na siglo ay nagpapakita ng zodiac sa paligid ng diyos ng araw na si Helios, ang apat na panahon, at isang dambana ng Torah na may mga menorah sa magkabila. Ang mga bukal at ang sinagoga ay ang Pambansang Liwasang Hamat Tiberias sa Israel ngayon."
  da:
    - "Hammat, »varme kilder«, var en befæstet by i Naftali på Genesaret Søs vestlige bred. Den identificeres med Hammat Tiberias, de varme kilder i den sydlige ende af nutidens Tiberias, som stadig flyder ud i søen. I Det babyloniske Talmud gør én opfattelse Hammat til Tiberias, opkaldt efter dens varme kilder, mens Rabba regner Hammat for Gerars varme kilder og Rakkat, det næste navn i Josvas liste, for selve Tiberias. Mange forskere regner også Hammot-Dor, en levitisk by i Naftali i Josva 21, og Hammon i Første Krønikebog 6 for det samme sted. De udgravede levn ved kilderne begynder i den hellenistiske og romerske periode."
    - "I fordelingen til Naftali opregner Josva dens befæstede byer langs søen: »Og der er faste Stæder: Ziddim, Zer og Hamath, Rakkath og Kinnereth«. Hammat, Rakkat og Kinneret følger efter hinanden mod nord langs kysten, fra kilderne forbi Tiberias' sted mod søens nordvestlige ende. Josva 21 giver derefter Naftalis byer til leviterne som »Tilflugtsstaden for Manddrabere Kedes i Galilæa og dens Marker og Hamoth-Dor og dens Marker og Karthan og dens Marker«."
    - "Josefus kendte kilderne som en landsby kaldet Emmaus nær Tiberias og forklarer, at navnet »kan gengives ›et varmt bad‹, for dér er en kilde med varmt vand, nyttigt til helbredelse«; Vespasian slog lejr dér foran Tiberias i 67 e.Kr. I 1921 udgravede Nahum Slouschz en synagoge på stedet, den første udgravning i landet udført under jødiske auspicier. I 1961–1963 afdækkede Moshe Dothan en anden synagoge, opkaldt efter Severus, hvis navn gentages i dens græske indskrifter; dens mosaikgulv fra 300-tallet viser zodiakken omkring solguden Helios, de fire årstider og et Toraskrin flankeret af menoraer. Kilderne og synagogen er i dag Hamat Tiberias National Park i Israel."
  sr:
    - "Хамат, „топли извори“, био је утврђен град Нефталимов на западној обали Галилејског мора. Поистовећује се с Хамат Тиверијадом, топлим изворима на јужном крају савремене Тиверијаде, који и данас теку у језеро. У Вавилонском талмуду једно мишљење чини Хамат Тиверијаду, названу по топлим изворима, док Раба узима Хамат за топле изворе Герара, а Ракат, следеће име на Исусовом списку, за саму Тиверијаду. Многи научници такође узимају да су Хамот-Дор, левитски град Нефталимов у Исусу Навину 21, и Хамон у Првој књизи Летописа 6 исто место. Остаци ископани на изворима почињу у хеленистичком и римском раздобљу."
    - "У подели Нефталимовој Исус наводи његове утврђене градове уз језеро: „А тврди су градови: Сидим, Сер и Амат, Ракат и Хинерот“. Хамат, Ракат и Кинерет следе један другог према северу дуж обале, од извора поред места Тиверијаде према северозападном крају језера. Исус Навин 21 затим даје Нефталимове градове за Левите: „Кедес у Галилеји с подграђем, и Амот-Дор с подграђем, и Картан с подграђем“."
    - "Јосиф Флавије је знао изворе као село звано Емаус близу Тиверијаде и објашњава да се име „може превести као Топло купатило, јер у њему има извор топле воде, корисне за лечење“; Веспазијан је ту логорио пред Тиверијадом 67. н. е. Године 1921. Нахум Слушч ископао је на налазишту синагогу, прво ископавање у земљи изведено под јеврејским окриљем. Од 1961. до 1963. Моше Дотан открио је другу синагогу, названу по Северу, чије се име понавља у њеним грчким натписима; њен мозаички под из четвртог века приказује зодијак око бога сунца Хелиоса, четири годишња доба и ковчег Торе између менора. Извори и синагога су данас Национални парк Хамат Тиверијада у Израилу."
