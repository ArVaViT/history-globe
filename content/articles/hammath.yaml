# Overview article (ADR 0007). The identification with the hot springs of Hammat Tiberias is generally accepted; the excavated remains begin in the Hellenistic and Roman periods, and the link with Hammoth-dor and Hammon is a common but not certain inference.
id: hammath
place: a2d6bfc
title:
  en: "Hammath"
  ru: "Хамаф"
  uk: "Хамат"
  es: "Hamat"
  pt: "Hamate"
  de: "Hammat"
  fr: "Hammath"
