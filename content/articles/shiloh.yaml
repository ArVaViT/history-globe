# Overview article (ADR 0007). Mainstream facts only; the Iron Age dates follow the excavators' radiocarbon dating, disputed things are said to be disputed.
id: shiloh
place: aa4680a
title:
  en: "Shiloh"
  ru: "Силом"
  uk: "Шіло"
  es: "Silo"
  pt: "Siló"
  de: "Silo"
  fr: "Silo"
body:
  en:
    - "Shiloh lay at Khirbet Seilun in the hill country of Ephraim, which Judges places north of Bethel, east of the highway from Bethel to Shechem and south of Lebonah. A Danish expedition led by Hans Kjær dug here in 1926–1932, and Israel Finkelstein excavated the site in 1981–1984. In the Middle Bronze Age Shiloh was a walled town with a massive wall and glacis. A dump of offering vessels and animal bones from the Late Bronze Age suggests that a sanctuary stood here before Israel's time."
    - "After the conquest the Israelites gathered at Shiloh and set up the tabernacle of the congregation there, and Joshua cast lots for the remaining tribes. A yearly feast of the LORD was held at Shiloh, when the daughters of Shiloh came out to dance. Elkanah and Hannah came up here to worship, while Eli and his sons were priests; Hannah brought the child Samuel to the house of the LORD, and the LORD revealed himself to Samuel at Shiloh. The ark was taken from Shiloh into battle and captured by the Philistines, and Eli died at the news."
    - 'Finkelstein found Israelite pillared buildings with storage jars, burnt in a destruction that radiocarbon dates to the second half of the eleventh century BC. Many link it to the Philistine victory, but the Bible does not describe Shiloh''s fall. The town lived on as a small place: the prophet Ahijah the Shilonite promised Jeroboam the kingdom, and Jeremiah warned Jerusalem with Shiloh''s fate: "go ye now unto my place which was in Shiloh".'
    - "In Roman and Byzantine times a village stood here. Eusebius places Shiloh twelve miles from Neapolis in the district of Acrabattene and notes that the ark had been kept there until Samuel's time. Jerome, describing Paula's journey of the 380s, writes that a ruined altar was still shown there. Excavations have uncovered Byzantine churches with mosaic floors, one of them probably built between about 380 and 420."
  ru:
    - "Силом стоял на месте Хирбет-Сейлун на горе Ефремовой; Книга Судей помещает его на север от Вефиля, на восток от дороги, ведущей от Вефиля в Сихем, и на юг от Левоны. В 1926–1932 гг. здесь копала датская экспедиция Ханса Кьера, а в 1981–1984 гг. городище раскапывал Израэль Финкельштейн. В среднем бронзовом веке Силом был городом с мощной стеной и гласисом. Свалка жертвенной посуды и костей животных позднего бронзового века говорит о том, что святилище стояло здесь ещё до Израиля."
    - "После завоевания сыны Израилевы собрались в Силом и поставили там скинию собрания, а Иисус Навин бросил жребий для остальных колен. В Силоме каждый год бывал праздник Господень, когда девицы Силомские выходили плясать в хороводах. Сюда приходили поклониться Елкана и Анна, когда священниками были Илий и его сыновья; Анна привела отрока Самуила в дом Господа, и Господь открыл Себя Самуилу в Силоме. Ковчег завета взяли из Силома на битву, и его захватили филистимляне, а Илий, услышав об этом, умер."
    - "Финкельштейн нашёл израильские здания со столбами и сосудами для запасов, сгоревшие при разрушении, которое радиоуглерод датирует второй половиной XI века до н. э. Многие связывают его с победой филистимлян, но Библия не описывает падения Силома. Город продолжал жить как небольшое место: пророк Ахия Силомлянин предсказал Иеровоаму царство, а Иеремия предостерегал Иерусалим участью Силома: «Пойдите же на место Мое в Силом»."
    - "В римское и византийское время здесь стояло селение. Евсевий помещает Силом в двенадцати милях от Неаполя, в области Акрабаттина, и отмечает, что ковчег хранился там до времени Самуила. Иероним, описывая путешествие Павлы в 380-х гг., пишет, что там ещё показывали развалины жертвенника. Раскопки открыли византийские церкви с мозаичными полами; одна из них построена, вероятно, около 380–420 гг."
  uk:
    - "Шіло лежало в Хірбет-Сейлуні в гірській країні Єфрема, яку Книга Суддів розміщує на північ від Бет-Елу, на схід від шляху з Бет-Елу до Сихему й на південь від Левони. Данська експедиція під керівництвом Ганса К'єра розкопувала тут 1926–1932 рр., а Ізраель Фінкельштайн — 1981–1984 рр. У середньому бронзовому віці Шіло було обнесеним мурами містом із масивним муром і гласисом. Звалище жертовних посудин і тваринних кісток пізнього бронзового віку дає підстави думати, що святиня стояла тут ще до часів Ізраїлю."
    - "Після завоювання ізраїльтяни зібралися в Шіло й поставили там скинію зібрання, і Ісус Навин кидав жереби для решти племен. Щорічне свято Господнє відбувалося в Шіло, коли дочки Шіло виходили танцювати. Елкана й Анна приходили сюди поклонитися, коли Ілій і його сини були священиками; Анна привела дитину Самуїла до дому Господнього, і Господь об'явився Самуїлові в Шіло. Ковчег узяли з Шіло на бій, і його захопили філістимляни, а Ілій помер, почувши новину."
    - "Фінкельштайн знайшов ізраїльські будівлі зі стовпами та глеками для зберігання, спалені під час руйнування, яке радіовуглецевий аналіз відносить до другої половини XI ст. до н. е. Багато хто пов'язує його з перемогою філістимлян, але Біблія не описує падіння Шіло. Містечко жило далі як мале поселення: пророк Ахія Шілонянин пообіцяв Єровоамові царство, а Єремія застерігав Єрусалим долею Шіло: «Ійдїте ж до місця мого в Сило»."
    - "У римську та візантійську добу тут стояло село. Євсевій розміщує Шіло за дванадцять миль від Неаполя в окрузі Акрабатена й зазначає, що ковчег зберігався там до часів Самуїла. Єронім, описуючи подорож Паули 380-х років, пише, що там ще показували зруйнований жертовник. Розкопки виявили візантійські церкви з мозаїчною підлогою, одну з яких, імовірно, збудовано приблизно між 380 і 420 рр."
  es:
    - "Silo estaba en Khirbet Seilun, en la región montañosa de Efraín, que Jueces sitúa al norte de Betel, al este del camino real de Betel a Siquem y al sur de Lebona. Una expedición danesa dirigida por Hans Kjær excavó aquí en 1926–1932, e Israel Finkelstein excavó el lugar en 1981–1984. En la Edad del Bronce Medio Silo era una ciudad amurallada con una muralla maciza y glacis. Un vertedero de vasijas de ofrenda y huesos de animales del Bronce Final sugiere que aquí se alzaba un santuario antes del tiempo de Israel."
    - "Tras la conquista los israelitas se reunieron en Silo y asentaron allí el tabernáculo del testimonio, y Josué echó suertes para las tribus restantes. En Silo se celebraba cada año una fiesta del Señor, cuando las hijas de Silo salían a bailar. Elcana y Ana subían aquí a adorar, siendo sacerdotes Elí y sus hijos; Ana llevó al niño Samuel a la casa del Señor, y el Señor se manifestó a Samuel en Silo. El arca fue llevada de Silo a la batalla y capturada por los filisteos, y Elí murió al saber la noticia."
    - "Finkelstein halló edificios israelitas de pilares con tinajas de almacenamiento, quemados en una destrucción que el radiocarbono fecha en la segunda mitad del siglo XI a. C. Muchos la vinculan con la victoria filistea, pero la Biblia no describe la caída de Silo. La ciudad siguió viviendo como un lugar pequeño: el profeta Ahías el silonita prometió el reino a Jeroboam, y Jeremías advirtió a Jerusalén con el destino de Silo: «Andad empero ahora á mi lugar que fué en Silo»."
    - "En época romana y bizantina hubo aquí una aldea. Eusebio sitúa Silo a doce millas de Neápolis, en el distrito de Acrabatene, y anota que el arca se había guardado allí hasta el tiempo de Samuel. Jerónimo, al describir el viaje de Paula en la década de 380, escribe que aún se mostraba allí un altar en ruinas. Las excavaciones han sacado a la luz iglesias bizantinas con suelos de mosaico, una de ellas probablemente construida entre 380 y 420 aproximadamente."
  pt:
    - "Siló ficava em Khirbet Seilun, na região montanhosa de Efraim, que Juízes situa ao norte de Betel, a leste da estrada de Betel a Siquém e ao sul de Lebona. Uma expedição dinamarquesa dirigida por Hans Kjær escavou aqui em 1926–1932, e Israel Finkelstein escavou o sítio em 1981–1984. Na Idade do Bronze Média Siló era uma cidade murada com uma muralha maciça e um glacis. Um depósito de vasos de oferenda e ossos de animais do Bronze Final sugere que havia ali um santuário antes do tempo de Israel."
    - "Depois da conquista os israelitas se reuniram em Siló e armaram ali a Tenda do Encontro, e Josué lançou sortes para as tribos restantes. Uma festa anual do SENHOR era celebrada em Siló, quando as filhas de Siló saíam para dançar. Elcana e Ana subiam aqui para adorar, enquanto Eli e seus filhos eram sacerdotes; Ana levou o menino Samuel à casa do SENHOR, e o SENHOR se revelou a Samuel em Siló. A arca foi levada de Siló para a batalha e capturada pelos filisteus, e Eli morreu com a notícia."
    - "Finkelstein achou edifícios israelitas de pilares com jarras de armazenamento, queimados numa destruição que o radiocarbono data da segunda metade do século XI a.C. Muitos a ligam à vitória filisteia, mas a Bíblia não descreve a queda de Siló. A cidade continuou como lugar pequeno: o profeta Aías, o silonita, prometeu o reino a Jeroboão, e Jeremias advertiu Jerusalém com o destino de Siló: “Mas vão agora ao meu lugar que estava em Siló”."
    - "Em tempos romanos e bizantinos havia aqui uma aldeia. Eusébio situa Siló a doze milhas de Neápolis, no distrito de Acrabatena, e nota que a arca ficara ali até o tempo de Samuel. Jerônimo, descrevendo a viagem de Paula na década de 380, escreve que ainda se mostrava ali um altar em ruínas. As escavações trouxeram à luz igrejas bizantinas com pisos de mosaico, uma delas provavelmente construída entre cerca de 380 e 420."
  de:
    - "Silo lag bei Chirbet Seilun im Bergland Ephraim, das die Richter nördlich von Bethel, östlich der Straße von Bethel nach Sichem und südlich von Lebona ansetzen. Eine dänische Expedition unter Hans Kjær grub hier 1926–1932, und Israel Finkelstein grub die Stätte 1981–1984 aus. In der Mittelbronzezeit war Silo eine ummauerte Stadt mit massiver Mauer und Glacis. Eine Halde von Opfergefäßen und Tierknochen aus der Spätbronzezeit legt nahe, dass hier schon vor Israels Zeit ein Heiligtum stand."
    - "Nach der Landnahme versammelten sich die Israeliten in Silo und richteten dort die Stiftshütte auf, und Josua warf das Los für die übrigen Stämme. In Silo wurde jährlich ein Fest des HERRN gefeiert, bei dem die Töchter Silos zum Tanz herauskamen. Elkana und Hanna kamen hierher zur Anbetung, als Eli und seine Söhne Priester waren; Hanna brachte das Kind Samuel zum Haus des HERRN, und der HERR offenbarte sich Samuel in Silo. Die Lade wurde von Silo in die Schlacht gebracht und von den Philistern erbeutet, und Eli starb bei der Nachricht."
    - "Finkelstein fand israelitische Pfeilerhäuser mit Vorratskrügen, verbrannt bei einer Zerstörung, die nach der Radiokarbonmethode in die zweite Hälfte des 11. Jahrhunderts v. Chr. datiert. Viele bringen sie mit dem philistäischen Sieg in Verbindung, doch die Bibel beschreibt Silos Fall nicht. Die Stadt bestand als kleiner Ort fort: Der Prophet Ahija der Silonit verhieß Jerobeam das Königreich, und Jeremia warnte Jerusalem mit Silos Schicksal: „Gehet hin an meinen Ort zu Silo“."
    - "In römischer und byzantinischer Zeit stand hier ein Dorf. Eusebius setzt Silo zwölf Meilen von Neapolis im Bezirk Akrabattene an und vermerkt, dass die Lade dort bis zu Samuels Zeit verwahrt wurde. Hieronymus schreibt bei der Schilderung von Paulas Reise der 380er Jahre, ein zerstörter Altar sei dort noch gezeigt worden. Grabungen haben byzantinische Kirchen mit Mosaikböden freigelegt, eine davon wohl zwischen etwa 380 und 420 erbaut."
  fr:
    - "Silo se trouvait à Khirbet Seilun, dans les collines d’Éphraïm, que les Juges placent au nord de Béthel, à l’est de la grand-route de Béthel à Sichem et au sud de Lebona. Une expédition danoise dirigée par Hans Kjær y fouilla en 1926–1932, et Israel Finkelstein fouilla le site en 1981–1984. À l’âge du Bronze moyen, Silo était une ville fortifiée au mur massif et au glacis. Un dépôt de vases d’offrandes et d’ossements d’animaux de l’âge du Bronze récent suggère qu’un sanctuaire s’y dressait avant l’époque d’Israël."
    - "Après la conquête, les Israélites se rassemblèrent à Silo et y dressèrent la tente d’assignation, et Josué y jeta le sort pour les tribus restantes. Une fête annuelle de l’Éternel se tenait à Silo, quand les filles de Silo sortaient pour danser. Elkana et Anne y montaient pour adorer, du temps d’Éli et de ses fils sacrificateurs ; Anne amena l’enfant Samuel à la maison de l’Éternel, et l’Éternel se révéla à Samuel à Silo. L’arche fut emportée de Silo à la bataille et prise par les Philistins, et Éli mourut à cette nouvelle."
    - "Finkelstein trouva des bâtiments israélites à piliers avec des jarres de stockage, brûlés dans une destruction que le radiocarbone date de la seconde moitié du XIe siècle av. J.-C. Beaucoup la rattachent à la victoire philistine, mais la Bible ne décrit pas la chute de Silo. La ville subsista comme petit lieu : le prophète Achija de Silo promit le royaume à Jéroboam, et Jérémie avertit Jérusalem par le sort de Silo : « Allez donc au lieu qui m’était consacré à Silo »."
    - "À l’époque romaine et byzantine, un village s’y trouvait. Eusèbe place Silo à douze milles de Néapolis dans le district d’Akrabattène et note que l’arche y fut gardée jusqu’au temps de Samuel. Jérôme, décrivant le voyage de Paula dans les années 380, écrit qu’on y montrait encore un autel en ruine. Les fouilles ont mis au jour des églises byzantines aux sols de mosaïque, dont l’une probablement bâtie entre environ 380 et 420."
