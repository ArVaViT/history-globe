body:
  en:
    - "The Corner Gate was a gate of Jerusalem in the days of the kings, named from the corner of the wall at which it stood. Nothing of it has been found, and its place is inferred from the texts: the wall ran four hundred cubits, about 200 m, from the Gate of Ephraim to the Corner Gate, and Jeremiah and Zechariah pair it with the tower of Hananel, which stood at the north-east. Most scholars therefore put the Corner Gate at the north-west corner of the city of that time, where the north wall turned south along the western hill, roughly in the area of today's Jaffa Gate and the Citadel, though the bounds of the city in the eighth century are themselves debated."
    - "The gate first appears in a defeat. When Jehoash of Israel beat Amaziah of Judah at Beth-shemesh he came to Jerusalem “and brake down the wall of Jerusalem from the gate of Ephraim unto the corner gate, four hundred cubits”, took hostages and the treasures of the Temple, and went home to Samaria. Amaziah's son Uzziah “built towers in Jerusalem at the corner gate, and at the valley gate, and at the turning of the wall, and fortified them”. Nehemiah's account of the walls he repaired does not name the Corner Gate, perhaps because that stretch was then outside the smaller city, or went by another name."
    - "The prophets use the gate to measure the city of the future. Jeremiah promises “the days come, saith the LORD, that the city shall be built to the LORD from the tower of Hananeel unto the gate of the corner”, and on over the hill Gareb to Goath, so that the whole valley of the dead bodies and of the ashes shall be holy. Zechariah sees Jerusalem lifted up and inhabited “from Benjamin's gate unto the place of the first gate, unto the corner gate, and from the tower of Hananeel unto the king's winepresses”. Nahman Avigad's discovery in the 1970s of the Broad Wall, seven metres thick and of the late eighth century BC, crossing the Jewish Quarter, showed that the city had by then spread onto the western hill, and so where such a corner can have been."
  ru:
    - "Угольные ворота — ворота Иерусалима времён царей, названные по углу стены, у которого они стояли. От них ничего не найдено, и их место выводят из текстов: стена шла четыреста локтей, около 200 м, от ворот Ефремовых до Угольных ворот, а Иеремия и Захария ставят их в пару с башней Хананела (в Синодальном переводе — Анамеила), стоявшей на северо-востоке. Поэтому большинство учёных помещают Угольные ворота в северо-западный угол тогдашнего города, где северная стена поворачивала к югу вдоль западного холма, примерно в районе нынешних Яффских ворот и Цитадели, хотя сами границы города в VIII веке спорны."
    - "Впервые ворота появляются в поражении. Иоас Израильский, разбив Амасию Иудейского при Вефсамисе, пришёл в Иерусалим «и разрушил стену Иерусалимскую от ворот Ефремовых до ворот угольных на четыреста локтей», взял заложников и сокровища Храма и вернулся в Самарию. О сыне Амасии сказано: «построил Озия башни в Иерусалиме над воротами угольными и над воротами долины и на углу, и укрепил их». Рассказ Неемии о стенах, которые он чинил, не называет Угольных ворот — быть может, потому, что этот участок был тогда вне меньшего города или звался иначе."
    - "Пророки мерят воротами будущий город. Иеремия обещает: «наступают дни, говорит Господь, когда город устроен будет во славу Господа от башни Анамеила до ворот угольных», и дальше через холм Гарив до Гоафа, так что вся долина трупов и пепла будет святынею. Захария видит Иерусалим, который высоко стоит на своём месте и населится «от ворот Вениаминовых до места первых ворот, до угловых ворот, и от башни Анамеила до царских точил». Открытая Нахманом Авигадом в 1970-х годах Широкая стена, семиметровой толщины и конца VIII века до н. э., пересекающая Еврейский квартал, показала, что город к тому времени распространился на западный холм, а значит, и где мог быть такой угол."
  uk:
    - "Наріжні ворота були брамою Єрусалима за днів царів, названою за кутом муру, біля якого стояли. Від них нічого не знайдено, і їхнє місце виводять із текстів: мур тягся чотириста ліктів, близько 200 м, від Ефраїмових воріт до Наріжних, а Єремія та Захарія ставлять їх поряд із вежею Хананела, яка стояла на північному сході. Тому більшість учених розміщує Наріжні ворота в північно-західному куті тогочасного міста, де північний мур повертав на південь уздовж західного пагорба, приблизно в районі сьогоднішніх Яффських воріт і Цитаделі, хоча межі міста у VIII ст. самі є предметом суперечки."
    - "Ворота вперше з'являються в оповіді про поразку. Коли Йоас Ізраїльський переміг Амассію Юдейського в Бет-Шемеші, він прийшов до Єрусалима й «зробив у Ерусалимському мурі проломину від Ефреїмових ворот та й до ворот наріжних, на чотириста локот», забрав заручників і скарби храму й повернувся до Самарії. Син Амассії Уззія збудував «башти в Ерусалимі над брамою угловою й над долинною брамою й на углї, та й скріпив їх». Розповідь Неемії про мури, які він лагодив, не називає Наріжних воріт, можливо тому, що ця ділянка тоді лежала поза меншим містом або мала іншу назву."
    - "Пророки використовують ворота, щоб виміряти місто майбутнього. Єремія обіцяє: «надходить час, говорить Господь, що одбудують ізнов город на славу Господеві від башти Анамеїлевої до углових воріт», і далі через пагорб Гареб до Гоату, так що вся долина трупів і попелу буде святою. Захарія бачить Єрусалим піднесений і залюднений «од Беняминової брами до місця давних воріт, до наріжних воріт, і від Ананеїлової башти до царських тискарень». Відкриття Нахманом Авігадом у 1970-х рр. Широкої стіни, завтовшки сім метрів, кінця VIII ст. до н. е., що перетинає Єврейський квартал, показало, що місто на той час розрослося на західний пагорб, а отже, і де міг бути такий кут."
  es:
    - "La Puerta de la Esquina era una puerta de Jerusalén en tiempos de los reyes, llamada así por el ángulo de la muralla en que se hallaba. No se ha encontrado nada de ella, y su lugar se deduce de los textos: la muralla tenía cuatrocientos codos, unos 200 m, desde la Puerta de Efraín hasta la Puerta de la Esquina, y Jeremías y Zacarías la emparejan con la torre de Hananeel, que se alzaba al nordeste. La mayoría de los estudiosos sitúan por ello la Puerta de la Esquina en el ángulo noroccidental de la ciudad de entonces, donde la muralla norte giraba hacia el sur a lo largo de la colina occidental, aproximadamente en la zona de la actual puerta de Jafa y la Ciudadela, aunque los límites de la ciudad en el siglo VIII son en sí mismos objeto de debate."
    - "La puerta aparece por primera vez en una derrota. Cuando Joás de Israel venció a Amasías de Judá en Bet-semes, llegó a Jerusalén «y derribó el muro de Jerusalem desde la puerta de Ephraim hasta la puerta del ángulo, cuatrocientos codos», tomó rehenes y los tesoros del Templo, y volvió a Samaria. El hijo de Amasías, Uzías, «edificó también Uzzías torres en Jerusalem, junto á la puerta del ángulo, y junto á la puerta del valle, y junto á las esquinas; y fortificólas». El relato de Nehemías sobre los muros que reparó no nombra la Puerta de la Esquina, quizá porque ese tramo quedaba entonces fuera de la ciudad más pequeña, o porque se la conocía por otro nombre."
    - "Los profetas usan la puerta para medir la ciudad del futuro. Jeremías promete: «vienen días, dice Jehová, y la ciudad será edificada á Jehová, desde la torre de Hananeel hasta la puerta del rincón», y luego sobre el collado de Gareb hasta Goa, de modo que todo el valle de los cuerpos muertos y de la ceniza será santo. Zacarías ve a Jerusalén enaltecida y habitada «desde la puerta de Benjamín hasta el lugar de la puerta primera, hasta la puerta de los rincones; y desde la torre de Hananeel hasta los lagares del rey». El descubrimiento por Nahman Avigad en la década de 1970 del Muro Ancho, de siete metros de grosor y de finales del siglo VIII a. C., que cruza el Barrio Judío, mostró que la ciudad se había extendido ya entonces a la colina occidental, y por tanto dónde pudo haber un ángulo así."
  pt:
    - "A Porta da Esquina era uma porta de Jerusalém nos dias dos reis, assim chamada pelo canto do muro em que ficava. Nada dela foi encontrado, e seu lugar é deduzido dos textos: o muro ia quatrocentos côvados, cerca de 200 m, da Porta de Efraim até a Porta da Esquina, e Jeremias e Zacarias a associam à torre de Hananel, que ficava a nordeste. A maioria dos estudiosos põe, portanto, a Porta da Esquina no canto noroeste da cidade daquele tempo, onde o muro norte virava para o sul ao longo da colina ocidental, mais ou menos na área da atual Porta de Jafa e da Cidadela, embora os limites da cidade no século VIII sejam eles próprios debatidos."
    - "A porta aparece pela primeira vez numa derrota. Quando Jeoás de Israel venceu Amazias de Judá em Bete-Semes, veio a Jerusalém e “derrubou o muro de Jerusalém desde a porta de Efraim até a porta da esquina, quatrocentos côvados”, levou reféns e os tesouros do Templo, e voltou para Samaria. O filho de Amazias, Uzias, “construiu torres em Jerusalém, na porta da esquina, na porta do vale e no ângulo do muro, e as fortificou”. O relato de Neemias sobre os muros que reparou não nomeia a Porta da Esquina, talvez porque esse trecho estivesse então fora da cidade menor, ou tivesse outro nome."
    - "Os profetas usam a porta para medir a cidade do futuro. Jeremias promete: “Eis que vêm dias”, diz o SENHOR, “em que a cidade será edificada para o SENHOR, desde a torre de Hananeel até a porta da esquina”, e adiante, sobre a colina de Garebe até Goa, de modo que todo o vale dos cadáveres e das cinzas seja santo. Zacarias vê Jerusalém exaltada e habitada “desde a porta de Benjamim até o lugar da primeira porta, até a porta da esquina, e desde a torre de Hananel até os lagares do rei”. A descoberta, por Nahman Avigad na década de 1970, da Muralha Larga, de sete metros de espessura e do fim do século VIII a.C., atravessando o Bairro Judeu, mostrou que a cidade já se estendia então à colina ocidental, e portanto onde tal esquina pode ter estado."
  de:
    - "Das Ecktor war ein Tor Jerusalems in den Tagen der Könige, nach der Ecke der Mauer benannt, an der es stand. Nichts von ihm ist gefunden worden, und sein Platz wird aus den Texten erschlossen: Die Mauer verlief vierhundert Ellen, etwa 200 m, vom Ephraimtor bis zum Ecktor, und Jeremia und Sacharja stellen es neben den Turm Hananeel, der im Nordosten stand. Die meisten Gelehrten setzen das Ecktor daher an die Nordwestecke der damaligen Stadt, wo die Nordmauer nach Süden entlang dem Westhügel abbog, etwa im Bereich des heutigen Jaffators und der Zitadelle, obwohl die Grenzen der Stadt im 8. Jahrhundert selbst umstritten sind."
    - "Das Tor erscheint zuerst in einer Niederlage. Als Joasch von Israel Amazja von Juda bei Bet-Schemesch besiegt hatte, kam er nach Jerusalem und „riß ein die Mauer Jerusalems von dem Tor Ephraim bis an das Ecktor, vierhundert Ellen lang“, nahm Geiseln und die Schätze des Tempels und kehrte nach Samaria heim. Amazjas Sohn Usija „baute Türme zu Jerusalem am Ecktor und am Taltor und am Winkel und befestigte sie“. Nehemias Bericht über die Mauern, die er ausbesserte, nennt das Ecktor nicht, vielleicht weil dieser Abschnitt damals außerhalb der kleineren Stadt lag oder unter einem anderen Namen lief."
    - "Die Propheten gebrauchen das Tor, um die Stadt der Zukunft zu vermessen. Jeremia verheißt: „Siehe, es kommt die Zeit, spricht der HERR, daß die Stadt des HERRN soll gebaut werden vom Turm Hananeel an bis ans Ecktor“, und weiter über den Hügel Gareb nach Goa, sodass das ganze Tal der Leichen und der Asche heilig sein soll. Sacharja sieht Jerusalem erhaben und bewohnt „vom Tor Benjamin bis an den Ort des ersten Tores, bis an das Ecktor, und vom Turm Hananeel bis an des Königs Kelter“. Nahman Avigads Entdeckung der Breiten Mauer in den 1970er Jahren, sieben Meter dick und aus dem späten 8. Jahrhundert v. Chr., die das Jüdische Viertel durchquert, zeigte, dass sich die Stadt bis dahin auf den Westhügel ausgedehnt hatte, und damit, wo eine solche Ecke gewesen sein kann."
  fr:
    - "La Porte de l’Angle était une porte de Jérusalem au temps des rois, nommée d’après l’angle de la muraille où elle se dressait. On n’en a rien retrouvé, et son emplacement se déduit des textes : la muraille courait sur quatre cents coudées, environ 200 m, de la porte d’Éphraïm à la Porte de l’Angle, et Jérémie et Zacharie l’associent à la tour de Hananeel, qui se trouvait au nord-est. La plupart des spécialistes placent donc la Porte de l’Angle à l’angle nord-ouest de la ville de cette époque, là où le mur nord tournait vers le sud le long de la colline occidentale, à peu près dans la zone de l’actuelle porte de Jaffa et de la Citadelle, bien que les limites de la ville au VIIIe siècle soient elles-mêmes discutées."
    - "La porte apparaît d’abord dans une défaite. Quand Joas d’Israël battit Amatsia de Juda à Beth-Schémesch, il vint à Jérusalem et « fit une brèche de quatre cents coudées dans la muraille de Jérusalem, depuis la porte d’Éphraïm jusqu’à la porte de l’angle », prit des otages et les trésors du Temple, et rentra à Samarie. Ozias, fils d’Amatsia, « bâtit des tours à Jérusalem sur la porte de l’angle, sur la porte de la vallée, et sur l’angle, et il les fortifia ». Le récit de Néhémie sur les murs qu’il répara ne nomme pas la Porte de l’Angle, peut-être parce que ce tronçon se trouvait alors hors de la ville plus petite, ou portait un autre nom."
    - "Les prophètes se servent de la porte pour mesurer la ville de l’avenir. Jérémie promet : « Voici, les jours viennent, dit l’Éternel, où la ville sera rebâtie à l’honneur de l’Éternel, depuis la tour de Hananeel jusqu’à la porte de l’angle », puis, au-delà, la colline de Gareb jusqu’à Goath, de sorte que toute la vallée des cadavres et de la cendre sera sainte. Zacharie voit Jérusalem élevée et habitée « depuis la porte de Benjamin jusqu’au lieu de la première porte, jusqu’à la porte des angles, et depuis la tour de Hananeel jusqu’aux pressoirs du roi ». La découverte par Nahman Avigad, dans les années 1970, de la Muraille large, épaisse de sept mètres et de la fin du VIIIe siècle av. J.-C., traversant le quartier juif, montra que la ville s’était alors étendue sur la colline occidentale, et donc où un tel angle a pu se trouver."
  it:
    - "La Porta dell’Angolo era una porta di Gerusalemme al tempo dei re, così detta dall’angolo delle mura presso cui sorgeva. Non ne è stato trovato nulla e il suo luogo si deduce dai testi: le mura correvano per quattrocento cubiti, circa 200 m, dalla Porta di Efraim alla Porta dell’Angolo, e Geremia e Zaccaria la accostano alla torre di Cananeèl, che sorgeva a nord-est. La maggior parte degli studiosi pone dunque la Porta dell’Angolo all’angolo nord-occidentale della città di allora, dove le mura settentrionali piegavano a sud lungo la collina occidentale, all’incirca nella zona dell’odierna Porta di Giaffa e della Cittadella, benché gli stessi confini della città nell’VIII secolo siano discussi."
    - "La porta compare la prima volta in una sconfitta. Quando Ioas d’Israele batté Amazia di Giuda a Bet-Semes, venne a Gerusalemme e «fece una breccia di quattrocento cubiti nelle mura di Gerusalemme, dalla porta di Efraim alla porta dell’angolo», prese ostaggi e i tesori del Tempio e tornò a Samaria. Ozia, figlio di Amazia, «costruì pure delle torri a Gerusalemme sulla porta dell’angolo, sulla porta della valle e sullo svolto, e le fortificò». Il resoconto di Neemia sulle mura da lui restaurate non nomina la Porta dell’Angolo, forse perché quel tratto era allora fuori della città più piccola, o andava sotto un altro nome."
    - "I profeti usano la porta per misurare la città futura. Geremia promette: «i giorni vengono, dice l’Eterno, che questa città sarà riedificata in onore dell’Eterno, dalla torre di Hananeel alla porta dell’angolo», e poi oltre il colle di Gareb fino a Goa, così che tutta la valle dei cadaveri e delle ceneri sarà santa. Zaccaria vede Gerusalemme innalzata e abitata «dalla porta di Beniamino al luogo della prima porta, la porta degli angoli, e dalla torre di Hananeel agli strettoi del re». La scoperta, negli anni 1970, da parte di Nahman Avigad del Muro Largo, spesso sette metri e della fine dell’VIII secolo a.C., che attraversa il Quartiere Ebraico, mostrò che la città si era ormai estesa sulla collina occidentale, e quindi dove un tale angolo può essere stato."
  pl:
    - "Brama Narożna była bramą Jerozolimy za czasów królów, nazwaną od narożnika muru, przy którym stała. Nic z niej nie znaleziono, a jej miejsce wnioskuje się z tekstów: mur biegł czterysta łokci, około 200 m, od Bramy Efraima do Bramy Narożnej, a Jeremiasz i Zachariasz łączą ją z wieżą Chananeela, stojącą na północnym wschodzie. Większość uczonych umieszcza więc Bramę Narożną w północno-zachodnim narożniku ówczesnego miasta, gdzie mur północny skręcał na południe wzdłuż zachodniego wzgórza, mniej więcej w okolicy dzisiejszej Bramy Jafskiej i Cytadeli, choć granice miasta w VIII w. są same w sobie dyskutowane."
    - "Brama pojawia się po raz pierwszy w klęsce. Gdy Joasz izraelski pobił Amazjasza judzkiego pod Bet-Szemesz, przybył do Jerozolimy i „zburzył mur Jeruzalemski od bramy Efraim aż do bramy narożnej, na cztery sta łokci”, wziął zakładników i skarby świątyni i wrócił do Samarii. Syn Amazjasza, Uzzjasz, budował „wieże w Jeruzalemie nad bramą narożną, i nad bramą doliny, i nad Mikzoa, i umocnił je” (Mikzoa to „zakręt muru”). Opis murów odbudowanych przez Nehemiasza nie wymienia Bramy Narożnej, być może dlatego, że ten odcinek leżał wtedy poza mniejszym miastem albo nosił inną nazwę."
    - "Prorocy używają bramy do wymierzenia miasta przyszłości. Jeremiasz obiecuje: „Oto idą dni (mówi Pan,) których będzie zbudowane to miasto Panu od wieży Chananeel aż do bramy narożnej”, a dalej przez wzgórze Gareb do Goa, tak że cała dolina trupów i popiołu będzie święta. Zachariasz widzi Jerozolimę wywyższoną i zamieszkałą „od bramy Benjaminowej aż do miejsca bramy pierwszej i aż do bramy węgielnej, a od wieży Chananeel aż do pras królewskich”. Odkrycie przez Nahmana Awigada w latach siedemdziesiątych XX w. Szerokiego Muru, grubego na siedem metrów i z końca VIII w. p.n.e., przecinającego Dzielnicę Żydowską, wykazało, że miasto rozrosło się już wtedy na zachodnie wzgórze, a więc gdzie taki narożnik mógł leżeć."
  nl:
    - "De Hoekpoort was een poort van Jeruzalem ten tijde van de koningen, genoemd naar de hoek van de muur waar ze stond. Er is niets van gevonden, en haar plaats wordt uit de teksten afgeleid: de muur liep vierhonderd el, zo'n 200 m, van de Efraïmpoort tot de Hoekpoort, en Jeremia en Zacharia koppelen haar aan de toren van Hananel, die in het noordoosten stond. De meeste geleerden plaatsen de Hoekpoort daarom op de noordwesthoek van de toenmalige stad, waar de noordmuur afboog naar het zuiden langs de westelijke heuvel, grofweg bij de huidige Jaffapoort en de Citadel, al is de omvang van de stad in de achtste eeuw zelf omstreden."
    - "De poort verschijnt voor het eerst in een nederlaag. Toen Joas van Israël Amazia van Juda bij Beth-Semes versloeg, kwam hij te Jeruzalem “en hij brak aan den muur van Jeruzalem, van de poort van Efraim tot aan de Hoekpoort, vierhonderd ellen”, nam gijzelaars en de schatten van de tempel en keerde terug naar Samaria. Amazia's zoon Uzzia bouwde “torens te Jeruzalem, aan de Hoekpoort en aan de Dalpoort, en aan de hoeken; en hij sterkte ze”. Nehemia's verslag van de muren die hij herstelde noemt de Hoekpoort niet, misschien omdat dat stuk toen buiten de kleinere stad lag of een andere naam droeg."
    - "De profeten gebruiken de poort om de stad van de toekomst te meten. Jeremia belooft: “Ziet, de dagen komen, spreekt de HEERE, dat deze stad den HEERE zal herbouwd worden, van den toren Hananeel af tot aan de Hoekpoort”, en verder over de heuvel Gareb tot Goa, zodat het hele dal van de dode lichamen en van de as heilig zal zijn. Zacharia ziet Jeruzalem “verhoogd en bewoond worden in haar plaats; van de poort van Benjamin af, tot aan de plaats van de eerste poort, tot aan de Hoekpoort toe; en van den toren van Hananeel, tot aan des konings wijnbakken toe”. Nahman Avigads vondst in de jaren 1970 van de Brede Muur, zeven meter dik en uit de late achtste eeuw v.Chr., door de Joodse wijk, toonde dat de stad toen al naar de westelijke heuvel was uitgebreid, en dus waar zo'n hoek kan hebben gelegen."
  cs:
    - "Rohová brána byla branou Jeruzaléma za dnů králů, pojmenovanou podle rohu hradby, u něhož stála. Nic z ní nebylo nalezeno a její poloha se usuzuje z textů: hradba měřila čtyři sta loktů, asi 200 m, od Efrajimské brány k Rohové bráně a Jeremjáš a Zacharjáš ji spojují s věží Chananel, která stála na severovýchodě. Většina badatelů proto klade Rohovou bránu na severozápadní roh tehdejšího města, kde severní hradba odbočovala na jih podél západního pahorku, zhruba v oblasti dnešní Jaffské brány a Citadely, ač hranice města v 8. století jsou samy sporné."
    - "Brána se poprvé objevuje v porážce. Když Jóaš Izraelský porazil u Bét-šemeše Amacjáše Judského, přitáhl do Jeruzaléma a „zbořil zed Jeruzalémskou, od brány Efraim až k bráně úhlu, na čtyři sta loktů“, vzal rukojmí a poklady chrámu a vrátil se do Samaří. O Amacjášově synu Uzijášovi se praví: „vzdělal Uziáš věže v Jeruzalémě u brány úhlové, a u brány údolí, a u Mikzoa, i upevnil je“. Nehemjášovo vylíčení hradeb, které opravil, Rohovou bránu nejmenuje, snad proto, že ten úsek tehdy ležel mimo menší město, nebo nesl jiné jméno."
    - "Proroci užívají brány k vyměření budoucího města. Jeremjáš slibuje: „dnové jdou, dí Hospodin, v nichž vystaveno bude město toto Hospodinu, od věže Chananeel až k bráně úhlu“, a dál přes pahorek Gareb ke Goa, takže celé údolí mrtvol a popela bude svaté. Zacharjáš vidí Jeruzalém vyzdvižený a obydlený „od brány Beniaminovy až k místu brány první, a až k bráně úhlové, a od věže Chananeel až k presu královskému“. Objev Široké hradby Nahmanem Avigadem v 70. letech, silné sedm metrů a z konce 8. století př. n. l., procházející Židovskou čtvrtí, ukázal, že se město tou dobou rozšířilo na západní pahorek, a tedy kde mohl takový roh být."
  sv:
    - "Hörnporten var en port i Jerusalem på kungarnas tid, uppkallad efter hörnet av muren där den stod. Inget av den har påträffats, och dess plats härleds ur texterna: muren löpte fyra hundra alnar, omkring 200 m, från Efraimsporten till Hörnporten, och Jeremia och Sakarja parar ihop den med Hananeltornet, som stod i nordost. De flesta forskare placerar därför Hörnporten i den dåtida stadens nordvästra hörn, där norra muren vek av söderut längs västra kullen, ungefär i området kring dagens Jaffaport och Citadellet, även om stadens gränser på 700-talet själva är omdebatterade."
    - "Porten förekommer först i samband med ett nederlag. När Joas av Israel besegrat Amasja av Juda vid Bet-Shemesh kom han till Jerusalem, och då ”bröt han ned ett stycke av Jerusalems mur vid Efraimsporten, och därifrån ända till Hörnporten, fyra hundra alnar”, tog gisslan och skatterna i templet och vände hem till Samaria. Amasjas son Ussia ”byggde torn i Jerusalem över Hörnporten och över Dalporten och över Vinkeln och befäste dem”. Nehemjas redogörelse för murarna som han satte i stånd nämner inte Hörnporten, kanske för att den sträckan då låg utanför den mindre staden eller gick under ett annat namn."
    - "Profeterna använder porten för att mäta framtidens stad. Jeremia lovar: ”dagar skola komma, säger HERREN, då staden åter skall varda uppbyggd till HERRENS ära, från Hananeltornet intill Hörnporten”, och vidare över Garebshöjden till Goa, så att hela ”lik- och askdalen” skall vara helgad. Sakarja ser Jerusalem upphöjt och bebott, så att ”själva staden skall trona på sin höjd, och sträcka sig från Benjaminsporten ända till den plats där den förra porten stod, till Hörnporten och Hananeltornet och till de kungliga vinpressarna”. Nahman Avigads upptäckt på 1970-talet av Breda muren, sju meter tjock och från slutet av 700-talet f.Kr., som korsar judiska kvarteret, visade att staden då hade spridit sig upp på västra kullen, och därmed också var ett sådant hörn kan ha legat."
  nb:
    - "Hjørneporten var en port i Jerusalem på kongenes tid, oppkalt etter hjørnet av muren der den sto. Ingenting av den er funnet, og dens plass er sluttet ut fra tekstene: muren gikk fire hundre alen, omkring 200 m, fra Efra'im-porten til Hjørneporten, og Jeremia og Sakarja setter den i par med Hananels tårn, som sto i nordøst. De fleste forskere plasserer derfor Hjørneporten i det nordvestlige hjørnet av datidens by, der nordmuren svingte sørover langs vesthøyden, omtrent i området rundt dagens Jaffaporten og Citadellet, selv om byens grenser på 700-tallet selv er omdiskutert."
    - "Porten dukker først opp i et nederlag. Da Joasj av Israel beseiret Amasja av Juda ved Bet-Sjemesj, kom han til Jerusalem og «rev ned et stykke av Jerusalems mur, fra Efra'im-porten til Hjørneporten, fire hundre alen», tok gisler og skattene i tempelet og dro hjem til Samaria. Amasjas sønn Ussia «bygget tårn i Jerusalem ved Hjørneporten og ved Dalporten og ved Vinkelen og gjorde således disse steder faste og sterke». Nehemjas beretning om murene han satte i stand, nevner ikke Hjørneporten, kanskje fordi den strekningen da lå utenfor den mindre byen, eller gikk under et annet navn."
    - "Profetene bruker porten til å måle fremtidens by. Jeremia lover: «Se, dager kommer, sier Herren, da byen skal bygges for Herren, fra Hananels tårn like til Hjørneporten», og videre over Gareb-haugen til Goa, slik at hele dalen med de døde kropper og asken skal være hellig. Sakarja ser Jerusalem heve seg og trone på sitt sted «like fra Benjamin-porten til det sted hvor den forrige port var, til Hjørneporten, og fra Hananels tårn til kongens vinperser». Nahman Avigads oppdagelse på 1970-tallet av Bredmuren, sju meter tykk og fra slutten av 700-tallet f.Kr., som krysser det jødiske kvarter, viste at byen da hadde spredt seg ut på vesthøyden, og dermed hvor et slikt hjørne kan ha vært."
  tl:
    - "Ang Pintuang-bayan sa Sulok ay isang pintuan ng Jerusalem noong mga araw ng mga hari, na pinangalanan mula sa sulok ng pader kung saan ito nakatayo. Walang natagpuan tungkol dito, at ang lugar nito ay inihihinuha mula sa mga teksto: ang pader ay tumatakbo nang apat na raang siko, mga 200 m, mula sa Pintuang-bayan ng Ephraim hanggang sa Pintuang-bayan sa Sulok, at ipinares ito nina Jeremias at Zacharias sa moog ni Hananel, na nakatayo sa hilagang-silangan. Kaya karamihan sa mga iskolar ay naglalagay sa Pintuang-bayan sa Sulok sa hilagang-kanlurang sulok ng lungsod noon, kung saan lumiko pababa sa timog ang hilagang pader sa kanlurang burol, halos sa lugar ng Pintuan ng Jaffa at ng Citadel ngayon, bagaman pinagtatalunan mismo ang mga hangganan ng lungsod noong ika-8 siglo."
    - "Unang lumilitaw ang pintuan sa isang pagkatalo. Nang talunin ni Joas ng Israel si Amasias ng Juda sa Beth-semes, dumating siya sa Jerusalem at “ibinagsak ang kuta ng Jerusalem mula sa pintuang-bayan ng Ephraim hanggang sa pintuang-bayan ng sulok, na apat na raang siko”, kumuha ng mga bihag at ng mga kayamanan ng Templo, at umuwi sa Samaria. Ang anak ni Amasias na si Uzzias ay “nagtayo ng mga moog sa Jerusalem sa pintuang-bayan na nasa panulok, at sa pintuang-bayan sa libis, at sa pagliko ng kuta, at mga pinagtibay”. Hindi pinangangalanan ng salaysay ni Nehemias ng mga pader na kinumpuni niya ang Pintuang-bayan sa Sulok, marahil dahil ang bahaging iyon ay nasa labas noon ng mas maliit na lungsod, o may ibang pangalan."
    - "Ginagamit ng mga propeta ang pintuan upang sukatin ang lungsod ng hinaharap. Nangangako si Jeremias na “ang mga araw ay dumarating, sabi ng Panginoon, na ang bayan ay matatayo sa Panginoon mula sa moog ni Hananeel hanggang sa pintuang-bayan sa sulok”, at pagkatapos ay sa ibabaw ng burol ng Gareb hanggang Goa, upang ang buong libis ng mga bangkay at ng mga abo ay maging banal. Nakikita ni Zacharias ang Jerusalem na itinaas at tinitirhan “mula sa pintuang-bayan ng Benjamin hangang sa dako ng unang pintuang-bayan, hanggang sa sulok na pintuang-bayan, at mula sa moog ng Hananel hanggang sa pisaan ng ubas ng hari”. Ang pagtuklas ni Nahman Avigad noong dekada 1970 sa Malapad na Kuta, 7 m ang kapal at mula sa huling ika-8 siglo BK, na tumatawid sa Jewish Quarter, ay nagpakita na lumawak na noon ang lungsod sa kanlurang burol, at kaya rin kung saan maaaring naroon ang gayong sulok."
  da:
    - "Hjørneporten var en port i Jerusalem i kongernes tid, opkaldt efter det hjørne af muren, hvor den stod. Intet af den er fundet, og dens sted udledes af tekster: Muren løb fire hundrede alen, cirka 200 m, fra Efraimsporten til Hjørneporten, og Jeremias og Zakarias parrer den med Hananels tårn, som stod i nordøst. De fleste forskere placerer derfor Hjørneporten i den daværende bys nordvestlige hjørne, hvor nordmuren drejede sydpå langs den vestlige høj, nogenlunde ved nutidens Jaffaport og Citadellet, selv om grænserne for byen i 700-tallet f.Kr. selv er omdiskuterede."
    - "Porten optræder først i et nederlag. Da Joas af Israel slog Amazja af Juda ved Bet-Sjemesj, kom han til Jerusalem »og nedrev af Jerusalems Mur fra Efraims Port indtil Hjørneporten et Stykke paa fire Hundrede Alen«, tog gidsler og templets skatte og drog hjem til Samaria. Amazjas søn Uzzija byggede »Taarne i Jerusalem ved Hjørneporten og ved Dalporten og paa Hjørnet og befæstede dem«. Nehemias' beretning om murene, han istandsatte, nævner ikke Hjørneporten, måske fordi den strækning dengang lå uden for den mindre by, eller gik under et andet navn."
    - "Profeterne bruger porten til at måle fremtidens by. Jeremias lover »de Dage komme, siger Herren, da Staden skal bygges for Herren, fra Hananeels Taarn indtil Hjørneporten«, og videre over Garebs høj til Goat, så hele dalen med ådslerne og asken skal være hellig. Zakarias ser Jerusalem løftet op og bebygget »fra Benjamins Port indtil den første Ports Sted, indtil Hjørneporten, og fra Hananeels Taarn indtil Kongens Vinperser«. Nahman Avigads opdagelse i 1970'erne af Den Brede Mur, syv meter tyk og fra slutningen af 700-tallet f.Kr., der krydsede det jødiske kvarter, viste, at byen da havde bredt sig ud på den vestlige høj, og dermed hvor et sådant hjørne kan have været."
  sr:
    - "Угаона капија била је капија Јерусалима у доба краљева, названа по углу зида на коме је стајала. Од ње ништа није нађено, а њено место закључује се из текстова: зид је ишао четири стотине лаката, око 200 м, од Јефремове до Угаоне капије, а Јеремија и Захарија је упарују с кулом Ананеиловом, која је стајала на североистоку. Већина научника зато смешта Угаону капију на северозападни угао тадашњег града, где се северни зид окретао јужно дуж западног брда, отприлике у подручју данашње Јафске капије и Цитаделе, мада су и границе града у 8. веку спорне."
    - "Капија се први пут јавља у поразу. Када је Јоас Израиљев потукао Амасију Јудиног код Вет-Семеса, дошао је у Јерусалим и „обори зид јерусалимски од врата Јефремових до врата на углу четири стотине лаката“, узео таоце и благо Храма и вратио се у Самарију. О Амасијином сину Озији се каже: „сазида Озија куле у Јерусалиму на вратима на углу, и на вратима у долу, и на углу, и утврди их“. Немијин приказ зидова које је поправио не именује Угаону капију, можда зато што је тај део тада био изван мањег града, или се звао другим именом."
    - "Пророци капију употребљавају да измере будући град. Јеремија обећава: „Ево иду дани, говори Господ, у које ће се сазидати Господу овај град од куле Ананеилове до врата на углу“, и даље преко хума Гарива до Гоата, тако да ће сва долина мртвих тела и пепела бити света. Захарија види Јерусалим подигнут и насељен „од врата Венијаминових до места где су прва врата, до врата на углу, и од куле Ананеилове до теска царевог“. Откриће Нахмана Авигада 1970-их, Широког зида, дебљине седам метара из касног 8. века п. н. е., који прелази Јеврејску четврт, показало је да се град дотад проширио на западно брдо, и тако где је такав угао могао бити."
  hu:
    - "A Sarokkapu Jeruzsálem kapuja volt a királyok korában, a fal sarkáról kapta a nevét, ahol állt. Semmit sem találtak belőle, és a helyét a szövegekből következtetik ki: a fal négyszáz singen, körülbelül 200 m-en át futott az Efraim kapujától a Sarokkapuig, Jeremiás és Zakariás pedig Hananel tornyával párosítja, amely északkeleten állt. A legtöbb tudós ezért a Sarokkaput az akkori város északnyugati sarkára teszi, ahol az északi fal délnek fordult a nyugati domb mentén, nagyjából a mai Jaffa-kapu és a Citadella területére, bár a város határai a Kr. e. 8. században maguk is vitatottak."
    - "A kapu először egy vereségben tűnik fel. Amikor Joás izraeli király Bét-Semesnél legyőzte Amácját, Júda királyát, Jeruzsálembe ment, és „lerontotta Jeruzsálem kerítését, az Efraim kapujától egész a szegletkapuig, négyszáz singre”, túszokat és a Templom kincseit vitte, és hazatért Szamáriába. Amácja fia, Uzziás „építe tornyokat Jeruzsálemben a szeglet kapuja felett, a völgy kapuja felett és a szegletek felett, és igen megerősítteté azokat”. Nehémiás beszámolója az általa javított falakról nem nevezi meg a Sarokkaput, talán mert az a szakasz akkor a kisebb városon kívül esett, vagy más néven szerepelt."
    - "A próféták a kapuval mérik a jövő városát. Jeremiás megígéri: „Ímé eljőnek a napok, azt mondja az Úr, és felépíttetik a város az Úrnak a Hanániel tornyától fogva a szeglet kapujáig”, majd tovább a Gáréb-hegyen át Góhatig, hogy a holttesteknek és a hamunak egész völgye szent legyen. Zakariás látja Jeruzsálemet felmagasztalva és lakottan, „a Benjámin kapujától az első kapu helyéig, a szegletkapuig, és a Hananéel tornyától a király sajtójáig”. Nahman Avigad az 1970-es években a zsidó negyeden áthúzódó, hét méter vastag, Kr. e. 8. század végi Széles fal felfedezésével megmutatta, hogy a város addigra a nyugati dombra terjedt ki, és így azt is, hol lehetett ilyen sarok."
  fi:
    - "Kulmaportti oli Jerusalemin portti kuninkaiden aikana, nimetty muurin kulman mukaan, jossa se sijaitsi. Siitä ei ole löydetty mitään, ja sen paikka päätellään teksteistä: muuri kulki neljäsataa kyynärää, noin 200 m, Efraimin portilta Kulmaportille, ja Jeremia ja Sakarja yhdistävät sen Hananelin torniin, joka sijaitsi koillisessa. Useimmat tutkijat sijoittavat siksi Kulmaportin tuolloisen kaupungin luoteiskulmaan, missä pohjoismuuri kääntyi etelään läntistä kukkulaa pitkin, suunnilleen nykyisen Jaffan portin ja Linnakkeen alueelle, vaikka kaupungin rajat 700-luvulla eaa. ovat itsekin kiistanalaisia."
    - "Portti esiintyy ensi kerran tappion yhteydessä. Israelin Joas löi Juudan Amasjan Bet-Semeksessä: ”Kun hän tuli Jerusalemiin, revitti hän Jerusalemin muuria Efraimin portista Kulmaporttiin saakka, neljäsataa kyynärää.” Hän otti panttivankeja ja temppelin aarteet ja palasi Samariaan. Amasjan poika Ussia ”rakennutti Jerusalemiin tornit Kulmaportin ja Laaksoportin päälle ja Kulmauksen päälle ja varusti ne”. Nehemian kertomus korjaamistaan muureista ei nimeä Kulmaporttia, ehkä koska tuo osuus oli silloin pienemmän kaupungin ulkopuolella tai kulki toisella nimellä."
    - "Profeetat käyttävät porttia tulevan kaupungin mittana. Jeremia lupaa: ”päivät tulevat, sanoo Herra, jolloin Herran kaupunki rakennetaan jälleen Hananelin-tornista Kulmaporttiin asti”, ja edelleen Garebin kukkulan yli Gooaan, niin että koko ruumiiden ja tuhkan laakso on oleva pyhä. Sakarja näkee Jerusalemin kohotettuna ja asuttuna ”Benjaminin portista entisen portin sijaan asti, Kulmaporttiin ja Hananelin-torniin asti, kuninkaan viinikuurniin asti”. Nahman Avigadin 1970-luvulla tekemä Leveän muurin löytö, seitsemän metriä paksun ja 700-luvun lopulta eaa. peräisin olevan, joka ylittää juutalaiskorttelin, osoitti, että kaupunki oli tuolloin levinnyt läntiselle kukkulalle ja siis myös sen, missä tällainen kulma on voinut olla."
  vi:
    - "Cửa Góc là một cổng của Giê-ru-sa-lem thời các vua, đặt tên theo góc tường nơi nó đứng. Chưa tìm thấy gì của nó, và vị trí của nó được suy ra từ các bản văn: bức tường chạy bốn trăm cubit, khoảng 200 m, từ Cửa Ép-ra-im đến Cửa Góc, và Giê-rê-mi cùng Xa-cha-ri ghép nó với tháp Ha-na-nê-ên, vốn đứng ở phía đông bắc. Vì vậy phần lớn học giả đặt Cửa Góc ở góc tây bắc của thành thời đó, nơi tường phía bắc quay xuống phía nam dọc đồi phía tây, đại khái ở khu vực Cổng Jaffa và Thành Cổ ngày nay, dù ranh giới của thành vào thế kỷ 8 cũng còn tranh luận."
    - "Cổng lần đầu xuất hiện trong một thất bại. Khi Giô-ách của Y-sơ-ra-ên thắng A-ma-xia của Giu-đa tại Bết-Sê-mết, ông đến Giê-ru-sa-lem, “phá vách thành từ cửa Ép-ra-im cho đến cửa Góc, một khúc dài bốn trăm thước”, lấy con tin và các báu vật của Đền Thờ, rồi trở về Sa-ma-ri. Con trai A-ma-xia là Ô-xia “xây những tháp tại Giê-ru-sa-lem, trên cửa Góc, trên cửa Trũng, và trên Góc tường, làm cho nó vững chắc”. Phần tường thuật của Nê-hê-mi về các bức tường ông sửa không nêu tên Cửa Góc, có lẽ vì đoạn đó khi ấy nằm ngoài thành nhỏ hơn, hoặc mang tên khác."
    - "Các nhà tiên tri dùng cổng này để đo thành tương lai. Giê-rê-mi hứa: “Nầy, những ngày đến, khi thành sẽ được xây lại cho Đức Giê-hô-va, từ tháp Ha-na-nê-ên cho đến cửa góc”, và tiếp tục qua đồi Ga-rép đến Gô-a, để cả nơi trũng của thây chết và tro đều được biệt riêng ra thánh. Xa-cha-ri thấy Giê-ru-sa-lem được nhắc lên và có người ở “từ cửa Bên-gia-min cho đến chỗ cửa thứ nhứt, và đến cửa góc, lại từ tháp Ha-na-nê-ên cho đến những nơi ép rượu của vua”. Phát hiện của Nahman Avigad vào những năm 1970 về Vách Rộng, dày bảy mét và thuộc cuối thế kỷ 8 TCN, băng qua Khu Do Thái, cho thấy thành khi ấy đã lan lên đồi phía tây, và do đó cho thấy một góc như vậy có thể ở đâu."
  ro:
    - "Poarta Unghiului era o poartă a Ierusalimului în zilele regilor, numită după colțul zidului la care se afla. Nimic din ea nu a fost găsit, iar locul ei este dedus din texte: zidul avea patru sute de coți, circa 200 m, de la Poarta lui Efraim până la Poarta Unghiului, iar Ieremia și Zaharia o pun în pereche cu turnul lui Hananeel, care se afla la nord-est. Cei mai mulți cercetători pun deci Poarta Unghiului în colțul de nord-vest al cetății din acea vreme, unde zidul de nord cotea spre sud de-a lungul dealului de vest, aproximativ în zona Porții Jaffa de azi și a Citadelei, deși hotarele cetății în secolul al VIII-lea sunt ele însele disputate."
    - "Poarta apare întâi într-o înfrângere. Când Ioaș al lui Israel l-a învins pe Amația al lui Iuda la Bet-Șemeș, a venit la Ierusalim „și a surpai zidul Ierusalimului dela poarta lui Efraim până la poarta unghiurilor patru sute de coți”, a luat ostatici și comorile Templului și s-a întors în Samaria. Despre fiul lui Amația se spune că „a zidit Ozia turnuri în Ierusalim, la poarta unghiului, la poarta văii și la unghiuri, și le-a întărit”. Relatarea lui Neemia despre zidurile pe care le-a reparat nu numește Poarta Unghiului, poate pentru că acea porțiune se afla atunci în afara cetății mai mici sau purta alt nume."
    - "Profeții folosesc poarta ca să măsoare cetatea viitorului. Ieremia făgăduiește că vin zile când cetatea va fi zidită pentru Domnul de la turnul lui Hananeel până la poarta unghiului, și mai departe peste dealul Gareb până la Goa, astfel încât toată valea trupurilor moarte și a cenușii să fie sfântă. Zaharia vede Ierusalimul ridicat și locuit în locul lui, „dela poarta lui Veniamin, până la locul porței cei dintâiu, până la poarta unghiurilor și până la turnul lui Anameil, până la teascurile împăratului”. Descoperirea de către Nahman Avigad, în anii 1970, a Zidului celui Lat, gros de șapte metri și de la sfârșitul secolului al VIII-lea î.Hr., care străbate Cartierul Evreiesc, a arătat că până atunci cetatea se întinsese pe dealul de vest și deci unde a putut fi un astfel de colț."
  bg:
    - "Ъгловата порта била порта на Йерусалим в дните на царете, наречена на ъгъла на стената, при който стояла. Нищо от нея не е намерено и мястото ѝ се извежда от текстовете: стената се простирала на четиристотин лакти, около 200 м, от Ефремовата порта до Ъгловата порта, а Йеремия и Захария я съчетават с кулата Ананеил, която стояла на североизток. Затова повечето учени поставят Ъгловата порта в северозападния ъгъл на тогавашния град, където северната стена завивала на юг покрай западния хълм, приблизително в района на днешната Яфска порта и Цитаделата, макар че границите на града през VIII в. сами по себе си са спорни."
    - "Портата се появява за първи път при едно поражение. Когато Йоас от Израил разбил Амасия от Юда при Ветсамис, той дошъл в Йерусалим и „съсипа стената на Ерусалим от портата Ефрем дори до портата на ъгъла, четиристотин лакти“, взел заложници и съкровищата на Храма и се върнал в Самария. Синът на Амасия Узия съградил „стълпове в Ерусалим върху портата на ъгъла, и върху портата на дола, и върху къта на стената, и укрепи ги“. Разказът на Неемия за стените, които поправил, не назовава Ъгловата порта, може би защото този участък тогава бил извън по-малкия град или носел друго име."
    - "Пророците използват портата, за да измерят бъдещия град. Йеремия обещава: „Ето, идат дни, говори Господ, И градът ще се съгради Господу От стълпа Ананеил до портата на ъгъла“, и нататък през хълма Гареб до Гоат, така че цялата долина на труповете и на пепелта ще бъде света. Захария вижда Йерусалим въздигнат и населен „От портата Вениаминова до местото на първата порта, До портата на ъглите, и от стълпа на Ананеила До жлебовете царски“. Откриването на Широката стена от Нахман Авигад през 70-те години на XX в., дебела седем метра, от края на VIII в. пр.н.е., пресичаща Еврейския квартал, показа, че градът дотогава се бил разпрострял върху западния хълм, а оттам и къде може да е бил такъв ъгъл."
