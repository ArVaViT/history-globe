# Overview article (ADR 0007). Mainstream facts only; the site depends on where Sinai is placed, and no candidate is chosen.
id: kibroth-hattaavah
place: ae7836a
title:
  en: "Kibroth-hattaavah"
  ru: "Киброт-Гаттаава"
  uk: "Кіброт-Гаттаава"
  es: "Kibrot-hataava"
  pt: "Quibrote-Hataavá"
  de: "Kibrot-Taawa"
  fr: "Kibroth-Hattaava"
body:
  en:
    - "Kibroth-hattaavah, “the graves of lust” or of craving, was Israel's first camp after leaving the wilderness of Sinai, on the way to Hazeroth; it is named for what happened there, not for any town. Where it lay depends on where Mount Sinai is placed. If Sinai is Jebel Musa, the traditional mountain, Kibroth-hattaavah has been sought at Erweis el-Ebeirig, a rise covered with ancient stone enclosures and grave-heaps some 40 km to the north-east on the road to Ain Khadra (Hazeroth), as E. H. Palmer proposed in 1871, though the enclosures have since been dated to the Early Bronze Age; with a Sinai in the north of the peninsula the camp is sought far to the north-west. None of this can be confirmed; the place may have been a camp in open desert that was never built on."
    - "Numbers tells that “the mixt multitude” among the people “fell a lusting”, and Israel wept, “Who shall give us flesh to eat?”, remembering the fish and cucumbers of Egypt. Then “a wind from the LORD... brought quails from the sea” and heaped them round the camp, and the people gathered them for two days and a night; “while the flesh was yet between their teeth, ere it was chewed, the wrath of the LORD was kindled against the people, and the LORD smote the people with a very great plague. And he called the name of that place Kibroth-hattaavah: because there they buried the people that lusted.” Deuteronomy lists it with Taberah and Massah among the places where Israel “provoked the LORD to wrath”, and Psalm 78 retells it: “while their meat was yet in their mouths, the wrath of God came upon them”."
    - "Quails still cross Sinai in their spring and autumn migrations and, exhausted after the sea, are netted on its coasts in great numbers; Josephus already explained the quails of the earlier camp in the wilderness of Sin so. The traditional candidates for this stretch of the wanderings lie in Egypt's South Sinai governorate, in the granite mountains between St Catherine's monastery and the Gulf of Aqaba."
  ru:
    - "Киброт-Гаттаава, «гробы прихоти», — первый стан Израиля после выхода из пустыни Синайской, на пути в Асироф; имя дано по случившемуся там, а не по какому-то городу. Где он лежал, зависит от того, где искать гору Синай. Если Синай — Джебель-Муса, традиционная гора, Киброт-Гаттааву искали в Эрвейс-эль-Эбейриге, на возвышенности с древними каменными оградами и могильными грудами примерно в 40 км к северо-востоку по дороге к Айн-Хадре (Асирофу), как предложил Э. Г. Палмер в 1871 году, хотя позже эти ограды датировали ранним бронзовым веком; при Синае на севере полуострова стан ищут далеко к северо-западу. Подтвердить ничего из этого нельзя; возможно, то был стан в открытой пустыне, где никогда не строили."
    - "Книга Чисел рассказывает, что «пришельцы между ними стали обнаруживать прихоти», и Израиль плакал: «кто накормит нас мясом?», вспоминая рыбу и огурцы Египта. Затем «поднялся ветер от Господа, и принес от моря перепелов» и набросал их вокруг стана, и народ собирал их два дня и ночь; «Мясо еще было в зубах их и не было еще съедено, как гнев Господень возгорелся на народ, и поразил Господь народ весьма великою язвою. И нарекли имя месту сему: Киброт-Гаттаава, ибо там похоронили прихотливый народ». Второзаконие числит его с Таверой и Массой среди мест, где Израиль раздражал Господа, а псалом пересказывает: «еще пища была в устах их, гнев Божий пришел на них»."
    - "Перепела и теперь пересекают Синай в весенний и осенний перелёт и, обессиленные после моря, во множестве попадают в сети на его берегах; так объяснял перепелов прежнего стана, в пустыне Син, уже Иосиф Флавий. Традиционные места для этого отрезка странствий лежат в египетской провинции Южный Синай, в гранитных горах между монастырём Святой Екатерины и заливом Акаба."
  uk:
    - "Кіброт-Гаттаава, «могили жадання» або пожадливості, був першим табором Ізраїлю після виходу з Синайської пустелі, на шляху до Хацерота; він названий за те, що там трапилося, а не за якесь місто. Де він лежав, залежить від того, де розміщують гору Синай. Якщо Синай — це Джебель-Муса, традиційна гора, то Кіброт-Гаттааву шукали в Ервейс-ель-Ебейрігу, на підвищенні, вкритому давніми кам’яними огорожами й купами могил, приблизно за 40 км на північний схід при дорозі до Айн-Хадри (Хацерот), як запропонував Е. Г. Палмер 1871 р., хоча відтоді огорожі датовано раннім бронзовим віком; якщо ж Синай на півночі півострова, табір шукають далеко на північному заході. Нічого з цього не можна підтвердити; це місце могло бути табором у відкритій пустелі, де ніколи нічого не будували."
    - "Книга Чисел розповідає, що «мішаний народ» серед людей «почав... придумувати забаганки», а Ізраїль плакав: «Хто знов, мовляли, годувати ме нас мясивом?», згадуючи рибу й огірки Єгипту. Тоді «повіяло вітром від Господа, і нанесло перепелиць від моря» і накидало їх навколо табору, а люди збирали їх два дні й одну ніч; «Ще ж було мясиво між зубами їх, ще не зʼїли його, а гнїв Господень запалав на людей, і вдарив Господь їх тяжким помором». І «назвали врочище те Киброт-Гаттаава; бо там поховано людей, що були ласі». Книга Повторення Закону зараховує його разом з Таверою й Массою до місць, де Ізраїль «розгнївили ви Господа», а Псалом 78 переказує це: «ще була страва їх в губах їх, … піднявся гнїв Бога на них»."
    - "Перепілки й досі перетинають Синай під час весняних і осінніх перельотів і, виснажені після моря, ловляться на його узбережжях сітками у великій кількості; Йосиф Флавій уже так пояснював перепілок ранішого табору в Синській пустелі. Традиційні кандидати для цього відтинку блукань лежать у єгипетській мухафазі Південний Синай, у гранітних горах між монастирем святої Катерини й Акабською затокою."
  es:
    - "Kibrot-hataava, «las tumbas de la codicia» o del deseo, fue el primer campamento de Israel después de dejar el desierto del Sinaí, camino de Haserot; recibe su nombre de lo que allí ocurrió, no de ninguna ciudad. Su ubicación depende de dónde se sitúe el monte Sinaí. Si el Sinaí es el Yebel Musa, la montaña tradicional, Kibrot-hataava se ha buscado en Erweis el-Ebeirig, una elevación cubierta de antiguos recintos de piedra y túmulos funerarios a unos 40 km al nordeste, en el camino de Ain Khadra (Haserot), como propuso E. H. Palmer en 1871, aunque desde entonces los recintos se han fechado en la Edad del Bronce Antiguo; con un Sinaí en el norte de la península, el campamento se busca muy al noroeste. Nada de esto puede confirmarse; el lugar pudo ser un campamento en pleno desierto en el que nunca se construyó."
    - "Números cuenta que «el vulgo que había en medio» del pueblo «tuvo un vivo deseo», e Israel lloró: «¡Quién nos diera á comer carne!», recordando los pescados y los pepinos de Egipto. Entonces «salió un viento de Jehová, y trajo codornices de la mar» y las dejó amontonadas en torno al campamento, y el pueblo las recogió durante dos días y una noche; «Aun estaba la carne entre los dientes de ellos, antes que fuese mascada, cuando el furor de Jehová se encendió en el pueblo, é hirió Jehová al pueblo con una muy grande plaga. Y llamó el nombre de aquel lugar Kibroth-hattaavah, por cuanto allí sepultaron al pueblo codicioso». Deuteronomio la enumera con Tabera y Masá entre los lugares donde Israel «enojasteis á Jehová», y el Salmo 78 lo vuelve a contar: «aun estaba su vianda en su boca, cuando vino sobre ellos el furor de Dios»."
    - "Las codornices todavía cruzan el Sinaí en sus migraciones de primavera y otoño y, agotadas tras atravesar el mar, son capturadas con redes en sus costas en grandes cantidades; Josefo ya explicó así las codornices del campamento anterior, en el desierto de Sin. Los candidatos tradicionales para este tramo de las peregrinaciones se hallan en la gobernación egipcia del Sinaí Meridional, en las montañas de granito entre el monasterio de Santa Catalina y el golfo de Aqaba."
  pt:
    - "Quibrote-Hataavá, “as sepulturas da cobiça”, foi o primeiro acampamento de Israel depois de deixar o deserto do Sinai, a caminho de Hazerote; recebeu o nome do que ali aconteceu, e não de alguma cidade. Onde ficava depende de onde se situa o monte Sinai. Se o Sinai é o Jebel Musa, a montanha tradicional, Quibrote-Hataavá foi procurada em Erweis el-Ebeirig, uma elevação coberta de antigos recintos de pedra e montes de sepulturas a uns 40 km a nordeste, na estrada de Ain Khadra (Hazerote), como propôs E. H. Palmer em 1871, embora os recintos tenham sido datados da Idade do Bronze Antigo; com um Sinai no norte da península, o acampamento é procurado muito a noroeste. Nada disso pode ser confirmado; o lugar pode ter sido um acampamento em pleno deserto, nunca edificado."
    - "Números conta que “a multidão mista” entre o povo “teve um forte desejo”, e Israel chorou: “Quem nos dará carne para comer?”, lembrando os peixes e os pepinos do Egito. Então “um vento do SENHOR saiu e trouxe codornizes do mar” e as deixou ao redor do acampamento, e o povo as recolheu por dois dias e uma noite; “enquanto a carne ainda estava entre os seus dentes, antes de ser mastigada, a ira do SENHOR se acendeu contra o povo, e o SENHOR feriu o povo com uma praga muito grande. O nome daquele lugar foi chamado Quibrote-Hataavá, porque ali enterraram o povo que cobiçou.” Deuteronômio a lista com Taberá e Massá entre os lugares onde Israel “provocou a ira do SENHOR”, e o Salmo 78 a reconta: “A comida ainda estava em suas bocas, quando a ira de Deus subiu contra eles”."
    - "As codornizes ainda cruzam o Sinai em suas migrações de primavera e outono e, exaustas depois do mar, são capturadas em redes em grande número em suas costas; Josefo já explicava assim as codornizes do acampamento anterior, no deserto de Sim. Os candidatos tradicionais para este trecho das peregrinações situam-se na província egípcia do Sinai do Sul, nas montanhas de granito entre o mosteiro de Santa Catarina e o golfo de Aqaba."
  de:
    - "Kibrot-Taawa, „die Gräber der Gier“ oder der Lust, war das erste Lager Israels nach dem Aufbruch aus der Wüste Sinai, auf dem Weg nach Hazerot; es ist nach dem benannt, was dort geschah, nicht nach einer Stadt. Wo es lag, hängt davon ab, wo man den Sinai ansetzt. Ist der Sinai der Jebel Musa, der überlieferte Berg, so suchte man Kibrot-Taawa bei Erweis el-Ebeirig, einer Anhöhe voller antiker Steinumfriedungen und Grabhaufen, etwa 40 km nordöstlich an der Straße nach Ain Khadra (Hazerot), wie E. H. Palmer 1871 vorschlug, obwohl die Umfriedungen inzwischen in die Frühbronzezeit datiert werden; bei einem Sinai im Norden der Halbinsel sucht man das Lager weit im Nordwesten. Nichts davon lässt sich bestätigen; der Ort kann ein Lager in offener Wüste gewesen sein, das nie bebaut wurde."
    - "Nach 4. Mose war das „Pöbelvolk“ „lüstern geworden“, und Israel weinte: „Wer will uns Fleisch zu essen geben?“, im Gedenken an Fische und Gurken Ägyptens. Da „fuhr aus der Wind von dem HERRN und ließ Wachteln kommen vom Meer“, und das Volk sammelte sie zwei Tage und eine Nacht; „Da aber das Fleisch noch unter ihren Zähnen war und ehe es aufgezehrt war, da ergrimmte der Zorn des HERRN unter dem Volk, und schlug sie mit einer sehr großen Plage. Daher heißt diese Stätte Lustgräber, darum daß man daselbst begrub das lüsterne Volk.“ 5. Mose nennt ihn mit Tabera und Massa: „So erzürntet ihr den HERRN auch zu Thabeera und zu Massa und bei den Lustgräbern“; Psalm 78: „noch davon aßen, da kam der Zorn Gottes über sie“."
    - "Wachteln überqueren den Sinai noch heute auf dem Frühjahrs- und Herbstzug und werden, vom Meer erschöpft, an seinen Küsten in großer Zahl mit Netzen gefangen; schon Josephus erklärte so die Wachteln des früheren Lagers in der Wüste Sin. Die überlieferten Kandidaten für diesen Abschnitt der Wanderung liegen im ägyptischen Gouvernement Südsinai, in den Granitbergen zwischen dem Katharinenkloster und dem Golf von Akaba."
  fr:
    - "Kibroth-Hattaava, « les tombeaux de la convoitise » ou du désir, fut le premier campement d’Israël après avoir quitté le désert du Sinaï, sur la route de Hatséroth ; il est nommé d’après ce qui s’y passa, non d’après une ville. Son emplacement dépend de celui où l’on place le mont Sinaï. Si le Sinaï est le djebel Moussa, la montagne traditionnelle, Kibroth-Hattaava a été cherché à Erweis el-Ebeirig, élévation couverte d’anciens enclos de pierre et de tas de tombes, à quelque 40 km au nord-est, sur la route d’Aïn Khadra (Hatséroth), comme l’a proposé E. H. Palmer en 1871, bien que les enclos aient été datés depuis du Bronze ancien ; avec un Sinaï dans le nord de la péninsule, le campement se cherche loin au nord-ouest. Rien de tout cela ne peut être confirmé ; le lieu a pu être un campement en plein désert où l’on n’a jamais bâti."
    - "Selon les Nombres, « le ramassis de gens » du peuple « fut saisi de convoitise », et Israël pleura : « Qui nous donnera de la viande à manger ? », se souvenant des poissons et des concombres d’Égypte. Alors « l’Éternel fit souffler de la mer un vent, qui amena des cailles » et les répandit autour du camp, et le peuple les ramassa deux jours et une nuit ; « comme la chair était encore entre leurs dents sans être mâchée, la colère de l’Éternel s’enflamma contre le peuple, et l’Éternel frappa le peuple d’une très grande plaie. On donna à ce lieu le nom de Kibroth-Hattaava, parce qu’on y enterra le peuple que la convoitise avait saisi. » Le Deutéronome le range avec Tabeéra et Massa parmi les lieux où « vous excitâtes la colère de l’Éternel », et le Psaume 78 le reprend : « ils avaient encore leur nourriture dans la bouche, lorsque la colère de Dieu s’éleva contre eux »."
    - "Les cailles traversent encore le Sinaï lors de leurs migrations de printemps et d’automne et, épuisées après la mer, sont prises au filet sur ses côtes en grand nombre ; Flavius Josèphe expliquait déjà ainsi les cailles du campement précédent, dans le désert de Sin. Les candidats traditionnels pour ce tronçon de l’errance se trouvent dans le gouvernorat du Sud-Sinaï, en Égypte, dans les montagnes de granit entre le monastère Sainte-Catherine et le golfe d’Aqaba."
