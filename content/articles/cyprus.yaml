# Overview article (ADR 0007). Mainstream facts only; Alashiya is given as the usual identification of Bronze Age Cyprus; Assyrian dates are approximate.
id: cyprus
place: a2e7601
title:
  en: "Cyprus"
  ru: "Кипр"
  uk: "Кіпр"
  es: "Chipre"
  pt: "Chipre"
  de: "Zypern"
  fr: "Chypre"
  it: "Cipro"
  pl: "Cypr"
  nl: "Cyprus"
  cs: "Kypr"
  sv: "Cypern"
body:
  en:
    - "Cyprus, the third largest island of the Mediterranean after Sicily and Sardinia, lies about 75 km south of Asia Minor and about 100 km west of the Syrian coast. Its wealth was copper, mined in the foothills of the Troodos mountains; Pliny the Elder writes that copper was first discovered on Cyprus. In the Late Bronze Age the island is usually identified with Alashiya: in the Amarna letters of the fourteenth century BC its king writes to the pharaoh as a brother, mostly about copper, and analysis of the clay of these tablets points to southern Cyprus."
    - 'In Genesis, Kittim is one of the sons of Javan. Josephus explains that Kittim held the island now called Cyprus, where the city of Citium, the Phoenician Kition at modern Larnaca, still kept the name, and that the Hebrews came to call all islands and most sea coasts Kittim. In Isaiah the fall of Tyre is made known "from the land of Chittim", and in Ezekiel the ship of Tyre has benches of ivory "brought out of the isles of Chittim". A stele of the Assyrian king Sargon II found at Kition records gifts from seven kings of Ya'', a district of Yadnana, as the Assyrians called Cyprus, and about 673 BC Esarhaddon listed ten kings of the island.'
    - 'Philo counts Cyprus among the islands full of Jewish settlements. Barnabas was "a Levite, and of the country of Cyprus". After the persecution that followed the death of Stephen, believers were scattered as far as Cyprus, and at Antioch men of Cyprus and Cyrene preached the Lord Jesus to Greeks as well as to Jews. Barnabas and Saul sailed from Seleucia to Cyprus and crossed it from Salamis to Paphos, where the proconsul Sergius Paulus believed. Later Barnabas took Mark and sailed to Cyprus again; Paul lodged with Mnason of Cyprus, "an old disciple", and on the voyage to Rome his ship "sailed under Cyprus, because the winds were contrary".'
    - "Rome annexed Cyprus in 58 BC, when Cato was sent to take over the kingdom of its Ptolemaic king and his treasure. In 22 BC Augustus handed the island to the senate, and from then on it was governed by proconsuls. In the Jewish revolt of 116–117 the Jews of Cyprus rose under Artemion, and Cassius Dio writes that afterwards no Jew might set foot on the island. In the fourth century, after earthquakes, Salamis was rebuilt as Constantia and became the capital. In 431 the Council of Ephesus upheld the right of the bishops of Cyprus to ordain their own bishops against the claims of the bishop of Antioch."
  ru:
    - "Кипр, третий по величине остров Средиземного моря после Сицилии и Сардинии, лежит примерно в 75 км к югу от Малой Азии и примерно в 100 км к западу от сирийского берега. Его богатством была медь, которую добывали в предгорьях Троодоса; Плиний Старший пишет, что медь впервые была открыта на Кипре. В позднем бронзовом веке остров обычно отождествляют с Аласией: в амарнских письмах XIV века до н. э. её царь пишет фараону как брату, больше всего о меди, а анализ глины этих табличек указывает на южный Кипр."
    - "В книге Бытия Киттим — один из сынов Иавана. Иосиф Флавий объясняет, что Киттим владел островом, который теперь называется Кипром, где город Китий, финикийский Китион на месте нынешней Ларнаки, сохранил это имя, и что евреи стали называть Киттимом все острова и большую часть морских побережий. У Исаии о падении Тира возвещено «из земли Киттийской», а у Иезекииля скамьи тирского корабля сделаны «с оправою из слоновой кости с островов Киттимских». Стела ассирийского царя Саргона II, найденная в Китионе, сообщает о дарах семи царей Йа, области страны Яднана, как ассирийцы называли Кипр, а около 673 г. до н. э. Асардан перечислил десять царей острова."
    - "Филон называет Кипр среди островов, полных иудейских поселений. Варнава был «левит, родом Кипрянин». После гонения, начавшегося со смерти Стефана, рассеявшиеся верующие дошли до Кипра, и в Антиохии Кипряне и Киринейцы благовествовали Господа Иисуса не только Иудеям, но и Еллинам. Варнава и Савл отплыли из Селевкии на Кипр и прошли его от Саламина до Пафа, где уверовал проконсул Сергий Павел. Позже Варнава, взяв Марка, снова отплыл на Кипр; Павел остановился у давнего ученика Мнасона Кипрянина, а на пути в Рим его корабль из-за противных ветров шёл у Кипра."
    - "Рим присоединил Кипр в 58 г. до н. э., когда Катона послали принять царство местного царя из династии Птолемеев вместе с его сокровищами. В 22 г. до н. э. Август передал остров сенату, и с тех пор им управляли проконсулы. Во время иудейского восстания 116–117 гг. иудеи Кипра поднялись во главе с Артемионом, и Дион Кассий пишет, что после этого ни одному иудею не позволялось ступить на остров. В IV веке, после землетрясений, Саламин был отстроен под именем Констанция и стал столицей. В 431 г. Ефесский собор подтвердил право епископов Кипра самим поставлять своих епископов вопреки притязаниям епископа Антиохийского."
  uk:
    - "Кіпр, третій за величиною острів Середземномор'я після Сицилії та Сардинії, лежить приблизно за 75 км на південь від Малої Азії та за 100 км на захід від сирійського узбережжя. Його багатством була мідь, що її добували в передгір'ях гір Троодос; Пліній Старший пише, що мідь уперше відкрили на Кіпрі. В пізню бронзову добу острів зазвичай ототожнюють з Алашією: в амарнських листах XIV ст. до н. е. її цар пише фараонові як братові, здебільшого про мідь, а аналіз глини цих табличок указує на південний Кіпр."
    - "У Книзі Буття Кіттім — один із синів Явана. Йосиф Флавій пояснює, що Кіттім посів острів, нині званий Кіпром, де місто Кітій, фінікійський Кітіон у сучасній Ларнаці, ще зберігало назву, і що євреї почали називати Кіттімом усі острови та більшість морських узбереж. В Ісаї падіння Тиру оголошується «з Хитимської країни», а в Єзекіїля про лави Тиру сказано: «з бучини Киттимських островів поробили лави твої, обклавши їх кістю слоновою». Стела ассирійського царя Саргона II, знайдена в Кітіоні, фіксує дари від семи царів Я', області Яднани, як ассирійці називали Кіпр, а близько 673 р. до н. е. Асархаддон перелічив десять царів острова."
    - "Філон зараховує Кіпр до островів, повних юдейських поселень. Варнава був «левит, родом Кипрянин». Після гоніння, що настало по смерті Стефана, віруючі розсіялися аж до Кіпру, а в Антіохії «люде з Кипру і Киринеї» проповідували Господа Ісуса як елліністам, так і юдеям. Варнава й Савл відпливли з Селевкії на Кіпр і перетнули його від Саламіна до Пафа, де проконсул Сергій Павло увірував. Згодом Варнава взяв Марка й знову поплив на Кіпр; Павло зупинився в Мнасона з Кіпру, «старого ученика», а під час плавання до Рима, як сказано, «поплили до Кипра; бо вітри були противні»."
    - "Рим анексував Кіпр у 58 р. до н. е., коли Катона було послано прийняти царство птолемеївського царя та його скарб. У 22 р. до н. е. Август передав острів сенатові, і відтоді ним управляли проконсули. Під час юдейського повстання 116–117 рр. юдеї Кіпру повстали під проводом Артеміона, і Кассій Діон пише, що потім жоден юдей не міг ступити на острів. У IV ст. після землетрусів Саламін було відбудовано як Констанцію, і вона стала столицею. У 431 р. Ефеський собор підтвердив право єпископів Кіпру висвячувати власних єпископів проти претензій єпископа Антіохії."
  es:
    - "Chipre, la tercera isla más grande del Mediterráneo después de Sicilia y Cerdeña, se encuentra a unos 75 km al sur de Asia Menor y a unos 100 km al oeste de la costa siria. Su riqueza era el cobre, extraído en las estribaciones de los montes Troodos; Plinio el Viejo escribe que el cobre se descubrió por primera vez en Chipre. En la Edad del Bronce Tardío la isla suele identificarse con Alashiya: en las cartas de Amarna del siglo XIV a. C. su rey escribe al faraón como a un hermano, sobre todo acerca del cobre, y el análisis de la arcilla de estas tablillas apunta al sur de Chipre."
    - "En el Génesis, Quitim es uno de los hijos de Javán. Josefo explica que Quitim ocupó la isla llamada hoy Chipre, donde la ciudad de Citio, la Kition fenicia de la actual Larnaca, todavía conservaba el nombre, y que los hebreos llegaron a llamar Quitim a todas las islas y a la mayoría de las costas. En Isaías la caída de Tiro se da a conocer «de la tierra de Chîttim», y en Ezequiel la nave de Tiro tiene bancos de marfil «de las islas de Chittim». Una estela del rey asirio Sargón II hallada en Kition registra regalos de siete reyes de Ya', un distrito de Yadnana, como los asirios llamaban a Chipre, y hacia el 673 a. C. Esar-hadón enumeró diez reyes de la isla."
    - "Filón cuenta Chipre entre las islas llenas de asentamientos judíos. Bernabé era «Levita, natural de Cipro». Tras la persecución que siguió a la muerte de Esteban, los creyentes se dispersaron hasta Chipre, y en Antioquía hombres de Chipre y de Cirene predicaron al Señor Jesús tanto a los griegos como a los judíos. Bernabé y Saulo navegaron de Seleucia a Chipre y la cruzaron de Salamina a Pafos, donde creyó el procónsul Sergio Paulo. Más tarde Bernabé tomó a Marcos y navegó de nuevo a Chipre; Pablo se alojó con Mnasón de Chipre, «discípulo antiguo», y en el viaje a Roma su nave navegó bajo Chipre, «porque los vientos eran contrarios»."
    - "Roma anexionó Chipre en el 58 a. C., cuando Catón fue enviado a hacerse cargo del reino de su rey ptolemaico y de su tesoro. En el 22 a. C. Augusto entregó la isla al senado, y desde entonces fue gobernada por procónsules. En la revuelta judía de 116–117 los judíos de Chipre se alzaron bajo Artemión, y Dion Casio escribe que después ningún judío pudo pisar la isla. En el siglo IV, tras los terremotos, Salamina fue reconstruida como Constancia y se convirtió en capital. En el 431 el Concilio de Éfeso confirmó el derecho de los obispos de Chipre a ordenar a sus propios obispos frente a las pretensiones del obispo de Antioquía."
  pt:
    - "Chipre, a terceira maior ilha do Mediterrâneo depois da Sicília e da Sardenha, fica a cerca de 75 km ao sul da Ásia Menor e a cerca de 100 km a oeste da costa síria. Sua riqueza era o cobre, extraído nos contrafortes das montanhas Troodos; Plínio, o Velho, escreve que o cobre foi descoberto primeiro em Chipre. Na Idade do Bronze Tardio, a ilha é geralmente identificada com Alásia: nas cartas de Amarna do século XIV a.C., seu rei escreve ao faraó como a um irmão, sobretudo a respeito de cobre, e a análise da argila dessas tabuinhas aponta para o sul de Chipre."
    - "No Gênesis, Quitim é um dos filhos de Javã. Josefo explica que Quitim ocupou a ilha hoje chamada Chipre, onde a cidade de Cítio, a Kition fenícia, na moderna Lárnaca, ainda guardava o nome, e que os hebreus passaram a chamar Quitim todas as ilhas e a maior parte das costas marítimas. Em Isaías, a queda de Tiro é anunciada “Da terra de Quitim”, e em Ezequiel o navio de Tiro tem bancos “de marfim incrustado em madeira de cipreste das ilhas de Quitim”. Uma estela do rei assírio Sargão II achada em Kition registra presentes de sete reis de Ya', distrito de Yadnana, como os assírios chamavam Chipre, e por volta de 673 a.C. Esar-Hadom listou dez reis da ilha."
    - "Fílon conta Chipre entre as ilhas cheias de comunidades judaicas. Barnabé era “um levita, natural de Chipre”. Depois da perseguição que se seguiu à morte de Estêvão, crentes se dispersaram até Chipre, e em Antioquia homens de Chipre e de Cirene pregaram o Senhor Jesus aos gregos e também aos judeus. Barnabé e Saulo navegaram de Selêucia a Chipre e a atravessaram de Salamina a Pafos, onde o procônsul Sérgio Paulo creu. Mais tarde Barnabé levou Marcos e navegou de novo a Chipre; Paulo se hospedou com Mnasom de Chipre, “um dos primeiros discípulos”, e na viagem a Roma o navio navegou “sob o abrigo de Chipre, porque os ventos eram contrários”."
    - "Roma anexou Chipre em 58 a.C., quando Catão foi enviado para tomar posse do reino de seu rei ptolomaico e de seu tesouro. Em 22 a.C., Augusto entregou a ilha ao senado, e desde então ela foi governada por procônsules. Na revolta judaica de 116–117, os judeus de Chipre se levantaram sob Artemião, e Díon Cássio escreve que depois nenhum judeu pôde pôr os pés na ilha. No século IV, após terremotos, Salamina foi reconstruída como Constância e tornou-se a capital. Em 431, o Concílio de Éfeso confirmou o direito dos bispos de Chipre de ordenar os seus próprios bispos contra as pretensões do bispo de Antioquia."
  de:
    - "Zypern, nach Sizilien und Sardinien die drittgrößte Insel des Mittelmeers, liegt etwa 75 km südlich von Kleinasien und etwa 100 km westlich der syrischen Küste. Sein Reichtum war das Kupfer, das in den Vorbergen des Troodos-Gebirges abgebaut wurde; Plinius der Ältere schreibt, Kupfer sei zuerst auf Zypern entdeckt worden. In der Späten Bronzezeit wird die Insel gewöhnlich mit Alaschija gleichgesetzt: In den Amarnabriefen des 14. Jahrhunderts v. Chr. schreibt ihr König dem Pharao als Bruder, meist über Kupfer, und die Analyse des Tons dieser Tafeln weist auf Südzypern."
    - "In der Genesis ist Kittim einer der Söhne Jawans. Josephus erklärt, Kittim habe die Insel besessen, die jetzt Zypern heißt, wo die Stadt Kition, das phönizische Kition beim heutigen Larnaka, den Namen noch bewahrte, und die Hebräer hätten alle Inseln und die meisten Meeresküsten Kittim zu nennen begonnen. Bei Jesaja wird der Fall von Tyrus „aus dem Lande Chittim“ kundgetan, und bei Hesekiel hat das Schiff von Tyrus Bänke von Elfenbein „aus den Inseln der Chittiter“. Eine in Kition gefundene Stele des assyrischen Königs Sargon II. verzeichnet Gaben von sieben Königen von Ja’, einem Bezirk von Jadnana, wie die Assyrer Zypern nannten, und um 673 v. Chr. führte Asarhaddon zehn Könige der Insel auf."
    - "Philo zählt Zypern zu den Inseln voller jüdischer Siedlungen. Barnabas war „von Geschlecht ein Levit aus Zypern“. Nach der Verfolgung, die auf den Tod des Stephanus folgte, wurden die Gläubigen bis nach Zypern zerstreut, und in Antiochia predigten Männer von Zypern und Kyrene den Herrn Jesus auch Griechen. Barnabas und Saulus segelten von Seleukia nach Zypern und durchquerten es von Salamis nach Paphos, wo der Prokonsul Sergius Paulus glaubte. Später nahm Barnabas Markus und segelte erneut nach Zypern; Paulus wohnte bei Mnason „aus Zypern, der ein alter Jünger war“, und auf der Reise nach Rom heißt es: „und schifften unter Zypern hin, darum daß uns die Winde entgegen waren“."
    - "Rom annektierte Zypern 58 v. Chr., als Cato gesandt wurde, das Königreich des ptolemäischen Königs und dessen Schatz zu übernehmen. Im Jahr 22 v. Chr. übergab Augustus die Insel dem Senat, und von da an wurde sie von Prokonsuln verwaltet. Im jüdischen Aufstand von 116–117 erhoben sich die Juden Zyperns unter Artemion, und Cassius Dio schreibt, danach habe kein Jude die Insel mehr betreten dürfen. Im 4. Jahrhundert wurde Salamis nach Erdbeben als Konstantia wiederaufgebaut und wurde Hauptstadt. Im Jahr 431 bestätigte das Konzil von Ephesus das Recht der Bischöfe Zyperns, ihre eigenen Bischöfe zu weihen, gegen die Ansprüche des Bischofs von Antiochia."
  fr:
    - "Chypre, troisième île de la Méditerranée par la taille après la Sicile et la Sardaigne, se trouve à environ 75 km au sud de l’Asie Mineure et à environ 100 km à l’ouest de la côte syrienne. Sa richesse était le cuivre, extrait dans les contreforts des monts Troodos ; Pline l’Ancien écrit que le cuivre fut découvert d’abord à Chypre. À l’âge du Bronze récent, l’île est généralement identifiée à Alashiya : dans les lettres d’Amarna du XIVe siècle av. J.-C., son roi écrit au pharaon comme à un frère, surtout au sujet du cuivre, et l’analyse de l’argile de ces tablettes désigne le sud de Chypre."
    - "Dans la Genèse, Kittim est l’un des fils de Javan. Josèphe explique que Kittim posséda l’île aujourd’hui appelée Chypre, où la ville de Citium, la Kition phénicienne de l’actuelle Larnaca, gardait encore le nom, et que les Hébreux en vinrent à appeler Kittim toutes les îles et la plupart des côtes maritimes. Chez Ésaïe, la chute de Tyr est annoncée « du pays de Kittim », et chez Ézéchiel le navire de Tyr a des bancs d’ivoire « apporté des îles de Kittim ». Une stèle du roi assyrien Sargon II découverte à Kition consigne les présents de sept rois de Ya’, district de Yadnana, nom que les Assyriens donnaient à Chypre, et vers 673 av. J.-C. Esar-Haddon dénombra dix rois de l’île."
    - "Philon compte Chypre parmi les îles pleines de colonies juives. Barnabas était « Lévite, originaire de Chypre ». Après la persécution qui suivit la mort d’Étienne, des croyants se dispersèrent jusqu’à Chypre, et à Antioche des hommes de Chypre et de Cyrène annoncèrent le Seigneur Jésus aux Grecs aussi bien qu’aux Juifs. Barnabas et Saul firent voile de Séleucie vers Chypre et la traversèrent de Salamine à Paphos, où le proconsul Sergius Paulus crut. Plus tard, Barnabas prit Marc et navigua de nouveau vers Chypre ; Paul logea chez Mnason de Chypre, « ancien disciple », et lors du voyage vers Rome, le récit dit : « nous longeâmes l’île de Chypre, parce que les vents étaient contraires »."
    - "Rome annexa Chypre en 58 av. J.-C., quand Caton fut envoyé prendre possession du royaume de son roi ptolémaïque et de son trésor. En 22 av. J.-C., Auguste remit l’île au sénat, et elle fut dès lors gouvernée par des proconsuls. Lors de la révolte juive de 116–117, les Juifs de Chypre se soulevèrent sous Artémion, et Dion Cassius écrit qu’ensuite aucun Juif ne put mettre le pied dans l’île. Au IVe siècle, après des séismes, Salamine fut reconstruite sous le nom de Constantia et devint la capitale. En 431, le concile d’Éphèse confirma le droit des évêques de Chypre d’ordonner eux-mêmes leurs évêques contre les prétentions de l’évêque d’Antioche."
  it:
    - "Cipro, la terza isola del Mediterraneo per estensione dopo la Sicilia e la Sardegna, si trova a circa 75 km a sud dell’Asia Minore e a circa 100 km a ovest della costa siriana. La sua ricchezza era il rame, estratto alle pendici dei monti Troodos; Plinio il Vecchio scrive che il rame fu scoperto per la prima volta a Cipro. Nella tarda età del Bronzo l’isola si identifica di solito con Alashiya: nelle lettere di Amarna del XIV secolo a.C. il suo re scrive al faraone come a un fratello, soprattutto di rame, e l’analisi dell’argilla di queste tavolette indica Cipro meridionale."
    - "Nella Genesi Kittim è uno dei figli di Iavan. Giuseppe Flavio spiega che Kittim occupò l’isola ora detta Cipro, dove la città di Cizio, la fenicia Kition presso l’odierna Larnaca, ne serbava ancora il nome, e che gli Ebrei finirono per chiamare Kittim tutte le isole e la maggior parte delle coste. In Isaia la caduta di Tiro è resa nota «dalla terra di Kittim», e in Ezechiele la nave di Tiro ha ponti d’avorio «portato dalle isole di Kittim». Una stele del re assiro Sargon II trovata a Kition registra doni di sette re di Ya’, un distretto di Yadnana, come gli Assiri chiamavano Cipro, e intorno al 673 a.C. Assaraddon elencò dieci re dell’isola."
    - "Filone annovera Cipro fra le isole piene di insediamenti ebraici. Barnaba era «levita, cipriota di nascita». Dopo la persecuzione seguita alla morte di Stefano, i credenti si dispersero fino a Cipro, e ad Antiochia uomini di Cipro e di Cirene annunciarono il Signore Gesù ai Greci oltre che ai Giudei. Barnaba e Saulo salparono da Seleucia per Cipro e la attraversarono da Salamina a Pafo, dove il proconsole Sergio Paolo credette. Più tardi Barnaba prese Marco e navigò di nuovo verso Cipro; Paolo alloggiò presso Mnasone di Cipro, «antico discepolo», e nel viaggio verso Roma la sua nave passò «sotto Cipro, perché i venti eran contrari»."
    - "Roma annesse Cipro nel 58 a.C., quando Catone fu mandato a prendere il regno del suo re tolemaico e il suo tesoro. Nel 22 a.C. Augusto affidò l’isola al senato, e da allora fu governata da proconsoli. Nella rivolta ebraica del 116–117 gli Ebrei di Cipro si sollevarono sotto Artemione, e Cassio Dione scrive che in seguito nessun Ebreo poté metter piede sull’isola. Nel IV secolo, dopo i terremoti, Salamina fu ricostruita come Costanza e divenne la capitale. Nel 431 il Concilio di Efeso confermò il diritto dei vescovi di Cipro di ordinare i propri vescovi contro le pretese del vescovo di Antiochia."
  pl:
    - "Cypr, trzecia co do wielkości wyspa Morza Śródziemnego po Sycylii i Sardynii, leży około 75 km na południe od Azji Mniejszej i około 100 km na zachód od wybrzeża Syrii. Jego bogactwem była miedź, wydobywana u podnóża gór Troodos; Pliniusz Starszy pisze, że miedź odkryto po raz pierwszy na Cyprze. W późnej epoce brązu wyspę zwykle utożsamia się z Alaszija: w listach z Amarna z XIV w. p.n.e. jej król pisze do faraona jak brat, głównie o miedzi, a analiza gliny tych tabliczek wskazuje na południowy Cypr."
    - "W Księdze Rodzaju Kittim jest jednym z synów Jawana. Józef Flawiusz wyjaśnia, że Kittim zajęli wyspę zwaną teraz Cyprem, gdzie miasto Citium, fenickie Kition w dzisiejszej Larnace, wciąż zachowywało tę nazwę, i że Hebrajczycy zaczęli nazywać Kittim wszystkie wyspy i większość wybrzeży morskich. U Izajasza upadek Tyru jest ogłoszony „z ziemi Cytym”, a u Ezechiela okręt Tyru ma ławy wyrobione, jak czytamy, „z kości słoniowych i z bukszpanu z wysep Cytymskich”. Stela asyryjskiego króla Sargona II znaleziona w Kition zapisuje dary od siedmiu królów Ya', okręgu Jadnany, jak Asyryjczycy nazywali Cypr, a około 673 r. p.n.e. Asarhaddon wymienił dziesięciu królów wyspy."
    - "Filon zalicza Cypr do wysp pełnych żydowskich osad. Barnaba był „Lewita, z Cypru rodem”. Po prześladowaniu, które nastąpiło po śmierci Szczepana, wierzący rozproszyli się aż na Cypr, a w Antiochii ludzie z Cypru i Cyreny głosili Pana Jezusa Grekom, nie tylko Żydom. Barnaba i Saul odpłynęli z Seleucji na Cypr i przeszli go od Salaminy do Pafos, gdzie prokonsul Sergiusz Paweł uwierzył. Później Barnaba wziął Marka i znów odpłynął na Cypr; Paweł zatrzymał się u Mnazona z Cypru, „starego ucznia”, a w podróży do Rzymu, jak mówi opowieść, „przypłynęliśmy pod Cypr, dlatego że były wiatry przeciwne”."
    - "Rzym zaanektował Cypr w 58 r. p.n.e., gdy Katon został wysłany, by przejąć królestwo ptolemejskiego króla i jego skarb. W 22 r. p.n.e. August oddał wyspę senatowi i odtąd rządzili nią prokonsulowie. W powstaniu żydowskim z lat 116–117 Żydzi cypryjscy powstali pod wodzą Artemiona, a Kasjusz Dion pisze, że potem żaden Żyd nie mógł stanąć na wyspie. W IV w., po trzęsieniach ziemi, Salaminę odbudowano jako Konstancję i stała się stolicą. W 431 r. sobór w Efezie podtrzymał prawo biskupów Cypru do święcenia własnych biskupów wbrew roszczeniom biskupa Antiochii."
  nl:
    - "Cyprus, na Sicilië en Sardinië het derde eiland van de Middellandse Zee, ligt zo'n 75 km ten zuiden van Klein-Azië en zo'n 100 km ten westen van de Syrische kust. Zijn rijkdom was koper, gewonnen in de uitlopers van het Troodosgebergte; Plinius de Oudere schrijft dat koper voor het eerst op Cyprus werd ontdekt. In de Late Bronstijd wordt het eiland gewoonlijk geïdentificeerd met Alashiya: in de Amarnabrieven uit de veertiende eeuw v.Chr. schrijft zijn koning de farao als een broeder, meest over koper, en analyse van de klei van deze tabletten wijst naar zuidelijk Cyprus."
    - "In Genesis is Kittim een van de zonen van Javan. Flavius Josephus legt uit dat Kittim het eiland bezat dat nu Cyprus heet, waar de stad Citium, het Fenicische Kition bij het huidige Larnaca, de naam bewaarde, en dat de Hebreeën alle eilanden en de meeste kusten Kittim gingen noemen. In Jesaja wordt de val van Tyrus bekendgemaakt “uit het land Chittim”, en in Ezechiël heeft het schip van Tyrus banken van ivoor “uit de eilanden der Chittieten”. Een stèle van de Assyrische koning Sargon II, bij Kition gevonden, vermeldt gaven van zeven koningen van Ya', een district van Yadnana, zoals de Assyriërs Cyprus noemden, en omstreeks 673 v.Chr. noemde Esarhaddon tien koningen van het eiland."
    - "Philo rekent Cyprus tot de eilanden vol Joodse nederzettingen. Barnabas was “een Leviet, van geboorte uit Cyprus”. Na de vervolging die op Stefanus' dood volgde, werden gelovigen tot Cyprus verstrooid, en te Antiochië verkondigden mannen uit Cyprus en Cyrene de Heer Jezus ook aan Grieken. Barnabas en Saulus voeren van Seleucië naar Cyprus en trokken van Salamis naar Paffos, waar proconsul Sergius Paulus geloofde. Later nam Barnabas Marcus mee en voer weer naar Cyprus; Paulus logeerde bij Mnason van Cyprus, “een ouden discipel”, en op de reis naar Rome “voeren wij onder Cyprus heen, omdat de winden ons tegen waren”."
    - "Rome lijfde Cyprus in 58 v.Chr. in, toen Cato werd gezonden om het koninkrijk van zijn Ptolemeïsche koning en diens schat over te nemen. In 22 v.Chr. droeg Augustus het eiland over aan de senaat, en sindsdien werd het door proconsuls bestuurd. In de Joodse opstand van 116–117 kwamen de Joden van Cyprus onder Artemion in verzet, en Cassius Dio schrijft dat daarna geen Jood het eiland nog mocht betreden. In de vierde eeuw werd Salamis na aardbevingen herbouwd als Constantia en werd de hoofdstad. In 431 bevestigde het Concilie van Efeze het recht van de bisschoppen van Cyprus om hun eigen bisschoppen te wijden tegenover de aanspraken van de bisschop van Antiochië."
  cs:
    - "Kypr, třetí největší ostrov Středozemního moře po Sicílii a Sardinii, leží asi 75 km jižně od Malé Asie a asi 100 km západně od syrského pobřeží. Jeho bohatstvím byla měď těžená v podhůří pohoří Troodos; Plinius Starší píše, že měď byla poprvé objevena na Kypru. V pozdní době bronzové se ostrov obvykle ztotožňuje s Alašijou: v amarnských dopisech ze 14. století př. n. l. jeho král píše faraónovi jako bratru, většinou o mědi, a rozbor hlíny těchto tabulek ukazuje na jižní Kypr."
    - "V Genesi je Kitim jedním ze synů Javanových. Josephus vysvětluje, že Kitim držel ostrov nyní zvaný Kypr, kde město Citium, fénické Kition v dnešní Larnace, dosud zachovávalo jméno, a že Hebrejci začali nazývat všechny ostrovy a většinu mořských pobřeží Kitim. U Izajáše se pád Týru oznamuje „z země Citim“ a u Ezechiela má týrská loď lavice z kosti slonové přivezené „z ostrovů Citejských“. Stéla asyrského krále Sargona II. nalezená v Kitionu zaznamenává dary od sedmi králů Ja', okresu Jadnany, jak Asyřané nazývali Kypr, a kolem roku 673 př. n. l. vypsal Asarhadón deset králů ostrova."
    - "Filón počítá Kypr mezi ostrovy plné židovských osad. Barnabáš byl „z pokolení Levítského, z Cypru rodem“. Po pronásledování, které následovalo po Štěpánově smrti, se věřící rozptýlili až na Kypr a v Antiochii kázali muži z Kypru a Kyrény Pána Ježíše Řekům stejně jako Židům. Barnabáš a Saul se plavili ze Seleukeie na Kypr a přešli jej od Salamis k Pafu, kde prokonzul Sergius Paulus uvěřil. Později vzal Barnabáš Marka a plavil se na Kypr znovu; Pavel se ubytoval u Mnasóna z Kypru, „starého učedlníka“, a o plavbě do Říma se píše: „plavili jsme se podle Cypru, protože byl vítr odporný nám“."
    - "Řím anektoval Kypr roku 58 př. n. l., když byl Cato vyslán, aby převzal království ptolemaiovského krále a jeho poklad. Roku 22 př. n. l. předal Augustus ostrov senátu a od té doby jej spravovali prokonzulové. Při židovském povstání let 116–117 se kyperští Židé vzbouřili pod Artemionem a Cassius Dio píše, že potom žádný Žid nesměl na ostrov vkročit. Ve 4. století byla po zemětřeseních Salamis přestavěna jako Konstantia a stala se hlavním městem. Roku 431 potvrdil Efezský koncil právo kyperských biskupů svěcit si vlastní biskupy proti nárokům biskupa antiochijského."
  sv:
    - "Cypern, Medelhavets tredje största ö efter Sicilien och Sardinien, ligger omkring 75 km söder om Mindre Asien och omkring 100 km väster om den syriska kusten. Dess rikedom var koppar, som bröts i Troodosbergens förberg; Plinius den äldre skriver att koppar först upptäcktes på Cypern. Under sen bronsålder identifieras ön vanligen med Alashiya: i Amarnabreven från 1300-talet f.Kr. skriver dess kung till farao som till en bror, mest om koppar, och analys av lerorna i dessa tavlor pekar på södra Cypern."
    - "I Första Mosebok är Kittim en av Javans söner. Josefus förklarar att Kittim höll ön som nu kallas Cypern, där staden Citium, feniciska Kition vid nuvarande Larnaka, ännu bevarade namnet, och att hebréerna kom att kalla alla öar och de flesta havskuster Kittim. Hos Jesaja kungörs Tyros fall ”från kittéernas land”, och hos Hesekiel har Tyros skepp däck av elfenben i ädelt trä ”från kittéernas öländer”. En stele av den assyriske kungen Sargon II som hittats i Kition berättar om gåvor från sju kungar i Ya’, ett distrikt i Yadnana, som assyrierna kallade Cypern, och omkring 673 f.Kr. förtecknade Esarhaddon tio kungar på ön."
    - "Filon räknar Cypern bland öarna fulla av judiska bosättningar. Barnabas var ”en levit som var bördig från Cypern”. Efter förföljelsen som följde på Stefanos död spreds de troende ända till Cypern, och i Antiochia förkunnade män från Cypern och Kyrene Herren Jesus för greker såväl som för judar. Barnabas och Saul seglade från Seleukia till Cypern och korsade ön från Salamis till Pafos, där prokonsuln Sergius Paulus kom till tro. Senare tog Barnabas Markus och seglade till Cypern igen; Paulus bodde hos ”Mnason från Cypern, en gammal lärjunge”, och på resan till Rom ”seglade vi under Cypern, eftersom vinden låg emot”."
    - "Rom annekterade Cypern 58 f.Kr., då Cato sändes för att ta över den ptolemaiske kungens rike och skatt. År 22 f.Kr. överlämnade Augustus ön åt senaten, och därefter styrdes den av prokonsuler. I det judiska upproret 116–117 reste sig Cyperns judar under Artemion, och Cassius Dio skriver att ingen jude därefter fick sätta sin fot på ön. På 300-talet återuppbyggdes Salamis efter jordbävningar som Constantia och blev huvudstad. År 431 stadfäste konciliet i Efesos rätten för Cyperns biskopar att viga sina egna biskopar mot anspråk från biskopen i Antiochia."
