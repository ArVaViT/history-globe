# Overview article (ADR 0007). Mainstream facts only; Alashiya is given as the usual identification of Bronze Age Cyprus; Assyrian dates are approximate.
id: cyprus
place: a2e7601
title:
  en: "Cyprus"
  ru: "Кипр"
body:
  en:
    - "Cyprus, the third largest island of the Mediterranean after Sicily and Sardinia, lies about 75 km south of Asia Minor and about 100 km west of the Syrian coast. Its wealth was copper, mined in the foothills of the Troodos mountains; Pliny the Elder writes that copper was first discovered on Cyprus. In the Late Bronze Age the island is usually identified with Alashiya: in the Amarna letters of the fourteenth century BC its king writes to the pharaoh as a brother, mostly about copper, and analysis of the clay of these tablets points to southern Cyprus."
    - 'In Genesis, Kittim is one of the sons of Javan. Josephus explains that Kittim held the island now called Cyprus, where the city of Citium, the Phoenician Kition at modern Larnaca, still kept the name, and that the Hebrews came to call all islands and most sea coasts Kittim. In Isaiah the fall of Tyre is made known "from the land of Chittim", and in Ezekiel the ship of Tyre has benches of ivory "brought out of the isles of Chittim". A stele of the Assyrian king Sargon II found at Kition records gifts from seven kings of Ya'', a district of Yadnana, as the Assyrians called Cyprus, and about 673 BC Esarhaddon listed ten kings of the island.'
    - 'Philo counts Cyprus among the islands full of Jewish settlements. Barnabas was "a Levite, and of the country of Cyprus". After the persecution that followed the death of Stephen, believers were scattered as far as Cyprus, and at Antioch men of Cyprus and Cyrene preached the Lord Jesus to Greeks as well as to Jews. Barnabas and Saul sailed from Seleucia to Cyprus and crossed it from Salamis to Paphos, where the proconsul Sergius Paulus believed. Later Barnabas took Mark and sailed to Cyprus again; Paul lodged with Mnason of Cyprus, "an old disciple", and on the voyage to Rome his ship "sailed under Cyprus, because the winds were contrary".'
    - "Rome annexed Cyprus in 58 BC, when Cato was sent to take over the kingdom of its Ptolemaic king and his treasure. In 22 BC Augustus handed the island to the senate, and from then on it was governed by proconsuls. In the Jewish revolt of 116–117 the Jews of Cyprus rose under Artemion, and Cassius Dio writes that afterwards no Jew might set foot on the island. In the fourth century, after earthquakes, Salamis was rebuilt as Constantia and became the capital. In 431 the Council of Ephesus upheld the right of the bishops of Cyprus to ordain their own bishops against the claims of the bishop of Antioch."
  ru:
    - "Кипр, третий по величине остров Средиземного моря после Сицилии и Сардинии, лежит примерно в 75 км к югу от Малой Азии и примерно в 100 км к западу от сирийского берега. Его богатством была медь, которую добывали в предгорьях Троодоса; Плиний Старший пишет, что медь впервые была открыта на Кипре. В позднем бронзовом веке остров обычно отождествляют с Аласией: в амарнских письмах XIV века до н. э. её царь пишет фараону как брату, больше всего о меди, а анализ глины этих табличек указывает на южный Кипр."
    - "В книге Бытия Киттим — один из сынов Иавана. Иосиф Флавий объясняет, что Киттим владел островом, который теперь называется Кипром, где город Китий, финикийский Китион на месте нынешней Ларнаки, сохранил это имя, и что евреи стали называть Киттимом все острова и большую часть морских побережий. У Исаии о падении Тира возвещено «из земли Киттийской», а у Иезекииля скамьи тирского корабля сделаны «с оправою из слоновой кости с островов Киттимских». Стела ассирийского царя Саргона II, найденная в Китионе, сообщает о дарах семи царей Йа, области страны Яднана, как ассирийцы называли Кипр, а около 673 г. до н. э. Асардан перечислил десять царей острова."
    - "Филон называет Кипр среди островов, полных иудейских поселений. Варнава был «левит, родом Кипрянин». После гонения, начавшегося со смерти Стефана, рассеявшиеся верующие дошли до Кипра, и в Антиохии Кипряне и Киринейцы благовествовали Господа Иисуса не только Иудеям, но и Еллинам. Варнава и Савл отплыли из Селевкии на Кипр и прошли его от Саламина до Пафа, где уверовал проконсул Сергий Павел. Позже Варнава, взяв Марка, снова отплыл на Кипр; Павел остановился у давнего ученика Мнасона Кипрянина, а на пути в Рим его корабль из-за противных ветров шёл у Кипра."
    - "Рим присоединил Кипр в 58 г. до н. э., когда Катона послали принять царство местного царя из династии Птолемеев вместе с его сокровищами. В 22 г. до н. э. Август передал остров сенату, и с тех пор им управляли проконсулы. Во время иудейского восстания 116–117 гг. иудеи Кипра поднялись во главе с Артемионом, и Дион Кассий пишет, что после этого ни одному иудею не позволялось ступить на остров. В IV веке, после землетрясений, Саламин был отстроен под именем Констанция и стал столицей. В 431 г. Ефесский собор подтвердил право епископов Кипра самим поставлять своих епископов вопреки притязаниям епископа Антиохийского."
