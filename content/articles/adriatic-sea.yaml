# Overview article (ADR 0007). Mainstream facts only; "Adria" in Acts is the wider ancient sea south of the modern Adriatic; the shipwreck is usually placed on Malta, and the alternatives are named with their proponents.
id: adriatic-sea
place: adc77fb
title:
  en: "Adriatic Sea"
  ru: "Адриатическое море"
  uk: "Адріатичне море"
  es: "Mar Adriático"
  pt: "Mar Adriático"
  de: "Adriatisches Meer"
  fr: "Mer Adriatique"
  it: "Mare Adriatico"
  nl: "Adriatische Zee"
  pl: "Morze Adriatyckie"
  cs: "Jaderské moře"
  sv: "Adriatiska havet"
  nb: "Adriaterhavet"
body:
  en:
    - "The Adriatic took its name from the old town of Adria near the mouth of the Po, but in the first century the name reached much further south than the modern gulf between Italy and the Balkans. Strabo wrote that the Ionian Gulf “is part of what is now called the Adriatic Sea”, and Ptolemy set the Adriatic along the east coast of Sicily. Adria thus meant the open sea between Sicily, Greece and Crete. Josephus, sailing to Rome a few years after Paul, says that his ship sank “in the Adriatic Sea”: about six hundred people swam all night, and about eighty of them were taken up by a ship of Cyrene and landed at Puteoli."
    - "Paul's ship, caught by a storm off Crete, drifted in this sea for two weeks: “But when the fourteenth night was come, as we were driven up and down in Adria, about midnight the shipmen deemed that they drew near to some country.” They sounded twenty fathoms and then fifteen, let go four anchors from the stern, and at daybreak ran the ship aground “where two seas met”; all on board reached land and learned that the island was called Melita."
    - "Most scholars place the wreck on Malta, at St Paul's Bay; James Smith, a yachtsman who worked out the ship's drift, made the classic case in 1848. In the tenth century the emperor Constantine Porphyrogenitus took Melita to be Mljet, an island in the Adriatic proper off Dubrovnik, and Heinz Warnecke argued in 1987 for Cephalonia. Today the name Adriatic belongs only to the sea between Italy and the coasts of Slovenia, Croatia, Bosnia and Herzegovina, Montenegro and Albania; the waters of Paul's drift are now called the Ionian Sea."
  ru:
    - "Адриатическое море получило имя от старого города Адрия у устья По, но в I в. это имя простиралось гораздо южнее нынешнего залива между Италией и Балканами. Страбон писал, что Ионийский залив — часть того, что теперь называют Адриатическим морем, а Птолемей помещал Адриатическое море у восточного берега Сицилии. Адрия, таким образом, означала открытое море между Сицилией, Грецией и Критом. Иосиф Флавий, плывший в Рим через несколько лет после Павла, пишет, что его корабль затонул в Адриатическом море: около шестисот человек плыли всю ночь, и около восьмидесяти из них подобрал киренский корабль и доставил в Путеолы."
    - "Корабль Павла, застигнутый бурей у Крита, две недели носило по этому морю: «В четырнадцатую ночь, как мы носимы были в Адриатическом море, около полуночи корабельщики стали догадываться, что приближаются к какой-то земле». Они намерили двадцать сажен, потом пятнадцать, бросили с кормы четыре якоря, а на рассвете посадили корабль на мель; все, кто был на корабле, спаслись на берег и узнали, что остров называется Мелит."
    - "Большинство учёных помещают крушение на Мальте, в заливе Святого Павла; классическое обоснование дал в 1848 г. яхтсмен Джеймс Смит, рассчитавший дрейф корабля. В X в. император Константин Багрянородный считал Мелитом Млет, остров в собственно Адриатике у Дубровника, а Хайнц Варнеке в 1987 г. отстаивал Кефалинию. Сегодня имя Адриатического моря принадлежит только морю между Италией и берегами Словении, Хорватии, Боснии и Герцеговины, Черногории и Албании; воды, где носило Павла, теперь называют Ионическим морем."
  uk:
    - "Адріатичне море отримало назву від старого міста Адрія поблизу гирла По, але в I ст. ця назва сягала набагато далі на південь, ніж сучасна затока між Італією та Балканами. Страбон писав, що Іонійська затока «є частиною того, що нині зветься Адріатичним морем», а Птолемей розміщував Адріатичне море вздовж східного узбережжя Сицилії. Отже, Адрія означала відкрите море між Сицилією, Грецією та Критом. Йосиф Флавій, пливучи до Риму за кілька років після Павла, каже, що його корабель затонув «в Адріатичному морі»: близько шестисот людей пливли всю ніч, а близько вісімдесяти з них підібрав корабель з Кирени й висадив у Путеолах."
    - "Корабель Павла, спійманий бурею біля Криту, дрейфував у цьому морі два тижні: «Як же настала чотирнайцята ніч, що носило нас по Адриятицькому морю, коло півночи постерегли корабельники, що близько від них якась земля». Вони промірили двадцять сажнів, потім п'ятнадцять, кинули з корми чотири якорі й на світанку посадили корабель на мілину: «Попавши ж на місце двоєморське, загрузили корабля»; усі, хто був на борту, дісталися суходолу й дізналися, що острів зветься Мелит."
    - "Більшість учених розміщують катастрофу на Мальті, у затоці св. Павла; Джеймс Сміт, яхтсмен, який розрахував дрейф корабля, виклав класичне обґрунтування 1848 р. У X ст. імператор Костянтин Багрянородний вважав, що Мелита — це Млет, острів у власне Адріатиці біля Дубровника, а Гайнц Варнеке 1987 р. обстоював Кефалінію. Нині назва Адріатичне належить лише морю між Італією та узбережжями Словенії, Хорватії, Боснії і Герцеговини, Чорногорії та Албанії; води, де дрейфував Павло, тепер називають Іонічним морем."
  es:
    - "El Adriático tomó su nombre de la antigua ciudad de Adria, cerca de la desembocadura del Po, pero en el siglo I el nombre llegaba mucho más al sur que el golfo moderno entre Italia y los Balcanes. Estrabón escribió que el golfo Jónico «es parte de lo que ahora se llama mar Adriático», y Ptolomeo situó el Adriático a lo largo de la costa oriental de Sicilia. Adria significaba así el mar abierto entre Sicilia, Grecia y Creta. Josefo, que navegaba a Roma pocos años después de Pablo, dice que su nave se hundió «en el mar Adriático»: unas seiscientas personas nadaron toda la noche, y unas ochenta fueron recogidas por una nave de Cirene y desembarcadas en Puteoli."
    - "La nave de Pablo, sorprendida por una tempestad frente a Creta, fue a la deriva por este mar durante dos semanas: «Y venida la décimacuarta noche, y siendo llevados por el mar Adriático, los marineros á la media noche sospecharon que estaban cerca de alguna tierra». Echaron la sonda y hallaron veinte brazas y luego quince, echaron cuatro anclas de la popa y, al amanecer, hicieron encallar la nave «en un lugar de dos aguas»; todos los que iban a bordo llegaron a tierra y supieron que la isla se llamaba Melita."
    - "La mayoría de los estudiosos sitúan el naufragio en Malta, en la bahía de San Pablo; James Smith, un navegante que reconstruyó la deriva de la nave, expuso el argumento clásico en 1848. En el siglo X el emperador Constantino Porfirogéneta tomó Melita por Mljet, una isla del Adriático propiamente dicho frente a Dubrovnik, y Heinz Warnecke defendió Cefalonia en 1987. Hoy el nombre de Adriático pertenece solo al mar entre Italia y las costas de Eslovenia, Croacia, Bosnia y Herzegovina, Montenegro y Albania; las aguas de la deriva de Pablo se llaman ahora mar Jónico."
  pt:
    - "O Adriático tomou o nome da antiga cidade de Adria, perto da foz do Pó, mas no século I o nome chegava muito mais ao sul do que o golfo moderno entre a Itália e os Bálcãs. Estrabão escreveu que o golfo Jônico “é parte do que hoje se chama mar Adriático”, e Ptolomeu situou o Adriático ao longo da costa leste da Sicília. Adria significava, assim, o mar aberto entre a Sicília, a Grécia e Creta. Josefo, navegando para Roma poucos anos depois de Paulo, diz que seu navio naufragou “no mar Adriático”: cerca de seiscentas pessoas nadaram a noite toda, e cerca de oitenta delas foram recolhidas por um navio de Cirene e desembarcadas em Putéoli."
    - "O navio de Paulo, apanhado por uma tempestade ao largo de Creta, foi levado por este mar durante duas semanas: “Mas quando chegou a décima quarta noite, enquanto éramos levados de um lado para outro no mar Adriático, por volta da meia-noite os marinheiros suspeitaram que estavam se aproximando de alguma terra.” Lançaram a sonda e acharam vinte braças e depois quinze, soltaram quatro âncoras da popa e, ao amanhecer, encalharam o navio “num lugar onde dois mares se encontravam”; todos a bordo chegaram à terra e souberam que a ilha se chamava Melita."
    - "A maioria dos estudiosos situa o naufrágio em Malta, na baía de São Paulo; James Smith, um iatista que calculou a deriva do navio, apresentou o argumento clássico em 1848. No século X o imperador Constantino Porfirogênito tomou Melita por Mljet, uma ilha do Adriático propriamente dito, ao largo de Dubrovnik, e Heinz Warnecke defendeu em 1987 Cefalônia. Hoje o nome Adriático pertence apenas ao mar entre a Itália e as costas da Eslovênia, Croácia, Bósnia e Herzegovina, Montenegro e Albânia; as águas da deriva de Paulo são chamadas hoje mar Jônico."
  de:
    - "Die Adria erhielt ihren Namen von der alten Stadt Adria nahe der Mündung des Po, doch im ersten Jahrhundert reichte der Name weit südlicher als der heutige Golf zwischen Italien und dem Balkan. Strabon schrieb, der Ionische Golf „ist ein Teil dessen, was jetzt das Adriatische Meer genannt wird“, und Ptolemäus setzte die Adria an die Ostküste Siziliens. Adria bezeichnete also das offene Meer zwischen Sizilien, Griechenland und Kreta. Josephus, der einige Jahre nach Paulus nach Rom segelte, sagt, sein Schiff sei „im Adriatischen Meer“ gesunken: Etwa sechshundert Menschen schwammen die ganze Nacht, und etwa achtzig von ihnen wurden von einem Schiff aus Kyrene aufgenommen und in Puteoli an Land gesetzt."
    - "Das Schiff des Paulus, von einem Sturm vor Kreta erfasst, trieb zwei Wochen in diesem Meer: „Da aber die vierzehnte Nacht kam, daß wir im Adria-Meer fuhren, um die Mitternacht, wähnten die Schiffsleute, sie kämen etwa an ein Land.“ Sie loteten zwanzig Klafter und dann fünfzehn, warfen hinten vier Anker aus, und bei Tagesanbruch setzten sie das Schiff auf „einen Ort, der auf beiden Seiten Meer hatte“; alle an Bord erreichten das Land und erfuhren, dass die Insel Melite hieß."
    - "Die meisten Gelehrten setzen den Schiffbruch auf Malta an, in der St.-Pauls-Bucht; James Smith, ein Segler, der die Abdrift des Schiffes berechnete, begründete das klassische Argument 1848. Im zehnten Jahrhundert hielt der Kaiser Konstantin Porphyrogennetos Melite für Mljet, eine Insel in der eigentlichen Adria vor Dubrovnik, und Heinz Warnecke trat 1987 für Kephalonia ein. Heute gehört der Name Adria nur noch dem Meer zwischen Italien und den Küsten von Slowenien, Kroatien, Bosnien und Herzegowina, Montenegro und Albanien; die Gewässer der Abdrift des Paulus heißen heute Ionisches Meer."
  fr:
    - "L’Adriatique doit son nom à l’ancienne ville d’Adria, près de l’embouchure du Pô, mais au Ier siècle le nom s’étendait bien plus au sud que le golfe actuel entre l’Italie et les Balkans. Strabon écrit que le golfe Ionien « fait partie de ce qu’on appelle aujourd’hui la mer Adriatique », et Ptolémée place l’Adriatique le long de la côte orientale de la Sicile. Adria désignait donc la pleine mer entre la Sicile, la Grèce et la Crète. Josèphe, qui naviguait vers Rome quelques années après Paul, dit que son navire sombra « dans la mer Adriatique » : environ six cents personnes nagèrent toute la nuit, et environ quatre-vingts d’entre elles furent recueillies par un navire de Cyrène et débarquées à Pouzzoles."
    - "Le navire de Paul, pris dans une tempête au large de la Crète, dériva deux semaines sur cette mer : « La quatorzième nuit, tandis que nous étions ballottés sur l’Adriatique, les matelots, vers le milieu de la nuit, soupçonnèrent qu’on approchait de quelque terre. » Ils jetèrent la sonde, trouvèrent vingt brasses, puis quinze, jetèrent quatre ancres de la poupe et, au jour, firent échouer le navire à l’endroit où deux mers se rejoignaient ; tous ceux qui étaient à bord gagnèrent la terre et apprirent que l’île s’appelait Malte."
    - "La plupart des exégètes situent le naufrage à Malte, dans la baie de Saint-Paul ; James Smith, un plaisancier qui reconstitua la dérive du navire, en fit la démonstration classique en 1848. Au Xe siècle, l’empereur Constantin Porphyrogénète tint Mélita pour Mljet, île de l’Adriatique proprement dite, au large de Dubrovnik, et Heinz Warnecke plaida en 1987 pour Céphalonie. Aujourd’hui, le nom d’Adriatique ne désigne plus que la mer comprise entre l’Italie et les côtes de la Slovénie, de la Croatie, de la Bosnie-Herzégovine, du Monténégro et de l’Albanie ; les eaux de la dérive de Paul s’appellent maintenant la mer Ionienne."
  it:
    - "L’Adriatico prese il nome dall’antica città di Adria presso la foce del Po, ma nel I secolo il nome si estendeva molto più a sud del moderno golfo tra l’Italia e i Balcani. Strabone scrisse che il golfo Ionio «è parte di ciò che ora si chiama mare Adriatico», e Tolomeo pose l’Adriatico lungo la costa orientale della Sicilia. Adria indicava dunque il mare aperto tra Sicilia, Grecia e Creta. Giuseppe Flavio, navigando verso Roma pochi anni dopo Paolo, dice che la sua nave affondò «nel mare Adriatico»: circa seicento persone nuotarono tutta la notte, e circa ottanta furono raccolte da una nave di Cirene e sbarcate a Pozzuoli."
    - "La nave di Paolo, colta da una tempesta al largo di Creta, andò alla deriva in questo mare per due settimane: «E la quattordicesima notte da che eravamo portati qua e là per l’Adriatico, verso la mezzanotte i marinari sospettavano d’esser vicini a terra». Scandagliarono venti braccia e poi quindici, gettarono da poppa «quattro àncore», e all’alba spinsero la nave in secca «in un luogo che avea il mare d’ambo i lati»; tutti a bordo raggiunsero la terra e riconobbero che «l’isola si chiamava Malta»."
    - "La maggior parte degli studiosi colloca il naufragio a Malta, nella baia di San Paolo; James Smith, un velista che calcolò la deriva della nave, ne sostenne la tesi classica nel 1848. Nel X secolo l’imperatore Costantino Porfirogenito ritenne che Melite fosse Mljet, un’isola dell’Adriatico vero e proprio al largo di Dubrovnik, e Heinz Warnecke sostenne nel 1987 Cefalonia. Oggi il nome Adriatico appartiene soltanto al mare tra l’Italia e le coste di Slovenia, Croazia, Bosnia ed Erzegovina, Montenegro e Albania; le acque della deriva di Paolo si chiamano ora mar Ionio."
  nl:
    - "De Adriatische Zee ontleende haar naam aan de oude stad Adria bij de monding van de Po, maar in de eerste eeuw reikte de naam veel verder zuidwaarts dan de moderne golf tussen Italië en de Balkan. Strabo schreef dat de Ionische Golf “een deel is van wat nu de Adriatische Zee heet”, en Ptolemaeus plaatste de Adriatische Zee langs de oostkust van Sicilië. Adria betekende dus de open zee tussen Sicilië, Griekenland en Kreta. Josephus, die enkele jaren na Paulus naar Rome voer, zegt dat zijn schip verging “in de Adriatische Zee”: ongeveer zeshonderd mensen zwommen de hele nacht, en ongeveer tachtig van hen werden opgepikt door een schip uit Cyrene en aan land gebracht te Puteoli."
    - "Paulus' schip, overvallen door een storm bij Kreta, dreef twee weken lang op deze zee rond: “Als nu de veertiende nacht gekomen was, alzo wij in de Adriatische zee herwaarts en derwaarts gedreven werden, omtrent het midden des nachts, vermoedden de scheepslieden, dat hun enig land naderde.” Zij peilden twintig vadem en daarna vijftien, wierpen vier ankers van het achterschip uit, en lieten bij het aanbreken van de dag het schip stranden op “een plaats, die de zee aan beide zijden had”; allen aan boord bereikten het land en vernamen dat het eiland Melite heette."
    - "De meeste geleerden plaatsen de schipbreuk op Malta, in de Sint-Paulusbaai; James Smith, een zeiler die de drift van het schip uitrekende, gaf er in 1848 het klassieke pleidooi voor. In de tiende eeuw hield keizer Constantijn Porfyrogenitus Melite voor Mljet, een eiland in de eigenlijke Adriatische Zee voor Dubrovnik, en Heinz Warnecke pleitte in 1987 voor Kefalonia. Tegenwoordig behoort de naam Adriatische Zee alleen toe aan de zee tussen Italië en de kusten van Slovenië, Kroatië, Bosnië en Herzegovina, Montenegro en Albanië; de wateren van Paulus' drift heten nu de Ionische Zee."
  pl:
    - "Adriatyk wziął nazwę od dawnego miasta Adria u ujścia Padu, lecz w I wieku nazwa sięgała znacznie dalej na południe niż dzisiejsza zatoka między Włochami a Bałkanami. Strabon pisał, że Zatoka Jońska „jest częścią tego, co nazywa się obecnie Morzem Adriatyckim”, a Ptolemeusz umieścił Adriatyk wzdłuż wschodniego wybrzeża Sycylii. Adria oznaczała więc otwarte morze między Sycylią, Grecją i Kretą. Józef Flawiusz, płynąc do Rzymu kilka lat po Pawle, mówi, że jego okręt zatonął „na Morzu Adriatyckim”: około sześciuset ludzi pływało całą noc, a około osiemdziesięciu z nich wyłowił okręt z Cyreny i wysadził w Puteoli."
    - "Okręt Pawła, schwytany przez burzę u wybrzeży Krety, dryfował po tym morzu dwa tygodnie: „A gdy przyszła noc czternasta, a myśmy się błąkali po morzu Adryjatyckiem, około północy zdało się żeglarzom, iż się im okazywała niektóra kraina”. Zmierzyli głębokość na dwadzieścia sążni, potem piętnaście, zrzucili cztery kotwice z rufy, a o świcie wpłynęli na mieliznę „na miejsce, które miało z obu stron morze”; wszyscy na pokładzie dotarli do lądu i dowiedzieli się, że wyspa nazywa się Melita."
    - "Większość uczonych umieszcza rozbicie okrętu na Malcie, w Zatoce św. Pawła; James Smith, żeglarz-amator, który obliczył dryf okrętu, przedstawił klasyczny wywód w 1848 roku. W X wieku cesarz Konstantyn Porfirogeneta uznał Melitę za Mljet, wyspę w samym Adriatyku koło Dubrownika, a Heinz Warnecke opowiedział się w 1987 roku za Kefalinią. Dziś nazwa Adriatyk należy tylko do morza między Włochami a wybrzeżami Słowenii, Chorwacji, Bośni i Hercegowiny, Czarnogóry i Albanii; wody, po których dryfował Paweł, nazywa się dziś Morzem Jońskim."
  cs:
    - "Jaderské moře dostalo jméno podle starého města Adrie u ústí Pádu, ale v prvním století sahalo jméno mnohem dále na jih než dnešní záliv mezi Itálií a Balkánem. Strabón napsal, že Iónský záliv „je částí toho, co se nyní nazývá Jaderské moře“, a Ptolemaios kladl Jaderské moře podél východního pobřeží Sicílie. Adria tak znamenala otevřené moře mezi Sicílií, Řeckem a Krétou. Josephus Flavius, plující do Říma několik let po Pavlovi, říká, že jeho loď se potopila „v Jaderském moři“: asi šest set lidí plavalo celou noc a asi osmdesáti z nich se ujala loď z Kyrény a vysadila je v Puteolech."
    - "Pavlova loď, zachycená bouří u Kréty, se v tomto moři zmítala dva týdny: „A když již byla čtrnáctá noc, a my se plavili po moři Adriatickém, okolo půlnoci, domnívali se plavci, že by se jim okazovala krajina nějaká.“ Změřili hloubku dvacet sáhů a pak patnáct, spustili ze zádi čtyři kotvy a za rozbřesku najeli lodí na mělčinu, „kdež se dvoje moře schází“; všichni na palubě dosáhli břehu a zjistili, že ostrov se nazývá Melita."
    - "Většina badatelů klade ztroskotání na Maltu, do zálivu svatého Pavla; James Smith, jachtař, který vypočítal směr unášení lodi, podal roku 1848 klasický důkaz. V desátém století pokládal císař Konstantin Porfyrogennétos Melitu za Mljet, ostrov v samotném Jaderském moři u Dubrovníku, a Heinz Warnecke zastával roku 1987 Kefalonii. Dnes patří jméno Jaderské jen moři mezi Itálií a pobřežími Slovinska, Chorvatska, Bosny a Hercegoviny, Černé Hory a Albánie; vody Pavlova unášení se dnes nazývají Iónské moře."
  sv:
    - "Adriatiska havet fick sitt namn efter den gamla staden Adria nära Pos mynning, men under det första århundradet nådde namnet mycket längre söderut än den moderna viken mellan Italien och Balkan. Strabon skrev att Joniska viken ”är en del av det som nu kallas Adriatiska havet”, och Ptolemaios lät Adriatiska havet sträcka sig längs Siciliens östkust. Adria betydde alltså det öppna havet mellan Sicilien, Grekland och Kreta. Josefus, som seglade till Rom några år efter Paulus, säger att hans skepp sjönk ”i Adriatiska havet”: omkring sexhundra människor simmade hela natten, och omkring åttio av dem togs upp av ett skepp från Kyrene och sattes i land i Puteoli."
    - "Paulus’ skepp, fångat av en storm utanför Kreta, drev i detta hav i två veckor: ”När vi nu den fjortonde natten drevo omkring på Adriatiska havet, tyckte sjömännen sig vid midnattstiden finna att de närmade sig något land.” De lodade tjugu famnar och sedan femton, kastade ut fyra ankare från aktern och vid dagbräckningen körde de skeppet på grund där två hav möttes; alla ombord nådde land och fick veta att ön hette Melita."
    - "De flesta forskare förlägger skeppsbrottet till Malta, vid Sankt Pauls bukt; James Smith, en seglare som räknade ut skeppets drift, framlade 1848 det klassiska argumentet. På 900-talet ansåg kejsar Konstantin Porfyrogennetos att Melita var Mljet, en ö i själva Adriatiska havet utanför Dubrovnik, och Heinz Warnecke förde 1987 fram Kefalonia. I dag hör namnet Adriatiska havet bara till havet mellan Italien och kusterna i Slovenien, Kroatien, Bosnien och Hercegovina, Montenegro och Albanien; vattnen där Paulus drev kallas nu Joniska havet."
  nb:
    - "Adriaterhavet fikk navn etter den gamle byen Adria nær munningen av Po, men i det første århundre rakk navnet mye lenger sørover enn den moderne bukta mellom Italia og Balkan. Strabon skrev at Det joniske hav «er en del av det som nå kalles Adriaterhavet», og Ptolemaios plasserte Adriaterhavet langs østkysten av Sicilia. Adria betydde dermed det åpne havet mellom Sicilia, Hellas og Kreta. Josefus, som seilte til Roma noen år etter Paulus, sier at skipet hans sank «i Adriaterhavet»: omkring seks hundre mennesker svømte hele natten, og omkring åtti av dem ble tatt opp av et skip fra Kyrene og landsatt i Puteoli."
    - "Paulus' skip, grepet av en storm utenfor Kreta, drev i dette havet i to uker: «Da nu den fjortende natt kom, mens vi drev omkring i Adriaterhavet, skjønte sjøfolkene midt på natten at det bar nær mot land.» De loddet tyve favner og så femten, kastet ut fire anker fra bakstavnen, og ved daggry drev skipet inn på «en grunn som hadde dypt hav på begge sider»; alle om bord nådde land og fikk vite at øya het Melite."
    - "De fleste forskere plasserer forliset på Malta, ved St. Paul's Bay; James Smith, en seiler som regnet ut skipets drift, la fram det klassiske argumentet i 1848. På 900-tallet mente keiser Konstantin Porfyrogennetos at Melite var Mljet, en øy i selve Adriaterhavet ved Dubrovnik, og Heinz Warnecke argumenterte i 1987 for Kefalonia. I dag tilhører navnet Adriaterhavet bare havet mellom Italia og kystene til Slovenia, Kroatia, Bosnia-Hercegovina, Montenegro og Albania; farvannet der Paulus drev, kalles nå Det joniske hav."
