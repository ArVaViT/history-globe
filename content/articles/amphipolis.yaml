body:
  en:
    - "Amphipolis stood on a hill on the east bank of the Strymon in Macedonia, a few kilometres above the river mouth and its port Eion, near the timber and the gold and silver mines of Mount Pangaeus. The place was first called Ennea Hodoi, the Nine Ways. Herodotus says that when Xerxes' army crossed the Strymon there in 480 BC, the Persians buried alive nine boys and nine girls of the local people. About 465 BC an Athenian colony was sent there, but the settlers were cut off by the Thracians at Drabescus."
    - "In 437/436 BC the Athenian Hagnon founded the city and named it Amphipolis because the Strymon flows round it on two sides. In the winter of 424 BC the Spartan Brasidas took it; the historian Thucydides, then an Athenian general at Thasos, came too late to save it and spent twenty years in exile. In 422 BC Brasidas and the Athenian Cleon both fell in a battle before the city, and the Amphipolitans buried Brasidas in the city and honoured him as their founder in place of Hagnon. Philip II of Macedon took Amphipolis in 357 BC. After Alexander's death, Cassander kept Alexander's widow Roxane and her young son in its citadel, and about 310 BC he had them killed."
    - 'After Rome defeated Perseus, the last king of Macedon, in 168 BC, Aemilius Paullus announced the settlement of Macedonia at Amphipolis: the country was divided into four regions, and Amphipolis became the capital of the first. The city lay on the Via Egnatia, and Paul and Silas, going on from Philippi, "passed through Amphipolis and Apollonia" to Thessalonica. Acts says nothing of a stay there.'
    - "In late antiquity the inhabited city shrank to the walled acropolis, where several basilicas with mosaic floors and a church with a hexagonal plan were built in the fifth and sixth centuries. Greek excavations, led for many years by Dimitrios Lazaridis, uncovered the walls, the gymnasium and these churches. Near the river stands the colossal marble Lion of Amphipolis, a funerary monument usually dated to the fourth century BC."
  ru:
    - "Амфиполь стоял на холме на восточном берегу Стримона в Македонии, в нескольких километрах выше устья реки и гавани Эион, рядом с лесами и золотыми и серебряными рудниками горы Пангей. Это место сначала называлось Девять Путей. Геродот рассказывает, что когда войско Ксеркса переправлялось здесь через Стримон в 480 г. до н. э., персы закопали заживо девять мальчиков и девять девушек из местных жителей. Около 465 г. до н. э. сюда отправили афинских поселенцев, но фракийцы истребили их у Драбеска."
    - "В 437/436 г. до н. э. афинянин Гагнон основал город и назвал его Амфиполем, потому что Стримон обтекает его с двух сторон. Зимой 424 г. до н. э. его взял спартанец Брасид; историк Фукидид, тогда афинский стратег на Фасосе, опоздал на помощь и провёл двадцать лет в изгнании. В 422 г. до н. э. Брасид и афинянин Клеон оба погибли в битве под городом, и амфипольцы похоронили Брасида в городе и стали чтить его как основателя вместо Гагнона. Филипп II Македонский взял Амфиполь в 357 г. до н. э. После смерти Александра Кассандр держал в здешней крепости его вдову Роксану и её малолетнего сына, а около 310 г. до н. э. велел их убить."
    - "После того как в 168 г. до н. э. Рим разбил Персея, последнего царя Македонии, Эмилий Павел объявил в Амфиполе устройство Македонии: страну разделили на четыре области, и Амфиполь стал главным городом первой. Город лежал на Эгнатиевой дороге, и Павел с Силой, идя дальше из Филипп, «прошедши через Амфиполь и Аполлонию», пришли в Фессалонику. О том, останавливались ли они здесь, Деяния ничего не говорят."
    - "В поздней античности жилой город сжался до обнесённого стеной акрополя, где в V–VI веках построили несколько базилик с мозаичными полами и церковь шестиугольного плана. Греческие раскопки, которыми много лет руководил Димитриос Лазаридис, открыли стены, гимнасий и эти церкви. У реки стоит огромный мраморный Амфипольский лев — надгробный памятник, который обычно датируют IV веком до н. э."
  uk:
    - "Амфіполіс стояв на пагорбі на східному березі Стримону в Македонії, за кілька кілометрів вище гирла річки та її порту Еіон, поблизу лісу та золотих і срібних копалень гори Пангей. Місце спершу звалося Еннеа-Годой, «Дев'ять доріг». Геродот каже, що коли військо Ксеркса переходило тут Стримон у 480 р. до н. е., перси поховали живцем дев'ять хлопців і дев'ять дівчат із місцевого населення. Близько 465 р. до н. е. туди послали афінську колонію, але поселенців відрізали фракійці при Драбеску."
    - "У 437/436 р. до н. е. афінянин Гагнон заснував місто й назвав його Амфіполіс, бо Стримон обтікає його з двох боків. Взимку 424 р. до н. е. його взяв спартанець Брасід; історик Фукідід, тоді афінський стратег на Тасосі, прийшов запізно, щоб його врятувати, і двадцять років провів на засланні. У 422 р. до н. е. Брасід і афінянин Клеон обидва впали в битві під містом, і амфіполіти поховали Брасіда в місті й шанували його як засновника замість Гагнона. Пилип II Македонський узяв Амфіполіс у 357 р. до н. е. Після смерті Александра Кассандр тримав у його цитаделі вдову Александра Роксану з малим сином, а близько 310 р. до н. е. звелів їх убити."
    - "Після того як Рим переміг Персея, останнього царя Македонії, у 168 р. до н. е., Емілій Павел оголосив в Амфіполісі устрій Македонії: країну поділили на чотири округи, і Амфіполіс став столицею першого. Місто лежало на Егнатієвій дорозі, і Павло та Сила, вирушивши далі з Філіпп, «перейшовши ж Амфиполь та Аполонию», прийшли до Солуня. Дії нічого не кажуть про зупинку там."
    - "У пізню давнину населене місто стислося до муру акрополя, де в V–VI століттях збудували кілька базилік з мозаїчною підлогою та церкву шестикутного плану. Грецькі розкопки, якими багато років керував Дімітріос Лазарідіс, виявили мури, гімнасій і ці церкви. Біля річки стоїть велетенський мармуровий Амфіпольський лев, надгробний пам'ятник, який зазвичай датують IV століттям до н. е."
  es:
    - "Anfípolis se alzaba sobre una colina en la orilla oriental del Estrimón, en Macedonia, unos kilómetros río arriba de la desembocadura y de su puerto Eyón, cerca de los bosques y de las minas de oro y plata del monte Pangeo. El lugar se llamó primero Enea Hodoi, los Nueve Caminos. Heródoto dice que cuando el ejército de Jerjes cruzó allí el Estrimón en 480 a. C., los persas enterraron vivos a nueve muchachos y nueve muchachas de los naturales. Hacia 465 a. C. se envió allí una colonia ateniense, pero los colonos fueron aniquilados por los tracios en Drabesco."
    - "En 437/436 a. C. el ateniense Hagnón fundó la ciudad y la llamó Anfípolis porque el Estrimón la rodea por dos lados. En el invierno de 424 a. C. el espartano Brásidas la tomó; el historiador Tucídides, entonces general ateniense en Tasos, llegó demasiado tarde para salvarla y pasó veinte años en el exilio. En 422 a. C. Brásidas y el ateniense Cleón cayeron ambos en una batalla ante la ciudad, y los anfipolitanos enterraron a Brásidas en la ciudad y lo honraron como su fundador en lugar de Hagnón. Filipo II de Macedonia tomó Anfípolis en 357 a. C. Tras la muerte de Alejandro, Casandro mantuvo en su ciudadela a la viuda de Alejandro, Roxana, y a su hijo pequeño, y hacia 310 a. C. los hizo matar."
    - "Después de que Roma derrotara a Perseo, último rey de Macedonia, en 168 a. C., Emilio Paulo anunció en Anfípolis la organización de Macedonia: el país fue dividido en cuatro regiones, y Anfípolis se convirtió en la capital de la primera. La ciudad estaba en la Vía Egnatia, y Pablo y Silas, al partir de Filipos, fueron «pasando por Amphípolis y Apolonia» hasta Tesalónica. Los Hechos no dicen nada de una estancia allí."
    - "En la Antigüedad tardía la ciudad habitada se redujo a la acrópolis amurallada, donde se construyeron varias basílicas con suelos de mosaico y una iglesia de planta hexagonal en los siglos V y VI. Las excavaciones griegas, dirigidas durante muchos años por Dimitrios Lazaridis, sacaron a la luz las murallas, el gimnasio y estas iglesias. Cerca del río se alza el colosal León de Anfípolis, de mármol, un monumento funerario que suele fecharse en el siglo IV a. C."
  pt:
    - "Anfípolis ficava numa colina na margem leste do Estrimão, na Macedônia, a alguns quilômetros acima da foz do rio e de seu porto Eion, perto da madeira e das minas de ouro e prata do monte Pangeu. O lugar chamava-se primeiro Ennea Hodoi, os Nove Caminhos. Heródoto diz que, quando o exército de Xerxes atravessou ali o Estrimão em 480 a.C., os persas enterraram vivos nove meninos e nove meninas da gente do lugar. Por volta de 465 a.C. uma colônia ateniense foi enviada para lá, mas os colonos foram aniquilados pelos trácios em Drabesco."
    - "Em 437/436 a.C. o ateniense Hagnon fundou a cidade e a chamou Anfípolis porque o Estrimão a contorna por dois lados. No inverno de 424 a.C. o espartano Brásidas a tomou; o historiador Tucídides, então general ateniense em Tasos, chegou tarde demais para salvá-la e passou vinte anos no exílio. Em 422 a.C. Brásidas e o ateniense Cléon caíram numa batalha diante da cidade, e os anfipolitanos sepultaram Brásidas na cidade e o honraram como fundador no lugar de Hagnon. Filipe II da Macedônia tomou Anfípolis em 357 a.C. Depois da morte de Alexandre, Cassandro manteve na cidadela a viúva de Alexandre, Roxana, e seu filho pequeno, e por volta de 310 a.C. mandou matá-los."
    - "Depois que Roma derrotou Perseu, último rei da Macedônia, em 168 a.C., Emílio Paulo anunciou em Anfípolis o ordenamento da Macedônia: o país foi dividido em quatro regiões, e Anfípolis tornou-se a capital da primeira. A cidade ficava na Via Egnácia, e Paulo e Silas, seguindo de Filipos, “depois de passarem por Anfípolis e Apolônia”, chegaram a Tessalônica. Atos nada diz de uma estada ali."
    - "Na Antiguidade tardia a cidade habitada reduziu-se à acrópole murada, onde várias basílicas com pisos de mosaico e uma igreja de planta hexagonal foram construídas nos séculos V e VI. Escavações gregas, dirigidas durante muitos anos por Dimitrios Lazaridis, trouxeram à luz as muralhas, o ginásio e essas igrejas. Perto do rio ergue-se o colossal Leão de Anfípolis, em mármore, um monumento funerário geralmente datado do século IV a.C."
  de:
    - "Amphipolis lag auf einem Hügel am Ostufer des Strymon in Mazedonien, wenige Kilometer oberhalb der Flussmündung und ihres Hafens Eion, nahe dem Holz und den Gold- und Silberminen des Pangaion. Der Ort hieß zuerst Ennea Hodoi, die Neun Wege. Herodot berichtet, als das Heer des Xerxes 480 v. Chr. dort den Strymon überschritt, hätten die Perser neun Knaben und neun Mädchen der Einheimischen lebendig begraben. Um 465 v. Chr. wurde eine athenische Kolonie dorthin geschickt, doch die Siedler wurden bei Drabeskos von den Thrakern abgeschnitten."
    - "437/436 v. Chr. gründete der Athener Hagnon die Stadt und nannte sie Amphipolis, weil der Strymon sie auf zwei Seiten umfließt. Im Winter 424 v. Chr. nahm der Spartaner Brasidas sie ein; der Geschichtsschreiber Thukydides, damals athenischer Feldherr bei Thasos, kam zu spät, sie zu retten, und verbrachte zwanzig Jahre im Exil. 422 v. Chr. fielen Brasidas und der Athener Kleon in einer Schlacht vor der Stadt, und die Amphipoliten bestatteten Brasidas in der Stadt und ehrten ihn statt Hagnons als ihren Gründer. Philipp II. von Mazedonien nahm Amphipolis 357 v. Chr. ein. Nach Alexanders Tod hielt Kassander Alexanders Witwe Roxane und ihren kleinen Sohn in der Burg fest und ließ sie um 310 v. Chr. töten."
    - "Nachdem Rom 168 v. Chr. Perseus, den letzten König Mazedoniens, besiegt hatte, verkündete Aemilius Paullus in Amphipolis die Neuordnung Mazedoniens: Das Land wurde in vier Bezirke geteilt, und Amphipolis wurde Hauptstadt des ersten. Die Stadt lag an der Via Egnatia, und Paulus und Silas zogen von Philippi weiter: „Nachdem sie aber durch Amphipolis und Apollonia gereist waren, kamen sie gen Thessalonich“. Die Apostelgeschichte sagt nichts von einem Aufenthalt dort."
    - "In der Spätantike schrumpfte die bewohnte Stadt auf die ummauerte Akropolis, wo im 5. und 6. Jahrhundert mehrere Basiliken mit Mosaikböden und eine Kirche mit sechseckigem Grundriss gebaut wurden. Griechische Ausgrabungen, viele Jahre von Dimitrios Lazaridis geleitet, legten die Mauern, das Gymnasion und diese Kirchen frei. Nahe dem Fluss steht der kolossale marmorne Löwe von Amphipolis, ein Grabmal, gewöhnlich ins 4. Jahrhundert v. Chr. datiert."
  fr:
    - "Amphipolis s’élevait sur une colline de la rive orientale du Strymon, en Macédoine, à quelques kilomètres en amont de l’embouchure et de son port d’Éion, près des forêts et des mines d’or et d’argent du mont Pangée. Le lieu s’appela d’abord Ennea Hodoi, les Neuf Voies. Hérodote dit que lorsque l’armée de Xerxès franchit le Strymon en 480 av. J.-C., les Perses enterrèrent vifs neuf garçons et neuf filles du pays. Vers 465 av. J.-C., une colonie athénienne y fut envoyée, mais les colons furent massacrés par les Thraces à Drabescos."
    - "En 437/436 av. J.-C., l’Athénien Hagnon fonda la ville et la nomma Amphipolis parce que le Strymon l’entoure des deux côtés. À l’hiver 424 av. J.-C., le Spartiate Brasidas la prit ; l’historien Thucydide, alors général athénien à Thasos, arriva trop tard pour la sauver et passa vingt ans en exil. En 422 av. J.-C., Brasidas et l’Athénien Cléon tombèrent tous deux dans un combat devant la ville, et les Amphipolitains enterrèrent Brasidas dans la cité et l’honorèrent comme fondateur à la place d’Hagnon. Philippe II de Macédoine prit Amphipolis en 357 av. J.-C. Après la mort d’Alexandre, Cassandre garda dans sa citadelle la veuve d’Alexandre, Roxane, et son jeune fils, et vers 310 av. J.-C. il les fit tuer."
    - "Après la défaite de Persée, dernier roi de Macédoine, devant Rome en 168 av. J.-C., Paul Émile proclama à Amphipolis l’organisation de la Macédoine : le pays fut divisé en quatre régions, et Amphipolis devint la capitale de la première. La ville se trouvait sur la voie Égnatienne, et Paul et Silas, poursuivant leur route depuis Philippes, « passèrent par Amphipolis et Apollonie » pour gagner Thessalonique. Les Actes ne disent rien d’un séjour."
    - "Dans l’Antiquité tardive, la ville habitée se réduisit à l’acropole fortifiée, où furent bâties aux Ve et VIe siècles plusieurs basiliques à sols de mosaïque et une église de plan hexagonal. Les fouilles grecques, dirigées longtemps par Dimitrios Lazaridis, ont dégagé les remparts, le gymnase et ces églises. Près du fleuve se dresse le Lion d’Amphipolis, colossal, en marbre, monument funéraire généralement daté du IVe siècle av. J.-C."
  it:
    - "Anfipoli sorgeva su una collina sulla riva orientale dello Strimone, in Macedonia, a pochi chilometri sopra la foce del fiume e il suo porto Eione, vicino al legname e alle miniere d’oro e d’argento del monte Pangeo. Il luogo fu chiamato dapprima Enneodoi, le Nove Vie. Erodoto dice che quando l’esercito di Serse attraversò lì lo Strimone, nel 480 a.C., i Persiani seppellirono vivi nove ragazzi e nove ragazze della gente del luogo. Intorno al 465 a.C. vi fu mandata una colonia ateniese, ma i coloni furono tagliati fuori dai Traci a Drabesco."
    - "Nel 437/436 a.C. l’ateniese Agnone fondò la città e la chiamò Anfipoli perché lo Strimone le scorre intorno su due lati. Nell’inverno del 424 a.C. lo spartano Brasida la prese; lo storico Tucidide, allora generale ateniese a Taso, giunse troppo tardi per salvarla e trascorse venti anni in esilio. Nel 422 a.C. Brasida e l’ateniese Cleone caddero entrambi in una battaglia davanti alla città, e gli Anfipolitani seppellirono Brasida in città e lo onorarono come fondatore al posto di Agnone. Filippo II di Macedonia prese Anfipoli nel 357 a.C. Dopo la morte di Alessandro, Cassandro tenne nella sua cittadella la vedova di Alessandro, Rossane, e il suo giovane figlio, e intorno al 310 a.C. li fece uccidere."
    - "Dopo che Roma sconfisse Perseo, ultimo re di Macedonia, nel 168 a.C., Emilio Paolo annunciò ad Anfipoli l’assetto della Macedonia: il paese fu diviso in quattro regioni, e Anfipoli divenne la capitale della prima. La città sorgeva sulla via Egnazia, e Paolo e Sila, proseguendo da Filippi, «essendo passati per Amfipoli e per Apollonia» giunsero a Tessalonica. Gli Atti non dicono nulla di un soggiorno lì."
    - "Nella tarda antichità la città abitata si ridusse all’acropoli fortificata, dove nel V e VI secolo furono costruite diverse basiliche con pavimenti a mosaico e una chiesa a pianta esagonale. Gli scavi greci, diretti per molti anni da Dimitrios Lazaridis, hanno portato alla luce le mura, il ginnasio e queste chiese. Vicino al fiume si trova il colossale Leone di Anfipoli in marmo, un monumento funerario di solito datato al IV secolo a.C."
  pl:
    - "Amfipolis stała na wzgórzu na wschodnim brzegu Strymonu w Macedonii, kilka kilometrów nad ujściem rzeki i jej portem Ejon, blisko lasów oraz kopalń złota i srebra góry Pangajon. Miejsce nazywano pierwotnie Ennea Hodoi, Dziewięć Dróg. Herodot mówi, że gdy armia Kserksesa przekraczała tam Strymon w 480 r. p.n.e., Persowie pogrzebali żywcem dziewięciu chłopców i dziewięć dziewcząt z miejscowej ludności. Około 465 r. p.n.e. wysłano tam ateńską kolonię, lecz osadników wycięli Trakowie pod Drabeskos."
    - "W latach 437/436 p.n.e. Ateńczyk Hagnon założył miasto i nazwał je Amfipolis, bo Strymon opływa je z dwóch stron. Zimą 424 r. p.n.e. zdobył je Spartanin Brazydas; historyk Tukidydes, wówczas ateński strateg na Tasos, przybył za późno, by je ocalić, i spędził dwadzieścia lat na wygnaniu. W 422 r. p.n.e. Brazydas i ateński Kleon polegli w bitwie pod miastem, a mieszkańcy Amfipolis pochowali Brazydasa w mieście i czcili go jako założyciela zamiast Hagnona. Filip II Macedoński zajął Amfipolis w 357 r. p.n.e. Po śmierci Aleksandra Kassander trzymał w jej cytadeli wdowę po Aleksandrze, Roksanę, z małym synem, a około 310 r. p.n.e. kazał ich zabić."
    - "Gdy Rzym w 168 r. p.n.e. pokonał Perseusza, ostatniego króla Macedonii, Emiliusz Paulus ogłosił w Amfipolis urządzenie Macedonii: kraj podzielono na cztery okręgi, a Amfipolis została stolicą pierwszego. Miasto leżało przy Via Egnatia, a Paweł i Sylas, idąc dalej z Filippi, „przeszedłszy Amfipolim i Apoloniję przyszli do Tesaloniki”. Dzieje nic nie mówią o postoju tam."
    - "W późnej starożytności zamieszkane miasto skurczyło się do obwarowanego akropolu, gdzie w V i VI wieku zbudowano kilka bazylik z mozaikowymi posadzkami oraz kościół na planie sześcioboku. Greckie wykopaliska, przez wiele lat prowadzone przez Dimitriosa Lazaridisa, odsłoniły mury, gimnazjon i te kościoły. Blisko rzeki stoi kolosalny marmurowy Lew z Amfipolis, pomnik nagrobny datowany zwykle na IV wiek p.n.e."
  nl:
    - "Amfipolis lag op een heuvel aan de oostoever van de Strymon in Macedonië, enkele kilometers boven de riviermonding en haar haven Eïon, nabij het hout en de goud- en zilvermijnen van de berg Pangaion. De plaats heette eerst Ennea Hodoi, de Negen Wegen. Herodotus zegt dat de Perzen, toen het leger van Xerxes in 480 v.Chr. daar de Strymon overstak, negen jongens en negen meisjes van de plaatselijke bevolking levend begroeven. Omstreeks 465 v.Chr. werd er een Atheense kolonie heen gestuurd, maar de kolonisten werden bij Drabescus door de Thraciërs afgesneden."
    - "In 437/436 v.Chr. stichtte de Athener Hagnon de stad en noemde haar Amfipolis omdat de Strymon haar aan twee zijden omstroomt. In de winter van 424 v.Chr. nam de Spartaan Brasidas haar in; de geschiedschrijver Thucydides, toen Atheens generaal bij Thasos, kwam te laat om haar te redden en bracht twintig jaar in ballingschap door. In 422 v.Chr. sneuvelden Brasidas en de Athener Cleon beiden in een slag voor de stad, en de Amfipolieten begroeven Brasidas in de stad en eerden hem als hun stichter in plaats van Hagnon. Filips II van Macedonië nam Amfipolis in 357 v.Chr. in. Na Alexanders dood hield Cassander Alexanders weduwe Roxane en haar jonge zoon in haar citadel vast, en omstreeks 310 v.Chr. liet hij hen doden."
    - "Nadat Rome Perseus, de laatste koning van Macedonië, in 168 v.Chr. had verslagen, kondigde Aemilius Paullus te Amfipolis de regeling voor Macedonië af: het land werd in vier gebieden verdeeld, en Amfipolis werd de hoofdstad van het eerste. De stad lag aan de Via Egnatia, en Paulus en Silas reisden vanuit Filippi verder, “door Amfipolis en Apollonia hun weg genomen hebbende”, naar Tessalonica. Handelingen zegt niets over een verblijf daar."
    - "In de late oudheid kromp de bewoonde stad tot de ommuurde akropolis, waar in de vijfde en zesde eeuw verscheidene basilieken met mozaïekvloeren en een kerk met zeshoekige plattegrond werden gebouwd. Griekse opgravingen, jarenlang geleid door Dimitrios Lazaridis, legden de muren, het gymnasion en deze kerken bloot. Bij de rivier staat de kolossale marmeren Leeuw van Amfipolis, een grafmonument dat gewoonlijk in de vierde eeuw v.Chr. wordt gedateerd."
  cs:
    - "Amfipolis stála na pahorku na východním břehu Strymónu v Makedonii, několik kilometrů nad ústím řeky a jejím přístavem Eión, poblíž lesů a zlatých a stříbrných dolů hory Pangaion. Místo se původně jmenovalo Ennea Hodoi, Devět cest. Hérodotos praví, že když vojsko Xerxovo roku 480 př. n. l. přecházelo Strymón, Peršané tam zaživa pohřbili devět chlapců a devět dívek z místního lidu. Kolem roku 465 př. n. l. tam byla vyslána athénská kolonie, ale osadníky u Drabésku odřízli Thrákové."
    - "V letech 437/436 př. n. l. založil město Athéňan Hagnón a nazval je Amfipolis, protože je Strymón obtéká ze dvou stran. V zimě roku 424 př. n. l. je dobyl Sparťan Brasidas; historik Thúkydidés, tehdy athénský stratég na Thasu, přišel příliš pozdě, aby je zachránil, a strávil dvacet let ve vyhnanství. V roce 422 př. n. l. padli v bitvě před městem Brasidas i Athéňan Kleón a Amfipolité pohřbili Brasida ve městě a ctili ho jako zakladatele místo Hagnóna. Filip II. Makedonský dobyl Amfipolis v roce 357 př. n. l. Po Alexandrově smrti držel Kassandros v její citadele Alexandrovu vdovu Roxanu s malým synem a kolem roku 310 př. n. l. je dal zabít."
    - "Poté, co Řím roku 168 př. n. l. porazil Persea, posledního makedonského krále, vyhlásil Aemilius Paullus v Amfipoli uspořádání Makedonie: země byla rozdělena na čtyři oblasti a Amfipolis se stala hlavním městem první. Město leželo na Via Egnatia a Pavel a Silas, kteří pokračovali z Filip, „prošedše město Amfipolim a Apollonii, přišli do Tessaloniky“. Skutky o pobytu tam nic neříkají."
    - "V pozdní antice se obydlené město smrštilo na opevněnou akropoli, kde bylo v 5. a 6. století postaveno několik bazilik s mozaikovými podlahami a kostel šestiúhelníkového půdorysu. Řecké vykopávky, dlouhá léta vedené Dimitriem Lazaridisem, odkryly hradby, gymnasion a tyto kostely. Poblíž řeky stojí kolosální mramorový Amfipolský lev, pohřební pomník obvykle datovaný do 4. století př. n. l."
  sv:
    - "Amfipolis låg på en kulle på Strymons östra strand i Makedonien, några kilometer ovanför flodmynningen och hamnen Eion, nära skogen och guld- och silvergruvorna på Pangaion. Platsen kallades först Ennea Hodoi, De nio vägarna. Herodotos säger att perserna, när Xerxes’ armé korsade Strymon där år 480 f.Kr., begravde nio pojkar och nio flickor ur lokalbefolkningen levande. Omkring 465 f.Kr. sändes en atensk koloni dit, men nybyggarna avskars av thrakerna vid Drabeskos."
    - "År 437/436 f.Kr. grundade atenaren Hagnon staden och gav den namnet Amfipolis därför att Strymon flyter runt den på två sidor. Vintern 424 f.Kr. intog spartanen Brasidas den; historikern Thukydides, då atensk general vid Thasos, kom för sent för att rädda den och tillbringade tjugo år i exil. År 422 f.Kr. föll både Brasidas och atenaren Kleon i en strid framför staden, och amfipoliterna begravde Brasidas i staden och hedrade honom som sin grundare i stället för Hagnon. Filippos II av Makedonien intog Amfipolis år 357 f.Kr. Efter Alexanders död höll Kassandros Alexanders änka Roxane och hennes unge son i dess citadell, och omkring 310 f.Kr. lät han döda dem."
    - "Sedan Rom hade besegrat Perseus, Makedoniens siste kung, år 168 f.Kr., tillkännagav Aemilius Paullus ordningen för Makedonien i Amfipolis: landet delades i fyra regioner, och Amfipolis blev huvudstad i den första. Staden låg vid Via Egnatia, och Paulus och Silas, på väg vidare från Filippi, ”foro över Amfipolis och Apollonia” till Tessalonike. Apostlagärningarna säger ingenting om någon vistelse där."
    - "Under senantiken krympte den bebodda staden till den muromgärdade akropolis, där flera basilikor med mosaikgolv och en kyrka med sexkantig plan byggdes på 400- och 500-talen. Grekiska utgrävningar, under många år ledda av Dimitrios Lazaridis, blottlade murarna, gymnasiet och dessa kyrkor. Nära floden står det kolossala marmorlejonet från Amfipolis, ett gravmonument som vanligen dateras till 300-talet f.Kr."
