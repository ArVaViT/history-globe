# Overview article (ADR 0007). Mainstream facts only; the identification of the site is disputed.
# Sheshonq I's campaign is given at its usual date, c. 925 BC.
id: mahanaim
place: ae5bfe9
title:
  en: "Mahanaim"
  ru: "Маханаим"
  uk: "Маханаїм"
  es: "Mahanaim"
  pt: "Maanaim"
  de: "Mahanajim"
  fr: "Mahanaïm"
  it: "Maanaim"
  pl: "Mahanaim"
  nl: "Machanaïm"
  cs: "Machanajim"
body:
  en:
    - 'Mahanaim, "two camps", was a town of Gilead east of the Jordan, near the river Jabbok, today''s Zarqa. Its site is uncertain. The most common proposal, where the map places it, is Tell edh-Dhahab el-Gharbi, the western of two hills around which the Jabbok winds; the eastern hill is often taken for Penuel. Since 2005 a team from the University of Dortmund led by Thomas Pola has dug the western hill, finding traces of occupation from the Late Bronze and early Iron Ages and, on the summit, a palace of the late Hellenistic or early Herodian period.'
    - 'Genesis tells that Jacob, returning from Laban, met the angels of God and said, "This is God''s host", and called the place Mahanaim. In the Book of Joshua the town lies on the border of Gad and the half tribe of Manasseh and is given to the Levites. After Saul fell, Abner, captain of his host, brought Saul''s son Ish-bosheth over to Mahanaim and made him king over Israel; from there Abner went out to Gibeon against David''s servants.'
    - 'When Absalom rebelled, David crossed the Jordan to Mahanaim. Shobi of Rabbah, Machir of Lo-debar and Barzillai the Gileadite brought beds, vessels and food for him and his people, and Barzillai provided for the king while he stayed there. David sat between the two gates of the city waiting for news of the battle in the wood of Ephraim. Under Solomon, Ahinadab the son of Iddo was his officer at Mahanaim. Josephus calls it a very fine and very strong city and renders its name for Greek readers as "The Camps".'
    - "About 925 BC the Egyptian king Sheshonq I, the Shishak of the Bible, named Mahanaim among the places of his campaign in Palestine on the Bubastite Portal at Karnak. No later event is recorded there. In the early fourth century Eusebius listed Mahanaim only as a town of Gad given to the Levites in Gilead, without placing it. On Tell edh-Dhahab el-Gharbi the palace was burned in the later first century BC, and its ruins later fell in an earthquake."
  ru:
    - "Маханаим, «два стана», был городом Галаада на восточном берегу Иордана, у потока Иавок, ныне Зарка. Место его точно не известно. Чаще всего, и так его помещает карта, предлагают Телль-эз-Захаб-эль-Гарби — западный из двух холмов, которые огибает Иавок; восточный холм нередко считают Пенуэлом. С 2005 г. группа Дортмундского университета под руководством Томаса Полы копает западный холм и нашла следы поселения позднего бронзового и раннего железного веков, а на вершине — дворец позднего эллинистического или раннеиродианского времени."
    - "Книга Бытия рассказывает, что Иаков, возвращаясь от Лавана, встретил Ангелов Божиих и сказал: «это ополчение Божие», и нарёк месту имя Маханаим. В книге Иисуса Навина город лежит на границе Гада и половины колена Манассиина и отдан левитам. Когда Саул пал, Авенир, начальник его войска, привёл в Маханаим Иевосфея, сына Саулова, и воцарил его над Израилем; отсюда Авенир вышел в Гаваон против слуг Давида."
    - "Когда восстал Авессалом, Давид перешёл Иордан в Маханаим. Сови из Раввы, Махир из Лодавара и Верзеллий Галаадитянин принесли ему и его людям постели, сосуды и пищу, а Верзеллий продовольствовал царя, пока тот жил здесь. Давид сидел между двумя воротами города, ожидая вестей о сражении в лесу Ефремовом. При Соломоне в Маханаиме был его приставник Ахинадав, сын Гиддо. Иосиф Флавий называет его прекрасным и очень сильным городом и передаёт его имя для греческих читателей как «Станы»."
    - "Около 925 г. до н. э. египетский царь Шешонк I, библейский Сусаким, назвал Маханаим среди мест своего похода в Палестину на Бубастийском портале в Карнаке. Позднейших событий здесь не записано. В начале IV века Евсевий упоминает Маханаим лишь как город Гада, отданный левитам в Галааде, не указывая, где он. На Телль-эз-Захаб-эль-Гарби дворец сгорел во второй половине I века до н. э., а позже его развалины обрушились при землетрясении."
  uk:
    - "Маханаїм, «два табори», було містом Гілеаду на схід від Йордану, поблизу ріки Яббок, сьогоднішньої Зарки. Його місце непевне. Найпоширеніша пропозиція, де мапа його й розміщує, — Телль-ед-Дагаб-ель-Гарбі, західний із двох пагорбів, навколо яких звивається Яббок; східний пагорб часто вважають за Пенуел. Від 2005 р. група Дортмундського університету під керівництвом Томаса Поли розкопує західний пагорб, знаходячи сліди заселення пізньої бронзової та ранньої залізної доби і, на вершині, палац пізньоелліністичного або ранньоіродіянського часу."
    - "Книга Буття розповідає, що Яків, повертаючись від Лавана, зустрів ангелів Божих і сказав: «Се Божий полк», і назвав місце Маханаїм. У Книзі Ісуса Навина місто лежить на межі Гада й половини племені Манасії і віддане левітам. Після загибелі Саула Авенір, гетьман його війська, привів Саулового сина Ішбошета до Маханаїма й зробив його царем над Ізраїлем; звідти Авенір вийшов до Гаваона проти слуг Давида."
    - "Коли Авесалом збунтувався, Давид перейшов Йордан до Маханаїма. Сові з Рабби, Махір з Лодебара та Верзеллій Гілеадянин принесли для нього і його людей ліжка, посуд та їжу, і Верзеллій забезпечував царя, поки той там перебував. Давид сидів між двома брамами міста, чекаючи вістей про битву в лісі Єфремовому. За Соломона Ахінадав, син Іддо, був його урядовцем у Маханаїмі. Йосиф Флавій називає його дуже гарним і дуже міцним містом і передає його назву грецьким читачам як «Табори»."
    - "Близько 925 р. до н. е. єгипетський цар Шешонк I, біблійний Сусакім, назвав Маханаїм серед місць свого походу в Палестині на Бубастійських воротах у Карнаку. Жодної пізнішої події там не записано. На початку IV ст. Євсевій згадував Маханаїм лише як місто Гада, віддане левітам у Гілеаді, не розміщуючи його. На Телль-ед-Дагаб-ель-Гарбі палац було спалено в пізніші роки I ст. до н. е., а його руїни згодом упали від землетрусу."
  es:
    - "Mahanaim, «dos campamentos», era una ciudad de Galaad al este del Jordán, cerca del río Jaboc, el actual Zarqa. Su emplazamiento es incierto. La propuesta más común, donde la sitúa el mapa, es Tell edh-Dhahab el-Gharbi, la occidental de dos colinas en torno a las cuales serpentea el Jaboc; la colina oriental suele tomarse por Peniel. Desde 2005 un equipo de la Universidad de Dortmund dirigido por Thomas Pola excava la colina occidental, y ha hallado huellas de ocupación de los períodos del Bronce Final y del Hierro Antiguo y, en la cima, un palacio de finales del período helenístico o comienzos del herodiano."
    - "Génesis cuenta que Jacob, al volver de Labán, se encontró con los ángeles de Dios y dijo: «El campo de Dios es este», y llamó al lugar Mahanaim. En el libro de Josué, la ciudad se halla en la frontera de Gad y la media tribu de Manasés y se da a los levitas. Tras la caída de Saúl, Abner, jefe de su ejército, llevó a Is-boset, hijo de Saúl, a Mahanaim y lo hizo rey sobre Israel; desde allí Abner salió a Gabaón contra los siervos de David."
    - "Cuando Absalón se rebeló, David cruzó el Jordán hasta Mahanaim. Sobi de Rabá, Maquir de Lo-debar y Barzilai el galaadita trajeron camas, vasijas y alimentos para él y su gente, y Barzilai proveyó al rey mientras permaneció allí. David se sentó entre las dos puertas de la ciudad esperando noticias de la batalla en el bosque de Efraín. Bajo Salomón, Ahinadab, hijo de Iddo, fue su oficial en Mahanaim. Josefo la llama una ciudad muy hermosa y muy fuerte y traduce su nombre para los lectores griegos como «los Campamentos»."
    - "Hacia 925 a. C. el rey egipcio Sheshonq I, el Sisac de la Biblia, nombró Mahanaim entre los lugares de su campaña en Palestina en el Portal Bubastita de Karnak. No se registra ningún suceso posterior allí. A comienzos del siglo IV, Eusebio enumeró Mahanaim solo como una ciudad de Gad dada a los levitas en Galaad, sin situarla. En Tell edh-Dhahab el-Gharbi el palacio fue incendiado a finales del siglo I a. C., y sus ruinas cayeron más tarde en un terremoto."
  pt:
    - "Maanaim, “dois acampamentos”, era uma cidade de Gileade, a leste do Jordão, perto do rio Jaboque, o atual Zarqa. Seu sítio é incerto. A proposta mais comum, onde o mapa a situa, é Tell edh-Dhahab el-Gharbi, a ocidental de duas colinas em torno das quais o Jaboque serpenteia; a colina oriental é muitas vezes tomada por Peniel. Desde 2005, uma equipe da Universidade de Dortmund dirigida por Thomas Pola escava a colina ocidental, encontrando vestígios de ocupação do Bronze Recente e do início da Idade do Ferro e, no cume, um palácio do final do período helenístico ou início do herodiano."
    - "Gênesis conta que Jacó, voltando de Labã, encontrou os anjos de Deus e disse: “Este é o exército de Deus”, e chamou o lugar Maanaim. No livro de Josué, a cidade fica na fronteira de Gade e da meia tribo de Manassés e é dada aos levitas. Depois que Saul caiu, Abner, comandante de seu exército, levou Is-Bosete, filho de Saul, a Maanaim e o fez rei sobre Israel; dali Abner saiu a Gibeão contra os servos de Davi."
    - "Quando Absalão se rebelou, Davi atravessou o Jordão até Maanaim. Sobi de Rabá, Maquir de Lo-Debar e Barzilai, o gileadita, trouxeram camas, vasilhas e alimento para ele e seu povo, e Barzilai proveu o rei enquanto ficou ali. Davi sentou-se entre as duas portas da cidade à espera de notícias da batalha na floresta de Efraim. Sob Salomão, Ainadabe, filho de Ido, era seu oficial em Maanaim. Josefo a chama de cidade belíssima e fortíssima e traduz seu nome para os leitores gregos como “Os Acampamentos”."
    - "Por volta de 925 a.C., o rei egípcio Sheshonq I, o Sisaque da Bíblia, nomeou Maanaim entre os lugares de sua campanha na Palestina no Pórtico Bubastita em Karnak. Nenhum acontecimento posterior ali é registrado. No início do século IV, Eusébio listou Maanaim apenas como uma cidade de Gade dada aos levitas em Gileade, sem situá-la. Em Tell edh-Dhahab el-Gharbi, o palácio foi queimado no final do século I a.C., e suas ruínas desabaram depois num terremoto."
  de:
    - "Mahanajim, „zwei Lager“, war eine Stadt in Gilead östlich des Jordan, nahe dem Fluss Jabbok, dem heutigen Zarqa. Seine Lage ist ungewiss. Der häufigste Vorschlag, wo die Karte es ansetzt, ist Tell edh-Dhahab el-Gharbi, der westliche von zwei Hügeln, um die sich der Jabbok windet; der östliche Hügel wird oft für Penuel gehalten. Seit 2005 gräbt ein Team der Universität Dortmund unter Thomas Pola den westlichen Hügel aus und fand Spuren der Besiedlung aus der Spätbronzezeit und frühen Eisenzeit und auf dem Gipfel einen Palast der späthellenistischen oder frühherodianischen Zeit."
    - "Die Genesis erzählt, dass Jakob auf der Rückkehr von Laban den Engeln Gottes begegnete und sagte: „Es sind Gottes Heere“, und den Ort Mahanajim nannte. Im Buch Josua liegt die Stadt an der Grenze von Gad und dem halben Stamm Manasse und wird den Leviten gegeben. Nach Sauls Fall brachte Abner, sein Feldhauptmann, Sauls Sohn Isch-Boschet nach Mahanajim und machte ihn zum König über Israel; von dort zog Abner nach Gibeon gegen Davids Knechte aus."
    - "Als Absalom sich empörte, überquerte David den Jordan nach Mahanajim. Schobi von Rabba, Machir von Lo-Dabar und Barsillai der Gileaditer brachten Betten, Gefäße und Speise für ihn und sein Volk, und Barsillai versorgte den König, während er dort weilte. David saß zwischen den beiden Toren der Stadt und wartete auf Nachricht von der Schlacht im Wald Ephraim. Unter Salomo war Ahinadab, der Sohn Iddos, sein Amtmann in Mahanajim. Josephus nennt es eine sehr schöne und sehr starke Stadt und gibt seinen Namen griechischen Lesern als „Die Lager“ wieder."
    - "Um 925 v. Chr. nannte der ägyptische König Scheschonq I., der Schischak der Bibel, Mahanajim unter den Orten seines Feldzugs in Palästina auf dem Bubastidenportal in Karnak. Kein späteres Ereignis ist dort verzeichnet. Im frühen 4. Jahrhundert führte Eusebius Mahanajim nur als eine Stadt Gads auf, den Leviten in Gilead gegeben, ohne sie zu lokalisieren. Auf dem Tell edh-Dhahab el-Gharbi wurde der Palast im späteren 1. Jahrhundert v. Chr. niedergebrannt, und seine Ruinen stürzten später bei einem Erdbeben ein."
  fr:
    - "Mahanaïm, « deux camps », était une ville de Galaad à l’est du Jourdain, près du fleuve Jabbok, l’actuel Zarqa. Son site est incertain. La proposition la plus courante, où la carte la place, est Tell edh-Dhahab el-Gharbi, la plus occidentale de deux collines autour desquelles serpente le Jabbok ; la colline orientale est souvent prise pour Peniel. Depuis 2005, une équipe de l’Université de Dortmund dirigée par Thomas Pola a fouillé la colline occidentale, y trouvant des traces d’occupation du Bronze récent et du début de l’âge du Fer et, au sommet, un palais de la fin de l’époque hellénistique ou du début de l’époque hérodienne."
    - "La Genèse raconte que Jacob, revenant de chez Laban, rencontra des anges de Dieu et dit : « C’est le camp de Dieu ! », et donna au lieu le nom de Mahanaïm. Dans le livre de Josué, la ville se trouve à la limite de Gad et de la demi-tribu de Manassé et est donnée aux lévites. Après la chute de Saül, Abner, chef de son armée, fit passer à Mahanaïm Isch-Boscheth, fils de Saül, et le fit roi sur Israël ; de là Abner sortit contre les serviteurs de David à Gabaon."
    - "Quand Absalom se révolta, David passa le Jourdain jusqu’à Mahanaïm. Schobi de Rabba, Makir de Lo-Debar et Barzillaï le Galaadite lui apportèrent, à lui et à son peuple, des lits, des vases et des vivres, et Barzillaï entretint le roi pendant son séjour. David s’assit entre les deux portes de la ville en attendant des nouvelles de la bataille dans la forêt d’Éphraïm. Sous Salomon, Achinadab, fils d’Iddo, était son officier à Mahanaïm. Flavius Josèphe l’appelle une très belle et très forte ville et rend son nom pour les lecteurs grecs par « Les Camps »."
    - "Vers 925 av. J.-C., le roi égyptien Sheshonq Ier, le Schischak de la Bible, nomma Mahanaïm parmi les lieux de sa campagne en Palestine sur le portail bubastide de Karnak. Aucun événement postérieur n’y est consigné. Au début du IVe siècle, Eusèbe ne mentionnait Mahanaïm que comme une ville de Gad donnée aux lévites en Galaad, sans la situer. À Tell edh-Dhahab el-Gharbi, le palais fut incendié à la fin du Ier siècle av. J.-C., et ses ruines s’effondrèrent plus tard dans un tremblement de terre."
  it:
    - "Maanaim, «due accampamenti», era una città di Galaad a est del Giordano, vicino al fiume Iabbok, l’odierno Zarqa. Il suo sito è incerto. La proposta più comune, dove la mappa la colloca, è Tell edh-Dhahab el-Gharbi, la più occidentale di due colline intorno a cui serpeggia lo Iabbok; la collina orientale è spesso ritenuta Penuel. Dal 2005 una squadra dell’Università di Dortmund guidata da Thomas Pola scava la collina occidentale, trovando tracce di occupazione del Bronzo Tardo e del primo Ferro e, sulla sommità, un palazzo della tarda età ellenistica o della prima età erodiana."
    - "La Genesi racconta che Giacobbe, tornando da Laban, incontrò gli angeli di Dio e disse: «Questo è il campo di Dio», e chiamò il luogo Maanaim. Nel libro di Giosuè la città si trova sul confine di Gad e della mezza tribù di Manasse e viene data ai leviti. Dopo la caduta di Saul, Abner, capo del suo esercito, fece passare a Maanaim Is-Baal, figlio di Saul, e lo fece re su Israele; di là Abner uscì verso Gabaon contro i servi di Davide."
    - "Quando Assalonne si ribellò, Davide attraversò il Giordano fino a Maanaim. Sobi di Rabba, Machir di Lo-Debar e Barzillai il Galaadita gli portarono letti, vasi e cibo per lui e per la sua gente, e Barzillai provvide al re mentre rimase là. Davide sedette fra le due porte della città in attesa di notizie della battaglia nella foresta di Efraim. Sotto Salomone, Achinadab figlio di Iddo era suo funzionario a Maanaim. Giuseppe Flavio la chiama una città bellissima e fortissima e rende il suo nome per i lettori greci come «Gli Accampamenti»."
    - "Verso il 925 a.C. il re egiziano Sheshonq I, il Sisak della Bibbia, nominò Maanaim tra i luoghi della sua campagna in Palestina sul Portale bubastita a Karnak. Nessun evento successivo vi è registrato. All’inizio del IV secolo Eusebio elencava Maanaim solo come città di Gad data ai leviti in Galaad, senza localizzarla. A Tell edh-Dhahab el-Gharbi il palazzo fu bruciato nel tardo I secolo a.C., e le sue rovine crollarono poi per un terremoto."
  pl:
    - "Mahanaim, „dwa obozy”, było miastem w Gileadzie na wschód od Jordanu, blisko rzeki Jabbok, dzisiejszej Zarki. Jego położenie jest niepewne. Najczęstsza propozycja, tam gdzie umieszcza je mapa, to Tell edh-Dhahab el-Gharbi, zachodnie z dwóch wzgórz, wokół których wije się Jabbok; wschodnie wzgórze często uważa się za Penuel. Od 2005 r. zespół Uniwersytetu w Dortmundzie pod kierunkiem Thomasa Poli prowadzi wykopaliska na zachodnim wzgórzu, znajdując ślady osadnictwa z późnej epoki brązu i wczesnej epoki żelaza, a na szczycie pałac z późnego okresu hellenistycznego lub wczesnego herodiańskiego."
    - "Księga Rodzaju opowiada, że Jakub, wracając od Labana, spotkał aniołów Bożych i rzekł: „Obóz to Boży”, i nazwał to miejsce Mahanaim. W Księdze Jozuego miasto leży na granicy Gada i połowy pokolenia Manassesa i zostaje oddane Lewitom. Po śmierci Saula Abner, dowódca jego wojska, przyprowadził syna Saula, Isz-Boszeta, do Mahanaim i ustanowił go królem nad Izraelem; stamtąd Abner wyruszył do Gibeonu przeciw sługom Dawida."
    - "Gdy Absalom się zbuntował, Dawid przeprawił się przez Jordan do Mahanaim. Szobi z Rabby, Makir z Lo-Debar i Barzillaj Gileadczyk przynieśli dla niego i jego ludu łóżka, naczynia i żywność, a Barzillaj zaopatrywał króla, dopóki tam przebywał. Dawid siedział między dwiema bramami miasta, czekając wieści o bitwie w lesie Efraim. Za Salomona Achinadab, syn Iddo, był jego urzędnikiem w Mahanaim. Józef Flawiusz nazywa je miastem bardzo pięknym i bardzo mocnym i oddaje jego nazwę greckim czytelnikom jako „Obozy”."
    - "Około 925 r. p.n.e. egipski król Szeszonk I, biblijny Sziszak, wymienił Mahanaim wśród miejsc swojej wyprawy do Palestyny na Portalu Bubastydów w Karnaku. Żadne późniejsze wydarzenie nie jest tam zapisane. Na początku IV w. Euzebiusz wymieniał Mahanaim tylko jako miasto Gada oddane Lewitom w Gileadzie, bez jego umiejscowienia. Na Tell edh-Dhahab el-Gharbi pałac spłonął w późniejszym I w. p.n.e., a jego ruiny runęły potem w trzęsieniu ziemi."
  nl:
    - "Machanaïm, “twee kampen”, was een stad in Gilead ten oosten van de Jordaan, nabij de rivier Jabbok, de huidige Zarqa. De ligging is onzeker. Het meest voorkomende voorstel, waar de kaart het plaatst, is Tell edh-Dhahab el-Gharbi, de westelijke van twee heuvels waaromheen de Jabbok kronkelt; de oostelijke heuvel wordt vaak voor Peniël gehouden. Sinds 2005 graaft een team van de Universiteit van Dortmund onder leiding van Thomas Pola de westelijke heuvel op, waarbij sporen van bewoning uit de late bronstijd en de vroege ijzertijd zijn gevonden en, op de top, een paleis uit de late hellenistische of vroeg-Herodiaanse tijd."
    - "Genesis vertelt dat Jakob, terugkerend van Laban, de engelen Gods ontmoette en zei: “Dit is een heirleger Gods!”, en de plaats Machanaïm noemde. In het boek Jozua ligt de stad op de grens van Gad en de halve stam Manasse en wordt zij aan de Levieten gegeven. Nadat Saul gevallen was, bracht Abner, de bevelhebber van zijn leger, Sauls zoon Isboset over naar Machanaïm en maakte hem koning over Israël; vandaar trok Abner uit naar Gibeon tegen Davids dienaren."
    - "Toen Absalom in opstand kwam, stak David de Jordaan over naar Machanaïm. Sobi van Rabba, Machir van Lo-Debar en Barzillai de Gileadiet brachten bedden, vaten en voedsel voor hem en zijn volk, en Barzillai voorzag de koning terwijl hij daar verbleef. David zat tussen de twee poorten van de stad te wachten op bericht van de strijd in het woud van Efraïm. Onder Salomo was Achinadab, de zoon van Iddo, zijn bevelhebber te Machanaïm. Josephus noemt het een zeer mooie en zeer sterke stad en geeft de naam voor Griekse lezers weer als “De Legerplaatsen”."
    - "Omstreeks 925 v.Chr. noemde de Egyptische koning Sjosjenq I, de Sisak van de Bijbel, Machanaïm onder de plaatsen van zijn veldtocht in Palestina op het Bubastitische Portaal in Karnak. Geen latere gebeurtenis is er vastgelegd. In het begin van de vierde eeuw noemde Eusebius Machanaïm alleen als een stad van Gad die in Gilead aan de Levieten was gegeven, zonder haar te lokaliseren. Op Tell edh-Dhahab el-Gharbi werd het paleis in de late eerste eeuw v.Chr. verbrand, en zijn ruïnes stortten later in door een aardbeving."
  cs:
    - "Machanajim, „dva tábory“, bylo město Gileadu východně od Jordánu, poblíž řeky Jabok, dnešního Zarqá. Jeho poloha je nejistá. Nejčastější návrh, kam jej mapa klade, je Tell edh-Dhahab el-Gharbi, západní ze dvou pahorků, kolem nichž se Jabok vine; východní pahorek se často pokládá za Penuel. Od roku 2005 vykopává západní pahorek tým Univerzity v Dortmundu vedený Thomasem Polou, který nalezl stopy osídlení z pozdní doby bronzové a časné doby železné a na vrcholu palác z pozdní helénistické nebo časné herodovské doby."
    - "Genesis vypráví, že Jákob, vraceje se od Labana, potkal anděly Boží a řekl: „Vojsko Boží jest toto“, a nazval místo Machanajim. V Knize Jozue leží město na hranici Gádu a polokmene Manasesova a je dáno levitům. Po Saulově pádu přivedl Abner, hejtman jeho vojska, Saulova syna Íš-bošeta do Machanajimu a učinil ho králem nad Izraelem; odtud Abner vytáhl do Gibeonu proti Davidovým služebníkům."
    - "Když se Abšalom vzbouřil, přešel David Jordán do Machanajimu. Šobi z Rabby, Machír z Lo-debaru a Barzilaj Gileadský přinesli lůžka, nádoby a jídlo pro něj a jeho lid a Barzilaj opatroval krále, dokud tam pobýval. David seděl mezi dvěma branami města a čekal na zprávy o bitvě v lese Efrajim. Za Šalomouna byl Achinadab, syn Idův, jeho úředníkem v Machanajimu. Josephus je nazývá velmi krásným a velmi silným městem a jeho jméno vykládá řeckým čtenářům jako „Tábory“."
    - "Kolem roku 925 př. n. l. jmenoval egyptský král Šošenk I., biblický Šíšak, Machanajim mezi místy svého tažení v Palestině na Bubastské bráně v Karnaku. Žádná pozdější událost tam není zaznamenána. Na počátku 4. století uváděl Eusebius Machanajim jen jako město Gádu dané levitům v Gileadu, aniž je umístil. Na Tell edh-Dhahab el-Gharbi byl palác vypálen v pozdějším 1. století př. n. l. a jeho zříceniny později padly při zemětřesení."
