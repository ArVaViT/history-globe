body:
  en:
    - 'Gilead is the hill country east of the Jordan between the Yarmuk in the north and the plateau of Moab in the south, rising to about 1,200 m above the deep rift of the valley and cut in two by the gorge of the Jabbok. Well watered and wooded with oak and pine, it was pasture and grain land, "a place for cattle" as the tribes of Reuben and Gad saw it, and famous for its balm: the Ishmaelites who bought Joseph came "from Gilead with their camels bearing spicery and balm and myrrh", and Jeremiah asks, "Is there no balm in Gilead; is there no physician there?" The name can mean the whole land east of the Jordan or only the half north or south of the Jabbok.'
    - 'Laban overtook Jacob "in the mount Gilead", and Jacob crossed the Jabbok at Peniel on his way home. Moses took Gilead from Sihon and Og and gave it to Reuben, Gad and the half-tribe of Manasseh, whose clan Machir "went to Gilead, and took it". Jephthah the Gileadite delivered it from the Ammonites; the men of Jabesh-gilead were rescued by Saul and later buried his bones; Ish-bosheth reigned from Mahanaim, where David too took refuge from Absalom and was fed by Barzillai the Gileadite. Elijah "the Tishbite, who was of the inhabitants of Gilead" came from here, though Tishbe has not been found with certainty.'
    - 'Ramoth-gilead was the fortress Israel and Damascus fought over: Ahab was mortally wounded there, and Jehu was anointed there. Hazael "smote them in all the coasts of Israel; From Jordan eastward, all the land of Gilead", and Amos says Damascus "threshed Gilead with threshing instruments of iron" and Ammon ripped up its women with child. In 733–732 BC Tiglath-pileser III took Gilead and carried its people to Assyria; his summary inscription, in a damaged line usually restored as naming Gilead, lists the towns on the border of Israel that he annexed. Hosea calls Gilead "a city of them that work iniquity", yet Micah and Jeremiah hope that Israel will feed again in Bashan and Gilead "as in the days of old".'
    - "In the Hellenistic and Roman periods northern Gilead held the cities of the Decapolis, Gerasa (Jerash), Pella and Gadara, and the south was the Peraea of Herod Antipas, where John the Baptist was imprisoned at Machaerus. Eusebius says the Christians of Jerusalem fled to Pella before the war of AD 66–70. Today Gilead is the north-west of Jordan: the governorates of Irbid, Ajloun, Jerash and Balqa, with the towns of Ajloun and Salt and the ruins of Jerash."
  ru:
    - "Галаад — нагорье к востоку от Иордана между Ярмуком на севере и плато Моава на юге, поднимающееся примерно до 1200 м над глубокой впадиной долины и рассечённое надвое ущельем Иавока. Обильная водой, поросшая дубом и сосной, эта земля была пастбищем и хлебным краем, «место годное для стад», как увидели её колена Рувима и Гада, и славилась бальзамом: Измаильтяне, купившие Иосифа, шли «из Галаада», и «верблюды их несут стираксу, бальзам и ладан», а Иеремия спрашивает: «Разве нет бальзама в Галааде? разве нет там врача?» Имя может означать всю землю за Иорданом или только половину к северу или к югу от Иавока."
    - "Лаван догнал Иакова «на горе Галаад», а Иаков на пути домой перешёл Иавок у Пенуэла. Моисей отнял Галаад у Сигона и Ога и отдал его Рувиму, Гаду и половине колена Манассиина, чей род Махира пошёл «в Галаад, и взяли его». Иеффай Галаадитянин избавил его от Аммонитян; жителей Иависа Галаадского выручил Саул, и позже они погребли его кости; Иевосфей царствовал из Маханаима, где и Давид укрылся от Авессалома и где его кормил Верзеллий Галаадитянин. Отсюда был Илия «Фесвитянин, из жителей Галаадских», хотя Фесву так и не нашли с уверенностью."
    - "Рамоф Галаадский был крепостью, за которую бились Израиль и Дамаск: там был смертельно ранен Ахав и там помазан Ииуй. Азаил поражал Израильтян «на восток от Иордана, всю землю Галаад», и Амос говорит о Дамаске: «они молотили Галаад железными молотилами», а Аммон рассекал там беременных. В 733–732 гг. до н. э. Феглаффелласар III взял Галаад и переселил его жителей в Ассирию; его сводная надпись в повреждённой строке, которую обычно восстанавливают как упоминание Галаада, перечисляет города на рубеже Израиля, которые он присоединил к Ассирии. Осия называет Галаад «город нечестивцев», но Михей и Иеремия надеются, что Израиль снова будет пастись на Васане и Галааде, «как во дни древние»."
    - "В эллинистическое и римское время на севере Галаада стояли города Десятиградия — Гераса (Джераш), Пелла и Гадара, а юг был Переей Ирода Антипы, где в Махероне сидел в темнице Иоанн Креститель. Евсевий говорит, что христиане Иерусалима бежали в Пеллу перед войной 66–70 гг. н. э. Сегодня Галаад — северо-запад Иордании: провинции Ирбид, Аджлун, Джераш и Эль-Балка с городами Аджлун и Эс-Салт и развалинами Джераша."
  uk:
    - "Гілеад — гірський край на схід від Йордану між Ярмуком на півночі й плато Моава на півдні, що здіймається приблизно до 1200 м над глибоким рифтом долини й розтятий надвоє ущелиною Яббоку. Добре зрошений і порослий дубами й соснами, він був пасовищем і хлібною землею: коліна Рувима й Гада бачили, що ці землі «як раз годяться про скотину», — і славився своїм бальзамом: ізмаїльтяни, які купили Йосипа, прийшли «від Галааду з верблюдами своїми, везучи бурштин, бальзам та ладан», а Єремія питає: «Чи то ж нема балзаму в Галаадї? чи то ж нема там лїкаря?» Назва може означати всю землю на схід від Йордану або лише північну чи південну половину від Яббоку."
    - "Лаван наздогнав Якова «на Галаад горах», а Яків перейшов Яббок у Пенуїлі по дорозі додому. Мойсей узяв Гілеад у Сігона й Ога й віддав Рувимові, Гадові та половині коліна Манасії, а сини Махіра, його роду, «двинули на Гілеад і заняли його». Єфтай Гілеадянин визволив його від аммонітян; люди Явіса Гілеадського були врятовані Саулом і пізніше поховали його кості; Ішбошет царював з Маханаїма, де й Давид знайшов притулок від Авесалома, і його годував Верзеллій Гілеадянин. Ілля, «Тесбій, із горожан Галаадських» походив звідси, хоча Тішбе не знайдено напевно."
    - "Рамот Гілеадський був фортецею, за яку билися Ізраїль і Дамаск: Ахава там смертельно поранено, а Єгу там помазано. Азаїл «побивав їх ... у всїх гряницях займища Ізрайлевого Від Йорданї на схід сонця всю землю Галаад», а Амос каже, що дамаскіни «молотили Галаад залїзними возами молотільними» і що аммонітяни розпорювали вагітних жінок. У 733–732 рр. до н. е. Тіглатпаласар III узяв Гілеад і вивів його людей до Ассирії; його підсумковий напис у пошкодженому рядку, який зазвичай відновлюють як згадку про Гілеад, перелічує міста на межі Ізраїлю, які він анексував. Осія називає Гілеад «містом безбожників», та Міха й Єремія сподіваються, що Ізраїль знову пастиметься в Башані й Гілеаді «як се було в давнезні давна»."
    - "В елліністичну й римську доби північний Гілеад мав міста Десятимістя: Герасу (Джераш), Пеллу й Гадару, а на півдні була Перея Ірода Антипи, де Івана Хрестителя ув’язнили в Махероні. Євсевій каже, що християни Єрусалима втекли до Пелли перед війною 66–70 рр. н. е. Сьогодні Гілеад — північний захід Йорданії: губернаторства Ірбід, Аджлун, Джераш і Балка, з містами Аджлун і Ес-Сальт та руїнами Джераша."
  es:
    - "Galaad es la región montañosa al este del Jordán entre el Yarmuk, al norte, y la meseta de Moab, al sur, que se eleva hasta unos 1200 m sobre el hondo valle del rift y está cortada en dos por la garganta del Jaboc. Bien regada y poblada de robles y pinos, era tierra de pastos y de grano, «lugar de ganado» como la vieron las tribus de Rubén y de Gad, y famosa por su bálsamo: los ismaelitas que compraron a José venían «de Galaad, y sus camellos traían aromas y bálsamo y mirra», y Jeremías pregunta: «¿No hay bálsamo en Galaad? ¿no hay allí médico?». El nombre puede designar toda la tierra al este del Jordán o solo la mitad norte o sur del Jaboc."
    - "Labán alcanzó a Jacob «en el monte de Galaad», y Jacob cruzó el Jaboc en Peniel de camino a casa. Moisés tomó Galaad a Sehón y a Og y la dio a Rubén, a Gad y a la media tribu de Manasés, cuyo clan Maquir «fueron á Galaad, y tomáronla». Jefté el galaadita la libró de los amonitas; los hombres de Jabes de Galaad fueron socorridos por Saúl y más tarde sepultaron sus huesos; Is-boset reinó desde Mahanaim, donde también David se refugió de Absalón y fue alimentado por Barzilai el galaadita. De aquí vino Elías, «Thisbita, que era de los moradores de Galaad», aunque Tisbe no se ha hallado con certeza."
    - "Ramot de Galaad era la fortaleza que se disputaban Israel y Damasco: allí fue herido de muerte Acab y allí fue ungido Jehú. De Hazael se dice: «hiriólos Hazael en todos los términos de Israel, desde el Jordán al nacimiento del sol, toda la tierra de Galaad», y Amós dice que Damasco «trillaron á Galaad con trillos de hierro» y que Amón abrió a las mujeres encinta de Galaad. En 733–732 a. C. Tiglat-pileser III tomó Galaad y llevó a su gente a Asiria; su inscripción sumaria, en una línea dañada que suele restituirse como mención de Galaad, enumera las ciudades fronterizas de Israel que anexó. Oseas llama a Galaad «ciudad de obradores de iniquidad», y sin embargo Miqueas y Jeremías esperan que Israel vuelva a pastar en Basán y Galaad «como en el tiempo pasado»."
    - "En las épocas helenística y romana el norte de Galaad contenía las ciudades de la Decápolis Gerasa (Jerash), Pella y Gadara, y el sur era la Perea de Herodes Antipas, donde Juan el Bautista fue encarcelado en Maqueronte. Eusebio dice que los cristianos de Jerusalén huyeron a Pella antes de la guerra de 66–70 d. C. Hoy Galaad es el noroeste de Jordania: las gobernaciones de Irbid, Ajlun, Jerash y Balqa, con las ciudades de Ajlun y Salt y las ruinas de Jerash."
  pt:
    - "Gileade é a região montanhosa a leste do Jordão entre o Yarmuk, ao norte, e o planalto de Moabe, ao sul, que se eleva a cerca de 1.200 m acima da profunda fenda do vale e é cortada em duas pela garganta do Jaboque. Bem irrigada e coberta de carvalhos e pinheiros, era terra de pasto e de grãos, “um lugar para gado” como a viram as tribos de Rúben e Gade, e famosa por seu bálsamo: os ismaelitas que compraram José vinham “de Gileade, com seus camelos carregando especiarias, bálsamo e mirra”, e Jeremias pergunta: “Não há bálsamo em Gileade? Não há médico lá?” O nome pode designar toda a terra a leste do Jordão ou apenas a metade norte ou sul do Jaboque."
    - "Labã alcançou Jacó “na montanha de Gileade”, e Jacó atravessou o Jaboque em Peniel a caminho de casa. Moisés tomou Gileade de Seom e Ogue e a deu a Rúben, Gade e à meia tribo de Manassés, cujo clã, os filhos de Maquir, “foram para Gileade, a tomaram”. Jefté, o gileadita, a libertou dos amonitas; os homens de Jabes-Gileade foram socorridos por Saul e mais tarde sepultaram seus ossos; Is-Bosete reinou desde Maanaim, onde também Davi se refugiou de Absalão e foi alimentado por Barzilai, o gileadita. Elias, “o tesbita, que era um dos moradores de Gileade”, veio daqui, embora Tisbe não tenha sido encontrada com certeza."
    - "Ramote-Gileade era a fortaleza pela qual Israel e Damasco combatiam: Acabe foi ali ferido de morte, e Jeú foi ali ungido. Hazael feriu Israel “desde o Jordão para o leste, toda a terra de Gileade”, e Amós diz que Damasco e seus homens “trilharam Gileade com trilhos de ferro” e que Amom rasgou as grávidas de seu povo. Em 733–732 a.C., Tiglate-Pileser III tomou Gileade e levou o seu povo para a Assíria; sua inscrição-resumo, numa linha danificada que costuma ser restaurada como menção a Gileade, enumera as cidades da fronteira de Israel que ele anexou. Oseias diz que “Gileade é uma cidade dos que praticam a iniquidade”, e no entanto Miqueias e Jeremias esperam que Israel volte a pastar “em Basã e Gileade, como nos tempos antigos”."
    - "Nos períodos helenístico e romano, o norte de Gileade abrigou as cidades da Decápolis, Gerasa (Jerash), Pela e Gadara, e o sul era a Pereia de Herodes Antipas, onde João Batista foi preso em Maqueronte. Eusébio diz que os cristãos de Jerusalém fugiram para Pela antes da guerra de 66–70 d.C. Hoje Gileade é o noroeste da Jordânia: as províncias de Irbid, Ajloun, Jerash e Balqa, com as cidades de Ajloun e Salt e as ruínas de Jerash."
  de:
    - "Gilead ist das Bergland östlich des Jordan zwischen dem Jarmuk im Norden und der Hochebene von Moab im Süden, bis etwa 1200 m über dem tiefen Grabenbruch des Tals ansteigend und von der Schlucht des Jabbok in zwei Teile geschnitten. Gut bewässert und mit Eichen und Kiefern bewaldet, war es Weide- und Ackerland, „gute Stätte für ihr Vieh“, wie die Stämme Ruben und Gad es sahen, und berühmt für seinen Balsam: Die Ismaeliter, die Josef kauften, kamen „von Gilead mit ihren Kamelen; die trugen Würze, Balsam und Myrrhe“, und Jeremia fragt: „Ist denn keine Salbe in Gilead, oder ist kein Arzt da?“ Der Name kann das ganze Land östlich des Jordan oder nur die nördliche oder südliche Hälfte beiderseits des Jabbok bedeuten."
    - "Laban ereilte Jakob „auf dem Berge Gilead“, und Jakob überquerte den Jabbok bei Penuel auf dem Heimweg. Mose nahm Gilead Sihon und Og ab und gab es Ruben, Gad und dem halben Stamm Manasse, dessen Sippe Machir „nach Gilead“ ging und es „gewann“. Jeftah, der Gileaditer, befreite es von den Ammonitern; die Männer von Jabesch in Gilead wurden von Saul gerettet und bestatteten später seine Gebeine; Isch-Boschet herrschte von Mahanajim aus, wohin auch David vor Absalom floh und von Barsillai, dem Gileaditer, versorgt wurde. Elia, „der Thisbiter, aus den Bürgern Gileads“, stammte von hier, obwohl Tischbe nicht sicher gefunden ist."
    - "Ramot in Gilead war die Festung, um die Israel und Damaskus kämpften: Ahab wurde dort tödlich verwundet, und Jehu wurde dort gesalbt. Hasaël „schlug sie in allen Grenzen Israels, vom Jordan gegen der Sonne Aufgang, das Land Gilead“, und Amos sagt, Damaskus habe „Gilead mit eisernen Zacken gedroschen“ und Ammon habe seine schwangeren Frauen aufgeschlitzt. 733–732 v. Chr. nahm Tiglat-Pileser III. Gilead ein und führte seine Bewohner nach Assyrien; seine Sammelinschrift zählt in einer beschädigten Zeile, die gewöhnlich mit dem Namen Gilead ergänzt wird, die Städte an Israels Grenze auf, die er annektierte. Hosea nennt Gilead „eine Stadt voll Abgötterei und Blutschulden“, doch Micha und Jeremia hoffen, dass Israel wieder in Baschan und Gilead weiden wird, „wie vor alters“."
    - "In hellenistischer und römischer Zeit lagen im nördlichen Gilead die Städte der Dekapolis Gerasa (Dscherasch), Pella und Gadara, und der Süden war die Peräa des Herodes Antipas, wo Johannes der Täufer in Machärus gefangen saß. Eusebius sagt, die Christen Jerusalems seien vor dem Krieg von 66–70 n. Chr. nach Pella geflohen. Heute ist Gilead der Nordwesten Jordaniens: die Gouvernements Irbid, Adschlun, Dscherasch und Balqa mit den Städten Adschlun und Salt und den Ruinen von Dscherasch."
  fr:
    - "Galaad est le pays de collines à l’est du Jourdain, entre le Yarmouk au nord et le plateau de Moab au sud, s’élevant à environ 1 200 m au-dessus du profond fossé de la vallée et coupé en deux par la gorge du Jabbok. Bien arrosé et boisé de chênes et de pins, c’était un pays de pâturages et de céréales, « un lieu propre pour des troupeaux » aux yeux des tribus de Ruben et de Gad, et réputé pour son baume : les Ismaélites qui achetèrent Joseph venaient de Galaad, leurs chameaux « chargés d’aromates, de baume et de myrrhe », et Jérémie demande : « N’y a-t-il point de baume en Galaad ? N’y a-t-il point de médecin ? » Le nom peut désigner tout le pays à l’est du Jourdain ou seulement la moitié nord ou sud du Jabbok."
    - "Laban atteignit Jacob « à la montagne de Galaad », et Jacob traversa le Jabbok à Peniel en rentrant chez lui. Moïse prit Galaad à Sihon et à Og et la donna à Ruben, à Gad et à la demi-tribu de Manassé, dont les fils de Makir « marchèrent contre Galaad, et s’en emparèrent ». Jephté le Galaadite la délivra des Ammonites ; les hommes de Jabès en Galaad furent secourus par Saül et enterrèrent plus tard ses os ; Isch-Boscheth régna depuis Mahanaïm, où David aussi se réfugia devant Absalom et fut nourri par Barzillaï le Galaadite. Élie, « le Thischbite, l’un des habitants de Galaad », en venait, bien que Thischbé n’ait pas été retrouvée avec certitude."
    - "Ramoth en Galaad était la forteresse que se disputaient Israël et Damas : Achab y fut mortellement blessé, et Jéhu y fut oint. Hazaël « les battit sur toute la frontière d’Israël. Depuis le Jourdain, vers le soleil levant, il battit tout le pays de Galaad », et Amos dit que Damas a foulé Galaad « sous des traîneaux de fer » et qu’Ammon a « fendu le ventre des femmes enceintes de Galaad ». En 733–732 av. J.-C., Tiglath-Piléser III prit Galaad et déporta ses habitants en Assyrie ; son inscription récapitulative, dans une ligne endommagée que l’on restitue d’ordinaire avec le nom de Galaad, énumère les villes de la frontière d’Israël qu’il annexa. Osée appelle Galaad « une ville de malfaiteurs », et pourtant Michée et Jérémie espèrent qu’Israël paîtra de nouveau en Basan et en Galaad « comme au jour d’autrefois »."
    - "À l’époque hellénistique et romaine, le nord de Galaad comptait les cités de la Décapole, Gérasa (Jerash), Pella et Gadara, et le sud était la Pérée d’Hérode Antipas, où Jean-Baptiste fut emprisonné à Machéronte. Eusèbe dit que les chrétiens de Jérusalem s’enfuirent à Pella avant la guerre de 66–70 apr. J.-C. Aujourd’hui, Galaad est le nord-ouest de la Jordanie : les gouvernorats d’Irbid, d’Ajloun, de Jerash et de Balqa, avec les villes d’Ajloun et de Salt et les ruines de Jerash."
  pl:
    - "Gilead to górzysty kraj na wschód od Jordanu między Jarmukiem na północy a płaskowyżem Moabu na południu, wznoszący się do około 1200 m nad głębokim rowem doliny i przecięty na dwoje wąwozem Jabboku. Dobrze nawodniony i porośnięty dębami i sosnami, był krajem pastwisk i zbóż; pokolenia Rubena i Gada zobaczyły, „że miejsce ono było sposobne dla bydła”, a słynął z balsamu: Izmaelici, którzy kupili Józefa, szli „z Galaad; a wielbłądy ich niosły korzenie, i kadzidło, i myrrę”, a Jeremiasz pyta: „Izali niemasz balsamu w Galaad? Izali tam niemasz lekarza?”. Nazwa może oznaczać cały kraj na wschód od Jordanu albo tylko połowę na północ lub południe od Jabboku."
    - "Laban dogonił Jakuba „na górze Galaad”, a Jakub przeprawił się przez Jabbok w Penuel w drodze do domu. Mojżesz zabrał Gilead Sychonowi i Ogowi i dał go Rubenowi, Gadowi i połowie pokolenia Manassesa, którego ród Makira: „Wtargnęli też synowie Machyra, syna Manasesowego, do Galaad, a wziąwszy je, wygnali Amorejczyka”. Jefte Gileadczyk wybawił go od Ammonitów; ludzie z Jabesz-Gilead zostali ocaleni przez Saula i później pochowali jego kości; Isz-Boszet panował z Mahanaim, gdzie też Dawid szukał schronienia przed Absalomem i był karmiony przez Barzillaja Gileadczyka. Stąd pochodził „Elijasz Tesbita, jeden z obywateli Galaadu”, choć Tiszbe nie odnaleziono z pewnością."
    - "Ramot w Gileadzie było twierdzą, o którą walczyły Izrael i Damaszek: Achab został tam śmiertelnie ranny, a Jehu namaszczony. Chazael „poraził ... po wszystkich granicach Izraelskich: Od Jordanu aż na wschód słońca, wszystkę ziemię Galaadską”, a Amos mówi o Damaszku, że jego ludzie „młócili wozami żelaznemi Galaada”, a Ammon rozpruwał brzemienne kobiety. W latach 733–732 p.n.e. Tiglat-Pileser III zajął Gilead i uprowadził jego lud do Asyrii; jego napis zbiorczy, w uszkodzonym wierszu zwykle uzupełnianym nazwą Gilead, wylicza miasta na granicy Izraela, które przyłączył. Ozeasz nazywa Gilead: „Galaad jest miastem czyniących nieprawość”, a jednak Mika i Jeremiasz mają nadzieję, że Izrael znów będzie się pasł w Baszanie i Gileadzie „jako za dni starodawnych”."
    - "W okresie hellenistycznym i rzymskim północny Gilead mieścił miasta Dekapolu, Gerasę (Dżerasz), Pellę i Gadarę, a południe było Pereą Heroda Antypasa, gdzie Jan Chrzciciel był więziony w Macheroncie. Euzebiusz mówi, że chrześcijanie z Jerozolimy uciekli do Pelli przed wojną z lat 66–70 n.e. Dziś Gilead to północny zachód Jordanii: prowincje Irbid, Adżlun, Dżerasz i Balka, z miastami Adżlun i as-Salt oraz ruinami Dżerasz."
  it:
    - "Galaad è la regione collinosa a est del Giordano fra lo Yarmuk a nord e l’altopiano di Moab a sud, che si innalza fino a circa 1200 m sopra la profonda spaccatura della valle ed è divisa in due dalla gola dello Iabbok. Ben irrigata e boscosa di querce e pini, era terra di pascolo e di grano, «luoghi da bestiame» come la vedevano le tribù di Ruben e di Gad, e famosa per il suo balsamo: gli Ismaeliti che comprarono Giuseppe venivano da Galaad «coi suoi cammelli carichi di aromi, di balsamo e di mirra», e Geremia chiede: «Non v’è egli balsamo in Galaad? Non v’è egli colà alcun medico?» Il nome può indicare l’intera terra a est del Giordano o solo la metà a nord o a sud dello Iabbok."
    - "Labano raggiunse Giacobbe «al monte di Galaad», e Giacobbe attraversò lo Iabbok a Penuel nel viaggio di ritorno. Mosè prese Galaad a Sicon e a Og e la diede a Ruben, a Gad e alla mezza tribù di Manasse, i cui figli di Machir «andarono nel paese di Galaad, lo presero». Iefte il Galaadita la liberò dagli Ammoniti; gli uomini di Iabes di Galaad furono salvati da Saul e più tardi seppellirono le sue ossa; Is-Baal regnò da Maanaim, dove si rifugiò anche Davide a causa di Assalonne e fu nutrito da Barzillai il Galaadita. Da qui venne Elia, «il Tishbita, uno di quelli che s’erano stabiliti in Galaad», benché Tisbe non sia stata trovata con certezza."
    - "Ramot di Galaad era la fortezza per cui Israele e Damasco combatterono: Acab vi fu ferito a morte, e Ieu vi fu unto. Cazaèl «sconfisse gl’Israeliti su tutta la loro frontiera: dal Giordano, verso oriente, soggiogò tutto il paese di Galaad», e Amos dice che Damasco calpestò Galaad «con trebbie di ferro» e che Ammon sventrò le sue donne incinte. Nel 733–732 a.C. Tiglat-Pilèser III prese Galaad e deportò il suo popolo in Assiria; la sua iscrizione sommaria, in una riga danneggiata che di solito si integra con il nome di Galaad, elenca le città sul confine d’Israele che annesse. Osea chiama Galaad «una città d’operatori d’iniquità», eppure Michea e Geremia sperano che Israele pascoli di nuovo in Basan e in Galaad «come ai giorni antichi»."
    - "In età ellenistica e romana la Galaad settentrionale ospitava le città della Decapoli, Gerasa (Jerash), Pella e Gadara, e il sud era la Perea di Erode Antipa, dove Giovanni Battista fu imprigionato a Macheronte. Eusebio dice che i cristiani di Gerusalemme fuggirono a Pella prima della guerra del 66–70 d.C. Oggi Galaad è il nord-ovest della Giordania: i governatorati di Irbid, Ajloun, Jerash e Balqa, con le città di Ajloun e Salt e le rovine di Jerash."
  nl:
    - "Gilead is het bergland ten oosten van de Jordaan tussen de Yarmuk in het noorden en het plateau van Moab in het zuiden, dat tot ongeveer 1200 m boven de diepe breuk van het dal oprijst en door de kloof van de Jabbok in tweeën wordt gesneden. Goed bewaterd en met eiken en dennen bebost, was het weide- en graanland, “een plaats voor vee” zoals de stammen van Ruben en Gad het zagen, en beroemd om zijn balsem: de Ismaëlieten die Jozef kochten, kwamen “uit Gilead; en hun kemelen droegen specerijen en balsem, en mirre”, en Jeremia vraagt: “Is er geen balsem in Gilead? Is er geen heelmeester aldaar?” De naam kan het hele land ten oosten van de Jordaan betekenen of alleen de noordelijke of zuidelijke helft ten opzichte van de Jabbok."
    - "Laban haalde Jakob in “op het gebergte van Gilead”, en Jakob stak de Jabbok over bij Pniël op weg naar huis. Mozes nam Gilead van Sihon en Og en gaf het aan Ruben, Gad en de halve stam Manasse, van wie de kinderen van Machir “gingen naar Gilead, en namen dat in”. Jefta de Gileadiet bevrijdde het van de Ammonieten; de mannen van Jabes in Gilead werden door Saul gered en begroeven later zijn beenderen; Isboset regeerde vanuit Machanaïm, waar ook David bij Absalom schuilde en door Barzillai de Gileadiet werd gevoed. Elia, “de Thisbiet, van de inwoneren van Gilead”, kwam van hier, al is Tisbe niet met zekerheid gevonden."
    - "Ramot in Gilead was de vesting waarom Israël en Damascus streden: Achab werd er dodelijk gewond en Jehu werd er gezalfd. Hazaël “sloeg ze in alle landpalen van Israel: Van de Jordaan af, tegen den opgang der zon, het ganse land van Gilead”, en Amos zegt dat Damascus “Gilead met ijzeren dorswagens” heeft “gedorst” en dat Ammon de zwangere vrouwen ervan openreet. In 733–732 v.Chr. nam Tiglat-Pileser III Gilead in en voerde zijn bewoners weg naar Assyrië; zijn samenvattend opschrift somt, in een beschadigde regel die gewoonlijk met de naam Gilead wordt aangevuld, de steden aan de grens van Israël op die hij annexeerde. Hosea noemt Gilead “een stad van werkers der ongerechtigheid”, maar Micha en Jeremia hopen dat Israël weer zal weiden in Basan en Gilead “als in de dagen van ouds”."
    - "In de hellenistische en Romeinse tijd lagen in het noorden van Gilead de steden van de Dekapolis, Gerasa (Jerash), Pella en Gadara, en het zuiden was de Perea van Herodes Antipas, waar Johannes de Doper te Machaerus gevangen zat. Eusebius zegt dat de christenen van Jeruzalem voor de oorlog van 66–70 n.Chr. naar Pella vluchtten. Nu is Gilead het noordwesten van Jordanië: de gouvernementen Irbid, Ajloun, Jerash en Balqa, met de steden Ajloun en Salt en de ruïnes van Jerash."
  cs:
    - "Gilead je pahorkatina východně od Jordánu mezi Jarmukem na severu a planinou Moábu na jihu, vystupující asi do 1 200 m nad hlubokým příkopem údolí a rozdělená soutěskou Jaboku. Dobře zavlažený a porostlý dubem a borovicí byl pastvinou a obilnou zemí, „místo příhodné pro dobytek“, jak jej viděli kmeny Rúben a Gád, a slavný svým balzámem: Izmaelité, kteří koupili Josefa, přicházeli „z Galád, kteřížto na velbloudích svých nesli vonné věci a kadidlo a mirru“, a Jeremjáš se ptá: „Což není žádného lékařství v Galád? Což není žádného lékaře tam?“ Jméno může znamenat celou zemi východně od Jordánu nebo jen polovinu severně či jižně od Jaboku."
    - "Laban dostihl Jákoba „na hoře Galádské“ a Jákob přešel Jabok u Penuele na cestě domů. Mojžíš vzal Gilead Sichonovi a Ógovi a dal jej Rúbenovi, Gádovi a polovině kmene Manasesova, jehož rod Machír: „Táhli pak synové Machir, syna Manassesova, do Galád, a vzavše tu krajinku“. Jiftách Gileadský jej vysvobodil od Amónců; muži z Jábeše gileadského byli zachráněni Saulem a později pohřbili jeho kosti; Íš-bošet kraloval z Machanajim, kam se uchýlil i David před Abšalomem a kde jej živil Barzilaj Gileadský. Elijáš, „Eliáš Tesbitský, obyvatel Galádský“, pocházel odsud, ačkoli Tišbe nebylo s jistotou nalezeno."
    - "Rámot v Gileadu byla pevnost, o niž bojoval Izrael s Damaškem: Achab tam byl smrtelně raněn a Jehú tam byl pomazán. Chazael „je porazil … po všech končinách Izraelských, Od Jordánu, proti východu slunce, všecku zemi Galád“ a Amos praví o Damašku: „mlátili Galáda cepami okovanými“, a že Amón rozpáral jeho těhotné ženy. V letech 733–732 př. n. l. dobyl Gilead Tiglatpilesar III. a odvedl jeho lid do Asýrie; jeho souhrnný nápis v poškozeném řádku, obvykle doplňovaném jménem Gilead, vyjmenovává města na hranici Izraele, která připojil. Ozeáš nazývá Gilead „Galád město činitelů nepravosti“, přesto Micheáš a Jeremjáš doufají, že Izrael bude opět pást v Bášanu a Gileadu „jako za dnů starodávních“."
    - "V helénistické a římské době držel severní Gilead města Dekapole, Gerasu (Džeraš), Pellu a Gadaru, a jih byl Perea Heroda Antipy, kde byl Jan Křtitel vězněn v Machairúsu. Eusebios praví, že křesťané z Jeruzaléma uprchli do Pelly před válkou v letech 66–70 n. l. Dnes je Gilead severozápadní Jordánsko: gubernie Irbid, Adžlún, Džeraš a Balká, s městy Adžlún a Salt a zříceninami Džerašu."
  sv:
    - "Gilead är bergslandet öster om Jordan mellan Jarmuk i norr och Moabs högslätt i söder, som reser sig omkring 1 200 m över Jordandalens djupa gravsänka och delas i två av Jabboks klyfta. Välvattnat och bevuxet med ek och tall var det bete- och spannmålsland, ”en trakt för boskap” såsom Rubens och Gads stammar såg det, och berömt för sin balsam: ismaeliterna som köpte Josef kom ”från Gilead, och deras kameler voro lastade med dragantgummi, balsam och ladanum”, och Jeremia frågar: ”Finnes då ingen balsam i Gilead, finnes ingen läkare där?” Namnet kan betyda hela landet öster om Jordan eller bara halvan norr eller söder om Jabbok."
    - "Laban hann upp Jakob ”på Gileads berg”, och Jakob gick över Jabbok vid Peniel på väg hem. Mose gav Gilead, taget från Sichon och Og, åt Ruben, Gad och halva Manasse stam, vars släkt Makir ”gingo åstad till Gilead och intogo det”. Gileaditen Jefta befriade det från ammoniterna; männen i Javesh-Gilead räddades av Saul och begravde senare hans ben; Ish-Boshet regerade från Mahanajim, där också David sökte skydd undan Absalom och blev försörjd av gileaditen Barsillaj. ”Tisbiten Elia, en man som förut hade uppehållit sig i Gilead”, kom härifrån, fast Tishbe inte har hittats med säkerhet."
    - "Ramot-Gilead var fästningen som Israel och Damaskus stred om: Achav sårades dödligt där, och Jehu smordes där. Hasael ”slog israeliterna utefter hela deras gräns och intog östra sidan om Jordan hela landet Gilead”, och Amos säger att Damaskus ”hava tröskat Gilead med sina tröskvagnar av järn” och att Ammon uppristade dess havande kvinnor. År 733–732 f.Kr. intog Tiglat-Pileser III Gilead och förde dess folk till Assyrien; hans sammanfattande inskrift, i en skadad rad som vanligen återställs med Gilead, förtecknar städerna vid Israels gräns som han införlivade. Hosea kallar Gilead ”en stad av ogärningsmän”, men Mika och Jeremia hoppas att Israel åter ska beta i Bashan och Gilead ”likasom under forna dagar”."
    - "Under hellenistisk och romersk tid rymde norra Gilead Dekapolis städer Gerasa (Jerash), Pella och Gadara, och södra delen var Herodes Antipas Peraia, där Johannes döparen fängslades i Machaerus. Eusebios säger att Jerusalems kristna flydde till Pella före kriget 66–70 e.Kr. I dag är Gilead nordvästra Jordanien: guvernementen Irbid, Ajloun, Jerash och Balqa, med städerna Ajloun och Salt och ruinerna i Jerash."
  nb:
    - "Gilead er fjellandet øst for Jordan mellom Yarmuk i nord og Moabs høyslette i sør, som stiger til omtrent 1200 m over den dype riftdalen og er delt i to av Jabbok-juvet. Godt vannet og bevokst med eik og furu var det beite- og kornland, «vel skikket for feavl» slik Rubens og Gads stammer så det, og berømt for sin balsam: ismaelittene som kjøpte Josef «kom fra Gilead, og deres kameler bar krydderier og balsam og ladanum», og Jeremia spør: «Er det da ingen balsam i Gilead? Eller er det ingen læge der?» Navnet kan bety hele landet øst for Jordan eller bare halvdelen nord eller sør for Jabbok."
    - "Laban nådde Jakob igjen «på Gilead-fjellet», og Jakob krysset Jabbok ved Penuel på vei hjem. Moses tok Gilead fra Sihon og Og og ga det til Ruben, Gad og Manasses halve stamme, hvis klan Makir «drog til Gilead og inntok det». Gileaditten Jefta fridde det fra ammonittene; mennene i Jabesj-Gilead ble reddet av Saul og begravde senere hans ben; Isjbosjet regjerte fra Mahanajim, der også David søkte tilflukt for Absalom og ble forsynt av gileaditten Barsillai. Fra Gilead kom «tisbitten Elias, en av dem som var flyttet inn i Gilead», selv om Tisbe ikke er funnet med sikkerhet."
    - "Ramot-Gilead var festningen som Israel og Damaskus kjempet om: Akab ble dødelig såret der, og Jehu ble salvet der. Hasael «slo dem på hele Israels grense og tok på østsiden av Jordan hele Gileads land», og Amos sier at Damaskus «tresket Gilead med treskesleder av jern» og at Ammon skar opp de fruktsommelige kvinnene der. I 733–732 f.Kr. tok Tiglat-Pileser 3. Gilead og bortførte folket til Assyria; hans sammendragsinnskrift, i en skadet linje som vanligvis restaureres slik at den nevner Gilead, oppfører byene på Israels grense som han la under seg. Hosea kaller Gilead «en by med ugjerningsmenn», men Mika og Jeremia håper at Israel igjen skal beite i Basan og Gilead, «som i gamle dager»."
    - "I hellenistisk og romersk tid rommet nordlige Gilead byene i Dekapolis, Gerasa (Jerash), Pella og Gadara, og sør var Herodes Antipas' Perea, der døperen Johannes ble fengslet i Makaerus. Eusebius sier at de kristne i Jerusalem flyktet til Pella før krigen i 66–70 e.Kr. I dag er Gilead det nordvestlige Jordan: guvernementene Irbid, Ajloun, Jerash og Balqa, med byene Ajloun og Salt og ruinene i Jerash."
  tl:
    - "Ang Gilead ang maburol na lupain sa silangan ng Jordan sa pagitan ng Yarmuk sa hilaga at ng talampas ng Moab sa timog, na tumataas hanggang mga 1,200 m sa ibabaw ng malalim na lamat ng libis at hinahati sa dalawa ng bangin ng Jaboc. Sagana sa tubig at may kagubatan ng ensina at pino, ito ay lupang pastulan at butil, “dako sa hayop” sa paningin ng mga lipi ni Ruben at ni Gad, at tanyag sa balsamo nito: ang mga Ismaelitang bumili kay Jose ay “nagsisipanggaling sa Gilead sangpu ng kanilang mga kamelyo at may dalang mga pabango, at mga balsamo, at mga mirra”, at nagtatanong si Jeremias, “Wala bagang balsamo sa Galaad? wala bagang manggagamot doon?” Maaaring tumukoy ang pangalan sa buong lupain sa silangan ng Jordan o sa hilaga o timog na kalahati lamang ng Jaboc."
    - "Inabutan ni Laban si Jacob “sa bundok ng Gilead”, at tumawid si Jacob sa Jaboc sa Peniel papauwi. Kinuha ni Moises ang Gilead kay Sehon at kay Og at ibinigay sa Ruben, Gad at kalahating lipi ni Manases, na ang angkan na Machir ay “nagsiparoon sa Galaad, at kanilang sinakop”. Iniligtas ito ni Jephte na Galaadita sa mga Ammonita; ang mga lalaki ng Jabes-galaad ay iniligtas ni Saul at kalaunan ay inilibing ang kaniyang mga buto; naghari si Is-boseth mula sa Mahanaim, kung saan naghanap din ng kanlungan si David laban kay Absalom at pinakain ni Barzillai na Galaadita. Mula rito si “Elias na Thisbita, na sa mga nakikipamayan sa Galaad”, bagaman hindi tiyak na natagpuan ang Thisbe."
    - "Ang Ramoth-galaad ang kutang pinag-agawan ng Israel at Damasco: doon nasugatan nang malubha si Achab, at doon pinahiran ng langis si Jehu. “Sinaktan sila ni Hazael sa lahat ng mga hangganan ng Israel; Mula sa Jordan, hanggang sa silanganan, ang buong lupain ng Galaad”, at sinasabi ni Amos tungkol sa Damasco, “kanilang giniik ang Galaad ng panggiik na bakal”, at winakwak ng Ammon ang mga babaeng buntis nito. Noong 733–732 BK, sinakop ni Tiglath-pileser III ang Gilead at dinala ang mga tao nito sa Asiria; ang kaniyang buod na inskripsiyon, sa isang nasirang linya na karaniwang ibinabalik upang pangalanan ang Gilead, ay naglilista ng mga bayan sa hangganan ng Israel na kaniyang isinanib. Tinatawag ni Oseas ang Gilead na “bayang gumagawa ng kasamaan”, ngunit umaasa sina Mikas at Jeremias na muling manginginain ang Israel sa Basan at Gilead “gaya ng mga araw nang una”."
    - "Sa mga panahong Helenistiko at Romano, hawak ng hilagang Gilead ang mga lungsod ng Decapolis, ang Gerasa (Jerash), Pella at Gadara, at ang timog ay ang Perea ni Herodes Antipas, kung saan ibinilanggo si Juan Bautista sa Machaerus. Sinasabi ni Eusebio na tumakas ang mga Kristiyano ng Jerusalem sa Pella bago ang digmaan ng 66–70 AD. Ngayon, ang Gilead ay ang hilagang-kanluran ng Jordan: ang mga gobernadurya ng Irbid, Ajloun, Jerash at Balqa, na may mga bayan ng Ajloun at Salt at mga guho ng Jerash."
  da:
    - "Gilead er bjerglandet øst for Jordan mellem Yarmuk i nord og Moabs højslette i syd, hævet til omkring 1.200 m over dalens dybe jordsprække og delt i to af Jabbok-kløften. Veltvandet og bevokset med eg og fyr var det græsnings- og kornland, »et bekvemt Sted til Kvæg«, som Rubens og Gads stammer så det, og berømt for sin balsam: de ismaelitter, der købte Josef, kom »fra Gilead, og deres Kameler bare Urter og Balsam og Ladanum«, og Jeremias spørger: »Er der da ingen Balsam i Gilead? eller er der ingen Læge der?« Navnet kan betyde hele landet øst for Jordan eller kun halvdelen nord eller syd for Jabbok."
    - "Laban indhentede Jakob »paa Bjerget Gilead«, og Jakob krydsede Jabbok ved Peniel på vej hjem. Moses tog Gilead fra Sihon og Og og gav det til Ruben, Gad og Manasses halve stamme, hvis slægt Makir »gik ind i Gilead og indtoge det«. Jefta gileaditten befriede det fra ammonitterne; mændene fra Jabesj i Gilead blev reddet af Saul og begravede senere hans ben; Isj-Bosjet regerede fra Mahanajim, hvor også David søgte tilflugt fra Absalon og blev forsynet af gileaditten Barzillaj. Elija kom herfra, »Thisbiteren Elias, en af dem, som boede i Gilead«, skønt Tisbe ikke er fundet med sikkerhed."
    - "Ramot i Gilead var den fæstning, Israel og Damaskus kæmpede om: Akab blev dødeligt såret dér, og Jehu blev salvet dér. Hasael »slog dem i hele Israels Landemærke, fra Jordan af, imod Solens Opgang, det hele Gileads Land«, og Amos siger, at Damaskus havde »tærsket Gilead med Jerntærskevogne«, og at Ammon sprættede de gravide kvinder op. I 733–732 f.Kr. indtog Tiglat-Pileser III Gilead og førte dets folk til Assyrien; hans sammenfattende indskrift, i en beskadiget linje, der sædvanligvis suppleres med at nævne Gilead, opregner de byer på Israels grænse, som han annekterede. Hoseas kalder Gilead »en Misdæderstad«, og dog håber Mika og Jeremias, at Israel igen skal græsse i Basan og Gilead »som i gamle Dage«."
    - "I den hellenistiske og romerske periode rummede det nordlige Gilead Dekapolis' byer, Gerasa (Jerash), Pella og Gadara, og syd for dem lå Herodes Antipas' Peræa, hvor Johannes Døberen blev fængslet i Machaerus. Eusebios siger, at Jerusalems kristne flygtede til Pella før krigen 66–70 e.Kr. I dag er Gilead det nordvestlige Jordan: guvernementerne Irbid, Ajloun, Jerash og Balqa, med byerne Ajloun og Salt og ruinerne af Jerash."
