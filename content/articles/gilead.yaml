# Overview article (ADR 0007). Mainstream facts only; the site of Tishbe and the varying extent of Gilead in the texts are noted as uncertain.
id: gilead
place: ae73b90
title:
  en: "Gilead"
  ru: "Галаад"
body:
  en:
    - 'Gilead is the hill country east of the Jordan between the Yarmuk in the north and the plateau of Moab in the south, rising to about 1,200 m above the deep rift of the valley and cut in two by the gorge of the Jabbok. Well watered and wooded with oak and pine, it was pasture and grain land, "a place for cattle" as the tribes of Reuben and Gad saw it, and famous for its balm: the Ishmaelites who bought Joseph came "from Gilead with their camels bearing spicery and balm and myrrh", and Jeremiah asks, "Is there no balm in Gilead; is there no physician there?" The name can mean the whole land east of the Jordan or only the half north or south of the Jabbok.'
    - 'Laban overtook Jacob "in the mount Gilead", and Jacob crossed the Jabbok at Peniel on his way home. Moses took Gilead from Sihon and Og and gave it to Reuben, Gad and the half-tribe of Manasseh, whose clan Machir "went to Gilead, and took it". Jephthah the Gileadite delivered it from the Ammonites; the men of Jabesh-gilead were rescued by Saul and later buried his bones; Ish-bosheth reigned from Mahanaim, where David too took refuge from Absalom and was fed by Barzillai the Gileadite. Elijah "the Tishbite, who was of the inhabitants of Gilead" came from here, though Tishbe has not been found with certainty.'
    - 'Ramoth-gilead was the fortress Israel and Damascus fought over: Ahab was mortally wounded there, and Jehu was anointed there. Hazael "smote them in all the coasts of Israel; From Jordan eastward, all the land of Gilead", and Amos says Damascus "threshed Gilead with threshing instruments of iron" and Ammon ripped up its women with child. In 733–732 BC Tiglath-pileser III took Gilead and carried its people to Assyria; his summary inscription names Gilead among the lands on the border of Israel that he annexed. Hosea calls Gilead "a city of them that work iniquity", yet Micah and Jeremiah hope that Israel will feed again in Bashan and Gilead "as in the days of old".'
    - "In the Hellenistic and Roman periods northern Gilead held the cities of the Decapolis, Gerasa (Jerash), Pella and Gadara, and the south was the Peraea of Herod Antipas, where John the Baptist was imprisoned at Machaerus. Eusebius says the Christians of Jerusalem fled to Pella before the war of AD 66–70. Today Gilead is the north-west of Jordan: the governorates of Irbid, Ajloun, Jerash and Balqa, with the towns of Ajloun and Salt and the ruins of Jerash."
  ru:
    - "Галаад — нагорье к востоку от Иордана между Ярмуком на севере и плато Моава на юге, поднимающееся примерно до 1200 м над глубокой впадиной долины и рассечённое надвое ущельем Иавока. Обильная водой, поросшая дубом и сосной, эта земля была пастбищем и хлебным краем, «место годное для стад», как увидели её колена Рувима и Гада, и славилась бальзамом: Измаильтяне, купившие Иосифа, шли «из Галаада», и «верблюды их несут стираксу, бальзам и ладан», а Иеремия спрашивает: «Разве нет бальзама в Галааде? разве нет там врача?» Имя может означать всю землю за Иорданом или только половину к северу или к югу от Иавока."
    - "Лаван догнал Иакова «на горе Галаад», а Иаков на пути домой перешёл Иавок у Пенуэла. Моисей отнял Галаад у Сигона и Ога и отдал его Рувиму, Гаду и половине колена Манассиина, чей род Махира пошёл «в Галаад, и взяли его». Иеффай Галаадитянин избавил его от Аммонитян; жителей Иависа Галаадского выручил Саул, и позже они погребли его кости; Иевосфей царствовал из Маханаима, где и Давид укрылся от Авессалома и где его кормил Верзеллий Галаадитянин. Отсюда был Илия «Фесвитянин, из жителей Галаадских», хотя Фесву так и не нашли с уверенностью."
    - "Рамоф Галаадский был крепостью, за которую бились Израиль и Дамаск: там был смертельно ранен Ахав и там помазан Ииуй. Азаил поражал Израильтян «на восток от Иордана, всю землю Галаад», и Амос говорит о Дамаске: «они молотили Галаад железными молотилами», а Аммон рассекал там беременных. В 733–732 гг. до н. э. Феглаффелласар III взял Галаад и переселил его жителей в Ассирию; его сводная надпись называет Галаад среди земель на рубеже Израиля, которые он присоединил к Ассирии. Осия называет Галаад «город нечестивцев», но Михей и Иеремия надеются, что Израиль снова будет пастись на Васане и Галааде, «как во дни древние»."
    - "В эллинистическое и римское время на севере Галаада стояли города Десятиградия — Гераса (Джераш), Пелла и Гадара, а юг был Переей Ирода Антипы, где в Махероне сидел в темнице Иоанн Креститель. Евсевий говорит, что христиане Иерусалима бежали в Пеллу перед войной 66–70 гг. н. э. Сегодня Галаад — северо-запад Иордании: провинции Ирбид, Аджлун, Джераш и Эль-Балка с городами Аджлун и Эс-Салт и развалинами Джераша."
