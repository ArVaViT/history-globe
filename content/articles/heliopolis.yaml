# Overview article (ADR 0007). Mainstream facts only; Egyptian dates follow I. Shaw (ed.), The Oxford History of Ancient Egypt.
# The card is named «Илиополь» (Synodal, Gen 41:45); the title adds the Hebrew name On, which the Synodal text keeps in Exod 1:11 and Ezek 30:17.
id: heliopolis
place: acd9137
title:
  en: "Heliopolis (On)"
  ru: "Илиополь (Он)"
  uk: "Геліополь (Он)"
  es: "Heliópolis (On)"
  pt: "Heliópolis (On)"
  de: "Heliopolis (On)"
  fr: "Héliopolis (On)"
  pl: "Heliopolis (On)"
  it: "Eliopoli (On)"
  nl: "Heliopolis (On)"
  cs: "Héliopolis (On)"
body:
  en:
    - "Heliopolis, the On of the Bible, lay at the south-eastern edge of the Nile delta, where the Cairo districts of Matariya and Ain Shams are today. The Egyptians called it Iunu, and the Greeks the City of the Sun. It was the chief seat of the sun god Ra and of Atum, and its priests taught of the nine gods, the Ennead, at whose head stood the creator. Of its great temple little remains above ground, but the obelisk that Senusret I set up there in the twentieth century BC still stands where it was raised."
    - "Pharaoh gave Joseph to wife Asenath, the daughter of Poti-pherah priest of On, and she bore him Manasseh and Ephraim. The Greek Septuagint adds On, that is Heliopolis, to Pithom and Raamses among the cities built by the Israelites in Egypt, and the Russian Synodal text keeps this addition. Jeremiah foretold that Nebuchadrezzar would break the images of Beth-shemesh, the house of the sun, that is in the land of Egypt, a name usually taken to mean Heliopolis; Ezekiel calls the city Aven and says that its young men shall fall by the sword."
    - "Herodotus went to Heliopolis to question its priests, for its people were said to be the most learned of the Egyptians in records, and he heard there the tale of the phoenix. Strabo found the city on its mound entirely deserted, though the temple of the sun and the sacred bull Mnevis were still kept; he was shown the large houses of the priests, where Plato and Eudoxus were said to have stayed. Augustus carried two of its obelisks to Rome and set them up in the Circus Maximus and the Campus Martius."
    - "In the mid-second century BC Onias, of the high-priestly family, who had fled to Egypt, built a Jewish temple with leave from Ptolemy VI at Leontopolis in the district of Heliopolis, appealing to Isaiah's word of an altar to the Lord in the midst of the land of Egypt. After the Jewish War Vespasian had it shut, about AD 73. In the Middle Ages the ruins of Heliopolis were quarried for the building of Cairo."
  ru:
    - "Илиополь, библейский Он, лежал на юго-восточном краю дельты Нила, там, где теперь каирские районы Матария и Айн-Шамс. Египтяне называли его Иуну, а греки — Городом Солнца. Это было главное святилище бога солнца Ра и бога Атума; здешние жрецы учили о девяти богах, Эннеаде, во главе которой стоял творец. От великого храма над землёй мало что осталось, но обелиск, который Сенусерт I поставил здесь в XX веке до н. э., и теперь стоит на прежнем месте."
    - "Фараон дал Иосифу в жену Асенефу, дочь Потифера, жреца Илиопольского, и она родила ему Манассию и Ефрема. Греческая Септуагинта прибавляет к Пифому и Раамсесу, городам, которые строили израильтяне в Египте, ещё и Он, то есть Илиополь; это прибавление сохраняет и русский Синодальный перевод. Иеремия предрекал, что Навуходоносор сокрушит статуи в Бефсамисе, что в земле Египетской, — это имя значит «дом солнца», и обычно его понимают как Илиополь; Иезекииль называет город Он и говорит, что молодые люди его падут от меча."
    - "Геродот приходил в Илиополь расспрашивать жрецов, ибо здешние жители слыли самыми сведущими из египтян в преданиях старины, и слышал здесь рассказ о птице фениксе. Страбон застал город на его холме совсем опустевшим, хотя храм Солнца ещё стоял и в нём содержали священного быка Мневиса; ему показывали большие дома жрецов, у которых, по преданию, жили Платон и Евдокс. Август увёз в Рим два здешних обелиска и поставил их в Большом цирке и на Марсовом поле."
    - "В середине II века до н. э. Ония из первосвященнического рода, бежавший в Египет, с позволения Птолемея VI построил иудейский храм в Леонтополе, в округе Илиополя, ссылаясь на слово Исаии о жертвеннике Господу посреди земли Египетской. После Иудейской войны, около 73 г. н. э., Веспасиан велел закрыть его. В Средние века развалины Илиополя разбирали на камень для постройки Каира."
  uk:
    - "Геліополь, біблійний Он, лежав на південно-східному краю дельти Нілу, де нині каїрські райони Матарія й Айн-Шамс. Єгиптяни називали його Іуну, а греки — Містом Сонця. Це був головний осередок бога сонця Ра й Атума, і його жерці навчали про дев’ять богів, Еннеаду, на чолі якої стояв творець. Від його великого храму над землею лишилося мало, але обеліск, який поставив там Сенусерт I у XX ст. до н. е., досі стоїть там, де його встановлено."
    - "Фараон дав Йосипові за дружину Асенефу, дочку Потіфери, жерця Ону, і вона народила йому Манасію та Єфрема. Грецька Септуагінта додає Он, тобто Геліополь, до Пітома й Раамсеса серед міст, збудованих ізраїльтянами в Єгипті, і російський Синодальний текст зберігає це доповнення. Єремія провістив, що Навуходоносор розіб’є ідолів Бет-Шемеша, дому сонця, що в землі Єгипетській, — назва, яку зазвичай розуміють як Геліополь; Єзекіїль називає місто Авен і каже, що його юнаки падуть від меча."
    - "Геродот їздив до Геліополя розпитати його жерців, бо його мешканці, як казали, найбільш обізнані в хроніках серед єгиптян, і почув там розповідь про фенікса. Страбон застав місто на його пагорбі цілком безлюдним, хоча храм сонця й священного бика Мневіса ще вшановували; йому показали великі будинки жерців, де, як казали, жили Платон і Евдокс. Август вивіз два з його обелісків до Рима й поставив їх у Великому цирку та на Марсовому полі."
    - "У середині II ст. до н. е. Оній з первосвященницького роду, який утік до Єгипту, збудував юдейський храм з дозволу Птолемея VI у Леонтополі в окрузі Геліополя, посилаючись на слово Ісаї про жертовник Господу посеред землі Єгипетської. Після Юдейської війни Веспасіан наказав його закрити, близько 73 р. н. е. У середні віки руїни Геліополя розбирали на каміння для будівництва Каїра."
  es:
    - "Heliópolis, el On de la Biblia, se hallaba en el borde sudoriental del delta del Nilo, donde hoy están los distritos de El Cairo de Matariya y Ain Shams. Los egipcios la llamaban Iunu y los griegos la Ciudad del Sol. Fue la principal sede del dios solar Ra y de Atum, y sus sacerdotes enseñaban sobre los nueve dioses, la Enéada, a cuya cabeza estaba el creador. De su gran templo queda poco sobre el suelo, pero el obelisco que Sesostris I levantó allí en el siglo XX a. C. sigue en pie donde fue erigido."
    - "El faraón dio a José por mujer a Asenat, hija de Potifera, sacerdote de On, y ella le dio a Manasés y a Efraín. La Septuaginta griega añade On, es decir, Heliópolis, a Pitón y Raamsés entre las ciudades edificadas por los israelitas en Egipto, y el texto sinodal ruso conserva esta adición. Jeremías anunció que Nabucodonosor quebraría las estatuas de Bet-semes, la casa del sol, que está en tierra de Egipto, nombre que suele entenderse como Heliópolis; Ezequiel llama a la ciudad Avén y dice que sus jóvenes caerán a espada."
    - "Heródoto fue a Heliópolis a interrogar a sus sacerdotes, pues se decía que su gente era la más sabia de los egipcios en anales, y allí oyó el relato del fénix. Estrabón halló la ciudad sobre su montículo completamente desierta, aunque aún se conservaban el templo del sol y el toro sagrado Mnevis; le mostraron las grandes casas de los sacerdotes, donde se decía que habían residido Platón y Eudoxo. Augusto llevó dos de sus obeliscos a Roma y los erigió en el Circo Máximo y en el Campo de Marte."
    - "A mediados del siglo II a. C. Onías, de la familia sumosacerdotal, que había huido a Egipto, construyó un templo judío con permiso de Ptolomeo VI en Leontópolis, en el distrito de Heliópolis, invocando la palabra de Isaías sobre un altar al Señor en medio de la tierra de Egipto. Tras la Guerra Judía Vespasiano lo hizo cerrar, hacia el 73 d. C. En la Edad Media las ruinas de Heliópolis se explotaron como cantera para construir El Cairo."
  pt:
    - "Heliópolis, a On da Bíblia, ficava na margem sudeste do delta do Nilo, onde hoje estão os bairros do Cairo de Matariya e Ain Shams. Os egípcios a chamavam Iunu, e os gregos, Cidade do Sol. Era a principal sede do deus-sol Rá e de Atum, e seus sacerdotes ensinavam sobre os nove deuses, a Eneáda, à frente dos quais estava o criador. Do seu grande templo pouco resta sobre o solo, mas o obelisco que Senusret I ergueu ali no século XX a.C. ainda está onde foi levantado."
    - "O faraó deu a José por esposa Asenate, filha de Potífera, sacerdote de On, e ela lhe deu Manassés e Efraim. A Septuaginta grega acrescenta On, isto é, Heliópolis, a Pitom e Ramessés entre as cidades construídas pelos israelitas no Egito, e o texto Sinodal russo mantém esse acréscimo. Jeremias predisse que Nabucodonosor quebraria as imagens de Bete-Semes, a casa do sol, que está na terra do Egito, nome usualmente tomado como Heliópolis; Ezequiel chama a cidade Áven e diz que seus jovens cairão à espada."
    - "Heródoto foi a Heliópolis para interrogar seus sacerdotes, pois se dizia que seu povo era o mais erudito dos egípcios em registros, e ouviu ali a história da fênix. Estrabão achou a cidade em seu monte inteiramente deserta, embora o templo do sol e o touro sagrado Mnévis ainda fossem mantidos; mostraram-lhe as grandes casas dos sacerdotes, onde se dizia que Platão e Eudoxo se haviam hospedado. Augusto levou dois de seus obeliscos a Roma e os pôs no Circo Máximo e no Campo de Marte."
    - "Em meados do século II a.C., Onias, da família dos sumos sacerdotes, que fugira para o Egito, construiu um templo judaico, com licença de Ptolomeu VI, em Leontópolis, no distrito de Heliópolis, apelando à palavra de Isaías sobre um altar ao Senhor no meio da terra do Egito. Depois da Guerra Judaica, Vespasiano o fechou, por volta de 73 d.C. Na Idade Média as ruínas de Heliópolis foram usadas como pedreira para a construção do Cairo."
  de:
    - "Heliopolis, das On der Bibel, lag am südöstlichen Rand des Nildeltas, wo heute die Kairoer Viertel Matarija und Ain Schams liegen. Die Ägypter nannten es Iunu, die Griechen Stadt der Sonne. Es war der Hauptsitz des Sonnengottes Re und des Atum, und seine Priester lehrten von den neun Göttern, der Neunheit, an deren Spitze der Schöpfer stand. Von seinem großen Tempel ist über der Erde wenig übrig, doch der Obelisk, den Sesostris I. im 20. Jahrhundert v. Chr. dort errichtete, steht noch, wo er aufgestellt wurde."
    - "Pharao gab Josef Asnat zur Frau, die Tochter Potiferas, des Priesters von On, und sie gebar ihm Manasse und Ephraim. Die griechische Septuaginta fügt On, das ist Heliopolis, zu Pitom und Ramses unter den Städten hinzu, die die Israeliten in Ägypten bauten, und der russische Synodaltext behält diesen Zusatz bei. Jeremia sagte voraus, Nebukadnezar werde die Bildsäulen von Bet-Schemesch, dem Haus der Sonne, im Land Ägypten zerbrechen, ein Name, der meist auf Heliopolis bezogen wird; Hesekiel nennt die Stadt Awen und sagt, ihre jungen Männer würden durchs Schwert fallen."
    - "Herodot ging nach Heliopolis, um seine Priester zu befragen, denn ihre Leute galten als die gelehrtesten Ägypter in den Aufzeichnungen, und er hörte dort die Geschichte vom Phönix. Strabon fand die Stadt auf ihrem Hügel völlig verlassen vor, obwohl der Sonnentempel und der heilige Stier Mnevis noch unterhalten wurden; ihm wurden die großen Häuser der Priester gezeigt, in denen Platon und Eudoxos gewohnt haben sollen. Augustus ließ zwei ihrer Obelisken nach Rom bringen und im Circus Maximus und auf dem Marsfeld aufstellen."
    - "Mitte des 2. Jahrhunderts v. Chr. baute Onias aus der hohepriesterlichen Familie, der nach Ägypten geflohen war, mit Erlaubnis Ptolemäus' VI. in Leontopolis im Bezirk von Heliopolis einen jüdischen Tempel und berief sich auf Jesajas Wort von einem Altar des HERRN mitten im Land Ägypten. Nach dem Jüdischen Krieg ließ Vespasian ihn um 73 n. Chr. schließen. Im Mittelalter wurden die Ruinen von Heliopolis als Steinbruch für den Bau Kairos genutzt."
  fr:
    - "Héliopolis, l’On de la Bible, se trouvait à la lisière sud-est du delta du Nil, là où se trouvent aujourd’hui les quartiers du Caire de Matariya et d’Aïn Shams. Les Égyptiens l’appelaient Iounou, et les Grecs la Ville du Soleil. C’était le principal siège du dieu-soleil Rê et d’Atoum, et ses prêtres enseignaient la doctrine des neuf dieux, l’Ennéade, à la tête de laquelle se tenait le créateur. De son grand temple, il reste peu de chose en surface, mais l’obélisque que Sésostris Ier y dressa au XXe siècle av. J.-C. se dresse encore là où il fut érigé."
    - "Pharaon donna à Joseph pour femme Asnath, fille de Poti-Phéra, prêtre d’On, et elle lui enfanta Manassé et Éphraïm. La Septante grecque ajoute On, c’est-à-dire Héliopolis, à Pithom et Ramsès parmi les villes bâties par les Israélites en Égypte, et le texte synodal russe garde cet ajout. Jérémie annonça que Nebucadnetsar briserait les statues de Beth-Schémesch, la maison du soleil, qui est au pays d’Égypte, nom d’ordinaire compris comme Héliopolis ; Ézéchiel appelle la ville Aven et dit que ses jeunes hommes tomberont par l’épée."
    - "Hérodote se rendit à Héliopolis pour interroger ses prêtres, car ses habitants passaient pour les plus savants des Égyptiens en matière d’annales, et il y entendit le récit du phénix. Strabon trouva la ville sur sa butte entièrement déserte, bien que le temple du soleil et le taureau sacré Mnévis fussent encore entretenus ; on lui montra les grandes maisons des prêtres, où Platon et Eudoxe auraient séjourné. Auguste emporta deux de ses obélisques à Rome et les dressa au Grand Cirque et au Champ de Mars."
    - "Au milieu du IIe siècle av. J.-C., Onias, de la famille grand-sacerdotale, qui s’était enfui en Égypte, bâtit un temple juif avec l’autorisation de Ptolémée VI à Léontopolis, dans le district d’Héliopolis, en invoquant la parole d’Ésaïe sur un autel à l’Éternel au milieu du pays d’Égypte. Après la guerre juive, Vespasien le fit fermer, vers 73 apr. J.-C. Au Moyen Âge, les ruines d’Héliopolis servirent de carrière pour la construction du Caire."
  pl:
    - "Heliopolis, biblijne On, leżało na południowo-wschodnim skraju delty Nilu, tam, gdzie dziś są kairskie dzielnice Matarija i Ajn Szams. Egipcjanie nazywali je Iunu, a Grecy Miastem Słońca. Było główną siedzibą boga słońca Re i Atuma, a jego kapłani nauczali o dziewięciu bogach, Enneadzie, na której czele stał stwórca. Z wielkiej świątyni niewiele pozostało nad ziemią, lecz obelisk, który Senusret I postawił tam w XX w. p.n.e., stoi nadal tam, gdzie go wzniesiono."
    - "Faraon dał Józefowi za żonę Asenat, córkę Potifery, kapłana On, a ona urodziła mu Manassesa i Efraima. Grecka Septuaginta dodaje On, czyli Heliopolis, do Pitom i Ramses wśród miast zbudowanych przez Izraelitów w Egipcie, i rosyjski tekst synodalny zachowuje ten dodatek. Jeremiasz zapowiedział, że Nabuchodonozor połamie posągi Bet-Szemesz, domu słońca, który jest w ziemi Egiptu, nazwę zwykle uważaną za oznaczającą Heliopolis; Ezechiel nazywa miasto Awen i mówi, że jego młodzieńcy polegną od miecza."
    - "Herodot udał się do Heliopolis, by wypytać jego kapłanów, bo jego mieszkańców uważano za najuczeńszych Egipcjan w zapisach, i usłyszał tam opowieść o feniksie. Strabon zastał miasto na jego pagórku zupełnie opuszczone, choć świątynia słońca i święty byk Mnewis nadal były utrzymywane; pokazano mu duże domy kapłanów, w których mieli przebywać Platon i Eudoksos. August przewiózł dwa jego obeliski do Rzymu i postawił je w Circus Maximus i na Polu Marsowym."
    - "W połowie II w. p.n.e. Onias, z rodu arcykapłańskiego, który uciekł do Egiptu, zbudował za zgodą Ptolemeusza VI żydowską świątynię w Leontopolis w okręgu Heliopolis, powołując się na słowo Izajasza o ołtarzu dla Pana pośrodku ziemi Egiptu. Po wojnie żydowskiej Wespazjan kazał ją zamknąć, około 73 r. n.e. W średniowieczu ruiny Heliopolis wykorzystywano jako kamieniołom przy budowie Kairu."
  it:
    - "Eliopoli, l’On della Bibbia, sorgeva al margine sud-orientale del delta del Nilo, dove oggi si trovano i quartieri cairoti di Matariya e Ain Shams. Gli Egizi la chiamavano Iunu, e i Greci la Città del Sole. Era la sede principale del dio sole Ra e di Atum, e i suoi sacerdoti insegnavano la dottrina dei nove dèi, l’Enneade, al cui vertice stava il creatore. Del suo grande tempio resta poco sopra terra, ma l’obelisco che Sesostri I vi eresse nel XX secolo a.C. si leva ancora dove fu innalzato."
    - "Il faraone diede a Giuseppe in moglie Asenat, figlia di Potifera, sacerdote di On, ed essa gli partorì Manasse ed Efraim. La Settanta greca aggiunge On, cioè Eliopoli, a Pitom e Ramses fra le città costruite dagli Israeliti in Egitto, e il testo sinodale russo conserva questa aggiunta. Geremia predisse che Nabucodonosor avrebbe spezzato le statue di Bet-Semes, la casa del sole, che è nel paese d’Egitto, nome di solito inteso come Eliopoli; Ezechiele chiama la città Aven e dice che i suoi giovani cadranno di spada."
    - "Erodoto andò a Eliopoli per interrogare i suoi sacerdoti, perché la sua gente era detta la più dotta degli Egizi nelle cronache, e vi udì il racconto della fenice. Strabone trovò la città sul suo tell completamente deserta, benché il tempio del sole e il toro sacro Mnevis fossero ancora conservati; gli furono mostrate le grandi case dei sacerdoti, dove si diceva avessero soggiornato Platone ed Eudosso. Augusto portò a Roma due dei suoi obelischi e li eresse nel Circo Massimo e nel Campo Marzio."
    - "A metà del II secolo a.C. Onia, della famiglia sommosacerdotale, fuggito in Egitto, costruì un tempio giudaico con il permesso di Tolomeo VI a Leontopoli, nel distretto di Eliopoli, appellandosi alla parola di Isaia su un altare al Signore in mezzo al paese d’Egitto. Dopo la guerra giudaica Vespasiano lo fece chiudere, verso il 73 d.C. Nel Medioevo le rovine di Eliopoli furono sfruttate come cava per la costruzione del Cairo."
  nl:
    - "Heliopolis, het On van de Bijbel, lag aan de zuidoostelijke rand van de Nijldelta, waar nu de Caïrose wijken Matariya en Ain Shams liggen. De Egyptenaren noemden het Iunu, en de Grieken de Stad van de Zon. Het was de hoofdzetel van de zonnegod Ra en van Atum, en zijn priesters leerden over de negen goden, de Ennead, aan wier hoofd de schepper stond. Van de grote tempel is boven de grond weinig over, maar de obelisk die Senoeseret I er in de 20e eeuw v.Chr. oprichtte, staat nog steeds waar hij is opgericht."
    - "Farao gaf Jozef Asnat tot vrouw, de dochter van Potifera, priester van On, en zij baarde hem Manasse en Efraïm. De Griekse Septuaginta voegt On, dat is Heliopolis, toe aan Pitom en Raämses onder de steden die de Israëlieten in Egypte bouwden, en de Russische Synodale tekst behoudt deze toevoeging. Jeremia voorspelde dat Nebukadnessar de beelden van Beth-Semes, het huis van de zon, dat in het land Egypte ligt, zou verbreken, een naam die gewoonlijk als Heliopolis wordt opgevat; Ezechiël noemt de stad Awen en zegt dat haar jongelingen door het zwaard zullen vallen."
    - "Herodotos ging naar Heliopolis om zijn priesters te ondervragen, want de bewoners golden als de geleerdste Egyptenaren in overleveringen, en hij hoorde er het verhaal van de feniks. Strabo vond de stad op haar heuvel geheel verlaten, al werden de zonnetempel en de heilige stier Mnevis nog onderhouden; hij kreeg de grote huizen van de priesters te zien, waar Plato en Eudoxos zouden hebben verbleven. Augustus liet twee van haar obelisken naar Rome brengen en plaatste ze in het Circus Maximus en op het Marsveld."
    - "In het midden van de 2e eeuw v.Chr. bouwde Onias, uit het hogepriesterlijke geslacht, die naar Egypte was gevlucht, met verlof van Ptolemaeus VI een Joodse tempel te Leontopolis in het district Heliopolis, zich beroepend op Jesaja’s woord over een altaar voor de Heer in het midden van het land Egypte. Na de Joodse Oorlog liet Vespasianus hem omstreeks 73 n.Chr. sluiten. In de middeleeuwen werden de ruïnes van Heliopolis als steengroeve gebruikt voor de bouw van Caïro."
  cs:
    - "Héliopolis, biblický On, ležel na jihovýchodním okraji nilské delty, kde jsou dnes káhirské čtvrti Matarija a Ajn Šams. Egypťané jej nazývali Iunu a Řekové Město Slunce. Bylo hlavním sídlem boha slunce Rea a Atuma a jeho kněží učili o devíti bohách, Enneadě, v jejímž čele stál stvořitel. Z jeho velkého chrámu zůstalo nad zemí málo, ale obelisk, který tam postavil Senusret I. ve 20. stol. př. n. l., dosud stojí tam, kde byl vztyčen."
    - "Faraon dal Josefovi za ženu Asenat, dceru Potifery, kněze Onu, a ta mu porodila Manasesa a Efrajima. Řecká Septuaginta přidává On, tedy Héliopolis, k Pitomu a Ramesse mezi města vystavěná Izraelity v Egyptě a ruský synodální text tento dodatek zachovává. Jeremjáš předpověděl, že Nebukadnesar rozbije sloupy Bét-šemeše, domu slunce, který je v egyptské zemi, jméno obvykle chápané jako Héliopolis; Ezechiel nazývá město Aven a praví, že jeho mládenci padnou mečem."
    - "Hérodotos přišel do Héliopole vyptávat se jeho kněží, protože jeho lid byl prý nejučenější z Egypťanů v zápisech, a slyšel tam vyprávění o fénixovi. Strabón našel město na jeho pahorku zcela opuštěné, ačkoli chrám slunce a posvátný býk Mnevis se dosud udržovaly; ukázali mu velké domy kněží, kde prý pobývali Platón a Eudoxos. Augustus odvezl dva z jeho obelisků do Říma a postavil je v Circu Maximu a na Martově poli."
    - "V polovině 2. stol. př. n. l. postavil Onias z velekněžského rodu, který uprchl do Egypta, se svolením Ptolemaia VI. židovský chrám v Leontopoli v okrese Héliopole, odvolávaje se na Izajášovo slovo o oltáři Hospodinu uprostřed země egyptské. Po židovské válce jej dal Vespasianus kolem roku 73 n. l. zavřít. Ve středověku byly zříceniny Héliopole rozebírány na stavbu Káhiry."
