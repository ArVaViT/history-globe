# Overview article (ADR 0007). Mainstream facts only; the Canaanite Arad of Numbers and Joshua; the three candidates on the map are named without choosing; the Iron Age finds at Tel Arad are kept apart from the Late Bronze problem.
id: arad
place: abc358b
title:
  en: "Arad"
  ru: "Арад"
body:
  en:
    - "Arad was a Canaanite town in the Negeb, the dry south of Canaan. When Israel came north from Kadesh, “king Arad the Canaanite, which dwelt in the south, heard tell that Israel came by the way of the spies; then he fought against Israel, and took some of them prisoners”. Israel vowed to destroy his towns and named the place Hormah, “utter destruction”. The king of Arad also stands in Joshua's list of defeated kings, and Judges sets the wilderness where the Kenites, Moses' kin, settled “in the south of Arad”."
    - "Tel Arad, the first site on the map, about 30 km east of Beersheba, was excavated by Ruth Amiran and Yohanan Aharoni from 1962. Below lies a large walled city of the Early Bronze Age; above, on the hill, a series of Judahite fortresses from about the tenth to the sixth century BC, with a small shrine holding an altar and standing stones, and over a hundred ostraca, many addressed to its commander Eliashib. But Tel Arad has no town of the Late Bronze Age, when Numbers seems to place its king. Some therefore put Canaanite Arad at Tel Malhata, about 12 km to the south-west, the second site; Tel Masos, the third, is more often taken for Hormah. Others hold that “Arad” named a district, as Shishak's list of about 925 BC has two Arads, one perhaps “Arad the great”; still others think the story reflects later times."
    - "Tel Arad is now a national park with the Early Bronze city and the Iron Age fortress partly rebuilt; the modern Israeli town of Arad, founded in 1962, lies some 9 km to the east."
  ru:
    - "Арад — ханаанский город в Негеве, засушливом юге Ханаана. Когда Израиль шёл на север от Кадеса, «Ханаанский царь Арада, живущий к югу, услышав, что Израиль идет дорогою от Афарима, вступил в сражение с Израильтянами и несколько из них взял в плен». Израиль дал обет истребить его города и нарёк месту имя Хорма, «заклятие». Царь Арада стоит и в списке побеждённых царей у Иисуса Навина, а в книге Судей пустыня, где поселились кенеяне, родня Моисея, лежит «на юг от Арада»."
    - "Тель-Арад, первое место на карте, примерно в 30 км к востоку от Вирсавии, раскапывали Рут Амиран и Йоханан Ахарони с 1962 года. Внизу лежит большой обнесённый стеной город раннего бронзового века; выше, на холме, — ряд иудейских крепостей примерно X–VI веков до н. э. с маленьким святилищем, где были жертвенник и каменные столбы, и более сотни остраконов, многие адресованы начальнику крепости Елиашиву. Но города позднего бронзового века, когда, по книге Чисел, правил царь Арада, на Тель-Араде нет. Поэтому одни помещают ханаанский Арад в Тель-Малхате, примерно в 12 км к юго-западу, — втором месте; Тель-Масос, третье место, чаще считают Хормой. Другие полагают, что Арадом звалась округа: в списке Шешонка около 925 г. до н. э. два Арада, один, возможно, «Арад великий»; третьи думают, что рассказ отражает более позднее время."
    - "Тель-Арад теперь национальный парк, где частично восстановлены город раннего бронзового века и крепость железного века; современный израильский город Арад, основанный в 1962 году, лежит примерно в 9 км к востоку."
