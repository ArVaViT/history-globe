body:
  en:
    - "Arad was a Canaanite town in the Negeb, the dry south of Canaan. When Israel came north from Kadesh, “king Arad the Canaanite, which dwelt in the south, heard tell that Israel came by the way of the spies; then he fought against Israel, and took some of them prisoners”. Israel vowed to destroy his towns and named the place Hormah, “utter destruction”. The king of Arad also stands in Joshua's list of defeated kings, and Judges sets the wilderness where the Kenites, Moses' kin, settled “in the south of Arad”."
    - "Tel Arad, the first site on the map, about 30 km east of Beersheba, was excavated by Ruth Amiran and Yohanan Aharoni from 1962. Below lies a large walled city of the Early Bronze Age; above, on the hill, a series of Judahite fortresses from about the ninth century (Aharoni thought the tenth) to the early sixth century BC, with a small shrine holding an altar and standing stones, and over a hundred ostraca, many addressed to its commander Eliashib. But Tel Arad has no town of the Late Bronze Age, when Numbers seems to place its king. Some therefore put Canaanite Arad at Tel Malhata, about 12 km to the south-west, the second site; Tel Masos, the third, is more often taken for Hormah. Others hold that “Arad” named a district, as Shishak's list of about 925 BC has two Arads, one perhaps “Arad the great”; still others think the story reflects later times."
    - "Tel Arad is now a national park with the Early Bronze city and the Iron Age fortress partly rebuilt; the modern Israeli town of Arad, founded in 1962, lies some 9 km to the east."
  ru:
    - "Арад — ханаанский город в Негеве, засушливом юге Ханаана. Когда Израиль шёл на север от Кадеса, «Ханаанский царь Арада, живущий к югу, услышав, что Израиль идет дорогою от Афарима, вступил в сражение с Израильтянами и несколько из них взял в плен». Израиль дал обет истребить его города и нарёк месту имя Хорма, «заклятие». Царь Арада стоит и в списке побеждённых царей у Иисуса Навина, а в книге Судей пустыня, где поселились кенеяне, родня Моисея, лежит «на юг от Арада»."
    - "Тель-Арад, первое место на карте, примерно в 30 км к востоку от Вирсавии, раскапывали Рут Амиран и Йоханан Ахарони с 1962 года. Внизу лежит большой обнесённый стеной город раннего бронзового века; выше, на холме, — ряд иудейских крепостей примерно с IX века (по Ахарони — с X) до начала VI века до н. э. с маленьким святилищем, где были жертвенник и каменные столбы, и более сотни остраконов, многие адресованы начальнику крепости Елиашиву. Но города позднего бронзового века, когда, по книге Чисел, правил царь Арада, на Тель-Араде нет. Поэтому одни помещают ханаанский Арад в Тель-Малхате, примерно в 12 км к юго-западу, — втором месте; Тель-Масос, третье место, чаще считают Хормой. Другие полагают, что Арадом звалась округа: в списке Шешонка около 925 г. до н. э. два Арада, один, возможно, «Арад великий»; третьи думают, что рассказ отражает более позднее время."
    - "Тель-Арад теперь национальный парк, где частично восстановлены город раннего бронзового века и крепость железного века; современный израильский город Арад, основанный в 1962 году, лежит примерно в 9 км к востоку."
  uk:
    - "Арад був ханаанським містом у Негеві, сухому півдні Ханаану. Коли Ізраїль ішов на північ від Кадеша, «прочув Канаанїй, царь Арадський, котрого осада була на полуднї, що йде Ізраїль шляхом до Атарима, і став битись з Ізраїльом і позаймав деяких із між їх у полонь». Ізраїль дав обітницю знищити його міста й назвав те місце Хорма, «цілковите знищення»: «назвали врочище те Горма». Цар Араду стоїть також у переліку переможених царів Ісуса Навина, а книга Суддів розміщує пустелю, де осіли кеніти, родичі Мойсея, «на Юдину пустиню, на підгіррє Арадське»."
    - "Тель-Арад, перше місце на мапі, приблизно за 30 км на схід від Беер-Шеви, розкопували від 1962 року Рут Аміран і Йоханан Агароні. Унизу лежить велике муроване місто ранньої бронзової доби; нагорі, на пагорбі, — низка юдейських фортець приблизно від IX століття (Агароні вважав — від X) до початку VI століття до н. е., з невеликою святинею, де був жертовник і стоячі камені, та понад сто остраконів, багато з яких адресовані його коменданту Еліашіву. Але в Тель-Араді немає міста пізньої бронзової доби, коли, здається, Числа розміщують його царя. Тому дехто розміщує ханаанський Арад у Тель-Малхаті, приблизно за 12 км на південний захід, друге місце; Тель-Масос, третє, частіше вважають Хормою. Інші вважають, що «Арад» називав округ, оскільки в переліку Сусакіма близько 925 р. до н. е. є два Аради, один, можливо, «Арад Великий»; ще інші думають, що розповідь відбиває пізніші часи."
    - "Тель-Арад нині — національний парк з частково відбудованими містом ранньої бронзової доби та залізнодобовою фортецею; сучасне ізраїльське місто Арад, засноване в 1962 році, лежить приблизно за 9 км на схід."
  es:
    - "Arad era una ciudad cananea en el Néguev, el sur seco de Canaán. Cuando Israel vino hacia el norte desde Cades, «oyendo el Cananeo, el rey de Arad, el cual habitaba al mediodía, que venía Israel por el camino de los centinelas, peleó con Israel, y tomó de él presa». Israel hizo voto de destruir sus ciudades y llamó al lugar Horma, «destrucción total». El rey de Arad figura también en la lista de reyes vencidos de Josué, y Jueces sitúa el desierto donde se establecieron los quenitas, parientes de Moisés, «al mediodía de Arad»."
    - "Tel Arad, el primer sitio del mapa, a unos 30 km al este de Beerseba, fue excavado por Ruth Amiran y Yohanan Aharoni desde 1962. Debajo hay una gran ciudad amurallada de la Edad del Bronce Antiguo; encima, en la colina, una serie de fortalezas judaítas desde aproximadamente el siglo IX (Aharoni pensaba que el X) hasta comienzos del VI a. C., con un pequeño santuario con altar y piedras erguidas, y más de cien óstraca, muchos dirigidos a su comandante Eliasib. Pero Tel Arad no tiene ciudad del Bronce Final, cuando Números parece situar a su rey. Algunos sitúan por ello la Arad cananea en Tel Malhata, a unos 12 km al sudoeste, el segundo sitio; Tel Masos, el tercero, se toma con más frecuencia por Horma. Otros sostienen que «Arad» designaba un distrito, pues la lista de Sisac de hacia 925 a. C. tiene dos Arad, una quizá «Arad la Grande»; y otros, que el relato refleja épocas posteriores."
    - "Tel Arad es hoy un parque nacional con la ciudad del Bronce Antiguo y la fortaleza de la edad del Hierro parcialmente reconstruidas; la moderna ciudad israelí de Arad, fundada en 1962, se halla unos 9 km al este."
  pt:
    - "Arade era uma cidade cananeia no Neguebe, o sul seco de Canaã. Quando Israel subiu de Cades para o norte, “O cananeu, o rei de Arade, que habitava no Sul, ouviu que Israel vinha pelo caminho de Atarim. Ele lutou contra Israel e levou alguns deles como prisioneiros”. Israel fez voto de destruir as cidades dele e chamou o lugar Hormá, “destruição total”. O rei de Arade também figura na lista de reis vencidos de Josué, e Juízes situa o deserto onde os queneus, parentes de Moisés, se estabeleceram “ao sul de Arade”."
    - "Tel Arad, o primeiro sítio do mapa, cerca de 30 km a leste de Berseba, foi escavado por Ruth Amiran e Yohanan Aharoni a partir de 1962. Embaixo há uma grande cidade murada da Idade do Bronze Antigo; em cima, na colina, uma série de fortalezas de Judá, de cerca do século IX (Aharoni pensava no X) ao início do VI a.C., com um pequeno santuário com um altar e pedras eretas, e mais de cem óstracos, muitos dirigidos ao seu comandante Eliasibe. Mas Tel Arad não tem cidade do Bronze Final, época em que Números parece situar o seu rei. Alguns põem, pois, a Arade cananeia em Tel Malhata, cerca de 12 km a sudoeste, o segundo sítio; Tel Masos, o terceiro, é com mais frequência tomado por Hormá. Outros sustentam que “Arade” designava um distrito, pois a lista de Sisaque, de cerca de 925 a.C., tem duas Arades, uma talvez “Arade, a grande”; outros ainda, que a narrativa reflete épocas posteriores."
    - "Tel Arad é hoje um parque nacional, com a cidade do Bronze Antigo e a fortaleza da Idade do Ferro parcialmente reconstruídas; a cidade israelense moderna de Arad, fundada em 1962, fica cerca de 9 km a leste."
  de:
    - "Arad war eine kanaanäische Stadt im Negev, dem trockenen Süden Kanaans. Als Israel von Kadesch nach Norden zog: „Und da die Kanaaniter, der König von Arad, der gegen Mittag wohnte, hörte, daß Israel hereinkommt durch den Weg der Kundschafter, stritt er wider Israel und führte etliche gefangen.“ Israel gelobte, seine Städte zu vernichten, und nannte den Ort Horma, „Vernichtung“. Der König von Arad steht auch in Josuas Liste der besiegten Könige, und das Richterbuch setzt die Wüste, in der sich die Keniter, Moses Verwandte, ansiedelten, „gegen Mittag der Stadt Arad“."
    - "Tel Arad, die erste Stätte der Karte, etwa 30 km östlich von Beerscheba, wurde ab 1962 von Ruth Amiran und Yohanan Aharoni ausgegraben. Unten liegt eine große ummauerte Stadt der Frühbronzezeit; darüber, auf dem Hügel, eine Folge judäischer Festungen vom etwa 9. (nach Aharoni schon 10.) bis zum frühen 6. Jahrhundert v. Chr., mit kleinem Heiligtum, Altar und Standsteinen und über hundert Ostraka, viele an den Kommandanten Eljaschib gerichtet. Doch Tel Arad hat keine Stadt der Spätbronzezeit, wo das Vierte Buch Mose seinen König zu verorten scheint. Manche setzen daher das kanaanäische Arad nach Tel Malhata, etwa 12 km südwestlich, die zweite Stätte; Tel Masos, die dritte, hält man öfter für Horma. Andere meinen, „Arad“ habe einen Bezirk bezeichnet, da Schischaks Liste von etwa 925 v. Chr. zwei Arad hat, eines vielleicht „Arad das große“; andere, die Erzählung spiegle spätere Zeiten."
    - "Tel Arad ist heute ein Nationalpark mit teilweise wiederaufgebauter Stadt der Frühbronzezeit und eisenzeitlicher Festung; die moderne israelische Stadt Arad, 1962 gegründet, liegt etwa 9 km östlich."
  fr:
    - "Arad était une ville cananéenne du Négev, le sud aride de Canaan. Quand Israël remonta de Qadesh, « Le roi d’Arad, Cananéen, qui habitait le midi, apprit qu’Israël venait par le chemin d’Atharim. Il combattit Israël, et emmena des prisonniers ». Israël fit vœu de détruire ses villes et nomma le lieu Horma, « destruction totale ». Le roi d’Arad figure aussi dans la liste des rois vaincus par Josué, et les Juges situent le désert où s’établirent les Kéniens, parents de Moïse, « au midi d’Arad »."
    - "Tel Arad, premier site de la carte, à 30 km à l’est de Beer-Schéba, fut fouillé par Ruth Amiran et Yohanan Aharoni dès 1962. En bas, une grande ville fortifiée du Bronze ancien ; au-dessus, sur la colline, des forteresses judéennes successives, du IXe siècle environ (le Xe selon Aharoni) au début du VIe siècle av. J.-C., avec un petit sanctuaire à autel et pierres dressées, et plus de cent ostraca, souvent adressés à son commandant Éliaschib. Mais Tel Arad n’a pas de ville du Bronze récent, où les Nombres semblent placer son roi. Certains placent donc l’Arad cananéenne à Tel Malhata, à environ 12 km au sud-ouest, deuxième site ; Tel Masos, le troisième, passe plus souvent pour Horma. D’autres tiennent qu’« Arad » désignait un district, la liste de Schischak vers 925 av. J.-C. comptant deux Arad, l’une peut-être « Arad la grande » ; d’autres, que le récit reflète des temps plus tardifs."
    - "Tel Arad est aujourd’hui un parc national dont la ville du Bronze ancien et la forteresse de l’âge du Fer sont en partie reconstruites ; la ville israélienne moderne d’Arad, fondée en 1962, se trouve à environ 9 km à l’est."
  it:
    - "Arad era una città cananea nel Negheb, il sud arido di Canaan. Quando Israele risalì da Kades, «il re cananeo di Arad, che abitava il mezzogiorno, avendo udito che Israele veniva per la via di Atharim, combatté contro Israele, e fece alcuni prigionieri». Israele fece voto di distruggere le sue città e chiamò il luogo Corma, «sterminio totale». Il re di Arad figura anche nell’elenco dei re sconfitti di Giosuè, e i Giudici collocano il deserto dove si stabilirono i Keniti, parenti di Mosè, «a mezzogiorno di Arad»."
    - "Tel Arad, il primo sito sulla carta, a circa 30 km a est di Bersabea, fu scavato da Ruth Amiran e Yohanan Aharoni dal 1962. Sotto si trova una grande città murata dell’antica età del Bronzo; sopra, sulla collina, una serie di fortezze giudaite dal IX secolo circa (Aharoni pensava al X) all’inizio del VI secolo a.C., con un piccolo santuario contenente un altare e pietre erette, e più di cento ostraca, molti indirizzati al suo comandante Eliasib. Ma Tel Arad non ha città del Bronzo Tardo, quando i Numeri sembrano collocare il suo re. Alcuni pongono perciò l’Arad cananea a Tel Malhata, a circa 12 km a sud-ovest, il secondo sito; Tel Masos, il terzo, è più spesso ritenuto Corma. Altri sostengono che «Arad» indicasse un distretto, poiché l’elenco di Sisak del 925 a.C. circa ha due Arad, una forse «Arad la grande»; altri ancora pensano che il racconto rifletta tempi posteriori."
    - "Tel Arad è ora un parco nazionale con la città dell’antica età del Bronzo e la fortezza dell’età del Ferro in parte ricostruite; la moderna città israeliana di Arad, fondata nel 1962, sorge a circa 9 km a est."
  pl:
    - "Arad było kananejskim miastem w Negewie, suchym południu Kanaanu. Gdy Izrael szedł na północ z Kadesz: „A gdy usłyszał Chananejczyk, król Harat, który mieszkał na południe, że Izraelczycy ciągnęli oną drogą, którą byli szpiegowie przeszli, tedy zwiódł bitwę z Izraelem, i pojmał ich wiele”. Izrael ślubował zniszczyć jego miasta i nazwał to miejsce Horma, „całkowite zniszczenie”. Król Arad występuje też w wykazie pokonanych królów u Jozuego, a Księga Sędziów umieszcza pustynię, gdzie osiedlili się Kenici, krewni Mojżesza, tam, „która jest na południe od Arad”."
    - "Tel Arad, pierwsze stanowisko na mapie, około 30 km na wschód od Beer-Szeby, wykopywali od 1962 roku Ruth Amiran i Yohanan Aharoni. Pod spodem leży wielkie obwarowane miasto z wczesnej epoki brązu; powyżej, na wzgórzu, szereg judzkich twierdz od około IX wieku (Aharoni sądził, że od X) do początku VI wieku p.n.e., z małym sanktuarium z ołtarzem i stojącymi kamieniami oraz ponad stu ostrakami, wiele zaadresowanych do dowódcy Eliaszyba. Ale Tel Arad nie ma miasta z późnej epoki brązu, kiedy Księga Liczb zdaje się umieszczać jego króla. Dlatego niektórzy umieszczają kananejskie Arad w Tel Malhata, około 12 km na południowy zachód, drugim stanowisku; Tel Masos, trzecie, częściej uważa się za Hormę. Inni sądzą, że „Arad” nazywało okręg, bo w wykazie Sziszaka z około 925 r. p.n.e. są dwa Arady, jeden może „Arad Wielki”; jeszcze inni myślą, że opowieść odzwierciedla późniejsze czasy."
    - "Tel Arad jest dziś parkiem narodowym z częściowo odbudowanym miastem z wczesnej epoki brązu i twierdzą z epoki żelaza; nowoczesne izraelskie miasto Arad, założone w 1962 roku, leży około 9 km na wschód."
  nl:
    - "Arad was een Kanaänitische stad in de Negev, het droge zuiden van Kanaän. Toen Israël uit Kades naar het noorden trok: “Als de Kanaäniet, de koning van Harad, wonende tegen het zuiden, hoorde, dat Israel door den weg der verspieders kwam, zo streed hij tegen Israel, en hij voerde enige gevangenen uit denzelven gevankelijk weg”. Israël beloofde zijn steden te verwoesten en noemde de plaats Chorma, “volledige verwoesting”. De koning van Arad staat ook in Jozua’s lijst van verslagen koningen, en Richteren plaatst de woestijn waar de Kenieten, Mozes’ verwanten, zich vestigden “tegen het zuiden van Harad”."
    - "Tel Arad, de eerste plaats op de kaart, zo’n 30 km ten oosten van Berseba, werd vanaf 1962 opgegraven door Ruth Amiran en Yohanan Aharoni. Daaronder ligt een grote ommuurde stad uit de vroege bronstijd; erboven, op de heuvel, een reeks Judese vestingen van ongeveer de negende eeuw (Aharoni dacht de tiende) tot de vroege zesde eeuw v.Chr., met een klein heiligdom met altaar en staande stenen, en ruim honderd ostraca, vele aan de commandant Eljasib. Maar Tel Arad heeft geen late-bronstijdstad, waar Numeri zijn koning lijkt te plaatsen. Sommigen plaatsen Kanaänitisch Arad daarom op Tel Malhata, zo’n 12 km naar het zuidwesten, de tweede plaats; Tel Masos, de derde, wordt vaker voor Chorma gehouden. Anderen menen dat “Arad” een district aanduidde, daar Sisaks lijst van circa 925 v.Chr. twee Arads heeft, een misschien “Arad de Grote”; weer anderen dat het verhaal latere tijden weerspiegelt."
    - "Tel Arad is nu een nationaal park met de stad uit de vroege bronstijd en de ijzertijdvesting gedeeltelijk herbouwd; de moderne Israëlische stad Arad, gesticht in 1962, ligt zo’n 9 km naar het oosten."
  cs:
    - "Arad bylo kenaanské město v Negevu, suchém jihu Kanaánu. Když Izrael přicházel od Kádeše na sever, „To když uslyšel Kananejský král v Arad, kterýž bydlil na poledne, že by táhl Izrael tou cestou, kterouž byli špehéři šli, bojoval s ním, a zajal jich množství“. Izrael učinil slib, že zničí jeho města, a nazval místo Chorma, „úplné zničení“. Král Aradu stojí také v Jozuově seznamu poražených králů a Kniha Soudců klade poušť, kde se usadili Kénijci, příbuzní Mojžíšovi, „k straně polední městu Arad“."
    - "Tel Arad, první místo na mapě, asi 30 km východně od Beer-šeby, kopali od roku 1962 Ruth Amiranová a Yohanan Aharoni. Dole leží velké opevněné město z rané doby bronzové; nahoře na pahorku řada judských pevností asi od 9. století (podle Aharoniho od 10.) do počátku 6. století př. n. l. s malou svatyní s oltářem a stojícími kameny a s více než stem ostrak, z nichž mnohá jsou adresována jeho veliteli Eljašíbovi. Ale na Tel Arad není město z pozdní doby bronzové, kam zřejmě Numeri kladou jeho krále. Někteří proto kladou kenaanský Arad na Tel Malhata, asi 12 km jihozápadně, druhé místo; Tel Masos, třetí, se častěji pokládá za Chormu. Jiní soudí, že „Arad“ označoval okrsek, protože Šíšakův seznam z asi 925 př. n. l. má dva Arady, jeden snad „Arad Veliký“; ještě jiní myslí, že příběh odráží pozdější doby."
    - "Tel Arad je nyní národním parkem s částečně přestavěným městem z rané doby bronzové a pevností z doby železné; moderní izraelské město Arad, založené v roce 1962, leží asi 9 km východně."
  sv:
    - "Arad var en kananeisk stad i Negev, det torra södra Kanaan. När Israel kom norrut från Kadesh: ”Då nu konungen i Arad, kananéen, som bodde i Sydlandet, hörde att Israel var i antågande på Atarimvägen, gav han sig i strid med Israel och tog några av dem till fånga”. Israel lovade att ge hans städer till spillo och gav platsen namnet Horma, ”fullständig förgörelse”. Kungen i Arad står också i Josuas förteckning över besegrade kungar, och Domarboken förlägger öknen där kainéerna, Moses släkt, bosatte sig ”söder om Arad”."
    - "Tel Arad, den första platsen på kartan, omkring 30 km öster om Beer Sheva, grävdes ut av Ruth Amiran och Yohanan Aharoni från 1962. Nedanför ligger en stor muromgärdad stad från äldre bronsåldern; ovanför, på kullen, flera fästningar från Juda rike från omkring 800-talet (Aharoni ansåg 900-talet) till början av 500-talet f.Kr., med en liten helgedom med altare och stenstoder, och över hundra ostraka, många adresserade till dess befälhavare Eljashiv. Men Tel Arad har ingen stad från senare bronsåldern, då Fjärde Mosebok tycks placera kungen. Några förlägger därför kananeiska Arad till Tel Malhata, omkring 12 km sydväst om, den andra platsen; Tel Masos, den tredje, tas oftare för Horma. Andra menar att ”Arad” betecknade ett distrikt, eftersom Shishaks lista från omkring 925 f.Kr. har två Arad, ett kanske ”Arad den stora”; andra tror att berättelsen speglar senare tider."
    - "Tel Arad är nu en nationalpark där den äldre bronsålderns stad och järnålderns fästning delvis har återuppbyggts; den moderna israeliska staden Arad, grundad 1962, ligger omkring 9 km österut."
  nb:
    - "Arad var en kana'anittisk by i Negev, det tørre sørlandet i Kanaan. Da Israel kom nordover fra Kadesj, hørte «den kana'anittiske konge i Arad, som bodde i sydlandet», at Israel «drog frem på veien til Atarim», og han «gav sig i strid med Israel og førte nogen av dem bort som fanger». Israel avla et løfte om å slå byene hans med bann og kalte stedet Horma, «fullstendig ødeleggelse». Kongen i Arad står også i Josvas liste over beseirede konger: «kongen i Horma én, kongen i Arad én», og Dommerboken plasserer ørkenen der kenittene, Moses' slekt, bosatte seg, i «Juda ørken, som ligger sønnenfor Arad»."
    - "Tel Arad, det første stedet på kartet, omtrent 30 km øst for Beer-Sjeba, ble gravd ut av Ruth Amiran og Yohanan Aharoni fra 1962. Nedenfor ligger en stor befestet by fra eldre bronsealder; ovenfor, på høyden, en rekke judeiske festninger fra omtrent 800-tallet (Aharoni mente 900-tallet) til tidlig 500-tall f.Kr., med en liten helligdom som rommet et alter og stående steiner, og over hundre ostraka, mange adressert til kommandanten Eljasjib. Men Tel Arad har ingen by fra senbronsealder, da 4. Mosebok synes å plassere kongen. Noen plasserer derfor det kana'anittiske Arad ved Tel Malhata, omtrent 12 km mot sørvest, det andre stedet; Tel Masos, det tredje, regnes oftere for Horma. Andre mener at «Arad» var navnet på et distrikt, siden Sjisjaks liste fra omkring 925 f.Kr. har to Arader, en kanskje «det store Arad»; atter andre tror at fortellingen speiler senere tider."
    - "Tel Arad er nå en nasjonalpark der byen fra eldre bronsealder og festningen fra jernalderen er delvis gjenreist; den moderne israelske byen Arad, grunnlagt i 1962, ligger omtrent 9 km mot øst."
