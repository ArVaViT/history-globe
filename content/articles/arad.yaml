body:
  en:
    - "Arad was a Canaanite town in the Negeb, the dry south of Canaan. When Israel came north from Kadesh, “king Arad the Canaanite, which dwelt in the south, heard tell that Israel came by the way of the spies; then he fought against Israel, and took some of them prisoners”. Israel vowed to destroy his towns and named the place Hormah, “utter destruction”. The king of Arad also stands in Joshua's list of defeated kings, and Judges sets the wilderness where the Kenites, Moses' kin, settled “in the south of Arad”."
    - "Tel Arad, the first site on the map, about 30 km east of Beersheba, was excavated by Ruth Amiran and Yohanan Aharoni from 1962. Below lies a large walled city of the Early Bronze Age; above, on the hill, a series of Judahite fortresses from about the tenth to the sixth century BC, with a small shrine holding an altar and standing stones, and over a hundred ostraca, many addressed to its commander Eliashib. But Tel Arad has no town of the Late Bronze Age, when Numbers seems to place its king. Some therefore put Canaanite Arad at Tel Malhata, about 12 km to the south-west, the second site; Tel Masos, the third, is more often taken for Hormah. Others hold that “Arad” named a district, as Shishak's list of about 925 BC has two Arads, one perhaps “Arad the great”; still others think the story reflects later times."
    - "Tel Arad is now a national park with the Early Bronze city and the Iron Age fortress partly rebuilt; the modern Israeli town of Arad, founded in 1962, lies some 9 km to the east."
  ru:
    - "Арад — ханаанский город в Негеве, засушливом юге Ханаана. Когда Израиль шёл на север от Кадеса, «Ханаанский царь Арада, живущий к югу, услышав, что Израиль идет дорогою от Афарима, вступил в сражение с Израильтянами и несколько из них взял в плен». Израиль дал обет истребить его города и нарёк месту имя Хорма, «заклятие». Царь Арада стоит и в списке побеждённых царей у Иисуса Навина, а в книге Судей пустыня, где поселились кенеяне, родня Моисея, лежит «на юг от Арада»."
    - "Тель-Арад, первое место на карте, примерно в 30 км к востоку от Вирсавии, раскапывали Рут Амиран и Йоханан Ахарони с 1962 года. Внизу лежит большой обнесённый стеной город раннего бронзового века; выше, на холме, — ряд иудейских крепостей примерно X–VI веков до н. э. с маленьким святилищем, где были жертвенник и каменные столбы, и более сотни остраконов, многие адресованы начальнику крепости Елиашиву. Но города позднего бронзового века, когда, по книге Чисел, правил царь Арада, на Тель-Араде нет. Поэтому одни помещают ханаанский Арад в Тель-Малхате, примерно в 12 км к юго-западу, — втором месте; Тель-Масос, третье место, чаще считают Хормой. Другие полагают, что Арадом звалась округа: в списке Шешонка около 925 г. до н. э. два Арада, один, возможно, «Арад великий»; третьи думают, что рассказ отражает более позднее время."
    - "Тель-Арад теперь национальный парк, где частично восстановлены город раннего бронзового века и крепость железного века; современный израильский город Арад, основанный в 1962 году, лежит примерно в 9 км к востоку."
  uk:
    - "Арад був ханаанським містом у Негеві, сухому півдні Ханаану. Коли Ізраїль ішов на північ від Кадеша, «прочув Канаанїй, царь Арадський, котрого осада була на полуднї, що йде Ізраїль шляхом до Атарима, і став битись з Ізраїльом і позаймав деяких із між їх у полонь». Ізраїль дав обітницю знищити його міста й назвав те місце Хорма, «цілковите знищення»: «назвали врочище те Горма». Цар Араду стоїть також у переліку переможених царів Ісуса Навина, а книга Суддів розміщує пустелю, де осіли кеніти, родичі Мойсея, «на Юдину пустиню, на підгіррє Арадське»."
    - "Тель-Арад, перше місце на мапі, приблизно за 30 км на схід від Беер-Шеви, розкопували від 1962 року Рут Аміран і Йоханан Агароні. Унизу лежить велике муроване місто ранньої бронзової доби; нагорі, на пагорбі, — низка юдейських фортець приблизно від X до VI століття до н. е., з невеликою святинею, де був жертовник і стоячі камені, та понад сто остраконів, багато з яких адресовані його коменданту Еліашіву. Але в Тель-Араді немає міста пізньої бронзової доби, коли, здається, Числа розміщують його царя. Тому дехто розміщує ханаанський Арад у Тель-Малхаті, приблизно за 12 км на південний захід, друге місце; Тель-Масос, третє, частіше вважають Хормою. Інші вважають, що «Арад» називав округ, оскільки в переліку Сусакіма близько 925 р. до н. е. є два Аради, один, можливо, «Арад Великий»; ще інші думають, що розповідь відбиває пізніші часи."
    - "Тель-Арад нині — національний парк з частково відбудованими містом ранньої бронзової доби та залізнодобовою фортецею; сучасне ізраїльське місто Арад, засноване в 1962 році, лежить приблизно за 9 км на схід."
  es:
    - "Arad era una ciudad cananea en el Néguev, el sur seco de Canaán. Cuando Israel vino hacia el norte desde Cades, «oyendo el Cananeo, el rey de Arad, el cual habitaba al mediodía, que venía Israel por el camino de los centinelas, peleó con Israel, y tomó de él presa». Israel hizo voto de destruir sus ciudades y llamó al lugar Horma, «destrucción total». El rey de Arad figura también en la lista de reyes vencidos de Josué, y Jueces sitúa el desierto donde se establecieron los quenitas, parientes de Moisés, «al mediodía de Arad»."
    - "Tel Arad, el primer sitio del mapa, a unos 30 km al este de Beerseba, fue excavado por Ruth Amiran y Yohanan Aharoni desde 1962. Debajo hay una gran ciudad amurallada de la Edad del Bronce Antiguo; encima, en la colina, una serie de fortalezas judaítas desde aproximadamente el siglo X hasta el VI a. C., con un pequeño santuario que contenía un altar y piedras erguidas, y más de cien óstraca, muchos dirigidos a su comandante Eliasib. Pero Tel Arad no tiene ciudad del Bronce Final, cuando Números parece situar a su rey. Algunos sitúan por ello la Arad cananea en Tel Malhata, a unos 12 km al sudoeste, el segundo sitio; Tel Masos, el tercero, se toma con más frecuencia por Horma. Otros sostienen que «Arad» designaba un distrito, pues la lista de Sisac de hacia 925 a. C. tiene dos Arad, una quizá «Arad la Grande»; y otros piensan aún que el relato refleja épocas posteriores."
    - "Tel Arad es hoy un parque nacional con la ciudad del Bronce Antiguo y la fortaleza de la edad del Hierro parcialmente reconstruidas; la moderna ciudad israelí de Arad, fundada en 1962, se halla unos 9 km al este."
  pt:
    - "Arade era uma cidade cananeia no Neguebe, o sul seco de Canaã. Quando Israel subiu de Cades para o norte, “O cananeu, o rei de Arade, que habitava no Sul, ouviu que Israel vinha pelo caminho de Atarim. Ele lutou contra Israel e levou alguns deles como prisioneiros”. Israel fez voto de destruir as cidades dele e chamou o lugar Hormá, “destruição total”. O rei de Arade também figura na lista de reis vencidos de Josué, e Juízes situa o deserto onde os queneus, parentes de Moisés, se estabeleceram “ao sul de Arade”."
    - "Tel Arad, o primeiro sítio do mapa, cerca de 30 km a leste de Berseba, foi escavado por Ruth Amiran e Yohanan Aharoni a partir de 1962. Embaixo há uma grande cidade murada da Idade do Bronze Antigo; em cima, na colina, uma série de fortalezas de Judá, de cerca do século X ao VI a.C., com um pequeno santuário que continha um altar e pedras eretas, e mais de cem óstracos, muitos dirigidos ao seu comandante Eliasibe. Mas Tel Arad não tem cidade do Bronze Final, época em que Números parece situar o seu rei. Alguns põem, pois, a Arade cananeia em Tel Malhata, cerca de 12 km a sudoeste, o segundo sítio; Tel Masos, o terceiro, é com mais frequência tomado por Hormá. Outros sustentam que “Arade” designava um distrito, pois a lista de Sisaque, de cerca de 925 a.C., tem duas Arades, uma talvez “Arade, a grande”; outros ainda pensam que a narrativa reflete épocas posteriores."
    - "Tel Arad é hoje um parque nacional, com a cidade do Bronze Antigo e a fortaleza da Idade do Ferro parcialmente reconstruídas; a cidade israelense moderna de Arad, fundada em 1962, fica cerca de 9 km a leste."
  de:
    - "Arad war eine kanaanäische Stadt im Negev, dem trockenen Süden Kanaans. Als Israel von Kadesch nach Norden zog: „Und da die Kanaaniter, der König von Arad, der gegen Mittag wohnte, hörte, daß Israel hereinkommt durch den Weg der Kundschafter, stritt er wider Israel und führte etliche gefangen.“ Israel gelobte, seine Städte zu vernichten, und nannte den Ort Horma, „Vernichtung“. Der König von Arad steht auch in Josuas Liste der besiegten Könige, und das Richterbuch setzt die Wüste, in der sich die Keniter, Moses Verwandte, ansiedelten, „gegen Mittag der Stadt Arad“."
    - "Tel Arad, die erste Stätte auf der Karte, etwa 30 km östlich von Beerscheba, wurde ab 1962 von Ruth Amiran und Yohanan Aharoni ausgegraben. Darunter liegt eine große ummauerte Stadt der Frühbronzezeit; darüber, auf dem Hügel, eine Folge judäischer Festungen vom etwa 10. bis zum 6. Jahrhundert v. Chr., mit kleinem Heiligtum, Altar und Standsteinen und über hundert Ostraka, viele an den Kommandanten Eljaschib gerichtet. Doch Tel Arad hat keine Stadt der Spätbronzezeit, wo das Vierte Buch Mose seinen König zu verorten scheint. Manche setzen daher das kanaanäische Arad nach Tel Malhata, etwa 12 km südwestlich, die zweite Stätte; Tel Masos, die dritte, hält man öfter für Horma. Andere meinen, „Arad“ habe einen Bezirk bezeichnet, da Schischaks Liste von etwa 925 v. Chr. zwei Arad hat, eines vielleicht „Arad das große“; andere glauben, die Erzählung spiegle spätere Zeiten."
    - "Tel Arad ist heute ein Nationalpark mit teilweise wiederaufgebauter Stadt der Frühbronzezeit und eisenzeitlicher Festung; die moderne israelische Stadt Arad, 1962 gegründet, liegt etwa 9 km östlich."
  fr:
    - "Arad était une ville cananéenne du Négev, le sud aride de Canaan. Quand Israël remonta de Qadesh, « Le roi d’Arad, Cananéen, qui habitait le midi, apprit qu’Israël venait par le chemin d’Atharim. Il combattit Israël, et emmena des prisonniers ». Israël fit vœu de détruire ses villes et nomma le lieu Horma, « destruction totale ». Le roi d’Arad figure aussi dans la liste des rois vaincus par Josué, et les Juges situent le désert où s’établirent les Kéniens, parents de Moïse, « au midi d’Arad »."
    - "Tel Arad, premier site de la carte, à 30 km à l’est de Beer-Schéba, fut fouillé par Ruth Amiran et Yohanan Aharoni à partir de 1962. En bas s’étend une grande ville fortifiée du Bronze ancien ; au-dessus, sur la colline, des forteresses judéennes successives, Xe-VIe siècle av. J.-C. environ, avec un petit sanctuaire à autel et pierres dressées, et plus de cent ostraca, dont beaucoup adressés à son commandant Éliaschib. Mais Tel Arad n’a pas de ville du Bronze récent, où les Nombres semblent placer son roi. Certains situent donc l’Arad cananéenne à Tel Malhata, à environ 12 km au sud-ouest, deuxième site ; Tel Masos, le troisième, est plus souvent tenu pour Horma. D’autres tiennent qu’« Arad » désignait un district, la liste de Schischak vers 925 av. J.-C. comptant deux Arad, l’une peut-être « Arad la grande » ; d’autres, que le récit reflète des temps plus tardifs."
    - "Tel Arad est aujourd’hui un parc national dont la ville du Bronze ancien et la forteresse de l’âge du Fer sont en partie reconstruites ; la ville israélienne moderne d’Arad, fondée en 1962, se trouve à environ 9 km à l’est."
