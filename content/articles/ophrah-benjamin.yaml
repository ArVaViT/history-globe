body:
  en:
    - "This Ophrah is a town of Benjamin, not the Ophrah of Gideon in Manasseh, which has its own article. It is named in the list of Benjamin's cities, “And Avim, and Parah, and Ophrah”, and once in the story of Saul's war with the Philistines: from their camp at Michmash “the spoilers came out of the camp of the Philistines in three companies: one company turned unto the way that leadeth to Ophrah, unto the land of Shual”. That is all the Bible says of it by this name."
    - "It is usually identified with et-Taiyibeh, a hilltop village about 6 km north-east of Bethel, which fits both passages and Eusebius' note placing Aphra five miles east of Bethel; many also equate it with Ephron, taken by Abijah, and with the Ephraim to which Jesus withdrew, though this is not certain. Taybeh is today a Palestinian Christian village with the ruined Byzantine church of St George."
  ru:
    - "Эта Офра — город Вениамина, а не Офра Гедеона в Манассии, о которой есть отдельная статья. Она названа в списке городов Вениамина — «Аввим, Фара и Офра» — и однажды в рассказе о войне Саула с Филистимлянами: из их стана у Михмаса «вышли из стана Филистимского три отряда для опустошения земли: один направился по дороге к Офре, в округ Суаль». Больше под этим именем Библия о ней ничего не говорит."
    - "Её обычно отождествляют с Эт-Тайибе, селением на холме примерно в 6 км к северо-востоку от Вефиля, что подходит к обоим местам и к замечанию Евсевия, помещающему Афру в пяти милях к востоку от Вефиля; многие считают её также Ефроном, взятым Авией, и городом Ефраимом, куда удалился Иисус, хотя это не точно. Тайбе сегодня — палестинское христианское селение с развалинами византийской церкви святого Георгия."
  uk:
    - "Ця Офра — місто Веніямина, а не Офра Гедеона в Манасії, якій присвячено окрему статтю. Вона названа в переліку міст Веніямина — «Авим, Фара, та Офра» — і один раз в оповіді про війну Саула з филистимлянами: з їхнього табору в Міхмасі вийшли «три віддїли пустошити землю: один чамбул пустився на Офру», до землі Шуал. Це все, що Біблія говорить про неї під цією назвою."
    - "Її зазвичай ототожнюють із ет-Тайїбе, селом на пагорбі приблизно за 6 км на північний схід від Бет-Елу, що підходить до обох уривків і до згадки Євсевія, що розміщує Афру за п’ять миль на схід від Бет-Елу; багато хто також ототожнює її з Ефроном, узятим Авією, і з Єфремом, куди відійшов Ісус, хоча це не певно. Тайбе нині — палестинське християнське село зі зруйнованою візантійською церквою святого Георгія."
  es:
    - "Esta Ofra es una ciudad de Benjamín, no la Ofra de Gedeón en Manasés, que tiene su propio artículo. Se nombra en la lista de las ciudades de Benjamín, «Y Avim, y Para, y Ophra», y una vez en el relato de la guerra de Saúl con los filisteos: desde su campamento en Micmas «salieron del campo de los Filisteos en correría tres escuadrones. El un escuadrón tiró por el camino de Ophra hacia la tierra de Sual». Eso es todo lo que la Biblia dice de ella con este nombre."
    - "Suele identificarse con et-Taiyibeh, una aldea en una cima a unos 6 km al noreste de Betel, que encaja con ambos pasajes y con la nota de Eusebio que sitúa Afra a cinco millas al este de Betel; muchos la equiparan también con Efrón, tomada por Abías, y con el Efraín al que se retiró Jesús, aunque esto no es seguro. Taybeh es hoy una aldea cristiana palestina con la iglesia bizantina en ruinas de San Jorge."
  pt:
    - "Esta Ofra é uma cidade de Benjamim, não a Ofra de Gideão, em Manassés, que tem artigo próprio. Aparece na lista das cidades de Benjamim, “Avim, Pará, Ofra”, e uma vez na história da guerra de Saul com os filisteus: do acampamento deles em Micmás “grupos de ataque saíram do acampamento dos filisteus em três companhias: uma companhia tomou a direção de Ofra, rumo à terra de Sual”. É tudo o que a Bíblia diz dela com este nome."
    - "Costuma ser identificada com et-Taiyibeh, aldeia no alto de uma colina a cerca de 6 km a nordeste de Betel, que se ajusta às duas passagens e à nota de Eusébio que situa Afra a cinco milhas a leste de Betel; muitos também a equiparam a Efrom, tomada por Abias, e a Efraim, para onde Jesus se retirou, embora isso não seja certo. Taybeh é hoje uma aldeia cristã palestina com a igreja bizantina em ruínas de São Jorge."
  de:
    - "Dieses Ofra ist eine Stadt in Benjamin, nicht das Ofra Gideons in Manasse, das einen eigenen Artikel hat. Es steht in der Liste der Städte Benjamins: „Avvim, Happara, Ophra“, und einmal in der Erzählung von Sauls Krieg mit den Philistern: Aus ihrem Lager bei Michmas „zogen drei Haufen, das Land zu verheeren. Einer wandte sich auf die Straße gen Ophra ins Land Sual“. Mehr sagt die Bibel unter diesem Namen nicht."
    - "Es wird meist mit et-Taijibe gleichgesetzt, einem Dorf auf einem Hügel etwa 6 km nordöstlich von Bethel, was zu beiden Stellen und zu Eusebius' Notiz, die Aphra fünf Meilen östlich von Bethel ansetzt passt; viele setzen es auch mit Efron gleich, das Abija einnahm, und mit dem Ephraim, wohin Jesus sich zurückzog, doch ist das nicht sicher. Taybeh ist heute ein palästinensisch-christliches Dorf mit der Ruine der byzantinischen Georgskirche."
  fr:
    - "Cette Ophra est une ville de Benjamin, et non l’Ophra de Gédéon en Manassé, qui a son propre article. Elle est nommée dans la liste des villes de Benjamin, « Avvim, Para, Ophra », et une fois dans le récit de la guerre de Saül contre les Philistins : de leur camp à Micmasch, « il sortit du camp des Philistins trois corps pour ravager : l’un prit le chemin d’Ophra, vers le pays de Schual ». C’est tout ce que la Bible dit d’elle sous ce nom."
    - "On l’identifie d’ordinaire à et-Taiyibeh, village de colline à environ 6 km au nord-est de Béthel, qui convient aux deux passages et à la note d’Eusèbe plaçant Aphra à cinq milles à l’est de Béthel ; beaucoup l’assimilent aussi à Éphron, prise par Abija, et à l’Éphraïm où Jésus se retira, bien que ce ne soit pas certain. Taybeh est aujourd’hui un village chrétien palestinien, avec l’église byzantine en ruine de Saint-Georges."
  it:
    - "Questa Ofra è una città di Beniamino, non l’Ofra di Gedeone in Manasse, che ha un articolo a parte. È nominata nell’elenco delle città di Beniamino, «Avvim, Para, Ofra», e una volta nel racconto della guerra di Saul contro i Filistei: dal loro campo di Micmas «dal campo de’ Filistei uscirono dei guastatori divisi in tre schiere: una prese la via d’Ofra, verso il paese di Shual». È tutto ciò che la Bibbia dice di essa con questo nome."
    - "È di solito identificata con et-Taiyibeh, un villaggio in collina circa 6 km a nord-est di Betel, che si accorda con entrambi i passi e con la nota di Eusebio che pone Afra a cinque miglia a est di Betel; molti la identificano anche con Efron, presa da Abia, e con l’Efraim in cui si ritirò Gesù, benché ciò non sia certo. Taybeh è oggi un villaggio cristiano palestinese con la chiesa bizantina in rovina di San Giorgio."
  pl:
    - "Ta Ofra jest miastem Beniamina, nie Ofrą Gedeona w Manassesie, której poświęcono osobny artykuł. Wymieniona jest na liście miast Beniamina: „I Awim, i Afara, i Ofera”, i raz w opowieści o wojnie Saula z Filistynami: z ich obozu w Mikmas „wyszły dla zdobyczy z obozu Filistyńskiego trzy hufce: hufiec jeden obrócił się drogą ku Ofra do ziemi Saul”. To wszystko, co Biblia mówi o niej pod tą nazwą."
    - "Utożsamia się ją zwykle z et-Tajjibe, wsią na wzgórzu około 6 km na północny wschód od Betel, co pasuje do obu fragmentów i do wzmianki Euzebiusza umieszczającej Afrę pięć mil na wschód od Betel; wielu utożsamia ją też z Efronem, zdobytym przez Abiasza, i z Efraimem, do którego wycofał się Jezus, choć nie jest to pewne. Tajbe to dziś palestyńska wieś chrześcijańska z ruinami bizantyńskiego kościoła św. Jerzego."
  cs:
    - "Tato Ofra je město v Benjamínovi, nikoli Gedeonova Ofra v Manasesovi, která má vlastní článek. Je uvedena v seznamu Benjamínových měst: „A Avim, též Afara a Ofra“, a jednou v příběhu o Saulově válce s Pelištejci: z jejich tábora u Michmasu „vyšli zhoubcové z vojska Filistinského na tré rozdělení. Houf jeden obrátil se k cestě Ofra, k zemi Sual“. To je vše, co Bible o ní pod tímto jménem říká."
    - "Obvykle se ztotožňuje s et-Tajjibe, vesnicí na vrcholu pahorku asi 6 km severovýchodně od Bét-elu, což odpovídá oběma místům i Eusebiově poznámce, jež klade Afru pět mil východně od Bét-elu; mnozí ji kladou i k Efrónu, který dobyl Abija, a k Efrajimu, kam se stáhl Ježíš, což však není jisté. Tajbe je dnes palestinská křesťanská vesnice se zříceným byzantským kostelem svatého Jiří."
  nl:
    - "Deze Ofra is een stad van Benjamin, niet de Ofra van Gideon in Manasse, die een eigen artikel heeft. Ze wordt genoemd in de lijst van Benjamins steden, “En Haavvim, en Para, en Ofra”, en eenmaal in het verhaal van Sauls oorlog met de Filistijnen: vanuit hun kamp bij Michmas, “En de verdervers gingen uit het leger der Filistijnen, in drie hopen; de ene hoop keerde zich op den weg naar Ofra, naar het land Sual”. Dat is alles wat de Bijbel onder deze naam zegt."
    - "Ze wordt meestal gelijkgesteld met et-Taiyibeh, een dorp op een heuveltop zo’n 6 km ten noordoosten van Bethel, dat bij beide passages past en bij Eusebius’ aantekening die Afra vijf mijl ten oosten van Bethel plaatst; velen vereenzelvigen haar ook met Efron, door Abia ingenomen, en met het Efraïm waarheen Jezus zich terugtrok, hoewel dit niet zeker is. Taybeh is tegenwoordig een Palestijns christelijk dorp met de verwoeste Byzantijnse kerk van Sint-Joris."
  sv:
    - "Detta Ofra är en stad i Benjamin, inte Gideons Ofra i Manasse, som har en egen artikel. Det nämns i förteckningen över Benjamins städer, ”Avim, Para, Ofra”, och en gång i berättelsen om Sauls krig mot filistéerna: från deras läger vid Mikmas heter det: ”En härskara, delad i tre hopar, drog ut ur filistéernas läger för att härja: en hop tog vägen till Ofra i Sualslandet.” Det är allt Bibeln säger om det under detta namn."
    - "Det identifieras vanligen med et-Taiyibeh, en by på en kulle cirka 6 km nordost om Betel, vilket passar båda ställena och Eusebios notering som placerar Afra fem romerska mil öster om Betel; många likställer det också med Efron, som Avia intog, och med Efraim dit Jesus drog sig undan, fastän detta inte är säkert. Taybeh är i dag en palestinsk kristen by med den förfallna bysantinska kyrkan Sankt Georg."
  nb:
    - "Denne Ofra er en by i Benjamin, ikke Gideons Ofra i Manasse, som har sin egen artikkel. Den er nevnt i listen over Benjamins byer, «og Ha'avvim og Happara og Ofra», og én gang i fortellingen om Sauls krig med filistrene: fra leiren deres ved Mikmas «drog det en flokk ut av filistrenes leir for å herje; den var delt i tre hoper; den ene hop tok veien til Ofra, til Sual-bygden». Det er alt Bibelen sier om den under dette navnet."
    - "Den identifiseres vanligvis med et-Taiyibeh, en landsby på en høyde omtrent 6 km nordøst for Betel, som passer til begge tekstene og til Eusebius' notis som plasserer Aphra fem romerske mil øst for Betel; mange setter den også lik Efron, som Abia inntok, og Efraim, dit Jesus trakk seg tilbake, men dette er ikke sikkert. Taybeh er i dag en palestinsk kristen landsby med ruinene av den bysantinske kirken Sankt Georg."
  tl:
    - "Ang Ophra na ito ay isang bayan ng Benjamin, hindi ang Ophra ni Gedeon sa Manases, na may sariling artikulo. Pinangalanan ito sa listahan ng mga lungsod ng Benjamin, “At Avim, at Para, at Ophra”, at minsan sa kuwento ng digmaan ni Saul laban sa mga Filisteo: mula sa kanilang kampo sa Michmas, “ang mga mananamsam ay lumabas na tatlong pulutong sa kampamento ng mga Filisteo; ang isang pulutong ay lumiko sa daan na patungo sa Ophra, na patungo sa lupain ng Sual”. Iyon na lamang ang sinasabi ng Bibliya tungkol dito sa ilalim ng pangalang ito."
    - "Karaniwang kinikilala ito sa et-Taiyibeh, isang nayong nasa tuktok ng burol na mga 6 km sa hilagang-silangan ng Beth-el, na akma sa dalawang talata at sa tala ni Eusebio na naglalagay sa Aphra nang limang milya sa silangan ng Beth-el; marami rin ang nagpapantay dito sa Ephron, na kinuha ni Abias, at sa Ephraim na pinag-urungan ni Jesus, bagaman hindi ito tiyak. Ang Taybeh ngayon ay isang nayong Kristiyanong Palestino na may wasak na simbahang Bisantino ni San Jorge."
  da:
    - "Denne Ofra er en by i Benjamin og ikke Gideons Ofra i Manasse, som har sin egen artikel. Den nævnes på listen over Benjamins byer, »og Avim og Para og Ofra«, og én gang i fortællingen om Sauls krig med filisterne: fra deres lejr ved Mikmas »uddrog en ødelæggende Skare af Filisternes Lejr i tre Hobe; den ene Hob vendte sig ad Vejen imod Ofra, til Landet Sual«. Det er alt, Bibelen siger om den under dette navn."
    - "Den identificeres sædvanligvis med et-Taiyibeh, en landsby på en bakketop omkring 6 km nordøst for Betel, som passer til begge steder og til Eusebius' notits, der placerer Afra fem romerske mil øst for Betel; mange sidestiller den også med Efron, som Abija indtog, og med det Efraim, som Jesus trak sig tilbage til, dog ikke med sikkerhed. Taybeh er i dag en palæstinensisk kristen landsby med den ødelagte byzantinske Sankt Georgs-kirke."
  sr:
    - "Ова Офра је град Венијаминов, а не Гедеонова Офра у Манасији, о којој постоји посебан чланак. Налази се на списку градова Венијаминових, „и Авин и Фара и Офра“, и једном у причи о Сауловом рату с Филистејима: из њиховог логора у Михмасу „изиђоше три чете из логора филистејског да плене: Једна чета удари путем к Офри у земљу совалску“. То је све што Библија каже о њој под тим именом."
    - "Обично се поистовећује с ет-Тајибом, брдским селом око 6 км североисточно од Ветиља, што одговара оба одломка и Јевсевијевој напомени која смешта Афру пет миља источно од Ветиља; многи је изједначавају и с Ефроном, који је узео Авија, и са Јефремом у који се повукао Исус, мада то није сигурно. Тајиба је данас палестинско хришћанско село с порушеном византијском црквом светог Ђорђа."
scripture:
  - Josh.18.23
