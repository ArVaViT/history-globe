body:
  en:
    - "This Ophrah is a town of Benjamin, not the Ophrah of Gideon in Manasseh, which has its own article. It is named in the list of Benjamin's cities, “And Avim, and Parah, and Ophrah”, and once in the story of Saul's war with the Philistines: from their camp at Michmash “the spoilers came out of the camp of the Philistines in three companies: one company turned unto the way that leadeth to Ophrah, unto the land of Shual”. That is all the Bible says of it by this name."
    - "It is usually identified with et-Taiyibeh, a hilltop village about 6 km north-east of Bethel, which fits both passages and Eusebius' note placing Aphra five miles east of Bethel; many also equate it with Ephron, taken by Abijah, and with the Ephraim to which Jesus withdrew, though this is not certain. Taybeh is today a Palestinian Christian village with the ruined Byzantine church of St George."
    - "The Survey of Western Palestine set out the case for Taiyibeh. Its memoir of 1882 describes a large Christian village in a conspicuous position and, from its distance from Bethel, takes it for Ophrah of Benjamin; it adds that the valley of Zeboim, named in the same passage, may be the Wadi Taiyibeh below. The surveyors judged it a place of importance in Jewish times and recorded a Jewish tomb with burial niches and a cross carved over its entrance, which they took as a sign that Christians had later reused it."
    - "East of the village, at el-Khader, they found a Byzantine basilica with a smaller Crusader chapel built on its ruins. French excavations led by Vincent Michel from 2000 to 2009 dated the first church, from its pottery, to the late fifth or early sixth century."
  ru:
    - "Эта Офра — город Вениамина, а не Офра Гедеона в Манассии, о которой есть отдельная статья. Она названа в списке городов Вениамина — «Аввим, Фара и Офра» — и однажды в рассказе о войне Саула с Филистимлянами: из их стана у Михмаса «вышли из стана Филистимского три отряда для опустошения земли: один направился по дороге к Офре, в округ Суаль». Больше под этим именем Библия о ней ничего не говорит."
    - "Её обычно отождествляют с Эт-Тайибе, селением на холме примерно в 6 км к северо-востоку от Вефиля, что подходит к обоим местам и к замечанию Евсевия, помещающему Афру в пяти милях к востоку от Вефиля; многие считают её также Ефроном, взятым Авией, и городом Ефраимом, куда удалился Иисус, хотя это не точно. Тайбе сегодня — палестинское христианское селение с развалинами византийской церкви святого Георгия."
    - "Доводы в пользу Тайибе изложил «Обзор Западной Палестины». Его описание 1882 года говорит о большом христианском селении на видном месте и по расстоянию от Вефиля принимает его за Офру Вениаминову; там же сказано, что долина Цевоим, названная в том же рассказе, может быть вади Тайибе ниже селения. Исследователи сочли это место значительным уже в иудейские времена и описали иудейскую гробницу с погребальными нишами, и высеченным над входом крестом, в котором увидели знак того, что позже её заново использовали христиане."
    - "К востоку от селения, в месте Эль-Хадр, они нашли византийскую базилику и меньшую часовню крестоносцев, построенную на её развалинах. Французские раскопки под руководством Венсана Мишеля в 2000–2009 годах датировали первую церковь по керамике концом V или началом VI века."
  uk:
    - "Ця Офра — місто Веніямина, а не Офра Гедеона в Манасії, якій присвячено окрему статтю. Вона названа в переліку міст Веніямина — «Авим, Фара, та Офра» — і один раз в оповіді про війну Саула з филистимлянами: з їхнього табору в Міхмасі вийшли «три віддїли пустошити землю: один чамбул пустився на Офру», до землі Шуал. Це все, що Біблія говорить про неї під цією назвою."
    - "Її зазвичай ототожнюють із ет-Тайїбе, селом на пагорбі приблизно за 6 км на північний схід від Бет-Елу, що підходить до обох уривків і до згадки Євсевія, що розміщує Афру за п’ять миль на схід від Бет-Елу; багато хто також ототожнює її з Ефроном, узятим Авією, і з Єфремом, куди відійшов Ісус, хоча це не певно. Тайбе нині — палестинське християнське село зі зруйнованою візантійською церквою святого Георгія."
    - "Аргументи на користь Тайїбе виклало «Обстеження Західної Палестини». Його опис 1882 року говорить про велике християнське село на видному місці й за відстанню від Бет-Елу вважає його Офрою Веніяминовою; там же сказано, що долина Цевоїм, названа в тому самому уривку, може бути ваді Тайїбе нижче села. Дослідники вважали це місце значним уже в юдейські часи й описали юдейську гробницю з поховальними нішами, і вирізьбленим над входом хрестом, у якому побачили знак того, що згодом її знову використали християни."
    - "На схід від села, у місці ель-Хадр, вони знайшли візантійську базиліку з меншою каплицею хрестоносців, збудованою на її руїнах. Французькі розкопки під керівництвом Венсана Мішеля у 2000–2009 роках датували першу церкву за керамікою кінцем V або початком VI ст."
  es:
    - "Esta Ofra es una ciudad de Benjamín, no la Ofra de Gedeón en Manasés, que tiene su propio artículo. Se nombra en la lista de las ciudades de Benjamín, «Y Avim, y Para, y Ophra», y una vez en el relato de la guerra de Saúl con los filisteos: desde su campamento en Micmas «salieron del campo de los Filisteos en correría tres escuadrones. El un escuadrón tiró por el camino de Ophra hacia la tierra de Sual». Eso es todo lo que la Biblia dice de ella con este nombre."
    - "Suele identificarse con et-Taiyibeh, una aldea en una cima a unos 6 km al noreste de Betel, que encaja con ambos pasajes y con la nota de Eusebio que sitúa Afra a cinco millas al este de Betel; muchos la equiparan también con Efrón, tomada por Abías, y con el Efraín al que se retiró Jesús, aunque esto no es seguro. Taybeh es hoy una aldea cristiana palestina con la iglesia bizantina en ruinas de San Jorge."
    - "El Survey of Western Palestine expuso los argumentos a favor de Taiyibeh. Su memoria de 1882 describe una gran aldea cristiana en posición destacada y, por su distancia de Betel, la toma por la Ofra de Benjamín; añade que el valle de Zeboim, nombrado en el mismo pasaje, puede ser el Wadi Taiyibeh, más abajo. Los topógrafos la juzgaron un lugar importante en tiempos judíos y registraron una tumba judía con nichos funerarios y una cruz tallada sobre su entrada, que tomaron como señal de que los cristianos la reutilizaron después."
    - "Al este de la aldea, en el-Khader, encontraron una basílica bizantina con una capilla cruzada más pequeña construida sobre sus ruinas. Las excavaciones francesas dirigidas por Vincent Michel entre 2000 y 2009 dataron la primera iglesia, por su cerámica, a finales del siglo V o comienzos del VI."
  pt:
    - "Esta Ofra é uma cidade de Benjamim, não a Ofra de Gideão, em Manassés, que tem artigo próprio. Aparece na lista das cidades de Benjamim, “Avim, Pará, Ofra”, e uma vez na história da guerra de Saul com os filisteus: do acampamento deles em Micmás “grupos de ataque saíram do acampamento dos filisteus em três companhias: uma companhia tomou a direção de Ofra, rumo à terra de Sual”. É tudo o que a Bíblia diz dela com este nome."
    - "Costuma ser identificada com et-Taiyibeh, aldeia no alto de uma colina a cerca de 6 km a nordeste de Betel, que se ajusta às duas passagens e à nota de Eusébio que situa Afra a cinco milhas a leste de Betel; muitos também a equiparam a Efrom, tomada por Abias, e a Efraim, para onde Jesus se retirou, embora isso não seja certo. Taybeh é hoje uma aldeia cristã palestina com a igreja bizantina em ruínas de São Jorge."
    - "O Survey of Western Palestine expôs os argumentos a favor de Taiyibeh. Sua memória de 1882 descreve uma grande aldeia cristã em posição destacada e, pela distância de Betel, toma-a pela Ofra de Benjamim; acrescenta que o vale de Zeboim, citado na mesma passagem, pode ser o Wadi Taiyibeh, logo abaixo. Os topógrafos a julgaram um lugar importante nos tempos judaicos e registraram um túmulo judaico com nichos funerários e uma cruz gravada sobre a entrada, que tomaram como sinal de que os cristãos depois o reutilizaram."
    - "A leste da aldeia, em el-Khader, encontraram uma basílica bizantina com uma capela cruzada menor construída sobre suas ruínas. As escavações francesas dirigidas por Vincent Michel de 2000 a 2009 dataram a primeira igreja, pela cerâmica, do fim do século V ou início do VI."
  de:
    - "Dieses Ofra ist eine Stadt in Benjamin, nicht das Ofra Gideons in Manasse, das einen eigenen Artikel hat. Es steht in der Liste der Städte Benjamins: „Avvim, Happara, Ophra“, und einmal in der Erzählung von Sauls Krieg mit den Philistern: Aus ihrem Lager bei Michmas „zogen drei Haufen, das Land zu verheeren. Einer wandte sich auf die Straße gen Ophra ins Land Sual“. Mehr sagt die Bibel unter diesem Namen nicht."
    - "Es wird meist mit et-Taijibe gleichgesetzt, einem Dorf auf einem Hügel etwa 6 km nordöstlich von Bethel, was zu beiden Stellen und zu Eusebius' Notiz, die Aphra fünf Meilen östlich von Bethel ansetzt passt; viele setzen es auch mit Efron gleich, das Abija einnahm, und mit dem Ephraim, wohin Jesus sich zurückzog, doch ist das nicht sicher. Taybeh ist heute ein palästinensisch-christliches Dorf mit der Ruine der byzantinischen Georgskirche."
    - "Der Survey of Western Palestine legte die Gründe für Taijibe dar. Seine Beschreibung von 1882 schildert ein großes christliches Dorf in weithin sichtbarer Lage und hält es wegen seiner Entfernung von Bethel für Ofra in Benjamin; sie fügt hinzu, das Tal Zeboim, das im selben Abschnitt genannt wird, könne das Wadi Taijibe darunter sein. Die Vermesser hielten den Ort schon in jüdischer Zeit für bedeutend und verzeichneten ein jüdisches Grab mit Schiebestollen und einem über dem Eingang eingemeißelten Kreuz, das sie als Zeichen dafür ansahen, dass Christen es später wiederverwendet hatten."
    - "Östlich des Dorfes, bei el-Khader, fanden sie eine byzantinische Basilika mit einer kleineren Kreuzfahrerkapelle, die auf ihren Ruinen errichtet war. Französische Grabungen unter Vincent Michel von 2000 bis 2009 datierten die erste Kirche anhand der Keramik in das späte 5. oder frühe 6. Jahrhundert."
  fr:
    - "Cette Ophra est une ville de Benjamin, et non l’Ophra de Gédéon en Manassé, qui a son propre article. Elle est nommée dans la liste des villes de Benjamin, « Avvim, Para, Ophra », et une fois dans le récit de la guerre de Saül contre les Philistins : de leur camp à Micmasch, « il sortit du camp des Philistins trois corps pour ravager : l’un prit le chemin d’Ophra, vers le pays de Schual ». C’est tout ce que la Bible dit d’elle sous ce nom."
    - "On l’identifie d’ordinaire à et-Taiyibeh, village de colline à environ 6 km au nord-est de Béthel, qui convient aux deux passages et à la note d’Eusèbe plaçant Aphra à cinq milles à l’est de Béthel ; beaucoup l’assimilent aussi à Éphron, prise par Abija, et à l’Éphraïm où Jésus se retira, bien que ce ne soit pas certain. Taybeh est aujourd’hui un village chrétien palestinien, avec l’église byzantine en ruine de Saint-Georges."
    - "Le Survey of Western Palestine exposa les raisons de voir Ophra à Taiyibeh. Son mémoire de 1882 décrit un grand village chrétien en position bien visible et, d’après sa distance de Béthel, le prend pour Ophra de Benjamin ; il ajoute que la vallée de Tseboïm, nommée dans le même passage, pourrait être le Wadi Taiyibeh en contrebas. Les topographes y virent un lieu important dès l’époque juive et relevèrent un tombeau juif à niches funéraires et une croix gravée au-dessus de l’entrée, signe à leurs yeux que des chrétiens l’avaient plus tard réutilisé."
    - "À l’est du village, à el-Khader, ils trouvèrent une basilique byzantine avec une chapelle croisée plus petite bâtie sur ses ruines. Les fouilles françaises dirigées par Vincent Michel de 2000 à 2009 ont daté la première église, d’après sa céramique, de la fin du Ve ou du début du VIe siècle."
  it:
    - "Questa Ofra è una città di Beniamino, non l’Ofra di Gedeone in Manasse, che ha un articolo a parte. È nominata nell’elenco delle città di Beniamino, «Avvim, Para, Ofra», e una volta nel racconto della guerra di Saul contro i Filistei: dal loro campo di Micmas «dal campo de’ Filistei uscirono dei guastatori divisi in tre schiere: una prese la via d’Ofra, verso il paese di Shual». È tutto ciò che la Bibbia dice di essa con questo nome."
    - "È di solito identificata con et-Taiyibeh, un villaggio in collina circa 6 km a nord-est di Betel, che si accorda con entrambi i passi e con la nota di Eusebio che pone Afra a cinque miglia a est di Betel; molti la identificano anche con Efron, presa da Abia, e con l’Efraim in cui si ritirò Gesù, benché ciò non sia certo. Taybeh è oggi un villaggio cristiano palestinese con la chiesa bizantina in rovina di San Giorgio."
    - "Il Survey of Western Palestine espose le ragioni a favore di Taiyibeh. La sua memoria del 1882 descrive un grande villaggio cristiano in posizione ben visibile e, per la distanza da Betel, lo prende per l’Ofra di Beniamino; aggiunge che la valle di Zeboim, nominata nello stesso passo, potrebbe essere il Wadi Taiyibeh più in basso. I topografi lo giudicarono un luogo importante già in epoca giudaica e registrarono una tomba ebraica con nicchie funerarie e una croce incisa sopra l’ingresso, che interpretarono come segno che i cristiani l’avevano in seguito riutilizzata."
    - "A est del villaggio, a el-Khader, trovarono una basilica bizantina con una cappella crociata più piccola costruita sulle sue rovine. Gli scavi francesi diretti da Vincent Michel dal 2000 al 2009 hanno datato la prima chiesa, in base alla ceramica, alla fine del V o all’inizio del VI secolo."
  pl:
    - "Ta Ofra jest miastem Beniamina, nie Ofrą Gedeona w Manassesie, której poświęcono osobny artykuł. Wymieniona jest na liście miast Beniamina: „I Awim, i Afara, i Ofera”, i raz w opowieści o wojnie Saula z Filistynami: z ich obozu w Mikmas „wyszły dla zdobyczy z obozu Filistyńskiego trzy hufce: hufiec jeden obrócił się drogą ku Ofra do ziemi Saul”. To wszystko, co Biblia mówi o niej pod tą nazwą."
    - "Utożsamia się ją zwykle z et-Tajjibe, wsią na wzgórzu około 6 km na północny wschód od Betel, co pasuje do obu fragmentów i do wzmianki Euzebiusza umieszczającej Afrę pięć mil na wschód od Betel; wielu utożsamia ją też z Efronem, zdobytym przez Abiasza, i z Efraimem, do którego wycofał się Jezus, choć nie jest to pewne. Tajbe to dziś palestyńska wieś chrześcijańska z ruinami bizantyńskiego kościoła św. Jerzego."
    - "Argumenty za Tajjibe przedstawił Survey of Western Palestine. Jego opis z 1882 roku przedstawia dużą chrześcijańską wieś w widocznym położeniu i na podstawie odległości od Betel uznaje ją za Ofrę w Beniaminie; dodaje, że dolina Seboim, wymieniona w tym samym fragmencie, może być leżącym poniżej Wadi Tajjibe. Badacze uznali to miejsce za ważne już w czasach żydowskich i opisali żydowski grób z niszami grzebalnymi i krzyżem wykutym nad wejściem, w którym widzieli znak, że później ponownie wykorzystali go chrześcijanie."
    - "Na wschód od wsi, w miejscu el-Khader, znaleźli bizantyńską bazylikę z mniejszą kaplicą krzyżowców zbudowaną na jej ruinach. Francuskie wykopaliska pod kierunkiem Vincenta Michela w latach 2000–2009 datowały pierwszy kościół na podstawie ceramiki na koniec V lub początek VI wieku."
  cs:
    - "Tato Ofra je město v Benjamínovi, nikoli Gedeonova Ofra v Manasesovi, která má vlastní článek. Je uvedena v seznamu Benjamínových měst: „A Avim, též Afara a Ofra“, a jednou v příběhu o Saulově válce s Pelištejci: z jejich tábora u Michmasu „vyšli zhoubcové z vojska Filistinského na tré rozdělení. Houf jeden obrátil se k cestě Ofra, k zemi Sual“. To je vše, co Bible o ní pod tímto jménem říká."
    - "Obvykle se ztotožňuje s et-Tajjibe, vesnicí na vrcholu pahorku asi 6 km severovýchodně od Bét-elu, což odpovídá oběma místům i Eusebiově poznámce, jež klade Afru pět mil východně od Bét-elu; mnozí ji kladou i k Efrónu, který dobyl Abija, a k Efrajimu, kam se stáhl Ježíš, což však není jisté. Tajbe je dnes palestinská křesťanská vesnice se zříceným byzantským kostelem svatého Jiří."
    - "Důvody pro Tajjibe shrnul Survey of Western Palestine. Jeho popis z roku 1882 líčí velkou křesťanskou vesnici na nápadném místě a podle vzdálenosti od Bét-elu ji pokládá za Ofru v Benjamínovi; dodává, že Cebóimské údolí, jmenované v téže pasáži, může být vádí Tajjibe pod ní. Badatelé považovali místo za významné už v židovské době a popsali židovský hrob s pohřebními výklenky a křížem vytesaným nad vchodem, v němž viděli znamení, že jej později znovu použili křesťané."
    - "Východně od vesnice, v místě el-Khader, našli byzantskou baziliku s menší křižáckou kaplí postavenou na jejích troskách. Francouzské vykopávky pod vedením Vincenta Michela v letech 2000–2009 datovaly první kostel podle keramiky na konec 5. nebo začátek 6. století."
  nl:
    - "Deze Ofra is een stad van Benjamin, niet de Ofra van Gideon in Manasse, die een eigen artikel heeft. Ze wordt genoemd in de lijst van Benjamins steden, “En Haavvim, en Para, en Ofra”, en eenmaal in het verhaal van Sauls oorlog met de Filistijnen: vanuit hun kamp bij Michmas, “En de verdervers gingen uit het leger der Filistijnen, in drie hopen; de ene hoop keerde zich op den weg naar Ofra, naar het land Sual”. Dat is alles wat de Bijbel onder deze naam zegt."
    - "Ze wordt meestal gelijkgesteld met et-Taiyibeh, een dorp op een heuveltop zo’n 6 km ten noordoosten van Bethel, dat bij beide passages past en bij Eusebius’ aantekening die Afra vijf mijl ten oosten van Bethel plaatst; velen vereenzelvigen haar ook met Efron, door Abia ingenomen, en met het Efraïm waarheen Jezus Zich terugtrok, hoewel dit niet zeker is. Taybeh is tegenwoordig een Palestijns christelijk dorp met de verwoeste Byzantijnse kerk van Sint-Joris."
    - "De Survey of Western Palestine zette de argumenten voor Taiyibeh uiteen. De beschrijving van 1882 schetst een groot christelijk dorp op een opvallende plek en houdt het, om de afstand tot Bethel, voor Ofra in Benjamin; ze voegt eraan toe dat het dal van Zeboïm, in dezelfde passage genoemd, de Wadi Taiyibeh eronder kan zijn. De landmeters achtten het een belangrijke plaats in Joodse tijd en beschreven een Joods graf met grafnissen en een kruis boven de ingang uitgehakt, wat zij opvatten als teken dat christenen het later opnieuw hadden gebruikt."
    - "Ten oosten van het dorp, bij el-Khader, vonden ze een Byzantijnse basiliek met een kleinere kruisvaarderskapel die op de ruïnes ervan was gebouwd. Franse opgravingen onder leiding van Vincent Michel van 2000 tot 2009 dateerden de eerste kerk op grond van het aardewerk in het eind van de 5e of het begin van de 6e eeuw."
  sv:
    - "Detta Ofra är en stad i Benjamin, inte Gideons Ofra i Manasse, som har en egen artikel. Det nämns i förteckningen över Benjamins städer, ”Avim, Para, Ofra”, och en gång i berättelsen om Sauls krig mot filistéerna: från deras läger vid Mikmas heter det: ”En härskara, delad i tre hopar, drog ut ur filistéernas läger för att härja: en hop tog vägen till Ofra i Sualslandet.” Det är allt Bibeln säger om det under detta namn."
    - "Det identifieras vanligen med et-Taiyibeh, en by på en kulle cirka 6 km nordost om Betel, vilket passar båda ställena och Eusebios notering som placerar Afra fem romerska mil öster om Betel; många likställer det också med Efron, som Avia intog, och med Efraim dit Jesus drog sig undan, fastän detta inte är säkert. Taybeh är i dag en palestinsk kristen by med den förfallna bysantinska kyrkan Sankt Georg."
    - "Survey of Western Palestine lade fram skälen för Taiyibeh. Dess beskrivning från 1882 skildrar en stor kristen by i ett iögonfallande läge och tar den, på grund av avståndet till Betel, för Ofra i Benjamin; den tillägger att Sevojimdalen, som nämns i samma avsnitt, kan vara Wadi Taiyibeh nedanför. Lantmätarna bedömde platsen som betydande redan under judisk tid och beskrev en judisk grav med gravnischer och ett kors inristat över ingången, vilket de tog som ett tecken på att kristna senare hade återanvänt den."
    - "Öster om byn, vid el-Khader, fann de en bysantinsk basilika med ett mindre korsfararkapell byggt på dess ruiner. Franska utgrävningar under Vincent Michel 2000–2009 daterade den första kyrkan med hjälp av keramiken till slutet av 400-talet eller början av 500-talet."
  nb:
    - "Denne Ofra er en by i Benjamin, ikke Gideons Ofra i Manasse, som har sin egen artikkel. Den er nevnt i listen over Benjamins byer, «og Ha'avvim og Happara og Ofra», og én gang i fortellingen om Sauls krig med filistrene: fra leiren deres ved Mikmas «drog det en flokk ut av filistrenes leir for å herje; den var delt i tre hoper; den ene hop tok veien til Ofra, til Sual-bygden». Det er alt Bibelen sier om den under dette navnet."
    - "Den identifiseres vanligvis med et-Taiyibeh, en landsby på en høyde omtrent 6 km nordøst for Betel, som passer til begge tekstene og til Eusebius' notis som plasserer Aphra fem romerske mil øst for Betel; mange setter den også lik Efron, som Abia inntok, og Efraim, dit Jesus trakk seg tilbake, men dette er ikke sikkert. Taybeh er i dag en palestinsk kristen landsby med ruinene av den bysantinske kirken Sankt Georg."
    - "Survey of Western Palestine la fram grunnene for Taiyibeh. Beskrivelsen fra 1882 skildrer en stor kristen landsby i et iøynefallende leie og tar den, ut fra avstanden til Betel, for Ofra i Benjamin; den legger til at Sebojim-dalen, nevnt i samme avsnitt, kan være Wadi Taiyibeh nedenfor. Landmålerne regnet stedet som betydelig allerede i jødisk tid og beskrev en jødisk grav med gravnisjer og et kors hogd over inngangen, som de tok som tegn på at kristne senere hadde tatt den i bruk igjen."
    - "Øst for landsbyen, ved el-Khader, fant de en bysantinsk basilika med et mindre korsfarerkapell bygd på ruinene. Franske utgravninger under ledelse av Vincent Michel fra 2000 til 2009 daterte den første kirken ut fra keramikken til slutten av 400-tallet eller begynnelsen av 500-tallet."
  tl:
    - "Ang Ophra na ito ay isang bayan ng Benjamin, hindi ang Ophra ni Gedeon sa Manases, na may sariling artikulo. Pinangalanan ito sa listahan ng mga lungsod ng Benjamin, “At Avim, at Para, at Ophra”, at minsan sa kuwento ng digmaan ni Saul laban sa mga Filisteo: mula sa kanilang kampo sa Michmas, “ang mga mananamsam ay lumabas na tatlong pulutong sa kampamento ng mga Filisteo; ang isang pulutong ay lumiko sa daan na patungo sa Ophra, na patungo sa lupain ng Sual”. Iyon na lamang ang sinasabi ng Bibliya tungkol dito sa ilalim ng pangalang ito."
    - "Karaniwang kinikilala ito sa et-Taiyibeh, isang nayong nasa tuktok ng burol na mga 6 km sa hilagang-silangan ng Beth-el, na akma sa dalawang talata at sa tala ni Eusebio na naglalagay sa Aphra nang limang milya sa silangan ng Beth-el; marami rin ang nagpapantay dito sa Ephron, na kinuha ni Abias, at sa Ephraim na pinag-urungan ni Jesus, bagaman hindi ito tiyak. Ang Taybeh ngayon ay isang nayong Kristiyanong Palestino na may wasak na simbahang Bisantino ni San Jorge."
    - "Inilahad ng Survey of Western Palestine ang mga katwiran para sa Taiyibeh. Inilalarawan ng ulat nito noong 1882 ang isang malaking nayong Kristiyano sa kapansin-pansing lokasyon at, batay sa layo nito sa Beth-el, itinuturing itong Ophra ng Benjamin; idinagdag nito na ang Libis ng Seboim, na binanggit sa parehong talata, ay maaaring ang Wadi Taiyibeh sa ibaba. Itinuring ng mga surbeyor na mahalagang lugar ito noong panahon ng mga Judio at itinala ang isang libingang Judio na may mga nitso at may krus na inukit sa ibabaw ng pasukan, na itinuring nilang tanda na muli itong ginamit ng mga Kristiyano."
    - "Sa silangan ng nayon, sa el-Khader, natagpuan nila ang isang basilikang Bisantino na may mas maliit na kapilya ng mga Krusado na itinayo sa mga guho nito. Pinetsahan ng mga paghuhukay na Pranses sa pamumuno ni Vincent Michel mula 2000 hanggang 2009 ang unang simbahan, batay sa mga palayok, sa huling bahagi ng ika-5 o unang bahagi ng ika-6 na siglo."
  da:
    - "Denne Ofra er en by i Benjamin og ikke Gideons Ofra i Manasse, som har sin egen artikel. Den nævnes på listen over Benjamins byer, »og Avim og Para og Ofra«, og én gang i fortællingen om Sauls krig med filisterne: fra deres lejr ved Mikmas »uddrog en ødelæggende Skare af Filisternes Lejr i tre Hobe; den ene Hob vendte sig ad Vejen imod Ofra, til Landet Sual«. Det er alt, Bibelen siger om den under dette navn."
    - "Den identificeres sædvanligvis med et-Taiyibeh, en landsby på en bakketop omkring 6 km nordøst for Betel, som passer til begge steder og til Eusebios' notits, der placerer Afra fem romerske mil øst for Betel; mange sidestiller den også med Efron, som Abija indtog, og med det Efraim, som Jesus trak sig tilbage til, dog ikke med sikkerhed. Taybeh er i dag en palæstinensisk kristen landsby med den ødelagte byzantinske Sankt Georgs-kirke."
    - "Survey of Western Palestine fremlagde grundene for Taiyibeh. Beskrivelsen fra 1882 skildrer en stor kristen landsby i et iøjnefaldende leje og tager den, ud fra afstanden til Betel, for Ofra i Benjamin; den tilføjer, at Sebojims Dal, der nævnes i samme afsnit, kan være Wadi Taiyibeh nedenfor. Landmålerne regnede stedet for betydeligt allerede i jødisk tid og beskrev en jødisk grav med gravnicher og et kors hugget over indgangen, hvilket de tog som tegn på, at kristne senere havde genbrugt den."
    - "Øst for landsbyen, ved el-Khader, fandt de en byzantinsk basilika med et mindre korsfarerkapel bygget på dens ruiner. Franske udgravninger ledet af Vincent Michel fra 2000 til 2009 daterede den første kirke ud fra keramikken til slutningen af 400-tallet eller begyndelsen af 500-tallet."
  sr:
    - "Ова Офра је град Венијаминов, а не Гедеонова Офра у Манасији, о којој постоји посебан чланак. Налази се на списку градова Венијаминових, „и Авин и Фара и Офра“, и једном у причи о Сауловом рату с Филистејима: из њиховог логора у Михмасу „изиђоше три чете из логора филистејског да плене: Једна чета удари путем к Офри у земљу совалску“. То је све што Библија каже о њој под тим именом."
    - "Обично се поистовећује с ет-Тајибом, брдским селом око 6 км североисточно од Ветиља, што одговара оба одломка и Јевсевијевој напомени која смешта Афру пет миља источно од Ветиља; многи је изједначавају и с Ефроном, који је узео Авија, и са Јефремом у који се повукао Исус, мада то није сигурно. Тајиба је данас палестинско хришћанско село с порушеном византијском црквом светог Ђорђа."
    - "Разлоге за Тајибу изложило је Истраживање Западне Палестине. Његов опис из 1882. године приказује велико хришћанско село на упадљивом месту и по удаљености од Ветиља узима га за Офру у Венијамину; додаје да долина Севоим, поменута у истом одломку, може бити вади Тајиба испод њега. Истраживачи су место сматрали значајним већ у јеврејско доба и описали јеврејску гробницу с гробним нишама и крстом урезаним над улазом, у чему су видели знак да су је хришћани касније поново користили."
    - "Источно од села, на месту ел-Хадр, нашли су византијску базилику с мањом крсташком капелом подигнутом на њеним рушевинама. Француска ископавања под вођством Венсана Мишела од 2000. до 2009. датовала су прву цркву према керамици у крај 5. или почетак 6. века."
  hu:
    - "Ez az Ofra Benjámin egyik városa, nem Gedeon Manassébeli Ofrája, amelynek külön cikke van. Benjámin városainak jegyzékében szerepel: „Avvim, Pára és Ofra”, és egyszer Saul filiszteus háborújának történetében: a filiszteusok mikmási táborából „egy dúló sereg vált ki három csapatban; az egyik csapat az Ofra felé vivő útra fordult Suál földének”. A Biblia ezen a néven ennyit mond róla."
    - "Általában et-Taiyibehvel azonosítják, egy dombtetői faluval Bételtől mintegy 6 km-re északkeletre, ami mindkét szakaszhoz illik, valamint Euszebiosz megjegyzéséhez, amely Aphrát Bételtől öt mérföldre keletre helyezi; sokan Efrónnal is azonosítják, amelyet Abija bevett, és az Efraimmal, amelybe Jézus visszavonult, bár ez nem biztos. Taybeh ma palesztin keresztény falu a romos bizánci Szent György-templommal."
    - "A Survey of Western Palestine fejtette ki a Taiyibeh melletti érveket. 1882-es leírása nagy keresztény faluként mutatja be feltűnő helyen, és Bételtől való távolsága alapján a benjámini Ofrának tartja; hozzáteszi, hogy az ugyanabban a szakaszban említett Cebóim-völgy az alatta húzódó Wadi Taiyibeh lehet. A felmérők a helyet már a zsidó korban jelentősnek ítélték, és leírtak egy zsidó sírt temetkezési fülkékkel és a bejárata fölé vésett kereszttel, amelyet annak jeleként értelmeztek, hogy később keresztények újra használták."
    - "A falutól keletre, el-Khadernél egy bizánci bazilikát találtak, romjaira épült kisebb keresztes kápolnával. A Vincent Michel vezette francia ásatások 2000 és 2009 között a kerámia alapján az 5. század végére vagy a 6. század elejére keltezték az első templomot."
  fi:
    - "Tämä Ofra on Benjaminin kaupunki, ei Gideonin Ofra Manassessa, jolla on oma artikkelinsa. Se mainitaan Benjaminin kaupunkien luettelossa, ”Avvim, Paara, Ofra”, ja kerran Saulin filistealaissodan kertomuksessa: Mikmaassa ”filistealaisten leiristä lähti ryöstöosasto kolmena joukkona: yksi joukko kääntyi Ofran tielle Suualin maahan päin”. Tämä on kaikki, mitä Raamattu sanoo siitä tällä nimellä."
    - "Se tunnistetaan yleensä et-Taiyibehiksi, kukkulakyläksi noin 6 km Betelistä koilliseen, mikä sopii molempiin kohtiin ja Eusebioksen merkintään, joka sijoittaa Aphran viiden mailin päähän Betelistä itään; monet rinnastavat sen myös Efroniin, jonka Abia valtasi, ja Efraimiin, jonne Jeesus vetäytyi, vaikka tämä ei ole varmaa. Taybeh on nykyään palestiinalainen kristitty kylä, jossa on Pyhän Yrjön bysanttilaisen kirkon rauniot."
    - "Survey of Western Palestine esitti perustelut Taiyibehin puolesta. Sen vuoden 1882 kuvaus kertoo suuresta kristittyjen kylästä näkyvällä paikalla ja pitää sitä etäisyytensä perusteella Betelistä Benjaminin Ofrana; se lisää, että samassa kohdassa mainittu Seboimin laakso voi olla alapuolella kulkeva Wadi Taiyibeh. Kartoittajat pitivät paikkaa merkittävänä jo juutalaisella ajalla ja kuvasivat juutalaisen haudan hautasyvennyksineen ja oviaukon yläpuolelle kaiverretun ristin, jonka he tulkitsivat merkiksi siitä, että kristityt olivat myöhemmin ottaneet haudan uudelleen käyttöön."
    - "Kylän itäpuolelta, el-Khaderista, he löysivät bysanttilaisen basilikan ja sen raunioille rakennetun pienemmän ristiretkeläiskappelin. Vincent Michelin johtamat ranskalaiset kaivaukset vuosina 2000–2009 ajoittivat ensimmäisen kirkon keramiikan perusteella 400-luvun loppuun tai 500-luvun alkuun."
  vi:
    - "Óp-ra này là một thành của Bên-gia-min, không phải Óp-ra của Ghê-đê-ôn trong Ma-na-se, có bài riêng. Nó được nêu trong danh sách các thành của Bên-gia-min, “A-vim, Pha-ra, Óp-ra”, và một lần trong câu chuyện về cuộc chiến của Sau-lơ với người Phi-li-tin: từ trại của họ tại Mích-ma, “Từ trong dinh Phi-li-tin có một toán quân cướp phá đi ra, chia làm ba đội: đội này theo con đường Óp-ra, đi về xứ Su-anh”. Đó là tất cả những gì Kinh Thánh nói về nó dưới tên này."
    - "Nó thường được đồng nhất với et-Taiyibeh, một làng trên đỉnh đồi cách Bê-tên khoảng 6 km về phía đông bắc, phù hợp với cả hai đoạn văn và với ghi chú của Eusebius đặt Aphra cách Bê-tên năm dặm về phía đông; nhiều người cũng đồng nhất nó với Ép-rôn mà A-bi-gia chiếm, và với Ép-ra-im nơi Chúa Giê-su lui về, dù điều này không chắc chắn. Taybeh ngày nay là một làng Cơ Đốc của người Palestine với tàn tích nhà thờ Byzantine Thánh George."
    - "Survey of Western Palestine đã trình bày lý lẽ cho Taiyibeh. Bản mô tả năm 1882 của nó tả một làng Cơ Đốc lớn ở vị trí dễ thấy và, dựa vào khoảng cách đến Bê-tên, cho đó là Óp-ra của Bên-gia-min; nó nói thêm rằng Trũng Xê-bô-im, được nhắc trong cùng đoạn văn, có thể là Wadi Taiyibeh bên dưới. Các nhà khảo sát cho rằng đây là một nơi quan trọng từ thời Do Thái và ghi lại một ngôi mộ Do Thái có các hốc chôn và một thập tự khắc trên lối vào, mà họ xem là dấu hiệu cho thấy về sau các Cơ Đốc nhân đã dùng lại ngôi mộ."
    - "Phía đông làng, tại el-Khader, họ tìm thấy một vương cung thánh đường Byzantine với một nhà nguyện nhỏ hơn của quân Thập tự chinh xây trên đống đổ nát của nó. Các cuộc khai quật của Pháp do Vincent Michel dẫn đầu từ 2000 đến 2009 đã định niên đại nhà thờ đầu tiên, dựa trên đồ gốm, vào cuối thế kỷ 5 hoặc đầu thế kỷ 6."
  ro:
    - "Această Ofra este o cetate a lui Beniamin, nu Ofra lui Ghedeon din Manase, care are propriul articol. Este numită în lista cetăților lui Beniamin, alături de Avim și Para, și o dată în povestea războiului lui Saul cu filistenii: din tabăra lor de la Micmaș, jefuitorii au ieșit în trei cete, iar una a apucat pe drumul care duce spre Ofra, spre ținutul Șual. Atât spune Biblia despre ea sub acest nume."
    - "De obicei este identificată cu et-Taiyibeh, un sat pe deal la circa 6 km nord-est de Betel, care se potrivește ambelor pasaje și notei lui Eusebiu care așază Afra la cinci mile la est de Betel; mulți o identifică și cu Efron, luat de Abia, și cu Efraimul în care s-a retras Isus, deși aceasta nu este sigură. Taybeh este astăzi un sat creștin palestinian cu ruina bisericii bizantine Sfântul Gheorghe."
    - "Survey of Western Palestine a expus argumentele pentru Taiyibeh. Descrierea sa din 1882 înfățișează un sat creștin mare, într-o poziție vizibilă, și, după distanța față de Betel, îl socotește Ofra din Beniamin; adaugă că Valea Țeboim, numită în același pasaj, poate fi Wadi Taiyibeh de dedesubt. Topografii au socotit locul important încă din vremea iudaică și au descris un mormânt iudaic cu nișe funerare și o cruce sculptată deasupra intrării, pe care au socotit-o semn că mai târziu creștinii l-au refolosit."
    - "La est de sat, la el-Khader, au găsit o bazilică bizantină cu o capelă cruciată mai mică, zidită pe ruinele ei. Săpăturile franceze conduse de Vincent Michel între 2000 și 2009 au datat prima biserică, după ceramică, la sfârșitul secolului al V-lea sau începutul secolului al VI-lea."
  bg:
    - "Тази Офра е град на Вениамин, а не Офра на Гедеон в Манасия, която има собствена статия. Тя е назована в списъка на градовете на Вениамин, „и Авим, и Фара, и Офра“, и веднъж в разказа за войната на Саул с филистимците: от техния стан в Михмас „излязоха грабители из стана на Филистимците в три тела: едното тяло се върна по пътя на Офра към земята Согал“. Това е всичко, което Библията казва за нея под това име."
    - "Обикновено се отъждествява с ет-Тайибе, село на хълм на около 6 км североизточно от Ветил, което съответства и на двата пасажа, и на бележката на Евсевий, поставяща Афра на пет мили източно от Ветил; мнозина я приравняват и с Ефрон, превзет от Авия, и с Ефрем, където се оттеглил Исус, макар това да не е сигурно. Тайибе днес е палестинско християнско село с руините на византийската църква „Свети Георги“."
    - "Доводите в полза на Тайибе изложило „Проучването на Западна Палестина“. Неговото описание от 1882 г. представя голямо християнско село на видно място и по разстоянието от Ветил го приема за Офра във Вениамин; добавя, че долината Цевоим, спомената в същия пасаж, може да е уади Тайибе под него. Изследователите смятали мястото за значимо още в юдейско време и описали юдейска гробница с погребални ниши и издълбан над входа кръст, в който видели знак, че по-късно християните я използвали отново."
    - "Източно от селото, при ел-Хадр, намерили византийска базилика с по-малък кръстоносен параклис, построен върху руините ѝ. Френските разкопки под ръководството на Венсан Мишел през 2000–2009 г. датирали първата църква по керамиката към края на V или началото на VI в."
