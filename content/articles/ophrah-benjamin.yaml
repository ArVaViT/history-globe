# Overview article (ADR 0007). Mainstream facts only; Ophrah of Benjamin, not Gideon's Ophrah; the usual identification with et-Taiyibeh is given as likely, not proved.
id: ophrah-benjamin
place: a53b82d
title:
  en: "Ophrah in Benjamin"
  ru: "Офра в Вениамине"
  uk: "Офра у Веніямині"
  es: "Ofra en Benjamín"
  pt: "Ofra em Benjamim"
  de: "Ofra in Benjamin"
  fr: "Ophra en Benjamin"
  it: "Ofra in Beniamino"
  pl: "Ofra w Beniaminie"
  cs: "Ofra v Benjamínovi"
  nl: "Ofra in Benjamin"
  sv: "Ofra i Benjamin"
  nb: "Ofra i Benjamin"
  tl: "Ophra sa Benjamin"
  da: "Ofra i Benjamin"
  sr: "Офра у Венијамину"
