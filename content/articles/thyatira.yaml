# Overview article (ADR 0007). Mainstream facts only; disputed readings are named as such. The founding by Seleucus I follows the usual modern account.
id: thyatira
place: a94b661
title:
  en: "Thyatira"
  ru: "Фиатира"
body:
  en:
    - "Thyatira, today's Akhisar, lay in a broad valley of northern Lydia on the road from Pergamum to Sardis. Strabo calls it a settlement of the Macedonians, which some reckoned the farthest city of the Mysians; it is usually held that Seleucus I planted a colony of Macedonian soldiers here early in the third century BC. In 190 BC Antiochus III camped near Thyatira before the battle of Magnesia, and after his defeat envoys came from the city to surrender it to the Romans. It then passed to the Attalid kings of Pergamum, and in 133 BC, with the rest of their kingdom, to Rome."
    - 'Under the emperors Thyatira was a prosperous market town. Inscriptions of the Roman period name many trade guilds there: wool-workers, linen-workers, leather-workers, potters, bronze-smiths and dyers. At Philippi, among those who heard Paul, was "a certain woman named Lydia, a seller of purple, of the city of Thyatira, which worshipped God". The Lord opened her heart; she was baptized with her household and took Paul and his companions into her house.'
    - 'The longest of the letters to the seven churches goes to Thyatira. It praises the church''s charity, service, faith and patience, but rebukes it because it suffers "that woman Jezebel, which calleth herself a prophetess", who taught the Lord''s servants to commit fornication and to eat things sacrificed unto idols. Whether Jezebel was a real woman of the church, and whether her teaching had to do with the feasts of the trade guilds, is debated. To those "which have not known the depths of Satan" the Lord promises no other burden, and to him that overcomes, power over the nations and the morning star. Thyatira lived on as a town of the province of Asia and later of Lydia.'
  ru:
    - "Фиатира, нынешний Акхисар, лежала в широкой долине на севере Лидии, на дороге из Пергама в Сардис. Страбон называет её поселением македонян, которое иные считали самым дальним городом мисийцев; обычно полагают, что в начале III века до н. э. Селевк I поселил здесь колонию македонских воинов. В 190 г. до н. э., перед битвой при Магнесии, Антиох III стоял лагерем у Фиатиры, а после его поражения из города пришли послы, чтобы сдать его римлянам. Затем Фиатира перешла к пергамским царям Атталидам, а в 133 г. до н. э. вместе со всем их царством — к Риму."
    - "При императорах Фиатира была зажиточным торговым городом. Надписи римского времени называют здесь много ремесленных союзов: шерстяников, льняников, кожевников, гончаров, медников и красильщиков. В Филиппах Павла слушала «одна женщина из города Фиатир, именем Лидия, торговавшая багряницею, чтущая Бога». Господь отверз её сердце; она крестилась со своим домом и приняла Павла и его спутников к себе."
    - "Самое длинное из посланий семи церквам обращено к Фиатире. Оно хвалит любовь, служение, веру и терпение церкви, но обличает её за то, что она попускает «жене Иезавели, называющей себя пророчицею», которая учила рабов Господних любодействовать и есть идоложертвенное. Была ли Иезавель реальной женщиной в церкви и связано ли её учение с пирами ремесленных союзов, — спорно. Тем, которые «не знают так называемых глубин сатанинских», Господь обещает не налагать иного бремени, а побеждающему — власть над язычниками и звезду утреннюю. Фиатира продолжала жить как город провинции Асия, а позднее — Лидии."
