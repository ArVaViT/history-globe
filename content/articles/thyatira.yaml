body:
  en:
    - "Thyatira, today's Akhisar, lay in a broad valley of northern Lydia on the road from Pergamum to Sardis. Strabo calls it a settlement of the Macedonians, which some reckoned the farthest city of the Mysians; it is usually held that Seleucus I planted a colony of Macedonian soldiers here early in the third century BC. In 190 BC Antiochus III camped near Thyatira before the battle of Magnesia, and after his defeat envoys came from the city to surrender it to the Romans. It then passed to the Attalid kings of Pergamum, whose kingdom was bequeathed to Rome in 133 BC; Thyatira was the first city seized by the pretender Aristonicus in the war that followed, and it entered the province of Asia when that was organised after his defeat."
    - 'Under the emperors Thyatira was a prosperous market town. Inscriptions of the Roman period name many trade guilds there: wool-workers, linen-workers, leather-workers, potters, bronze-smiths and dyers. At Philippi, among those who heard Paul, was "a certain woman named Lydia, a seller of purple, of the city of Thyatira, which worshipped God". The Lord opened her heart; she was baptized with her household and took Paul and his companions into her house.'
    - 'The longest of the letters to the seven churches goes to Thyatira. It praises the church''s charity, service, faith and patience, but rebukes it because it suffers "that woman Jezebel, which calleth herself a prophetess", who taught the Lord''s servants to commit fornication and to eat things sacrificed unto idols. Whether Jezebel was a real woman of the church, and whether her teaching had to do with the feasts of the trade guilds, is debated. To those "which have not known the depths of Satan" the Lord promises no other burden, and to him that overcomes, power over the nations and the morning star. Thyatira lived on as a town of the province of Asia and later of Lydia.'
  ru:
    - "Фиатира, нынешний Акхисар, лежала в широкой долине на севере Лидии, на дороге из Пергама в Сардис. Страбон называет её поселением македонян, которое иные считали самым дальним городом мисийцев; обычно полагают, что в начале III века до н. э. Селевк I поселил здесь колонию македонских воинов. В 190 г. до н. э., перед битвой при Магнесии, Антиох III стоял лагерем у Фиатиры, а после его поражения из города пришли послы, чтобы сдать его римлянам. Затем Фиатира перешла к пергамским царям Атталидам, чьё царство в 133 г. до н. э. было завещано Риму; в последовавшей войне Фиатира стала первым городом, который захватил претендент Аристоник, а в провинцию Асия она вошла, когда та была устроена после его поражения."
    - "При императорах Фиатира была зажиточным торговым городом. Надписи римского времени называют здесь много ремесленных союзов: шерстяников, льняников, кожевников, гончаров, медников и красильщиков. В Филиппах Павла слушала «одна женщина из города Фиатир, именем Лидия, торговавшая багряницею, чтущая Бога». Господь отверз её сердце; она крестилась со своим домом и приняла Павла и его спутников к себе."
    - "Самое длинное из посланий семи церквам обращено к Фиатире. Оно хвалит любовь, служение, веру и терпение церкви, но обличает её за то, что она попускает «жене Иезавели, называющей себя пророчицею», которая учила рабов Господних любодействовать и есть идоложертвенное. Была ли Иезавель реальной женщиной в церкви и связано ли её учение с пирами ремесленных союзов, — спорно. Тем, которые «не знают так называемых глубин сатанинских», Господь обещает не налагать иного бремени, а побеждающему — власть над язычниками и звезду утреннюю. Фиатира продолжала жить как город провинции Асия, а позднее — Лидии."
  uk:
    - "Тіатира, нинішній Ахісар, лежала в широкій долині північної Лідії на дорозі від Пергама до Сард. Страбон називає її поселенням македонян, яке дехто вважав найдальшим містом мізійців; зазвичай вважають, що Селевк I поселив тут колонію македонських воїнів на початку III ст. до н. е. У 190 р. до н. е. Антіох III таборував поблизу Тіатири перед битвою при Магнесії, а після його поразки з міста прийшли посли віддати його римлянам. Потім вона перейшла до Атталідів, царів Пергама, чиє царство 133 р. до н. е. було заповідане Римові; у війні, що настала, Тіатира стала першим містом, яке захопив претендент Арістонік, а до провінції Азія вона ввійшла, коли ту впорядкували після його поразки."
    - "За імператорів Тіатира була заможним торговим містом. Написи римської доби називають там багато ремісничих цехів: вовноробів, льонарів, шкіряників, гончарів, ковалів-мідників і красильників. У Філіппах серед тих, хто слухав Павла, була «одна жінка, на ймя Лидия, купчиха кармазином, із города Тиятирського, що шанувала Бога». Господь відчинив їй серце; вона охрестилася з усім домом і прийняла Павла та його супутників у свою оселю."
    - "Найдовший із листів до семи церков адресований Тіатирі. Він хвалить любов, служіння, віру й терпеливість церкви, але дорікає їй за те, що вона терпить «жінцї Єзавелї, що зове себе пророкинею», яка вчила слуг Господніх чинити перелюб та їсти ідолські жертви. Чи була Єзавель справжньою жінкою церкви і чи мала її наука стосунок до свят ремісничих цехів, дискутується. Тим, «котрі не пізнали глибинї сатаниної», Господь обіцяє інакшого тягаря не покладати, а переможцеві — владу над народами і ранішню зорю. Тіатира жила й далі як місто провінції Азія, а згодом Лідії."
  es:
    - "Tiatira, la actual Akhisar, se hallaba en un amplio valle del norte de Lidia, en el camino de Pérgamo a Sardis. Estrabón la llama un asentamiento de los macedonios, que algunos tenían por la última ciudad de los misios; suele sostenerse que Seleuco I estableció aquí una colonia de soldados macedonios a comienzos del siglo III a. C. En 190 a. C. Antíoco III acampó cerca de Tiatira antes de la batalla de Magnesia, y tras su derrota llegaron enviados de la ciudad para entregarla a los romanos. Pasó entonces a los reyes atálidas de Pérgamo, cuyo reino fue legado a Roma en 133 a. C.; Tiatira fue la primera ciudad que tomó el pretendiente Aristónico en la guerra que siguió, y entró en la provincia de Asia cuando esta se organizó tras su derrota."
    - "Bajo los emperadores Tiatira fue una próspera ciudad de mercado. Inscripciones de época romana nombran allí numerosos gremios de oficios: obreros de la lana, del lino, del cuero, alfareros, broncistas y tintoreros. En Filipos, entre quienes oyeron a Pablo, estaba «una mujer llamada Lidia, que vendía púrpura en la ciudad de Tiatira, temerosa de Dios». El Señor le abrió el corazón; fue bautizada con su familia y acogió en su casa a Pablo y a sus compañeros."
    - "La más larga de las cartas a las siete iglesias va dirigida a Tiatira. Elogia la caridad, el servicio, la fe y la paciencia de la iglesia, pero la reprende porque permite «aquella mujer Jezabel (que se dice profetisa)», que enseñaba a los siervos del Señor a fornicar y a comer cosas ofrecidas a los ídolos. Se discute si Jezabel fue una mujer real de la iglesia y si su enseñanza tenía que ver con los banquetes de los gremios. A los que «no han conocido las profundidades de Satanás» el Señor promete que no enviará sobre ellos otra carga, y al que venciere, potestad sobre las gentes y la estrella de la mañana. Tiatira siguió existiendo como ciudad de la provincia de Asia y más tarde de Lidia."
  pt:
    - "Tiatira, a atual Akhisar, ficava num amplo vale do norte da Lídia, na estrada de Pérgamo a Sardes. Estrabão a chama de povoação de macedônios, que alguns consideravam a cidade mais remota dos mísios; costuma-se sustentar que Seleuco I estabeleceu aqui uma colônia de soldados macedônios no início do século III a.C. Em 190 a.C., Antíoco III acampou perto de Tiatira antes da batalha de Magnésia e, depois de sua derrota, vieram enviados da cidade para entregá-la aos romanos. Passou então aos reis atálidas de Pérgamo, cujo reino foi legado a Roma em 133 a.C.; Tiatira foi a primeira cidade tomada pelo pretendente Aristônico na guerra que se seguiu, e entrou na província da Ásia quando esta foi organizada após a derrota dele."
    - "Sob os imperadores, Tiatira foi uma próspera cidade de mercado. Inscrições do período romano nomeiam ali muitas corporações de ofício: lanífices, tecelões de linho, curtidores, oleiros, ferreiros de bronze e tintureiros. Em Filipos, entre os que ouviam Paulo, estava “Certa mulher chamada Lídia, vendedora de púrpura, da cidade de Tiatira, que adorava a Deus”. O Senhor abriu-lhe o coração; ela foi batizada com sua casa e recebeu Paulo e seus companheiros em sua casa."
    - "A mais longa das cartas às sete igrejas vai para Tiatira. Louva a caridade, o serviço, a fé e a paciência da igreja, mas a repreende porque tolera “a sua mulher Jezabel, que se diz profetisa”, que ensinava os servos do Senhor a cometer imoralidade sexual e a comer coisas sacrificadas a ídolos. Se Jezabel era uma mulher real da igreja, e se seu ensino tinha a ver com os banquetes das corporações de ofício, é discutido. Aos que “não conhecem o que alguns chamam de ‘as coisas profundas de Satanás’”, o Senhor promete não pôr nenhum outro peso, e ao vencedor, poder sobre as nações e a estrela da manhã. Tiatira sobreviveu como cidade da província da Ásia e depois da Lídia."
  de:
    - "Thyatira, das heutige Akhisar, lag in einem breiten Tal im nördlichen Lydien an der Straße von Pergamon nach Sardes. Strabon nennt es eine Siedlung der Mazedonier, die manche für die äußerste Stadt der Mysier hielten; meist nimmt man an, dass Seleukos I. hier Anfang des dritten Jahrhunderts v. Chr. eine Kolonie mazedonischer Soldaten ansiedelte. 190 v. Chr. lagerte Antiochos III. vor der Schlacht bei Magnesia nahe Thyatira, und nach seiner Niederlage kamen Gesandte aus der Stadt, um sie den Römern zu übergeben. Dann fiel sie an die attalidischen Könige von Pergamon, deren Reich 133 v. Chr. Rom vermacht wurde; Thyatira war die erste Stadt, die der Thronprätendent Aristonikos im folgenden Krieg einnahm, und sie kam zur Provinz Asia, als diese nach seiner Niederlage eingerichtet wurde."
    - "Unter den Kaisern war Thyatira ein blühender Marktort. Inschriften der Römerzeit nennen dort viele Handwerksgilden: Wollarbeiter, Leinenarbeiter, Lederarbeiter, Töpfer, Bronzeschmiede und Färber. In Philippi hörte unter denen, die Paulus zuhörten, „ein gottesfürchtiges Weib mit Namen Lydia, eine Purpurkrämerin aus der Stadt der Thyathirer“. Der Herr tat ihr das Herz auf; sie wurde mit ihrem Haus getauft und nahm Paulus und seine Gefährten in ihr Haus auf."
    - "Der längste der Briefe an die sieben Gemeinden geht an Thyatira. Er lobt Liebe, Dienst, Glauben und Geduld der Gemeinde, tadelt sie aber, weil sie „das Weib Isebel, die da spricht, sie sei eine Prophetin“ gewähren lässt, die die Knechte des Herrn lehrte, Hurerei zu treiben und Götzenopfer zu essen. Ob Isebel eine wirkliche Frau der Gemeinde war und ob ihre Lehre mit den Festen der Handwerksgilden zu tun hatte, ist umstritten. Denen, „die nicht erkannt haben die Tiefen des Satans“, verheißt der Herr keine andere Last, und dem Überwinder Macht über die Völker und den Morgenstern. Thyatira bestand als Stadt der Provinz Asia und später Lydiens fort."
  fr:
    - "Thyatire, l’actuelle Akhisar, se trouvait dans une large vallée du nord de la Lydie, sur la route de Pergame à Sardes. Strabon l’appelle une colonie des Macédoniens, que certains comptaient pour la dernière ville des Mysiens ; on admet d’ordinaire que Séleucos Ier y installa une colonie de soldats macédoniens au début du IIIe siècle av. J.-C. En 190 av. J.-C., Antiochos III campa près de Thyatire avant la bataille de Magnésie, et après sa défaite des envoyés de la ville vinrent la remettre aux Romains. Elle passa ensuite aux rois attalides de Pergame, dont le royaume fut légué à Rome en 133 av. J.-C. ; Thyatire fut la première ville prise par le prétendant Aristonicos dans la guerre qui suivit, et elle entra dans la province d’Asie quand celle-ci fut organisée après sa défaite."
    - "Sous les empereurs, Thyatire fut une ville de marché prospère. Des inscriptions de l’époque romaine y citent de nombreuses corporations : travailleurs de la laine, du lin, du cuir, potiers, forgerons du bronze et teinturiers. À Philippes, parmi ceux qui entendirent Paul, se trouvait une femme « nommée Lydie, marchande de pourpre, de la ville de Thyatire », « craignant Dieu ». Le Seigneur lui ouvrit le cœur ; elle fut baptisée avec sa famille et reçut Paul et ses compagnons dans sa maison."
    - "La plus longue des lettres aux sept Églises va à Thyatire. Elle loue l’amour, le service, la foi et la constance de l’Église, mais lui reproche de laisser « la femme Jézabel, qui se dit prophétesse » enseigner aux serviteurs du Seigneur à se livrer à l’impudicité et à manger des viandes sacrifiées aux idoles. On débat de savoir si Jézabel était une femme réelle de l’Église et si son enseignement touchait aux banquets des corporations. À ceux « qui n’ont pas connu les profondeurs de Satan », le Seigneur promet de ne mettre sur eux aucun autre fardeau, et à celui qui vaincra, autorité sur les nations et l’étoile du matin. Thyatire subsista comme ville de la province d’Asie, puis de Lydie."
  pl:
    - "Tiatyra, dzisiejszy Akhisar, leżała w szerokiej dolinie północnej Lidii przy drodze z Pergamonu do Sardes. Strabon nazywa ją osadą Macedończyków, którą niektórzy liczyli za najdalsze miasto Mizyjczyków; zwykle uważa się, że Seleukos I osadził tu kolonię macedońskich żołnierzy na początku III wieku p.n.e. W 190 roku p.n.e. Antioch III rozbił obóz pod Tiatyrą przed bitwą pod Magnezją, a po jego klęsce z miasta przybyli posłowie, by poddać je Rzymianom. Potem przeszła na królów z dynastii Attalidów w Pergamonie, których królestwo w 133 roku p.n.e. zapisano Rzymowi; Tiatyra była pierwszym miastem, które zajął pretendent Aristonikos w wojnie, jaka potem wybuchła, i weszła do prowincji Azji, gdy tę zorganizowano po jego klęsce."
    - "Za cesarzy Tiatyra była zamożnym miastem targowym. Inskrypcje z okresu rzymskiego wymieniają tam wiele cechów rzemieślniczych: wełniarzy, lniarzy, garbarzy, garncarzy, brązowników i farbiarzy. W Filippi wśród tych, którzy słuchali Pawła, była „niektóra niewiasta, imieniem Lidyja, która szarłat sprzedawała w mieście Tyjatyrskiem, Boga się bojąca”. Pan otworzył jej serce; została ochrzczona z całym domem i przyjęła Pawła i jego towarzyszy do swego domu."
    - "Najdłuższy z listów do siedmiu zborów trafia do Tiatyry. Chwali miłość, posługę, wiarę i cierpliwość zboru, lecz ganie go za to, że znosi tę kobietę, Izebel, „która się mieni być prorokinią”, a ona uczy i zwodzi sługi Pana, „żeby wszeteczeństwo płodzili i rzeczy bałwanom ofiarowane jedli”. Czy Izebel była rzeczywistą kobietą ze zboru i czy jej nauka miała związek z ucztami cechów rzemieślniczych, jest sporne. Tym, „którzy nie poznali głębokości szatańskich”, Pan obiecuje: „Nie włożę na was innego brzemienia”, a zwycięzcy władzę nad narodami i gwiazdę poranną. Tiatyra przetrwała jako miasto prowincji Azji, a później Lidii."
  it:
    - "Tiatira, l’odierna Akhisar, sorgeva in un’ampia valle della Lidia settentrionale sulla strada da Pergamo a Sardi. Strabone la chiama un insediamento dei Macedoni, che alcuni ritenevano l’ultima città dei Misi; di solito si ritiene che Seleuco I vi abbia fondato una colonia di soldati macedoni agli inizi del III secolo a.C. Nel 190 a.C. Antioco III si accampò presso Tiatira prima della battaglia di Magnesia, e dopo la sua sconfitta giunsero dalla città ambasciatori per consegnarla ai Romani. Passò poi ai re attalidi di Pergamo, il cui regno fu lasciato in eredità a Roma nel 133 a.C.; Tiatira fu la prima città presa dal pretendente Aristonico nella guerra che seguì, ed entrò nella provincia d’Asia quando questa fu organizzata dopo la sua sconfitta."
    - "Sotto gli imperatori Tiatira fu una prospera città di mercato. Iscrizioni di epoca romana vi nominano molte corporazioni di mestiere: lavoratori della lana, del lino, del cuoio, vasai, fabbri del bronzo e tintori. A Filippi, fra coloro che ascoltarono Paolo, c’era «una certa donna, di nome Lidia, negoziante di porpora, della città di Tiatiri, che temeva Dio». Il Signore le aprì il cuore; ella fu battezzata con la sua casa e accolse Paolo e i suoi compagni in casa sua."
    - "La più lunga delle lettere alle sette chiese è per Tiatira. Ne loda la carità, il servizio, la fede e la costanza, ma la rimprovera perché tollera «quella donna Jezabel, che si dice profetessa», la quale insegnò ai servi del Signore a commettere fornicazione e a mangiare cose sacrificate agli idoli. Se Gezabele fosse una donna reale della chiesa, e se il suo insegnamento avesse a che fare con i banchetti delle corporazioni, è discusso. Agli altri di Tiatira, «che non professate questa dottrina e non avete conosciuto le profondità di Satana», il Signore dice: «Io non v’impongo altro peso», e a chi vince, potestà sulle nazioni e la stella mattutina. Tiatira sopravvisse come città della provincia d’Asia e poi della Lidia."
  nl:
    - "Thyatira, het huidige Akhisar, lag in een brede vallei in het noorden van Lydië aan de weg van Pergamum naar Sardes. Strabo noemt het een nederzetting van de Macedoniërs, door sommigen gerekend als de verste stad van de Mysiërs; algemeen wordt aangenomen dat Seleucus I hier vroeg in de derde eeuw v.Chr. een kolonie van Macedonische soldaten vestigde. In 190 v.Chr. sloeg Antiochus III zijn kamp op bij Thyatira vóór de slag bij Magnesia, en na zijn nederlaag kwamen gezanten uit de stad om haar aan de Romeinen over te geven. Daarna kwam het aan de Attalidische koningen van Pergamum, wier koninkrijk in 133 v.Chr. aan Rome werd nagelaten; Thyatira was de eerste stad die de troonpretendent Aristonicus in de daaropvolgende oorlog innam, en het ging op in de provincie Asia toen die na zijn nederlaag werd ingericht."
    - "Onder de keizers was Thyatira een welvarende marktstad. Opschriften uit de Romeinse tijd noemen er veel ambachtsgilden: wolwerkers, linnenwerkers, leerbewerkers, pottenbakkers, bronssmeden en verwers. In Filippi was onder degenen die Paulus hoorden “een zekere vrouw, met name Lydia, een purperverkoopster, van de stad Thyatira, die God diende”. De Heer opende haar hart; zij werd met haar huis gedoopt en nam Paulus en zijn metgezellen in haar huis op."
    - "De langste van de brieven aan de zeven gemeenten gaat naar Thyatira. Hij prijst de liefde, de dienst, het geloof en de lijdzaamheid van de gemeente, maar verwijt haar dat zij toelaat “de vrouw Jezabel, die zich zelve zegt een profetes te zijn”, die de dienstknechten van de Heer leerde te hoereren en afgodenoffer te eten. Of Izebel een werkelijke vrouw van de gemeente was, en of haar leer met de feesten van de ambachtsgilden te maken had, is omstreden. Aan hen “die de diepten des satans niet gekend hebben” belooft de Heer geen andere last, en aan wie overwint macht over de heidenen en de morgenster. Thyatira bleef bestaan als stad van de provincie Asia en later van Lydië."
  cs:
    - "Tyatira, dnešní Akhisar, ležela v široké dolině severní Lýdie na cestě z Pergamonu do Sard. Strabón ji nazývá osadou Makedonců, kterou někteří pokládali za nejvzdálenější město Mýsů; obvykle se soudí, že Seleukos I. zde na počátku 3. stol. př. n. l. usadil kolonii makedonských vojáků. V roce 190 př. n. l. se Antiochos III. utábořil poblíž Tyatiry před bitvou u Magnésie a po jeho porážce přišli z města vyslanci, aby je vydali Římanům. Pak připadla attalovským králům z Pergamonu, jejichž království bylo roku 133 př. n. l. odkázáno Římu; Tyatira byla prvním městem, které v následné válce obsadil uchazeč o trůn Aristonikos, a do provincie Asie vstoupila, když byla po jeho porážce zřízena."
    - "Za císařů byla Tyatira prosperujícím tržním městem. Nápisy z římského období jmenují mnoho tamních obchodních cechů: zpracovatele vlny, lnu, kůže, hrnčíře, kováře bronzu a barvíře. Mezi těmi, kdo ve Filipech slyšeli Pavla, byla žena z Tyatiry: „Jedna pak žena, jménem Lydia, kteráž šarlaty prodávala v městě Tyatirských, bohabojící“. Pán otevřel její srdce; byla pokřtěna se svým domem a přijala Pavla i jeho společníky do svého domu."
    - "Nejdelší z listů sedmi církvím jde do Tyatiry. Chválí lásku, službu, víru a trpělivost církve, ale kárá ji, protože dopouští „ženě Jezábel, kteráž se býti praví prorokyní“, aby učila služebníky Páně smilnit a jíst modlám obětované. Zda byla Jezábel skutečnou ženou v církvi a zda její učení mělo co dělat s hostinami obchodních cechů, je sporné. Těm, „kteříž nepoznali hlubokosti satanovy“, Pán slibuje, že na ně nevloží jiné břemeno, a vítězi moc nad národy a jitřní hvězdu. Tyatira žila dál jako město provincie Asie a později Lýdie."
  sv:
    - "Tyatira, i dag Akhisar, låg i en bred dal i norra Lydien vid vägen från Pergamon till Sardes. Strabon kallar det en makedonisk bosättning, som några räknade som mysernas yttersta stad; man håller vanligen före att Seleukos I anlade en koloni av makedoniska soldater här tidigt på 200-talet f.Kr. År 190 f.Kr. slog Antiochos III läger nära Tyatira före slaget vid Magnesia, och efter hans nederlag kom sändebud från staden för att överlämna den åt romarna. Den gick sedan till de attalidiska kungarna i Pergamon, vars rike testamenterades till Rom 133 f.Kr.; Tyatira var den första stad som pretendenten Aristonikos intog i kriget som följde, och kom att ingå i provinsen Asien när denna organiserades efter hans nederlag."
    - "Under kejsarna var Tyatira en välmående marknadsstad. Inskrifter från romartiden nämner många yrkesgillen där: ullarbetare, linnearbetare, läderarbetare, krukmakare, bronssmeder och färgare. I Filippi fanns bland dem som hörde Paulus ”en kvinna som ’fruktade Gud’, en purpurkrämerska från staden Tyatira, vid namn Lydia”. Herren öppnade hennes hjärta; hon döptes med sitt hus och tog Paulus och hans följeslagare in i sitt hem."
    - "Det längsta av breven till de sju församlingarna går till Tyatira. Det prisar församlingens kärlek, tjänst, tro och tålamod, men tillrättavisar den för att den tål ”kvinnan Jesabel – hon som säger sig vara en profetissa”, som lärde Herrens tjänare att bedriva otukt och äta kött från avgudaoffer. Om Isebel var en verklig kvinna i församlingen, och om hennes lära hade med yrkesgillenas fester att göra, är omdebatterat. Till dem som ”icke ’haven lärt känna djupheterna’, såsom de säga – ja, Satans djupheter!” lovar Herren ingen annan börda, och åt den som segrar makt över folken och morgonstjärnan. Tyatira levde vidare som stad i provinsen Asien och senare i Lydien."
  nb:
    - "Tyatira, dagens Akhisar, lå i en bred dal i nordlige Lydia ved veien fra Pergamon til Sardes. Strabon kaller det en makedonsk bosetning, som noen regnet for den ytterste byen til mysierne; det antas vanligvis at Seleukos I anla en koloni av makedonske soldater her tidlig på 200-tallet f.Kr. I 190 f.Kr. slo Antiokhos III leir nær Tyatira før slaget ved Magnesia, og etter nederlaget kom sendebud fra byen for å overgi den til romerne. Den gikk så over til attalidekongene i Pergamon, hvis rike ble testamentert til Roma i 133 f.Kr.; Tyatira var den første byen som ble inntatt av tronpretendenten Aristonikos i krigen som fulgte, og den kom inn i provinsen Asia da den ble organisert etter hans nederlag."
    - "Under keiserne var Tyatira en velstående markedsby. Innskrifter fra romertiden nevner mange yrkesgilder der: ullarbeidere, linarbeidere, lærarbeidere, pottemakere, bronsesmeder og fargere. I Filippi var det blant dem som hørte Paulus «en kvinne ved navn Lydia, en purpur-kremmerske fra byen Tyatira, som dyrket Gud efter jødenes tro». Herren oppla hjertet hennes; hun ble døpt med sitt hus og tok Paulus og følgesvennene hans inn i huset sitt."
    - "Det lengste av brevene til de sju menighetene går til Tyatira. Det roser menighetens kjærlighet, tjeneste, tro og tålmodighet, men irettesetter den fordi den «lar kvinnen Jesabel råde, hun som sier at hun er en profetinne», som lærte Herrens tjenere å drive hor og ete avgudsoffer. Om Jesabel var en virkelig kvinne i menigheten, og om læren hennes hadde å gjøre med festene til yrkesgildene, er omdiskutert. Til «de som ikke kjenner Satans dybder» lover Herren ingen annen tyngsel, og til den som seirer, makt over hedningene og morgenstjernen. Tyatira levde videre som en by i provinsen Asia og senere i Lydia."
  tl:
    - "Ang Tiatira, ang Akhisar ngayon, ay nasa malawak na libis ng hilagang Lidia sa daan mula Pergamo patungong Sardis. Tinatawag ito ni Estrabon na paninirahan ng mga Macedonio, na itinuring ng ilan na pinakamalayong lunsod ng mga Mysio; karaniwang pinaniniwalaan na si Seleucus I ay nagtatag dito ng kolonya ng mga sundalong Macedonio sa simula ng ikatlong siglo BK. Noong 190 BK, nagkampo si Antiochus III malapit sa Tiatira bago ang labanan sa Magnesia, at pagkatapos ng kaniyang pagkatalo ay dumating ang mga sugo mula sa lunsod upang isuko ito sa mga Romano. Pagkatapos ay napunta ito sa mga haring Attalida ng Pergamo, na ang kaharian ay ipinamana sa Roma noong 133 BK; ang Tiatira ang unang lunsod na inagaw ng nagkukunwaring tagapagmana na si Aristonicus sa sumunod na digmaan, at pumasok ito sa lalawigan ng Asia nang ayusin iyon pagkatapos ng kaniyang pagkatalo."
    - "Sa ilalim ng mga emperador, ang Tiatira ay masaganang bayan ng pamilihan. Maraming samahang pangkalakal ang pinangalanan ng mga inskripsiyong Romano roon: manggagawa ng lana, lino, katad, magpapalayok, panday ng tanso at tagapagkulay. Sa Filipos, sa mga nakinig kay Pablo ay “isang babaing nagngangalang Lidia, na mangangalakal ng kayong kulay-ube, na taga bayan ng Tiatira, isang masipag sa kabanalan”. Binuksan ng Panginoon ang kaniyang puso; nabautismuhan siya kasama ng kaniyang sambahayan at pinatuloy sa bahay niya si Pablo at ang mga kasama."
    - "Ang pinakamahabang liham sa pitong iglesia ay para sa Tiatira. Pinupuri nito ang pag-ibig, paglilingkod, pananampalataya at pagtitiis ng iglesia, ngunit sinasaway ito sapagkat pinahintulutan nito “ang babaing si Jezebel, na nagpapanggap na propetisa”, na nagturo sa mga lingkod ng Panginoon na makiapid at kumain ng inihain sa mga diyus-diyosan. Pinagtatalunan kung si Jezebel ay tunay na babae ng iglesia, at kung ang kaniyang turo ay may kaugnayan sa mga piging ng mga samahang pangkalakal. Sa mga “hindi nakakaalam ng malalalim na bagay ni Satanas”, ipinangangako ng Panginoon na wala nang ibang pasan, at sa magtatagumpay, kapangyarihan sa mga bansa at ang tala sa umaga. Nagpatuloy ang Tiatira bilang bayan ng lalawigan ng Asia at kalaunan ng Lidia."
  da:
    - "Thyatira, nutidens Akhisar, lå i en bred dal i det nordlige Lydien på vejen fra Pergamon til Sardes. Strabon kalder den en makedonsk bosættelse, som nogle regnede for mysernes yderste by; det antages sædvanligvis, at Seleukos 1. grundlagde en koloni af makedonske soldater her tidligt i 200-tallet f.Kr. I 190 f.Kr. slog Antiochos 3. lejr nær Thyatira før slaget ved Magnesia, og efter hans nederlag kom udsendinge fra byen for at overgive den til romerne. Den gik derefter til Attalidekongerne af Pergamon, hvis rige blev testamenteret til Rom i 133 f.Kr.; Thyatira var den første by, som prætendenten Aristonikos indtog i den krig, der fulgte, og den kom ind i provinsen Asia, da denne blev organiseret efter hans nederlag."
    - "Under kejserne var Thyatira en velstående markedsby. Indskrifter fra romertiden nævner mange håndværksgilder der: uldarbejdere, linnedarbejdere, læderarbejdere, pottemagere, bronzesmede og farvere. I Filippi var blandt dem, der hørte Paulus, »en Kvinde ved Navn Lydia, en Purpurkræmmerske fra Byen Thyatira, en Kvinde, som frygtede Gud«. Herren oplod hendes hjerte; hun blev døbt med sit hus og tog Paulus og hans ledsagere ind i sit hus."
    - "Det længste af brevene til de syv menigheder går til Thyatira. Det roser menighedens kærlighed, tjeneste, tro og udholdenhed, men irettesætter den, fordi den finder sig i »Kvinden Jesabel, som kalder sig selv en Profetinde«, som lærte Herrens tjenere at bedrive utugt og spise afgudsofferkød. Hvorvidt Jezabel var en virkelig kvinde i menigheden, og hvorvidt hendes lære havde at gøre med håndværksgildernes fester, er omstridt. Til dem, som »ikke kende Satans Dybder, som de kalde det«, lover Herren ingen anden byrde, og til den, der sejrer, magt over folkene og morgenstjernen. Thyatira levede videre som en by i provinsen Asia og senere Lydien."
  sr:
    - "Тијатира, данашњи Ахисар, лежала је у широкој долини северне Лидије на путу од Пергама до Сарда. Страбон је назива насељем Македонаца, које су неки сматрали најудаљенијим градом Мисијаца; обично се држи да је Селеук I овде почетком 3. века п. н. е. населио колонију македонских војника. Године 190. п. н. е. Антиох III улогорио се близу Тијатире пред битку код Магнезије, а после његовог пораза из града су стигли посланици да га предају Римљанима. Затим је прешла на Аталиде, цареве Пергама, чије је краљевство 133. п. н. е. завештано Риму; Тијатира је била први град који је заузео претендент Аристоник у рату који је уследио, и ушла је у провинцију Азију када је она организована после његовог пораза."
    - "Под царевима Тијатира је била богат трговачки град. Натписи из римског доба именују онде многе занатске цехове: прерађиваче вуне, ланара, кожаре, лончаре, коваче бронзе и бојадисаре. У Филипима је међу онима који су слушали Павла била „једна богобојазна жена, по имену Лидија, из града тијатирског, која продаваше скерлет“. Господ јој је отворио срце; крштена је с домом својим и узела је Павла и његове сапутнике у своју кућу."
    - "Најдужа од посланица седам цркава иде Тијатири. Хвали љубав, службу, веру и трпљење цркве, али је кори јер „допушташ жени Језавељи, која говори да је пророчица“, да учи слуге Господње да чине прељубу и да једу жртве идолске. Да ли је Језавеља била стварна жена у цркви и да ли је њено учење имало везе с гозбама занатских цехова, спорно је. Онима „који не познају дубина сотониних“ Господ обећава: „нећу метнути на вас другог бремена“, а ономе ко победи власт над народима и звезду даницу. Тијатира је наставила да живи као град провинције Азије, а касније Лидије."
