# Overview article (ADR 0007). Mainstream facts only; the identity of Darius the Mede is given as unresolved.
id: media
place: ad2fadf
title:
  en: "Media"
  ru: "Мидия"
  uk: "Мідія"
  es: "Media"
  pt: "Média"
  de: "Medien"
  fr: "Médie"
  it: "Media"
  pl: "Media"
  nl: "Medië"
  cs: "Médie"
body:
  en:
    - "Media was the land of the Medes, the high plateau of north-western Iran behind the Zagros mountains, with Ecbatana, now Hamadan, as its capital. The Medes were an Iranian people who appear in Assyrian records from the ninth century BC, when Shalmaneser III raided their country, famous for its horses; Sargon II and his successors took tribute from dozens of Median chiefs. When Samaria fell in 722 BC the Assyrians settled some of the deported Israelites “in the cities of the Medes”."
    - "Herodotus tells how Deioces united the Medes and built Ecbatana with its seven walls, and how Cyaxares made them a power: with Nabopolassar of Babylon he destroyed Nineveh in 612 BC, as the Babylonian Chronicle records, and fought Lydia until an eclipse ended a battle in 585. Isaiah and Jeremiah saw the Medes as the destroyers of Babylon: “Go up, O Elam: besiege, O Media”, and “the LORD hath raised up the spirit of the kings of the Medes”. Yet by the time Babylon fell in 539 the Medes had been overtaken: about 550 BC Cyrus the Persian defeated Astyages, the last Median king, whose own army deserted him, and Ecbatana became the summer residence of the Persian kings. There, in “the palace that is in the province of the Medes”, the scroll with Cyrus' decree about the Temple was found in Darius' day."
    - "So the Bible speaks of Persia and Media together: the seven princes of Esther, the laws “of the Persians and the Medes” that alter not, the two-horned ram of Daniel's vision that “are the kings of Media and Persia”. Daniel's “Darius the Median”, who took the kingdom after Belshazzar, has no match in the known sources, and his identity remains debated. Medes were at Jerusalem at Pentecost, among the Parthians and Elamites."
    - "Under the Persians Media was a satrapy whose revolt in 522 BC Darius crushed, as he records at Behistun; under the Seleucids, Parthians and Sasanians it kept its name, and Media Atropatene in the north became Azerbaijan. Excavations at Tepe Nush-i Jan and Godin Tepe have uncovered Median fortresses and a fire temple of the eighth and seventh centuries BC. The old Median heartland is now the Iranian provinces of Hamadan, Kermanshah and Kurdistan, and Hamadan is still a city of half a million."
  ru:
    - "Мидия — страна Мидян, высокое плоскогорье северо-западного Ирана за горами Загрос, со столицей Екбатаной, нынешним Хамаданом. Мидяне — иранский народ, известный по ассирийским записям с IX века до н. э., когда Салманасар III совершил набег на их страну, славную конями; Саргон II и его преемники брали дань с десятков мидийских вождей. Когда в 722 г. до н. э. пала Самария, ассирийцы поселили часть выведенных Израильтян «в городах Мидийских»."
    - "Геродот рассказывает, как Деиок объединил Мидян и построил Екбатану с семью стенами и как Киаксар сделал их силой: вместе с Набопаласаром Вавилонским он разрушил Ниневию в 612 г. до н. э., о чём сообщает Вавилонская хроника, и воевал с Лидией, пока затмение не прервало битву в 585 г. Исаия и Иеремия видели в Мидянах разрушителей Вавилона: «восходи, Елам, осаждай, Мид!» и «Господь возбудил дух царей Мидийских». Но к падению Вавилона в 539 г. Мидян уже обогнали: около 550 г. до н. э. Кир Персидский разбил Астиага, последнего мидийского царя, которого покинуло собственное войско, и Екбатана стала летней резиденцией персидских царей. Там, «во дворце, который в области Мидии», во дни Дария нашли свиток с указом Кира о Храме."
    - "Потому Библия говорит о Персии и Мидии вместе: семь князей в книге Есфирь, «законы Персидские и Мидийские», которые не отменяются, двурогий овен в видении Даниила — «цари Мидийский и Персидский». «Дарий Мидянин» Даниила, принявший царство после Валтасара, не находит соответствия в известных источниках, и вопрос о том, кто он, остаётся спорным. Мидяне были в Иерусалиме в день Пятидесятницы, среди Парфян и Еламитов."
    - "При Персах Мидия была сатрапией, восстание которой в 522 г. до н. э. подавил Дарий, как он записал в Бехистуне; при Селевкидах, Парфянах и Сасанидах она сохранила имя, а Мидия Атропатена на севере стала Азербайджаном. Раскопки в Тепе-Нуш-и-Джан и Годин-Тепе открыли мидийские крепости и храм огня VIII–VII веков до н. э. Старое сердце Мидии — ныне иранские провинции Хамадан, Керманшах и Курдистан, а Хамадан и сейчас город на полмиллиона жителей."
  uk:
    - "Мідія була краєм мідян, високим плато північно-західного Ірану за горами Загрос, зі столицею Екбатана, нині Хамадан. Мідяни були іранським народом, який з’являється в ассирійських записах від IX ст. до н. е., коли Салманассар III нападав на їхній край, славний кіньми; Саргон II та його наступники брали данину з десятків мідійських вождів. Коли впала Самарія 722 р. до н. е., ассирійці оселили частину виселених ізраїльтян «по Мидийських городах»."
    - "Геродот розповідає, як Деїок об’єднав мідян і збудував Екбатану з її сімома мурами, і як Киаксар зробив їх силою: з Набопаласаром Вавилонським він зруйнував Ніневію 612 р. до н. е., як записано у Вавилонській хроніці, і воював із Лідією, поки затемнення не припинило битву 585 р. Ісая й Єремія бачили в мідянах руйнівників Вавилона: «Приходи, Еламе; облягай, Миде!» і «Господь підпалив завзяттє царів Мидійських». Але на час падіння Вавилона 539 р. мідян уже випередили: близько 550 р. до н. е. перс Кір переміг Астіага, останнього мідійського царя, чиє власне військо його покинуло, і Екбатана стала літньою резиденцією перських царів. Там, «в палатї, що в країнї Мидиї», за днів Дарія знайшли сувій з Кіровим указом про храм."
    - "Тому Біблія говорить про Персію й Мідію разом: сім князів Естер, закони «Перські та Мидійські», що не змінюються, дворогий баран із бачення Даниїла, що «се царі Мидийський та Перський». «Дарій Мидій» Даниїла, що прийняв царство після Валтасара, не має відповідника в відомих джерелах, і його особа залишається спірною. Мідяни були в Єрусалимі на П’ятидесятницю, серед парфян та еламітів."
    - "За персів Мідія була сатрапією, повстання якої 522 р. до н. е. Дарій придушив, як він записує в Бехістуні; за Селевкідів, парфян і Сасанідів вона зберігала назву, а Мідія Атропатена на півночі стала Азербайджаном. Розкопки в Тепе-Нуш-і Джан і Годін-Тепе відкрили мідійські фортеці й храм вогню VIII–VII ст. до н. е. Давнє мідійське осердя сьогодні — іранські провінції Хамадан, Керманшах і Курдистан, а Хамадан і досі місто з півмільйоном мешканців."
  es:
    - "Media era la tierra de los medos, la alta meseta del noroeste de Irán tras los montes Zagros, con Ecbatana, hoy Hamadán, como capital. Los medos eran un pueblo iranio que aparece en los registros asirios desde el siglo IX a. C., cuando Salmanasar III asaltó su país, famoso por sus caballos; Sargón II y sus sucesores recibieron tributo de decenas de jefes medos. Cuando cayó Samaria en 722 a. C., los asirios establecieron a algunos de los israelitas deportados «en las ciudades de los Medos»."
    - "Heródoto cuenta cómo Deyoces unió a los medos y construyó Ecbatana con sus siete murallas, y cómo Ciaxares los convirtió en una potencia: con Nabopolasar de Babilonia destruyó Nínive en 612 a. C., como registra la Crónica babilónica, y combatió a Lidia hasta que un eclipse puso fin a una batalla en 585. Isaías y Jeremías vieron en los medos a los destructores de Babilonia: «Sube, Persa; cerca, Medo», y «despertado ha Jehová el espíritu de los reyes de Media». Sin embargo, cuando Babilonia cayó en 539, los medos ya habían sido superados: hacia 550 a. C. Ciro el persa derrotó a Astiages, el último rey medo, cuyo propio ejército lo abandonó, y Ecbatana pasó a ser la residencia de verano de los reyes persas. Allí, en «el palacio que está en la provincia de Media», se halló en tiempos de Darío el rollo con el decreto de Ciro sobre el Templo."
    - "Así la Biblia habla de Persia y Media juntas: los siete príncipes de Ester, las leyes «de Persia y de Media» que no se alteran, el carnero de dos cuernos de la visión de Daniel, que «son los reyes de Media y de Persia». El «Darío de Media» de Daniel, que tomó el reino después de Belsasar, no tiene correspondencia en las fuentes conocidas, y su identidad sigue debatida. Había medos en Jerusalén en Pentecostés, entre los partos y los elamitas."
    - "Bajo los persas, Media fue una satrapía cuya rebelión de 522 a. C. aplastó Darío, como él mismo registra en Behistún; bajo los seléucidas, los partos y los sasánidas conservó su nombre, y la Media Atropatene del norte se convirtió en Azerbaiyán. Las excavaciones en Tepe Nush-i Jan y Godin Tepe han sacado a la luz fortalezas medas y un templo del fuego de los siglos VIII y VII a. C. El antiguo corazón medo son hoy las provincias iraníes de Hamadán, Kermanshah y Kurdistán, y Hamadán sigue siendo una ciudad de medio millón de habitantes."
  pt:
    - "A Média era a terra dos medos, o alto planalto do noroeste do Irã atrás dos montes Zagros, tendo Ecbatana, hoje Hamadan, por capital. Os medos eram um povo iraniano que aparece nos registros assírios desde o século IX a.C., quando Salmaneser III invadiu seu país, famoso por seus cavalos; Sargão II e seus sucessores receberam tributo de dezenas de chefes medos. Quando Samaria caiu, em 722 a.C., os assírios estabeleceram alguns dos israelitas deportados “nas cidades dos medos”."
    - "Heródoto conta como Dejoces uniu os medos e construiu Ecbatana com seus sete muros, e como Ciaxares os fez uma potência: com Nabopolassar da Babilônia destruiu Nínive em 612 a.C., como registra a Crônica Babilônica, e combateu a Lídia até que um eclipse pôs fim a uma batalha em 585. Isaías e Jeremias viram os medos como destruidores da Babilônia: “Suba, Elão; ataque!” e “O SENHOR despertou o espírito dos reis dos medos”. Mas, quando a Babilônia caiu em 539, os medos já haviam sido ultrapassados: por volta de 550 a.C. Ciro, o persa, derrotou Astíages, o último rei medo, cujo próprio exército o abandonou, e Ecbatana tornou-se a residência de verão dos reis persas. Ali, “no palácio que fica na província da Média”, foi encontrado, no tempo de Dario, o rolo com o decreto de Ciro sobre o Templo."
    - "Assim a Bíblia fala da Pérsia e da Média juntas: os sete príncipes de Ester, as leis “dos persas e dos medos” que não se revogam, o carneiro de dois chifres da visão de Daniel, de que “eles são os reis da Média e da Pérsia”. O “Dario, o medo” de Daniel, que recebeu o reino depois de Belsazar, não tem correspondente nas fontes conhecidas, e sua identidade continua debatida. Havia medos em Jerusalém no Pentecostes, entre os partos e os elamitas."
    - "Sob os persas, a Média foi uma satrapia cuja revolta em 522 a.C. Dario esmagou, como registra em Behistun; sob selêucidas, partos e sassânidas conservou o nome, e a Média Atropatene, no norte, tornou-se o Azerbaijão. Escavações em Tepe Nush-i Jan e Godin Tepe descobriram fortalezas medas e um templo do fogo dos séculos VIII e VII a.C. O antigo coração medo é hoje as províncias iranianas de Hamadan, Kermanshah e Curdistão, e Hamadan ainda é uma cidade de meio milhão de habitantes."
  de:
    - "Medien war das Land der Meder, die Hochebene des nordwestlichen Iran hinter dem Zagros, mit Ekbatana, dem heutigen Hamadan, als Hauptstadt. Die Meder waren ein iranisches Volk, das ab dem 9. Jahrhundert v. Chr. in assyrischen Aufzeichnungen erscheint, als Salmanassar III. ihr Land, berühmt für seine Pferde, überfiel; Sargon II. und seine Nachfolger nahmen von Dutzenden medischer Häuptlinge Tribut. Als Samaria 722 v. Chr. fiel, setzten die Assyrer einen Teil der verschleppten Israeliten „in die Städte der Meder“."
    - "Herodot erzählt, wie Deiokes die Meder einte und Ekbatana mit seinen sieben Mauern baute und wie Kyaxares sie zur Macht machte: Mit Nabopolassar von Babylon zerstörte er 612 v. Chr. Ninive, wie die Babylonische Chronik berichtet, und kämpfte gegen Lydien, bis eine Sonnenfinsternis 585 eine Schlacht beendete. Jesaja und Jeremia sahen in den Medern die Zerstörer Babylons: „Zieh herauf, Elam! belagere sie, Madai!“ und „Der HERR hat den Mut der Könige in Medien erweckt“. Doch als Babylon 539 fiel, waren die Meder bereits überholt: Um 550 v. Chr. besiegte der Perser Kyrus Astyages, den letzten medischen König, den sein eigenes Heer verließ, und Ekbatana wurde Sommerresidenz der persischen Könige. Dort, „zu Ahmetha im Schloß“ in der Provinz Medien, fand man zur Zeit des Darius die Schriftrolle mit dem Erlass des Kyrus über den Tempel."
    - "So spricht die Bibel von Persien und Medien zusammen: die sieben Fürsten Esters, das Gesetz „der Perser und Meder“, „welches man nicht darf übertreten“, der zweihörnige Widder in Daniels Vision, dessen Hörner, wie es heißt, „sind die Könige in Medien und Persien“. Daniels „Darius aus Medien“, der nach Belsazar das Reich übernahm, hat in den bekannten Quellen keine Entsprechung, und seine Identität ist umstritten. Meder waren an Pfingsten in Jerusalem, unter den Parthern und Elamitern."
    - "Unter den Persern war Medien eine Satrapie, deren Aufstand 522 v. Chr. Darius niederschlug, wie er in Behistun berichtet; unter Seleukiden, Parthern und Sasaniden behielt es seinen Namen, und Media Atropatene im Norden wurde zu Aserbaidschan. Grabungen in Tepe Nush-i Jan und Godin Tepe haben medische Festungen und einen Feuertempel des 8. und 7. Jahrhunderts v. Chr. freigelegt. Das alte medische Kernland sind heute die iranischen Provinzen Hamadan, Kermanshah und Kurdistan, und Hamadan ist noch immer eine Stadt von einer halben Million."
  fr:
    - "La Médie était le pays des Mèdes, le haut plateau du nord-ouest de l’Iran derrière les monts Zagros, avec Ecbatane, l’actuelle Hamadan, pour capitale. Les Mèdes étaient un peuple iranien qui apparaît dans les textes assyriens à partir du IXe siècle av. J.-C., quand Salmanasar III razzia leur pays, réputé pour ses chevaux ; Sargon II et ses successeurs prirent tribut de dizaines de chefs mèdes. Quand Samarie tomba en 722 av. J.-C., les Assyriens établirent une partie des Israélites déportés « dans les villes des Mèdes »."
    - "Hérodote raconte comment Déjocès unit les Mèdes et bâtit Ecbatane avec ses sept murailles, et comment Cyaxare en fit une puissance : avec Nabopolassar de Babylone, il détruisit Ninive en 612 av. J.-C., comme la Chronique babylonienne le rapporte, et combattit la Lydie jusqu’à ce qu’une éclipse mît fin à une bataille en 585. Ésaïe et Jérémie virent dans les Mèdes les destructeurs de Babylone : « Monte, Élam ! Assiège, Médie ! » et « l’Éternel a excité l’esprit des rois de Médie ». Pourtant, quand Babylone tomba en 539, les Mèdes avaient été dépassés : vers 550 av. J.-C., Cyrus le Perse vainquit Astyage, dernier roi mède, dont l’armée elle-même l’abandonna, et Ecbatane devint la résidence d’été des rois perses. Là, à « Achmetha, capitale de la province de Médie », on retrouva du temps de Darius le rouleau portant le décret de Cyrus sur le Temple."
    - "Ainsi la Bible parle ensemble de la Perse et de la Médie : les sept princes d’Esther, les lois « des Perses et des Mèdes » qui ne changent pas, le bélier à deux cornes de la vision de Daniel : « ce sont les rois des Mèdes et des Perses ». Le « Darius, le Mède » de Daniel, qui reçut le royaume après Belschatsar, n’a pas de correspondant dans les sources connues, et son identité reste débattue. Des Mèdes se trouvaient à Jérusalem à la Pentecôte, parmi les Parthes et les Élamites."
    - "Sous les Perses, la Médie fut une satrapie dont Darius écrasa la révolte en 522 av. J.-C., comme il le consigne à Behistun ; sous les Séleucides, les Parthes et les Sassanides, elle garda son nom, et la Médie Atropatène, au nord, devint l’Azerbaïdjan. Les fouilles de Tepe Nush-i Jan et de Godin Tepe ont mis au jour des forteresses mèdes et un temple du feu des VIIIe et VIIe siècles av. J.-C. Le vieux cœur mède est aujourd’hui constitué des provinces iraniennes de Hamadan, de Kermanchah et du Kurdistan, et Hamadan est encore une ville d’un demi-million d’habitants."
  it:
    - "La Media era la terra dei Medi, l’alto altopiano dell’Iran nord-occidentale oltre i monti Zagros, con Ecbatana, l’odierna Hamadan, come capitale. I Medi erano un popolo iranico che compare nelle cronache assire dal IX secolo a.C., quando Salmanàssar III fece incursioni nel loro paese, famoso per i cavalli; Sargon II e i suoi successori riscossero tributo da decine di capi medi. Quando Samaria cadde nel 722 a.C. gli Assiri insediarono alcuni degli Israeliti deportati «nelle città dei Medi»."
    - "Erodoto racconta come Deioce unì i Medi e costruì Ecbatana con le sue sette cinte di mura, e come Ciassare ne fece una potenza: con Nabopolassar di Babilonia distrusse Ninive nel 612 a.C., come registra la Cronaca babilonese, e combatté la Lidia finché un’eclissi pose fine a una battaglia nel 585. Isaia e Geremia videro nei Medi i distruttori di Babilonia: «Sali, o Elam! Metti l’assedio o Media!», e «L’Eterno ha eccitato lo spirito dei re dei Medi». Eppure, quando Babilonia cadde nel 539, i Medi erano stati sopravanzati: verso il 550 a.C. Ciro il Persiano sconfisse Astiage, l’ultimo re dei Medi, il cui stesso esercito lo abbandonò, ed Ecbatana divenne la residenza estiva dei re persiani. Là, «nel castello d’Ahmetha, ch’è nella provincia di Media», si trovò ai giorni di Dario il rotolo con il decreto di Ciro sul Tempio."
    - "Così la Bibbia parla insieme di Persia e Media: i sette principi di Ester, le leggi «di Persia e di Media» che non si mutano, il montone con due corna della visione di Daniele che «rappresenta i re di Media e di Persia». «Dario il Medo» di Daniele, che ricevette il regno dopo Baldassarre, non ha riscontro nelle fonti note, e la sua identità resta discussa. Dei Medi erano a Gerusalemme a Pentecoste, tra Parti ed Elamiti."
    - "Sotto i Persiani la Media fu una satrapia la cui rivolta nel 522 a.C. Dario schiacciò, come registra a Behistun; sotto i Seleucidi, i Parti e i Sasanidi conservò il nome, e la Media Atropatene nel nord divenne l’Azerbaigian. Gli scavi a Tepe Nush-i Jan e Godin Tepe hanno portato alla luce fortezze medie e un tempio del fuoco dell’VIII e VII secolo a.C. L’antico cuore dei Medi è oggi costituito dalle province iraniane di Hamadan, Kermanshah e Kurdistan, e Hamadan è ancora una città di mezzo milione di abitanti."
  pl:
    - "Media była krajem Medów, wysokim płaskowyżem północno-zachodniego Iranu za górami Zagros, ze stolicą w Ekbatanie, dzisiejszym Hamadanie. Medowie byli ludem irańskim, który pojawia się w zapisach asyryjskich od IX w. p.n.e., gdy Salmanasar III najeżdżał ich kraj, słynny z koni; Sargon II i jego następcy pobierali daninę od dziesiątek medyjskich wodzów. Gdy w 722 r. p.n.e. upadła Samaria, Asyryjczycy osiedlili część deportowanych Izraelitów „w miastach Medskich”."
    - "Herodot opowiada, jak Dejokes zjednoczył Medów i zbudował Ekbatanę z siedmioma murami, i jak Kiaksares uczynił z nich potęgę: wraz z Nabopolassarem z Babilonu zniszczył Niniwę w 612 r. p.n.e., co odnotowuje Kronika babilońska, i walczył z Lidią, aż zaćmienie Słońca przerwało bitwę w 585 r. Izajasz i Jeremiasz widzieli w Medach niszczycieli Babilonu: „Przyciągnijże, Elamie! Oblęż, Medzie!” i „Wzbudził Pan ducha królów Medskich”. Jednak gdy Babilon upadł w 539 r., Medowie zostali już prześcignięci: około 550 r. p.n.e. Cyrus Perski pokonał Astyagesa, ostatniego medyjskiego króla, którego własne wojsko go opuściło, a Ekbatana stała się letnią rezydencją królów perskich. Tam, „na zamku, który jest w ziemi Medskiej”, w dniach Dariusza znaleziono zwój z dekretem Cyrusa o Świątyni."
    - "Tak Biblia mówi razem o Persji i Medii: siedmiu książąt z Księgi Estery, prawa „Perskie i Medskie”, które się nie zmieniają, dwurogi baran z widzenia Daniela, w którym „są królowie, Medski i Perski”. „Daryjusz, Medczyk” Daniela, który objął królestwo po Belszassarze, nie ma odpowiednika w znanych źródłach, a jego tożsamość pozostaje dyskutowana. Medowie byli w Jerozolimie w Pięćdziesiątnicę, wśród Partów i Elamitów."
    - "Pod Persami Media była satrapią, której bunt w 522 r. p.n.e. zdławił Dariusz, jak zapisał w Behistun; pod Seleucydami, Partami i Sasanidami zachowała nazwę, a Media Atropatene na północy stała się Azerbejdżanem. Wykopaliska w Tepe Nush-i Jan i Godin Tepe odsłoniły medyjskie twierdze i świątynię ognia z VIII i VII w. p.n.e. Dawne medyjskie jądro to dziś irańskie prowincje Hamadan, Kermanszah i Kurdystan, a Hamadan wciąż jest miastem półmilionowym."
  nl:
    - "Medië was het land van de Meden, het hoge plateau van het noordwesten van Iran achter het Zagrosgebergte, met Ekbatana, nu Hamadan, als hoofdstad. De Meden waren een Iraans volk dat in Assyrische bronnen voorkomt vanaf de negende eeuw v.Chr., toen Salmaneser III hun land, beroemd om zijn paarden, plunderde; Sargon II en zijn opvolgers ontvingen schatting van tientallen Medische hoofdmannen. Toen Samaria in 722 v.Chr. viel, vestigden de Assyriërs een deel van de weggevoerde Israëlieten “in de steden der Meden”."
    - "Herodotus vertelt hoe Deioces de Meden verenigde en Ekbatana met zijn zeven muren bouwde, en hoe Cyaxares hen tot een macht maakte: met Nabopolassar van Babylon vernietigde hij Nineve in 612 v.Chr., zoals de Babylonische kroniek vermeldt, en voerde hij oorlog met Lydië tot een zonsverduistering in 585 een slag beëindigde. Jesaja en Jeremia zagen de Meden als de verwoesters van Babylon: “trek op, o Elam! beleger ze, o Medië!”, en “de HEERE heeft den geest der koningen van Medië opgewekt”. Toch waren de Meden tegen de tijd dat Babylon in 539 viel ingehaald: omstreeks 550 v.Chr. versloeg Cyrus de Pers Astyages, de laatste Medische koning, wiens eigen leger hem in de steek liet, en Ekbatana werd de zomerresidentie van de Perzische koningen. Daar werd, “in de burcht, die in het landschap Medië is”, in de dagen van Darius de rol met Cyrus' besluit over de tempel gevonden."
    - "Zo spreekt de Bijbel samen van Perzië en Medië: de zeven vorsten van Ester, de wetten “der Perzen en Meden” die niet veranderen, de ram met twee hoorns uit Daniëls visioen: “zijn de koningen der Meden en der Perzen”. Daniëls “Darius, de Meder”, die het koninkrijk na Belsazar ontving, heeft geen weerslag in de bekende bronnen, en zijn identiteit blijft omstreden. Meden waren met Pinksteren in Jeruzalem, onder de Parthen en Elamieten."
    - "Onder de Perzen was Medië een satrapie waarvan de opstand in 522 v.Chr. door Darius werd neergeslagen, zoals hij te Behistun vermeldt; onder de Seleuciden, Parthen en Sassaniden behield het zijn naam, en Media Atropatene in het noorden werd Azerbeidzjan. Opgravingen bij Tepe Nush-i Jan en Godin Tepe hebben Medische vestingen en een vuurtempel uit de achtste en zevende eeuw v.Chr. blootgelegd. Het oude Medische kerngebied is nu de Iraanse provincies Hamadan, Kermanshah en Koerdistan, en Hamadan is nog steeds een stad van een half miljoen."
  cs:
    - "Médie byla země Médů, vysoká náhorní rovina severozápadního Íránu za pohořím Zagros, s Ekbatanou, dnešním Hamadánem, jako hlavním městem. Médové byli íránský národ, který se objevuje v asyrských záznamech od 9. století př. n. l., kdy Salmanasar III. vpadl do jejich země, proslulé koňmi; Sargon II. a jeho nástupci brali tribut od desítek médských náčelníků. Když roku 722 př. n. l. padlo Samaří, usadili Asyřané některé z deportovaných Izraelců „v městech Médských“."
    - "Hérodotos vypráví, jak Deiokés sjednotil Médy a vystavěl Ekbatanu se sedmi hradbami a jak z nich Kyaxarés učinil velmoc: s Nabopolassarem Babylónským zničil roku 612 př. n. l. Ninive, jak zaznamenává Babylónská kronika, a bojoval s Lýdií, dokud zatmění roku 585 neukončilo bitvu. Izajáš a Jeremjáš viděli v Médech zničitele Babylóna: „Přitáhniž Elame, Médský oblehni“ a „Hospodin vzbudil ducha králů Médských“. V době pádu Babylóna roku 539 však už byli Médové předstiženi: kolem roku 550 př. n. l. porazil Peršan Kýros Astyaga, posledního médského krále, jehož vlastní vojsko ho opustilo, a Ekbatana se stala letním sídlem perských králů. Tam, „na hradě, kterýž jest v Médské krajině“, byl za Dareiových dnů nalezen svitek s Kýrovým dekretem o chrámu."
    - "Bible tedy mluví o Persii a Médii spolu: sedm knížat Esteřiných, práva „Perská a Médská, kteráž by nemohla změněna býti“, dvourohý skopec Danielova vidění, jehož rohy „jsou králové Médský a Perský“. Danielův „Darius pak Médský“, který ujal království po Belšasarovi, nemá protějšek ve známých pramenech a jeho totožnost zůstává sporná. Médové byli v Jeruzalémě o Letnicích, mezi Parthy a Elamity."
    - "Za Peršanů byla Médie satrapií, jejíž vzpouru roku 522 př. n. l. Dareios potlačil, jak zaznamenává v Bísotúnu; za Seleukovců, Parthů a Sásánovců si jméno uchovala a Médie Atropatené na severu se stala Ázerbájdžánem. Vykopávky v Tepe Nush-i Jan a Godin Tepe odkryly médské pevnosti a chrám ohně z 8. a 7. století př. n. l. Staré médské jádro jsou dnes íránské provincie Hamadán, Kermánšáh a Kurdistán a Hamadán je dosud půlmilionové město."
