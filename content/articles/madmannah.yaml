body:
  en:
    - "Madmannah was a town of the Negev, the southernmost district of Judah, listed in the run “And Ziklag, and Madmannah, and Sansannah”. The genealogies of Chronicles name it once more in the family of Caleb: Maachah, Caleb’s concubine, “bare also Shaaph the father of Madmannah”, a way of saying that a Calebite clan founded or held the town. In the corresponding place in the list of Simeon’s towns stands Beth-marcaboth, “house of chariots”, and some think it is the same town, but that is only a guess. Nothing else is told of it, and it is not the Madmenah of Isaiah 10:31 north of Jerusalem nor Madmen in Moab."
    - "Eusebius placed Madmannah at Menois, a village near Gaza, and the map keeps Minieh, south of Gaza, among its candidates. Its first choice is Khirbet Tatrit in the northern Negev, beside Khirbet Umm ed-Deimneh, which seems to preserve the name and is the second guess on the map. The area lies north-east of Beersheba, in southern Israel; no excavation has confirmed the identification."
  ru:
    - "Мадмана — город Негева, самого южного округа Иудеи, названный в ряду «Циклаг, Мадмана и Сансана». Родословия Паралипоменон упоминают её ещё раз в роду Халева: Мааха, наложница Халева, «родила Шаафа, отца Мадманны», то есть, по обычному пониманию, род Халевитов основал город или владел им. На соответствующем месте в перечне городов Симеона стоит Беф-Маркавоф, «дом колесниц», и некоторые считают это тем же городом, но это лишь догадка. Больше о ней ничего не рассказано, и это не Мадмена из Исаии 10:31 к северу от Иерусалима и не Мадмена в Моаве."
    - "Евсевий помещал Мадману в Меноис, селение близ Газы, и карта держит среди догадок Минью к югу от Газы. Первым же она ставит Хирбет-Татрит на севере Негева, рядом с Хирбет-Умм-эд-Демине, которое, по-видимому, сохраняет имя и стоит на карте второй догадкой. Эта местность лежит к северо-востоку от Вирсавии, на юге Израиля; раскопками отождествление не подтверждено."
  uk:
    - "Мадманна була містом Негеву, найпівденнішого округу Юди, перелічена в низці «Циклаг, Мадмана, та Сансана». Родоводи Хронік називають її ще раз у роду Калеба: Маака, наложниця Калеба, «Вона ж породила й Шаафа, Мадманниного батька», що означає: калебівський рід заснував це місто або володів ним. У відповідному місці переліку міст Симеона стоїть Бет-Маркабот, «дім колісниць», і дехто думає, що це те саме місто, але це лише здогад. Більше нічого про нього не розповідається, і це не Мадмена з Ісаї 10:31 на північ від Єрусалима й не Мадмен у Моаві."
    - "Євсевій розміщував Мадманну в Меноїсі, селі поблизу Гази, а мапа тримає Мінію на південь від Гази серед кандидатів. Її перший вибір — Хірбет-Татріт у північному Негеві, поруч із Хірбет-Умм-ед-Деймне, що, схоже, зберігає назву й є другою здогадкою на мапі. Ця місцевість лежить на північний схід від Беер-Шеви, на півдні Ізраїлю; жодні розкопки не підтвердили ототожнення."
  es:
    - "Madmana era una ciudad del Néguev, el distrito más meridional de Judá, enumerada en la serie «Y Siclag, y Madmanna, Sansana». Las genealogías de Crónicas la nombran una vez más en la familia de Caleb: Maaca, concubina de Caleb, «Y también le parió á Saaph padre de Madmannah», modo de decir que un clan calebita fundó o poseyó la ciudad. En el lugar correspondiente de la lista de ciudades de Simeón figura Bet-marcabot, «casa de los carros», y algunos piensan que es la misma ciudad, pero es solo una conjetura. No se cuenta nada más de ella, y no es la Madmena de Isaías 10:31, al norte de Jerusalén, ni Madmena en Moab."
    - "Eusebio situó Madmana en Menois, una aldea cerca de Gaza, y el mapa mantiene Minieh, al sur de Gaza, entre sus candidatos. Su primera elección es Khirbet Tatrit, en el norte del Néguev, junto a Khirbet Umm ed-Deimneh, que parece conservar el nombre y es la segunda conjetura del mapa. La zona se halla al nordeste de Beerseba, en el sur de Israel; ninguna excavación ha confirmado la identificación."
  pt:
    - "Madmana era uma cidade do Neguebe, o distrito mais meridional de Judá, listada na sequência “Ziclague, Madmana, Sansana”. As genealogias das Crônicas a nomeiam mais uma vez na família de Calebe: Maaca, concubina de Calebe, “também deu à luz Saafe, pai de Madmana”, modo de dizer que um clã calebita fundou ou possuía a cidade. No lugar correspondente da lista das cidades de Simeão está Bete-Marcabote, “casa dos carros”, e alguns pensam que é a mesma cidade, mas isso é só um palpite. Nada mais se conta dela, e não é a Madmena de Isaías 10:31, ao norte de Jerusalém, nem Madmém, em Moabe."
    - "Eusébio situou Madmana em Menois, uma aldeia perto de Gaza, e o mapa mantém Minieh, ao sul de Gaza, entre seus candidatos. Sua primeira escolha é Khirbet Tatrit, no norte do Neguebe, junto a Khirbet Umm ed-Deimneh, que parece preservar o nome e é o segundo palpite do mapa. A área fica a nordeste de Berseba, no sul de Israel; nenhuma escavação confirmou a identificação."
  de:
    - "Madmanna war eine Stadt des Negev, des südlichsten Bezirks Judas, aufgeführt in der Reihe „Ziklag, Madmanna, Sansanna“. Die Genealogien der Chronik nennen sie noch einmal in der Familie Kalebs: Maacha, Kalebs Kebsweib, „gebar auch Saaph, den Vater Madmannas“, eine Weise zu sagen, dass eine Kalebiter-Sippe die Stadt gründete oder hielt. An der entsprechenden Stelle in der Liste der Städte Simeons steht Bet-Markabot, „Haus der Wagen“, und manche halten sie für dieselbe Stadt, doch das ist nur eine Vermutung. Sonst wird nichts von ihr erzählt, und sie ist weder das Madmena von Jesaja 10,31 nördlich von Jerusalem noch Madmen in Moab."
    - "Eusebius setzte Madmanna in Menois an, einem Dorf bei Gaza, und die Karte führt Minieh südlich von Gaza unter ihren Kandidaten. Ihre erste Wahl ist Khirbet Tatrit im nördlichen Negev, neben Khirbet Umm ed-Deimneh, das den Namen zu bewahren scheint und die zweite Vermutung auf der Karte ist. Das Gebiet liegt nordöstlich von Beerscheba im Süden Israels; keine Ausgrabung hat die Gleichsetzung bestätigt."
  fr:
    - "Madmanna était une ville du Négev, le district le plus méridional de Juda, citée dans la série « Tsiklag, Madmanna, Sansanna ». Les généalogies des Chroniques la nomment une fois encore dans la famille de Caleb : Maaca, concubine de Caleb, « enfanta encore Schaaph, père de Madmanna », manière de dire qu’un clan calébite fonda ou tint la ville. À l’endroit correspondant de la liste des villes de Siméon figure Beth-Marcaboth, « maison des chars », et certains pensent que c’est la même ville, mais ce n’est qu’une conjecture. On n’en dit rien d’autre, et ce n’est ni la Madména d’Ésaïe 10:31 au nord de Jérusalem ni Madmen en Moab."
    - "Eusèbe plaçait Madmanna à Ménois, village près de Gaza, et la carte garde Minieh, au sud de Gaza, parmi ses candidats. Son premier choix est Khirbet Tatrit, dans le nord du Négev, à côté de Khirbet Umm ed-Deimneh, qui semble conserver le nom et qui est la seconde hypothèse de la carte. La région se trouve au nord-est de Beer-Schéba, dans le sud d’Israël ; aucune fouille n’a confirmé l’identification."
  it:
    - "Madmanna era una città del Negheb, il distretto più meridionale di Giuda, elencata nella serie «Tsiklag, Madmanna, Sansanna». Le genealogie delle Cronache la nominano ancora una volta nella famiglia di Caleb: Maaca, concubina di Caleb, «Partorì anche Shaaf, padre di Madmanna», modo di dire che un clan calebita fondò o tenne la città. Nel punto corrispondente dell’elenco delle città di Simeone sta Bet-Marcabot, «casa dei carri», e alcuni pensano che sia la stessa città, ma è solo una congettura. Non si sa altro di essa, e non è la Madmena di Isaia 10,31 a nord di Gerusalemme né Madmen in Moab."
    - "Eusebio collocava Madmanna a Menois, un villaggio presso Gaza, e la mappa mantiene Minieh, a sud di Gaza, tra i suoi candidati. La sua prima scelta è Khirbet Tatrit nel Negheb settentrionale, accanto a Khirbet Umm ed-Deimneh, che sembra conservare il nome ed è la seconda ipotesi sulla mappa. La zona si trova a nord-est di Bersabea, nel sud di Israele; nessuno scavo ha confermato l’identificazione."
  pl:
    - "Madmanna było miastem Negewu, najbardziej południowego okręgu Judy, wymienionym w ciągu: „I Syceleg, i Medemena, i Sensenna”. Rodowody w Księdze Kronik wymieniają je jeszcze raz w rodzinie Kaleba: Maaka, nałożnica Kaleba, urodziła też Szaafa, ojca Madmanny, co jest sposobem powiedzenia, że kalebicki ród założył miasto lub je posiadał. W odpowiednim miejscu listy miast Symeona stoi Bet-Markabot, „dom rydwanów”, i niektórzy uważają, że to to samo miasto, ale to tylko domysł. Nic więcej o nim nie wiadomo i nie jest to Madmena z Iz 10,31 na północ od Jerozolimy ani Madmena w Moabie."
    - "Euzebiusz umieszczał Madmannę w Menois, wsi koło Gazy, a mapa zachowuje Minieh, na południe od Gazy, wśród swoich kandydatów. Jej pierwszym wyborem jest Khirbet Tatrit w północnym Negewie, obok Khirbet Umm ed-Deimneh, które zdaje się zachowywać nazwę i jest drugim domysłem na mapie. Okolica leży na północny wschód od Beer-Szeby, w południowym Izraelu; żadne wykopaliska nie potwierdziły utożsamienia."
  nl:
    - "Madmanna was een stad in de Negev, het zuidelijkste district van Juda, genoemd in de reeks “En Ziklag, en Madmanna, en Sanzanna”. De genealogieën van Kronieken noemen haar nog één keer in het geslacht van Kaleb: Maächa, Kalebs bijvrouw, baarde ook Saäf, de vader van Madmanna, een manier om te zeggen dat een Kalebitische clan de stad stichtte of bezat. Op de overeenkomstige plaats in de lijst van Simeons steden staat Beth-Markabot, “huis van wagens”, en sommigen menen dat het dezelfde stad is, maar dat is slechts een gissing. Verder wordt er niets van haar verteld, en het is niet het Madmena van Jesaja 10:31 ten noorden van Jeruzalem noch Madmen in Moab."
    - "Eusebius plaatste Madmanna bij Menois, een dorp bij Gaza, en de kaart houdt Minieh, ten zuiden van Gaza, onder haar kandidaten. De eerste keuze is Khirbet Tatrit in de noordelijke Negev, naast Khirbet Umm ed-Deimneh, dat de naam lijkt te bewaren en de tweede gok op de kaart is. Het gebied ligt ten noordoosten van Berseba, in zuidelijk Israël; geen opgraving heeft de identificatie bevestigd."
  cs:
    - "Madmana bylo město v Negevu, nejjižnějším okrsku Judy, uvedené v řadě „A Sicelech, a Medemena, a Sensenna“. Rodopisy Kronik je jmenují ještě jednou v rodu Kálebově: Maaka, Kálebova vedlejší žena, „porodila pak Saafa otce Madmanejských“, což je způsob, jak říci, že kálebovský rod město založil nebo držel. Na odpovídajícím místě seznamu Simeonových měst stojí Bét-markabót, „dům vozů“, a někteří soudí, že jde o totéž město, ale je to jen dohad. Nic jiného se o něm neříká a není to Madmena z Izajáše 10,31 severně od Jeruzaléma ani Madmén v Moábu."
    - "Eusebius kladl Madmanu do Menois, vesnice u Gazy, a mapa ponechává mezi kandidáty Minieh jižně od Gazy. Její první volbou je Khirbet Tatrit v severním Negevu, vedle Khirbet Umm ed-Deimneh, který se zdá uchovávat jméno a je druhým dohadem na mapě. Oblast leží severovýchodně od Beer-šeby v jižním Izraeli; žádné vykopávky určení nepotvrdily."
  sv:
    - "Madmanna var en stad i Negev, Judas sydligaste distrikt, upptagen i raden ”Siklag, Madmanna, Sansanna”. Krönikeböckernas släktregister nämner den en gång till i Kalevs släkt: Maaka, Kalevs bihustru, ”födde ock Saaf, Madmannas fader”, ett sätt att säga att en kalevitisk släkt grundade eller höll staden. På motsvarande plats i förteckningen över Simeons städer står Bet-Markavot, ”vagnarnas hus”, och vissa tror att det är samma stad, men det är bara en gissning. Inget annat berättas om den, och den är inte Madmena i Jesaja 10:31 norr om Jerusalem eller Madmen i Moab."
    - "Eusebios förlade Madmanna till Menois, en by nära Gaza, och kartan behåller Minieh, söder om Gaza, bland sina kandidater. Dess första val är Khirbet Tatrit i norra Negev, intill Khirbet Umm ed-Deimneh, som tycks bevara namnet och är kartans andra gissning. Området ligger nordost om Beer Sheva, i södra Israel; ingen utgrävning har bekräftat identifieringen."
  nb:
    - "Madmanna var en by i Negev, det sørligste distriktet i Juda, oppført i rekken «og Siklag og Madmanna og Sansanna». Slektstavlene i Krønikebøkene nevner den ennå en gang i Kalebs familie: Maaka, Kalebs medhustru, «fødte også Sa'af, far til Madmanna», en måte å si at en kalebittisk klan grunnla eller holdt byen. På det tilsvarende stedet i listen over Simeons byer står Bet-Markabot, «vognenes hus», og noen mener at det er den samme byen, men det er bare et gjett. Ellers fortelles ingenting om den, og den er ikke Madmena i Jesaja 10,31 nord for Jerusalem og heller ikke Madmen i Moab."
    - "Eusebius plasserte Madmanna ved Menois, en landsby nær Gasa, og kartet beholder Minieh, sør for Gasa, blant kandidatene. Dets første valg er Khirbet Tatrit i det nordlige Negev, ved siden av Khirbet Umm ed-Deimneh, som later til å bevare navnet og er kartets andre gjett. Området ligger nordøst for Beer-Sjeba, i det sørlige Israel; ingen utgravning har bekreftet identifikasjonen."
  tl:
    - "Ang Madmanna ay bayan ng Negeb, ang pinakatimugang distrito ng Juda, na nakatala sa hanay na “At Siclag, at Madmanna, at Sansana”. Pinangangalanan ito ng mga talaangkan ng Mga Cronica nang minsan pa sa pamilya ni Caleb: tungkol sa kinakasama ni Caleb na si Maaca: “Ipinanganak din niya si Saaph na ama ni Madmannah”, isang paraan ng pagsasabing itinatag o hinawakan ng isang angkang Calebita ang bayan. Sa katumbas na lugar sa talaan ng mga bayan ni Simeon ay nakatayo ang Beth-marchaboth, “bahay ng mga karo”, at iniisip ng ilan na ito ang parehong bayan, ngunit hula lamang iyon. Wala nang iba pang sinasabi tungkol dito, at hindi ito ang Madmena ng Isaias 10:31 sa hilaga ng Jerusalem ni ang Madmena sa Moab."
    - "Inilagay ni Eusebio ang Madmanna sa Menois, isang nayon malapit sa Gaza, at pinananatili ng mapa ang Minieh, sa timog ng Gaza, sa mga kandidato nito. Ang unang pinili nito ay ang Khirbet Tatrit sa hilagang Negeb, sa tabi ng Khirbet Umm ed-Deimneh, na waring nag-iingat ng pangalan at ikalawang hula sa mapa. Ang lugar ay nasa hilagang-silangan ng Beer-seba, sa timog ng Israel; walang paghuhukay na nagkumpirma sa pagkakakilanlan."
  da:
    - "Madmanna var en by i Negev, Judas sydligste distrikt, opført i rækken »og Ziklag og Madmanna og Sansanna«. Krønikebøgernes slægtsregistre nævner den endnu en gang i Kalebs slægt: Maaka, Kalebs medhustru, »fødte Saaf, Fader til Madmanna«, en måde at sige, at en kalebitisk slægt grundlagde eller besad byen. På det tilsvarende sted i listen over Simeons byer står Bet-Markabot, »vognenes hus«, og nogle mener, at det er den samme by, men det er blot et gæt. Intet andet fortælles om den, og den er hverken Madmena i Esajas 10,31 nord for Jerusalem eller Madmen i Moab."
    - "Eusebius placerede Madmanna ved Menois, en landsby nær Gaza, og kortet beholder Minieh, syd for Gaza, blandt sine kandidater. Dets første valg er Khirbet Tatrit i det nordlige Negev, ved siden af Khirbet Umm ed-Deimneh, som synes at bevare navnet og er kortets andet gæt. Området ligger nordøst for Beersheba, i det sydlige Israel; ingen udgravning har bekræftet identifikationen."
  sr:
    - "Мадмана је био град у Негеву, најјужнијем округу Јуде, наведен у низу „и Сиклаг и Мадмана и Сансана“. Родослови у Дневницима помињу га још једном у породици Халевовој: Маха, Халевова иноча: „Роди и Сагафа оца Мадманцима“, што је начин да се каже да је халевовски род основао град или га држао. На одговарајућем месту у списку градова Симеуновог племена стоји Вет-Мархавот, „кућа кола“, и неки мисле да је то исти град, али то је само нагађање. О њему се више ништа не приповеда, и није то Мадмена из Исаије 10,31 северно од Јерусалима нити Мадмена у Моаву."
    - "Јевсевије је сместио Мадману у Менојс, село близу Газе, а мапа задржава Миниех, јужно од Газе, међу кандидатима. Њен први избор је Хирбет Татрит у северном Негеву, поред Хирбет Умм ед-Дејмне, која као да чува име и друга је претпоставка на мапи. Подручје лежи североисточно од Вирсавеје, у јужном Израелу; ниједно ископавање није потврдило идентификацију."
