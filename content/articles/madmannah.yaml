body:
  en:
    - "Madmannah was a town of the Negev, the southernmost district of Judah, listed in the run “And Ziklag, and Madmannah, and Sansannah”. The genealogies of Chronicles name it once more in the family of Caleb: Maachah, Caleb’s concubine, “bare also Shaaph the father of Madmannah”, a way of saying that a Calebite clan founded or held the town. In the corresponding place in the list of Simeon’s towns stands Beth-marcaboth, “house of chariots”, and some think it is the same town, but that is only a guess. Nothing else is told of it, and it is not the Madmenah of Isaiah 10:31 north of Jerusalem nor Madmen in Moab."
    - "Eusebius placed Madmannah at Menois, a village near Gaza, and the map keeps Minieh, south of Gaza, among its candidates. Its first choice, following Aharoni and others, is Khirbet Tatrit in the northern Negev, beside Khirbet Umm ed-Deimneh, which seems to preserve the name and is the second guess on the map. The area lies north-east of Beersheba, in southern Israel; no excavation has confirmed the identification."
  ru:
    - "Мадмана — город Негева, самого южного округа Иудеи, названный в ряду «Циклаг, Мадмана и Сансана». Родословия Паралипоменон упоминают её ещё раз в роду Халева: Мааха, наложница Халева, «родила Шаафа, отца Мадманны», то есть, по обычному пониманию, род Халевитов основал город или владел им. На соответствующем месте в перечне городов Симеона стоит Беф-Маркавоф, «дом колесниц», и некоторые считают это тем же городом, но это лишь догадка. Больше о ней ничего не рассказано, и это не Мадмена из 10-й главы Исаии к северу от Иерусалима и не Мадмена в Моаве."
    - "Евсевий помещал Мадману в Меноис, селение близ Газы, и карта держит среди догадок Минью к югу от Газы. Первым же, вслед за Ахарони и другими, она ставит Хирбет-Татрит на севере Негева, рядом с Хирбет-Умм-эд-Демине, которое, по-видимому, сохраняет имя и стоит на карте второй догадкой. Эта местность лежит к северо-востоку от Вирсавии, на юге Израиля; раскопками отождествление не подтверждено."
  uk:
    - "Мадманна була містом Негеву, найпівденнішого округу Юди, перелічена в низці «Циклаг, Мадмана, та Сансана». Родоводи Хронік називають її ще раз у роду Калеба: Маака, наложниця Калеба, «Вона ж породила й Шаафа, Мадманниного батька», що означає: калебівський рід заснував це місто або володів ним. У відповідному місці переліку міст Симеона стоїть Бет-Маркабот, «дім колісниць», і дехто думає, що це те саме місто, але це лише здогад. Більше нічого про нього не розповідається, і це не Мадмена з Ісаї 10:31 на північ від Єрусалима й не Мадмен у Моаві."
    - "Євсевій розміщував Мадманну в Меноїсі, селі поблизу Гази, а мапа тримає Мінію на південь від Гази серед кандидатів. Її перший вибір, слідом за Агароні й іншими, — Хірбет-Татріт у північному Негеві, поруч із Хірбет-Умм-ед-Деймне, що, схоже, зберігає назву й є другою здогадкою на мапі. Ця місцевість лежить на північний схід від Беер-Шеви, на півдні Ізраїлю; жодні розкопки не підтвердили ототожнення."
  es:
    - "Madmana era una ciudad del Néguev, el distrito más meridional de Judá, enumerada en la serie «Y Siclag, y Madmanna, Sansana». Las genealogías de Crónicas la nombran una vez más en la familia de Caleb: Maaca, concubina de Caleb, «Y también le parió á Saaph padre de Madmannah», modo de decir que un clan calebita fundó o poseyó la ciudad. En el lugar correspondiente de la lista de ciudades de Simeón figura Bet-marcabot, «casa de los carros», y algunos piensan que es la misma ciudad, pero es solo una conjetura. No se cuenta nada más de ella, y no es la Madmena de Isaías 10:31, al norte de Jerusalén, ni Madmena en Moab."
    - "Eusebio situó Madmana en Menois, una aldea cerca de Gaza, y el mapa mantiene Minieh, al sur de Gaza, entre sus candidatos. Su primera elección, siguiendo a Aharoni y otros, es Khirbet Tatrit, en el norte del Néguev, junto a Khirbet Umm ed-Deimneh, que parece conservar el nombre y es la segunda conjetura del mapa. La zona se halla al nordeste de Beerseba, en el sur de Israel; ninguna excavación ha confirmado la identificación."
  pt:
    - "Madmana era uma cidade do Neguebe, o distrito mais meridional de Judá, listada na sequência “Ziclague, Madmana, Sansana”. As genealogias das Crônicas a nomeiam mais uma vez na família de Calebe: Maaca, concubina de Calebe, “também deu à luz Saafe, pai de Madmana”, modo de dizer que um clã calebita fundou ou possuía a cidade. No lugar correspondente da lista das cidades de Simeão está Bete-Marcabote, “casa dos carros”, e alguns pensam que é a mesma cidade, mas isso é só um palpite. Nada mais se conta dela, e não é a Madmena de Isaías 10:31, ao norte de Jerusalém, nem Madmém, em Moabe."
    - "Eusébio situou Madmana em Menois, uma aldeia perto de Gaza, e o mapa mantém Minieh, ao sul de Gaza, entre seus candidatos. Sua primeira escolha, seguindo Aharoni e outros, é Khirbet Tatrit, no norte do Neguebe, junto a Khirbet Umm ed-Deimneh, que parece preservar o nome e é o segundo palpite do mapa. A área fica a nordeste de Berseba, no sul de Israel; nenhuma escavação confirmou a identificação."
  de:
    - "Madmanna war eine Stadt des Negev, des südlichsten Bezirks Judas, aufgeführt in der Reihe „Ziklag, Madmanna, Sansanna“. Die Genealogien der Chronik nennen sie noch einmal in der Familie Kalebs: Maacha, Kalebs Kebsweib, „gebar auch Saaph, den Vater Madmannas“, eine Weise zu sagen, dass eine Kalebiter-Sippe die Stadt gründete oder hielt. An der entsprechenden Stelle in der Liste der Städte Simeons steht Bet-Markabot, „Haus der Wagen“, und manche halten sie für dieselbe Stadt, doch das ist nur eine Vermutung. Sonst wird nichts von ihr erzählt, und sie ist weder das Madmena von Jesaja 10,31 nördlich von Jerusalem noch Madmen in Moab."
    - "Eusebius setzte Madmanna in Menois an, einem Dorf bei Gaza, und die Karte führt Minieh südlich von Gaza unter ihren Kandidaten. Ihre erste Wahl, Aharoni und anderen folgend, ist Khirbet Tatrit im nördlichen Negev, neben Khirbet Umm ed-Deimneh, das den Namen zu bewahren scheint und die zweite Vermutung auf der Karte ist. Das Gebiet liegt nordöstlich von Beerscheba im Süden Israels; keine Ausgrabung hat die Gleichsetzung bestätigt."
  fr:
    - "Madmanna était une ville du Négev, le district le plus méridional de Juda, citée dans la série « Tsiklag, Madmanna, Sansanna ». Les généalogies des Chroniques la nomment une fois encore dans la famille de Caleb : Maaca, concubine de Caleb, « enfanta encore Schaaph, père de Madmanna », manière de dire qu’un clan calébite fonda ou tint la ville. À l’endroit correspondant de la liste des villes de Siméon figure Beth-Marcaboth, « maison des chars », et certains pensent que c’est la même ville, mais ce n’est qu’une conjecture. On n’en dit rien d’autre, et ce n’est ni la Madména d’Ésaïe 10:31 au nord de Jérusalem ni Madmen en Moab."
    - "Eusèbe plaçait Madmanna à Ménois, village près de Gaza, et la carte garde Minieh, au sud de Gaza, parmi ses candidats. Son premier choix, à la suite d’Aharoni et d’autres, est Khirbet Tatrit, dans le nord du Négev, à côté de Khirbet Umm ed-Deimneh, qui semble conserver le nom et qui est la seconde hypothèse de la carte. La région se trouve au nord-est de Beer-Schéba, dans le sud d’Israël ; aucune fouille n’a confirmé l’identification."
