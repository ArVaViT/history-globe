# Overview article (ADR 0007). The valley of Sorek is the Nahal Sorek (Wadi es-Sarar); Jerome's Capharsorec and Khirbet Surik follow Masterman in the ISBE. Beth-shemesh and Timnah have their own articles.
id: valley-of-sorek
