body:
  en:
    - "The valley of Sorek, “valley of the choice vine”, is the Nahal Sorek, Arabic Wadi es-Sarar, one of the great valleys leading from the hills of Judah down to the coast. It rises in the hills south of Ramallah, gathers the wadis that drain the Jerusalem plateau, opens into a broad, fertile valley through the Shephelah past Zorah, Beth-shemesh and Timnah, and reaches the Mediterranean at Palmachim, south of Tel Aviv. The old railway from Jaffa to Jerusalem climbs along it."
    - "Samson's last story begins here: “he loved a woman in the valley of Sorek, whose name was Delilah.” The lords of the Philistines promised her silver to learn the secret of his strength. The valley ran from his home country around Zorah and Eshtaol into the Philistine lands of the plain, and Beth-shemesh, to which the ark later came back from the Philistines, lies in it. Jerome knew a village Capharsorec near Zorah; E. W. G. Masterman took it to be the ruin Khirbet Surik, about a kilometre west of Zorah, perhaps the site of an older town that gave the whole valley its name. The Nahal Sorek Nature Reserve now covers part of its course in the hills."
  ru:
    - "Долина Сорек, «долина отборной лозы», — это Нахаль-Сорек, по-арабски вади эс-Сарар, одна из больших долин, ведущих с гор Иудеи к побережью. Она начинается в горах к югу от Рамаллы, собирает вади, стекающие с Иерусалимского плато, раскрывается широкой плодородной долиной через Шефелу мимо Цоры, Вефсамиса и Фимны и достигает Средиземного моря у Пальмахима, к югу от Тель-Авива. Вдоль неё поднимается старая железная дорога из Яффы в Иерусалим."
    - "Здесь начинается последняя история Самсона: «полюбил он одну женщину, жившую на долине Сорек; имя ей Далида». Филистимские владельцы обещали ей серебро, чтобы она выведала тайну его силы. Долина вела из его родных мест у Цоры и Есфаола в филистимские земли равнины, и в ней лежит Вефсамис, куда позднее вернулся от филистимлян ковчег. Иероним знал селение Кафарсорек близ Цоры; Э. У. Г. Мастерман видел в нём развалины Хирбет-Сурик примерно в километре к западу от Цоры — возможно, место более древнего города, давшего имя всей долине. Часть её течения в горах ныне занимает заповедник Нахаль-Сорек."
  cs:
    - "Údolí Sórek, „údolí vybrané révy“, je Nachal Sorek, arabsky Wádí as-Sarár, jedno z velkých údolí vedoucích z judských hor dolů k pobřeží. Pramení v kopcích jižně od Rámalláhu, sbírá vádí odvodňující jeruzalémskou plošinu, otevírá se v široké úrodné údolí přes Šefelu kolem Corey, Bét-šemeše a Timny a dosahuje Středozemního moře u Palmachim, jižně od Tel Avivu. Podél něj stoupá stará železnice z Jaffy do Jeruzaléma."
    - "Samsonův poslední příběh začíná zde: „zamiloval ženu v údolí Sorek, jejíž jméno bylo Dalila.“ Pelištejská knížata jí slíbila stříbro, aby zjistila tajemství jeho síly. Údolí vedlo z jeho domovského kraje kolem Corey a Eštaolu do pelištejských zemí na rovině a leží v něm Bét-šemeš, kam se později vrátila archa od Pelištejců. Jeroným znal vesnici Kafarsorek poblíž Corey; E. W. G. Masterman ji pokládal za zříceninu Chirbet Súrík, asi kilometr západně od Corey, snad místo staršího města, které dalo jméno celému údolí. Přírodní rezervace Nachal Sorek dnes pokrývá část jeho toku v horách."
  uk:
    - "Долина Сорек, «долина добірної лози», — це Нахаль-Сорек, арабською Вади-ес-Сарар, одна з великих долин, що ведуть з юдейських гір до узбережжя. Вона починається в горах на південь від Рамалли, збирає вади, що дренують Єрусалимське плато, розкривається в широку родючу долину через Шефелу повз Цору, Бет-Шемеш і Тімну й виходить до Середземного моря в Пальмахімі, на південь від Тель-Авіва. Уздовж неї піднімається стара залізниця з Яффи до Єрусалима."
    - "Тут починається остання історія Самсона: «полюбив він на долинї Сорек вродливу женщину на імя Далила». Володарі филистимлян пообіцяли їй срібло, щоб дізнатися таємницю його сили. Долина йшла від його рідного краю навколо Цори та Ештаолу в филистимські землі рівнини, і в ній лежить Бет-Шемеш, куди ковчег пізніше повернувся від филистимлян. Єронім знав село Кафарсорек поблизу Цори; Е. В. Дж. Мастерман вважав його руїною Хірбет-Сурік, приблизно за кілометр на захід від Цори, можливо, місцем давнішого міста, яке дало назву всій долині. Заповідник Нахаль-Сорек нині охоплює частину її течії в горах."
  pl:
    - "Dolina Sorek, „dolina wyborowej winorośli”, to Nachal Sorek, arabskie Wadi as-Sarar, jedna z wielkich dolin prowadzących ze wzgórz Judy ku wybrzeżu. Wypływa we wzgórzach na południe od Ramallah, zbiera wadi odwadniające płaskowyż jerozolimski, otwiera się w szeroką, żyzną dolinę przez Szefelę obok Sory, Bet-Szemesz i Timny i dociera do Morza Śródziemnego w Palmachim, na południe od Tel Awiwu. Wzdłuż niej wspina się dawna kolej z Jafy do Jerozolimy."
    - "Tu zaczyna się ostatnia opowieść o Samsonie: „rozmiłował niewiasty w dolinie Sorek, której imię Dalila”. Władcy Filistynów obiecali jej srebro za poznanie tajemnicy jego siły. Dolina biegła z jego rodzinnych stron wokół Sory i Esztaol ku filistyńskim ziemiom równiny, a w niej leży Bet-Szemesz, do którego arka wróciła później od Filistynów. Hieronim znał wieś Kafarsorek koło Sory; E. W. G. Masterman uważał ją za ruinę Chirbet Surik, około kilometra na zachód od Sory, być może miejsce dawniejszego miasta, które dało nazwę całej dolinie. Rezerwat przyrody Nachal Sorek obejmuje dziś część jej biegu we wzgórzach."
  es:
    - "El valle de Sorec, «valle de la vid selecta», es el Nahal Sorek, en árabe Wadi es-Sarar, uno de los grandes valles que descienden de las colinas de Judá a la costa. Nace en las colinas al sur de Ramala, reúne los uadis que drenan la meseta de Jerusalén, se abre en un valle amplio y fértil a través de la Sefelá, pasando por Zora, Bet-semes y Timna, y llega al Mediterráneo en Palmachim, al sur de Tel Aviv. El antiguo ferrocarril de Jaffa a Jerusalén sube por él."
    - "La última historia de Sansón empieza aquí: «se enamoró de una mujer en el valle de Sorec, la cual se llamaba Dalila». Los príncipes de los filisteos le prometieron plata para saber el secreto de su fuerza. El valle iba desde su tierra natal, en torno a Zora y Estaol, hasta las tierras filisteas de la llanura, y en él se halla Bet-semes, adonde el arca volvió más tarde de los filisteos. Jerónimo conocía una aldea Capharsorec cerca de Zora; E. W. G. Masterman la tomó por la ruina Khirbet Surik, a un kilómetro al oeste de Zora, quizá el emplazamiento de una ciudad más antigua que dio nombre a todo el valle. La reserva natural de Nahal Sorek cubre hoy parte de su curso en las colinas."
  pt:
    - "O vale de Soreque, “vale da videira escolhida”, é o Nahal Sorek, em árabe Wadi es-Sarar, um dos grandes vales que descem das colinas de Judá até a costa. Nasce nas colinas ao sul de Ramallah, reúne os uádis que drenam o planalto de Jerusalém, abre-se num vale amplo e fértil pela Sefelá, passando por Zorá, Bete-Semes e Timna, e chega ao Mediterrâneo em Palmachim, ao sul de Tel Aviv. A antiga ferrovia de Jafa a Jerusalém sobe ao longo dele."
    - "A última história de Sansão começa aqui: “ele se apaixonou por uma mulher no vale de Soreque, cujo nome era Dalila.” Os governantes dos filisteus lhe prometeram prata para descobrir o segredo de sua força. O vale ia de sua terra natal, em torno de Zorá e Estaol, até as terras filisteias da planície, e Bete-Semes, para onde a arca voltou mais tarde, vinda dos filisteus, fica nele. Jerônimo conhecia uma aldeia Capharsorec perto de Zorá; E. W. G. Masterman a tomou pela ruína Khirbet Surik, cerca de um quilômetro a oeste de Zorá, talvez o sítio de uma cidade mais antiga que deu nome a todo o vale. A Reserva Natural de Nahal Sorek cobre hoje parte de seu curso nas colinas."
  de:
    - "Das Sorektal, „Tal der edlen Rebe“, ist der Nachal Sorek, arabisch Wadi es-Sarar, eines der großen Täler, die vom Bergland Judas hinab zur Küste führen. Es entspringt in den Bergen südlich von Ramallah, sammelt die Wadis, die das Plateau von Jerusalem entwässern, öffnet sich als breites, fruchtbares Tal durch die Schefela an Zora, Bet-Schemesch und Timna vorbei und erreicht das Mittelmeer bei Palmachim, südlich von Tel Aviv. Die alte Eisenbahn von Jaffa nach Jerusalem steigt an ihm hinauf."
    - "Simsons letzte Geschichte beginnt hier: „Darnach gewann er ein Weib lieb am Bach Sorek, die hieß Delila.“ Die Fürsten der Philister versprachen ihr Silber, damit sie das Geheimnis seiner Kraft erfahre. Das Tal verlief von seinem Heimatland um Zora und Eschtaol in die philistäischen Länder der Ebene, und Bet-Schemesch, wohin die Lade später von den Philistern zurückkam, liegt in ihm. Hieronymus kannte ein Dorf Capharsorec bei Zora; E. W. G. Masterman hielt es für die Ruine Chirbet Surik, etwa einen Kilometer westlich von Zora, vielleicht die Stätte einer älteren Stadt, die dem ganzen Tal den Namen gab. Das Naturreservat Nachal Sorek bedeckt heute einen Teil seines Laufs im Bergland."
  fr:
    - "La vallée de Sorek, « vallée de la vigne choisie », est le Nahal Sorek, en arabe ouadi es-Sarar, l’une des grandes vallées qui descendent des collines de Juda vers la côte. Elle naît dans les collines au sud de Ramallah, recueille les ouadis qui drainent le plateau de Jérusalem, s’ouvre en une large vallée fertile à travers la Shéphéla devant Tsorea, Beth-Schémesch et Thimna, et atteint la Méditerranée à Palmachim, au sud de Tel-Aviv. L’ancien chemin de fer de Jaffa à Jérusalem la remonte."
    - "La dernière histoire de Samson commence ici : « il aima une femme dans la vallée de Sorek. Elle se nommait Delila. » Les princes des Philistins lui promirent de l’argent pour apprendre le secret de sa force. La vallée allait de son pays natal autour de Tsorea et d’Eschthaol vers les terres philistines de la plaine, et Beth-Schémesch, où l’arche revint plus tard de chez les Philistins, s’y trouve. Jérôme connaissait un village Capharsorec près de Tsorea ; E. W. G. Masterman y vit la ruine de Khirbet Surik, à environ un kilomètre à l’ouest de Tsorea, peut-être le site d’une ville plus ancienne qui donna son nom à toute la vallée. La réserve naturelle du Nahal Sorek couvre aujourd’hui une partie de son cours dans les collines."
  it:
    - "La valle di Sorek, «valle della vite scelta», è il Nahal Sorek, in arabo Wadi es-Sarar, una delle grandi valli che scendono dalle colline di Giuda alla costa. Nasce nelle colline a sud di Ramallah, raccoglie i wadi che drenano l’altopiano di Gerusalemme, si apre in un’ampia e fertile vallata attraverso la Sefela passando per Zorea, Bet-Semes e Timna, e raggiunge il Mediterraneo a Palmachim, a sud di Tel Aviv. La vecchia ferrovia da Giaffa a Gerusalemme sale lungo di essa."
    - "L’ultima storia di Sansone comincia qui: «s’innamorò di una donna della valle di Sorek, che si chiamava Delila». I signori dei Filistei le promisero argento per conoscere il segreto della sua forza. La valle andava dalla sua terra d’origine intorno a Zorea ed Estaol alle terre filistee della pianura, e Bet-Semes, dove l’arca tornò poi dai Filistei, vi si trova. Girolamo conosceva un villaggio Caforsorec presso Zorea; E. W. G. Masterman lo identificò con la rovina Khirbet Surik, a circa un chilometro a ovest di Zorea, forse il sito di una città più antica che diede il nome a tutta la valle. La riserva naturale del Nahal Sorek copre ora parte del suo corso sulle colline."
  nl:
    - "De vallei van Sorek, ‘vallei van de edele wijnstok’, is de Nahal Sorek, Arabisch Wadi es-Sarar, een van de grote dalen die van het bergland van Juda naar de kust leiden. Zij ontspringt in de heuvels ten zuiden van Ramallah, verzamelt de wadi's die het plateau van Jeruzalem afwateren, opent zich tot een brede, vruchtbare vallei door de Sefela langs Zora, Beth-Semes en Timna, en bereikt de Middellandse Zee bij Palmachim, ten zuiden van Tel Aviv. De oude spoorlijn van Jaffa naar Jeruzalem klimt erlangs."
    - "Simsons laatste verhaal begint hier: hij kreeg een vrouw lief “aan de beek Sorek, welker naam was Delila” (de King James Version heeft “in the valley of Sorek”). De vorsten van de Filistijnen beloofden haar zilver om het geheim van zijn kracht te vernemen. De vallei liep van zijn thuisstreek rond Zora en Estaol naar de Filistijnse landen van de vlakte, en Beth-Semes, waarheen de ark later van de Filistijnen terugkwam, ligt erin. Hiëronymus kende een dorp Capharsorec bij Zora; E. W. G. Masterman hield het voor de ruïne Khirbet Surik, ongeveer een kilometer ten westen van Zora, misschien de plaats van een oudere stad die haar naam aan de hele vallei gaf. Het natuurreservaat Nahal Sorek beslaat nu een deel van haar loop in de heuvels."
  sv:
    - "Sorekdalen, ”dalen med den utvalda vinstocken”, är Nahal Sorek, på arabiska Wadi es-Sarar, en av de stora dalarna som leder från Judas berg ner till kusten. Den har sitt ursprung i bergen söder om Ramallah, samlar wadierna som dränerar Jerusalems platå, öppnar sig i en bred, bördig dal genom Shefela förbi Sora, Bet-Shemesh och Timna, och når Medelhavet vid Palmachim, söder om Tel Aviv. Den gamla järnvägen från Jaffa till Jerusalem stiger längs den."
    - "Simsons sista berättelse börjar här: ”Därefter fattade han kärlek till en kvinna som hette Delila, vid bäcken Sorek.” Filisteernas furstar lovade henne silver för att få veta hemligheten bakom hans styrka. Dalen löpte från hans hemtrakt kring Sora och Eshtaol in i filisteernas land på slätten, och Bet-Shemesh, dit arken senare kom tillbaka från filisteerna, ligger i den. Hieronymus kände en by Kafarsorek nära Sora; E. W. G. Masterman tog den för ruinen Khirbet Surik, omkring en kilometer väster om Sora, kanske platsen för en äldre stad som gav hela dalen dess namn. Naturreservatet Nahal Sorek täcker nu en del av dess lopp i bergen."
  nb:
    - "Sorek-dalen, «dalen med den utsøkte vinranke», er Nahal Sorek, arabisk Wadi es-Sarar, en av de store dalene som fører fra Judas åser ned til kysten. Den har sitt utspring i åsene sør for Ramallah, samler wadiene som drenerer Jerusalem-platået, åpner seg til en bred, fruktbar dal gjennom Sjefela forbi Sora, Bet-Sjemesj og Timna, og når Middelhavet ved Palmachim, sør for Tel Aviv. Den gamle jernbanen fra Jaffa til Jerusalem stiger langs den."
    - "Samsons siste historie begynner her: «Siden fattet han kjærlighet til en kvinne i Sorek-dalen, som hette Dalila.» Filistrenes høvdinger lovte henne sølv for å få vite hemmeligheten bak styrken hans. Dalen løp fra hjemegnen hans rundt Sora og Esjtaol inn i filistrenes land på sletten, og Bet-Sjemesj, dit arken senere kom tilbake fra filistrene, ligger i den. Hieronymus kjente en landsby Capharsorec nær Sora; E. W. G. Masterman tok den for ruinen Khirbet Surik, omkring en kilometer vest for Sora, kanskje stedet for en eldre by som ga hele dalen navnet. Naturreservatet Nahal Sorek dekker nå en del av løpet i åsene."
  tl:
    - "Ang libis ng Sorec, “libis ng piling ubas”, ay ang Nahal Sorek, Wadi es-Sarar sa Arabe, isa sa mga dakilang libis na patungo mula sa mga burol ng Juda pababa sa baybayin. Nagmumula ito sa mga burol sa timog ng Ramallah, tinitipon ang mga wadi na nag-aalis ng tubig sa talampas ng Jerusalem, bumubukas sa malawak at mayamang libis sa Sephela sa tabi ng Sora, Beth-semes at Timna, at umaabot sa Mediteraneo sa Palmachim, timog ng Tel Aviv. Umaakyat sa tabi nito ang lumang daang-bakal mula Jaffa patungong Jerusalem."
    - "Dito nagsisimula ang huling kuwento ni Samson: “siya'y suminta sa isang babae sa libis ng Sorec, na ang pangala'y Dalila.” Nangako ang mga pinuno ng mga Filisteo ng pilak sa kaniya upang malaman ang lihim ng kaniyang lakas. Tumatakbo ang libis mula sa kaniyang sariling lupain sa paligid ng Sora at Estaol hanggang sa lupain ng mga Filisteo sa kapatagan, at nasa loob nito ang Beth-semes, kung saan kalaunang bumalik ang kaban mula sa mga Filisteo. Kilala ni Jeronimo ang isang nayong Capharsorec malapit sa Sora; itinuring ito ni E. W. G. Masterman na guhong Khirbet Surik, mga isang kilometro sa kanluran ng Sora, marahil pook ng mas lumang bayan na nagbigay ng pangalan sa buong libis. Sakop na ngayon ng Reserbang Likas ng Nahal Sorek ang bahagi ng daloy nito sa mga burol."
  da:
    - "Sorekdalen, »dalen med den udsøgte vinstok«, er Nahal Sorek, arabisk Wadi es-Sarar, en af de store dale, der fører fra Judas bjerge ned til kysten. Den udspringer i bjergene syd for Ramallah, samler de wadier, der dræner Jerusalem-højsletten, åbner sig i en bred, frugtbar dal gennem Sjefela forbi Zora, Bet-Sjemesj og Timna og når Middelhavet ved Palmachim, syd for Tel Aviv. Den gamle jernbane fra Jaffa til Jerusalem stiger langs den."
    - "Samsons sidste historie begynder her: han »fik Kærlighed til en Kvinde ved Bækken Sorek, og hendes Navn var Dalila«. Filistrenes fyrster lovede hende sølv for at udforske hemmeligheden bag hans styrke. Dalen løb fra hans hjemegn omkring Zora og Esjtaol ind i filistrenes sletteland, og Bet-Sjemesj, hvortil arken senere kom tilbage fra filistrene, ligger i den. Hieronymus kendte en landsby Capharsorec nær Zora; E. W. G. Masterman tog den for ruinen Khirbet Surik, omkring en kilometer vest for Zora, måske stedet for en ældre by, der gav hele dalen dens navn. Naturreservatet Nahal Sorek dækker nu en del af dens løb i bjergene."
  sr:
    - "Долина Сорик, „долина племените лозе“, јесте Нахал Сорек, арапски Вади ес Сарар, једна од великих долина које воде из брда Јуде доле на обалу. Извире у брдима јужно од Рамале, прикупља вади који одводњавају јерусалимску висораван, отвара се у широку, плодну долину кроз Сефелу поред Сараје, Вет-Семеса и Тамне, и стиже до Средоземног мора код Палмахима, јужно од Тел Авива. Стара железница од Јафе до Јерусалима пење се дуж ње."
    - "Самсонова последња прича почиње овде: „замилова девојку на потоку Сорику, којој беше име Далида.“ Господари филистејски обећали су јој сребро да сазна тајну његове снаге. Долина је ишла од његовог завичаја око Сараје и Естаола у филистејске земље на равници, а Вет-Семес, у који се ковчег касније вратио од Филистеја, лежи у њој. Јероним је знао село Кафарсорек близу Сараје; Е. В. Г. Мастерман сматрао је да је то рушевина Хирбет Сурик, око километар западно од Сараје, можда место старијег града који је дао име целој долини. Резерват природе Нахал Сорек сада покрива део њеног тока у брдима."
  hu:
    - "A Szórek-völgy, „a nemes szőlő völgye”, a Nahal Szórek, arabul Vádi esz-Szarár, Júda hegyeiből a tengerpartra vezető nagy völgyek egyike. A Rámalláhtól délre fekvő hegyekben ered, összegyűjti a jeruzsálemi fennsíkot lecsapoló vádikat, széles, termékeny völggyé nyílik a Sefélán át Cora, Bét-Semes és Timna mellett, és Palmahimnál éri el a Földközi-tengert, Tel Avivtól délre. A régi Jaffa–Jeruzsálem vasút e völgy mentén emelkedik."
    - "Sámson utolsó története itt kezdődik: „megszeretett egy asszonyt a Sórek völgyében, a kinek neve Delila volt.” A filiszteusok fejedelmei ezüstöt ígértek neki, hogy megtudja erejének titkát. A völgy a Cora és Estaól körüli szülőföldjétől a síkság filiszteus vidékeire futott, és Bét-Semes, ahová a láda később visszatért a filiszteusoktól, benne fekszik. Jeromos ismert egy Kaphar-Szórek nevű falut Cora közelében; E. W. G. Masterman a Khirbet Szúrikkal azonosította, Coratól mintegy egy kilométerre nyugatra, talán egy régebbi város helyével, amely az egész völgynek nevet adott. A Nahal Szórek természetvédelmi terület ma lefutásának egy részét borítja a hegyekben."
  fi:
    - "Sorekin laakso, ”jalon köynnöksen laakso”, on Nahal Sorek, arabiaksi Wadi es-Sarar, yksi suurista Juudan vuorilta rannikolle johtavista laaksoista. Se saa alkunsa Ramallahista etelään olevilta kukkuloilta, kerää Jerusalemin ylängön vedet, aukeaa leveäksi, hedelmälliseksi laaksoksi Sefelan halki Soran, Bet-Semeksen ja Timnan ohi ja saavuttaa Välimeren Palmachimissa, Tel Avivista etelään. Vanha Jaffan–Jerusalemin rautatie nousee sitä pitkin."
    - "Simsonin viimeinen kertomus alkaa täältä: ”Sen jälkeen hän rakastui erääseen Soorekin laaksossa asuvaan naiseen, jonka nimi oli Delila.” Filistealaisten ruhtinaat lupasivat tälle hopeaa saadakseen selville hänen voimansa salaisuuden. Laakso kulki hänen kotiseudultaan Soran ja Estaolin ympäriltä tasangon filistealaisalueille, ja Bet-Semes, jonne arkki myöhemmin palasi filistealaisilta, sijaitsee siinä. Hieronymus tunsi kylän nimeltä Capharsorec Soran lähellä; E. W. G. Masterman piti sitä Khirbet Surik -raunioina, noin kilometrin Soran länsipuolella, ehkä vanhemman kaupungin paikkana, joka antoi koko laaksolle nimensä. Nahal Sorekin luonnonpuisto kattaa nykyisin osan sen kulusta kukkuloilla."
  vi:
    - "Trũng Sô-rếch, “trũng nho quý”, là Nahal Sorek, tiếng Ả Rập Wadi es-Sarar, một trong các thung lũng lớn dẫn từ các đồi Giu-đa xuống bờ biển. Nó bắt nguồn trong các đồi phía nam Ramallah, gom các wadi thoát nước cao nguyên Giê-ru-sa-lem, mở ra thành thung lũng rộng màu mỡ qua Sê-phê-la, ngang Xô-rê-a, Bết-Sê-mết và Thim-na, và đến Địa Trung Hải tại Palmachim, phía nam Tel Aviv. Tuyến đường sắt cũ từ Jaffa đến Giê-ru-sa-lem leo dọc theo nó."
    - "Câu chuyện cuối cùng của Sam-sôn bắt đầu ở đây: “người yêu mến một người nữ trong trũng Sô-réc, tên là Đa-li-la.” Các lãnh chúa của dân Phi-li-tin hứa bạc cho nàng để biết bí quyết sức mạnh của ông. Thung lũng chạy từ quê hương ông quanh Xô-rê-a và Ê-ta-ôn vào đất Phi-li-tin của đồng bằng, và Bết-Sê-mết, nơi hòm giao ước về sau trở lại từ dân Phi-li-tin, nằm trong đó. Hieronymus biết một làng Capharsorec gần Xô-rê-a; E. W. G. Masterman coi đó là tàn tích Khirbet Surik, cách Xô-rê-a khoảng một kilômét về phía tây, có lẽ là địa điểm của một thị trấn xưa hơn đã đặt tên cho cả thung lũng. Khu bảo tồn thiên nhiên Nahal Sorek nay bao phủ một phần dòng chảy của nó trong các đồi."
  ro:
    - "Valea Sorec, „valea viței alese”, este Nahal Sorek, în arabă Wadi es-Sarar, una dintre marile văi care duc de la dealurile lui Iuda în jos spre coastă. Izvorăște în dealurile de la sud de Ramallah, adună uadiurile care drenează podișul Ierusalimului, se deschide într-o vale largă și fertilă prin Șefela, pe lângă Țorea, Bet-Șemeș și Timna, și ajunge la Mediterana la Palmachim, la sud de Tel Aviv. Vechea cale ferată de la Iafo la Ierusalim urcă de-a lungul ei."
    - "Ultima poveste a lui Samson începe aici: a iubit o femeie în valea Sorec, al cărei nume era Dalila. Domnii filistenilor i-au făgăduit argint ca să afle secretul puterii lui. Valea mergea din ținutul lui de obârșie din jurul Țoreei și al Eștaolului spre ținuturile filistene ale câmpiei, iar Bet-Șemeș, unde chivotul s-a întors mai târziu de la filisteni, se află în ea. Ieronim cunoștea un sat Capharsorec lângă Țorea; E. W. G. Masterman l-a socotit ruina Khirbet Surik, la circa un kilometru vest de Țorea, poate locul unui oraș mai vechi care a dat numele întregii văi. Rezervația naturală Nahal Sorek acoperă acum o parte din cursul ei în dealuri."
  bg:
    - "Долината Сорек, „долината на избраната лоза“, е Нахал Сорек, на арабски Уади ес-Сарар — една от големите долини, които водят от Юдейските хълмове надолу към брега. Тя започва в хълмовете южно от Рамала, събира уадитата, които отводняват Йерусалимското плато, разширява се в широка плодородна долина през Шефела покрай Цора, Ветсамис и Тимна и стига до Средиземно море при Палмахим, южно от Тел Авив. Старата железница от Яфа за Йерусалим се изкачва по нея."
    - "Последната история на Самсон започва тук: „залюби една жена в дола Сорик, името ѝ Далида.“ Филистимските владетели ѝ обещали сребро, за да узнае тайната на силата му. Долината минавала от родния му край около Цора и Ещаол към филистимските земи в равнината, а в нея лежи Ветсамис, където по-късно ковчегът се върнал от филистимците. Йероним познавал село Кафарсорек близо до Цора; Е. У. Г. Мастерман го смятал за развалината Хирбет Сурик, на около километър западно от Цора, може би мястото на по-стар град, дал името на цялата долина. Природният резерват „Нахал Сорек“ днес обхваща част от течението ѝ в хълмовете."
