body:
  en:
    - "Debir, earlier called Kiriath-sepher, was a town in the hills of Judah south-west of Hebron, and its site has long been debated. W. F. Albright proposed Tell Beit Mirsim in 1924 and excavated it in 1926–1932; it stands where the hills meet the Shephelah. Kurt Galling suggested Khirbet Rabud, about 13 km south-west of Hebron, in 1954; in 1968, while surveying the hills south of Hebron, Moshe Kochavi of Tel Aviv University argued for it and dug there. Most scholars now prefer Khirbet Rabud, which lies in the hill country where the Book of Joshua lists Debir; the point on the map marks it."
    - "Khirbet Rabud was settled in the Bronze Age and in the Iron Age became a town of Judah. In the ninth century BC it was surrounded by a thick wall enclosing about 5 ha. The town was destroyed in the late eighth century, probably in Sennacherib's campaign of 701 BC; it was rebuilt in the seventh century and spread beyond its walls, and it was destroyed again when the Babylonians conquered Judah in 587 or 586 BC. Tell Beit Mirsim, for its part, gave archaeology a long and carefully recorded sequence of pottery from the Bronze and Iron Ages."
    - 'Joshua took Debir and its king, and "cut off the Anakims from the mountains, from Hebron, from Debir". The Books of Joshua and Judges also tell how Caleb promised his daughter Achsah to the man who took Kiriath-sepher; Othniel the son of Kenaz took it, and Achsah asked her father for springs of water: "he gave her the upper springs, and the nether springs". Debir is listed among the towns in the mountains of Judah, and it was given with its suburbs to the children of Aaron.'
    - "In the early fourth century AD Eusebius gives Dabeir only its biblical description, a town of Judah called the city of letters, taken by Othniel and given to the priests, and does not say where it lay."
  ru:
    - "Давир, прежде называвшийся Кириаф-Сефер, был городом в горах Иудеи к юго-западу от Хеврона; где он стоял, давно спорят. У. Ф. Олбрайт в 1924 г. предложил Телль-Бейт-Мирсим и раскапывал его в 1926–1932 гг.; этот холм стоит там, где горы переходят в Шефелу. Курт Галлинг в 1954 г. предложил Хирбет-Рабуд, примерно в 13 км к юго-западу от Хеврона; в 1968 г., обследуя горы к югу от Хеврона, Моше Кохави из Тель-Авивского университета обосновал это отождествление и копал там. Сейчас большинство исследователей предпочитает Хирбет-Рабуд, лежащий в горной стране, где книга Иисуса Навина называет Давир; его и отмечает точка на карте."
    - "Хирбет-Рабуд был заселён в бронзовом веке, а в железном веке стал городом Иудеи. В IX веке до н. э. его окружили толстой стеной, охватившей около 5 га. В конце VIII века город был разрушен, вероятно, в походе Сеннахирима 701 г. до н. э.; в VII веке его отстроили, и он разросся за пределы стен, а когда вавилоняне в 587 или 586 г. до н. э. завоевали Иудею, он был разрушен снова. Телль-Бейт-Мирсим, со своей стороны, дал археологии длинную и тщательно записанную последовательность керамики бронзового и железного веков."
    - "Иисус взял Давир и его царя и «поразил всех Енакимов на горе, в Хевроне, в Давире». Книги Иисуса Навина и Судей рассказывают также, как Халев обещал дочь свою Ахсу тому, кто возьмёт Кириаф-Сефер; его взял Гофониил, сын Кеназа, и Ахса попросила у отца источники вод: «и дал он ей источники верхние и источники нижние». Давир назван среди городов на горах Иуды и с предместьями отдан сынам Аарона."
    - "В начале IV века н. э. Евсевий приводит о Давире только библейские сведения — город Иуды, называемый городом письмён, взятый Гофониилом и отданный священникам, — и не говорит, где он лежал."
  uk:
    - "Девір, раніше званий Кіріят-Сефер, був містом у горах Юди на південний захід від Хеврона, і його місце давно є предметом суперечки. В. Ф. Олбрайт запропонував Телль-Бейт-Мірсім у 1924 р. і розкопував його в 1926–1932 рр.; він стоїть там, де гори сходяться з Шефелою. Курт Галлінг у 1954 р. запропонував Хірбет-Рабуд, приблизно за 13 км на південний захід від Хеврона; у 1968 р., обстежуючи гори на південь від Хеврона, Моше Кохаві з Тель-Авівського університету обґрунтував це ототожнення і копав там. Більшість учених нині віддає перевагу Хірбет-Рабуду, який лежить у гірській країні, де Книга Ісуса Навина перелічує Девір; точка на мапі позначає його."
    - "Хірбет-Рабуд був заселений у добу бронзи, а в залізну добу став містом Юди. У IX ст. до н. е. його було оточено товстим муром, що охоплював близько 5 га. Місто було зруйноване наприкінці VIII ст., імовірно під час походу Сінаххеріба 701 р. до н. е.; його відбудували у VII ст., і воно розрослося за межі мурів, і знову було зруйноване, коли вавилоняни завоювали Юду в 587 або 586 р. до н. е. Телль-Бейт-Мірсім зі свого боку дав археології довгу й ретельно зафіксовану послідовність кераміки бронзової та залізної доби."
    - "Ісус Навин узяв Девір і його царя та «повибивав Енакіїв по горах у Гебронї, Давирі». Книги Ісуса Навина й Суддів також розповідають, як Калеб пообіцяв свою дочку Ахсу тому, хто візьме Кіріят-Сефер; Отніїл, син Кеназа, взяв його, і Ахса попросила в батька джерела води: «дав їй Калеб криничані протоки верхові й криничані протоки низові». Девір записано серед міст у горах Юди, і його було віддано з передмістями синам Аарона."
    - "На початку IV ст. н. е. Євсевій дає Дабейру лише біблійний опис, місто Юди, зване містом письмен, узяте Отніїлом і віддане священникам, і не каже, де воно лежало."
  es:
    - "Debir, llamada antes Quiriat-sefer, era una ciudad en las colinas de Judá al sudoeste de Hebrón, y su emplazamiento se debate desde hace mucho. W. F. Albright propuso Tell Beit Mirsim en 1924 y la excavó en 1926–1932; se alza donde las colinas se encuentran con la Sefelá. Kurt Galling propuso Khirbet Rabud, a unos 13 km al sudoeste de Hebrón, en 1954; en 1968, al prospectar las colinas al sur de Hebrón, Moshe Kochavi, de la Universidad de Tel Aviv, la defendió y excavó allí. La mayoría de los estudiosos prefieren ahora Khirbet Rabud, que se halla en la región montañosa donde el libro de Josué sitúa Debir; el punto del mapa la señala."
    - "Khirbet Rabud estuvo poblada en la Edad del Bronce y en la Edad del Hierro se convirtió en una ciudad de Judá. En el siglo IX a. C. fue rodeada por una gruesa muralla que encerraba unas 5 ha. La ciudad fue destruida a finales del siglo VIII, probablemente en la campaña de Senaquerib del 701 a. C.; se reconstruyó en el siglo VII y se extendió más allá de sus muros, y fue destruida de nuevo cuando los babilonios conquistaron Judá en el 587 o 586 a. C. Tell Beit Mirsim, por su parte, dio a la arqueología una larga y cuidadosamente registrada secuencia de cerámica de las Edades del Bronce y del Hierro."
    - "Josué tomó Debir y a su rey, y «destruyó los Anaceos de los montes, de Hebrón, de Debir». Los libros de Josué y de Jueces cuentan también cómo Caleb prometió a su hija Acsa al hombre que tomara Quiriat-sefer; la tomó Otoniel, hijo de Cenez, y Acsa pidió a su padre fuentes de aguas: «El entonces le dió las fuentes de arriba, y las de abajo». Debir figura entre las ciudades de la montaña de Judá, y fue dada con sus ejidos a los hijos de Aarón."
    - "A comienzos del siglo IV d. C. Eusebio da de Dabeir solo su descripción bíblica, una ciudad de Judá llamada la ciudad de las letras, tomada por Otoniel y dada a los sacerdotes, y no dice dónde se hallaba."
  pt:
    - "Debir, antes chamada Quiriate-Sefer, era uma cidade nas montanhas de Judá, a sudoeste de Hebrom, e seu local há muito é debatido. W. F. Albright propôs Tell Beit Mirsim em 1924 e a escavou em 1926–1932; ela fica onde as montanhas encontram a Sefelá. Kurt Galling sugeriu Khirbet Rabud, a cerca de 13 km a sudoeste de Hebrom, em 1954; em 1968, ao fazer um levantamento nas montanhas ao sul de Hebrom, Moshe Kochavi, da Universidade de Tel Aviv, defendeu-a e ali escavou. A maioria dos estudiosos prefere agora Khirbet Rabud, que fica na região montanhosa onde o livro de Josué lista Debir; o ponto no mapa a assinala."
    - "Khirbet Rabud foi habitada na Idade do Bronze e, na Idade do Ferro, tornou-se uma cidade de Judá. No século IX a.C., foi cercada por um espesso muro que encerrava cerca de 5 ha. A cidade foi destruída no fim do século VIII, provavelmente na campanha de Senaqueribe de 701 a.C.; foi reconstruída no século VII e se estendeu além de seus muros, e foi destruída de novo quando os babilônios conquistaram Judá em 587 ou 586 a.C. Tell Beit Mirsim, por sua vez, deu à arqueologia uma longa e cuidadosamente registrada sequência de cerâmica das Idades do Bronze e do Ferro."
    - "Josué tomou Debir e seu rei, e “eliminou os anaquins da região montanhosa, de Hebrom, de Debir”. Os livros de Josué e de Juízes contam também como Calebe prometeu sua filha Acsa ao homem que tomasse Quiriate-Sefer; Otniel, filho de Quenaz, a tomou, e Acsa pediu a seu pai fontes de água: “Então ele lhe deu as fontes superiores e as fontes inferiores”. Debir está listada entre as cidades das montanhas de Judá, e foi dada, com suas pastagens, aos filhos de Arão."
    - "No início do século IV d.C., Eusébio dá a Dabeir apenas sua descrição bíblica, uma cidade de Judá chamada cidade das letras, tomada por Otniel e dada aos sacerdotes, e não diz onde ficava."
  de:
    - "Debir, früher Kirjat-Sefer genannt, war eine Stadt im Bergland von Juda südwestlich von Hebron, und seine Lage ist seit langem umstritten. W. F. Albright schlug 1924 Tell Beit Mirsim vor und grub es 1926–1932 aus; es liegt dort, wo das Bergland an die Schefela stößt. Kurt Galling schlug 1954 Khirbet Rabud vor, etwa 13 km südwestlich von Hebron; 1968 trat Moshe Kochavi von der Universität Tel Aviv bei einer Geländeuntersuchung der Berge südlich von Hebron dafür ein und grub dort. Die meisten Gelehrten bevorzugen heute Khirbet Rabud, das in dem Bergland liegt, in dem das Buch Josua Debir aufführt; der Punkt auf der Karte markiert es."
    - "Khirbet Rabud war in der Bronzezeit besiedelt und wurde in der Eisenzeit eine Stadt Judas. Im 9. Jahrhundert v. Chr. wurde sie von einer dicken Mauer umgeben, die etwa 5 ha einschloss. Die Stadt wurde im späten 8. Jahrhundert zerstört, wahrscheinlich in Sanheribs Feldzug von 701 v. Chr.; im 7. Jahrhundert wurde sie wiederaufgebaut und dehnte sich über ihre Mauern hinaus aus, und sie wurde erneut zerstört, als die Babylonier 587 oder 586 v. Chr. Juda eroberten. Tell Beit Mirsim seinerseits schenkte der Archäologie eine lange und sorgfältig aufgezeichnete Abfolge von Keramik der Bronze- und Eisenzeit."
    - "Josua nahm Debir und seinen König, und er „rottete aus die Enakiter von dem Gebirge, von Hebron, von Debir“. Die Bücher Josua und Richter erzählen auch, wie Kaleb seine Tochter Achsa dem Mann versprach, der Kirjat-Sefer einnähme; Otniël, der Sohn des Kenas, nahm es, und Achsa bat ihren Vater um Wasserquellen: „Da gab er ihr die Quellen von oben und unten.“ Debir wird unter den Städten im Gebirge Juda aufgeführt und wurde mit seinen Vorstädten den Kindern Aarons gegeben."
    - "Anfang des 4. Jahrhunderts n. Chr. gibt Eusebius für Dabeir nur seine biblische Beschreibung, eine Stadt Judas, die „Stadt der Buchstaben“ genannt, von Otniël eingenommen und den Priestern gegeben, und sagt nicht, wo sie lag."
  fr:
    - "Debir, appelée plus anciennement Kirjath-Sépher, était une ville des montagnes de Juda au sud-ouest d’Hébron, dont l’emplacement est débattu depuis longtemps. W. F. Albright proposa Tell Beit Mirsim en 1924 et la fouilla en 1926–1932 ; elle se dresse là où les collines rejoignent la Shéphéla. Kurt Galling suggéra Khirbet Rabud, à environ 13 km au sud-ouest d’Hébron, en 1954 ; en 1968, en prospectant les collines au sud d’Hébron, Moshe Kochavi, de l’Université de Tel-Aviv, défendit ce site et y fouilla. La plupart des spécialistes préfèrent aujourd’hui Khirbet Rabud, qui se trouve dans la région montagneuse où le livre de Josué situe Debir ; le point de la carte la marque."
    - "Khirbet Rabud fut occupée à l’âge du Bronze et devint, à l’âge du Fer, une ville de Juda. Au IXe siècle av. J.-C., elle fut entourée d’un épais rempart enfermant environ 5 ha. La ville fut détruite à la fin du VIIIe siècle, probablement lors de la campagne de Sanchérib en 701 av. J.-C. ; elle fut reconstruite au VIIe siècle et déborda de ses murs, et fut détruite de nouveau lorsque les Babyloniens conquirent Juda en 587 ou 586 av. J.-C. Tell Beit Mirsim, de son côté, a donné à l’archéologie une longue séquence, soigneusement consignée, de poteries des âges du Bronze et du Fer."
    - "Josué prit Debir et son roi, et « extermina les Anakim de la montagne d’Hébron, de Debir ». Les livres de Josué et des Juges racontent aussi comment Caleb promit sa fille Acsa à l’homme qui prendrait Kirjath-Sépher ; Othniel, fils de Kenaz, la prit, et Acsa demanda à son père des sources d’eau : « il lui donna les sources supérieures et les sources inférieures ». Debir figure parmi les villes de la montagne de Juda, et elle fut donnée avec sa banlieue aux fils d’Aaron."
    - "Au début du IVe siècle apr. J.-C., Eusèbe ne donne pour Dabeir que sa description biblique, une ville de Juda appelée la ville des lettres, prise par Othniel et donnée aux prêtres, et ne dit pas où elle se trouvait."
  it:
    - "Debir, prima detta Kiriat-Sefer, era una città sulle alture di Giuda a sud-ovest di Ebron, e il suo sito è da tempo dibattuto. W. F. Albright propose Tell Beit Mirsim nel 1924 e vi scavò nel 1926–1932; sorge dove le colline incontrano la Sefela. Kurt Galling suggerì Khirbet Rabud, a circa 13 km a sud-ovest di Ebron, nel 1954; nel 1968, durante una ricognizione delle colline a sud di Ebron, Moshe Kochavi dell’Università di Tel Aviv ne sostenne l’identificazione e vi scavò. La maggior parte degli studiosi oggi preferisce Khirbet Rabud, che si trova nella regione collinare dove il libro di Giosuè elenca Debir; il punto sulla mappa la indica."
    - "Khirbet Rabud fu abitata nell’età del Bronzo e nell’età del Ferro divenne una città di Giuda. Nel IX secolo a.C. fu circondata da uno spesso muro che racchiudeva circa 5 ha. La città fu distrutta alla fine dell’VIII secolo, probabilmente nella campagna di Sennacherib del 701 a.C.; fu ricostruita nel VII secolo e si estese oltre le mura, e fu distrutta di nuovo quando i Babilonesi conquistarono Giuda nel 587 o 586 a.C. Tell Beit Mirsim, dal canto suo, diede all’archeologia una lunga e accuratamente documentata sequenza di ceramiche delle età del Bronzo e del Ferro."
    - "Giosuè prese Debir e il suo re e «sterminò gli Anakiti della contrada montuosa, di Hebron, di Debir». I libri di Giosuè e dei Giudici raccontano anche come Caleb promise la figlia Acsa a chi avesse preso Kiriat-Sefer; la prese Otniel, figlio di Kenaz, e Acsa chiese al padre delle sorgenti d’acqua: «Ed egli le donò le sorgenti superiori e le sorgenti sottostanti». Debir è elencata fra le città dei monti di Giuda, e fu data con i suoi pascoli ai figli di Aronne."
    - "All’inizio del IV secolo d.C. Eusebio dà di Dabeir solo la descrizione biblica, una città di Giuda detta città delle lettere, presa da Otniel e data ai sacerdoti, e non dice dove sorgesse."
  pl:
    - "Debir, wcześniej zwane Kiriat-Sefer, było miastem w górach Judy na południowy zachód od Hebronu, a jego położenie od dawna jest dyskutowane. W. F. Albright zaproponował Tell Bajt Mirsim w 1924 r. i prowadził tam wykopaliska w latach 1926–1932; leży ono tam, gdzie góry stykają się z Szefelą. Kurt Galling zaproponował Chirbet Rabud, około 13 km na południowy zachód od Hebronu, w 1954 r.; w 1968 r., badając wzgórza na południe od Hebronu, Moshe Kochavi z Uniwersytetu w Tel Awiwie opowiedział się za nim i tam kopał. Większość uczonych woli dziś Chirbet Rabud, które leży w górskim kraju, gdzie Księga Jozuego umieszcza Debir; punkt na mapie je oznacza."
    - "Chirbet Rabud zasiedlono w epoce brązu, a w epoce żelaza stało się miastem Judy. W IX w. p.n.e. otoczył je gruby mur obejmujący około 5 ha. Miasto zniszczono pod koniec VIII w., prawdopodobnie w wyprawie Sennacheryba w 701 r. p.n.e.; odbudowano je w VII w. i rozrosło się poza mury, a zniszczono je ponownie, gdy Babilończycy podbili Judę w 587 lub 586 r. p.n.e. Tell Bajt Mirsim z kolei dał archeologii długą i starannie zapisaną sekwencję ceramiki z epoki brązu i żelaza."
    - "Jozue zdobył Debir i jego króla i „wybił syny Enakowe z gór, z Hebronu, z Dabiru”. Księgi Jozuego i Sędziów opowiadają też, jak Kaleb obiecał swą córkę Aksę temu, kto zdobędzie Kiriat-Sefer; zdobył je Otniel, syn Kenaza, a Aksa poprosiła ojca o źródła wód: „I dał jej źródła wyższe, i źródła dolne”. Debir jest wymienione wśród miast w górach Judy i zostało dane wraz z przedmieściami synom Aarona."
    - "Na początku IV w. n.e. Euzebiusz podaje o Dabeir tylko opis biblijny, miasto Judy zwane miastem liter, zdobyte przez Otniela i dane kapłanom, i nie mówi, gdzie leżało."
  nl:
    - "Debir, eerder Kirjat-Sefer genoemd, was een stad in het bergland van Juda ten zuidwesten van Hebron, en de ligging is lang besproken. W.F. Albright stelde in 1924 Tell Beit Mirsim voor en groef het op in 1926–1932; het ligt waar het bergland overgaat in de Sefela. Kurt Galling stelde in 1954 Khirbet Rabud voor, zo'n 13 km ten zuidwesten van Hebron; in 1968 pleitte Moshe Kochavi van de Universiteit van Tel Aviv, bij een survey van de heuvels ten zuiden van Hebron, ervoor en groef daar. De meeste geleerden geven nu de voorkeur aan Khirbet Rabud, dat ligt in het bergland waar het boek Jozua Debir vermeldt; het punt op de kaart markeert die plaats."
    - "Khirbet Rabud was bewoond in de Bronstijd en werd in de IJzertijd een stad van Juda. In de negende eeuw v.Chr. werd zij omgeven door een dikke muur rond zo'n 5 ha. De stad werd in de late achtste eeuw verwoest, waarschijnlijk tijdens Sanheribs veldtocht van 701 v.Chr.; zij werd in de zevende eeuw herbouwd en breidde zich buiten haar muren uit, en werd opnieuw verwoest toen de Babyloniërs in 587 of 586 v.Chr. Juda veroverden. Tell Beit Mirsim gaf de archeologie van zijn kant een lange, zorgvuldig vastgelegde reeks aardewerk uit de Bronstijd en IJzertijd."
    - "Jozua nam Debir en zijn koning in, en “roeide de Enakieten uit, van het gebergte, van Hebron, van Debir”. Jozua en Richteren vertellen ook hoe Kaleb zijn dochter Achsa beloofde aan de man die Kirjat-Sefer innam; Otniël, de zoon van Kenaz, nam het in, en Achsa vroeg haar vader om waterbronnen: “geef mij ook waterwellingen. Toen gaf hij haar hoge waterwellingen en lage waterwellingen”. Debir staat onder de steden in het gebergte van Juda, en werd met zijn voorsteden aan de zonen van Aäron gegeven."
    - "In het begin van de 4e eeuw n.Chr. geeft Eusebius van Dabeir alleen de bijbelse beschrijving, een stad van Juda die de stad der letteren heette, door Otniël ingenomen en aan de priesters gegeven, en zegt niet waar zij lag."
  cs:
    - "Debír, dříve zvaný Kirjat-sefer, bylo město v judských horách jihozápadně od Hebronu a jeho poloha se dlouho debatuje. W. F. Albright navrhl roku 1924 Tell Beit Mirsim a vykopával jej v letech 1926–1932; stojí tam, kde se hory stýkají se Šefelou. Kurt Galling navrhl Khirbet Rabud, asi 13 km jihozápadně od Hebronu, roku 1954; roku 1968, při průzkumu hor jižně od Hebronu, se za něj postavil Moshe Kochavi z Telavivské univerzity a vykopával tam. Většina badatelů dnes dává přednost Khirbet Rabud, který leží v pahorkatině, kde Kniha Jozue Debír uvádí; bod na mapě jej označuje."
    - "Khirbet Rabud byl osídlen v době bronzové a v době železné se stal městem Judy. V 9. století př. n. l. byl obklopen silnou hradbou ohraničující asi 5 ha. Město bylo zničeno koncem 8. století, pravděpodobně při Senacheribově tažení roku 701 př. n. l.; v 7. století bylo přestavěno a rozšířilo se za své hradby a bylo znovu zničeno, když Babylóňané roku 587 nebo 586 př. n. l. dobyli Judsko. Tell Beit Mirsim zase dal archeologii dlouhou a pečlivě zaznamenanou řadu keramiky z doby bronzové a železné."
    - "Jozue dobyl Debír i jeho krále a „vyplénil Enaky z těch hor, totiž z Hebronu, z Dabir a z Anab“. Knihy Jozue a Soudců také vypravují, jak Káleb slíbil svou dceru Aksu muži, který dobude Kirjat-sefer; dobyl je Otniel, syn Kenazův, a Aksa požádala otce o prameny vody: „I dal jí studnice horní a studnice dolní“. Debír je uveden mezi městy v judských horách a byl dán s předměstími synům Áronovým."
    - "Na počátku 4. století n. l. podává Eusebios o Dabeiru jen biblický popis, město Judy zvané město písmen, dobyté Otnielem a dané kněžím, a neříká, kde leželo."
  sv:
    - "Devir, tidigare kallat Kirjat-Sefer, var en stad i Judas bergsland sydväst om Hebron, och dess läge har länge debatterats. W. F. Albright föreslog Tell Beit Mirsim 1924 och grävde ut det 1926–1932; det ligger där bergen möter Shefela. Kurt Galling föreslog Khirbet Rabud, omkring 13 km sydväst om Hebron, 1954; 1968, under en inventering av bergen söder om Hebron, hävdade Moshe Kochavi från Tel Aviv-universitetet detta och grävde där. De flesta forskare föredrar nu Khirbet Rabud, som ligger i det bergsland där Josuas bok förtecknar Devir; kartans punkt markerar det."
    - "Khirbet Rabud var bebott under bronsåldern och blev under järnåldern en stad i Juda. På 800-talet f.Kr. omgavs den av en tjock mur som omslöt omkring 5 ha. Staden förstördes i slutet av 700-talet, sannolikt under Sanheribs fälttåg 701 f.Kr.; den byggdes upp på nytt under 600-talet och bredde ut sig utanför sina murar, och förstördes åter när babylonierna erövrade Juda 587 eller 586 f.Kr. Tell Beit Mirsim å sin sida gav arkeologin en lång och noggrant dokumenterad följd av keramik från brons- och järnåldern."
    - "Josua intog Devir och dess kung och ”utrotade anakiterna i Bergsbygden, i Hebron, Debir och Anab”. Josuas bok och Domarboken berättar också hur Kalev lovade sin dotter Aksa åt den som intog Kirjat-Sefer; Otniel, Kenas son, intog det, och Aksa bad sin fader om vattenkällor: ”Då gav han henne Illiotkällorna och Tatiotkällorna”. Devir förtecknas bland städerna i Bergsbygden, och det gavs med sina utmarker åt Arons barn."
    - "I början av 300-talet e.Kr. ger Eusebios Dabeir bara dess bibliska beskrivning, en stad i Juda som kallas bokstaden, intagen av Otniel och given åt prästerna, och säger inte var den låg."
  nb:
    - "Debir, tidligere kalt Kirjat-Sefer, var en by i Judas fjellland sørvest for Hebron, og dens beliggenhet har lenge vært omdiskutert. W. F. Albright foreslo Tell Beit Mirsim i 1924 og gravde det ut i 1926–1932; det ligger der åsene møter Sjefela. Kurt Galling foreslo Khirbet Rabud, omtrent 13 km sørvest for Hebron, i 1954; i 1968, under en kartlegging av åsene sør for Hebron, argumenterte Moshe Kochavi ved Tel Aviv-universitetet for det og gravde der. De fleste forskere foretrekker nå Khirbet Rabud, som ligger i fjellandet der Josvas bok fører opp Debir; punktet på kartet markerer det."
    - "Khirbet Rabud var bosatt i bronsealderen og ble i jernalderen en by i Juda. På 800-tallet f.Kr. var den omgitt av en tykk mur som omsluttet omtrent 5 ha. Byen ble ødelagt sent på 700-tallet, trolig under Sankeribs felttog i 701 f.Kr.; den ble gjenoppbygd på 600-tallet og bredte seg utenfor murene, og den ble ødelagt igjen da babylonerne erobret Juda i 587 eller 586 f.Kr. Tell Beit Mirsim gav for sin del arkeologien en lang og omhyggelig registrert rekke av keramikk fra bronse- og jernalderen."
    - "Josva tok Debir og dens konge, og «utryddet anakittene i fjellbygdene, i Hebron, i Debir». Josvas bok og Dommerboken forteller også hvordan Kaleb lovet sin datter Aksa til den som tok Kirjat-Sefer; Otniel, Kenas' sønn, tok den, og Aksa ba sin far om vannkilder: «gav han henne de øvre og de nedre kilder». Debir er oppført blant byene i Judas fjellland, og den ble gitt med sine jorder til Arons barn."
    - "Tidlig på 300-tallet e.Kr. gir Eusebius Dabeir bare dens bibelske beskrivelse, en by i Juda kalt bokstavenes by, tatt av Otniel og gitt til prestene, og sier ikke hvor den lå."
  tl:
    - "Ang Debir, na dating tinatawag na Kiriath-sepher, ay isang bayan sa mga burol ng Juda sa timog-kanluran ng Hebron, at matagal nang pinagtatalunan ang pook nito. Iminungkahi ni W. F. Albright ang Tell Beit Mirsim noong 1924 at hinukay ito noong 1926–1932; nakatayo ito kung saan nagtatagpo ang mga burol at ang Sephela. Iminungkahi ni Kurt Galling ang Khirbet Rabud, mga 13 km sa timog-kanluran ng Hebron, noong 1954; noong 1968, habang sinusuri ang mga burol sa timog ng Hebron, ipinaglaban ito ni Moshe Kochavi ng Pamantasan ng Tel Aviv at humukay roon. Karamihan sa mga iskolar ngayon ay mas pinipili ang Khirbet Rabud, na nasa maburol na lupain kung saan inililista ng Aklat ni Josue ang Debir; minamarkahan ito ng punto sa mapa."
    - "Tinirhan ang Khirbet Rabud noong Panahon ng Tanso at naging bayan ng Juda noong Panahon ng Bakal. Noong ika-9 na siglo BK, napalibutan ito ng makapal na pader na pumapalibot sa mga 5 ha. Nawasak ang bayan noong huling ika-8 siglo, marahil sa kampanya ni Sennacherib noong 701 BK; muli itong itinayo noong ika-7 siglo at lumaganap sa labas ng mga pader nito, at muling nawasak nang sakupin ng mga Babilonio ang Juda noong 587 o 586 BK. Ang Tell Beit Mirsim naman ay nagbigay sa arkeolohiya ng mahaba at maingat na naitalang pagkakasunud-sunod ng palayok ng Panahon ng Tanso at Bakal."
    - "Kinuha ni Josue ang Debir at ang hari nito, at “nilipol ang mga Anaceo mula sa lupaing maburol, sa Hebron, sa Debir”. Isinasalaysay din ng Aklat ni Josue at ng Mga Hukom kung paano ipinangako ni Caleb ang kaniyang anak na si Acha sa lalaking kukuha ng Kiriath-sepher; kinuha ito ni Othoniel na anak ni Cenaz, at humingi si Acha sa kaniyang ama ng mga bukal ng tubig: “ibinigay niya sa kaniya ang mga bukal sa itaas at ang mga bukal sa ibaba”. Nakalista ang Debir sa mga bayan sa mga bundok ng Juda, at ibinigay ito, kasama ang mga nayon nito, sa mga anak ni Aaron."
    - "Noong maagang ika-4 na siglo AD, binibigyan lamang ni Eusebio ang Dabeir ng paglalarawan ng Bibliya, isang bayan ng Juda na tinatawag na lungsod ng mga sulat, kinuha ni Othoniel at ibinigay sa mga saserdote, at hindi sinasabi kung nasaan ito."
  da:
    - "Debir, tidligere kaldet Kirjat-Sefer, var en by i Judas bjerge sydvest for Hebron, og dens sted har længe været omdiskuteret. W. F. Albright foreslog Tell Beit Mirsim i 1924 og udgravede det i 1926–1932; det ligger, hvor bjergene møder Sjefela. Kurt Galling foreslog Khirbet Rabud, cirka 13 km sydvest for Hebron, i 1954; i 1968, mens han undersøgte bjergene syd for Hebron, argumenterede Moshe Kochavi fra Tel Aviv University for det og gravede dér. De fleste forskere foretrækker nu Khirbet Rabud, som ligger i det bjergland, hvor Josvas Bog opregner Debir; punktet på kortet markerer det."
    - "Khirbet Rabud var bosat i bronzealderen og blev i jernalderen en by i Juda. I 800-tallet f.Kr. blev den omgivet af en tyk mur, der omsluttede cirka 5 ha. Byen blev ødelagt sidst i 700-tallet, sandsynligvis under Sankeribs felttog i 701 f.Kr.; den blev genopbygget i 600-tallet og bredte sig ud over sine mure, og den blev ødelagt igen, da babylonierne erobrede Juda i 587 eller 586 f.Kr. Tell Beit Mirsim gav for sin del arkæologien en lang og omhyggeligt registreret rækkefølge af keramik fra bronze- og jernalderen."
    - "Josva indtog Debir og dens konge og »udryddede Anakiterne af Bjerget, af Hebron, af Debir«. Josvas Bog og Dommerbogen fortæller også, hvordan Kaleb lovede sin datter Aksa til den mand, der indtog Kirjat-Sefer; Otniel, Kenaz' søn, indtog den, og Aksa bad sin far om vandkilder: »gav han hende de øvre og nedre Vandkilder«. Debir opregnes blandt byerne i Judas bjerge, og den blev givet med sine græsgange til Arons børn."
    - "I begyndelsen af 300-tallet e.Kr. giver Eusebios Dabeir kun dens bibelske beskrivelse, en by i Juda kaldet bogstavernes by, indtaget af Otniel og givet til præsterne, og siger ikke, hvor den lå."
  sr:
    - "Давир, раније звани Киријат-Сефер, био је град у брдима Јудиним југозападно од Хеврона, а његово место се одавно расправља. В. Ф. Олбрајт је 1924. предложио Тел Бајт Мирсим и ископавао га 1926–1932; он стоји где се брда срећу са Сефелом. Курт Галинг је 1954. предложио Хирбет Рабуд, око 13 км југозападно од Хеврона; 1968, прегледајући брда јужно од Хеврона, Моше Кохави са Универзитета у Тел Авиву заступао је њега и тамо копао. Већина научника сада даје предност Хирбет Рабуду, који лежи у брдском крају где Књига Исуса Навина наводи Давир; тачка на карти га означава."
    - "Хирбет Рабуд био је насељен у бронзано доба, а у гвоздено доба постао је град Јудин. У 9. веку п. н. е. био је опасан дебелим зидом који је обухватао око 5 ха. Град је разорен крајем 8. века, вероватно у Сенахиримовом походу 701. п. н. е.; обновљен је у 7. веку и проширио се изван својих зидина, а поново је разорен када су Вавилонци освојили Јуду 587. или 586. п. н. е. Тел Бајт Мирсим је пак дао археологији дугу и брижљиво забележену секвенцу керамике бронзаног и гвозденог доба."
    - "Исус Навин је узео Давир и његовог цара и „истреби Енакиме из гора, из Хеврона, из Давира“. Књиге о Исусу Навину и о Судијама такође приповедају како је Халев обећао своју кћер Ахсу ономе ко освоји Киријат-Сефер; Готонило, син Кенезов, освојио га је, а Ахса је од оца тражила изворе воде: „И даде јој изворе горње и изворе доње“. Давир се наводи међу градовима у брдима Јудиним и са подграђем је дат синовима Ароновим."
    - "Почетком 4. века н. е. Јевсевије за Дабеир даје само библијски опис, град Јудин који се зове град књига, који је освојио Готонило и дат свештеницима, и не каже где је лежао."
  hu:
    - "Debir, korábbi nevén Kirját-Széfer, Júda hegyvidékének városa volt Hebrontól délnyugatra, helye régóta vitatott. W. F. Albright 1924-ben a Tell Beit Mirsimet javasolta, és 1926–1932-ben ásta; ott áll, ahol a dombok a Sefélához érnek. Kurt Galling 1954-ben a Hebrontól mintegy 13 km-re délnyugatra fekvő Khirbet Rabudot javasolta; Moshe Kochavi, a Tel-avivi Egyetem munkatársa 1968-ban, a Hebrontól délre fekvő hegyek felmérése közben mellette érvelt, és ott ásott. A legtöbb tudós ma Khirbet Rabudot részesíti előnyben, amely abban a hegyvidéken fekszik, ahol Józsué könyve Debirt felsorolja; a térkép pontja ezt jelöli."
    - "Khirbet Rabud a bronzkorban lakott volt, a vaskorban júdai város lett. A Kr. e. 9. században vastag fal vette körül, mintegy 5 ha-t zárva be. A várost a Kr. e. 8. század végén pusztították el, valószínűleg Szanhérib Kr. e. 701-es hadjáratában; a 7. században újjáépült és falain túlra is terjedt, és ismét elpusztult, amikor a babiloniak Kr. e. 587-ben vagy 586-ban meghódították Júdát. A Tell Beit Mirsim a maga részéről hosszú és gondosan rögzített kerámiasort adott a régészetnek a bronz- és vaskorból."
    - "Józsué elfoglalta Debirt és királyát, és „kiirtá az Anákokat a hegyek közül Hebronból, Debirből”. Józsué és a Bírák könyve azt is elmondja, hogyan ígérte Káleb leányát, Akszát annak, aki Kirját-Széfert elfoglalja; Otniel, Kenaz fia foglalta el, Aksza pedig forrásokat kért apjától: „néki adá a felső forrást és az alsó forrást”. Debir a júdai hegyvidék városai között szerepel, és legelőivel Áron fiainak adták."
    - "A 4. század elején Eusebius Dabeirről csak bibliai leírást ad, júdai városról, amelyet a betűk városának hívnak, Otniel vette be, és a papoknak adták, és nem mondja meg, hol feküdt."
  fi:
    - "Debir, aiemmin nimeltä Kirjat-Sefer, oli kaupunki Juudan vuoristossa Hebronista lounaaseen, ja sen sijainnista on kiistelty pitkään. W. F. Albright ehdotti Tell Beit Mirsimiä vuonna 1924 ja kaivoi sitä vuosina 1926–1932; se sijaitsee kohdassa, jossa kukkulat kohtaavat Sefelan. Kurt Galling ehdotti Khirbet Rabudia, noin 13 km Hebronista lounaaseen, vuonna 1954; vuonna 1968, kartoittaessaan Hebronista etelään olevia kukkuloita, Tel Avivin yliopiston Moshe Kochavi puolusti sitä ja kaivoi siellä. Useimmat tutkijat pitävät nyt parempana Khirbet Rabudia, joka sijaitsee vuoristossa, jossa Joosuan kirja luettelee Debirin; kartan piste merkitsee sen."
    - "Khirbet Rabud oli asuttu pronssikaudella ja siitä tuli rautakaudella Juudan kaupunki. 800-luvulla eaa. sitä ympäröi paksu muuri, joka sulki sisäänsä noin 5 ha. Kaupunki tuhoutui 700-luvun lopulla, luultavasti Sanheribin sotaretkellä vuonna 701 eaa.; se rakennettiin uudelleen 600-luvulla ja levisi muuriensa ulkopuolelle, ja se tuhoutui uudelleen, kun babylonialaiset valloittivat Juudan vuonna 587 tai 586 eaa. Tell Beit Mirsim puolestaan antoi arkeologialle pitkän ja huolellisesti kirjatun keramiikkajakson pronssi- ja rautakaudelta."
    - "Joosua valtasi Debirin ja sen kuninkaan ja ”hävitti anakilaiset vuoristosta, Hebronista, Debiristä”. Joosuan ja Tuomarien kirjat kertovat myös, kuinka Kaleb lupasi tyttärensä Aksan sille, joka valtaisi Kirjat-Seferin; Otniel, Kenaan poika, valtasi sen, ja Aksa pyysi isältään vesilähteitä: ”hän antoi hänelle Ylälähteet ja Alalähteet”. Debir luetellaan Juudan vuoriston kaupunkien joukossa, ja se annettiin laidunmaineen Aaronin lapsille."
    - "300-luvun alussa Eusebios antaa Dabeirille vain sen raamatullisen kuvauksen, Juudan kaupunki nimeltä kirjainten kaupunki, jonka Otniel valtasi ja joka annettiin papeille, eikä kerro, missä se sijaitsi."
  vi:
    - "Đê-bia, trước kia gọi là Ki-ri-át-Sê-phê, là một thành trong vùng đồi Giu-đa phía tây nam Hếp-rôn, và vị trí của nó từ lâu còn tranh luận. W. F. Albright đề nghị Tell Beit Mirsim năm 1924 và khai quật nó năm 1926–1932; nó đứng nơi các ngọn đồi gặp Sê-phê-la. Kurt Galling gợi ý Khirbet Rabud, cách Hếp-rôn khoảng 13 km về phía tây nam, năm 1954; năm 1968, khi khảo sát các ngọn đồi phía nam Hếp-rôn, Moshe Kochavi của Đại học Tel Aviv lập luận ủng hộ nó và đào ở đó. Phần lớn học giả nay ưa Khirbet Rabud, nằm trong vùng đồi núi nơi sách Giô-suê liệt kê Đê-bia; điểm trên bản đồ đánh dấu nó."
    - "Khirbet Rabud có người ở từ thời đồ đồng và vào thời đồ sắt trở thành một thành của Giu-đa. Vào thế kỷ 9 TCN nó được bao quanh bằng một bức tường dày bao khoảng 5 ha. Thành bị phá hủy vào cuối thế kỷ 8, có lẽ trong chiến dịch năm 701 TCN của San-chê-ríp; nó được xây lại vào thế kỷ 7 và lan ra ngoài tường, và bị phá hủy lần nữa khi người Ba-by-lôn chinh phục Giu-đa năm 587 hoặc 586 TCN. Về phần mình, Tell Beit Mirsim đã cho khảo cổ học một trình tự đồ gốm dài và được ghi chép cẩn thận của thời đồ đồng và đồ sắt."
    - "Giô-suê chiếm Đê-bia và vua nó, và “đi trừ diệt dân A-na-kim, nào ở trong núi, ở Hếp-rôn, ở Đê-bia”. Sách Giô-suê và Các Quan Xét cũng kể Ca-lép hứa con gái là Ạc-sa cho người nào chiếm được Ki-ri-át-Sê-phê; Ốt-ni-ên con của Kê-na chiếm nó, và Ạc-sa xin cha mấy suối nước: “Người bèn ban cho nàng các suối ở trên và ở dưới”. Đê-bia được liệt kê trong các thành vùng núi Giu-đa, và được ban cùng các vùng phụ cận cho con cháu A-rôn."
    - "Vào đầu thế kỷ 4, Eusebius chỉ cho Dabeir phần mô tả theo Kinh Thánh, một thành của Giu-đa gọi là thành của văn tự, bị Ốt-ni-ên chiếm và được trao cho các thầy tế lễ, và không nói nó nằm ở đâu."
  ro:
    - "Debir, numit mai înainte Chiriat-Sefer, era o cetate din dealurile lui Iuda, la sud-vest de Hebron, iar locul ei este de mult disputat. W. F. Albright a propus Tell Beit Mirsim în 1924 și l-a săpat în 1926–1932; se află unde dealurile întâlnesc Șefela. Kurt Galling a sugerat în 1954 Khirbet Rabud, la circa 13 km sud-vest de Hebron; în 1968, în timp ce cerceta dealurile de la sud de Hebron, Moshe Kochavi de la Universitatea din Tel Aviv l-a susținut și a săpat acolo. Cei mai mulți cercetători preferă acum Khirbet Rabud, care se află în ținutul muntos unde cartea lui Iosua înșiră Debirul; punctul de pe hartă îl marchează."
    - "Khirbet Rabud a fost locuit în epoca bronzului și în epoca fierului a devenit o cetate a lui Iuda. În secolul al IX-lea î.Hr. a fost înconjurat de un zid gros ce cuprindea circa 5 ha. Cetatea a fost distrusă la sfârșitul secolului al VIII-lea, probabil în campania lui Senaherib din 701 î.Hr.; a fost reconstruită în secolul al VII-lea și s-a întins dincolo de ziduri, apoi a fost distrusă din nou când babilonienii au cucerit Iuda în 587 sau 586 î.Hr. Tell Beit Mirsim, la rândul său, a dat arheologiei o secvență lungă și atent înregistrată de ceramică din epoca bronzului și a fierului."
    - "Iosua a luat Debirul și pe regele lui și „a tăiat pre Enachimii cei dela munți din Hevron și din Davir”. Cărțile lui Iosua și ale Judecătorilor povestesc și cum Caleb și-a făgăduit fiica Acsa celui care va lua Chiriat-Sefer; Otniel fiul lui Chenaz a luat-o, iar Acsa a cerut tatălui ei izvoare de apă: el i-a dat izvoarele de sus și izvoarele de jos. Debirul este înșirat printre cetățile din munții lui Iuda și a fost dat cu împrejurimile lui fiilor lui Aaron."
    - "La începutul secolului al IV-lea d.Hr., Eusebiu dă pentru Dabeir numai descrierea biblică, o cetate a lui Iuda numită cetatea literelor, luată de Otniel și dată preoților, și nu spune unde se afla."
  bg:
    - "Давир, по-рано наричан Кириат-Сефер, бил град в Юдейските планини югозападно от Хеврон и мястото му отдавна е спорно. У. Ф. Олбрайт предложил Тел Бейт Мирсим през 1924 г. и го разкопавал през 1926–1932 г.; той стои там, където планините се срещат с Шефела. Курт Галинг предложил Хирбет Рабуд, на около 13 км югозападно от Хеврон, през 1954 г.; през 1968 г., докато обследвал планините южно от Хеврон, Моше Кохави от Телавивския университет защитил това място и копал там. Повечето учени днес предпочитат Хирбет Рабуд, който лежи в планинската област, където книгата Иисус Навин изброява Давир; точката на картата го отбелязва."
    - "Хирбет Рабуд бил заселен през бронзовата епоха, а през желязната епоха станал град на Юда. През IX в. пр.н.е. той бил обграден с дебела стена, която обхващала около 5 ха. Градът бил разрушен в края на VIII в., вероятно при похода на Сенахирим от 701 г. пр.н.е.; бил възстановен през VII в. и се разпрострял извън стените си, а бил разрушен отново, когато вавилонците завладели Юда през 587 или 586 г. пр.н.е. Тел Бейт Мирсим, от своя страна, дал на археологията дълга и грижливо записана последователност от керамика от бронзовата и желязната епоха."
    - "Иисус Навин превзел Давир и царя му и „изтреби Енакимите от горите, от Хеврон, от Девир“. Книгите Иисус Навин и Съдии разказват също как Халев обещал дъщеря си Ахса на мъжа, който превземе Кириат-Сефер; Готониил, синът на Кеназ, го превзел, а Ахса поискала от баща си водни извори: „И даде ѝ горните източници, и долните източници.“ Давир е изброен сред градовете в планините на Юда и бил даден с предградията си на синовете на Аарон."
    - "В началото на IV в. н.е. Евсевий дава за Дабеир само библейското му описание — град на Юда, наричан град на писмената, превзет от Готониил и даден на свещениците — и не казва къде е лежал."
