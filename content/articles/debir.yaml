# Overview article (ADR 0007). Mainstream facts only; the site of Debir is debated (Khirbet Rabud, now preferred, against Albright's Tell Beit Mirsim); the map point stands on Khirbet Rabud; no date is given for the conquest.
id: debir
place: ad2048e
title:
  en: "Debir"
  ru: "Давир"
  uk: "Девір"
  es: "Debir"
  pt: "Debir"
  de: "Debir"
  fr: "Debir"
  it: "Debir"
  pl: "Debir"
  nl: "Debir"
