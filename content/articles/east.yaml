body:
  en:
    - "“The east” in the Bible is less a country than a direction and the peoples who lived in it: the “children of the east” (Hebrew bene qedem), the tribes of the Syrian and Arabian desert beyond Gilead and Ammon. Abraham sent the sons of his concubines away “eastward, unto the east country”; Jacob “came into the land of the people of the east”, which the story goes on to call Haran; Balaam was brought by Balak “out of the mountains of the east”. Ezekiel threatens Ammon with “the men of the east”, who will pitch their camps in its fields and eat its fruit, so that on the map the region is set around Rabbah."
    - "In Judges the children of the east came up with Midian and Amalek every harvest and lay in the valley of Jezreel “like grasshoppers for multitude”, their camels “as the sand by the sea side”, until Gideon routed them. Job, “the greatest of all the men of the east”, lived in the land of Uz. Their reputation was wisdom: Solomon's wisdom “excelled the wisdom of all the children of the east country, and all the wisdom of Egypt”. Jeremiah's oracle against Kedar commands, “spoil the men of the east”, and the annals of the Assyrian kings of the eighth and seventh centuries BC name Kedar and other Arab tribes among the camel-nomads of the same desert."
    - "In the New Testament “wise men from the east”, magi, came to Jerusalem asking for the newborn King of the Jews, for they had seen his star “in the east”; the Gospel does not say from where. Herodotus knew the magi as a priestly tribe of the Medes, and early Christian writers already disagreed: Justin Martyr brought them from Arabia, others from Persia. Revelation sees the Euphrates dried up “that the way of the kings of the east might be prepared”. The lands of the children of the east are today the deserts of eastern Jordan, Syria, western Iraq and northern Saudi Arabia."
  ru:
    - "«Восток» в Библии — не столько страна, сколько сторона света и народы, жившие в ней: «сыны востока» (евр. бене кедем), племена Сирийской и Аравийской пустыни за Галаадом и Аммоном. Авраам отослал сыновей наложниц «на восток, в землю восточную»; Иаков «пошел в землю сынов востока», которую рассказ дальше называет Харраном; Валаама Валак привёл «от гор восточных». Иезекииль грозит отдать Аммон «в наследие сынам востока», которые поставят в его земле шатры и будут есть его плоды, — потому на карте эта область положена вокруг Раввы."
    - "В книге Судей сыны востока вместе с Мадианитянами и Амаликитянами приходили каждую жатву и стояли в долине Изреельской «в таком множестве, как саранча», а верблюдам их «не было числа», пока их не разбил Гедеон. Иов, «знаменитее всех сынов Востока», жил в земле Уц. Славились они мудростью: «была мудрость Соломона выше мудрости всех сынов востока и всей мудрости Египтян». Пророчество Иеремии о Кидаре велит: «опустошайте сыновей востока!», а анналы ассирийских царей VIII–VII веков до н. э. называют Кидар и другие арабские племена среди кочевников той же пустыни."
    - "В Новом Завете «волхвы с востока», маги, пришли в Иерусалим и спрашивали о родившемся Царе Иудейском, ибо видели «звезду Его на востоке»; откуда именно, Евангелие не говорит. Геродот знал магов как жреческое племя мидян, и ранние христианские писатели уже расходились: Иустин Мученик выводил их из Аравии, другие — из Персии. В Откровении Евфрат высыхает, «чтобы готов был путь царям от восхода солнечного». Земли сынов востока — сегодня пустыни восточной Иордании, Сирии, западного Ирака и северной Саудовской Аравии."
  uk:
    - "«Схід» у Біблії — це радше напрям і народи, що в ньому жили, ніж країна: «сини сходу» (єврейською бене кедем), племена сирійської та аравійської пустелі за Гілеадом і Аммоном. Авраам відіслав синів своїх наложниць «на схід соньця, у землю восточню»; Яків «пійшов у землю восточню», яку оповідь далі називає Харан; Валаама привів Валак «з гір восточнїх». Єзекіїль погрожує Аммонові «синам востоку», які розкладуть свої шатра в його полях і їстимуть його плоди, тому на мапі цю область розташовано навколо Равви."
    - "У Книзі Суддів сини сходу приходили з Мадіамом та Амаликом кожного врожаю й лежали в долині Їзреель, «як сарани», а їхні верблюди — «як піску на морському березї», доки Гедеон не розбив їх. Йов, що «переважував … усїх осадників на востоцї», жив у землі Уц. Їхня слава була мудрість: мудрість Соломона була «більша нїж у всїх, що жили на востоцї, і більша нїж у всїх Египтїїв». Оракул Єремії проти Кедару велить: «звоюйте тих осадників восточних», а аннали ассирійських царів VIII–VII ст. до н. е. називають Кедар та інші арабські племена серед верблюдарів тієї самої пустелі."
    - "У Новому Заповіті «мудрцї зі сходу», маги, прийшли до Єрусалима, питаючи про новонародженого Царя Юдейського, бо бачили Його зорю «на сходї»; Євангелія не каже, звідки саме. Геродот знав магів як священицьке плем'я мідян, а ранні християнські автори вже розходилися: Юстин Мученик виводив їх з Аравії, інші — з Персії. В Одкровенні Євфрат висихає, «щоб готова була дорога царям, що зі сходу сонця». Землі синів сходу — це сьогодні пустелі східної Йорданії, Сирії, західного Іраку та північної Саудівської Аравії."
  es:
    - "«El oriente» en la Biblia es menos un país que una dirección y los pueblos que vivían en ella: los «hijos del oriente» (en hebreo bene qedem), las tribus del desierto sirio y arábigo más allá de Galaad y Amón. Abraham envió a los hijos de sus concubinas «hacia el oriente, á la tierra oriental»; Jacob «fué á la tierra de los orientales», que el relato pasa a llamar Harán; Balaam fue traído por Balac «de los montes del oriente». Ezequiel amenaza a Amón con «los Orientales», que plantarán sus campamentos en sus campos y comerán su fruto, por lo que en el mapa la región se sitúa en torno a Rabá."
    - "En Jueces, los hijos del oriente subían con Madián y Amalec cada cosecha y se tendían en el valle de Jezreel «como langostas en muchedumbre», con sus camellos «como la arena que está á la ribera de la mar», hasta que Gedeón los puso en fuga. Job, «grande más que todos los Orientales», vivía en la tierra de Uz. Su fama era la sabiduría: la de Salomón fue «mayor [...] que la de todos los orientales, y que toda la sabiduría de los Egipcios». El oráculo de Jeremías contra Cedar ordena: «destruid los hijos de oriente», y los anales de los reyes asirios de los siglos VIII y VII a. C. nombran a Cedar y a otras tribus árabes entre los nómadas de camellos del mismo desierto."
    - "En el Nuevo Testamento, «unos magos vinieron del oriente» a Jerusalén preguntando por el recién nacido Rey de los Judíos, pues habían visto su estrella «en el oriente»; el Evangelio no dice desde dónde. Heródoto conocía a los magos como una tribu sacerdotal de los medos, y los primeros escritores cristianos ya discrepaban: Justino Mártir los hacía venir de Arabia, otros de Persia. El Apocalipsis ve secarse el Éufrates «para que fuese preparado el camino de los reyes del Oriente». Las tierras de los hijos del oriente son hoy los desiertos del este de Jordania, Siria, el oeste de Irak y el norte de Arabia Saudí."
  pt:
    - "“O oriente” na Bíblia é menos um país do que uma direção e os povos que nela viviam: os “filhos do oriente” (em hebraico bene qedem), as tribos do deserto sírio e arábico além de Gileade e Amom. Abraão enviou os filhos de suas concubinas “para o leste, para a terra do oriente”; Jacó “chegou à terra dos filhos do oriente”, que a narrativa passa a chamar Harã; Balaão foi trazido por Balaque “das montanhas do Oriente”. Ezequiel ameaça entregar Amom “aos filhos do oriente”, que armarão seus acampamentos em seu território e comerão seus frutos, de modo que no mapa a região é posta em torno de Rabá."
    - "Em Juízes, os filhos do oriente subiam com Midiã e Amaleque a cada colheita e acampavam no vale de Jezreel “numerosos como gafanhotos”, seus camelos “como a areia que está na praia do mar”, até que Gideão os desbaratou. Jó, “o maior de todos os filhos do oriente”, vivia na terra de Uz. Sua fama era de sabedoria: a sabedoria de Salomão “superava a sabedoria de todos os filhos do oriente e toda a sabedoria do Egito”. O oráculo de Jeremias contra Quedar ordena: “Destruam os filhos do oriente!”, e os anais dos reis assírios dos séculos VIII e VII a.C. nomeiam Quedar e outras tribos árabes entre os nômades de camelos do mesmo deserto."
    - "No Novo Testamento, “magos do oriente” vieram a Jerusalém perguntando pelo recém-nascido Rei dos judeus, pois tinham visto sua estrela “no oriente”; o Evangelho não diz de onde. Heródoto conhecia os magos como uma tribo sacerdotal dos medos, e os escritores cristãos antigos já divergiam: Justino Mártir os trazia da Arábia, outros da Pérsia. O Apocalipse vê o Eufrates secar “para que se preparasse o caminho para os reis que vêm do nascente do sol”. As terras dos filhos do oriente são hoje os desertos do leste da Jordânia, da Síria, do oeste do Iraque e do norte da Arábia Saudita."
  de:
    - "„Der Osten“ ist in der Bibel weniger ein Land als eine Richtung und die Völker, die darin lebten: die „Kinder des Morgenlandes“ (hebräisch bene qedem), die Stämme der syrischen und arabischen Wüste jenseits von Gilead und Ammon. Abraham schickte die Söhne seiner Nebenfrauen fort „gegen Aufgang in das Morgenland“; Jakob ging „in das Land, das gegen Morgen liegt“, das die Erzählung dann Haran nennt; Bileam wurde von Balak „von dem Gebirge gegen Aufgang“ geholt. Hesekiel droht Ammon, es „den Kindern des Morgenlandes“ zu übergeben, die ihre Zeltdörfer in seinen Feldern aufschlagen und seine Früchte essen werden, sodass die Region auf der Karte um Rabba herum angesetzt ist."
    - "Im Richterbuch kamen die Kinder des Morgenlandes mit Midian und Amalek zu jeder Ernte herauf und lagen im Tal Jesreel „wie eine große Menge Heuschrecken“, ihre Kamele zahllos „wie der Sand am Ufer des Meers“, bis Gideon sie schlug. Hiob, „herrlicher denn alle, die gegen Morgen wohnten“, lebte im Land Uz. Ihr Ruf war die Weisheit: Salomos Weisheit war „größer denn aller, die gegen Morgen wohnen, und aller Ägypter Weisheit“. Jeremias Orakel gegen Kedar gebietet: „verstört die gegen Morgen wohnen!“, und die Annalen der assyrischen Könige des 8. und 7. Jahrhunderts v. Chr. nennen Kedar und andere arabische Stämme unter den Kamelnomaden derselben Wüste."
    - "Im Neuen Testament kamen „die Weisen vom Morgenland“, Magier, nach Jerusalem und fragten nach dem neugeborenen König der Juden, denn sie hatten seinen Stern „im Morgenland“ gesehen; das Evangelium sagt nicht, woher. Herodot kannte die Magier als priesterlichen Stamm der Meder, und frühchristliche Schriftsteller waren schon uneins: Justin der Märtyrer ließ sie aus Arabien kommen, andere aus Persien. Die Offenbarung sieht den Euphrat austrocknen, „auf daß bereitet würde der Weg den Königen vom Aufgang der Sonne“. Die Länder der Kinder des Morgenlandes sind heute die Wüsten des östlichen Jordanien, Syriens, des westlichen Irak und des nördlichen Saudi-Arabien."
  fr:
    - "« L’Orient » dans la Bible est moins un pays qu’une direction et les peuples qui y vivaient : les « fils de l’Orient » (en hébreu bene qedem), tribus du désert de Syrie et d’Arabie au-delà de Galaad et d’Ammon. Abraham envoya les fils de ses concubines « du côté de l’orient, dans le pays d’Orient » ; Jacob « s’en alla au pays des fils de l’Orient », que le récit appelle ensuite Haran ; Balaam dit que Balak, roi de Moab, l’a fait descendre « des montagnes de l’Orient ». Ézéchiel menace Ammon des « fils de l’Orient », qui y établiront leurs enclos et mangeront ses fruits, si bien que sur la carte la région est située autour de Rabba."
    - "Dans les Juges, les fils de l’Orient montaient avec Madian et Amalek à chaque récolte et campaient dans la vallée de Jizreel « comme une multitude de sauterelles », leurs chameaux « innombrables comme le sable qui est sur le bord de la mer », jusqu’à ce que Gédéon les mette en déroute. Job, « le plus considérable de tous les fils de l’Orient », vivait au pays d’Uts. Leur réputation était la sagesse : la sagesse de Salomon « surpassait la sagesse de tous les fils de l’Orient et toute la sagesse des Égyptiens ». L’oracle de Jérémie contre Kédar ordonne : « détruisez les fils de l’Orient », et les annales des rois assyriens des VIIIe et VIIe siècles av. J.-C. nomment Kédar et d’autres tribus arabes parmi les nomades chameliers du même désert."
    - "Dans le Nouveau Testament, des « mages d’Orient » arrivèrent à Jérusalem en demandant le roi des Juifs qui venait de naître, car ils avaient vu son étoile « en Orient » ; l’Évangile ne dit pas d’où. Hérodote connaissait les mages comme une tribu sacerdotale des Mèdes, et les auteurs chrétiens anciens divergeaient déjà : Justin Martyr les faisait venir d’Arabie, d’autres de Perse. L’Apocalypse voit l’Euphrate asséché « afin que le chemin des rois venant de l’Orient fût préparé ». Les pays des fils de l’Orient sont aujourd’hui les déserts de l’est de la Jordanie, de la Syrie, de l’ouest de l’Irak et du nord de l’Arabie saoudite."
  it:
    - "«L’Oriente» nella Bibbia è meno un paese che una direzione e i popoli che vi abitavano: i «figliuoli dell’oriente» (in ebraico bene qedem), le tribù del deserto siro-arabico oltre Galaad e Ammon. Abramo mandò i figli delle sue concubine «verso levante, nel paese d’oriente»; Giacobbe «andò nel paese degli Orientali», che il racconto chiama poi Carran; Balaam fu fatto venire da Balak «dalle montagne d’Oriente». Ezechiele minaccia Ammon con i «figliuoli d’Oriente», che vi pianteranno gli accampamenti e mangeranno i suoi frutti, sicché sulla mappa la regione è collocata attorno a Rabba."
    - "Nei Giudici i figliuoli dell’oriente salivano con Madian e Amalek a ogni raccolto e si accampavano nella valle di Izreel «come una moltitudine di locuste», con i cammelli «come la rena ch’è sul lido del mare», finché Gedeone li mise in rotta. Giobbe, «il più grande di tutti gli Orientali», abitava nel paese di Uz. La loro fama era la sapienza: la sapienza di Salomone «superò la sapienza di tutti gli Orientali e tutta la sapienza degli Egiziani». L’oracolo di Geremia contro Kedar ordina: «distruggete i figliuoli dell’oriente!», e gli annali dei re assiri dell’VIII e VII secolo a.C. nominano Kedar e altre tribù arabe fra i nomadi del cammello dello stesso deserto."
    - "Nel Nuovo Testamento «magi d’Oriente» giunsero a Gerusalemme chiedendo del re dei Giudei appena nato, perché avevano visto la sua stella «in Oriente»; il Vangelo non dice da dove. Erodoto conosceva i magi come una tribù sacerdotale dei Medi, e già gli scrittori cristiani antichi dissentivano: Giustino Martire li faceva venire dall’Arabia, altri dalla Persia. L’Apocalisse vede l’Eufrate prosciugato «affinché fosse preparata la via ai re che vengono dal levante». Le terre dei figli dell’oriente sono oggi i deserti della Giordania orientale, della Siria, dell’Iraq occidentale e dell’Arabia Saudita settentrionale."
  pl:
    - "„Wschód” w Biblii jest mniej krajem niż kierunkiem i ludami, które w nim mieszkały: „synowie Wschodu” (hebr. bene kedem), plemiona pustyni syryjskiej i arabskiej za Gileadem i Ammonem. Abraham odprawił synów swoich nałożnic „ku wschodowi do krainy wschodniej”; Jakub „poszedł do ziemi, mieszkających na wschód słońca”, którą opowieść nazywa dalej Charan; Balaama sprowadził Balak „z gór wschodnich”. Ezechiel grozi Ammonowi, że zostanie podany „narodom wschodnim w dziedzictwo”, które rozbiją obozy na jego polach i będą jeść jego plony, dlatego na mapie region jest ustawiony wokół Rabby."
    - "W Księdze Sędziów synowie Wschodu przychodzili z Madianem i Amalekiem co żniwa i leżeli w dolinie Jizreel „jako szarańcza przemnóstwo”, ich wielbłądy „jako piasek, który jest na brzegu morskim niezliczony”, aż Gedeon ich rozgromił. Hiob, który „był najmożniejszym nad wszystkich ludzi na wschód słońca”, mieszkał w ziemi Uz. Słynęli mądrością: „większa była mądrość Salomonowa, niżli mądrość wszystkich narodów wschodnich, i niżli wszelka mądrość Egipczanów”. Wyrocznia Jeremiasza przeciw Kedar nakazuje: „zburzcie narody wschodnie”, a roczniki królów asyryjskich z VIII i VII w. p.n.e. wymieniają Kedar i inne plemiona arabskie wśród nomadów wielbłądów tej samej pustyni."
    - "W Nowym Testamencie „mędrcy ze wschodu słońca”, magowie, przybyli do Jerozolimy, pytając o nowo narodzonego Króla Żydów, bo widzieli jego gwiazdę „na wschód słońca”; Ewangelia nie mówi, skąd. Herodot znał magów jako kapłańskie plemię Medów, a wcześni pisarze chrześcijańscy już się różnili: Justyn Męczennik sprowadzał ich z Arabii, inni z Persji. Apokalipsa widzi Eufrat wyschnięty, „aby zgotowana była droga królom od wschodu słońca”. Ziemie synów Wschodu to dziś pustynie wschodniej Jordanii, Syrii, zachodniego Iraku i północnej Arabii Saudyjskiej."
  nl:
    - "“Het Oosten” is in de Bijbel meer een richting dan een land, en de volken die erin woonden: de “kinderen van het Oosten” (Hebreeuws bene qedem), de stammen van de Syrische en Arabische woestijn voorbij Gilead en Ammon. Abraham zond de zonen van zijn bijwijven weg “oostwaarts naar het land van het Oosten”; Jakob ging “naar het land der kinderen van het Oosten”, dat het verhaal verderop Haran noemt; Bileam werd door Balak gehaald “van het gebergte tegen het oosten”. Ezechiël dreigt Ammon met “die van het oosten”, die hun kampen in zijn velden zullen slaan en zijn vruchten eten, zodat de streek op de kaart rond Rabba ligt."
    - "In Richteren kwamen de kinderen van het oosten elke oogst met Midian en Amalek op en lagen in het dal van Jizreël “gelijk sprinkhanen in menigte”, hun kamelen “gelijk het zand, dat aan den oever der zee is”, totdat Gideon hen versloeg. Job, die “groter was dan al die van het oosten”, woonde in het land Uz. Hun faam was wijsheid: Salomo's wijsheid was “groter dan de wijsheid van al die van het oosten, en dan alle wijsheid der Egyptenaren”. Jeremia's orakel tegen Kedar gebiedt: “verstoort de kinderen van het oosten”, en de annalen van de Assyrische koningen van de achtste en zevende eeuw v.Chr. noemen Kedar en andere Arabische stammen onder de kameelnomaden van dezelfde woestijn."
    - "In het Nieuwe Testament kwamen “enige wijzen van het Oosten”, magiërs, naar Jeruzalem om te vragen naar de pasgeboren Koning der Joden, want zij hadden Zijn ster gezien “in het Oosten”; het evangelie zegt niet van waar. Herodotus kende de magiërs als een priesterstam van de Meden, en vroegchristelijke schrijvers waren het al oneens: Justinus Martelaar liet hen uit Arabië komen, anderen uit Perzië. Openbaring ziet de Eufraat opgedroogd, “opdat bereid zou worden de weg der koningen, die van den opgang der zon komen zullen”. De landen van de kinderen van het Oosten zijn nu de woestijnen van Oost-Jordanië, Syrië, West-Irak en Noord-Saoedi-Arabië."
  cs:
    - "„Východ“ je v Bibli méně země než směr a národy, které v něm žily: „synové východu“ (hebrejsky bene qedem), kmeny syrské a arabské pouště za Gileadem a Amónem. Abraham poslal syny svých ženin pryč „k východu do země východní“; Jákob „odšel do země východní“, kterou příběh dále nazývá Cháran; Bileáma přivedl Balak „z hor východních“. Ezechiel hrozí Amónu, že ho dá „národům východním za dědictví“, kteří v jeho polích postaví své tábory a budou jíst jeho ovoce, takže na mapě je oblast položena kolem Rabby."
    - "V Knize soudců přitáhli synové východu s Midjánem a Amalekem při každé žni a leželi v údolí Jizreel „jako kobylky u velikém množství“, jejich velbloudi „jako písek, kterýž jest na břehu mořském v nesčíslném množství“, dokud je Gedeon nerozprášil. Job, „vznešenější nade všecky lidi východní“, žil v zemi Úc. Jejich pověst byla moudrost: „větší byla moudrost Šalomounova, než moudrost všech národů východních, a než všeliká moudrost Egyptských“. Jeremjášova věštba proti Kedaru velí „vypleňte národy východní“ a anály asyrských králů 8. a 7. století př. n. l. jmenují Kedar a další arabské kmeny mezi velbloudími nomády téže pouště."
    - "V Novém zákoně přišli „mudrci od východu slunce“, mágové, do Jeruzaléma a ptali se na právě narozeného krále Židovského, neboť viděli jeho hvězdu „na východu slunce“; evangelium neříká odkud. Hérodotos znal mágy jako kněžský kmen Médů a raní křesťanští spisovatelé se už rozcházeli: Justin Mučedník je přivedl z Arábie, jiní z Persie. Zjevení vidí Eufrat vyschlý, „aby připravena byla cesta králům od východu slunce“. Země synů východu jsou dnes pouště východního Jordánska, Sýrie, západního Iráku a severní Saúdské Arábie."
  sv:
    - "”Österlandet” är i Bibeln mindre ett land än en riktning och de folk som bodde i den: ”Österlandets söner” (hebreiska bene qedem), stammarna i den syriska och arabiska öknen bortom Gilead och Ammon. Abraham lät sina bihustrurs söner ”draga österut, bort till Österlandet”; Jakob begav sig ”på väg till Österlandet”, som berättelsen sedan kallar Harran; Bileam hämtades av Balak ”från österns berg”. Hesekiel hotar Ammon med ”österlänningarna”, som skall slå upp sina tältläger på dess fält och äta dess frukt, så att regionen på kartan är lagd kring Rabba."
    - "I Domarboken drog österlänningarna upp med Midjan och Amalek varje skördetid och låg i Jisreels dal, ”talrika såsom gräshoppor”, deras kameler ”talrika såsom sanden på havets strand”, tills Gideon slog dem på flykten. Job, ”mäktigare än någon annan i Österlandet”, levde i Us’ land. Deras rykte var vishet: Salomos vishet var ”större än alla österlänningars vishet och all Egyptens vishet”. Jeremias utsaga mot Kedar befaller: ”fördärven Österlandets söner”, och de assyriska kungarnas annaler från 700- och 600-talen f.Kr. nämner Kedar och andra arabiska stammar bland kamelnomaderna i samma öken."
    - "I Nya testamentet kom ”vise män från österns länder”, magerna, till Jerusalem och frågade efter den nyfödde judakonungen, ty de hade sett ”hans stjärna i östern”; evangeliet säger inte varifrån. Herodotos kände magerna som en prästerlig stam bland mederna, och tidiga kristna författare var redan oense: Justinus martyren lät dem komma från Arabien, andra från Persien. Uppenbarelseboken ser Eufrat torka ut, ”för att väg skulle beredas åt konungarna från östern”. Österlänningarnas land är i dag öknarna i östra Jordanien, Syrien, västra Irak och norra Saudiarabien."
  nb:
    - "«Østen» i Bibelen er mindre et land enn en retning og folkene som bodde der: «Østens barn» (hebraisk bene qedem), stammene i den syriske og arabiske ørkenen bortenfor Gilead og Ammon. Abraham sendte sine medhustruers sønner bort «østover, til Østerland»; Jakob «drog til Østens barns land», som fortellingen videre kaller Harran; Bileam ble hentet av Balak «fra Østens fjell». Esekiel truer Ammon med «Østens sønner», som skal slå opp sine teltleire i dets land og ete dets frukt, og derfor er regionen på kartet lagt rundt Rabba."
    - "I Dommerboken kom Østens barn opp med Midjan og Amalek hver høst og lå i Jisreel-dalen «så tett som gresshopper», med kameler «tallrike som sanden på havets bredd», til Gideon slo dem på flukt. Job, «mektigere enn alle Østens barn», bodde i landet Us. Deres rykte var visdom: Salomos visdom var «større enn alle Østens barns visdom og all egypternes visdom». Jeremias orakel mot Kedar byr: «ødelegg Østens barn!», og annalene til de assyriske kongene på 700- og 600-tallet f.Kr. nevner Kedar og andre arabiske stammer blant kamelnomadene i den samme ørkenen."
    - "I Det nye testamente kom «nogen vismenn fra Østerland», magiere, til Jerusalem og spurte etter den nyfødte jødekongen, for de hadde sett hans stjerne «i Østen»; evangeliet sier ikke hvorfra. Herodot kjente magierne som en prestestamme blant mederne, og tidlige kristne forfattere var allerede uenige: Justin Martyren lot dem komme fra Arabia, andre fra Persia. Åpenbaringen ser Eufrat tørke bort, «forat der skulde ryddes vei for kongene fra Østen». Landene til Østens barn er i dag ørkenene i Øst-Jordan, Syria, vestlige Irak og nordlige Saudi-Arabia."
