body:
  en:
    - "Bamoth-baal, “the high places of Baal”, was a sanctuary and town on the Moabite plateau north of the Arnon. It is first the place from which Balaam saw Israel: on the morning after his arrival “Balak took Balaam, and brought him up into the high places of Baal, that thence he might see the utmost part of the people”, the King James Version, like the Synodal Bible, translating the name as a phrase. From there Balak led him on to Pisgah and to Peor, each a height with a view of the camp in the plains below. Joshua lists it as a town, among the cities of Reuben on the tableland: “Dibon, and Bamoth-baal, and Beth-baal-meon”."
    - "Nearly everyone takes it for the Bamoth of Israel's itinerary, the station before Pisgah, and perhaps for the Beth-bamoth that Mesha, king of Moab, says on his stele he rebuilt. The name shows a hill shrine of the Canaanite and Moabite kind, the “high place” the prophets denounced, and the view required by the story fits the western edge of the plateau above the Dead Sea. But no site is known: Khirbet el-Quweiqiyeh, Jebel Ataruz and Khirbet Libb have each been suggested, and no inscription has settled it. The region is the Madaba governorate of Jordan, between Dhiban and Mount Nebo."
  ru:
    - "Вамоф-Ваал, «высоты Вааловы», — святилище и город на Моавитском плато к северу от Арнона. Сначала это место, откуда Валаам увидел Израиль: наутро после его прибытия «Валак взял Валаама и возвел его на высоты Вааловы, чтобы он увидел оттуда часть народа»; Синодальный перевод, как и английская Библия короля Иакова, передаёт имя как выражение. Оттуда Валак повёл его на Фасгу и на Фегор, каждая из этих высот открывала вид на стан внизу на равнине. Книга Иисуса Навина называет его городом, среди городов Рувима на плоскогорье: «Дивон, Вамоф-Ваал и Беф-Ваал-Меон»."
    - "Почти все видят в нём Вамоф из маршрута Израиля, стан перед Фасгой, и, возможно, тот Беф-Бамоф, который Меса, царь Моава, по словам его стелы, отстроил. Имя указывает на холмовое святилище ханаанского и моавитского образца, «высоту», которую обличали пророки, а вид, нужный для рассказа, подходит к западному краю плато над Мёртвым морем. Но место неизвестно: предлагали Хирбет-эль-Кувейкию, Джебель-Атаруз и Хирбет-Либб, и ни одна надпись вопроса не решила. Это район иорданской провинции Мадаба, между Дибаном и горой Нево."
  uk:
    - "Вамот-Ваал, «висоти Ваала», було святилищем і містом на Моавському плато на північ від Арнону. Спершу це місце, звідки Валаам побачив Ізраїль: наступного ранку після його прибуття «взяв Балак Білеама та й привів його на верхи Бааля, щоб він побачив із відти народ, що стояв зпереду» — Біблія короля Якова, як і Синодальний переклад, перекладає назву як словосполучення. Звідти Валак повів його далі на Фасгу і на Пеор, кожна — висота з видом на табір у рівнинах унизу. Ісус Навин подає його як місто, серед міст Рувима на плато: «Дибон і Бамот-Баал і Бет-Баал-Меон»."
    - "Майже всі вважають його тим Вамотом з Ізраїлевого переліку станів, що був перед Фасгою, і, можливо, Бет-Вамотом, який, за стелою, відбудував Меша, цар Моава. Назва вказує на пагорбне святилище ханаанського й моавського типу, «висоту», яку пророки засуджували, а краєвид, якого вимагає оповідь, пасує західному краю плато над Мертвим морем. Але місце невідоме: пропонували Хірбет-ель-Кувейкійє, Джебель-Аттарус і Хірбет-Лібб, і жоден напис справи не вирішив. Цей край — мухафаза Мадаба в Йорданії, між Дібаном і горою Нево."
  es:
    - "Bamot-baal, «los altos de Baal», era un santuario y ciudad de la meseta de Moab, al norte del Arnón. Es primero el lugar desde el que Balaam vio a Israel: la mañana después de su llegada «Balac tomó á Balaam, é hízolo subir á los altos de Baal, y desde allí vió la extremidad del pueblo», traduciendo la versión del rey Jacobo, como la Biblia sinodal, el nombre como una frase. Desde allí Balac lo llevó a Pisga y a Peor, cada una una altura con vista del campamento en las llanuras de abajo. Josué la enumera como ciudad, entre las ciudades de Rubén en la meseta: «Dibón, y Bamoth-baal, y Beth-baal-meón»."
    - "Casi todos la toman por la Bamot del itinerario de Israel, la estación anterior a Pisga, y quizá por la Bet-bamot que Mesa, rey de Moab, dice en su estela que reconstruyó. El nombre muestra un santuario en una colina de tipo cananeo y moabita, el «lugar alto» que denunciaron los profetas, y la vista que exige el relato encaja con el borde occidental de la meseta sobre el mar Muerto. Pero no se conoce ningún sitio: se han sugerido Khirbet el-Quweiqiyeh, Jebel Ataruz y Khirbet Libb, y ninguna inscripción lo ha resuelto. La región es la gobernación de Madaba, en Jordania, entre Dhiban y el monte Nebo."
  pt:
    - "Bamote-Baal, “os altos de Baal”, era um santuário e cidade no planalto de Moabe, ao norte do Arnom. É primeiro o lugar de onde Balaão viu Israel: na manhã depois de sua chegada, “Balaque tomou Balaão e o levou para os altos de Baal; e de lá ele viu uma parte do povo”, traduzindo a King James Version, como a Bíblia sinodal, o nome como expressão. Dali Balaque o conduziu a Pisga e a Peor, cada uma uma altura com vista do acampamento nas planícies abaixo. Josué a lista como cidade, entre as cidades de Rúben no altiplano: “Dibom, Bamote-Baal, Bete-Baal-Meom”."
    - "Quase todos a tomam pela Bamote do itinerário de Israel, a estação antes de Pisga, e talvez pela Bete-Bamote que Mesa, rei de Moabe, diz em sua estela ter reconstruído. O nome mostra um santuário de colina do tipo cananeu e moabita, o “lugar alto” que os profetas denunciaram, e a vista exigida pela narrativa combina com a borda ocidental do planalto acima do mar Morto. Mas nenhum sítio é conhecido: Khirbet el-Quweiqiyeh, Jebel Ataruz e Khirbet Libb foram sugeridos, e nenhuma inscrição resolveu. A região é a província de Madaba, na Jordânia, entre Dhiban e o monte Nebo."
  de:
    - "Bamot-Baal, „die Höhen des Baal“, war ein Heiligtum und eine Stadt auf dem moabitischen Plateau nördlich des Arnon. Zuerst ist es der Ort, von dem aus Bileam Israel sah: Am Morgen nach seiner Ankunft „nahm Balak den Bileam und führte ihn hin auf die Höhe Baals, daß er von da sehen konnte das Ende des Volks“, wobei die King-James-Bibel wie die Synodalbibel den Namen als Wortgruppe übersetzt. Von dort führte Balak ihn weiter nach Pisga und zum Peor, jeweils eine Höhe mit Blick auf das Lager in der Ebene darunter. Josua führt es als Stadt auf, unter den Städten Rubens auf dem Hochland: „Dibon, Bamoth-Baal und Beth-Baal-Meon“."
    - "Fast alle halten es für das Bamot der Wegstationen Israels, die Station vor Pisga, und vielleicht für das Bet-Bamot, das Mesa, der König von Moab, nach seiner Stele wieder aufbaute. Der Name zeigt ein Höhenheiligtum kanaanäischer und moabitischer Art, die „Höhe“, die die Propheten anprangerten, und der von der Geschichte verlangte Ausblick passt zum Westrand des Plateaus über dem Toten Meer. Doch keine Stätte ist bekannt: Chirbet el-Quweiqiye, Dschebel Ataruz und Chirbet Libb wurden jeweils vorgeschlagen, und keine Inschrift hat entschieden. Die Gegend ist das Gouvernement Madaba in Jordanien, zwischen Dhiban und dem Berg Nebo."
  fr:
    - "Bamoth-Baal, « les hauts lieux de Baal », était un sanctuaire et une ville du plateau moabite au nord de l’Arnon. C’est d’abord le lieu d’où Balaam vit Israël : le matin après son arrivée, « Balak prit Balaam, et le fit monter à Bamoth-Baal, d’où Balaam vit une partie du peuple », la King James Version, comme la Bible synodale, traduisant le nom comme une expression. De là, Balak le mena au Pisga et au Peor, chacun une hauteur d’où l’on voyait le camp dans les plaines en bas. Josué la range comme ville parmi les villes de Ruben sur le haut plateau : « Dibon, Bamoth-Baal, Beth-Baal-Meon »."
    - "Presque tous la tiennent pour le Bamoth de l’itinéraire d’Israël, l’étape avant le Pisga, et peut-être pour le Beth-Bamoth que Mescha, roi de Moab, dit sur sa stèle avoir rebâti. Le nom révèle un sanctuaire de colline de type cananéen et moabite, le « haut lieu » que dénonçaient les prophètes, et la vue qu’exige le récit convient au bord occidental du plateau au-dessus de la mer Morte. Mais aucun site n’est connu : Khirbet el-Quweiqiyeh, Jebel Ataruz et Khirbet Libb ont chacun été suggérés, et aucune inscription n’a tranché. La région est le gouvernorat de Madaba, en Jordanie, entre Dhiban et le mont Nebo."
  it:
    - "Bamot-Baal, «le alture di Baal», era un santuario e una città sull’altopiano moabita a nord dell’Arnon. È anzitutto il luogo da cui Balaam vide Israele: la mattina dopo il suo arrivo «Balak prese Balaam e lo fece salire a Bamoth Baal, donde Balaam vide l’estremità del campo d’Israele», la King James Version, come la Bibbia sinodale, traducendo il nome come espressione. Di là Balak lo condusse al Pisga e a Peor, ciascuna un’altura con vista sull’accampamento nelle pianure sottostanti. Giosuè la elenca come città, fra le città di Ruben sull’altopiano: «Dibon, Bamoth-Baal, Beth-Baal-Meon»."
    - "Quasi tutti la ritengono la Bamot dell’itinerario d’Israele, la tappa prima del Pisga, e forse la Bet-Bamot che Mesa, re di Moab, dice sulla sua stele di aver ricostruito. Il nome mostra un santuario collinare del tipo cananeo e moabita, il «luogo alto» denunciato dai profeti, e la vista richiesta dal racconto si accorda con il margine occidentale dell’altopiano sopra il Mar Morto. Ma nessun sito è noto: Khirbet el-Quweiqiyeh, Jebel Ataruz e Khirbet Libb sono stati ciascuno suggeriti, e nessuna iscrizione ha deciso. La regione è il governatorato di Madaba in Giordania, tra Dhiban e il monte Nebo."
  pl:
    - "Bamot-Baal, „wyżyny Baalowe”, było sanktuarium i miastem na wyżynie Moabu na północ od Arnonu. Jest to najpierw miejsce, z którego Balaam ujrzał Izraela: nazajutrz po jego przybyciu „wziął Balak Balaama, i wprowadził go na wyżyny Baalowe, skąd widział i najdalszą część ludu”, a Biblia króla Jakuba, podobnie jak Biblia synodalna, oddaje tę nazwę jako wyrażenie. Stamtąd Balak poprowadził go do Pisgi i Peoru, wzniesień z widokiem na obóz w dole na równinach. Jozue wymienia je jako miasto, wśród miast Rubena na płaskowyżu: „Dybon i Bamot Baal, i Bet Baal Meon”."
    - "Prawie wszyscy uważają je za Bamot z itinerarium Izraela, stację przed Pisgą, a może za Bet-Bamot, które, jak mówi na swej steli Mesza, król Moabu, odbudował. Nazwa wskazuje na wzgórzowe sanktuarium kananejskiego i moabickiego rodzaju, „wyżynę”, którą potępiali prorocy, a widok wymagany przez opowieść pasuje do zachodniego skraju wyżyny nad Morzem Martwym. Lecz żadne miejsce nie jest znane: proponowano Chirbet el-Quweiqiyeh, Dżabal Ataruz i Chirbet Libb, a żaden napis nie rozstrzygnął sprawy. Region to muhafaza Madaba w Jordanii, między Dhiban a górą Nebo."
  nl:
    - "Bamot-Baäl, “de hoogten van Baäl”, was een heiligdom en stad op het Moabitische plateau ten noorden van de Arnon. Het is eerst de plaats vanwaar Bileam Israël zag: de ochtend na zijn aankomst “dat Balak Bileam nam, en voerde hem op de hoogten van Baal, dat hij van daar zag het uiterste des volks”, waarbij de King James Version, net als de Synodale Bijbel, de naam als zinsnede vertaalt. Van daar leidde Balak hem verder naar de Pisga en naar Peor, elk een hoogte met uitzicht op het kamp in de vlakten beneden. Jozua noemt het een stad, onder de steden van Ruben op het tafelland: “Dibon, en Bamoth-Baal, en Beth-Baal-Meon”."
    - "Bijna iedereen houdt het voor de Bamot van Israëls reisverslag, de standplaats vóór de Pisga, en misschien voor het Beth-Bamot dat Mesa, koning van Moab, op zijn stèle zegt te hebben herbouwd. De naam toont een heuvelheiligdom van het Kanaänitische en Moabitische type, de “hoogte” die de profeten aanklaagden, en het uitzicht dat het verhaal vereist, past bij de westrand van het plateau boven de Dode Zee. Maar geen plaats is bekend: Khirbet el-Quweiqiyeh, Jebel Ataruz en Khirbet Libb zijn elk voorgesteld, en geen opschrift heeft het beslecht. De streek is het gouvernement Madaba van Jordanië, tussen Dhiban en de berg Nebo."
  cs:
    - "Bamót-báal, „výšiny Baalovy“, byla svatyně a město na moábské planině severně od Arnonu. Je to nejprve místo, odkud Bileám viděl Izrael: ráno po jeho příchodu „pojav Balák Baláma, uvedl ho na výsosti modly Bál, odkudž shlédl i nejdalší díl lidu Izraelského“, přičemž Bible krále Jakuba, stejně jako synodální Bible, překládá jméno jako slovní spojení. Odtud ho Balak vedl dál na Pisgu a na Peór, každý výšinu s výhledem na tábor v pláních dole. Jozue je uvádí jako město mezi městy Rúbenovými na vysočině: „Dibon a Bamotbal a Betbalmeon“."
    - "Téměř všichni v něm vidí Bamót z Izraelova itineráře, stanici před Pisgou, a snad i Bét-bamót, který podle své stély Meša, král Moábu, přestavěl. Jméno ukazuje na pahorkovou svatyni kenaanského a moábského druhu, „výsost“, kterou proroci odsuzovali, a výhled, který příběh vyžaduje, odpovídá západnímu okraji planiny nad Mrtvým mořem. Ale žádné místo není známo: navrženy byly Chirbet el-Quweiqiyeh, Jebel Ataruz a Chirbet Libb a žádný nápis věc nerozhodl. Oblast je guvernorát Madaba v Jordánsku, mezi Dhibánem a horou Nebo."
  sv:
    - "Bamot-Baal, ”Baals offerhöjder”, var en helgedom och stad på Moabs platå norr om Arnon. Det är först platsen varifrån Bileam såg Israel: morgonen efter hans ankomst ”tog Balak Bileam med sig och förde honom upp på Bamot-Baal; och han kunde från denna plats se en del av folket”, medan King James-översättningen, liksom synodalbibeln, översätter namnet som en fras. Därifrån förde Balak honom vidare till Pisga och till Peor, båda höjder med utsikt över lägret på slätterna nedanför. Josua upptar den som en stad, bland Rubens städer på högplatån: ”Dibon, Bamot-Baal, Bet-Baal-Meon”."
    - "Nästan alla tar den för Bamot i Israels vandringsförteckning, stationen före Pisga, och kanske för det Bet-Bamot som Mesha, Moabs kung, på sin stele säger att han byggde upp. Namnet visar en kullhelgedom av kananeiskt och moabitiskt slag, den offerhöjd som profeterna fördömde, och utsikten som berättelsen kräver passar platåns västra kant ovanför Döda havet. Men ingen plats är känd: Khirbet el-Quweiqiyeh, Jebel Ataruz och Khirbet Libb har var och en föreslagits, och ingen inskrift har avgjort saken. Trakten är Jordaniens guvernement Madaba, mellan Dhiban och Nebo."
  nb:
    - "Bamot-Baal, «Baals offerhauger», var en helligdom og by på Moabs høyslette nord for Arnon. Det er først stedet Bileam så Israel fra: morgenen etter ankomsten «tok Balak Bileam med sig og førte ham op på Bamot Ba'al; derfra så han den ytterste del av folket», der King James-oversettelsen, i likhet med synodalbibelen, gjengir navnet som en frase. Derfra førte Balak ham videre til Pisga og til Peor, hver en høyde med utsikt over leiren på slettene nedenfor. Josva oppfører det som en by, blant Rubens byer på høylandet: «Dibon og Bamot-Ba'al og Bet-Ba'al-Meon»."
    - "Nesten alle tar det for Bamot i Israels reiserute, stasjonen før Pisga, og kanskje for Bet-Bamot som Mesa, konge av Moab, på steleen sin sier han gjenreiste. Navnet viser en høydehelligdom av kana'anittisk og moabittisk slag, «offerhaugen» profetene fordømte, og utsikten fortellingen forutsetter, passer med vestkanten av høysletten over Dødehavet. Men intet sted er kjent: Khirbet el-Quweiqiyeh, Jebel Ataruz og Khirbet Libb er hver blitt foreslått, og ingen innskrift har avgjort saken. Området er Madaba-guvernementet i Jordan, mellom Dhiban og Nebo."
  tl:
    - "Ang Bamoth-baal, “ang matataas na dako ni Baal”, ay santuwaryo at bayan sa talampas ng Moab sa hilaga ng Arnon. Ito muna ang lugar kung saan nakita ni Balaam ang Israel: sa umaga pagkadating niya, “isinama ni Balac si Balaam at isinampa siya sa matataas na dako ni Baal, at kaniyang nakita mula roon ang katapustapusang bahagi ng bayan”, na isinasalin ng King James Version, gaya ng Sinodal na Biblia, ang pangalan bilang parirala. Mula roon, dinala siya ni Balac sa Pisga at sa Peor, bawat isa'y kataasang tanaw ang kampo sa kapatagan sa ibaba. Inililista ito ni Josue bilang bayan, sa mga lungsod ni Ruben sa kapatagan: “ang Dibon at ang Bamoth-baal, at ang Beth-baal-meon”."
    - "Halos lahat ay nagtuturing dito na Bamoth ng paglalakbay ng Israel, ang himpilan bago ang Pisga, at marahil ang Beth-bamoth na sinasabi ni Mesa, hari ng Moab, sa kaniyang estela na muli niyang itinayo. Ipinapakita ng pangalan ang santuwaryo sa burol ng uri ng Cananeo at Moabita, ang “mataas na dako” na kinondena ng mga propeta, at angkop ang tanawing kailangan ng kuwento sa kanlurang gilid ng talampas sa itaas ng Dagat na Patay. Ngunit walang kilalang lugar: iminungkahi ang Khirbet el-Quweiqiyeh, Jebel Ataruz at Khirbet Libb, at walang inskripsiyong nagpasiya. Ang rehiyon ay Gobernorado ng Madaba ng Jordan, sa pagitan ng Dhiban at Bundok Nebo."
  da:
    - "Bamot-Ba'al, »Ba'als offerhøje«, var en helligdom og by på Moabs højslette nord for Arnon. Det er først stedet, hvorfra Bileam så Israel: morgenen efter hans ankomst »tog Balak Bileam og førte ham op paa Baals Høje; og han saa derfra det yderste af Folket«, idet King James Version, ligesom synodalbibelen, oversætter navnet som en frase. Derfra førte Balak ham videre til Pisga og til Peor, hver en højde med udsigt over lejren i sletterne nedenfor. Josva opregner det som en by blandt Rubens byer på højsletten: »Dibon og Bamoth-Baal og Beth-Baal-Meon«."
    - "Næsten alle tager det for Israels rejseberetnings Bamot, stationen før Pisga, og måske for det Bet-Bamot, som Mesja, Moabs konge, siger på sin stele, at han genopbyggede. Navnet viser en højhelligdom af den kana'anæiske og moabitiske slags, den »offerhøj«, profeterne fordømte, og udsigten, som fortællingen kræver, passer til højslettens vestlige rand over Det Døde Hav. Men intet sted er kendt: Khirbet el-Quweiqiyeh, Jebel Ataruz og Khirbet Libb er hver blevet foreslået, og ingen indskrift har afgjort det. Egnen er Madaba-guvernementet i Jordan, mellem Dhiban og Nebo."
