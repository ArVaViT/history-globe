# Overview article (ADR 0007). Mainstream facts only; disputed identifications and authorship are named as such.
id: miletus
place: a55027d
title:
  en: "Miletus"
  ru: "Милит"
body:
  en:
    - "Miletus stood on a peninsula near the mouth of the Maeander on the west coast of Asia Minor; the river's silt has since left its ruins, by the village of Balat in Turkey, several kilometres inland. Minoan and then Mycenaean settlers lived there in the Bronze Age, and the town is usually identified with Millawanda of the Hittite texts. Strabo records a tradition that Cretans first settled the place and that Neleus and his followers later founded the Ionian city."
    - "In the archaic age Miletus was one of the richest Greek cities. Strabo says it planted colonies all around the Black Sea and the Propontis, and it was the home of Thales, Anaximander and Anaximenes, the first Greek natural philosophers. Miletus led the Ionian revolt against Persia; in 494 BC, after the Ionian fleet was defeated off the island of Lade, the Persians took the city, killed most of the men, enslaved the women and children and burned the sanctuary at Didyma. Rebuilt on a regular grid, Miletus shut its gates against Alexander the Great in 334 BC and was taken by assault."
    - "Under Rome the city had a Jewish community: Josephus preserves a letter in which the proconsul Publius Servilius told the Milesians not to stop the Jews from keeping their Sabbaths and ancestral rites. About AD 57, on his last journey to Jerusalem, Paul sailed past Ephesus and stopped at Miletus. He sent for the elders of the church at Ephesus and gave them his farewell address; they prayed together, grieved that they would not see his face again, and went with him to the ship. Second Timothy says that Paul left Trophimus sick at Miletus."
    - "In the Roman imperial period Miletus was adorned with public buildings: the theatre was greatly enlarged, baths named after the empress Faustina, wife of Marcus Aurelius, were built, and a monumental market gate, now in the Pergamon Museum in Berlin, was set up. Its bishop Eusebius attended the Council of Nicaea in 325. As the Maeander silted up its harbours, the city slowly shrank."
  ru:
    - "Милит стоял на полуострове близ устья Меандра на западном побережье Малой Азии; наносы реки с тех пор отодвинули его руины, у турецкой деревни Балат, на несколько километров от моря. В бронзовом веке здесь жили минойские, а затем микенские поселенцы, и город обычно отождествляют с Милавандой хеттских текстов. Страбон передаёт предание, что первыми здесь поселились критяне, а позднее Нелей со своими спутниками основал ионийский город."
    - "В архаическую эпоху Милит был одним из богатейших греческих городов. По словам Страбона, он основал колонии по всему Понту Евксинскому и Пропонтиде, а здесь жили Фалес, Анаксимандр и Анаксимен — первые греческие натурфилософы. Милит возглавил Ионийское восстание против Персии; в 494 г. до н. э., после поражения ионийского флота у острова Лада, персы взяли город, перебили большинство мужчин, обратили в рабство женщин и детей и сожгли святилище в Дидимах. Отстроенный по правильной сетке улиц, Милит закрыл ворота перед Александром Македонским в 334 г. до н. э. и был взят приступом."
    - "При римлянах в городе была иудейская община: Иосиф Флавий сохранил письмо, в котором проконсул Публий Сервилий велел милетянам не запрещать иудеям соблюдать субботы и отеческие обряды. Около 57 г. н. э., на последнем пути в Иерусалим, Павел миновал Ефес и остановился в Милите. Он призвал пресвитеров ефесской церкви и обратился к ним с прощальным словом; они помолились вместе, скорбя, что уже не увидят лица его, и проводили его до корабля. Второе послание к Тимофею говорит, что Павел оставил Трофима больного в Милите."
    - "В римскую императорскую эпоху Милит украсился общественными зданиями: театр был сильно расширен, построены термы, названные в честь императрицы Фаустины, жены Марка Аврелия, а возведённые тогда монументальные Рыночные ворота стоят теперь в Пергамском музее в Берлине. Его епископ Евсевий участвовал в Никейском соборе 325 г. По мере того как Меандр заносил гавани илом, город постепенно сокращался."
