body:
  en:
    - "Miletus stood on a peninsula near the mouth of the Maeander on the west coast of Asia Minor; the river's silt has since left its ruins, by the village of Balat in Turkey, several kilometres inland. Minoan and then Mycenaean settlers lived there in the Bronze Age, and the town is usually identified with Millawanda of the Hittite texts. Strabo records a tradition that Cretans first settled the place and that Neleus and his followers later founded the Ionian city."
    - "In the archaic age Miletus was one of the richest Greek cities. Strabo says it planted colonies all around the Black Sea and the Propontis, and it was the home of Thales, Anaximander and Anaximenes, the first Greek natural philosophers. Miletus led the Ionian revolt against Persia; in 494 BC, after the Ionian fleet was defeated off the island of Lade, the Persians took the city, killed most of the men, enslaved the women and children and burned the sanctuary at Didyma. Rebuilt on a regular grid, Miletus shut its gates against Alexander the Great in 334 BC and was taken by assault."
    - "Under Rome the city had a Jewish community: Josephus preserves a letter in which the proconsul Publius Servilius told the Milesians not to stop the Jews from keeping their Sabbaths and ancestral rites. About AD 57, on his last journey to Jerusalem, Paul sailed past Ephesus and stopped at Miletus. He sent for the elders of the church at Ephesus and gave them his farewell address; they prayed together, grieved that they would not see his face again, and went with him to the ship. Second Timothy says that Paul left Trophimus sick at Miletus."
    - "In the Roman imperial period Miletus was adorned with public buildings: the theatre was greatly enlarged, baths named after the empress Faustina, wife of Marcus Aurelius, were built, and a monumental market gate, now in the Pergamon Museum in Berlin, was set up. Its bishop Eusebius attended the Council of Nicaea in 325. As the Maeander silted up its harbours, the city slowly shrank."
  ru:
    - "Милит стоял на полуострове близ устья Меандра на западном побережье Малой Азии; наносы реки с тех пор отодвинули его руины, у турецкой деревни Балат, на несколько километров от моря. В бронзовом веке здесь жили минойские, а затем микенские поселенцы, и город обычно отождествляют с Милавандой хеттских текстов. Страбон передаёт предание, что первыми здесь поселились критяне, а позднее Нелей со своими спутниками основал ионийский город."
    - "В архаическую эпоху Милит был одним из богатейших греческих городов. По словам Страбона, он основал колонии по всему Понту Евксинскому и Пропонтиде, а здесь жили Фалес, Анаксимандр и Анаксимен — первые греческие натурфилософы. Милит возглавил Ионийское восстание против Персии; в 494 г. до н. э., после поражения ионийского флота у острова Лада, персы взяли город, перебили большинство мужчин, обратили в рабство женщин и детей и сожгли святилище в Дидимах. Отстроенный по правильной сетке улиц, Милит закрыл ворота перед Александром Македонским в 334 г. до н. э. и был взят приступом."
    - "При римлянах в городе была иудейская община: Иосиф Флавий сохранил письмо, в котором проконсул Публий Сервилий велел милетянам не запрещать иудеям соблюдать субботы и отеческие обряды. Около 57 г. н. э., на последнем пути в Иерусалим, Павел миновал Ефес и остановился в Милите. Он призвал пресвитеров ефесской церкви и обратился к ним с прощальным словом; они помолились вместе, скорбя, что уже не увидят лица его, и проводили его до корабля. Второе послание к Тимофею говорит, что Павел оставил Трофима больного в Милите."
    - "В римскую императорскую эпоху Милит украсился общественными зданиями: театр был сильно расширен, построены термы, названные в честь императрицы Фаустины, жены Марка Аврелия, а возведённые тогда монументальные Рыночные ворота стоят теперь в Пергамском музее в Берлине. Его епископ Евсевий участвовал в Никейском соборе 325 г. По мере того как Меандр заносил гавани илом, город постепенно сокращался."
  uk:
    - "Мілет стояв на півострові поблизу гирла Меандра на західному березі Малої Азії; мул ріки відтоді залишив його руїни, біля села Балат у Туреччині, на кілька кілометрів углиб суходолу. Мінойські, а потім мікенські поселенці жили там у бронзову добу, і місто зазвичай ототожнюють із Мілавандою хетських текстів. Страбон записує переказ, що критяни першими оселилися там, а Нелей і його послідовники пізніше заснували іонійське місто."
    - "В архаїчну добу Мілет був одним із найбагатших грецьких міст. Страбон каже, що він заснував колонії навколо всього Чорного моря й Пропонтиди, і він був батьківщиною Фалеса, Анаксимандра й Анаксимена, перших грецьких натурфілософів. Мілет очолив іонійське повстання проти Персії; 494 р. до н. е., після поразки іонійського флоту біля острова Ладе, перси взяли місто, вбили більшість чоловіків, поневолили жінок і дітей та спалили святилище в Дідімі. Відбудований за правильною сіткою, Мілет зачинив брами перед Александром Великим 334 р. до н. е. і був узятий штурмом."
    - "За Риму в місті була єврейська громада: Йосиф Флавій зберігає лист, в якому проконсул Публій Сервілій наказав мілетянам не заважати євреям дотримуватися суботи й батьківських обрядів. Близько 57 р. н. е., в останній подорожі до Єрусалима, Павло проплив повз Ефес і зупинився в Мілеті. Він послав по старших церкви в Ефесі й виголосив їм прощальну промову; вони молилися разом, сумували, що вже не побачать його обличчя, і пішли з ним до корабля. Друге послання до Тимофія каже, що Павло залишив Трофима хворого в Мілеті."
    - "За римської імперії Мілет прикрасили громадськими спорудами: театр сильно розширили, збудували лазні, названі за імператрицею Фаустиною, дружиною Марка Аврелія, і поставили монументальну ринкову браму, нині в Пергамському музеї в Берліні. Його єпископ Євсевій був на Нікейському соборі 325 р. Оскільки Меандр замулював його гавані, місто повільно зменшувалося."
  es:
    - "Mileto se alzaba en una península cerca de la desembocadura del Meandro, en la costa occidental de Asia Menor; el limo del río ha dejado desde entonces sus ruinas, junto a la aldea de Balat, en Turquía, a varios kilómetros tierra adentro. Colonos minoicos y luego micénicos vivieron allí en la Edad del Bronce, y la ciudad se identifica habitualmente con la Millawanda de los textos hititas. Estrabón recoge una tradición según la cual los cretenses se establecieron primero en el lugar y Neleo y sus seguidores fundaron más tarde la ciudad jonia."
    - "En la época arcaica, Mileto fue una de las ciudades griegas más ricas. Estrabón dice que fundó colonias en torno al mar Negro y la Propóntide, y fue la patria de Tales, Anaximandro y Anaxímenes, los primeros filósofos naturales griegos. Mileto encabezó la rebelión jonia contra Persia; en 494 a. C., tras la derrota de la flota jonia frente a la isla de Lade, los persas tomaron la ciudad, mataron a la mayoría de los hombres, esclavizaron a las mujeres y a los niños e incendiaron el santuario de Dídima. Reconstruida sobre una cuadrícula regular, Mileto cerró sus puertas a Alejandro Magno en 334 a. C. y fue tomada al asalto."
    - "Bajo Roma la ciudad tuvo una comunidad judía: Josefo conserva una carta en la que el procónsul Publio Servilio decía a los milesios que no impidieran a los judíos guardar sus sábados y ritos ancestrales. Hacia 57 d. C., en su último viaje a Jerusalén, Pablo navegó pasando de largo Éfeso y se detuvo en Mileto. Mandó llamar a los ancianos de la iglesia de Éfeso y les dirigió su discurso de despedida; oraron juntos, se afligieron de que no volverían a ver su rostro y lo acompañaron hasta la nave. La Segunda a Timoteo dice que Pablo dejó enfermo a Trófimo en Mileto."
    - "En la época imperial romana, Mileto se adornó con edificios públicos: el teatro fue muy ampliado, se construyeron unas termas con el nombre de la emperatriz Faustina, esposa de Marco Aurelio, y se erigió una monumental puerta del mercado, hoy en el Museo de Pérgamo de Berlín. Su obispo Eusebio asistió al Concilio de Nicea en 325. A medida que el Meandro colmataba sus puertos, la ciudad fue menguando lentamente."
  pt:
    - "Mileto ficava numa península perto da foz do Meandro, na costa oeste da Ásia Menor; o limo do rio deixou desde então suas ruínas, junto à aldeia de Balat, na Turquia, vários quilômetros para o interior. Colonos minoicos e depois micênicos viveram ali na Idade do Bronze, e a cidade é geralmente identificada com Millawanda dos textos hititas. Estrabão registra uma tradição de que cretenses primeiro se estabeleceram no lugar e de que Neleu e seus seguidores depois fundaram a cidade jônica."
    - "Na época arcaica, Mileto foi uma das mais ricas cidades gregas. Estrabão diz que plantou colônias em todo o mar Negro e na Propôntida, e foi a pátria de Tales, Anaximandro e Anaxímenes, os primeiros filósofos naturais gregos. Mileto liderou a revolta jônica contra a Pérsia; em 494 a.C., depois que a frota jônica foi derrotada ao largo da ilha de Lade, os persas tomaram a cidade, mataram a maioria dos homens, escravizaram mulheres e crianças e queimaram o santuário de Dídima. Reconstruída em traçado regular, Mileto fechou os portões a Alexandre Magno em 334 a.C. e foi tomada de assalto."
    - "Sob Roma a cidade teve uma comunidade judaica: Josefo preserva uma carta em que o procônsul Públio Servílio mandou os milésios não impedirem os judeus de guardar seus sábados e ritos ancestrais. Por volta de 57 d.C., em sua última viagem a Jerusalém, Paulo passou ao largo de Éfeso e parou em Mileto. Mandou chamar os presbíteros da igreja de Éfeso e fez-lhes o discurso de despedida; oraram juntos, entristecidos por não verem mais o seu rosto, e o acompanharam até o navio. A Segunda Carta a Timóteo diz que Paulo deixou Trófimo doente em Mileto."
    - "No período imperial romano, Mileto foi adornada com edifícios públicos: o teatro foi muito ampliado, construíram-se termas com o nome da imperatriz Faustina, mulher de Marco Aurélio, e ergueu-se um monumental portão do mercado, hoje no Museu de Pérgamo, em Berlim. Seu bispo Eusébio compareceu ao Concílio de Niceia em 325. À medida que o Meandro assoreava seus portos, a cidade foi lentamente encolhendo."
  de:
    - "Milet lag auf einer Halbinsel nahe der Mündung des Mäander an der Westküste Kleinasiens; der Schlick des Flusses hat seine Ruinen beim Dorf Balat in der Türkei inzwischen mehrere Kilometer ins Landesinnere gerückt. Minoische und dann mykenische Siedler lebten dort in der Bronzezeit, und die Stadt wird meist mit Millawanda der hethitischen Texte gleichgesetzt. Strabon überliefert, dass zuerst Kreter den Ort besiedelten und dass Neleus und seine Gefolgsleute später die ionische Stadt gründeten."
    - "In archaischer Zeit war Milet eine der reichsten griechischen Städte. Strabon sagt, es habe Kolonien rings um das Schwarze Meer und die Propontis gegründet, und es war die Heimat von Thales, Anaximander und Anaximenes, den ersten griechischen Naturphilosophen. Milet führte den ionischen Aufstand gegen Persien an; 494 v. Chr., nach der Niederlage der ionischen Flotte vor der Insel Lade, nahmen die Perser die Stadt ein, töteten die meisten Männer, versklavten Frauen und Kinder und verbrannten das Heiligtum von Didyma. Auf regelmäßigem Raster wieder aufgebaut, verschloss Milet 334 v. Chr. Alexander dem Großen die Tore und wurde im Sturm genommen."
    - "Unter Rom hatte die Stadt eine jüdische Gemeinde: Josephus bewahrt einen Brief, in dem der Prokonsul Publius Servilius den Milesiern auftrug, die Juden nicht an der Feier ihrer Sabbate und väterlichen Riten zu hindern. Um 57 n. Chr., auf seiner letzten Reise nach Jerusalem, fuhr Paulus an Ephesus vorbei und hielt in Milet. Er ließ die Ältesten der Gemeinde von Ephesus rufen und hielt ihnen seine Abschiedsrede; sie beteten gemeinsam, trauerten, dass sie sein Angesicht nicht mehr sehen würden, und geleiteten ihn zum Schiff. Der Zweite Timotheusbrief sagt, Paulus habe Trophimus krank in Milet zurückgelassen."
    - "In der römischen Kaiserzeit wurde Milet mit öffentlichen Bauten geschmückt: Das Theater wurde stark erweitert, Thermen nach der Kaiserin Faustina, der Frau Marc Aurels, wurden gebaut, und ein monumentales Markttor, heute im Pergamonmuseum in Berlin, wurde errichtet. Sein Bischof Eusebius nahm 325 am Konzil von Nicäa teil. Als der Mäander seine Häfen verlandete, schrumpfte die Stadt langsam."
  fr:
    - "Milet se dressait sur une péninsule près de l’embouchure du Méandre, sur la côte ouest de l’Asie Mineure ; les alluvions du fleuve ont depuis laissé ses ruines, près du village de Balat en Turquie, à plusieurs kilomètres à l’intérieur des terres. Des colons minoens puis mycéniens y vécurent à l’âge du Bronze, et la ville est d’ordinaire identifiée à Millawanda des textes hittites. Strabon rapporte une tradition selon laquelle des Crétois s’y établirent les premiers et Nélée et ses compagnons fondèrent plus tard la cité ionienne."
    - "À l’époque archaïque, Milet fut l’une des plus riches cités grecques. Strabon dit qu’elle fonda des colonies tout autour de la mer Noire et de la Propontide, et elle fut la patrie de Thalès, d’Anaximandre et d’Anaximène, les premiers philosophes grecs de la nature. Milet mena la révolte ionienne contre la Perse ; en 494 av. J.-C., après la défaite de la flotte ionienne au large de l’île de Ladé, les Perses prirent la ville, tuèrent la plupart des hommes, réduisirent en esclavage les femmes et les enfants et brûlèrent le sanctuaire de Didymes. Reconstruite selon un plan régulier en damier, Milet ferma ses portes à Alexandre le Grand en 334 av. J.-C. et fut prise d’assaut."
    - "Sous Rome, la ville avait une communauté juive : Flavius Josèphe conserve une lettre dans laquelle le proconsul Publius Servilius dit aux Milésiens de ne pas empêcher les Juifs d’observer leurs sabbats et leurs rites ancestraux. Vers 57 apr. J.-C., lors de son dernier voyage à Jérusalem, Paul passa au large d’Éphèse et s’arrêta à Milet. Il fit venir les anciens de l’Église d’Éphèse et leur adressa son discours d’adieu ; ils prièrent ensemble, affligés de ne plus revoir son visage, et l’accompagnèrent jusqu’au navire. La deuxième lettre à Timothée dit que Paul laissa Trophime malade à Milet."
    - "À l’époque impériale romaine, Milet fut ornée d’édifices publics : le théâtre fut très agrandi, des thermes portant le nom de l’impératrice Faustine, épouse de Marc Aurèle, furent construits, et une porte monumentale du marché, aujourd’hui au musée de Pergame à Berlin, fut élevée. Son évêque Eusèbe assista au concile de Nicée en 325. À mesure que le Méandre ensablait ses ports, la ville se réduisit lentement."
  it:
    - "Mileto sorgeva su una penisola presso la foce del Meandro sulla costa occidentale dell’Asia Minore; i sedimenti del fiume hanno poi lasciato le sue rovine, presso il villaggio di Balat in Turchia, a diversi chilometri nell’entroterra. Coloni minoici e poi micenei vi abitarono nell’età del Bronzo, e la città è di solito identificata con la Millawanda dei testi ittiti. Strabone riporta una tradizione secondo cui dei Cretesi si stabilirono per primi nel luogo e Neleo e i suoi seguaci fondarono poi la città ionica."
    - "In età arcaica Mileto fu una delle città greche più ricche. Strabone dice che fondò colonie tutt’intorno al Mar Nero e alla Propontide, e fu la patria di Talete, Anassimandro e Anassimene, i primi filosofi naturalisti greci. Mileto guidò la rivolta ionica contro la Persia; nel 494 a.C., dopo che la flotta ionica fu sconfitta presso l’isola di Lade, i Persiani presero la città, uccisero la maggior parte degli uomini, ridussero in schiavitù donne e bambini e incendiarono il santuario di Didima. Ricostruita su una pianta regolare, Mileto chiuse le porte ad Alessandro Magno nel 334 a.C. e fu presa d’assalto."
    - "Sotto Roma la città ebbe una comunità ebraica: Giuseppe Flavio conserva una lettera in cui il proconsole Publio Servilio disse ai Milesi di non impedire agli ebrei di osservare i loro sabati e i riti ancestrali. Verso il 57 d.C., nell’ultimo viaggio a Gerusalemme, Paolo passò davanti a Efeso e si fermò a Mileto. Fece chiamare gli anziani della chiesa di Efeso e pronunciò il suo discorso di addio; pregarono insieme, afflitti di non rivedere più il suo volto, e lo accompagnarono alla nave. La Seconda lettera a Timoteo dice che Paolo lasciò Trofimo malato a Mileto."
    - "In età imperiale romana Mileto fu adorna di edifici pubblici: il teatro fu molto ingrandito, furono costruite terme intitolate all’imperatrice Faustina, moglie di Marco Aurelio, e fu eretta una monumentale porta del mercato, oggi nel Pergamonmuseum di Berlino. Il suo vescovo Eusebio partecipò al Concilio di Nicea nel 325. Man mano che il Meandro insabbiava i suoi porti, la città si ridusse lentamente."
  pl:
    - "Milet leżał na półwyspie koło ujścia Meandru na zachodnim wybrzeżu Azji Mniejszej; muł rzeki pozostawił od tamtej pory jego ruiny, przy wsi Balat w Turcji, kilka kilometrów w głębi lądu. W epoce brązu mieszkali tam osadnicy minojscy, a potem mykeńscy, a miasto utożsamia się zwykle z Millawanda z tekstów hetyckich. Strabon zapisuje tradycję, że Kreteńczycy osiedlili się tu pierwsi, a Neleus i jego towarzysze założyli później miasto jońskie."
    - "W epoce archaicznej Milet był jednym z najbogatszych miast greckich. Strabon mówi, że założył kolonie wokół całego Morza Czarnego i Propontydy, i był ojczyzną Talesa, Anaksymandra i Anaksymenesa, pierwszych greckich filozofów przyrody. Milet poprowadził jońskie powstanie przeciw Persji; w 494 r. p.n.e., po pokonaniu floty jońskiej koło wyspy Lade, Persowie zdobyli miasto, wybili większość mężczyzn, zniewolili kobiety i dzieci i spalili sanktuarium w Didymie. Odbudowany według regularnej siatki, Milet zamknął bramy przed Aleksandrem Wielkim w 334 r. p.n.e. i został zdobyty szturmem."
    - "Pod rządami Rzymu w mieście była gmina żydowska: Józef Flawiusz zachował list, w którym prokonsul Publiusz Serwiliusz nakazał Milezyjczykom nie przeszkadzać Żydom w zachowywaniu szabatów i obrzędów ojczystych. Około 57 r. n.e., w ostatniej podróży do Jerozolimy, Paweł przepłynął obok Efezu i zatrzymał się w Milecie. Posłał po starszych kościoła w Efezie i wygłosił im swoją mowę pożegnalną; modlili się razem, zasmuceni, że nie ujrzą już jego twarzy, i odprowadzili go na okręt. Drugi List do Tymoteusza mówi, że Paweł zostawił Trofima chorego w Milecie."
    - "W rzymskim okresie cesarskim Milet ozdobiono budowlami publicznymi: teatr został znacznie powiększony, zbudowano łaźnie nazwane od cesarzowej Faustyny, żony Marka Aureliusza, i wzniesiono monumentalną bramę targową, dziś w Muzeum Pergamońskim w Berlinie. Jego biskup Euzebiusz uczestniczył w Soborze Nicejskim w 325 r. Gdy Meander zamulał jego porty, miasto powoli się kurczyło."
  nl:
    - "Milete lag op een schiereiland bij de monding van de Meander aan de westkust van Klein-Azië; het slib van de rivier heeft haar ruïnes, bij het dorp Balat in Turkije, sindsdien enkele kilometers landinwaarts gelaten. Minoïsche en daarna Myceense kolonisten woonden er in de bronstijd, en de stad wordt gewoonlijk geïdentificeerd met Millawanda uit de Hettitische teksten. Strabo noteert een overlevering dat Kretenzers de plaats het eerst bewoonden en dat Neleus en zijn volgelingen later de Ionische stad stichtten."
    - "In de archaïsche tijd was Milete een van de rijkste Griekse steden. Strabo zegt dat zij kolonies stichtte rond de hele Zwarte Zee en de Propontis, en het was de woonplaats van Thales, Anaximandros en Anaximenes, de eerste Griekse natuurfilosofen. Milete leidde de Ionische opstand tegen Perzië; in 494 v.Chr., nadat de Ionische vloot bij het eiland Lade was verslagen, namen de Perzen de stad in, doodden de meeste mannen, maakten vrouwen en kinderen tot slaaf en verbrandden het heiligdom te Didyma. Herbouwd volgens een regelmatig raster sloot Milete in 334 v.Chr. haar poorten voor Alexander de Grote en werd bij een bestorming ingenomen."
    - "Onder Rome had de stad een joodse gemeenschap: Josephus bewaart een brief waarin de proconsul Publius Servilius de Milesiërs zei de joden niet te beletten hun sabbatten en voorvaderlijke riten te houden. Omstreeks 57 n.Chr., op zijn laatste reis naar Jeruzalem, voer Paulus Efeze voorbij en bleef te Milete. Hij liet de oudsten van de gemeente van Efeze komen en hield voor hen zijn afscheidsrede; zij baden samen, treurden dat zij zijn gezicht niet meer zouden zien, en vergezelden hem naar het schip. Tweede Timoteüs zegt dat Paulus Trofimus ziek te Milete achterliet."
    - "In de Romeinse keizertijd werd Milete verfraaid met openbare gebouwen: het theater werd sterk vergroot, baden genoemd naar keizerin Faustina, echtgenote van Marcus Aurelius, werden gebouwd, en een monumentale marktpoort, nu in het Pergamonmuseum in Berlijn, werd opgericht. Haar bisschop Eusebius woonde het Concilie van Nicea in 325 bij. Naarmate de Meander haar havens deed verzanden, kromp de stad langzaam."
  cs:
    - "Milét stál na poloostrově poblíž ústí Maiandru na západním pobřeží Malé Asie; naplaveniny řeky od té doby zanechaly jeho zříceniny u vsi Balat v Turecku několik kilometrů ve vnitrozemí. V době bronzové tam žili minojští a pak mykénští osadníci a město se obvykle ztotožňuje s Millawandou chetitských textů. Strabón zaznamenává tradici, že místo nejprve osídlili Kréťané a že Neleus a jeho druhové později založili iónské město."
    - "V archaické době byl Milét jedním z nejbohatších řeckých měst. Strabón praví, že vysadil kolonie všude kolem Černého moře a Propontidy, a byl domovem Thaléta, Anaximandra a Anaximena, prvních řeckých přírodních filosofů. Milét vedl iónské povstání proti Persii; roku 494 př. n. l., po porážce iónské flotily u ostrova Lade, Peršané město dobyli, většinu mužů pobili, ženy a děti zotročili a spálili svatyni v Didymách. Znovu vystavěn na pravidelném rastru zavřel Milét roku 334 př. n. l. brány před Alexandrem Velikým a byl dobyt útokem."
    - "Za Říma měl Milét židovskou obec: Josephus zachoval dopis, v němž prokonzul Publius Servilius nařídil Milétským, aby Židům nebránili ve zachovávání sabatů a otcovských obřadů. Kolem roku 57 n. l., na své poslední cestě do Jeruzaléma, Pavel minul Efez a zastavil se v Milétu. Poslal pro starší církve v Efezu a pronesl jim svou loučící řeč; společně se modlili, naříkali, že už neuvidí jeho tvář, a provodili ho k lodi. Druhý list Timoteovi praví, že Pavel nechal Trofima nemocného v Milétu."
    - "V římské císařské době byl Milét ozdoben veřejnými stavbami: divadlo bylo značně zvětšeno, byly postaveny lázně pojmenované po císařovně Faustině, manželce Marka Aurelia, a vztyčena monumentální tržní brána, nyní v Pergamonském muzeu v Berlíně. Jeho biskup Eusebius se zúčastnil koncilu v Nikaii roku 325. Jak Maiandros zanášel jeho přístavy, město pomalu mizelo."
