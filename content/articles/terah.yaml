# Overview article (ADR 0007). Mainstream facts only; the station Tarah of Numbers 33 (named Terah in the data); unlocated, placed by the app only relative to its neighbours.
id: terah
place: a944b90
title:
  en: "Terah"
  ru: "Тарах"
  uk: "Тарах"
  es: "Tara"
  pt: "Terá"
  de: "Tarach"
  fr: "Tarach"
body:
  en:
    - "Terah, spelled Tarah in the King James Version, is a camp of Israel in the wilderness known only from the list of stations in Numbers 33: “And they departed from Tahath, and pitched at Tarah. And they removed from Tarah, and pitched in Mithcah.” It is one of the run of stations between Hazeroth and Kadesh, most of which appear nowhere else in the Bible, and the text tells of no event there. In Hebrew the name has the same consonants as that of Terah, Abraham's father, but nothing links the two."
    - "Nothing more is known, and no site has been proposed with any confidence. How the itinerary of Numbers 33 relates to the real ground is itself debated, and the stations between Hazeroth and Ezion-geber cannot be fixed on the map. The map places Terah only approximately, within about 50 km of its neighbour Mithcah, which is equally unknown."
  ru:
    - "Тарах — стан Израиля в пустыне, известный только по перечню стоянок в 33-й главе книги Чисел: «И отправились из Тахафа и расположились станом в Тарахе. И отправились из Тараха и расположились станом в Мифке». Он входит в череду стоянок между Асирофом и Кадесом, большинство которых больше нигде в Библии не встречается, и текст не сообщает ни о каком событии там. По-еврейски у имени те же согласные, что у имени Фарры, отца Авраама, но ничто их не связывает."
    - "Больше ничего не известно, и ни одного места с уверенностью не предложено. Как маршрут 33-й главы Чисел соотносится с местностью, само по себе спорно, и стоянки между Асирофом и Ецион-Гавером на карте не установить. Тарах на ней помещён лишь приблизительно, в пределах около 50 км от соседней Мифки, которая так же неизвестна."
  uk:
    - "Тарах, у перекладі Куліша Тарата, — табір Ізраїлю в пустелі, відомий лише з переліку стоянок у Числах 33: «І рушили з Талати та й отаборились у Таратї. І рушили з Тарати та й отаборились у Митцї». Це одна зі стоянок між Хацеротом і Кадешем, більшість яких більше ніде в Біблії не з’являються, і текст не розповідає про жодну подію там. Староєврейською назва має ті самі приголосні, що й ім’я Тари, батька Авраама, але нічого не пов’язує їх."
    - "Більше нічого не відомо, і жодного місця не запропоновано з певністю. Як перелік Чисел 33 співвідноситься зі справжньою місцевістю, саме по собі дискутується, і стоянки між Хацеротом та Еціон-Гевером неможливо закріпити на мапі. Мапа позначає Тарах лише приблизно, в межах близько 50 км від його сусідки Мітки, яка так само невідома."
  es:
    - "Tara, escrita Tarah en la versión King James, es un campamento de Israel en el desierto conocido solo por la lista de estaciones de Números 33: «Y partidos de Tahath, asentaron en Tara. Y partidos de Tara, asentaron en Mithca». Es una de la serie de estaciones entre Haserot y Cades, la mayoría de las cuales no aparecen en ningún otro lugar de la Biblia, y el texto no cuenta ningún suceso allí. En hebreo el nombre tiene las mismas consonantes que el de Taré, el padre de Abraham, pero nada vincula a ambos."
    - "No se sabe nada más, y no se ha propuesto ningún emplazamiento con confianza. Cómo se relaciona el itinerario de Números 33 con el terreno real es en sí mismo objeto de debate, y las estaciones entre Haserot y Ezión-geber no pueden fijarse en el mapa. El mapa sitúa Tara solo de forma aproximada, a unos 50 km de su vecina Mitca, igualmente desconocida."
  pt:
    - "Terá, escrita Tarah na versão King James, é um acampamento de Israel no deserto conhecido apenas pela lista de estações de Números 33: “Partiram de Taate e acamparam em Tera. Partiram de Tera e acamparam em Mitca.” É uma das estações entre Hazerote e Cades, a maioria das quais não aparece em nenhum outro lugar da Bíblia, e o texto não conta nenhum acontecimento ali. Em hebraico o nome tem as mesmas consoantes que o de Terá, pai de Abraão, mas nada liga os dois."
    - "Nada mais se sabe, e nenhum sítio foi proposto com confiança. Como o itinerário de Números 33 se relaciona com o terreno real é ele mesmo debatido, e as estações entre Hazerote e Eziom-Geber não podem ser fixadas no mapa. O mapa situa Terá apenas aproximadamente, a cerca de 50 km de sua vizinha Mitca, igualmente desconhecida."
  de:
    - "Tarach, in der Lutherbibel Tharah geschrieben, ist ein Lager Israels in der Wüste, nur aus der Stationenliste in Numeri 33 bekannt: „Von Thahath zogen sie aus und lagerten sich in Tharah. Von Tharah zogen sie aus und lagerten sich in Mithka.“ Es gehört zu der Reihe von Stationen zwischen Hazerot und Kadesch, von denen die meisten sonst nirgends in der Bibel vorkommen, und der Text berichtet von keinem Ereignis dort. Im Hebräischen hat der Name dieselben Konsonanten wie der Name Terachs, des Vaters Abrahams, doch nichts verbindet die beiden."
    - "Mehr ist nicht bekannt, und kein Ort ist mit Zuversicht vorgeschlagen worden. Wie sich die Stationenliste von Numeri 33 zum wirklichen Gelände verhält, ist selbst umstritten, und die Stationen zwischen Hazerot und Ezjon-Geber lassen sich auf der Karte nicht festlegen. Die Karte setzt Tarach nur ungefähr an, innerhalb von etwa 50 km um den Nachbarn Mitka, der ebenso unbekannt ist."
  fr:
    - "Tarach est un campement d’Israël dans le désert, connu seulement par la liste des étapes de Nombres 33 : « Ils partirent de Tahath, et campèrent à Tarach. Ils partirent de Tarach, et campèrent à Mithka. » Il fait partie de la série d’étapes entre Hatséroth et Qadesh, dont la plupart n’apparaissent nulle part ailleurs dans la Bible, et le texte ne raconte aucun événement qui s’y soit produit. En hébreu, le nom a les mêmes consonnes que celui de Térach, père d’Abraham, mais rien ne relie les deux."
    - "On n’en sait pas plus, et aucun site n’a été proposé avec quelque assurance. Le rapport de l’itinéraire de Nombres 33 avec le terrain réel est lui-même débattu, et les étapes entre Hatséroth et Etsjon-Guéber ne peuvent être fixées sur la carte. La carte place Tarach de façon approximative, à moins de 50 km de sa voisine Mithka, tout aussi inconnue."
scripture:
  - Num.33.27-Num.33.28
sources:
