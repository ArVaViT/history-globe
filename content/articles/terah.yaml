body:
  en:
    - "Terah, spelled Tarah in the King James Version, is a camp of Israel in the wilderness known only from the list of stations in Numbers 33: “And they departed from Tahath, and pitched at Tarah. And they removed from Tarah, and pitched in Mithcah.” It is one of the run of stations between Hazeroth and Kadesh, most of which appear nowhere else in the Bible, and the text tells of no event there. In Hebrew the name has the same consonants as that of Terah, Abraham's father, but nothing links the two."
    - "Nothing more is known, and no site has been proposed with any confidence. How the itinerary of Numbers 33 relates to the real ground is itself debated, and the stations between Hazeroth and Ezion-geber cannot be fixed on the map. The map places Terah only approximately, within about 50 km of its neighbour Mithcah, which is equally unknown."
  ru:
    - "Тарах — стан Израиля в пустыне, известный только по перечню стоянок в 33-й главе книги Чисел: «И отправились из Тахафа и расположились станом в Тарахе. И отправились из Тараха и расположились станом в Мифке». Он входит в череду стоянок между Асирофом и Кадесом, большинство которых больше нигде в Библии не встречается, и текст не сообщает ни о каком событии там. По-еврейски у имени те же согласные, что у имени Фарры, отца Авраама, но ничто их не связывает."
    - "Больше ничего не известно, и ни одного места с уверенностью не предложено. Как маршрут 33-й главы Чисел соотносится с местностью, само по себе спорно, и стоянки между Асирофом и Ецион-Гавером на карте не установить. Тарах на ней помещён лишь приблизительно, в пределах около 50 км от соседней Мифки, которая так же неизвестна."
  uk:
    - "Тарах, у перекладі Куліша Тарата, — табір Ізраїлю в пустелі, відомий лише з переліку стоянок у Числах 33: «І рушили з Талати та й отаборились у Таратї. І рушили з Тарати та й отаборились у Митцї». Це одна зі стоянок між Хацеротом і Кадешем, більшість яких більше ніде в Біблії не з’являються, і текст не розповідає про жодну подію там. Староєврейською назва має ті самі приголосні, що й ім’я Тари, батька Авраама, але нічого не пов’язує їх."
    - "Більше нічого не відомо, і жодного місця не запропоновано з певністю. Як перелік Чисел 33 співвідноситься зі справжньою місцевістю, саме по собі дискутується, і стоянки між Хацеротом та Еціон-Гевером неможливо закріпити на мапі. Мапа позначає Тарах лише приблизно, в межах близько 50 км від його сусідки Мітки, яка так само невідома."
  es:
    - "Tara, escrita Tarah en la versión King James, es un campamento de Israel en el desierto conocido solo por la lista de estaciones de Números 33: «Y partidos de Tahath, asentaron en Tara. Y partidos de Tara, asentaron en Mithca». Es una de la serie de estaciones entre Haserot y Cades, la mayoría de las cuales no aparecen en ningún otro lugar de la Biblia, y el texto no cuenta ningún suceso allí. En hebreo el nombre tiene las mismas consonantes que el de Taré, el padre de Abraham, pero nada vincula a ambos."
    - "No se sabe nada más, y no se ha propuesto ningún emplazamiento con confianza. Cómo se relaciona el itinerario de Números 33 con el terreno real es en sí mismo objeto de debate, y las estaciones entre Haserot y Ezión-geber no pueden fijarse en el mapa. El mapa sitúa Tara solo de forma aproximada, a unos 50 km de su vecina Mitca, igualmente desconocida."
  pt:
    - "Terá, escrita Tarah na versão King James, é um acampamento de Israel no deserto conhecido apenas pela lista de estações de Números 33: “Partiram de Taate e acamparam em Tera. Partiram de Tera e acamparam em Mitca.” É uma das estações entre Hazerote e Cades, a maioria das quais não aparece em nenhum outro lugar da Bíblia, e o texto não conta nenhum acontecimento ali. Em hebraico o nome tem as mesmas consoantes que o de Terá, pai de Abraão, mas nada liga os dois."
    - "Nada mais se sabe, e nenhum sítio foi proposto com confiança. Como o itinerário de Números 33 se relaciona com o terreno real é ele mesmo debatido, e as estações entre Hazerote e Eziom-Geber não podem ser fixadas no mapa. O mapa situa Terá apenas aproximadamente, a cerca de 50 km de sua vizinha Mitca, igualmente desconhecida."
  de:
    - "Tarach, in der Lutherbibel Tharah geschrieben, ist ein Lager Israels in der Wüste, nur aus der Stationenliste in Numeri 33 bekannt: „Von Thahath zogen sie aus und lagerten sich in Tharah. Von Tharah zogen sie aus und lagerten sich in Mithka.“ Es gehört zu der Reihe von Stationen zwischen Hazerot und Kadesch, von denen die meisten sonst nirgends in der Bibel vorkommen, und der Text berichtet von keinem Ereignis dort. Im Hebräischen hat der Name dieselben Konsonanten wie der Name Terachs, des Vaters Abrahams, doch nichts verbindet die beiden."
    - "Mehr ist nicht bekannt, und kein Ort ist mit Zuversicht vorgeschlagen worden. Wie sich die Stationenliste von Numeri 33 zum wirklichen Gelände verhält, ist selbst umstritten, und die Stationen zwischen Hazerot und Ezjon-Geber lassen sich auf der Karte nicht festlegen. Die Karte setzt Tarach nur ungefähr an, innerhalb von etwa 50 km um den Nachbarn Mitka, der ebenso unbekannt ist."
  fr:
    - "Tarach est un campement d’Israël dans le désert, connu seulement par la liste des étapes de Nombres 33 : « Ils partirent de Tahath, et campèrent à Tarach. Ils partirent de Tarach, et campèrent à Mithka. » Il fait partie de la série d’étapes entre Hatséroth et Qadesh, dont la plupart n’apparaissent nulle part ailleurs dans la Bible, et le texte ne raconte aucun événement qui s’y soit produit. En hébreu, le nom a les mêmes consonnes que celui de Térach, père d’Abraham, mais rien ne relie les deux."
    - "On n’en sait pas plus, et aucun site n’a été proposé avec quelque assurance. Le rapport de l’itinéraire de Nombres 33 avec le terrain réel est lui-même débattu, et les étapes entre Hatséroth et Etsjon-Guéber ne peuvent être fixées sur la carte. La carte place Tarach de façon approximative, à moins de 50 km de sa voisine Mithka, tout aussi inconnue."
  pl:
    - "Terach, zapisywane w Biblii Króla Jakuba jako Tarah, jest obozem Izraela na pustyni znanym tylko z wykazu stacji w Lb 33: „A ruszywszy się z Tahatu, położyli się obozem w Tare. A ruszywszy się z Tare, położyli się obozem w Metka.” Należy do ciągu stacji między Chasserot a Kadesz, z których większość nie występuje nigdzie indziej w Biblii, a tekst nie opowiada o żadnym wydarzeniu tam. Po hebrajsku nazwa ma te same spółgłoski co imię Teracha, ojca Abrahama, ale nic nie łączy obu."
    - "Nic więcej nie wiadomo i nie zaproponowano żadnego stanowiska z jakąkolwiek pewnością. To, jak wykaz stacji z Lb 33 odnosi się do rzeczywistego terenu, jest samo przedmiotem sporu, a stacji między Chasserot a Esjon-Geber nie da się ustalić na mapie. Mapa umieszcza Terach tylko w przybliżeniu, w odległości około 50 km od sąsiedniej Mitki, która jest równie nieznana."
  it:
    - "Tara, scritta Tarah nella King James Version, è un accampamento d’Israele nel deserto noto solo dall’elenco delle tappe di Numeri 33: «Partirono da Tahath e si accamparono a Tarach. Partirono da Tarach e si accamparono a Mithka». È una delle tappe tra Cazerot e Kades, la maggior parte delle quali non compare altrove nella Bibbia, e il testo non riferisce alcun evento che vi sia accaduto. In ebraico il nome ha le stesse consonanti di quello di Terach, padre di Abramo, ma nulla collega i due."
    - "Non si sa altro, e non è stato proposto alcun sito con fiducia. Come l’itinerario di Numeri 33 si rapporti al terreno reale è a sua volta discusso, e le tappe fra Cazerot ed Ezion-Gheber non si possono fissare sulla mappa. La mappa colloca Tara solo approssimativamente, entro circa 50 km dalla vicina Mitka, ugualmente ignota."
  nl:
    - "Tarach, in de King James Version Tarah gespeld, is een kamp van Israël in de woestijn dat alleen bekend is uit de lijst van stations in Numeri 33: “En zij verreisden van Tachath, en legerden zich in Tharah. En zij verreisden van Tharah, en legerden zich in Mithka.” Het is een van de reeks stations tussen Hazerot en Kades, waarvan de meeste nergens anders in de Bijbel voorkomen, en de tekst vertelt van geen gebeurtenis daar. In het Hebreeuws heeft de naam dezelfde medeklinkers als die van Terach, de vader van Abraham, maar niets verbindt de twee."
    - "Verder is niets bekend, en met enige zekerheid is geen plaats voorgesteld. Hoe de reisroute van Numeri 33 zich tot het werkelijke terrein verhoudt, is zelf omstreden, en de stations tussen Hazerot en Ezeon-Geber kunnen niet op de kaart worden vastgelegd. De kaart plaatst Tarach slechts bij benadering, binnen ongeveer 50 km van zijn buur Mitka, die evenmin bekend is."
  cs:
    - "Tarach, v King James Version psaný Tarah, je izraelské tábořiště na poušti, známé jen ze seznamu stanic v Numeri 33: „A hnuvše se z Tahat, položili se v Tár. A když se hnuli z Tár, položili se v Metka.“ Je jednou ze stanic mezi Chacerótem a Kádešem, z nichž většina se jinde v Bibli neobjevuje, a text o žádné události tam nevypráví. V hebrejštině má jméno stejné souhlásky jako jméno Terach, Abrahamova otce, ale nic obě nespojuje."
    - "Nic dalšího není známo a žádná lokalita nebyla navržena s jistotou. Jak se itinerář z Numeri 33 vztahuje ke skutečnému terénu, je samo předmětem sporu a stanice mezi Chacerótem a Ecjon-geberem nelze určit na mapě. Mapa klade Tarach jen přibližně, do vzdálenosti asi 50 km od jeho souseda Mitky, která je stejně neznámá."
  sv:
    - "Tera, stavat Tarah i King James-översättningen, är ett läger för Israel i öknen som bara är känt från stationsförteckningen i 4 Mos 33: ”Och de bröto upp från Tahat och lägrade sig i Tera. Och de bröto upp från Tera och lägrade sig i Mitka.” Det är en av raden av stationer mellan Haserot och Kadesh, de flesta omnämnda ingen annanstans i Bibeln, och texten berättar om ingen händelse där. På hebreiska har namnet samma konsonanter som Tera, Abrahams far, men inget förbinder de två."
    - "Inget mer är känt, och ingen plats har föreslagits med någon säkerhet. Hur färdvägen i 4 Mos 33 förhåller sig till den verkliga marken är i sig omdebatterat, och stationerna mellan Haserot och Esjon-Geber kan inte fastställas på kartan. Kartan placerar Tera bara ungefärligt, inom omkring 50 km från grannen Mitka, som är lika okänd."
  nb:
    - "Tarah (Terah på engelsk, Tarah i King James-oversettelsen) er en av Israels leirer i ørkenen, kjent bare fra stasjonslisten i Fjerde Mosebok 33: «Og de drog fra Tahat og leiret sig i Tarah. Og de drog fra Tarah og leiret sig i Mitka.» Den hører til rekken av stasjoner mellom Haserot og Kadesj, de fleste navngitt ingen andre steder i Bibelen, og teksten forteller ikke om noen hendelse der. På hebraisk har navnet de samme konsonantene som Tarah, Abrahams far, men ingenting knytter de to sammen."
    - "Ingenting mer er kjent, og ingen beliggenhet er foreslått med noen sikkerhet. Hvordan reiseruten i Fjerde Mosebok 33 forholder seg til det virkelige terrenget, er selv omdiskutert, og stasjonene mellom Haserot og Esjon-Geber kan ikke fastlegges på kartet. Kartet plasserer Tarah bare omtrentlig, innenfor omkring 50 km fra naboen Mitka, som er like ukjent."
  tl:
    - "Ang Tara, na Tarah ang baybay sa King James Version, ay kampamento ng Israel sa ilang na kilala lamang mula sa talaan ng mga himpilan sa Bilang 33: “At sila'y naglakbay mula sa Tahath at humantong sa Tara. At sila'y naglakbay mula sa Tara, at humantong sa Mithca.” Isa ito sa serye ng mga himpilan sa pagitan ng Haseroth at Cades, na karamihan ay hindi lumilitaw saanman sa Biblia, at walang itinatalang pangyayari roon. Sa Hebreo, ang pangalan ay may parehong katinig ng kay Thare, ama ni Abraham, ngunit walang nag-uugnay sa dalawa."
    - "Wala nang nalalaman, at walang pook na iminungkahi nang may tiwala. Pinagtatalunan din kung paano nauugnay ang itineraryo ng Bilang 33 sa tunay na lupa, at hindi matiyak sa mapa ang mga himpilan sa pagitan ng Haseroth at Esion-geber. Inilalagay lamang ng mapa ang Tara nang tinatayang, sa loob ng humigit-kumulang 50 km mula sa kapitbahay nitong Mithca, na hindi rin kilala."
  da:
    - "Tera, stavet Tarah i King James-oversættelsen, er en lejr for Israel i ørkenen, kendt kun fra stationslisten i 4 Mos 33: »Og de rejste fra Thabath, og de lejrede sig i Thara. Og de rejste fra Thara, og de lejrede sig i Mithka.« Den er en af rækken af stationer mellem Haserot og Kadesj, hvoraf de fleste ikke optræder andre steder i Bibelen, og teksten beretter ikke om nogen begivenhed dér. På hebraisk har navnet de samme konsonanter som Tera, Abrahams far, men intet forbinder de to."
    - "Intet mere er kendt, og intet sted er foreslået med nogen sikkerhed. Hvordan rejselisten i 4 Mos 33 forholder sig til det virkelige terræn, er selv omstridt, og stationerne mellem Haserot og Esjon-Geber kan ikke fastlægges på kortet. Kortet placerer Tera kun omtrentligt, inden for omkring 50 km fra dens nabo Mitka, som er lige så ukendt."
  sr:
    - "Тара, у Верзији краља Јакова писана Тарах, јесте логор Израиља у пустињи познат само из списка станица у Књизи о бројевима 33: „А из Катата отишавши стадоше у логор у Тарату. А из Тарата отишавши стадоше у логор у Метеку.“ То је једна од станица између Асирота и Кадиса, од којих већина нигде другде у Библији не стоји, а текст не прича ни о једном догађају онде. На хебрејском име има исте сугласнике као име Таре, Аврамовог оца, али ништа не повезује то двоје."
    - "Ништа више није познато и ниједно налазиште није предложено с извесношћу. Како се попис станица из Књиге о бројевима 33 односи према стварном терену, и само је предмет спора, а станице између Асирота и Есион-Гавера не могу се утврдити на карти. Карта Тару смешта само приближно, у оквиру око 50 км од суседне Митке, која је подједнако непозната."
  hu:
    - "Terah, a Károli-fordításban Thárakh, Izráel egyik pusztai tábora, amelyet csak a Számok 33. fejezetének állomáslistájából ismerünk: „elindulának Tháhátból, és tábort ütének Thárakhban. És elindulának Thárakhból, és tábort ütének Mitkában.” Abba a sorba tartozik, amely Hacérót és Kádes között húzódik, és amelynek állomásait többnyire sehol másutt nem említi a Biblia, és a szöveg nem mesél ott történt eseményről. Héberül a névnek ugyanazok a mássalhangzói, mint Ábrahám apjáénak, Táréénak, de semmi sem köti össze a kettőt."
    - "Többet nem tudunk, és helyét senki sem javasolta biztosan. Hogy a Számok 33. fejezetének útleírása hogyan viszonyul a valódi terephez, maga is vitatott, és a Hacérót és Ecjón-Géber közötti állomások nem rögzíthetők a térképen. A térkép Terahot csak hozzávetőlegesen helyezi el, szomszédjától, Mitkától, amely ugyanígy ismeretlen, mintegy 50 km-en belül."
  fi:
    - "Terah, King James -käännöksessä Tarah, on Israelin erämaaleiri, joka tunnetaan vain Neljännen Mooseksen kirjan 33. luvun asemaluettelosta: ”Ja he lähtivät Tahatista ja leiriytyivät Tarahiin. Ja he lähtivät Tarahista ja leiriytyivät Mitkaan.” Se on yksi Haserotin ja Kadeksen välisistä asemista, joista useimpia ei mainita muualla Raamatussa, eikä teksti kerro mitään siellä tapahtuneen. Heprean kielessä nimessä on samat konsonantit kuin Abrahamin isän Terahin nimessä, mutta mikään ei yhdistä näitä kahta."
    - "Muuta ei tiedetä, eikä mitään paikkaa ole ehdotettu varmuudella. Neljännen Mooseksen kirjan 33. luvun reittiluettelon suhde todelliseen maastoon on itsekin kiistanalainen, eikä Haserotin ja Esjon-Geberin välisiä asemia voida paikantaa kartalle. Kartta sijoittaa Terahin vain likimääräisesti, noin 50 km:n säteelle naapuristaan Mitkasta, joka on yhtä tuntematon."
  vi:
    - "Tha-rê, viết là Tarah trong bản King James, là một trại của Y-sơ-ra-ên trong đồng vắng chỉ được biết qua danh sách các chặng ở Dân Số Ký 33: “Đi từ Ta-hát và đóng trại tại Ta-rách. Đi từ Ta-rách và đóng trại tại Mít-ga.” Nó thuộc chuỗi các chặng giữa Hát-sê-rốt và Ca-đe, phần lớn không xuất hiện ở chỗ nào khác trong Kinh Thánh, và bản văn không kể biến cố nào ở đó. Trong tiếng Hê-bơ-rơ, tên này có cùng phụ âm với tên Tha-rê, cha của Áp-ra-ham, nhưng không gì nối hai tên với nhau."
    - "Không biết gì thêm, và chưa có địa điểm nào được đề nghị với độ tin cậy. Lộ trình trong Dân Số Ký 33 liên hệ với thực địa như thế nào tự nó đã là điều tranh luận, và các chặng giữa Hát-sê-rốt và Ê-xi-ôn-Ghê-be không thể xác định trên bản đồ. Bản đồ chỉ đặt Tha-rê đại khái, trong vòng khoảng 50 km quanh Mít-ga, nơi lân cận cũng không rõ không kém."
  ro:
    - "Terah, scris Tarah în versiunea King James, este un popas al lui Israel în pustie, cunoscut numai din lista popasurilor din Numeri 33: „Și au purces din Kataat, și au tăbărît în Tarat. Și au purces din Tarat, și au tăbărît în Matekka.” Face parte din șirul de popasuri dintre Hațerot și Cades, dintre care cele mai multe nu apar nicăieri altundeva în Biblie, iar textul nu povestește niciun eveniment de acolo. În ebraică, numele are aceleași consoane ca al lui Terah, tatăl lui Avraam, dar nimic nu le leagă."
    - "Nu se mai știe nimic și niciun loc nu a fost propus cu vreo încredere. Cum se raportează itinerarul din Numeri 33 la terenul real este el însuși dezbătut, iar popasurile dintre Hațerot și Ețion-Gheber nu pot fi fixate pe hartă. Harta așază Terah doar aproximativ, la circa 50 km de vecina sa Mitca, la fel de necunoscută."
  bg:
    - "Тара, изписвано в King James Version като Tarah, е стан на Израил в пустинята, известен само от списъка на стоянките в Чис. 33: „И като се дигнаха от Тахат разположиха стан в Тара. И като се дигнаха от Тара разположиха стан в Митка.“ Тя е една от поредицата стоянки между Асирот и Кадеш, повечето от които не се срещат никъде другаде в Библията, а текстът не разказва за никакво събитие там. На еврейски името има същите съгласни като името на Тара, бащата на Авраам, но нищо не свързва двете."
    - "Нищо повече не се знае и не е предложено място с каквато и да е увереност. Как маршрутът от Чис. 33 се отнася към действителния терен, само по себе си е спорно, а стоянките между Асирот и Ецион-Гавер не могат да се фиксират на картата. Картата поставя Тара само приблизително, в рамките на около 50 км от съседната Митка, която е също толкова неизвестна."
scripture:
  - Gen.11.26
  - Num.33.17-Num.33.36
sources:
  - "G. I. Davies, The Way of the Wilderness: A Geographical Study of the Wilderness Itineraries in the Old Testament (1979)"
  - "B. A. Levine, Numbers 21–36 (Anchor Bible 4A, 2000)"
  - "J. Milgrom, Numbers (JPS Torah Commentary, 1990)"
status: checked
