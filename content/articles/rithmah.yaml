# Overview article (ADR 0007). Mainstream facts only; a wilderness station known only from the itinerary of Numbers 33; Rashi's link with the spies is given as tradition; the site is unknown.
id: rithmah
place: a2e73ba
title:
  en: "Rithmah"
  ru: "Рифма"
  uk: "Ріфма"
  es: "Ritma"
  pt: "Ritma"
  de: "Ritma"
  fr: "Rithma"
body:
  en:
    - "Rithmah is a camp of Israel in the wilderness named only in the itinerary of Numbers 33, the first after Hazeroth: “And they departed from Hazeroth, and pitched in Rithmah. And they departed from Rithmah, and pitched at Rimmon-parez.” The name comes from rotem, the white broom bush of the desert. Because the narrative in Numbers goes straight from Hazeroth to the wilderness of Paran and the sending of the spies, Jewish tradition, followed by Rashi, took Rithmah for the place of the spies' evil report."
    - "Its site is unknown. The map marks five candidates, chiefly wadis whose Arabic names keep the word for broom: Wadi Ratamah in the southern Sinai, where the map point stands, Wadi Abu Retemat in the north-eastern Sinai, Wadi er-Retame in north-western Arabia, Ain Rathmah, and Bir es-Sawra. The broom grows all over these deserts, so the name proves little."
  ru:
    - "Рифма — стан Израиля в пустыне, названный только в перечне 33-й главы книги Чисел, первый после Асирофа: «И отправились из Асирофа и расположились станом в Рифме. И отправились из Рифмы и расположились станом в Римнон-Фареце». Имя происходит от «ротем» — белого пустынного дрока. Поскольку рассказ книги Чисел переходит от Асирофа прямо к пустыне Фаран и посылке соглядатаев, иудейское предание, а за ним Раши, считало Рифму местом, где соглядатаи распустили худую молву."
    - "Местоположение неизвестно. На карте отмечено пять вариантов, в основном вади, чьи арабские имена хранят слово «дрок»: Вади Ратама на юге Синая, где стоит точка на карте, Вади Абу-Ретемат на северо-востоке Синая, Вади эр-Ретаме на северо-западе Аравии, Айн-Ратму и Бир-эс-Савру. Дрок растёт по всем этим пустыням, так что имя мало что доказывает."
  uk:
    - "Ріфма — табір Ізраїлю в пустині, згаданий лише в маршруті Чисел 33, перший після Хацерота: «І рушили з Газерота та й отаборились у Ритмі. І рушили з Ритми та й отаборились у Риммон-Перезї.» Назва походить від ротем, білого віничного куща пустелі. Оскільки оповідь у Числах переходить прямо від Хацерота до пустині Фаран і посилання розвідників, юдейська традиція, за якою пішов Раші, вважала Ріфму місцем лихої вістки розвідників."
    - "Її розташування невідоме. Карта позначає п’ять кандидатів, переважно ваді, чиї арабські назви зберігають слово, що означає віничний кущ: Ваді-Ратама на півдні Синаю, де стоїть точка карти, Ваді-Абу-Ретемат на північному сході Синаю, Ваді-ер-Ретаме на північному заході Аравії, Айн-Ратма та Бір-ес-Савра. Віничний кущ росте по всіх цих пустелях, тож назва мало що доводить."
  es:
    - "Ritma es un campamento de Israel en el desierto nombrado solo en el itinerario de Números 33, el primero después de Haserot: «Y partidos de Haseroth, asentaron en Ritma. Y partidos de Ritma, asentaron en Rimmón-peres». El nombre viene de rotem, la retama blanca del desierto. Como la narración de Números pasa directamente de Haserot al desierto de Parán y al envío de los espías, la tradición judía, seguida por Rashi, tomó Ritma por el lugar del mal informe de los espías."
    - "Su emplazamiento se desconoce. El mapa señala cinco candidatos, principalmente uadis cuyos nombres árabes conservan la palabra para la retama: Wadi Ratamah, en el sur del Sinaí, donde está el punto del mapa, Wadi Abu Retemat, en el noreste del Sinaí, Wadi er-Retame, en el noroeste de Arabia, Ain Rathmah y Bir es-Sawra. La retama crece por todos estos desiertos, así que el nombre prueba poco."
  pt:
    - "Ritma é um acampamento de Israel no deserto citado apenas no itinerário de Números 33, o primeiro depois de Hazerote: “Partiram de Hazerote e acamparam em Ritmá. Partiram de Ritmá e acamparam em Rimom-Perez.” O nome vem de rotem, a giesta branca do deserto. Como a narrativa de Números vai direto de Hazerote ao deserto de Parã e ao envio dos espias, a tradição judaica, seguida por Rashi, tomou Ritma pelo lugar do mau relatório dos espias."
    - "Seu local é desconhecido. O mapa marca cinco candidatos, principalmente uádis cujos nomes árabes guardam a palavra para giesta: Wadi Ratamah, no sul do Sinai, onde fica o ponto do mapa, Wadi Abu Retemat, no nordeste do Sinai, Wadi er-Retame, no noroeste da Arábia, Ain Rathmah e Bir es-Sawra. A giesta cresce por todos esses desertos, de modo que o nome prova pouco."
  de:
    - "Ritma ist ein Lager Israels in der Wüste, nur in der Stationenliste von Numeri 33 genannt, das erste nach Hazerot: „Von Hazeroth zogen sie aus und lagerten sich in Rithma. Von Rithma zogen sie aus und lagerten sich in Rimmon-Perez.“ Der Name kommt von rotem, dem weißen Ginsterstrauch der Wüste. Weil die Erzählung der Numeri direkt von Hazerot zur Wüste Paran und zur Aussendung der Kundschafter übergeht, hielt die jüdische Tradition, der Raschi folgt, Ritma für den Ort des bösen Berichts der Kundschafter."
    - "Seine Lage ist unbekannt. Die Karte markiert fünf Kandidaten, vor allem Wadis, deren arabische Namen das Wort für Ginster bewahren: Wadi Ratamah im südlichen Sinai, wo der Kartenpunkt steht, Wadi Abu Retemat im nordöstlichen Sinai, Wadi er-Retame im Nordwesten Arabiens, Ajin Rathmah und Bir es-Sawra. Der Ginster wächst in all diesen Wüsten, sodass der Name wenig beweist."
  fr:
    - "Rithma est un campement d’Israël dans le désert, nommé seulement dans l’itinéraire de Nombres 33, le premier après Hatséroth : « Ils partirent de Hatséroth, et campèrent à Rithma. Ils partirent de Rithma, et campèrent à Rimmon-Pérets. » Le nom vient de rotem, le genêt blanc du désert. Comme le récit des Nombres va droit de Hatséroth au désert de Paran et à l’envoi des explorateurs, la tradition juive, suivie par Rachi, a pris Rithma pour le lieu du mauvais rapport des explorateurs."
    - "Son site est inconnu. La carte marque cinq candidats, surtout des oueds dont les noms arabes gardent le mot pour le genêt : Wadi Ratamah dans le sud du Sinaï, où se trouve le point de la carte, Wadi Abu Retemat dans le nord-est du Sinaï, Wadi er-Retame dans le nord-ouest de l’Arabie, Aïn Rathmah et Bir es-Sawra. Le genêt pousse dans tous ces déserts, si bien que le nom prouve peu."
