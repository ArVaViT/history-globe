body:
  en:
    - "Rithmah is a camp of Israel in the wilderness named only in the itinerary of Numbers 33, the first after Hazeroth: “And they departed from Hazeroth, and pitched in Rithmah. And they departed from Rithmah, and pitched at Rimmon-parez.” The name comes from rotem, the white broom bush of the desert. Because the narrative in Numbers goes straight from Hazeroth to the wilderness of Paran and the sending of the spies, Jewish tradition, followed by Rashi, took Rithmah for the place of the spies' evil report."
    - "Its site is unknown. The map marks five candidates, chiefly wadis whose Arabic names keep the word for broom: Wadi Ratamah in the southern Sinai, where the map point stands, Wadi Abu Retemat in the north-eastern Sinai, Wadi er-Retame in north-western Arabia, Ain Rathmah, and Bir es-Sawra. The broom grows all over these deserts, so the name proves little."
  ru:
    - "Рифма — стан Израиля в пустыне, названный только в перечне 33-й главы книги Чисел, первый после Асирофа: «И отправились из Асирофа и расположились станом в Рифме. И отправились из Рифмы и расположились станом в Римнон-Фареце». Имя происходит от «ротем» — белого пустынного дрока. Поскольку рассказ книги Чисел переходит от Асирофа прямо к пустыне Фаран и посылке соглядатаев, иудейское предание, а за ним Раши, считало Рифму местом, где соглядатаи распустили худую молву."
    - "Местоположение неизвестно. На карте отмечено пять вариантов, в основном вади, чьи арабские имена хранят слово «дрок»: Вади Ратама на юге Синая, где стоит точка на карте, Вади Абу-Ретемат на северо-востоке Синая, Вади эр-Ретаме на северо-западе Аравии, Айн-Ратму и Бир-эс-Савру. Дрок растёт по всем этим пустыням, так что имя мало что доказывает."
  uk:
    - "Ріфма — табір Ізраїлю в пустині, згаданий лише в маршруті Чисел 33, перший після Хацерота: «І рушили з Газерота та й отаборились у Ритмі. І рушили з Ритми та й отаборились у Риммон-Перезї.» Назва походить від ротем, білого віничного куща пустелі. Оскільки оповідь у Числах переходить прямо від Хацерота до пустині Фаран і посилання розвідників, юдейська традиція, за якою пішов Раші, вважала Ріфму місцем лихої вістки розвідників."
    - "Її розташування невідоме. Карта позначає п’ять кандидатів, переважно ваді, чиї арабські назви зберігають слово, що означає віничний кущ: Ваді-Ратама на півдні Синаю, де стоїть точка карти, Ваді-Абу-Ретемат на північному сході Синаю, Ваді-ер-Ретаме на північному заході Аравії, Айн-Ратма та Бір-ес-Савра. Віничний кущ росте по всіх цих пустелях, тож назва мало що доводить."
  es:
    - "Ritma es un campamento de Israel en el desierto nombrado solo en el itinerario de Números 33, el primero después de Haserot: «Y partidos de Haseroth, asentaron en Ritma. Y partidos de Ritma, asentaron en Rimmón-peres». El nombre viene de rotem, la retama blanca del desierto. Como la narración de Números pasa directamente de Haserot al desierto de Parán y al envío de los espías, la tradición judía, seguida por Rashi, tomó Ritma por el lugar del mal informe de los espías."
    - "Su emplazamiento se desconoce. El mapa señala cinco candidatos, principalmente uadis cuyos nombres árabes conservan la palabra para la retama: Wadi Ratamah, en el sur del Sinaí, donde está el punto del mapa, Wadi Abu Retemat, en el noreste del Sinaí, Wadi er-Retame, en el noroeste de Arabia, Ain Rathmah y Bir es-Sawra. La retama crece por todos estos desiertos, así que el nombre prueba poco."
  pt:
    - "Ritma é um acampamento de Israel no deserto citado apenas no itinerário de Números 33, o primeiro depois de Hazerote: “Partiram de Hazerote e acamparam em Ritmá. Partiram de Ritmá e acamparam em Rimom-Perez.” O nome vem de rotem, a giesta branca do deserto. Como a narrativa de Números vai direto de Hazerote ao deserto de Parã e ao envio dos espias, a tradição judaica, seguida por Rashi, tomou Ritma pelo lugar do mau relatório dos espias."
    - "Seu local é desconhecido. O mapa marca cinco candidatos, principalmente uádis cujos nomes árabes guardam a palavra para giesta: Wadi Ratamah, no sul do Sinai, onde fica o ponto do mapa, Wadi Abu Retemat, no nordeste do Sinai, Wadi er-Retame, no noroeste da Arábia, Ain Rathmah e Bir es-Sawra. A giesta cresce por todos esses desertos, de modo que o nome prova pouco."
  de:
    - "Ritma ist ein Lager Israels in der Wüste, nur in der Stationenliste von Numeri 33 genannt, das erste nach Hazerot: „Von Hazeroth zogen sie aus und lagerten sich in Rithma. Von Rithma zogen sie aus und lagerten sich in Rimmon-Perez.“ Der Name kommt von rotem, dem weißen Ginsterstrauch der Wüste. Weil die Erzählung der Numeri direkt von Hazerot zur Wüste Paran und zur Aussendung der Kundschafter übergeht, hielt die jüdische Tradition, der Raschi folgt, Ritma für den Ort des bösen Berichts der Kundschafter."
    - "Seine Lage ist unbekannt. Die Karte markiert fünf Kandidaten, vor allem Wadis, deren arabische Namen das Wort für Ginster bewahren: Wadi Ratamah im südlichen Sinai, wo der Kartenpunkt steht, Wadi Abu Retemat im nordöstlichen Sinai, Wadi er-Retame im Nordwesten Arabiens, Ajin Rathmah und Bir es-Sawra. Der Ginster wächst in all diesen Wüsten, sodass der Name wenig beweist."
  fr:
    - "Rithma est un campement d’Israël dans le désert, nommé seulement dans l’itinéraire de Nombres 33, le premier après Hatséroth : « Ils partirent de Hatséroth, et campèrent à Rithma. Ils partirent de Rithma, et campèrent à Rimmon-Pérets. » Le nom vient de rotem, le genêt blanc du désert. Comme le récit des Nombres va droit de Hatséroth au désert de Paran et à l’envoi des explorateurs, la tradition juive, suivie par Rachi, a pris Rithma pour le lieu du mauvais rapport des explorateurs."
    - "Son site est inconnu. La carte marque cinq candidats, surtout des oueds dont les noms arabes gardent le mot pour le genêt : Wadi Ratamah dans le sud du Sinaï, où se trouve le point de la carte, Wadi Abu Retemat dans le nord-est du Sinaï, Wadi er-Retame dans le nord-ouest de l’Arabie, Aïn Rathmah et Bir es-Sawra. Le genêt pousse dans tous ces déserts, si bien que le nom prouve peu."
  it:
    - "Ritma è un accampamento di Israele nel deserto nominato solo nell’itinerario di Numeri 33, il primo dopo Cazerot: «Partirono da Hatseroth e si accamparono a Rithma. Partirono da Rithma e si accamparono a Rimmon-Perets.» Il nome viene da rotem, la ginestra bianca del deserto. Poiché il racconto dei Numeri passa direttamente da Cazerot al deserto di Paran e all’invio degli esploratori, la tradizione ebraica, seguita da Rashi, prese Ritma per il luogo del cattivo rapporto degli esploratori."
    - "Il suo sito è ignoto. La mappa segna cinque candidati, soprattutto uadi i cui nomi arabi conservano la parola per la ginestra: Wadi Ratamah nel Sinai meridionale, dove si trova il punto della mappa, Wadi Abu Retemat nel Sinai nord-orientale, Wadi er-Retame nell’Arabia nord-occidentale, Ain Rathmah e Bir es-Sawra. La ginestra cresce in tutti questi deserti, per cui il nome prova poco."
  pl:
    - "Retma to obóz Izraela na pustyni, wymieniony tylko w itinerarium z Lb 33, pierwszy po Chasserot: „A ruszywszy się z Hezerot, położyli się obozem w Retma. A ruszywszy się z Retma, położyli się obozem w Remmon Fares”. Nazwa pochodzi od rotem, białej miotły pustynnej. Ponieważ opowieść w Księdze Liczb przechodzi wprost od Chasserot na pustynię Paran i wysłanie zwiadowców, tradycja żydowska, za którą idzie Raszi, uznała Retmę za miejsce złego doniesienia zwiadowców."
    - "Jego położenie jest nieznane. Mapa zaznacza pięciu kandydatów, głównie wadi, których arabskie nazwy zachowują słowo oznaczające miotłę: Wadi Ratama w południowym Synaju, gdzie stoi punkt na mapie, Wadi Abu Retemat w północno-wschodnim Synaju, Wadi er-Retame w północno-zachodniej Arabii, Ain Ratma i Bir es-Sawra. Miotła rośnie na tych pustyniach wszędzie, więc nazwa niewiele dowodzi."
  cs:
    - "Ritma je tábor Izraele na poušti jmenovaný jen v itineráři Numeri 33, první po Chacerótu: „Hnuvše se pak z Hazerot, položili se v Retma. A z Retma hnuvše se, položili se v Remmon Fáres.“ Jméno pochází od rotem, bílé pouštní metly. Protože vyprávění v Numeri jde rovnou z Chacerótu na poušť Páran a k vyslání vyzvědačů, pokládala židovská tradice, kterou následuje Raši, Ritmu za místo zlé zprávy vyzvědačů."
    - "Její poloha je neznámá. Mapa vyznačuje pět kandidátů, hlavně vádí, jejichž arabská jména uchovávají slovo pro metlu: Vádí Ratáma v jižním Sinaji, kde stojí bod na mapě, Vádí Abú Retemát v severovýchodním Sinaji, Vádí er-Retáme v severozápadní Arábii, Ajn Rathma a Bír es-Savra. Metla roste po všech těchto pouštích, takže jméno dokazuje málo."
  nl:
    - "Ritma is een kamp van Israël in de woestijn dat alleen in de reisroute van Numeri 33 wordt genoemd, het eerste na Hazerot: “En zij verreisden van Hazeroth, en legerden zich in Rithma. En zij verreisden van Rithma, en legerden zich in Rimmon-Perez.” De naam komt van rotem, de witte bremstruik van de woestijn. Omdat het verhaal in Numeri rechtstreeks van Hazerot naar de woestijn van Paran en de uitzending van de verspieders gaat, hield de Joodse overlevering, gevolgd door Rasji, Ritma voor de plaats van het slechte bericht van de verspieders."
    - "De ligging is onbekend. De kaart wijst vijf kandidaten aan, vooral wadi’s wier Arabische namen het woord voor brem bewaren: Wadi Ratamah in de zuidelijke Sinaï, waar het kaartpunt staat, Wadi Abu Retemat in de noordoostelijke Sinaï, Wadi er-Retame in het noordwesten van Arabië, Ain Rathmah en Bir es-Sawra. De brem groeit in al deze woestijnen, dus de naam bewijst weinig."
  sv:
    - "Ritma är ett av Israels läger i öknen, nämnt endast i vandringsförteckningen i 4 Mos 33, det första efter Haserot: ”Och de bröto upp från Haserot och lägrade sig i Ritma. Och de bröto upp från Ritma och lägrade sig i Rimmon-Peres.” Namnet kommer av rotem, öknens vita ginstbuske. Eftersom berättelsen i Fjärde Mosebok går direkt från Haserot till Parans öken och spejarnas utsändande, tog judisk tradition, som Rashi följer, Ritma för platsen för spejarnas onda rapport."
    - "Dess läge är okänt. Kartan markerar fem kandidater, främst wadier vars arabiska namn bevarar ordet för ginst: Wadi Ratamah i södra Sinai, där kartpunkten står, Wadi Abu Retemat i nordöstra Sinai, Wadi er-Retame i nordvästra Arabien, Ain Rathmah och Bir es-Sawra. Ginsten växer över hela dessa öknar, så namnet bevisar föga."
  nb:
    - "Ritma er en av Israels leirplasser i ørkenen, nevnt bare i ferdaberetningen i 4. Mosebok 33, den første etter Haserot: «Og de drog fra Haserot og leiret sig i Ritma. Og de drog fra Ritma og leiret sig i Rimmon-Peres.» Navnet kommer fra rotem, den hvite gyvelbusken i ørkenen. Fordi fortellingen i 4. Mosebok går rett fra Haserot til Parans ørken og utsendelsen av spionene, mente jødisk tradisjon, fulgt av Rashi, at Ritma var stedet for spionenes onde rapport."
    - "Stedet er ukjent. Kartet markerer fem kandidater, for det meste wadier hvis arabiske navn bevarer ordet for gyvel: Wadi Ratamah i sørlige Sinai, der kartpunktet står, Wadi Abu Retemat i nordøstlige Sinai, Wadi er-Retame i nordvestlige Arabia, Ain Rathmah og Bir es-Sawra. Gyvelen vokser over hele disse ørkenene, så navnet beviser lite."
  tl:
    - "Ang Ritma ay isang kampo ng Israel sa ilang na pinangalanan lamang sa itineraryo ng Mga Bilang 33, ang una pagkatapos ng Haseroth: “At sila'y naglakbay mula sa Haseroth, at humantong sa Ritma. At sila'y naglakbay mula sa Ritma, at humantong sa Rimmon-peres.” Ang pangalan ay nagmula sa rotem, ang puting palumpong na retama ng disyerto. Dahil ang salaysay sa Mga Bilang ay mula Haseroth tuwiran sa ilang ng Paran at sa pagsusugo ng mga tiktik, itinuring ng tradisyong Judio, na sinusundan ni Rashi, ang Ritma bilang lugar ng masamang ulat ng mga tiktik."
    - "Hindi alam ang lugar nito. Minamarkahan ng mapa ang limang kandidato, higit sa lahat mga wadi na ang mga pangalang Arabe ay nagpapanatili ng salita para sa retama: ang Wadi Ratamah sa timog Sinai, kung saan nakalagay ang punto ng mapa, ang Wadi Abu Retemat sa hilagang-silangang Sinai, ang Wadi er-Retame sa hilagang-kanlurang Arabia, ang Ain Rathmah, at ang Bir es-Sawra. Tumutubo ang retama sa lahat ng disyertong ito, kaya kaunti ang pinatutunayan ng pangalan."
  da:
    - "Ritma er en af Israels lejre i ørkenen, nævnt kun i rejseberetningen i 4 Mos 33, den første efter Haserot: »Og de rejste fra Hazeroth, og de lejrede sig i Rithma. Og de rejste fra Rithma, og de lejrede sig i Rimmon-Perez.« Navnet kommer af rotem, ørkenens hvide gyvel. Fordi fortællingen i 4. Mosebog går direkte fra Haserot til Parans ørken og udsendelsen af spejderne, tog den jødiske tradition, som Rashi fulgte, Ritma for stedet for spejdernes onde rygte."
    - "Dens sted er ukendt. Kortet markerer fem kandidater, hovedsagelig wadier, hvis arabiske navne bevarer ordet for gyvel: Wadi Ratamah i det sydlige Sinai, hvor kortets punkt står, Wadi Abu Retemat i det nordøstlige Sinai, Wadi er-Retame i det nordvestlige Arabien, Ain Rathmah og Bir es-Sawra. Gyvlen vokser over alle disse ørkener, så navnet beviser lidt."
