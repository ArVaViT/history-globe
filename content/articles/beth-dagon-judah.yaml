body:
  en:
    - "Beth-dagon, “house of Dagon”, the god best known from the Philistines, was a town of the Shephelah of Judah, listed in Joshua in the district of Lachish and Eglon: “And Gederoth, Beth-dagon, and Naamah, and Makkedah; sixteen cities with their villages”. Nothing more is told of it. Its site is unknown; the Encyclopaedia Judaica places it in the southern Shephelah. The name recurs: a second Beth-dagon lay on the border of Asher."
    - "The town is probably not the Beit Dajan south-east of Jaffa that still carries the name. That village, now the Israeli town of Beit Dagan, is the Bit-Daganna that Sennacherib took in 701 BC together with Joppa, Bene-berak and Azor, cities of the king of Ashkelon; it is also the Kaphar Dagon that Eusebius placed between Diospolis (Lod) and Jamnia (Yavne). As the International Standard Bible Encyclopedia notes, it lies outside the Shephelah, and the Encyclopaedia Judaica treats the Judahite town as unidentified."
  ru:
    - "Беф-Дагон, «дом Дагона» — бога, известного прежде всего у филистимлян, — город Шефелы Иудиной, указанный в книге Иисуса Навина в округе Лахиса и Еглона: «Гедероф, Беф-Дагон, Наема и Макед: шестнадцать городов с их селами». Больше о нём ничего не сказано. Его место неизвестно; Encyclopaedia Judaica помещает его в южную Шефелу. Имя повторяется: второй Беф-Дагон лежал на границе Асира."
    - "Это, вероятно, не Бейт-Даджан к юго-востоку от Яффы, который и сейчас носит это имя. Та деревня, ныне израильский посёлок Бейт-Даган, — это Бит-Даганна, которую Синаххериб взял в 701 г. до н. э. вместе с Иоппией, Бене-Вераком и Азором, городами царя Ашкелона; это и Кафар-Дагон, который Евсевий помещал между Диосполем (Лодом) и Ямнией (Явне). Как отмечает Международная стандартная библейская энциклопедия, это место лежит вне Шефелы, а Encyclopaedia Judaica считает иудейский город неотождествлённым."
  uk:
    - "Бет-Дагон, «дім Дагона», бога, найвідомішого з филистимлян, був містом юдейської Шефели, зазначеним у книзі Ісуса Навина в окрузі Лахіша та Еглона: «Гедерот, Бет-Дагон, Наема, та Македа — шіснайцять міст з їх селами». Більше про нього нічого не розповідається. Його місце невідоме; Encyclopaedia Judaica поміщає його в південній Шефелі. Назва повторюється: другий Бет-Дагон лежав на межі Асіра."
    - "Це місто, імовірно, не Бейт-Даджан на південний схід від Яффи, що досі носить цю назву. Те село, нині ізраїльське місто Бейт-Даган, — це Бит-Даганна, яку Сінаххеріб узяв 701 р. до н. е. разом з Яффою, Бене-Бераком і Азором, містами царя Ашкелона; це й Кафар-Даган, який Євсевій поміщав між Діосполем (Лод) і Ямнією (Явне). Як зазначає International Standard Bible Encyclopedia, воно лежить поза Шефелою, а Encyclopaedia Judaica вважає юдейське місто неототожненим."
  es:
    - "Bet-dagón, «casa de Dagón», el dios más conocido por los filisteos, era una ciudad de la Sefelá de Judá, enumerada en Josué en el distrito de Laquis y Eglón: «Y Gederoh, Beth-dagón, y Naama, y Maceda; dieciséis ciudades con sus aldeas». Nada más se cuenta de ella. Su emplazamiento se desconoce; la Encyclopaedia Judaica la sitúa en la Sefelá meridional. El nombre se repite: una segunda Bet-dagón estaba en la frontera de Aser."
    - "La ciudad probablemente no es la Beit Dajan al sureste de Jaffa que aún lleva el nombre. Esa aldea, hoy la ciudad israelí de Beit Dagan, es la Bit-Daganna que Senaquerib tomó en 701 a. C. junto con Jope, Bene-berac y Azor, ciudades del rey de Ascalón; es también la Kaphar Dagon que Eusebio situó entre Diospolis (Lod) y Jamnia (Yavne). Como señala la International Standard Bible Encyclopedia, queda fuera de la Sefelá, y la Encyclopaedia Judaica trata la ciudad de Judá como no identificada."
  pt:
    - "Bete-Dagom, “casa de Dagom”, o deus mais conhecido dos filisteus, era uma cidade da Sefelá de Judá, listada em Josué no distrito de Laquis e Eglom: “Gederote, Bete-Dagom, Naamá e Maqueda; dezesseis cidades com as suas aldeias”. Nada mais se conta dela. Sua localização é desconhecida; a Encyclopaedia Judaica a situa na Sefelá meridional. O nome se repete: uma segunda Bete-Dagom ficava na fronteira de Aser."
    - "A cidade provavelmente não é a Beit Dajan, a sudeste de Jafa, que ainda leva o nome. Essa aldeia, hoje a cidade israelense de Beit Dagan, é a Bit-Daganna que Senaqueribe tomou em 701 a.C. junto com Jope, Bene-Beraque e Azor, cidades do rei de Ascalom; é também a Kaphar Dagon que Eusébio situou entre Diópolis (Lida) e Jâmnia (Yavne). Como observa a International Standard Bible Encyclopedia, ela fica fora da Sefelá, e a Encyclopaedia Judaica trata a cidade de Judá como não identificada."
  de:
    - "Bet-Dagon, „Haus Dagons“, des vor allem von den Philistern bekannten Gottes, war eine Stadt in der Schefela Judas, im Buch Josua im Bezirk von Lachisch und Eglon aufgeführt: „Gederoth, Beth-Dagon, Naema, Makkeda. Das sind sechzehn Städte und ihre Dörfer.“ Weiter wird von ihr nichts erzählt. Ihre Lage ist unbekannt; die Encyclopaedia Judaica setzt sie in die südliche Schefela. Der Name kehrt wieder: Ein zweites Bet-Dagon lag an der Grenze Assers."
    - "Die Stadt ist wahrscheinlich nicht das Beit Dajan südöstlich von Jaffa, das den Namen noch trägt. Dieses Dorf, jetzt die israelische Stadt Beit Dagan, ist das Bit-Daganna, das Sanherib 701 v. Chr. zusammen mit Joppe, Bne-Berak und Azor einnahm, Städten des Königs von Aschkelon; es ist auch das Kaphar Dagon, das Eusebius zwischen Diospolis (Lod) und Jamnia (Jawne) ansetzte. Wie die International Standard Bible Encyclopedia bemerkt, liegt es außerhalb der Schefela, und die Encyclopaedia Judaica behandelt die judäische Stadt als unidentifiziert."
  fr:
    - "Beth-Dagon, « maison de Dagon », le dieu surtout connu par les Philistins, était une ville de la Shéphéla de Juda, citée dans Josué dans le district de Lakis et d’Églon : « Guedéroth, Beth-Dagon, Naama, et Makkéda ; seize villes, et leurs villages ». On n’en dit rien de plus. Son site est inconnu ; l’Encyclopaedia Judaica la place dans le sud de la Shéphéla. Le nom revient : une seconde Beth-Dagon se trouvait à la frontière d’Aser."
    - "La ville n’est probablement pas le Beit Dajan au sud-est de Jaffa qui porte encore le nom. Ce village, aujourd’hui la ville israélienne de Beit Dagan, est le Bit-Daganna que Sanchérib prit en 701 av. J.-C. avec Joppé, Bené-Berak et Azor, villes du roi d’Askalon ; c’est aussi le Kaphar Dagon qu’Eusèbe plaçait entre Diospolis (Lydde) et Jamnia (Yavné). Comme le note l’International Standard Bible Encyclopedia, il se trouve hors de la Shéphéla, et l’Encyclopaedia Judaica tient la ville judéenne pour non identifiée."
  it:
    - "Bet-Dagon, «casa di Dagon», il dio noto soprattutto dai Filistei, era una città della Sefela di Giuda, elencata in Giosuè nel distretto di Lachis ed Eglon: «Ghederoth, Beth-Dagon, Naama e Makkeda: sedici città e i loro villaggi». Di essa non si dice altro. Il suo sito è ignoto; l’Encyclopaedia Judaica la colloca nella Sefela meridionale. Il nome ricorre: un secondo Bet-Dagon sorgeva al confine di Aser."
    - "La città probabilmente non è il Beit Dajan a sud-est di Giaffa che porta ancora il nome. Quel villaggio, oggi la città israeliana di Beit Dagan, è il Bit-Daganna che Sennacherib prese nel 701 a.C. insieme a Giaffa, Bene-Berak e Azor, città del re di Ascalona; è anche il Kaphar Dagon che Eusebio collocava tra Diospoli (Lidda) e Iamnia (Yavne). Come osserva la International Standard Bible Encyclopedia, si trova fuori dalla Sefela, e l’Encyclopaedia Judaica considera la città di Giuda come non identificata."
  nl:
    - "Beth-Dagon, ‘huis van Dagon’, de god die vooral van de Filistijnen bekend is, was een stad in de Sefela van Juda, in Jozua vermeld in het district van Lachis en Eglon: “En Gederoth, Beth-Dagon, en Naama, en Makkeda; zestien steden en haar dorpen”. Meer wordt er niet van verteld. De ligging is onbekend; de Encyclopaedia Judaica plaatst haar in de zuidelijke Sefela. De naam keert terug: een tweede Beth-Dagon lag aan de grens van Aser."
    - "De stad is waarschijnlijk niet het Beit Dajan ten zuidoosten van Jaffa dat de naam nog draagt. Dat dorp, nu de Israëlische stad Beit Dagan, is het Bit-Daganna dat Sanherib in 701 v.Chr. innam samen met Joppe, Bene-Berak en Azor, steden van de koning van Askelon; het is ook het Kaphar Dagon dat Eusebius tussen Diospolis (Lydda) en Jamnia (Javne) plaatste. Zoals de International Standard Bible Encyclopedia opmerkt, ligt het buiten de Sefela, en de Encyclopaedia Judaica behandelt de stad in Juda als niet geïdentificeerd."
  pl:
    - "Bet-Dagon, „dom Dagona”, boga najlepiej znanego od Filistynów, było miastem Szefeli judzkiej, wymienionym w Księdze Jozuego w okręgu Lakisz i Eglon: „I Kiederot, Bet Dagon, i Naama, i Maceda, miast szesnaście, i wsi ich”. Nic więcej o nim nie wiadomo. Jego położenie jest nieznane; Encyclopaedia Judaica umieszcza je w południowej Szefeli. Nazwa się powtarza: drugie Bet-Dagon leżało na granicy Aszera."
    - "Prawdopodobnie nie jest to Bajt Dadżan na południowy wschód od Jafy, który do dziś nosi tę nazwę. Ta wieś, dziś izraelskie miasto Beit Dagan, to Bit-Daganna, które Sennacheryb zajął w 701 p.n.e. razem z Jafą, Bene-Berak i Azorem, miastami króla Aszkelonu; to także Kafar Dagon, które Euzebiusz umieścił między Diospolis (Lod) a Jamnią (Jawne). Jak zauważa International Standard Bible Encyclopedia, leży ono poza Szefelą, a Encyclopaedia Judaica traktuje miasto judzkie jako niezidentyfikowane."
  cs:
    - "Bét-dagon, „dům Dagonův“, boha nejlépe známého od Pelištejců, bylo město judské Šefely, uvedené v knize Jozue v okrese Lachiše a Eglonu: „Gederot, Betdagon, a Naama, i Maceda, měst šestnáct a vsi jejich“. Nic víc se o něm nevypráví. Jeho poloha není známa; Encyclopaedia Judaica je klade do jižní Šefely. Jméno se opakuje: druhý Bét-dagon ležel na hranici Ašeru."
    - "Město nejspíš není Bejt Dajan jihovýchodně od Jaffy, který jméno dosud nese. Ta vesnice, dnes izraelské město Bejt Dagan, je Bít-Daganna, kterou Senacherib dobyl roku 701 př. n. l. spolu s Joppe, Bené-berakem a Azorem, městy krále Aškelonu; je to také Kafar Dagon, kterou Eusebius umístil mezi Diospolis (Lod) a Jamnii (Javne). Jak poznamenává International Standard Bible Encyclopedia, leží mimo Šefelu, a Encyclopaedia Judaica pokládá judské město za neidentifikované."
  sv:
    - "Bet-Dagon, ”Dagons hus”, guden som är mest känd från filistéerna, var en stad i Judas Shefela, upptagen i Josua i distriktet kring Lakish och Eglon: ”Gederot, Bet-Dagon, Naama och Mackeda -- sexton städer med sina byar”. Ingenting mer berättas om den. Dess plats är okänd; Encyclopaedia Judaica placerar den i södra Shefela. Namnet återkommer: ett andra Bet-Dagon låg på Ashers gräns."
    - "Staden är sannolikt inte Beit Dajan sydost om Jaffa som ännu bär namnet. Den byn, nu den israeliska staden Beit Dagan, är det Bit-Daganna som Sanherib intog år 701 f.Kr. tillsammans med Joppe, Bene-Berak och Asor, städer som tillhörde kungen av Ashkelon; det är också det Kaphar Dagon som Eusebios placerade mellan Diospolis (Lod) och Jamnia (Javne). Som International Standard Bible Encyclopedia noterar ligger den utanför Shefela, och Encyclopaedia Judaica behandlar Judas stad som oidentifierad."
  nb:
    - "Bet-Dagon, «Dagons hus», guden best kjent fra filisterne, var en by i Sjefela i Juda, oppført i Josva i distriktet Lakisj og Eglon: «og Gederot, Bet-Dagon og Na'ama og Makkeda - seksten byer med tilhørende landsbyer». Mer fortelles ikke om den. Stedet er ukjent; Encyclopaedia Judaica plasserer det i sørlige Sjefela. Navnet gjentas: en annen Bet-Dagon lå på grensen til Asjer."
    - "Byen er trolig ikke Beit Dajan sørøst for Jaffa, som fortsatt bærer navnet. Den landsbyen, nå den israelske byen Beit Dagan, er Bit-Daganna som Sankerib inntok i 701 f.Kr. sammen med Jaffa, Bene-Berak og Asor, byer som tilhørte kongen av Asjkelon; det er også Kaphar Dagon som Eusebius plasserte mellom Diospolis (Lod) og Jamnia (Yavne). Som International Standard Bible Encyclopedia bemerker, ligger den utenfor Sjefela, og Encyclopaedia Judaica behandler den judeiske byen som uidentifisert."
  tl:
    - "Ang Beth-dagon, “bahay ni Dagon”, ang diyos na pinakakilala sa mga Filisteo, ay bayan ng Sephela ng Juda, nakalista sa Josue sa distrito ng Lachis at Eglon: “At Gederoth, at Beth-dagon, at Naama at Maceda: labing anim na bayan pati ng mga nayon ng mga yaon”. Wala nang isinasalaysay tungkol dito. Hindi alam ang lugar nito; inilalagay ito ng Encyclopaedia Judaica sa timog Sephela. Umuulit ang pangalan: ang ikalawang Beth-dagon ay nasa hangganan ng Aser."
    - "Ang bayan ay marahil hindi ang Beit Dajan sa timog-silangan ng Jaffa na nagtataglay pa ng pangalan. Ang nayong iyon, na bayan ng Beit Dagan sa Israel ngayon, ang Bit-Daganna na sinakop ni Sennacherib noong 701 BK kasama ng Joppa, Bene-berac at Azor, mga lungsod ng hari ng Ascalon; ito rin ang Kaphar Dagon na inilagay ni Eusebio sa pagitan ng Diospolis (Lod) at Jamnia (Yavne). Gaya ng itinatala ng International Standard Bible Encyclopedia, nasa labas ito ng Sephela, at itinuturing ng Encyclopaedia Judaica na hindi natutukoy ang bayan ng Juda."
  da:
    - "Bet-Dagon, »Dagons hus«, guden bedst kendt fra filisterne, var en by i Judas Sjefela, opregnet i Josva i distriktet omkring Lakisj og Eglon: »og Gederoth, Beth-Dagon og Naama og Makkeda; seksten Stæder og deres Landsbyer«. Intet mere fortælles om den. Dens sted er ukendt; Encyclopaedia Judaica placerer den i det sydlige Sjefela. Navnet går igen: et andet Bet-Dagon lå på Asers grænse."
    - "Byen er sandsynligvis ikke Beit Dajan sydøst for Jaffa, der stadig bærer navnet. Den landsby, nu den israelske by Beit Dagan, er det Bit-Daganna, som Sankerib indtog i 701 f.Kr. sammen med Joppe, Bene-Berak og Azor, byer under Askalons konge; det er også den Kaphar Dagon, som Eusebios placerede mellem Diospolis (Lydda) og Jamnia (Jabne). Som International Standard Bible Encyclopedia bemærker, ligger den uden for Sjefela, og Encyclopaedia Judaica behandler den judæiske by som uidentificeret."
  sr:
    - "Вет-Дагон, „дом Дагонов“, бога најпознатијег по Филистејима, био је град у Сефели Јуде, наведен у Исусу Навину у округу Лахиса и Јеглона: „и Гедирот, Вет-Дагон, и Нама и Макида; шеснаест градова са селима својим“. Ништа више се о њему не прича. Његово налазиште је непознато; Encyclopaedia Judaica ставља га у јужну Сефелу. Име се понавља: други Вет-Дагон лежао је на међи Асировој."
    - "Град вероватно није Бејт Даџан југоисточно од Јафе који још носи име. То село, сада израелски град Бејт Даган, јесте Бит-Даганна коју је Сенахирим заузео 701. п. н. е. заједно са Јопом, Вани-Вараком и Азором, градовима цара Ашкелона; то је и Кафар Дагон који је Јевсевије ставио између Диосполиса (Лида) и Јамније (Јавне). Како напомиње International Standard Bible Encyclopedia, лежи изван Сефеле, а Encyclopaedia Judaica јудејски град сматра неутврђеним."
  hu:
    - "Bét-Dágon, „Dágon háza”, a filiszteusokról leginkább ismert isten nevét viselve, Júda Sefélájának városa volt, Józsué a Lákis és Eglon kerületében sorolja fel: „Gedéróth, Béth-Dágon, Naama és Makkéda. Tizenhat város és ezeknek falui.” Többet nem mondanak róla. Helye ismeretlen; az Encyclopaedia Judaica a déli Sefélába teszi. A név ismétlődik: egy második Bét-Dágon Áser határán feküdt."
    - "A város valószínűleg nem az a Jaffától délkeletre fekvő Beit Dajan, amely még ma is viseli a nevet. Az a falu, ma az izraeli Beit Dagan város, az a Bit-Daganna, amelyet Szanhérib Kr. e. 701-ben elfoglalt Joppéval, Bené-Berákkal és Ázórral együtt, az askelóni király városaival; ez a Kaphar Dagon is, amelyet Euszébiosz Diospolisz (Lod) és Jamnia (Jabné) közé helyezett. Ahogy az International Standard Bible Encyclopedia megjegyzi, a Sefélán kívül fekszik, az Encyclopaedia Judaica pedig a júdai várost azonosítatlannak tekinti."
  fi:
    - "Bet-Dagon, ”Dagonin talo”, jumalan, joka tunnetaan parhaiten filistealaisista, oli kaupunki Juudan Sefelassa, Joosuan kirjassa lueteltuna Lakisin ja Eglonin piirissä: ”Gederot, Beet-Daagon, Naema ja Makkeda – kuusitoista kaupunkia kylineen”. Siitä ei kerrota enempää. Sen paikka on tuntematon; Encyclopaedia Judaica sijoittaa sen eteläiseen Sefelaan. Nimi toistuu: toinen Bet-Dagon sijaitsi Asserin rajalla."
    - "Kaupunki ei luultavasti ole Jaffasta kaakkoon sijaitseva Beit Dajan, joka yhä kantaa nimeä. Tuo kylä, nykyinen Israelin Beit Daganin kaupunki, on Bit-Daganna, jonka Sanherib valtasi 701 eaa. yhdessä Joppen, Bene-Berakin ja Asorin, Askelonin kuninkaan kaupunkien, kanssa; se on myös Kaphar Dagon, jonka Eusebios sijoitti Diospoliksen (Lod) ja Jamnian (Yavne) väliin. Kuten International Standard Bible Encyclopedia toteaa, se sijaitsee Sefelan ulkopuolella, ja Encyclopaedia Judaica pitää juudalaiskaupunkia tunnistamattomana."
  vi:
    - "Bết-Đa-gôn, “nhà của Đa-gôn”, vị thần được biết nhiều nhất từ người Phi-li-tin, là một thành của Sê-phê-la thuộc Giu-đa, được liệt kê trong sách Giô-suê trong quận La-ki và Éc-lôn: “Ghê-đê-rốt, Bết-Đa-gôn, Na-a-ma, và Ma-kê-đa: hết thảy là mười sáu thành với các làng của nó”. Không có gì khác được kể về nó. Địa điểm không được biết; Encyclopaedia Judaica đặt nó ở nam Sê-phê-la. Tên tái diễn: một Bết-Đa-gôn thứ hai nằm trên ranh giới của A-se."
    - "Thành có lẽ không phải Beit Dajan phía đông nam Jaffa vẫn mang tên ấy. Làng đó, nay là thị trấn Beit Dagan của Israel, là Bit-Daganna mà San-chê-ríp chiếm năm 701 TCN cùng Giốp-bê, Bê-nê-Bê-rác và A-xô, các thành của vua Ách-ca-lôn; nó cũng là Kaphar Dagon mà Eusebius đặt giữa Diospolis (Ly-đa) và Jamnia (Yavne). Như International Standard Bible Encyclopedia ghi nhận, nó nằm ngoài Sê-phê-la, và Encyclopaedia Judaica coi thành của Giu-đa là chưa xác định."
  ro:
    - "Bet-Dagon, „casa lui Dagon”, zeul cel mai bine cunoscut de la filisteni, era o cetate din Șefela lui Iuda, înșirată în Iosua în districtul Lachișului și al Eglonului: Ghederot, Bet-Dagon, Naama și Maceda, șaisprezece cetăți și satele lor. Nimic mai mult nu se spune despre ea. Locul ei este necunoscut; Encyclopaedia Judaica o plasează în Șefela de sud. Numele revine: un al doilea Bet-Dagon se afla la hotarul lui Așer, unde hotarul „se întoarce dela răsăritul soarelui către Vidagon”."
    - "Cetatea nu este probabil Beit Dajan, la sud-est de Jaffa, care încă poartă numele. Acel sat, acum orașul israelian Beit Dagan, este Bit-Daganna pe care Senaherib l-a luat în 701 î.Hr. împreună cu Iafo, Bene-Berac și Azor, cetăți ale regelui Ascalonului; este și Kaphar Dagon pe care Eusebiu îl așeza între Diospolis (Lida) și Jamnia (Yavne). După cum notează International Standard Bible Encyclopedia, se află în afara Șefelei, iar Encyclopaedia Judaica tratează cetatea iudeeană ca neidentificată."
  bg:
    - "Бет-Дагон, „дом на Дагон“, бога, най-известен от филистимците, бил град в Шефела на Юда, изброен в Иисус Навин в окръга на Лахис и Еглон: „И Гедирот, Вет-дагон, и Наама, и Макида, градове шеснадесет, и селата им“. Нищо повече не се разказва за него. Мястото му е неизвестно; Encyclopaedia Judaica го поставя в южната Шефела. Името се повтаря: втори Бет-Дагон лежал на границата на Асир."
    - "Градът вероятно не е Бейт Даджан на югоизток от Яфа, който още носи името. Това село, днес израелският град Бейт Даган, е Бит-Дагана, който Сенахирим взел през 701 г. пр.н.е. заедно с Яфа, Бене-Верак и Азор, градове на царя на Аскалон; то е и Кафар Дагон, който Евсевий поставял между Диосполис (Лида) и Ямния (Явне). Както отбелязва International Standard Bible Encyclopedia, то лежи извън Шефела, а Encyclopaedia Judaica третира юдейския град като неотъждествен."
