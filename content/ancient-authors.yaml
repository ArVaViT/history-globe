      ru: "Из Клисмы Эгерия отправилась в землю Гесем, то есть к городу Аравия, по которому назван весь округ; это часть Египта, но земля там гораздо лучше, чем во всём остальном Египте."
  - place: a60f092
    author: { en: "Egeria", ru: "Эгерия" }
    work: { en: "Itinerary", ru: "Паломничество" }
    passage: "9.4-5"
    url: "https://www.thelatinlibrary.com/egeria1.html"
    note:
      en: "From the city of Arabia she travelled two days through Goshen along the Nile, among vines for wine and vines for balsam, orchards, fields and gardens, past estates that were once the homesteads of the Israelites, and thought she had never seen a fairer land."
      ru: "Из города Аравия она два дня шла по земле Гесем вдоль Нила среди виноградников, дающих вино и бальзам, садов, полей и огородов, мимо усадеб, где некогда жили сыны Израилевы, и решила, что прекраснее края не видела."
  - place: a60f092
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "2.188"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=2:section=187"
    note:
      en: "Marvelling at Jacob's 130 years, Pharaoh let him live with his sons at Heliopolis, for there the king's own shepherds had their pastures; Josephus puts Heliopolis where the Bible has Goshen."
      ru: "Подивившись ста тридцати годам Иакова, фараон позволил ему жить с сыновьями в Илиополе, потому что там пасли стада и царские пастухи; где в Библии Гесем, у Иосифа Илиополь."

  # ---------- Great Sea ----------
  - place: aa805fb
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "2.5.18"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=2:chapter=5:section=18"
    note:
      en: "Of the four great gulfs the Ocean drives into the land, the largest is the Inner Sea, Our Sea: it enters at the Pillars of Heracles, runs east and splits into the Euxine and the seas of Egypt, Pamphylia and Issus; its shores are the best known and most civilized."
      ru: "Из четырёх больших заливов, которые Океан врезает в сушу, крупнейший — Внутреннее, или Наше, море: оно входит у Геракловых столпов, тянется на восток и делится на Понт Эвксинский и моря Египетское, Памфилийское и Исское; его берега лучше всего известны и населены самыми просвещёнными народами."
  - place: aa805fb
    author: { en: "Pliny the Elder", ru: "Плиний Старший" }
    work: { en: "Natural History", ru: "Естественная история" }
    passage: "3.3-4"
    url: "https://penelope.uchicago.edu/Thayer/L/Roman/Texts/Pliny_the_Elder/3*.html#3"
    note:
      en: "The Atlantic breaks in at the strait of Gades, fifteen miles long and five wide, and through so narrow a mouth opens so vast a sea; the mountains Abila and Calpe on either side are the Pillars of Hercules, which local people believe were cut through to let the sea in."
      ru: "Атлантический океан врывается через Гадитанский пролив длиной в пятнадцать миль и шириной в пять, и через столь узкое устье открывается такая громада моря; горы Абила и Кальпа по сторонам — Геркулесовы столпы, и местные верят, что их прорыли, впустив море."

  # ---------- Greece ----------
  - place: a4492a0
    author: { en: "Herodotus", ru: "Геродот" }
    work: { en: "Histories", ru: "История" }
    passage: "8.144"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0126:book=8:chapter=144"
    note:
      en: "Refusing the Persian offer in 479 BC, the Athenians told the Spartans they would never betray Hellas, for all Greeks are bound by common blood and speech, shared shrines and sacrifices, and a like way of life."
      ru: "Отвергая предложение персов в 479 г. до н. э., афиняне сказали спартанцам, что никогда не предадут Елладу: всех эллинов связывают общая кровь и язык, общие святилища и жертвы и сходный образ жизни."
  - place: a4492a0
    author: { en: "Thucydides", ru: "Фукидид" }
    work: { en: "History of the Peloponnesian War", ru: "История Пелопоннесской войны" }
    passage: "1.3"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0200:book=1:chapter=3"
    note:
      en: "Before the Trojan war Hellas had no common name: the land went by its tribes, chiefly the Pelasgians, until Hellen and his sons grew strong in Phthiotis and their name spread city by city; Homer still calls the Greeks Danaans, Argives and Achaeans."
      ru: "До Троянской войны у Еллады не было общего имени: страна звалась по племенам, больше всего по пеласгам, пока Эллин и его сыновья не усилились во Фтиотиде и их имя не распространилось от города к городу; у Гомера греки ещё данайцы, аргивяне и ахейцы."
  - place: a4492a0
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "1.124"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=1:section=122"
    note:
      en: "Among the sons of Japheth, Josephus derives the Medes from Madai, and Ionia and all the Greeks from Javan."
      ru: "Среди сыновей Иафета Иосиф выводит мидян от Мадая, а Ионию и всех эллинов — от Иавана."

  # ---------- Hamath ----------
  - place: ac62cbc
    author: { en: "Shalmaneser III", ru: "Салманасар III" }
    work: { en: "Kurkh Monolith, column ii, lines", ru: "Курхский монолит, столбец ii, строки" }
    passage: "86-102"
    url: "https://oracc.museum.upenn.edu/riao/Q004607/html"
    note:
      en: "In 853 BC Shalmaneser took royal cities of Irhuleni of Hamath and burned his royal city Qarqar; there twelve kings met him, Irhuleni with 700 chariots, 700 horse and 10,000 men beside Hadadezer of Damascus and Ahab of Israel."
      ru: "В 853 г. до н. э. Салманасар взял царские города Ирхулени Емафского и сжёг его царский город Каркар; там против него вышли двенадцать царей — Ирхулени с 700 колесницами, 700 всадниками и 10 000 воинов, рядом с Адад-Езером Дамасским и Ахавом Израильским."
  - place: ac62cbc
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "1.138"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=1:section=130"
    note:
      en: "Amathus, a son of Canaan, settled Amathine, which its people still call Amathe, though the Macedonians renamed it Epiphania after one of their kings."
      ru: "Амафус, сын Ханаана, заселил Амафину, которую местные и теперь зовут Амафой, хотя македоняне переименовали её в Епифанию по одному из своих царей."
  - place: ac62cbc
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "451"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm"
    note:
      en: "The Hamath of Isaiah is a city of the Damascus region besieged by the king of Assyria; Amos calls it Hamath the great, and Eusebius suggests it is Epiphania near Emesa, which the Syrians still call by the old name."
      ru: "Емаф у Исаии — город области Дамаска, который осаждал царь Ассирийский; Амос зовёт его Емафом великим, а Евсевий предполагает, что это Епифания близ Емесы, которую сирийцы и теперь называют старым именем."

  # ---------- Haran ----------
  - place: a6d9af3
    author: { en: "Egeria", ru: "Эгерия" }
    work: { en: "Itinerary", ru: "Паломничество" }
    passage: "20.1-5"
    url: "https://www.thelatinlibrary.com/egeria1.html"
    note:
      en: "About 384 Egeria came to Charrae, the Charran of Scripture where Abraham lived; its bishop, a monk and confessor, showed her the church outside the city on the site of Abraham's house, now holding the martyr Helpidius, for whose feast monks came from all Mesopotamia."
      ru: "Около 384 г. Эгерия пришла в Карры, библейский Харран, где жил Авраам; местный епископ, монах и исповедник, показал ей церковь за городом на месте дома Авраама, где ныне лежит мученик Елпидий, на чей праздник сходятся монахи со всей Месопотамии."
  - place: a6d9af3
    author: { en: "Ammianus Marcellinus", ru: "Аммиан Марцеллин" }
    work: { en: "History", ru: "Римская история" }
    passage: "23.3.1-2"
    url: "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Ammian/23*.html#3"
    note:
      en: "In 363 Julian reached Carrae, an ancient town notorious for the disaster of the Crassi; from there two royal roads led to Persia, and he stayed several days to sacrifice to the Moon, which is venerated in that region."
      ru: "В 363 г. Юлиан дошёл до Карр — древнего города, печально известного гибелью Крассов; оттуда в Персию вели две царские дороги, и он задержался на несколько дней, чтобы принести жертвы Луне, которую чтут в тех краях."
  - place: a6d9af3
    author: { en: "Plutarch", ru: "Плутарх" }
    work: { en: "Life of Crassus", ru: "Жизнеописание Красса" }
    passage: "27.6-8"
    url: "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Plutarch/Lives/Crassus*.html#27"
    note:
      en: "After the defeat of 53 BC the Roman army fell back in disorder by night; 300 horsemen under Ignatius reached Carrhae about midnight and called to the sentries on the walls to tell Coponius, the commander, that there had been a great battle."
      ru: "После разгрома 53 г. до н. э. римское войско ночью в беспорядке отступало; триста всадников Игнатия к полуночи достигли Карр и крикнули часовым на стенах, чтобы те передали начальнику Копонию о большой битве."

  # ---------- Havvoth-jair ----------
  - place: a26c8f2
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "45"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm"
    note:
      en: "Havvoth-jair, meaning the homes of Jair, lies in Bashan among the sixty villages of Mount Gilead taken by the half-tribe of Manasseh; Eusebius places it in the district called Gaulon in Batanaea."
      ru: "Селения Иаировы, то есть «жилища Иаира», лежат в Васане среди шестидесяти селений горы Галаад, доставшихся половине колена Манассиина; Евсевий помещает их в округе Голан в Батанее."

  # ---------- Hazor ----------
  - place: a6f33c5
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "5.199"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=5:section=198"
    note:
      en: "Jabin ruled from Hazor, a city lying above Lake Semechonitis, and kept 300,000 foot, 10,000 horse and 3,000 chariots under his general Sisera."
      ru: "Иавин правил из Асора, города над Семехонитским озером, и содержал 300 000 пехоты, 10 000 конницы и 3000 колесниц под началом военачальника Сисары."
  - place: a6f33c5
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "13.158-162"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=13:section=158"
    note:
      en: "Jonathan came from the lake of Gennesar into the plain called Asor and was ambushed by Demetrius' generals; all fled but about fifty men, who held, turned the enemy and pursued them as far as Kedesh."
      ru: "Ионафан пришёл от Геннисаретского озера на равнину, называемую Асор, и попал в засаду полководцев Димитрия; бежали все, кроме полусотни воинов, но они устояли, обратили врага и гнали его до Кедеса."

  # ---------- Heliopolis ----------
  - place: acd9137
    author: { en: "Herodotus", ru: "Геродот" }
    work: { en: "Histories", ru: "История" }
    passage: "2.3"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0126:book=2:chapter=3"
    note:
      en: "Herodotus went to Heliopolis as well as Thebes to check what the priests of Memphis had told him, for the people of Heliopolis were said to be the most learned of the Egyptians."
      ru: "Геродот ездил в Илиополь и в Фивы, чтобы проверить рассказы мемфисских жрецов, ибо жители Илиополя слыли самыми учёными из египтян."
  - place: acd9137
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "17.1.27"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=17:chapter=1:section=27"
    note:
      en: "Heliopolis stands on a great mound with lakes before it and has a temple of the Sun and the sacred bull Mnevis, but in Strabo's day it was entirely deserted; its ancient temple bore the marks of Cambyses' sacrilege, and two of its obelisks had gone to Rome."
      ru: "Илиополь стоит на большом холме, перед которым озёра; там храм Солнца и священный бык Мневис, но при Страбоне город был совсем пуст; древний храм хранил следы святотатства Камбиза, а два его обелиска увезли в Рим."
  - place: acd9137
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "17.1.29"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=17:chapter=1:section=29"
    note:
      en: "Strabo was shown the large houses where the priests, once famed for philosophy and astronomy, had lived, and the lodgings of Plato and Eudoxus, said to have studied with them for thirteen years; now only guides to the temples were left."
      ru: "Страбону показали большие дома, где жили жрецы, некогда славные философией и астрономией, и жилища Платона и Евдокса, будто бы учившихся у них тринадцать лет; теперь там остались лишь служители, показывающие храмы приезжим."

  # ---------- Heshbon ----------
  - place: abf2fc1
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "408"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm"
    note:
      en: "Heshbon, the city of Sihon the Amorite, taken from Moab and given to Reuben and the Levites, is now Esbus, a famous city of Arabia in the mountains opposite Jericho, twenty miles from the Jordan."
      ru: "Есевон, город Сигона Аморрейского, отнятый у Моава и отданный Рувиму и левитам, ныне Есвус — знаменитый город Аравии в горах напротив Иерихона, в двадцати милях от Иордана."
  - place: abf2fc1
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "13.397"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=13:section=395"
    note:
      en: "Under Alexander Jannaeus the Jews held Heshbon among the towns of Moab, with Medeba and others, in a long list of cities taken from the Syrians, Idumaeans and Phoenicians."
      ru: "При Александре Яннае иудеи владели Есевоном среди моавитских городов вместе с Медевой и другими — в длинном списке городов, отнятых у сирийцев, идумеев и финикиян."

  # ---------- Holy Place ----------
  - place: ab60a74
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish War", ru: "Иудейская война" }
    passage: "5.207-214"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0148:book=5:section=207"
    note:
      en: "The sanctuary was entered through a golden porch with golden vines whose clusters hung as tall as a man; its inner part had golden doors 55 cubits high, and before them hung a Babylonian curtain of blue, linen, scarlet and purple, an image of the universe."
      ru: "В святилище входили через золотой притвор с золотыми лозами, грозди которых свисали в рост человека; внутренняя часть имела золотые двери высотой в 55 локтей, а перед ними висела вавилонская завеса из голубой, льняной, червлёной и пурпурной ткани — образ вселенной."
  - place: ab60a74
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish War", ru: "Иудейская война" }
    passage: "5.215-218"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0148:book=5:section=215"
    note:
      en: "The first part of the sanctuary, forty cubits long, held three works famed among all mankind: the lampstand, whose seven lamps meant the planets, the table, whose twelve loaves meant the zodiac, and the altar of incense with its thirteen spices."
      ru: "Первая часть святилища длиной в сорок локтей хранила три предмета, славные у всех людей: светильник, семь лампад которого означали планеты, стол, двенадцать хлебов которого означали зодиак, и жертвенник курения с тринадцатью благовониями."
  - place: ab60a74
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "14.72"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=14:section=69"
    note:
      en: "Taking the Temple in 63 BC, Pompey and many of his men went in and saw what only the high priest might see: the golden table, the sacred lampstand, the libation vessels, heaps of spices and 2,000 talents of sacred money; he touched none of it."
      ru: "Взяв Храм в 63 г. до н. э., Помпей и многие его люди вошли внутрь и увидели то, что дозволено видеть лишь первосвященнику: золотой стол, священный светильник, сосуды для возлияний, груды благовоний и две тысячи талантов священных денег, — но ничего не тронул."

  # ---------- House of the Forest of Lebanon ----------
  - place: a966bdf
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "8.133"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=8:section=133"
    note:
      en: "Solomon's hall for hearing lawsuits held a great crowd: it was 100 cubits long, 50 wide and 30 high, borne on square cedar pillars, with a roof Josephus calls Corinthian and folding doors flanked by fluted pillars."
      ru: "Палата Соломона для разбора тяжб вмещала множество людей: сто локтей в длину, пятьдесят в ширину и тридцать в высоту, на четырёхгранных кедровых столбах, с кровлей, которую Иосиф называет коринфской, и створчатыми дверями между желобчатыми столбами."

  # ---------- Iconium ----------
  - place: ae425aa
    author: { en: "Xenophon", ru: "Ксенофонт" }
    work: { en: "Anabasis", ru: "Анабасис" }
    passage: "1.2.19"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0202:book=1:chapter=2:section=19"
    note:
      en: "In 401 BC Cyrus the Younger marched three stages, twenty parasangs, to Iconium, the last city of Phrygia, rested there three days and then let the Greeks plunder Lycaonia as hostile ground."
      ru: "В 401 г. до н. э. Кир Младший прошёл три перехода, двадцать парасангов, до Иконии, последнего города Фригии, простоял там три дня, а затем отдал грекам на разграбление Ликаонию как враждебную землю."
  - place: ae425aa
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "12.6.1"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=12:chapter=6:section=1"
    note:
      en: "Amid the cold, bare Lycaonian plains, fit only for wild asses and sheep, lies Iconium, a small but well-built town with a more fertile tract around it; Polemo held it."
      ru: "Среди холодных голых ликаонских равнин, пригодных лишь для диких ослов и овец, лежит Икония — небольшой, но хорошо застроенный город, окружённый более плодородной землёй; им владел Полемон."
  - place: ae425aa
    author: { en: "Pliny the Elder", ru: "Плиний Старший" }
    work: { en: "Natural History", ru: "Естественная история" }
    passage: "5.95"
    url: "https://penelope.uchicago.edu/Thayer/L/Roman/Texts/Pliny_the_Elder/5*.html#95"
    note:
      en: "Pliny lists a tetrarchy of fourteen cities carved out of Lycaonia on the Galatian border, whose most celebrated city is Iconium."
      ru: "Плиний называет тетрархию из четырнадцати городов, выделенную из Ликаонии на границе с Галатией, и самый знаменитый её город — Иконию."

  # ---------- Jabbok ----------
  - place: aca7bd9
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "521"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm"
    note:
      en: "The torrent Jacob crossed before he wrestled and was renamed Israel; it flows between Philadelphia, that is Amman, and Gerasa, four miles from Gerasa, and then runs down to join the Jordan."
      ru: "Поток, перейдя который Иаков боролся и получил имя Израиль; он течёт между Филадельфией, то есть Амманом, и Герасой, в четырёх милях от Герасы, а затем спускается и сливается с Иорданом."
  - place: aca7bd9
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "4.95"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=4:section=87"
    note:
      en: "The Amorite land that Moses took lay like an island between three rivers: the Arnon on the south, the Jabbok on the north, which loses its name when it falls into the Jordan, and the Jordan on the west."
      ru: "Аморрейская земля, занятая Моисеем, лежала словно остров между тремя реками: Арноном на юге, Иавоком на севере, который, впадая в Иордан, теряет своё имя, и Иорданом на западе."

  # ---------- Jabesh-gilead ----------
  - place: af92088
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "6.68-71"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=6:section=68"
    note:
      en: "Nahash king of Ammon, who put out the right eye of every captive so that, with the left hidden behind the shield, he was useless in war, besieged Jabesh, the chief city of the Gileadites."
      ru: "Наас, царь Аммонитский, выкалывавший пленным правый глаз, чтобы, прикрыв левый щитом, они стали негодны к бою, осадил Иавис — главный город галаадитян."
  - place: af92088
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "6.375-377"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=6:section=374"
    note:
      en: "Hearing that the Philistines had mutilated the bodies of Saul and his sons, the bravest men of Jabesh, a city Josephus calls strong in body and spirit, walked all night to Beth-shan, took the bodies from the wall and buried them at home."
      ru: "Услышав, что филистимляне надругались над телами Саула и его сыновей, храбрейшие мужи Иависа — города, по словам Иосифа, сильного телом и духом, — шли всю ночь до Беф-Сана, сняли тела со стены и похоронили их у себя."
  - place: af92088
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "568"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm"
    note:
      en: "In Eusebius' day Jabesh was a village beyond the Jordan, on the hills six miles from Pella on the road to Gerasa."
      ru: "При Евсевии Иавис был деревней за Иорданом, в горах в шести милях от Пеллы по дороге в Герасу."

  # ---------- Jahaz ----------
  - place: ad9b1cd
    author: { en: "Mesha of Moab", ru: "Меса, царь Моава" }
    work: { en: "Mesha Stele, lines", ru: "стела Меши, строки" }
    passage: "18-21"
    url: "https://en.wikisource.org/wiki/The_Inscription_on_the_Stele_of_M%C3%A9%C5%A1a%CA%BF/Translation"
    note:
      en: "The king of Israel had built Jahaz and stayed there while fighting Mesha; Chemosh drove him out, and Mesha took 200 of the leading men of Moab, captured the town and added it to Dibon."
      ru: "Царь Израильский построил Иаацу и жил там, воюя с Месой; Хамос изгнал его, и Меса, взяв двести знатнейших мужей Моава, захватил город и присоединил его к Дивону."
  - place: ad9b1cd
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "526"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm"
    note:
      en: "Here Sihon king of the Amorites was fought; Isaiah and Jeremiah name it in their oracles against Moab, and in Eusebius' day it was pointed out between Medeba and Dibon."
      ru: "Здесь была битва с Сигоном, царём Аморрейским; Исаия и Иеремия упоминают его в пророчествах о Моаве, а при Евсевии место показывали между Медевой и Дивоном."

  # ---------- Jarmuth ----------
  - place: a539e01
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "542"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm"
    note:
      en: "A town of Judah; in Eusebius' day the village Iermochos stood ten miles from Eleutheropolis on the road to Jerusalem."
      ru: "Город в уделе Иуды; при Евсевии деревня Иермох стояла в десяти милях от Елевферополя по дороге в Иерусалим."

  # ---------- Jattir ----------
  - place: ad6eb0b
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "545"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm"
    note:
      en: "A priestly city of Judah; Eusebius knew a very large village, Ietheria, twenty miles from Eleutheropolis in the inner Daroma near Malatha, all of whose people were Christians."
      ru: "Священнический город в уделе Иуды; Евсевий знал очень большую деревню Иеферию в двадцати милях от Елевферополя, во внутреннем Дароме близ Малафы, все жители которой были христианами."

  # ---------- Jazer ----------
  - place: a095b6e
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "527"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm"
    note:
      en: "An Amorite city ten miles west of Philadelphia in Peraea, a boundary of Gad and a Levite city, fifteen miles from Heshbon; a great river springs from it and flows into the Jordan."
      ru: "Аморрейский город в десяти милях к западу от Филадельфии в Перее, граница удела Гада и левитский город, в пятнадцати милях от Есевона; от него берёт начало большая река, впадающая в Иордан."
  - place: a095b6e
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "12.329"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=12:section=327"
    note:
      en: "Having beaten the Ammonites under Timotheus, Judas Maccabaeus took the city of Jazer, carried off the women and children and burned it."
      ru: "Разбив аммонитян Тимофея, Иуда Маккавей взял город Иазер, увёл в плен женщин и детей и сжёг его."

  # ---------- Jebus ----------
  - place: a403c45
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "7.61-64"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=7:section=61"
    note:
      en: "The Jebusites, a Canaanite people, shut their gates against David and set the blind and lame on the wall to mock him; David took the lower city by force, and Joab was the first to climb up to the citadel."
      ru: "Иевусеи, народ хананейский, заперли ворота перед Давидом и в насмешку поставили на стену слепых и хромых; Давид силой взял нижний город, а первым на крепость взобрался Иоав."
  - place: a403c45
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "531"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm"
    note:
      en: "Jerusalem was ruled by Adoni-bezek and then by the Jebusites, from whom it was called Jebus, until David took it and made it the capital of Judaea."
      ru: "Иерусалимом правил Адони-Везек, а затем иевусеи, по которым он звался Иевусом, пока Давид не взял его и не сделал столицей Иудеи."

  # ---------- Jeshimon ----------
  - place: ad41f6e
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "535"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm"
    note:
      en: "Isimoth is where David hid; Eusebius admits he had wrongly given it as Beth-jeshimoth, and notes that Aquila takes the word to mean disappear, while Symmachus rightly renders it desert."
      ru: "Исимоф — место, где скрывался Давид; Евсевий признаёт, что по ошибке записал его как Беф-Иешимоф, и отмечает, что Акила понимает слово как «исчезнуть», а Симмах верно переводит его «пустыня»."

  # ---------- Jezreel ----------
  - place: ae0bf4a
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "549"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm"
    note:
      en: "In Eusebius' day Jezreel was Esdraela, a very large village in the Great Plain between Scythopolis and Legio, on the border of Issachar."
      ru: "При Евсевии Изреель — это очень большая деревня Ездраила на Великой равнине между Скифополем и Легионом, на границе Иссахара."

  # ---------- Jordan Valley ----------
  - place: aa54aa4
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish War", ru: "Иудейская война" }
    passage: "4.455-458"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0148:book=4:section=451"
    note:
      en: "Between two long barren ridges lies the Great Plain, from the village of Ginnabris to Lake Asphaltitis, cut down the middle by the Jordan; it is scorched and unhealthy in summer and has no water but the river, whose banks bear the best palms."
      ru: "Между двумя длинными голыми хребтами лежит Великая равнина — от селения Гиннабрин до Асфальтового озера, — разрезанная посередине Иорданом; летом она выжжена и нездорова, и воды там нет, кроме реки, у берегов которой растут лучшие пальмы."

  # ---------- Jordan ----------
  - place: ae686c9
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish War", ru: "Иудейская война" }
    passage: "3.509-515"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0148:book=3:section=506"
    note:
      en: "Panium seems to be the Jordan's source, but the water comes underground from Phiala, a round pool 120 furlongs from Caesarea; Philip proved it with chaff. From Panium the river crosses Lake Semechonitis, passes Julias and Gennesareth and runs through desert into Lake Asphaltitis."
      ru: "Истоком Иордана кажется Паний, но вода приходит туда под землёй из Фиалы — круглого водоёма в 120 стадиях от Кесарии; Филипп доказал это мякиной. От Пания река пересекает Семехонитское озеро, минует Юлиаду и Геннисарет и через пустыню течёт в Асфальтовое озеро."
  - place: ae686c9
    author: { en: "Pliny the Elder", ru: "Плиний Старший" }
    work: { en: "Natural History", ru: "Естественная история" }
    passage: "5.71"
    url: "https://penelope.uchicago.edu/Thayer/L/Roman/Texts/Pliny_the_Elder/5*.html#71"
    note:
      en: "The Jordan rises from the spring of Paneas; a pleasant, winding river, it lingers among its neighbours as if unwilling to reach the gloomy Asphaltites, which at last swallows it, and on the way it pours into the lake called Genesara."
      ru: "Иордан берёт начало из источника Панеады; приятная извилистая река словно нехотя течёт к мрачному Асфальтовому озеру, которое в конце концов её поглощает, а по пути вливается в озеро, называемое Генисар."
  - place: ae686c9
    author: { en: "Tacitus", ru: "Тацит" }
    work: { en: "Histories", ru: "История" }
    passage: "5.6"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.02.0080:book=5:chapter=6"
    note:
      en: "Lebanon, whose summit keeps its shade and snow amid the heat, sends forth the Jordan, which does not reach the sea but flows unbroken through two lakes and is lost in the third."
      ru: "Ливан, вершина которого среди зноя покрыта лесом и снегом, питает Иордан, который не доходит до моря, а проходит, не теряясь, через два озера и исчезает в третьем."

  # ---------- Judea ----------
  - place: a149f13
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish War", ru: "Иудейская война" }
    passage: "3.51-58"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0148:book=3:section=51"
    note:
      en: "Judea runs north to south from Anuath-Borceos to a village on the Arabian border and east to west from the Jordan to Joppa; Jerusalem lies in the very middle and is called the navel of the land, and the country is divided into eleven toparchies under it."
      ru: "Иудея тянется с севера на юг от селения Ануаф-Боркей до деревни у границы Аравии, а с востока на запад — от Иордана до Иоппии; Иерусалим лежит в самой середине, его зовут пупом страны, и земля разделена на одиннадцать топархий во главе с ним."
  - place: a149f13
    author: { en: "Tacitus", ru: "Тацит" }
    work: { en: "Histories", ru: "История" }
    passage: "5.6"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.02.0080:book=5:chapter=6"
    note:
      en: "Judea is bounded by Arabia on the east, Egypt on the south, Phoenicia and the sea on the west, and looks out over Syria to the north; its people are healthy and hardy, rain is rare but the soil rich, and besides crops like Italy's it grows balsam and tall palms."
      ru: "Иудея граничит с Аравией на востоке, с Египтом на юге, с Финикией и морем на западе, а на север обращена к Сирии; жители здоровы и выносливы, дожди редки, но почва плодородна, и кроме италийских плодов здесь растут бальзам и высокие пальмы."
  - place: a149f13
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "16.2.34"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=16:chapter=2:section=34"
    note:
      en: "The western edge of Judea toward Mount Casius is held by the Idumaeans — Nabataeans who had gone over to the Jews — and by Lake Sirbonis; the land is peopled by a mixture of Egyptians, Arabs and Phoenicians, and the Jews are said to descend from Egyptians."
      ru: "Западную окраину Иудеи к горе Касий занимают идумеи — набатеи, присоединившиеся к иудеям, — и Сирбонское озеро; страну населяют смешанные племена египтян, арабов и финикиян, а сами иудеи, по преданию, происходят от египтян."

  # ---------- Kadesh-barnea ----------
  - place: ac2cef0
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "580"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm"
    note:
      en: "Kadesh-barnea lies in the desert that reaches to Petra; there Miriam died, Moses struck the rock for the thirsty people and Chedorlaomer beat the Amalekites, and Miriam's tomb is still shown."
      ru: "Кадес-Варни лежит в пустыне, простирающейся до Петры; здесь умерла Мариам, Моисей ударил в скалу, напоив жаждущий народ, Кедорлаомер разбил амаликитян, и гробницу Мариам показывают до сих пор."

  # ---------- Kedar ----------
  - place: a68d1a9
    author: { en: "Ashurbanipal", ru: "Ашшурбанапал" }
    work:
      {
        en: "Annals (RINAP 5, Ashurbanipal 11), column.line",
        ru: "анналы (RINAP 5, Ашшурбанапал 11), столбец.строка",
      }
    passage: "8.120-9.9"
    url: "https://oracc.museum.upenn.edu/rinap/rinap5/Q003710/html"
    note:
      en: "Ashurbanipal's troops marched six leagues through parching thirst from Azalla to Qurasiti, surrounded the Qedarites of Uaite' and drove his gods, his family, the people of Qedar and their donkeys, camels and flocks along the road to Damascus."
      ru: "Войска Ашшурбанапала прошли шесть поприщ по безводью от Азаллы до Курасити, окружили кидарян Уайте и погнали его богов, его семью, народ Кидара, ослов, верблюдов и мелкий скот по дороге в Дамаск."
  - place: a68d1a9
    author: { en: "Pliny the Elder", ru: "Плиний Старший" }
    work: { en: "Natural History", ru: "Естественная история" }
    passage: "5.65"
    url: "https://penelope.uchicago.edu/Thayer/L/Roman/Texts/Pliny_the_Elder/5*.html#65"
    note:
      en: "East of Egypt, beyond Pelusium, Pliny places the Arabs, with the Canchlei to the east and the Cedrei to the south, both bordering on the Nabataeans."
      ru: "За Пелусием, к востоку от Египта, Плиний помещает арабов: на востоке канхлеев, на юге кедреев, и тех и других — по соседству с набатеями."
  - place: a68d1a9
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "622"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm"
    note:
      en: "Kedar, named by Ezekiel, Jeremiah and Isaiah, lies in the land of the Saracens and takes its name from Kedar, son of Ishmael son of Abraham."
      ru: "Кидар, упомянутый у Иезекииля, Иеремии и Исаии, лежит в земле сарацин и назван по Кидару, сыну Измаила, сына Авраамова."

  # ---------- Keilah ----------
  - place: ad9df93
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "593"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm"
    note:
      en: "A town of Judah where David once lived; in Eusebius' day it was the village Kela, about eight miles east of Eleutheropolis on the road to Hebron, where the tomb of the prophet Habakkuk was shown."
