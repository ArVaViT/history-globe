    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#N_THE_GOSPELS"
    note:
      en: "From Nazareth Christ was called a Nazorean, and Christians were once called Nazarenes; it is still a village in Galilee, opposite Legio fifteen miles to the east, near Mount Tabor."
      ru: "От Назарета Христа звали Назореем, а христиан прежде — назарянами; это и теперь селение в Галилее, в пятнадцати милях к востоку от Легиона, близ горы Фавор."
  - place: af5884f
    author: { en: "Eusebius (quoting Julius Africanus)", ru: "Евсевий (по Юлию Африкану)" }
    work: { en: "Church History", ru: "Церковная история" }
    passage: "1.7.14"
    url: "https://www.newadvent.org/fathers/250101.htm"
    note:
      en: "Africanus says the Lord's kinsmen, called Desposyni, came from the Judean villages of Nazara and Cochaba and kept their family's genealogy from memory and private records."
      ru: "Африкан пишет, что родственники Господа, звавшиеся деспосинами, вышли из иудейских селений Назара и Кохаба и хранили родословие семьи по памяти и по домашним записям."
  - place: af5884f
    author: { en: "Jerome", ru: "Иероним Стридонский" }
    work: { en: "Letters", ru: "Письма" }
    passage: "108.13"
    url: "https://www.newadvent.org/fathers/3001108.htm"
    note:
      en: "Paula passed quickly through Nazareth, the nursery of the Lord, on her way to Cana, Capernaum and the lake of Tiberias."
      ru: "Паула быстро прошла через Назарет, где возрастал Господь, по пути в Кану, Капернаум и к Тивериадскому озеру."

  # ---------- Neapolis ----------
  - place: a6a7150
    author: { en: "Pliny the Elder", ru: "Плиний Старший" }
    work: { en: "Natural History", ru: "Естественная история" }
    passage: "4.42"
    url: "https://penelope.uchicago.edu/Thayer/L/Roman/Texts/Pliny_the_Elder/4*.html#42"
    note:
      en: "On the Thracian coast east of the Strymon Pliny lists Apollonia, Oesyma, Neapolis and Datos, with the colony of Philippi inland."
      ru: "На фракийском берегу к востоку от Стримона Плиний перечисляет Аполлонию, Эсиму, Неаполь и Дат, а в глубине страны — колонию Филиппы."
  - place: a6a7150
    author: { en: "Appian", ru: "Аппиан" }
    work: { en: "Civil Wars", ru: "Гражданские войны" }
    passage: "4.106"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0232:book=4:chapter=13:section=106"
    note:
      en: "Before the battle of Philippi in 42 BC, Brutus and Cassius kept their stores on Thasos, a hundred stades off, and anchored their triremes at Neapolis, seventy stades from their camps."
      ru: "Перед битвой при Филиппах в 42 г. до н. э. Брут и Кассий держали запасы на Фасосе, в ста стадиях, а триеры поставили у Неаполя, в семидесяти стадиях от лагерей."

  # ---------- Nebo ----------
  - place: ab5bd29
    author: { en: "Mesha, king of Moab", ru: "Меса, царь Моавитский" }
    work: { en: "Moabite Stone, lines", ru: "Моавитский камень, строки" }
    passage: "14-18"
    url: "https://en.wikisource.org/wiki/The_Inscription_on_the_Stele_of_M%C3%A9%C5%A1a%CA%BF/Translation"
    note:
      en: "At Chemosh's command Mesha marched by night against Nebo, held by Israel, fought from dawn to noon, took it and killed all its people, 7,000 men with the women and girls, devoting them to Ashtar-Chemosh, and dragged the vessels of YHWH before Chemosh."
      ru: "По слову Хамоса Меса ночью выступил на Нево, принадлежавший Израилю, бился с рассвета до полудня, взял город и перебил всех — семь тысяч мужчин, а с ними женщин и девушек, — посвятив их Астар-Хамосу, а сосуды Яхве притащил к Хамосу."
  - place: ab5bd29
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work:
      { en: "Onomasticon (Wolf's translation), entry", ru: "Ономастикон (перевод Вольфа), статья" }
    passage: "727"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#N_GENESIS"
    note:
      en: "Nebo (Nabo) was a city of the sons of Reuben in the land of Gilead, named by Isaiah in his oracle against Moab and by Jeremiah; it is now shown deserted eight miles south of Heshbon."
      ru: "Нево — город сынов Рувимовых в земле Галаадской, упомянутый Исаией в пророчестве о Моаве и Иеремией; теперь его показывают опустевшим в восьми милях к югу от Есевона."

  # ---------- Negeb ----------
  - place: a1cb244
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work:
      { en: "Onomasticon (Wolf's translation), entry", ru: "Ономастикон (перевод Вольфа), статья" }
    passage: "728"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#N_GENESIS"
    note:
      en: "Among the Hebrews the south is called Nageb, which Symmachus renders «south»; Jerome adds that they also call it Teman and Darom."
      ru: "У евреев юг называется Нагеб, что Симмах передаёт как «юг»; Иероним добавляет, что его зовут также Феман и Даром."

  # ---------- Nile ----------
  - place: a012705
    author: { en: "Herodotus", ru: "Геродот" }
    work: { en: "Histories", ru: "История" }
    passage: "2.5"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0126:book=2:chapter=5"
    note:
      en: "The Egypt the Greeks sail to is land deposited by the river, the river's gift; a day's sail from shore a sounding line still brings up mud from eleven fathoms."
      ru: "Египет, куда плавают греки, — земля, нанесённая рекой, её дар; ещё за день плавания до берега лот приносит ил с глубины одиннадцати саженей."
  - place: a012705
    author: { en: "Herodotus", ru: "Геродот" }
    work: { en: "Histories", ru: "История" }
    passage: "2.19"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0126:book=2:chapter=19"
    note:
      en: "In flood the Nile covers the Delta and land up to two days' journey from either bank, rising for a hundred days from the summer solstice and then falling; no priest could tell Herodotus why."
      ru: "В разлив Нил покрывает Дельту и земли на два дня пути от каждого берега; он прибывает сто дней от летнего солнцестояния, а потом спадает, и ни один жрец не смог объяснить Геродоту почему."
  - place: a012705
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "17.1.3"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=17:chapter=1:section=3"
    note:
      en: "The Nile makes habitable only the land its flood covers, leaving the higher ground desert; through Egypt it runs alone and straight from the lesser cataract above Syene and Elephantine to the sea."
      ru: "Нил делает обитаемой только землю, которую покрывает разлив, а возвышенности остаются пустыней; Египет он пересекает один и прямо — от малого порога выше Сиены и Элефантины до моря."

  # ---------- Nob ----------
  - place: afdda14
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "6.259-261"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=6:whiston+chapter=12:whiston+section=6"
    note:
      en: "Doeg killed Ahimelech and his family, 385 in all; Saul then sent to Nob, the city of the priests, killed everyone there regardless of age and burnt it, and only Abiathar escaped."
      ru: "Доик убил Ахимелеха и весь его род — 385 человек; затем Саул послал в Номву, город священников, перебил там всех, не щадя ни женщин, ни детей, и сжёг его; спасся лишь Авиафар."
  - place: afdda14
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work:
      { en: "Onomasticon (Wolf's translation), entry", ru: "Ономастикон (перевод Вольфа), статья" }
    passage: "739"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#N_JUDGES"
    note:
      en: "Nob was a city set apart for the priests, which Saul destroyed."
      ru: "Номва — город, отделённый священникам, который разрушил Саул."
  - place: afdda14
    author: { en: "Jerome", ru: "Иероним Стридонский" }
    work: { en: "Letters", ru: "Письма" }
    passage: "108.8"
    url: "https://www.newadvent.org/fathers/3001108.htm"
    note:
      en: "Jerome puts Nob not far from Lydda, beside Arimathea: once a city of priests, now the tomb of its slain."
      ru: "Иероним помещает Номву недалеко от Лидды, рядом с Аримафеей: некогда город священников, теперь гробница убитых."

  # ---------- North ----------
  - place: a244929
    author: { en: "Polybius", ru: "Полибий" }
    work: { en: "Histories", ru: "Всеобщая история" }
    passage: "5.86.7-11"
    url: "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Polybius/5*.html#86.7"
    note:
      en: "After Raphia in 217 BC Antiochus III went home and the towns of Coele-Syria went over to Ptolemy, vying in crowns and altars for him, for these peoples had always favoured the Egyptian kings over the Seleucids."
      ru: "После Рафии в 217 г. до н. э. Антиох III ушёл к себе, а города Келесирии перешли к Птолемею и наперебой воздавали ему венки и алтари: эти народы всегда больше любили египетских царей, чем Селевкидов."
  - place: a244929
    author: { en: "Polybius", ru: "Полибий" }
    work: { en: "Histories", ru: "Всеобщая история" }
    passage: "29.27.1-8"
    url: "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Polybius/29*.html#27.1"
    note:
      en: "In 168 BC, as Antiochus IV moved on Pelusium, the Roman envoy Popilius Laenas handed him the senate's decree and drew a circle round him with a vine stick; the king yielded and led his army back to Syria."
      ru: "В 168 г. до н. э., когда Антиох IV шёл на Пелусий, римский посол Попилий Ленат вручил ему постановление сената и очертил вокруг него круг виноградной тростью; царь уступил и увёл войско в Сирию."

  # ---------- Ophel ----------
  - place: af96edd
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish War", ru: "Иудейская война" }
    passage: "5.145"
