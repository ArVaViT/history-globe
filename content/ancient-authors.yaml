    url: "https://en.wikisource.org/wiki/Gesenius%27_Hebrew_Grammar/Siloam_inscription"
    note:
      en: "The tunnellers record how the two gangs, cutting towards each other, heard each other's voices and met pick to pick; then the water ran from the spring to the pool, 1,200 cubits, under 100 cubits of rock. Neither king nor spring is named, but the spring is the Gihon."
      ru: "Строители туннеля рассказывают, как две артели, пробиваясь навстречу, услышали голоса друг друга и сошлись кирка к кирке; тогда вода пошла от источника к пруду — 1200 локтей под толщей скалы в 100 локтей. Ни царь, ни источник не названы, но источник этот — Гион."

