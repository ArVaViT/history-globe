    note:
      en: "Seleucia in Pieria, once called Rivers of Water, is a strong fortress beyond assault, which is why Pompey, after shutting Tigranes out of it, declared it a free city."
      ru: "Селевкия в Пиерии, прежде называвшаяся Реками Вод, — сильная крепость, неприступная для штурма, и потому Помпей, не пустив в неё Тиграна, объявил её свободным городом."

  # ---------- Sepharvaim ----------
  - place: a282c15
