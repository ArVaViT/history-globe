      ru: "Август отдал Ироду Трахонитиду, Батанею и Авранитиду, чтобы пресечь набеги трахонитов, у которых не было ни городов, ни полей: они жили со скотом в пещерах с узкими входами, держали водоёмы и житницы и грабили дамаскинцев."

  # ---------- Beeroth ----------
