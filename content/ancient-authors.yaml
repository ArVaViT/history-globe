      en: "Bethany is a village two miles from Jerusalem on the slope of the Mount of Olives where Christ raised Lazarus; the tomb of Lazarus was still shown, and Jerome adds that a church had been built there."
      ru: "Вифания — селение в двух милях от Иерусалима на склоне горы Елеонской, где Христос воскресил Лазаря; его гробницу всё ещё показывали, а Иероним добавляет, что там построена церковь."
  - place: a4f35bc
    author: { en: "Jerome", ru: "Иероним" }
    work: { en: "Letters", ru: "Письма" }
    passage: "108.12"
    url: "https://www.newadvent.org/fathers/3001108.htm"
    note:
      en: "On her pilgrimage Paula visited the tomb of Lazarus and the house of Mary and Martha, then Bethphage, and from there went straight down the hill to Jericho."
      ru: "Во время паломничества Павла посетила гробницу Лазаря и дом Марии и Марфы, затем Виффагию, а оттуда спустилась с горы прямо к Иерихону."

  # ---------- Bethel ----------
  - place: a64f355
    author: { en: "Eusebius", ru: "Евсевий" }
    work: { en: "Onomasticon (Wolf's numbering)", ru: "Ономастикон (нумерация Вульфа)" }
