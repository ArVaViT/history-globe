    note:
      en: "The Sabaeans, a very populous people, hold the most fertile land of Arabia, rich in myrrh, frankincense and cinnamon; their capital Mariaba stands on a wooded mountain, and their spices pass from people to people as far as Syria and Mesopotamia."
      ru: "Сабеи — многочисленный народ на самой плодородной земле Аравии, богатой смирной, ладаном и корицей; их столица Мариаба стоит на лесистой горе, а их благовония передаются от народа к народу вплоть до Сирии и Месопотамии."
  - place: a81ab85
    author: { en: "Diodorus Siculus", ru: "Диодор Сицилийский" }
    work: { en: "Library of History", ru: "Историческая библиотека" }
    passage: "3.46-47"
    url: "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Diodorus_Siculus/3C*.html#46"
    note:
      en: "The Sabaeans are the most numerous Arab people and live in Arabia the Blest, where balsam and cassia grow by the shore and a sweet scent hangs over the land; their chief city Sabae stands on a mountain, and its kings may never leave the palace on pain of being stoned."
      ru: "Сабеи — самый многочисленный из арабских народов; они живут в Счастливой Аравии, где у берега растут бальзам и кассия, а над землёй стоит благоухание; их главный город Саба стоит на горе, и царям нельзя покидать дворец под страхом побиения камнями."
  - place: a81ab85
    author: { en: "Pliny the Elder", ru: "Плиний Старший" }
    work: { en: "Natural History", ru: "Естественная история" }
    passage: "6.154-155"
    url: "https://penelope.uchicago.edu/Thayer/L/Roman/Texts/Pliny_the_Elder/6*.html#154"
    note:
      en: "Pliny calls the Sabaei the Arabs most famous for frankincense, spread from one sea to the other, with towns on the Red Sea coast and inland; one branch has its capital at Sabota, but the royal seat of them all is Marebbata."
      ru: "Плиний называет сабеев самыми известными ладаном арабами, расселившимися от моря до моря, с городами на берегу Красного моря и в глубине страны; у одной их ветви столица — Сабота, но царская резиденция всех их — Мареббата."

  # ---------- Shechem ----------
  - place: adf74d4
    author: { en: "Josephus", ru: "Иосиф Флавий" }
