      ru: "Раамсес, в четырёх милях от города Аравии, теперь чистое поле без единого жилья, но огромная окружность и бесчисленные руины показывают, что он был велик; остались фиванский камень с двумя огромными фигурами, будто Моисея и Аарона, и старая смоковница."
  - place: a079b21
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work:
      { en: "Onomasticon (Wolf's translation), entry", ru: "Ономастикон (перевод Вольфа), статья" }
    passage: "765"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#R_THE_PENTATEUCH"
    note:
      en: "Rameses is the city Israel built in Egypt; once the whole district bore the name, and Jacob lived there with his sons."
      ru: "Раамсес — город, который сыны Израилевы построили в Египте; прежде так звалась вся округа, и в ней жил Иаков с сыновьями."

  # ---------- Ramoth-gilead ----------
  - place: a2fe63c
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work:
      { en: "Onomasticon (Wolf's translation), entry", ru: "Ономастикон (перевод Вольфа), статья" }
