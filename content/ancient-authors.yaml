    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#B_JUDGES"
    note:
      en: "Bezek, the city of Adoni-bezek, survived as two neighbouring villages of that name, seventeen miles from Neapolis on the road down to Scythopolis."
      ru: "Везек, город Адони-Везека, сохранился в двух соседних селениях с этим именем, в семнадцати милях от Неаполя по дороге вниз к Скифополю."

  # ---------- Bezer ----------
  - place: a0cd098
    author: { en: "Mesha Stele", ru: "Стела Меши" }
    work: { en: "Moabite inscription, paragraph", ru: "моавитская надпись, абзац" }
    passage: "10"
    url: "https://www.livius.org/sources/content/anet/320-the-stela-of-mesha/"
    note:
      en: "Mesha, king of Moab, says that he built Bezer, for it lay in ruins, along with Aroer and Beth-bamoth."
      ru: "Меса, царь Моавитский, пишет, что отстроил Бецер, потому что тот лежал в развалинах, вместе с Ароером и Беф-Вамофом."
  - place: a0cd098
    author: { en: "Eusebius", ru: "Евсевий" }
    work: { en: "Onomasticon (Wolf's numbering)", ru: "Ономастикон (нумерация Вульфа)" }
