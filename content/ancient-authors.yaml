      ru: "Храмовый писец в Саисе рассказал Геродоту, что Нил берёт начало из бездонных источников между двумя островерхими холмами, Крофи и Мофи, между Сиеной и Элефантиной, и половина воды течёт на север, в Египет, половина — на юг, в Ефиопию; Геродот заподозрил шутку."
  - place: a8a6a5b
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "17.1.48"
