    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "506"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#TH_JUDGES"
    note:
      en: "Thebez, where a woman on the tower killed Abimelech with a millstone, is still a village called Thebes in the district of Neapolis, at the thirteenth milestone on the road to Scythopolis."
      ru: "Тевец, где женщина с башни убила Авимелеха обломком жернова, при Евсевии — селение Тевес в округе Неаполя, на тринадцатой миле по дороге в Скифополь."

  # ---------- Tigris ----------
  - place: a38ebfd
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "11.14.8"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=11:chapter=14:section=8"
    note:
      en: "Coming down from the Niphates, the Tigris runs through Lake Arsene so fast that it keeps its waters unmixed, hence its name, Median for arrow; it then sinks underground, reappears in Chalonitis and flows past Opis toward the Persian Gulf."
      ru: "Спустившись с Нифата, Тигр проходит через озеро Арсену так стремительно, что не смешивает с ним своих вод, — отсюда имя: по-мидийски «стрела»; затем он уходит под землю, вновь выходит в Халонитиде и течёт мимо Опиды к Персидскому заливу."
  - place: a38ebfd
    author: { en: "Pliny the Elder", ru: "Плиний Старший" }
    work: { en: "Natural History", ru: "Естественная история" }
    passage: "6.127-128"
    url: "https://penelope.uchicago.edu/Thayer/L/Roman/Texts/Pliny_the_Elder/6*.html#127"
    note:
      en: "The Tigris rises from a conspicuous spring on a plain in Greater Armenia; slow, it is called Diglito, swift, Tigris, the Median word for arrow; its fish never mix with those of the lake it crosses, and it twice vanishes underground before reappearing."
      ru: "Тигр берёт начало из заметного источника на равнине Великой Армении; там, где течёт медленно, его зовут Диглито, где быстро — Тигром, по-мидийски «стрела»; его рыба не смешивается с рыбой озера, через которое он проходит, и дважды он уходит под землю."
  - place: a38ebfd
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "903"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#T_GENESIS"
    note:
      en: "The Tigris goes out from Paradise eastward, over against Assyria, and after many windings reaches the sea; it is named for the tiger because its current is as violent and swift as the animal."
      ru: "Тигр выходит из рая на восток, против Ассирии, и после многих изгибов достигает моря; назван он по тигру, потому что его течение так же яростно и стремительно, как этот зверь."

  # ---------- Timnah (Judah) ----------
  - place: a17c178
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "487"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#TH_GENESIS"
    note:
      en: "Thamna, where Judah sheared his sheep, is for Eusebius a very large village still standing in the territory of Diospolis, halfway to Jerusalem."
      ru: "Фамна, где Иуда стриг овец, для Евсевия — очень большое селение, и поныне стоящее в округе Диосполя, на полпути к Иерусалиму."

  # ---------- Timnath-heres ----------
  - place: a6e6528
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "503"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#TH_JOSUE"
    note:
      en: "Timnath-serah, Joshua's city in the hill country, is for Eusebius the same as Thamna, where the tomb of Joshua was still being shown in his day."
      ru: "Фамнаф-Сараи, город Иисуса Навина в горах, для Евсевия — та же Фамна, где в его время ещё показывали гробницу Иисуса Навина."

  # ---------- Upper Beth-horon ----------
  - place: ab682e6
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "212"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#B_JOSUE"
    note:
      en: "Beth-horon, to which Joshua pursued the kings and which fell to Ephraim, is two villages twelve miles from Jerusalem on the road to Nicopolis; Jerome names the nearer one Lower Beth-horon, set apart for the Levites."
      ru: "Беф-Орон, до которого Иисус Навин гнал царей и который достался Ефрему, — это два селения в двенадцати милях от Иерусалима по дороге на Никополь; ближнее Иероним называет Нижним Беф-Ороном, отданным левитам."

  # ---------- Uz ----------
  - place: a324c4d
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "1.145"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=1:whiston+chapter=6:whiston+section=4"
    note:
      en: "Of the four sons of Aram, Uz founded Trachonitis and Damascus, a country lying between Palestine and Coele-Syria."
      ru: "Из четырёх сыновей Арама Уц основал Трахонитскую область и Дамаск — страну между Палестиной и Келесирией."
  - place: a324c4d
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "761"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#O_JOSUE"
    note:
      en: "Uz is the home of Job, in the land of Ausitis; Eusebius notes that one of the descendants of Esau also bore the name."
      ru: "Уц — родина Иова в земле Авситиде; Евсевий отмечает, что так звали и одного из потомков Исава."

  # ---------- Valley of Eshcol ----------
  - place: a38ecff
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "927"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#F_NUMBERS_AND_DEUTERONOMY"
    note:
      en: "The ravine of the cluster, where the spies cut the fruit, was said to be Gophna, whose name was taken to mean vine, fifteen miles from Jerusalem on the road up to Neapolis."
      ru: "Долину Есхол («грозд»), где соглядатаи срезали плоды, отождествляли, по Евсевию, с Гофной, чьё имя толковали как «виноградная лоза», в пятнадцати милях от Иерусалима по дороге к Неаполю."

  # ---------- Valley of Jehoshaphat ----------
  - place: a324282
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "620"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#K_KINGS"
    note:
      en: "The valley of Jehoshaphat, named in Joel, lies between Jerusalem and the Mount of Olives."
      ru: "Долина Иосафата, о которой говорит Иоиль, лежит между Иерусалимом и горой Елеонской."
  - place: a324282
    author: { en: "Bordeaux Pilgrim", ru: "Бордоский паломник" }
    work: { en: "Itinerary, section", ru: "Итинерарий, раздел" }
    passage: "594"
    url: "https://topostext.org/work/231#594"
    note:
      en: "In 333, going out of Jerusalem by the east gate to climb the Mount of Olives, the pilgrim crossed the valley called Josaphat; to the left among vineyards was shown the stone where Judas betrayed Christ."
      ru: "В 333 году, выйдя из Иерусалима восточными воротами, чтобы подняться на гору Елеонскую, паломник пересёк долину, называемую Иосафатовой; слева, среди виноградников, показывали камень, где Иуда предал Христа."

  # ---------- Valley of Lebanon ----------
  - place: ac2192b
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "16.2.16"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=16:chapter=2:section=16"
    note:
      en: "Libanus and Antilibanus run nearly parallel from the coast near Tripolis and Sidon and enclose Coele-Syria, a hollow plain about 200 stadia wide toward the sea and twice as long, watered by rivers and very fertile."
      ru: "Ливан и Антиливан идут почти параллельно от побережья у Триполиса и Сидона и замыкают Келесирию — впадину шириной около 200 стадий у моря и вдвое большей длины, орошаемую реками и очень плодородную."

  # ---------- Valley of Siddim ----------
  - place: a4a5cce
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "1.174"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=1:whiston+chapter=9:whiston+section=1"
    note:
      en: "The Assyrian kings camped against Sodom in the vale called the Slime Pits, for there were pits there then; after Sodom was destroyed, Josephus says, the vale became the lake called Asphaltitis."
      ru: "Ассирийские цари стали станом против Содома в долине, называемой Смоляными ямами, — тогда там были ямы; после гибели Содома, говорит Иосиф, долина стала озером, которое зовут Асфальтовым."

  # ---------- Washer's Field ----------
  - place: a84c559
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish War", ru: "Иудейская война" }
    passage: "5.147"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0148:book=5:whiston+chapter=4:whiston+section=2"
    note:
      en: "Josephus traces the third wall of Jerusalem past the tombs of the kings to the corner tower by the Monument of the Fuller, where it joined the old wall at the Kidron valley; whether this is the biblical fuller's field is uncertain."
      ru: "Иосиф ведёт третью стену Иерусалима мимо царских гробниц к угловой башне у так называемого Памятника Белильщика, где она смыкалась со старой стеной у долины Кедрона; то ли это поле белильщиков, что в Библии, — неизвестно."

  # ---------- Waters of Merom ----------
  - place: a6ee047
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "5.63"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=5:whiston+chapter=1:whiston+section=18"
    note:
      en: "Josephus puts the camp of the kings who came against Joshua, the Canaanites of Lebanon and of the plains with Philistine allies, at Beroth, a city of Upper Galilee not far from Kedesh."
      ru: "Иосиф помещает стан царей, выступивших против Иисуса Навина, — хананеев Ливана и равнин вместе с союзниками-филистимлянами — у Берота, города Верхней Галилеи неподалёку от Кедеса."

  # ---------- Wilderness of Ziph ----------
  - place: a50057d
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "465"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#Z_JOSUE"
    note:
      en: "Ziph, where David hid, is still a village in the Daroma within the territory of Eleutheropolis, near Hebron, at the eighth mile to the east."
      ru: "Зиф, где скрывался Давид, при Евсевии — селение в Дароме, в округе Елевферополя, близ Хеврона, на восьмой миле к востоку."

  # ---------- Zanoah ----------
  - place: a28f432
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "464"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#Z_JOSUE"
    note:
      en: "Zanoah of Judah is in Eusebius's day a village called Zanoua in the territory of Eleutheropolis, on the road to Jerusalem."
      ru: "Заноах в уделе Иуды при Евсевии — селение Заноуа в округе Елевферополя, по дороге в Иерусалим."

  # ---------- Mount Zaphon ----------
  - place: a78e845
    author: { en: "Pliny the Elder", ru: "Плиний Старший" }
    work: { en: "Natural History", ru: "Естественная история" }
    passage: "5.80"
    url: "https://penelope.uchicago.edu/Thayer/L/Roman/Texts/Pliny_the_Elder/5*.html#80"
    note:
      en: "Above Seleucia Pieria rises another Mount Casius, so high that from its top the sun is seen through the darkness in the fourth watch of the night; the way up to the summit is nineteen miles, the height four."
      ru: "Над Селевкией Пиерийской поднимается другая гора Касий, так высоко, что с её вершины в четвёртую стражу ночи сквозь тьму видно солнце; путь до вершины — девятнадцать миль, высота — четыре."
  - place: a78e845
    author: { en: "Ammianus Marcellinus", ru: "Аммиан Марцеллин" }
    work: { en: "History", ru: "Римская история" }
    passage: "22.14.4"
    url: "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Ammian/22*.html#14.4"
    note:
      en: "In 362 the emperor Julian climbed Mount Casius on a feast day to sacrifice to Jupiter; Ammianus describes it as a high wooded hill of rounded shape from which the sunrise is seen at second cockcrow."
      ru: "В 362 году император Юлиан в праздничный день поднялся на гору Касий, чтобы принести жертву Юпитеру; Аммиан описывает её как высокую лесистую гору округлых очертаний, с которой восход солнца виден уже при вторых петухах."

  # ---------- Zarephath ----------
  - place: a6fa2d3
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "8.320-324"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=8:whiston+chapter=13:whiston+section=2"
    note:
      en: "When the brook dried up, Elijah went to Zarephath, a city not far from Sidon and Tyre, lying between them; Josephus adds that Menander's history of Tyre records the same drought under King Ethbaal."
      ru: "Когда поток пересох, Илия пошёл в Сарепту, город неподалёку от Сидона и Тира, между ними; Иосиф добавляет, что ту же засуху при царе Ефваале отмечает тирская история Менандра."
  - place: a6fa2d3
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "889"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#S_KINGS"
    note:
      en: "Sarepta, where Elijah stayed, is a well-known village of the Sidonians on the highway."
      ru: "Сарепта, где жил Илия, — известное селение сидонян на большой дороге."
  - place: a6fa2d3
    author: { en: "Bordeaux Pilgrim", ru: "Бордоский паломник" }
    work: { en: "Itinerary, section", ru: "Итинерарий, раздел" }
    passage: "583"
    url: "https://topostext.org/work/231#583"
    note:
      en: "In 333 the pilgrim's road from Sidon came, nine miles out, to Sarepta, noted as the place where Elijah went up to the widow and asked her for food."
      ru: "В 333 году дорога паломника от Сидона через девять миль привела в Сарепту, отмеченную как место, где Илия пришёл к вдове и попросил у неё еды."
