      en: "Media has two parts: Greater Media, whose capital Ecbatana still serves the Parthian kings as a cool summer seat, and Atropatian Media, kept free of the Macedonians by Atropates."
      ru: "Мидия делится на две части: Великую Мидию, чья столица Экбатаны всё ещё служит парфянским царям прохладной летней резиденцией, и Атропатену, которую Атропат уберёг от македонян."
  - place: ad2fadf
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "11.13.7"
