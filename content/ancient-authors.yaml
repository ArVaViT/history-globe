    note:
      en: "Baal-meon, built by the sons of Reuben, was a large village called Beelmaous near the hot springs of Baara, nine miles from Heshbon; Eusebius adds that the prophet Elisha came from there."
      ru: "Ваал-Меон, построенный сынами Рувимовыми, был большим селением Беелмаус близ горячих источников Баары, в девяти милях от Есевона; Евсевий добавляет, что оттуда был родом пророк Елисей."
  - place: a76f7b7
    author: { en: "Mesha Stele", ru: "Стела Меши" }
    work: { en: "Moabite inscription, paragraphs", ru: "моавитская надпись, абзацы" }
