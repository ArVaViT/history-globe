    note:
      en: "In Cenchreae Pausanias saw a temple of Aphrodite with a stone statue, a bronze Poseidon on the mole, and shrines of Asclepius and Isis at the far end of the harbour; opposite, warm salt water ran from a rock into the sea."
      ru: "В Кенхреях Павсаний видел храм Афродиты с каменной статуей, бронзового Посейдона на молу и святилища Асклепия и Исиды в дальнем конце гавани; напротив из скалы в море текла тёплая солёная вода."

  # ---------- Chaldea ----------
  - place: a32a4f8
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "16.1.6"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=16:chapter=1:section=6"
    note:
      en: "Strabo uses the name in two senses: the native philosophers of Babylon, given to astronomy and split into schools, and a tribe of Chaldaeans living in a district of Babylonia near the Arabs and the Persian Gulf."
      ru: "Страбон употребляет имя в двух смыслах: местные философы Вавилона, занятые астрономией и разделённые на школы, и племя халдеев, живущее в области Вавилонии рядом с арабами и Персидским заливом."
  - place: a32a4f8
    author: { en: "Diodorus Siculus", ru: "Диодор Сицилийский" }
    work: { en: "Library of History", ru: "Историческая библиотека" }
    passage: "2.29.1-4"
    url: "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Diodorus_Siculus/2A*.html#29"
    note:
      en: "The Chaldaeans, among the oldest people of Babylonia, hold a place like the priests of Egypt: they serve the gods, study the stars, read omens from birds, dreams and entrails, and pass their learning from father to son."
      ru: "Халдеи, из древнейших жителей Вавилонии, занимают место, подобное жрецам Египта: служат богам, изучают звёзды, гадают по птицам, снам и внутренностям и передают знание от отца к сыну."

  # ---------- Chorazin ----------
  - place: a593a48
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "976"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm"
    note:
      en: "Chorazin, the Galilean village Christ reproached in the Gospel, now lies deserted two miles from Capernaum."
      ru: "Хоразин, галилейское селение, которое Христос укорял в Евангелии, теперь лежит пустым в двух милях от Капернаума."

  # ---------- Cilicia ----------
  - place: ad63819
    author: { en: "Xenophon", ru: "Ксенофонт" }
    work: { en: "Anabasis", ru: "Анабасис" }
    passage: "1.2.22"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0202:book=1:chapter=2:section=22"
    note:
      en: "In 401 BC Cyrus crossed the passes unopposed and came down into a large, beautiful plain, well watered and full of trees and vines, rich in sesame, millet, wheat and barley, ringed from sea to sea by high mountains."
      ru: "В 401 г. до н. э. Кир беспрепятственно перешёл перевалы и спустился на большую прекрасную равнину, обильно орошённую, полную деревьев и лоз, богатую кунжутом, просом, пшеницей и ячменём и окружённую от моря до моря высокими горами."
  - place: ad63819
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "14.5.1"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=14:chapter=5:section=1"
    note:
      en: "Cilicia outside the Taurus falls into two parts: Rugged Cilicia, a narrow coast under the mountains with little level ground, and Level Cilicia, the fertile plains from Soli and Tarsus to Issus."
      ru: "Киликия за Тавром делится на две части: Суровую, узкое побережье под горами почти без ровной земли, и Равнинную — плодородные равнины от Сол и Тарса до Исса."
  - place: ad63819
    author: { en: "Herodotus", ru: "Геродот" }
    work: { en: "Histories", ru: "История" }
    passage: "3.90.3"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0126:book=3:chapter=90"
    note:
      en: "Under Darius Cilicia was the fourth province and paid 360 white horses, one for each day of the year, and 500 talents of silver, of which 140 went to the cavalry guarding the country."
      ru: "При Дарии Киликия была четвёртой областью и платила 360 белых коней, по одному на каждый день года, и 500 талантов серебра, из которых 140 шли на конницу, охранявшую страну."

  # ---------- City of David ----------
  - place: a84f426
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "7.65-67"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=7:whiston+chapter=3:whiston+section=2"
    note:
      en: "After driving the Jebusites from the citadel, David rebuilt the city, called it the City of David and lived there all his reign; he built round the lower city, joined the citadel to it and walled the whole."
      ru: "Изгнав иевусеев из крепости, Давид отстроил город, назвал его Городом Давидовым и жил в нём всё своё царствование; он застроил нижний город, соединил с ним крепость и обнёс всё стеной."

  # ---------- Colossae ----------
  - place: a4e5a69
    author: { en: "Herodotus", ru: "Геродот" }
    work: { en: "Histories", ru: "История" }
    passage: "7.30"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0126:book=7:chapter=30"
    note:
      en: "Marching on Greece in 481 BC, Xerxes came to Colossae, a great city of Phrygia, where the river Lycus plunges into a cleft in the ground and reappears about five stadia away before joining the Maeander."
      ru: "Идя на Грецию в 481 г. до н. э., Ксеркс пришёл в Колоссы, большой город Фригии, где река Лик уходит в расселину и снова выходит примерно через пять стадиев, прежде чем влиться в Меандр."
  - place: a4e5a69
    author: { en: "Xenophon", ru: "Ксенофонт" }
    work: { en: "Anabasis", ru: "Анабасис" }
    passage: "1.2.6"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0202:book=1:chapter=2:section=6"
    note:
      en: "In 401 BC Cyrus crossed the Maeander and in one stage reached Colossae, an inhabited city, prosperous and large; he stayed seven days, and Menon the Thessalian joined him there with his troops."
      ru: "В 401 г. до н. э. Кир перешёл Меандр и за один переход достиг Колосс — населённого, богатого и большого города; он простоял там семь дней, и туда к нему пришёл с войском фессалиец Менон."
  - place: a4e5a69
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "12.8.16"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=12:chapter=8:section=16"
    note:
      en: "Strabo names the people of Colossae beside those of Laodicea as drawing a large income from their sheep, whose wool had a colour named after the town."
      ru: "Страбон называет жителей Колосс рядом с лаодикийцами: они получали большой доход от овец, шерсть которых имела цвет, названный по их городу."

  # ---------- Cush ----------
  - place: ac5a1ec
    author: { en: "Herodotus", ru: "Геродот" }
    work: { en: "Histories", ru: "История" }
    passage: "2.137"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0126:book=2:chapter=137"
    note:
      en: "Sabacos, king of Ethiopia, invaded Egypt with a great army and ruled it for fifty years; instead of executing wrongdoers he set them to raise the mounds of their own towns."
      ru: "Сабакон, царь Ефиопии, вторгся в Египет с большим войском и правил им пятьдесят лет; вместо казни он заставлял преступников насыпать валы своих городов."
  - place: ac5a1ec
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "1.131"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=1:whiston+chapter=6:whiston+section=2"
    note:
      en: "Time has not erased the name of Cush, Ham's son: the Ethiopians he ruled are still called Chusites, both by themselves and by everyone in Asia."
      ru: "Время не стёрло имени Хуса, сына Хама: народ Ефиопии, которым он правил, и сам себя, и все в Азии по-прежнему зовут хусеями."
  - place: ac5a1ec
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "17.1.54"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=17:chapter=1:section=54"
    note:
      en: "About 24 BC the prefect Petronius fought the generals of Candace, a one-eyed queen of the Ethiopians; he took and razed her royal seat Napata and left a garrison at Premnis, which she later besieged."
      ru: "Около 24 г. до н. э. префект Петроний воевал с полководцами Кандакии, одноглазой царицы Ефиопии; он взял и разрушил её столицу Напату и оставил гарнизон в Премниде, которую она затем осадила."

  # ---------- Cyprus ----------
  - place: a2e7601
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "14.6.5"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=14:chapter=6:section=5"
    note:
      en: "Cyprus yields good wine, oil and enough grain; Tamassus has rich copper mines; the plains were once so thick with forest that whoever cleared land might keep it tax-free."
      ru: "Кипр даёт хорошее вино, масло и достаточно хлеба; у Тамасса богатые медные рудники; равнины некогда так заросли лесом, что расчистившему землю разрешали владеть ею без податей."
  - place: a2e7601
    author: { en: "Pliny the Elder", ru: "Плиний Старший" }
    work: { en: "Natural History", ru: "Естественная история" }
    passage: "34.2"
    url: "https://penelope.uchicago.edu/Thayer/L/Roman/Texts/Pliny_the_Elder/34*.html#2"
    note:
      en: "Copper is also made from a stone called chalcitis in Cyprus, where it was first discovered; later it grew cheap as better ore was found elsewhere."
      ru: "Медь получают и из камня халкита на Кипре, где её впервые открыли; позже она подешевела, когда в других землях нашли руду лучше."
  - place: a2e7601
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "1.128"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=1:whiston+chapter=6:whiston+section=1"
    note:
      en: "Kittim held the island now called Cyprus, and from it the Hebrews call all islands and most coastlands Kittim; the city of Citium on Cyprus still keeps the name."
      ru: "Киттим владел островом, который теперь зовётся Кипром, и от него евреи называют Киттимом все острова и большинство приморских земель; город Китион на Кипре до сих пор хранит это имя."

  # ---------- Cyrene ----------
  - place: a81cdb5
    author: { en: "Herodotus", ru: "Геродот" }
    work: { en: "Histories", ru: "История" }
    passage: "4.158"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0126:book=4:chapter=158"
    note:
      en: "After six years at Aziris the Theran settlers were led west by the Libyans, past the fine land of Irasa by night, to the Fountain of Apollo, where they were told the sky had a hole in it; there Cyrene arose."
      ru: "После шести лет в Азирисе ливийцы повели поселенцев с Феры на запад, ночью мимо прекрасной Ирасы, к Источнику Аполлона, где, по их словам, небо было дырявым; там и возникла Киринея."
  - place: a81cdb5
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "17.3.21"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=17:chapter=3:section=21"
    note:
      en: "Cyrene was founded by Battus with settlers from Thera; it flourished on soil good for horses and crops, kept its freedom long, then passed to Macedonian kings and finally to Rome, joined with Crete in one province."
      ru: "Киринею основал Батт с поселенцами с Феры; она процветала на земле, хорошей для коней и посевов, долго сохраняла свободу, затем перешла к македонским царям и наконец к Риму, объединённая с Критом в одну провинцию."
  - place: a81cdb5
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "14.115"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=14:whiston+chapter=7:whiston+section=2"
    note:
      en: "Quoting Strabo, Josephus says Cyrene had four classes of people: citizens, farmers, resident aliens and Jews, a people already found in every city of the world."
      ru: "Ссылаясь на Страбона, Иосиф пишет, что в Киринее было четыре сословия: граждане, земледельцы, пришлые жители и иудеи — народ, который уже есть в каждом городе мира."

  # ---------- Dan ----------
  - place: a513646
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "5.178"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=5:whiston+chapter=3:whiston+section=1"
    note:
      en: "Josephus puts the land the Danite scouts found not far from Mount Lebanon and the springs of the Lesser Jordan, in the great plain a day's journey from Sidon; they founded a city there and named it Dan."
      ru: "Иосиф помещает землю, найденную разведчиками Дана, недалеко от Ливана и истоков Малого Иордана, в большой равнине в дне пути от Сидона; там они основали город и назвали его Дан."
  - place: a513646
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "1.177"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=1:whiston+chapter=10:whiston+section=1"
    note:
      en: "Abram fell on the Assyrians near Dan, which Josephus explains is the name of the other spring of the Jordan."
      ru: "Аврам напал на ассирийцев близ Дана, а Дан, поясняет Иосиф, — имя другого истока Иордана."
  - place: a513646
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "369"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm"
    note:
      en: "A village still called Dan lies on the road toward Tyre; it marks the northern border of Judea, and there the Jordan bursts forth."
      ru: "Селение, которое до сих пор зовут Дан, лежит на дороге к Тиру; оно отмечает северную границу Иудеи, и там пробивается Иордан."

  # ---------- Dedan ----------
  - place: a3a2a75
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "395"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm"
    note:
      en: "Eusebius puts Dedan in Idumea, four miles north of the mines of Phaeno, and cites Jeremiah for it."
      ru: "Евсевий помещает Дедан в Идумее, в четырёх милях к северу от рудников Феноса, ссылаясь на Иеремию."

  # ---------- Derbe ----------
  - place: aa401a9
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "12.6.3"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=12:chapter=6:section=3"
    note:
      en: "Derbe, by Isauria and close to Cappadocia, was the seat of the ruler Antipater, called Derbetes; in Strabo's time Amyntas of Galatia killed him and took Derbe."
      ru: "Дервия, у Исаврии и близ Каппадокии, была столицей правителя Антипатра по прозвищу Дервет; при Страбоне Аминта Галатский убил его и завладел Дервией."

  # ---------- Dibon ----------
  - place: a0d784a
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "372"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm"
    note:
      en: "Besides the desert station of that name, there is still a very large village Dibon near the Arnon, once held by Moab, then by Sihon the Amorite, from whom Israel took it."
      ru: "Кроме стоянки с тем же именем в пустыне, есть и поныне очень большое селение Дивон близ Арнона; им владел Моав, затем Сигон Аморрейский, у которого его взял Израиль."

  # ---------- Dothan ----------
  - place: ab635e4
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "371"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm"
    note:
      en: "Dothan, where Joseph found his brothers with the flocks, is still shown about twelve miles north of Sebaste, the old Samaria."
      ru: "Дофан, где Иосиф нашёл братьев со стадами, всё ещё показывают примерно в двенадцати милях к северу от Севастии, прежней Самарии."

  # ---------- Edom ----------
  - place: a2735ff
    author: { en: "Sennacherib", ru: "Сеннахирим" }
    work:
      {
        en: "Prism (RINAP 3, Sennacherib 22), column.line",
        ru: "призма (RINAP 3, Сеннахирим 22), столбец.строка",
      }
    passage: "2.50-60"
    url: "https://oracc.museum.upenn.edu/rinap/rinap3/Q003496/html"
    note:
      en: "In 701 BC Aya-ramu of Edom is listed with the kings of Sidon, Arwad, Byblos, Ashdod, Ammon and Moab who brought Sennacherib fourfold gifts and kissed his feet."
      ru: "В 701 г. до н. э. Айа-раму из Едома назван вместе с царями Сидона, Арвада, Библа, Азота, Аммона и Моава, которые принесли Сеннахириму четверные дары и целовали ему ноги."
  - place: a2735ff
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "13.257-258"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=13:whiston+chapter=9:whiston+section=1"
    note:
      en: "John Hyrcanus took Adora and Marisa, cities of Idumea, and let the Idumeans stay in their land if they were circumcised and kept the Jewish laws; they agreed, and from then on were counted Jews."
      ru: "Иоанн Гиркан взял Адору и Марису, города Идумеи, и позволил идумеям остаться на своей земле, если они примут обрезание и иудейские законы; они согласились и с тех пор считались иудеями."
  - place: a2735ff
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "522"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm"
    note:
      en: "Idumea, the land of Esau, named after him and also called Edom, lies around Petra in the district now called Gebalene."
      ru: "Идумея, земля Исава, названная по нему и называемая также Едомом, лежит вокруг Петры, в области, которую теперь зовут Гевалиной."

  # ---------- Edrei ----------
  - place: aaa6f7a
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "409"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm"
    note:
      en: "Edrei, where Og the giant king of Bashan was struck down, is now Adra, a well-known city of Arabia twenty-four miles from Bostra."
      ru: "Едреи, где был сражён исполин Ог, царь Васанский, — теперь Адра, известный город Аравии в двадцати четырёх милях от Бостры."

  # ---------- Egypt ----------
  - place: af301ca
    author: { en: "Herodotus", ru: "Геродот" }
    work: { en: "Histories", ru: "История" }
    passage: "2.5"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0126:book=2:chapter=5"
    note:
      en: "The Egypt the Greeks sail to is land laid down by the river, a gift of the Nile; a day's sail out, a sounding line still brings up mud from eleven fathoms."
      ru: "Египет, куда плавают греки, — земля, нанесённая рекой, дар Нила; ещё за день пути от берега лот приносит ил с глубины в одиннадцать саженей."
  - place: af301ca
    author: { en: "Herodotus", ru: "Геродот" }
    work: { en: "Histories", ru: "История" }
    passage: "2.35"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0126:book=2:chapter=35"
    note:
      en: "Egypt has more wonders than any land, and its people do most things the reverse of others: women trade in the market while men weave at home, and men carry loads on their heads, women on their shoulders."
      ru: "В Египте больше чудес, чем в любой земле, и его жители почти всё делают наоборот: женщины торгуют на рынке, мужчины ткут дома, мужчины носят тяжести на голове, а женщины — на плечах."
  - place: af301ca
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "17.1.3"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=17:chapter=1:section=3"
    note:
      en: "The Nile runs through Egypt alone and in a straight line, from the lesser cataract at Syene and Elephantine, the border with Ethiopia, to the sea; only land its flood covers is habitable, and Egyptians lived under ordered government from the first."
      ru: "Нил течёт через Египет один и прямо — от малого порога у Сиены и Элефантины, границы с Ефиопией, до моря; жить можно лишь там, куда доходит разлив, а египтяне с самого начала жили под упорядоченной властью."

  # ---------- Ekron ----------
  - place: a3fc47a
    author: { en: "Sennacherib", ru: "Сеннахирим" }
    work:
      {
        en: "Prism (RINAP 3, Sennacherib 22), column.line",
        ru: "призма (RINAP 3, Сеннахирим 22), столбец.строка",
      }
    passage: "2.73-3.17"
    url: "https://oracc.museum.upenn.edu/rinap/rinap3/Q003496/html"
    note:
      en: "The nobles of Ekron had chained their king Padi and handed him to Hezekiah; after beating their Egyptian allies at Eltekeh, Sennacherib killed the guilty, hung their bodies on the towers and brought Padi back from Jerusalem to his throne."
      ru: "Знать Екрона заковала своего царя Падия и выдала его Езекии; разбив их египетских союзников при Елтекее, Сеннахирим казнил виновных, развесил их тела на башнях и вернул Падия из Иерусалима на престол."
  - place: a3fc47a
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "60"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm"
    note:
      en: "Ekron, one of the five Philistine lordships, was allotted to Judah but never taken; Eusebius knew a large Jewish village called Accaron between Azotus and Jamnia, to the east."
      ru: "Екрон, одно из пяти филистимских владений, был отдан Иуде, но так и не взят; Евсевий знал большое иудейское селение Аккарон между Азотом и Иамнией, ближе к востоку."

  # ---------- Elam ----------
  - place: a7e3a59
    author: { en: "Ashurbanipal", ru: "Ашшурбанапал" }
    work:
      {
        en: "Prism (RINAP 5, Ashurbanipal 11), column.line",
        ru: "призма (RINAP 5, Ашшурбанапал 11), столбец.строка",
      }
    passage: "3.27-43"
    url: "https://oracc.museum.upenn.edu/rinap/rinap5/Q003710/html"
    note:
      en: "On his fifth campaign Ashurbanipal overran Elam, cut off the head of its king Teumman, filled the plain of Susa with the bodies of his warriors and made the river Ulai run red with their blood."
      ru: "В пятом походе Ашшурбанапал прошёл весь Елам, отрубил голову его царю Теумману, усеял равнину Суз телами его воинов и окрасил их кровью реку Улай."
  - place: a7e3a59
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "16.1.18"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=16:chapter=1:section=18"
    note:
      en: "Elymais, the old Elam, has fertile farmland and mountains full of archers; its king refused to obey Parthia, and when Antiochus the Great tried to rob the temple of Bel there, the local people killed him."
      ru: "Елимаида, древний Елам, имеет плодородные пашни и горы, полные лучников; её царь не подчинялся Парфии, а когда Антиох Великий попытался ограбить там храм Бела, местные жители убили его."

  # ---------- Elath ----------
  - place: af0ac29
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "6"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm"
    note:
      en: "Aila, once Ailath, lies at the edge of Palestine between the southern desert and the Red Sea; ships carried goods there from Egypt and India, and a detachment of the Tenth Legion is stationed there."
      ru: "Аила, прежде Елаф, лежит на краю Палестины между южной пустыней и Красным морем; сюда на кораблях везли товары из Египта и Индии, и здесь стоит отряд Десятого легиона."
  - place: af0ac29
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "16.4.4"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=16:chapter=4:section=4"
    note:
      en: "Aelana stands on the inner recess of the Arabian Gulf named after it, opposite Gaza; merchants travel from there to the Minaeans of south Arabia in seventy days."
      ru: "Элана стоит в глубине Аравийского залива, у названной по ней бухты, напротив Газы; купцы идут оттуда к минеям в Южной Аравии семьдесят дней."

  # ---------- Elealeh ----------
  - place: a5ccd34
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "410"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm"
    note:
      en: "Elealeh, an Amorite city given to Reuben and named by Isaiah and Jeremiah against Moab, is still a large village no more than a mile from Esbus (Heshbon)."
      ru: "Елеале, аморрейский город, отданный Рувиму и названный у Исаии и Иеремии в пророчествах о Моаве, — и теперь большое селение не далее мили от Есевона."

  # ---------- Emmaus ----------
  - place: ae7274b
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "457"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm"
    note:
      en: "Emmaus, the home of Cleopas in Luke's Gospel, is now Nicopolis, a well-known city of Palestine."
      ru: "Эммаус, родина Клеопы из Евангелия от Луки, — теперь Никополь, известный город Палестины."
  - place: ae7274b
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish War", ru: "Иудейская война" }
    passage: "2.71"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0148:book=2:whiston+chapter=5:whiston+section=1"
    note:
      en: "In the unrest after Herod's death in 4 BC, the Syrian governor Varus had Emmaus burned once its people had fled, in revenge for the Romans killed nearby."
      ru: "В смуте после смерти Ирода в 4 г. до н. э. сирийский наместник Вар велел сжечь Эммаус, когда жители бежали, — в отместку за убитых поблизости римлян."
  - place: ae7274b
    author: { en: "Jerome", ru: "Иероним" }
    work: { en: "Letters", ru: "Письма" }
    passage: "108.8"
    url: "https://www.newadvent.org/fathers/3001108.htm"
    note:
      en: "On her way up to Jerusalem in 385 Paula came to Nicopolis, once called Emmaus, where the Lord was known in the breaking of bread and the house of Cleopas had been made a church."
      ru: "По пути в Иерусалим в 385 г. Павла пришла в Никополь, прежде Эммаус, где Господь был узнан в преломлении хлеба и где дом Клеопы стал церковью."

  # ---------- En-rogel ----------
  - place: af9cfc9
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "7.347"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=7:whiston+chapter=14:whiston+section=4"
    note:
      en: "Josephus places Adonijah's feast outside the city, by the spring in the royal garden, where he gathered his brothers, Joab, Abiathar and the leaders of Judah, but not Solomon."
      ru: "Иосиф помещает пир Адонии за городом, у источника в царском саду, куда тот созвал братьев, Иоава, Авиафара и старейшин Иуды, но не Соломона."

  # ---------- Engedi ----------
  - place: a51df0e
    author: { en: "Pliny the Elder", ru: "Плиний Старший" }
    work: { en: "Natural History", ru: "Естественная история" }
    passage: "5.73"
    url: "https://penelope.uchicago.edu/Thayer/L/Roman/Texts/Pliny_the_Elder/5*.html#73"
    note:
      en: "Below the Essenes by the Dead Sea lay the town of Engedi, second only to Jerusalem for fertility and palm groves, but by Pliny's day a heap of ashes like Jerusalem; beyond it stood Masada."
      ru: "Ниже ессеев у Мёртвого моря лежал город Ен-Гадди, уступавший лишь Иерусалиму плодородием и пальмовыми рощами, но при Плинии такое же пепелище, как Иерусалим; за ним стояла Масада."
  - place: a51df0e
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "9.7"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=9:whiston+chapter=1:whiston+section=2"
    note:
      en: "Engedi lies on the Asphalt Lake, 300 stadia from Jerusalem; the best palms grow there, and the balsam."
      ru: "Ен-Гадди лежит у Асфальтового озера, в 300 стадиях от Иерусалима; там растут лучшие пальмы и бальзам."
  - place: a51df0e
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish War", ru: "Иудейская война" }
    passage: "4.402-404"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0148:book=4:whiston+chapter=7:whiston+section=2"
    note:
      en: "At Passover in AD 68 the Sicarii came down from Masada by night, overran the small town of Engaddi, killed over seven hundred women and children and carried its crops back to Masada."
      ru: "На Пасху 68 г. сикарии ночью спустились из Масады, захватили городок Енгадди, убили более семисот женщин и детей и унесли урожай в Масаду."

  # ---------- Erech ----------
  - place: a5db1a6
    author: { en: "Pliny the Elder", ru: "Плиний Старший" }
    work: { en: "Natural History", ru: "Естественная история" }
    passage: "6.123"
    url: "https://penelope.uchicago.edu/Thayer/L/Roman/Texts/Pliny_the_Elder/6*.html#123"
    note:
      en: "Pliny counts the Orcheni, the people of Uruk (Orchoe), as the third school of Chaldaean learning, set in the same part of Mesopotamia as Hipparenum but further south."
      ru: "Плиний называет орхенов, жителей Урука (Орхои), третьей школой халдейской учёности и помещает их в той же части Месопотамии, что и Гиппарен, но южнее."

  # ---------- Eshtaol ----------
  - place: a355b6e
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "439"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm"
    note:
      en: "Eshtaol, in the lot of Dan, where Samson died, is still shown ten miles north of Eleutheropolis on the road to Nicopolis."
      ru: "Естаол, в уделе Дана, где умер Самсон, всё ещё показывают в десяти милях к северу от Елевферополя по дороге на Никополь."

  # ---------- Ethiopia ----------
  - place: ab45bd3
    author: { en: "Herodotus", ru: "Геродот" }
    work: { en: "Histories", ru: "История" }
    passage: "2.29"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0126:book=2:chapter=29"
    note:
      en: "Above Elephantine the Ethiopians begin; after forty days on foot past the rapids and twelve more by boat one reaches Meroe, a great city said to be the capital of the other Ethiopians, who worship only Zeus and Dionysus."
      ru: "Выше Элефантины начинаются ефиопляне; после сорока дней пешком мимо порогов и ещё двенадцати на лодке приходят в Мероэ, большой город, который считают столицей остальной Ефиопии; там чтут только Зевса и Диониса."
  - place: ab45bd3
    author: { en: "Herodotus", ru: "Геродот" }
    work: { en: "Histories", ru: "История" }
    passage: "3.20"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0126:book=3:chapter=20"
    note:
      en: "Cambyses sent the Fish-eaters with gifts to the Ethiopians, said to be the tallest and most handsome of men, who choose as king the tallest man with strength to match."
      ru: "Камбиз послал рыбоедов с дарами к ефиоплянам, которых называют самыми высокими и красивыми из людей; царём они выбирают самого высокого, если и сила у него под стать."
  - place: ab45bd3
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Church History", ru: "Церковная история" }
    passage: "2.1.13"
    url: "https://www.newadvent.org/fathers/250102.htm"
    note:
      en: "Ethiopia, Eusebius notes, was still ruled by a queen by ancestral custom; the queen's officer baptised by Philip was the first Gentile believer and is said to have preached first in his homeland."
      ru: "Ефиопией, отмечает Евсевий, по обычаю предков всё ещё правит женщина; крещённый Филиппом вельможа царицы был первым из язычников, принявших веру, и, говорят, первым проповедовал на родине."

  # ---------- Euphrates ----------
  - place: a62dec4
    author: { en: "Herodotus", ru: "Геродот" }
    work: { en: "Histories", ru: "История" }
    passage: "1.180"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0126:book=1:chapter=180"
    note:
      en: "The Euphrates, a wide, deep and swift river flowing from Armenia to the southern sea, cuts Babylon in two; the walls run down to its banks and a brick fence with bronze gates lines each side."
      ru: "Евфрат, широкая, глубокая и быстрая река, текущая из Армении в южное море, рассекает Вавилон надвое; стены спускаются к его берегам, а вдоль каждого берега идёт кирпичная ограда с медными воротами."
  - place: a62dec4
    author: { en: "Xenophon", ru: "Ксенофонт" }
    work: { en: "Anabasis", ru: "Анабасис" }
    passage: "1.4.17-18"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0202:book=1:chapter=4:section=17"
    note:
      en: "Cyrus's army forded the Euphrates at Thapsacus with no one wet above the chest; the townspeople said it had never been crossed on foot before, and took it as a sign that the river yielded to a future king."
      ru: "Войско Кира перешло Евфрат вброд у Фапсака, и никто не промок выше груди; жители говорили, что пешком реку ещё никогда не переходили, и сочли это знаком, что река уступила будущему царю."
  - place: a62dec4
    author: { en: "Pliny the Elder", ru: "Плиний Старший" }
    work: { en: "Natural History", ru: "Естественная история" }
    passage: "5.90"
    url: "https://penelope.uchicago.edu/Thayer/L/Roman/Texts/Pliny_the_Elder/5*.html#90"
    note:
      en: "Below Zeugma the Euphrates splits: the left arm runs past Seleucia into the Tigris, the right to Babylon and on into marshes; like the Nile it rises on fixed days and floods Mesopotamia in summer."
      ru: "Ниже Зевгмы Евфрат делится: левый рукав течёт мимо Селевкии в Тигр, правый — к Вавилону и дальше в болота; как Нил, он поднимается в определённые дни и летом заливает Месопотамию."

  # ---------- Ezion-geber ----------
  - place: a8e53d5
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "8.163"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=8:whiston+chapter=6:whiston+section=4"
    note:
      en: "Solomon built many ships on the Egyptian gulf of the Red Sea at a place called Ezion-geber, not far from the city of Elath, now called Berenice; the land then belonged to the Jews."
      ru: "Соломон построил много кораблей в Египетском заливе Красного моря, в месте Ецион-Гавер, недалеко от города Елафа, который теперь зовётся Береникой; эта земля тогда принадлежала иудеям."
  - place: a8e53d5
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "299"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm"
    note:
      en: "Ezion-geber, a station of Israel in the desert, is thought to be Essiam near the Red Sea and Aila."
      ru: "Ецион-Гавер, стоянку Израиля в пустыне, считают Эссиамом близ Красного моря и Аилы."

  # ---------- Gadara ----------
  - place: afed46a
    author: { en: "Polybius", ru: "Полибий" }
    work: { en: "Histories", ru: "Всеобщая история" }
    passage: "5.71.3"
    url: "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Polybius/5*.html#71"
    note:
      en: "In 218 BC Antiochus III found Gadara, reckoned the strongest town of the district, still holding out; he sat down before it with siege engines and soon frightened it into surrender."
      ru: "В 218 г. до н. э. Антиох III застал ещё не сдавшейся Гадару, считавшуюся сильнейшей крепостью в округе; он подвёл к ней осадные машины и вскоре запугал её до сдачи."
  - place: afed46a
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish War", ru: "Иудейская война" }
    passage: "4.413-418"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0148:book=4:whiston+chapter=7:whiston+section=3"
    note:
      en: "In March 68 Vespasian marched on Gadara, the strong capital of Perea, whose many rich citizens wanted peace; the rebels killed their leader Dolesus and fled, and the town welcomed the Romans."
      ru: "В марте 68 г. Веспасиан пошёл на Гадару, сильную столицу Переи, где многие богатые граждане хотели мира; мятежники убили их главу Долеса и бежали, а город с радостью принял римлян."
  - place: afed46a
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
