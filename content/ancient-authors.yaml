    url: "https://www.livius.org/sources/content/cyrus-cylinder/cyrus-cylinder-translation/"
    note:
      en: "Cyrus says he returned to their places the images of the gods of the sacred cities from Babylon to Assur and Susa and beyond the Tigris, whose shrines had long lain abandoned, and gave their people back their homes."
      ru: "Кир пишет, что вернул на места изображения богов священных городов от Вавилона до Ассура и Суз и за Тигром, чьи святилища долго стояли заброшенными, и вернул их жителям их жилища."

  # ---------- Assyria ----------
  - place: a3d1321
