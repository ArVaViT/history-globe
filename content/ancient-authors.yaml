    passage: "72-76"
    url: "https://oracc.museum.upenn.edu/rinap/rinap2/Q006482/html"
    note:
      en: "In his fifth year (717 BC) Sargon accuses Pisiri of Carchemish of breaking his oath and writing to Midas of Mushku; he led him off in fetters, carried the palace treasure to Assyria and settled Assyrians in the city."
      ru: "В пятый год (717 г. до н. э.) Саргон обвиняет Писири из Кархемиса в нарушении клятвы и сношениях с Митой (Мидасом) из Мушку; он увёл его в оковах, вывез в Ассирию богатства дворца и поселил в городе ассирийцев."

  # ---------- Carmel (Judah) ----------
  - place: a053f15
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "613"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm"
    note:
