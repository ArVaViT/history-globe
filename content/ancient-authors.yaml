    note:
      en: "Ainan on the road to Timnah was a deserted place near Thamna, then a large town between Jerusalem and Diospolis; a spring there was shown where the locals had worshipped an idol. Jerome adds that the Jews took the word for a crossroads."
      ru: "Енаим на дороге в Фамну был пустым местом близ Фамны, тогда большого города между Иерусалимом и Диосполем; там показывали источник, у которого жители чтили идола. Иероним добавляет, что евреи понимали это слово как перекрёсток."

