    url: "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Diodorus_Siculus/1C*.html#60"
    note:
      en: "The Ethiopian king Actisanes cut off the noses of convicted thieves and settled them at Rhinocolura, a town he founded at the desert's edge on the border of Egypt and Syria near the sea; its land is full of brine and its few wells bitter."
      ru: "Эфиопский царь Актисан отрезал носы осуждённым ворам и поселил их в Ринокоруре — основанном им городе на краю пустыни, на границе Египта и Сирии недалеко от моря; земля вокруг полна соли, а немногие колодцы горьки."
  - place: a7a59b4
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "16.2.31"
