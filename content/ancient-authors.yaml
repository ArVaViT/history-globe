      ru: "Земля у озера носит то же имя — Геннисарет; она так плодородна, а воздух так мягок, что орехи, пальмы, смоковницы и маслины растут рядом, а виноград и смоквы не переводятся десять месяцев в году; она тянется вдоль берега на тридцать стадиев и шириной в двадцать."
