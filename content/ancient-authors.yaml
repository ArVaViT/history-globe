    note:
      en: "Eusebius merges the Kanah of Asher, near Great Sidon, with the Gospel Cana: there Christ turned water into wine, it was the home of Nathanael, and it still stood in Galilee of the nations."
      ru: "Евсевий сливает Кану из удела Асира, близ Сидона Великого, с евангельской Каной: там Христос претворил воду в вино, оттуда был Нафанаил, и она всё ещё стоит в Галилее языческой."

  # ---------- Canaan ----------
  - place: a581f0c
