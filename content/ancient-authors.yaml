    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#A_NUMBERS_AND_DEUTERONOMY"
    note:
      en: "Ataroth was an ancient city of the Amorites in Peraea, beyond the Jordan, which fell by lot to the tribe of Gad."
      ru: "Атароф — древний город аморреев в Перее, за Иорданом, доставшийся по жребию колену Гадову."

  # ---------- Avith ----------
  - place: aae8a95
    author: { en: "Eusebius", ru: "Евсевий" }
    work: { en: "Onomasticon (Wolf's numbering)", ru: "Ономастикон (нумерация Вульфа)" }
