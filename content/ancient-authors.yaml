      ru: "Галгал лежал к востоку от древнего Иерихона, по дороге к Иордану: здесь Иисус Навин совершил Пасху, поставил камни из реки и стояла скиния; пустынное место в двух милях от Иерихона местные жители и теперь чтут как святое."
  - place: ab94aea
