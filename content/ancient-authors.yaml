      ru: "Египтяне рассказали Геродоту, что, когда Сеннахирим пошёл на Египет, царь Сетос встал у Пелусия, где дорога входит в Египет, и ночью полевые мыши изгрызли у врагов колчаны, луки и ремни щитов."
  - place: aa32a17
    author: { en: "Plutarch", ru: "Плутарх" }
    work: { en: "Life of Pompey", ru: "Помпей" }
    passage: "77-80"
    url: "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Plutarch/Lives/Pompey*.html#77"
    note:
      en: "In 48 BC the defeated Pompey sailed to Pelusium, where young Ptolemy was camped with his army, and was stabbed in the boat as he came ashore; his freedman Philip burned the body on the beach."
      ru: "В 48 г. до н. э. разбитый Помпей приплыл к Пелусию, где стоял с войском юный Птолемей, и был заколот в лодке у самого берега; его вольноотпущенник Филипп сжёг тело на берегу."

