      ru: "Дождей мало; хлеб вызревает от речной воды, которую поднимают руками и журавлями в каналы, а крупнейший из них судоходен до Тигра; зерно родит сам-двести и даже сам-триста, а пальмы дают пищу, вино и мёд."
  - place: a8394b8
