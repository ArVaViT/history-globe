    note:
      en: "Fleeing after Pharsalus, Pompey entered Attaleia in Pamphylia as the first city on his way; there triremes from Cilicia met him, soldiers gathered, and sixty senators surrounded him."
      ru: "Бежав после Фарсала, Помпей первым из городов вошёл в Атталию в Памфилии; там его встретили триеры из Киликии, собрались воины и окружили шестьдесят сенаторов."

  # ---------- Azekah ----------
  - place: af2ca0c
