    note:
      en: "Aelana stands at the other recess of the Arabian Gulf, called the Aelanites, opposite Gaza; merchants reach Minaea from there in seventy days."
      ru: "Элана стоит в другом заливе Аравийского залива, называемом Эланитским, напротив Газы; купцы доходят оттуда до Минеи за семьдесят дней."
  - place: ad64d75
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work:
