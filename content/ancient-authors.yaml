    note:
      en: "On Homer's Arimi, Strabo reports Posidonius' view that Syria itself is meant, for the Aramaeans lived there, and that Armenians, Aramaeans and Arabs bear like names as peoples of one stock."
      ru: "О гомеровских аримах Страбон приводит мнение Посидония, что речь о самой Сирии, ибо там жили арамеи, и что армяне, арамеи и арабы носят сходные имена как народы одного корня."

