      ru: "Большая часть писидийцев занимала высоты Тавра, а главным их племенем были сельгейцы; Страбон вслед за Артемидором перечисляет их города — Сельгу, Сагаласс, Термесс и другие, одни целиком в горах, другие спускаются к Памфилии и Фригии."

