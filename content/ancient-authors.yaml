    url: "https://penelope.uchicago.edu/Thayer/L/Roman/Texts/Pliny_the_Elder/34*.html#41"
    note:
      en: "The Colossus by Chares of Lindus took twelve years and 300 talents raised from the siege engines Demetrius left behind; it fell in an earthquake after 66 years, yet few can embrace its thumb, and its broken limbs gape like caverns."
      ru: "Колосс работы Харета Линдского строили двенадцать лет на 300 талантов, вырученных за осадные машины, брошенные Деметрием; через 66 лет он рухнул от землетрясения, но и лёжа его большой палец мало кто обхватит, а обломки зияют, как пещеры."
  - place: a4218ee
