    note:
      en: "In Augustus' first ordering of the empire, Asia within the Halys and the Taurus, without the Galatians, Amyntas' peoples, Bithynia and the Propontis, was one of the two provinces of the people governed by men of consular rank."
      ru: "При первом устройстве державы Августом Асия по сю сторону Галиса и Тавра — без галатов, народов Аминты, Вифинии и Пропонтиды — стала одной из двух народных провинций под управлением консуляров."

  # ---------- Asshur ----------
