    note:
      en: "After the Flood Noah's descendants came down from the heights to the plain, and the plain where they first lived was called Shinar; told by God to send out colonies, they refused."
      ru: "После потопа потомки Ноя спустились с высот на равнину, и равнина, где они поселились сначала, называлась Сеннаар; Бог велел им выводить поселения, но они не послушались."
  - place: af725b1
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "806"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#S_GENESIS"
    note:
      en: "Eusebius calls Sennaar the plain of Babylon where the tower was built, and quotes Hestiaeus, through Josephus, on priests who escaped with the sacred vessels of Zeus Enyalius and came to Sennaar in Babylonia."
      ru: "Евсевий называет Сеннаар равниной Вавилона, где строилась башня, и приводит через Иосифа слова Гестиея о жрецах, которые спаслись со священными сосудами Зевса Эниалия и пришли в Сеннаар Вавилонский."

  # ---------- Shittim ----------
  - place: af64fb3
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "4.176"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=4:section=176"
    note:
      en: "Josephus sets Moses' last assembly of the people near the Jordan, where in his own day stood the city of Abila, a place full of palm trees."
      ru: "Последнее собрание народа у Моисея Иосиф помещает у Иордана, там, где в его время стоял город Авила, место, полное финиковых пальм."
  - place: af64fb3
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "5.4"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=5:section=1"
    note:
      en: "Before the crossing, Joshua marched the people from Abila down to the Jordan, a distance Josephus gives as sixty furlongs."
      ru: "Перед переправой Иисус Навин повёл народ от Авилы к Иордану; это расстояние Иосиф определяет в шестьдесят стадий."
  - place: af64fb3
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "823"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#S_NUMBERS_AND_DEUTERONOMY"
    note:
      en: "Eusebius puts Sattim near Mount Phogor, that is Peor, as the place where the people sinned with the daughters of Moab and from which Joshua sent the spies to Jericho."
      ru: "Евсевий помещает Ситтим у горы Фегор как место, где народ согрешил с дочерьми Моава и откуда Иисус Навин послал соглядатаев в Иерихон."

  # ---------- Shunem ----------
  - place: ac86af5
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "858"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#S_JOSUE"
    note:
      en: "Sunem, in the lot of Issachar, was in Eusebius' day a village called Soulem, five miles south of Mount Tabor."
      ru: "Сонам в уделе Иссахара был при Евсевии селением Сулем в пяти милях к югу от горы Фавор."

  # ---------- Shur ----------
  - place: acdbce0
    author: { en: "Jerome", ru: "Иероним" }
    work:
      {
        en: "Book of Places (Latin Onomasticon), entry",
        ru: "Книга о местах (латинский Ономастикон), статья",
      }
    passage: "816"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#S_GENESIS"
    note:
      en: "In a note of his own added to Eusebius, Jerome says the desert of Shur reaches as far as the Red Sea, which runs along the border of Egypt, while Kadesh is the desert beyond the city of Petra."
      ru: "В собственном добавлении к Евсевию Иероним пишет, что пустыня Сур тянется до Красного моря, омывающего границу Египта, а Кадес — пустыня за городом Петрой."
  - place: acdbce0
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "6.140"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=6:section=140"
    note:
      en: "Retelling Saul's war, Josephus has the Amalekites stretch from Pelusium in Egypt to the Red Sea, where Scripture says from Havilah to Shur; so he set the Shur end at Pelusium."
      ru: "Пересказывая войну Саула, Иосиф пишет, что амаликитяне жили от Пелусия в Египте до Красного моря, там, где Писание говорит «от Хавилы до Сура»; край Сура он, таким образом, помещал у Пелусия."

  # ---------- Sibmah ----------
  - place: aa10f27
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "824"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#S_NUMBERS_AND_DEUTERONOMY"
    note:
      en: "Eusebius knew Sabama only as a city of Moab in the land of Gilead, received by the tribe of Reuben, which Isaiah names in his oracle against Moab."
      ru: "Евсевий знал Сивму лишь как город Моава в земле Галаадской, доставшийся колену Рувимову, который Исаия называет в пророчестве о Моаве."

  # ---------- Siloam ----------
  - place: a294859
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish War", ru: "Иудейская война" }
    passage: "5.140"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0148:book=5:section=136"
    note:
      en: "The valley of the Cheesemakers, which divides the upper city from the lower, runs down as far as Siloam, the name of a spring whose water is sweet and plentiful."
      ru: "Долина Сыроделов, отделяющая Верхний город от Нижнего, спускается до самого Силоама — так зовётся источник со сладкой и обильной водой."
  - place: a294859
    author: { en: "Bordeaux Pilgrim", ru: "Бордоский паломник" }
    work: { en: "Itinerary, section", ru: "Итинерарий, раздел" }
    passage: "591-592"
    url: "https://topostext.org/work/231#591"
    note:
      en: "Going up toward Zion, on the left, down in the valley by the wall, the pilgrim of 333 saw the pool of Siloam with four porticoes and another large pool outside it; he was told its spring ran six days and nights and stopped on the Sabbath."
      ru: "По дороге на Сион, слева, внизу в долине у стены, паломник 333 года видел купальню Силоам с четырьмя портиками и ещё одну большую купальню снаружи; ему сказали, что источник течёт шесть дней и ночей, а в субботу останавливается."

  # ---------- Sodom ----------
  - place: a0aa664
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "16.2.44"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=16:chapter=2:section=44"
    note:
      en: "Local people told Strabo that thirteen cities once stood by the lake, Sodom chief among them, with a circuit of some sixty stadia left whole; earthquakes, fire and hot springs of asphalt and sulphur swallowed some and emptied the rest."
      ru: "Местные жители рассказывали Страбону, что у озера некогда стояли тринадцать городов во главе с Содомом, от которого уцелел круг около шестидесяти стадий; землетрясения, огонь и горячие источники асфальта и серы одни поглотили, другие опустошили."
  - place: a0aa664
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish War", ru: "Иудейская война" }
    passage: "4.483-485"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0148:book=4:section=476"
    note:
      en: "The land of Sodom borders the lake: once rich in fruit and cities, it was burnt by lightning for its people's impiety; traces of the five cities remain, and fruits there look ripe but turn to smoke and ash in the hand."
      ru: "К озеру примыкает земля Содома: некогда богатая плодами и городами, она была сожжена молнией за нечестие жителей; следы пяти городов видны до сих пор, а плоды там на вид спелые, но в руке рассыпаются дымом и пеплом."
  - place: a0aa664
    author: { en: "Tacitus", ru: "Тацит" }
    work: { en: "Histories", ru: "История" }
    passage: "5.7"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.02.0080:book=5:chapter=7"
    note:
      en: "Without naming Sodom, Tacitus writes of a plain near the lake, once fertile and full of great cities, said to have been struck by lightning; the soil still looks scorched, and what grows there turns black and crumbles to dust."
      ru: "Не называя Содома, Тацит пишет о равнине у озера, некогда плодородной и полной больших городов, которую, говорят, поразила молния; почва там до сих пор будто опалена, а всё, что растёт, чернеет и рассыпается в прах."

  # ---------- South ----------
  - place: a1c0469
    author: { en: "Jerome", ru: "Иероним" }
    work: { en: "Commentary on Daniel", ru: "Толкование на книгу Даниила" }
    passage: "11.5-6"
    url: "https://www.tertullian.org/fathers/jerome_daniel_02_text.htm"
    note:
      en: "Jerome takes the king of the south to be Ptolemy son of Lagus, the first king of Egypt, and the king's daughter sent north to be Berenice, daughter of Ptolemy Philadelphus, married to Antiochus Theos and put to death with her escort."
      ru: "Иероним понимает царя южного как Птолемея, сына Лага, первого царя Египта, а дочь царя, пришедшую к северному, — как Беренику, дочь Птолемея Филадельфа, выданную за Антиоха Теоса и убитую вместе со свитой."
  - place: a1c0469
    author: { en: "Polybius", ru: "Полибий" }
    work: { en: "Histories", ru: "Всеобщая история" }
    passage: "29.27"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0234:book=29:chapter=27"
    note:
      en: "In 168 BC, as Antiochus IV pressed on Egypt, the Roman envoy Popilius drew a circle round him with a vine stick and made him answer the Senate before stepping out of it; the king gave in and withdrew."
      ru: "В 168 году до н. э., когда Антиох IV теснил Египет, римский посол Попилий очертил вокруг него круг виноградной палкой и потребовал ответа сенату прежде, чем тот выйдет из круга; царь уступил и отступил."

  # ---------- Succoth ----------
  - place: a0905b5
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "1.337"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=1:section=337"
    note:
      en: "Josephus says the place where Jacob stopped on his way back was still called Tents, Succoth, in his own day; from there Jacob went on to Shechem."
      ru: "Иосиф пишет, что место, где остановился Иаков на обратном пути, и в его время называлось Шатрами, то есть Сокхофом; оттуда Иаков пошёл к Сихему."

  # ---------- Sychar ----------
  - place: a27b472
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "902"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#S_KINGS"
    note:
      en: "Sychar lies before Neapolis, near the field Jacob gave to Joseph, where Christ spoke with the Samaritan woman at the well; the place was still shown, and Jerome adds that a church now stood there."
      ru: "Сихарь лежит перед Неаполем, близ поля, которое Иаков дал Иосифу, где Христос говорил с самарянкой у колодца; место ещё показывали, а Иероним добавляет, что там теперь построена церковь."
  - place: a27b472
    author: { en: "Bordeaux Pilgrim", ru: "Бордоский паломник" }
    work: { en: "Itinerary, section", ru: "Итинерарий, раздел" }
    passage: "588"
    url: "https://topostext.org/work/231#588"
    note:
      en: "A mile from Sichem the pilgrim of 333 came to Sychar and the well Jacob dug, where Christ spoke with the Samaritan woman; plane trees said to be planted by Jacob grew there, and a bath was fed from the well."
      ru: "В миле от Сихема паломник 333 года пришёл в Сихарь к колодцу, выкопанному Иаковом, где Христос говорил с самарянкой; там росли платаны, будто бы посаженные Иаковом, и была баня, питаемая из колодца."
  - place: a27b472
    author: { en: "Jerome", ru: "Иероним" }
    work: { en: "Letter 108, section", ru: "Письмо 108, раздел" }
    passage: "13"
    url: "https://www.newadvent.org/fathers/3001108.htm"
    note:
      en: "Jerome insists the name should be read Shechem, now Neapolis, not Sychar as many wrongly read, and has Paula enter the church built around Jacob's well on the side of Mount Gerizim."
      ru: "Иероним настаивает, что читать надо «Сихем», ныне Неаполь, а не «Сихарь», как многие ошибочно читают, и рассказывает, как Павла вошла в церковь, построенную вокруг колодца Иакова на склоне горы Гаризим."

  # ---------- Syria ----------
  - place: a159fa4
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "16.2.2"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=16:chapter=2:section=2"
    note:
      en: "Starting from Cilicia and Mount Amanus, Strabo counts as parts of Syria Commagene, the Seleucis, Coele-Syria, Phoenicia on the coast and Judaea inland, with Jews, Idumaeans, Gazaeans and Azotians mixed among the Syrians."
      ru: "Начиная от Киликии и горы Аман, Страбон относит к Сирии Коммагену, Селевкиду, Келесирию, Финикию на побережье и Иудею в глубине страны, где среди сирийцев живут иудеи, идумеи, газейцы и азотяне."
  - place: a159fa4
    author: { en: "Pliny the Elder", ru: "Плиний Старший" }
    work: { en: "Natural History", ru: "Естественная история" }
    passage: "5.66-67"
    url: "https://penelope.uchicago.edu/Thayer/L/Roman/Texts/Pliny_the_Elder/5*.html#66"
    note:
      en: "Syria, once the greatest of lands, held the coast under many names, Palestine, Judaea, Coele, Phoenice and Damascena among them; Pliny gives it 470 miles between Cilicia and Arabia and 175 from Seleucia Pieria to Zeugma on the Euphrates."
      ru: "Сирия, некогда величайшая из земель, занимала побережье под многими именами — Палестина, Иудея, Келесирия, Финикия, Дамаскина; Плиний даёт ей 470 миль от Киликии до Аравии и 175 от Селевкии Пиерийской до Зевгмы на Евфрате."

  # ---------- Taanach ----------
  - place: a6f05f6
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "505"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#TH_JUDGES"
    note:
      en: "Eusebius recalls that Manasseh failed to drive the old inhabitants out of Taanach and that Deborah fought Sisera there; in his day it was a large village three miles from Legio."
      ru: "Евсевий напоминает, что Манассия не изгнал прежних жителей Фаанаха и что там Девора сражалась с Сисарой; в его время это было большое селение в трёх милях от Легиона."

  # ---------- Tahpanhes ----------
  - place: adb008c
    author: { en: "Herodotus", ru: "Геродот" }
    work: { en: "Histories", ru: "История" }
    passage: "2.30"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0126:book=2:chapter=30"
    note:
      en: "Under Psammetichus a garrison at Daphnae of Pelusium guarded Egypt against Arabia and Assyria, and in Herodotus' own day the Persians still kept a garrison there."
      ru: "При Псамметихе гарнизон в Дафнах Пелусийских охранял Египет от Аравии и Ассирии, и при самом Геродоте персы всё ещё держали там стражу."
  - place: adb008c
    author: { en: "Herodotus", ru: "Геродот" }
    work: { en: "Histories", ru: "История" }
    passage: "2.107"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0126:book=2:chapter=107"
    note:
      en: "The priests told Herodotus that Sesostris, returning with his captives, reached Daphnae of Pelusium, where his brother invited him to a banquet and tried to burn him and his sons in the house."
      ru: "Жрецы рассказали Геродоту, что Сесострис, возвращаясь с пленными, дошёл до Дафн Пелусийских, где брат позвал его на пир и попытался сжечь его с сыновьями в доме."

  # ---------- Tarshish ----------
  - place: a5f43dd
    author: { en: "Herodotus", ru: "Геродот" }
    work: { en: "Histories", ru: "История" }
    passage: "1.163"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0126:book=1:chapter=163"
    note:
      en: "Tartessus in Iberia, often taken for Tarshish, was reached by the Phocaeans in fifty-oared ships; its king Arganthonius, who reigned eighty years and lived to a hundred and twenty, invited them to settle in his land."
      ru: "До Тартесса в Иберии, которого часто отождествляют с Фарсисом, фокейцы дошли на пятидесятивёсельных кораблях; его царь Арганфоний, царствовавший восемьдесят лет и доживший до ста двадцати, звал их поселиться у него."
  - place: a5f43dd
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "3.2.11"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=3:chapter=2:section=11"
    note:
      en: "Strabo says the ancients called the Baetis, today's Guadalquivir, the Tartessus, and that a city of the same name once stood between the river's two mouths, in a district called Tartessis."
      ru: "Страбон пишет, что древние называли Бетис, нынешний Гвадалквивир, Тартессом и что между двумя устьями реки некогда стоял одноимённый город, а округа звалась Тартессидой."
  - place: a5f43dd
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "1.127"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=1:section=122"
    note:
      en: "Josephus took Tharsus, son of Javan, for the father of the Tharsians, the old name of Cilicia, pointing to its chief city Tarsus, where a tau has replaced the theta."
      ru: "Иосиф считал Фарсиса, сына Иавана, родоначальником фарсийцев — так прежде звалась Киликия — и указывал на её главный город Тарс, где «тета» заменилась на «тау»."

  # ---------- Tekoa ----------
  - place: a2e3aa0
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "497"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#TH_JOSUE"
    note:
      en: "In Eusebius' day Thekoe was a village near the desert of Aelia, that is Jerusalem, and was known as the home of the prophet Amos."
      ru: "Во времена Евсевия Фекоя была селением у пустыни Элии, то есть Иерусалима, и была известна как родина пророка Амоса."
  - place: a2e3aa0
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Life", ru: "Жизнь" }
    passage: "420-421"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0150:section=414"
    note:
      en: "During the siege of Jerusalem Titus sent Josephus with a thousand horsemen to the village of Thecoa to judge whether it suited a camp; on the way back he found three friends among the crucified and won their release."
      ru: "Во время осады Иерусалима Тит послал Иосифа с тысячей всадников в селение Фекою, чтобы понять, годится ли оно для лагеря; на обратном пути Иосиф узнал среди распятых трёх знакомых и добился, чтобы их сняли."

  # ---------- Teman ----------
  - place: a831506
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "486"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#TH_GENESIS"
    note:
      en: "In Eusebius' day there was still a village Thaiman about fifteen miles from Petra, with a garrison of Roman soldiers; he adds that the name means south and is given to the whole southern region."
      ru: "При Евсевии ещё существовало селение Феман примерно в пятнадцати милях от Петры, с гарнизоном римских солдат; он добавляет, что имя значит «юг» и так называют всю южную область."

  # ---------- Thyatira ----------
  - place: a94b661
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "13.4.4"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=13:chapter=4:section=4"
    note:
      en: "Crossing the ridge on the road from Pergamum to Sardis, one finds Thyatira on the left, a settlement of the Macedonians, which some call the last city of the Mysians."
      ru: "Если перейти хребет по дороге из Пергама в Сардис, слева будет Фиатира — поселение македонян, которое некоторые называют последним городом мисийцев."
  - place: a94b661
    author: { en: "Livy", ru: "Тит Ливий" }
    work: { en: "History of Rome", ru: "История Рима от основания города" }
    passage: "37.37.6"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Liv.+37.37"
    note:
      en: "In 190 BC, before the battle of Magnesia, Antiochus the Great had his camp near Thyatira, and from there he sent Scipio Africanus his captured son back to him."
      ru: "В 190 году до н. э., перед битвой при Магнесии, Антиох Великий стоял лагерем у Фиатиры и оттуда отослал Сципиону Африканскому его пленённого сына."

  # ---------- Tiberias ----------
  - place: ac9adc9
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "18.36-38"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=18:section=36"
    note:
      en: "Herod the tetrarch built Tiberias in the best part of Galilee, on the lake of Gennesaret, near warm baths; he settled it with strangers, Galileans brought by force, the poor and freedmen, for the city stood over many tombs and Jewish law held such settlers unclean."
      ru: "Ирод-четвертовластник построил Тивериаду в лучшей части Галилеи, у Геннисаретского озера, близ тёплых бань; он заселил её пришлыми, насильно приведёнными галилеянами, бедняками и вольноотпущенниками, ведь город стоял на месте многих гробниц, а по иудейскому закону такие жители нечисты."
  - place: ac9adc9
    author: { en: "Pliny the Elder", ru: "Плиний Старший" }
    work: { en: "Natural History", ru: "Естественная история" }
    passage: "5.71"
    url: "https://penelope.uchicago.edu/Thayer/L/Roman/Texts/Pliny_the_Elder/5*.html#71"
    note:
      en: "The lake of Gennesaret, sixteen miles long and six wide, is ringed by pleasant towns, and on its west side lies Tiberias, healthful for its hot waters."
      ru: "Геннисаретское озеро длиной шестнадцать миль и шириной шесть окружено приятными городами, а на его западном берегу лежит Тивериада, целебная своими горячими водами."

  # ---------- Timnah ----------
  - place: a21f909
    author: { en: "Sennacherib", ru: "Сеннахирим" }
    work:
      {
        en: "Rassam Cylinder (RINAP 3, Sennacherib 4), line",
        ru: "Цилиндр Рассама (RINAP 3, Сеннахирим 4), строка",
      }
    passage: "46"
    url: "https://oracc.museum.upenn.edu/rinap/rinap3/Q003478/"
    note:
      en: "In 701 BC, after beating the Egyptian army in the plain of Eltekeh, Sennacherib says he besieged, conquered and plundered Eltekeh and Tamna, then went on to punish Ekron."
      ru: "В 701 году до н. э., разбив египетское войско на равнине Елтеке, Сеннахирим, по его словам, осадил, взял и разграбил Елтеке и Тамну, а затем двинулся карать Екрон."

  # ---------- Topheth ----------
  - place: ad81b79
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "520"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#TH_KINGS"
    note:
      en: "Eusebius says a place called Thapheth, which Jeremiah names for its altar, was still shown in the suburbs of Jerusalem, near the fuller's pool and the field of Akeldama."
      ru: "Евсевий пишет, что место Тофет, которое Иеремия называет по его жертвеннику, ещё показывали в предместьях Иерусалима, близ пруда белильщиков и поля Акелдама."

  # ---------- Troas ----------
  - place: a91c509
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "13.1.26"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=13:chapter=1:section=26"
    note:
      en: "Alexandria in the Troad was founded by Antigonus as Antigonia and renamed by Lysimachus in honour of Alexander; it lasted and grew, received a Roman colony and in Strabo's day counted among the famous cities."
      ru: "Александрию в Троаде основал Антигон под именем Антигонии, а Лисимах переименовал её в честь Александра; город уцелел и вырос, принял римскую колонию и при Страбоне считался одним из славных городов."
  - place: a91c509
    author: { en: "Pliny the Elder", ru: "Плиний Старший" }
    work: { en: "Natural History", ru: "Естественная история" }
    passage: "5.124"
    url: "https://penelope.uchicago.edu/Thayer/L/Roman/Texts/Pliny_the_Elder/5*.html#124"
    note:
      en: "Listing the Troad from Hamaxitus onward, Pliny names Troas itself, once called Antigonia and now Alexandria, a Roman colony."
      ru: "Перечисляя Троаду начиная с Гамаксита, Плиний называет саму Троаду, прежде именовавшуюся Антигонией, а ныне Александрию — римскую колонию."

  # ---------- Tubal ----------
  - place: aaaaead
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "1.124"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=1:section=122"
    note:
      en: "Josephus says Thobel, that is Tubal, founded the Thobelites, whom men of his day called Iberes, while Mosoch founded the Mosocheni, now the Cappadocians."
      ru: "Иосиф пишет, что Фовел, то есть Фувал, был родоначальником фовелитов, которых ныне зовут иберами, а Мосох — мосохенов, ныне каппадокийцев."
  - place: aaaaead
    author: { en: "Herodotus", ru: "Геродот" }
    work: { en: "Histories", ru: "История" }
    passage: "3.94"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0126:book=3:chapter=94"
    note:
      en: "Under Darius the Moschi and Tibareni, usually taken for Meshech and Tubal, formed with the Macrones, Mossynoeci and Mares the nineteenth province, paying three hundred talents."
      ru: "При Дарии мосхи и тибарены, которых обычно отождествляют с Мешехом и Фувалом, вместе с макронами, моссинеками и марами составляли девятнадцатую сатрапию и платили триста талантов."
  - place: aaaaead
    author: { en: "Xenophon", ru: "Ксенофонт" }
    work: { en: "Anabasis", ru: "Анабасис" }
    passage: "5.5.2"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0202:book=5:chapter=5:section=2"
    note:
      en: "Marching along the Black Sea coast in 400 BC, the Ten Thousand reached the land of the Tibarenians, much more level, with weaker forts on the shore, which the generals wished to plunder."
      ru: "Идя вдоль берега Чёрного моря в 400 году до н. э., десять тысяч греков пришли в страну тибаренов, гораздо более ровную, с менее крепкими укреплениями на побережье, которые полководцы хотели разграбить."

  # ---------- Valley of Achor ----------
  - place: a31492f
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "49"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#A_JOSHUE"
    note:
      en: "The valley where Achan was stoned lies north of Jericho, and Eusebius says the people nearby still called it Achor."
      ru: "Долина, где побили камнями Ахана, лежит к северу от Иерихона, и, по словам Евсевия, окрестные жители всё ещё называли её Ахор."

  # ---------- Valley of Hinnom ----------
  - place: a37c8e6
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "332"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#G_JOSUE"
    note:
      en: "Eusebius explains the name as the ravine of Ennom, says it is thought to be Gehenna, assigns it to Benjamin's lot and places it close to the wall of Jerusalem on the east."
      ru: "Евсевий толкует имя как «ущелье Енном», пишет, что его считают геенной, относит его к уделу Вениамина и помещает у самой стены Иерусалима с востока."

  # ---------- Valley of Jezreel ----------
  - place: aa516c2
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "549"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#I_JOSUE"
    note:
      en: "In Eusebius' day the great plain between Scythopolis and Legio held a very famous village, Esdraela, which he takes for the old Jezreel of Manasseh's lot."
      ru: "При Евсевии на великой равнине между Скифополем и Легионом стояло очень известное селение Ездраэла, которое он считает древним Изреелем из удела Манассии."

  # ---------- Valley of Rephaim ----------
  - place: a7559e6
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "7.71"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=7:section=71"
    note:
      en: "When David became king, the Philistines marched on Jerusalem and camped in the valley called the Valley of the Giants, a place not far from the city."
      ru: "Когда Давид стал царём, филистимляне пошли на Иерусалим и стали лагерем в долине, называемой Долиной исполинов, недалеко от города."
  - place: a7559e6
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "792"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#R_KINGS"
    note:
      en: "Eusebius calls Raphaein the valley of the foreigners and places it north of Jerusalem."
      ru: "Евсевий называет долину Рефаимов «долиной иноплеменников» и помещает её к северу от Иерусалима."

  # ---------- Valley of Salt ----------
  - place: af936bd
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "355"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#G_KINGS"
    note:
      en: "Eusebius lists Gemela as a district of Edom and notes that Aquila and Symmachus translate the name as ravine of salt."
      ru: "Евсевий называет Гемелу областью Едома и отмечает, что Акила и Симмах переводят имя как «ущелье соли»."

  # ---------- Valley of the Arnon ----------
  - place: af4c2cd
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "4.85"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=4:section=85"
    note:
      en: "The river Arnon rises in the mountains of Arabia, runs through all the wilderness into the Dead Sea and forms the border between the land of the Moabites and that of the Amorites."
      ru: "Река Арнон берёт начало в горах Аравии, течёт через всю пустыню в Мёртвое море и служит границей между землёй моавитян и землёй аморреев."
  - place: af4c2cd
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "18"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#A_NUMBERS_AND_DEUTERONOMY"
    note:
      en: "The local people still pointed out the Arnon, running north of Areopolis; units of soldiers from many forts were posted along it because the place was dangerous."
      ru: "Местные жители ещё показывали Арнон к северу от Ареополя; вдоль него стояли отряды солдат из многих крепостей, потому что место было опасным."

  # ---------- Wilderness of Sinai ----------
  - place: ae50cf1
    author: { en: "Egeria", ru: "Эгерия" }
    work: { en: "Itinerary", ru: "Паломничество" }
    passage: "2.1-2"
    url: "https://www.thelatinlibrary.com/egeria1.html"
    note:
      en: "Coming to the mountain of God about 383, Egeria crossed a huge and very flat valley, some sixteen miles long and four wide by her guides' estimate, where the children of Israel camped while Moses was on the mountain."
      ru: "Подходя к горе Божией около 383 года, Эгерия пересекла огромную и очень ровную долину — по словам проводников, около шестнадцати миль в длину и четырёх в ширину, — где стояли сыны Израилевы, пока Моисей был на горе."
  - place: ae50cf1
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "3.75-76"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=3:section=75"
    note:
      en: "Moses had the people pitch their tents near the mountain and went up Sinai, which Josephus calls the highest mountain of the region, hard to climb for its height and its sheer cliffs."
      ru: "Моисей велел народу разбить шатры у горы и поднялся на Синай, который Иосиф называет самой высокой горой края, труднодоступной из-за высоты и отвесных обрывов."

  # ---------- Ziklag ----------
  - place: a0ed7ff
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "839"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#S_JOSUE"
    note:
      en: "Eusebius recalls that Achish gave Sikelag to David and places it in the lot of Judah or Simeon, in the Daroma, the southern district of his day."
      ru: "Евсевий напоминает, что Анхус отдал Секелаг Давиду, и относит его к уделу Иуды или Симеона, в Дароме — южном округе его времени."
  - place: a0ed7ff
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "6.356"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=6:section=351"
    note:
      en: "Sent back by the king of Gath, David returned to Ziklag to find that the Amalekites had raided it in his absence, taken it and burnt it, and carried off much plunder from it and from Philistine land."
      ru: "Отосланный царём Гефа, Давид вернулся в Секелаг и узнал, что в его отсутствие амаликитяне напали на город, взяли и сожгли его и угнали много добычи из него и из земли филистимской."

  # ---------- Zin ----------
  - place: a0b5c50
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "4.78"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=4:section=78"
    note:
      en: "Josephus makes Sin a mountain: Miriam, he says, was given a costly public funeral and buried on a mountain called Sin, and the people mourned her thirty days."
      ru: "У Иосифа Син — гора: Мариам, по его словам, похоронили с пышными общественными почестями на горе, называемой Син, и народ оплакивал её тридцать дней."

  # ---------- Zion ----------
  - place: af20c46
    author: { en: "Bordeaux Pilgrim", ru: "Бордоский паломник" }
    work: { en: "Itinerary, section", ru: "Итинерарий, раздел" }
    passage: "592"
    url: "https://topostext.org/work/231#592"
    note:
      en: "Climbing Sion in 333, the pilgrim was shown the house of Caiaphas and the column of the scourging; inside the wall stood the site of David's palace, and of seven synagogues once there only one remained, the rest ploughed and sown."
      ru: "Поднявшись на Сион в 333 году, паломник видел место дома Каиафы и столп бичевания; внутри стены показывали место дворца Давида, а из семи синагог, что там были, осталась одна, остальные распаханы и засеяны."
  - place: af20c46
    author: { en: "Egeria", ru: "Эгерия" }
    work: { en: "Itinerary", ru: "Паломничество" }
    passage: "43.2-3"
    url: "https://www.thelatinlibrary.com/egeria2.html"
    note:
      en: "At Pentecost in the 380s the people led the bishop to Sion by the third hour and read the passage of Acts on the coming of the Spirit, for the church there stood on the spot where the disciples had been gathered."
      ru: "В Пятидесятницу 380-х годов народ к третьему часу приводил епископа на Сион и читал место из Деяний о сошествии Духа, ведь тамошняя церковь стояла там, где некогда собрались ученики."

  # ---------- Ziph ----------
  - place: a9b852f
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "465"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#Z_JOSUE"
    note:
      en: "Ziph, where David hid, was still a village in the Daroma, on the border of Eleutheropolis near Hebron, at the eighth mile to the east."
      ru: "Зиф, где скрывался Давид, при Евсевии всё ещё был селением в Дароме, на границе Елевферополя близ Хеврона, на восьмой миле к востоку."

  # ---------- Zoan ----------
  - place: ac31fee
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "17.1.20"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=17:chapter=1:section=20"
    note:
      en: "Strabo places Tanis, a large city, in the Tanite nome by the Tanitic mouth of the Nile, which some call the Saitic mouth."
      ru: "Страбон помещает Танис, большой город, в Танитском номе у Танитского устья Нила, которое некоторые называют Саитским."
  - place: ac31fee
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish War", ru: "Иудейская война" }
    passage: "4.659-660"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0148:book=4:section=656"
    note:
      en: "Marching from Egypt to Judaea in AD 70, Titus sailed along the Mendesian nome to Thmuis, then went on foot and spent the night at a small city called Tanis, his first stop before Heracleopolis and Pelusium."
      ru: "Выступив из Египта в Иудею в 70 году, Тит доплыл вдоль Мендесийского нома до Тмуиса, потом пошёл пешком и заночевал в небольшом городе Танис — первой остановке перед Гераклеополем и Пелусием."
  - place: ac31fee
    author: { en: "Egeria", ru: "Эгерия" }
