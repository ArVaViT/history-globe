    note:
      en: "A few days after Jericho fell, Joshua sent three thousand armed men against Ai, a city above Jericho; its people drove them back, and thirty-six of them were killed."
      ru: "Через несколько дней после падения Иерихона Иисус Навин послал три тысячи воинов на Гай, город выше Иерихона; жители отбросили их, и тридцать шесть человек погибли."

  # ---------- Aijalon ----------
  - place: a1c600b
    author: { en: "Eusebius", ru: "Евсевий" }
    work: { en: "Onomasticon (Wolf's numbering)", ru: "Ономастикон (нумерация Вульфа)" }
