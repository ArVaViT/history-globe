      ru: "У Асфальтового озера лежит земля Содомская, некогда богатая плодами и городами, а ныне вся выжженная; за нечестие жителей её поразила молния, и до сих пор видны следы пяти городов и плоды, что рассыпаются пеплом в руке. Из городов Иосиф называет только Содом."
  - place: aa572e2
