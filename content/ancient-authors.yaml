      ru: "Анафоф, город Вениамина, отданный священникам, лежал у третьей мили от Иерусалима и был родиной пророка Иеремии."
  - place: ab34789
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
