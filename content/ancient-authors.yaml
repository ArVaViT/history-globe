      ru: "На земле, пожалованной Августом, Ирод построил храм из белого мрамора у истоков Иордана в Панеаде, где у подножия высокой горы зияет тёмная пещера с отвесным провалом к неподвижной воде, глубину которой не измерить."
  - place: ab7bf48
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish War", ru: "Иудейская война" }
    passage: "3.509-513"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0148:book=3:whiston+chapter=10:whiston+section=7"
    note:
      en: "Panium was thought to be the source of the Jordan, but Philip showed that the water comes underground from the round pool of Phiala by throwing chaff into it; Agrippa later adorned Panium at his own cost."
      ru: "Панеаду считали истоком Иордана, но Филипп, бросив мякину в круглое озеро Фиала, показал, что вода приходит туда под землёй; позже Агриппа украсил Панеаду на свои средства."
  - place: ab7bf48
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "18.28"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=18:whiston+chapter=2:whiston+section=1"
    note:
      en: "The tetrarch Philip built Paneas, a city at the springs of the Jordan, and named it Caesarea."
      ru: "Четвертовластник Филипп отстроил Панеаду, город у истоков Иордана, и назвал его Кесарией."

  # ---------- Calah ----------
  - place: ae1f807
    author: { en: "Xenophon", ru: "Ксенофонт" }
    work: { en: "Anabasis", ru: "Анабасис" }
    passage: "3.4.7-9"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0202:book=3:chapter=4:section=7"
    note:
      en: "In 401 BC the Greeks reached a large deserted city, Larisa, once held by the Medes, with a brick wall 25 feet thick and 100 high on a stone base and a stone pyramid nearby; the Persian king took it only when a cloud hid the sun. Larisa is identified with Calah."
      ru: "В 401 г. до н. э. греки дошли до большого покинутого города Ларисы, где некогда жили мидяне, с кирпичной стеной в двадцать пять футов толщиной и сто высотой на каменном цоколе и каменной пирамидой рядом; персидский царь взял его, лишь когда облако скрыло солнце. Ларису отождествляют с Калахом."

