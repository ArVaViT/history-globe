    note:
      en: "Urged on by Nimrod, the people built a tower of burnt brick bound with bitumen so that water could not get in; God confused their languages, and the place, Josephus says, is now called Babylon, since Babel means confusion in Hebrew."
      ru: "По наущению Нимрода люди строили башню из обожжённого кирпича, скреплённого асфальтом, чтобы в неё не проникала вода; Бог смешал их языки, и место это, по словам Иосифа, теперь зовётся Вавилоном, ведь «Вавел» по-еврейски — смешение."
  - place: ab8fdbc
    author: { en: "Eusebius", ru: "Евсевий" }
    work: { en: "Onomasticon (Wolf's numbering)", ru: "Ономастикон (нумерация Вульфа)" }
    passage: "191"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#B_GENESIS"
    note:
      en: "Babylon, meaning confusion, was the city of Nimrod, where the tongues of the tower builders were confused; Eusebius cites Josephus and the Sibyl for the story of the tower."
      ru: "Вавилон, что значит «смешение», — город Нимрода, где смешались языки строителей башни; рассказ о башне Евсевий подкрепляет ссылками на Иосифа и Сивиллу."

