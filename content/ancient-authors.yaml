    note:
      en: "King Amyntas held Antioch near Pisidia and the country as far as Apollonias, and from there tried to wipe out the Cilicians and Pisidians who came down from the Taurus to raid it, razing many strongholds."
      ru: "Царь Аминта владел Антиохией Писидийской и землёй до Аполлонии и оттуда пытался истребить киликийцев и писидийцев, спускавшихся с Тавра для набегов, и срыл многие крепости."

  # ---------- Arabia ----------
  - place: a59f6f5
