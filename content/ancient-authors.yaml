      ru: "Мелит лежит напротив сицилийского мыса Пахин, и оттуда происходят маленькие собачки, называемые мелитскими."

  # ---------- Mamre ----------
  - place: aeb9e97
    author: { en: "Sozomen", ru: "Созомен" }
    work: { en: "Church History", ru: "Церковная история" }
    passage: "2.4"
    url: "https://www.newadvent.org/fathers/26022.htm"
    note:
      en: "The oak of Mamre, now called Terebinthus, fifteen stades from Hebron, drew locals, Phoenicians and Arabs every summer to a feast and fair kept by Jews, pagans and Christians alike; offerings were cast into Abraham's well."
      ru: "К дубу Мамре, теперь называемому Теревинф, в пятнадцати стадиях от Хеврона, каждое лето сходились местные жители, финикияне и арабы на праздник и ярмарку — иудеи, язычники и христиане; в колодец Авраама бросали приношения."
  - place: aeb9e97
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Life of Constantine", ru: "Жизнь Константина" }
