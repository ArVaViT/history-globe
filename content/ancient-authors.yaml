      ru: "Астароф, древний город Ога, где жили исполины, отданный Манассии, лежал в Батанее в шести милях от Адраа (Едрея), города Аравии в двадцати пяти милях от Бостры."

  # ---------- Asia ----------
  - place: a197f19
