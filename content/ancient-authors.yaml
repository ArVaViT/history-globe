      ru: "Равнины Моавитские, где народ был исчислен второй раз, лежат у Иордана напротив Иерихона; место показывали у горы Фегор на дороге из Ливиады в Есевон."

  # ---------- Moab ----------
  - place: aa0b1d6
    author: { en: "Mesha Stele", ru: "Стела Меши" }
    work: { en: "Moabite inscription, sections", ru: "моавитская надпись, разделы" }
    passage: "1-3, 7"
    url: "https://www.livius.org/sources/content/anet/320-the-stela-of-mesha/"
    note:
      en: "Mesha of Dibon, king of Moab, says Omri and his son oppressed Moab because Chemosh was angry with his land, but Chemosh freed it in his days; at Chemosh's word he took Nebo from Israel by night."
      ru: "Меша из Дивона, царь Моава, пишет, что Амврий и его сын угнетали Моав, потому что Хамос гневался на свою землю, но в его дни Хамос освободил её; по слову Хамоса он ночью взял у Израиля Нево."
  - place: aa0b1d6
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "653"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#M_GENESIS"
    note:
      en: "Moab, named after Lot's son, is a city of Arabia now called Areopolis; the surrounding territory is also called Moab."
      ru: "Моав, названный по сыну Лота, — город Аравии, ныне называемый Ареополь; окрестная земля тоже зовётся Моавом."

  # ---------- Most Holy Place ----------
  - place: a9acaaf
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish War", ru: "Иудейская война" }
    passage: "5.215-221"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0148:book=5:section=215"
    note:
      en: "The inmost part of Herod's temple was twenty cubits long, divided from the outer part by a veil; it held nothing, and no one might enter, touch or even see it; this was the Holy of Holies."
      ru: "Внутренняя часть Иродова храма имела двадцать локтей в длину и отделялась от внешней завесой; в ней ничего не было, и никто не мог ни войти туда, ни даже увидеть её; это и было Святое Святых."
  - place: a9acaaf
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "14.69-76"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=14:section=69"
    note:
      en: "In 63 BC Pompey and some of his officers entered the sanctuary, till then seen by none but the high priests; though it held the golden table, the lampstand and 2,000 talents of sacred money, he touched nothing and ordered it cleansed next day."
      ru: "В 63 г. до н. э. Помпей с несколькими спутниками вошёл в святилище, которое прежде видели только первосвященники; хотя там были золотой стол, светильник и две тысячи талантов священных денег, он ничего не тронул и на другой день велел очистить храм."
  - place: a9acaaf
    author: { en: "Tacitus", ru: "Тацит" }
    work: { en: "Histories", ru: "История" }
    passage: "5.9"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.02.0080:book=5:chapter=9"
    note:
      en: "Pompey entered the temple by right of conquest, and so it became known that the sanctuary was empty, holding no image of any god and no hidden mystery."
      ru: "Помпей вошёл в храм по праву победителя, и так стало известно, что святилище пусто: в нём нет ни изображения бога, ни какой-либо тайны."

  # ---------- Mount Carmel ----------
  - place: a3e21c6
    author: { en: "Tacitus", ru: "Тацит" }
    work: { en: "Histories", ru: "История" }
    passage: "2.78"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.02.0080:book=2:chapter=78"
    note:
      en: "Carmel, between Judea and Syria, is the name of both the mountain and its god, who has no image or temple, only an altar; when Vespasian sacrificed there in AD 69, the priest Basilides foretold him a vast house, boundless lands and many men."
      ru: "Кармил между Иудеей и Сирией — имя и горы, и бога, у которого нет ни изображения, ни храма, только жертвенник; когда в 69 г. там приносил жертву Веспасиан, жрец Василид предрёк ему огромный дом, безграничные земли и множество людей."
  - place: a3e21c6
    author: { en: "Suetonius", ru: "Светоний" }
    work: { en: "Life of Vespasian", ru: "Жизнь Веспасиана" }
    passage: "5.6"
    url: "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Suetonius/12Caesars/Vespasian*.html#5"
    note:
      en: "When Vespasian consulted the oracle of the god of Carmel in Judea, the lots promised that whatever he planned, however great, would come to pass."
      ru: "Когда Веспасиан вопрошал оракул бога Кармила в Иудее, жребии обещали, что всё задуманное им, как бы велико оно ни было, сбудется."
  - place: a3e21c6
    author: { en: "Pliny the Elder", ru: "Плиний Старший" }
    work: { en: "Natural History", ru: "Естественная история" }
    passage: "5.75"
    url: "https://penelope.uchicago.edu/Thayer/L/Roman/Texts/Pliny_the_Elder/5*.html#75"
    note:
      en: "Along the coast Pliny lists the promontory of Carmel with a town of the same name on the mountain, once called Acbatana; the Belus, with its glass-making sand, flows from a marsh at the foot of Carmel."
      ru: "На побережье Плиний называет мыс Кармил и город того же имени на горе, прежде называвшийся Акбатаной; у подножия Кармила из болота вытекает Бел, чей песок идёт на стекло."

  # ---------- Mount Ebal ----------
  - place: aa5cc66
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "4.302-308"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=4:section=302"
    note:
      en: "Moses ordered an altar facing the rising sun near Shechem, between Gerizim on the right and Ebal on the left, with six tribes on each mountain answering one another with blessings and curses."
      ru: "Моисей велел поставить жертвенник лицом к восходу близ Сихема, между Гаризимом справа и Гевалом слева, а на каждой горе стоять шести коленам, попеременно отвечая благословениями и проклятиями."
  - place: aa5cc66
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "307"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#G_NUMBERS_AND_DEUTERONOMY"
    note:
      en: "Eusebius puts Ebal and Gerizim as two facing hills near Jericho and says the Samaritans are wrong to show two mountains near Neapolis, which stand too far apart for the blessing and curse to be heard from one to the other."
      ru: "Евсевий считает Гевал и Гаризим двумя холмами напротив друг друга близ Иерихона и говорит, что самаряне ошибаются, показывая две горы у Неаполя: они слишком далеко друг от друга, чтобы с одной было слышно благословение и проклятие с другой."

  # ---------- Mount Gerizim ----------
  - place: a30e967
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "18.85-87"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=18:section=85"
    note:
      en: "Under Pilate a Samaritan agitator called the people to Gerizim, which they held the holiest of mountains, promising to show the sacred vessels Moses had buried there; Pilate's horse and foot fell on the armed crowd at the village of Tirathaba."
      ru: "При Пилате один самарянин созвал народ на Гаризим, который самаряне считали святейшей из гор, обещая показать священные сосуды, будто бы зарытые там Моисеем; конница и пехота Пилата напали на вооружённую толпу в селении Тирафаба."
  - place: a30e967
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "13.254-258"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=13:section=254"
    note:
      en: "John Hyrcanus took Shechem and Gerizim and subdued the Cutheans who served at the temple built by Sanballat with Alexander's leave, a temple then deserted two hundred years after it was built."
      ru: "Иоанн Гиркан взял Сихем и Гаризим и покорил кутеев, служивших при храме, построенном Санаваллатом с позволения Александра, — храм был опустошён через двести лет после постройки."
  - place: a30e967
    author: { en: "Procopius", ru: "Прокопий Кесарийский" }
    work: { en: "Buildings", ru: "О постройках" }
    passage: "5.7"
    url: "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Procopius/Buildings/5*.html#7"
    note:
      en: "The Samaritans worshipped the summit of Gerizim above Neapolis; after their attack on the Christians, Zeno gave the mountain to the Christians and built a church of the Mother of God there, which Justinian ringed with a strong outer wall."
      ru: "Самаряне почитали вершину Гаризима над Неаполем; после их нападения на христиан Зинон отдал гору христианам и построил там церковь Богородицы, а Юстиниан окружил её крепкой внешней стеной."

  # ---------- Mount Gilboa ----------
  - place: acf57c5
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "344"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#G_KINGS"
    note:
      en: "Mount Gilboa lies six miles from Scythopolis (Beth-shan), and a village on it was still called Gelbus in Eusebius' day."
      ru: "Гора Гелвуй лежит в шести милях от Скифополя (Беф-Сана), и селение на ней при Евсевии всё ещё называлось Гельвус."

  # ---------- Mount Hermon ----------
  - place: a341fe8
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "54"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#A_JOSHUE"
    note:
      en: "Hermon, which the Phoenicians called Sanior, is the mountain still called Hermon over against Paneas and Lebanon, and the gentiles revered it as a holy place."
      ru: "Ермон, который финикияне называли Саниор, — это гора, и ныне называемая Ермоном, напротив Панеады и Ливана; язычники почитали её как святыню."

  # ---------- Mount Hor ----------
  - place: ad8027f
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "4.82-84"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=4:section=82"
    note:
      en: "Near the Arabian metropolis once called Arce and now Petra, ringed by high mountains, Aaron climbed one of them in sight of the army, gave his robes to Eleazar and died there aged 123."
      ru: "У аравийской столицы, прежде называвшейся Арке, а теперь Петра, окружённой высокими горами, Аарон на глазах у войска поднялся на одну из них, передал облачение Елеазару и умер там в 123 года."
  - place: ad8027f
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "979"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#OM_THE_PENTATEUCH"
    note:
      en: "Hor, the mountain where Aaron died, is near the city of Petra, and the rock that gave Moses water was still shown there."
      ru: "Ор, гора, где умер Аарон, находится близ города Петры, и там всё ещё показывали скалу, давшую воду Моисею."

  # ---------- Mount Horeb ----------
  - place: a9bb03e
    author: { en: "Egeria", ru: "Эгерия" }
    work: { en: "Itinerary", ru: "Паломничество" }
    passage: "4.1-3"
    url: "https://www.thelatinlibrary.com/egeria1.html"
    note:
      en: "Coming down from the summit of Sinai about AD 383, Egeria reached Horeb, a mountain joined to it, with a church; the cave where Elijah hid and the stone altar he built were shown before its door."
      ru: "Спустившись около 383 г. с вершины Синая, Эгерия пришла на Хорив — гору, примыкающую к нему, где стоит церковь; перед её дверью показывали пещеру, где скрывался Илия, и каменный жертвенник, который он поставил."
  - place: a9bb03e
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "949"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#C_NUMBERS_AND_DEUTERONOMY"
    note:
      en: "Horeb, the mountain of God, lies near Mount Sinai beyond Arabia in the desert; Jerome adds that he thinks the two names belong to one mountain."
      ru: "Хорив, гора Божия, лежит близ горы Синай, за Аравией, в пустыне; Иероним добавляет, что, по его мнению, это два имени одной горы."

  # ---------- Mount of Olives ----------
  - place: ac2c4c5
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish War", ru: "Иудейская война" }
    passage: "5.67-70"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0148:book=5:section=67"
    note:
      en: "In AD 70 the Tenth Legion, coming up from Jericho, was ordered to camp six furlongs from Jerusalem on the Mount of Olives, which faces the city on the east across the deep valley of the Kidron."
      ru: "В 70 г. десятый легион, пришедший из Иерихона, получил приказ стать лагерем в шести стадиях от Иерусалима на горе Елеонской, что лежит напротив города с востока, за глубокой долиной Кедрона."
  - place: ac2c4c5
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Life of Constantine", ru: "Жизнь Константина" }
    passage: "3.41-43"
    url: "https://www.newadvent.org/fathers/25023.htm"
    note:
      en: "Helena, Constantine's mother, dedicated two churches over sacred caves: one at Bethlehem and one on the Mount of Olives, raised on the mountain top in memory of the Ascension."
      ru: "Елена, мать Константина, освятила две церкви над священными пещерами: в Вифлееме и на горе Елеонской, воздвигнутую на вершине в память Вознесения."
  - place: ac2c4c5
    author: { en: "Egeria", ru: "Эгерия" }
    work: { en: "Itinerary", ru: "Паломничество" }
    passage: "31.1-4"
    url: "https://www.thelatinlibrary.com/egeria2.html"
    note:
      en: "On Palm Sunday the people gathered at the Eleona church and the Imbomon, the place of the Ascension, then walked down the mount into the city to the Anastasis with the bishop, children carrying palm and olive branches."
      ru: "В Вербное воскресенье народ собирался в церкви Елеона и на Имвомоне, месте Вознесения, а потом с епископом шёл пешком с горы через город к храму Воскресения; дети несли пальмовые и масличные ветви."

  # ---------- Mount Seir ----------
  - place: ae981db
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "814"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#S_GENESIS"
    note:
      en: "Seir is the mountain of Edom where Esau lived, in the district then called the Gebalene; Eusebius explains the name as hairy, after Esau."
      ru: "Сеир — гора Едома, где жил Исав, в округе, называвшемся тогда Гевалена; имя Евсевий толкует как «косматый» — по Исаву."

  # ---------- Mount Sinai ----------
  - place: abfba2a
    author: { en: "Egeria", ru: "Эгерия" }
    work: { en: "Itinerary", ru: "Паломничество" }
    passage: "3.1-8"
    url: "https://www.thelatinlibrary.com/egeria1.html"
    note:
      en: "Egeria climbed Sinai straight up with the monks, reaching the summit at the fourth hour; on the top stood only a small church and Moses' cave, and from it she saw Egypt, Palestine, the Red Sea and the Saracens' lands below."
      ru: "Эгерия поднялась на Синай прямо вверх вместе с монахами и к четвёртому часу была на вершине; там стояли лишь небольшая церковь и пещера Моисея, а внизу были видны Египет, Палестина, Чермное море и земли сарацин."
  - place: abfba2a
    author: { en: "Procopius", ru: "Прокопий Кесарийский" }
    work: { en: "Buildings", ru: "О постройках" }
    passage: "5.8"
    url: "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Procopius/Buildings/5*.html#8"
    note:
      en: "On Sina, a wild mountain near the Red Sea, monks lived, and Justinian built them a church of the Mother of God well below the summit, where no one could spend the night for the thunder, and a strong fortress at the foot against the Saracens."
      ru: "На Синае, дикой горе у Чермного моря, жили монахи, и Юстиниан построил им церковь Богородицы намного ниже вершины, где из-за грома никто не может ночевать, а у подножия — крепость против сарацин."

  # ---------- Mount Tabor ----------
  - place: acd63ee
    author: { en: "Polybius", ru: "Полибий" }
    work: { en: "Histories", ru: "Всеобщая история" }
    passage: "5.70.6-9"
    url: "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Polybius/5*.html#70"
    note:
      en: "In 218 BC Antiochus III took Atabyrium, a town on a conical hill with an ascent of over fifteen stades, by luring its garrison down the slope with a feigned retreat."
      ru: "В 218 г. до н. э. Антиох III взял Атабирий, город на конической горе с подъёмом более пятнадцати стадиев, выманив гарнизон вниз по склону притворным отступлением."
  - place: acd63ee
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish War", ru: "Иудейская война" }
    passage: "4.54-61"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0148:book=4:section=54"
    note:
      en: "Tabor, between the Great Plain and Scythopolis, has a level summit of 26 furlongs that Josephus walled in forty days; in AD 67 Placidus lured its defenders down by a feigned flight, and the rest surrendered when their water ran out."
      ru: "Фавор между Великой равниной и Скифополем имеет на вершине равнину в 26 стадиев, которую Иосиф обнёс стеной за сорок дней; в 67 г. Плацид выманил защитников вниз притворным бегством, а остальные сдались, когда кончилась вода."
  - place: acd63ee
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "501"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#TH_JOSUE"
    note:
      en: "Tabor, on the borders of Zebulun, Issachar and Naphtali, is a mountain in the plain ten miles east of Diocaesarea (Sepphoris)."
      ru: "Фавор, на границе Завулона, Иссахара и Неффалима, — гора на равнине в десяти милях к востоку от Диокесарии (Сепфориса)."

  # ---------- batch ancient 5 (fill) ----------
  # ---------- Mount Zion ----------
  - place: abd9596
    author: { en: "Epiphanius of Salamis", ru: "Епифаний Кипрский" }
    work: { en: "On Weights and Measures", ru: "О мерах и весах" }
    passage: "14"
    url: "https://www.tertullian.org/fathers/epiphanius_weights_03_text.htm"
    note:
      en: "When Hadrian came to Jerusalem it lay waste save a few houses and the small church of God on the upper room, in the part of Zion that escaped destruction; seven synagogues stood on Zion like lone huts, and one survived until Bishop Maximona and Constantine."
      ru: "Когда Адриан пришёл в Иерусалим, город лежал в развалинах, кроме немногих домов и маленькой церкви Божией на месте горницы, в уцелевшей части Сиона; на Сионе, как одинокие шалаши, стояли семь синагог, и одна дожила до епископа Максима и Константина."
  - place: abd9596
    author: { en: "Jerome", ru: "Иероним Стридонский" }
    work: { en: "Letters", ru: "Письма" }
    passage: "108.9"
    url: "https://www.newadvent.org/fathers/3001108.htm"
    note:
      en: "Paula climbed Zion, a name meaning citadel or watchtower, the city David stormed and rebuilt; there a church portico held the column of the scourging, and she was shown the place where the Spirit came down on the hundred and twenty."
      ru: "Паула поднялась на Сион — имя значит «крепость» или «сторожевая башня», — город, который Давид взял и отстроил; там портик церкви держала колонна бичевания, и ей показали место, где Дух сошёл на сто двадцать верующих."

  # ---------- Myra ----------
  - place: aa4b3e2
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "14.3.3"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=14:chapter=3:section=3"
    note:
      en: "In the Lycian League the largest cities had three votes each, and by Artemidorus Myra was one of the six largest, with Xanthus, Patara, Pinara, Olympus and Tlos."
      ru: "В Ликийском союзе крупнейшие города имели по три голоса, и Миры, по Артемидору, были среди шести самых больших — вместе с Ксанфом, Патарой, Пинарой, Олимпом и Тлосом."
  - place: aa4b3e2
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "14.3.7"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=14:chapter=3:section=7"
    note:
      en: "Myra lies on a lofty hill twenty stadia from the sea; beyond it come the mouth of the Limyrus and the small town of Limyra."
      ru: "Миры стоят на высоком холме в двадцати стадиях от моря; за ними — устье Лимира и городок Лимира."

  # ---------- Nain ----------
  - place: aee679c
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work:
      { en: "Onomasticon (Wolf's translation), entry", ru: "Ономастикон (перевод Вольфа), статья" }
    passage: "750"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#N_THE_GOSPELS"
    note:
      en: "Nain, where the widow's son was raised, is still a village twelve miles (Jerome: two) south of Mount Tabor, near Endor."
      ru: "Наин, где был воскрешён сын вдовы, и теперь селение в двенадцати милях (у Иеронима — в двух) к югу от горы Фавор, близ Аендора."
  - place: aee679c
    author: { en: "Jerome", ru: "Иероним Стридонский" }
    work: { en: "Letters", ru: "Письма" }
    passage: "108.13"
    url: "https://www.newadvent.org/fathers/3001108.htm"
    note:
      en: "Touring Galilee, Paula climbed Tabor, looked over the plain where Barak beat Sisera and the Kishon, and close by was shown the town of Nain, where the widow's son was raised."
      ru: "Объезжая Галилею, Паула поднялась на Фавор, оглядела равнину, где Варак разбил Сисару, и поток Киссон, а рядом ей показали город Наин, где был воскрешён сын вдовы."

  # ---------- Nazareth ----------
  - place: af5884f
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work:
      { en: "Onomasticon (Wolf's translation), entry", ru: "Ономастикон (перевод Вольфа), статья" }
