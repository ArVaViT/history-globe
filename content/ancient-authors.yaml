    work: { en: "Geography", ru: "География" }
    passage: "6.4.1"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=6:chapter=4:section=1"
    note:
      en: "Strabo explains Rome's rise by Italy itself: guarded by the sea on almost every side and by nearly impassable mountains on the rest, with few but excellent harbours, a climate of every degree along its length, and a place between Greece and Asia's best provinces."
      ru: "Возвышение Рима Страбон объясняет самой Италией: её почти со всех сторон стережёт море, а с остальной — почти непроходимые горы; гаваней мало, но они превосходны, климат по её длине любой, и лежит она между Грецией и лучшими провинциями Азии."
  - place: a7184a7
