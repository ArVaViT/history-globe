    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#A_GENESIS"
    note:
      en: "Aila lies at the end of Palestine between the southern desert and the Red Sea, where cargo arrives by ship from Egypt and India; a detachment of the Tenth Legion is stationed there."
      ru: "Айла лежит на краю Палестины между южной пустыней и Чермным морем, куда грузы приходят на кораблях из Египта и Индии; там стоит отряд Десятого легиона."

  # ---------- Red Sea ----------
  - place: a3d18b2
    author: { en: "Herodotus", ru: "Геродот" }
    work: { en: "Histories", ru: "История" }
    passage: "2.11"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0126:book=2:chapter=11"
    note:
      en: "The Arabian Gulf runs inland from the Red Sea for forty days' rowing and is half a day wide at most, with tides every day; Herodotus thinks Egypt was once a similar gulf filled up by the Nile."
      ru: "Аравийский залив уходит от Красного моря вглубь суши на сорок дней пути на вёслах и шириной не больше полудня пути; приливы в нём каждый день, а Египет, думает Геродот, был когда-то таким же заливом, занесённым Нилом."
  - place: a3d18b2
    author: { en: "Diodorus Siculus", ru: "Диодор Сицилийский" }
    work: { en: "Library of History", ru: "Историческая библиотека" }
    passage: "3.40.9"
    url: "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Diodorus_Siculus/3C*.html#40.9"
    note:
      en: "The Fish-eaters on the Red Sea coast keep a tale from their forefathers that once the sea drew back so far that the whole floor of the gulf became dry land, and then a great flood returned and filled it again."
      ru: "У ихтиофагов на побережье Чермного моря хранится предание отцов: однажды море отступило так далеко, что всё дно залива стало сушей, а потом огромный вал вернулся и снова его наполнил."

  # ---------- Rephidim ----------
  - place: a05ebb7
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work:
      { en: "Onomasticon (Wolf's translation), entry", ru: "Ономастикон (перевод Вольфа), статья" }
