      ru: "Аравия — крайняя к югу обитаемая страна, и только она даёт ладан, смирну, кассию, корицу и мастику; ладанные деревья стерегут маленькие крылатые змеи, которых отгоняет только дым горящей стираксы."
  - place: a59f6f5
    author: { en: "Diodorus Siculus", ru: "Диодор Сицилийский" }
