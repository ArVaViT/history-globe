    note:
      en: "At the town of Syene, five thousand stadia above Alexandria, no shadow falls at noon on the day of the solstice, and a well dug to test it is lit to the bottom, showing that the sun then stands directly overhead."
      ru: "В городе Сиене, в пяти тысячах стадий выше Александрии, в полдень солнцестояния не бывает тени, а колодец, вырытый для проверки, освещается до дна: значит, солнце тогда стоит прямо над головой."

