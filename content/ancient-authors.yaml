      ru: "У Иерихона Павла осмотрела стан Галгала и холм обрезания и смотрела на двенадцать камней, принесённых со дна Иордана, в которых Иероним видит образ двенадцати апостолов."

  # ---------- Gomorrah ----------
  - place: aa572e2
