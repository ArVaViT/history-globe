    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#B_GENESIS"
    note:
      en: "Bethel, formerly called Ulamma and Luz, allotted to Benjamin near Beth-aven and Ai, was still a village twelve miles from Jerusalem on the right of the road to Neapolis."
      ru: "Вефиль, прежде называвшийся Уламма и Луз, доставшийся Вениамину, близ Беф-Авена и Гая, всё ещё был селением в двенадцати милях от Иерусалима, справа от дороги на Неаполь."
  - place: a64f355
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish War", ru: "Иудейская война" }
    passage: "4.551"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0148:book=4:whiston+chapter=9:whiston+section=9"
    note:
      en: "In AD 69 Vespasian, marching into the hill country, took the two small cities of Bethel and Ephraim, put garrisons in them and rode on as far as Jerusalem."
      ru: "В 69 г. н. э. Веспасиан, двинувшись в горы, взял два небольших города — Вефиль и Ефрем, поставил в них гарнизоны и доехал до Иерусалима."

  # ---------- Bethlehem ----------
  - place: a112427
    author: { en: "Eusebius", ru: "Евсевий" }
    work: { en: "Onomasticon (Wolf's numbering)", ru: "Ономастикон (нумерация Вульфа)" }
    passage: "196"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#B_GENESIS"
    note:
      en: "Bethlehem lies six miles south of Jerusalem by the road down to Hebron, and the tombs of Jesse and David are shown there; Jerome adds the tower of Eder a mile away, where the shepherds heard of the Lord's birth."
      ru: "Вифлеем лежит в шести милях к югу от Иерусалима у дороги, спускающейся к Хеврону, и там показывают гробницы Иессея и Давида; Иероним добавляет башню Гадер в миле оттуда, где пастухи услышали о рождении Господа."
  - place: a112427
    author: { en: "Origen", ru: "Ориген" }
    work: { en: "Against Celsus", ru: "Против Цельса" }
    passage: "1.51"
    url: "https://www.newadvent.org/fathers/04161.htm"
    note:
      en: "Origen answers Celsus that in Bethlehem the cave where Jesus was born and the manger in it are shown, and that this is much talked of in the region, even among enemies of the faith."
      ru: "Ориген отвечает Цельсу, что в Вифлееме показывают пещеру, где родился Иисус, и ясли в ней, и об этом много говорят в округе даже враги веры."
  - place: a112427
    author: { en: "Jerome", ru: "Иероним" }
    work: { en: "Letters", ru: "Письма" }
    passage: "108.10"
    url: "https://www.newadvent.org/fathers/3001108.htm"
    note:
      en: "Paula stopped at Rachel's tomb on the right of the road and then entered the cave at Bethlehem where the Saviour was born, declaring that with the eyes of faith she could see the infant Lord in the manger."
      ru: "Павла остановилась у гробницы Рахили справа от дороги, а затем вошла в вифлеемскую пещеру, где родился Спаситель, и уверяла, что очами веры видит Младенца в яслях."

  # ---------- Bethsaida ----------
  - place: a91b732
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "18.28"
