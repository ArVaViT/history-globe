      ru: "Филистимляне стали станом между Сокхофом и Азекой, а Саул встал против них на холме по ту сторону долины; из их стана вышел Голиаф из Гефа ростом в четыре локтя с пядью."

  # ---------- Babylon (Revelation) ----------
  - place: a3f0756
