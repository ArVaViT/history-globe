      ru: "Ваал — это Кириаф-Иарим, «город лесов»; во времена Евсевия селение Кариафиарим стояло у десятой мили на дороге, спускающейся из Иерусалима в Диосполь."

  # ---------- Babel ----------
  - place: ab8fdbc
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Antiquities of the Jews", ru: "Иудейские древности" }
