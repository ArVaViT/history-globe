      ru: "В 614 г. до н. э. мидяне, двинувшись на Ниневию и взяв Тарбису, пошли вдоль Тигра, напали на Ассур и разрушили его с великим избиением; Набопаласар опоздал к битве и заключил союз с Киаксаром у стен города."
  - place: a874951
    author: { en: "Cyrus Cylinder", ru: "Цилиндр Кира" }
