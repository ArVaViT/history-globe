      ru: "В 701 г. до н. э. жители Екрона призвали царей Египта и колесницы Мелуххи; они выстроились на равнине Елтеке, где Сеннахирим разбил их и взял живыми египетских колесничих и царевичей, а затем осадил и разграбил Елтеке и Фимнафу."

  # ---------- En-dor ----------
  - place: aca444b
    author: { en: "Eusebius", ru: "Евсевий" }
