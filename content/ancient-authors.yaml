    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#R_THE_PENTATEUCH"
    note:
      en: "Ramoth in Gilead, a priestly city of refuge of Gad, is now a village fifteen miles west of Philadelphia; under Ramoth-gilead Eusebius adds that it lies in Perea by the Jabbok."
      ru: "Рамоф в Галааде, город священников и убежища в колене Гадовом, — ныне селение в пятнадцати милях к западу от Филадельфии; в статье о Рамофе Галаадском Евсевий добавляет, что он в Перее, у Иавока."

  # ---------- Red Sea (Gulf of Aqaba) ----------
  - place: ad64d75
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "16.4.4"
