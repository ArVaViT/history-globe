      ru: "Евсевий понимает Салим как город сихемлян, а Иероним добавляет одноимённое селение к западу от Иерусалима и селение Салумиас в восьми милях от Скифополя на равнине, отмечая, что Иосиф считал Салим Мелхиседека Иерусалимом."

