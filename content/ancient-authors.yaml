        en: "Onomasticon, Latin version (Wolf's numbering)",
        ru: "Ономастикон, латинская версия (нумерация Вульфа)",
      }
    passage: "11"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#A_GENESIS"
    note:
      en: "The threshing floor of Atad, where Jacob was mourned, lay three miles from Jericho and two from the Jordan; it was then called Bethagla, place of circling, because the mourners went round there in lament."
      ru: "Горен-гаатад, где оплакивали Иакова, лежал в трёх милях от Иерихона и в двух от Иордана; тогда это место звалось Бефагла, «место кружения», потому что плачущие ходили там кругом."

  # ---------- Ataroth ----------
  - place: abc9a1d
    author: { en: "Mesha Stele", ru: "Стела Меши" }
    work: { en: "Moabite inscription, paragraph", ru: "моавитская надпись, абзац" }
