    work: { en: "Life", ru: "Жизнеописание" }
    passage: "403"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0149:section=403"
    note:
      en: "In a skirmish near Julias his horse fell into a marsh and threw him; with a broken wrist Josephus was carried to a village called Kepharnokos, usually taken to be Capernaum."
      ru: "В стычке у Юлиады конь Иосифа увяз в болоте и сбросил его; с переломом запястья его отнесли в селение Кефарнок, которое обычно считают Капернаумом."
  - place: af2161c
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
    passage: "624"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm"
    note:
      en: "Capernaum lies by the lake of Gennesaret and is still a village in Galilee of the nations, on the border of Zebulun and Naphtali."
      ru: "Капернаум лежит у Геннисаретского озера и всё ещё остаётся селением в Галилее языческой, на границе Завулона и Неффалима."

  # ---------- Carchemish ----------
  - place: af6c730
    author: { en: "Babylonian Chronicle", ru: "Вавилонская хроника" }
    work: { en: "ABC 5, obverse lines", ru: "ABC 5, лицевая сторона, строки" }
