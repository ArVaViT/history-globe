    note:
      en: "Cenchreae is a village with a harbour about 70 stadia from Corinth, serving the trade with Asia as Lechaeum serves that with Italy; nearby is Schoenus, where ships were hauled across the Isthmus."
      ru: "Кенхреи — селение с гаванью примерно в 70 стадиях от Коринфа; через него шла торговля с Азией, как через Лехей — с Италией; рядом Схен, где корабли перетаскивали через перешеек."
  - place: aa31dd3
    author: { en: "Pausanias", ru: "Павсаний" }
    work: { en: "Description of Greece", ru: "Описание Эллады" }
    passage: "2.2.3"
