      ru: "Имя Ассирии охватывает Вавилонию и обширную страну вокруг: Атурию с Ниневией, равнины Доломену, Калахену, Хазену и Адиабену и народы Месопотамии до переправы через Евфрат у Зевгмы."
  - place: a3d1321
