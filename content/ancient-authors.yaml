    note:
      en: "The tetrarch Philip made the village of Bethsaida on the lake of Gennesaret a city, adding settlers and fine buildings, and renamed it Julias after Augustus' daughter."
      ru: "Четвертовластник Филипп сделал селение Вифсаиду на Геннисаретском озере городом, прибавив жителей и украсив его, и переименовал в Юлиаду в честь дочери Августа."
  - place: a91b732
    author: { en: "Pliny the Elder", ru: "Плиний Старший" }
    work: { en: "Natural History", ru: "Естественная история" }
    passage: "5.71"
    url: "https://penelope.uchicago.edu/Thayer/L/Roman/Texts/Pliny_the_Elder/5*.html#71"
    note:
      en: "The lake Pliny calls Genesara, sixteen miles long and six wide, is ringed by pleasant towns: Julias and Hippos on the east, Tarichea on the south and Tiberias on the west."
      ru: "Озеро, которое Плиний зовёт Генесара, длиной шестнадцать миль и шириной шесть, окружено приятными городами: Юлиадой и Гиппосом на востоке, Тарихеей на юге и Тивериадой на западе."

  # ---------- Beyond the River ----------
  - place: a88310a
    author: { en: "Herodotus", ru: "Геродот" }
    work: { en: "Histories", ru: "История" }
    passage: "3.91.1"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0126:book=3:chapter=91"
    note:
      en: "In Darius' tribute list the fifth province ran from Posideion on the Cilician-Syrian border to Egypt, taking in all Phoenicia, the part of Syria called Palestine, and Cyprus, and paid 350 talents; the Arabians' part paid none."
      ru: "В податном списке Дария пятый округ простирался от Посидея на границе Киликии и Сирии до Египта, включал всю Финикию, часть Сирии, называемую Палестиной, и Кипр и платил 350 талантов; земля арабов подати не платила."

  # ---------- Bozrah ----------
  - place: a871210
    author: { en: "Eusebius", ru: "Евсевий" }
    work: { en: "Onomasticon (Wolf's numbering)", ru: "Ономастикон (нумерация Вульфа)" }
    passage: "209"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#B_NUMBERS_AND_DEUTERONOMY"
    note:
      en: "Besides Bosor of Reuben, now Bostra, the metropolis of Arabia, Eusebius knows another Bosor, a city of Esau, now in the hills of Idumaea, of which Isaiah asks who comes from Edom in red garments from Bosor."
      ru: "Кроме Восора Рувимова, ныне Бостры, митрополии Аравии, Евсевий знает другой Восор — город Исава, ныне в горах Идумеи, о котором Исаия говорит: «Кто это идёт от Едома, в червлёных ризах от Восора?»"

  # ---------- Brook of Egypt ----------
  - place: a7a59b4
    author: { en: "Diodorus Siculus", ru: "Диодор Сицилийский" }
    work: { en: "Library of History", ru: "Историческая библиотека" }
