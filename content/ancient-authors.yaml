      ru: "В 334 г. до н. э. Александр пробил часть стены Милита, а его триеры, ставшие борт к борту носами наружу поперёк входа в гавань, отрезали персидский флот, и город пал."

  # ---------- Mizpah ----------
  - place: a736f6c
