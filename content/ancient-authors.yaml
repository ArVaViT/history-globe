      en: "Beth-haram, a city of Gad near the Jordan, was called Bethramphtha by the Assyrians and is now Livias; Jerome adds that Herod named it so in honour of Augustus."
      ru: "Беф-Гарам, город Гада близ Иордана, ассирийцы звали Бефрамфой, а теперь это Ливиада; Иероним добавляет, что так её назвал Ирод в честь Августа."

  # ---------- Beth-hoglah ----------
