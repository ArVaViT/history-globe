      ru: "В 494 г. до н. э. персы взяли Милит с моря и суши, подкопав стены; большинство мужчин перебили, женщин и детей обратили в рабство, а храм в Дидимах разграбили и сожгли, как и предсказывал оракул."
  - place: a55027d
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "14.1.6"
