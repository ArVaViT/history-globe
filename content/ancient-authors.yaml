      ru: "Авиф, в греческом Гефаим, — город Гадада, четвёртого царя Едома, в Идумее, в округе, который тогда звался Гевалиной."

  # ---------- Azmon ----------
  - place: a8f6a28
    author: { en: "Eusebius", ru: "Евсевий" }
    work: { en: "Onomasticon (Wolf's numbering)", ru: "Ономастикон (нумерация Вульфа)" }
