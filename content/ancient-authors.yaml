    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#C_NUMBERS_AND_DEUTERONOMY"
    note:
      en: "Chinnereth is the sea on the border of Judaea in the lot of Naphtali; Jerome adds that the town of that name was the one Herod later rebuilt and called Tiberias in honour of Tiberius Caesar."
      ru: "Киннереф — море на границе Иудеи в уделе Неффалима; Иероним добавляет, что этот город позже отстроил Ирод и назвал Тивериадой в честь кесаря Тиберия."

  # ---------- City of Palms ----------
  - place: a529e92
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish War", ru: "Иудейская война" }
    passage: "4.459-469"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0148:book=4:section=459"
    note:
      en: "Elisha's spring by Jericho waters a plain seventy furlongs long and twenty broad, full of gardens and many kinds of palm, whose best dates yield a honey hardly inferior to bees' honey; the land also bears the precious balsam."
      ru: "Источник Елисея у Иерихона орошает равнину в семьдесят стадий длиной и двадцать шириной, полную садов и пальм многих видов, лучшие финики которых дают мёд, почти не уступающий пчелиному; родит здесь и драгоценный бальзам."
  - place: a529e92
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "16.2.41"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=16:chapter=2:section=41"
    note:
      en: "Jericho is a plain ringed by hills like a theatre; its palm grove, 100 stadia long, watered by streams and full of dwellings, has a palace and the balsam garden, and palms and balsam bring a large revenue."
      ru: "Иерихон — равнина, окружённая горами наподобие театра; его пальмовая роща в сто стадий длиной, орошённая ручьями и полная жилищ, имеет дворец и сад бальзама, а пальмы и бальзам приносят большой доход."

