      en: "Attalus III left his kingdom of Pergamum to the Romans, who made the country a province and called it Asia, after the name of the continent."
      ru: "Аттал III завещал своё Пергамское царство римлянам, и они сделали страну провинцией и назвали её Асией — по имени материка."
  - place: a197f19
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "17.3.25"
