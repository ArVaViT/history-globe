      ru: "Амаликитяне, жившие в Гоболитиде и Петре, самые воинственные из окрестных народов, подбивали соседей раздавить бежавших из Египта евреев, пока те не набрались сил."

  # ---------- Ammon ----------
  - place: a6046fa
    author: { en: "Eusebius", ru: "Евсевий" }
