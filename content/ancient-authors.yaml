    note:
      en: "When Alexander the Great came through, the Samaritans had Shechem as their chief city, lying by Mount Gerizim; Josephus mocks them for claiming kinship with the Jews only when the Jews prosper."
      ru: "Когда через страну прошёл Александр Македонский, главным городом самарян был Сихем у горы Гаризим; Иосиф насмехается над ними за то, что они называют себя роднёй иудеев, лишь когда иудеям везёт."
  - place: adf74d4
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
