      ru: "Мелит в 800 стадиях от Сиракуз имеет много удобных гаваней, зажиточных жителей, ткачей на редкость тонкого и мягкого льна и красивые оштукатуренные дома; это финикийская колония, надёжное убежище на их пути к западному океану."
  - place: a57835d
