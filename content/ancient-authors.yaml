    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#D_JOSUE"
    note:
      en: "Under the name Dabira Eusebius notes a Jewish village of his own day on Mount Tabor, in the district of Diocaesarea."
      ru: "Под именем Дабира Евсевий отмечает еврейское селение своего времени на горе Фавор, в округе Диокесарии."
  - place: a6a5e97
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish War", ru: "Иудейская война" }
    passage: "2.595"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0148:book=2:section=595"
    note:
      en: "In AD 66 young men of the village of Dabaritta, keeping guard in the Great Plain, ambushed Ptolemy, steward of Agrippa and Berenice, and took his baggage: costly garments, many silver cups and six hundred gold pieces."
      ru: "В 66 г. н. э. юноши из селения Дабаритта, стоявшие в дозоре на Великой равнине, устроили засаду Птолемею, управителю Агриппы и Береники, и отняли его поклажу — дорогие одежды, множество серебряных чаш и шестьсот золотых."

  # ---------- Decapolis ----------
  - place: ae733a2
    author: { en: "Pliny the Elder", ru: "Плиний Старший" }
    work: { en: "Natural History", ru: "Естественная история" }
    passage: "5.74"
    url: "https://penelope.uchicago.edu/Thayer/L/Roman/Texts/Pliny_the_Elder/5*.html#74"
    note:
      en: "The Decapolis, named for its number of towns, adjoins Syria; writers differ on the list, but most give Damascus, Philadelphia, Raphana, Scythopolis, Gadara, Hippos, Dion, Pella rich in water, Gerasa and Canatha, with tetrarchies like small kingdoms between them."
      ru: "Десятиградие, названное по числу городов, примыкает к Сирии; списки у авторов расходятся, но чаще всего называют Дамаск, Филадельфию, Рафану, Скифополь, Гадару, Иппос, Дион, богатую водой Пеллу, Герасу и Канафу, а между ними лежат тетрархии, подобные малым царствам."
  - place: ae733a2
    author: { en: "Eusebius", ru: "Евсевий" }
    work: { en: "Onomasticon (Wolf's numbering)", ru: "Ономастикон (нумерация Вульфа)" }
    passage: "396"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#D_THE_GOSPELS"
    note:
      en: "Eusebius places the Decapolis of the Gospels in Peraea, around Hippos, Pella and Gadara; Jerome's version calls it the land of the ten cities beyond the Jordan."
      ru: "Десятиградие Евангелий Евсевий помещает в Перее, вокруг Иппоса, Пеллы и Гадары; в переводе Иеронима это земля десяти городов за Иорданом."

  # ---------- Dinhabah ----------
  - place: ae28fc7
    author: { en: "Eusebius", ru: "Евсевий" }
    work: { en: "Onomasticon (Wolf's numbering)", ru: "Ономастикон (нумерация Вульфа)" }
    passage: "370"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#D_GENESIS"
    note:
      en: "For the city of Bela son of Beor, king of Edom, Eusebius offers two villages of his day: Dannaia, eight miles from Areopolis on the road to the Arnon, and Dannaba on Mount Peor, seven miles from Heshbon."
      ru: "Для города Белы, сына Веорова, царя Едомского, Евсевий называет два селения своего времени: Даннею в восьми милях от Ареополя по дороге к Арнону и Даннаву на горе Фегор в семи милях от Есевона."

  # ---------- Dor ----------
  - place: a70c56b
    author: { en: "Eusebius", ru: "Евсевий" }
    work: { en: "Onomasticon (Wolf's numbering)", ru: "Ономастикон (нумерация Вульфа)" }
    passage: "376"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#D_JOSUE"
    note:
      en: "Dora lay on the coast near Caesarea; Manasseh, to whose lot it fell, never held it, because its old inhabitants stayed. Jerome adds that it stood at the ninth milestone on the road to Tyre and was by then deserted."
      ru: "Дор лежал на побережье близ Кесарии; Манассия, которому он достался по жребию, так им и не овладел, потому что прежние жители остались. Иероним добавляет, что город стоял у девятой мили по дороге в Тир и к тому времени опустел."
  - place: a70c56b
    author: { en: "Pliny the Elder", ru: "Плиний Старший" }
    work: { en: "Natural History", ru: "Естественная история" }
    passage: "5.75"
    url: "https://penelope.uchicago.edu/Thayer/L/Roman/Texts/Pliny_the_Elder/5*.html#75"
    note:
      en: "Going up the coast toward Carmel, Pliny names Dorum and Sycaminum only as the memory of cities: in his day they no longer stood as towns."
      ru: "Двигаясь вдоль берега к Кармилу, Плиний называет Дор и Сикамин лишь как «память о городах»: в его время их как городов уже не было."
  - place: a70c56b
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "19.300-311"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=19:whiston+chapter=6:whiston+section=3"
    note:
      en: "Under Claudius some young men of Dora, defying his edict for the Jews, set up the emperor's statue in the synagogue; Agrippa protested to Petronius, governor of Syria, who wrote to Dora ordering the culprits sent to him."
      ru: "При Клавдии юноши Дора вопреки его указу о евреях поставили статую императора в синагоге; Агриппа пожаловался наместнику Сирии Петронию, и тот письменно потребовал от Дора прислать к нему виновных."

  # ---------- Ebenezer ----------
  - place: abfdefc
    author: { en: "Eusebius", ru: "Евсевий" }
    work: { en: "Onomasticon (Wolf's numbering)", ru: "Ономастикон (нумерация Вульфа)" }
    passage: "145"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#A_KINGS"
    note:
      en: "Eusebius puts the stone of help, where the foreigners carried off the ark, between Jerusalem and Ascalon, near the village of Bethaamus."
      ru: "Камень помощи, где иноплеменники захватили ковчег, Евсевий помещает между Иерусалимом и Аскалоном, близ селения Вефаамус."

  # ---------- Elim ----------
  - place: a2410c1
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "3.9-10"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=3:section=9"
    note:
      en: "Elim looked good from afar for its palm grove, but close up the seventy palms were stunted and creeping for want of water, and the twelve springs were mere damp patches that did not flow; digging in the sand gave no water."
      ru: "Издали Елим казался хорошим местом из-за пальмовой рощи, но вблизи семьдесят пальм оказались чахлыми и стелющимися от безводья, а двенадцать источников — лишь сырыми местами, из которых ничего не текло; в песке, сколько ни копали, воды не нашли."

  # ---------- Eltekeh ----------
