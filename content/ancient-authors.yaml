      en: "Makkedah, where Joshua shut the five kings in the cave, lay in Eusebius' day eight miles east of Eleutheropolis."
      ru: "Македа, где Иисус Навин запер в пещере пять царей, при Евсевии находилась в восьми милях к востоку от Елевферополя."

  # ---------- Malta ----------
  - place: a57835d
