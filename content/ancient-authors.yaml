      ru: "Прорвавшись через Персидские ворота в 330 г. до н. э., Александр поспел в Персеполь прежде, чем разграбили казну, взял сокровища Кира в Пасаргадах и сжёг персидский дворец вопреки совету Пармениона — в отмщение за Афины."

  # ---------- Philadelphia ----------
