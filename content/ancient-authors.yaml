      ru: "Ривла — в земле Емаф, где фараон взял в плен Иоахаза; во второй статье, Реблафа, она названа округом Вавилона, а латинский текст Иеронима отождествляет её с Антиохией."

  # ---------- Sea of Galilee ----------
  - place: a562fcc
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish War", ru: "Иудейская война" }
    passage: "3.506-508"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0148:book=3:section=506"
    note:
      en: "The lake of Gennesar, named after the land beside it, is 40 stades wide and 140 long; its water is sweet, pure and cooler than one would expect, it holds fish found nowhere else, and the Jordan runs through it."
      ru: "Озеро Геннисаретское, названное по соседней земле, шириной 40 стадиев и длиной 140; вода в нём сладкая, чистая и прохладнее, чем можно ждать, рыба особая, какой нет в других местах, а Иордан проходит сквозь него."
  - place: a562fcc
    author: { en: "Pliny the Elder", ru: "Плиний Старший" }
    work: { en: "Natural History", ru: "Естественная история" }
    passage: "5.71"
    url: "https://penelope.uchicago.edu/Thayer/L/Roman/Texts/Pliny_the_Elder/5*.html#71"
    note:
      en: "The Jordan pours into a lake most call Genesara, 16 miles long and 6 wide, ringed by pleasant towns: Julias and Hippos to the east, Tarichea to the south, which some give its name to the lake, and Tiberias with its healthy hot springs to the west."
      ru: "Иордан вливается в озеро, которое большинство зовёт Генесара, — 16 миль в длину и 6 в ширину, в кольце приятных городов: Юлиада и Гиппос на востоке, Тарихея на юге, по которой озеро иногда и называют, и Тивериада с целебными горячими водами на западе."

  # ---------- Seleucia ----------
  - place: a6d306d
    author: { en: "Polybius", ru: "Полибий" }
    work: { en: "Histories", ru: "Всеобщая история" }
    passage: "5.59.3-11"
