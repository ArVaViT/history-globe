      ru: "Кармил, родина Навала, — это селение, которое теперь зовут Хермала, в десяти милях от Хеврона; там стоит римский гарнизон."

  # ---------- Cenchreae ----------
  - place: aa31dd3
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "8.6.22"
