      ru: "Отступая от Иерусалима в 66 г. н. э., Цестий перебил вьючный скот и двинулся к Беф-Орону; на узком спуске иудеи осыпали его войско стрелами, и лишь ночь позволила римлянам укрыться в Беф-Ороне."
  - place: a75b45e
