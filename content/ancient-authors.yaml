      ru: "Холм Ареса назван так потому, что первым здесь судили Ареса; позже здесь судили Ореста за убийство матери, а необтёсанные камни, на которых стоят обвиняемый и обвинитель, зовут камнями Обиды и Беспощадности."

  # ---------- Argob ----------
  - place: a42a5b2
