    url: "https://www.livius.org/sources/content/anet/320-the-stela-of-mesha/"
    note:
      en: "Mesha says the men of Gad had lived in the land of Ataroth from of old and the king of Israel built it for himself; Mesha took the town, killed its people for Chemosh, carried off its fire-hearth to Chemosh at Kerioth and settled other men there."
      ru: "Меса пишет, что люди Гада издревле жили в земле Атарофа и царь Израильский построил его для себя; Меса взял город, истребил жителей ради Хамоса, унёс оттуда очаг-жертвенник к Хамосу в Кериоф и поселил там других людей."
  - place: abc9a1d
    author: { en: "Eusebius", ru: "Евсевий" }
    work: { en: "Onomasticon (Wolf's numbering)", ru: "Ономастикон (нумерация Вульфа)" }
