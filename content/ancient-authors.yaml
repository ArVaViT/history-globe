    url: "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Polybius/5*.html#88.1"
    note:
      en: "When an earthquake threw down the Colossus and most of the walls and arsenals, the Rhodians pleaded their disaster with such dignity that kings and cities showered them with gifts; Hiero and Gelo alone gave 75 talents."
      ru: "Когда землетрясение повалило Колосса и большую часть стен и арсеналов, родосцы представили своё бедствие с таким достоинством, что цари и города осыпали их дарами; одни Гиерон и Гелон дали 75 талантов."

  # ---------- Riblah ----------
  - place: ab2bde8
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work:
