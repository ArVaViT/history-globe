    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#B_NUMBERS_AND_DEUTERONOMY"
    note:
      en: "Eusebius takes Bezer, Reuben's priestly city of refuge in the desert east of Jericho, for Bostra, the metropolis of Arabia, and sets apart another Bosor, Esau's city in the hills of Idumaea."
      ru: "Евсевий принимает Бецер, город убежища колена Рувимова в пустыне к востоку от Иерихона, за Бостру, столицу Аравии, и отличает от него другой Восор — город Исава в горах Идумеи."

  # ---------- Bithynia ----------
  - place: a5c0cb0
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "12.4.1-2"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=12:chapter=4:section=1"
    note:
      en: "Bithynia is bounded by the Paphlagonians on the east, the Euxine from the Sangarius to Byzantium on the north, the Propontis on the west and Mysia and Phrygia on the south; on its coast stand Chalcedon and Nicomedia, named after a Bithynian king."
      ru: "Вифиния граничит на востоке с пафлагонянами, на севере — с Понтом Эвксинским от Сангария до Византия, на западе — с Пропонтидой, на юге — с Мисией и Фригией; на её берегу стоят Халкидон и Никомидия, названная по вифинскому царю."

  # ---------- Calneh ----------
  - place: a7be664
    author: { en: "Eusebius", ru: "Евсевий" }
    work: { en: "Onomasticon (Wolf's numbering)", ru: "Ономастикон (нумерация Вульфа)" }
    passage: "942"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#C_GENESIS"
    note:
      en: "Calneh was a city of King Nimrod in Babylonia; Eusebius adds that Isaiah calls it Calneh, where the tower was built."
      ru: "Калне — город царя Нимрода в Вавилонии; Евсевий добавляет, что Исаия называет его Калне, «где была построена башня»."

  # ---------- Cappadocia ----------
  - place: a33fbde
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "12.1.1"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=12:chapter=1:section=1"
    note:
      en: "Cappadocia has many parts and has often changed; its peoples of one tongue are bounded by the Cilician Taurus on the south, Armenia and Colchis on the east, the Euxine as far as the Halys on the north, and Paphlagonia and Galatia on the west."
      ru: "Каппадокия состоит из многих частей и не раз меняла границы; её народы одного языка ограничены Киликийским Тавром на юге, Арменией и Колхидой на востоке, Понтом Эвксинским до Галиса на севере, Пафлагонией и Галатией на западе."

  # ---------- Cherith ----------
  - place: aa7bee8
    author: { en: "Eusebius", ru: "Евсевий" }
    work: { en: "Onomasticon (Wolf's numbering)", ru: "Ономастикон (нумерация Вульфа)" }
    passage: "969"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#C_KINGS"
    note:
      en: "Eusebius places the brook Cherith beyond the Jordan; Jerome adds that Elijah hid there, in the region of that river."
      ru: "Евсевий помещает поток Хораф за Иорданом; Иероним добавляет, что там, в области этой реки, скрывался Илия."

  # ---------- Chinnereth ----------
  - place: a2bb265
    author: { en: "Eusebius", ru: "Евсевий" }
    work: { en: "Onomasticon (Wolf's numbering)", ru: "Ономастикон (нумерация Вульфа)" }
