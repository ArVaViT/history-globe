    note:
      en: "Of the Temple's gates nine were plated with gold and silver, but one outside the sanctuary, of Corinthian bronze and usually taken for the Beautiful Gate, far surpassed them; the gate over it on the east was fifty cubits high, with doors of forty, reached by fifteen steps."
      ru: "Из ворот храма девять были обложены золотом и серебром, но одни, вне святилища, из коринфской меди — их обычно и считают Красными дверями, — намного превосходили их; восточные ворота над ними были высотой в пятьдесят локтей, с дверями в сорок, и к ним вели пятнадцать ступеней."

  # ---------- Beth-anath ----------
  - place: ae6cef8
