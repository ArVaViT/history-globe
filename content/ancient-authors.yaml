    note:
      en: "In 605 BC the crown prince Nebuchadnezzar marched to Carchemish on the Euphrates, crossed the river against the Egyptian army camped there and routed it; the survivors were overtaken and destroyed in the district of Hamath."
      ru: "В 605 г. до н. э. наследник Навуходоносор подошёл к Кархемису на Евфрате, переправился против стоявшего там египетского войска и разбил его; уцелевших настигли и истребили в области Емафа."
  - place: af6c730
