    note:
      en: "In Jehoiakim's fourth year Nebuchadnezzar went up to Carchemish on the Euphrates against Necho, who then held all Syria; Necho was beaten with the loss of many thousands, and the Babylonian took Syria as far as Pelusium, except Judea."
      ru: "В четвёртый год Иоакима Навуходоносор пошёл к Кархемису на Евфрате против Нехао, державшего тогда всю Сирию; Нехао был разбит, потеряв многие тысячи, и вавилонянин занял Сирию до Пелусия, кроме Иудеи."
  - place: af6c730
    author: { en: "Sargon II", ru: "Саргон II" }
    work:
      {
