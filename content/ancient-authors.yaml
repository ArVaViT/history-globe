      ru: "Меса, царь Моавитский, пишет, что построил Ваал-Меон и сделал в нём водоём, а затем называет Дом Ваал-Меона среди городов, которые он отстроил и куда пригнал стада."

  # ---------- Baal-peor ----------
  - place: a3d6e81
    author: { en: "Eusebius", ru: "Евсевий" }
