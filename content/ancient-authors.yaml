    note:
      en: "Pelusium lay more than twenty stadia from the sea amid marshes and pools, with a wall twenty stadia round, and took its name from the mud; it guarded the hard eastern approach to Egypt across the waterless isthmus."
      ru: "Пелусий лежал более чем в двадцати стадиях от моря среди болот и топей, его стена имела двадцать стадиев в окружности, а имя он получил от ила; он сторожил трудный восточный вход в Египет через безводный перешеек."
