    note:
      en: "Near the lake lies a plain once fertile and the site of great cities, later burnt by lightning; its soil looks scorched and whatever grows there turns black and crumbles to dust, though Tacitus also blames the lake's vapours. He names none of the cities."
      ru: "Недалеко от озера лежит равнина, некогда плодородная, где стояли большие города, сожжённые молнией; почва там будто опалена, и всё, что растёт, чернеет и рассыпается в прах, хотя Тацит винит и испарения озера. Городов он не называет."

