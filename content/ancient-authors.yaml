    note:
      en: "Seleucia lies on the southern slope of Mount Coryphaeum, falling to the sea in terraces ringed by cliffs; the port and suburb below have strong walls, and from the sea the town is reached only by steps cut in the rock."
      ru: "Селевкия лежит на южном склоне горы Корифей и уступами спускается к морю, окружённая обрывами; гавань и предместье внизу обнесены крепкими стенами, а с моря в город ведёт лишь лестница, высеченная в скале."
  - place: a6d306d
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
