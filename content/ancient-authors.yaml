      ru: "После неудачных попыток Аристагора и десяти тысяч афинян Гагнон изгнал эдонян и основал город на месте Девяти Путей, назвав его Амфиполем, потому что Стримон обтекает его с двух сторон; длинная стена замкнула круг от реки до реки."
  - place: a4bdea7
