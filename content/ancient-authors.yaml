      ru: "Милит, по Эфору впервые укреплённый критянами и отстроенный Нелеем, имеет четыре гавани, одна из которых вмещает целый флот; главное его дело — колонии, заселившие всё Чёрное море и Пропонтиду."
  - place: a55027d
