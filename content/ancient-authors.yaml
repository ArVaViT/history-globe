    passage: "3.39-42"
    url: "https://penelope.uchicago.edu/Thayer/L/Roman/Texts/Pliny_the_Elder/3*.html#39"
    note:
      en: "Pliny praises Italy as at once nursling and parent of all lands, chosen by the gods to unite empires and give mankind one speech; he lists its healthy air, fertile fields, sunny hills, vines and olives, fleeces, lakes, rivers and harbours."
      ru: "Плиний славит Италию как питомицу и вместе мать всех земель, избранную богами, чтобы объединить державы и дать людям общий язык; он перечисляет её здоровый воздух, тучные поля, солнечные холмы, виноград и маслины, руно, озёра, реки и гавани."

