      ru: "Иосиф делает Есевона, судившего после Иеффая, человеком из колена Иудина и из города Вифлеема; за семь лет он не совершил ничего памятного и был погребён на родине."
  - place: ab1a343
    author: { en: "Eusebius", ru: "Евсевий" }
    work: { en: "Onomasticon (Wolf's numbering)", ru: "Ономастикон (нумерация Вульфа)" }
