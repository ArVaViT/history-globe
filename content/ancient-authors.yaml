    note:
      en: "After Gaza and Raphia comes Rhinocolura, named for colonists whose noses an Ethiopian invader of Egypt cut off instead of executing them, settling them there so that they would not dare go home."
      ru: "За Газой и Рафией следует Ринокорура, названная по поселенцам, которым эфиопский завоеватель Египта вместо казни отрезал носы и поселил их здесь, чтобы они не смели вернуться домой."

  # ---------- Caesarea Philippi ----------
  - place: ab7bf48
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish War", ru: "Иудейская война" }
    passage: "1.404-406"
