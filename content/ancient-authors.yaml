  # ---------- Cana ----------
  - place: a031bda
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Life", ru: "Жизнеописание" }
    passage: "86"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0149:section=86"
    note:
      en: "In AD 66, while he commanded in Galilee, Josephus kept his quarters at Cana, which he calls a village of Galilee; from there he let John of Gischala go down to the hot baths of Tiberias."
      ru: "В 66 г., командуя в Галилее, Иосиф жил в Кане, которую называет селением Галилеи; оттуда он разрешил Иоанну Гисхальскому спуститься к горячим источникам Тивериады."
  - place: a031bda
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
