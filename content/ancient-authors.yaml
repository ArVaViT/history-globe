      ru: "Долина, где по молитве Иисуса Навина остановилась луна, лежала у селения, которое и теперь зовётся Аиалон, в трёх милях к востоку от Вефиля, близ Гивы и Рамы; Иероним добавляет, что евреи помещают Аиалон в двух милях от Никополя по дороге в Иерусалим."

