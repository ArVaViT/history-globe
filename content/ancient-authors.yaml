      ru: "Сиена лежит на границе Ефиопии и Египта, напротив острова Элефантина с его ниломером; колодец в ней отмечает летнее солнцестояние, когда полуденное солнце светит прямо в него и гномоны не отбрасывают тени; стоят там три римские когорты."
  - place: a8a6a5b
