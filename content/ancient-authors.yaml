    note:
      en: "Most of Media is high and cold, but below the Caspian Gates it is fertile; it is horse country, where 50,000 royal mares grazed under the Persians and the Nesaean horses were bred, and it gives its name to the fodder called medic."
      ru: "Большая часть Мидии высока и холодна, но ниже Каспийских ворот она плодородна; это край коней: при персах здесь паслось пятьдесят тысяч царских кобылиц и разводили несейских коней, а кормовая трава зовётся мидийской."

