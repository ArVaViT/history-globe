      ru: "Бежав из Гефа, Давид пришёл в колено Иудино и жил в пещере у города Одоллама; туда к нему собрались братья и около четырёхсот человек, нуждавшихся или боявшихся Саула."

  # ---------- Ai ----------
  - place: a7e13e1
    author: { en: "Eusebius", ru: "Евсевий" }
