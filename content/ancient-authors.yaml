    note:
      en: "Persian scholars told Herodotus that the Phoenicians came from the Red Sea (the Persian Gulf), took up long voyages with Egyptian and Assyrian wares, and at Argos carried off Io, starting the quarrel between Asia and Greece."
      ru: "Персидские учёные говорили Геродоту, что финикияне пришли от Красного моря (Персидского залива), пустились в дальние плавания с египетскими и ассирийскими товарами и в Аргосе похитили Ио, с чего и началась вражда Азии с Элладой."
  - place: a33d53e
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "16.2.24"
