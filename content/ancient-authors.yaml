      ru: "Иеремия отправился в свой родной Анафоф, в двадцати стадиях от Иерусалима, но по дороге один из начальников схватил его и обвинил в том, что он перебегает к вавилонянам."

  # ---------- Antioch of Pisidia ----------
  - place: a6c704a
