      ru: "Пока Деметрий был занят Лисимахом, Пирр пошёл на Берию и, ободрённый сном, где ему явился Александр Великий, взял её, оставил там большую часть войска и послал полководцев покорять остальную страну."

  # ---------- Beth-horon ----------
