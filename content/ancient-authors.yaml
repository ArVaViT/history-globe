      ru: "Сигор, ныне Зоора, — единственный из пяти городов земли Содомской, что уцелел; при Евсевии он был обитаем у Мёртвого моря, с римским гарнизоном; бальзам и финиковые пальмы там свидетельствовали о былом плодородии края."
  - place: aacfcda
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish War", ru: "Иудейская война" }
    passage: "4.482"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0148:book=4:section=476"
    note:
      en: "Josephus gives the Dead Sea a length of 580 furlongs, reaching as far as Zoar in Arabia, and a breadth of 150."
      ru: "Иосиф определяет длину Мёртвого моря в 580 стадий — до самого Сигора в Аравии, — а ширину в 150."
  - place: aacfcda
    author: { en: "Egeria", ru: "Эгерия" }
    work: { en: "Itinerary", ru: "Паломничество" }
    passage: "12.5-7"
    url: "https://www.thelatinlibrary.com/egeria1.html"
    note:
      en: "From Mount Nebo Egeria saw Segor, the only one of the five cities still standing; its bishop told her the pillar of Lot's wife, about six miles from Segor, had been covered by the sea for some years."
      ru: "С горы Нево Эгерия видела Сигор — единственный из пяти городов, что ещё стоит; его епископ сказал ей, что столп жены Лота, примерно в шести милях от Сигора, уже несколько лет как скрыт морем."

