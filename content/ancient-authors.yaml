      ru: "Строя флот в Финикии, Антигон брал лес с Ливана: восемь тысяч человек валили и пилили деревья, тысяча пар упряжных животных возила их к морю; хребет тянется вдоль Триполя, Библа и Сидона, покрытый кедрами и кипарисами дивной величины."
