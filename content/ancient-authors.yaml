      ru: "Эгерия через землю Гесем пришла в Тафнис, обычно отождествляемый с Танисом, — город, где, по её словам, родился Моисей и который некогда был столицей фараона."

  # ---------- Zoar ----------
  - place: aacfcda
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work: { en: "Onomasticon, entry", ru: "Ономастикон, статья" }
