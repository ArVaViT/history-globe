    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0126:book=7:chapter=114"
    note:
      en: "Xerxes' army crossed the Strymon by bridges at Nine Ways in Edonian country, the site of later Amphipolis, and on learning the name the Persians buried alive nine boys and girls of the local people."
      ru: "Войско Ксеркса перешло Стримон по мостам у Девяти Путей в земле эдонян, где позже встал Амфиполь, и, узнав название места, персы закопали там заживо девять мальчиков и девушек из местных жителей."

  # ---------- Anathoth ----------
