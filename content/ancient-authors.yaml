      ru: "Беф-Цур — селение у двадцатой мили на дороге из Иерусалима в Хеврон; рядом показывали источник, бьющий из склона холма, где, как говорили, Филипп крестил евнуха Кандакии."
  - place: addba2a
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Antiquities of the Jews", ru: "Иудейские древности" }
    passage: "12.313-315"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=12:section=313"
    note:
      en: "Lysias came with sixty thousand foot and five thousand horse and camped in the hill country of Bethsur, a village of Judaea; Judas met him with ten thousand, killed about five thousand, and Lysias went back to Antioch."
      ru: "Лисий пришёл с шестьюдесятью тысячами пеших и пятью тысячами конных и стал станом в горах у Вефсура, селения Иудеи; Иуда встретил его с десятью тысячами, убил около пяти тысяч, и Лисий вернулся в Антиохию."

  # ---------- Bethlehem of Ibzan ----------
  - place: ab1a343
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Antiquities of the Jews", ru: "Иудейские древности" }
