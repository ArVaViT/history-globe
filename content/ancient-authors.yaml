      ru: "В родословии народов Иосиф пишет, что Ханаан, четвёртый сын Хама, заселил землю, которая теперь зовётся Иудеей, и назвал её по себе Ханааном."

  # ---------- Capernaum ----------
  - place: af2161c
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish War", ru: "Иудейская война" }
    passage: "3.519"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0148:book=3:whiston+chapter=10:whiston+section=8"
    note:
      en: "Describing the plain of Gennesaret, Josephus says it is watered by a very fertile spring the locals call Capharnaum; some took it for a vein of the Nile, since it breeds the same coracin fish."
      ru: "Описывая равнину Геннисарет, Иосиф говорит, что её орошает обильнейший источник, который местные зовут Капернаумом; одни считали его жилой Нила, потому что в нём водится та же рыба коракин."
  - place: af2161c
