    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#R_THE_PENTATEUCH"
    note:
      en: "Rephidim is a place in the desert beside Mount Horeb, where water flowed from the rock and which is called Temptation; there Joshua fought Amalek near Pharan."
      ru: "Рефидим — место в пустыне у горы Хорив, где вода потекла из скалы и которое зовётся Искушением; там Иисус Навин сражался с Амаликом близ Фарана."

  # ---------- Rhodes ----------
  - place: a4218ee
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "14.2.5"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=14:chapter=2:section=5"
    note:
      en: "No city known surpasses Rhodes in harbours, streets and walls; long masters of the sea, the Rhodians put down piracy; the Colossus of the Sun, seventy cubits high, lies broken at the knees by an earthquake, and an oracle forbade raising it."
      ru: "Ни один известный город не превосходит Родос гаванями, улицами и стенами; долго владея морем, родосцы покончили с пиратством; Колосс Солнца в семьдесят локтей лежит, переломленный землетрясением в коленях, и оракул запретил его поднимать."
  - place: a4218ee
    author: { en: "Pliny the Elder", ru: "Плиний Старший" }
    work: { en: "Natural History", ru: "Естественная история" }
