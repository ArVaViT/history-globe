      en: "Mesha, king of Moab, says that he built Beth-bamoth, perhaps the same place as Bamoth-baal, because it had been destroyed, in the same breath as Aroer, the road in the Arnon and Bezer."
      ru: "Меса, царь Моавитский, пишет, что отстроил Беф-Вамоф — возможно, тот же Вамоф-Ваал, — потому что тот был разрушен, — в одном ряду с Ароером, дорогой через Арнон и Бецером."

  # ---------- Bamoth ----------
  - place: a1db553
