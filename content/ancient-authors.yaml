      ru: "Перейдя Иордан, евреи прошли пятьдесят стадий и стали лагерем в десяти стадиях от Иерихона; здесь Иисус Навин сложил жертвенник из камней, взятых со дна реки, и совершил Пасху, и манна прекратилась. Имени стана Иосиф здесь не называет."
  - place: ab94aea
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
