    note:
      en: "The Sidonians excelled in the arts and studied astronomy and arithmetic, learned through bookkeeping and sailing by night; Greece was thought to owe them astronomy and arithmetic, and Sidon and Tyre still bred philosophers."
      ru: "Сидоняне славились ремёслами и изучали астрономию и арифметику, к которым их привели торговый счёт и ночные плавания; считалось, что Эллада переняла их у Финикии, а Сидон и Тир и при Страбоне рождали философов."

