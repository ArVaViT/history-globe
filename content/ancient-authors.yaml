      ru: "Арнон, границу Моава, и теперь показывают протянувшимся на север к Ареополю; из-за жестоких набегов его стерегут воины из многих крепостей. Некогда Сигон отнял его у Моава, и отсюда начиналась земля Израиля за Иорданом."
  - place: a4cc324
