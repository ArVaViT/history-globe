      ru: "Ваал-Фегор, «идол срама», — идол Моава, Ваал, которому поклонялись на горе Фегор; Иероним добавляет, что латиняне называют его Приапом."

  # ---------- Baalah ----------
  - place: ac2f5ea
    author: { en: "Eusebius", ru: "Евсевий" }
