      ru: "Беф-Фегор, город сынов Рувимовых за Иорданом, лежал близ горы Фегор, напротив Иерихона, в шести милях выше Ливиады."

  # ---------- Beth-zur ----------
  - place: addba2a
    author: { en: "Eusebius", ru: "Евсевий" }
    work: { en: "Onomasticon (Wolf's numbering)", ru: "Ономастикон (нумерация Вульфа)" }
