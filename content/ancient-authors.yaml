    work: { en: "Geography", ru: "География" }
    passage: "16.2.13"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=16:chapter=2:section=13"
    note:
      en: "Aradus is a sea-girt rock twenty stadia off a harbourless coast, about seven stadia round and covered with houses of many storeys; founded by exiles from Sidon, it drank rainwater, water from the mainland, and in war fresh water drawn through a leather pipe from a spring in the sea floor."
      ru: "Арад — окружённая морем скала в двадцати стадиях от безгаванного берега, около семи стадиев в окружности, застроенная многоэтажными домами; основанный беглецами из Сидона, он пил дождевую воду, воду с материка, а в войну — пресную воду из источника на морском дне через кожаную трубу."

  # ---------- Ashan ----------
  - place: ab5175f
    author: { en: "Eusebius", ru: "Евсевий" }
    work: { en: "Onomasticon (Wolf's numbering)", ru: "Ономастикон (нумерация Вульфа)" }
    passage: "81"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#A_JOSHUE"
    note:
      en: "Ashan of Judah, Eusebius says, survives in a village called Bethasan, sixteen miles west of Jerusalem."
      ru: "Ашан Иудин, говорит Евсевий, сохранился в селении Бефасан, в шестнадцати милях к западу от Иерусалима."

  # ---------- Assos ----------
  - place: a0a2ca7
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "13.1.57"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=13:chapter=1:section=57"
    note:
      en: "Assos is a strong, well-walled town reached by a long, steep climb from the sea, with a harbour made by a great mole; the Stoic Cleanthes was born there, and Aristotle lived there for a time with the ruler Hermias."
      ru: "Асс — сильный город с крепкими стенами, к которому ведёт долгий крутой подъём от моря; гавань образует большой мол; здесь родился стоик Клеанф, а Аристотель некоторое время жил здесь у правителя Гермия."

  # ---------- Atad ----------
  - place: a2f186d
    author: { en: "Jerome", ru: "Иероним" }
    work:
