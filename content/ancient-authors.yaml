      ru: "Некогда селение, ныне пустое, Адуммим — это место Маледамим на дороге, спускающейся из Иерусалима в Иерихон, где стоит гарнизон; Иероним толкует имя как «восхождение крови» и связывает его с притчей о человеке, шедшем в Иерихон."

