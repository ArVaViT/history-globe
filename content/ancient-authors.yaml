      ru: "Антиохия, прозванная Писидийской, стоит на холме к югу от хребта Парории, и в ней поселена римская колония; основанная магнетами с Меандра, она имела жречество Мена Аркея с храмовыми служителями и землями, упразднённое после смерти Аминты."
  - place: a6c704a
