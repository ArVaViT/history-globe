  # ---------- Cuth ----------
  - place: a538831
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "9.288"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=9:section=288"
    note:
      en: "Josephus explains why the settlers of Samaria were still called Cuthaeans: they had been brought from a country called Cuthah in Persia, with a river of the same name, and each of their five nations set up its own gods in Samaria."
      ru: "Иосиф объясняет, почему поселенцев Самарии всё ещё звали кутеями: их привели из страны Кута в Персии, где течёт река того же имени, и каждый из их пяти народов поставил в Самарии своих богов."

  # ---------- Daberath ----------
  - place: a6a5e97
    author: { en: "Eusebius", ru: "Евсевий" }
    work: { en: "Onomasticon (Wolf's numbering)", ru: "Ономастикон (нумерация Вульфа)" }
