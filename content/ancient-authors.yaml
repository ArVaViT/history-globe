    note:
      en: "The Jordan pours into a lake most call Genesara, sixteen miles long and six wide, ringed by pleasant towns: Julias and Hippos on the east, Tarichea on the south, after which some name the lake, and Tiberias with its healthful hot springs on the west."
      ru: "Иордан впадает в озеро, которое многие зовут Геннисаретским, — шестнадцать миль в длину и шесть в ширину, в кольце приятных городов: Юлиада и Иппос на востоке, Тарихея на юге, по которой иные зовут и озеро, и Тивериада с целебными горячими водами на западе."

