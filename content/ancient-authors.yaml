    note:
      en: "The oldest wall ran south past the Siloam spring, turned east at Solomon's pool and reached a place called Ophlas, where it joined the eastern colonnade of the temple."
      ru: "Древнейшая стена шла к югу мимо источника Силоам, у Соломонова пруда поворачивала на восток и доходила до места, называемого Офла, где смыкалась с восточным портиком храма."
  - place: af96edd
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish War", ru: "Иудейская война" }
    passage: "6.354"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0148:book=6:whiston+chapter=6:whiston+section=3"
    note:
      en: "In AD 70 Titus's soldiers set fire to the archives, the Acra, the council house and the place called Ophlas; the fire spread to Queen Helena's palace."
      ru: "В 70 г. воины Тита подожгли архив, Акру, здание совета и место, называемое Офла; огонь дошёл до дворца царицы Елены."

  # ---------- Ophir ----------
  - place: a104820
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
    passage: "8.163-164"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0146:book=8:whiston+chapter=6:whiston+section=4"
    note:
      en: "Solomon's ships, built at Ezion-geber near Elath with pilots from Hiram, sailed to the land of old called Ophir, now the Golden Chersonese in India, and brought back 400 talents of gold."
      ru: "Корабли Соломона, построенные в Ецион-Гавере близ Елафа, с кормчими от Хирама, ходили в землю, прежде звавшуюся Офир, а теперь Золотой Херсонес в Индии, и привезли 400 талантов золота."
  - place: a104820
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
    work:
      { en: "Onomasticon (Wolf's translation), entry", ru: "Ономастикон (перевод Вольфа), статья" }
    passage: "811"
    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#S_GENESIS"
    note:
      en: "Sophir is the «mountain of the East» in India, near which the sons of Joktan lived, as Josephus says; Solomon's ships went there on a three-year voyage."
      ru: "Софир — «гора восточная» в Индии, близ которой, по Иосифу, жили сыновья Иоктана; туда ходили корабли Соломона в трёхлетнее плавание."

  # ---------- Pamphylia ----------
  - place: aa95188
    author: { en: "Herodotus", ru: "Геродот" }
    work: { en: "Histories", ru: "История" }
    passage: "7.91"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0126:book=7:chapter=91"
    note:
      en: "For Xerxes' fleet the Pamphylians gave a hundred ships, armed like Greeks; they descend from the Trojans scattered after the war who followed Amphilochus and Calchas."
      ru: "Для флота Ксеркса памфилийцы дали сто кораблей, вооружённых по-гречески; они происходят от троянцев, рассеянных после войны и последовавших за Амфилохом и Калхантом."
  - place: aa95188
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "14.4.1-2"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=14:chapter=4:section=1"
    note:
      en: "Pamphylia begins at Olbia after Phaselis and ends at Coracesium; along its 640-stade coast lie Attaleia, the Cestrus with Perga upstream, Aspendus on the Eurymedon and Side."
      ru: "Памфилия начинается у Ольвии за Фаселидой и кончается у Коракесия; по её берегу в 640 стадиев лежат Атталия, река Кестр с Пергией выше по течению, Аспенд на Евримедонте и Сида."

  # ---------- Paphos ----------
  - place: a314765
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
    passage: "14.6.3"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0239:book=14:chapter=6:section=3"
    note:
      en: "Old Paphos, ten stadia from the sea, has an ancient temple of the Paphian Aphrodite; Paphos, founded by Agapenor, has a harbour and fine temples, and between the two, sixty stadia apart, runs the yearly sacred procession."
      ru: "Старый Паф в десяти стадиях от моря имеет древний храм Афродиты Пафосской; Паф, основанный Агапенором, — гавань и прекрасные храмы, а между ними, в шестидесяти стадиях, ежегодно идёт священное шествие."
  - place: a314765
    author: { en: "Tacitus", ru: "Тацит" }
    work: { en: "Histories", ru: "История" }
    passage: "2.2-3"
    url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.02.0080:book=2:chapter=3"
    note:
      en: "Titus put in to visit the temple of the Paphian Venus in AD 69: only priests of Cinyras' line give oracles, blood never touches the altar, rain never wets it though it stands in the open, and the goddess is a cone, not a human figure."
      ru: "Тит в 69 г. завернул посмотреть храм Венеры Пафосской: прорицают только жрецы из рода Кинира, кровь на алтарь не льют, дождь его не мочит, хотя он под открытым небом, а богиня — не человеческая фигура, а конус."

  # ---------- Paran ----------
