      en: "Ai lay west of Bethel and not far from it; Bethel was still a village by the Neapolis road at the twelfth milestone from Jerusalem, but of Ai, a deserted place, only ruins were shown."
      ru: "Гай лежал к западу от Вефиля, недалеко от него; Вефиль всё ещё был селением у дороги на Неаполь, у двенадцатой мили от Иерусалима, а от Гая, места пустынного, показывали только развалины."
  - place: a7e13e1
    author: { en: "Josephus", ru: "Иосиф Флавий" }
    work: { en: "Jewish Antiquities", ru: "Иудейские древности" }
