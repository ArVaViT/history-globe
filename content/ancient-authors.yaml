      ru: "В 68 г. беглецы из Гадары, преследуемые конницей Плакида, сбежались в селение Бефеннаврис, вооружили его юношей и напали на римлян, но были окружены и перебиты."

  # ---------- Beth-peor ----------
  - place: af3ce34
    author: { en: "Eusebius", ru: "Евсевий" }
    work: { en: "Onomasticon (Wolf's numbering)", ru: "Ономастикон (нумерация Вульфа)" }
