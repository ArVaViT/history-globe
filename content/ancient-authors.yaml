      ru: "На Мелите, с одноимённым городом, где Веррес три года заказывал ткать женские одежды, на мысу стоял древний храм Юноны, столь почитаемый, что его не трогали ни флоты Пунических войн, ни пираты."
  - place: a57835d
    author: { en: "Strabo", ru: "Страбон" }
    work: { en: "Geography", ru: "География" }
