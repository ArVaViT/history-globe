    url: "https://www.tertullian.org/fathers/eusebius_onomasticon_02_trans.htm#A_NUMBERS_AND_DEUTERONOMY"
    note:
      en: "Azmon is a city in the desert south of Judaea that marks the border of Judah between Egypt and the sea; Eusebius notes that it is not the camp of Israel with a like name."
      ru: "Ацмон — город в пустыне к югу от Иудеи, отмечающий границу колена Иудина между Египтом и морем; Евсевий отмечает, что это не стан Израиля со сходным именем."

  # ---------- Baal-meon ----------
  - place: a76f7b7
    author: { en: "Eusebius", ru: "Евсевий" }
    work: { en: "Onomasticon (Wolf's numbering)", ru: "Ономастикон (нумерация Вульфа)" }
