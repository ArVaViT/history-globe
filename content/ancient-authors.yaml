      ru: "Верхняя и Нижняя Галилея, окружённые чужими народами, всегда умели постоять за себя: мужчины с детства привычны к войне, тучная земля возделана до последнего клочка, а города и селения так многолюдны, что в меньшем больше 15 000 жителей."
