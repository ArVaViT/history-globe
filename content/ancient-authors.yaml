      ru: "В 333 году паломник пришёл в Неаполь под горой Гаризим, где, по словам самарян, приносил жертву Авраам, и у подножия горы нашёл место Сихем с гробницей Иосифа на участке, который дал ему Иаков."

  # ---------- Shephelah ----------
  - place: af084cf
    author: { en: "Eusebius", ru: "Евсевий Кесарийский" }
