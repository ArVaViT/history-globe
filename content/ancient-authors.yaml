      en: "In AD 333 the pilgrim came to Terebinthus, where Abraham lived, dug a well under the terebinth and ate with the angels; Constantine had had a splendid basilica built there."
      ru: "В 333 г. паломник пришёл в Теревинф, где жил Авраам, выкопал колодец под теревинфом и ел с ангелами; Константин велел построить там великолепную базилику."

  # ---------- Mareshah ----------
  - place: a5cda86
