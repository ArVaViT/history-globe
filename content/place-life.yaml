  # Daniel 11's "king of the north" and "king of the south": the Seleucid and Ptolemaic
  # kingdoms, as the chapter is read. Named outside their years, they read as realms of
  # Ugarit's or Abraham's day.
  - id: a244929
    en: North
    from: "312 BC"
    until: "63 BC"
    note:
      en: "The kingdom of the north of Daniel 11, read as the Seleucid kingdom, from Seleucus I's return to Babylon to Pompey's annexation of Syria."
      ru: "Царство северного царя из Дан 11, понимаемое как держава Селевкидов: от возвращения Селевка I в Вавилон до присоединения Сирии Помпеем."
      uk: "Північне царство з Книги Даниїла 11, що розуміється як держава Селевкідів, від повернення Селевка I до Вавилона до приєднання Сирії Помпеєм."
      es: "El reino del norte de Daniel 11, entendido como el reino seléucida, desde el regreso de Seleuco I a Babilonia hasta la anexión de Siria por Pompeyo."
      pt: "O reino do norte de Daniel 11, entendido como o reino selêucida, desde o retorno de Seleuco I à Babilônia até a anexação da Síria por Pompeu."
      de: "Das Reich des Nordens aus Daniel 11, gedeutet als das Seleukidenreich, von der Rückkehr Seleukos' I. nach Babylon bis zu Pompeius' Annexion Syriens."
      fr: "Le royaume du nord de Daniel 11, lu comme le royaume séleucide, depuis le retour de Séleucos Ier à Babylone jusqu’à l’annexion de la Syrie par Pompée."
      pl: "Królestwo króla północy z Dn 11, rozumiane jako państwo Seleucydów, od powrotu Seleukosa I do Babilonu do aneksji Syrii przez Pompejusza."
      it: "Il regno del nord di Daniele 11, inteso come il regno seleucide, dal ritorno di Seleuco I a Babilonia all’annessione della Siria da parte di Pompeo."
      nl: "Het koninkrijk van het noorden uit Daniël 11, opgevat als het Seleucidische koninkrijk, van de terugkeer van Seleucus I naar Babylon tot de annexatie van Syrië door Pompeius."
      cs: "Severní království z Daniela 11, vykládané jako království seleukovské, od návratu Seleuka I. do Babylóna po Pompeiovo připojení Sýrie."
      sv: "Nordlandets rike i Daniel 11, tolkat som det seleukidiska riket, från Seleukos I:s återkomst till Babylon till Pompejus’ annektering av Syrien."
      nb: "Nordkongens rike i Daniel 11, forstått som seleukidenes rike, fra Seleukos I's retur til Babylon til Pompeius' innlemmelse av Syria."
      tl: "Ang kaharian sa hilaga ng Daniel 11, na binabasa bilang Kahariang Seleucida, mula sa pagbabalik ni Seleuco I sa Babilonia hanggang sa pagsasanib ni Pompeyo sa Siria."
      da: "Det nordlige rige i Daniel 11, forstået som det seleukidiske rige, fra Seleukos 1.s tilbagevenden til Babylon til Pompejus' annektering af Syrien."
      sr: "Северно царство из Данила 11, схваћено као селеукидско краљевство, од повратка Селеука I у Вавилон до Помпејевог припајања Сирије."
    sources:
      - "Dan 11:5-45"
      - "Babylonian Chronicle of the Diadochi (BM 36313); Appian, Syrian Wars 70"
  - id: a1c0469
