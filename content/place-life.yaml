      pl: "Miasto w Tel Miqne spłonęło podczas wyprawy Nabuchodonozora II na wybrzeże filistyńskie i nie zostało odbudowane jako miasto."
      it: "La città di Tel Miqne fu incendiata durante la campagna di Nabucodonosor II sulla costa filistea e non fu più ricostruita come città."
      nl: "De stad bij Tel Miqne werd verbrand tijdens de veldtocht van Nebukadnessar II langs de Filistijnse kust en werd niet meer als stad herbouwd."
      cs: "Město na Tel Miqne vyhořelo při tažení Nebukadnesara II. na pelištejské pobřeží a už nebylo jako město obnoveno."
      sv: "Staden vid Tel Miqne brändes under Nebukadnessar II:s fälttåg mot filistéernas kust och byggdes inte upp igen som stad."
      nb: "Byen ved Tel Miqne brant under Nebukadnesar II's felttog mot filisterkysten og ble ikke gjenoppbygd som by."
      tl: "Ang lungsod sa Tel Miqne ay nasunog sa kampanya ni Nabucodonosor II sa baybayin ng mga Filisteo at hindi na muling itinayo bilang lungsod."
      da: "Byen ved Tel Miqne brændte under Nebukadnezar 2.s felttog på den filistæiske kyst og blev ikke genopbygget som by."
      sr: "Град на Тел Микнеу изгорео је у походу Навуходоносора II на филистејску обалу и није поново подигнут као град."
    sources:
      - "Tel Miqne-Ekron excavations, S. Gitin and T. Dothan (NEAEHL, 'Tel Miqne-Ekron')"
  - id: a6f437a
    en: Corinth
    gap:
      from: "146 BC"
      until: "45 BC"
    note:
      en: "Sacked by Lucius Mummius in 146 BC and left desolate until Julius Caesar founded a Roman colony there in 44 BC."
      ru: "Разграблен Луцием Муммием в 146 г. до н. э. и лежал в запустении, пока Юлий Цезарь не основал там римскую колонию в 44 г. до н. э."
      uk: "Зруйнований Луцієм Муммієм у 146 р. до н. е. й залишався безлюдним, доки Юлій Цезар не заснував там римську колонію в 44 р. до н. е."
      es: "Saqueada por Lucio Mumio en 146 a. C. y dejada desolada hasta que Julio César fundó allí una colonia romana en 44 a. C."
      pt: "Saqueada por Lúcio Múmio em 146 a.C. e deixada desolada até que Júlio César fundou ali uma colônia romana em 44 a.C."
      de: "146 v. Chr. von Lucius Mummius geplündert und verwüstet liegen gelassen, bis Julius Caesar dort 44 v. Chr. eine römische Kolonie gründete."
      fr: "Pillée par Lucius Mummius en 146 av. J.-C. et laissée désolée jusqu’à ce que Jules César y fonde une colonie romaine en 44 av. J.-C."
      pl: "Złupiony przez Lucjusza Mummiusza w 146 p.n.e. i pozostawał spustoszony, aż Juliusz Cezar założył tu w 44 p.n.e. kolonię rzymską."
      it: "Saccheggiata da Lucio Mummio nel 146 a.C. e lasciata desolata finché Giulio Cesare vi fondò una colonia romana nel 44 a.C."
      nl: "Geplunderd door Lucius Mummius in 146 v.Chr. en verlaten lag tot Julius Caesar er in 44 v.Chr. een Romeinse kolonie stichtte."
      cs: "Vypleněn Luciem Mummiem roku 146 př. n. l. a ponechán pustý, dokud tam roku 44 př. n. l. Julius Caesar nezaložil římskou kolonii."
      sv: "Plundrades av Lucius Mummius 146 f.Kr. och låg öde tills Julius Caesar grundade en romersk koloni där 44 f.Kr."
      nb: "Plyndret av Lucius Mummius i 146 f.Kr. og lå øde til Julius Cæsar grunnla en romersk koloni der i 44 f.Kr."
      tl: "Sinamsam ni Lucio Mummio noong 146 BK at naiwang tiwangwang hanggang sa magtatag doon si Julio Cesar ng kolonyang Romano noong 44 BK."
      da: "Plyndret af Lucius Mummius i 146 f.Kr. og lå øde, indtil Julius Cæsar grundlagde en romersk koloni der i 44 f.Kr."
      sr: "Опљачкао га је Лукије Мумије 146. п. н. е., и остао је пуст док ту Јулије Цезар није 44. п. н. е. основао римску колонију."
    sources:
      - "Pausanias, Description of Greece 2.1.2"
      - "Strabo, Geography 8.6.23"
  - id: a49e1d0
    en: Philippi
