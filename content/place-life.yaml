      es: "Fundada por Antígono como Antigonia y rebautizada Alejandría Troas por Lisímaco."
      pt: "Fundada por Antígono como Antigônia e rebatizada Alexandria Trôade por Lisímaco."
      de: "Von Antigonos als Antigoneia gegründet und von Lysimachos in Alexandria Troas umbenannt."
      fr: "Fondée par Antigone sous le nom d’Antigoneia et rebaptisée Alexandria Troas par Lysimaque."
      pl: "Założona przez Antygona jako Antigonia i przemianowana na Aleksandrię Troas przez Lizymacha."
      it: "Fondata da Antigono con il nome di Antigonia e ribattezzata Alessandria Troade da Lisimaco."
      nl: "Gesticht door Antigonus als Antigonia en door Lysimachus herdoopt tot Alexandria Troas."
      cs: "Založena Antigonem jako Antigonie a Lysimachem přejmenována na Alexandreiu Troas."
      sv: "Grundades av Antigonos som Antigonia och döptes om till Alexandria Troas av Lysimachos."
      nb: "Grunnlagt av Antigonos som Antigonia og omdøpt til Aleksandria Troas av Lysimakhos."
      tl: "Itinatag ni Antigono bilang Antigonia at pinalitan ng pangalang Alejandria Troas ni Lisimaco."
      da: "Grundlagt af Antigonos som Antigonia og omdøbt til Alexandria Troas af Lysimachos."
      sr: "Основао га је Антигон као Антигонију, а Лизимах га је преименовао у Александрију Троаду."
    sources:
      - "Strabo, Geography 13.1.26"
  - id: ae1f807
    en: Calah
    until: "c. 612 BC"
    note:
      en: "Kalhu (Nimrud), long a royal city of Assyria, was sacked by the Medes and Babylonians in the fall of the empire (614–612 BC); only a village later stood on the ruins."
      ru: "Калах (Нимруд), долгое время царский город Ассирии, был разграблен мидянами и вавилонянами при падении царства (614–612 гг. до н. э.); позже на развалинах стояло лишь селение."
      uk: "Калху (Німруд), довго царське місто Ассирії, було зруйноване мідянами й вавилонянами під час падіння імперії (614–612 рр. до н. е.); пізніше на руїнах стояло лише село."
      es: "Cala (Nimrud), durante mucho tiempo ciudad real de Asiria, fue saqueada por los medos y los babilonios en la caída del imperio (614–612 a. C.); después solo hubo una aldea sobre las ruinas."
      pt: "Kalhu (Nimrud), por muito tempo cidade real da Assíria, foi saqueada pelos medos e babilônios na queda do império (614–612 a.C.); depois, apenas uma aldeia se ergueu sobre as ruínas."
      de: "Kalhu (Nimrud), lange eine Königsstadt Assyriens, wurde beim Untergang des Reiches (614–612 v. Chr.) von Medern und Babyloniern geplündert; später stand nur noch ein Dorf auf den Ruinen."
      fr: "Kalhu (Nimroud), longtemps ville royale d’Assyrie, fut pillée par les Mèdes et les Babyloniens lors de la chute de l’empire (614-612 av. J.-C.) ; seul un village s’éleva ensuite sur les ruines."
      pl: "Kalchu (Nimrud), od dawna królewskie miasto Asyrii, zostało złupione przez Medów i Babilończyków podczas upadku imperium (614–612 p.n.e.); później na ruinach stała już tylko wieś."
      it: "Kalhu (Nimrud), per lungo tempo città reale dell’Assiria, fu saccheggiata dai Medi e dai Babilonesi nella caduta dell’impero (614–612 a.C.); sulle rovine sorse poi soltanto un villaggio."
      nl: "Kalhu (Nimrud), lang een koninklijke stad van Assyrië, werd bij de val van het rijk (614–612 v.Chr.) geplunderd door de Meden en Babyloniërs; later stond er nog slechts een dorp op de ruïnes."
      cs: "Kalach (Nimrúd), dlouho královské město Asýrie, byl vypleněn Médy a Babylóňany při pádu říše (614–612 př. n. l.); na zříceninách později stála jen vesnice."
      sv: "Kalhu (Nimrud), länge en kunglig stad i Assyrien, plundrades av mederna och babylonierna vid rikets fall (614–612 f.Kr.); därefter stod bara en by på ruinerna."
      nb: "Kalhu (Nimrud), lenge en kongeby i Assyria, ble plyndret av mederne og babylonerne da riket falt (614–612 f.Kr.); senere sto bare en landsby på ruinene."
      tl: "Ang Kalhu (Nimrud), na matagal na lungsod-hari ng Asiria, ay sinamsam ng mga Medo at mga Babilonio sa pagbagsak ng imperyo (614–612 BK); isang nayon na lamang ang kalaunang nakatayo sa mga guho."
      da: "Kalhu (Nimrud), længe en kongeby i Assyrien, blev plyndret af mederne og babylonierne ved rigets fald (614–612 f.Kr.); senere stod kun en landsby på ruinerne."
      sr: "Калху (Нимруд), дуго царски град Асирије, опљачкали су Миђани и Вавилонци при паду царства (614–612. п. н. е.); касније је на рушевинама стајало само село."
    sources:
      - "D. Oates and J. Oates, Nimrud: An Assyrian Imperial City Revealed (2001)"
      - "Xenophon, Anabasis 3.4.7 (the deserted city of Larisa)"
  - id: adf74d4
    en: Shechem
    until: "c. 107 BC"
    note:
      en: "The city at Tell Balata was destroyed by John Hyrcanus and never rebuilt; Flavia Neapolis was founded 2 km to the west in AD 72."
      ru: "Город на Телль-Балате разрушен Иоанном Гирканом и больше не отстраивался; в 72 г. н. э. в 2 км к западу основан город Флавия Неаполис."
      uk: "Місто на Тель-Балаті було зруйноване Іоанном Гірканом і ніколи не відбудоване; Флавію Неаполіс засновано за 2 км на захід у 72 р. н. е."
      es: "La ciudad de Tell Balata fue destruida por Juan Hircano y nunca se reconstruyó; Flavia Neápolis fue fundada 2 km al oeste en el 72 d. C."
      pt: "A cidade em Tell Balata foi destruída por João Hircano e nunca reconstruída; Flávia Neápolis foi fundada 2 km a oeste em 72 d.C."
      de: "Die Stadt auf dem Tell Balata wurde von Johannes Hyrkanos zerstört und nie wieder aufgebaut; Flavia Neapolis wurde 72 n. Chr. 2 km weiter westlich gegründet."
      fr: "La ville de Tell Balata fut détruite par Jean Hyrcan et jamais rebâtie ; Flavia Neapolis fut fondée à 2 km à l’ouest en 72 ap. J.-C."
      pl: "Miasto w Tell Balata zostało zniszczone przez Jana Hirkana i nigdy nie odbudowane; Flavia Neapolis założono 2 km na zachód w 72 n.e."
      it: "La città di Tell Balata fu distrutta da Giovanni Ircano e non fu mai ricostruita; Flavia Neapolis fu fondata 2 km a ovest nel 72 d.C."
      nl: "De stad bij Tell Balata werd verwoest door Johannes Hyrcanus en nooit herbouwd; Flavia Neapolis werd in 72 n.Chr. twee km naar het westen gesticht."
      cs: "Město na Tell Balátě bylo zničeno Janem Hyrkanem a nikdy nebylo obnoveno; Flavia Neapolis byla založena 2 km na západ roku 72 n. l."
      sv: "Staden vid Tell Balata förstördes av Johannes Hyrkanos och byggdes aldrig upp igen; Flavia Neapolis grundades 2 km västerut år 72 e.Kr."
      nb: "Byen ved Tell Balata ble ødelagt av Johannes Hyrkanos og aldri gjenoppbygd; Flavia Neapolis ble grunnlagt to kilometer mot vest i 72 e.Kr."
      tl: "Ang lungsod sa Tell Balata ay winasak ni Juan Hyrcano at hindi na muling itinayo; ang Flavia Neapolis ay itinatag 2 km sa kanluran noong 72 AD."
      da: "Byen ved Tell Balata blev ødelagt af Johannes Hyrkanos og aldrig genopbygget; Flavia Neapolis blev grundlagt 2 km mod vest i 72 e.Kr."
      sr: "Град на Тел Балати разорио је Јован Хиркан и никада није обновљен; Флавија Неаполис основана је 2 км западно 72. н. е."
    sources:
      - "Josephus, Antiquities 13.255-256; Jewish War 1.63"
      - "Shechem excavations of G. E. Wright and E. F. Campbell (NEAEHL, 'Shechem')"
  - id: a5cda86
    en: Mareshah
    until: "40 BC"
    note:
      en: "Destroyed by the Parthians in 40 BC during the war between Antigonus and Herod; the tell was never resettled."
      ru: "Разрушена парфянами в 40 г. до н. э. во время войны Антигона с Иродом; на холме больше не селились."
      uk: "Зруйноване парфянами в 40 р. до н. е. під час війни між Антігоном та Іродом; тель ніколи не заселяли знову."
      es: "Destruida por los partos en 40 a. C. durante la guerra entre Antígono y Herodes; el tell nunca volvió a poblarse."
      pt: "Destruída pelos partas em 40 a.C. durante a guerra entre Antígono e Herodes; o tell nunca foi repovoado."
      de: "40 v. Chr. im Krieg zwischen Antigonos und Herodes von den Parthern zerstört; der Tell wurde nie wieder besiedelt."
      fr: "Détruite par les Parthes en 40 av. J.-C. pendant la guerre entre Antigone et Hérode ; le tell ne fut jamais réoccupé."
      pl: "Zniszczona przez Partów w 40 p.n.e. podczas wojny między Antygonem a Herodem; tell nigdy nie został ponownie zasiedlony."
      it: "Distrutta dai Parti nel 40 a.C. durante la guerra fra Antigono ed Erode; il tell non fu più abitato."
      nl: "Verwoest door de Parthen in 40 v.Chr. tijdens de oorlog tussen Antigonus en Herodes; de tel werd nooit meer bewoond."
      cs: "Zničena Parthy roku 40 př. n. l. za války mezi Antigonem a Herodem; tell nebyl nikdy znovu osídlen."
      sv: "Förstördes av parterna 40 f.Kr. under kriget mellan Antigonos och Herodes; tellen bosattes aldrig mer."
      nb: "Ødelagt av partherne i 40 f.Kr. under krigen mellom Antigonos og Herodes; tellen ble aldri bosatt på nytt."
      tl: "Winasak ng mga Parto noong 40 BK sa digmaan nina Antigono at Herodes; hindi na muling pinamayanan ang tell."
      da: "Ødelagt af parterne i 40 f.Kr. under krigen mellem Antigonos og Herodes; tellen blev aldrig bosat igen."
      sr: "Разорили су га Парти 40. п. н. е. у рату између Антигона и Ирода; тел никада није поново насељен."
    sources:
      - "Josephus, Antiquities 14.364; Jewish War 1.269"
      - "A. Kloner, Maresha Excavations Final Report I (IAA Reports 17, 2003)"
  - id: ab7bf48
    en: Caesarea Philippi
    from: "c. 3 BC"
    note:
      en: "Founded by Philip the Tetrarch at the sanctuary of Pan (Panias) as his capital and named after Caesar."
      ru: "Основана четвертовластником Филиппом у святилища Пана (Паниады), стала его столицей и названа в честь кесаря."
      uk: "Заснована Пилипом Тетрархом при святилищі Пана (Паніас) як його столиця й названа на честь Цезаря."
      es: "Fundada por Filipo el Tetrarca en el santuario de Pan (Panias) como su capital y llamada así por el César."
      pt: "Fundada por Filipe, o Tetrarca, no santuário de Pã (Pânias) como sua capital e nomeada em honra de César."
      de: "Von Philippus dem Tetrarchen am Heiligtum des Pan (Paneas) als seine Hauptstadt gegründet und nach Caesar benannt."
      fr: "Fondée par Philippe le tétrarque au sanctuaire de Pan (Panias) comme sa capitale et nommée d’après César."
      pl: "Założona przez tetrarchę Filipa przy sanktuarium Pana (Panias) jako jego stolica i nazwana na cześć Cezara."
      it: "Fondata da Filippo il Tetrarca presso il santuario di Pan (Panias) come sua capitale e chiamata col nome di Cesare."
      nl: "Gesticht door Filippus de Tetrarch bij het heiligdom van Pan (Panias) als zijn hoofdstad en genoemd naar Caesar."
      cs: "Založena Filipem Tetrarchou u svatyně Pana (Panias) jako jeho hlavní město a pojmenována po Caesarovi."
      sv: "Grundades av Filip tetrarken vid Pans helgedom (Panias) som hans huvudstad och uppkallades efter Caesar."
      nb: "Grunnlagt av Filip tetrarken ved Pans helligdom (Panias) som hans hovedstad og oppkalt etter Cæsar."
      tl: "Itinatag ni Felipe na Tetrarka sa santuwaryo ni Pan (Panias) bilang kaniyang kabisera at pinangalanan kay Cesar."
      da: "Grundlagt af tetrarken Filip ved Pans helligdom (Panias) som hans hovedstad og opkaldt efter Cæsar."
      sr: "Основао га је Филип тетрарх код светилишта Пана (Паније) као своју престоницу и назвао по Цезару."
    sources:
      - "Josephus, Antiquities 18.28; Jewish War 2.168"
      - "Banias excavations of V. Tzaferis (NEAEHL, 'Banias')"
  - id: af43cde
    en: Nicopolis
    from: "c. 30 BC"
    note:
      en: "Founded by Octavian (Augustus) in Epirus beside the battlefield of Actium, as the City of Victory."
      ru: "Основан Октавианом (Августом) в Эпире близ места битвы при Акциуме как «Город Победы»."
      uk: "Заснована Октавіаном (Августом) в Епірі поряд із полем битви під Акціумом як Місто Перемоги."
      es: "Fundada por Octavio (Augusto) en el Epiro, junto al campo de batalla de Accio, como la Ciudad de la Victoria."
      pt: "Fundada por Otaviano (Augusto) no Épiro, junto ao campo de batalha de Áccio, como a Cidade da Vitória."
      de: "Von Oktavian (Augustus) in Epirus neben dem Schlachtfeld von Aktium als „Stadt des Sieges“ gegründet."
      fr: "Fondée par Octavien (Auguste) en Épire, près du champ de bataille d’Actium, comme la Cité de la Victoire."
      pl: "Założona przez Oktawiana (Augusta) w Epirze obok pola bitwy pod Akcjum jako Miasto Zwycięstwa."
      it: "Fondata da Ottaviano (Augusto) in Epiro, accanto al campo di battaglia di Azio, come Città della Vittoria."
      nl: "Gesticht door Octavianus (Augustus) in Epirus naast het slagveld van Actium, als Stad van de Overwinning."
      cs: "Založena Octavianem (Augustem) v Epiru vedle bojiště u Actia jako Město vítězství."
      sv: "Grundades av Oktavianus (Augustus) i Epirus intill slagfältet vid Aktion, som Segerstaden."
      nb: "Grunnlagt av Octavian (Augustus) i Epirus ved siden av slagmarken ved Aktion, som Seierens by."
      tl: "Itinatag ni Octavio (Augusto) sa Epiro sa tabi ng larangan ng Actium, bilang Lungsod ng Tagumpay."
      da: "Grundlagt af Octavian (Augustus) i Epirus ved siden af slagmarken ved Actium som Sejrens By."
      sr: "Основао га је Октавијан (Август) у Епиру поред бојног поља код Акцијума, као Град победе."
    sources:
      - "Cassius Dio, Roman History 51.1.3"
      - "Strabo, Geography 7.7.6"
  - id: a314765
    en: Paphos
    from: "c. 320 BC"
    note:
      en: "New Paphos, the harbour city of Acts, was founded by Nicocles, the last king of Old Paphos, in the late 4th century BC."
      ru: "Новый Паф, приморский город из книги Деяний, основан Никоклом, последним царём Старого Пафа, в конце IV в. до н. э."
      uk: "Нова Пафос, портове місто Діянь, заснована Нікоклом, останнім царем Старої Пафос, наприкінці IV ст. до н. е."
      es: "Nea Pafos, la ciudad portuaria de Hechos, fue fundada por Nicocles, el último rey de Pafos Vieja, a finales del siglo IV a. C."
      pt: "Nova Pafos, a cidade portuária do livro de Atos, foi fundada por Nicocles, o último rei de Velha Pafos, no final do século IV a.C."
      de: "Neu-Paphos, die Hafenstadt der Apostelgeschichte, wurde im späten 4. Jahrhundert v. Chr. von Nikokles, dem letzten König von Alt-Paphos, gegründet."
      fr: "Néa Paphos, la ville portuaire des Actes, fut fondée par Nicoclès, dernier roi de Paléo-Paphos, à la fin du IVe siècle av. J.-C."
      pl: "Nowy Pafos, miasto portowe z Dziejów Apostolskich, został założony przez Nikoklesa, ostatniego króla Starego Pafos, pod koniec IV w. p.n.e."
      it: "Nea Pafo, la città portuale degli Atti, fu fondata da Nicocle, ultimo re di Paleo Pafo, alla fine del IV secolo a.C."
      nl: "Nieuw-Paffos, de havenstad uit Handelingen, werd aan het eind van de 4e eeuw v.Chr. gesticht door Nicocles, de laatste koning van Oud-Paffos."
      cs: "Nový Pafos, přístavní město z Knihy Skutků, založil koncem 4. století př. n. l. Nikoklés, poslední král Starého Pafu."
      sv: "Nya Pafos, hamnstaden i Apostlagärningarna, grundades av Nikokles, den siste kungen av Gamla Pafos, i slutet av 300-talet f.Kr."
      nb: "Ny-Pafos, havnebyen i Apostlenes gjerninger, ble grunnlagt av Nikokles, den siste kongen i Gamle Pafos, i slutten av 300-tallet f.Kr."
      tl: "Ang Bagong Pafos, ang lungsod-daungan ng Mga Gawa, ay itinatag ni Nicocles, ang huling hari ng Lumang Pafos, sa huling bahagi ng ika-4 na siglo BK."
      da: "Nea Pafos, havnebyen i Apostlenes Gerninger, blev grundlagt af Nikokles, Gamle Pafos' sidste konge, sent i 4. århundrede f.Kr."
      sr: "Нови Пафос, лучки град из Дела, основао је Никокло, последњи цар Старог Пафоса, крајем 4. века п. н. е."
    sources:
      - "J. Młynarczyk, Nea Paphos III: Nea Paphos in the Hellenistic Period (1990)"
      - "Nea Paphos, Temple of Artemis Agrotera dedication of Nicocles"
  - id: a55027d
    en: Miletus
    gap:
      from: "494 BC"
      until: "c. 480 BC"
    note:
      en: "Taken by the Persians after the battle of Lade in 494 BC: the men were killed, the women and children enslaved, the city emptied; it was rebuilt on a new plan after the Greek victory at Mycale in 479 BC."
      ru: "Взят персами после битвы при Ладе в 494 г. до н. э.: мужчины перебиты, женщины и дети уведены в рабство, город опустел; отстроен по новому плану после победы греков при Микале в 479 г. до н. э."
      uk: "Здобутий персами після битви при Ладе в 494 р. до н. е.: чоловіків убито, жінок і дітей обернено на рабів, місто спорожніло; відбудований за новим планом після перемоги греків при Мікале в 479 р. до н. е."
      es: "Tomada por los persas tras la batalla de Lade en 494 a. C.: los hombres fueron muertos, las mujeres y los niños esclavizados, la ciudad vaciada; fue reconstruida con un nuevo plano tras la victoria griega en Mícale en 479 a. C."
      pt: "Tomada pelos persas depois da batalha de Lade em 494 a.C.: os homens foram mortos, as mulheres e crianças escravizadas, a cidade esvaziada; foi reconstruída segundo um novo plano após a vitória grega em Micale, em 479 a.C."
      de: "Nach der Schlacht von Lade 494 v. Chr. von den Persern genommen: Die Männer wurden getötet, Frauen und Kinder versklavt, die Stadt entvölkert; nach dem griechischen Sieg bei Mykale 479 v. Chr. wurde sie nach einem neuen Plan wiederaufgebaut."
      fr: "Prise par les Perses après la bataille de Ladé en 494 av. J.-C. : les hommes furent tués, les femmes et les enfants réduits en esclavage, la ville vidée ; elle fut rebâtie sur un plan nouveau après la victoire grecque de Mycale en 479 av. J.-C."
      pl: "Zdobyty przez Persów po bitwie pod Lade w 494 p.n.e.: mężczyzn wymordowano, kobiety i dzieci zniewolono, a miasto opustoszało; odbudowany według nowego planu po greckim zwycięstwie pod Mykale w 479 p.n.e."
      it: "Presa dai Persiani dopo la battaglia di Lade nel 494 a.C.: gli uomini furono uccisi, le donne e i bambini ridotti in schiavitù, la città svuotata; fu ricostruita secondo un nuovo piano dopo la vittoria greca a Micale nel 479 a.C."
      nl: "Ingenomen door de Perzen na de slag bij Lade in 494 v.Chr.: de mannen werden gedood, de vrouwen en kinderen tot slaaf gemaakt, de stad leeggemaakt; ze werd herbouwd volgens een nieuw plan na de Griekse overwinning bij Mykale in 479 v.Chr."
      cs: "Dobyt Peršany po bitvě u Lade roku 494 př. n. l.: muži byli pobiti, ženy a děti zotročeny, město vyprázdněno; po řeckém vítězství u Mykalé roku 479 př. n. l. bylo znovu vystavěno podle nového plánu."
      sv: "Intogs av perserna efter slaget vid Lade 494 f.Kr.: männen dödades, kvinnorna och barnen förslavades, staden tömdes; den byggdes upp på nytt efter en ny plan efter den grekiska segern vid Mykale 479 f.Kr."
      nb: "Inntatt av perserne etter slaget ved Lade i 494 f.Kr.: mennene ble drept, kvinnene og barna gjort til slaver, byen tømt; den ble gjenoppbygd etter en ny plan etter den greske seieren ved Mykale i 479 f.Kr."
      tl: "Nakuha ng mga Persiano pagkatapos ng labanan sa Lade noong 494 BK: pinatay ang mga lalaki, inalipin ang mga babae at mga bata, at ginawang tiwangwang ang lungsod; muli itong itinayo ayon sa bagong plano pagkatapos ng tagumpay ng mga Griyego sa Mycale noong 479 BK."
      da: "Indtaget af perserne efter slaget ved Lade i 494 f.Kr.: mændene blev dræbt, kvinderne og børnene gjort til slaver, byen tømt; den blev genopbygget efter en ny plan efter den græske sejr ved Mykale i 479 f.Kr."
      sr: "Персијанци су га освојили после битке код Ладе 494. п. н. е.: људи су побијени, жене и деца поробљени, град испражњен; поново је подигнут по новом плану после грчке победе код Микале 479. п. н. е."
    sources:
      - "Herodotus 6.18-22; 9.104"
      - "Miletus excavations (German Archaeological Institute), Hippodamian plan after 479 BC"
  - id: a2e65fb
    en: Smyrna
    from: "c. 300 BC"
    older: true
    note:
      en: "The Smyrna of Revelation was built anew on the slopes of Mount Pagos about 300 BC, begun by Antigonus and finished by Lysimachus; the older city had stood across the bay at Bayrakli."
      ru: "Смирна из Откровения была заново построена на склонах горы Пагос около 300 г. до н. э.: начал Антигон, закончил Лисимах; прежний город стоял на другой стороне залива, у Байраклы."
      uk: "Смирну Одкровення побудували заново на схилах гори Пагос близько 300 р. до н. е., почав Антігон, а завершив Лісімах; старіше місто стояло навпроти, через затоку, в Байраклі."
      es: "La Esmirna del Apocalipsis fue edificada de nuevo en las laderas del Monte Pagos hacia 300 a. C., iniciada por Antígono y terminada por Lisímaco; la ciudad más antigua se alzaba al otro lado de la bahía, en Bayrakli."
      pt: "A Esmirna do Apocalipse foi construída de novo nas encostas do monte Pagos por volta de 300 a.C., iniciada por Antígono e concluída por Lisímaco; a cidade mais antiga ficava do outro lado da baía, em Bayrakli."
      de: "Das Smyrna der Offenbarung wurde um 300 v. Chr. an den Hängen des Berges Pagos neu gebaut, von Antigonos begonnen und von Lysimachos vollendet; die ältere Stadt hatte jenseits der Bucht bei Bayrakli gelegen."
      fr: "La Smyrne de l’Apocalypse fut rebâtie sur les pentes du mont Pagos vers 300 av. J.-C., commencée par Antigone et achevée par Lysimaque ; l’ancienne ville se trouvait de l’autre côté du golfe, à Bayraklı."
      pl: "Smyrnę z Apokalipsy zbudowano od nowa na stokach góry Pagos około 300 p.n.e.; rozpoczął ją Antygon, a ukończył Lizymach; starsze miasto stało po drugiej stronie zatoki, w Bayrakli."
      it: "La Smirne dell’Apocalisse fu costruita di nuovo sulle pendici del monte Pago intorno al 300 a.C., iniziata da Antigono e terminata da Lisimaco; la città più antica sorgeva di fronte, dall’altra parte del golfo, a Bayrakli."
      nl: "Het Smyrna van Openbaring werd omstreeks 300 v.Chr. opnieuw gebouwd op de hellingen van de berg Pagos, begonnen door Antigonus en voltooid door Lysimachus; de oudere stad had aan de overkant van de baai gelegen, bij Bayrakli."
      cs: "Smyrna z Knihy Zjevení byla znovu vystavěna na svazích hory Pagos kolem roku 300 př. n. l., započal ji Antigonos a dokončil Lysimachos; starší město stálo naproti přes záliv v Bayraklı."
      sv: "Smyrna i Uppenbarelseboken byggdes på nytt på sluttningarna av berget Pagos omkring 300 f.Kr., påbörjad av Antigonos och fullbordad av Lysimachos; den äldre staden hade legat på andra sidan viken vid Bayrakli."
      nb: "Smyrna i Johannes' Åpenbaring ble bygd på nytt i skråningene av Pagos-fjellet omkring 300 f.Kr., påbegynt av Antigonos og fullført av Lysimakhos; den eldre byen hadde ligget på den andre siden av bukten ved Bayrakli."
      tl: "Ang Smirna ng Apocalipsis ay itinayo nang panibago sa mga dalisdis ng Bundok Pagos noong mga 300 BK, sinimulan ni Antigono at tinapos ni Lisimaco; ang mas matandang lungsod ay nakatayo sa kabila ng look sa Bayrakli."
      da: "Johannes' Åbenbarings Smyrna blev bygget påny på skråningerne af Pagos-bjerget omkring 300 f.Kr., påbegyndt af Antigonos og fuldført af Lysimachos; den ældre by havde ligget på den anden side af bugten ved Bayrakli."
      sr: "Смирна из Откривења поново је подигнута на падинама горе Пагос око 300. п. н. е., почео је Антигон, а довршио Лизимах; старији град стајао је преко залива код Бајракла."
    sources:
      - "Strabo, Geography 14.1.37"
      - "Pausanias, Description of Greece 7.5.1-3 (ascribes the refoundation to Alexander)"
      - "J. M. Cook, 'Old Smyrna, 1948-1951', Annual of the British School at Athens 53-54 (1958-59)"
  - id: a1e3697
    en: Syracuse
    from: "c. 733 BC"
    note:
      en: "Founded by Corinthian colonists under Archias on the island of Ortygia, after they drove out the Sicels living there; 733 BC is the traditional year."
      ru: "Основаны коринфскими колонистами во главе с Архием на острове Ортигия, откуда они прогнали живших там сикулов; 733 г. до н. э. — традиционный год."
      uk: "Заснована коринфськими колоністами під проводом Архія на острові Ортігія після того, як вони вигнали сікулів, що там жили; 733 р. до н. е. — традиційний рік."
      es: "Fundada por colonos corintios al mando de Arquias en la isla de Ortigia, tras expulsar a los sículos que vivían allí; 733 a. C. es el año tradicional."
      pt: "Fundada por colonos coríntios sob Arquias na ilha de Ortígia, depois de expulsarem os sículos que ali viviam; 733 a.C. é o ano tradicional."
      de: "Von korinthischen Kolonisten unter Archias auf der Insel Ortygia gegründet, nachdem sie die dort lebenden Sikeler vertrieben hatten; 733 v. Chr. ist das traditionelle Jahr."
      fr: "Fondée par des colons corinthiens sous Archias sur l’île d’Ortygie, après qu’ils eurent chassé les Sicules qui y vivaient ; 733 av. J.-C. est l’année traditionnelle."
      pl: "Założone przez kolonistów z Koryntu pod wodzą Archiasa na wyspie Ortygia, po wypędzeniu zamieszkujących ją Sykulów; tradycyjnym rokiem jest 733 p.n.e."
      it: "Fondata da coloni corinzi guidati da Archia sull’isola di Ortigia, dopo che ebbero scacciato i Siculi che vi abitavano; il 733 a.C. è l’anno tradizionale."
      nl: "Gesticht door Korinthische kolonisten onder Archias op het eiland Ortygia, nadat zij de Sikelen die daar woonden hadden verdreven; 733 v.Chr. is het traditionele jaar."
      cs: "Založeny korintskými kolonisty pod Archiem na ostrově Ortygii poté, co odtud vyhnali tamní Sikuly; tradičním rokem je 733 př. n. l."
      sv: "Grundades av korintiska kolonister under Archias på ön Ortygia, sedan de hade drivit ut sikulerna som bodde där; 733 f.Kr. är det traditionella året."
      nb: "Grunnlagt av korintiske kolonister under Arkhias på øya Ortygia, etter at de hadde drevet bort sikulerne som bodde der; 733 f.Kr. er det tradisjonelle året."
      tl: "Itinatag ng mga kolonistang Corinto sa ilalim ni Archias sa pulo ng Ortygia, pagkatapos nilang palayasin ang mga Sicel na naninirahan doon; ang 733 BK ang tradisyonal na taon."
      da: "Grundlagt af korintiske kolonister under Archias på øen Ortygia, efter at de havde fordrevet sikulerne, som boede der; 733 f.Kr. er det traditionelle årstal."
      sr: "Основали су га коринтски колонисти под Архијом на острву Ортигији, пошто су протерали Сикеле који су ту живели; 733. п. н. е. је традиционална година."
    sources:
      - "Thucydides 6.3.2"
      - "Eusebius, Chronicle (Jerome's version), Olympiad 11"
  - id: a81cdb5
    en: Cyrene
    from: "c. 631 BC"
    note:
      en: "Founded by settlers from Thera under Battus, who first camped on the island of Platea and at Aziris before moving to the spring of Apollo; the traditional year is 631 BC."
      ru: "Основана поселенцами с Феры во главе с Баттом, которые сперва жили на острове Платея и в Азирисе, а потом перешли к источнику Аполлона; традиционная дата — 631 г. до н. э."
      uk: "Заснована переселенцями з Фери під проводом Батта, які спершу стали табором на острові Платея та в Азірісі, а потім перебралися до джерела Аполлона; традиційний рік — 631 до н. е."
      es: "Fundada por colonos de Tera al mando de Bato, que acamparon primero en la isla de Platea y en Aziris antes de trasladarse a la fuente de Apolo; el año tradicional es 631 a. C."
      pt: "Fundada por colonos de Tera sob Bato, que primeiro acamparam na ilha de Plateia e em Aziris antes de se mudarem para a fonte de Apolo; o ano tradicional é 631 a.C."
      de: "Von Siedlern aus Thera unter Battos gegründet, die zuerst auf der Insel Platea und bei Aziris lagerten, ehe sie zur Quelle des Apollon zogen; das traditionelle Jahr ist 631 v. Chr."
      fr: "Fondée par des colons de Théra sous Battos, qui campèrent d’abord sur l’île de Platée et à Aziris avant de gagner la source d’Apollon ; l’année traditionnelle est 631 av. J.-C."
      pl: "Założona przez osadników z Thery pod wodzą Battosa, którzy najpierw obozowali na wyspie Platea i w Aziris, zanim przenieśli się do źródła Apolla; tradycyjnym rokiem jest 631 p.n.e."
      it: "Fondata da coloni di Tera guidati da Batto, che si accamparono prima sull’isola di Platea e ad Aziri prima di trasferirsi presso la sorgente di Apollo; l’anno tradizionale è il 631 a.C."
      nl: "Gesticht door kolonisten uit Thera onder Battus, die eerst op het eiland Platea en bij Aziris kampeerden voordat zij naar de bron van Apollo trokken; het traditionele jaar is 631 v.Chr."
      cs: "Založena osadníky z Théry pod Battem, kteří se nejprve utábořili na ostrově Platea a v Aziris, než se přesunuli k Apollónovu prameni; tradiční rok je 631 př. n. l."
      sv: "Grundades av nybyggare från Thera under Battos, som först slog läger på ön Platea och vid Aziris innan de flyttade till Apollons källa; det traditionella året är 631 f.Kr."
      nb: "Grunnlagt av nybyggere fra Thera under Battos, som først slo leir på øya Platea og ved Aziris før de flyttet til Apollon-kilden; det tradisjonelle året er 631 f.Kr."
      tl: "Itinatag ng mga naninirahang mula sa Thera sa ilalim ni Battus, na unang nagkampo sa pulo ng Platea at sa Aziris bago lumipat sa bukal ni Apolo; ang tradisyonal na taon ay 631 BK."
      da: "Grundlagt af bosættere fra Thera under Battos, som først slog lejr på øen Platea og ved Aziris, før de flyttede til Apollons kilde; det traditionelle årstal er 631 f.Kr."
      sr: "Основали су га досељеници са Тере под Батом, који су најпре логоровали на острву Платеји и у Азирису пре него што су се преселили к извору Аполоновом; традиционална година је 631. п. н. е."
    sources:
      - "Herodotus 4.150-159"
      - "Supplementum Epigraphicum Graecum 9.3 (the 'Oath of the Settlers' inscription from Cyrene)"
  - id: ac87d4c
    en: Ashkelon
    # Why firm: the start is dated to the month by the Babylonian Chronicle (Kislev of
    # Nebuchadnezzar's first year, 604 BC), and the Leon Levy Expedition found the burnt
    # destruction layer sealed by an abandonment. The end is narrow: the Persian-period
    # rebuilding is dated by its pottery to c. 520-510 BC, i.e. about 80 years of ruin.
    # This is not "destroyed and quickly rebuilt": the excavators speak of a deserted
    # mound for two to three generations. The prophecies of Jer 47, Zeph 2 and Amos 1
    # all fall before 604, so no tour stop should land inside the gap.
    gap:
      from: "604 BC"
      until: "c. 520 BC"
    until: "AD 1270"
    note:
      en: "Taken by Nebuchadnezzar in the month of Kislev 604 BC, plundered and turned into a heap of ruins; the mound lay deserted until a Phoenician town was built there under the Persians, about 520–510 BC. Demolished by Saladin in 1191 and refortified by the Crusaders, it was dismantled by the Mamluk sultan Baybars in 1270, its harbour blocked and its people moved inland to al-Majdal; the site has lain in ruins since."
      ru: "Взят Навуходоносором в месяце Кислеве 604 г. до н. э., разграблен и превращён в груду развалин; холм стоял пустым, пока при персах, около 520–510 гг. до н. э., на нём не построили финикийский город. Разрушенный Саладином в 1191 г. и вновь укреплённый крестоносцами, город в 1270 г. снёс мамлюкский султан Бейбарс: гавань засыпали, жителей перевели вглубь страны, в аль-Маджаль; с тех пор место лежит в руинах."
      uk: "Здобутий Навуходоносором у місяці кіслеві 604 р. до н. е., пограбований і перетворений на купу руїн; пагорб лежав безлюдним, доки за персів, близько 520–510 рр. до н. е., там не збудували фінікійське місто. Зруйнований Саладіном 1191 р. і знову укріплений хрестоносцями, він був розібраний мамлюцьким султаном Бейбарсом 1270 р., його гавань загачено, а жителів переселено вглиб країни до аль-Маджаля; відтоді місце лежить у руїнах."
      es: "Tomada por Nabucodonosor en el mes de Quisleu de 604 a. C., saqueada y convertida en un montón de ruinas; el montículo quedó desierto hasta que hacia 520–510 a. C., bajo los persas, se construyó allí una ciudad fenicia. Demolida por Saladino en 1191 y vuelta a fortificar por los cruzados, fue desmantelada por el sultán mameluco Baibars en 1270, su puerto bloqueado y sus habitantes trasladados tierra adentro, a al-Majdal; el lugar está en ruinas desde entonces."
      pt: "Tomada por Nabucodonosor no mês de Quisleu de 604 a.C., saqueada e reduzida a um monte de ruínas; o montículo ficou deserto até que uma cidade fenícia foi construída ali sob os persas, por volta de 520–510 a.C. Demolida por Saladino em 1191 e refortificada pelos cruzados, foi desmantelada pelo sultão mameluco Baybars em 1270, seu porto bloqueado e seu povo transferido para o interior, para al-Majdal; o sítio está em ruínas desde então."
      de: "Im Monat Kislew des Jahres 604 v. Chr. von Nebukadnezar eingenommen, geplündert und in einen Trümmerhaufen verwandelt; der Hügel lag verlassen, bis unter den Persern, um 520–510 v. Chr., dort eine phönizische Stadt gebaut wurde. 1191 von Saladin abgerissen und von den Kreuzfahrern neu befestigt, wurde sie 1270 vom Mamlukensultan Baibars abgetragen, ihr Hafen versperrt und ihre Bewohner ins Landesinnere nach al-Madschdal umgesiedelt; seither liegt der Ort in Trümmern."
      fr: "Prise par Nebucadnetsar au mois de Kislev 604 av. J.-C., pillée et réduite à un monceau de ruines ; le tertre resta désert jusqu’à ce qu’une ville phénicienne y soit bâtie sous les Perses, vers 520-510 av. J.-C. Démolie par Saladin en 1191 et refortifiée par les croisés, elle fut démantelée par le sultan mamelouk Baybars en 1270, son port comblé et ses habitants déplacés vers l’intérieur, à al-Majdal ; le site est en ruines depuis lors."
      pl: "Zdobyty przez Nabuchodonozora w miesiącu kislew 604 p.n.e., złupiony i zamieniony w stos ruin; kopiec leżał opuszczony, aż za Persów, około 520–510 p.n.e., zbudowano tu fenickie miasto. Zburzony przez Saladyna w 1191 roku i na nowo ufortyfikowany przez krzyżowców, został rozebrany przez mameluckiego sułtana Bajbarsa w 1270 roku, jego port zablokowano, a mieszkańców przeniesiono w głąb lądu do al-Madżdal; od tego czasu miejsce leży w ruinach."
      it: "Presa da Nabucodonosor nel mese di Kislev del 604 a.C., saccheggiata e ridotta a un cumulo di rovine; il tell rimase deserto finché sotto i Persiani, intorno al 520–510 a.C., vi fu costruita una città fenicia. Demolita da Saladino nel 1191 e rifortificata dai crociati, fu smantellata dal sultano mamelucco Baibars nel 1270, il suo porto fu ostruito e la sua popolazione trasferita nell’entroterra ad al-Majdal; da allora il sito giace in rovina."
      nl: "Ingenomen door Nebukadnessar in de maand Kislev van 604 v.Chr., geplunderd en tot een puinhoop gemaakt; de heuvel lag verlaten tot er onder de Perzen, omstreeks 520–510 v.Chr., een Fenicische stad werd gebouwd. In 1191 door Saladin gesloopt en door de kruisvaarders opnieuw versterkt, werd ze in 1270 door de Mamelukse sultan Baibars ontmanteld, haar haven werd geblokkeerd en haar bevolking verplaatst naar het landinwaartse al-Majdal; de plaats ligt sindsdien in puin."
      cs: "Dobyt Nebukadnesarem v měsíci kislevu roku 604 př. n. l., vyplundrován a proměněn v hromadu trosek; pahorek ležel opuštěný, dokud tam za Peršanů, kolem let 520–510 př. n. l., nevzniklo fénické město. Saladin jej roku 1191 zbořil a křižáci jej znovu opevnili; mamlúcký sultán Bajbars jej roku 1270 rozebral, zahradil jeho přístav a obyvatele přesídlil do vnitrozemí, do al-Madždalu; od té doby leží místo v troskách."
      sv: "Intogs av Nebukadnessar i månaden kislev 604 f.Kr., plundrades och förvandlades till en ruinhög; högen låg öde tills en fenicisk stad byggdes där under perserna, omkring 520–510 f.Kr. Saladin rev den 1191 och korsfararna befäste den på nytt; den mamlukiske sultanen Baybars raserade den 1270, spärrade dess hamn och flyttade dess folk inåt landet till al-Majdal; platsen har legat i ruiner sedan dess."
      nb: "Inntatt av Nebukadnesar i måneden kislev 604 f.Kr., plyndret og gjort til en ruinhaug; haugen lå øde til en fønikisk by ble bygd der under perserne, omkring 520–510 f.Kr. Revet ned av Saladin i 1191 og befestet på ny av korsfarerne, ble den demontert av mamelukksultanen Baybars i 1270, havnen ble stengt og folket flyttet innover i landet til al-Majdal; stedet har ligget i ruiner siden."
      tl: "Nakuha ni Nabucodonosor noong buwan ng Kislev 604 BK, sinamsam at ginawang bunton ng mga guho; nanatiling tiwangwang ang burol hanggang sa magtayo roon ng bayang Fenicio sa ilalim ng mga Persiano, noong mga 520–510 BK. Giniba ni Saladino noong 1191 at muling pinatibay ng mga Krusado, ibinuwag ito ng sultang Mamluk na si Baybars noong 1270, hinarangan ang daungan nito at inilipat ang mga tao nito sa loob ng lupain, sa al-Majdal; mula noon ay nanatili nang guho ang pook."
      da: "Indtaget af Nebukadnezar i måneden kislev 604 f.Kr., plyndret og gjort til en ruinhob; højen lå øde, indtil en fønikisk by blev bygget der under perserne, omkring 520–510 f.Kr. Nedrevet af Saladin i 1191 og genbefæstet af korsfarerne blev den afmonteret af mamelukkernes sultan Baibars i 1270, dens havn blokeret og dens folk flyttet ind i landet til al-Majdal; stedet har siden ligget i ruiner."
      sr: "Навуходоносор га је освојио у месецу кислеву 604. п. н. е., опљачкао и претворио у гомилу рушевина; брдо је лежало пусто док ту под Персијанцима, око 520–510. п. н. е., није подигнут феникијски град. Саладин га је срушио 1191, а крсташи су га поново утврдили; мамелучки султан Бајбарс га је 1270. разградио, затрпао му луку, а становнике преселио у унутрашњост у ал-Маџдал; место од тада лежи у рушевинама."
    sources:
      - "Babylonian Chronicle ABC 5 (Jerusalem Chronicle), obv. 15-20"
      - "L. E. Stager, D. M. Master and J. D. Schloen, Ashkelon 3: The Seventh Century B.C. (2011)"
      - "L. E. Stager, 'The Fury of Babylon: Ashkelon and the Archaeology of Destruction', Biblical Archaeology Review 22.1 (1996)"
      - "Abu'l-Fida, Taqwim al-buldan (1321), and Ibn Battuta (1355), in G. Le Strange, Palestine under the Moslems (1890), 'Askalan'"
      - "S. Vailhé, 'Ascalon', Catholic Encyclopedia 1 (1907)"
  - id: aa8edd2
    en: Gaza
    # Why firm: Josephus says Jannaeus took Gaza after a year's siege and "utterly
    # overthrew" it (Ant. 13.364; checked on CCEL, Whiston), and that under Gabinius
    # Gaza and the other cities "which had been desolate for a long time" were rebuilt
    # (Ant. 14.88; checked on Wikisource). The fall is usually put in 96 BC (Schürer;
    # Glucker 1987). This is the same Hasmonean-destruction / Pompey / Gabinius pattern
    # as Samaria, and the gap end follows the Samaria entry ("c. 64 BC", the year before
    # Pompey's settlement of 63 BC) so the two read alike. If you prefer the actual
    # rebuilding by Gabinius, use until "c. 58 BC" instead (Gabinius governed Syria
    # 57-55 BC). Caveat for the reviewer: Strabo 16.2.30 calls Gaza "deserted", and some
    # scholars place the Roman city on a new site; Glucker holds that it rose on the old
    # one, so the point is fine. Alexander's capture in 332 BC is NOT a gap: he settled
    # the city again at once (Arrian 2.27.7).
    gap:
      from: "c. 96 BC"
      until: "c. 64 BC"
    note:
      en: "Alexander Jannaeus took Gaza after a year's siege and overthrew it; Pompey freed it from Jewish rule in 63 BC, and Gabinius, governor of Syria, had the long desolate city rebuilt about 57 BC."
      ru: "Александр Яннай после годичной осады взял Газу и разрушил её; в 63 г. до н. э. Помпей освободил её от иудейской власти, а наместник Сирии Габиний около 57 г. до н. э. велел отстроить долго лежавший в запустении город."
      uk: "Александр Яннай здобув Газу після річної облоги й зруйнував її; Помпей звільнив її від юдейської влади в 63 р. до н. е., а Габіній, намісник Сирії, відбудував давно спустошене місто близько 57 р. до н. е."
      es: "Alejandro Janeo tomó Gaza tras un año de asedio y la derribó; Pompeyo la liberó del dominio judío en 63 a. C., y Gabinio, gobernador de Siria, hizo reconstruir hacia 57 a. C. la ciudad, desolada desde hacía mucho."
      pt: "Alexandre Janeu tomou Gaza depois de um cerco de um ano e a derrubou; Pompeu a libertou do domínio judeu em 63 a.C., e Gabínio, governador da Síria, mandou reconstruir a cidade, havia muito desolada, por volta de 57 a.C."
      de: "Alexander Jannäus nahm Gaza nach einjähriger Belagerung ein und stürzte es; Pompeius befreite es 63 v. Chr. von der jüdischen Herrschaft, und Gabinius, der Statthalter von Syrien, ließ die lange verödete Stadt um 57 v. Chr. wiederaufbauen."
      fr: "Alexandre Jannée prit Gaza après un siège d’un an et la renversa ; Pompée la libéra de la domination juive en 63 av. J.-C., et Gabinius, gouverneur de Syrie, fit rebâtir la ville longtemps désolée vers 57 av. J.-C."
      pl: "Aleksander Janneusz zdobył Gazę po rocznym oblężeniu i zburzył ją; Pompejusz uwolnił ją spod władzy żydowskiej w 63 p.n.e., a Gabiniusz, namiestnik Syrii, kazał odbudować od dawna spustoszone miasto około 57 p.n.e."
      it: "Alessandro Ianneo prese Gaza dopo un assedio di un anno e la distrusse; Pompeo la liberò dal dominio giudaico nel 63 a.C., e Gabinio, governatore della Siria, fece ricostruire intorno al 57 a.C. la città a lungo desolata."
      nl: "Alexander Jannaeus nam Gaza in na een beleg van een jaar en wierp de stad omver; Pompeius maakte haar in 63 v.Chr. vrij van Joodse heerschappij, en Gabinius, stadhouder van Syrië, liet de lang verwoeste stad omstreeks 57 v.Chr. herbouwen."
      cs: "Alexandr Jannaios dobyl Gazu po ročním obléhání a zničil ji; Pompeius ji roku 63 př. n. l. osvobodil od židovské vlády a Gabinius, správce Sýrie, nechal dlouho pustou Gazu kolem roku 57 př. n. l. obnovit."
      sv: "Alexander Jannaios intog Gaza efter ett års belägring och störtade staden; Pompejus befriade den från judiskt styre 63 f.Kr., och Gabinius, ståthållare i Syrien, lät bygga upp den länge öde staden omkring 57 f.Kr."
      nb: "Alexander Jannaios inntok Gasa etter ett års beleiring og la den øde; Pompeius frigjorde den fra jødisk herredømme i 63 f.Kr., og Gabinius, guvernør i Syria, lot den lenge øde byen gjenoppbygge omkring 57 f.Kr."
      tl: "Kinuha ni Alejandro Janeo ang Gaza pagkaraan ng isang taóng pagkubkob at ibinagsak ito; pinalaya ito ni Pompeyo mula sa pamamahala ng mga Judio noong 63 BK, at ipinaayos ni Gabinio, gobernador ng Siria, ang matagal nang tiwangwang na lungsod noong mga 57 BK."
      da: "Alexander Jannaios indtog Gaza efter et års belejring og ødelagde den; Pompejus frigjorde den fra jødisk herredømme i 63 f.Kr., og Gabinius, guvernør i Syrien, lod den længe øde by genopbygge omkring 57 f.Kr."
      sr: "Александар Јаној је освојио Газу после једногодишње опсаде и разорио је; Помпеј ју је 63. п. н. е. ослободио јеврејске власти, а Габиније, намесник Сирије, дао је да се дуго пуст град обнови око 57. п. н. е."
    sources:
      - "Josephus, Antiquities 13.358-364; 14.76; 14.88; Jewish War 1.87; 1.156; 1.166"
      - "C. A. M. Glucker, The City of Gaza in the Roman and Byzantine Periods (BAR International Series 325, 1987)"
