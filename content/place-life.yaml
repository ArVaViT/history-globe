  - id: ac2cef0
    en: Kadesh-barnea
    # Why firm: the point stands on Tell el-Qudeirat (Ain el-Qudeirat), the site of
    # R. Cohen's 1976-1982 excavations. Faust's review of the final report (AJA 113.2,
    # 2009, https://www.ajaonline.org/book-review/608): the last fortress "was destroyed in
    # the late seventh or early sixth century B.C.E., probably by the Babylonians", and
    # "later occupations were unearthed in a few places, and these were dated mainly,
    # though not solely, to the Persian period". Finkelstein, Tel Aviv 37 (2010), abstract
    # (https://cris.haifa.ac.il/en/publications/kadesh-barnea-a-reevaluation-of-its-archaeology-and-history/):
    # "the finds at the site cover the entire sequence of the Iron Age and later, up to
    # the Persian period". No Hellenistic, Roman or Byzantine stratum is reported on the
    # mound. The end is the last fortress's destruction, "ca. 600 BCE" in Finkelstein's
    # abstract and "late seventh or early sixth century" in Faust's review (Cohen: 586 BC).
    # The scattered Persian-period remains above it do not extend its life, as the small
    # settlement left at Nineveh does not (612 BC). Every verse naming Kadesh falls long
    # before this. Eusebius' Kadesh near Petra is a different (traditional) location and
    # does not bear on this mound. Checked independently on 2026-10-15.
    until: "c. 600 BC"
    note:
      en: "Tell el-Qudeirat, excavated by Rudolph Cohen in 1976–1982, held a series of Iron Age fortresses (whether Judah built them is debated); the last was destroyed in the late 7th or early 6th century BC, probably by the Babylonians. Above its ruins only scattered later remains were found, mostly of the Persian period."
      ru: "На Телль-эль-Кудейрате, раскопанном Рудольфом Коэном в 1976–1982 гг., одна за другой стояли крепости железного века (построила ли их Иудея — вопрос спорный); последняя была разрушена в конце VII или начале VI в. до н. э., вероятно вавилонянами. Над её руинами нашлись лишь разрозненные более поздние остатки, в основном персидского времени."
      uk: "На Телль-ель-Кудейраті, розкопаному Рудольфом Коеном у 1976–1982 рр., одна за одною стояли фортеці залізної доби (чи збудувала їх Юдея, сперечаються); останню зруйновано наприкінці VII або на початку VI ст. до н. е., імовірно вавилонянами. Над її руїнами знайшлися лише розпорошені пізніші рештки, здебільшого перського часу."
      es: "En Tell el-Qudeirat, excavado por Rudolph Cohen en 1976–1982, se sucedieron fortalezas de la Edad del Hierro (se discute si las construyó Judá); la última fue destruida a fines del siglo VII o comienzos del VI a. C., probablemente por los babilonios. Sobre sus ruinas solo se hallaron restos posteriores dispersos, sobre todo del período persa."
      pt: "Em Tell el-Qudeirat, escavado por Rudolph Cohen em 1976–1982, sucederam-se fortalezas da Idade do Ferro (discute-se se foram construídas por Judá); a última foi destruída no fim do século VII ou início do VI a.C., provavelmente pelos babilônios. Sobre as suas ruínas encontraram-se apenas vestígios posteriores esparsos, sobretudo do período persa."
      de: "Auf dem Tell el-Qudeirat, den Rudolph Cohen 1976–1982 ausgrub, standen nacheinander eisenzeitliche Festungen (ob Juda sie baute, ist umstritten); die letzte wurde im späten 7. oder frühen 6. Jahrhundert v. Chr. zerstört, wahrscheinlich von den Babyloniern. Über ihren Ruinen fanden sich nur vereinzelte spätere Reste, meist aus persischer Zeit."
      fr: "Sur Tell el-Qudeirat, fouillé par Rudolph Cohen en 1976–1982, se succédèrent des forteresses de l’âge du Fer (on discute si Juda les a bâties) ; la dernière fut détruite à la fin du VIIe ou au début du VIe siècle av. J.-C., probablement par les Babyloniens. Au-dessus de ses ruines, on n’a trouvé que des vestiges postérieurs épars, surtout d’époque perse."
      pl: "Na Tell el-Kudejrat, odkopanym przez Rudolpha Cohena w latach 1976–1982, stały kolejno twierdze z epoki żelaza (czy zbudowało je Królestwo Judy, jest kwestią sporną); ostatnia została zniszczona pod koniec VII lub na początku VI wieku p.n.e., prawdopodobnie przez Babilończyków. Nad jej ruinami znaleziono tylko rozproszone późniejsze pozostałości, głównie z okresu perskiego."
      it: "Su Tell el-Qudeirat, scavato da Rudolph Cohen nel 1976–1982, si succedettero fortezze dell’età del Ferro (è discusso se le abbia costruite Giuda); l’ultima fu distrutta alla fine del VII o all’inizio del VI secolo a.C., probabilmente dai Babilonesi. Sopra le sue rovine si sono trovati solo resti posteriori sparsi, per lo più di età persiana."
      nl: "Op Tell el-Qudeirat, in 1976–1982 opgegraven door Rudolph Cohen, stonden achtereenvolgens vestingen uit de IJzertijd (of Juda ze bouwde, is omstreden); de laatste werd eind 7e of begin 6e eeuw v.Chr. verwoest, waarschijnlijk door de Babyloniërs. Boven de ruïnes werden alleen verspreide latere resten gevonden, vooral uit de Perzische tijd."
      cs: "Na Tell el-Kudejrátu, který v letech 1976–1982 zkoumal Rudolph Cohen, stály postupně pevnosti z doby železné (zda je postavilo Judské království, je sporné); poslední byla zničena koncem 7. nebo počátkem 6. století př. n. l., pravděpodobně Babylóňany. Nad jejími troskami se našly jen roztroušené pozdější pozůstatky, většinou z perského období."
      sv: "Tell el-Qudeirat, utgrävd av Rudolph Cohen 1976–1982, rymde en serie järnåldersfästen (huruvida Juda byggde dem är omdebatterat); det sista förstördes under sena 600-talet eller tidiga 500-talet f.Kr., sannolikt av babylonierna. Ovanför dess ruiner fann man bara spridda senare lämningar, mestadels från persisk tid."
      nb: "Tell el-Qudeirat, utgravd av Rudolph Cohen i 1976–1982, rommet en rekke jernalderfestninger (om Juda bygde dem, er omdiskutert); den siste ble ødelagt i slutten av 600-tallet eller begynnelsen av 500-tallet f.Kr., trolig av babylonerne. Over ruinene ble det bare funnet spredte senere rester, for det meste fra den persiske tid."
      tl: "Ang Tell el-Qudeirat, na hinukay ni Rudolph Cohen noong 1976–1982, ay may sunud-sunod na kuta ng Panahon ng Bakal (pinagtatalunan kung itinayo ito ng Juda); ang huli ay winasak sa huling bahagi ng ika-7 o simula ng ika-6 na siglo BK, marahil ng mga Babilonio. Sa ibabaw ng mga guho nito ay mga nakakalat na labi na lamang ng mas huling panahon ang natagpuan, karamihan ay mula sa panahon ng Persia."
      da: "Tell el-Qudeirat, udgravet af Rudolph Cohen i 1976–1982, rummede en række jernalderfæstninger (om Juda byggede dem, er omstridt); den sidste blev ødelagt sent i 7. eller tidligt i 6. århundrede f.Kr., sandsynligvis af babylonierne. Over dens ruiner blev der kun fundet spredte senere rester, mest fra den persiske periode."
      sr: "Тел ел-Кудејрат, који је 1976–1982. ископавао Рудолф Кохен, садржао је низ гвоздених тврђава (да ли их је градила Јуда, спорно је); последња је разорена крајем 7. или почетком 6. века п. н. е., вероватно од Вавилонаца. Изнад њених рушевина нађени су само расути каснији остаци, већином из персијског периода."
    sources:
      - "R. Cohen and H. Bernick-Greenberg, Excavations at Kadesh Barnea (Tell el-Qudeirat) 1976-1982 (Israel Antiquities Authority), reviewed by A. Faust, American Journal of Archaeology 113.2 (2009)"
      - "I. Finkelstein, 'Kadesh Barnea: A Reevaluation of Its Archaeology and History', Tel Aviv 37 (2010), pp. 111-125"
  - id: a0905b5
    en: Succoth
    # The point stands on Tell Deir Alla in the Jordan valley (OpenBible's leading
    # candidate; the identification is not certain, and the place stays marked disputed).
    # Ibrahim and van der Kooij's phase list for the tell (ADAJ 23, 1979): phase V "5th/early
    # 4th c. B.C.", phase III, the last building on the summit, "not earlier than the 4th
    # cent. B.C.", phase I "the medieval arabic graveyard on top of the tell". Franken: the
    # tell was inhabited "from the Bronze Age until late Persian times". The end is taken at
    # the close of the Persian period, approximately; whichever reading of phase III holds,
    # no town stood here in the Roman period, when the map showed it among Herod's cities.
    # Every verse naming Succoth falls long before this. Checked on 2026-10-17 against
    # https://deadseaquake.info/EarthquakeCatalogOfTheDeadSea/Sites/Archaeo/DeirAlla.html,
    # which quotes the excavation reports.
    until: "c. 300 BC"
    note:
      en: "On Tell Deir Alla, where many place Succoth, people lived from the Bronze Age into the late Persian period; the last building on its summit dates to the 4th century BC at the earliest. Later the top of the mound served as a graveyard."
      ru: "На Телль-Дейр-Алла, где многие помещают Сокхоф, жили с бронзового века до конца персидского времени; последнее здание на его вершине построено не раньше IV в. до н. э. Позднее верх холма служил кладбищем."
      uk: "На Телль-Дейр-Алла, де багато хто розміщує Сокхот, жили від бронзової доби до кінця перського часу; остання будівля на його вершині зведена не раніше IV ст. до н. е. Пізніше верх пагорба слугував кладовищем."
      es: "En Tell Deir Alla, donde muchos sitúan Sucot, se vivió desde la Edad del Bronce hasta el final del período persa; el último edificio de su cima no es anterior al siglo IV a. C. Más tarde la cima del montículo sirvió de cementerio."
      pt: "Em Tell Deir Alla, onde muitos situam Sucote, viveu-se desde a Idade do Bronze até o fim do período persa; o último edifício do seu topo não é anterior ao século IV a.C. Mais tarde o alto do monte serviu de cemitério."
      de: "Auf dem Tell Deir Alla, wo viele Sukkot ansetzen, lebten Menschen von der Bronzezeit bis in die späte Perserzeit; das letzte Gebäude auf seiner Kuppe stammt frühestens aus dem 4. Jahrhundert v. Chr. Später diente die Kuppe des Hügels als Friedhof."
      fr: "Sur Tell Deir Alla, où beaucoup situent Succoth, on vécut de l’âge du Bronze jusqu’à la fin de l’époque perse ; le dernier bâtiment de son sommet ne date pas d’avant le IVe siècle av. J.-C. Plus tard, le sommet du tell servit de cimetière."
      pl: "Na Tell Deir Alla, gdzie wielu umieszcza Sukkot, mieszkano od epoki brązu do końca okresu perskiego; ostatni budynek na jego szczycie powstał nie wcześniej niż w IV wieku p.n.e. Później szczyt wzgórza służył za cmentarz."
      it: "Su Tell Deir Alla, dove molti collocano Succot, si visse dall’età del Bronzo fino alla tarda età persiana; l’ultimo edificio sulla sua sommità non è anteriore al IV secolo a.C. Più tardi la cima del tell servì da cimitero."
      nl: "Op Tell Deir Alla, waar velen Sukkoth plaatsen, woonden mensen van de Bronstijd tot in de late Perzische tijd; het laatste gebouw op de top dateert op zijn vroegst uit de 4e eeuw v.Chr. Later diende de top van de heuvel als begraafplaats."
      cs: "Na Tell Deir Alla, kam mnozí kladou Sukót, se žilo od doby bronzové až do konce perského období; poslední stavba na jeho vrcholu nevznikla dříve než ve 4. století př. n. l. Později sloužil vrchol pahorku jako hřbitov."
      sv: "På Tell Deir Alla, där många placerar Suckot, bodde människor från bronsåldern in i sen persisk tid; den sista byggnaden på toppen dateras tidigast till 300-talet f.Kr. Senare användes högens topp som gravplats."
      nb: "På Tell Deir Alla, hvor mange plasserer Sukkot, bodde folk fra bronsealderen og inn i den sene persiske tid; den siste bygningen på toppen stammer fra 300-tallet f.Kr. på det tidligste. Senere ble toppen av haugen brukt som gravplass."
      tl: "Sa Tell Deir Alla, na itinuturo ng marami bilang Succoth, nanirahan ang mga tao mula sa Panahon ng Tanso hanggang sa huling panahon ng Persia; ang huling gusali sa tuktok nito ay mula pa sa ika-4 na siglo BK sa pinakamaaga. Kalaunan ay ginamit na libingan ang tuktok ng burol."
      da: "På Tell Deir Alla, hvor mange placerer Sukkot, boede folk fra bronzealderen til sent i den persiske periode; den sidste bygning på toppen dateres tidligst til 4. århundrede f.Kr. Senere tjente højens top som gravplads."
      sr: "На Тел Дер Али, где многи смештају Сокот, људи су живели од бронзаног доба до касног персијског периода; последња грађевина на врху датира најраније из 4. века п. н. е. Касније је врх брда служио као гробље."
    sources:
      - "M. M. Ibrahim and G. van der Kooij, 'Excavations at Tell Deir 'Alla, Season 1979', Annual of the Department of Antiquities of Jordan 23 (1979), pp. 41-50"
      - "H. J. Franken, 'Deir 'Alla, Tell', in E. M. Meyers (ed.), The Oxford Encyclopedia of Archaeology in the Near East (1997)"
