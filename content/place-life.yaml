      nb: "Bosatt av Thasos som Krenides og gjengrunnlagt av Filip II av Makedonia, som oppkalte den etter seg selv (356 f.Kr.)."
      tl: "Pinamayanan ng Thasos bilang Krenides at muling itinatag ni Felipe II ng Macedonia, na nagpangalan nito sa sarili niya (356 BK)."
      da: "Bosat fra Thasos som Krenides og genanlagt af Filip 2. af Makedonien, som opkaldte den efter sig selv (356 f.Kr.)."
      sr: "Населио га је Тасос као Крениде, а поново га је основао Филип II Македонски, који га је назвао по себи (356. п. н. е.)."
