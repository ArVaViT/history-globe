# When places stood as towns (ADR 0003 years; "c." marks an approximate year and is
# kept). `from` is the first year it stood, `until` the last; `gap` gives the first and
# last years it lay in ruins between two lives. Outside those years the map shows the
# place faded, whatever the testament. Every entry cites its sources. Places whose dates
# are disputed (Jericho, Ai, Hazor, Gath) are left out rather than guessed.
places:
  - id: ac9adc9
    en: Tiberias
    from: "c. AD 20"
    note:
      en: "Founded by Herod Antipas on the Sea of Galilee and named after Tiberius."
      ru: "Основана Иродом Антипой на берегу Галилейского моря и названа в честь Тиберия."
      uk: "Заснований Іродом Антипою на Галілейському морі й названий на честь Тиверія."
      es: "Fundada por Herodes Antipas junto al Mar de Galilea y llamada así en honor de Tiberio."
      pt: "Fundada por Herodes Antipas no Mar da Galileia e batizada em honra de Tibério."
      de: "Von Herodes Antipas am See Genezareth gegründet und nach Tiberius benannt."
      fr: "Fondée par Hérode Antipas au bord de la Mer de Galilée et nommée d’après Tibère."
      pl: "Założona przez Heroda Antypasa nad Jeziorem Galilejskim i nazwana na cześć Tyberiusza."
      it: "Fondata da Erode Antipa sul Lago di Tiberiade e chiamata così in onore di Tiberio."
      nl: "Gesticht door Herodes Antipas aan het Meer van Galilea en genoemd naar Tiberius."
      cs: "Založen Herodem Antipou na Galilejském jezeře a pojmenován po Tiberiovi."
      sv: "Grundades av Herodes Antipas vid Galileiska sjön och uppkallades efter Tiberius."
      nb: "Grunnlagt av Herodes Antipas ved Galileasjøen og oppkalt etter Tiberius."
      tl: "Itinatag ni Herodes Antipas sa Dagat ng Galilea at pinangalanan kay Tiberio."
      da: "Grundlagt af Herodes Antipas ved Genesaret Sø og opkaldt efter Tiberius."
      sr: "Основао га је Ирод Антипа на Галилејском мору и назвао по Тиверију."
    sources:
      - "Josephus, Antiquities 18.36-38"
  - id: a58735e
    en: Caesarea
    from: "22 BC"
    until: "AD 1265"
    note:
      en: "Built by Herod the Great from 22 BC on the site of Strato's Tower. In 1265 the Mamluk sultan Baybars took the Crusader city and razed it so that the Franks could not use it again; the ruins lay empty for six centuries."
      ru: "Построена Иродом Великим с 22 г. до н. э. на месте Башни Стратона. В 1265 г. мамлюкский султан Бейбарс взял город крестоносцев и сровнял его с землёй, чтобы франки не смогли им снова воспользоваться; руины шесть веков стояли пустыми."
      uk: "Збудована Іродом Великим від 22 р. до н. е. на місці Стратонової вежі. У 1265 р. мамлюцький султан Бейбарс здобув місто хрестоносців і зрівняв його з землею, щоб франки не могли знову ним скористатися; руїни стояли порожні шість століть."
      es: "Construida por Herodes el Grande desde el 22 a. C. en el emplazamiento de la Torre de Estratón. En 1265 el sultán mameluco Baibars tomó la ciudad cruzada y la arrasó para que los francos no pudieran volver a usarla; las ruinas quedaron vacías durante seis siglos."
      pt: "Construída por Herodes, o Grande, a partir de 22 a.C., no local da Torre de Estratão. Em 1265, o sultão mameluco Baybars tomou a cidade cruzada e a arrasou para que os francos não pudessem usá-la de novo; as ruínas ficaram vazias por seis séculos."
      de: "Von Herodes dem Großen ab 22 v. Chr. an der Stelle des Stratonsturms erbaut. 1265 nahm der Mamlukensultan Baibars die Kreuzfahrerstadt ein und machte sie dem Erdboden gleich, damit die Franken sie nicht wieder nutzen konnten; die Ruinen lagen sechs Jahrhunderte lang öde."
      fr: "Construite par Hérode le Grand à partir de 22 av. J.-C. sur le site de la Tour de Straton. En 1265, le sultan mamelouk Baybars prit la ville des croisés et la rasa pour que les Francs ne puissent plus s’en servir ; les ruines restèrent vides pendant six siècles."
      pl: "Zbudowana przez Heroda Wielkiego od 22 p.n.e. na miejscu Wieży Stratona. W 1265 roku mamelucki sułtan Bajbars zdobył miasto krzyżowców i zrównał je z ziemią, aby Frankowie nie mogli go ponownie użyć; ruiny leżały puste przez sześć wieków."
      it: "Costruita da Erode il Grande a partire dal 22 a.C. nel sito della Torre di Stratone. Nel 1265 il sultano mamelucco Baibars prese la città crociata e la rase al suolo perché i Franchi non potessero più servirsene; le rovine rimasero deserte per sei secoli."
      nl: "Gebouwd door Herodes de Grote vanaf 22 v.Chr. op de plaats van de Toren van Straton. In 1265 nam de Mamelukse sultan Baibars de kruisvaardersstad in en maakte haar met de grond gelijk, zodat de Franken haar niet opnieuw konden gebruiken; de ruïnes lagen zes eeuwen leeg."
      cs: "Vybudována Herodem Velikým od roku 22 př. n. l. na místě Stratonovy věže. V roce 1265 mamlúcký sultán Bajbars dobyl křižácké město a srovnal je se zemí, aby je Frankové už nemohli použít; zříceniny zůstaly šest století prázdné."
      sv: "Byggdes av Herodes den store från 22 f.Kr. på platsen för Stratons torn. År 1265 intog den mamlukiske sultanen Baybars korsfararstaden och jämnade den med marken så att frankerna inte skulle kunna använda den igen; ruinerna låg tomma i sex århundraden."
      nb: "Bygd av Herodes den store fra 22 f.Kr. på stedet der Stratons tårn lå. I 1265 inntok mamelukksultanen Baybars korsfarerbyen og jevnet den med jorden, slik at frankerne ikke kunne bruke den igjen; ruinene lå øde i seks århundrer."
      tl: "Itinayo ni Herodes na Dakila mula 22 BK sa pook ng Tore ni Strato. Noong 1265, kinuha ng sultang Mamluk na si Baybars ang lungsod ng mga Krusado at winasak ito upang hindi na ito magamit muli ng mga Frank; nanatiling walang tao ang mga guho sa loob ng anim na siglo."
      da: "Bygget af Herodes den Store fra 22 f.Kr. på stedet for Stratons Tårn. I 1265 indtog mamelukkernes sultan Baibars korsfarerbyen og jævnede den med jorden, så frankerne ikke kunne bruge den igen; ruinerne lå øde i seks århundreder."
      sr: "Подигао га је Ирод Велики од 22. п. н. е. на месту Стратонове куле. Године 1265. мамелучки султан Бајбарс освојио је крсташки град и сравнио га са земљом да га Франци не би поново могли користити; рушевине су лежале празне шест векова."
    sources:
      - "Josephus, Antiquities 15.331-341; 16.136"
      - "Abu'l-Fida, Taqwim al-buldan (1321), in G. Le Strange, Palestine under the Moslems (1890), p. 475"
      - "Israel Ministry of Foreign Affairs, 'Caesarea' (Archaeology in Israel), on the Jewish Virtual Library"
  - id: a70fd5d
    en: Nineveh
    until: "612 BC"
    note:
      en: "Taken and destroyed by the Babylonians and the Medes in 612 BC; only a small settlement lived on at the site."
      ru: "Взята и разрушена вавилонянами и мидянами в 612 г. до н. э.; на месте города осталось лишь небольшое поселение."
      uk: "Здобутий і зруйнований вавилонянами та мідянами в 612 р. до н. е.; на місці лишилося лише невелике поселення."
      es: "Tomada y destruida por los babilonios y los medos en 612 a. C.; solo un pequeño asentamiento sobrevivió en el lugar."
      pt: "Tomada e destruída pelos babilônios e pelos medos em 612 a.C.; apenas um pequeno povoado sobreviveu no local."
      de: "612 v. Chr. von den Babyloniern und den Medern erobert und zerstört; nur eine kleine Siedlung bestand an der Stelle weiter."
      fr: "Prise et détruite par les Babyloniens et les Mèdes en 612 av. J.-C. ; seule une petite agglomération subsista sur le site."
      pl: "Zdobyta i zniszczona przez Babilończyków i Medów w 612 p.n.e.; na miejscu przetrwała tylko niewielka osada."
      it: "Presa e distrutta dai Babilonesi e dai Medi nel 612 a.C.; nel sito sopravvisse soltanto un piccolo insediamento."
      nl: "Ingenomen en verwoest door de Babyloniërs en de Meden in 612 v.Chr.; slechts een kleine nederzetting bleef op de plaats bestaan."
      cs: "Dobyta a zničena Babylóňany a Médy v roce 612 př. n. l.; na místě žila už jen malá osada."
      sv: "Intogs och förstördes av babylonierna och mederna 612 f.Kr.; endast en liten bosättning levde kvar på platsen."
      nb: "Inntatt og ødelagt av babylonerne og mederne i 612 f.Kr.; bare en liten bosetting levde videre på stedet."
      tl: "Kinuha at winasak ng mga Babilonio at ng mga Medo noong 612 BK; isang maliit na pamayanan na lamang ang nanatili sa pook."
      da: "Indtaget og ødelagt af babylonierne og mederne i 612 f.Kr.; kun en lille bebyggelse levede videre på stedet."
      sr: "Освојили су га и разорили Вавилонци и Миђани 612. п. н. е.; на том месту је преживело само мало насеље."
    sources:
      - "Babylonian Chronicle, ABC 3 (Fall of Nineveh Chronicle)"
  - id: a15257a
    en: Jerusalem
    # The city lived on as Aelia Capitolina after AD 70, so it has no end inside the
    # period; the schema holds one gap, and the exile is the one the map shows.
    gap:
      from: "c. 586 BC"
      until: "c. 539 BC"
    note:
      en: "Burnt by Nebuchadnezzar's army (587 or 586 BC, the year is disputed); the exiles returned under Cyrus in 538 BC. In AD 70 Titus's army destroyed the city and the Temple; a Roman legion camped in the ruins until Aelia Capitolina was built c. AD 130."
      ru: "Сожжён войском Навуходоносора (587 или 586 г. до н. э., год спорный); изгнанники вернулись при Кире в 538 г. до н. э. В 70 г. н. э. город и Храм разрушены войском Тита; в руинах стоял римский легион, пока ок. 130 г. н. э. не построили Элию Капитолину."
      uk: "Спалений військом Навуходоносора (587 або 586 р. до н. е.; рік є спірним); вигнанці повернулися за Кіра в 538 р. до н. е. У 70 р. н. е. військо Тита зруйнувало місто й храм; римський легіон стояв табором серед руїн, доки близько 130 р. н. е. не збудували Елію Капітоліну."
      es: "Incendiada por el ejército de Nabucodonosor (587 o 586 a. C.; el año es discutido); los desterrados regresaron bajo Ciro en 538 a. C. En el 70 d. C. el ejército de Tito destruyó la ciudad y el Templo; una legión romana acampó entre las ruinas hasta que se construyó Aelia Capitolina hacia el 130 d. C."
      pt: "Incendiada pelo exército de Nabucodonosor (587 ou 586 a.C.; o ano é discutido); os exilados voltaram sob Ciro em 538 a.C. Em 70 d.C. o exército de Tito destruiu a cidade e o Templo; uma legião romana acampou nas ruínas até que Aelia Capitolina fosse construída, por volta de 130 d.C."
      de: "Vom Heer Nebukadnezars verbrannt (587 oder 586 v. Chr., das Jahr ist umstritten); die Verbannten kehrten 538 v. Chr. unter Kyrus zurück. Im Jahr 70 n. Chr. zerstörte das Heer des Titus die Stadt und den Tempel; eine römische Legion lag in den Trümmern, bis um 130 n. Chr. Aelia Capitolina erbaut wurde."
      fr: "Incendiée par l’armée de Nebucadnetsar (587 ou 586 av. J.-C., l’année est discutée) ; les exilés revinrent sous Cyrus en 538 av. J.-C. En 70 ap. J.-C., l’armée de Titus détruisit la ville et le temple ; une légion romaine campa dans les ruines jusqu’à la construction d’Aelia Capitolina vers 130 ap. J.-C."
      pl: "Spalona przez wojsko Nabuchodonozora (587 lub 586 p.n.e., rok jest sporny); wygnańcy wrócili pod rządami Cyrusa w 538 p.n.e. W 70 n.e. wojsko Tytusa zniszczyło miasto i świątynię; rzymski legion obozował wśród ruin, aż około 130 n.e. zbudowano Aelię Kapitolinę."
      it: "Incendiata dall’esercito di Nabucodonosor (587 o 586 a.C., l’anno è controverso); gli esuli tornarono sotto Ciro nel 538 a.C. Nel 70 d.C. l’esercito di Tito distrusse la città e il Tempio; una legione romana si accampò fra le rovine finché non fu costruita Aelia Capitolina, intorno al 130 d.C."
      nl: "Verbrand door het leger van Nebukadnessar (587 of 586 v.Chr., het jaar is omstreden); de ballingen keerden terug onder Cyrus in 538 v.Chr. In 70 n.Chr. verwoestte het leger van Titus de stad en de tempel; een Romeins legioen sloeg zijn kamp op in de ruïnes tot Aelia Capitolina omstreeks 130 n.Chr. werd gebouwd."
      cs: "Vypálen vojskem Nebukadnesarovým (587 nebo 586 př. n. l., rok je sporný); vyhnanci se vrátili za Kýra roku 538 př. n. l. V roce 70 n. l. Titovo vojsko zničilo město i chrám; římská legie tábořila v troskách, dokud kolem roku 130 n. l. nebyla vybudována Aelia Capitolina."
      sv: "Brändes av Nebukadnessars här (587 eller 586 f.Kr., året är omstritt); de landsflyktiga återvände under Kyros 538 f.Kr. År 70 e.Kr. förstörde Titus’ här staden och templet; en romersk legion låg i läger bland ruinerna tills Aelia Capitolina byggdes omkring 130 e.Kr."
      nb: "Brent av Nebukadnesars hær (587 eller 586 f.Kr.; året er omstridt); de landflyktige vendte tilbake under Kyros i 538 f.Kr. I 70 e.Kr. ødela Titus' hær byen og templet; en romersk legion lå i leir i ruinene til Aelia Capitolina ble bygd omkring 130 e.Kr."
      tl: "Sinunog ng hukbo ni Nabucodonosor (587 o 586 BK, pinagtatalunan ang taon); bumalik ang mga tapon sa ilalim ni Ciro noong 538 BK. Noong 70 AD, winasak ng hukbo ni Tito ang lungsod at ang Templo; isang legiyong Romano ang nagkampo sa mga guho hanggang sa itayo ang Aelia Capitolina noong mga 130 AD."
      da: "Brændt af Nebukadnezars hær (587 eller 586 f.Kr., året er omstridt); de landflygtige vendte hjem under Kyros i 538 f.Kr. I 70 e.Kr. ødelagde Titus' hær byen og templet; en romersk legion lå i lejr i ruinerne, indtil Aelia Capitolina blev bygget omkring 130 e.Kr."
      sr: "Спалила га је Навуходоносорова војска (587. или 586. п. н. е., година је спорна); прогнаници су се вратили под Киром 538. п. н. е. Године 70. н. е. Титова војска разорила је град и храм; једна римска легија логоровала је у рушевинама док није подигнута Елија Капитолина око 130. н. е."
    sources:
      - "2 Kgs 25:8-10; Jer 52:12-14"
      - "Josephus, Jewish War 6.249-266; 7.1-4"
      - "Ezra 1:1-4"
  - id: a041bb3
    en: Samaria
    from: "c. 880 BC"
    gap:
      from: "c. 108 BC"
      until: "c. 64 BC"
    note:
      en: "Built by King Omri on the hill he bought from Shemer; destroyed by John Hyrcanus, given back to its people by Pompey in 63 BC, rebuilt by Gabinius, and later became Herod's Sebaste."
      ru: "Построена царём Амврием на горе, купленной у Семира; разрушена Иоанном Гирканом, возвращена жителям Помпеем в 63 г. до н. э. и отстроена Габинием, а позже стала Севастой Ирода."
      uk: "Збудована царем Омрі на пагорбі, який він купив у Шемера; зруйнована Іоанном Гірканом, повернена її жителям Помпеєм у 63 р. до н. е., відбудована Габінієм, а згодом стала Іродовою Себастою."
      es: "Construida por el rey Omri en el cerro que compró a Semer; destruida por Juan Hircano, devuelta a su pueblo por Pompeyo en 63 a. C., reconstruida por Gabinio, y más tarde se convirtió en la Sebaste de Herodes."
      pt: "Construída pelo rei Onri na colina que comprou de Semer; destruída por João Hircano, devolvida ao seu povo por Pompeu em 63 a.C., reconstruída por Gabínio e, mais tarde, tornou-se a Sebaste de Herodes."
      de: "Von König Omri auf dem Hügel erbaut, den er von Schemer kaufte; von Johannes Hyrkanos zerstört, 63 v. Chr. von Pompeius seinen Einwohnern zurückgegeben, von Gabinius wiederaufgebaut und später zu Herodes' Sebaste."
      fr: "Bâtie par le roi Omri sur la colline qu’il acheta à Schémer ; détruite par Jean Hyrcan, rendue à ses habitants par Pompée en 63 av. J.-C., reconstruite par Gabinius, puis devenue la Sébaste d’Hérode."
      pl: "Zbudowana przez króla Omriego na wzgórzu kupionym od Szemera; zniszczona przez Jana Hirkana, zwrócona jej mieszkańcom przez Pompejusza w 63 p.n.e., odbudowana przez Gabiniusza, a później stała się Sebaste Heroda."
      it: "Costruita dal re Omri sulla collina che aveva comprato da Semer; distrutta da Giovanni Ircano, restituita al suo popolo da Pompeo nel 63 a.C., ricostruita da Gabinio, divenne poi la Sebaste di Erode."
      nl: "Gebouwd door koning Omri op de heuvel die hij van Semer kocht; verwoest door Johannes Hyrcanus, in 63 v.Chr. door Pompeius teruggegeven aan haar bevolking, herbouwd door Gabinius, en later het Sebaste van Herodes."
      cs: "Vybudována králem Omrím na vrchu, který koupil od Šemera; zničena Janem Hyrkanem, vrácena jejím obyvatelům Pompeiem roku 63 př. n. l., přestavěna Gabiniem a později se stala Herodovou Sebaste."
      sv: "Byggdes av kung Omri på kullen som han köpte av Shemer; förstördes av Johannes Hyrkanos, gavs tillbaka åt sitt folk av Pompejus 63 f.Kr., byggdes upp av Gabinius och blev senare Herodes’ Sebaste."
      nb: "Bygd av kong Omri på høyden han kjøpte av Sjemer; ødelagt av Johannes Hyrkanos, gitt tilbake til sitt folk av Pompeius i 63 f.Kr., gjenoppbygd av Gabinius og ble senere Herodes' Sebaste."
      tl: "Itinayo ni Haring Omri sa burol na binili niya kay Semer; winasak ni Juan Hyrcano, ibinalik sa mga tao nito ni Pompeyo noong 63 BK, muling itinayo ni Gabinio, at kalaunan ay naging Sebaste ni Herodes."
      da: "Bygget af kong Omri på det bjerg, han købte af Sjemer; ødelagt af Johannes Hyrkanos, givet tilbage til sit folk af Pompejus i 63 f.Kr., genopbygget af Gabinius og blev senere til Herodes' Sebaste."
      sr: "Подигао га је цар Амрије на брду које је купио од Семера; разорио га је Јован Хиркан, Помпеј га је 63. п. н. е. вратио његовом народу, Габиније га је обновио, а касније је постао Иродова Себаста."
    sources:
      - "1 Kgs 16:23-24"
      - "Josephus, Antiquities 13.275-281; 14.75; 14.88"
  - id: ae41ab4
    en: Antioch
    from: "300 BC"
    note:
      en: "Founded by Seleucus I Nicator on the Orontes and named after his father Antiochus."
      ru: "Основана Селевком I Никатором на Оронте и названа в честь его отца Антиоха."
      uk: "Заснована Селевком I Нікатором на Оронті та названа на честь його батька Антіоха."
      es: "Fundada por Seleuco I Nicátor junto al Orontes y llamada así por su padre Antíoco."
      pt: "Fundada por Seleuco I Nicator no Orontes e nomeada em honra de seu pai, Antíoco."
      de: "Von Seleukos I. Nikator am Orontes gegründet und nach seinem Vater Antiochos benannt."
      fr: "Fondée par Séleucos Ier Nicator sur l’Oronte et nommée d’après son père Antiochus."
      pl: "Założona przez Seleukosa I Nikatora nad Orontesem i nazwana na cześć jego ojca Antiocha."
      it: "Fondata da Seleuco I Nicatore sull’Oronte e chiamata così in onore di suo padre Antioco."
      nl: "Gesticht door Seleucus I Nicator aan de Orontes en genoemd naar zijn vader Antiochus."
      cs: "Založena Seleukem I. Nikátorem nad Orontem a pojmenována po jeho otci Antiochovi."
      sv: "Grundades av Seleukos I Nikator vid Orontes och uppkallades efter hans fader Antiochos."
      nb: "Grunnlagt av Seleukos I Nikator ved Orontes og oppkalt etter hans far Antiokos."
      tl: "Itinatag ni Seleuco I Nicator sa Orontes at pinangalanan sa kaniyang ama na si Antioco."
      da: "Grundlagt af Seleukos 1. Nikator ved Orontes og opkaldt efter hans far Antiochos."
      sr: "Основао га је Селеук I Никатор на Оронту и назвао по свом оцу Антиоху."
    sources:
      - "Strabo, Geography 16.2.4"
  - id: afc8e7a
    en: Rome
    from: "c. 753 BC"
    note:
      en: "Varro's traditional date of the founding of Rome; the Palatine was settled from the 10th–9th centuries BC, so the year is conventional."
      ru: "Традиционная дата основания Рима по Варрону; Палатин был заселён с X–IX вв. до н. э., так что год условный."
      uk: "Традиційна дата заснування Рима за Варроном; Палатин був заселений від X–IX ст. до н. е., тож цей рік умовний."
      es: "Fecha tradicional de la fundación de Roma según Varrón; el Palatino estaba poblado desde los siglos X–IX a. C., de modo que el año es convencional."
      pt: "Data tradicional de Varrão para a fundação de Roma; o Palatino foi povoado a partir dos séculos X–IX a.C., de modo que o ano é convencional."
      de: "Das traditionelle Gründungsdatum Roms nach Varro; der Palatin war seit dem 10.–9. Jahrhundert v. Chr. besiedelt, das Jahr ist also konventionell."
      fr: "Date traditionnelle de la fondation de Rome selon Varron ; le Palatin était habité depuis le Xe-IXe siècle av. J.-C., l’année est donc conventionnelle."
      pl: "Tradycyjna data założenia Rzymu podana przez Warrona; Palatyn był zasiedlony od X–IX w. p.n.e., więc rok jest umowny."
      it: "Data tradizionale della fondazione di Roma secondo Varrone; il Palatino era abitato dal X–IX secolo a.C., perciò l’anno è convenzionale."
      nl: "De traditionele stichtingsdatum van Rome volgens Varro; de Palatijn was bewoond sinds de 10e–9e eeuw v.Chr., dus het jaar is conventioneel."
      cs: "Varronovo tradiční datum založení Říma; Palatin byl osídlen od 10.–9. století př. n. l., takže rok je smluvní."
      sv: "Varros traditionella datum för Roms grundande; Palatinen var bebodd från 900- och 800-talen f.Kr., så året är konventionellt."
      nb: "Varros tradisjonelle dato for Romas grunnleggelse; Palatinerhøyden var bosatt fra 900- og 1000-tallet f.Kr., så året er konvensjonelt."
      tl: "Ang tradisyonal na petsa ni Varro ng pagkakatatag ng Roma; pinamayanan ang Palatino mula ika-10–9 na siglo BK, kaya kumbensiyonal ang taon."
      da: "Varros traditionelle dato for Roms grundlæggelse; Palatin var bebygget fra 10.–9. århundrede f.Kr., så årstallet er konventionelt."
      sr: "Варонов традиционални датум оснивања Рима; Палатин је био насељен од 10–9. века п. н. е., па је година условна."
    sources:
      - "Varronian era, as in Plutarch, Romulus 12, and Censorinus, De die natali 21"
      - "Dionysius of Halicarnassus, Roman Antiquities 1.74 (gives 752/751 BC)"
