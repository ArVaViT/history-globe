  - id: a41a054
    en: Admah
    until: "c. 1900 BC"
    note:
      en: "One of the cities of the plain overthrown with Sodom (Deut 29:23; Hos 11:8). The year is conventional."
      ru: "Один из городов равнины, ниспровергнутых с Содомом (Втор 29:23; Ос 11:8). Год условный."
      uk: "Одне з міст рівнини, зруйнованих разом із Содомом (Повт 29:23; Ос 11:8). Рік умовний."
      es: "Una de las ciudades de la llanura destruidas junto con Sodoma (Dt 29:23; Os 11:8). El año es convencional."
      pt: "Uma das cidades da planície destruídas com Sodoma (Dt 29:23; Os 11:8). O ano é convencional."
      de: "Eine der Städte der Ebene, die zusammen mit Sodom umgestürzt wurden (5. Mose 29,23; Hos 11,8). Das Jahr ist konventionell."
      fr: "L’une des villes de la plaine détruites avec Sodome (Dt 29:23 ; Os 11:8). L’année est conventionnelle."
      pl: "Jedno z miast równiny zburzonych wraz z Sodomą (Pwt 29,23; Oz 11,8). Rok jest umowny."
      it: "Una delle città della pianura distrutte insieme a Sodoma (Dt 29,23; Os 11,8). L’anno è convenzionale."
      nl: "Een van de steden van de vlakte die samen met Sodom werden verwoest (Deut. 29:23; Hos. 11:8). Het jaar is conventioneel."
      cs: "Jedno z měst roviny zničených spolu se Sodomou (Dt 29,23; Oz 11,8). Rok je smluvní."
      sv: "En av slättens städer som omstörtades tillsammans med Sodom (5 Mos 29:23; Hos 11:8). Året är konventionellt."
      nb: "En av slettens byer som ble omstyrtet sammen med Sodoma (5 Mos 29,23; Hos 11,8). Året er konvensjonelt."
      tl: "Isa sa mga lungsod sa kapatagan na winasak kasama ng Sodoma (Deut 29:23; Os 11:8). Kumbensiyonal ang taon."
