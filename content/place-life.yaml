      - "Plutarch, Antony 85-86; Cassius Dio 51.14"
  - id: a736f6c
    en: Mizpah
    gap:
      from: "c. 3300 BC"
      until: "c. 1200 BC"
    note:
      en: "Tell en-Nasbeh was a small village in the Late Chalcolithic and Early Bronze I periods and then lay empty for some two thousand years, until it was settled again at the start of the Iron Age; the town lived on through the Babylonian and Persian periods, and after the fall of Jerusalem it was the seat of Gedaliah."
      ru: "В позднем халколите и начале раннего бронзового века на Телль-эн-Насбе стояло небольшое селение; затем холм около двух тысяч лет пустовал, пока его вновь не заселили в начале железного века. Город пережил вавилонский и персидский периоды, а после падения Иерусалима здесь была резиденция Годолии."
      uk: "Тель-ен-Насбе було невеликим селом у пізньому халколіті та ранньому бронзовому віці I, а потім майже дві тисячі років лежало порожнім, доки знову не було заселене на початку залізного віку; місто жило і за вавилонської, і за перської доби, а після падіння Єрусалима було резиденцією Гедалії."
      es: "Tell en-Nasbeh fue una pequeña aldea en el Calcolítico Final y el Bronce Antiguo I y luego quedó vacío durante unos dos mil años, hasta que volvió a poblarse al comienzo de la Edad del Hierro; la ciudad sobrevivió durante los períodos babilónico y persa, y tras la caída de Jerusalén fue la sede de Gedalías."
      pt: "Tell en-Nasbeh foi uma pequena aldeia no Calcolítico Tardio e no Bronze Antigo I e depois ficou vazia por cerca de dois mil anos, até ser povoada de novo no início da Idade do Ferro; a cidade sobreviveu nos períodos babilônico e persa e, depois da queda de Jerusalém, foi a sede de Gedalias."
      de: "Tell en-Nasbeh war im Spätchalkolithikum und in der Frühbronzezeit I ein kleines Dorf und lag dann etwa zweitausend Jahre leer, bis es zu Beginn der Eisenzeit wieder besiedelt wurde; die Stadt bestand durch die babylonische und die persische Zeit fort, und nach dem Fall Jerusalems war sie der Sitz Gedaljas."
      fr: "Tell en-Nasbeh fut un petit village au Chalcolithique final et au Bronze ancien I, puis resta vide pendant quelque deux mille ans, jusqu’à une nouvelle occupation au début de l’âge du fer ; la ville subsista pendant les périodes babylonienne et perse, et après la chute de Jérusalem elle fut le siège de Guedalia."
      pl: "Tell en-Nasbeh był niewielką wsią w późnym chalkolicie i wczesnym brązie I, a potem leżał pusty przez około dwa tysiące lat, aż zasiedlono go ponownie na początku epoki żelaza; miasto przetrwało okres babiloński i perski, a po upadku Jerozolimy było siedzibą Gedaliasza."
      it: "Tell en-Nasbeh fu un piccolo villaggio nel Calcolitico tardo e nel Bronzo antico I e poi rimase vuoto per circa duemila anni, finché fu abitato di nuovo all’inizio dell’età del Ferro; la città sopravvisse attraverso i periodi babilonese e persiano, e dopo la caduta di Gerusalemme fu la sede di Godolia."
      nl: "Tell en-Nasbeh was een klein dorp in het Laat-Chalcolithicum en het Vroeg-Brons I en lag daarna zo'n tweeduizend jaar leeg, tot het aan het begin van de IJzertijd opnieuw werd bewoond; de stad bleef bestaan door de Babylonische en Perzische tijd en was na de val van Jeruzalem de zetel van Gedalja."
      cs: "Tell en-Nasbeh byl malou vesnicí v pozdním chalkolitu a v rané době bronzové I a poté ležel asi dvě tisíciletí prázdný, dokud nebyl znovu osídlen na počátku doby železné; město žilo dál v babylónském a perském období a po pádu Jeruzaléma bylo sídlem Gedaljášovým."
      sv: "Tell en-Nasbeh var en liten by under sen kalkolitisk tid och tidig bronsålder I och låg därefter tom i omkring två tusen år, tills den bosattes på nytt i början av järnåldern; staden levde vidare genom babylonisk och persisk tid, och efter Jerusalems fall var den Gedaljas säte."
      nb: "Tell en-Nasbeh var en liten landsby i sen kobberalder og tidlig bronsealder I og lå så tom i omkring to tusen år, til den ble bosatt på nytt ved begynnelsen av jernalderen; byen levde videre gjennom den babylonske og persiske tid, og etter Jerusalems fall var den Gedaljas sete."
      tl: "Ang Tell en-Nasbeh ay isang maliit na nayon noong Huling Kalkolitiko at Maagang Bronse I, at pagkatapos ay naging tiwangwang nang mga dalawang libong taon, hanggang sa muling pamayanan sa simula ng Panahon ng Bakal; nagpatuloy ang bayan sa panahon ng Babilonia at ng Persia, at pagkatapos ng pagbagsak ng Jerusalem ay naging luklukan ni Gedalias."
      da: "Tell en-Nasbeh var en lille landsby i sen chalkolitisk periode og tidlig bronzealder I og lå derefter tom i omkring to tusind år, indtil den blev bosat igen i begyndelsen af jernalderen; byen levede videre gennem den babyloniske og persiske periode, og efter Jerusalems fald var den Gedaljas sæde."
      sr: "Тел ен-Насбех био је мало село у позном халколитику и раном бронзаном добу I, а затим је око две хиљаде година лежао празан док поново није насељен почетком гвозденог доба; град је опстао кроз вавилонски и персијски период, а после пада Јерусалима био је седиште Годолије."
    sources:
      - "J. R. Zorn, 'Tell en-Nasbeh', in E. Stern (ed.), NEAEHL 3 (1993), pp. 1098-1102"
      - "Badè Museum of Biblical Archaeology, 'Tell en-Nasbeh' data publication (Open Context), strata 5-1"
      - "2 Kgs 25:23; Jer 40:6"
  - id: a30c937
    en: Ashdod
    from: "c. 1650 BC"
    note:
      en: "Moshe Dothan's excavations found that the first town on Tel Ashdod was a fortified Canaanite city of the 17th century BC; it later became one of the five cities of the Philistines."
      ru: "Раскопки Моше Дотана показали, что первым городом на Тель-Ашдоде был укреплённый ханаанейский город XVII в. до н. э.; позже он стал одним из пяти филистимских городов."
      uk: "Розкопки Моше Дотана показали, що перше місто на Тель-Ашдоді було укріпленим ханаанським містом XVII ст. до н. е.; пізніше воно стало одним із п’яти міст філістимлян."
      es: "Las excavaciones de Moshe Dothan hallaron que la primera ciudad de Tel Asdod fue una ciudad cananea fortificada del siglo XVII a. C.; más tarde se convirtió en una de las cinco ciudades de los filisteos."
      pt: "As escavações de Moshe Dothan mostraram que a primeira cidade em Tel Asdode era uma cidade cananeia fortificada do século XVII a.C.; mais tarde tornou-se uma das cinco cidades dos filisteus."
      de: "Moshe Dothans Ausgrabungen ergaben, dass die erste Stadt auf Tel Aschdod eine befestigte kanaanäische Stadt des 17. Jahrhunderts v. Chr. war; später wurde sie eine der fünf Städte der Philister."
      fr: "Les fouilles de Moshe Dothan ont montré que la première ville de Tel Asdod était une cité cananéenne fortifiée du XVIIe siècle av. J.-C. ; elle devint plus tard l’une des cinq villes des Philistins."
      pl: "Wykopaliska Moshe Dothana wykazały, że pierwszym miastem na Tel Aszdod była ufortyfikowane miasto kananejskie z XVII w. p.n.e.; później stało się jednym z pięciu miast Filistynów."
      it: "Gli scavi di Moshe Dothan hanno mostrato che la prima città su Tel Asdod era una città cananea fortificata del XVII secolo a.C.; divenne poi una delle cinque città dei Filistei."
      nl: "Uit de opgravingen van Moshe Dothan blijkt dat de eerste stad op Tel Asdod een versterkte Kanaänitische stad uit de 17e eeuw v.Chr. was; later werd ze een van de vijf steden van de Filistijnen."
      cs: "Vykopávky Moše Dothana ukázaly, že první město na Tel Ašdod bylo opevněné kenaanské město ze 17. století př. n. l.; později se stalo jedním z pěti měst Pelištejců."
      sv: "Moshe Dothans utgrävningar visade att den första staden på Tel Ashdod var en befäst kananeisk stad från 1600-talet f.Kr.; den blev senare en av filistéernas fem städer."
      nb: "Moshe Dothans utgravinger viste at den første byen på Tel Asjdod var en befestet kanaaneisk by fra 1600-tallet f.Kr.; senere ble den en av filisternes fem byer."
      tl: "Natuklasan ng mga paghuhukay ni Moshe Dothan na ang unang bayan sa Tel Asdod ay isang may-kutang lungsod ng mga Cananeo noong ika-17 siglo BK; naging isa ito kalaunan sa limang lungsod ng mga Filisteo."
      da: "Moshe Dothans udgravninger fandt, at den første by på Tel Asdod var en befæstet kana'anæisk by fra 17. århundrede f.Kr.; senere blev den en af filistrenes fem byer."
      sr: "Ископавања Мошеа Дотана показала су да је први град на Тел Азоту био утврђен хананејски град из 17. века п. н. е.; касније је постао један од пет градова Филистеја."
    sources:
      - "M. Dothan, 'Ashdod', Anchor Bible Dictionary 1 (1992), pp. 477-482"
      - "M. Dothan and D. N. Freedman, Ashdod I: The First Season of Excavations, 1962 ('Atiqot, English Series 7, 1967)"
      - "Encyclopaedia Judaica, 'Ashdod', on the Jewish Virtual Library"

  # ---------- batch life 1 (fill) ----------
  - id: a5feb15
    en: Ephesus
    # Why firm: the point stands on the Hellenistic-Roman city (Library of Celsus area),
    # not on the archaic town by the Artemision. Strabo 14.1.21 (LacusCurtius, Loeb) says
    # Lysimachus walled "the present city" and flooded the old one by blocking the drains;
    # Pausanias 1.9.7 (theoi.com, Jones) says he "founded the modern city of Ephesus",
    # settling there the people of Lebedus and Colophon; 7.3.4-5 repeats it. Lysimachus
    # took Ephesus c. 294 BC; the move is dated c. 294-289 BC, so "c. 290".
    from: "c. 290 BC"
    older: true
    note:
      en: "The Ephesus of Acts and Revelation is the city Lysimachus built between Mount Pion and Mount Coressus about 290 BC: he walled the new site and, Strabo says, flooded the old town by the temple of Artemis by blocking its drains until its people moved; he settled there the people of Lebedus and Colophon; for a time it bore his wife's name, Arsinoeia."
      ru: "Ефес Деяний и Откровения — город, построенный Лисимахом между горами Пион и Коресс около 290 г. до н. э.: он обнёс стеной новое место и, по словам Страбона, затопил старый город у храма Артемиды, заложив его стоки, пока жители не переселились; он поселил там жителей Лебедоса и Колофона; некоторое время город носил имя его жены — Арсиноя."
      uk: "Ефес Діянь і Одкровення — місто, яке Лісімах збудував між горою Піон і горою Коресс близько 290 р. до н. е.: він обніс стінами нове місце і, як каже Страбон, затопив старе місто біля храму Артеміди, заблокувавши його стоки, доки жителі не переселилися; він оселив там мешканців Лебеда й Колофона; якийсь час місто носило ім’я його дружини, Арсіноя."
      es: "La Éfeso de Hechos y del Apocalipsis es la ciudad que Lisímaco edificó entre el monte Pión y el monte Coreso hacia 290 a. C.: amuralló el nuevo emplazamiento y, según Estrabón, inundó la ciudad vieja junto al templo de Artemisa bloqueando sus desagües hasta que su gente se trasladó; asentó allí a los habitantes de Lebedo y Colofón; durante un tiempo llevó el nombre de su esposa, Arsinoea."
      pt: "O Éfeso de Atos e do Apocalipse é a cidade que Lisímaco construiu entre o monte Pion e o monte Coresso por volta de 290 a.C.: ele cercou de muralhas o novo local e, diz Estrabão, inundou a cidade velha, junto ao templo de Ártemis, bloqueando seus esgotos até que seu povo se mudasse; estabeleceu ali os habitantes de Lebedo e Colofão; por algum tempo ela levou o nome da esposa dele, Arsinoeia."
      de: "Das Ephesus der Apostelgeschichte und der Offenbarung ist die Stadt, die Lysimachos um 290 v. Chr. zwischen dem Berg Pion und dem Berg Koressos baute: Er ummauerte den neuen Platz und setzte, wie Strabon sagt, die Altstadt beim Artemistempel unter Wasser, indem er ihre Abflüsse verstopfte, bis ihre Bewohner umzogen; er siedelte dort die Leute von Lebedos und Kolophon an; eine Zeit lang trug sie den Namen seiner Frau, Arsinoeia."
      fr: "L’Éphèse des Actes et de l’Apocalypse est la ville que Lysimaque bâtit entre le mont Pion et le mont Coressos vers 290 av. J.-C. : il fortifia le nouveau site et, dit Strabon, inonda l’ancienne ville près du temple d’Artémis en bouchant ses égouts jusqu’à ce que ses habitants partent ; il y installa les gens de Lébédos et de Colophon ; pendant un temps, elle porta le nom de son épouse, Arsinoéia."
      pl: "Efez z Dziejów Apostolskich i Apokalipsy to miasto, które Lizymach zbudował między górą Pion a górą Koressos około 290 p.n.e.: otoczył nowe miejsce murami i, jak podaje Strabon, zatopił stare miasto przy świątyni Artemidy, zatykając jego ścieki, aż jego mieszkańcy się wynieśli; osiedlił tam ludzi z Lebedos i Kolofonu; przez pewien czas nosiło imię jego żony, Arsinoeja."
      it: "L’Efeso degli Atti e dell’Apocalisse è la città che Lisimaco costruì fra il monte Pion e il monte Coresso intorno al 290 a.C.: cinse di mura il nuovo sito e, dice Strabone, allagò la città vecchia presso il tempio di Artemide ostruendone gli scarichi finché i suoi abitanti non si furono trasferiti; vi stabilì la gente di Lebedo e di Colofone; per un certo tempo portò il nome di sua moglie, Arsinoea."
      nl: "Het Efeze van Handelingen en Openbaring is de stad die Lysimachus omstreeks 290 v.Chr. bouwde tussen de berg Pion en de berg Coressus: hij omringde de nieuwe plaats met muren en, zo zegt Strabo, liet de oude stad bij de tempel van Artemis onderlopen door de afvoeren te blokkeren totdat haar bewoners vertrokken; hij vestigde er de bewoners van Lebedus en Colophon; een tijd lang droeg ze de naam van zijn vrouw, Arsinoeia."
      cs: "Efez z Knihy Skutků a Zjevení je město, které Lysimachos vystavěl mezi horou Pion a horou Koressos kolem roku 290 př. n. l.: opevnil nové místo a, jak říká Strabón, zatopil staré město u Artemidina chrámu zablokováním jeho stok, dokud se jeho obyvatelé nepřestěhovali; usadil tam obyvatele Lebedu a Kolofónu; po nějaký čas neslo jméno jeho ženy, Arsinoeia."
      sv: "Efesos i Apostlagärningarna och Uppenbarelseboken är den stad som Lysimachos byggde mellan berget Pion och berget Koressos omkring 290 f.Kr.: han försåg den nya platsen med murar och, säger Strabon, översvämmade den gamla staden vid Artemistemplet genom att täppa till dess avlopp tills folket flyttade; han bosatte där folket från Lebedos och Kolofon; en tid bar den hans hustrus namn, Arsinoeia."
      nb: "Efesos i Apostlenes gjerninger og Johannes' Åpenbaring er byen Lysimakhos bygde mellom Pion og Koressos omkring 290 f.Kr.: han murte inn det nye stedet og oversvømte, sier Strabon, den gamle byen ved Artemis' tempel ved å stenge dens avløp til folket flyttet; han bosatte der folk fra Lebedos og Kolofon; en tid bar den hans hustrus navn, Arsinoeia."
      tl: "Ang Efeso ng Mga Gawa at ng Apocalipsis ay ang lungsod na itinayo ni Lysimachus sa pagitan ng Bundok Pion at Bundok Coressus noong mga 290 BK: pinaderan niya ang bagong pook at, ayon kay Strabo, binaha ang lumang bayan sa tabi ng templo ni Artemis sa pamamagitan ng pagbabara sa mga alulod nito hanggang lumipat ang mga tao; pinatira niya roon ang mga taga-Lebedus at Colophon; sa isang panahon ay taglay nito ang pangalan ng kaniyang asawa, Arsinoeia."
      da: "Efesos i Apostlenes Gerninger og Johannes' Åbenbaring er den by, Lysimachos byggede mellem Pion-bjerget og Koressos-bjerget omkring 290 f.Kr.: han omgav det nye sted med mur og, siger Strabon, oversvømmede den gamle by ved Artemis' tempel ved at blokere dens afløb, indtil dens folk flyttede; han bosatte der folkene fra Lebedos og Kolofon; en tid bar den hans hustrus navn, Arsinoeia."
      sr: "Ефес из Дела и Откривења је град који је Лизимах подигао између горе Пион и горе Корес око 290. п. н. е.: опасао је зидинама ново место и, каже Страбон, потопио стари град код храма Артемидиног затворивши му одводе док се народ није иселио; населио је ту људе из Лебеда и Колофона; извесно време носио је име његове жене, Арсиноеја."
    sources:
      - "Strabo, Geography 14.1.21"
      - "Pausanias, Description of Greece 1.9.7; 7.3.4-5"
      - "'Ephesus', Encyclopaedia Britannica, 11th ed. (1911)"
  - id: a513646
    en: Dan
    # Why firm: the excavators' page (Nelson Glueck School, HUC) states "By the end of the
    # 4th century CE, in the late Roman period, Tel Dan was abandoned".
    # Eusebius (c. 330) still lists Dan as a village four miles from Paneas
    # on the road to Tyre. No `from`: Laish stood from the Early Bronze Age, before the
    # period's start. The Assyrian capture of 732 BC is not an end (the town was restored).
    until: "c. AD 400"
    note:
      en: "Taken by Tiglath-pileser III in 732 BC, Dan lived on as a small town with its sanctuary through the Hellenistic and Roman periods; Eusebius still knew it as a village four miles from Paneas, but by the end of the 4th century AD the mound was abandoned."
      ru: "Взятый Тиглатпаласаром III в 732 г. до н. э., Дан пережил эллинистическую и римскую эпохи небольшим городком при святилище; Евсевий ещё знал его как селение в четырёх милях от Панеады, но к концу IV в. н. э. холм был оставлен."
      uk: "Здобутий Тіглатпаласаром III у 732 р. до н. е., Дан жив далі як невелике місто зі своїм святилищем крізь елліністичну й римську добу; Євсевій ще знав його як село за чотири милі від Панеаса, але наприкінці IV ст. н. е. пагорб було покинуто."
      es: "Tomada por Tiglat-pileser III en 732 a. C., Dan sobrevivió como una pequeña ciudad con su santuario durante los períodos helenístico y romano; Eusebio aún la conocía como una aldea a cuatro millas de Paneas, pero a finales del siglo IV d. C. el montículo estaba abandonado."
      pt: "Tomada por Tiglate-Pileser III em 732 a.C., Dã sobreviveu como pequena cidade com o seu santuário durante os períodos helenístico e romano; Eusébio ainda a conhecia como uma aldeia a quatro milhas de Paneas, mas no final do século IV d.C. o montículo estava abandonado."
      de: "Von Tiglat-Pileser III. 732 v. Chr. eingenommen, bestand Dan mit seinem Heiligtum als kleine Stadt durch die hellenistische und die römische Zeit fort; Eusebius kannte es noch als Dorf vier Meilen von Paneas, doch am Ende des 4. Jahrhunderts n. Chr. war der Hügel verlassen."
      fr: "Prise par Tiglath-Piléser III en 732 av. J.-C., Dan subsista comme petite ville avec son sanctuaire pendant les périodes hellénistique et romaine ; Eusèbe la connaissait encore comme un village à quatre milles de Panéas, mais à la fin du IVe siècle ap. J.-C. le tertre était abandonné."
      pl: "Zdobyty przez Tiglat-Pilesera III w 732 p.n.e., Dan przetrwał jako małe miasto ze swoim sanktuarium przez okres hellenistyczny i rzymski; Euzebiusz znał go jeszcze jako wieś w odległości czterech mil od Paneas, lecz pod koniec IV w. n.e. kopiec został opuszczony."
      it: "Presa da Tiglat-Pilèser III nel 732 a.C., Dan sopravvisse come piccola città con il suo santuario attraverso i periodi ellenistico e romano; Eusebio la conosceva ancora come villaggio a quattro miglia da Paneas, ma alla fine del IV secolo d.C. il tell era abbandonato."
      nl: "Door Tiglat-Pileser III in 732 v.Chr. ingenomen, bleef Dan voortbestaan als een stadje met zijn heiligdom door de hellenistische en Romeinse tijd; Eusebius kende het nog als een dorp op vier mijl van Paneas, maar tegen het einde van de 4e eeuw n.Chr. was de heuvel verlaten."
      cs: "Dobyt Tiglatpilesarem III. roku 732 př. n. l., Dan žil dál jako malé město se svou svatyní v helénistickém i římském období; Eusebios jej ještě znal jako vesnici čtyři míle od Paneady, ale koncem 4. století n. l. byl pahorek opuštěn."
      sv: "Intogs av Tiglat-Pileser III 732 f.Kr.; Dan levde vidare som en liten stad med sin helgedom genom hellenistisk och romersk tid; Eusebios kände den ännu som en by fyra miles från Paneas, men i slutet av 300-talet e.Kr. var högen övergiven."
      nb: "Inntatt av Tiglat-Pileser III i 732 f.Kr. levde Dan videre som en liten by med sin helligdom gjennom den hellenistiske og romerske tid; Eusebios kjente den fortsatt som en landsby fire romerske mil fra Paneas, men ved slutten av 300-tallet e.Kr. var haugen forlatt."
      tl: "Nakuha ni Tiglath-pileser III noong 732 BK, nagpatuloy ang Dan bilang maliit na bayan na may santuwaryo nito sa panahon ng mga Helenista at Romano; kilala pa ito ni Eusebio bilang nayon na apat na milya mula sa Paneas, ngunit sa katapusan ng ika-4 na siglo AD ay iniwan na ang burol."
      da: "Indtaget af Tiglat-Pileser 3. i 732 f.Kr. levede Dan videre som en lille by med sin helligdom gennem den hellenistiske og romerske periode; Eusebios kendte den endnu som en landsby fire romerske mil fra Paneas, men ved udgangen af 4. århundrede e.Kr. var højen forladt."
      sr: "Теглат-Феласар III освојио је Дан 732. п. н. е.; он је опстао као мали град са светилиштем кроз хеленистички и римски период, Еусебије га је још познавао као село четири миље од Панеаса, али је до краја 4. века н. е. брдо напуштено."
    sources:
      - "Tel Dan excavations of A. Biran and D. Ilan (Nelson Glueck School of Biblical Archaeology, 'Tel Dan')"
      - "Eusebius, Onomasticon, s.v. Dan"
      - "Israel Ministry of Foreign Affairs, 'Biblical City of Dan' (Archaeology in Israel), on the Jewish Virtual Library (destruction by Tiglath-pileser III, 732 BC)"

  # ---------- batch life 2 (fill) ----------
  - id: aaf03fa
    en: Jericho
    # The New Testament Jericho (Tulul Abu el-'Alayiq by Wadi Qelt), not Tell es-Sultan.
    # No `from`: Jericho stood as a town through the Hellenistic age (1 Macc 9:50; 16:11)
    # before Hyrcanus I built his palace here, so the Hasmonean date is not a founding.
    # End: Vespasian camped at Corea on 2 Daesius (June) 68 and reached Jericho the next day; Eusebius says the
    # second city perished in the Roman war and a third was built elsewhere.
    until: "AD 68"
    note:
      en: "The Jericho of the Gospels, the Hasmonean and Herodian town by Wadi Qelt, was taken by Vespasian in June AD 68: a great multitude fled to the hills facing Jerusalem, most of those left behind were killed, the Romans found the city deserted, and a fort with a garrison was set there. Eusebius writes that it was destroyed at the siege of Jerusalem and that a third Jericho was built afterwards, while remains of the two older cities were still pointed out."
      ru: "Иерихон евангельских времён — хасмонейский и иродианский город у Вади-Кельт — взят Веспасианом в июне 68 г. н. э.: множество жителей бежало в горы напротив Иерусалима, большинство оставшихся было перебито, римляне нашли город опустевшим и поставили в нём укрепление с гарнизоном. Евсевий пишет, что он был разрушен при осаде Иерусалима и что затем построили третий Иерихон, а развалины двух прежних городов ещё показывали."
      uk: "Єрихон Євангелій, хасмонейське й іродіанське місто біля вади Кельт, був здобутий Веспасіаном у червні 68 р. н. е.: велика юрба втекла в гори навпроти Єрусалима, більшість із тих, хто лишився, було вбито, римляни знайшли місто порожнім і поставили там фортецю з гарнізоном. Євсевій пише, що воно було зруйноване під час облоги Єрусалима й що потім збудували третій Єрихон, тоді як рештки двох давніших міст ще показували."
      es: "La Jericó de los Evangelios, la ciudad asmonea y herodiana junto al Wadi Qelt, fue tomada por Vespasiano en junio del 68 d. C.: una gran multitud huyó a los montes frente a Jerusalén, la mayoría de los que quedaron atrás fueron muertos, los romanos hallaron la ciudad desierta y pusieron allí un fuerte con guarnición. Eusebio escribe que fue destruida en el asedio de Jerusalén y que después se edificó una tercera Jericó, mientras aún se señalaban restos de las dos más antiguas."
      pt: "A Jericó dos Evangelhos, a cidade hasmoneia e herodiana junto ao Wadi Qelt, foi tomada por Vespasiano em junho de 68 d.C.: uma grande multidão fugiu para as colinas defronte de Jerusalém, a maior parte dos que ficaram foi morta, os romanos encontraram a cidade deserta, e um forte com guarnição foi ali estabelecido. Eusébio escreve que ela foi destruída no cerco de Jerusalém e que uma terceira Jericó foi construída depois, enquanto ainda se mostravam restos das duas mais antigas."
      de: "Das Jericho der Evangelien, die hasmonäische und herodianische Stadt am Wadi Qelt, wurde im Juni 68 n. Chr. von Vespasian eingenommen: Eine große Menge floh in die Berge gegenüber von Jerusalem, die meisten der Zurückgebliebenen wurden getötet, die Römer fanden die Stadt verlassen vor, und ein Fort mit einer Besatzung wurde dort errichtet. Eusebius schreibt, sie sei bei der Belagerung Jerusalems zerstört worden und danach sei ein drittes Jericho gebaut worden, während man die Überreste der beiden älteren Städte noch zeigte."
      fr: "Le Jéricho des Évangiles, la ville hasmonéenne et hérodienne près du wadi Qelt, fut prise par Vespasien en juin 68 ap. J.-C. : une grande multitude s’enfuit vers les collines faisant face à Jérusalem, la plupart de ceux qui restaient furent tués, les Romains trouvèrent la ville déserte, et un fort avec une garnison y fut établi. Eusèbe écrit qu’elle fut détruite au siège de Jérusalem et qu’un troisième Jéricho fut bâti ensuite, tandis qu’on montrait encore les restes des deux plus anciennes."
      pl: "Jerycho z Ewangelii, hasmonejskie i herodiańskie miasto nad Wadi Kelt, zostało zdobyte przez Wespazjana w czerwcu 68 n.e.: wielkie mnóstwo ludzi uciekło w góry naprzeciw Jerozolimy, większość pozostawionych zginęła, Rzymianie zastali miasto opuszczone i założyli w nim fort z załogą. Euzebiusz pisze, że zostało zniszczone podczas oblężenia Jerozolimy i że potem zbudowano trzecie Jerycho, podczas gdy szczątki dwóch starszych miast jeszcze pokazywano."
      it: "La Gerico dei Vangeli, la città asmonea ed erodiana presso il Wadi Qelt, fu presa da Vespasiano nel giugno del 68 d.C.: una grande moltitudine fuggì sulle colline di fronte a Gerusalemme, la maggior parte di quelli rimasti fu uccisa, i Romani trovarono la città deserta e vi collocarono un forte con una guarnigione. Eusebio scrive che fu distrutta durante l’assedio di Gerusalemme e che in seguito fu costruita una terza Gerico, mentre si mostravano ancora i resti delle due più antiche."
      nl: "Het Jericho van de evangeliën, de Hasmoneese en Herodiaanse stad bij de Wadi Qelt, werd in juni 68 n.Chr. door Vespasianus ingenomen: een grote menigte vluchtte naar de heuvels tegenover Jeruzalem, de meeste achterblijvers werden gedood, de Romeinen vonden de stad verlaten en richtten er een fort met een bezetting op. Eusebius schrijft dat ze bij het beleg van Jeruzalem werd verwoest en dat daarna een derde Jericho werd gebouwd, terwijl de resten van de twee oudere steden nog werden aangewezen."
      cs: "Jericho z evangelií, hasmonejské a herodovské město u Wádí Qelt, dobyl Vespasianus v červnu roku 68 n. l.: velké množství lidí uprchlo do hor naproti Jeruzalému, většina těch, kdo zůstali, byla pobita, Římané nalezli město opuštěné a zřídili tam pevnost s posádkou. Eusebios píše, že bylo zničeno při obléhání Jeruzaléma a že poté bylo vybudováno třetí Jericho, zatímco zbytky obou starších měst se ještě ukazovaly."
      sv: "Jeriko i evangelierna, den hasmoneiska och herodianska staden vid Wadi Qelt, intogs av Vespasianus i juni 68 e.Kr.: en stor folkmassa flydde till bergen mitt emot Jerusalem, de flesta av dem som blev kvar dödades, romarna fann staden öde, och ett fäste med en garnison lades där. Eusebios skriver att den förstördes vid belägringen av Jerusalem och att en tredje Jeriko byggdes därefter, medan lämningar av de två äldre städerna ännu pekades ut."
      nb: "Evangeliets Jeriko, den hasmoneiske og herodianske byen ved Wadi Qelt, ble inntatt av Vespasian i juni 68 e.Kr.: en stor mengde flyktet til fjellene mot Jerusalem, de fleste av dem som ble igjen, ble drept, romerne fant byen forlatt, og et fort med garnison ble anlagt der. Eusebios skriver at den ble ødelagt under beleiringen av Jerusalem og at en tredje Jeriko ble bygd etterpå, mens rester av de to eldre byene ennå ble pekt ut."
      tl: "Ang Jerico ng mga Ebanghelyo, ang bayan ng mga Hasmoneo at ni Herodes sa tabi ng Wadi Qelt, ay nakuha ni Vespasiano noong Hunyo 68 AD: isang napakaraming tao ang tumakas patungo sa mga burol na nasa harap ng Jerusalem, karamihan sa mga naiwan ay pinatay, nasumpungan ng mga Romano na walang tao ang lungsod, at nagtayo roon ng kuta na may bantay. Isinulat ni Eusebio na winasak ito sa pagkubkob sa Jerusalem at na isang ikatlong Jerico ang itinayo pagkaraan, samantalang itinuturo pa rin ang mga labi ng dalawang naunang lungsod."
      da: "Jeriko i Evangelierne, den hasmonæiske og herodianske by ved Wadi Qelt, blev indtaget af Vespasian i juni 68 e.Kr.: en stor skare flygtede til bjergene over for Jerusalem, de fleste af dem, der blev tilbage, blev dræbt, romerne fandt byen forladt, og et fort med en garnison blev anlagt der. Eusebios skriver, at den blev ødelagt under belejringen af Jerusalem, og at en tredje Jeriko blev bygget bagefter, mens resterne af de to ældre byer stadig blev udpeget."
      sr: "Јерихон из Јеванђеља, хасмонејски и иродовски град крај Вади Келта, освојио је Веспазијан у јуну 68. н. е.: велико мноштво побегло је у брда према Јерусалиму, већина оних који су остали побијена је, Римљани су нашли град пуст и ту поставили тврђаву са посадом. Еусебије пише да је разорен при опсади Јерусалима и да је потом подигнут трећи Јерихон, док су се остаци двају старијих градова још показивали."
    sources:
      - "Josephus, Jewish War 4.449-451; 4.486"
      - "Eusebius, Onomasticon, s.v. Ierichō (no. 530 in C. U. Wolf's translation)"
  - id: a21f909
    en: Timnah
    # Tel Batash. Mazar's sequence runs about 700 years from the start of the MB IIB to the
    # end of Iron I (Strata XII-V), then Iron II and Persian (Strata IV-I) with only stray
    # Hellenistic finds; the Persian town is dated to the 5th-4th centuries, hence c. 350 BC
    # (as Megiddo's Persian end in the file).
    from: "c. 1700 BC"
    until: "c. 350 BC"
    note:
      en: "Tel Batash, the Timnah of Samson, was founded as a fortified town ringed by earthen ramparts at the start of the Middle Bronze IIB; the last settlement on the mound (Stratum I) belonged to the Persian period, and after it there are only stray Hellenistic finds and a sparse Byzantine settlement nearby."
      ru: "Тель-Баташ — Фимнафа Самсона — основан как укреплённый, обнесённый земляными валами город в начале среднего бронзового века IIB; последнее поселение на холме (слой I) относился к персидскому времени, а после него остались лишь единичные эллинистические находки и редкое византийское поселение по соседству."
      uk: "Тель-Баташ, Тімна Самсона, був заснований як укріплене місто, оточене земляними валами, на початку середньої бронзи IIB; останнє поселення на пагорбі (шар I) належало до перської доби, а після нього є лише поодинокі елліністичні знахідки та розріджене візантійське поселення поблизу."
      es: "Tel Batash, la Timna de Sansón, fue fundada como una ciudad fortificada rodeada de murallas de tierra al comienzo del Bronce Medio IIB; el último asentamiento sobre el montículo (Estrato I) pertenecía al período persa, y después solo hay hallazgos helenísticos dispersos y un asentamiento bizantino poco denso en las cercanías."
      pt: "Tel Batash, a Timna de Sansão, foi fundada como uma cidade fortificada cercada por muralhas de terra no início do Bronze Médio IIB; o último povoado no montículo (Estrato I) pertenceu ao período persa, e depois dele há apenas achados helenísticos esparsos e um povoado bizantino disperso nas proximidades."
      de: "Tel Batasch, das Timna Simsons, wurde als befestigte, von Erdwällen umgebene Stadt zu Beginn der Mittelbronzezeit IIB gegründet; die letzte Siedlung auf dem Hügel (Stratum I) gehörte in die persische Zeit, und danach gibt es nur vereinzelte hellenistische Funde und eine dünne byzantinische Siedlung in der Nähe."
      fr: "Tel Batash, la Thimna de Samson, fut fondée comme ville fortifiée entourée de remparts de terre au début du Bronze moyen IIB ; la dernière occupation du tertre (strate I) appartenait à l’époque perse, et après elle on ne trouve que des vestiges hellénistiques isolés et un habitat byzantin clairsemé dans les environs."
      pl: "Tel Batasz, Timna Samsona, został założony jako ufortyfikowane miasto otoczone ziemnymi wałami na początku środkowego brązu IIB; ostatnia osada na kopcu (warstwa I) należała do okresu perskiego, a po niej są tylko pojedyncze znaleziska hellenistyczne i skromna osada bizantyjska w pobliżu."
      it: "Tel Batash, la Timna di Sansone, fu fondata come città fortificata circondata da bastioni di terra all’inizio del Bronzo medio IIB; l’ultimo insediamento sul tell (strato I) appartenne al periodo persiano, e dopo di esso restano soltanto reperti ellenistici sporadici e un rado insediamento bizantino nelle vicinanze."
      nl: "Tel Batash, het Timna van Simson, werd gesticht als een versterkte stad omringd door aarden wallen aan het begin van het Midden-Brons IIB; de laatste nederzetting op de heuvel (Stratum I) behoorde tot de Perzische tijd, en daarna zijn er alleen losse hellenistische vondsten en een schaarse Byzantijnse nederzetting in de buurt."
      cs: "Tel Batash, Samsonova Timna, byl založen jako opevněné město obklopené zemními valy na počátku střední doby bronzové IIB; poslední osídlení na pahorku (vrstva I) patřilo k perskému období a po něm jsou jen ojedinělé helénistické nálezy a řídké byzantské osídlení poblíž."
      sv: "Tel Batash, Simsons Timna, grundades som en befäst stad omgiven av jordvallar i början av mellanbronsålder IIB; den sista bosättningen på högen (Stratum I) hörde till persisk tid, och efter den finns bara enstaka hellenistiska fynd och en gles bysantinsk bosättning i närheten."
      nb: "Tel Batash, Samsons Timna, ble grunnlagt som en befestet by omringet av jordvoller ved begynnelsen av mellombronsealder IIB; den siste bosettingen på haugen (lag I) tilhørte den persiske tid, og etter den finnes bare spredte hellenistiske funn og en tynn bysantinsk bosetting i nærheten."
      tl: "Ang Tel Batash, ang Timna ni Samson, ay itinatag bilang may-kutang bayan na napaligiran ng mga muog na lupa sa simula ng Gitnang Bronse IIB; ang huling pamayanan sa burol (Stratum I) ay kabilang sa panahon ng Persia, at pagkatapos nito ay may mga nakakalat na natuklasang Helenistiko at isang kalat na pamayanang Bizantino sa malapit."
      da: "Tel Batash, Samsons Timna, blev grundlagt som en befæstet by omgivet af jordvolde ved starten af mellembronzealder IIB; den sidste bebyggelse på højen (lag I) hørte til den persiske periode, og derefter er der kun spredte hellenistiske fund og en tynd byzantinsk bebyggelse i nærheden."
      sr: "Тел Баташ, Самсонова Тамна, основан је као утврђен град опасан земљаним бедемима на почетку средњег бронзаног доба IIB; последње насеље на брду (слој I) припадало је персијском периоду, а после њега има само случајних хеленистичких налаза и ретког византијског насеља у близини."
    sources:
      - "A. Mazar, Timnah (Tel Batash) I: Stratigraphy and Architecture (Qedem 37, 1997)"
      - "A. Mazar and N. Panitz-Cohen, Timnah (Tel Batash) II: The Finds from the First Millennium BCE (Qedem 42, 2001)"
      - "N. Panitz-Cohen and A. Mazar, Timnah (Tel Batash) III: The Finds from the Second Millennium BCE (Qedem 45, 2006)"
  - id: a244d8f
    en: Eglon
    # Tel 'Eton. Destroyed by the Assyrians in the late 8th century: Katz and Faust 2012
    # cautiously said Sennacherib (701); Faust 2026 prefers Sargon II's campaign of 712/711,
    # hence c. 710. Seventh-century remains lie only in the plain NW of the mound; the mound
    # was reoccupied in the 4th century and abandoned in the 3rd (Faust 2026, p. 33).
    # Identification "accepted by most scholars", not certain (Tell el-Hesi was the older one).
    gap:
      from: "c. 710 BC"
      until: "c. 350 BC"
    until: "c. 250 BC"
    note:
      en: "Tel 'Eton, which most scholars identify with Eglon, was a large Judahite town until the Assyrians destroyed it at the end of the 8th century BC, in Sargon II's campaign of 712/711 or Sennacherib's of 701; the mound then lay empty until the 4th century BC, when a fort and a village were built on it, and it was abandoned for good in the 3rd century BC."
      ru: "Тель-Этон, который большинство учёных отождествляют с Еглоном, был крупным иудейским городом, пока в конце VIII в. до н. э. его не разрушили ассирийцы — в походе Саргона II 712/711 г. или Синаххериба 701 г.; после этого холм пустовал до IV в. до н. э., когда на нём построили крепость и селение, а в III в. до н. э. его оставили окончательно."
      uk: "Тель-Етон, який більшість учених ототожнює з Еглоном, був великим юдейським містом, доки ассирійці не зруйнували його наприкінці VIII ст. до н. е., під час походу Саргона II 712/711 р. або Сінаххеріба 701 р.; потім пагорб лежав порожній до IV ст. до н. е., коли на ньому збудували фортецю й село, а в III ст. до н. е. його покинули назавжди."
      es: "Tel 'Eton, que la mayoría de los estudiosos identifica con Eglón, fue una gran ciudad judaíta hasta que los asirios la destruyeron a finales del siglo VIII a. C., en la campaña de Sargón II de 712/711 o en la de Senaquerib de 701; el montículo quedó entonces vacío hasta el siglo IV a. C., cuando se construyeron en él un fuerte y una aldea, y fue abandonado para siempre en el siglo III a. C."
      pt: "Tel 'Eton, que a maioria dos estudiosos identifica com Eglom, foi uma grande cidade de Judá até que os assírios a destruíram no final do século VIII a.C., na campanha de Sargão II de 712/711 ou na de Senaqueribe de 701; o montículo ficou então vazio até o século IV a.C., quando um forte e uma aldeia foram construídos nele, e foi abandonado definitivamente no século III a.C."
      de: "Tel 'Eton, das die meisten Forscher mit Eglon gleichsetzen, war eine große judäische Stadt, bis die Assyrer sie am Ende des 8. Jahrhunderts v. Chr. zerstörten, in Sargons II. Feldzug von 712/711 oder Sanheribs von 701; der Hügel lag dann leer bis ins 4. Jahrhundert v. Chr., als ein Fort und ein Dorf darauf gebaut wurden, und im 3. Jahrhundert v. Chr. wurde er endgültig aufgegeben."
      fr: "Tel ‘Eton, que la plupart des chercheurs identifient à Églon, fut une grande ville de Juda jusqu’à sa destruction par les Assyriens à la fin du VIIIe siècle av. J.-C., lors de la campagne de Sargon II en 712-711 ou de celle de Sennacherib en 701 ; le tertre resta ensuite vide jusqu’au IVe siècle av. J.-C., quand un fortin et un village y furent bâtis, et il fut abandonné définitivement au IIIe siècle av. J.-C."
      pl: "Tel 'Eton, który większość uczonych utożsamia z Eglon, był dużym miastem judzkim, dopóki Asyryjczycy nie zniszczyli go pod koniec VIII w. p.n.e., w kampanii Sargona II w 712/711 lub Sennacheryba w 701; kopiec stał potem pusty do IV w. p.n.e., gdy zbudowano na nim fort i wieś, a w III w. p.n.e. opuszczono go na dobre."
      it: "Tel ‘Eton, che la maggior parte degli studiosi identifica con Eglon, fu una grande città giudaita finché gli Assiri non la distrussero alla fine dell’VIII secolo a.C., nella campagna di Sargon II del 712/711 o in quella di Sennacherib del 701; il tell rimase poi vuoto fino al IV secolo a.C., quando vi furono costruiti un forte e un villaggio, e fu abbandonato per sempre nel III secolo a.C."
      nl: "Tel 'Eton, dat de meeste geleerden met Eglon vereenzelvigen, was een grote stad van Juda totdat de Assyriërs haar aan het eind van de 8e eeuw v.Chr. verwoestten, in de veldtocht van Sargon II in 712/711 of van Sanherib in 701; daarna lag de heuvel leeg tot de 4e eeuw v.Chr., toen er een fort en een dorp op werden gebouwd, en in de 3e eeuw v.Chr. werd hij voorgoed verlaten."
      cs: "Tel 'Eton, který většina badatelů ztotožňuje s Eglonem, byl velkým judským městem, dokud jej Asyřané nezničili koncem 8. století př. n. l., při tažení Sargona II. v letech 712/711 nebo Senacheriba roku 701; pahorek pak ležel prázdný do 4. století př. n. l., kdy na něm byla postavena pevnost a vesnice, a ve 3. století př. n. l. byl nadobro opuštěn."
      sv: "Tel ’Eton, som de flesta forskare identifierar med Eglon, var en stor stad i Juda tills assyrierna förstörde den i slutet av 700-talet f.Kr., under Sargon II:s fälttåg 712/711 eller Sanheribs 701; högen låg sedan tom till 300-talet f.Kr., då ett fort och en by byggdes på den, och den övergavs för gott på 200-talet f.Kr."
      nb: "Tel 'Eton, som de fleste forskere identifiserer med Eglon, var en stor judeisk by til assyrerne ødela den ved slutten av 700-tallet f.Kr., i Sargon II's felttog 712/711 eller Sankeribs i 701; haugen lå så tom til 300-tallet f.Kr., da et fort og en landsby ble bygd på den, og den ble forlatt for godt på 200-tallet f.Kr."
      tl: "Ang Tel 'Eton, na kinikilala ng karamihan ng mga iskolar bilang Eglon, ay isang malaking bayan ng Juda hanggang sa winasak ito ng mga Asirio sa katapusan ng ika-8 siglo BK, sa kampanya ni Sargon II noong 712/711 o ni Sennacherib noong 701; pagkatapos ay naging tiwangwang ang burol hanggang sa ika-4 na siglo BK, nang magtayo roon ng kuta at nayon, at tuluyan itong iniwan noong ika-3 siglo BK."
      da: "Tel 'Eton, som de fleste forskere identificerer med Eglon, var en stor judæisk by, indtil assyrerne ødelagde den ved slutningen af 8. århundrede f.Kr., i Sargon 2.s felttog 712/711 eller Sankeribs i 701; højen lå derefter tom til 4. århundrede f.Kr., da et fort og en landsby blev bygget på den, og den blev forladt for bestandig i 3. århundrede f.Kr."
      sr: "Тел Етон, који већина стручњака поистовећује с Јеглоном, био је велики јудејски град док га Асирци нису разорили крајем 8. века п. н. е., у Саргоновом походу 712/711. или Сенахиримовом 701; брдо је затим лежало празно до 4. века п. н. е., кад су на њему подигнути тврђава и село, а коначно је напуштено у 3. веку п. н. е."
    sources:
      - "A. Faust, 'The History of Tel 'Eton Following the Results of the First Seven Seasons of Excavations (2006-2012)', Proceedings of the 8th ICAANE, vol. 2 (2014), pp. 585-604"
      - "H. Katz and A. Faust, 'The Assyrian Destruction Layer at Tel 'Eton', Israel Exploration Journal 62 (2012), pp. 22-53"
      - "A. Faust, 'Hezekiah's Reform? A View from Tel 'Eton on the Religious Development in Judah', Jerusalem Journal of Archaeology 9 (2026), pp. 31-60"

  # ---------- batch life 3 (fill) ----------
  - id: addba2a
    en: Beth-zur
    # Why firm: both campaigns at Khirbet et-Tubeiqa (Sellers and Albright 1931, Sellers
    # and Funk 1957) end the sequence with the Hasmonean fortress; the coins run from the
    # Ptolemies through the Seleucids to John Hyrcanus and then stop, and no Roman stratum
    # follows. Negev and Gibson: "by 100 BCE the town had been fully abandoned"; JTA on
    # the 1931 season: inhabited "until shortly before the Christian era". Encyclopaedia
    # Judaica's older guess ("destroyed and abandoned, apparently during Vespasian's
    # campaigns") rests on no stratum and is not followed; it is cited only for the
    # Byzantine town on the opposite hill, Burj es-Sur, where Eusebius' village Bethsoro
    # and the Madaba map's Bethsura stood (EJ: "probably"), so the point's own life ends here. The verses
    # (Josh 15:58; 1 Chr 2:45; 2 Chr 11:7; Neh 3:16) all fall before 100 BC.
    # Sellers' Middle Bronze gap (c. 1550-1200 BC; Dussaud's review of The Citadel of
    # Beth-Zur, Syria 16 (1935), pp. 212-213) is left out: the schema holds one gap, and
    # it would fade the town on the Joshua tour.
    until: "c. 100 BC"
    note:
      en: "Excavated at Khirbet et-Tubeiqa in 1931 and 1957: the town flourished under the Ptolemies and Seleucids and was the Maccabean frontier fortress, but its coins stop with John Hyrcanus and it was abandoned about 100 BC. The village of Bethsoro that Eusebius knew, and the Bethsura of the Madaba map, probably stood on the opposite hill, Burj es-Sur."
      ru: "Раскопки на Хирбет-эт-Тубейке в 1931 и 1957 гг.: город процветал при Птолемеях и Селевкидах и был пограничной крепостью Маккавеев, но его монеты обрываются на Иоанне Гиркане, и около 100 г. до н. э. он был оставлен. Селение, которое знал Евсевий, и город Мадабской карты, вероятно, стояли уже на соседнем холме — Бурдж-эс-Сур."
      uk: "Розкопаний у Хірбет-ет-Тубейці в 1931 і 1957 рр.: місто процвітало за Птолемеїв і Селевкідів і було прикордонною фортецею Макавеїв, але його монети закінчуються Іоанном Гірканом, і воно було покинуте близько 100 р. до н. е. Село Бетсоро, яке знав Євсевій, і Бетсура на карті з Мадаби, ймовірно, стояли на протилежному пагорбі, Бурдж-ес-Сур."
      es: "Excavada en Khirbet et-Tubeiqa en 1931 y 1957: la ciudad floreció bajo los ptolomeos y los seléucidas y fue la fortaleza fronteriza macabea, pero sus monedas terminan con Juan Hircano y fue abandonada hacia 100 a. C. La aldea de Betsoro que conocía Eusebio, y la Betsura del mapa de Madaba, probablemente se alzaban en la colina de enfrente, Burj es-Sur."
      pt: "Escavada em Khirbet et-Tubeiqa em 1931 e 1957: a cidade floresceu sob os ptolomeus e os selêucidas e foi a fortaleza de fronteira dos macabeus, mas suas moedas cessam com João Hircano e ela foi abandonada por volta de 100 a.C. A aldeia de Betsoro que Eusébio conhecia, e a Betsura do mapa de Madaba, provavelmente ficavam na colina oposta, Burj es-Sur."
      de: "Ausgegraben bei Chirbet et-Tubeika 1931 und 1957: Die Stadt blühte unter den Ptolemäern und Seleukiden und war die makkabäische Grenzfestung, doch ihre Münzen enden mit Johannes Hyrkanos, und um 100 v. Chr. wurde sie aufgegeben. Das Dorf Bethsoro, das Eusebius kannte, und das Bethsura der Madaba-Karte standen wohl auf dem gegenüberliegenden Hügel, Burdsch es-Sur."
      fr: "Fouillée à Khirbet et-Tubeiqa en 1931 et 1957 : la ville prospéra sous les Ptolémées et les Séleucides et fut la forteresse frontière des Maccabées, mais ses monnaies s’arrêtent à Jean Hyrcan et elle fut abandonnée vers 100 av. J.-C. Le village de Bethsoro qu’Eusèbe connaissait, et la Bethsura de la carte de Madaba, se trouvaient probablement sur la colline opposée, Burj es-Sur."
      pl: "Wykopaliska w Chirbet et-Tubejka (1931, 1957): miasto kwitło za Ptolemeuszów i Seleucydów i było machabejską twierdzą graniczną, lecz jego monety kończą się na Janie Hirkanie, a około 100 p.n.e. zostało opuszczone. Wieś Betsoro, którą znał Euzebiusz, i Bethsura z mapy z Madaby prawdopodobnie leżały na przeciwległym wzgórzu, Burdż es-Sur."
      it: "Scavata a Khirbet et-Tubeiqa nel 1931 e nel 1957: la città fiorì sotto i Tolomei e i Seleucidi e fu la fortezza di frontiera dei Maccabei, ma le sue monete si fermano con Giovanni Ircano ed essa fu abbandonata intorno al 100 a.C. Il villaggio di Bethsoro che Eusebio conosceva, e la Bethsura della mappa di Madaba, sorgevano probabilmente sulla collina di fronte, Burj es-Sur."
      nl: "Opgegraven bij Khirbet et-Tubeiqa in 1931 en 1957: de stad bloeide onder de Ptolemaeën en Seleuciden en was de Makkabeeuse grensvesting, maar haar munten houden op bij Johannes Hyrcanus en ze werd omstreeks 100 v.Chr. verlaten. Het dorp Bethsoro dat Eusebius kende, en het Bethsura van de Madabakaart, stond waarschijnlijk op de tegenoverliggende heuvel, Burj es-Sur."
      cs: "Vykopáván v Chirbet et-Tubejka v letech 1931 a 1957: město vzkvétalo za Ptolemaiovců a Seleukovců a bylo makabejskou pohraniční pevností, ale jeho mince končí Janem Hyrkanem a kolem roku 100 př. n. l. bylo opuštěno. Vesnice Bethsoro, kterou znal Eusebios, a Bethsura z madabské mapy pravděpodobně stály na protějším pahorku, Burdž es-Súr."
      sv: "Utgrävd vid Khirbet et-Tubeiqa 1931 och 1957: staden blomstrade under ptoleméerna och seleukiderna och var det mackabeiska gränsfästet, men dess mynt upphör med Johannes Hyrkanos och den övergavs omkring 100 f.Kr. Byn Bethsoro som Eusebios kände till, och Bethsura på Madabakartan, låg troligen på den motsatta kullen, Burj es-Sur."
      nb: "Utgravd ved Khirbet et-Tubeiqa i 1931 og 1957: byen blomstret under ptolemeerne og seleukidene og var den makkabeiske grensefestningen, men dens mynter stanser med Johannes Hyrkanos, og den ble forlatt omkring 100 f.Kr. Landsbyen Bethsoro som Eusebios kjente, og Bethsura på Madaba-kartet, lå trolig på høyden på den andre siden, Burj es-Sur."
      tl: "Hinukay sa Khirbet et-Tubeiqa noong 1931 at 1957: yumabong ang bayan sa ilalim ng mga Ptolomeo at mga Seleucida at naging kutang hangganan ng mga Macabeo, ngunit humihinto ang mga salapi nito kay Juan Hyrcano at iniwan ito noong mga 100 BK. Ang nayon ng Bethsoro na kilala ni Eusebio, at ang Bethsura sa mapa ng Madaba, ay marahil nakatayo sa katapat na burol, ang Burj es-Sur."
      da: "Udgravet ved Khirbet et-Tubeiqa i 1931 og 1957: byen blomstrede under ptolemæerne og seleukiderne og var den makkabæiske grænsefæstning, men dens mønter ophører med Johannes Hyrkanos, og den blev forladt omkring 100 f.Kr. Landsbyen Bethsoro, som Eusebios kendte, og Madaba-kortets Bethsura lå sandsynligvis på den modsatte høj, Burj es-Sur."
      sr: "Ископаван на Хирбет ет-Тубејки 1931. и 1957: град је цветао под Птолемејцима и Селеукидима и био макавејска гранична тврђава, али његов новац престаје с Јованом Хирканом и напуштен је око 100. п. н. е. Село Вет-Соро које је Еусебије познавао и Ветсура са мадабске карте вероватно су стајали на супротном брду, Бурџ ес-Сур."
    sources:
      - "A. Negev and S. Gibson (eds.), Archaeological Encyclopedia of the Holy Land (2001), pp. 89-90, s.v. Beth-Zur"
      - "Jewish Telegraphic Agency, 'Find Relics of 2,100 Years of Life at Beth Zur', 12 July 1931"
      - "Encyclopaedia Judaica, 'Beth-Zur' (the Byzantine town at Burj es-Sur), on encyclopedia.com"

  # ---------- batch life 4 (fill) ----------
  - id: a5947d7
    en: Tamar
    # Why firm: the point stands for En Hazeva (92 %). The excavators (Cohen and Yisrael)
    # found no stratum between the last Iron Age fortress (Stratum 4, 7th-6th c. BC) and
    # the Nabataean way-station (Stratum 3): Persian and Hellenistic layers are absent, so
    # the mound lay empty for some five centuries. Start: Cohen dates the end of Stratum 4
    # to "about the same time as the First Temple (586 BC)"; the smashed cult vessels of
    # the Edomite shrine he puts earlier, at Josiah's reform (c. 621 BC), so "c." is
    # needed (Ben-Ami et al. 2024 and Ben-Ami, Tel Aviv 53, 2026, re-date the earlier Iron
    # Age phases, not this end; the site is still read as abandoned in the early 6th c. BC).
    # End: Cohen gives Stratum 3 as "first-second centuries CE"; Bowman (renewed
    # excavations) has Tamar abandoned after 587 BC and rebuilt under Aretas IV
    # (9 BC - AD 40), Stratum 5 "1st centuries BCE/CE", so "c. AD 1" fits both. Caveat for
    # the reviewer: Ezekiel's border (Ezek 47:19; 48:28, c. 573 BC) names Tamar inside the
    # gap; it is a landmark on the border there, not a living town, so the fade is
    # acceptable but should be known. No tour stop lands on it.
    gap:
      from: "c. 586 BC"
      until: "c. AD 1"
    note:
      en: "The last Iron Age fortress at En Hazeva, with its Edomite shrine, was destroyed at about the time Jerusalem fell, and the mound lay empty through the Persian and Hellenistic periods; the next settlers were Nabataeans, whose way-station of the 1st century BC–1st century AD lies under the Late Roman fort of Thamara."
      ru: "Последняя крепость железного века в Эйн-Хацеве с её едомским святилищем погибла около времени падения Иерусалима, и в персидскую и эллинистическую эпохи холм стоял пустым; следующими здесь поселились набатеи, чья стоянка I в. до н. э. — I в. н. э. лежит под позднеримской крепостью Тамара."
      uk: "Остання залізна фортеця в Ен-Гацеві з едомським святилищем була зруйнована приблизно тоді, коли впав Єрусалим, і пагорб лежав порожній протягом перської й елліністичної доби; наступними поселенцями були набатеї, чий пункт відпочинку I ст. до н. е. — I ст. н. е. лежить під пізньоримським фортом Тамара."
      es: "La última fortaleza de la Edad del Hierro en En Hazeva, con su santuario edomita, fue destruida hacia la época en que cayó Jerusalén, y el montículo quedó vacío durante los períodos persa y helenístico; los siguientes pobladores fueron los nabateos, cuya estación de paso del siglo I a. C. al siglo I d. C. yace bajo el fuerte romano tardío de Tamara."
      pt: "A última fortaleza da Idade do Ferro em En Hazeva, com seu santuário edomita, foi destruída por volta da época da queda de Jerusalém, e o montículo ficou vazio durante os períodos persa e helenístico; os colonos seguintes foram os nabateus, cujo posto de parada dos séculos I a.C.–I d.C. fica sob o forte romano tardio de Tamara."
      de: "Die letzte eisenzeitliche Festung in En Hazeva mit ihrem edomitischen Heiligtum wurde etwa zur Zeit des Falls von Jerusalem zerstört, und der Hügel lag in persischer und hellenistischer Zeit leer; die nächsten Siedler waren Nabatäer, deren Wegstation vom 1. Jahrhundert v. Chr. bis zum 1. Jahrhundert n. Chr. unter dem spätrömischen Fort Thamara liegt."
      fr: "La dernière forteresse de l’âge du fer à En Hazeva, avec son sanctuaire édomite, fut détruite à peu près à l’époque de la chute de Jérusalem, et le tertre resta vide pendant les périodes perse et hellénistique ; les colons suivants furent des Nabatéens, dont le relais du Ier siècle av. J.-C.-Ier siècle ap. J.-C. gît sous le fort du Bas-Empire de Thamara."
      pl: "Ostatnia twierdza z epoki żelaza w En Chaweza, z edomickim sanktuarium, została zniszczona mniej więcej w czasie upadku Jerozolimy, a kopiec stał pusty przez okres perski i hellenistyczny; następnymi osadnikami byli Nabatejczycy, których przystanek z I w. p.n.e.–I w. n.e. leży pod późnorzymskim fortem Thamara."
      it: "L’ultima fortezza dell’età del Ferro a En Hazeva, con il suo santuario edomita, fu distrutta all’incirca quando cadde Gerusalemme, e il tell rimase vuoto durante i periodi persiano ed ellenistico; i coloni successivi furono i Nabatei, la cui stazione di sosta del I secolo a.C.–I secolo d.C. si trova sotto il forte tardoromano di Tamara."
      nl: "De laatste IJzertijdvesting te En Hazeva, met haar Edomitische heiligdom, werd verwoest omstreeks de tijd dat Jeruzalem viel, en de heuvel lag leeg door de Perzische en hellenistische tijd; de volgende bewoners waren Nabateeërs, wier pleisterplaats uit de 1e eeuw v.Chr.–1e eeuw n.Chr. onder het laat-Romeinse fort Thamara ligt."
      cs: "Poslední železnodobá pevnost v En Chaceva s edómskou svatyní byla zničena zhruba v době pádu Jeruzaléma a pahorek ležel prázdný po celé perské a helénistické období; dalšími osadníky byli Nabatejci, jejichž zastávka z 1. století př. n. l. – 1. století n. l. leží pod pozdně římskou pevností Thamara."
      sv: "Det sista järnåldersfästet vid En Hazeva, med sin edomitiska helgedom, förstördes ungefär när Jerusalem föll, och högen låg tom genom persisk och hellenistisk tid; de nästa bosättarna var nabatéerna, vars rastplats från första århundradet f.Kr. till första århundradet e.Kr. ligger under det senromerska fortet Thamara."
      nb: "Den siste jernalderfestningen ved En Hazeva, med sin edomittiske helligdom, ble ødelagt omtrent da Jerusalem falt, og haugen lå tom gjennom den persiske og hellenistiske tid; de neste bosetterne var nabateere, hvis rasteplass fra 100-tallet f.Kr.–100-tallet e.Kr. ligger under det sentromerske fortet Thamara."
      tl: "Ang huling kutang Panahon ng Bakal sa En Hazeva, kasama ang dambana nitong Edomita, ay winasak nang halos kasabay ng pagbagsak ng Jerusalem, at naging tiwangwang ang burol sa panahon ng Persia at ng mga Helenista; ang sumunod na naninirahan ay mga Nabateo, na ang himpilan ng ika-1 siglo BK–ika-1 siglo AD ay nasa ilalim ng huling kutang Romano ng Thamara."
      da: "Den sidste jernalderfæstning ved En Hazeva, med sin edomitiske helligdom, blev ødelagt omkring tiden for Jerusalems fald, og højen lå tom gennem den persiske og hellenistiske periode; de næste bosættere var nabatæerne, hvis rastested fra 1. århundrede f.Kr.–1. århundrede e.Kr. ligger under det senromerske fort Thamara."
      sr: "Последња гвоздена тврђава у Ен Хазеви, с едомским светилиштем, разорена је отприлике кад је пао Јерусалим, и брдо је лежало празно кроз персијски и хеленистички период; следећи досељеници били су Набатејци, чија станица за одмор из 1. века п. н. е.–1. века н. е. лежи испод касноримске тврђаве Тамаре."
    sources:
      - "R. Cohen and Y. Yisrael, 'The Iron Age Fortresses at En Haseva', Biblical Archaeologist 58.4 (1995), strata 6-1"
      - "R. Cohen and Y. Yisrael, 'Smashing the Idols: Piecing Together an Edomite Shrine in Judah', Biblical Archaeology Review 22.4 (1996), pp. 40-51"
      - "C. D. Bowman, 'Biblical Tamar (aka Ein Hazeva): Renewed Excavations 2005-2009', The Bible and Interpretation, Stratum 5"
