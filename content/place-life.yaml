      ru: "Новый Паф, приморский город из книги Деяний, основан Никоклом, последним царём Старого Пафа, в конце IV в. до н. э."
      uk: "Нова Пафос, портове місто Діянь, заснована Нікоклом, останнім царем Старої Пафос, наприкінці IV ст. до н. е."
      es: "Nea Pafos, la ciudad portuaria de Hechos, fue fundada por Nicocles, el último rey de Pafos Vieja, a finales del siglo IV a. C."
      pt: "Nova Pafos, a cidade portuária do livro de Atos, foi fundada por Nicocles, o último rei de Velha Pafos, no final do século IV a.C."
      de: "Neu-Paphos, die Hafenstadt der Apostelgeschichte, wurde im späten 4. Jahrhundert v. Chr. von Nikokles, dem letzten König von Alt-Paphos, gegründet."
      fr: "Néa Paphos, la ville portuaire des Actes, fut fondée par Nicoclès, dernier roi de Paléo-Paphos, à la fin du IVe siècle av. J.-C."
