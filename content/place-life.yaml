    from: "305 BC"
    until: "30 BC"
    note:
      en: "The kingdom of the south of Daniel 11, read as the Ptolemaic kingdom of Egypt, from Ptolemy I's taking the title of king to Cleopatra's death."
      ru: "Царство южного царя из Дан 11, понимаемое как Египет Птолемеев: от принятия Птолемеем I царского титула до смерти Клеопатры."
      uk: "Південне царство з Книги Даниїла 11, що розуміється як царство Птолемеїв у Єгипті, від прийняття Птолемеєм I царського титулу до смерті Клеопатри."
      es: "El reino del sur de Daniel 11, entendido como el reino ptolemaico de Egipto, desde que Ptolomeo I tomó el título de rey hasta la muerte de Cleopatra."
      pt: "O reino do sul de Daniel 11, entendido como o reino ptolomaico do Egito, desde a adoção do título de rei por Ptolomeu I até a morte de Cleópatra."
      de: "Das Reich des Südens aus Daniel 11, gedeutet als das ptolemäische Königreich Ägypten, von Ptolemaios' I. Annahme des Königstitels bis zu Kleopatras Tod."
      fr: "Le royaume du sud de Daniel 11, lu comme le royaume ptolémaïque d’Égypte, depuis la prise du titre de roi par Ptolémée Ier jusqu’à la mort de Cléopâtre."
      pl: "Królestwo króla południa z Dn 11, rozumiane jako państwo Ptolemeuszów w Egipcie, od przyjęcia przez Ptolemeusza I tytułu króla do śmierci Kleopatry."
      it: "Il regno del sud di Daniele 11, inteso come il regno tolemaico d’Egitto, dall’assunzione del titolo di re da parte di Tolomeo I alla morte di Cleopatra."
      nl: "Het koninkrijk van het zuiden uit Daniël 11, opgevat als het Ptolemaeïsche koninkrijk Egypte, van de aanname van de koningstitel door Ptolemaeus I tot de dood van Cleopatra."
      cs: "Jižní království z Daniela 11, vykládané jako ptolemaiovské království Egypta, od přijetí královského titulu Ptolemaiem I. po smrt Kleopatry."
      sv: "Söderlandets rike i Daniel 11, tolkat som det ptolemaiska riket Egypten, från det att Ptolemaios I tog kungatiteln till Kleopatras död."
      nb: "Sørkongens rike i Daniel 11, forstått som ptolemeernes rike i Egypt, fra Ptolemaios I's overtakelse av kongetittelen til Kleopatras død."
      tl: "Ang kaharian sa timog ng Daniel 11, na binabasa bilang Kahariang Ptolemaico ng Egipto, mula sa pagkuha ni Ptolomeo I ng titulong hari hanggang sa kamatayan ni Cleopatra."
      da: "Det sydlige rige i Daniel 11, forstået som det ptolemæiske rige i Egypten, fra Ptolemaios 1.s antagelse af kongetitlen til Kleopatras død."
      sr: "Јужно царство из Данила 11, схваћено као птолемејско краљевство Египта, од тренутка кад Птолемеј I узима титулу краља до Клеопатрине смрти."
    sources:
