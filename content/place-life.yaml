      - "Jewish Telegraphic Agency, 'Find Relics of 2,100 Years of Life at Beth Zur', 12 July 1931"
      - "Encyclopaedia Judaica, 'Beth-Zur' (the Byzantine town at Burj es-Sur), on encyclopedia.com"

  # ---------- batch life 4 (fill) ----------
  - id: a5947d7
    en: Tamar
    # Why firm: the point stands for En Hazeva (92 %). The excavators (Cohen and Yisrael)
    # found no stratum between the last Iron Age fortress (Stratum 4, 7th-6th c. BC) and
    # the Nabataean way-station (Stratum 3): Persian and Hellenistic layers are absent, so
    # the mound lay empty for some five centuries. Start: Cohen dates the end of Stratum 4
    # to "about the same time as the First Temple (586 BC)"; the smashed cult vessels of
    # the Edomite shrine he puts earlier, at Josiah's reform (c. 621 BC), so "c." is
    # needed (Ben-Ami et al. 2024 and Ben-Ami, Tel Aviv 53, 2026, re-date the earlier Iron
    # Age phases, not this end; the site is still read as abandoned in the early 6th c. BC).
    # End: Cohen gives Stratum 3 as "first-second centuries CE"; Bowman (renewed
    # excavations) has Tamar abandoned after 587 BC and rebuilt under Aretas IV
    # (9 BC - AD 40), Stratum 5 "1st centuries BCE/CE", so "c. AD 1" fits both. Caveat for
    # the reviewer: Ezekiel's border (Ezek 47:19; 48:28, c. 573 BC) names Tamar inside the
    # gap; it is a landmark on the border there, not a living town, so the fade is
    # acceptable but should be known. No tour stop lands on it.
    gap:
      from: "c. 586 BC"
      until: "c. AD 1"
    note:
      en: "The last Iron Age fortress at En Hazeva, with its Edomite shrine, was destroyed at about the time Jerusalem fell, and the mound lay empty through the Persian and Hellenistic periods; the next settlers were Nabataeans, whose way-station of the 1st century BC–1st century AD lies under the Late Roman fort of Thamara."
      ru: "Последняя крепость железного века в Эйн-Хацеве с её едомским святилищем погибла около времени падения Иерусалима, и в персидскую и эллинистическую эпохи холм стоял пустым; следующими здесь поселились набатеи, чья стоянка I в. до н. э. — I в. н. э. лежит под позднеримской крепостью Тамара."
      uk: "Остання залізна фортеця в Ен-Гацеві з едомським святилищем була зруйнована приблизно тоді, коли впав Єрусалим, і пагорб лежав порожній протягом перської й елліністичної доби; наступними поселенцями були набатеї, чий пункт відпочинку I ст. до н. е. — I ст. н. е. лежить під пізньоримським фортом Тамара."
      es: "La última fortaleza de la Edad del Hierro en En Hazeva, con su santuario edomita, fue destruida hacia la época en que cayó Jerusalén, y el montículo quedó vacío durante los períodos persa y helenístico; los siguientes pobladores fueron los nabateos, cuya estación de paso del siglo I a. C. al siglo I d. C. yace bajo el fuerte romano tardío de Tamara."
      pt: "A última fortaleza da Idade do Ferro em En Hazeva, com seu santuário edomita, foi destruída por volta da época da queda de Jerusalém, e o montículo ficou vazio durante os períodos persa e helenístico; os colonos seguintes foram os nabateus, cujo posto de parada dos séculos I a.C.–I d.C. fica sob o forte romano tardio de Tamara."
      de: "Die letzte eisenzeitliche Festung in En Hazeva mit ihrem edomitischen Heiligtum wurde etwa zur Zeit des Falls von Jerusalem zerstört, und der Hügel lag in persischer und hellenistischer Zeit leer; die nächsten Siedler waren Nabatäer, deren Wegstation vom 1. Jahrhundert v. Chr. bis zum 1. Jahrhundert n. Chr. unter dem spätrömischen Fort Thamara liegt."
      fr: "La dernière forteresse de l’âge du fer à En Hazeva, avec son sanctuaire édomite, fut détruite à peu près à l’époque de la chute de Jérusalem, et le tertre resta vide pendant les périodes perse et hellénistique ; les colons suivants furent des Nabatéens, dont le relais du Ier siècle av. J.-C.-Ier siècle ap. J.-C. gît sous le fort du Bas-Empire de Thamara."
    sources:
      - "R. Cohen and Y. Yisrael, 'The Iron Age Fortresses at En Haseva', Biblical Archaeologist 58.4 (1995), strata 6-1"
      - "R. Cohen and Y. Yisrael, 'Smashing the Idols: Piecing Together an Edomite Shrine in Judah', Biblical Archaeology Review 22.4 (1996), pp. 40-51"
      - "C. D. Bowman, 'Biblical Tamar (aka Ein Hazeva): Renewed Excavations 2005-2009', The Bible and Interpretation, Stratum 5"
