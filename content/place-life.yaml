  - id: a55027d
    en: Miletus
    gap:
      from: "494 BC"
      until: "c. 480 BC"
    note:
      en: "Taken by the Persians after the battle of Lade in 494 BC: the men were killed, the women and children enslaved, the city emptied; it was rebuilt on a new plan after the Greek victory at Mycale in 479 BC."
      ru: "Взят персами после битвы при Ладе в 494 г. до н. э.: мужчины перебиты, женщины и дети уведены в рабство, город опустел; отстроен по новому плану после победы греков при Микале в 479 г. до н. э."
      uk: "Здобутий персами після битви при Ладе в 494 р. до н. е.: чоловіків убито, жінок і дітей обернено на рабів, місто спорожніло; відбудований за новим планом після перемоги греків при Мікале в 479 р. до н. е."
      es: "Tomada por los persas tras la batalla de Lade en 494 a. C.: los hombres fueron muertos, las mujeres y los niños esclavizados, la ciudad vaciada; fue reconstruida con un nuevo plano tras la victoria griega en Mícale en 479 a. C."
      pt: "Tomada pelos persas depois da batalha de Lade em 494 a.C.: os homens foram mortos, as mulheres e crianças escravizadas, a cidade esvaziada; foi reconstruída segundo um novo plano após a vitória grega em Micale, em 479 a.C."
      de: "Nach der Schlacht von Lade 494 v. Chr. von den Persern genommen: Die Männer wurden getötet, Frauen und Kinder versklavt, die Stadt entvölkert; nach dem griechischen Sieg bei Mykale 479 v. Chr. wurde sie nach einem neuen Plan wiederaufgebaut."
      fr: "Prise par les Perses après la bataille de Ladé en 494 av. J.-C. : les hommes furent tués, les femmes et les enfants réduits en esclavage, la ville vidée ; elle fut rebâtie sur un plan nouveau après la victoire grecque de Mycale en 479 av. J.-C."
    sources:
      - "Herodotus 6.18-22; 9.104"
      - "Miletus excavations (German Archaeological Institute), Hippodamian plan after 479 BC"
  - id: a2e65fb
    en: Smyrna
    from: "c. 300 BC"
    note:
      en: "The Smyrna of Revelation was built anew on the slopes of Mount Pagos about 300 BC, begun by Antigonus and finished by Lysimachus; the older city had stood across the bay at Bayrakli."
      ru: "Смирна из Откровения была заново построена на склонах горы Пагос около 300 г. до н. э.: начал Антигон, закончил Лисимах; прежний город стоял на другой стороне залива, у Байраклы."
      uk: "Смирну Одкровення побудували заново на схилах гори Пагос близько 300 р. до н. е., почав Антігон, а завершив Лісімах; старіше місто стояло навпроти, через затоку, в Байраклі."
      es: "La Esmirna del Apocalipsis fue edificada de nuevo en las laderas del Monte Pagos hacia 300 a. C., iniciada por Antígono y terminada por Lisímaco; la ciudad más antigua se alzaba al otro lado de la bahía, en Bayrakli."
      pt: "A Esmirna do Apocalipse foi construída de novo nas encostas do monte Pagos por volta de 300 a.C., iniciada por Antígono e concluída por Lisímaco; a cidade mais antiga ficava do outro lado da baía, em Bayrakli."
      de: "Das Smyrna der Offenbarung wurde um 300 v. Chr. an den Hängen des Berges Pagos neu gebaut, von Antigonos begonnen und von Lysimachos vollendet; die ältere Stadt hatte jenseits der Bucht bei Bayrakli gelegen."
      fr: "La Smyrne de l’Apocalypse fut rebâtie sur les pentes du mont Pagos vers 300 av. J.-C., commencée par Antigone et achevée par Lysimaque ; l’ancienne ville se trouvait de l’autre côté du golfe, à Bayraklı."
    sources:
      - "Strabo, Geography 14.1.37"
      - "Pausanias, Description of Greece 7.5.1-3 (ascribes the refoundation to Alexander)"
      - "J. M. Cook, 'Old Smyrna, 1948-1951', Annual of the British School at Athens 53-54 (1958-59)"
  - id: a1e3697
    en: Syracuse
    from: "c. 733 BC"
    note:
      en: "Founded by Corinthian colonists under Archias on the island of Ortygia, after they drove out the Sicels living there; 733 BC is the traditional year."
      ru: "Основаны коринфскими колонистами во главе с Архием на острове Ортигия, откуда они прогнали живших там сикулов; 733 г. до н. э. — традиционный год."
      uk: "Заснована коринфськими колоністами під проводом Архія на острові Ортігія після того, як вони вигнали сікулів, що там жили; 733 р. до н. е. — традиційний рік."
      es: "Fundada por colonos corintios al mando de Arquias en la isla de Ortigia, tras expulsar a los sículos que vivían allí; 733 a. C. es el año tradicional."
      pt: "Fundada por colonos coríntios sob Arquias na ilha de Ortígia, depois de expulsarem os sículos que ali viviam; 733 a.C. é o ano tradicional."
      de: "Von korinthischen Kolonisten unter Archias auf der Insel Ortygia gegründet, nachdem sie die dort lebenden Sikeler vertrieben hatten; 733 v. Chr. ist das traditionelle Jahr."
      fr: "Fondée par des colons corinthiens sous Archias sur l’île d’Ortygie, après qu’ils eurent chassé les Sicules qui y vivaient ; 733 av. J.-C. est l’année traditionnelle."
    sources:
      - "Thucydides 6.3.2"
      - "Eusebius, Chronicle (Jerome's version), Olympiad 11"
  - id: a81cdb5
    en: Cyrene
    from: "c. 631 BC"
    note:
      en: "Founded by settlers from Thera under Battus, who first camped on the island of Platea and at Aziris before moving to the spring of Apollo; the traditional year is 631 BC."
      ru: "Основана поселенцами с Феры во главе с Баттом, которые сперва жили на острове Платея и в Азирисе, а потом перешли к источнику Аполлона; традиционная дата — 631 г. до н. э."
      uk: "Заснована переселенцями з Фери під проводом Батта, які спершу стали табором на острові Платея та в Азірісі, а потім перебралися до джерела Аполлона; традиційний рік — 631 до н. е."
      es: "Fundada por colonos de Tera al mando de Bato, que acamparon primero en la isla de Platea y en Aziris antes de trasladarse a la fuente de Apolo; el año tradicional es 631 a. C."
      pt: "Fundada por colonos de Tera sob Bato, que primeiro acamparam na ilha de Plateia e em Aziris antes de se mudarem para a fonte de Apolo; o ano tradicional é 631 a.C."
      de: "Von Siedlern aus Thera unter Battos gegründet, die zuerst auf der Insel Platea und bei Aziris lagerten, ehe sie zur Quelle des Apollon zogen; das traditionelle Jahr ist 631 v. Chr."
      fr: "Fondée par des colons de Théra sous Battos, qui campèrent d’abord sur l’île de Platée et à Aziris avant de gagner la source d’Apollon ; l’année traditionnelle est 631 av. J.-C."
    sources:
      - "Herodotus 4.150-159"
      - "Supplementum Epigraphicum Graecum 9.3 (the 'Oath of the Settlers' inscription from Cyrene)"
  - id: ac87d4c
    en: Ashkelon
    # Why firm: the start is dated to the month by the Babylonian Chronicle (Kislev of
    # Nebuchadnezzar's first year, 604 BC), and the Leon Levy Expedition found the burnt
    # destruction layer sealed by an abandonment. The end is narrow: the Persian-period
    # rebuilding is dated by its pottery to c. 520-510 BC, i.e. about 80 years of ruin.
    # This is not "destroyed and quickly rebuilt": the excavators speak of a deserted
    # mound for two to three generations. The prophecies of Jer 47, Zeph 2 and Amos 1
    # all fall before 604, so no tour stop should land inside the gap.
    gap:
      from: "604 BC"
      until: "c. 520 BC"
    until: "AD 1270"
    note:
      en: "Taken by Nebuchadnezzar in the month of Kislev 604 BC, plundered and turned into a heap of ruins; the mound lay deserted until a Phoenician town was built there under the Persians, about 520–510 BC. Demolished by Saladin in 1191 and refortified by the Crusaders, it was dismantled by the Mamluk sultan Baybars in 1270, its harbour blocked and its people moved inland to al-Majdal; the site has lain in ruins since."
      ru: "Взят Навуходоносором в месяце Кислеве 604 г. до н. э., разграблен и превращён в груду развалин; холм стоял пустым, пока при персах, около 520–510 гг. до н. э., на нём не построили финикийский город. Разрушенный Саладином в 1191 г. и вновь укреплённый крестоносцами, город в 1270 г. снёс мамлюкский султан Бейбарс: гавань засыпали, жителей перевели вглубь страны, в аль-Маджаль; с тех пор место лежит в руинах."
      uk: "Здобутий Навуходоносором у місяці кіслеві 604 р. до н. е., пограбований і перетворений на купу руїн; пагорб лежав безлюдним, доки за персів, близько 520–510 рр. до н. е., там не збудували фінікійське місто. Зруйнований Саладіном 1191 р. і знову укріплений хрестоносцями, він був розібраний мамлюцьким султаном Бейбарсом 1270 р., його гавань загачено, а жителів переселено вглиб країни до аль-Маджаля; відтоді місце лежить у руїнах."
      es: "Tomada por Nabucodonosor en el mes de Quisleu de 604 a. C., saqueada y convertida en un montón de ruinas; el montículo quedó desierto hasta que hacia 520–510 a. C., bajo los persas, se construyó allí una ciudad fenicia. Demolida por Saladino en 1191 y vuelta a fortificar por los cruzados, fue desmantelada por el sultán mameluco Baibars en 1270, su puerto bloqueado y sus habitantes trasladados tierra adentro, a al-Majdal; el lugar está en ruinas desde entonces."
      pt: "Tomada por Nabucodonosor no mês de Quisleu de 604 a.C., saqueada e reduzida a um monte de ruínas; o montículo ficou deserto até que uma cidade fenícia foi construída ali sob os persas, por volta de 520–510 a.C. Demolida por Saladino em 1191 e refortificada pelos cruzados, foi desmantelada pelo sultão mameluco Baybars em 1270, seu porto bloqueado e seu povo transferido para o interior, para al-Majdal; o sítio está em ruínas desde então."
      de: "Im Monat Kislew des Jahres 604 v. Chr. von Nebukadnezar eingenommen, geplündert und in einen Trümmerhaufen verwandelt; der Hügel lag verlassen, bis unter den Persern, um 520–510 v. Chr., dort eine phönizische Stadt gebaut wurde. 1191 von Saladin abgerissen und von den Kreuzfahrern neu befestigt, wurde sie 1270 vom Mamlukensultan Baibars abgetragen, ihr Hafen versperrt und ihre Bewohner ins Landesinnere nach al-Madschdal umgesiedelt; seither liegt der Ort in Trümmern."
      fr: "Prise par Nebucadnetsar au mois de Kislev 604 av. J.-C., pillée et réduite à un monceau de ruines ; le tertre resta désert jusqu’à ce qu’une ville phénicienne y soit bâtie sous les Perses, vers 520-510 av. J.-C. Démolie par Saladin en 1191 et refortifiée par les croisés, elle fut démantelée par le sultan mamelouk Baybars en 1270, son port comblé et ses habitants déplacés vers l’intérieur, à al-Majdal ; le site est en ruines depuis lors."
    sources:
      - "Babylonian Chronicle ABC 5 (Jerusalem Chronicle), obv. 15-20"
      - "L. E. Stager, D. M. Master and J. D. Schloen, Ashkelon 3: The Seventh Century B.C. (2011)"
      - "L. E. Stager, 'The Fury of Babylon: Ashkelon and the Archaeology of Destruction', Biblical Archaeology Review 22.1 (1996)"
      - "Abu'l-Fida, Taqwim al-buldan (1321), and Ibn Battuta (1355), in G. Le Strange, Palestine under the Moslems (1890), 'Askalan'"
      - "S. Vailhé, 'Ascalon', Catholic Encyclopedia 1 (1907)"
  - id: aa8edd2
    en: Gaza
    # Why firm: Josephus says Jannaeus took Gaza after a year's siege and "utterly
    # overthrew" it (Ant. 13.364; checked on CCEL, Whiston), and that under Gabinius
    # Gaza and the other cities "which had been desolate for a long time" were rebuilt
    # (Ant. 14.88; checked on Wikisource). The fall is usually put in 96 BC (Schürer;
    # Glucker 1987). This is the same Hasmonean-destruction / Pompey / Gabinius pattern
    # as Samaria, and the gap end follows the Samaria entry ("c. 64 BC", the year before
    # Pompey's settlement of 63 BC) so the two read alike. If you prefer the actual
    # rebuilding by Gabinius, use until "c. 58 BC" instead (Gabinius governed Syria
    # 57-55 BC). Caveat for the reviewer: Strabo 16.2.30 calls Gaza "deserted", and some
    # scholars place the Roman city on a new site; Glucker holds that it rose on the old
    # one, so the point is fine. Alexander's capture in 332 BC is NOT a gap: he settled
    # the city again at once (Arrian 2.27.7).
    gap:
      from: "c. 96 BC"
      until: "c. 64 BC"
    note:
      en: "Alexander Jannaeus took Gaza after a year's siege and overthrew it; Pompey freed it from Jewish rule in 63 BC, and Gabinius, governor of Syria, had the long desolate city rebuilt about 57 BC."
      ru: "Александр Яннай после годичной осады взял Газу и разрушил её; в 63 г. до н. э. Помпей освободил её от иудейской власти, а наместник Сирии Габиний около 57 г. до н. э. велел отстроить долго лежавший в запустении город."
      uk: "Александр Яннай здобув Газу після річної облоги й зруйнував її; Помпей звільнив її від юдейської влади в 63 р. до н. е., а Габіній, намісник Сирії, відбудував давно спустошене місто близько 57 р. до н. е."
      es: "Alejandro Janeo tomó Gaza tras un año de asedio y la derribó; Pompeyo la liberó del dominio judío en 63 a. C., y Gabinio, gobernador de Siria, hizo reconstruir hacia 57 a. C. la ciudad, desolada desde hacía mucho."
      pt: "Alexandre Janeu tomou Gaza depois de um cerco de um ano e a derrubou; Pompeu a libertou do domínio judeu em 63 a.C., e Gabínio, governador da Síria, mandou reconstruir a cidade, havia muito desolada, por volta de 57 a.C."
      de: "Alexander Jannäus nahm Gaza nach einjähriger Belagerung ein und stürzte es; Pompeius befreite es 63 v. Chr. von der jüdischen Herrschaft, und Gabinius, der Statthalter von Syrien, ließ die lange verödete Stadt um 57 v. Chr. wiederaufbauen."
      fr: "Alexandre Jannée prit Gaza après un siège d’un an et la renversa ; Pompée la libéra de la domination juive en 63 av. J.-C., et Gabinius, gouverneur de Syrie, fit rebâtir la ville longtemps désolée vers 57 av. J.-C."
    sources:
      - "Josephus, Antiquities 13.358-364; 14.76; 14.88; Jewish War 1.87; 1.156; 1.166"
      - "C. A. M. Glucker, The City of Gaza in the Roman and Byzantine Periods (BAR International Series 325, 1987)"
  # 21 more, added 2026-10-02: drafted for 148 major settlements, then four reviewers opened a
  # page for each kept entry (most places lived on through the period, or are disputed:
  # left out). Zoan stays out: Tanis from c. 1070 BC sits ill with Num 13:22.
  - id: a84f426
    en: City of David
    gap:
      from: "c. 586 BC"
      until: "c. 539 BC"
    note:
      en: "Burnt with the rest of Jerusalem by Nebuchadnezzar's army; the burnt houses were found in Yigal Shiloh's excavations. The exiles returned after the decree of Cyrus in 538 BC."
      ru: "Сгорел вместе со всем Иерусалимом при взятии города войском Навуходоносора; сгоревшие дома открыты раскопками Игаля Шило. Изгнанники вернулись после указа Кира в 538 г. до н. э."
      uk: "Спалений разом з рештою Єрусалима військом Навуходоносора; спалені будинки знайдено в розкопках Ігала Шилоха. Вигнанці повернулися після указу Кіра в 538 р. до н. е."
      es: "Incendiada junto con el resto de Jerusalén por el ejército de Nabucodonosor; las casas quemadas fueron halladas en las excavaciones de Yigal Shiloh. Los desterrados regresaron tras el decreto de Ciro en 538 a. C."
      pt: "Queimada com o resto de Jerusalém pelo exército de Nabucodonosor; as casas queimadas foram encontradas nas escavações de Yigal Shiloh. Os exilados voltaram após o decreto de Ciro em 538 a.C."
      de: "Zusammen mit dem übrigen Jerusalem vom Heer Nebukadnezars verbrannt; die verbrannten Häuser wurden in Yigal Shilohs Ausgrabungen gefunden. Die Verbannten kehrten nach dem Erlass des Kyrus 538 v. Chr. zurück."
      fr: "Incendiée avec le reste de Jérusalem par l’armée de Nebucadnetsar ; les maisons brûlées ont été retrouvées dans les fouilles de Yigal Shiloh. Les exilés revinrent après le décret de Cyrus en 538 av. J.-C."
    sources:
      - "2 Kgs 25:8-10; Ezra 1:1-4"
      - "Y. Shiloh, Excavations at the City of David I, 1978-1982 (Qedem 19, 1984)"
  - id: a3cc590
    en: Lachish
    gap:
      from: "c. 587 BC"
      until: "c. 450 BC"
    until: "c. 150 BC"
    note:
      en: "Burnt by the Babylonians shortly before Jerusalem fell; resettled under the Persians, when the Residency was built, and abandoned in the Hellenistic period."
      ru: "Сожжён вавилонянами незадолго до падения Иерусалима; заново заселён при персах, когда построили «Резиденцию», и оставлен в эллинистический период."
      uk: "Спалений вавилонянами незадовго до падіння Єрусалима; знову заселений за персів, коли збудовано Резиденцію, і покинутий в елліністичну добу."
      es: "Incendiada por los babilonios poco antes de la caída de Jerusalén; repoblada bajo los persas, cuando se construyó la Residencia, y abandonada en época helenística."
      pt: "Queimada pelos babilônios pouco antes da queda de Jerusalém; repovoada sob os persas, quando foi construída a Residência, e abandonada no período helenístico."
      de: "Kurz vor dem Fall Jerusalems von den Babyloniern verbrannt; unter den Persern, als das Residenzgebäude errichtet wurde, wieder besiedelt und in hellenistischer Zeit aufgegeben."
      fr: "Incendiée par les Babyloniens peu avant la chute de Jérusalem ; réoccupée sous les Perses, époque où la Résidence fut bâtie, et abandonnée à l’époque hellénistique."
    sources:
      - "Jer 34:7; Neh 11:30"
      - "Y. Aharoni, Investigations at Lachish: The Sanctuary and the Residency (Lachish V, 1975)"
      - "D. Ussishkin, The Renewed Archaeological Excavations at Lachish (1973-1994) (2004)"
  - id: a6c8205
    en: Bether
    until: "AD 135"
    note:
      en: "Betar, the last stronghold of Bar Kokhba, was taken by Hadrian's army in AD 135."
      ru: "Бейтар, последняя твердыня Бар-Кохбы, взят армией Адриана в 135 г. н. э."
      uk: "Бетар, остання твердиня Бар-Кохби, був здобутий військом Адріана в 135 р. н. е."
      es: "Betar, la última fortaleza de Bar Kojbá, fue tomada por el ejército de Adriano en el 135 d. C."
      pt: "Betar, o último reduto de Bar Kokhba, foi tomada pelo exército de Adriano em 135 d.C."
      de: "Betar, die letzte Festung des Bar Kochba, wurde 135 n. Chr. vom Heer Hadrians eingenommen."
      fr: "Bethar, dernier bastion de Bar Kokhba, fut prise par l’armée d’Hadrien en 135 ap. J.-C."
    sources:
      - "Eusebius, Ecclesiastical History 4.6.3"
      - "Mishnah, Ta'anit 4:6"
  - id: a160272
    en: Tyre
    from: "c. 2750 BC"
    until: "AD 1291"
    note:
      en: "The priests of Melqart told Herodotus that the city and its temple had been founded 2,300 years before his day, about 2750 BC; the deepest levels of the sounding on the island belong to the Early Bronze Age. In 1291, after the fall of Acre, the Mamluk sultan al-Ashraf Khalil took the city, which the Franks had left, and laid it in ruins; it was almost deserted until its revival about 1750."
      ru: "Жрецы Мелькарта сказали Геродоту, что город и храм основаны за 2300 лет до его времени, то есть около 2750 г. до н. э.; самые глубокие слои шурфа на острове относятся к раннему бронзовому веку. В 1291 г., после падения Акры, мамлюкский султан аль-Ашраф Халиль взял оставленный франками город и обратил его в руины; почти пустым он простоял до возрождения около 1750 г."
      uk: "Жерці Мелькарта сказали Геродотові, що місто та його храм було засновано за 2300 років до його часу, близько 2750 р. до н. е.; найглибші шари зондажу на острові належать до раннього бронзового віку. У 1291 р., після падіння Акри, мамлюцький султан аль-Ашраф Халіл здобув місто, яке франки залишили, і зруйнував його; воно майже пустувало аж до відродження близько 1750 р."
      es: "Los sacerdotes de Melqart dijeron a Heródoto que la ciudad y su templo habían sido fundados 2300 años antes de su tiempo, hacia 2750 a. C.; los niveles más profundos del sondeo en la isla pertenecen al Bronce Antiguo. En 1291, tras la caída de Acre, el sultán mameluco al-Ashraf Khalil tomó la ciudad, que los francos habían abandonado, y la dejó en ruinas; quedó casi desierta hasta su resurgimiento hacia 1750."
      pt: "Os sacerdotes de Melqart disseram a Heródoto que a cidade e o seu templo haviam sido fundados 2.300 anos antes do seu tempo, por volta de 2750 a.C.; os níveis mais profundos da sondagem na ilha pertencem à Idade do Bronze Antigo. Em 1291, após a queda de Acre, o sultão mameluco al-Ashraf Khalil tomou a cidade, que os francos haviam deixado, e a reduziu a ruínas; ficou quase deserta até o seu renascimento por volta de 1750."
      de: "Die Priester des Melkart erzählten Herodot, die Stadt und ihr Tempel seien 2300 Jahre vor seiner Zeit gegründet worden, um 2750 v. Chr.; die tiefsten Schichten der Sondage auf der Insel gehören zur Frühbronzezeit. 1291, nach dem Fall von Akkon, nahm der Mamlukensultan al-Aschraf Chalil die Stadt, welche die Franken verlassen hatten, und legte sie in Trümmer; sie war fast verlassen, bis sie um 1750 wiederauflebte."
      fr: "Les prêtres de Melqart dirent à Hérodote que la ville et son temple avaient été fondés 2 300 ans avant son époque, vers 2750 av. J.-C. ; les niveaux les plus profonds du sondage sur l’île appartiennent au Bronze ancien. En 1291, après la chute d’Acre, le sultan mamelouk al-Ashraf Khalil prit la ville, que les Francs avaient quittée, et la mit en ruines ; elle resta presque déserte jusqu’à son renouveau vers 1750."
    sources:
      - "Herodotus 2.44"
      - "P. M. Bikai, The Pottery of Tyre (1978)"
      - "Abu'l-Fida, Taqwim al-buldan (1321), al-Dimashqi, and Ibn Battuta (1355), in G. Le Strange, Palestine under the Moslems (1890), 'Sur'"
      - "S. Vailhé, 'Tyre', Catholic Encyclopedia 15 (1912)"
  - id: a80d317
    en: Tirzah
    until: "c. 600 BC"
    note:
      en: "Tell el-Far'ah (North), a royal city of the northern kingdom until Omri moved to Samaria; after the Assyrian conquest the town declined and was abandoned about 600 BC."
      ru: "Телль-эль-Фараа (Северный) — царский город Северного царства, пока Амврий не перенёс столицу в Самарию; после ассирийского завоевания город пришёл в упадок и около 600 г. до н. э. был оставлен."
      uk: "Тель-ель-Фара (Північний), царське місто північного царства, поки Омрі не переніс столицю до Самарії; після ассирійського завоювання місто занепало й було покинуте близько 600 р. до н. е."
      es: "Tell el-Far'ah (Norte), ciudad real del reino del norte hasta que Omri se trasladó a Samaria; tras la conquista asiria la ciudad decayó y fue abandonada hacia 600 a. C."
      pt: "Tell el-Far'ah (Norte), cidade real do reino do norte até que Onri se mudou para Samaria; após a conquista assíria a cidade declinou e foi abandonada por volta de 600 a.C."
      de: "Tell el-Far'a (Nord), eine Königsstadt des Nordreichs, bis Omri seinen Sitz nach Samaria verlegte; nach der assyrischen Eroberung verfiel die Stadt und wurde um 600 v. Chr. aufgegeben."
      fr: "Tell el-Far‘ah (nord), ville royale du royaume du nord jusqu’à ce qu’Omri transfère la capitale à Samarie ; après la conquête assyrienne, la ville déclina et fut abandonnée vers 600 av. J.-C."
    sources:
      - "1 Kgs 14:17; 15:33; 16:23-24"
      - "R. de Vaux, excavations at Tell el-Far'ah (North), 1946-1960 (NEAEHL, 'Far'ah, Tell el- (North)')"
  - id: a8554e3
    en: Megiddo
    until: "c. 350 BC"
    note:
      en: "The last town on the mound (Stratum I) belonged to the Persian period; after it the tell was abandoned, and the Roman legion later camped at Legio nearby."
      ru: "Последний город на холме (слой I) относился к персидскому времени; после него холм был оставлен, а позже неподалёку, в Легио, стоял римский легион."
      uk: "Останнє місто на пагорбі (шар I) належало до перської доби; після нього тель покинули, а римський легіон пізніше стояв табором неподалік, у Легіо."
      es: "La última ciudad sobre el montículo (Estrato I) pertenecía al período persa; después el tell fue abandonado, y la legión romana acampó más tarde en las cercanías, en Legio."
      pt: "A última cidade sobre o montículo (Estrato I) pertenceu ao período persa; depois dela o tell foi abandonado, e a legião romana acampou mais tarde nas proximidades, em Legio."
      de: "Die letzte Stadt auf dem Hügel (Stratum I) gehörte in die persische Zeit; danach wurde der Tell aufgegeben, und die römische Legion lagerte später im nahen Legio."
      fr: "La dernière ville sur le tertre (strate I) appartenait à l’époque perse ; après elle, le tell fut abandonné, et la légion romaine campa plus tard à Legio, tout près."
    sources:
      - "R. S. Lamon and G. M. Shipton, Megiddo I: Seasons of 1925-34, Strata I-V (1939)"
      - "Megiddo excavations (NEAEHL, 'Megiddo')"
  - id: abc2af0
    en: Ptolemais
    until: "AD 1291"
    note:
      en: "The last Crusader stronghold, taken by the Mamluk sultan al-Ashraf Khalil in 1291 and razed on purpose so that the Franks could not use it again; it lay in ruins until the Ottoman revival of the 18th century."
      ru: "Последний оплот крестоносцев: в 1291 г. его взял мамлюкский султан аль-Ашраф Халиль и намеренно сровнял с землёй, чтобы франки не смогли им снова воспользоваться; город лежал в руинах до османского возрождения XVIII в."
      uk: "Остання твердиня хрестоносців, здобута мамлюцьким султаном аль-Ашрафом Халілом у 1291 р. і навмисно зрівняна з землею, щоб франки не могли нею скористатися; лежала в руїнах до османського відродження XVIII ст."
      es: "La última fortaleza cruzada, tomada por el sultán mameluco al-Ashraf Khalil en 1291 y arrasada a propósito para que los francos no pudieran volver a usarla; quedó en ruinas hasta el resurgimiento otomano del siglo XVIII."
      pt: "O último reduto cruzado, tomado pelo sultão mameluco al-Ashraf Khalil em 1291 e arrasado de propósito para que os francos não pudessem usá-lo de novo; permaneceu em ruínas até o renascimento otomano do século XVIII."
      de: "Die letzte Kreuzfahrerfestung, 1291 vom Mamlukensultan al-Aschraf Chalil eingenommen und absichtlich dem Erdboden gleichgemacht, damit die Franken sie nicht nutzen konnten; sie lag in Trümmern bis zur osmanischen Wiederbelebung im 18. Jahrhundert."
      fr: "Dernier bastion croisé, pris par le sultan mamelouk al-Ashraf Khalil en 1291 et rasé délibérément pour que les Francs ne puissent plus s’en servir ; elle resta en ruines jusqu’au renouveau ottoman du XVIIIe siècle."
    sources:
      - "Abu'l-Fida, al-Mukhtasar fi akhbar al-bashar, year 690 AH"
      - "The Templar of Tyre, Gestes des Chiprois, on the fall of Acre"
  - id: af75e9e
    en: Magdala
    from: "c. 100 BC"
    note:
      en: "Excavations at Migdal show that the town on the Sea of Galilee was founded in the Hasmonean period, between the 2nd and 1st centuries BC; as Taricheae it was already a town when Cassius took it about 52 BC."
      ru: "Раскопки в Мигдале показали, что город на берегу Галилейского моря возник в хасмонейский период, между II и I вв. до н. э.; под именем Тарихея он уже был городом, когда его взял Кассий около 52 г. до н. э."
      uk: "Розкопки в Мігдалі показують, що містечко на Галілейському морі було засноване за хасмонейської доби, між II і I ст. до н. е.; як Тарихея воно вже було містом, коли Кассій здобув його близько 52 р. до н. е."
      es: "Las excavaciones de Magdala muestran que la ciudad junto al Mar de Galilea fue fundada en época asmonea, entre los siglos II y I a. C.; como Tariquea ya era una ciudad cuando Casio la tomó hacia 52 a. C."
      pt: "As escavações em Migdal mostram que a cidade no Mar da Galileia foi fundada no período hasmoneu, entre os séculos II e I a.C.; como Tariqueia, já era uma cidade quando Cássio a tomou por volta de 52 a.C."
      de: "Ausgrabungen in Migdal zeigen, dass die Stadt am See Genezareth in der hasmonäischen Zeit gegründet wurde, zwischen dem 2. und dem 1. Jahrhundert v. Chr.; als Tarichea war sie bereits eine Stadt, als Cassius sie um 52 v. Chr. einnahm."
      fr: "Les fouilles de Migdal montrent que la ville au bord de la Mer de Galilée fut fondée à l’époque hasmonéenne, entre le IIe et le Ier siècle av. J.-C. ; sous le nom de Tarichées, c’était déjà une ville quand Cassius la prit vers 52 av. J.-C."
    sources:
      - "D. Avshalom-Gorni, 'Migdal', Hadashot Arkheologiyot 121 (2009)"
      - "Josephus, Antiquities 14.120; Jewish War 1.180"
  - id: a6d9af3
    en: Haran
    until: "AD 1271"
    note:
      en: "Harran lived on through the Roman and Islamic periods; in 1271 the Mongol Ilkhanids deported its people to Mardin and Mosul and the city was left in ruins, with only a village by the castle afterwards."
      ru: "Харран пережил римскую и исламскую эпохи; в 1271 г. монголы-Хулагуиды выселили его жителей в Мардин и Мосул, и город остался в развалинах — позже у крепости была лишь деревня."
      uk: "Харан жив і в римську, й ісламську добу; у 1271 р. монгольські ільхани виселили його жителів до Мардіна й Мосула, і місто лишилося в руїнах, а потім біля замку було лише село."
      es: "Harán sobrevivió durante los períodos romano e islámico; en 1271 los ilcanes mongoles deportaron a su gente a Mardin y Mosul y la ciudad quedó en ruinas, con solo una aldea junto al castillo después."
      pt: "Harã sobreviveu nos períodos romano e islâmico; em 1271 os ilcânidas mongóis deportaram o seu povo para Mardin e Mossul, e a cidade foi deixada em ruínas, com apenas uma aldeia junto ao castelo depois disso."
      de: "Harran bestand durch die römische und die islamische Zeit fort; 1271 deportierten die mongolischen Ilchane seine Bewohner nach Mardin und Mossul, und die Stadt blieb in Trümmern, danach gab es nur noch ein Dorf bei der Burg."
      fr: "Haran subsista pendant les périodes romaine et islamique ; en 1271, les Ilkhans mongols déportèrent sa population à Mardin et à Mossoul, et la ville fut laissée en ruines, avec seulement un village près du château par la suite."
    sources:
      - "D. S. Rice, 'Medieval Harran: Studies on its Topography and Monuments, I', Anatolian Studies 2 (1952)"
  - id: a874951
    en: Asshur
    # Gap removed: the city was sacked in 614 BC but not emptied (Achaemenid-period
    # occupation, Cyrus Cylinder); the Parthian town is the last life. The sack is by
    # Ardashir I, so it cannot be later than his death in 242 (Wikipedia's "c. 257" clashes).
    until: "c. AD 240"
    note:
      en: "Sacked by the Medes in 614 BC, Assur lived on as a small town and flourished again under the Parthians; it was destroyed by the Sasanians about AD 240, and only a scattered village remained."
      ru: "Разграбленный мидянами в 614 г. до н. э., Ашшур продолжил жить небольшим городом и вновь расцвёл при парфянах; около 240 г. н. э. его разрушили Сасаниды, и от него осталась лишь редкая деревня."
      uk: "Здобутий мідянами в 614 р. до н. е., Ашшур залишився малим містом і знову розквітнув за парфян; його зруйнували Сасаніди близько 240 р. н. е., і лишилося лише розсіяне село."
      es: "Saqueada por los medos en 614 a. C., Assur sobrevivió como una pequeña ciudad y volvió a florecer bajo los partos; fue destruida por los sasánidas hacia 240 d. C., y solo quedó una aldea dispersa."
      pt: "Saqueada pelos medos em 614 a.C., Assur sobreviveu como pequena cidade e floresceu de novo sob os partas; foi destruída pelos sassânidas por volta de 240 d.C., e restou apenas uma aldeia dispersa."
      de: "Von den Medern 614 v. Chr. geplündert, bestand Assur als kleine Stadt fort und blühte unter den Parthern wieder auf; um 240 n. Chr. wurde es von den Sassaniden zerstört, und nur ein verstreutes Dorf blieb."
      fr: "Pillée par les Mèdes en 614 av. J.-C., Assour subsista comme petite ville et refleurit sous les Parthes ; elle fut détruite par les Sassanides vers 240 ap. J.-C., et il n’en resta qu’un village dispersé."
    sources:
      - "Babylonian Chronicle ABC 3 (Fall of Nineveh Chronicle)"
      - "W. Andrae, Das wiedererstandene Assur (1938)"
  - id: a5db1a6
    en: Erech
    until: "c. AD 700"
    note:
      en: "Uruk lived on through the Seleucid and Parthian periods and was mostly empty by AD 300; a small community, probably Mandaean, stayed on until it was finally abandoned around the time of the Islamic conquest."
      ru: "Урук пережил селевкидскую и парфянскую эпохи и к 300 г. н. э. почти опустел; небольшая община, вероятно мандейская, оставалась там до окончательного запустения около времени арабского завоевания."
      uk: "Урук жив і в селевкідську, й парфянську добу, а до 300 р. н. е. здебільшого спорожнів; невелика громада, імовірно мандейська, залишалася, доки місце було остаточно покинуте близько часу ісламського завоювання."
      es: "Uruk sobrevivió durante los períodos seléucida y parto y estaba en su mayor parte vacía hacia 300 d. C.; una pequeña comunidad, probablemente mandea, permaneció hasta que fue abandonada definitivamente hacia la época de la conquista islámica."
      pt: "Uruk sobreviveu nos períodos selêucida e parta e estava em grande parte vazia por volta de 300 d.C.; uma pequena comunidade, provavelmente mandeia, permaneceu até ser finalmente abandonada na época da conquista islâmica."
      de: "Uruk bestand durch die seleukidische und die parthische Zeit fort und war um 300 n. Chr. größtenteils leer; eine kleine Gemeinde, wahrscheinlich mandäisch, blieb, bis es um die Zeit der islamischen Eroberung endgültig aufgegeben wurde."
      fr: "Uruk subsista pendant les périodes séleucide et parthe et était en grande partie vide vers 300 ap. J.-C. ; une petite communauté, probablement mandéenne, y resta jusqu’à son abandon définitif vers l’époque de la conquête islamique."
    sources:
      - "Ausgrabungen in Uruk-Warka, Endberichte (German Archaeological Institute)"
  - id: aa01373
    en: Ur
    until: "c. 500 BC"
    note:
      en: "Ur was restored by Nabonidus but declined after the Persian conquest and was no longer inhabited by the early 5th century BC, probably as the Euphrates shifted its course."
      ru: "Ур восстановлен Набонидом, но после персидского завоевания пришёл в упадок и к началу V в. до н. э. опустел — вероятно, из-за того, что Евфрат сменил русло."
      uk: "Ур було відновлено Набонідом, але після перського завоювання він занепав і на початку V ст. до н. е. вже не був заселений, імовірно, через зміну русла Євфрату."
      es: "Ur fue restaurada por Nabónido, pero decayó tras la conquista persa y ya no estaba habitada a principios del siglo V a. C., probablemente porque el Éufrates cambió su curso."
      pt: "Ur foi restaurada por Nabonido, mas declinou após a conquista persa e já não era habitada no início do século V a.C., provavelmente porque o Eufrates mudou de curso."
      de: "Ur wurde von Nabonid wiederhergestellt, ging aber nach der persischen Eroberung zurück und war seit dem frühen 5. Jahrhundert v. Chr. nicht mehr bewohnt, wahrscheinlich weil der Euphrat seinen Lauf verlegte."
      fr: "Ur fut restaurée par Nabonide mais déclina après la conquête perse et n’était plus habitée au début du Ve siècle av. J.-C., probablement parce que l’Euphrate avait changé de cours."
    sources:
      - "C. L. Woolley, Ur Excavations IX: The Neo-Babylonian and Persian Periods (1962)"
  - id: a4c6f72
    en: Eridu
    until: "c. 600 BC"
    note:
      en: "Eridu dwindled after the Old Babylonian period; Nebuchadnezzar II still built there, but the site was abandoned soon after."
      ru: "Эриду пришёл в упадок после старовавилонского периода; Навуходоносор II ещё строил там, но вскоре место было оставлено."
      uk: "Еріду занепав після старовавилонської доби; Навуходоносор II ще будував там, але місце невдовзі покинули."
      es: "Eridu decayó tras el período paleobabilónico; Nabucodonosor II aún construyó allí, pero el lugar fue abandonado poco después."
      pt: "Eridu definhou após o período paleobabilônico; Nabucodonosor II ainda construiu ali, mas o sítio foi abandonado pouco depois."
      de: "Eridu schwand nach der altbabylonischen Zeit dahin; Nebukadnezar II. baute dort noch, aber der Ort wurde bald danach aufgegeben."
      fr: "Éridou dépérit après la période paléo-babylonienne ; Nebucadnetsar II y bâtit encore, mais le site fut abandonné peu après."
    sources:
      - "F. Safar, M. A. Mustafa and S. Lloyd, Eridu (1981)"
  - id: a8ec269
    en: Memphis
    from: "c. 3100 BC"
    note:
      en: "Tradition credits Menes, the first king of united Egypt, with founding the city; the year is conventional."
      ru: "Предание приписывает основание города Менесу, первому царю объединённого Египта; год условный."
      uk: "Переказ приписує заснування міста Менесові, першому царю об’єднаного Єгипту; цей рік умовний."
      es: "La tradición atribuye a Menes, el primer rey del Egipto unificado, la fundación de la ciudad; el año es convencional."
      pt: "A tradição atribui a fundação da cidade a Menés, o primeiro rei do Egito unificado; o ano é convencional."
      de: "Der Überlieferung nach gründete Menes, der erste König des vereinten Ägypten, die Stadt; das Jahr ist konventionell."
      fr: "La tradition attribue la fondation de la ville à Ménès, premier roi de l’Égypte unifiée ; l’année est conventionnelle."
    sources:
      - "Herodotus 2.99"
  - id: adb008c
    en: Tahpanhes
    from: "c. 664 BC"
    note:
      en: "Daphnae (Tell Defenneh) was a frontier fortress founded under Psamtik I to guard Egypt's eastern border against the Arabians and Assyrians."
      ru: "Дафны (Телль-Дефенне) — пограничная крепость, основанная при Псамметихе I для защиты восточной границы Египта от арабов и ассирийцев."
      uk: "Дафні (Тель-Дефенна) була прикордонною фортецею, заснованою за Псамметіха I для охорони східного кордону Єгипту від аравійців та ассирійців."
      es: "Dafne (Tell Defenneh) fue una fortaleza fronteriza fundada bajo Psamético I para proteger la frontera oriental de Egipto contra los árabes y los asirios."
      pt: "Dafne (Tell Defenneh) era uma fortaleza de fronteira fundada sob Psamético I para guardar a fronteira oriental do Egito contra os árabes e os assírios."
      de: "Daphnae (Tell Defenne) war eine Grenzfestung, die unter Psammetich I. gegründet wurde, um Ägyptens Ostgrenze gegen Araber und Assyrer zu schützen."
      fr: "Daphné (Tell Defenneh) était une forteresse frontière fondée sous Psammétique Ier pour garder la frontière orientale de l’Égypte contre les Arabes et les Assyriens."
    sources:
      - "Herodotus 2.30"
      - "W. M. F. Petrie, Tanis II: Nebesheh and Defenneh (1888)"
      - "F. Leclère and A. J. Spencer, Tell Dafana Reconsidered: The Archaeology of an Egyptian Frontier Town (British Museum, 2014)"
  - id: aa56bd1
    en: Carthage
    # `until` removed: Arab-period occupation of the town after 698 is attested archaeologically.
    from: "c. 814 BC"
    gap:
      from: "146 BC"
      until: "45 BC"
    note:
      en: "Founded by Tyrians, traditionally in 814 BC; razed by Scipio Aemilianus in 146 BC and refounded as a Roman colony by Julius Caesar, settled under Augustus. Taken by the Arabs in 698, it shrank to a small town beside the new Tunis."
      ru: "Основан тирийцами, по преданию в 814 г. до н. э.; разрушен Сципионом Эмилианом в 146 г. до н. э. и заново основан как римская колония Юлием Цезарем, а заселён при Августе. Взятый арабами в 698 г., он сжался до небольшого городка рядом с новым Тунисом."
      uk: "Заснований тирянами, за переказом, у 814 р. до н. е.; зруйнований Сципіоном Емілієм у 146 р. до н. е. й заново заснований як римська колонія Юлієм Цезарем, заселений за Августа. Здобутий арабами 698 р., він зменшився до невеликого міста поряд із новим Тунісом."
      es: "Fundada por tirios, tradicionalmente en 814 a. C.; arrasada por Escipión Emiliano en 146 a. C. y refundada como colonia romana por Julio César, poblada bajo Augusto. Tomada por los árabes en 698, quedó reducida a una pequeña ciudad junto a la nueva Túnez."
      pt: "Fundada por tírios, tradicionalmente em 814 a.C.; arrasada por Cipião Emiliano em 146 a.C. e refundada como colônia romana por Júlio César, povoada sob Augusto. Tomada pelos árabes em 698, reduziu-se a uma pequena cidade ao lado da nova Túnis."
      de: "Von Tyrern gegründet, der Überlieferung nach 814 v. Chr.; 146 v. Chr. von Scipio Aemilianus dem Erdboden gleichgemacht und von Julius Caesar als römische Kolonie neu gegründet, unter Augustus besiedelt. 698 von den Arabern genommen, schrumpfte es zu einer kleinen Stadt neben dem neuen Tunis."
      fr: "Fondée par des Tyriens, traditionnellement en 814 av. J.-C. ; rasée par Scipion Émilien en 146 av. J.-C. et refondée comme colonie romaine par Jules César, peuplée sous Auguste. Prise par les Arabes en 698, elle se réduisit à une petite ville à côté de la nouvelle Tunis."
    sources:
      - "Timaeus in Dionysius of Halicarnassus, Roman Antiquities 1.74.1"
      - "Appian, Punic Wars 127-136"
  - id: a6c704a
    en: Antioch
    from: "c. 280 BC"
    note:
      en: "Pisidian Antioch was founded by a Seleucid king, most likely Antiochus I, with settlers from Magnesia on the Maeander; Augustus made it a Roman colony."
      ru: "Антиохия Писидийская основана селевкидским царём, скорее всего Антиохом I, с поселенцами из Магнесии на Меандре; Август сделал её римской колонией."
      uk: "Антіохію Пісідійську заснував селевкідський цар, найімовірніше Антіох I, з поселенцями з Магнесії на Меандрі; Август зробив її римською колонією."
      es: "Antioquía de Pisidia fue fundada por un rey seléucida, muy probablemente Antíoco I, con colonos de Magnesia del Meandro; Augusto la hizo colonia romana."
      pt: "Antioquia da Pisídia foi fundada por um rei selêucida, muito provavelmente Antíoco I, com colonos de Magnésia do Meandro; Augusto a tornou colônia romana."
      de: "Das pisidische Antiochia wurde von einem seleukidischen König, höchstwahrscheinlich Antiochos I., mit Siedlern aus Magnesia am Mäander gegründet; Augustus machte es zur römischen Kolonie."
      fr: "Antioche de Pisidie fut fondée par un roi séleucide, très probablement Antiochus Ier, avec des colons de Magnésie du Méandre ; Auguste en fit une colonie romaine."
    sources:
      - "Strabo, Geography 12.8.14"
  - id: a4488e9
    en: Puteoli
    from: "c. 531 BC"
    note:
      en: "Founded as Dicaearchia, a harbour of Cumae settled by exiles from Samos (Eusebius dates them a few years later, 521 BC); it became the Roman colony of Puteoli in 194 BC."
      ru: "Основан как Дикеархия, гавань Кум, заселённая изгнанниками с Самоса (Евсевий относит их приход к 521 г. до н. э.); в 194 г. до н. э. стал римской колонией Путеолы."
      uk: "Заснована як Дікеархія, гавань Кум, заселена вигнанцями з Самосу (Євсевій датує їх на кілька років пізніше, 521 р. до н. е.); у 194 р. до н. е. стала римською колонією Путеолі."
      es: "Fundada como Dicearquía, puerto de Cumas poblado por desterrados de Samos (Eusebio los fecha unos años más tarde, en 521 a. C.); se convirtió en la colonia romana de Puteoli en 194 a. C."
      pt: "Fundada como Dicearquia, um porto de Cumas povoado por exilados de Samos (Eusébio os data poucos anos depois, 521 a.C.); tornou-se a colônia romana de Putéoli em 194 a.C."
      de: "Als Dikaiarchia gegründet, ein Hafen von Cumae, besiedelt von Verbannten aus Samos (Eusebius datiert sie einige Jahre später, 521 v. Chr.); 194 v. Chr. wurde es zur römischen Kolonie Puteoli."
      fr: "Fondée sous le nom de Dicéarchie, port de Cumes peuplé d’exilés de Samos (Eusèbe les date de quelques années plus tard, 521 av. J.-C.) ; elle devint la colonie romaine de Pouzzoles en 194 av. J.-C."
    sources:
      - "Stephanus of Byzantium, Ethnica, s.v. Potioloi"
      - "Eusebius, Chronicle (Jerome's version)"
      - "Strabo, Geography 5.4.6"
      - "Livy 34.45.1"
  - id: a63bb26
    en: Rhegium
    from: "c. 730 BC"
    note:
      en: "Founded by colonists from Chalcis, joined by Messenian refugees, on the Strait of Messina; the year is traditional (730 or 743 BC)."
      ru: "Основан колонистами из Халкиды, к которым присоединились беглецы-мессенцы, на Мессинском проливе; год традиционный (730 или 743 г. до н. э.)."
      uk: "Заснований колоністами з Халкіди, до яких приєдналися месенські втікачі, на Мессінській протоці; рік традиційний (730 або 743 р. до н. е.)."
      es: "Fundada por colonos de Calcis, a los que se unieron refugiados mesenios, en el estrecho de Mesina; el año es tradicional (730 o 743 a. C.)."
      pt: "Fundada por colonos de Cálcis, aos quais se juntaram refugiados messênios, no estreito de Messina; o ano é tradicional (730 ou 743 a.C.)."
      de: "Von Kolonisten aus Chalkis gegründet, zu denen messenische Flüchtlinge stießen, an der Straße von Messina; das Jahr ist überliefert (730 oder 743 v. Chr.)."
      fr: "Fondée par des colons de Chalcis, rejoints par des réfugiés messéniens, sur le détroit de Messine ; l’année est traditionnelle (730 ou 743 av. J.-C.)."
    sources:
      - "Strabo, Geography 6.1.6"
  - id: afa863b
    en: Salamis
    until: "c. AD 650"
    note:
      en: "Rebuilt as Constantia after the earthquakes of the 4th century; abandoned after the Arab raids under Mu'awiya in the 7th century, its people moving to Famagusta."
      ru: "После землетрясений IV в. отстроен как Констанция; оставлен после арабских набегов при Муавии в VII в., жители переселились в Фамагусту."
      uk: "Відбудований як Констанція після землетрусів IV ст.; покинутий після арабських набігів за Муавії в VII ст., а його жителі переселилися до Фамагусти."
      es: "Reconstruida como Constancia tras los terremotos del siglo IV; abandonada tras las incursiones árabes de Muawiya en el siglo VII, sus habitantes se trasladaron a Famagusta."
      pt: "Reconstruída como Constância após os terremotos do século IV; abandonada depois das incursões árabes sob Muáuia no século VII, seu povo mudando-se para Famagusta."
      de: "Nach den Erdbeben des 4. Jahrhunderts als Konstantia wiederaufgebaut; nach den arabischen Überfällen unter Muawiya im 7. Jahrhundert aufgegeben, seine Bewohner zogen nach Famagusta."
      fr: "Rebâtie sous le nom de Constantia après les tremblements de terre du IVe siècle ; abandonnée après les raids arabes sous Moawiya au VIIe siècle, ses habitants gagnant Famagouste."
    sources:
      - "V. Karageorghis, Salamis in Cyprus: Homeric, Hellenistic and Roman (1969)"
  - id: a121d5e
    en: Forum of Appius
    from: "c. 312 BC"
    note:
      en: "A market town on the Via Appia, named after Appius Claudius Caecus, who built the road in 312 BC and is taken to have founded it."
      ru: "Торговое местечко на Аппиевой дороге, названное по Аппию Клавдию Цеку, который проложил её в 312 г. до н. э. и, как считается, основал его."
      uk: "Торговельне містечко на Аппієвій дорозі, назване на честь Аппія Клавдія Цека, який збудував дорогу в 312 р. до н. е. і вважається його засновником."
      es: "Ciudad de mercado de la Vía Apia, llamada así por Apio Claudio el Ciego, que construyó la calzada en 312 a. C. y a quien se considera su fundador."
      pt: "Cidade de mercado na Via Ápia, nomeada em honra de Ápio Cláudio Cego, que construiu a estrada em 312 a.C. e é tido como seu fundador."
      de: "Ein Marktflecken an der Via Appia, benannt nach Appius Claudius Caecus, der die Straße 312 v. Chr. baute und als ihr Gründer gilt."
      fr: "Bourg marchand sur la voie Appienne, nommé d’après Appius Claudius Caecus, qui construisit la route en 312 av. J.-C. et est tenu pour son fondateur."
    sources:
      - "Livy 9.29.6 (the building of the Via Appia)"
      - "Horace, Satires 1.5.3-6"
      - "Acts 28:15"
  # The cities of the plain, overthrown in Abraham's day (Gen 19:24-29; Deut 29:23). Their
  # date is the Abraham tour's conventional year, not a date: without an end they stood on
  # the map into the Roman age. Their sites are disputed (the map says so).
  - id: a0aa664
    en: Sodom
    until: "c. 1900 BC"
    note:
      en: "Overthrown with Gomorrah in Abraham's day (Gen 19:24-29). The year is the conventional one the map gives Abraham; the age of the patriarchs is disputed."
      ru: "Ниспровергнут вместе с Гоморрой во дни Авраама (Быт 19:24–29). Год условный, тот же, что у Авраама на карте; время патриархов спорно."
      uk: "Зруйнований разом з Гоморрою за днів Авраама (Бут 19:24-29). Рік — умовний, який карта дає Авраамові; вік патріархів є спірним."
      es: "Destruida junto con Gomorra en tiempos de Abraham (Gn 19:24-29). El año es el convencional que el mapa da a Abraham; la edad de los patriarcas es discutida."
      pt: "Destruída com Gomorra nos dias de Abraão (Gn 19:24-29). O ano é o convencional que o mapa dá a Abraão; a idade dos patriarcas é discutida."
      de: "Zusammen mit Gomorra in Abrahams Tagen umgestürzt (1. Mose 19,24–29). Das Jahr ist das konventionelle, das die Karte Abraham gibt; das Zeitalter der Erzväter ist umstritten."
      fr: "Détruite avec Gomorrhe au temps d’Abraham (Gn 19:24-29). L’année est celle que la carte attribue conventionnellement à Abraham ; l’époque des patriarches est débattue."
    sources:
      - "Gen 19:24-29"
      - "Deut 29:23"
