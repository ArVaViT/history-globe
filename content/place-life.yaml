# When places stood as towns (ADR 0003 years; "c." marks an approximate year and is
# kept). `from` is the first year it stood, `until` the last; `gap` gives the first and
# last years it lay in ruins between two lives. Outside those years the map shows the
# place faded, whatever the testament. Every entry cites its sources. Places whose dates
# are disputed (Jericho, Ai, Hazor, Gath) are left out rather than guessed.
places:
  - id: ac9adc9
    en: Tiberias
    from: "c. AD 20"
    note:
      en: "Founded by Herod Antipas on the Sea of Galilee and named after Tiberius."
      ru: "Основана Иродом Антипой на берегу Галилейского моря и названа в честь Тиберия."
      uk: "Заснований Іродом Антипою на Галілейському морі й названий на честь Тиверія."
      es: "Fundada por Herodes Antipas junto al Mar de Galilea y llamada así en honor de Tiberio."
      pt: "Fundada por Herodes Antipas no Mar da Galileia e batizada em honra de Tibério."
      de: "Von Herodes Antipas am See Genezareth gegründet und nach Tiberius benannt."
      fr: "Fondée par Hérode Antipas au bord de la Mer de Galilée et nommée d’après Tibère."
    sources:
      - "Josephus, Antiquities 18.36-38"
  - id: a58735e
    en: Caesarea
    from: "22 BC"
    until: "AD 1265"
    note:
      en: "Built by Herod the Great from 22 BC on the site of Strato's Tower. In 1265 the Mamluk sultan Baybars took the Crusader city and razed it so that the Franks could not use it again; the ruins lay empty for six centuries."
      ru: "Построена Иродом Великим с 22 г. до н. э. на месте Башни Стратона. В 1265 г. мамлюкский султан Бейбарс взял город крестоносцев и сровнял его с землёй, чтобы франки не смогли им снова воспользоваться; руины шесть веков стояли пустыми."
      uk: "Збудована Іродом Великим від 22 р. до н. е. на місці Стратонової вежі. У 1265 р. мамлюцький султан Бейбарс здобув місто хрестоносців і зрівняв його з землею, щоб франки не могли знову ним скористатися; руїни стояли порожні шість століть."
      es: "Construida por Herodes el Grande desde el 22 a. C. en el emplazamiento de la Torre de Estratón. En 1265 el sultán mameluco Baibars tomó la ciudad cruzada y la arrasó para que los francos no pudieran volver a usarla; las ruinas quedaron vacías durante seis siglos."
      pt: "Construída por Herodes, o Grande, a partir de 22 a.C., no local da Torre de Estratão. Em 1265, o sultão mameluco Baybars tomou a cidade cruzada e a arrasou para que os francos não pudessem usá-la de novo; as ruínas ficaram vazias por seis séculos."
      de: "Von Herodes dem Großen ab 22 v. Chr. an der Stelle des Stratonsturms erbaut. 1265 nahm der Mamlukensultan Baibars die Kreuzfahrerstadt ein und machte sie dem Erdboden gleich, damit die Franken sie nicht wieder nutzen konnten; die Ruinen lagen sechs Jahrhunderte lang öde."
      fr: "Construite par Hérode le Grand à partir de 22 av. J.-C. sur le site de la Tour de Straton. En 1265, le sultan mamelouk Baybars prit la ville des croisés et la rasa pour que les Francs ne puissent plus s’en servir ; les ruines restèrent vides pendant six siècles."
    sources:
      - "Josephus, Antiquities 15.331-341; 16.136"
      - "Abu'l-Fida, Taqwim al-buldan (1321), in G. Le Strange, Palestine under the Moslems (1890), p. 475"
      - "Israel Ministry of Foreign Affairs, 'Caesarea' (Archaeology in Israel), on the Jewish Virtual Library"
  - id: a70fd5d
    en: Nineveh
    until: "612 BC"
    note:
      en: "Taken and destroyed by the Babylonians and the Medes in 612 BC; only a small settlement lived on at the site."
      ru: "Взята и разрушена вавилонянами и мидянами в 612 г. до н. э.; на месте города осталось лишь небольшое поселение."
      uk: "Здобутий і зруйнований вавилонянами та мідянами в 612 р. до н. е.; на місці лишилося лише невелике поселення."
      es: "Tomada y destruida por los babilonios y los medos en 612 a. C.; solo un pequeño asentamiento sobrevivió en el lugar."
      pt: "Tomada e destruída pelos babilônios e pelos medos em 612 a.C.; apenas um pequeno povoado sobreviveu no local."
      de: "612 v. Chr. von den Babyloniern und den Medern erobert und zerstört; nur eine kleine Siedlung bestand an der Stelle weiter."
      fr: "Prise et détruite par les Babyloniens et les Mèdes en 612 av. J.-C. ; seule une petite agglomération subsista sur le site."
    sources:
      - "Babylonian Chronicle, ABC 3 (Fall of Nineveh Chronicle)"
  - id: a15257a
    en: Jerusalem
    # The city lived on as Aelia Capitolina after AD 70, so it has no end inside the
    # period; the schema holds one gap, and the exile is the one the map shows.
    gap:
      from: "c. 586 BC"
      until: "c. 539 BC"
    note:
      en: "Burnt by Nebuchadnezzar's army (587 or 586 BC, the year is disputed); the exiles returned under Cyrus in 538 BC. In AD 70 Titus's army destroyed the city and the Temple; a Roman legion camped in the ruins until Aelia Capitolina was built c. AD 130."
      ru: "Сожжён войском Навуходоносора (587 или 586 г. до н. э., год спорный); изгнанники вернулись при Кире в 538 г. до н. э. В 70 г. н. э. город и Храм разрушены войском Тита; в руинах стоял римский легион, пока ок. 130 г. н. э. не построили Элию Капитолину."
      uk: "Спалений військом Навуходоносора (587 або 586 р. до н. е.; рік є спірним); вигнанці повернулися за Кіра в 538 р. до н. е. У 70 р. н. е. військо Тита зруйнувало місто й храм; римський легіон стояв табором серед руїн, доки близько 130 р. н. е. не збудували Елію Капітоліну."
      es: "Incendiada por el ejército de Nabucodonosor (587 o 586 a. C.; el año es discutido); los desterrados regresaron bajo Ciro en 538 a. C. En el 70 d. C. el ejército de Tito destruyó la ciudad y el Templo; una legión romana acampó entre las ruinas hasta que se construyó Aelia Capitolina hacia el 130 d. C."
      pt: "Incendiada pelo exército de Nabucodonosor (587 ou 586 a.C.; o ano é discutido); os exilados voltaram sob Ciro em 538 a.C. Em 70 d.C. o exército de Tito destruiu a cidade e o Templo; uma legião romana acampou nas ruínas até que Aelia Capitolina fosse construída, por volta de 130 d.C."
      de: "Vom Heer Nebukadnezars verbrannt (587 oder 586 v. Chr., das Jahr ist umstritten); die Verbannten kehrten 538 v. Chr. unter Kyrus zurück. Im Jahr 70 n. Chr. zerstörte das Heer des Titus die Stadt und den Tempel; eine römische Legion lag in den Trümmern, bis um 130 n. Chr. Aelia Capitolina erbaut wurde."
      fr: "Incendiée par l’armée de Nebucadnetsar (587 ou 586 av. J.-C., l’année est discutée) ; les exilés revinrent sous Cyrus en 538 av. J.-C. En 70 ap. J.-C., l’armée de Titus détruisit la ville et le temple ; une légion romaine campa dans les ruines jusqu’à la construction d’Aelia Capitolina vers 130 ap. J.-C."
    sources:
      - "2 Kgs 25:8-10; Jer 52:12-14"
      - "Josephus, Jewish War 6.249-266; 7.1-4"
      - "Ezra 1:1-4"
  - id: a041bb3
    en: Samaria
    from: "c. 880 BC"
    gap:
      from: "c. 108 BC"
      until: "c. 64 BC"
    note:
      en: "Built by King Omri on the hill he bought from Shemer; destroyed by John Hyrcanus, given back to its people by Pompey in 63 BC, rebuilt by Gabinius, and later became Herod's Sebaste."
      ru: "Построена царём Амврием на горе, купленной у Семира; разрушена Иоанном Гирканом, возвращена жителям Помпеем в 63 г. до н. э. и отстроена Габинием, а позже стала Севастой Ирода."
      uk: "Збудована царем Омрі на пагорбі, який він купив у Шемера; зруйнована Іоанном Гірканом, повернена її жителям Помпеєм у 63 р. до н. е., відбудована Габінієм, а згодом стала Іродовою Себастою."
      es: "Construida por el rey Omri en el cerro que compró a Semer; destruida por Juan Hircano, devuelta a su pueblo por Pompeyo en 63 a. C., reconstruida por Gabinio, y más tarde se convirtió en la Sebaste de Herodes."
      pt: "Construída pelo rei Onri na colina que comprou de Semer; destruída por João Hircano, devolvida ao seu povo por Pompeu em 63 a.C., reconstruída por Gabínio e, mais tarde, tornou-se a Sebaste de Herodes."
      de: "Von König Omri auf dem Hügel erbaut, den er von Schemer kaufte; von Johannes Hyrkanos zerstört, 63 v. Chr. von Pompeius seinen Einwohnern zurückgegeben, von Gabinius wiederaufgebaut und später zu Herodes' Sebaste."
      fr: "Bâtie par le roi Omri sur la colline qu’il acheta à Schémer ; détruite par Jean Hyrcan, rendue à ses habitants par Pompée en 63 av. J.-C., reconstruite par Gabinius, puis devenue la Sébaste d’Hérode."
    sources:
      - "1 Kgs 16:23-24"
      - "Josephus, Antiquities 13.275-281; 14.75; 14.88"
  - id: ae41ab4
    en: Antioch
    from: "300 BC"
    note:
      en: "Founded by Seleucus I Nicator on the Orontes and named after his father Antiochus."
      ru: "Основана Селевком I Никатором на Оронте и названа в честь его отца Антиоха."
      uk: "Заснована Селевком I Нікатором на Оронті та названа на честь його батька Антіоха."
      es: "Fundada por Seleuco I Nicátor junto al Orontes y llamada así por su padre Antíoco."
      pt: "Fundada por Seleuco I Nicator no Orontes e nomeada em honra de seu pai, Antíoco."
      de: "Von Seleukos I. Nikator am Orontes gegründet und nach seinem Vater Antiochos benannt."
      fr: "Fondée par Séleucos Ier Nicator sur l’Oronte et nommée d’après son père Antiochus."
    sources:
      - "Strabo, Geography 16.2.4"
  - id: afc8e7a
    en: Rome
    from: "c. 753 BC"
    note:
      en: "Varro's traditional date of the founding of Rome; the Palatine was settled from the 10th–9th centuries BC, so the year is conventional."
      ru: "Традиционная дата основания Рима по Варрону; Палатин был заселён с X–IX вв. до н. э., так что год условный."
      uk: "Традиційна дата заснування Рима за Варроном; Палатин був заселений від X–IX ст. до н. е., тож цей рік умовний."
      es: "Fecha tradicional de la fundación de Roma según Varrón; el Palatino estaba poblado desde los siglos X–IX a. C., de modo que el año es convencional."
      pt: "Data tradicional de Varrão para a fundação de Roma; o Palatino foi povoado a partir dos séculos X–IX a.C., de modo que o ano é convencional."
      de: "Das traditionelle Gründungsdatum Roms nach Varro; der Palatin war seit dem 10.–9. Jahrhundert v. Chr. besiedelt, das Jahr ist also konventionell."
      fr: "Date traditionnelle de la fondation de Rome selon Varron ; le Palatin était habité depuis le Xe-IXe siècle av. J.-C., l’année est donc conventionnelle."
    sources:
      - "Varronian era, as in Plutarch, Romulus 12, and Censorinus, De die natali 21"
      - "Dionysius of Halicarnassus, Roman Antiquities 1.74 (gives 752/751 BC)"
  - id: af2161c
    en: Capernaum
    from: "c. 150 BC"
    note:
      en: "The fishing village was founded in the Hasmonean period, in the 2nd century BC."
      ru: "Рыбацкое селение возникло в хасмонейский период, во II в. до н. э."
      uk: "Рибальське село засноване за хасмонейської доби, у II ст. до н. е."
      es: "El pueblo de pescadores fue fundado en época asmonea, en el siglo II a. C."
      pt: "A aldeia de pescadores foi fundada no período hasmoneu, no século II a.C."
      de: "Das Fischerdorf wurde in der hasmonäischen Zeit gegründet, im 2. Jahrhundert v. Chr."
      fr: "Le village de pêcheurs fut fondé à l’époque hasmonéenne, au IIe siècle av. J.-C."
    sources:
      - "Excavations of V. Corbo, S. Loffreda and V. Tzaferis at Capernaum (NEAEHL, 'Capernaum')"
  - id: a3fc47a
    en: Ekron
    until: "c. 604 BC"
    note:
      en: "The city at Tel Miqne burnt in Nebuchadnezzar II's campaign on the Philistine coast and was not rebuilt as a city."
      ru: "Город на Тель-Микне сгорел во время похода Навуходоносора II на филистимское побережье и больше не был отстроен как город."
      uk: "Місто на Тель-Мікне було спалене під час походу Навуходоносора II на філістимське узбережжя й не було відбудоване як місто."
      es: "La ciudad de Tel Miqne fue incendiada en la campaña de Nabucodonosor II en la costa filistea y no volvió a edificarse como ciudad."
      pt: "A cidade em Tel Miqne foi queimada na campanha de Nabucodonosor II contra a costa filisteia e não foi reconstruída como cidade."
      de: "Die Stadt auf Tel Miqne wurde bei Nebukadnezars II. Feldzug an der Philisterküste niedergebrannt und nicht wieder als Stadt aufgebaut."
      fr: "La ville de Tel Miqne fut incendiée lors de la campagne de Nebucadnetsar II sur la côte philistine et ne fut pas rebâtie en tant que ville."
    sources:
      - "Tel Miqne-Ekron excavations, S. Gitin and T. Dothan (NEAEHL, 'Tel Miqne-Ekron')"
  - id: a6f437a
    en: Corinth
    gap:
      from: "146 BC"
      until: "45 BC"
    note:
      en: "Sacked by Lucius Mummius in 146 BC and left desolate until Julius Caesar founded a Roman colony there in 44 BC."
      ru: "Разграблен Луцием Муммием в 146 г. до н. э. и лежал в запустении, пока Юлий Цезарь не основал там римскую колонию в 44 г. до н. э."
      uk: "Зруйнований Луцієм Муммієм у 146 р. до н. е. й залишався безлюдним, доки Юлій Цезар не заснував там римську колонію в 44 р. до н. е."
      es: "Saqueada por Lucio Mumio en 146 a. C. y dejada desolada hasta que Julio César fundó allí una colonia romana en 44 a. C."
      pt: "Saqueada por Lúcio Múmio em 146 a.C. e deixada desolada até que Júlio César fundou ali uma colônia romana em 44 a.C."
      de: "146 v. Chr. von Lucius Mummius geplündert und verwüstet liegen gelassen, bis Julius Caesar dort 44 v. Chr. eine römische Kolonie gründete."
      fr: "Pillée par Lucius Mummius en 146 av. J.-C. et laissée désolée jusqu’à ce que Jules César y fonde une colonie romaine en 44 av. J.-C."
    sources:
      - "Pausanias, Description of Greece 2.1.2"
      - "Strabo, Geography 8.6.23"
  - id: a49e1d0
    en: Philippi
    from: "c. 360 BC"
    note:
      en: "Settled by Thasos as Krenides and refounded by Philip II of Macedon, who named it after himself (356 BC)."
      ru: "Основаны фасосцами под названием Крениды; Филипп II Македонский основал их заново и дал им своё имя (356 г. до н. э.)."
      uk: "Заселений тасосцями як Креніди й заново заснований Пилипом II Македонським, який назвав його своїм ім’ям (356 р. до н. е.)."
      es: "Poblada por colonos de Tasos como Crénides y refundada por Filipo II de Macedonia, que le dio su propio nombre (356 a. C.)."
      pt: "Colonizada por Tasos como Crênides e refundada por Filipe II da Macedônia, que lhe deu o seu próprio nome (356 a.C.)."
      de: "Von Thasos aus als Krenides besiedelt und von Philipp II. von Makedonien neu gegründet, der sie nach sich selbst benannte (356 v. Chr.)."
      fr: "Colonisée par Thasos sous le nom de Crénides et refondée par Philippe II de Macédoine, qui lui donna son propre nom (356 av. J.-C.)."
    sources:
      - "Diodorus Siculus 16.3.7; 16.8.6"
      - "Appian, Civil Wars 4.105"
  - id: afa9d8e
    en: Thessalonica
    from: "c. 315 BC"
    note:
      en: "Founded by Cassander, who joined the towns of Crusis and the Thermaic Gulf and named the city after his wife Thessalonike."
      ru: "Основана Кассандром, объединившим городки Крусиды и Фермейского залива и назвавшим город в честь своей жены Фессалоники."
      uk: "Заснована Кассандром, який об’єднав поселення Крусіс і Термейської затоки й назвав місто на честь своєї дружини Фессалоніки."
      es: "Fundada por Casandro, que reunió las poblaciones de Crusis y del golfo Termaico y dio a la ciudad el nombre de su esposa Tesalónica."
      pt: "Fundada por Cassandro, que reuniu as cidades de Crúsis e do golfo Termaico e deu à cidade o nome de sua esposa, Tessalônice."
      de: "Von Kassander gegründet, der die Siedlungen von Krusis und am Thermaischen Golf vereinte und die Stadt nach seiner Frau Thessalonike benannte."
      fr: "Fondée par Cassandre, qui réunit les bourgades de Crousis et du golfe Thermaïque et nomma la ville d’après son épouse Thessalonikè."
    sources:
      - "Strabo, Geography 7, fr. 21"
  - id: aee7248
    en: Alexandria
    from: "331 BC"
    note:
      en: "Founded by Alexander the Great on the western edge of the Nile delta."
      ru: "Основана Александром Македонским на западном краю дельты Нила."
      uk: "Заснована Александром Великим на західному краю дельти Нілу."
      es: "Fundada por Alejandro Magno en el borde occidental del delta del Nilo."
      pt: "Fundada por Alexandre, o Grande, na margem ocidental do delta do Nilo."
      de: "Von Alexander dem Großen am Westrand des Nildeltas gegründet."
      fr: "Fondée par Alexandre le Grand sur la bordure occidentale du delta du Nil."
    sources:
      - "Arrian, Anabasis 3.1.5-3.2.2"
      - "Plutarch, Alexander 26"
  - id: a6d306d
    en: Seleucia
    from: "300 BC"
    note:
      en: "Founded by Seleucus I and named after himself; it became the seaport of Antioch."
      ru: "Основана Селевком I и названа его именем; стала морской гаванью Антиохии."
      uk: "Заснована Селевком I і названа його іменем; стала морським портом Антіохії."
      es: "Fundada por Seleuco I y llamada así por él mismo; se convirtió en el puerto marítimo de Antioquía."
      pt: "Fundada por Seleuco I e nomeada com o seu próprio nome; tornou-se o porto marítimo de Antioquia."
      de: "Von Seleukos I. gegründet und nach sich selbst benannt; sie wurde zum Seehafen von Antiochia."
      fr: "Fondée par Séleucos Ier et nommée d’après lui-même ; elle devint le port d’Antioche."
    sources:
      - "Strabo, Geography 16.2.4; 16.2.8"
  - id: a83fb1e
    en: Laodicea
    from: "c. 260 BC"
    note:
      en: "Founded by the Seleucid king Antiochus II and named after his wife Laodice."
      ru: "Основана селевкидским царём Антиохом II и названа в честь его жены Лаодики."
      uk: "Заснована селевкідським царем Антіохом II і названа на честь його дружини Лаодіки."
      es: "Fundada por el rey seléucida Antíoco II y llamada así por su esposa Laódice."
      pt: "Fundada pelo rei selêucida Antíoco II e nomeada em honra de sua esposa, Laódice."
      de: "Vom seleukidischen König Antiochos II. gegründet und nach seiner Frau Laodike benannt."
      fr: "Fondée par le roi séleucide Antiochus II et nommée d’après son épouse Laodicé."
    sources:
      - "Pliny, Natural History 5.105 (its earlier names Diospolis and Rhoas only)"
      - "Stephanus of Byzantium, Ethnica, s.v. Laodikeia"
  - id: a4bdea7
    en: Amphipolis
    from: "437 BC"
    note:
      en: "Founded by Athenian colonists under Hagnon on the Strymon, at the place called Nine Ways."
      ru: "Основан афинскими колонистами во главе с Гагноном на Стримоне, в месте, называвшемся Девять Путей."
      uk: "Заснований афінськими колоністами під проводом Гагнона на Стримоні, на місці, що зветься Дев’ять шляхів."
      es: "Fundada por colonos atenienses al mando de Hagnón en el Estrimón, en el lugar llamado Nueve Caminos."
      pt: "Fundada por colonos atenienses sob Hágnon, no Estrimão, no lugar chamado Nove Caminhos."
      de: "Von athenischen Kolonisten unter Hagnon am Strymon gegründet, an dem Ort namens Neun Wege."
      fr: "Fondée par des colons athéniens sous Hagnon sur le Strymon, à l’endroit appelé les Neuf Voies."
    sources:
      - "Thucydides 4.102"
  - id: a91c509
    en: Troas
    from: "c. 310 BC"
    note:
      en: "Founded by Antigonus as Antigonia and renamed Alexandria Troas by Lysimachus."
      ru: "Город основан Антигоном как Антигония и переименован Лисимахом в Александрию Троадскую."
      uk: "Заснована Антігоном як Антігонія й перейменована Лісімахом на Александрію Троаську."
      es: "Fundada por Antígono como Antigonia y rebautizada Alejandría Troas por Lisímaco."
      pt: "Fundada por Antígono como Antigônia e rebatizada Alexandria Trôade por Lisímaco."
      de: "Von Antigonos als Antigoneia gegründet und von Lysimachos in Alexandria Troas umbenannt."
      fr: "Fondée par Antigone sous le nom d’Antigoneia et rebaptisée Alexandria Troas par Lysimaque."
    sources:
      - "Strabo, Geography 13.1.26"
  - id: ae1f807
    en: Calah
    until: "c. 612 BC"
    note:
      en: "Kalhu (Nimrud), long a royal city of Assyria, was sacked by the Medes and Babylonians in the fall of the empire (614–612 BC); only a village later stood on the ruins."
      ru: "Калах (Нимруд), долгое время царский город Ассирии, был разграблен мидянами и вавилонянами при падении царства (614–612 гг. до н. э.); позже на развалинах стояло лишь селение."
      uk: "Калху (Німруд), довго царське місто Ассирії, було зруйноване мідянами й вавилонянами під час падіння імперії (614–612 рр. до н. е.); пізніше на руїнах стояло лише село."
      es: "Cala (Nimrud), durante mucho tiempo ciudad real de Asiria, fue saqueada por los medos y los babilonios en la caída del imperio (614–612 a. C.); después solo hubo una aldea sobre las ruinas."
      pt: "Kalhu (Nimrud), por muito tempo cidade real da Assíria, foi saqueada pelos medos e babilônios na queda do império (614–612 a.C.); depois, apenas uma aldeia se ergueu sobre as ruínas."
      de: "Kalhu (Nimrud), lange eine Königsstadt Assyriens, wurde beim Untergang des Reiches (614–612 v. Chr.) von Medern und Babyloniern geplündert; später stand nur noch ein Dorf auf den Ruinen."
      fr: "Kalhu (Nimroud), longtemps ville royale d’Assyrie, fut pillée par les Mèdes et les Babyloniens lors de la chute de l’empire (614-612 av. J.-C.) ; seul un village s’éleva ensuite sur les ruines."
    sources:
      - "D. Oates and J. Oates, Nimrud: An Assyrian Imperial City Revealed (2001)"
      - "Xenophon, Anabasis 3.4.7 (the deserted city of Larisa)"
  - id: adf74d4
    en: Shechem
    until: "c. 107 BC"
    note:
