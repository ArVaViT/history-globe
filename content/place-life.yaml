  # Daniel 11's "king of the north" and "king of the south": the Seleucid and Ptolemaic
  # kingdoms, as the chapter is read. Named outside their years, they read as realms of
  # Ugarit's or Abraham's day.
  - id: a244929
    en: North
    from: "312 BC"
    until: "63 BC"
    note:
      en: "The kingdom of the north of Daniel 11, read as the Seleucid kingdom, from Seleucus I's return to Babylon to Pompey's annexation of Syria."
      ru: "Царство северного царя из Дан 11, понимаемое как держава Селевкидов: от возвращения Селевка I в Вавилон до присоединения Сирии Помпеем."
      uk: "Північне царство з Книги Даниїла 11, що розуміється як держава Селевкідів, від повернення Селевка I до Вавилона до приєднання Сирії Помпеєм."
      es: "El reino del norte de Daniel 11, entendido como el reino seléucida, desde el regreso de Seleuco I a Babilonia hasta la anexión de Siria por Pompeyo."
      pt: "O reino do norte de Daniel 11, entendido como o reino selêucida, desde o retorno de Seleuco I à Babilônia até a anexação da Síria por Pompeu."
      de: "Das Reich des Nordens aus Daniel 11, gedeutet als das Seleukidenreich, von der Rückkehr Seleukos' I. nach Babylon bis zu Pompeius' Annexion Syriens."
      fr: "Le royaume du nord de Daniel 11, lu comme le royaume séleucide, depuis le retour de Séleucos Ier à Babylone jusqu’à l’annexion de la Syrie par Pompée."
    sources:
      - "Dan 11:5-45"
      - "Babylonian Chronicle of the Diadochi (BM 36313); Appian, Syrian Wars 70"
  - id: a1c0469
    en: South
    from: "305 BC"
    until: "30 BC"
    note:
      en: "The kingdom of the south of Daniel 11, read as the Ptolemaic kingdom of Egypt, from Ptolemy I's taking the title of king to Cleopatra's death."
      ru: "Царство южного царя из Дан 11, понимаемое как Египет Птолемеев: от принятия Птолемеем I царского титула до смерти Клеопатры."
      uk: "Південне царство з Книги Даниїла 11, що розуміється як царство Птолемеїв у Єгипті, від прийняття Птолемеєм I царського титулу до смерті Клеопатри."
      es: "El reino del sur de Daniel 11, entendido como el reino ptolemaico de Egipto, desde que Ptolomeo I tomó el título de rey hasta la muerte de Cleopatra."
      pt: "O reino do sul de Daniel 11, entendido como o reino ptolomaico do Egito, desde a adoção do título de rei por Ptolomeu I até a morte de Cleópatra."
      de: "Das Reich des Südens aus Daniel 11, gedeutet als das ptolemäische Königreich Ägypten, von Ptolemaios' I. Annahme des Königstitels bis zu Kleopatras Tod."
      fr: "Le royaume du sud de Daniel 11, lu comme le royaume ptolémaïque d’Égypte, depuis la prise du titre de roi par Ptolémée Ier jusqu’à la mort de Cléopâtre."
    sources:
      - "Dan 11:5-45"
      - "Plutarch, Antony 85-86; Cassius Dio 51.14"
  - id: a736f6c
    en: Mizpah
    gap:
      from: "c. 3300 BC"
      until: "c. 1200 BC"
    note:
      en: "Tell en-Nasbeh was a small village in the Late Chalcolithic and Early Bronze I periods and then lay empty for some two thousand years, until it was settled again at the start of the Iron Age; the town lived on through the Babylonian and Persian periods, and after the fall of Jerusalem it was the seat of Gedaliah."
      ru: "В позднем халколите и начале раннего бронзового века на Телль-эн-Насбе стояло небольшое селение; затем холм около двух тысяч лет пустовал, пока его вновь не заселили в начале железного века. Город пережил вавилонский и персидский периоды, а после падения Иерусалима здесь была резиденция Годолии."
      uk: "Тель-ен-Насбе було невеликим селом у пізньому халколіті та ранньому бронзовому віці I, а потім майже дві тисячі років лежало порожнім, доки знову не було заселене на початку залізного віку; місто жило і за вавилонської, і за перської доби, а після падіння Єрусалима було резиденцією Гедалії."
      es: "Tell en-Nasbeh fue una pequeña aldea en el Calcolítico Final y el Bronce Antiguo I y luego quedó vacío durante unos dos mil años, hasta que volvió a poblarse al comienzo de la Edad del Hierro; la ciudad sobrevivió durante los períodos babilónico y persa, y tras la caída de Jerusalén fue la sede de Gedalías."
      pt: "Tell en-Nasbeh foi uma pequena aldeia no Calcolítico Tardio e no Bronze Antigo I e depois ficou vazia por cerca de dois mil anos, até ser povoada de novo no início da Idade do Ferro; a cidade sobreviveu nos períodos babilônico e persa e, depois da queda de Jerusalém, foi a sede de Gedalias."
      de: "Tell en-Nasbeh war im Spätchalkolithikum und in der Frühbronzezeit I ein kleines Dorf und lag dann etwa zweitausend Jahre leer, bis es zu Beginn der Eisenzeit wieder besiedelt wurde; die Stadt bestand durch die babylonische und die persische Zeit fort, und nach dem Fall Jerusalems war sie der Sitz Gedaljas."
      fr: "Tell en-Nasbeh fut un petit village au Chalcolithique final et au Bronze ancien I, puis resta vide pendant quelque deux mille ans, jusqu’à une nouvelle occupation au début de l’âge du fer ; la ville subsista pendant les périodes babylonienne et perse, et après la chute de Jérusalem elle fut le siège de Guedalia."
    sources:
      - "J. R. Zorn, 'Tell en-Nasbeh', in E. Stern (ed.), NEAEHL 3 (1993), pp. 1098-1102"
      - "Badè Museum of Biblical Archaeology, 'Tell en-Nasbeh' data publication (Open Context), strata 5-1"
      - "2 Kgs 25:23; Jer 40:6"
  - id: a30c937
    en: Ashdod
    from: "c. 1650 BC"
    note:
      en: "Moshe Dothan's excavations found that the first town on Tel Ashdod was a fortified Canaanite city of the 17th century BC; it later became one of the five cities of the Philistines."
      ru: "Раскопки Моше Дотана показали, что первым городом на Тель-Ашдоде был укреплённый ханаанейский город XVII в. до н. э.; позже он стал одним из пяти филистимских городов."
      uk: "Розкопки Моше Дотана показали, що перше місто на Тель-Ашдоді було укріпленим ханаанським містом XVII ст. до н. е.; пізніше воно стало одним із п’яти міст філістимлян."
      es: "Las excavaciones de Moshe Dothan hallaron que la primera ciudad de Tel Asdod fue una ciudad cananea fortificada del siglo XVII a. C.; más tarde se convirtió en una de las cinco ciudades de los filisteos."
      pt: "As escavações de Moshe Dothan mostraram que a primeira cidade em Tel Asdode era uma cidade cananeia fortificada do século XVII a.C.; mais tarde tornou-se uma das cinco cidades dos filisteus."
      de: "Moshe Dothans Ausgrabungen ergaben, dass die erste Stadt auf Tel Aschdod eine befestigte kanaanäische Stadt des 17. Jahrhunderts v. Chr. war; später wurde sie eine der fünf Städte der Philister."
      fr: "Les fouilles de Moshe Dothan ont montré que la première ville de Tel Asdod était une cité cananéenne fortifiée du XVIIe siècle av. J.-C. ; elle devint plus tard l’une des cinq villes des Philistins."
    sources:
      - "M. Dothan, 'Ashdod', Anchor Bible Dictionary 1 (1992), pp. 477-482"
      - "M. Dothan and D. N. Freedman, Ashdod I: The First Season of Excavations, 1962 ('Atiqot, English Series 7, 1967)"
      - "Encyclopaedia Judaica, 'Ashdod', on the Jewish Virtual Library"

  # ---------- batch life 1 (fill) ----------
  - id: a5feb15
    en: Ephesus
    # Why firm: the point stands on the Hellenistic-Roman city (Library of Celsus area),
    # not on the archaic town by the Artemision. Strabo 14.1.21 (LacusCurtius, Loeb) says
    # Lysimachus walled "the present city" and flooded the old one by blocking the drains;
    # Pausanias 1.9.7 (theoi.com, Jones) says he "founded the modern city of Ephesus",
    # settling there the people of Lebedus and Colophon; 7.3.4-5 repeats it. Lysimachus
    # took Ephesus c. 294 BC; the move is dated c. 294-289 BC, so "c. 290".
    from: "c. 290 BC"
    note:
      en: "The Ephesus of Acts and Revelation is the city Lysimachus built between Mount Pion and Mount Coressus about 290 BC: he walled the new site and, Strabo says, flooded the old town by the temple of Artemis by blocking its drains until its people moved; he settled there the people of Lebedus and Colophon; for a time it bore his wife's name, Arsinoeia."
      ru: "Ефес Деяний и Откровения — город, построенный Лисимахом между горами Пион и Коресс около 290 г. до н. э.: он обнёс стеной новое место и, по словам Страбона, затопил старый город у храма Артемиды, заложив его стоки, пока жители не переселились; он поселил там жителей Лебедоса и Колофона; некоторое время город носил имя его жены — Арсиноя."
      uk: "Ефес Діянь і Одкровення — місто, яке Лісімах збудував між горою Піон і горою Коресс близько 290 р. до н. е.: він обніс стінами нове місце і, як каже Страбон, затопив старе місто біля храму Артеміди, заблокувавши його стоки, доки жителі не переселилися; він оселив там мешканців Лебеда й Колофона; якийсь час місто носило ім’я його дружини, Арсіноя."
      es: "La Éfeso de Hechos y del Apocalipsis es la ciudad que Lisímaco edificó entre el monte Pión y el monte Coreso hacia 290 a. C.: amuralló el nuevo emplazamiento y, según Estrabón, inundó la ciudad vieja junto al templo de Artemisa bloqueando sus desagües hasta que su gente se trasladó; asentó allí a los habitantes de Lebedo y Colofón; durante un tiempo llevó el nombre de su esposa, Arsinoea."
      pt: "O Éfeso de Atos e do Apocalipse é a cidade que Lisímaco construiu entre o monte Pion e o monte Coresso por volta de 290 a.C.: ele cercou de muralhas o novo local e, diz Estrabão, inundou a cidade velha, junto ao templo de Ártemis, bloqueando seus esgotos até que seu povo se mudasse; estabeleceu ali os habitantes de Lebedo e Colofão; por algum tempo ela levou o nome da esposa dele, Arsinoeia."
      de: "Das Ephesus der Apostelgeschichte und der Offenbarung ist die Stadt, die Lysimachos um 290 v. Chr. zwischen dem Berg Pion und dem Berg Koressos baute: Er ummauerte den neuen Platz und setzte, wie Strabon sagt, die Altstadt beim Artemistempel unter Wasser, indem er ihre Abflüsse verstopfte, bis ihre Bewohner umzogen; er siedelte dort die Leute von Lebedos und Kolophon an; eine Zeit lang trug sie den Namen seiner Frau, Arsinoeia."
      fr: "L’Éphèse des Actes et de l’Apocalypse est la ville que Lysimaque bâtit entre le mont Pion et le mont Coressos vers 290 av. J.-C. : il fortifia le nouveau site et, dit Strabon, inonda l’ancienne ville près du temple d’Artémis en bouchant ses égouts jusqu’à ce que ses habitants partent ; il y installa les gens de Lébédos et de Colophon ; pendant un temps, elle porta le nom de son épouse, Arsinoéia."
    sources:
      - "Strabo, Geography 14.1.21"
      - "Pausanias, Description of Greece 1.9.7; 7.3.4-5"
      - "'Ephesus', Encyclopaedia Britannica, 11th ed. (1911)"
  - id: a513646
    en: Dan
    # Why firm: the excavators' page (Nelson Glueck School, HUC) states "By the end of the
    # 4th century CE, in the late Roman period, Tel Dan was abandoned".
    # Eusebius (c. 330) still lists Dan as a village four miles from Paneas
    # on the road to Tyre. No `from`: Laish stood from the Early Bronze Age, before the
    # period's start. The Assyrian capture of 732 BC is not an end (the town was restored).
    until: "c. AD 400"
    note:
      en: "Taken by Tiglath-pileser III in 732 BC, Dan lived on as a small town with its sanctuary through the Hellenistic and Roman periods; Eusebius still knew it as a village four miles from Paneas, but by the end of the 4th century AD the mound was abandoned."
      ru: "Взятый Тиглатпаласаром III в 732 г. до н. э., Дан пережил эллинистическую и римскую эпохи небольшим городком при святилище; Евсевий ещё знал его как селение в четырёх милях от Панеады, но к концу IV в. н. э. холм был оставлен."
      uk: "Здобутий Тіглатпаласаром III у 732 р. до н. е., Дан жив далі як невелике місто зі своїм святилищем крізь елліністичну й римську добу; Євсевій ще знав його як село за чотири милі від Панеаса, але наприкінці IV ст. н. е. пагорб було покинуто."
      es: "Tomada por Tiglat-pileser III en 732 a. C., Dan sobrevivió como una pequeña ciudad con su santuario durante los períodos helenístico y romano; Eusebio aún la conocía como una aldea a cuatro millas de Paneas, pero a finales del siglo IV d. C. el montículo estaba abandonado."
      pt: "Tomada por Tiglate-Pileser III em 732 a.C., Dã sobreviveu como pequena cidade com o seu santuário durante os períodos helenístico e romano; Eusébio ainda a conhecia como uma aldeia a quatro milhas de Paneas, mas no final do século IV d.C. o montículo estava abandonado."
      de: "Von Tiglat-Pileser III. 732 v. Chr. eingenommen, bestand Dan mit seinem Heiligtum als kleine Stadt durch die hellenistische und die römische Zeit fort; Eusebius kannte es noch als Dorf vier Meilen von Paneas, doch am Ende des 4. Jahrhunderts n. Chr. war der Hügel verlassen."
      fr: "Prise par Tiglath-Piléser III en 732 av. J.-C., Dan subsista comme petite ville avec son sanctuaire pendant les périodes hellénistique et romaine ; Eusèbe la connaissait encore comme un village à quatre milles de Panéas, mais à la fin du IVe siècle ap. J.-C. le tertre était abandonné."
    sources:
      - "Tel Dan excavations of A. Biran and D. Ilan (Nelson Glueck School of Biblical Archaeology, 'Tel Dan')"
      - "Eusebius, Onomasticon, s.v. Dan"
      - "Israel Ministry of Foreign Affairs, 'Biblical City of Dan' (Archaeology in Israel), on the Jewish Virtual Library (destruction by Tiglath-pileser III, 732 BC)"

  # ---------- batch life 2 (fill) ----------
  - id: aaf03fa
    en: Jericho
    # The New Testament Jericho (Tulul Abu el-'Alayiq by Wadi Qelt), not Tell es-Sultan.
    # No `from`: Jericho stood as a town through the Hellenistic age (1 Macc 9:50; 16:11)
    # before Hyrcanus I built his palace here, so the Hasmonean date is not a founding.
    # End: Vespasian camped at Corea on 2 Daesius (June) 68 and reached Jericho the next day; Eusebius says the
    # second city perished in the Roman war and a third was built elsewhere.
    until: "AD 68"
    note:
      en: "The Jericho of the Gospels, the Hasmonean and Herodian town by Wadi Qelt, was taken by Vespasian in June AD 68: a great multitude fled to the hills facing Jerusalem, most of those left behind were killed, the Romans found the city deserted, and a fort with a garrison was set there. Eusebius writes that it was destroyed at the siege of Jerusalem and that a third Jericho was built afterwards, while remains of the two older cities were still pointed out."
      ru: "Иерихон евангельских времён — хасмонейский и иродианский город у Вади-Кельт — взят Веспасианом в июне 68 г. н. э.: множество жителей бежало в горы напротив Иерусалима, большинство оставшихся было перебито, римляне нашли город опустевшим и поставили в нём укрепление с гарнизоном. Евсевий пишет, что он был разрушен при осаде Иерусалима и что затем построили третий Иерихон, а развалины двух прежних городов ещё показывали."
      uk: "Єрихон Євангелій, хасмонейське й іродіанське місто біля вади Кельт, був здобутий Веспасіаном у червні 68 р. н. е.: велика юрба втекла в гори навпроти Єрусалима, більшість із тих, хто лишився, було вбито, римляни знайшли місто порожнім і поставили там фортецю з гарнізоном. Євсевій пише, що воно було зруйноване під час облоги Єрусалима й що потім збудували третій Єрихон, тоді як рештки двох давніших міст ще показували."
      es: "La Jericó de los Evangelios, la ciudad asmonea y herodiana junto al Wadi Qelt, fue tomada por Vespasiano en junio del 68 d. C.: una gran multitud huyó a los montes frente a Jerusalén, la mayoría de los que quedaron atrás fueron muertos, los romanos hallaron la ciudad desierta y pusieron allí un fuerte con guarnición. Eusebio escribe que fue destruida en el asedio de Jerusalén y que después se edificó una tercera Jericó, mientras aún se señalaban restos de las dos más antiguas."
      pt: "A Jericó dos Evangelhos, a cidade hasmoneia e herodiana junto ao Wadi Qelt, foi tomada por Vespasiano em junho de 68 d.C.: uma grande multidão fugiu para as colinas defronte de Jerusalém, a maior parte dos que ficaram foi morta, os romanos encontraram a cidade deserta, e um forte com guarnição foi ali estabelecido. Eusébio escreve que ela foi destruída no cerco de Jerusalém e que uma terceira Jericó foi construída depois, enquanto ainda se mostravam restos das duas mais antigas."
      de: "Das Jericho der Evangelien, die hasmonäische und herodianische Stadt am Wadi Qelt, wurde im Juni 68 n. Chr. von Vespasian eingenommen: Eine große Menge floh in die Berge gegenüber von Jerusalem, die meisten der Zurückgebliebenen wurden getötet, die Römer fanden die Stadt verlassen vor, und ein Fort mit einer Besatzung wurde dort errichtet. Eusebius schreibt, sie sei bei der Belagerung Jerusalems zerstört worden und danach sei ein drittes Jericho gebaut worden, während man die Überreste der beiden älteren Städte noch zeigte."
      fr: "Le Jéricho des Évangiles, la ville hasmonéenne et hérodienne près du wadi Qelt, fut prise par Vespasien en juin 68 ap. J.-C. : une grande multitude s’enfuit vers les collines faisant face à Jérusalem, la plupart de ceux qui restaient furent tués, les Romains trouvèrent la ville déserte, et un fort avec une garnison y fut établi. Eusèbe écrit qu’elle fut détruite au siège de Jérusalem et qu’un troisième Jéricho fut bâti ensuite, tandis qu’on montrait encore les restes des deux plus anciennes."
    sources:
      - "Josephus, Jewish War 4.449-451; 4.486"
      - "Eusebius, Onomasticon, s.v. Ierichō (no. 530 in C. U. Wolf's translation)"
  - id: a21f909
    en: Timnah
    # Tel Batash. Mazar's sequence runs about 700 years from the start of the MB IIB to the
    # end of Iron I (Strata XII-V), then Iron II and Persian (Strata IV-I) with only stray
    # Hellenistic finds; the Persian town is dated to the 5th-4th centuries, hence c. 350 BC
    # (as Megiddo's Persian end in the file).
    from: "c. 1700 BC"
    until: "c. 350 BC"
    note:
      en: "Tel Batash, the Timnah of Samson, was founded as a fortified town ringed by earthen ramparts at the start of the Middle Bronze IIB; the last settlement on the mound (Stratum I) belonged to the Persian period, and after it there are only stray Hellenistic finds and a sparse Byzantine settlement nearby."
      ru: "Тель-Баташ — Фимнафа Самсона — основан как укреплённый, обнесённый земляными валами город в начале среднего бронзового века IIB; последнее поселение на холме (слой I) относился к персидскому времени, а после него остались лишь единичные эллинистические находки и редкое византийское поселение по соседству."
      uk: "Тель-Баташ, Тімна Самсона, був заснований як укріплене місто, оточене земляними валами, на початку середньої бронзи IIB; останнє поселення на пагорбі (шар I) належало до перської доби, а після нього є лише поодинокі елліністичні знахідки та розріджене візантійське поселення поблизу."
      es: "Tel Batash, la Timna de Sansón, fue fundada como una ciudad fortificada rodeada de murallas de tierra al comienzo del Bronce Medio IIB; el último asentamiento sobre el montículo (Estrato I) pertenecía al período persa, y después solo hay hallazgos helenísticos dispersos y un asentamiento bizantino poco denso en las cercanías."
      pt: "Tel Batash, a Timna de Sansão, foi fundada como uma cidade fortificada cercada por muralhas de terra no início do Bronze Médio IIB; o último povoado no montículo (Estrato I) pertenceu ao período persa, e depois dele há apenas achados helenísticos esparsos e um povoado bizantino disperso nas proximidades."
      de: "Tel Batasch, das Timna Simsons, wurde als befestigte, von Erdwällen umgebene Stadt zu Beginn der Mittelbronzezeit IIB gegründet; die letzte Siedlung auf dem Hügel (Stratum I) gehörte in die persische Zeit, und danach gibt es nur vereinzelte hellenistische Funde und eine dünne byzantinische Siedlung in der Nähe."
      fr: "Tel Batash, la Thimna de Samson, fut fondée comme ville fortifiée entourée de remparts de terre au début du Bronze moyen IIB ; la dernière occupation du tertre (strate I) appartenait à l’époque perse, et après elle on ne trouve que des vestiges hellénistiques isolés et un habitat byzantin clairsemé dans les environs."
    sources:
      - "A. Mazar, Timnah (Tel Batash) I: Stratigraphy and Architecture (Qedem 37, 1997)"
      - "A. Mazar and N. Panitz-Cohen, Timnah (Tel Batash) II: The Finds from the First Millennium BCE (Qedem 42, 2001)"
      - "N. Panitz-Cohen and A. Mazar, Timnah (Tel Batash) III: The Finds from the Second Millennium BCE (Qedem 45, 2006)"
  - id: a244d8f
    en: Eglon
    # Tel 'Eton. Destroyed by the Assyrians in the late 8th century: Katz and Faust 2012
    # cautiously said Sennacherib (701); Faust 2026 prefers Sargon II's campaign of 712/711,
    # hence c. 710. Seventh-century remains lie only in the plain NW of the mound; the mound
    # was reoccupied in the 4th century and abandoned in the 3rd (Faust 2026, p. 33).
    # Identification "accepted by most scholars", not certain (Tell el-Hesi was the older one).
    gap:
      from: "c. 710 BC"
      until: "c. 350 BC"
    until: "c. 250 BC"
    note:
      en: "Tel 'Eton, which most scholars identify with Eglon, was a large Judahite town until the Assyrians destroyed it at the end of the 8th century BC, in Sargon II's campaign of 712/711 or Sennacherib's of 701; the mound then lay empty until the 4th century BC, when a fort and a village were built on it, and it was abandoned for good in the 3rd century BC."
      ru: "Тель-Этон, который большинство учёных отождествляют с Еглоном, был крупным иудейским городом, пока в конце VIII в. до н. э. его не разрушили ассирийцы — в походе Саргона II 712/711 г. или Синаххериба 701 г.; после этого холм пустовал до IV в. до н. э., когда на нём построили крепость и селение, а в III в. до н. э. его оставили окончательно."
      uk: "Тель-Етон, який більшість учених ототожнює з Еглоном, був великим юдейським містом, доки ассирійці не зруйнували його наприкінці VIII ст. до н. е., під час походу Саргона II 712/711 р. або Сінаххеріба 701 р.; потім пагорб лежав порожній до IV ст. до н. е., коли на ньому збудували фортецю й село, а в III ст. до н. е. його покинули назавжди."
      es: "Tel 'Eton, que la mayoría de los estudiosos identifica con Eglón, fue una gran ciudad judaíta hasta que los asirios la destruyeron a finales del siglo VIII a. C., en la campaña de Sargón II de 712/711 o en la de Senaquerib de 701; el montículo quedó entonces vacío hasta el siglo IV a. C., cuando se construyeron en él un fuerte y una aldea, y fue abandonado para siempre en el siglo III a. C."
      pt: "Tel 'Eton, que a maioria dos estudiosos identifica com Eglom, foi uma grande cidade de Judá até que os assírios a destruíram no final do século VIII a.C., na campanha de Sargão II de 712/711 ou na de Senaqueribe de 701; o montículo ficou então vazio até o século IV a.C., quando um forte e uma aldeia foram construídos nele, e foi abandonado definitivamente no século III a.C."
      de: "Tel 'Eton, das die meisten Forscher mit Eglon gleichsetzen, war eine große judäische Stadt, bis die Assyrer sie am Ende des 8. Jahrhunderts v. Chr. zerstörten, in Sargons II. Feldzug von 712/711 oder Sanheribs von 701; der Hügel lag dann leer bis ins 4. Jahrhundert v. Chr., als ein Fort und ein Dorf darauf gebaut wurden, und im 3. Jahrhundert v. Chr. wurde er endgültig aufgegeben."
      fr: "Tel ‘Eton, que la plupart des chercheurs identifient à Églon, fut une grande ville de Juda jusqu’à sa destruction par les Assyriens à la fin du VIIIe siècle av. J.-C., lors de la campagne de Sargon II en 712-711 ou de celle de Sennacherib en 701 ; le tertre resta ensuite vide jusqu’au IVe siècle av. J.-C., quand un fortin et un village y furent bâtis, et il fut abandonné définitivement au IIIe siècle av. J.-C."
    sources:
      - "A. Faust, 'The History of Tel 'Eton Following the Results of the First Seven Seasons of Excavations (2006-2012)', Proceedings of the 8th ICAANE, vol. 2 (2014), pp. 585-604"
      - "H. Katz and A. Faust, 'The Assyrian Destruction Layer at Tel 'Eton', Israel Exploration Journal 62 (2012), pp. 22-53"
