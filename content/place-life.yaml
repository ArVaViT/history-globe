      ru: "Разрушена парфянами в 40 г. до н. э. во время войны Антигона с Иродом; на холме больше не селились."
      uk: "Зруйноване парфянами в 40 р. до н. е. під час війни між Антігоном та Іродом; тель ніколи не заселяли знову."
      es: "Destruida por los partos en 40 a. C. durante la guerra entre Antígono y Herodes; el tell nunca volvió a poblarse."
      pt: "Destruída pelos partas em 40 a.C. durante a guerra entre Antígono e Herodes; o tell nunca foi repovoado."
      de: "40 v. Chr. im Krieg zwischen Antigonos und Herodes von den Parthern zerstört; der Tell wurde nie wieder besiedelt."
      fr: "Détruite par les Parthes en 40 av. J.-C. pendant la guerre entre Antigone et Hérode ; le tell ne fut jamais réoccupé."
    sources:
      - "Josephus, Antiquities 14.364; Jewish War 1.269"
      - "A. Kloner, Maresha Excavations Final Report I (IAA Reports 17, 2003)"
  - id: ab7bf48
    en: Caesarea Philippi
    from: "c. 3 BC"
    note:
      en: "Founded by Philip the Tetrarch at the sanctuary of Pan (Panias) as his capital and named after Caesar."
      ru: "Основана четвертовластником Филиппом у святилища Пана (Паниады), стала его столицей и названа в честь кесаря."
      uk: "Заснована Пилипом Тетрархом при святилищі Пана (Паніас) як його столиця й названа на честь Цезаря."
      es: "Fundada por Filipo el Tetrarca en el santuario de Pan (Panias) como su capital y llamada así por el César."
      pt: "Fundada por Filipe, o Tetrarca, no santuário de Pã (Pânias) como sua capital e nomeada em honra de César."
