  - id: a84f426
    en: City of David
    gap:
      from: "c. 586 BC"
      until: "c. 539 BC"
    note:
      en: "Burnt with the rest of Jerusalem by Nebuchadnezzar's army; the burnt houses were found in Yigal Shiloh's excavations. The exiles returned after the decree of Cyrus in 538 BC."
      ru: "Сгорел вместе со всем Иерусалимом при взятии города войском Навуходоносора; сгоревшие дома открыты раскопками Игаля Шило. Изгнанники вернулись после указа Кира в 538 г. до н. э."
      uk: "Спалений разом з рештою Єрусалима військом Навуходоносора; спалені будинки знайдено в розкопках Ігала Шилоха. Вигнанці повернулися після указу Кіра в 538 р. до н. е."
      es: "Incendiada junto con el resto de Jerusalén por el ejército de Nabucodonosor; las casas quemadas fueron halladas en las excavaciones de Yigal Shiloh. Los desterrados regresaron tras el decreto de Ciro en 538 a. C."
      pt: "Queimada com o resto de Jerusalém pelo exército de Nabucodonosor; as casas queimadas foram encontradas nas escavações de Yigal Shiloh. Os exilados voltaram após o decreto de Ciro em 538 a.C."
      de: "Zusammen mit dem übrigen Jerusalem vom Heer Nebukadnezars verbrannt; die verbrannten Häuser wurden in Yigal Shilohs Ausgrabungen gefunden. Die Verbannten kehrten nach dem Erlass des Kyrus 538 v. Chr. zurück."
      fr: "Incendiée avec le reste de Jérusalem par l’armée de Nebucadnetsar ; les maisons brûlées ont été retrouvées dans les fouilles de Yigal Shiloh. Les exilés revinrent après le décret de Cyrus en 538 av. J.-C."
      pl: "Spalone wraz z resztą Jerozolimy przez wojsko Nabuchodonozora; spalone domy odnaleziono w wykopaliskach Yigala Shiloha. Wygnańcy wrócili po dekrecie Cyrusa w 538 p.n.e."
      it: "Incendiata con il resto di Gerusalemme dall’esercito di Nabucodonosor; le case bruciate sono state trovate negli scavi di Yigal Shiloh. Gli esuli tornarono dopo il decreto di Ciro nel 538 a.C."
      nl: "Verbrand met de rest van Jeruzalem door het leger van Nebukadnessar; de verbrande huizen werden gevonden bij de opgravingen van Yigal Shiloh. De ballingen keerden terug na het decreet van Cyrus in 538 v.Chr."
      cs: "Vypáleno spolu se zbytkem Jeruzaléma vojskem Nebukadnesarovým; vypálené domy byly nalezeny při vykopávkách Jigala Šilocha. Vyhnanci se vrátili po Kýrově dekretu roku 538 př. n. l."
      sv: "Brändes tillsammans med resten av Jerusalem av Nebukadnessars här; de brända husen påträffades vid Yigal Shilohs utgrävningar. De landsflyktiga återvände efter Kyros’ påbud 538 f.Kr."
      nb: "Brent sammen med resten av Jerusalem av Nebukadnesars hær; de brente husene ble funnet i Yigal Shilohs utgravinger. De landflyktige vendte tilbake etter Kyros' påbud i 538 f.Kr."
      tl: "Sinunog kasama ng iba pang bahagi ng Jerusalem ng hukbo ni Nabucodonosor; ang mga nasunog na bahay ay natagpuan sa mga paghuhukay ni Yigal Shiloh. Bumalik ang mga tapon pagkatapos ng kautusan ni Ciro noong 538 BK."
      da: "Brændt sammen med resten af Jerusalem af Nebukadnezars hær; de brændte huse blev fundet i Yigal Shilohs udgravninger. De landflygtige vendte hjem efter Kyros' dekret i 538 f.Kr."
      sr: "Спалила га је са остатком Јерусалима Навуходоносорова војска; спаљене куће нађене су у ископавањима Игала Шилоха. Прогнаници су се вратили после Кирове наредбе 538. п. н. е."
    sources:
      - "2 Kgs 25:8-10; Ezra 1:1-4"
      - "Y. Shiloh, Excavations at the City of David I, 1978-1982 (Qedem 19, 1984)"
  - id: a3cc590
    en: Lachish
    gap:
      from: "c. 587 BC"
      until: "c. 450 BC"
    until: "c. 150 BC"
    note:
      en: "Burnt by the Babylonians shortly before Jerusalem fell; resettled under the Persians, when the Residency was built, and abandoned in the Hellenistic period."
      ru: "Сожжён вавилонянами незадолго до падения Иерусалима; заново заселён при персах, когда построили «Резиденцию», и оставлен в эллинистический период."
      uk: "Спалений вавилонянами незадовго до падіння Єрусалима; знову заселений за персів, коли збудовано Резиденцію, і покинутий в елліністичну добу."
      es: "Incendiada por los babilonios poco antes de la caída de Jerusalén; repoblada bajo los persas, cuando se construyó la Residencia, y abandonada en época helenística."
      pt: "Queimada pelos babilônios pouco antes da queda de Jerusalém; repovoada sob os persas, quando foi construída a Residência, e abandonada no período helenístico."
      de: "Kurz vor dem Fall Jerusalems von den Babyloniern verbrannt; unter den Persern, als das Residenzgebäude errichtet wurde, wieder besiedelt und in hellenistischer Zeit aufgegeben."
      fr: "Incendiée par les Babyloniens peu avant la chute de Jérusalem ; réoccupée sous les Perses, époque où la Résidence fut bâtie, et abandonnée à l’époque hellénistique."
      pl: "Spalony przez Babilończyków krótko przed upadkiem Jerozolimy; ponownie zasiedlony za Persów, gdy zbudowano Rezydencję, i opuszczony w okresie hellenistycznym."
      it: "Incendiata dai Babilonesi poco prima della caduta di Gerusalemme; rioccupata sotto i Persiani, quando fu costruita la Residenza, e abbandonata in età ellenistica."
      nl: "Verbrand door de Babyloniërs kort voordat Jeruzalem viel; opnieuw bewoond onder de Perzen, toen de Residentie werd gebouwd, en verlaten in de hellenistische tijd."
      cs: "Vypálen Babylóňany krátce před pádem Jeruzaléma; za Peršanů znovu osídlen, kdy byla postavena Rezidence, a v helénistickém období opuštěn."
      sv: "Brändes av babylonierna strax före Jerusalems fall; bosattes på nytt under perserna, då Residenset byggdes, och övergavs under den hellenistiska tiden."
      nb: "Brent av babylonerne kort før Jerusalem falt; bosatt på nytt under perserne, da residensen ble bygd, og forlatt i den hellenistiske tid."
      tl: "Sinunog ng mga Babilonio hindi kalaunan bago bumagsak ang Jerusalem; muling pinamayanan sa ilalim ng mga Persiano, nang itayo ang Residency, at iniwan sa panahon ng mga Helenista."
      da: "Brændt af babylonierne kort før Jerusalems fald; bosat påny under perserne, da Residensen blev bygget, og forladt i den hellenistiske periode."
      sr: "Вавилонци су га спалили непосредно пре пада Јерусалима; поново је насељен под Персијанцима, кад је подигнута Резиденција, а напуштен је у хеленистичком периоду."
    sources:
      - "Jer 34:7; Neh 11:30"
      - "Y. Aharoni, Investigations at Lachish: The Sanctuary and the Residency (Lachish V, 1975)"
      - "D. Ussishkin, The Renewed Archaeological Excavations at Lachish (1973-1994) (2004)"
  - id: a6c8205
    en: Bether
    until: "AD 135"
    note:
      en: "Betar, the last stronghold of Bar Kokhba, was taken by Hadrian's army in AD 135."
      ru: "Бейтар, последняя твердыня Бар-Кохбы, взят армией Адриана в 135 г. н. э."
      uk: "Бетар, остання твердиня Бар-Кохби, був здобутий військом Адріана в 135 р. н. е."
      es: "Betar, la última fortaleza de Bar Kojbá, fue tomada por el ejército de Adriano en el 135 d. C."
      pt: "Betar, o último reduto de Bar Kokhba, foi tomada pelo exército de Adriano em 135 d.C."
      de: "Betar, die letzte Festung des Bar Kochba, wurde 135 n. Chr. vom Heer Hadrians eingenommen."
      fr: "Bethar, dernier bastion de Bar Kokhba, fut prise par l’armée d’Hadrien en 135 ap. J.-C."
      pl: "Betar, ostatnia twierdza Bar Kochby, został zdobyty przez wojsko Hadriana w 135 n.e."
      it: "Betar, l’ultima roccaforte di Bar Kokhba, fu presa dall’esercito di Adriano nel 135 d.C."
      nl: "Betar, het laatste bolwerk van Bar Kochba, werd in 135 n.Chr. ingenomen door het leger van Hadrianus."
      cs: "Betar, poslední pevnost Bar Kochby, dobylo Hadrianovo vojsko roku 135 n. l."
      sv: "Betar, Bar Kochbas sista fäste, intogs av Hadrianus’ här år 135 e.Kr."
      nb: "Betar, Bar Kokhbas siste festning, ble inntatt av Hadrians hær i 135 e.Kr."
      tl: "Ang Betar, ang huling muog ni Bar Kokhba, ay nakuha ng hukbo ni Adriano noong 135 AD."
      da: "Betar, Bar Kokhbas sidste fæstning, blev indtaget af Hadrians hær i 135 e.Kr."
      sr: "Бетар, последње упориште Бар Кохбе, освојила је Хадријанова војска 135. н. е."
    sources:
      - "Eusebius, Ecclesiastical History 4.6.3"
      - "Mishnah, Ta'anit 4:6"
  - id: a160272
    en: Tyre
    from: "c. 2750 BC"
    until: "AD 1291"
    note:
      en: "The priests of Melqart told Herodotus that the city and its temple had been founded 2,300 years before his day, about 2750 BC; the deepest levels of the sounding on the island belong to the Early Bronze Age. In 1291, after the fall of Acre, the Mamluk sultan al-Ashraf Khalil took the city, which the Franks had left, and laid it in ruins; it was almost deserted until its revival about 1750."
      ru: "Жрецы Мелькарта сказали Геродоту, что город и храм основаны за 2300 лет до его времени, то есть около 2750 г. до н. э.; самые глубокие слои шурфа на острове относятся к раннему бронзовому веку. В 1291 г., после падения Акры, мамлюкский султан аль-Ашраф Халиль взял оставленный франками город и обратил его в руины; почти пустым он простоял до возрождения около 1750 г."
      uk: "Жерці Мелькарта сказали Геродотові, що місто та його храм було засновано за 2300 років до його часу, близько 2750 р. до н. е.; найглибші шари зондажу на острові належать до раннього бронзового віку. У 1291 р., після падіння Акри, мамлюцький султан аль-Ашраф Халіл здобув місто, яке франки залишили, і зруйнував його; воно майже пустувало аж до відродження близько 1750 р."
      es: "Los sacerdotes de Melqart dijeron a Heródoto que la ciudad y su templo habían sido fundados 2300 años antes de su tiempo, hacia 2750 a. C.; los niveles más profundos del sondeo en la isla pertenecen al Bronce Antiguo. En 1291, tras la caída de Acre, el sultán mameluco al-Ashraf Khalil tomó la ciudad, que los francos habían abandonado, y la dejó en ruinas; quedó casi desierta hasta su resurgimiento hacia 1750."
      pt: "Os sacerdotes de Melqart disseram a Heródoto que a cidade e o seu templo haviam sido fundados 2.300 anos antes do seu tempo, por volta de 2750 a.C.; os níveis mais profundos da sondagem na ilha pertencem à Idade do Bronze Antigo. Em 1291, após a queda de Acre, o sultão mameluco al-Ashraf Khalil tomou a cidade, que os francos haviam deixado, e a reduziu a ruínas; ficou quase deserta até o seu renascimento por volta de 1750."
      de: "Die Priester des Melkart erzählten Herodot, die Stadt und ihr Tempel seien 2300 Jahre vor seiner Zeit gegründet worden, um 2750 v. Chr.; die tiefsten Schichten der Sondage auf der Insel gehören zur Frühbronzezeit. 1291, nach dem Fall von Akkon, nahm der Mamlukensultan al-Aschraf Chalil die Stadt, welche die Franken verlassen hatten, und legte sie in Trümmer; sie war fast verlassen, bis sie um 1750 wiederauflebte."
      fr: "Les prêtres de Melqart dirent à Hérodote que la ville et son temple avaient été fondés 2 300 ans avant son époque, vers 2750 av. J.-C. ; les niveaux les plus profonds du sondage sur l’île appartiennent au Bronze ancien. En 1291, après la chute d’Acre, le sultan mamelouk al-Ashraf Khalil prit la ville, que les Francs avaient quittée, et la mit en ruines ; elle resta presque déserte jusqu’à son renouveau vers 1750."
      pl: "Kapłani Melkarta powiedzieli Herodotowi, że miasto i jego świątynię założono 2300 lat przed jego czasami, około 2750 p.n.e.; najgłębsze warstwy sondażu na wyspie należą do wczesnej epoki brązu. W 1291 roku, po upadku Akki, mamelucki sułtan al-Aszraf Chalil zajął miasto, które Frankowie opuścili, i obrócił je w ruiny; było niemal wyludnione aż do odrodzenia około 1750 roku."
      it: "I sacerdoti di Melqart dissero a Erodoto che la città e il suo tempio erano stati fondati 2.300 anni prima di lui, intorno al 2750 a.C.; gli strati più profondi del sondaggio sull’isola appartengono al Bronzo antico. Nel 1291, dopo la caduta di Acri, il sultano mamelucco al-Ashraf Khalil prese la città, che i Franchi avevano lasciato, e la ridusse in rovina; rimase quasi deserta fino alla sua rinascita intorno al 1750."
      nl: "De priesters van Melqart vertelden Herodotus dat de stad en haar tempel 2300 jaar vóór zijn tijd waren gesticht, omstreeks 2750 v.Chr.; de diepste lagen van de proefsleuf op het eiland behoren tot de Vroege Bronstijd. In 1291, na de val van Akko, nam de Mamelukse sultan al-Ashraf Khalil de stad in, die de Franken hadden verlaten, en legde haar in puin; ze was bijna verlaten tot haar herleving omstreeks 1750."
      cs: "Kněží Melkarta řekli Hérodotovi, že město a jeho chrám byly založeny 2 300 let před jeho dobou, kolem roku 2750 př. n. l.; nejhlubší vrstvy sondáže na ostrově patří rané době bronzové. V roce 1291, po pádu Akka, mamlúcký sultán al-Ašraf Chalíl dobyl město, které Frankové opustili, a zničil je; téměř neobydlené zůstalo až do obnovy kolem roku 1750."
      sv: "Melkarts präster berättade för Herodotos att staden och dess tempel hade grundats 2 300 år före hans tid, omkring 2750 f.Kr.; de djupaste lagren i sonderingen på ön hör till tidig bronsålder. År 1291, efter Akkos fall, intog den mamlukiske sultanen al-Ashraf Khalil staden, som frankerna hade lämnat, och lade den i ruiner; den var nästan öde tills den återupplivades omkring 1750."
      nb: "Melkarts prester fortalte Herodot at byen og dens tempel var grunnlagt 2300 år før hans tid, omkring 2750 f.Kr.; de dypeste lagene i prøvegravingen på øya hører til tidlig bronsealder. I 1291, etter Akkos fall, inntok mamelukksultanen al-Ashraf Khalil byen, som frankerne hadde forlatt, og la den i ruiner; den lå nesten øde til den ble gjenopplivet omkring 1750."
      tl: "Sinabi ng mga saserdote ni Melqart kay Herodoto na ang lungsod at ang templo nito ay itinatag 2,300 taon bago ang kaniyang kapanahunan, noong mga 2750 BK; ang pinakamalalim na patong ng pagsubok na hukay sa pulo ay kabilang sa Maagang Bronse. Noong 1291, pagkatapos ng pagbagsak ng Acre, kinuha ng sultang Mamluk na si al-Ashraf Khalil ang lungsod, na iniwan na ng mga Frank, at ginawang guho; halos walang tao ito hanggang sa muling pagsigla nito noong mga 1750."
      da: "Melqarts præster fortalte Herodot, at byen og dens tempel var blevet grundlagt 2300 år før hans tid, omkring 2750 f.Kr.; de dybeste lag i sonderingen på øen hører til tidlig bronzealder. I 1291, efter Akkos fald, indtog mamelukkernes sultan al-Ashraf Khalil byen, som frankerne havde forladt, og lagde den i ruiner; den var næsten øde, indtil den genopstod omkring 1750."
      sr: "Свештеници Мелкарта рекли су Херодоту да су град и његов храм основани 2.300 година пре његовог доба, око 2750. п. н. е.; најдубљи слојеви сонде на острву припадају раном бронзаном добу. Године 1291, после пада Акре, мамелучки султан ал-Ашраф Калил заузео је град, који су Франци напустили, и срушио га; био је готово пуст до обнове око 1750."
    sources:
      - "Herodotus 2.44"
      - "P. M. Bikai, The Pottery of Tyre (1978)"
      - "Abu'l-Fida, Taqwim al-buldan (1321), al-Dimashqi, and Ibn Battuta (1355), in G. Le Strange, Palestine under the Moslems (1890), 'Sur'"
      - "S. Vailhé, 'Tyre', Catholic Encyclopedia 15 (1912)"
  - id: a80d317
    en: Tirzah
    until: "c. 600 BC"
    note:
      en: "Tell el-Far'ah (North), a royal city of the northern kingdom until Omri moved to Samaria; after the Assyrian conquest the town declined and was abandoned about 600 BC."
      ru: "Телль-эль-Фараа (Северный) — царский город Северного царства, пока Амврий не перенёс столицу в Самарию; после ассирийского завоевания город пришёл в упадок и около 600 г. до н. э. был оставлен."
      uk: "Тель-ель-Фара (Північний), царське місто північного царства, поки Омрі не переніс столицю до Самарії; після ассирійського завоювання місто занепало й було покинуте близько 600 р. до н. е."
      es: "Tell el-Far'ah (Norte), ciudad real del reino del norte hasta que Omri se trasladó a Samaria; tras la conquista asiria la ciudad decayó y fue abandonada hacia 600 a. C."
      pt: "Tell el-Far'ah (Norte), cidade real do reino do norte até que Onri se mudou para Samaria; após a conquista assíria a cidade declinou e foi abandonada por volta de 600 a.C."
      de: "Tell el-Far'a (Nord), eine Königsstadt des Nordreichs, bis Omri seinen Sitz nach Samaria verlegte; nach der assyrischen Eroberung verfiel die Stadt und wurde um 600 v. Chr. aufgegeben."
      fr: "Tell el-Far‘ah (nord), ville royale du royaume du nord jusqu’à ce qu’Omri transfère la capitale à Samarie ; après la conquête assyrienne, la ville déclina et fut abandonnée vers 600 av. J.-C."
      pl: "Tell el-Far'ah (Północ), miasto królewskie królestwa północnego, dopóki Omri nie przeniósł się do Samarii; po asyryjskim podboju miasto podupadło i około 600 p.n.e. zostało opuszczone."
      it: "Tell el-Far‘ah (Nord), città reale del regno settentrionale finché Omri non si trasferì a Samaria; dopo la conquista assira la città decadde e fu abbandonata intorno al 600 a.C."
      nl: "Tell el-Far'a (Noord), een koninklijke stad van het noordelijke koninkrijk totdat Omri naar Samaria verhuisde; na de Assyrische verovering ging de stad achteruit en werd omstreeks 600 v.Chr. verlaten."
      cs: "Tell el-Far'a (sever), královské město severního království, dokud se Omrí nepřestěhoval do Samaří; po asyrském dobytí město upadalo a kolem roku 600 př. n. l. bylo opuštěno."
      sv: "Tell el-Far’ah (norra), en kunglig stad i nordriket tills Omri flyttade till Samaria; efter den assyriska erövringen förföll staden och övergavs omkring 600 f.Kr."
      nb: "Tell el-Far'ah (nord), en kongeby i det nordlige riket til Omri flyttet til Samaria; etter den assyriske erobringen sank byen hen og ble forlatt omkring 600 f.Kr."
      tl: "Ang Tell el-Far'ah (Hilaga), isang maharlikang lungsod ng hilagang kaharian hanggang ilipat ni Omri ang luklukan sa Samaria; pagkatapos ng pananakop ng Asiria ay humina ang bayan at iniwan nang mga 600 BK."
      da: "Tell el-Far'ah (Nord), en kongeby i nordriget, indtil Omri flyttede til Samaria; efter den assyriske erobring forfaldt byen og blev forladt omkring 600 f.Kr."
      sr: "Тел ел-Фара (Север), царски град северног краљевства док Амрије није преместио седиште у Самарију; после асирског освајања град је пропадао и напуштен је око 600. п. н. е."
    sources:
      - "1 Kgs 14:17; 15:33; 16:23-24"
      - "R. de Vaux, excavations at Tell el-Far'ah (North), 1946-1960 (NEAEHL, 'Far'ah, Tell el- (North)')"
  - id: a8554e3
    en: Megiddo
    until: "c. 350 BC"
    note:
      en: "The last town on the mound (Stratum I) belonged to the Persian period; after it the tell was abandoned, and the Roman legion later camped at Legio nearby."
      ru: "Последний город на холме (слой I) относился к персидскому времени; после него холм был оставлен, а позже неподалёку, в Легио, стоял римский легион."
      uk: "Останнє місто на пагорбі (шар I) належало до перської доби; після нього тель покинули, а римський легіон пізніше стояв табором неподалік, у Легіо."
      es: "La última ciudad sobre el montículo (Estrato I) pertenecía al período persa; después el tell fue abandonado, y la legión romana acampó más tarde en las cercanías, en Legio."
      pt: "A última cidade sobre o montículo (Estrato I) pertenceu ao período persa; depois dela o tell foi abandonado, e a legião romana acampou mais tarde nas proximidades, em Legio."
      de: "Die letzte Stadt auf dem Hügel (Stratum I) gehörte in die persische Zeit; danach wurde der Tell aufgegeben, und die römische Legion lagerte später im nahen Legio."
      fr: "La dernière ville sur le tertre (strate I) appartenait à l’époque perse ; après elle, le tell fut abandonné, et la légion romaine campa plus tard à Legio, tout près."
      pl: "Ostatnie miasto na kopcu (warstwa I) należało do okresu perskiego; potem tell został opuszczony, a rzymski legion obozował później w pobliskim Legio."
      it: "L’ultima città sul tell (strato I) appartenne al periodo persiano; dopo di essa il tell fu abbandonato, e in seguito la legione romana si accampò nelle vicinanze, a Legio."
      nl: "De laatste stad op de tel (Stratum I) behoorde tot de Perzische tijd; daarna werd de tel verlaten, en het Romeinse legioen sloeg later zijn kamp op bij Legio in de buurt."
      cs: "Poslední město na pahorku (vrstva I) patřilo k perskému období; poté byl tell opuštěn a římská legie později tábořila nedaleko, v Legiu."
      sv: "Den sista staden på högen (Stratum I) hörde till persisk tid; därefter övergavs tellen, och den romerska legionen slog senare läger vid Legio i närheten."
      nb: "Den siste byen på haugen (lag I) tilhørte den persiske tid; deretter ble tellen forlatt, og den romerske legionen slo senere leir ved Legio i nærheten."
      tl: "Ang huling bayan sa burol (Stratum I) ay kabilang sa panahon ng Persia; pagkatapos nito ay iniwan ang tell, at kalaunan ay nagkampo ang legiyong Romano sa kalapit na Legio."
      da: "Den sidste by på højen (lag I) hørte til den persiske periode; derefter blev tellen forladt, og den romerske legion lejrede sig senere ved Legio i nærheden."
      sr: "Последњи град на брду (слој I) припадао је персијском периоду; после њега тел је напуштен, а римска легија је касније логоровала у оближњем Легију."
    sources:
      - "R. S. Lamon and G. M. Shipton, Megiddo I: Seasons of 1925-34, Strata I-V (1939)"
      - "Megiddo excavations (NEAEHL, 'Megiddo')"
  - id: abc2af0
    en: Ptolemais
    until: "AD 1291"
    note:
      en: "The last Crusader stronghold, taken by the Mamluk sultan al-Ashraf Khalil in 1291 and razed on purpose so that the Franks could not use it again; it lay in ruins until the Ottoman revival of the 18th century."
      ru: "Последний оплот крестоносцев: в 1291 г. его взял мамлюкский султан аль-Ашраф Халиль и намеренно сровнял с землёй, чтобы франки не смогли им снова воспользоваться; город лежал в руинах до османского возрождения XVIII в."
      uk: "Остання твердиня хрестоносців, здобута мамлюцьким султаном аль-Ашрафом Халілом у 1291 р. і навмисно зрівняна з землею, щоб франки не могли нею скористатися; лежала в руїнах до османського відродження XVIII ст."
      es: "La última fortaleza cruzada, tomada por el sultán mameluco al-Ashraf Khalil en 1291 y arrasada a propósito para que los francos no pudieran volver a usarla; quedó en ruinas hasta el resurgimiento otomano del siglo XVIII."
      pt: "O último reduto cruzado, tomado pelo sultão mameluco al-Ashraf Khalil em 1291 e arrasado de propósito para que os francos não pudessem usá-lo de novo; permaneceu em ruínas até o renascimento otomano do século XVIII."
      de: "Die letzte Kreuzfahrerfestung, 1291 vom Mamlukensultan al-Aschraf Chalil eingenommen und absichtlich dem Erdboden gleichgemacht, damit die Franken sie nicht nutzen konnten; sie lag in Trümmern bis zur osmanischen Wiederbelebung im 18. Jahrhundert."
      fr: "Dernier bastion croisé, pris par le sultan mamelouk al-Ashraf Khalil en 1291 et rasé délibérément pour que les Francs ne puissent plus s’en servir ; elle resta en ruines jusqu’au renouveau ottoman du XVIIIe siècle."
      pl: "Ostatnia twierdza krzyżowców, zdobyta przez mameluckiego sułtana al-Aszrafa Chalila w 1291 roku i rozmyślnie zrównana z ziemią, aby Frankowie nie mogli jej użyć; leżała w ruinach aż do osmańskiego odrodzenia w XVIII w."
      it: "L’ultima roccaforte crociata, presa dal sultano mamelucco al-Ashraf Khalil nel 1291 e rasa al suolo di proposito perché i Franchi non potessero più servirsene; rimase in rovina fino alla rinascita ottomana del XVIII secolo."
      nl: "Het laatste kruisvaardersbolwerk, in 1291 ingenomen door de Mamelukse sultan al-Ashraf Khalil en opzettelijk met de grond gelijk gemaakt, zodat de Franken het niet konden gebruiken; het lag in puin tot de Ottomaanse herleving van de 18e eeuw."
      cs: "Poslední křižácká pevnost, kterou dobyl mamlúcký sultán al-Ašraf Chalíl roku 1291 a záměrně ji srovnal se zemí, aby ji Frankové nemohli použít; ležela v troskách až do osmanské obnovy v 18. století."
      sv: "Det sista korsfararfästet, intaget av den mamlukiske sultanen al-Ashraf Khalil 1291 och medvetet raserat så att frankerna inte skulle kunna använda det; det låg i ruiner tills den osmanska återupplivningen på 1700-talet."
      nb: "Den siste korsfarerfestningen, inntatt av mamelukksultanen al-Ashraf Khalil i 1291 og med vilje jevnet med jorden, slik at frankerne ikke kunne bruke den; den lå i ruiner til den osmanske gjenreisningen på 1700-tallet."
      tl: "Ang huling muog ng mga Krusado, nakuha ng sultang Mamluk na si al-Ashraf Khalil noong 1291 at sadyang winasak upang hindi na ito magamit muli ng mga Frank; nanatili itong guho hanggang sa muling pagsigla nito sa ilalim ng mga Otomano noong ika-18 siglo."
      da: "Den sidste korsfarerfæstning, indtaget af mamelukkernes sultan al-Ashraf Khalil i 1291 og med vilje jævnet med jorden, så frankerne ikke kunne bruge den; den lå i ruiner, indtil den osmanniske genoplivning i 1700-tallet."
      sr: "Последње крсташко упориште, које је мамелучки султан ал-Ашраф Калил заузео 1291. и намерно срушио да га Франци не би могли користити; лежало је у рушевинама до османске обнове у 18. веку."
    sources:
      - "Abu'l-Fida, al-Mukhtasar fi akhbar al-bashar, year 690 AH"
      - "The Templar of Tyre, Gestes des Chiprois, on the fall of Acre"
  - id: af75e9e
    en: Magdala
    from: "c. 100 BC"
    note:
      en: "Excavations at Migdal show that the town on the Sea of Galilee was founded in the Hasmonean period, between the 2nd and 1st centuries BC; as Taricheae it was already a town when Cassius took it about 52 BC."
      ru: "Раскопки в Мигдале показали, что город на берегу Галилейского моря возник в хасмонейский период, между II и I вв. до н. э.; под именем Тарихея он уже был городом, когда его взял Кассий около 52 г. до н. э."
      uk: "Розкопки в Мігдалі показують, що містечко на Галілейському морі було засноване за хасмонейської доби, між II і I ст. до н. е.; як Тарихея воно вже було містом, коли Кассій здобув його близько 52 р. до н. е."
      es: "Las excavaciones de Magdala muestran que la ciudad junto al Mar de Galilea fue fundada en época asmonea, entre los siglos II y I a. C.; como Tariquea ya era una ciudad cuando Casio la tomó hacia 52 a. C."
      pt: "As escavações em Migdal mostram que a cidade no Mar da Galileia foi fundada no período hasmoneu, entre os séculos II e I a.C.; como Tariqueia, já era uma cidade quando Cássio a tomou por volta de 52 a.C."
      de: "Ausgrabungen in Migdal zeigen, dass die Stadt am See Genezareth in der hasmonäischen Zeit gegründet wurde, zwischen dem 2. und dem 1. Jahrhundert v. Chr.; als Tarichea war sie bereits eine Stadt, als Cassius sie um 52 v. Chr. einnahm."
      fr: "Les fouilles de Migdal montrent que la ville au bord de la Mer de Galilée fut fondée à l’époque hasmonéenne, entre le IIe et le Ier siècle av. J.-C. ; sous le nom de Tarichées, c’était déjà une ville quand Cassius la prit vers 52 av. J.-C."
      pl: "Wykopaliska w Migdal pokazują, że miasto nad Jeziorem Galilejskim założono w okresie hasmonejskim, między II a I w. p.n.e.; jako Tarychea było już miastem, gdy zdobył je Kasjusz około 52 p.n.e."
      it: "Gli scavi di Migdal mostrano che la città sul Lago di Tiberiade fu fondata in età asmonea, fra il II e il I secolo a.C.; come Tarichea era già una città quando Cassio la prese intorno al 52 a.C."
      nl: "Opgravingen bij Migdal tonen aan dat de stad aan het Meer van Galilea werd gesticht in de Hasmoneese tijd, tussen de 2e en 1e eeuw v.Chr.; als Taricheae was het al een stad toen Cassius het omstreeks 52 v.Chr. innam."
      cs: "Vykopávky v Migdalu ukazují, že město u Galilejského jezera bylo založeno v období Hasmonejců, mezi 2. a 1. stoletím př. n. l.; jako Tarichea už bylo městem, když je kolem roku 52 př. n. l. dobyl Cassius."
      sv: "Utgrävningarna i Migdal visar att staden vid Galileiska sjön grundades under den hasmoneiska tiden, mellan 100-talet och första århundradet f.Kr.; som Tarichea var den redan en stad när Cassius intog den omkring 52 f.Kr."
      nb: "Utgravinger i Migdal viser at byen ved Galileasjøen ble grunnlagt i den hasmoneiske tid, mellom 100-tallet og det første århundre f.Kr.; som Tarikeai var den allerede en by da Cassius inntok den omkring 52 f.Kr."
      tl: "Ipinakikita ng mga paghuhukay sa Migdal na ang bayan sa Dagat ng Galilea ay itinatag sa panahon ng mga Hasmoneo, sa pagitan ng ika-2 at ika-1 siglo BK; bilang Taricheae ay isa na itong bayan nang kunin ito ni Cassio noong mga 52 BK."
      da: "Udgravninger ved Migdal viser, at byen ved Genesaret Sø blev grundlagt i den hasmonæiske periode, mellem 2. og 1. århundrede f.Kr.; som Taricheae var den allerede en by, da Cassius indtog den omkring 52 f.Kr."
      sr: "Ископавања у Мигдалу показују да је град на Галилејском мору основан у хасмонејско доба, између 2. и 1. века п. н. е.; као Тарихеја већ је био град кад га је Касије заузео око 52. п. н. е."
    sources:
      - "D. Avshalom-Gorni, 'Migdal', Hadashot Arkheologiyot 121 (2009)"
      - "Josephus, Antiquities 14.120; Jewish War 1.180"
  - id: a6d9af3
    en: Haran
    until: "AD 1271"
    note:
      en: "Harran lived on through the Roman and Islamic periods; in 1271 the Mongol Ilkhanids deported its people to Mardin and Mosul and the city was left in ruins, with only a village by the castle afterwards."
      ru: "Харран пережил римскую и исламскую эпохи; в 1271 г. монголы-Хулагуиды выселили его жителей в Мардин и Мосул, и город остался в развалинах — позже у крепости была лишь деревня."
      uk: "Харан жив і в римську, й ісламську добу; у 1271 р. монгольські ільхани виселили його жителів до Мардіна й Мосула, і місто лишилося в руїнах, а потім біля замку було лише село."
      es: "Harán sobrevivió durante los períodos romano e islámico; en 1271 los ilcanes mongoles deportaron a su gente a Mardin y Mosul y la ciudad quedó en ruinas, con solo una aldea junto al castillo después."
      pt: "Harã sobreviveu nos períodos romano e islâmico; em 1271 os ilcânidas mongóis deportaram o seu povo para Mardin e Mossul, e a cidade foi deixada em ruínas, com apenas uma aldeia junto ao castelo depois disso."
      de: "Harran bestand durch die römische und die islamische Zeit fort; 1271 deportierten die mongolischen Ilchane seine Bewohner nach Mardin und Mossul, und die Stadt blieb in Trümmern, danach gab es nur noch ein Dorf bei der Burg."
      fr: "Haran subsista pendant les périodes romaine et islamique ; en 1271, les Ilkhans mongols déportèrent sa population à Mardin et à Mossoul, et la ville fut laissée en ruines, avec seulement un village près du château par la suite."
      pl: "Charan przetrwał okres rzymski i islamski; w 1271 roku mongolscy Ilchanowie wysiedlili jego mieszkańców do Mardin i Mosulu, a miasto pozostawiono w ruinie, i potem stała przy zamku tylko wieś."
      it: "Carran sopravvisse attraverso i periodi romano e islamico; nel 1271 gli Ilcanidi mongoli deportarono la sua popolazione a Mardin e a Mosul e la città fu lasciata in rovina, con solo un villaggio accanto al castello in seguito."
      nl: "Haran bleef bestaan door de Romeinse en islamitische tijd; in 1271 deporteerden de Mongoolse Il-khans zijn bevolking naar Mardin en Mosul en werd de stad in puin achtergelaten, met daarna alleen een dorp bij het kasteel."
      cs: "Cháran žil dál v římském i islámském období; roku 1271 mongolští Ílchánové odvlekli jeho obyvatele do Mardinu a Mosulu a město zůstalo v troskách, poté jen s vesnicí u hradu."
      sv: "Harran levde vidare genom romersk och islamisk tid; 1271 deporterade de mongoliska ilkhanerna dess folk till Mardin och Mosul, och staden lämnades i ruiner med endast en by vid borgen därefter."
      nb: "Harran levde videre gjennom den romerske og islamske tid; i 1271 deporterte de mongolske ilkhanene folket til Mardin og Mosul, og byen ble liggende i ruiner, med bare en landsby ved borgen etter dette."
      tl: "Nagpatuloy ang Harran sa panahon ng mga Romano at ng Islam; noong 1271 ay inilipat ng mga Ilkhan na Mongol ang mga tao nito sa Mardin at Mosul, at naiwang wasak ang lungsod, na may nayon na lamang sa tabi ng kastilyo pagkaraan."
      da: "Karan levede videre gennem den romerske og islamiske periode; i 1271 deporterede de mongolske ilkhaner dens folk til Mardin og Mosul, og byen blev efterladt i ruiner, derefter med kun en landsby ved borgen."
      sr: "Харан је опстао кроз римски и исламски период; 1271. монголски Илханиди преселили су његов народ у Мардин и Мосул, и град је остављен у рушевинама, а потом је крај замка било само село."
    sources:
      - "D. S. Rice, 'Medieval Harran: Studies on its Topography and Monuments, I', Anatolian Studies 2 (1952)"
  - id: a874951
    en: Asshur
    # Gap removed: the city was sacked in 614 BC but not emptied (Achaemenid-period
    # occupation, Cyrus Cylinder); the Parthian town is the last life. The sack is by
    # Ardashir I, so it cannot be later than his death in 242 (Wikipedia's "c. 257" clashes).
    until: "c. AD 240"
    note:
      en: "Sacked by the Medes in 614 BC, Assur lived on as a small town and flourished again under the Parthians; it was destroyed by the Sasanians about AD 240, and only a scattered village remained."
      ru: "Разграбленный мидянами в 614 г. до н. э., Ашшур продолжил жить небольшим городом и вновь расцвёл при парфянах; около 240 г. н. э. его разрушили Сасаниды, и от него осталась лишь редкая деревня."
      uk: "Здобутий мідянами в 614 р. до н. е., Ашшур залишився малим містом і знову розквітнув за парфян; його зруйнували Сасаніди близько 240 р. н. е., і лишилося лише розсіяне село."
      es: "Saqueada por los medos en 614 a. C., Assur sobrevivió como una pequeña ciudad y volvió a florecer bajo los partos; fue destruida por los sasánidas hacia 240 d. C., y solo quedó una aldea dispersa."
      pt: "Saqueada pelos medos em 614 a.C., Assur sobreviveu como pequena cidade e floresceu de novo sob os partas; foi destruída pelos sassânidas por volta de 240 d.C., e restou apenas uma aldeia dispersa."
      de: "Von den Medern 614 v. Chr. geplündert, bestand Assur als kleine Stadt fort und blühte unter den Parthern wieder auf; um 240 n. Chr. wurde es von den Sassaniden zerstört, und nur ein verstreutes Dorf blieb."
      fr: "Pillée par les Mèdes en 614 av. J.-C., Assour subsista comme petite ville et refleurit sous les Parthes ; elle fut détruite par les Sassanides vers 240 ap. J.-C., et il n’en resta qu’un village dispersé."
      pl: "Złupiony przez Medów w 614 p.n.e., Aszur przetrwał jako małe miasto i na nowo rozkwitł za Partów; zniszczyli go Sasanidzi około 240 n.e., i pozostała tylko rozproszona wieś."
      it: "Saccheggiata dai Medi nel 614 a.C., Assur sopravvisse come piccola città e fiorì di nuovo sotto i Parti; fu distrutta dai Sasanidi intorno al 240 d.C., e rimase soltanto un villaggio sparso."
      nl: "Door de Meden geplunderd in 614 v.Chr., bleef Assur bestaan als een kleine stad en bloeide opnieuw onder de Parthen; het werd omstreeks 240 n.Chr. door de Sassaniden verwoest, en alleen een verspreid dorp bleef over."
      cs: "Vypleněn Médy roku 614 př. n. l., Aššur žil dál jako malé město a za Parthů znovu vzkvétal; Sásánovci jej zničili kolem roku 240 n. l. a zůstala jen roztroušená vesnice."
      sv: "Assur plundrades av mederna 614 f.Kr. men levde kvar som en liten stad och blomstrade på nytt under parterna; den förstördes av sasaniderna omkring 240 e.Kr., och endast en spridd by återstod."
      nb: "Plyndret av mederne i 614 f.Kr. levde Assur videre som en liten by og blomstret igjen under partherne; den ble ødelagt av sasanidene omkring 240 e.Kr., og bare en spredt landsby ble igjen."
      tl: "Matapos ilusob ng mga Medo noong 614 BK, nagpatuloy ang Assur bilang maliit na bayan at muling yumabong sa ilalim ng mga Parto; winasak ito ng mga Sasanida noong mga 240 AD, at isang nakakalat na nayon na lamang ang natira."
      da: "Plyndret af mederne i 614 f.Kr. levede Assur videre som en lille by og blomstrede igen under parterne; den blev ødelagt af sasaniderne omkring 240 e.Kr., og kun en spredt landsby blev tilbage."
      sr: "Опљачкан од Миђана 614. п. н. е., Ашур је опстао као мали град и поново процветао под Партима; Сасаниди су га разорили око 240. н. е., и остало је само расуто село."
    sources:
      - "Babylonian Chronicle ABC 3 (Fall of Nineveh Chronicle)"
      - "W. Andrae, Das wiedererstandene Assur (1938)"
  - id: a5db1a6
    en: Erech
    until: "c. AD 700"
    note:
      en: "Uruk lived on through the Seleucid and Parthian periods and was mostly empty by AD 300; a small community, probably Mandaean, stayed on until it was finally abandoned around the time of the Islamic conquest."
      ru: "Урук пережил селевкидскую и парфянскую эпохи и к 300 г. н. э. почти опустел; небольшая община, вероятно мандейская, оставалась там до окончательного запустения около времени арабского завоевания."
      uk: "Урук жив і в селевкідську, й парфянську добу, а до 300 р. н. е. здебільшого спорожнів; невелика громада, імовірно мандейська, залишалася, доки місце було остаточно покинуте близько часу ісламського завоювання."
      es: "Uruk sobrevivió durante los períodos seléucida y parto y estaba en su mayor parte vacía hacia 300 d. C.; una pequeña comunidad, probablemente mandea, permaneció hasta que fue abandonada definitivamente hacia la época de la conquista islámica."
      pt: "Uruk sobreviveu nos períodos selêucida e parta e estava em grande parte vazia por volta de 300 d.C.; uma pequena comunidade, provavelmente mandeia, permaneceu até ser finalmente abandonada na época da conquista islâmica."
      de: "Uruk bestand durch die seleukidische und die parthische Zeit fort und war um 300 n. Chr. größtenteils leer; eine kleine Gemeinde, wahrscheinlich mandäisch, blieb, bis es um die Zeit der islamischen Eroberung endgültig aufgegeben wurde."
      fr: "Uruk subsista pendant les périodes séleucide et parthe et était en grande partie vide vers 300 ap. J.-C. ; une petite communauté, probablement mandéenne, y resta jusqu’à son abandon définitif vers l’époque de la conquête islamique."
      pl: "Uruk przetrwał okres seleucydzki i partyjski, a około 300 n.e. był w większości pusty; niewielka społeczność, prawdopodobnie mandejska, pozostała, aż ostatecznie opuszczono go mniej więcej w czasie podboju islamskiego."
      it: "Uruk sopravvisse nei periodi seleucide e partico e verso il 300 d.C. era per lo più vuota; una piccola comunità, probabilmente mandea, vi rimase finché non fu definitivamente abbandonata all’epoca della conquista islamica."
      nl: "Uruk bleef bestaan door de Seleucidische en Parthische tijd en was omstreeks 300 n.Chr. grotendeels leeg; een kleine gemeenschap, waarschijnlijk Mandees, bleef er tot ze rond de tijd van de islamitische verovering definitief werd verlaten."
      cs: "Erek žil dál za seleukovského i parthského období a kolem roku 300 n. l. byl většinou prázdný; malá obec, pravděpodobně mandejská, zůstala, dokud nebyl kolem doby islámského dobytí nakonec opuštěn."
      sv: "Uruk levde vidare under seleukidisk och partisk tid och var till stor del tomt år 300 e.Kr.; en liten gemenskap, sannolikt mandeisk, stannade kvar tills platsen slutligen övergavs omkring tiden för den islamiska erövringen."
      nb: "Uruk levde videre gjennom den seleukidiske og partiske tid og var for det meste tom i 300 e.Kr.; et lite samfunn, trolig mandeisk, ble boende til stedet endelig ble forlatt omkring tiden for den islamske erobringen."
      tl: "Nagpatuloy ang Uruk sa panahon ng mga Seleucida at ng mga Parto at halos wala nang tao noong 300 AD; isang maliit na pamayanan, marahil ng mga Mandeo, ang nanatili hanggang sa tuluyan itong iwan nang mga panahon ng pananakop ng Islam."
      da: "Uruk levede videre gennem den seleukidiske og parthiske periode og var for det meste tom omkring 300 e.Kr.; et lille samfund, sandsynligvis mandæisk, blev boende, indtil stedet endelig blev forladt omkring tiden for den islamiske erobring."
      sr: "Урук је опстао кроз селеукидски и партски период и око 300. н. е. био је већином празан; мала заједница, вероватно мандејска, остала је док коначно није напуштен у време исламског освајања."
    sources:
      - "Ausgrabungen in Uruk-Warka, Endberichte (German Archaeological Institute)"
  - id: aa01373
    en: Ur
    until: "c. 500 BC"
    note:
      en: "Ur was restored by Nabonidus but declined after the Persian conquest and was no longer inhabited by the early 5th century BC, probably as the Euphrates shifted its course."
      ru: "Ур восстановлен Набонидом, но после персидского завоевания пришёл в упадок и к началу V в. до н. э. опустел — вероятно, из-за того, что Евфрат сменил русло."
      uk: "Ур було відновлено Набонідом, але після перського завоювання він занепав і на початку V ст. до н. е. вже не був заселений, імовірно, через зміну русла Євфрату."
      es: "Ur fue restaurada por Nabónido, pero decayó tras la conquista persa y ya no estaba habitada a principios del siglo V a. C., probablemente porque el Éufrates cambió su curso."
      pt: "Ur foi restaurada por Nabonido, mas declinou após a conquista persa e já não era habitada no início do século V a.C., provavelmente porque o Eufrates mudou de curso."
      de: "Ur wurde von Nabonid wiederhergestellt, ging aber nach der persischen Eroberung zurück und war seit dem frühen 5. Jahrhundert v. Chr. nicht mehr bewohnt, wahrscheinlich weil der Euphrat seinen Lauf verlegte."
      fr: "Ur fut restaurée par Nabonide mais déclina après la conquête perse et n’était plus habitée au début du Ve siècle av. J.-C., probablement parce que l’Euphrate avait changé de cours."
      pl: "Ur został odnowiony przez Nabonida, lecz podupadł po perskim podboju i na początku V w. p.n.e. nie był już zamieszkany, prawdopodobnie wskutek zmiany biegu Eufratu."
      it: "Ur fu restaurata da Nabonedo ma decadde dopo la conquista persiana e all’inizio del V secolo a.C. non era più abitata, probabilmente perché l’Eufrate aveva cambiato corso."
      nl: "Ur werd hersteld door Nabonidus maar ging achteruit na de Perzische verovering en was in het begin van de 5e eeuw v.Chr. niet langer bewoond, waarschijnlijk doordat de Eufraat van loop veranderde."
      cs: "Ur byl obnoven Nabonidem, ale po perském dobytí upadal a na počátku 5. století př. n. l. už nebyl obydlen, pravděpodobně proto, že Eufrat změnil tok."
      sv: "Ur återställdes av Nabonid men förföll efter den persiska erövringen och var inte längre bebott i början av 400-talet f.Kr., sannolikt när Eufrat ändrade lopp."
      nb: "Ur ble gjenreist av Nabonid, men gikk tilbake etter den persiske erobringen og var ikke lenger bebodd i begynnelsen av 400-tallet f.Kr., trolig fordi Eufrat skiftet løp."
      tl: "Ibinalik ni Nabonido ang Ur, ngunit humina ito pagkatapos ng pananakop ng Persia at wala nang naninirahan dito sa simula ng ika-5 siglo BK, marahil dahil sa paglipat ng daloy ng Eufrates."
      da: "Ur blev genoprettet af Nabonid, men gik tilbage efter den persiske erobring og var ikke længere beboet i begyndelsen af 5. århundrede f.Kr., sandsynligvis fordi Eufrat skiftede leje."
      sr: "Ур је обновио Набонид, али је опадао после персијског освајања и од почетка 5. века п. н. е. више није био насељен, вероватно јер је Еуфрат променио ток."
    sources:
      - "C. L. Woolley, Ur Excavations IX: The Neo-Babylonian and Persian Periods (1962)"
  - id: a4c6f72
    en: Eridu
    until: "c. 600 BC"
    note:
      en: "Eridu dwindled after the Old Babylonian period; Nebuchadnezzar II still built there, but the site was abandoned soon after."
      ru: "Эриду пришёл в упадок после старовавилонского периода; Навуходоносор II ещё строил там, но вскоре место было оставлено."
      uk: "Еріду занепав після старовавилонської доби; Навуходоносор II ще будував там, але місце невдовзі покинули."
      es: "Eridu decayó tras el período paleobabilónico; Nabucodonosor II aún construyó allí, pero el lugar fue abandonado poco después."
      pt: "Eridu definhou após o período paleobabilônico; Nabucodonosor II ainda construiu ali, mas o sítio foi abandonado pouco depois."
      de: "Eridu schwand nach der altbabylonischen Zeit dahin; Nebukadnezar II. baute dort noch, aber der Ort wurde bald danach aufgegeben."
      fr: "Éridou dépérit après la période paléo-babylonienne ; Nebucadnetsar II y bâtit encore, mais le site fut abandonné peu après."
      pl: "Eridu podupadło po okresie starobabilońskim; Nabuchodonozor II jeszcze tu budował, lecz miejsce wkrótce potem opuszczono."
      it: "Eridu declinò dopo il periodo paleobabilonese; Nabucodonosor II vi costruì ancora, ma il sito fu abbandonato subito dopo."
      nl: "Eridu kromp na de Oud-Babylonische tijd; Nebukadnessar II bouwde er nog, maar de plaats werd kort daarna verlaten."
      cs: "Eridu po staré babylónské době ubývalo; Nebukadnesar II. tam ještě stavěl, ale místo bylo brzy poté opuštěno."
      sv: "Eridu avtog efter den gammalbabyloniska tiden; Nebukadnessar II byggde ännu där, men platsen övergavs strax därefter."
      nb: "Eridu skrumpet inn etter den gammelbabylonske tid; Nebukadnesar II bygde fortsatt der, men stedet ble forlatt like etter."
      tl: "Humina ang Eridu pagkatapos ng panahon ng Lumang Babilonia; nagtayo pa rin doon si Nabucodonosor II, ngunit iniwan ang pook di nagtagal pagkaraan."
      da: "Eridu svandt ind efter den gammelbabylonske periode; Nebukadnezar 2. byggede stadig der, men stedet blev forladt kort efter."
      sr: "Ериду је опадао после старовавилонског периода; Навуходоносор II ту је још градио, али је место убрзо потом напуштено."
    sources:
      - "F. Safar, M. A. Mustafa and S. Lloyd, Eridu (1981)"
  - id: a8ec269
    en: Memphis
    from: "c. 3100 BC"
    note:
      en: "Tradition credits Menes, the first king of united Egypt, with founding the city; the year is conventional."
      ru: "Предание приписывает основание города Менесу, первому царю объединённого Египта; год условный."
      uk: "Переказ приписує заснування міста Менесові, першому царю об’єднаного Єгипту; цей рік умовний."
      es: "La tradición atribuye a Menes, el primer rey del Egipto unificado, la fundación de la ciudad; el año es convencional."
      pt: "A tradição atribui a fundação da cidade a Menés, o primeiro rei do Egito unificado; o ano é convencional."
      de: "Der Überlieferung nach gründete Menes, der erste König des vereinten Ägypten, die Stadt; das Jahr ist konventionell."
      fr: "La tradition attribue la fondation de la ville à Ménès, premier roi de l’Égypte unifiée ; l’année est conventionnelle."
      pl: "Tradycja przypisuje założenie miasta Menesowi, pierwszemu królowi zjednoczonego Egiptu; rok jest umowny."
      it: "La tradizione attribuisce a Menes, il primo re dell’Egitto unito, la fondazione della città; l’anno è convenzionale."
      nl: "Volgens de overlevering stichtte Menes, de eerste koning van het verenigde Egypte, de stad; het jaar is conventioneel."
      cs: "Tradice připisuje založení města Menovi, prvnímu králi sjednoceného Egypta; rok je smluvní."
      sv: "Traditionen tillskriver Menes, det förenade Egyptens förste kung, grundandet av staden; året är konventionellt."
      nb: "Tradisjonen tilskriver Menes, det forente Egypts første konge, grunnleggelsen av byen; året er konvensjonelt."
      tl: "Ayon sa tradisyon, si Menes, ang unang hari ng nagkaisang Egipto, ang nagtatag ng lungsod; kumbensiyonal ang taon."
      da: "Traditionen tilskriver Menes, det forenede Egyptens første konge, grundlæggelsen af byen; årstallet er konventionelt."
      sr: "Предање приписује Менесу, првом краљу уједињеног Египта, оснивање града; година је условна."
    sources:
      - "Herodotus 2.99"
  - id: adb008c
    en: Tahpanhes
    from: "c. 664 BC"
    note:
      en: "Daphnae (Tell Defenneh) was a frontier fortress founded under Psamtik I to guard Egypt's eastern border against the Arabians and Assyrians."
      ru: "Дафны (Телль-Дефенне) — пограничная крепость, основанная при Псамметихе I для защиты восточной границы Египта от арабов и ассирийцев."
      uk: "Дафні (Тель-Дефенна) була прикордонною фортецею, заснованою за Псамметіха I для охорони східного кордону Єгипту від аравійців та ассирійців."
      es: "Dafne (Tell Defenneh) fue una fortaleza fronteriza fundada bajo Psamético I para proteger la frontera oriental de Egipto contra los árabes y los asirios."
      pt: "Dafne (Tell Defenneh) era uma fortaleza de fronteira fundada sob Psamético I para guardar a fronteira oriental do Egito contra os árabes e os assírios."
      de: "Daphnae (Tell Defenne) war eine Grenzfestung, die unter Psammetich I. gegründet wurde, um Ägyptens Ostgrenze gegen Araber und Assyrer zu schützen."
      fr: "Daphné (Tell Defenneh) était une forteresse frontière fondée sous Psammétique Ier pour garder la frontière orientale de l’Égypte contre les Arabes et les Assyriens."
      pl: "Dafne (Tell Defenneh) była pograniczną twierdzą założoną za Psametyka I dla ochrony wschodniej granicy Egiptu przed Arabami i Asyryjczykami."
      it: "Dafne (Tell Defenneh) era una fortezza di frontiera fondata sotto Psammetico I per proteggere il confine orientale dell’Egitto dagli Arabi e dagli Assiri."
      nl: "Daphnae (Tell Defenneh) was een grensvesting, gesticht onder Psammetichus I om de oostgrens van Egypte te beschermen tegen de Arabieren en Assyriërs."
      cs: "Daphnai (Tell Defenneh) byla pohraniční pevnost založená za Psammética I. na ochranu východní hranice Egypta proti Arabům a Asyřanům."
      sv: "Daphnai (Tell Defenneh) var en gränsfästning som grundades under Psamtik I för att skydda Egyptens östra gräns mot araber och assyrier."
      nb: "Dafne (Tell Defenneh) var en grensefestning grunnlagt under Psammetik I for å vokte Egypts østgrense mot araberne og assyrerne."
      tl: "Ang Daphnae (Tell Defenneh) ay isang kuta sa hangganan na itinatag sa ilalim ni Psamtik I upang bantayan ang silangang hangganan ng Egipto laban sa mga Arabe at mga Asirio."
      da: "Daphnae (Tell Defenneh) var en grænsefæstning grundlagt under Psamtik 1. for at vogte Egyptens østgrænse mod araberne og assyrerne."
      sr: "Дафне (Тел Дефене) била је граничарска тврђава основана под Псамтиком I да чува источну границу Египта од Арабљана и Асираца."
    sources:
      - "Herodotus 2.30"
      - "W. M. F. Petrie, Tanis II: Nebesheh and Defenneh (1888)"
      - "F. Leclère and A. J. Spencer, Tell Dafana Reconsidered: The Archaeology of an Egyptian Frontier Town (British Museum, 2014)"
  - id: aa56bd1
    en: Carthage
    # `until` removed: Arab-period occupation of the town after 698 is attested archaeologically.
    from: "c. 814 BC"
    gap:
      from: "146 BC"
      until: "45 BC"
    note:
      en: "Founded by Tyrians, traditionally in 814 BC; razed by Scipio Aemilianus in 146 BC and refounded as a Roman colony by Julius Caesar, settled under Augustus. Taken by the Arabs in 698, it shrank to a small town beside the new Tunis."
      ru: "Основан тирийцами, по преданию в 814 г. до н. э.; разрушен Сципионом Эмилианом в 146 г. до н. э. и заново основан как римская колония Юлием Цезарем, а заселён при Августе. Взятый арабами в 698 г., он сжался до небольшого городка рядом с новым Тунисом."
      uk: "Заснований тирянами, за переказом, у 814 р. до н. е.; зруйнований Сципіоном Емілієм у 146 р. до н. е. й заново заснований як римська колонія Юлієм Цезарем, заселений за Августа. Здобутий арабами 698 р., він зменшився до невеликого міста поряд із новим Тунісом."
      es: "Fundada por tirios, tradicionalmente en 814 a. C.; arrasada por Escipión Emiliano en 146 a. C. y refundada como colonia romana por Julio César, poblada bajo Augusto. Tomada por los árabes en 698, quedó reducida a una pequeña ciudad junto a la nueva Túnez."
      pt: "Fundada por tírios, tradicionalmente em 814 a.C.; arrasada por Cipião Emiliano em 146 a.C. e refundada como colônia romana por Júlio César, povoada sob Augusto. Tomada pelos árabes em 698, reduziu-se a uma pequena cidade ao lado da nova Túnis."
      de: "Von Tyrern gegründet, der Überlieferung nach 814 v. Chr.; 146 v. Chr. von Scipio Aemilianus dem Erdboden gleichgemacht und von Julius Caesar als römische Kolonie neu gegründet, unter Augustus besiedelt. 698 von den Arabern genommen, schrumpfte es zu einer kleinen Stadt neben dem neuen Tunis."
      fr: "Fondée par des Tyriens, traditionnellement en 814 av. J.-C. ; rasée par Scipion Émilien en 146 av. J.-C. et refondée comme colonie romaine par Jules César, peuplée sous Auguste. Prise par les Arabes en 698, elle se réduisit à une petite ville à côté de la nouvelle Tunis."
      pl: "Założona przez Tyryjczyków, tradycyjnie w 814 p.n.e.; zrównana z ziemią przez Scypiona Emiliana w 146 p.n.e. i na nowo założona jako kolonia rzymska przez Juliusza Cezara, zasiedlona za Augusta. Zdobyta przez Arabów w 698 roku, skurczyła się do małego miasteczka obok nowego Tunisu."
      it: "Fondata da coloni di Tiro, tradizionalmente nell’814 a.C.; rasa al suolo da Scipione Emiliano nel 146 a.C. e rifondata come colonia romana da Giulio Cesare, popolata sotto Augusto. Presa dagli Arabi nel 698, si ridusse a una piccola città accanto alla nuova Tunisi."
      nl: "Gesticht door Tyriërs, traditioneel in 814 v.Chr.; door Scipio Aemilianus in 146 v.Chr. met de grond gelijk gemaakt en door Julius Caesar opnieuw gesticht als Romeinse kolonie, bevolkt onder Augustus. In 698 door de Arabieren ingenomen, kromp ze tot een stadje naast het nieuwe Tunis."
      cs: "Založeno Týřany, tradičně roku 814 př. n. l.; zbořeno Scipionem Aemilianem roku 146 př. n. l. a znovu založeno Juliem Caesarem jako římská kolonie, osídlená za Augusta. Roku 698 dobyto Araby, zmenšilo se na malé město vedle nového Tunisu."
      sv: "Grundades av tyrier, traditionellt 814 f.Kr.; jämnades med marken av Scipio Aemilianus 146 f.Kr. och grundades på nytt som romersk koloni av Julius Caesar, bosatt under Augustus. Intogs av araberna 698 och krympte till en liten stad intill det nya Tunis."
      nb: "Grunnlagt av tyrerne, tradisjonelt i 814 f.Kr.; jevnet med jorden av Scipio Aemilianus i 146 f.Kr. og gjengrunnlagt som en romersk koloni av Julius Cæsar, bosatt under Augustus. Inntatt av araberne i 698 og skrumpet inn til en liten by ved siden av det nye Tunis."
      tl: "Itinatag ng mga taga-Tiro, ayon sa tradisyon noong 814 BK; winasak ni Scipio Aemilianus noong 146 BK at muling itinatag bilang kolonyang Romano ni Julio Cesar, at pinamayanan sa ilalim ni Augusto. Nakuha ng mga Arabe noong 698, lumiit ito at naging maliit na bayan sa tabi ng bagong Tunis."
      da: "Grundlagt af tyrere, traditionelt i 814 f.Kr.; jævnet med jorden af Scipio Aemilianus i 146 f.Kr. og genanlagt som romersk koloni af Julius Cæsar, bosat under Augustus. Indtaget af araberne i 698 skrumpede den ind til en lille by ved siden af det nye Tunis."
      sr: "Основали су га Тирци, по предању 814. п. н. е.; сравнио га је Сципион Емилијан 146. п. н. е., а као римску колонију поново га је основао Јулије Цезар и насељен је под Августом. Арапи су га освојили 698, и он се смањио на мали град поред новог Туниса."
    sources:
      - "Timaeus in Dionysius of Halicarnassus, Roman Antiquities 1.74.1"
      - "Appian, Punic Wars 127-136"
  - id: a6c704a
    en: Antioch
    from: "c. 280 BC"
    note:
      en: "Pisidian Antioch was founded by a Seleucid king, most likely Antiochus I, with settlers from Magnesia on the Maeander; Augustus made it a Roman colony."
      ru: "Антиохия Писидийская основана селевкидским царём, скорее всего Антиохом I, с поселенцами из Магнесии на Меандре; Август сделал её римской колонией."
      uk: "Антіохію Пісідійську заснував селевкідський цар, найімовірніше Антіох I, з поселенцями з Магнесії на Меандрі; Август зробив її римською колонією."
      es: "Antioquía de Pisidia fue fundada por un rey seléucida, muy probablemente Antíoco I, con colonos de Magnesia del Meandro; Augusto la hizo colonia romana."
      pt: "Antioquia da Pisídia foi fundada por um rei selêucida, muito provavelmente Antíoco I, com colonos de Magnésia do Meandro; Augusto a tornou colônia romana."
      de: "Das pisidische Antiochia wurde von einem seleukidischen König, höchstwahrscheinlich Antiochos I., mit Siedlern aus Magnesia am Mäander gegründet; Augustus machte es zur römischen Kolonie."
      fr: "Antioche de Pisidie fut fondée par un roi séleucide, très probablement Antiochus Ier, avec des colons de Magnésie du Méandre ; Auguste en fit une colonie romaine."
      pl: "Antiochia Pizydyjska została założona przez seleucydzkiego króla, najprawdopodobniej Antiocha I, z osadnikami z Magnezji nad Meandrem; August uczynił z niej kolonię rzymską."
      it: "Antiochia di Pisidia fu fondata da un re seleucide, molto probabilmente Antioco I, con coloni di Magnesia sul Meandro; Augusto ne fece una colonia romana."
      nl: "Pisidisch Antiochië werd gesticht door een Seleucidische koning, waarschijnlijk Antiochus I, met kolonisten uit Magnesia aan de Maiandros; Augustus maakte er een Romeinse kolonie van."
      cs: "Pisidská Antiochie byla založena některým seleukovským králem, nejspíš Antiochem I., s osadníky z Magnésie na Maiandru; Augustus z ní učinil římskou kolonii."
      sv: "Pisidiska Antiochia grundades av en seleukidisk kung, troligen Antiochos I, med nybyggare från Magnesia vid Maiandros; Augustus gjorde den till romersk koloni."
      nb: "Antiokia i Pisidia ble grunnlagt av en seleukidisk konge, mest sannsynlig Antiokos I, med nybyggere fra Magnesia ved Maiandros; Augustus gjorde den til en romersk koloni."
      tl: "Ang Antioquia ng Pisidia ay itinatag ng isang haring Seleucida, marahil si Antioco I, kasama ang mga naninirahang mula sa Magnesia sa Maeander; ginawa itong kolonyang Romano ni Augusto."
      da: "Pisidisk Antiokia blev grundlagt af en seleukidisk konge, sandsynligvis Antiochos 1., med bosættere fra Magnesia ved Meander; Augustus gjorde den til en romersk koloni."
      sr: "Антиохију Писидијску основао је неки селеукидски цар, највероватније Антиох I, са досељеницима из Магнезије на Меандру; Август ју је учинио римском колонијом."
    sources:
      - "Strabo, Geography 12.8.14"
  - id: a4488e9
    en: Puteoli
    from: "c. 531 BC"
    note:
      en: "Founded as Dicaearchia, a harbour of Cumae settled by exiles from Samos (Eusebius dates them a few years later, 521 BC); it became the Roman colony of Puteoli in 194 BC."
      ru: "Основан как Дикеархия, гавань Кум, заселённая изгнанниками с Самоса (Евсевий относит их приход к 521 г. до н. э.); в 194 г. до н. э. стал римской колонией Путеолы."
      uk: "Заснована як Дікеархія, гавань Кум, заселена вигнанцями з Самосу (Євсевій датує їх на кілька років пізніше, 521 р. до н. е.); у 194 р. до н. е. стала римською колонією Путеолі."
      es: "Fundada como Dicearquía, puerto de Cumas poblado por desterrados de Samos (Eusebio los fecha unos años más tarde, en 521 a. C.); se convirtió en la colonia romana de Puteoli en 194 a. C."
      pt: "Fundada como Dicearquia, um porto de Cumas povoado por exilados de Samos (Eusébio os data poucos anos depois, 521 a.C.); tornou-se a colônia romana de Putéoli em 194 a.C."
      de: "Als Dikaiarchia gegründet, ein Hafen von Cumae, besiedelt von Verbannten aus Samos (Eusebius datiert sie einige Jahre später, 521 v. Chr.); 194 v. Chr. wurde es zur römischen Kolonie Puteoli."
      fr: "Fondée sous le nom de Dicéarchie, port de Cumes peuplé d’exilés de Samos (Eusèbe les date de quelques années plus tard, 521 av. J.-C.) ; elle devint la colonie romaine de Pouzzoles en 194 av. J.-C."
      pl: "Założone jako Dikajarchia, port Kume zasiedlony przez wygnańców z Samos (Euzebiusz datuje ich o kilka lat później, na 521 p.n.e.); w 194 p.n.e. stało się rzymską kolonią Puteoli."
      it: "Fondata come Dicearchia, un porto di Cuma popolato da esuli di Samo (Eusebio li data alcuni anni più tardi, nel 521 a.C.); divenne la colonia romana di Pozzuoli nel 194 a.C."
      nl: "Gesticht als Dicaearchia, een haven van Cumae, bewoond door ballingen van Samos (Eusebius dateert hen enkele jaren later, 521 v.Chr.); in 194 v.Chr. werd het de Romeinse kolonie Puteoli."
      cs: "Založeno jako Dikaiarchia, přístav Kymé osídlený vyhnanci ze Samu (Eusebios je datuje o několik let později, 521 př. n. l.); roku 194 př. n. l. se stalo římskou kolonií Puteoli."
      sv: "Grundades som Dikaiarchia, en hamn för Cumae bosatt av landsflyktingar från Samos (Eusebios daterar dem några år senare, 521 f.Kr.); den blev den romerska kolonin Puteoli 194 f.Kr."
      nb: "Grunnlagt som Dikaiarkhia, en havn for Kyme, bosatt av landflyktige fra Samos (Eusebios setter dem noen år senere, 521 f.Kr.); den ble den romerske kolonien Puteoli i 194 f.Kr."
      tl: "Itinatag bilang Dicaearchia, isang daungan ng Cumae na pinamayanan ng mga tapon mula sa Samos (inilalagay ito ni Eusebio nang ilang taon pagkaraan, noong 521 BK); naging kolonyang Romano ito ng Puteoli noong 194 BK."
      da: "Grundlagt som Dikaiarkia, en havn for Cumae, bosat af landflygtige fra Samos (Eusebios dater dem nogle år senere, til 521 f.Kr.); den blev til den romerske koloni Puteoli i 194 f.Kr."
      sr: "Основан као Дикеархија, лука Киме коју су населили изгнаници са Самоса (Еусебије их датира неколико година касније, 521. п. н. е.); постао је римска колонија Поцуоли 194. п. н. е."
    sources:
      - "Stephanus of Byzantium, Ethnica, s.v. Potioloi"
      - "Eusebius, Chronicle (Jerome's version)"
      - "Strabo, Geography 5.4.6"
      - "Livy 34.45.1"
  - id: a63bb26
    en: Rhegium
    from: "c. 730 BC"
    note:
      en: "Founded by colonists from Chalcis, joined by Messenian refugees, on the Strait of Messina; the year is traditional (730 or 743 BC)."
      ru: "Основан колонистами из Халкиды, к которым присоединились беглецы-мессенцы, на Мессинском проливе; год традиционный (730 или 743 г. до н. э.)."
      uk: "Заснований колоністами з Халкіди, до яких приєдналися месенські втікачі, на Мессінській протоці; рік традиційний (730 або 743 р. до н. е.)."
      es: "Fundada por colonos de Calcis, a los que se unieron refugiados mesenios, en el estrecho de Mesina; el año es tradicional (730 o 743 a. C.)."
      pt: "Fundada por colonos de Cálcis, aos quais se juntaram refugiados messênios, no estreito de Messina; o ano é tradicional (730 ou 743 a.C.)."
      de: "Von Kolonisten aus Chalkis gegründet, zu denen messenische Flüchtlinge stießen, an der Straße von Messina; das Jahr ist überliefert (730 oder 743 v. Chr.)."
      fr: "Fondée par des colons de Chalcis, rejoints par des réfugiés messéniens, sur le détroit de Messine ; l’année est traditionnelle (730 ou 743 av. J.-C.)."
      pl: "Założone przez kolonistów z Chalkis, do których dołączyli uchodźcy z Mesenii, nad Cieśniną Mesyńską; rok jest tradycyjny (730 lub 743 p.n.e.)."
      it: "Fondata da coloni di Calcide, ai quali si unirono profughi messeni, sullo stretto di Messina; l’anno è tradizionale (730 o 743 a.C.)."
      nl: "Gesticht door kolonisten uit Chalcis, vergezeld door Messenische vluchtelingen, aan de Straat van Messina; het jaar is traditioneel (730 of 743 v.Chr.)."
      cs: "Založeno kolonisty z Chalkidy, k nimž se připojili messénští uprchlíci, na Messinském průlivu; rok je tradiční (730 nebo 743 př. n. l.)."
      sv: "Grundades av kolonister från Chalkis, förenade med messeniska flyktingar, vid Messinasundet; året är traditionellt (730 eller 743 f.Kr.)."
      nb: "Grunnlagt av kolonister fra Khalkis, sammen med messenske flyktninger, ved Messinastredet; året er tradisjonelt (730 eller 743 f.Kr.)."
      tl: "Itinatag ng mga kolonistang mula sa Chalcis, na sinamahan ng mga takas na Messenio, sa Kipot ng Messina; tradisyonal ang taon (730 o 743 BK)."
      da: "Grundlagt af kolonister fra Chalkis, hvortil kom messenske flygtninge, ved Messinastrædet; årstallet er traditionelt (730 eller 743 f.Kr.)."
      sr: "Основали су га колонисти из Халкиде, којима су се придружили месенски бегунци, на Месинском мореузу; година је традиционална (730. или 743. п. н. е.)."
    sources:
      - "Strabo, Geography 6.1.6"
  - id: afa863b
    en: Salamis
    until: "c. AD 650"
    note:
      en: "Rebuilt as Constantia after the earthquakes of the 4th century; abandoned after the Arab raids under Mu'awiya in the 7th century, its people moving to Famagusta."
      ru: "После землетрясений IV в. отстроен как Констанция; оставлен после арабских набегов при Муавии в VII в., жители переселились в Фамагусту."
      uk: "Відбудований як Констанція після землетрусів IV ст.; покинутий після арабських набігів за Муавії в VII ст., а його жителі переселилися до Фамагусти."
      es: "Reconstruida como Constancia tras los terremotos del siglo IV; abandonada tras las incursiones árabes de Muawiya en el siglo VII, sus habitantes se trasladaron a Famagusta."
      pt: "Reconstruída como Constância após os terremotos do século IV; abandonada depois das incursões árabes sob Muáuia no século VII, seu povo mudando-se para Famagusta."
      de: "Nach den Erdbeben des 4. Jahrhunderts als Konstantia wiederaufgebaut; nach den arabischen Überfällen unter Muawiya im 7. Jahrhundert aufgegeben, seine Bewohner zogen nach Famagusta."
      fr: "Rebâtie sous le nom de Constantia après les tremblements de terre du IVe siècle ; abandonnée après les raids arabes sous Moawiya au VIIe siècle, ses habitants gagnant Famagouste."
      pl: "Odbudowana jako Konstancja po trzęsieniach ziemi IV wieku; opuszczona po arabskich najazdach pod wodzą Muawiji w VII wieku, a jej mieszkańcy przenieśli się do Famagusty."
      it: "Ricostruita come Costanza (Constantia) dopo i terremoti del IV secolo; abbandonata dopo le incursioni arabe sotto Mu‘awiya nel VII secolo, la sua popolazione si trasferì a Famagosta."
      nl: "Herbouwd als Constantia na de aardbevingen van de 4e eeuw; verlaten na de Arabische overvallen onder Mu'awiya in de 7e eeuw, waarna de bevolking naar Famagusta trok."
      cs: "Znovu vystavěna jako Constantia po zemětřeseních 4. století; po arabských nájezdech za Muawíji v 7. století opuštěna, její obyvatelé se přesunuli do Famagusty."
      sv: "Återuppbyggdes som Constantia efter jordbävningarna på 300-talet; övergavs efter de arabiska räderna under Muawiya på 600-talet, då dess folk flyttade till Famagusta."
      nb: "Gjenoppbygd som Konstantia etter jordskjelvene på 300-tallet; forlatt etter de arabiske raidene under Mu'awiya på 600-tallet, da folket flyttet til Famagusta."
      tl: "Muling itinayo bilang Constantia pagkatapos ng mga lindol noong ika-4 na siglo; iniwan ito pagkatapos ng mga pagsalakay ng mga Arabe sa ilalim ni Mu'awiya noong ika-7 siglo, at lumipat ang mga tao nito sa Famagusta."
      da: "Genopbygget som Constantia efter jordskælvene i 4. århundrede; forladt efter arabernes plyndringstog under Mu'awiya i 7. århundrede, idet dens folk flyttede til Famagusta."
      sr: "Обновљен као Констанција после земљотреса 4. века; напуштен после арапских упада под Муавијом у 7. веку, а његови становници преселили су се у Фамагусту."
    sources:
      - "V. Karageorghis, Salamis in Cyprus: Homeric, Hellenistic and Roman (1969)"
  - id: a121d5e
    en: Forum of Appius
    from: "c. 312 BC"
    note:
      en: "A market town on the Via Appia, named after Appius Claudius Caecus, who built the road in 312 BC and is taken to have founded it."
      ru: "Торговое местечко на Аппиевой дороге, названное по Аппию Клавдию Цеку, который проложил её в 312 г. до н. э. и, как считается, основал его."
      uk: "Торговельне містечко на Аппієвій дорозі, назване на честь Аппія Клавдія Цека, який збудував дорогу в 312 р. до н. е. і вважається його засновником."
      es: "Ciudad de mercado de la Vía Apia, llamada así por Apio Claudio el Ciego, que construyó la calzada en 312 a. C. y a quien se considera su fundador."
      pt: "Cidade de mercado na Via Ápia, nomeada em honra de Ápio Cláudio Cego, que construiu a estrada em 312 a.C. e é tido como seu fundador."
      de: "Ein Marktflecken an der Via Appia, benannt nach Appius Claudius Caecus, der die Straße 312 v. Chr. baute und als ihr Gründer gilt."
      fr: "Bourg marchand sur la voie Appienne, nommé d’après Appius Claudius Caecus, qui construisit la route en 312 av. J.-C. et est tenu pour son fondateur."
      pl: "Miasteczko targowe przy Via Appia, nazwane od Appiusza Klaudiusza Caecusa, który zbudował drogę w 312 p.n.e. i jest uważany za jego założyciela."
      it: "Una cittadina di mercato sulla Via Appia, chiamata così da Appio Claudio Cieco, che costruì la strada nel 312 a.C. e a cui si attribuisce la fondazione."
      nl: "Een marktplaats aan de Via Appia, genoemd naar Appius Claudius Caecus, die de weg in 312 v.Chr. aanlegde en geacht wordt de plaats te hebben gesticht."
      cs: "Tržní městečko na Via Appia, pojmenované po Appiu Claudiu Caecovi, který silnici roku 312 př. n. l. vystavěl a jemuž se připisuje i jeho založení."
      sv: "En marknadsstad vid Via Appia, uppkallad efter Appius Claudius Caecus, som byggde vägen 312 f.Kr. och anses ha grundat den."
      nb: "En markedsby ved Via Appia, oppkalt etter Appius Claudius Caecus, som bygde veien i 312 f.Kr. og regnes for å ha grunnlagt den."
      tl: "Isang bayang pamilihan sa Via Appia, ipinangalan kay Appius Claudius Caecus, na nagtayo ng daan noong 312 BK at pinaniniwalaang nagtatag nito."
      da: "En markedsby ved Via Appia, opkaldt efter Appius Claudius Caecus, som byggede vejen i 312 f.Kr. og antages at have grundlagt den."
      sr: "Тржишно место на Апијевом путу, названо по Апију Клаудију Слепом, који је пут саградио 312. п. н. е. и за кога се сматра да га је основао."
    sources:
      - "Livy 9.29.6 (the building of the Via Appia)"
      - "Horace, Satires 1.5.3-6"
      - "Acts 28:15"
  # The cities of the plain, overthrown in Abraham's day (Gen 19:24-29; Deut 29:23). Their
  # date is the Abraham tour's conventional year, not a date: without an end they stood on
  # the map into the Roman age. Their sites are disputed (the map says so).
  - id: a0aa664
    en: Sodom
    until: "c. 1900 BC"
    note:
      en: "Overthrown with Gomorrah in Abraham's day (Gen 19:24-29). The year is the conventional one the map gives Abraham; the age of the patriarchs is disputed."
      ru: "Ниспровергнут вместе с Гоморрой во дни Авраама (Быт 19:24–29). Год условный, тот же, что у Авраама на карте; время патриархов спорно."
      uk: "Зруйнований разом з Гоморрою за днів Авраама (Бут 19:24-29). Рік — умовний, який карта дає Авраамові; вік патріархів є спірним."
      es: "Destruida junto con Gomorra en tiempos de Abraham (Gn 19:24-29). El año es el convencional que el mapa da a Abraham; la edad de los patriarcas es discutida."
      pt: "Destruída com Gomorra nos dias de Abraão (Gn 19:24-29). O ano é o convencional que o mapa dá a Abraão; a idade dos patriarcas é discutida."
      de: "Zusammen mit Gomorra in Abrahams Tagen umgestürzt (1. Mose 19,24–29). Das Jahr ist das konventionelle, das die Karte Abraham gibt; das Zeitalter der Erzväter ist umstritten."
      fr: "Détruite avec Gomorrhe au temps d’Abraham (Gn 19:24-29). L’année est celle que la carte attribue conventionnellement à Abraham ; l’époque des patriarches est débattue."
      pl: "Zburzona wraz z Gomorą za dni Abrahama (Rdz 19,24-29). Rok jest umownym rokiem, który mapa przypisuje Abrahamowi; czasy patriarchów są przedmiotem sporu."
      it: "Distrutta insieme a Gomorra ai giorni di Abramo (Gen 19,24-29). L’anno è quello convenzionale che la mappa assegna ad Abramo; l’epoca dei patriarchi è controversa."
      nl: "Samen met Gomorra verwoest in de dagen van Abraham (Gen. 19:24-29). Het jaar is het conventionele jaar dat de kaart aan Abraham geeft; de tijd van de aartsvaders is omstreden."
      cs: "Zničena spolu s Gomorou za dnů Abrahamových (Gn 19,24–29). Rok je smluvní rok, který mapa přisuzuje Abrahamovi; doba patriarchů je sporná."
      sv: "Omstörtades tillsammans med Gomorra på Abrahams tid (1 Mos 19:24–29). Året är det konventionella som kartan ger Abraham; patriarkernas tid är omstridd."
      nb: "Omstyrtet sammen med Gomorra i Abrahams dager (1 Mos 19,24-29). Året er det konvensjonelle som kartet gir Abraham; patriarkenes tid er omstridt."
      tl: "Winasak kasama ng Gomorra noong kapanahunan ni Abraham (Gen 19:24-29). Ang taon ay ang kumbensiyonal na ibinibigay ng mapa kay Abraham; pinagtatalunan ang panahon ng mga patriyarka."
      da: "Omstyrtet sammen med Gomorra i Abrahams dage (1 Mos 19,24-29). Årstallet er det konventionelle, som kortet giver Abraham; patriarkernes tidsalder er omstridt."
      sr: "Срушен са Гомором у Аврамово доба (Пост 19,24-29). Година је условна година коју мапа даје Авраму; доба патријараха је спорно."
    sources:
      - "Gen 19:24-29"
      - "Deut 29:23"
