  - id: a3fc47a
    en: Ekron
    until: "c. 604 BC"
    note:
      en: "The city at Tel Miqne burnt in Nebuchadnezzar II's campaign on the Philistine coast and was not rebuilt as a city."
      ru: "Город на Тель-Микне сгорел во время похода Навуходоносора II на филистимское побережье и больше не был отстроен как город."
      uk: "Місто на Тель-Мікне було спалене під час походу Навуходоносора II на філістимське узбережжя й не було відбудоване як місто."
      es: "La ciudad de Tel Miqne fue incendiada en la campaña de Nabucodonosor II en la costa filistea y no volvió a edificarse como ciudad."
