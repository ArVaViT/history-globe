# The site's own lines in the sources of the answered questions ("History Globe tour …",
# "Straight-line distance between the places' points …"), in every language but English and
# Russian (Russian: sources-ru.yaml). They describe what the site itself computed or wrote,
# so they are read in the page's language; the bibliography beside them stays as published.
# Each line has all fourteen languages; the content build stops on an own line with no
# translation here, and on a line here that nothing cites any more. Tour and question
# titles and place names are the ones the site uses in that language.
