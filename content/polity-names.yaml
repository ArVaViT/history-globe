# Russian names for the Cliopatria polities shown between 3500 BC and AD 500 in the focus
# region. Established Russian historiographic forms; Synodal forms where the Bible names
# the place (Вифиния, Галатия). Drafted 2026-09-28, NOT yet reviewed by a historian.
# The 36 polities of 3500-2000 BC and AD 100-500 added 2026-10-01; checked the same day
# against standard Russian forms and the Cliopatria shapes (not by a historian). Gothia is
# "Готы" like its neighbour "Гунны" ("Готия" reads as the Crimean one); the Early Dynastic
# Period is "Раннее царство" beside the Old and Middle Kingdoms; Alodia stays "Алва".
# The 337 polities of AD 500-1300 and of the widened region (Spain to Persia) added
# 2026-10-02 from Cliopatria's own Wikidata links and ru.wikipedia, checked twice (not by
# a historian); see the session notes for the 29 judgement calls.
